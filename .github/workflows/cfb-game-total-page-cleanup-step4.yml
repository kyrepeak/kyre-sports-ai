name: CFB Game Total page cleanup Step 4 Team Evidence UI

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v23.py"
      - "streamlit_memory_lazy_router_v168.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step4.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step4-team-evidence-ui.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step4.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v23.py"
      - "streamlit_memory_lazy_router_v168.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step4.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step4-team-evidence-ui.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step4.yml"

permissions:
  contents: read

jobs:
  verify-step4-team-evidence-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 4 presentation files
        run: |
          python -m py_compile cfb_game_total_clean_page_v23.py streamlit_memory_lazy_router_v168.py app.py
      - name: Run targeted Step 4 presentation proof
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_game_total_page_cleanup_step4.py
      - name: Prove Purdue UCLA Team Evidence cards render complete
        run: |
          python - <<'PY'
          import json
          import cfb_game_total_clean_page_v4 as stats_owner
          import cfb_game_total_clean_page_v9 as compact
          import cfb_game_total_clean_page_v10 as presentation
          import cfb_game_total_clean_page_v22 as data_page
          import cfb_game_total_clean_page_v23 as page
          import cfb_game_total_slate_v2 as slate_v2

          day = "2026-09-19"
          games, _ = compact.frozen_page.frozen_v2.frozen_v1.schedule.load_with_diagnostics(day)
          matches = [
              dict(g) for g in games
              if str(g.get("away_team") or "").strip().casefold() == "purdue"
              and str(g.get("home_team") or "").strip().casefold() == "ucla"
          ]
          assert len(matches) == 1, matches
          game = matches[0]
          result = slate_v2.analyze_game(game, day)
          display_game, away, home, _ = data_page._reconcile_display_bundle_v22(
              game, day, result["away"], result["home"]
          )
          away_stats = stats_owner._team_stats_state(away, display_game, "away")
          home_stats = stats_owner._team_stats_state(home, display_game, "home")

          identity = {
              "away": {
                  "team": "Purdue",
                  "conference": "Big Ten",
                  "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/2509.png",
              },
              "home": {
                  "team": "UCLA",
                  "conference": "Big Ten",
                  "logo": "https://a.espncdn.com/i/teamlogos/ncaa/500/26.png",
              },
          }
          html = page._team_evidence_html_v23(identity, away_stats, home_stats)

          assert 'data-team="Purdue" data-state="READY"' in html
          assert 'data-team="UCLA" data-state="READY"' in html
          assert html.count('data-state="PENDING"') == 0
          for key in ("ppg", "allowed", "point-diff", "recent-form"):
              assert html.count(f'data-stat="{key}"') == 2
          for state in (away_stats, home_stats):
              assert f"{float(state['ppg']):.1f}" in html
              assert f"{float(state['allowed_pg']):.1f}" in html
              assert f"{float(state['point_diff_pg']):.1f}" in html
              assert str(state["recent_form"]) in html

          print(json.dumps({
              "marker": "CFB_GAME_TOTAL_PAGE_CLEANUP_STEP4_TEAM_EVIDENCE_UI_GREEN",
              "event_id": game.get("espn_event_id") or game.get("event_id"),
              "away": away_stats,
              "home": home_stats,
          }, indent=2, default=str))
          PY
