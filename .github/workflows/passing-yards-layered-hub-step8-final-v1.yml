name: Passing Yards Layered Hub Step 8 Final Cert

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step8-final-cert-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_app_final_v1.py"
      - "tests/test_passing_yards_layered_hub_step8_final_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step8-final-v1.yml"

permissions:
  contents: read

jobs:
  final-targeted-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove final layered hub contract
        run: python tests/test_passing_yards_layered_hub_step8_final_v1.py
