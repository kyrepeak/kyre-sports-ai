name: TEMP Passing Visual Step3 App Wire

on:
  push:
    branches: [nfl-passing-yards-visual-parity-step3-qb-profile]
    paths:
      - ".github/workflows/temp-nfl-passing-visual-step3-app-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-passing-yards-visual-parity-step3-qb-profile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard and wire app to Router V123
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()

          old_title = '"""Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 2.\n'
          new_title = '"""Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 3.\n'
          if old_title not in text:
              raise SystemExit('APP_STEP2_TITLE_ANCHOR_MISSING')
          text = text.replace(old_title, new_title, 1)

          frozen_v121 = '    from streamlit_memory_lazy_router_v121 import render_app as _frozen_v121_render_app\n'
          frozen_v122 = '    from streamlit_memory_lazy_router_v122 import render_app as _frozen_v122_render_app\n'
          if frozen_v122 not in text:
              if frozen_v121 not in text:
                  raise SystemExit('TYPE_CHECKING_V121_ANCHOR_MISSING')
              text = text.replace(frozen_v121, frozen_v121 + frozen_v122, 1)

          old_hb = 'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V122_NFL_PASSING_YARDS_VISUAL_PARITY_STEP2_QB_HEROES_2026-09-13"\n'
          new_hb = (
              'FROZEN_V122_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V122_NFL_PASSING_YARDS_VISUAL_PARITY_STEP2_QB_HEROES_2026-09-13"\n'
              'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13"\n'
          )
          if text.count(old_hb) != 1:
              raise SystemExit(f'ACTIVE_V122_HEARTBEAT_COUNT={text.count(old_hb)}')
          text = text.replace(old_hb, new_hb, 1)

          old_runtime = '    from streamlit_memory_lazy_router_v122 import record_bootstrap_import_ms, render_app\n'
          new_runtime = '    from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app\n'
          if text.count(old_runtime) != 1:
              raise SystemExit(f'ACTIVE_V122_RUNTIME_COUNT={text.count(old_runtime)}')
          text = text.replace(old_runtime, new_runtime, 1)

          old_doc_hb = 'STREAMLIT_MAIN_V122_NFL_PASSING_YARDS_VISUAL_PARITY_STEP2_QB_HEROES_2026-09-13.\n'
          new_doc_hb = 'STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13.\n'
          if old_doc_hb not in text:
              raise SystemExit('DOC_V122_HEARTBEAT_ANCHOR_MISSING')
          text = text.replace(old_doc_hb, new_doc_hb, 1)

          path.write_text(text)
          PY

          git config user.name "kyrepeak"
          git config user.email "kyrewhite15@gmail.com"
          git add app.py
          git diff --cached --check
          git commit -m "Activate Passing visual parity Router V123"
          git push origin HEAD:nfl-passing-yards-visual-parity-step3-qb-profile
