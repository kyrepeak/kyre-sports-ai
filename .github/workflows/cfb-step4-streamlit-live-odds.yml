name: CFB Step 4 Streamlit live odds
# STEP4_FINAL_CERT_TRIGGER

on:
  push:
    branches:
      - cfb-step4-streamlit-live-odds
  pull_request:
    branches:
      - main

jobs:
  certify-step4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify permanent pre-odds freeze blobs
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("cfb_over_under_pre_odds_freeze_manifest_v1.json")
              .read_text(encoding="utf-8")
          )
          for path, expected in manifest["exact_blobs"].items():
              raw = Path(path).read_bytes()
              actual = hashlib.sha1(
                  f"blob {len(raw)}\0".encode() + raw
              ).hexdigest()
              assert actual == expected, (path, expected, actual)
              print("CFB_STEP4_FROZEN_BLOB_OK", path, actual)
          print("CFB_STEP4_FROZEN_BASELINE_UNTOUCHED")
          PY

      - name: Install Streamlit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run frozen and Step 4 regression tests
        run: |
          python -m pytest -q \
            tests/test_cfb_over_under_clean_page_v17.py \
            tests/test_cfb_over_under_step3_readable_v2.py \
            tests/test_cfb_over_under_router_v57.py \
            tests/test_cfb_schedule_v6_runtime_snapshot.py \
            tests/test_cfb_over_under_market_adapter_v1.py \
            tests/test_cfb_over_under_clean_page_v18.py \
            tests/test_cfb_over_under_router_v58.py

      - name: Compile additive Step 4 modules
        run: |
          python -m py_compile \
            scripts/build_cfb_runtime_snapshot_v2.py \
            cfb_schedule_v6_runtime_snapshot.py \
            cfb_over_under_market_adapter_v1.py \
            cfb_over_under_clean_page_v18.py \
            streamlit_memory_lazy_router_v58.py \
            app.py

      - name: Verify additive FBS + FCS snapshot V2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/cfb_runtime_snapshot_v2.json").read_text(encoding="utf-8")
          )
          games = payload.get("games") or []
          assert int(payload.get("version") or 0) == 2, payload.get("version")
          assert len(games) >= 100, len(games)
          ids = {str(row.get("event_id") or "") for row in games}
          assert "401858213" in ids
          builder = Path("scripts/build_cfb_runtime_snapshot_v2.py").read_text(
              encoding="utf-8"
          )
          assert '((80, "FBS"), (81, "FCS"))' in builder
          print(
              "CFB_STEP4_RUNTIME_SNAPSHOT_V2_GREEN",
              len(games),
              payload.get("generated_at"),
          )
          PY

      - name: Verify active Streamlit entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("app.py").read_text(encoding="utf-8")
          assert "streamlit_memory_lazy_router_v58" in text
          assert "STREAMLIT_MAIN_V58_CFB_OU_LIVE_ODDS" in text
          print("CFB_STEP4_STREAMLIT_ENTRYPOINT_GREEN")
          PY

      - name: Read-only live Step 4 adapter witness
        run: |
          python - <<'PY'
          import json
          import requests

          import cfb_over_under_market_adapter_v1 as adapter

          base = adapter.DEFAULT_API_BASE.rstrip("/")
          response = requests.get(
              base + adapter.API_PATH,
              timeout=45,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "KyreSportsAI-Streamlit-Step4-Cert/1.0",
              },
          )
          response.raise_for_status()
          raw = response.json()
          games = raw.get("games") or []
          assert len(games) >= 100, len(games)

          sample = next(
              (
                  row for row in games
                  if row.get("away_team") == "Florida A&M"
                  and row.get("home_team") == "Miami"
              ),
              games[0],
          )
          day = sample["game_date"]

          filtered_raw = dict(raw)
          filtered_raw["games"] = [
              row for row in games
              if row.get("game_date") == day
              and str(row.get("sportsbook") or "").casefold() == "fanduel"
          ]
          filtered_raw["game_count"] = len(filtered_raw["games"])
          payload = adapter._validate_payload(
              filtered_raw,
              requested_day=day,
          )
          assert payload["game_count"] >= 1, payload

          target = next(
              row for row in payload["games"]
              if row["game_id"] == sample["game_id"]
          )
          schedule_game = {
              "game_date": day,
              "away_team": target["away_team"],
              "home_team": target["home_team"],
              "espn_event_id": target["game_id"],
              "identity_key": "certified-schedule-row",
          }
          attached, attach_diag = adapter.attach_market_lines(
              [schedule_game],
              payload,
          )
          game = attached[0]
          assert game["market_line_available"] is True, game
          assert game["market_identity_verified"] is True, game
          assert game["market_total"] == float(target["total"]), game
          assert game["market_sportsbook"] == "FanDuel", game
          assert game["market_projection_weight"] == 0.0, game
          assert attach_diag["matching_method"] == "official ESPN event_id only"
          assert attach_diag["fuzzy_matching"] is False
          assert attach_diag["synthetic_ids"] is False

          print(
              "CFB_STEP4_LIVE_ADAPTER_WITNESS",
              json.dumps(
                  {
                      "date": day,
                      "api_rows": payload["game_count"],
                      "game_id": game["market_official_game_id"],
                      "matchup": (
                          f"{schedule_game['away_team']} @ "
                          f"{schedule_game['home_team']}"
                      ),
                      "sportsbook": game["market_sportsbook"],
                      "total": game["market_total"],
                      "projection_weight": game["market_projection_weight"],
                  },
                  sort_keys=True,
              ),
          )
          print("CFB_STEP4_STREAMLIT_LIVE_ODDS_GREEN")
          PY
