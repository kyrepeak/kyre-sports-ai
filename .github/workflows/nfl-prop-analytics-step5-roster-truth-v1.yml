name: NFL Prop Analytics Step 5 Roster Truth

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step5-roster-truth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_roster_truth_v1.py"
      - "tests/test_nfl_prop_analytics_step5_roster_truth_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step5-roster-truth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_roster_truth_v1.py"
      - "tests/test_nfl_prop_analytics_step5_roster_truth_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-step5-roster-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 5 scope and protect frozen Steps 1-4 / Passing Yards
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step5-roster-truth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_roster_truth_v1.py' \
            'tests/test_nfl_prop_analytics_step5_roster_truth_v1.py' | sort)"
          step6_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_availability_depth_v1.py' \
            'tests/test_nfl_prop_analytics_step6_availability_depth_v1.py' | sort)"
          step7_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_player_select_v1.py' \
            'tests/test_nfl_prop_analytics_step7_player_handoff_v1.py' | sort)"
          step8_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step8-prop-page-shell-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py' | sort)"
          visual_polish_step3_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json' \
            'nfl_prop_analytics_schedule_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_visual_polish_step3_v1.py' | sort)"
          page2_polish_step1_expected="$(printf '%s\n' \\
            '.github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \\
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json' \\
            'nfl_prop_analytics_matchup_shell_v1.py' \\
            'tests/test_nfl_prop_analytics_page2_polish_step1_v1.py'  | sort)"

          if [ "$actual" != "$expected" ] && \
             [ "$actual" != "$step6_additive_expected" ] && \
             [ "$actual" != "$step7_additive_expected" ] && \
             [ "$actual" != "$step8_additive_expected" ] && \
             [ "$actual" != "$visual_polish_step3_expected" ] && \
             [ "$actual" != "$page2_polish_step1_expected" ]; then
            echo "NFL_PROP_ANALYTICS_STEP5_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "NFL_PROP_ANALYTICS_STEP5_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_matchup_shell_v1.py 3052411d963354997f17f15358407db7a2c2c57e
          check_blob nfl_prop_analytics_game_select_v1.py 1187c13fc5bee03a955d014e87f237ed055a27ef
          check_blob nfl_prop_analytics_schedule_v1.py 3558f4581c0301c4fc57f8b5e761e1e0cc1eb63c
          check_blob devsystem/task_ledgers/nfl-prop-analytics-step4-page2-shell-v1.json 0f095b2b7eb26af05b4f0ecc34b63e0c14756f2c
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          grep -F 'render_verified_roster_truth(handoff)' nfl_prop_analytics_hub_v1.py
          echo "NFL_PROP_ANALYTICS_STEP5_STEP1_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP5_STEP2_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP5_STEP3_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP5_STEP4_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP5_PASSING_YARDS_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP5_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test Steps 1-5 contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile \
            nfl_prop_analytics_hub_v1.py \
            nfl_prop_analytics_schedule_v1.py \
            nfl_prop_analytics_game_select_v1.py \
            nfl_prop_analytics_matchup_shell_v1.py \
            nfl_prop_analytics_roster_truth_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py \
            tests/test_nfl_prop_analytics_step3_game_handoff_v1.py \
            tests/test_nfl_prop_analytics_step4_page2_shell_v1.py \
            tests/test_nfl_prop_analytics_step5_roster_truth_v1.py
          echo "NFL_PROP_ANALYTICS_STEP5_STATIC_GREEN"

      - name: Prove live two-source roster truth for CAR-CLE
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from nfl_prop_analytics_roster_truth_v1 import load_verified_roster_truth, POSITIONS

          handoff={
              "state":"ready",
              "selection_key":"CAR-CLE",
              "away":"CAR",
              "home":"CLE",
              "away_name":"Panthers",
              "home_name":"Browns",
              "target_date":"2026-09-27",
              "week":3,
          }
          truth=load_verified_roster_truth(handoff)
          if truth["state"]!="live":
              raise RuntimeError(
                  "PROP_ANALYTICS_STEP5_LIVE_ROSTER_NOT_READY:"
                  + str({
                      "state":truth.get("state"),
                      "reason":truth.get("reason"),
                      "sources":truth.get("sources_available"),
                      "verified":truth.get("verified_count"),
                      "disagreements":truth.get("disagreement_count"),
                      "nflverse":truth.get("nflverse_diag"),
                      "espn":truth.get("espn_diag"),
                  })
              )
          if truth["source_count"] != 2:
              raise RuntimeError(f"PROP_ANALYTICS_STEP5_SOURCE_COUNT:{truth['source_count']}")

          for team in ("CAR","CLE"):
              team_truth=truth["teams"][team]
              for pos in POSITIONS:
                  rows=team_truth["by_position"][pos]
                  if not rows:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP5_POSITION_EMPTY:{team}:{pos}")
                  if not all(row["verified"] and row["source_count"]==2 for row in rows):
                      raise RuntimeError(f"PROP_ANALYTICS_STEP5_UNVERIFIED_PLAYER:{team}:{pos}")

          print("NFL_PROP_ANALYTICS_STEP5_LIVE_ROSTER_GREEN",truth["verified_count"])
          print("NFL_PROP_ANALYTICS_STEP5_SOURCE_ROUTER_GREEN",truth["sources_available"])
          print("NFL_PROP_ANALYTICS_STEP5_CAR_POSITIONS_GREEN")
          print("NFL_PROP_ANALYTICS_STEP5_CLE_POSITIONS_GREEN")
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/nfl-prop-analytics-step5
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/nfl-prop-analytics-step5/streamlit.log 2>&1 &
          echo $! > /tmp/prop_analytics_step5_pid

      - name: Prove Page 2 verified roster truth and frozen predecessors
        run: |
          python - <<'PY'
          import time
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("PROP_ANALYTICS_STEP5_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=150):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP5_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(
                  base+"/?ks_jump_sport=NFL&ks_jump_market=Prop+Analytics&ks_pa_game=CAR-CLE&ks_pa_page=matchup",
                  wait_until="domcontentloaded",
                  timeout=120000,
              )

              _,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',150)
              _,roster=find(page,'[data-nfl-prop-analytics-step5-roster="v1"]',180)

              assert page2.get_attribute("data-prop-page2-state")=="ready"
              assert roster.get_attribute("data-prop-roster-state")=="live"
              assert roster.get_attribute("data-prop-roster-selection")=="CAR-CLE"
              assert int(roster.get_attribute("data-prop-roster-source-count") or 0)==2
              verified=int(roster.get_attribute("data-prop-roster-verified-count") or 0)
              assert verified>=8,verified

              total_players=0
              for frame in page.frames:
                  total_players+=frame.locator('[data-prop-roster-verified="true"]').count()
              assert total_players==verified,(total_players,verified)

              for team in ("CAR","CLE"):
                  for pos in ("QB","RB","WR","TE"):
                      count=0
                      for frame in page.frames:
                          count+=frame.locator(
                              f'[data-prop-roster-position="{pos}"][data-prop-roster-team="{team}"]'
                          ).count()
                      assert count==1,(team,pos,count)

              print("NFL_PROP_ANALYTICS_STEP5_BRANCH_ROSTER_GREEN",verified)
              print("NFL_PROP_ANALYTICS_STEP5_BRANCH_TWO_SOURCE_GREEN")

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=roster.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP5_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP5_BRANCH_{width}_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP5_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP5_STEP4_BRANCH_FROZEN_GREEN")

              passing.close()
              page.close()
              browser.close()

          print("NFL_PROP_ANALYTICS_STEP5_BRANCH_GREEN")
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1600 artifacts/nfl-prop-analytics-step5/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/prop_analytics_step5_pid ]; then
            kill "$(cat /tmp/prop_analytics_step5_pid)" 2>/dev/null || true
          fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Step 5 roster truth and freeze
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=120):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP5_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def open_step5(browser):
              deadline=time.monotonic()+1200
              last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(
                          base+"/?ks_jump_sport=NFL&ks_jump_market=Prop+Analytics&ks_pa_game=CAR-CLE&ks_pa_page=matchup",
                          wait_until="domcontentloaded",
                          timeout=120000,
                      )
                      _,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',100)
                      _,roster=find(page,'[data-nfl-prop-analytics-step5-roster="v1"]',150)
                      state=roster.get_attribute("data-prop-roster-state")
                      sources=int(roster.get_attribute("data-prop-roster-source-count") or 0)
                      verified=int(roster.get_attribute("data-prop-roster-verified-count") or 0)
                      if page2.get_attribute("data-prop-page2-state")!="ready":
                          last="STEP4_PAGE2_NOT_READY"
                      elif state!="live":
                          last=f"STEP5_ROSTER_NOT_LIVE:{state}"
                      elif sources!=2:
                          last=f"STEP5_SOURCE_COUNT:{sources}"
                      elif verified<8:
                          last=f"STEP5_VERIFIED_COUNT:{verified}"
                      else:
                          return context,page,roster,verified
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PROP_ANALYTICS_STEP5_PUBLIC_DEPLOY_WAIT",last)
                  try:
                      context.close()
                  except Exception:
                      pass
                  time.sleep(8)
              raise RuntimeError("PROP_ANALYTICS_STEP5_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context,page,roster,verified=open_step5(browser)

              total=0
              for frame in page.frames:
                  total+=frame.locator('[data-prop-roster-verified="true"]').count()
              assert total==verified,(total,verified)

              for team in ("CAR","CLE"):
                  for pos in ("QB","RB","WR","TE"):
                      count=0
                      for frame in page.frames:
                          count+=frame.locator(
                              f'[data-prop-roster-position="{pos}"][data-prop-roster-team="{team}"]'
                          ).count()
                      assert count==1,(team,pos,count)

              print("NFL_PROP_ANALYTICS_STEP5_PUBLIC_ROSTER_GREEN",verified)
              print("NFL_PROP_ANALYTICS_STEP5_PUBLIC_TWO_SOURCE_GREEN")

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=roster.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP5_PUBLIC_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP5_PUBLIC_{width}_GREEN")

              passing=context.new_page()
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP5_PASSING_YARDS_PUBLIC_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP5_STEP4_PUBLIC_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP5_STEP3_PUBLIC_FROZEN_GREEN")
