name: MONSTER V8 Step 1 Pre-Mutation Blast Radius

on:
  push:
    branches:
      - "monster/monster-v8-step1-pre-mutation-blast-radius-v1"
    paths:
      - "devsystem/pre_mutation_blast_radius_simulator_v1.py"
      - "tests/test_devsystem_pre_mutation_blast_radius_simulator_v1.py"
      - "devsystem/task_ledgers/monster-v8-step1-pre-mutation-blast-radius-simulator-v1.json"
      - ".github/workflows/monster-v8-step1-pre-mutation-blast-radius.yml"
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/pre_mutation_blast_radius_simulator_v1.py"
      - "tests/test_devsystem_pre_mutation_blast_radius_simulator_v1.py"
      - "devsystem/task_ledgers/monster-v8-step1-pre-mutation-blast-radius-simulator-v1.json"
      - ".github/workflows/monster-v8-step1-pre-mutation-blast-radius.yml"

permissions:
  contents: read

concurrency:
  group: monster-v8-step1-blast-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: pre-mutation blast-radius focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen V3 blast-map dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/project_blast_radius_map_v1.py)" = "24f1464122ec9814434a543835bb7a9f8b246118"

      - name: Verify frozen registry dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/frozen_artifact_registry_v1.py)" = "ede316bb19a900b544abe4d652d6cfbcde6a9f82"

      - name: Verify frozen V5 scope-lease dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/scope_aware_execution_lease_v1.py)" = "71383fa4ca36b0b4d80a6c87617912df6d52e4cf"

      - name: Verify frozen V7 sharding dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/shared_resource_lease_sharding_v1.py)" = "0e104b166bac9425ab2b84e253446b3faae5c0af"

      - name: Verify dependency-map implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object sports_api/monster_dependency_map_v1.py)" = "b7de79e0818064fb3e48c02ae8ae06262440294c"

      - name: Run pre-mutation blast-radius contract
        run: python devsystem/pre_mutation_blast_radius_simulator_v1.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_pre_mutation_blast_radius_simulator_v1.py

      - name: Emit V8 Step 1 GREEN marker
        run: echo "MONSTER_V8_STEP1_PRE_MUTATION_BLAST_RADIUS_GREEN"
