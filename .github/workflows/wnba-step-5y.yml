name: WNBA Step 5Y Render attachment + deployment bundle tests

on:
  pull_request:
    paths:
      - "sports_api/**"
      - ".github/workflows/wnba-step-5y.yml"
  push:
    branches:
      - api-foundation-v1
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the exact tested image and Render attachment bundle
        required: true
        type: boolean
        default: true
      release_id:
        description: Optional immutable release ID; blank uses the commit SHA prefix
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  step5y:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sports_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 5Y modules
        run: |
          python -m py_compile sports_api/wnba_render_attachment_readiness.py
          python -m py_compile sports_api/api/wnba_render_attachment.py
          python -m py_compile sports_api/tools/wnba_render_attachment_verify.py
          python -m py_compile sports_api/main.py

      - name: Run Step 5I regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_historical_backtest_calibration.py

      - name: Run Step 5J regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_pregame_prediction_store.py

      - name: Run Step 5K regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_player_prop_top_five_board.py

      - name: Run Step 5L regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_daily_slate_top_five.py

      - name: Run Step 5M regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_line_feed_adapter.py

      - name: Run Step 5N regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_feed_collector.py

      - name: Run Step 5O regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_feed_failover.py

      - name: Run Step 5P regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_pregame_board_scheduler.py

      - name: Run Step 5Q regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_scheduler_cycle_lock.py

      - name: Run Step 5R regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_production_runtime_readiness.py

      - name: Run Step 5S regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_deployment_smoke_readiness.py

      - name: Run Step 5T regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_release_activation_readiness.py

      - name: Run Step 5U regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_hosted_staging_readiness.py

      - name: Run Step 5V regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_release_publication_handoff.py

      - name: Run Step 5W regression harness
        env: { PYTHONPATH: . }
        run: |
          python sports_api/tests/test_wnba_staging_activation_gate.py
          python sports_api/tests/test_wnba_staging_activation_routes.py

      - name: Run Step 5X regression harness
        env: { PYTHONPATH: . }
        run: |
          python sports_api/tests/test_wnba_real_staging_deployment.py
          python sports_api/tests/test_wnba_real_staging_routes.py

      - name: Run Step 5Y deterministic harness
        env: { PYTHONPATH: . }
        run: |
          python sports_api/tests/test_wnba_render_attachment_readiness.py
          python sports_api/tests/test_wnba_render_attachment_routes.py

  publish-tested-image-and-render-bundle:
    needs: step5y
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4

      - name: Resolve immutable Step 5Y release identity
        shell: bash
        run: |
          REVISION="$(git rev-parse HEAD)"
          test "${#REVISION}" -eq 40
          SHORT_SHA="${REVISION:0:12}"
          REQUESTED_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.release_id || '' }}"
          if [ -n "$REQUESTED_RELEASE" ]; then
            RELEASE_ID="$REQUESTED_RELEASE"
          else
            RELEASE_ID="wnba-step5y-$SHORT_SHA"
          fi
          case "$RELEASE_ID" in
            *[!A-Za-z0-9._-]*|'') echo "Invalid release ID" >&2; exit 1 ;;
          esac
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kyre-sports-api"
          echo "WNBA_STEP5Y_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "WNBA_STEP5Y_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "WNBA_STEP5Y_REPOSITORY=$REPOSITORY" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish exact Step 5Y image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg WNBA_RELEASE_REVISION="$WNBA_STEP5Y_REVISION" \
            --build-arg WNBA_RELEASE_ID="$WNBA_STEP5Y_RELEASE_ID" \
            --metadata-file /tmp/wnba-step5y-build-metadata.json \
            -f sports_api/Dockerfile \
            -t "$WNBA_STEP5Y_REPOSITORY:$WNBA_STEP5Y_RELEASE_ID" \
            -t "$WNBA_STEP5Y_REPOSITORY:$WNBA_STEP5Y_REVISION" \
            --push .

      - name: Freeze immutable Render attachment bundle
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          meta = json.load(open('/tmp/wnba-step5y-build-metadata.json', encoding='utf-8'))
          digest = meta.get('containerimage.digest')
          if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit(f'invalid registry digest: {digest!r}')

          repository = os.environ['WNBA_STEP5Y_REPOSITORY']
          revision = os.environ['WNBA_STEP5Y_REVISION']
          release_id = os.environ['WNBA_STEP5Y_RELEASE_ID']
          immutable_ref = f'{repository}@{digest}'

          template_path = pathlib.Path('sports_api/hosting/render.step5y.yaml.template')
          template = template_path.read_text(encoding='utf-8')
          rendered = (
              template
              .replace('__IMMUTABLE_IMAGE_REF__', immutable_ref)
              .replace('__FULL_GIT_SHA__', revision)
              .replace('__RELEASE_ID__', release_id)
          )
          unresolved = [
              token
              for token in ('__IMMUTABLE_IMAGE_REF__', '__FULL_GIT_SHA__', '__RELEASE_ID__')
              if token in rendered
          ]
          if unresolved:
              raise SystemExit(f'unresolved Step 5Y Render template tokens remain: {unresolved}')

          record = {
              'schema_version': 'wnba_step_5y_render_attachment_bundle_v1',
              'release_id': release_id,
              'revision': revision,
              'published_image_ref': immutable_ref,
              'image_digest_sha256': digest.removeprefix('sha256:'),
              'render_service_name': 'kyre-sports-api-staging',
              'render_registry_credential_name': 'kyre-sports-ghcr',
              'render_disk_name': 'kyre-sports-api-staging-data',
              'render_disk_mount_path': '/var/lib/kyre-sports-api',
              'render_disk_size_gb': 1,
              'render_instance_count': 1,
              'production_runtime_enabled': False,
              'activation_approved': False,
              'requires_sportsgameodds_secret': True,
              'secret_values_in_bundle': False,
              'post_deploy_verifier': 'sports_api/tools/wnba_render_attachment_verify.py',
              'next_gate': 'Deploy the exact digest to Render with runtime disabled, run the GET-only Step 5Y verifier, then apply its sanitized attestation values.',
          }

          out = pathlib.Path('.wnba-step5y-render')
          out.mkdir(exist_ok=True)
          (out / 'render.yaml').write_text(rendered, encoding='utf-8')
          (out / 'render-attachment.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'PUBLISHED_IMAGE_REF.txt').write_text(immutable_ref + '\n', encoding='utf-8')
          print(immutable_ref)
          PY

      - name: Upload Step 5Y Render attachment bundle
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step5y-render-${{ github.run_id }}
          path: .wnba-step5y-render/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
