name: WNBA PRA Speed V3 Step 4 Server Bundle Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: pip install pytest requests fastapi streamlit httpx pandas pypdf

      - name: Run Step 4 server-cache contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_wnba_pra_speed_v3_step4.py

      - name: Enforce exact Step 4 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/devsystem-targeted-ci.yml
          .github/workflows/wnba-pra-speed-v3-step4-server-cache.yml
          app.py
          devsystem/task_ledgers/wnba-pra-speed-v3-step4-server-cache.json
          devsystem/wnba_pra_speed_v3_step4_public_profile.py
          sports_api/api/wnba_pra_cached_detail_bundle.py
          sports_api/main.py
          streamlit_memory_lazy_router_wnba_pra_speed_v3_step4.py
          tests/test_wnba_pra_speed_v3_step4.py
          wnba_pra_speed_v3_step4_cache.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "WNBA_PRA_SPEED_V3_STEP4_SCOPE_GREEN"

      - name: Protect frozen Speed V3 Steps 1-3
        shell: bash
        run: |
          set -euo pipefail
          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "STEP4_FROZEN_BLOB_CHANGED:$1:$actual:$2"; exit 1; }
          }
          check_blob wnba_pra_speed_v3_step1_profiler.py df406e7f3753f5707274d5287c87ee49832515bf
          check_blob streamlit_memory_lazy_router_wnba_pra_speed_v3_step1.py 649b9af7e33be34b6cc931f9a3699d0e002f22d3
          check_blob wnba_pra_speed_v3_step2_transport.py 9a682f1ef27e663f1254d16895ed955f7dc0987e
          check_blob streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py 3e14bb8b9607cce6f026ba3ae479f7536b0ac9eb
          check_blob wnba_pra_speed_v3_step3_bundle.py 972292086f23531875be6fb697ee494580c988a8
          check_blob streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py 887af7f2ccf655218a945cf2d48cac1b79ad92eb
          check_blob sports_api/api/wnba_pra_detail_bundle.py b5591cfcd09f9ed7910b795bb568efc9f4633a97
          check_blob sports_api/wnba_pra_speed_v3_step3_espn_history.py fa4f7a99a6c73984e90e938efc506711a9f614c6
          check_blob wnba_api_client_v1.py a371d30e59fc44c441cf08a411bc8210a111913d
          echo "WNBA_PRA_SPEED_V3_STEP4_FROZEN_STEPS1_3_GREEN"

      - name: Compile Step 4 surfaces
        run: |
          python -m py_compile             sports_api/api/wnba_pra_cached_detail_bundle.py             wnba_pra_speed_v3_step4_cache.py             streamlit_memory_lazy_router_wnba_pra_speed_v3_step4.py             sports_api/main.py             app.py             devsystem/wnba_pra_speed_v3_step4_public_profile.py

      - name: Certify Step 4 cache and speed contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'pra-detail-cached' sports_api/api/wnba_pra_cached_detail_bundle.py
          grep -F 'CACHE_TTL_SECONDS = 60' sports_api/api/wnba_pra_cached_detail_bundle.py
          grep -F '"warm_same_session_target_seconds_max": 0.75' wnba_pra_speed_v3_step4_cache.py
          grep -F '"cached_cold_player_target_seconds_max": 1.5' wnba_pra_speed_v3_step4_cache.py
          grep -F '"true_cold_pra_target_seconds_max": 2.5' wnba_pra_speed_v3_step4_cache.py
          grep -F 'frozen_step3_bundle.load_bundle_pair = step4_cache.load_cached_bundle_pair' streamlit_memory_lazy_router_wnba_pra_speed_v3_step4.py
          grep -F 'from streamlit_memory_lazy_router_wnba_pra_speed_v3_step4 import record_bootstrap_import_ms, render_app' app.py
          echo "WNBA_PRA_SPEED_V3_STEP4_SERVER_CACHE_CONTRACT_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP4_BRANCH_GREEN"

  public-profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: focused-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          pip install playwright requests streamlit
          python -m playwright install --with-deps chromium

      - name: Prove Step 4 server cache and speed targets
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/wnba_pra_speed_v3_step4_public_profile.py             --production-url https://pickvault.streamlit.app             --artifact-dir artifacts/wnba-pra-speed-v3-step4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wnba-pra-speed-v3-step4-profile
          path: artifacts/wnba-pra-speed-v3-step4
          if-no-files-found: ignore
