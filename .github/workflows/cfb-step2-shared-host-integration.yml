name: CFB Step 2 shared-host integration

on:
  push:
    branches:
      - cfb-step2-shared-host-integration
      - cfb-step2-live-fanduel-feed
  pull_request:
    branches:
      - mlb-step17b-shared-host-cert

jobs:
  certify-shared-host-step2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared-host test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-mlb-step14b-persistence.txt
          python -m pip install pytest

      - name: Run CFB market and identity tests
        run: |
          python -m pytest -q             sports_api/tests/test_cfb_markets_step1.py             sports_api/tests/test_cfb_fanduel_direct_step2.py             sports_api/tests/test_cfb_market_identity_step2.py

      - name: Compile CFB live-feed and identity routes
        run: |
          python -m py_compile             sports_api/collectors/cfb_fanduel_direct.py             sports_api/api/cfb_markets.py             sports_api/api/cfb_market_identity_v1.py             sports_api/api/health.py

      - name: Verify real shared-host lifespan and CFB Step 2 route
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from sports_api.main import app

          with TestClient(app) as client:
              health = client.get("/health")
              step1 = client.get("/api/v1/cfb/markets/status")
              step2 = client.get("/api/v1/cfb/markets/identity-status")

          assert health.status_code == 200, health.text
          assert step1.status_code == 200, step1.text
          assert step2.status_code == 200, step2.text

          b1 = step1.json()
          b2 = step2.json()
          assert b1["auto_refresh_enabled"] is True
          assert b1["live_provider"]["provider"] == "FanDuel"
          assert b1["live_provider"]["custom_page_id"] == "ncaaf"
          assert b1["live_provider"]["secret_required"] is False
          assert b1["market_semantics"]["projection_weight"] == 0.0
          assert b2["step"] == 2
          assert b2["identity_ready"] is True
          assert b2["identity_policy"]["synthetic_ids"] is False
          assert b2["identity_policy"]["fuzzy_matching"] is False
          assert b2["market_semantics"]["projection_weight"] == 0.0
          assert b2["market_semantics"]["may_modify_projection"] is False
          print("CFB_STEP2_SHARED_HOST_GREEN")
          PY

      - name: Read-only live FanDuel to ESPN reconciliation witness
        run: |
          python - <<'PY'
          import json

          from sports_api.collectors.cfb_fanduel_direct import (
              collect_fanduel_cfb_total_feed,
          )
          from sports_api.api.cfb_market_identity_v1 import (
              reconcile_market_feed,
              resolve_verified_games,
          )

          feed = collect_fanduel_cfb_total_feed()
          verified, identity_diag = resolve_verified_games(feed)
          result = reconcile_market_feed(feed, verified)
          diag = result["diagnostics"]
          evidence = {
              "fan_duel_rows": len(feed["games"]),
              "market_dates": identity_diag["requested_market_dates"],
              "espn_verified_games": len(verified),
              "matched_rows": diag["matched_market_rows"],
              "unmatched_rows": diag["unmatched_market_rows"],
              "unmatched_sample": [
                  {
                      "away": row.get("provider_away_team"),
                      "home": row.get("provider_home_team"),
                      "date": row.get("game_date"),
                      "reason": row.get("reason"),
                  }
                  for row in result["unmatched"][:20]
              ],
          }
          print("CFB_LIVE_RECON_WITNESS", json.dumps(evidence, sort_keys=True))
          assert len(feed["games"]) >= 1
          assert diag["matched_market_rows"] >= 1
          print("CFB_STEP2_LIVE_FANDUEL_RECON_WITNESS_GREEN")
          PY
