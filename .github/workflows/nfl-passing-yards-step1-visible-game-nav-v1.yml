name: NFL Passing Yards Step 1 Visible Game Navigation

on:
  push:
    branches:
      - "monster/nfl-passing-step1-visible-game-nav-v1"
    paths:
      - "nfl_passing_yards_hub_v42.py"
      - "tests/test_nfl_passing_yards_step1_visible_game_nav_v1.py"
      - ".github/workflows/nfl-passing-yards-step1-visible-game-nav-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-passing-step1-visible-game-nav-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Passing Yards test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Prove full-slate visible game navigation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_nfl_passing_yards_step1_visible_game_nav_v1.py
          echo "NFL_PASSING_STEP1_VISIBLE_GAME_NAV_GREEN"
