name: MLB Step5.10B Streamlit post-merge status

on:
  push:
    branches:
      - mlb-step5-10b-host-canary-verification
    paths:
      - '.github/workflows/mlb-step5-10b-streamlit-postmerge-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe Streamlit public status and canary transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse
          import requests

          base = 'https://kyre-sports-ai.streamlit.app'
          urls = {
              'root': base + '/',
              'health': base + '/_stcore/health',
              'host_config': base + '/_stcore/host-config',
              'app_status': base + '/api/v2/app/status',
              'canary_root': base + '/?mlb_step5_10b_canary=1&mlb_step5_10b_percent=25',
              'rollback_root': base + '/',
          }
          s = requests.Session()
          s.headers.update({'User-Agent': 'KyreSportsMLBStep5-10B-PostMerge/1.0'})
          out = {}
          for name, url in urls.items():
              last = None
              for attempt in range(1, 4):
                  try:
                      r = s.get(url, timeout=35, allow_redirects=True)
                      item = {
                          'status': r.status_code,
                          'final_url': r.url,
                          'content_type': r.headers.get('content-type'),
                          'body_prefix': r.text[:1800],
                      }
                      try:
                          data = r.json()
                          if isinstance(data, dict):
                              # Public control-plane metadata only; drop anything token-like.
                              item['json'] = {
                                  k: v for k, v in data.items()
                                  if not any(x in str(k).lower() for x in ('token','secret','key','credential','cookie'))
                              }
                      except Exception:
                          pass
                      out[name] = item
                      break
                  except Exception as exc:
                      last = f'{type(exc).__name__}: {exc}'
                      if attempt < 3:
                          time.sleep(3)
              if name not in out:
                  out[name] = {'error': last}
          print(json.dumps(out, indent=2, sort_keys=True))
          required = ('root','health','canary_root','rollback_root')
          if any(out.get(k, {}).get('status') != 200 for k in required):
              raise SystemExit('STEP5_10B_POSTMERGE_TRANSPORT_FAILED')
          print('MLB_STEP5_10B_POSTMERGE_STREAMLIT_TRANSPORT_GREEN')
          PY
