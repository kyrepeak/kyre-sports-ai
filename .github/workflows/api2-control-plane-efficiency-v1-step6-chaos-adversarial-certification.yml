name: API2 Control-Plane Efficiency V1 Step 6 Chaos Adversarial Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.yml"
      - "devsystem/api2_chaos_adversarial_certifier_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.json"
      - "tests/test_devsystem_api2_chaos_adversarial_certifier_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.yml"
      - "devsystem/api2_chaos_adversarial_certifier_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step6-chaos-adversarial-certification.json"
      - "tests/test_devsystem_api2_chaos_adversarial_certifier_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api2-control-plane-efficiency-v1-step6-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chaos-adversarial-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 6 crash-test contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile devsystem/api2_chaos_adversarial_certifier_v1.py
          python -m pytest -q             tests/test_devsystem_api2_chaos_adversarial_certifier_v1.py             tests/test_devsystem_chaos_adversarial_certification_harness_v1.py             tests/test_devsystem_state_aware_proof_contract_v1.py
          python devsystem/api2_chaos_adversarial_certifier_v1.py
      - name: Prove Steps 1 through 5 remain frozen
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/registry.json
          python devsystem/frozen_artifact_registry_v1.py verify-head             --registry-file /tmp/registry.json             --head HEAD
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP6_FROZEN_PARENTS_GREEN"
      - name: Certify exact PR head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP6_BRANCH_GREEN"
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP6_READY_TO_MERGE"
      - name: Certify merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP6_MAIN_GREEN"
