name: MLB Step8F player-props production release certification

on:
  push:
    branches:
      - mlb-step8f-player-prop-presentation-integration
    paths:
      - .github/workflows/mlb-step8f-player-props-release-cert-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SHA: 2812010d0ae41eb8f8b01338bfc017fb94e602de
  LIVE_BASE_SHA: 5251c26b8f70fc2464173eb1f8ffedbe1d424449
  API_BLOB_SHA: 24f853638d1e277097877f8a3b913dfa60f95d3c
  PLAYER_PROPS_BLOB_SHA: 9b01cf192395f0b5362f047e0aae58f896fde21b
  DIRECT_COLLECTOR_BLOB_SHA: 411a78a35a63302f58114740726006cd61ff457a

jobs:
  certify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact minimal release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt pytest

      - name: Prove exact two-file additive release over live Render revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          changed="$(git diff --name-only "$LIVE_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = $'sports_api/api/mlb.py\nsports_api/collectors/mlb_fanduel_player_props.py'
          read api_add api_del api_path <<EOF
          $(git diff --numstat "$LIVE_BASE_SHA"...HEAD -- sports_api/api/mlb.py)
          EOF
          test "$api_add" = '48'
          test "$api_del" = '0'
          test "$api_path" = 'sports_api/api/mlb.py'
          read collector_add collector_del collector_path <<EOF
          $(git diff --numstat "$LIVE_BASE_SHA"...HEAD -- sports_api/collectors/mlb_fanduel_player_props.py)
          EOF
          test "$collector_add" = '705'
          test "$collector_del" = '0'
          test "$collector_path" = 'sports_api/collectors/mlb_fanduel_player_props.py'
          echo 'MLB_PLAYER_PROPS_RELEASE_TWO_FILE_ADDITIVE_SCOPE_OK'

      - name: Prove certified blob identity and frozen live collector preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object sports_api/api/mlb.py)" = "$API_BLOB_SHA"
          test "$(git hash-object sports_api/collectors/mlb_fanduel_player_props.py)" = "$PLAYER_PROPS_BLOB_SHA"
          test "$(git hash-object sports_api/collectors/mlb_fanduel_direct.py)" = "$DIRECT_COLLECTOR_BLOB_SHA"
          git diff --exit-code "$LIVE_BASE_SHA"...HEAD -- \
            app.py \
            sports_api/main.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            mlb_live_odds_streamlit_v1.py
          echo 'MLB_PLAYER_PROPS_RELEASE_CERTIFIED_BLOBS_AND_LIVE_RUNTIME_PRESERVED'

      - name: Compile release API files
        run: |
          python -m py_compile \
            sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_fanduel_direct.py

      - name: Exercise existing odds and new player-props endpoints from release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from sports_api.api.mlb import router

          app = FastAPI()
          app.include_router(router)
          with TestClient(app) as client:
              odds_response = client.get('/api/v1/mlb/odds', params={'max_events': 4, 'fully_priced_only': 'false'})
              props_response = client.get('/api/v1/mlb/player-props', params={'max_events': 4})

          assert odds_response.status_code == 200, odds_response.text
          odds = odds_response.json()
          assert odds['data_type'] == 'mlb_live_odds_api_response_v1'
          assert odds['schema_version'] == 1
          assert odds['source'] == 'FanDuel'
          assert odds['transport'] == 'anonymous_public_get_only'
          assert odds['http_methods'] == ['GET']

          assert props_response.status_code == 200, props_response.text
          props = props_response.json()
          assert props['data_type'] == 'mlb_player_prop_api_response_v1'
          assert props['schema_version'] == 1
          assert props['source'] == 'FanDuel'
          assert props['transport'] == 'anonymous_public_get_only'
          assert props['http_methods'] == ['GET']
          assert props['player_name_matching_used'] is False
          assert props['fuzzy_matching_used'] is False
          assert isinstance(props['props'], list)
          assert int(props['matched_game_count'] or 0) > 0

          allowed = {'pitcher_strikeouts', 'player_hits', 'hits_runs_rbi'}
          for row in props['props']:
              assert row['market_type'] in allowed
              assert int(row['official_game_id']) > 0
              assert int(row['official_player_id']) > 0
              assert float(row['line']) > 0
              assert int(row['over_odds']) != 0
              assert int(row['under_odds']) != 0
              assert row['sportsbook'] == 'FanDuel'

          if not props['props']:
              unavailable = props.get('contract_unavailable_market_counts') or {}
              assert sum(int(v or 0) for v in unavailable.values()) > 0, unavailable

          print({
              'marker': 'MLB_PLAYER_PROPS_MINIMAL_RELEASE_GREEN',
              'odds_game_count': odds.get('game_count'),
              'matched_game_count': props.get('matched_game_count'),
              'prop_count': props.get('prop_count'),
              'player_name_matching_used': props.get('player_name_matching_used'),
              'fuzzy_matching_used': props.get('fuzzy_matching_used'),
          })
          PY

      - name: Final minimal release marker
        run: echo 'MLB_PLAYER_PROPS_PRODUCTION_RELEASE_CERTIFIED_GREEN'
