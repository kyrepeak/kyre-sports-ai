name: API2 NFL Game Totals Page1 S-tier V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_game_totals_page1_s_tier_v1.py"
      - "nfl_hub_v36.py"
      - "tests/test_api2_nfl_game_totals_page1_s_tier_v1.py"
      - "tests/test_nfl_game_totals_compact_layout_v1.py"
      - "tests/test_nfl_game_totals_page_step10.py"
      - "devsystem/runless_proof_plans/api2-nfl-game-totals-page1-s-tier-v1.json"
      - "devsystem/task_ledgers/api2-nfl-game-totals-page1-s-tier-v1.json"
      - ".github/workflows/api2-nfl-game-totals-page1-s-tier-v1.yml"

jobs:
  page1-s-tier-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi httpx requests pypdf PyJWT cryptography pandas numpy streamlit
      - name: Run Game Totals Page 1 S-tier regressions
        run: >-
          python -m pytest --noconftest -q
          tests/test_api2_nfl_game_totals_page1_s_tier_v1.py
          tests/test_nfl_game_totals_compact_layout_v1.py
          tests/test_nfl_game_totals_page_step10.py
      - name: Compile presentation chain
        run: python -m py_compile nfl_game_totals_page1_s_tier_v1.py nfl_game_totals_compact_layout_v1.py nfl_game_totals_hub_v10.py nfl_hub_v36.py
