name: Sitewide Theme Rollout Step 3 Game Total

on:
  push:
    branches:
      - "monster/sitewide-theme-rollout-step3-game-total-v1"
    paths:
      - "app.py"
      - "kyre_game_total_theme_v1.py"
      - "cfb_game_total_clean_page_v34.py"
      - "streamlit_memory_lazy_router_v190.py"
      - "tests/test_sitewide_theme_rollout_step3_game_total_v1.py"
      - ".github/workflows/sitewide-theme-rollout-step3-game-total-v1.yml"

permissions:
  contents: read

jobs:
  targeted-game-total-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Game Total universal presentation only
        run: python tests/test_sitewide_theme_rollout_step3_game_total_v1.py
