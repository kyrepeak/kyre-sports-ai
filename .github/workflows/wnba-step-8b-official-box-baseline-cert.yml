name: WNBA Step 8B official box baseline cert

on:
  push:
    branches:
      - wnba-step8-projection-contract-20260828
    paths:
      - '.github/workflows/wnba-step-8b-official-box-baseline-cert.yml'
      - 'sports_api/wnba_step8_official_box_baseline.py'
      - 'sports_api/tools/wnba_step8b_official_box_baseline_cert.py'
      - 'tests/test_wnba_step8_official_box_baseline.py'
      - 'sports_api/wnba_step8_projection_handoff.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step8b-official-box-baseline-cert
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Step 8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert production OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'
          test "$WNBA_STEP8_PROJECTION_HANDOFF_ENABLED" = 'true'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 8B baseline surface
        shell: bash
        run: |
          python -m py_compile sports_api/wnba_step8_official_box_baseline.py
          python -m py_compile sports_api/tools/wnba_step8b_official_box_baseline_cert.py
          python -m py_compile tests/test_wnba_step8_official_box_baseline.py
          python -m py_compile sports_api/wnba_step8_projection_handoff.py

      - name: Run fail-closed Step 8B baseline regressions
        shell: bash
        run: |
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py

      - name: Prove certified Step 8A and frozen Step 7G boundary unchanged
        shell: bash
        run: |
          set -euo pipefail
          STEP8A_CERTIFIED_SHA='82c75e57ec00d7daafa7d688e6f2658df8711176'
          git fetch origin wnba-step8-projection-contract-20260828 --depth=100
          git cat-file -e "$STEP8A_CERTIFIED_SHA^{commit}"
          git diff --exit-code "$STEP8A_CERTIFIED_SHA" -- \
            sports_api/wnba_step8_projection_handoff.py \
            tests/test_wnba_step8_projection_handoff.py \
            sports_api/tools/wnba_step8a_projection_handoff_cert.py \
            sports_api/wnba_step7g_release_freeze.py \
            sports_api/wnba_step7g_first_party_integration.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_model_input_readiness.py

      - name: Certify live official Step 8B box baseline
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step8b_official_box_baseline_cert

      - name: Upload sanitized Step 8B baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step8b-official-box-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: step8b-official-box-baseline-cert.json
          if-no-files-found: warn
          retention-days: 60

      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
