name: Monster A8 Runtime Detection TDD

on:
  pull_request:
    branches:
      - main

jobs:
  a8-runtime-detection:
    if: github.head_ref == 'monster-a8-streamlit-runtime-detection-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest streamlit
      - name: Run A8 ScriptRunner runtime regression
        run: python -m pytest -q tests/test_streamlit_telemetry_activation_probe_v1.py::test_streamlit_runtime_detector_accepts_script_runner_argv
