name: TEMP NFL Receiving Yards Step 9 App Wire

on:
  push:
    branches: [nfl-receiving-yards-v9-matchup-tier-sorting]
    paths:
      - '.github/workflows/temp-nfl-receiving-yards-step9-app-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-receiving-yards-v9-matchup-tier-sorting
          fetch-depth: 0
      - name: Apply exact V119 to V120 app wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'Kyre Sports AI Streamlit entrypoint — NFL Receiving Yards Step 8 FanDuel full lineup.',
                  'Kyre Sports AI Streamlit entrypoint — NFL Receiving Yards Step 9 matchup tiers.',
              ),
              (
                  'Router V119 is additive over certified Router V118.',
                  'Router V120 is additive over certified Router V119.',
              ),
              (
                  'only NFL -> Receiving Yards to the isolated V8 full-lineup market page.',
                  'only NFL -> Receiving Yards to the isolated V9 matchup-tier page.',
              ),
              (
                  'Support + Concerns, and fresh exact-ID FanDuel full-lineup display are live.',
                  'Support + Concerns, fresh exact-ID FanDuel full-lineup display, and opponent matchup tiers are live.',
              ),
              (
                  'STREAMLIT_MAIN_V119_NFL_RECEIVING_YARDS_STEP8_FANDUEL_FULL_LINEUP_2026-09-13.',
                  'STREAMLIT_MAIN_V120_NFL_RECEIVING_YARDS_STEP9_MATCHUP_TIERS_2026-09-13.',
              ),
              (
                  '    from streamlit_memory_lazy_router_v118 import render_app as _frozen_v118_render_app\n',
                  '    from streamlit_memory_lazy_router_v118 import render_app as _frozen_v118_render_app\n    from streamlit_memory_lazy_router_v119 import render_app as _frozen_v119_render_app\n',
              ),
              (
                  'FROZEN_V118_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V118_NFL_RECEIVING_YARDS_STEP7_SUPPORT_CONCERNS_2026-09-13"\nDEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V119_NFL_RECEIVING_YARDS_STEP8_FANDUEL_FULL_LINEUP_2026-09-13"',
                  'FROZEN_V118_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V118_NFL_RECEIVING_YARDS_STEP7_SUPPORT_CONCERNS_2026-09-13"\nFROZEN_V119_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V119_NFL_RECEIVING_YARDS_STEP8_FANDUEL_FULL_LINEUP_2026-09-13"\nDEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V120_NFL_RECEIVING_YARDS_STEP9_MATCHUP_TIERS_2026-09-13"',
              ),
              (
                  '    from streamlit_memory_lazy_router_v119 import record_bootstrap_import_ms, render_app\n',
                  '    from streamlit_memory_lazy_router_v120 import record_bootstrap_import_ms, render_app\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact app wire guard failed: expected 1 occurrence, got {count}: {old[:100]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('NFL_RECEIVING_YARDS_STEP9_APP_WIRE_GREEN')
          PY
      - name: Commit app wiring
        run: |
          set -euo pipefail
          git diff -- app.py
          git config user.name "kyrepeak"
          git config user.email "kyrewhite15@gmail.com"
          git add app.py
          git diff --cached --quiet && { echo 'No app changes to commit'; exit 1; }
          git commit -m "NFL Receiving Yards Step 9: activate Router V120"
          git push origin HEAD:nfl-receiving-yards-v9-matchup-tier-sorting
