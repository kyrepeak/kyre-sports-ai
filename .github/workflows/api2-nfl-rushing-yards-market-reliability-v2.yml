name: API2 NFL Rushing Yards Market Reliability V2

on:
  pull_request:
    branches: [api2-main]
    paths:
      - "sports_api/collectors/nfl_fanduel_rushing_yards_nflverse_v1.py"
      - "sports_api/nfl_rushing_yards_data_truth_v1.py"
      - "sports_api/nfl_rushing_yards_fastpath_v1.py"
      - "sports_api/api/nfl_rushing_yards_slate_v1.py"
      - "tests/test_api2_nfl_rushing_yards_market_reliability_v2.py"
      - ".github/workflows/api2-nfl-rushing-yards-market-reliability-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rushing-yards-market-reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas fastapi requests
      - name: Compile market reliability boundary
        run: |
          python -m py_compile \
            sports_api/collectors/nfl_fanduel_rushing_yards_nflverse_v1.py \
            sports_api/nfl_rushing_yards_data_truth_v1.py \
            sports_api/nfl_rushing_yards_fastpath_v1.py \
            sports_api/api/nfl_rushing_yards_slate_v1.py \
            tests/test_api2_nfl_rushing_yards_market_reliability_v2.py
      - name: Prove exact market reconciliation and bounded transport recovery
        run: python -m pytest --noconftest -q tests/test_api2_nfl_rushing_yards_market_reliability_v2.py
      - name: Inspect provider-neutral live identity and market membership
        run: |
          python - <<'PY'
          from sports_api.collectors import nfl_fanduel_rushing_yards_nflverse_v1 as rushing
          from sports_api.collectors import nfl_fanduel_passing_yards_nflverse_v1 as base

          game = {
              "away": "DEN",
              "home": "ARI",
              "away_name": "Denver Broncos",
              "home_name": "Arizona Cardinals",
          }
          landing = rushing._get_json_reliable(
              f"{base.FANDUEL_BASE_URL}/sbapi/content-managed-page",
              {"_ak": base.FANDUEL_PUBLIC_WEB_KEY, "page": "CUSTOM", "customPageId": "nfl", "timezone": "America/New_York"},
              timeout=8,
          )
          event_id = base._match_event(landing, game)
          assert event_id, "exact DEN @ ARI FanDuel event not found"
          fdx = rushing._get_json_reliable(f"{base.FANDUEL_FDX_BASE_URL}/v1/live/event/{event_id}/players", timeout=8)
          player_map = fdx.get("playerMap") or {}
          identity_rows = []
          for provider_id, player in player_map.items():
              if not isinstance(player, dict):
                  continue
              if str(player.get("team") or player.get("teamAbbreviation") or "").upper() != "ARI":
                  continue
              position = str(player.get("position") or "").upper()
              if position not in {"RB", "RUNNING BACK", "HALFBACK", "FB", "FULLBACK"}:
                  continue
              safe = {"provider_player_id": str(provider_id)}
              for key, value in player.items():
                  lower = str(key).lower()
                  if key in {"team", "teamAbbreviation", "position", "jerseyNumber", "jersey", "number"} or lower in {
                      "sportradarid", "sportradar_id", "gsisid", "gsis_id", "smartid", "smart_id", "fantasydataid", "fantasy_data_id"
                  }:
                      safe[str(key)] = value
              identity_rows.append(safe)
          observations = rushing.collect_fanduel_game_markets(game, timeout=8)
          market_rows = [
              {
                  "provider_player_id": str(row.get("provider_player_id") or ""),
                  "team": row.get("team_abbr"),
                  "position": row.get("position"),
                  "jersey": row.get("jersey_number"),
                  "line": row.get("line"),
              }
              for row in observations
              if str(row.get("team_abbr") or "").upper() == "ARI"
          ]
          print("SANITIZED_ARI_RB_IDENTITY_ROWS=", identity_rows)
          print("SANITIZED_ARI_RUSH_MARKET_ROWS=", market_rows)
          PY
