name: NFL Game Totals Step 6 Source Probe

on:
  push:
    branches:
      - monster/nfl-game-totals-step6-source-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-red-zone-drives:
    runs-on: ubuntu-latest
    steps:
      - name: Prove ESPN red-zone and drive-sustainability fields
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/ari/statistics'
          url = base + '?' + urlencode({'season': 2026})
          request = Request(url, headers={
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0 kyre-sports-ai-step6-source-probe',
          })
          with urlopen(request, timeout=20) as response:
              print('HTTP_STATUS=' + str(getattr(response, 'status', 200)))
              payload = json.load(response)

          results = payload.get('results') or {}
          stats_root = results.get('stats') if isinstance(results, dict) else {}
          categories = stats_root.get('categories') if isinstance(stats_root, dict) else []
          if not isinstance(categories, list):
              categories = []

          pattern = re.compile(r'(red\s*zone|redzone|third\s*down|3rd\s*down|first\s*down|1st\s*down|drive|drives)', re.I)
          matches = []
          for category in categories:
              if not isinstance(category, dict):
                  continue
              category_name = str(category.get('name') or '')
              category_display = str(category.get('displayName') or '')
              for stat in category.get('stats') or []:
                  if not isinstance(stat, dict):
                      continue
                  searchable = ' '.join(str(stat.get(k) or '') for k in (
                      'name','displayName','shortDisplayName','description','abbreviation'
                  ))
                  if not pattern.search(searchable):
                      continue
                  matches.append({
                      'category': category_display or category_name,
                      'categoryName': category_name,
                      'name': stat.get('name'),
                      'displayName': stat.get('displayName'),
                      'shortDisplayName': stat.get('shortDisplayName'),
                      'description': stat.get('description'),
                      'value': stat.get('value'),
                      'displayValue': stat.get('displayValue'),
                      'perGameValue': stat.get('perGameValue'),
                      'perGameDisplayValue': stat.get('perGameDisplayValue'),
                      'rank': stat.get('rank'),
                  })

          print('MATCH_COUNT=' + str(len(matches)))
          for item in matches:
              print('RED_ZONE_DRIVE_STAT=' + json.dumps(item, sort_keys=True, default=str))
          PY
