name: WNBA Step 16D controlled production activation certification

on:
  push:
    branches:
      - wnba-step16d-controlled-production-activation-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"
  WNBA_STEP12_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
  KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Step 16D branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: Assert continuous production runtime remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API plus persistence dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-persistence.txt

      - name: Compile Step 16D activation surface
        run: |
          python -m py_compile sports_api/wnba_step16d_controlled_production_activation.py
          python -m py_compile tests/test_wnba_step16d_controlled_production_activation.py
          python -m py_compile sports_api/tools/wnba_step16d_controlled_production_activation_cert.py

      - name: Run Step 16D controlled activation guards
        run: PYTHONPATH=. python tests/test_wnba_step16d_controlled_production_activation.py

      - name: Require protected PostgreSQL secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KYRE_DATABASE_URL:-}" ]; then
            echo '::error::KYRE_DATABASE_URL repository secret is not configured; Step 16D fails closed.'
            exit 86
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ['KYRE_DATABASE_URL']
          parsed = urlsplit(value)
          assert parsed.scheme.lower() in {'postgres','postgresql'}
          assert parsed.hostname and parsed.path not in {'','/'}
          print('STEP16D_PROTECTED_DATABASE_SECRET_PRESENT_REDACTED_OK')
          PY

      - name: Run frozen Step 16C and Step 16B guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step16c_live_postgres_canary.py
          PYTHONPATH=. python tests/test_wnba_step16b_production_packaging_lifecycle.py

      - name: Run frozen Step 16A guards at exact parent SHA
        shell: bash
        run: |
          set -euo pipefail
          STEP16A_FROZEN_SHA='4ea88aa9a54f5110a03e9e4374219ed15ab30def'
          rm -rf /tmp/wnba-step16a-parent
          git worktree add --detach /tmp/wnba-step16a-parent "$STEP16A_FROZEN_SHA"
          (cd /tmp/wnba-step16a-parent && PYTHONPATH=. python tests/test_wnba_step16a_production_activation_contract.py)
          git worktree remove /tmp/wnba-step16a-parent --force

      - name: Run frozen Step 15C through Step 15A guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step15_live_persistence_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step15b_live_adapter_transaction_smoke.py
          PYTHONPATH=. python tests/test_wnba_step15a_live_postgres_preflight.py

      - name: Run frozen Step 14D through Step 14A guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step14_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step14c_durable_restart_lease.py
          PYTHONPATH=. python tests/test_wnba_step14b_database_checkpoint_adapter.py
          PYTHONPATH=. python tests/test_wnba_step14a_persistence_contract.py

      - name: Run frozen Step 13D through Step 13A guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step13_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step13c_reliability_recovery.py
          PYTHONPATH=. python tests/test_wnba_step13b_runtime_supervisor.py
          PYTHONPATH=. python tests/test_wnba_step13a_bounded_scheduler.py

      - name: Run frozen Step 12D through Step 12A guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        run: |
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 16C head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP16C_FROZEN_SHA='1de22beb83cad2f0c3bae3bc6ab845b5f3d2a4e3'
          git merge-base --is-ancestor "$STEP16C_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP16C_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only approved Step 16D files changed
        shell: bash
        run: |
          set -euo pipefail
          STEP16C_FROZEN_SHA='1de22beb83cad2f0c3bae3bc6ab845b5f3d2a4e3'
          git diff --name-only "$STEP16C_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step16d_controlled_production_activation.py|\
              tests/test_wnba_step16d_controlled_production_activation.py|\
              sports_api/tools/wnba_step16d_controlled_production_activation_cert.py|\
              .github/workflows/wnba-step-16d-controlled-production-activation-cert.yml)
                ;;
              *) echo "Unexpected post-Step16C file drift: $path" >&2; exit 1 ;;
            esac
          done
          test "$(git diff --name-only "$STEP16C_FROZEN_SHA" HEAD | wc -l | tr -d ' ')" = '4'

      - name: Prove frozen Docker and persistence packaging are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object sports_api/Dockerfile)" = '324defd214f334c372f3b0b2dcafd958c962a6aa'
          test "$(git hash-object sports_api/requirements-persistence.txt)" = '46331822d0a55f5a4983d289c73a45ea9745ca89'

      - name: Build exact production Docker image at certified revision
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg WNBA_RELEASE_REVISION="$GITHUB_SHA" \
            --build-arg WNBA_RELEASE_ID="wnba-step16d-controlled-activation" \
            -f sports_api/Dockerfile \
            -t "kyre-step16d:$GITHUB_SHA" .
          docker inspect "kyre-step16d:$GITHUB_SHA" >/dev/null

      - name: Run two-cycle direct psycopg controlled activation inside production image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p step16d-out
          chmod 777 step16d-out
          docker run --rm \
            -e KYRE_DATABASE_URL \
            -e WNBA_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED=true \
            -e WNBA_STEP16D_EXPECTED_REVISION="$GITHUB_SHA" \
            -v "$PWD/step16d-out:/output" \
            --entrypoint python \
            "kyre-step16d:$GITHUB_SHA" \
            -m sports_api.wnba_step16d_controlled_production_activation \
            /output/step16d-controlled-production-activation-live-result.json

      - name: Validate live activation result without database secret
        shell: bash
        env:
          KYRE_DATABASE_URL: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from sports_api import wnba_step16d_controlled_production_activation as s16d
          path = Path('step16d-out/step16d-controlled-production-activation-live-result.json')
          result = s16d.validate_live_activation_result(json.loads(path.read_text()))
          assert result['activation']['direct_psycopg_live_connection'] is True
          assert result['cycles']['cycle_2_recovered_from_checkpoint'] is True
          assert result['cleanup']['canary_residue_zero'] is True
          assert all(value is False for value in result['safety'].values())
          print('STEP16D_LIVE_RESULT_REDACTED_VALIDATED_OK', result['result_content_sha256'])
          PY

      - name: Generate Step 16D certification
        shell: bash
        env:
          KYRE_DATABASE_URL: ""
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m sports_api.tools.wnba_step16d_controlled_production_activation_cert \
            --live-result step16d-out/step16d-controlled-production-activation-live-result.json \
            --output step16d-controlled-production-activation-cert.json

      - name: Upload Step 16D certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step16d-controlled-production-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            step16d-controlled-production-activation-cert.json
            step16d-out/step16d-controlled-production-activation-live-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert continuous production runtime remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
