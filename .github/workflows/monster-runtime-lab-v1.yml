name: Monster Runtime Lab V1

on:
  pull_request:
    branches: [main]
    paths:
      - "sports_api/monster_runtime_replay_v1.py"
      - "sports_api/monster_runtime_capture_v1.py"
      - "sports_api/monster_runtime_trace_v1.py"
      - "sports_api/monster_incident_autopacket_v1.py"
      - "sports_api/monster_targeted_fix_planner_v1.py"
      - "sports_api/monster_runtime_lab_v1.py"
      - "tests/test_monster_runtime_replay_v1.py"
      - "tests/test_monster_runtime_capture_v1.py"
      - "tests/test_monster_runtime_trace_v1.py"
      - "tests/test_monster_incident_autopacket_v1.py"
      - "tests/test_monster_targeted_fix_planner_v1.py"
      - "tests/test_monster_runtime_lab_v1.py"
      - ".github/workflows/monster-runtime-lab-v1.yml"
  push:
    branches: [main]
    paths:
      - "sports_api/monster_runtime_replay_v1.py"
      - "sports_api/monster_runtime_capture_v1.py"
      - "sports_api/monster_runtime_trace_v1.py"
      - "sports_api/monster_incident_autopacket_v1.py"
      - "sports_api/monster_targeted_fix_planner_v1.py"
      - "sports_api/monster_runtime_lab_v1.py"
      - "tests/test_monster_runtime_replay_v1.py"
      - "tests/test_monster_runtime_capture_v1.py"
      - "tests/test_monster_runtime_trace_v1.py"
      - "tests/test_monster_incident_autopacket_v1.py"
      - "tests/test_monster_targeted_fix_planner_v1.py"
      - "tests/test_monster_runtime_lab_v1.py"
      - ".github/workflows/monster-runtime-lab-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-runtime-lab-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install Runtime Lab dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright

      - name: Compile Runtime Lab
        run: |
          python -m py_compile \
            sports_api/monster_runtime_replay_v1.py \
            sports_api/monster_runtime_capture_v1.py \
            sports_api/monster_runtime_trace_v1.py \
            sports_api/monster_incident_autopacket_v1.py \
            sports_api/monster_targeted_fix_planner_v1.py \
            sports_api/monster_runtime_lab_v1.py

      - name: Run Runtime Lab contracts
        run: |
          python -m pytest -q \
            tests/test_monster_runtime_replay_v1.py \
            tests/test_monster_runtime_capture_v1.py \
            tests/test_monster_runtime_trace_v1.py \
            tests/test_monster_incident_autopacket_v1.py \
            tests/test_monster_targeted_fix_planner_v1.py \
            tests/test_monster_runtime_lab_v1.py

      - name: Replay the exact CFB protected 503 incident
        run: |
          python -m sports_api.monster_runtime_lab_v1 \
            --scenario 503 \
            --target devsystem/production_verify_v1.py \
            --sport CFB \
            --title "CFB verifier protected 503" \
            --symptom "generic helper raises before caller-specific protected 503 body contract" \
            --json > /tmp/runtime-lab-503.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/runtime-lab-503.json').read_text())
          assert report['version'] == 'MONSTER_RUNTIME_LAB_V1'
          assert report['status'] == 'READY_TO_PATCH'
          assert report['reproduction']['legacy_helper']['outcome'] == 'raised_http_error'
          assert report['reproduction']['legacy_helper']['status_code'] == 503
          assert report['reproduction']['body_aware_helper']['outcome'] == 'returned'
          assert report['reproduction']['body_aware_helper']['status_code'] == 503
          plan = report['fix_plan']
          assert plan['status'] == 'PLAN_READY'
          assert plan['root_cause_confidence'] == 'HIGH'
          assert 'devsystem/production_verify_v1.py' in plan['edit_candidates']
          assert 'tests/test_devsystem_production_verify_v1.py' in plan['edit_candidates']
          assert 'cfb-critical' in plan['required_tests']
          assert 'browser-qa' in plan['required_tests']
          assert 'devsystem-final-gate' in plan['required_tests']
          assert report['protections']['projection_weight'] == 0.0
          assert report['protections']['network_calls'] is False
          assert report['protections']['auto_fix'] is False
          print('runtime-lab exact-503 replay: READY_TO_PATCH')
          PY

      - name: Rerun the real PR 440 production-verifier regression suite
        run: |
          python -m pytest -q tests/test_devsystem_production_verify_v1.py

      - name: Prove Runtime Lab remains outside production entrypoints
        run: |
          python - <<'PY'
          from sports_api.monster_dependency_map_v1 import build_dependency_map

          graph = build_dependency_map('.')
          targets = [
              'sports_api/monster_runtime_replay_v1.py',
              'sports_api/monster_runtime_capture_v1.py',
              'sports_api/monster_runtime_trace_v1.py',
              'sports_api/monster_incident_autopacket_v1.py',
              'sports_api/monster_targeted_fix_planner_v1.py',
              'sports_api/monster_runtime_lab_v1.py',
          ]
          for target in targets:
              report = graph.impact_report(target)
              assert report['status'] == 'OK', target
              assert report['impacted_entrypoints'] == [], (target, report['impacted_entrypoints'])
              print(target, 'blast_radius=', report['blast_radius'], 'entrypoints=[]')
          PY

      - name: Run existing Monster one-command certification
        run: |
          python -m sports_api.monster_certification_v1 --json > /tmp/monster-cert.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/monster-cert.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['failed_check_count'] == 0
          print('monster-certification:', receipt['passed_check_count'], '/', receipt['required_check_count'])
          PY

      - name: Prove Runtime Lab safety constants
        run: |
          python - <<'PY'
          from sports_api.monster_runtime_lab_v1 import (
              AUTO_FIX,
              FUZZY_MATCHING,
              MAY_MODIFY_PROJECTION,
              MAY_MODIFY_RUNTIME,
              MAY_MODIFY_SOURCE_DATA,
              NETWORK_CALLS,
              PROJECTION_WEIGHT,
          )
          assert PROJECTION_WEIGHT == 0.0
          assert MAY_MODIFY_PROJECTION is False
          assert MAY_MODIFY_SOURCE_DATA is False
          assert MAY_MODIFY_RUNTIME is False
          assert NETWORK_CALLS is False
          assert AUTO_FIX is False
          assert FUZZY_MATCHING is False
          print('Runtime Lab is read-only and network-free by default')
          PY
