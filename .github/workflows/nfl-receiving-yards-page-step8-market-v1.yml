name: NFL Receiving Yards Page Step 8 Market V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_receiving_yards_market_api_v1.py"
      - "nfl_receiving_yards_hub_v8.py"
      - "streamlit_memory_lazy_router_v119.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_step8_market_v1.py"
      - ".github/workflows/nfl-receiving-yards-page-step8-market-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-step8-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests

      - name: Compile Step 8 surface
        run: |
          python -m py_compile \
            nfl_receiving_yards_market_api_v1.py \
            nfl_receiving_yards_hub_v8.py \
            streamlit_memory_lazy_router_v119.py \
            app.py

      - name: Prove frozen Receiving projection owners were not modified
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_receiving_yards_projection_v1\.py$|nfl_receiving_yards_hub_v[1-7]\.py$|streamlit_memory_lazy_router_v118\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "STEP8_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "STEP8_FROZEN_OWNER_GUARD_GREEN"

      - name: Run Step 8 market contracts
        run: python -m pytest -q tests/test_nfl_receiving_yards_step8_market_v1.py

      - name: Prove sportsbook remains display-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          client = Path("nfl_receiving_yards_market_api_v1.py").read_text(encoding="utf-8")
          hub = Path("nfl_receiving_yards_hub_v8.py").read_text(encoding="utf-8")
          assert '"projection_weight": 0.0' in client
          assert '"may_modify_projection": False' in client
          assert 'NO_PROJECTION_LABEL = "NO PROJECTION"' in hub
          assert "SPORTSBOOK_PROJECTION_INFLUENCE = 0.0" in hub
          print("NFL_RECEIVING_YARDS_STEP8_MARKET_ISOLATION_GREEN")
          PY
