name: NFL Passing Yards Matchup Intelligence Step 3 V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-matchup-intelligence-step3-v1.yml"
      - "nfl_passing_yards_hub_v72.py"
      - "streamlit_memory_lazy_router_v223.py"
      - "app.py"
      - "tests/test_passing_yards_matchup_intelligence_step3_v1.py"
      - "devsystem/task_ledgers/passing-yards-matchup-intelligence-step3-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-matchup-intelligence-step3-v1.yml"
      - "nfl_passing_yards_hub_v72.py"
      - "streamlit_memory_lazy_router_v223.py"
      - "app.py"
      - "tests/test_passing_yards_matchup_intelligence_step3_v1.py"
      - "devsystem/task_ledgers/passing-yards-matchup-intelligence-step3-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-matchup-intelligence-step3-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 3 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-matchup-intelligence-step3-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-matchup-intelligence-step3-v1.json
          nfl_passing_yards_hub_v72.py
          streamlit_memory_lazy_router_v223.py
          tests/test_passing_yards_matchup_intelligence_step3_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_SCOPE_GREEN"

      - name: Prove Steps 1-2 and cleanup remain frozen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" --             nfl_passing_yards_hub_v71.py             streamlit_memory_lazy_router_v222.py             devsystem/task_ledgers/passing-yards-data-starter-truth-step1-v1.json             devsystem/task_ledgers/passing-yards-projection-explainability-step2-v1.json             devsystem/task_ledgers/passing-yards-step2-stable-runtime-markers-v1.json             devsystem/task_ledgers/passing-yards-mobile-cleanup-steps4-5-closeout-v1.json
          echo "PASSING_YARDS_STEPS1_2_FROZEN_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test matchup intelligence contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_passing_yards_hub_v72.py streamlit_memory_lazy_router_v223.py
          python -m pytest -q tests/test_passing_yards_matchup_intelligence_step3_v1.py
          python - <<'PY'
          from pathlib import Path
          import json
          import nfl_passing_yards_hub_v72 as v72
          import streamlit_memory_lazy_router_v223 as v223

          ledger=json.loads(Path("devsystem/task_ledgers/passing-yards-matchup-intelligence-step3-v1.json").read_text())
          assert ledger["status"] == "DONE"
          assert ledger["step3_status"] == "DONE"
          assert ledger["sportsbook_projection_influence"] == 0.0

          source=Path("nfl_passing_yards_hub_v72.py").read_text()
          required=[
              'FROZEN_PRIOR = "nfl_passing_yards_hub_v71"',
              'MATCHUP_INTELLIGENCE_VERSION = "v72"',
              'NEW_PHASE_STEP = 3',
              'PRESENTATION_ONLY = True',
              'MAY_MODIFY_PROJECTION = False',
              'MAY_MODIFY_CONTEXT_MATH = False',
              'MAY_MODIFY_PROBABILITY = False',
              'MAY_MODIFY_MARKET_MATH = False',
              'MAY_MODIFY_DATA = False',
              'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
              'data-passing-yards-matchup-intelligence="v72"',
              'data-passing-yards-v223-runtime="matchup-intelligence-step3"',
              'Coverage tendency',
              'Explosive passes allowed',
              'UNAVAILABLE — NOT SYNTHESIZED',
              'Volume / game-script signal:',
          ]
          for token in required:
              assert token in source, token

          for forbidden in ("build_baseline_projection(", "build_distribution(", "evaluate_market(", "requests.get("):
              assert forbidden not in source, forbidden

          assert v223.FROZEN_ROUTER == "streamlit_memory_lazy_router_v222"
          assert v223.PASSING_HUB == "nfl_passing_yards_hub_v72"
          app=Path("app.py").read_text()
          assert "from streamlit_memory_lazy_router_v223 import record_bootstrap_import_ms, render_app" in app
          print("PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_STATIC_GREEN")
          PY

  branch-matchup-intelligence-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-matchup-intelligence-step3
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-matchup-intelligence-step3/streamlit.log 2>&1 &
          echo $! > /tmp/py_step3_pid

      - name: Prove Step 3 at phone tablet desktop
        run: |
          python - <<'PY'
          import time
          from urllib.parse import parse_qs, urlencode, urlparse
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          expected_date="2026-09-24"
          expected_matchup="Atlanta Falcons @ Green Bay Packers"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":expected_date,
              "ks_py_matchup":expected_matchup,
              "ks_qb_slot":"2",
          })

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("MATCHUP_INTELLIGENCE_LOCAL_STREAMLIT_NOT_READY")

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2200))
                  except Exception: pass
              return "\n".join(out)

          def find(page,selector,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000])
                      raise RuntimeError("MATCHUP_INTELLIGENCE_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(400)
              raise RuntimeError("MATCHUP_INTELLIGENCE_SELECTOR_NOT_READY:"+selector)

          def find_back(page,timeout=40):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role("button",name="← Back to Quarterbacks",exact=True)
                          if loc.count()==1: return frame,loc
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("MATCHUP_INTELLIGENCE_BACK_NOT_READY")

          def certify(page,width,height):
              page.set_viewport_size({"width":width,"height":height})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "TypeError" not in body and "Traceback" not in body
              assert root.get_attribute("data-passing-yards-explainability-ready")=="v71"
              assert root.get_attribute("data-passing-yards-matchup-intelligence-ready")=="v72"

              step2=root.locator('[data-passing-yards-projection-explainability="v71"]')
              assert step2.count()==1
              assert step2.get_attribute("data-passing-yards-mobile-cleanup-runtime")=="v70"
              assert step2.get_attribute("data-passing-yards-v222-runtime")=="projection-explainability-step2"

              panel=root.locator('[data-passing-yards-matchup-intelligence="v72"]')
              assert panel.count()==1
              assert panel.get_attribute("data-passing-yards-v223-runtime")=="matchup-intelligence-step3"
              assert panel.locator('[data-matchup-hero]').count()==4
              assert panel.locator('[data-matchup-intelligence-field]').count()==8
              assert panel.locator('[data-matchup-game-script="v72"]').count()==1

              text=panel.inner_text(timeout=5000)
              for label in (
                  "Matchup intelligence",
                  "Pass Defense Rank",
                  "Pass Yds Allowed/G",
                  "Defense Sack Rate",
                  "Expected Attempts",
                  "Opponent attempts allowed",
                  "Opponent completion allowed",
                  "Opponent Y/A allowed",
                  "Recent 3 pass yards allowed",
                  "Pressure state",
                  "Blitz context",
                  "Coverage tendency",
                  "Explosive passes allowed",
                  "Volume / game-script signal",
              ):
                  assert label.casefold() in text.casefold(), (label,text)

              hero=[v.strip() for v in panel.locator('[data-matchup-hero] b').all_inner_texts()]
              assert len(hero)==4,hero
              assert hero[1] and hero[1]!="—",hero
              assert hero[2] and hero[2]!="—",hero
              assert hero[3] and hero[3]!="—",hero

              clean_projection=root.locator('[data-passing-yards-clean-detail="projection"]')
              assert clean_projection.count()==1
              assert step2.bounding_box()["y"] <= panel.bounding_box()["y"] <= clean_projection.bounding_box()["y"]

              dims=frame.locator("body").evaluate("""e => ({
                bodyScroll:e.scrollWidth,
                docScroll:document.documentElement.scrollWidth,
                viewport:window.innerWidth
              })""")
              assert dims["bodyScroll"] <= dims["viewport"] + 2,dims
              assert dims["docScroll"] <= dims["viewport"] + 2,dims

              _,back=find_back(page)
              back.click()
              picker_frame,picker=find(page,'[data-passing-yards-selection-screen="v58"]',timeout=120)
              assert picker.locator('a[data-qb-select]').count()==2
              href=picker_frame.evaluate("() => window.location.href")
              qs=parse_qs(urlparse(href).query)
              assert "ks_qb_slot" not in qs,qs
              assert qs.get("ks_py_date")==[expected_date],qs
              mv=(qs.get("ks_py_matchup") or [""])[0].split(" • ",1)[0].strip()
              assert mv==expected_matchup,qs
              print(f"PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_{width}_GREEN")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              certify(page,390,844)
              certify(page,768,1024)
              certify(page,1440,1000)
              print("PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_BRANCH_GREEN")
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 600 artifacts/passing-yards-matchup-intelligence-step3/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/py_step3_pid ]; then kill "$(cat /tmp/py_step3_pid)" 2>/dev/null || true; fi

  public-matchup-intelligence-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Allow Streamlit deployment to publish
        run: sleep 120

      - name: Prove public matchup intelligence and freeze Step 3
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          })

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2500))
                  except Exception: pass
              return "\n".join(out)

          def find(page,selector,timeout=210):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000])
                      raise RuntimeError("MATCHUP_INTELLIGENCE_PUBLIC_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(500)
              raise RuntimeError("MATCHUP_INTELLIGENCE_PUBLIC_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "TypeError" not in body and "Traceback" not in body
              assert root.get_attribute("data-passing-yards-explainability-ready")=="v71"
              assert root.get_attribute("data-passing-yards-matchup-intelligence-ready")=="v72"

              step2=root.locator('[data-passing-yards-projection-explainability="v71"]')
              assert step2.count()==1
              assert step2.get_attribute("data-passing-yards-mobile-cleanup-runtime")=="v70"
              assert step2.get_attribute("data-passing-yards-v222-runtime")=="projection-explainability-step2"

              panel=root.locator('[data-passing-yards-matchup-intelligence="v72"]')
              assert panel.count()==1
              assert panel.get_attribute("data-passing-yards-v223-runtime")=="matchup-intelligence-step3"
              assert panel.locator('[data-matchup-hero]').count()==4
              assert panel.locator('[data-matchup-intelligence-field]').count()==8
              assert panel.locator('[data-matchup-game-script="v72"]').count()==1

              text=panel.inner_text(timeout=5000)
              for label in (
                  "Pass Defense Rank",
                  "Pass Yds Allowed/G",
                  "Defense Sack Rate",
                  "Expected Attempts",
                  "Pressure state",
                  "Blitz context",
                  "Coverage tendency",
                  "Explosive passes allowed",
                  "Volume / game-script signal",
              ):
                  assert label.casefold() in text.casefold(), (label,text)

              hero=[v.strip() for v in panel.locator('[data-matchup-hero] b').all_inner_texts()]
              assert len(hero)==4,hero
              assert hero[1] and hero[1]!="—",hero
              assert hero[2] and hero[2]!="—",hero
              assert hero[3] and hero[3]!="—",hero

              dims=frame.locator("body").evaluate("""e => ({
                bodyScroll:e.scrollWidth,
                docScroll:document.documentElement.scrollWidth,
                viewport:window.innerWidth
              })""")
              assert dims["bodyScroll"] <= dims["viewport"] + 2,dims
              assert dims["docScroll"] <= dims["viewport"] + 2,dims
              print("PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_PUBLIC_GREEN")
              print("PASSING_YARDS_MATCHUP_INTELLIGENCE_STEP3_FROZEN_GREEN")
              browser.close()
          PY
