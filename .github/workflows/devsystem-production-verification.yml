name: DevSystem production verification

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "streamlit_*.py"
      - "mlb_*.py"
      - "wnba_*.py"
      - "cfb_*.py"
      - "nfl_*.py"
      - "nba_*.py"
      - "nhl_*.py"
      - "soccer_*.py"
      - "sports_api/**"
      - "data/**"
      - "requirements*.txt"
      - "devsystem/production_verify_v1.py"
      - "devsystem/production_identity_verify_v1.py"
      - "devsystem/production_targets_v1.json"
      - "devsystem/devsystem_manifest_v1.json"
      - "devsystem/change_classifier_v1.py"
      - "devsystem/permanent_gate_v1.py"
      - "devsystem/final_gate_v1.py"
      - ".github/workflows/devsystem-production-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsystem-production-main
  cancel-in-progress: true

jobs:
  production-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests pytest playwright
          python -m playwright install --with-deps chromium

      - name: Self-test production verification contract
        run: python -m pytest -q tests/test_devsystem_production_verify_v1.py tests/test_devsystem_production_identity_verify_v1.py

      - name: Verify immutable Render production identity
        run: python devsystem/production_identity_verify_v1.py

      - name: Verify deployed Streamlit and Render API
        run: |
          python devsystem/production_verify_v1.py \
            --artifact-dir artifacts/production-verification

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsystem-production-verification-${{ github.run_id }}
          path: artifacts/production-verification
          if-no-files-found: warn
          retention-days: 7
