name: MLB Step14C durable restart lease certification

on:
  push:
    branches:
      - mlb-step14c-durable-restart-lease
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP14C_BASE_SHA: 195df0c15de1998754204080f9db4a76bca74e4b

jobs:
  certify-durable-restart-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Assert Step14C is exactly four-file additive MLB scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP14C_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/mlb_step14c_durable_restart_lease_v1.py|sports_api/sql/mlb_step14c_runtime_lease_schema.sql|tests/test_mlb_step14c_durable_restart_lease_v1.py|\.github/workflows/mlb-step14c-durable-restart-lease-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP14C_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 4 ]; then
            echo "STEP14C_EXPECTED_EXACTLY_FOUR_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP14C_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          git diff --check "$STEP14C_BASE_SHA"...HEAD
          numstat="$(git diff --numstat "$STEP14C_BASE_SHA"...HEAD)"
          printf '%s\n' "$numstat"
          if printf '%s\n' "$numstat" | awk '$2 != 0 { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'STEP14C_DELETIONS_FORBIDDEN'
            exit 1
          fi
          echo 'MLB_STEP14C_FOUR_FILE_ADDITIVE_SCOPE_OK'

      - name: Prove Step14B Step14A Step13 and frozen production paths remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP14C_BASE_SHA"...HEAD -- \
            app.py engine.py history.py spread_engine.py \
            live_game_hub_v182.py live_game_hub_v19.py live_game_hub_v191.py \
            live_game_hub_v192.py live_game_hub_v1921.py mlb_live_hub_v193.py live_odds_feed.py \
            sports_api/main.py sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/collectors/mlb_fanduel_inplay.py \
            sports_api/collectors/mlb_draftkings_provider.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/mlb_step9g_postfreeze_handoff_v1.py \
            sports_api/mlb_step10a_live_snapshot_persistence_contract_v1.py \
            sports_api/database/mlb_live_snapshot_store.py \
            sports_api/database/mlb_live_snapshot_recovery.py \
            sports_api/mlb_step10_final_persistence_freeze_v1.py \
            sports_api/mlb_step11a_provider_contract_v1.py \
            sports_api/mlb_step11c_multi_provider_shadow_board_v1.py \
            sports_api/mlb_step11d_provider_consensus_failover_shadow_policy_v1.py \
            sports_api/mlb_step11_final_provider_expansion_freeze_v1.py \
            sports_api/mlb_step12a_shadow_runtime_runner_v1.py \
            sports_api/mlb_step12b_live_runtime_assembly_v1.py \
            sports_api/mlb_step12c_live_board_runtime_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py \
            sports_api/mlb_step13_final_scheduler_freeze_v1.py \
            sports_api/mlb_step14a_persistence_contract_v1.py \
            sports_api/sql/mlb_step14a_persistence_schema.sql \
            sports_api/mlb_step14b_database_checkpoint_adapter_v1.py \
            sports_api/requirements-mlb-step14b-persistence.txt
          echo 'MLB_STEP14C_ALL_FROZEN_PARENT_AND_PRODUCTION_PATHS_BYTE_IDENTICAL'

      - name: Prove exact Step14B source and Step14C lease schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$STEP14C_BASE_SHA:sports_api/mlb_step14b_database_checkpoint_adapter_v1.py")" = 'ee7ffe3117edc33b1377f883c25613d63760095b'
          echo '9c113b0a6ae4c9f73c10e2d664b96c9130861b6a9cc3cbda1d2b9932c10c9190  sports_api/sql/mlb_step14c_runtime_lease_schema.sql' | sha256sum -c -
          echo 'MLB_STEP14C_PARENT_AND_LEASE_SCHEMA_EXACT'

      - name: Assert isolated lease layer has no provider background or schema-auto-apply machinery
        shell: bash
        run: |
          set -euo pipefail
          file='sports_api/mlb_step14c_durable_restart_lease_v1.py'
          if grep -Ein '^[[:space:]]*(from|import)[[:space:]]+(requests|httpx|urllib|socket|threading|multiprocessing|apscheduler|supabase)([[:space:].]|$)' "$file"; then
            echo 'STEP14C_FORBIDDEN_PROVIDER_OR_BACKGROUND_IMPORT'
            exit 1
          fi
          if grep -Ein 'time\.sleep|asyncio\.create_task|threading\.Thread|multiprocessing\.|subprocess\.|os\.system|Popen\(' "$file"; then
            echo 'STEP14C_FORBIDDEN_BACKGROUND_EXECUTION'
            exit 1
          fi
          if grep -Ein 'CREATE[[:space:]]+(TABLE|SCHEMA)|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE' "$file"; then
            echo 'STEP14C_SCHEMA_AUTO_APPLY_FORBIDDEN'
            exit 1
          fi
          echo 'MLB_STEP14C_ISOLATED_DURABLE_LEASE_SAFETY_OK'

      - name: Assert lease DDL is additive only
        shell: bash
        run: |
          set -euo pipefail
          file='sports_api/sql/mlb_step14c_runtime_lease_schema.sql'
          grep -F 'CREATE TABLE IF NOT EXISTS kyre_runtime.mlb_runtime_leases' "$file"
          if grep -Ein 'ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM' "$file"; then
            echo 'STEP14C_LEASE_DDL_DESTRUCTIVE_OPERATION_FORBIDDEN'
            exit 1
          fi
          if grep -F 'CREATE TABLE IF NOT EXISTS kyre_runtime.mlb_runtime_checkpoints' "$file"; then
            echo 'STEP14C_CHECKPOINT_TABLE_REDEFINITION_FORBIDDEN'
            exit 1
          fi
          echo 'MLB_STEP14C_ADDITIVE_LEASE_DDL_OK'

      - name: Compile Step14C Python
        run: |
          python -m py_compile \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            tests/test_mlb_step14c_durable_restart_lease_v1.py

      - name: Run Step14C targeted tests
        run: python -m pytest -q tests/test_mlb_step14c_durable_restart_lease_v1.py

      - name: Run complete MLB regression including Step14C
        run: python -m pytest -q tests/test_mlb_*.py

      - name: Certify durable restart lease fencing and checkpoint CAS
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mlb_step14c_durable_restart_lease_v1.py -k 'fresh_restart_context_acquires_lease_then_returns_version_zero or recovered_restart_context_restores_exact_step14a_state or acquire_duplicate_unexpired_lease_fails_closed or lost_lease_fences_checkpoint_persist_before_database_save or stale_context_cas_conflict_fails_closed or recovered_checkpoint_persist_advances_exactly_one_version'
          python - <<'PY'
          from sports_api.mlb_step14c_durable_restart_lease_v1 import (
              FINAL_CERTIFICATION_MARKER,
              STEP14B_MERGE_SHA,
              STEP14B_SOURCE_BLOB_SHA,
              STEP14C_BASE_MAIN_SHA,
              durable_restart_lease_manifest,
              validate_durable_restart_lease_manifest,
          )

          manifest = durable_restart_lease_manifest()
          assert validate_durable_restart_lease_manifest(manifest)['manifest_valid'] is True
          assert STEP14C_BASE_MAIN_SHA == '195df0c15de1998754204080f9db4a76bca74e4b'
          assert STEP14B_MERGE_SHA == STEP14C_BASE_MAIN_SHA
          assert STEP14B_SOURCE_BLOB_SHA == 'ee7ffe3117edc33b1377f883c25613d63760095b'
          assert manifest['runtime_mode'] == 'SHADOW_ONLY'
          assert manifest['durable_restart_recovery_allowed'] is True
          assert manifest['durable_distributed_lease_allowed'] is True
          assert manifest['cross_process_duplicate_run_guard_allowed'] is True
          assert manifest['monotonic_fencing_generation_required'] is True
          assert manifest['lease_revalidation_before_checkpoint_save_required'] is True
          assert manifest['checkpoint_compare_and_swap_required'] is True
          assert manifest['persistence_runtime_enabled'] is False
          assert manifest['automatic_restart_execution_allowed'] is False
          assert manifest['production_activation_allowed'] is False
          assert manifest['runtime_cycle_execution_added_by_step14c'] is False
          assert manifest['retry_execution_added_by_step14c'] is False
          assert manifest['restart_execution_added_by_step14c'] is False
          assert manifest['provider_network_calls_added_by_step14c'] is False
          assert manifest['sportsbook_network_calls_added_by_step14c'] is False

          print('STEP14C_FRESH_RESTART_CONTEXT=1')
          print('STEP14C_DURABLE_CHECKPOINT_RESTORE=1')
          print('STEP14C_DUPLICATE_LEASE_REFUSED=1')
          print('STEP14C_FENCING_GENERATION_REQUIRED=1')
          print('STEP14C_LOST_LEASE_FENCES_SAVE=1')
          print('STEP14C_CHECKPOINT_CAS_CONFLICT_FAIL_CLOSED=1')
          print('STEP14C_CHECKPOINT_ADVANCE_UNDER_LEASE=1')
          print('STEP14C_LIVE_DATABASE_CONNECTIONS=0')
          print('STEP14C_PROVIDER_NETWORK_CALLS=0')
          print('STEP14C_SPORTSBOOK_NETWORK_CALLS=0')
          print('STEP14C_RUNTIME_EXECUTIONS=0')
          print('STEP14C_RETRY_EXECUTIONS=0')
          print('STEP14C_RESTART_EXECUTIONS=0')
          print('STEP14C_PRODUCTION_ACTIVATION=0')
          print(FINAL_CERTIFICATION_MARKER)
          PY

      - name: Final Step14C certification marker
        run: echo 'MLB_STEP14C_DURABLE_RESTART_LEASE_GREEN'
