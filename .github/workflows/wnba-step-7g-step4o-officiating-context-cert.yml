name: WNBA Step 7G v11 officiating promoted seal

on:
  push:
    branches:
      - wnba-step7g-step4j-team-history-20260827
    paths:
      - '.github/workflows/wnba-step-7g-step4o-officiating-context-cert.yml'
      - 'sports_api/wnba_step7g_first_party_officiating.py'
      - 'sports_api/wnba_step7g_first_party_integration.py'
      - 'sports_api/wnba_step7g_first_party_rosters.py'
      - 'sports_api/wnba_step7g_first_party_injury_report.py'
      - 'sports_api/wnba_step7g_first_party_injury_report_coordinate.py'
      - 'sports_api/wnba_step7g_first_party_shot_context_identity_safe.py'
      - 'sports_api/wnba_step7g_first_party_advanced_stats_contract_safe.py'
      - 'sports_api/tools/wnba_step7g_v11_officiating_seal.py'
      - 'tests/test_wnba_step7g_first_party_officiating.py'
      - 'tests/test_wnba_step7g_first_party_integration.py'
      - 'tests/test_wnba_step7g_first_party_rosters.py'
      - 'tests/test_wnba_step7g_first_party_injury_report.py'
      - 'tests/test_wnba_step7g_first_party_injury_report_coordinate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step7g-v11-officiating-promoted-seal
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Step 7G branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert every production switch OFF and Step 7G CI-only ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile promoted v11 integration tests and seal
        shell: bash
        run: |
          python -m py_compile sports_api/wnba_step7g_first_party_officiating.py
          python -m py_compile sports_api/wnba_step7g_first_party_integration.py
          python -m py_compile sports_api/wnba_step7g_first_party_rosters.py
          python -m py_compile sports_api/wnba_step7g_first_party_injury_report.py
          python -m py_compile sports_api/wnba_step7g_first_party_injury_report_coordinate.py
          python -m py_compile sports_api/tools/wnba_step7g_v11_officiating_seal.py
          python -m py_compile tests/test_wnba_step7g_first_party_officiating.py
          python -m py_compile tests/test_wnba_step7g_first_party_integration.py
          python -m py_compile tests/test_wnba_step7g_first_party_rosters.py
          python -m py_compile tests/test_wnba_step7g_first_party_injury_report.py
          python -m py_compile tests/test_wnba_step7g_first_party_injury_report_coordinate.py

      - name: Run promoted v11 fail-closed regressions
        shell: bash
        run: |
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_officiating.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_integration.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_rosters.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_injury_report.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_injury_report_coordinate.py

      - name: Prove frozen Step 4O 4F 4L 4W 4X chain unchanged
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA='368dbde84ea0aa6f570703688ae899285ecd7cfc'
          git fetch origin wnba-step7g-official-data-preflight-20260827 --depth=1
          ACTUAL_BASE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          git diff --exit-code "$EXPECTED_BASE_SHA" -- \
            sports_api/wnba_officiating_context.py \
            sports_api/wnba_advanced_stats.py \
            sports_api/wnba_shot_context.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_model_input_readiness.py \
            sports_api/wnba_availability.py \
            sports_api/wnba_schedule.py \
            sports_api/wnba_schedule_context.py \
            sports_api/wnba_team_history.py \
            sports_api/wnba_player_event_features.py \
            sports_api/wnba_player_opportunity_context.py \
            sports_api/wnba_event_lineup_context.py \
            sports_api/wnba_rotation_context.py

      - name: Seal promoted v11 through real FastAPI defaults
        shell: bash
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step7g_v11_officiating_seal

      - name: Upload sanitized promoted v11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-v11-officiating-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-v11-officiating-seal.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-assert every production switch OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
