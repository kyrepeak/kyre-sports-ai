name: MLB Postseason Step 4 public freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'devsystem/mlb_postseason_public_freeze_v1.py'
      - 'devsystem/task_ledgers/mlb-postseason-step4-public-freeze-v1.json'
      - '.github/workflows/mlb-postseason-step4-public-freeze-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-postseason-step4-public-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up public browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore shared Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build shared Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser QA virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Compile public freeze verifier
        run: python -m py_compile devsystem/mlb_postseason_public_freeze_v1.py

      - name: Drive deployed MLB postseason slate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/mlb_postseason_public_freeze_v1.py             --production-url https://pickvault.streamlit.app             --artifact-dir artifacts/mlb-postseason-public-step4             --max-rollout-seconds 420             --poll-seconds 20

      - name: Upload public freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-postseason-public-step4-${{ github.run_id }}
          path: artifacts/mlb-postseason-public-step4
          if-no-files-found: warn
          retention-days: 14
