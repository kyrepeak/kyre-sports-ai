name: CFB Game Total V165 Step 4

on:
  pull_request:
    paths:
      - "app.py"
      - "cfb_game_total_step4_matchup_v2.py"
      - "cfb_game_total_step4_multisource_v1.py"
      - "data/cfb_game_total_step4_official_snapshot_v1.json"
      - "cfb_game_total_clean_page_v16.py"
      - "streamlit_memory_lazy_router_v161.py"
      - "devsystem/production_verify_v4.py"
      - "devsystem/production_verify_v164_logos.py"
      - "tests/test_devsystem_production_verify_v4.py"
      - "tests/test_devsystem_production_verify_v164_logos.py"
      - "tests/test_cfb_game_total_v165_step4_matchup.py"
      - "tests/test_cfb_game_total_step4_multisource_v1.py"
      - ".github/workflows/cfb-game-total-v165-step4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step4-v165:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile V165 activation files
        run: |
          python -m py_compile \
            cfb_game_total_step4_matchup_v2.py \
            cfb_game_total_step4_multisource_v1.py \
            cfb_game_total_clean_page_v16.py \
            streamlit_memory_lazy_router_v161.py \
            devsystem/production_verify_v4.py \
            devsystem/production_verify_v164_logos.py \
            app.py
      - name: Run Step 4 and frozen-boundary regression tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_cfb_game_total_v165_step4_matchup.py \
            tests/test_cfb_game_total_step4_multisource_v1.py \
            tests/test_cfb_game_total_step4_matchup_v1.py \
            tests/test_cfb_game_total_v164_team_logos.py \
            tests/test_devsystem_production_verify_v4.py \
            tests/test_devsystem_production_verify_v164_logos.py \
            tests/test_cfb_game_total_v159_compact_dashboard.py
