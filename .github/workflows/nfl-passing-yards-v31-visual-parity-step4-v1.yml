name: NFL Passing Yards V31 Visual Parity Step 4 V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_passing_yards_hub_v31.py"
      - "streamlit_memory_lazy_router_v124.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py"
      - ".github/workflows/nfl-passing-yards-v31-visual-parity-step4-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-visual-step4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests streamlit

      - name: Enforce exact five-file Passing visual Step 4 diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-passing-yards-v31-visual-parity-step4-v1.yml
          app.py
          nfl_passing_yards_hub_v31.py
          streamlit_memory_lazy_router_v124.py
          tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Passing visual Step 4 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile Passing visual Step 4 surface
        run: |
          python -m py_compile \
            nfl_passing_yards_hub_v31.py \
            streamlit_memory_lazy_router_v124.py \
            app.py \
            tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py

      - name: Prove frozen Passing and certified sibling owners remain untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_hub_v([1-9]|[12][0-9]|30)\.py$|nfl_hub_v35\.py$|streamlit_memory_lazy_router_v123\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "PASSING_VISUAL_STEP4_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "PASSING_VISUAL_STEP4_FROZEN_OWNER_GUARD_GREEN"

      - name: Run Passing V31 visual parity Step 4 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py

      - name: Re-run frozen visual Step 3 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py

      - name: Re-run frozen visual Step 2 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v29_visual_parity_step2_v1.py

      - name: Re-run frozen V28 exact-ID personnel regression
        run: python -m pytest -q tests/test_nfl_passing_yards_step5_personnel_v2.py

      - name: Prove V31 remains display-only and market blind
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import nfl_passing_yards_hub_v31 as page
          assert page.DISPLAY_ONLY is True
          assert page.FROZEN_PRIOR == 'nfl_passing_yards_hub_v30'
          assert page.FROZEN_PASSING_ENGINE == 'nfl_passing_yards_hub_v28'
          assert page.VISUAL_BUILD_STEP == 4
          assert page.VISUAL_BUILD_TOTAL == 6
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          source = inspect.getsource(page.render_nfl_passing_yards_hub)
          for forbidden in (
              'projection_yards', 'fair_odds', 'no_vig', 'expected_value',
              'stake_size', 'projection_adjustment', 'over_odds', 'under_odds',
              'build_pass_defense_profile', 'build_pressure_matchup',
              'build_personnel_matchup', 'build_environment_context',
          ):
              assert forbidden not in source, forbidden
          print('NFL_PASSING_YARDS_V31_VISUAL_ONLY_GREEN')
          PY

  browser-visual-step4:
    needs: certify-visual-step4
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start clean branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/passing-visual-step4
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8514 \
            > artifacts/passing-visual-step4/streamlit.log 2>&1 &
          echo $! > /tmp/passing_visual_step4_pid

      - name: Drive real Passing Yards visual Step 4 UI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _wait_for_text,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base='http://127.0.0.1:8514'
          artifacts=Path('artifacts/passing-visual-step4')
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':2200})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  nfl_market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  nfl_market_combo.wait_for(state='visible',timeout=30000)
                  _choose(page,frame,1,'Passing Yards')
                  body=_wait_for_text(frame,'VISUAL STEP 4 / 6',180.0)
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Passing visual Step 4 runtime error marker: {forbidden}')
                  for required in ('Passing Yards', 'Visual Parity Build', 'VISUAL STEP 4 / 6', 'V30 + V28 FROZEN', 'SPORTSBOOK 0%'):
                      if required not in body:
                          raise BrowserQAFailure(f'missing Passing visual Step 4 marker: {required}')

                  # Step 3 surfaces must remain intact beneath V31.
                  deadline=time.time()+75
                  while frame.locator('.kpass30-profile').count() < 2 and time.time() < deadline:
                      time.sleep(2)
                  if frame.locator('.kpass30-profile').count() != 2:
                      raise BrowserQAFailure(f'expected 2 preserved QB profile cards, got {frame.locator(".kpass30-profile").count()}')
                  if frame.locator('.kpy-stat').count() != 5:
                      raise BrowserQAFailure(f'expected 5 preserved slate summary cells, got {frame.locator(".kpy-stat").count()}')

                  expected_counts={
                      '.kpy-defense':2,
                      '.kpy-pressure':2,
                      '.kpy-personnel':2,
                      '.kpy-env':1,
                  }
                  deadline=time.time()+75
                  while time.time() < deadline:
                      counts={selector:frame.locator(selector).count() for selector in expected_counts}
                      if all(counts[selector] >= expected for selector,expected in expected_counts.items()):
                          break
                      time.sleep(2)
                  counts={selector:frame.locator(selector).count() for selector in expected_counts}
                  for selector,expected in expected_counts.items():
                      if counts[selector] != expected:
                          raise BrowserQAFailure(f'expected {expected} {selector} context cards, got {counts[selector]}')

                  styles={}
                  for selector in expected_counts:
                      styles[selector]=frame.locator(selector).first.evaluate(
                          """(e) => {
                            const s=getComputedStyle(e);
                            return {borderColor:s.borderColor,borderRadius:s.borderRadius,backgroundImage:s.backgroundImage};
                          }"""
                      )
                      if styles[selector]['borderColor'] != 'rgb(43, 75, 57)':
                          raise BrowserQAFailure(f'{selector} is not using V31 green border: {styles[selector]}')
                      if styles[selector]['borderRadius'] != '16px':
                          raise BrowserQAFailure(f'{selector} is not using V31 rounded card radius: {styles[selector]}')
                      if 'linear-gradient' not in styles[selector]['backgroundImage']:
                          raise BrowserQAFailure(f'{selector} is missing V31 green/black gradient: {styles[selector]}')

                  context_text=' '.join(
                      frame.locator('.kpy-defense,.kpy-pressure,.kpy-personnel,.kpy-env').all_inner_texts()
                  ).lower()
                  for required in ('opponent pass defense', 'protection vs pressure', 'weapons + availability', 'game environment'):
                      if required not in context_text:
                          raise BrowserQAFailure(f'context surface missing marker: {required}')

                  result={
                      'status':'GREEN',
                      'visual_step':'4/6',
                      'context_card_counts':counts,
                      'computed_styles':styles,
                      'sportsbook_projection_influence':0.0,
                      'context_values_recomputed':False,
                      'frozen_passing_engine':'v28',
                  }
                  (artifacts/'passing_visual_step4_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'passing_visual_step4.png'),full_page=True)
                  print('NFL_PASSING_YARDS_V31_BROWSER_VISUAL_STEP4_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/passing-visual-step4/streamlit.log || true

      - name: Upload Passing visual Step 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-passing-visual-step4-${{ github.run_id }}
          path: artifacts/passing-visual-step4
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/passing_visual_step4_pid ]; then
            kill "$(cat /tmp/passing_visual_step4_pid)" 2>/dev/null || true
          fi
