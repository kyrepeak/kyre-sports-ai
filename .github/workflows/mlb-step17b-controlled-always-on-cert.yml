name: MLB Step17B controlled always-on clean certification

on:
  push:
    branches:
      - mlb-step17b-controlled-always-on
    paths:
      - sports_api/mlb_step17b_always_on_runtime_v1.py
      - sports_api/api/mlb_step17b_runtime.py
      - sports_api/main.py
      - tests/test_mlb_step17b_always_on_runtime_v1.py
      - .github/workflows/mlb-step17b-controlled-always-on-cert.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP17A_MAIN_SHA: 99336141ff416af13bd03dae245fbbb42de23680
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"
  MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED: "false"
  MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED: "false"
  MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED: "false"
  MLB_STEP17B_ALWAYS_ON_ENABLED: "false"

jobs:
  certify-clean-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact five-file Step17B clean scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP17A_MAIN_SHA" HEAD
          git diff --check "$STEP17A_MAIN_SHA"...HEAD
          changed="$(git diff --name-only "$STEP17A_MAIN_SHA"...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 5
          allowed='^(sports_api/mlb_step17b_always_on_runtime_v1.py|sports_api/api/mlb_step17b_runtime.py|sports_api/main.py|tests/test_mlb_step17b_always_on_runtime_v1.py|\.github/workflows/mlb-step17b-controlled-always-on-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad"

      - name: Prove frozen packaging and persistence surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP17A_MAIN_SHA"...HEAD -- \
            sports_api/Dockerfile \
            sports_api/production.env.example \
            sports_api/requirements.txt \
            sports_api/requirements-mlb-step14b-persistence.txt \
            sports_api/mlb_step17a_production_host_contract_v1.py \
            sports_api/mlb_step16e_final_production_freeze_v1.py \
            sports_api/mlb_step16d_controlled_production_activation_v1.py \
            sports_api/mlb_step16c_live_postgresql_canary_v1.py \
            sports_api/mlb_step16b_production_lifecycle_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/mlb_step14a_persistence_contract_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/api/mlb.py app.py
          test "$(git hash-object sports_api/Dockerfile)" = '34a542b0a32456de58b81fd711fef215e618469f'
          test "$(git hash-object sports_api/production.env.example)" = '25d7a2196f5502e6aa3e25c6885c76a05c887f3f'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests

      - name: Compile Step17B and main wiring
        run: |
          python -m py_compile \
            sports_api/mlb_step17b_always_on_runtime_v1.py \
            sports_api/api/mlb_step17b_runtime.py \
            sports_api/main.py \
            tests/test_mlb_step17b_always_on_runtime_v1.py

      - name: Run Step17B targeted fail-closed tests
        run: python -m pytest -q tests/test_mlb_step17b_always_on_runtime_v1.py

      - name: Prove parent Step17A tree still green at exact frozen parent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mlb-step17a-parent
          git worktree add --detach /tmp/mlb-step17a-parent "$STEP17A_MAIN_SHA"
          (
            cd /tmp/mlb-step17a-parent
            PYTHONPATH=. python -m pytest -q \
              tests/test_mlb_step17a_production_host_contract_v1.py \
              tests/test_mlb_step16e_final_production_freeze_v1.py \
              tests/test_mlb_step16d_controlled_production_activation_v1.py \
              tests/test_mlb_step16c_live_postgresql_canary_v1.py \
              tests/test_mlb_step16b_production_packaging_lifecycle_v1.py
          )
          git worktree remove /tmp/mlb-step17a-parent --force

      - name: Run current MLB regression excluding intentionally superseded snapshot guards
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            case "$path" in
              tests/test_mlb_step16a_production_activation_contract_v1.py|tests/test_mlb_step16b_production_packaging_lifecycle_v1.py|tests/test_mlb_step16e_final_production_freeze_v1.py|tests/test_mlb_step17a_production_host_contract_v1.py)
                ;;
              *) files+=("$path") ;;
            esac
          done
          python -m pytest -q "${files[@]}"

      - name: Prove API imports with Step17B disabled by default
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_STEP17B_ALWAYS_ON_ENABLED" = false
          PYTHONPATH=. python - <<'PY'
          from fastapi.testclient import TestClient
          from sports_api.main import app
          with TestClient(app) as client:
              health = client.get('/health')
              assert health.status_code == 200, health.text
              status = client.get('/api/v1/mlb/runtime/step17b')
              assert status.status_code == 200, status.text
              body = status.json()
              assert body['enabled'] is False, body
              assert body['running'] is False, body
              assert body['provider_calls'] == 0, body
              assert body['sportsbook_calls'] == 0, body
              assert body['actionable_output_enabled'] is False, body
              assert body['wagering_enabled'] is False, body
          print('MLB_STEP17B_DISABLED_API_SMOKE_OK')
          PY

      - name: Build candidate Docker image with activation OFF
        run: |
          docker build \
            -f sports_api/Dockerfile \
            --build-arg WNBA_RELEASE_REVISION="${GITHUB_SHA}" \
            --build-arg WNBA_RELEASE_ID="mlb-step17b-clean-cert" \
            -t "mlb-step17b-clean:${GITHUB_SHA}" .

      - name: Prove container health and Step17B disabled status
        shell: bash
        run: |
          set -euo pipefail
          name="mlb-step17b-clean-${GITHUB_RUN_ID}"
          cleanup() { docker logs "$name" 2>/dev/null || true; docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 18081:8000 \
            -e PORT=8000 \
            -e WEB_CONCURRENCY=1 \
            -e MLB_PRODUCTION_RUNTIME_ENABLED=false \
            -e MLB_PRODUCTION_SCHEDULER_ENABLED=false \
            -e MLB_ACTIONABLE_OUTPUT_ENABLED=false \
            -e MLB_WAGERING_ENABLED=false \
            -e MLB_SUPABASE_REST_WRITE_ENABLED=false \
            -e MLB_STEP17B_ALWAYS_ON_ENABLED=false \
            "mlb-step17b-clean:${GITHUB_SHA}"
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18081/health',timeout=3) as r:
                      health=json.loads(r.read().decode())
                  with urllib.request.urlopen('http://127.0.0.1:18081/api/v1/mlb/runtime/step17b',timeout=3) as r:
                      status=json.loads(r.read().decode())
                  assert health.get('status') == 'ok', health
                  assert status.get('enabled') is False, status
                  assert status.get('running') is False, status
                  print('MLB_STEP17B_CLEAN_CONTAINER_OFF_OK')
                  raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('Step17B clean container did not become healthy')
          PY
          test -z "$(docker inspect "$name" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^KYRE_DATABASE_URL=' || true)"

      - name: Final marker
        run: echo MLB_STEP17B_CLEAN_RUNTIME_CERT_GREEN
