name: CFB Game Total V168 Step 5

on:
  pull_request:
    paths:
      - "app.py"
      - "cfb_game_total_step5_pace_v1.py"
      - "data/cfb_step5_pbp_snapshot_v1.json"
      - "cfb_game_total_clean_page_v17.py"
      - "streamlit_memory_lazy_router_v162.py"
      - "devsystem/task_ledgers/cfb-game-total-evidence-step5.json"
      - "tests/test_cfb_game_total_v168_step5_pace.py"
      - "devsystem/production_verify_v164_logos.py"
      - "tests/test_devsystem_production_verify_v164_logos.py"
      - ".github/workflows/cfb-game-total-v168-step5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step5-v168:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile V168 activation files
        run: |
          python -m py_compile             cfb_game_total_step5_pace_v1.py             cfb_game_total_clean_page_v17.py             streamlit_memory_lazy_router_v162.py             app.py
      - name: Run Step 5 and frozen-boundary regression tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q             tests/test_cfb_game_total_v168_step5_pace.py             tests/test_devsystem_production_verify_v164_logos.py             tests/test_cfb_game_total_v165_step4_matchup.py             tests/test_cfb_game_total_v159_compact_dashboard.py             tests/test_cfb_game_total_v164_team_logos.py
