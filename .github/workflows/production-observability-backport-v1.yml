name: Production observability backport certification

on:
  push:
    branches: [production-observability-backport-v1]
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability-backport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backport-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile production API entry points
        run: |
          python -m py_compile \
            sports_api/observability_v1.py \
            sports_api/api/health.py \
            sports_api/main.py

      - name: Prove production-only CFB transport plus observability contract
        run: |
          python -m pytest -q tests/test_production_observability_backport_v1.py
