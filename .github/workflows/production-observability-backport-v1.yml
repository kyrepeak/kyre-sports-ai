name: Production observability backport certification

on:
  push:
    branches:
      - production-observability-backport-v1
      - production-lifespan-recursion-fix-v1
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability-backport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backport-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile production API entry points
        run: |
          python -m py_compile \
            sports_api/observability_v1.py \
            sports_api/api/health.py \
            sports_api/main.py

      - name: Prove production-only CFB transport plus observability contract
        run: |
          python -m pytest -q tests/test_production_observability_backport_v1.py

      - name: Boot real production Uvicorn startup path
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/kyre-production-uvicorn.log"
          export PORT=8765
          export WEB_CONCURRENCY=1
          export MLB_STEP17B_ALWAYS_ON_ENABLED=false

          python -m uvicorn sports_api.main:app \
            --host 127.0.0.1 \
            --port "${PORT}" \
            --workers 1 \
            >"${LOG_FILE}" 2>&1 &
          UVICORN_PID=$!

          cleanup() {
            if kill -0 "${UVICORN_PID}" 2>/dev/null; then
              kill "${UVICORN_PID}" || true
              wait "${UVICORN_PID}" || true
            fi
          }
          trap cleanup EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8765"
          deadline = time.monotonic() + 15.0
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/health", timeout=1.0) as response:
                      if response.status == 200:
                          break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise SystemExit(f"production Uvicorn startup never became healthy: {last_error}")

          def get_json(path: str):
              with urllib.request.urlopen(base + path, timeout=3.0) as response:
                  assert response.status == 200, (path, response.status)
                  request_id = response.headers.get("X-Request-ID")
                  deploy_commit = response.headers.get("X-Kyre-Deploy-Commit")
                  deploy_branch = response.headers.get("X-Kyre-Deploy-Branch")
                  assert request_id, (path, "missing X-Request-ID")
                  assert deploy_commit is not None, (path, "missing X-Kyre-Deploy-Commit")
                  assert deploy_branch is not None, (path, "missing X-Kyre-Deploy-Branch")
                  return json.load(response)

          health = get_json("/health")
          ready = get_json("/health/ready")
          details = get_json("/health/details")
          cfb_status = get_json("/api/v1/cfb/markets/status")

          assert health["observability_version"] == "KYRE_OBSERVABILITY_V1"
          assert ready["observability_version"] == "KYRE_OBSERVABILITY_V1"
          assert details["observability_version"] == "KYRE_OBSERVABILITY_V1"
          assert cfb_status["market_semantics"]["projection_weight"] == 0.0
          assert cfb_status["market_semantics"]["market_context_only"] is True
          PY

          if ! kill -0 "${UVICORN_PID}" 2>/dev/null; then
            echo "Uvicorn exited during production startup certification."
            cat "${LOG_FILE}"
            exit 1
          fi

          echo "Production Uvicorn startup log:"
          cat "${LOG_FILE}"
