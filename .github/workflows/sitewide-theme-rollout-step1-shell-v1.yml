name: Sitewide Theme Rollout Step 1 Shell

on:
  push:
    branches:
      - "monster/sitewide-theme-rollout-step1-shell-v1"
    paths:
      - "app.py"
      - "kyre_universal_shell_runtime_v1.py"
      - "tests/test_sitewide_theme_rollout_step1_shell_v1.py"
      - ".github/workflows/sitewide-theme-rollout-step1-shell-v1.yml"

permissions:
  contents: read

jobs:
  targeted-sitewide-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted UI dependency
        run: pip install -q streamlit
      - name: Prove site-wide shell activation only
        run: python tests/test_sitewide_theme_rollout_step1_shell_v1.py
