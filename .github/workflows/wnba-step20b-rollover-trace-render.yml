name: WNBA Step20B guarded rollover stage trace

on:
  push:
    branches:
      - wnba-step20b-rollover-runtime-diagnostic-20260830
    paths:
      - '.github/workflows/wnba-step20b-rollover-trace-render.yml'
      - 'sports_api/api/wnba_step17b_runtime.py'
      - 'sports_api/wnba_step20b_rollover_stage_trace.py'
      - 'tests/test_wnba_step20b_rollover_stage_trace.py'

permissions:
  contents: read

concurrency:
  group: wnba-step20b-rollover-stage-trace
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}
  ROLLBACK_SHA: aaf8b8a5425ea6e1b0ab33e6c42f35c95e8905ab
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: wnba-render-staging
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Certify trace and probe are semantics-neutral
        run: |
          python -m pytest -q tests/test_wnba_step20b_rollover_stage_trace.py
          python -m pytest -q \
            tests/test_wnba_step19n_fanduel_empty_market.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19j_runtime_acceleration.py
          python - <<'PY'
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step20b_rollover_stage_trace as t
          import sports_api.api.wnba_step17b_runtime
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          st=t.installation_status()
          assert st['all_stage_wrappers_active'] is True
          assert st['protected_step7g_step4w_bindings_untouched'] is True
          assert st['protected_step7g_step4w_bindings_wrapped'] == []
          g=st['guardrails']
          assert g['diagnostic_only'] is True
          assert g['frozen_step7g_source_seams_patched'] is False
          for key in ('arguments_modified','return_values_modified','exceptions_reclassified','execution_order_modified','projection_math_modified','monte_carlo_simulation_count_modified','monte_carlo_batch_size_modified','sportsbook_transport_modified','readiness_relaxed','persistence_modified','wagering_enabled'):
              assert g[key] is False, key
          print('STEP20B_TRACE_V5_PROBE_CERTIFIED')
          PY

      - name: Deploy exact diagnostic candidate to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, secrets, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          token=secrets.token_hex(32)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write('STEP20B_PROBE_TOKEN='+token+'\n')
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step20b-rollover-stage-trace-v5-probe',
              'WNBA_STEP20B_PROBE_ENABLED':'true',
              'WNBA_STEP20B_PROBE_TOKEN':token,
          }.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('diagnostic deploy id missing')
          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('diagnostic deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('diagnostic deploy timeout')
          if sha.lower() not in json.dumps(d).lower(): raise SystemExit('diagnostic live SHA mismatch')
          print('STEP20B_TRACE_RENDER_LIVE',did,sha,flush=True)
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Run lease-independent hosted player-opportunity probe
        env:
          STEP20B_PROBE_TOKEN: ${{ env.STEP20B_PROBE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://kyre-sports-api.onrender.com'
          token=os.environ['STEP20B_PROBE_TOKEN']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'kyre-step20b-stage-trace-v5-probe/1.0'})
              with urllib.request.urlopen(req,timeout=45) as response: return json.loads(response.read().decode())
          def post_probe():
              req=urllib.request.Request(
                  base+'/api/v1/wnba/runtime/step20b-player-opportunity-probe',
                  data=b'',
                  headers={
                      'User-Agent':'kyre-step20b-stage-trace-v5-probe/1.0',
                      'X-Step20B-Diagnostic-Token':token,
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=180) as response:
                  return json.loads(response.read().decode())
          # Give Render a moment to route all requests to the live candidate.
          time.sleep(3)
          build=get('/api/v1/wnba/runtime/build')
          print('STEP20B_PROBE_BUILD',json.dumps(build,sort_keys=True),flush=True)
          probe=post_probe()
          print('STEP20B_PLAYER_OPPORTUNITY_PROBE',json.dumps(probe,sort_keys=True),flush=True)
          trace=get('/api/v1/wnba/runtime/step20b-rollover-stage-trace')
          recent=trace.get('recent_completed') or []
          wanted=(
              'step4w_player_opportunity',
              'step4v_recent_rotation',
              'step4r_game_rotation',
              'step4v_recent_event_features',
              'step4u_game_event_lineups',
              'step4u_game_possession_context',
          )
          rows=[ev for ev in recent if str(ev.get('stage')) in wanted]
          rows.sort(key=lambda ev:int(ev.get('sequence') or 0))
          print('STEP20B_PROBE_STAGE_ROWS',json.dumps(rows,sort_keys=True),flush=True)
          maxima={}
          for ev in rows:
              stage=str(ev.get('stage')); elapsed=float(ev.get('elapsed_seconds') or 0)
              if elapsed > float((maxima.get(stage) or {}).get('elapsed_seconds') or -1): maxima[stage]=ev
          print('STEP20B_PROBE_STAGE_MAXIMA',json.dumps(maxima,sort_keys=True),flush=True)
          if probe.get('status') not in {'returned','raised'}:
              raise SystemExit('unexpected Step20B probe status')
          print('STEP20B_PROBE_DIAGNOSTIC_COMPLETE',flush=True)
          PY

      - name: Restore certified Step19N production revision
        if: always() && steps.deploy.outputs.deployed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step19n-safe-market-state-candidate',
              'WNBA_STEP20B_PROBE_ENABLED':'false',
              'WNBA_STEP20B_PROBE_TOKEN':'',
          }.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('restore deploy id missing')
          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('restore deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('restore deploy timeout')
          if sha.lower() not in json.dumps(d).lower(): raise SystemExit('restore live SHA mismatch')
          print('STEP20B_STEP19N_RESTORED',did,sha,flush=True)
          PY
