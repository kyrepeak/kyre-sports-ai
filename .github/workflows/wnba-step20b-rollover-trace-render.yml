name: WNBA Step20B full runtime certification

on:
  push:
    branches:
      - wnba-step20b-rollover-runtime-diagnostic-20260830
    paths:
      - '.github/workflows/wnba-step20b-rollover-trace-render.yml'
      - 'sports_api/api/wnba_step17b_runtime.py'
      - 'sports_api/wnba_step20b_runtime_acceleration.py'
      - 'sports_api/wnba_step20b_optional_workload_compat.py'
      - 'sports_api/wnba_step20b_monte_carlo_acceleration.py'
      - 'sports_api/wnba_step20b_rollover_stage_trace.py'
      - 'tests/test_wnba_step20b_runtime_acceleration.py'
      - 'tests/test_wnba_step20b_optional_workload_compat.py'
      - 'tests/test_wnba_step20b_monte_carlo_acceleration.py'
      - 'tests/test_wnba_step20b_rollover_stage_trace.py'

permissions:
  contents: read

concurrency:
  group: wnba-step20b-rollover-stage-trace
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}
  ROLLBACK_SHA: aaf8b8a5425ea6e1b0ab33e6c42f35c95e8905ab
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment: wnba-render-staging
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Certify acceleration and regression guards
        run: |
          python -m pytest -q tests/test_wnba_step20b_runtime_acceleration.py
          python -m pytest -q tests/test_wnba_step20b_optional_workload_compat.py
          python -m pytest -q tests/test_wnba_step20b_monte_carlo_acceleration.py
          python -m pytest -q tests/test_wnba_step20b_rollover_stage_trace.py
          python -m pytest -q tests/test_wnba_step8_joint_monte_carlo.py
          python -m pytest -q \
            tests/test_wnba_step19n_fanduel_empty_market.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19j_runtime_acceleration.py
          python - <<'PY'
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          import sports_api.api.wnba_step17b_runtime
          from sports_api import wnba_step20b_runtime_acceleration as a
          from sports_api import wnba_step20b_optional_workload_compat as w
          from sports_api import wnba_step20b_monte_carlo_acceleration as m
          from sports_api import wnba_step8_joint_monte_carlo as step8d
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          g=a.installation_status()['guardrails']
          assert g['cache_scope'] == 'single_step12b_call_only'
          assert g['cached_values_returned_by_deepcopy'] is True
          assert g['exceptions_cached'] is False
          assert g['projection_math_modified'] is False
          assert g['readiness_relaxed'] is False
          assert g['monte_carlo_simulation_count_modified'] is False
          assert g['monte_carlo_batch_size_modified'] is False
          assert g['sportsbook_transport_modified'] is False
          assert g['provider_identity_protected_step7g_aliases_modified'] is False
          assert g['persistence_modified'] is False
          assert g['wagering_enabled'] is False
          ws=w.installation_status()
          assert ws['installed'] is True
          wg=ws['guardrails']
          assert wg['required_schedule_rest_travel_data_relaxed'] is False
          assert wg['optional_historical_workload_only'] is True
          ms=m.installation_status()
          assert ms['installed'] is True
          current=step8d.simulate_step8_joint_distribution
          assert current is m.simulate_step8_joint_distribution_accelerated or getattr(current,'__wrapped__',None) is m.simulate_step8_joint_distribution_accelerated
          mg=ms['guardrails']
          assert mg['same_pcg64_random_stream'] is True
          assert mg['same_latent_gaussian_draws'] is True
          assert mg['same_marginal_cdf_tables'] is True
          assert mg['same_discrete_count_mapping_required'] is True
          assert mg['normal_cdf_approximation_inverted_once_not_replaced'] is True
          assert mg['simulations_modified'] is False
          assert mg['batch_size_modified'] is False
          assert mg['projection_math_modified'] is False
          assert mg['readiness_relaxed'] is False
          assert mg['sportsbook_transport_modified'] is False
          assert mg['persistence_modified'] is False
          assert mg['wagering_enabled'] is False
          print('STEP20B_FULL_RUNTIME_GUARDS_CERTIFIED')
          PY

      - name: Deploy lease-independent certification candidate
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, secrets, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA'].lower()
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
          def deploy_id(value):
              for row in walk(value):
                  did=row.get('id')
                  if isinstance(did,str) and did.startswith('dep-'):
                      return did
              return None
          def deploy_for_sha(value):
              for row in walk(value):
                  did=row.get('id')
                  if not isinstance(did,str) or not did.startswith('dep-'):
                      continue
                  if sha in json.dumps(row,sort_keys=True,default=str).lower():
                      return did
              return None
          def recent_for_sha():
              return deploy_for_sha(req('GET',f'/services/{sid}/deploys?limit=20') or [])
          def request_candidate():
              return req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}

          token=secrets.token_hex(32)
          pathlib.Path(os.environ['RUNNER_TEMP'],'step20b_probe_token').write_text(token,encoding='utf-8')
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step20b-full-runtime-certification',
              'WNBA_STEP17B_ALWAYS_ON_ENABLED':'false',
              'WNBA_STEP20B_PROBE_ENABLED':'true',
              'WNBA_STEP20B_PROBE_TOKEN':token,
          }.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})

          out=request_candidate()
          did=deploy_for_sha(out)
          if did is None:
              possible=deploy_id(out)
              if possible:
                  try:
                      detail=req('GET',f'/services/{sid}/deploys/{possible}') or {}
                  except Exception:
                      detail={}
                  if sha in json.dumps(detail,sort_keys=True,default=str).lower():
                      did=possible

          for attempt in range(45):
              if did:
                  break
              try:
                  did=recent_for_sha()
              except Exception:
                  did=None
              if did:
                  break
              if attempt in {14,29}:
                  try:
                      retry=request_candidate()
                      did=deploy_for_sha(retry) or deploy_id(retry)
                      if did:
                          detail=req('GET',f'/services/{sid}/deploys/{did}') or {}
                          if sha not in json.dumps(detail,sort_keys=True,default=str).lower():
                              did=None
                  except Exception:
                      did=None
              time.sleep(2)
          if not did: raise SystemExit('certification exact-SHA deploy could not be resolved')

          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('certification deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('certification deploy timeout')
          if sha not in json.dumps(d,sort_keys=True,default=str).lower(): raise SystemExit('certification live SHA mismatch')
          print('STEP20B_FULL_RUNTIME_RENDER_LIVE',did,sha,flush=True)
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Run one full lease-independent Step12B cycle
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          base=os.environ['RENDER_SERVICE_URL']
          token=pathlib.Path(os.environ['RUNNER_TEMP'],'step20b_probe_token').read_text(encoding='utf-8').strip()
          headers={'User-Agent':'kyre-step20b-full-runtime-cert/1.0','X-Step20B-Diagnostic-Token':token}
          def call(path,method='GET'):
              req=urllib.request.Request(base+path,data=b'' if method=='POST' else None,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=45) as response: return json.loads(response.read().decode())
          time.sleep(3)
          started=call('/api/v1/wnba/runtime/step20b-full-runtime-probe/start','POST')
          print('STEP20B_FULL_PROBE_STARTED',json.dumps(started,sort_keys=True),flush=True)
          final=None
          for poll in range(1,91):
              time.sleep(5)
              status=call('/api/v1/wnba/runtime/step20b-full-runtime-probe/status')
              print('STEP20B_FULL_PROBE_POLL',poll,json.dumps(status,sort_keys=True),flush=True)
              if status.get('status') in {'returned','raised'}:
                  final=status
                  break
          if final is None: raise SystemExit('Step20B full runtime probe timed out')
          if final.get('status') != 'returned': raise SystemExit('Step20B full runtime probe raised '+str(final.get('error_type')))
          projection=final.get('projection_assembly') or {}
          built=int(projection.get('built_target_count') or 0)
          if built < 1: raise SystemExit('Step20B full runtime probe built zero projection targets')
          if projection.get('simulations_per_built_target') != 5000000: raise SystemExit('simulation count drift')
          if projection.get('batch_size') != 250000: raise SystemExit('batch size drift')
          mc=final.get('monte_carlo_acceleration') or {}
          if mc.get('installed') is not True: raise SystemExit('Step20B Monte Carlo acceleration not installed')
          if int(mc.get('call_count') or 0) < built: raise SystemExit('Step20B Monte Carlo acceleration did not execute for every built target')
          elapsed=float(final.get('elapsed_seconds') or 0)
          print('STEP20B_FULL_RUNTIME_CERTIFIED',elapsed,built,int(mc.get('call_count') or 0),flush=True)
          PY

      - name: Restore certified Step19N production revision
        if: always() && steps.deploy.outputs.deployed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA'].lower()
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
          def deploy_id(value):
              for row in walk(value):
                  did=row.get('id')
                  if isinstance(did,str) and did.startswith('dep-'):
                      return did
              return None
          def deploy_for_sha(value):
              for row in walk(value):
                  did=row.get('id')
                  if not isinstance(did,str) or not did.startswith('dep-'):
                      continue
                  if sha in json.dumps(row,sort_keys=True,default=str).lower():
                      return did
              return None
          def recent_for_sha():
              return deploy_for_sha(req('GET',f'/services/{sid}/deploys?limit=20') or [])
          def request_restore():
              return req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}

          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step19n-safe-market-state-candidate',
              'WNBA_STEP17B_ALWAYS_ON_ENABLED':'true',
              'WNBA_STEP20B_PROBE_ENABLED':'false',
              'WNBA_STEP20B_PROBE_TOKEN':'disabled-diagnostic-probe-token-not-active',
          }.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})

          out=request_restore()
          did=deploy_for_sha(out)
          if did is None:
              possible=deploy_id(out)
              if possible:
                  try:
                      detail=req('GET',f'/services/{sid}/deploys/{possible}') or {}
                  except Exception:
                      detail={}
                  if sha in json.dumps(detail,sort_keys=True,default=str).lower():
                      did=possible
          for attempt in range(45):
              if did:
                  break
              try:
                  did=recent_for_sha()
              except Exception:
                  did=None
              if did:
                  break
              if attempt in {14,29}:
                  try:
                      retry=request_restore()
                      did=deploy_for_sha(retry) or deploy_id(retry)
                      if did:
                          detail=req('GET',f'/services/{sid}/deploys/{did}') or {}
                          if sha not in json.dumps(detail,sort_keys=True,default=str).lower():
                              did=None
                  except Exception:
                      did=None
              time.sleep(2)
          if not did: raise SystemExit('restore exact-SHA deploy could not be resolved')

          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('restore deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('restore deploy timeout')
          if sha not in json.dumps(d,sort_keys=True,default=str).lower(): raise SystemExit('restore live SHA mismatch')
          print('STEP20B_STEP19N_RESTORED',did,sha,flush=True)
          PY
