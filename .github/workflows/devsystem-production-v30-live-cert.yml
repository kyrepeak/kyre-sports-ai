name: DevSystem V30 live premerge certification

on:
  push:
    branches: [devsystem-production-v30-live-cert]

permissions:
  contents: read

concurrency:
  group: devsystem-production-v30-live-cert
  cancel-in-progress: true

jobs:
  production-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests pytest playwright
          python -m playwright install --with-deps chromium

      - name: Self-test production verification contract
        run: python -m pytest -q tests/test_devsystem_production_verify_v1.py

      - name: Verify deployed Streamlit and Render API
        run: |
          python devsystem/production_verify_v1.py \
            --artifact-dir artifacts/production-verification

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsystem-production-v30-live-cert-${{ github.run_id }}
          path: artifacts/production-verification
          if-no-files-found: warn
          retention-days: 7
