name: WNBA Step 10D refresh controller certification

on:
  push:
    branches:
      - wnba-step10d-refresh-controller-20260828
    paths:
      - sports_api/wnba_step10_refresh_controller.py
      - tests/test_wnba_step10_refresh_controller.py
      - sports_api/tools/wnba_step10d_refresh_controller_cert.py
      - .github/workflows/wnba-step-10d-refresh-controller-cert.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Step 10D branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 80

      - name: Assert production and real scheduler OFF; isolated Step 10 gates ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED" = 'true'
          test "$WNBA_STEP10B_MARKET_ADAPTER_ENABLED" = 'true'
          test "$WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED" = 'true'
          test "$WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 10D certification surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step10_live_market_input.py
          python -m py_compile sports_api/wnba_step10_market_adapters.py
          python -m py_compile sports_api/wnba_step10_market_snapshot.py
          python -m py_compile sports_api/wnba_step10_refresh_controller.py
          python -m py_compile tests/test_wnba_step10_refresh_controller.py
          python -m py_compile sports_api/tools/wnba_step10d_refresh_controller_cert.py

      - name: Run Step 10D refresh controller guards
        run: PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py

      - name: Run frozen Step 10C guards
        run: PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py

      - name: Run frozen Step 10B guards
        run: PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py

      - name: Run frozen Step 10A guards
        run: PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run inherited frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 10C head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP10C_FROZEN_SHA='a5264f40d2fe9f17e5cefa3c20e0d2ad31b73f3e'
          git merge-base --is-ancestor "$STEP10C_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP10C_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 10D files changed after frozen Step 10C
        shell: bash
        run: |
          set -euo pipefail
          STEP10C_FROZEN_SHA='a5264f40d2fe9f17e5cefa3c20e0d2ad31b73f3e'
          git diff --name-only "$STEP10C_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step10_refresh_controller.py|\
              tests/test_wnba_step10_refresh_controller.py|\
              sports_api/tools/wnba_step10d_refresh_controller_cert.py|\
              .github/workflows/wnba-step-10d-refresh-controller-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step10C file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen Step 10C and Step 10D release constants
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step10_market_snapshot as s10c
          from sports_api import wnba_step10_refresh_controller as s10d
          assert s10c.RELEASE_ID == 'wnba_step10c_market_snapshot_2026_regular_season_v1'
          assert s10c.SCHEMA_VERSION == 'wnba_step_10c_market_snapshot_v1'
          assert s10c.MODEL_VERSION == 'wnba_step10c_reconciled_fresh_market_snapshot_2026_regular_v1'
          assert s10d.STEP10C_FROZEN_HEAD_SHA == 'a5264f40d2fe9f17e5cefa3c20e0d2ad31b73f3e'
          assert s10d.SCHEMA_VERSION == 'wnba_step_10d_refresh_controller_v1'
          assert s10d.MODEL_VERSION == 'wnba_step10d_isolated_refresh_cycle_2026_regular_v1'
          assert s10d.RELEASE_ID == 'wnba_step10d_refresh_controller_2026_regular_season_v1'
          assert s10d.step10d_refresh_controller_enabled({}) is False
          assert s10d.DEFAULT_REFRESH_INTERVAL_SECONDS == 60
          assert s10d.DEFAULT_MAX_ATTEMPTS_PER_PROVIDER == 3
          assert s10d.DEFAULT_RETRY_BASE_SECONDS == 2.0
          assert s10d.DEFAULT_RETRY_MULTIPLIER == 2.0
          assert s10d.DEFAULT_RETRY_MAX_SECONDS == 30.0
          assert s10d.DEFAULT_MAX_LAST_GOOD_AGE_SECONDS == 600
          print('STEP10D_RELEASE_CONTRACT_STATIC_GUARDS_OK')
          PY

      - name: Certify frozen Step 10D refresh controller
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step10d_refresh_controller_cert

      - name: Upload Step 10D certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step10d-refresh-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: step10d-refresh-controller-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production and real scheduler OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
