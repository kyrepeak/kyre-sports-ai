name: Monster Agent Anti-Loop V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_devsystem_tool_orchestration_guard_v1.py'
      - 'devsystem/tool_orchestration_guard_v1.py'
      - '.github/workflows/devsystem-agent-anti-loop-v1.yml'
      - 'devsystem/task_ledgers/agent-anti-loop-step2-no-progress.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-orchestration-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Prove third unchanged tool call is blocked
        run: python -m pytest -q tests/test_devsystem_tool_orchestration_guard_v1.py
