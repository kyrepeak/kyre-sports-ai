name: MLB Step9F final live integration freeze certification

on:
  push:
    branches:
      - mlb-step9f-final-live-integration-freeze
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step9f-final-live-integration-freeze-cert
  cancel-in-progress: false

env:
  STEP9F_BASE_SHA: fa33eaaeb8004d8090c540757a4f38bf507c578e
  API_BASE_URL: https://kyre-sports-api.onrender.com

jobs:
  certify-final-live-integration-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests

      - name: Assert Step9F is exactly three-file non-behavioral MLB scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP9F_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/mlb_step9_final_freeze_v1.py|tests/test_mlb_step9_final_freeze_v1.py|\.github/workflows/mlb-step9f-final-live-integration-freeze-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP9F_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 3 ]; then
            echo "STEP9F_EXPECTED_EXACTLY_THREE_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP9F_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          git diff --check "$STEP9F_BASE_SHA"...HEAD
          echo 'MLB_STEP9F_THREE_FILE_NON_BEHAVIORAL_SCOPE_OK'

      - name: Prove complete Step9 runtime is byte-identical to Step9E main
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP9F_BASE_SHA"...HEAD -- \
            app.py \
            engine.py \
            history.py \
            spread_engine.py \
            live_game_hub_v182.py \
            live_game_hub_v19.py \
            live_game_hub_v191.py \
            live_game_hub_v192.py \
            live_game_hub_v1921.py \
            mlb_live_hub_v193.py \
            live_odds_feed.py \
            mlb_step9c_live_state_consumer_v1.py \
            mlb_step9e_live_market_consumer_v1.py \
            sports_api/main.py \
            sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/collectors/mlb_fanduel_inplay.py \
            sports_api/mlb_official_game_id_join_v1.py \
            sports_api/mlb_live_market_context_v1.py \
            sports_api/mlb_step9a_live_game_state_api_contract_v1.py \
            sports_api/mlb_step8_final_freeze_v1.py \
            mlb_step8f_player_prop_presentation_v1.py
          echo 'MLB_STEP9F_COMPLETE_STEP9_RUNTIME_FROZEN'

      - name: Assert final Step9 freeze manifest contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sports_api.mlb_step9_final_freeze_v1 import (
              FINAL_CERTIFICATION_MARKER,
              FINAL_FREEZE_STATUS,
              PROTECTED_INVARIANTS,
              STEP9_CERTIFICATION_MARKERS,
              STEP9_MERGED_PULL_REQUESTS,
              STEP9_STAGE_CHAIN,
              STEP9F_BASE_MAIN_SHA,
              final_freeze_manifest,
              validate_final_step9_certification,
          )

          m = final_freeze_manifest()
          assert STEP9F_BASE_MAIN_SHA == 'fa33eaaeb8004d8090c540757a4f38bf507c578e'
          assert m['step9f_base_main_sha'] == STEP9F_BASE_MAIN_SHA
          assert m['final_freeze_status'] == FINAL_FREEZE_STATUS == 'STEP9_FROZEN_LIVE_API_CONSUMER_INTEGRATION_COMPLETE'
          assert m['final_certification_marker'] == FINAL_CERTIFICATION_MARKER == 'MLB_STEP9F_FINAL_LIVE_INTEGRATION_FREEZE_GREEN'
          assert m['stage_chain'] == list(STEP9_STAGE_CHAIN)
          assert m['certification_markers'] == list(STEP9_CERTIFICATION_MARKERS)
          assert m['merged_pull_requests'] == list(STEP9_MERGED_PULL_REQUESTS) == [37,38,39,40,41]
          assert len(m['stage_chain']) == 5
          assert len(m['certification_markers']) == 5
          assert m['read_only_freeze'] is True
          assert m['automatic_runtime_mutation'] is False
          assert m['runtime_files_changed_by_step9f'] is False
          assert m['exact_official_game_id_required'] is True
          assert m['team_name_matching_allowed'] is False
          assert m['player_name_matching_allowed'] is False
          assert m['fuzzy_matching_allowed'] is False
          assert m['synthetic_game_id_allowed'] is False
          assert m['stale_live_state_context_allowed'] is False
          assert m['stale_live_market_context_allowed'] is False
          assert m['missing_live_market_price_fabrication_allowed'] is False
          assert m['provider_contract_unavailable_may_fall_back'] is True
          assert m['legacy_direct_live_state_fallback_preserved'] is True
          assert m['legacy_odds_api_io_fallback_preserved'] is True
          assert m['live_game_state_api_first'] is True
          assert m['live_market_api_first'] is True
          assert m['v1922_market_sync_function_preserved'] is True
          assert m['step8_final_freeze_required'] is True
          for key, value in PROTECTED_INVARIANTS.items():
              assert value is False
              assert m[key] is False, key
          validated = validate_final_step9_certification(
              STEP9_CERTIFICATION_MARKERS,
              runtime_base_sha=STEP9F_BASE_MAIN_SHA,
          )
          assert validated['freeze_eligible'] is True
          assert validated['freeze_status'] == FINAL_FREEZE_STATUS
          assert validated['failures'] == []
          print('MLB_STEP9F_FINAL_FREEZE_MANIFEST_OK')
          PY

      - name: Prove frozen Step8 prerequisite remains valid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sports_api.mlb_step8_final_freeze_v1 import (
              FINAL_FREEZE_STATUS,
              STEP8_CERTIFICATION_MARKERS,
              STEP8G_BASE_MAIN_SHA,
              validate_final_step8_certification,
          )
          state = validate_final_step8_certification(
              STEP8_CERTIFICATION_MARKERS,
              runtime_base_sha=STEP8G_BASE_MAIN_SHA,
          )
          assert state['freeze_eligible'] is True
          assert state['freeze_status'] == FINAL_FREEZE_STATUS
          assert state['failures'] == []
          print('MLB_STEP9F_STEP8_FINAL_FREEZE_PREREQUISITE_OK')
          PY

      - name: Compile Step9F Python
        run: |
          python -m py_compile \
            sports_api/mlb_step9_final_freeze_v1.py \
            tests/test_mlb_step9_final_freeze_v1.py

      - name: Run Step9F targeted tests
        run: python -m pytest -q tests/test_mlb_step9_final_freeze_v1.py

      - name: Run complete certified MLB regression through Step9F
        run: |
          python -m pytest -q \
            tests/test_mlb_official_game_id_join_v1.py \
            tests/test_mlb_live_market_context_v1.py \
            tests/test_mlb_market_probability_v1.py \
            tests/test_mlb_model_market_edge_v1.py \
            tests/test_mlb_price_discipline_v1.py \
            tests/test_mlb_market_movement_v1.py \
            tests/test_mlb_price_health_v1.py \
            tests/test_mlb_actionability_shadow_v1.py \
            tests/test_mlb_controlled_price_gate_v1.py \
            tests/test_mlb_price_gate_canary_v1.py \
            tests/test_mlb_price_gate_canary_streamlit_v1.py \
            tests/test_mlb_step6a_production_canary_v1.py \
            tests/test_mlb_step6b_canary_monitor_v1.py \
            tests/test_mlb_step6c_evidence_gate_v1.py \
            tests/test_mlb_step6d_production_expansion_v1.py \
            tests/test_mlb_step6e_25pct_stability_monitor_v1.py \
            tests/test_mlb_step6f_production_graduation_gate_v1.py \
            tests/test_mlb_step6g_controlled_graduation_v1.py \
            tests/test_mlb_step6_final_freeze_v1.py \
            tests/test_mlb_step7a_daily_game_picks_api_integration_v1.py \
            tests/test_mlb_step7b_spread_api_integration_v1.py \
            tests/test_mlb_step7c_moneyline_api_integration_v1.py \
            tests/test_mlb_step7d_total_api_integration_v1.py \
            tests/test_mlb_step7e_total_presentation_integration_v1.py \
            tests/test_mlb_step7_final_freeze_v1.py \
            tests/test_mlb_step8a_player_prop_api_contract_v1.py \
            tests/test_mlb_step8b_fanduel_player_prop_collector_api.py \
            tests/test_mlb_step8c_pitcher_strikeouts_integration_v1.py \
            tests/test_mlb_step8d_player_hits_integration_v1.py \
            tests/test_mlb_step8e_hits_runs_rbi_integration_v1.py \
            tests/test_mlb_step8f_player_prop_presentation_v1.py \
            tests/test_mlb_step8_final_freeze_v1.py \
            tests/test_mlb_step9a_live_game_state_api_contract_v1.py \
            tests/test_mlb_step9b_live_game_state_collector_api.py \
            tests/test_mlb_step9c_live_state_consumer_v1.py \
            tests/test_mlb_step9d_live_inplay_market_collector_api.py \
            tests/test_mlb_step9e_live_market_consumer_v1.py \
            tests/test_mlb_step9_final_freeze_v1.py

      - name: Certify live frozen Step9 production boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import requests

          import live_game_hub_v192 as v192
          import live_game_hub_v1921 as v1921
          from mlb_step9e_live_market_consumer_v1 import (
              install_step9e_live_market_consumer,
              snapshot_for_official_game_id,
          )
          from sports_api.mlb_step9_final_freeze_v1 import (
              FINAL_FREEZE_STATUS,
              STEP9_CERTIFICATION_MARKERS,
              STEP9F_BASE_MAIN_SHA,
              validate_final_step9_certification,
          )
          from sports_api.mlb_step9a_live_game_state_api_contract_v1 import (
              build_live_game_state_api_state,
              enforce_live_game_state_api_freshness,
              live_game_state_for_official_game_id,
          )

          base = os.environ['API_BASE_URL'].rstrip('/')
          freeze = validate_final_step9_certification(
              STEP9_CERTIFICATION_MARKERS,
              runtime_base_sha=STEP9F_BASE_MAIN_SHA,
          )
          assert freeze['freeze_eligible'] is True
          assert freeze['freeze_status'] == FINAL_FREEZE_STATUS
          assert freeze['failures'] == []

          headers = {
              'Accept': 'application/json',
              'User-Agent': 'KyreSportsMLBStep9FFinalFreeze/1.0',
              'Cache-Control': 'no-cache',
          }
          state_response = requests.get(
              f'{base}/api/v1/mlb/live-game-state',
              params={'max_games': 30},
              timeout=90,
              headers=headers,
          )
          state_response.raise_for_status()
          state_payload = state_response.json()
          assert state_payload['data_type'] == 'mlb_live_game_state_api_response_v1'
          assert state_payload['schema_version'] == 1
          assert state_payload.get('team_name_matching_used') is False
          assert state_payload.get('player_name_matching_used') is False
          assert state_payload.get('fuzzy_matching_used') is False
          assert state_payload.get('synthetic_game_id_used') is False

          contract_state = build_live_game_state_api_state(state_payload)
          contract_state = enforce_live_game_state_api_freshness(contract_state)
          state_games = state_payload.get('games') or []
          exact_state_checked = 0
          if state_games:
              game_id = state_games[0].get('official_game_id')
              assert isinstance(game_id, int) and not isinstance(game_id, bool) and game_id > 0
              context = live_game_state_for_official_game_id(contract_state, official_game_id=game_id)
              assert context is not None
              assert context['official_game_id'] == game_id
              exact_response = requests.get(
                  f'{base}/api/v1/mlb/live-game-state',
                  params={'official_game_id': game_id, 'max_games': 30},
                  timeout=90,
                  headers=headers,
              )
              exact_response.raise_for_status()
              exact_payload = exact_response.json()
              assert all(row['official_game_id'] == game_id for row in exact_payload.get('games') or [])
              exact_state_checked = 1

          odds_response = requests.get(
              f'{base}/api/v1/mlb/live-odds',
              params={'max_events': 30, 'fully_priced_only': 'true'},
              timeout=90,
              headers=headers,
          )
          odds_response.raise_for_status()
          odds_payload = odds_response.json()
          assert odds_payload['data_type'] == 'mlb_inplay_odds_api_response_v1'
          assert odds_payload['schema_version'] == 1
          assert odds_payload['source'] == 'FanDuel'
          assert odds_payload['market_phase'] == 'IN_PLAY'
          assert odds_payload['fuzzy_matching_used'] is False
          assert odds_payload['synthetic_game_id_used'] is False

          odds_games = odds_payload.get('games') or []
          exact_market_checked = 0
          if odds_games:
              game_id = odds_games[0]['official_game_id']
              snapshot = snapshot_for_official_game_id(game_id)
              assert snapshot is not None
              assert snapshot['official_game_id'] == game_id
              assert snapshot['source'] == 'FanDuel'
              assert snapshot['transport'] == 'kyre_sports_api_step9d'
              assert snapshot['match_method'] == 'official_mlb_game_id_exact'
              assert snapshot['fallback_matching_used'] is False
              exact_market_checked = 1
          else:
              print('MLB_STEP9F_NO_OPEN_FULLY_PRICED_INPLAY_MARKET_FAIL_CLOSED_OK')

          before_192 = v192._market_sync
          before_1921 = v1921._market_sync
          installed = install_step9e_live_market_consumer()
          assert v192._market_sync is before_192
          assert v1921._market_sync is before_1921
          assert installed['v1922_market_sync_function_preserved'] is True
          for key in ('model_math_impact','simulation_math_impact','probability_math_impact','edge_grading_math_impact'):
              assert installed[key] is False

          evidence = {
              'marker': 'MLB_STEP9F_LIVE_FROZEN_BOUNDARIES_GREEN',
              'state_game_count': state_payload.get('game_count'),
              'exact_state_checked': exact_state_checked,
              'live_market_game_count': odds_payload.get('game_count'),
              'live_market_candidate_started_event_count': odds_payload.get('candidate_started_event_count'),
              'live_market_matched_inplay_game_count': odds_payload.get('matched_inplay_game_count'),
              'exact_market_checked': exact_market_checked,
              'v1922_market_sync_preserved': True,
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          print(json.dumps(evidence, sort_keys=True))
          print('MLB_STEP9F_LIVE_FROZEN_PRODUCTION_BOUNDARY_GREEN')
          PY

      - name: Final Step9F certification marker
        run: echo 'MLB_STEP9F_FINAL_LIVE_INTEGRATION_FREEZE_GREEN'
