name: MONSTER V8 Step 7 Execution Plan Compiler

on:
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/execution_plan_compiler_v1.py"
      - "tests/test_devsystem_execution_plan_compiler_v1.py"
      - "devsystem/task_ledgers/monster-v8-step7-execution-plan-compiler-v1.json"
      - ".github/workflows/monster-v8-step7-execution-plan-compiler-v1.yml"
  push:
    branches:
      - main
    paths:
      - "devsystem/execution_plan_compiler_v1.py"
      - "tests/test_devsystem_execution_plan_compiler_v1.py"
      - "devsystem/task_ledgers/monster-v8-step7-execution-plan-compiler-v1.json"
      - ".github/workflows/monster-v8-step7-execution-plan-compiler-v1.yml"

permissions:
  contents: read

concurrency:
  group: monster-v8-step7-plan-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: execution plan compiler focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen MONSTER V8 Steps 1 through 6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/pre_mutation_blast_radius_simulator_v1.py)" = "75812e61e7b6dc4a12ee3e860f7cfd670e95dad6"
          test "$(git hash-object devsystem/transactional_rollback_engine_v1.py)" = "609e5b9b3f416cff47d5867b57a63782ea0e18b8"
          test "$(git hash-object devsystem/cross_workstream_intent_arbiter_v1.py)" = "e1db49a3f2d16fe2eb89b243658deba92fbde160"
          test "$(git hash-object sports_api/monster_project_state_v1.py)" = "e72331a7fc1b82477d83517f75eb04d29bc5cef8"
          test "$(git hash-object devsystem/adaptive_stuck_thresholds_v1.py)" = "5a68516d45417a7175eb6e88f7e9d4749a2dbe1c"
          test "$(git hash-object devsystem/chaos_adversarial_certification_harness_v1.py)" = "88c82005872c9723b942e1b0787b6a1a19470ab2"

      - name: Compile Step 7 compiler
        run: python -m py_compile devsystem/execution_plan_compiler_v1.py

      - name: Run Step 7 compiler contract
        run: python devsystem/execution_plan_compiler_v1.py

      - name: Run Step 7 focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_execution_plan_compiler_v1.py

      - name: Prove Step 7 is read-only
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import devsystem.execution_plan_compiler_v1 as step7

          assert step7.NETWORK_CALLS is False
          assert step7.AUTO_MUTATE is False
          assert step7.MAY_MODIFY_PRODUCT_RUNTIME is False
          assert step7.MUTATION_AUTHORITY_GRANTED is False

          source = Path("devsystem/execution_plan_compiler_v1.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          forbidden = {
              "requests", "urllib", "http", "socket", "subprocess",
              "boto3", "supabase", "streamlit"
          }
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])
          assert not (imported & forbidden), sorted(imported & forbidden)
          print("MONSTER_V8_STEP7_READ_ONLY_SAFETY_GREEN")
          PY

      - name: Enforce exact Step 7 write surface
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi
          if [ -z "${BASE_SHA:-}" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/step7-scope.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/monster-v8-step7-execution-plan-compiler-v1.yml",
              "devsystem/execution_plan_compiler_v1.py",
              "devsystem/task_ledgers/monster-v8-step7-execution-plan-compiler-v1.json",
              "tests/test_devsystem_execution_plan_compiler_v1.py",
          }
          actual = {
              line.strip()
              for line in Path("/tmp/step7-scope.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          unexpected = sorted(actual - allowed)
          assert actual, "Step 7 proof surface unexpectedly empty"
          assert not unexpected, f"unexpected Step 7 files: {unexpected}"
          print("MONSTER_V8_STEP7_SCOPE_GREEN", sorted(actual))
          PY

      - name: Emit Step 7 proof marker
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          echo "MONSTER_V8_STEP7_EXECUTION_PLAN_COMPILER_GREEN"
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "MONSTER_V8_STEP7_EXECUTION_PLAN_COMPILER_MERGED_MAIN_GREEN"
            echo "MONSTER_V8_STEP7_EXECUTION_PLAN_COMPILER_FROZEN"
            echo "MONSTER_V8_COMPLETE"
          else
            echo "MONSTER_V8_STEP7_EXECUTION_PLAN_COMPILER_EXACT_HEAD_GREEN"
          fi
