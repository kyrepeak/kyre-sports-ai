name: TEMP CFB O/U Step 6 red-zone diagnostic

on:
  push:
    branches: ['cfb-ou-upgrade-step6-red-zone']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect NCAA red-zone categories and headers
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_team_data_v1 as team
          import cfb_over_under_matchup_engine_v1 as engine
          import cfb_over_under_pace_engine_v1 as pace

          targets = [
              {"team":"Miami (FL)","team_slug":"miami-fl"},
              {"team":"Florida A&M","team_slug":"florida-a-m"},
          ]

          def all_rows(url, provider):
              found={}
              first, _ = team._fetch_text_with_fallback(url, provider)
              pages = team._max_stat_pages(first)
              for page in range(1, pages+1):
                  html = first if page == 1 else team._fetch_text_with_fallback(url.rstrip("/") + f"/p{page}", provider+f" p{page}")[0]
                  headers, rows = team._table_rows(html or "")
                  team_idx = team._team_cell_index(headers, rows)
                  for cells in rows:
                      if team_idx >= len(cells):
                          continue
                      name = team._clean(cells[team_idx])
                      key = team._canonical_name(name)
                      if key:
                          found[key]={"team":name,"headers":headers,"row":cells}
              return found, pages

          for division, index in (
              ("FBS", team.NCAA_STATS_INDEX),
              ("FCS", engine.NCAA_FCS_STATS_INDEX),
          ):
              html, attempts = team._fetch_text_with_fallback(index, f"NCAA {division} index")
              parser = engine._CategoryOptionParser()
              parser.feed(html or "")
              print("\nDIVISION", division)
              red = []
              for label, path in parser.options:
                  if "red zone" in label.lower() and "/team/" in path:
                      red.append((label, path))
                      print("CATEGORY", label, "=>", path)
              for label, path in red:
                  url = "https://www.ncaa.com" + path
                  table, diag = engine._load_category_table.__wrapped__(
                      url, f"NCAA {division} {label}"
                  )
                  all_table, all_pages = all_rows(url, f"NCAA {division} {label} all rows")
                  print("TABLE", label, "ranked_rows", len(table), "all_rows", len(all_table), "pages", all_pages, "url", url)
                  first = next(iter(table.values()), {})
                  print("HEADERS", label, json.dumps(first.get("headers") or []))
                  print("TEAMS", label, json.dumps([v.get("team") for v in list(table.values())[:40]]))
                  print("DIAG", label, json.dumps({k:diag.get(k) for k in ("rows","field_size","pages")}))
                  for profile in targets:
                      hit = pace._lookup(all_table, profile)
                      if hit:
                          print("TARGET", label, profile["team"], json.dumps({
                              "team":hit.get("team"),
                              "rank":hit.get("rank"),
                              "value":hit.get("value"),
                              "headers":hit.get("headers"),
                              "row":hit.get("row"),
                          }))
              if len(red) == 2:
                  off_url = "https://www.ncaa.com" + next(path for label,path in red if "offense" in label.lower())
                  def_url = "https://www.ncaa.com" + next(path for label,path in red if "defense" in label.lower())
                  off_table, _ = engine._load_category_table.__wrapped__(off_url, f"NCAA {division} RZ offense overlap")
                  def_table, _ = engine._load_category_table.__wrapped__(def_url, f"NCAA {division} RZ defense overlap")
                  overlap = sorted(set(off_table).intersection(def_table))
                  print("OVERLAP", division, json.dumps([off_table[k].get("team") for k in overlap]))
          PY
