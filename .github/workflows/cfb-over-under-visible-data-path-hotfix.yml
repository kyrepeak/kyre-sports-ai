name: CFB O/U visible data path hotfix

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-visible-data-path-hotfix-v1]
permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Scope and freeze guards
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-visible-data-path-hotfix.yml",
              "app.py",
              "cfb_schedule_v4.py",
              "cfb_over_under_matchup_ui_v15_visible_data_path.py",
              "streamlit_memory_lazy_router_v55.py",
              "tests/test_cfb_schedule_v4_visible_enrichment.py",
              "tests/test_cfb_over_under_visible_data_path_v15.py",
          }
          failures=[]
          if actual!=expected:
              failures.append(f"scope mismatch expected={sorted(expected)} actual={sorted(actual)}")

          manifests=[
              "cfb_over_under_upgrade_freeze_manifest_v12.json",
              "cfb_over_under_post12_data_recovery_freeze_manifest_v1.json",
              "cfb_over_under_deep_data_reconciliation_freeze_manifest_v1.json",
          ]
          for path in manifests:
              m=json.loads(pathlib.Path(path).read_text())
              for frozen,blob in (m.get("exact_blobs") or {}).items():
                  try: current=rev(f"HEAD:{frozen}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing frozen path {frozen}")
                      continue
                  if current!=blob:
                      failures.append(f"frozen blob changed {frozen}")

          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_VISIBLE_PATH_SCOPE_AND_FREEZES=PASS")
          PY

      - name: Compile
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_schedule_v4.py",
              "cfb_over_under_matchup_ui_v15_visible_data_path.py",
              "streamlit_memory_lazy_router_v55.py",
              "tests/test_cfb_schedule_v4_visible_enrichment.py",
              "tests/test_cfb_over_under_visible_data_path_v15.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_VISIBLE_PATH_COMPILE=PASS")
          PY

      - name: Regressions
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_cfb_schedule_v4_visible_enrichment.py             tests/test_cfb_over_under_visible_data_path_v15.py             tests/test_cfb_over_under_deep_data_reconciliation_v1.py             tests/test_cfb_over_under_deep_data_ui_router.py             tests/test_cfb_over_under_post12_data_recovery.py             tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py             tests/test_cfb_over_under_upgrade_step12_certification.py             tests/test_cfb_over_under_upgrade_step12_slate.py             tests/test_cfb_over_under_upgrade_step12_ui_router.py             tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py             tests/test_cfb_over_under_upgrade_step11_slate.py             tests/test_cfb_over_under_upgrade_step11_ui_router.py             tests/test_cfb_over_under_upgrade_step10_history_engine.py             tests/test_cfb_over_under_upgrade_step10_slate.py             tests/test_cfb_over_under_upgrade_step10_ui_router.py             tests/test_cfb_over_under_upgrade_step9_environment_engine.py             tests/test_cfb_over_under_upgrade_step9_slate.py             tests/test_cfb_over_under_upgrade_step9_ui_router.py             tests/test_cfb_over_under_upgrade_step8_turnover_engine.py             tests/test_cfb_over_under_upgrade_step8_slate.py             tests/test_cfb_over_under_upgrade_step8_ui_router.py             tests/test_cfb_over_under_upgrade_step7_third_down_engine.py             tests/test_cfb_over_under_upgrade_step7_slate.py             tests/test_cfb_over_under_upgrade_step7_ui_router.py             tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py             tests/test_cfb_over_under_upgrade_step6_slate.py             tests/test_cfb_over_under_upgrade_step6_ui_router.py             tests/test_cfb_over_under_upgrade_step5_explosive_engine.py             tests/test_cfb_over_under_upgrade_step5_slate.py             tests/test_cfb_over_under_upgrade_step5_ui_router.py             tests/test_cfb_over_under_upgrade_step4_pace_engine.py             tests/test_cfb_over_under_upgrade_step4_slate.py             tests/test_cfb_over_under_upgrade_step4_ui_router.py             tests/test_cfb_over_under_upgrade_step3_engine.py             tests/test_cfb_over_under_upgrade_step3_slate.py             tests/test_cfb_over_under_upgrade_step3_ui.py             tests/test_cfb_over_under_multisource_logo_resolver_v2.py             tests/test_cfb_over_under_multisource_logo_hotfix_v4.py             tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live Schedule V4 enrichment
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v4 as schedule

          games,diag=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          snapshot={
              "espn_matches":diag.get("espn_matches"),
              "venue_missing":diag.get("venue_missing"),
              "broadcast_missing":diag.get("broadcast_missing"),
              "event_id":game.get("espn_event_id"),
              "venue":game.get("venue"),
              "broadcast":game.get("broadcast"),
              "away_record":game.get("away_record_summary"),
              "home_record":game.get("home_record_summary"),
              "home_rank":game.get("home_rank"),
              "away_espn_team_id":game.get("away_espn_team_id"),
              "home_espn_team_id":game.get("home_espn_team_id"),
          }
          print("LIVE_SCHEDULE_V4",json.dumps(snapshot,indent=2))
          expected={
              "event_id":"401858213",
              "venue":"Hard Rock Stadium",
              "broadcast":"ACC Network",
              "away_record":"1-1",
              "home_record":"1-0",
              "home_rank":7,
              "away_espn_team_id":"50",
              "home_espn_team_id":"2390",
          }
          for key,value in expected.items():
              if snapshot.get(key)!=value:
                  raise SystemExit(f"{key}: expected {value!r}, got {snapshot.get(key)!r}")
          if int(snapshot.get("espn_matches") or 0)<1:
              raise SystemExit(f"expected at least one ESPN match: {snapshot}")
          print("LIVE_FAMU_MIAMI_SCHEDULE_V4=PASS")
          PY

      - name: Live visible Step-1 and Step-2 HTML uses reconciled objects
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v4 as schedule
          import cfb_over_under_matchup_ui_v15_visible_data_path as ui
          import cfb_over_under_rankings_v1 as rankings

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )

          stale_away={
              "team":"Florida A&M","conference":"SWAC","division_context":"FCS",
              "record_text":"0-0","record":{"games":0},"home_record":{},"away_record":{},
              "recent_form":"—","official_stats":{},"data_quality":{"grade":"CHECK"},
          }
          stale_home={
              "team":"Miami (FL)","conference":"ACC","division_context":"FBS",
              "record_text":"0-0","record":{"games":0},"home_record":{},"away_record":{},
              "recent_form":"—","official_stats":{},"data_quality":{"grade":"CHECK"},
              "ap_rank":None,
          }

          original=rankings.build_ranking_context
          rankings.build_ranking_context=ui.deep_data.build_ranking_context
          try:
              html=ui._hero_v15(game,stale_away,stale_home)
          finally:
              rankings.build_ranking_context=original

          checks={
              "Hard Rock Stadium":"venue",
              "ACC Network":"broadcast",
              "1-1":"FAMU record",
              "1-0":"Miami record",
              "#7":"Miami AP/Coaches rank",
              "Mario Cristobal":"Miami coach",
              "Quinn Gray Sr.":"FAMU coach",
          }
          for token,label in checks.items():
              if token not in html:
                  raise SystemExit(f"visible HTML missing {label}: {token!r}")
          lower=html.lower()
          if "swac • 0-0" in lower or "acc • 0-0" in lower:
              raise SystemExit("stale 0-0 profile leaked into visible hero")
          if ">nr</strong><span>ap" in lower and "miami" in lower:
              raise SystemExit("Miami AP still rendered NR in visible hero")
          print("LIVE_FAMU_MIAMI_VISIBLE_HTML=PASS")
          PY

      - name: Live full model remains Step-12 certified
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v4 as schedule
          import cfb_over_under_slate_v13_deep_data as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          try: slate.analyze_game.clear()
          except Exception: pass
          result=slate.analyze_game(game,"2026-09-10",50.5)
          cert=result.get("certification") or {}
          if cert.get("status")!="CERTIFIED":
              raise SystemExit(f"Step-12 no longer certified: {cert}")
          if int(cert.get("checks_failed") or 0)!=0:
              raise SystemExit(f"Step-12 failures: {cert}")
          if (result.get("away") or {}).get("record_text")!="1-1":
              raise SystemExit("FAMU reconciled record missing from model")
          if (result.get("home") or {}).get("record_text")!="1-0":
              raise SystemExit("Miami reconciled record missing from model")
          print("LIVE_FAMU_MIAMI_VISIBLE_PATH_STEP12=PASS")
          PY

      - name: Router and model firewall
        run: |
          grep -F 'from streamlit_memory_lazy_router_v55 import render_app' app.py
          python - <<'PY'
          from pathlib import Path
          text="\n".join(Path(p).read_text() for p in (
              "cfb_schedule_v4.py",
              "cfb_over_under_matchup_ui_v15_visible_data_path.py",
              "streamlit_memory_lazy_router_v55.py",
          ))
          for token in (
              'FROZEN_SCHEDULE = "cfb_schedule_v3"',
              'FROZEN_PARENT_UI = "cfb_over_under_matchup_ui_v14_deep_data"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v54"',
          ):
              if token not in text:
                  raise SystemExit(f"missing freeze marker {token}")
          lower=text.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"firewall crossed: {token}")
          print("CFB_OU_VISIBLE_PATH_FIREWALL=PASS")
          PY

      - run: echo CFB_OU_VISIBLE_DATA_PATH_GREEN
