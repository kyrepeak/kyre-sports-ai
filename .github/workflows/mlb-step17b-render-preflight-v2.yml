name: MLB Step17B production Render preflight v2

on:
  push:
    branches:
      - mlb-step17b-shared-host-cert
    paths:
      - .github/workflows/mlb-step17b-render-preflight-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step17b-render-preflight-v2
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: wnba-render-staging
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -q -r sports_api/requirements.txt

      - name: Verify live Render host is safe for Step 17B handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          mkdir -p .step17b-preflight-v2
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.parse import urlsplit
          import httpx

          from sports_api.wnba_render_provisioning import RenderAPIClient, resolve_owner_id
          from sports_api.tools import wnba_step7c_render_free_deploy as step7c

          EXPECTED_SERVICE_ID = 'srv-da84q6ifngtc73bdbm6g'
          SERVICE_URL = 'https://kyre-sports-api.onrender.com'
          EXPECTED_WNBA_DATA_TYPE = 'wnba_deployment_and_smoke_readiness'
          FROZEN_FALSE = (
              'MLB_PRODUCTION_RUNTIME_ENABLED',
              'MLB_PRODUCTION_SCHEDULER_ENABLED',
              'MLB_ACTIONABLE_OUTPUT_ENABLED',
              'MLB_WAGERING_ENABLED',
              'MLB_SUPABASE_REST_WRITE_ENABLED',
              'MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED',
              'MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED',
              'MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED',
          )

          def clean(v):
              if v is None:
                  return None
              s = str(v).strip()
              return s or None

          def truthy(v):
              return str(v or '').strip().casefold() not in {'', '0', 'false', 'no', 'off', 'disabled'}

          def env_map(rows):
              out = {}
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  key = clean(row.get('key'))
                  if key and row.get('value') is not None:
                      out[key] = str(row['value'])
              return out

          def get_json_retry(path, timeout_seconds=180.0):
              deadline = time.monotonic() + timeout_seconds
              last = 'not attempted'
              with httpx.Client(timeout=30.0, follow_redirects=True, headers={'user-agent': 'kyre-mlb-step17b-render-preflight-v2/1'}) as http:
                  while True:
                      try:
                          response = http.get(SERVICE_URL + path)
                          if response.status_code == 200:
                              body = response.json()
                              if isinstance(body, dict):
                                  return body
                              last = 'non-object JSON'
                          else:
                              last = f'HTTP {response.status_code}'
                      except Exception as exc:
                          last = f'{type(exc).__name__}: {exc}'
                      if time.monotonic() >= deadline:
                          raise AssertionError(f'hosted verification failed for {path}: {last}')
                      time.sleep(5)

          key = clean(os.environ.get('RENDER_API_KEY'))
          assert key and len(key) >= 20, 'Render credential missing'
          with RenderAPIClient(api_key=key, timeout_seconds=30.0) as client:
              owner = resolve_owner_id(client, clean(os.environ.get('RENDER_OWNER_ID')))
              matches = client.list_services(owner, step7c.SERVICE_NAME)
              assert len(matches) == 1, f'expected one {step7c.SERVICE_NAME} service; found {len(matches)}'
              sid = clean(matches[0].get('id'))
              assert sid == EXPECTED_SERVICE_ID, f'Render service identity drift: {sid!r}'
              service = client.get_service(sid)
              details = service.get('serviceDetails') if isinstance(service.get('serviceDetails'), dict) else {}
              assert clean(service.get('repo')) == step7c.SOURCE_REPOSITORY, 'Render repo drift'
              assert (clean(service.get('autoDeploy')) or 'no').casefold() in {'no', 'false', 'off'}, 'auto deploy must remain off'
              assert (clean(details.get('runtime') or details.get('env')) or '').casefold() == 'docker', 'Render runtime is not Docker'
              assert (clean(details.get('plan')) or '').casefold() == 'free', 'Render plan drifted from Free'
              assert not isinstance(details.get('disk'), dict), 'unexpected persistent Render disk'
              values = env_map(client.list_env_vars(sid))

          assert values.get('WNBA_KYRE_DURABLE_STORAGE_BACKEND') == 'supabase', 'WNBA durable backend drift'
          for name in step7c.OFF_SWITCHES:
              assert not truthy(values.get(name)), f'WNBA safety switch unexpectedly enabled: {name}'
          assert not truthy(values.get('MLB_STEP17B_ALWAYS_ON_ENABLED')), 'MLB Step17B is already enabled unexpectedly'
          for name in FROZEN_FALSE:
              assert not truthy(values.get(name)), f'frozen MLB switch unexpectedly enabled: {name}'

          db = clean(values.get('KYRE_DATABASE_URL'))
          parsed = urlsplit(db or '')
          assert bool(db and parsed.scheme.casefold() in {'postgres', 'postgresql'} and parsed.hostname and parsed.path not in {'', '/'}), 'Render is missing a valid protected PostgreSQL KYRE_DATABASE_URL'

          health = get_json_retry('/health')
          assert health.get('status') == 'ok', 'live /health is not ok'
          wnba = get_json_retry('/api/v1/wnba/runtime/deployment')
          semantics = wnba.get('semantics') if isinstance(wnba.get('semantics'), dict) else {}
          assert wnba.get('data_type') == EXPECTED_WNBA_DATA_TYPE, 'live WNBA deployment contract shape drifted'
          assert semantics.get('deployment_gate_does_not_call_sportsbook') is True, 'WNBA deployment gate network safety drifted'
          assert semantics.get('deployment_gate_does_not_run_monte_carlo') is True, 'WNBA deployment gate Monte Carlo safety drifted'
          assert semantics.get('live_smoke_is_read_only') is True, 'WNBA live smoke semantics are no longer read-only'

          evidence = {
              'state': 'mlb_step17b_render_preflight_v2_green',
              'mutation_performed': False,
              'service': {
                  'id': EXPECTED_SERVICE_ID,
                  'name': step7c.SERVICE_NAME,
                  'url': SERVICE_URL,
                  'repo': step7c.SOURCE_REPOSITORY,
                  'branch': clean(service.get('branch')),
                  'auto_deploy': clean(service.get('autoDeploy')),
                  'runtime': clean(details.get('runtime') or details.get('env')),
                  'plan': clean(details.get('plan')),
              },
              'database': {
                  'postgresql_configured': True,
                  'secret_exposed': False,
              },
              'current_runtime': {
                  'mlb_step17b_enabled': False,
                  'web_concurrency': clean(values.get('WEB_CONCURRENCY')),
                  'expected_revision_present': bool(clean(values.get('MLB_STEP17B_EXPECTED_REVISION'))),
              },
              'wnba_continuity': {
                  'health': 'ok',
                  'data_type': wnba.get('data_type'),
                  'deployment_ready': wnba.get('deployment_ready'),
                  'configuration_fingerprint_sha256': wnba.get('configuration_fingerprint_sha256'),
                  'network_free_contract_checked': True,
              },
              'safety': {
                  'wnba_off_switches_preserved': True,
                  'frozen_mlb_switches_off': True,
                  'render_secret_exposed': False,
                  'database_secret_exposed': False,
                  'render_mutation_performed': False,
                  'upstream_wnba_schedule_not_called': True,
              },
          }
          Path('.step17b-preflight-v2/render-preflight.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('MLB_STEP17B_RENDER_PREFLIGHT_V2_GREEN')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step17b-render-preflight-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .step17b-preflight-v2/render-preflight.json
          if-no-files-found: error
          retention-days: 30
