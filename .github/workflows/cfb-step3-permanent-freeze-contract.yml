name: College Football Step 3 permanent freeze contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-step3-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 3 freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step3-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step3-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v3.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 3 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP3_FREEZE_SCOPE=PASS"

      - name: Enforce immutable prior CFB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifests = {
              "cfb_freeze_manifest_v1.json": "3a7797ca8eb516b0457ebd7d3b2eb007e99ab087",
              "cfb_freeze_manifest_v2.json": "1b4eb71f6f17dcae873bcfd7ac4091bd2fa1498f",
          }

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path, expected in expected_manifests.items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  actual = None
              if actual != expected:
                  failures.append(
                      f"{path} changed or missing expected={expected} actual={actual}"
                  )

          for path, expected_steps in (
              ("cfb_freeze_manifest_v1.json", [1]),
              ("cfb_freeze_manifest_v2.json", [1, 2]),
          ):
              try:
                  data = json.loads(pathlib.Path(path).read_text())
              except Exception as exc:
                  failures.append(f"cannot read {path}: {exc}")
                  continue
              if data.get("completed_steps") != expected_steps:
                  failures.append(f"{path} completed_steps mismatch")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_PRIOR_FREEZE_MANIFESTS=PASS")
          PY

      - name: Enforce College Football Steps 1 through 3 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v3.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 3:
              failures.append("freeze manifest version mismatch")
          if m.get("completed_steps") != [1, 2, 3]:
              failures.append("completed_steps mismatch")
          if m.get("step3_merge_commit") != "6879411383b9ac08b1bc498b51d277f9c7eff45d":
              failures.append("Step 3 merge commit mismatch")

          required = {
              "cfb_hub_v1.py",
              "streamlit_memory_lazy_router_v23.py",
              "cfb_schedule_v1.py",
              "cfb_hub_v2.py",
              "streamlit_memory_lazy_router_v24.py",
              "cfb_team_data_v1.py",
              "cfb_hub_v3.py",
              "streamlit_memory_lazy_router_v25.py",
          }
          if set(m.get("exact_blobs", {})) != required:
              failures.append("Step 3 exact frozen path set mismatch")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP3_EXACT_FREEZE=PASS")
          PY

      - name: Re-enforce protected MLB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP3_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen College Football Steps 1 through 3
        run: |
          python -m py_compile \
            cfb_hub_v1.py \
            streamlit_memory_lazy_router_v23.py \
            cfb_schedule_v1.py \
            cfb_hub_v2.py \
            streamlit_memory_lazy_router_v24.py \
            cfb_team_data_v1.py \
            cfb_hub_v3.py \
            streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py

      - name: Run frozen College Football contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove additive Step 3 chain and no-model boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path("streamlit_memory_lazy_router_v25.py").read_text(encoding="utf-8")
          hub = Path("cfb_hub_v3.py").read_text(encoding="utf-8")
          data = Path("cfb_team_data_v1.py").read_text(encoding="utf-8")

          if 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v24"' not in router:
              raise SystemExit("V25 frozen parent is not V24")
          if 'FROZEN_CFB_HUB = "cfb_hub_v2"' not in hub:
              raise SystemExit("Hub V3 frozen parent is not Hub V2")

          required = [
              "recent_form",
              "home_record",
              "away_record",
              "sos_opponent_win_pct",
              "official_stats",
              "data_quality",
              "NCAA_AP_RANKINGS",
              "NCAA_STATS_INDEX",
          ]
          combined = hub + "\n" + data
          for token in required:
              if token not in combined:
                  raise SystemExit(f"frozen Step 3 marker missing: {token}")

          forbidden = [
              "import numpy",
              "np.random",
              "def simulate",
              "def win_probability",
              "fair_odds =",
              "projected_score =",
              "projected_total =",
              "sportsbook_line =",
          ]
          for token in forbidden:
              if token in combined:
                  raise SystemExit(f"Frozen Step 3 crossed model boundary: {token}")

          print("CFB_STEP3_ADDITIVE_CHAIN=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP3_PERMANENT_FREEZE_GREEN"
