name: WNBA Step19B injury-report completeness diagnostic

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .
  APP_CANDIDATE_SHA: ca34373548e5b54e65426160b0cf5e7eae4d89c9

jobs:
  diagnose-injury-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Inspect hash-covered availability evidence for one current target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          env={
            'WNBA_STEP7G_FIRST_PARTY_ENABLED':'true','WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false'
          }
          os.environ.update(env)
          import sports_api.wnba_step7g_first_party_integration as integration
          integration.install_step7g_first_party_integration()
          from sports_api.wnba_model_input_readiness import get_player_game_model_input_readiness
          gate=get_player_game_model_input_readiness(203826,'1022600296',2026,include_snapshot=True)
          snap=gate.get('snapshot') or {}
          availability=((snap.get('inputs') or {}).get('game_availability'))
          payload={
            'readiness':gate.get('readiness'),
            'summary':gate.get('summary'),
            'game_identity':(snap.get('game_identity') or snap.get('focal_identity')),
            'component_status':((snap.get('component_status') or {}).get('game_availability')),
            'availability_summary':snap.get('availability_summary'),
            'game_availability':availability,
            'source_timestamps':snap.get('source_timestamps')
          }
          print('INJURY_COMPLETENESS_EVIDENCE',json.dumps(payload,sort_keys=True,default=str))
          PY
