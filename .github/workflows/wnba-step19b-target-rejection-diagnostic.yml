name: WNBA Step19B current readiness blocker diagnostic

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .
  APP_CANDIDATE_SHA: ca34373548e5b54e65426160b0cf5e7eae4d89c9

jobs:
  diagnose-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Print exact model-input readiness blockers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          env={
            'WNBA_STEP7G_FIRST_PARTY_ENABLED':'true','WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false'
          }
          os.environ.update(env)
          import sports_api.wnba_step7g_first_party_integration as integration
          integration.install_step7g_first_party_integration()
          from sports_api.wnba_model_input_readiness import get_player_game_model_input_readiness
          targets=[203826,204330,1627674,1630442,1643420,1643445]
          rows=[]
          for player_id in targets:
            gate=get_player_game_model_input_readiness(player_id,'1022600296',2026,include_snapshot=False)
            row={
              'player_id':player_id,
              'readiness_state':gate.get('readiness_state'),
              'diagnostic_score':gate.get('diagnostic_score'),
              'blocker_ids':((gate.get('summary') or {}).get('blocker_ids')),
              'warning_ids':((gate.get('summary') or {}).get('warning_ids')),
              'blockers':gate.get('blockers'),
              'warnings':gate.get('warnings')
            }
            rows.append(row)
            print('READINESS_ROW',json.dumps(row,sort_keys=True,default=str),flush=True)
          print('READINESS_SUMMARY',json.dumps(rows,sort_keys=True,default=str))
          PY
