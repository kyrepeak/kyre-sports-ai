name: NFL Spread V4 Visual Parity Certification

on:
  push:
    branches:
      - nfl-spread-page-visual-parity-v1
    paths:
      - 'app.py'
      - 'nfl_spread_hub_v4.py'
      - 'streamlit_memory_lazy_router_v135.py'
      - 'tests/test_nfl_spread_v134_activation.py'
      - 'tests/test_nfl_spread_v4_visual_parity.py'
      - 'tests/test_nfl_spread_router_v135.py'
      - '.github/workflows/nfl-spread-page-v4-visual-parity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'nfl_spread_hub_v4.py'
      - 'streamlit_memory_lazy_router_v135.py'
      - 'tests/test_nfl_spread_v134_activation.py'
      - 'tests/test_nfl_spread_v4_visual_parity.py'
      - 'tests/test_nfl_spread_router_v135.py'
      - '.github/workflows/nfl-spread-page-v4-visual-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-spread-page-v4-visual-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-parity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated Spread V4 test stack
        run: |
          python -m pip install --disable-pip-version-check -q requests pandas numpy streamlit pytest

      - name: Compile Spread V4 Router V135 and active app surfaces
        run: |
          python -m py_compile app.py
          python -m py_compile nfl_spread_hub_v4.py
          python -m py_compile streamlit_memory_lazy_router_v135.py
          python -m py_compile tests/test_nfl_spread_v134_activation.py
          python -m py_compile tests/test_nfl_spread_v4_visual_parity.py
          python -m py_compile tests/test_nfl_spread_router_v135.py

      - name: Run Spread V4 visual parity Router and activation tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_nfl_spread_v134_activation.py \
            tests/test_nfl_spread_v4_visual_parity.py \
            tests/test_nfl_spread_router_v135.py

      - name: Prove frozen model Monte Carlo firewall
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import nfl_spread_hub_v3 as v3
          import nfl_spread_hub_v4 as v4
          import nfl_spread_mc_v1 as mc
          import streamlit_memory_lazy_router_v135 as router

          assert v4.PRESENTATION_ONLY is True
          assert v4.FROZEN_ANALYTICS == 'nfl_spread_hub_v3'
          assert v4.FROZEN_MODEL == 'nfl_spread_model_v1'
          assert v4.FROZEN_MONTE_CARLO == 'nfl_spread_mc_v1'
          assert v4.CERTIFIED_SIMULATIONS == 5_000_000
          assert v4.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert v3.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert mc.CERTIFIED_SIMULATIONS == 5_000_000
          assert mc.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert router.FROZEN_ROUTER == 'streamlit_memory_lazy_router_v134'
          assert router.ACTIVE_SPREAD_HUB == 'nfl_spread_hub_v4'
          assert router.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0

          source = inspect.getsource(v4)
          assert 'prior._analytics_for_game' in source
          assert 'simulate_game_spread' not in source

          app = Path('app.py').read_text(encoding='utf-8')
          assert 'FROZEN_V134_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V134_NFL_SPREAD_MODEL_MC_2026-09-14"' in app
          assert 'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V135_NFL_SPREAD_VISUAL_PARITY_2026-09-14"' in app
          assert 'from streamlit_memory_lazy_router_v135 import record_bootstrap_import_ms, render_app' in app
          print('NFL_SPREAD_V4_VISUAL_PARITY_FIREWALL_GREEN')
          PY
