name: MLB Hits Step 4 favorable-ranking certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/mlb-hits-step4-favorable-ranking']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify frozen MLB Hits Steps 1-3 boundary
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(pathlib.Path("mlb_hits_freeze_manifest_v3.json").read_text())
          base = manifest["baseline_commit"]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path in manifest["baseline_paths"]:
              try:
                  expected = rev(f"{base}:{path}")
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen Hits path: {path}")
                  continue
              if expected != actual:
                  failures.append(
                      f"frozen Hits baseline changed: {path} expected={expected} actual={actual}"
                  )

          for path, expected in manifest["exact_blobs"].items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing exact-frozen Hits path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"exact frozen Hits Steps 1-3 blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("MLB_HITS_STEPS_1_3_FROZEN_BOUNDARY=PASS")
          PY

      - name: Compile Hits Step 4 route
        run: |
          python -m py_compile \
            app.py \
            mlb_hit_favorable_ranker_v1.py \
            mlb_hit_hub_v1319.py \
            streamlit_memory_lazy_router_v19.py \
            tests/test_mlb_hits_step4_favorable_ranking.py \
            tests/test_streamlit_memory_lazy_router_v19.py
          PYTHONPATH=. python -c "import mlb_hit_favorable_ranker_v1; import mlb_hit_hub_v1319; import streamlit_memory_lazy_router_v19"

      - name: Prove additive app bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("app.py").read_text(encoding="utf-8")
          match = re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", text)
          if not match or int(match.group(1)) < 19:
              raise SystemExit("Hits Step 4 bootstrap regressed below Router V19")
          if "streamlit_memory_lazy_router_v1" not in text:
              raise SystemExit("lazy-router lineage marker missing")
          print("MLB_HITS_STEP4_BOOTSTRAP=PASS")
          PY

      - name: Run Hits Step 4 contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_hits_step4_favorable_ranking.py \
            tests/test_streamlit_memory_lazy_router_v19.py \
            tests/test_mlb_hits_step3_hitter_profile.py \
            tests/test_streamlit_memory_lazy_router_v18.py \
            tests/test_mlb_hits_step2_mobile_top5.py \
            tests/test_streamlit_memory_lazy_router_v17.py \
            tests/test_mlb_hits_step1_strength_evidence_summary.py \
            -k 'not app_activates_additive_router_v3 and not router_changes_only_hits_route_and_delegates_everything_else'

      - name: Assert Step 4 post-model ranking boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import mlb_hit_favorable_ranker_v1 as r

          helper = Path("mlb_hit_favorable_ranker_v1.py").read_text(encoding="utf-8")
          wrapper = Path("mlb_hit_hub_v1319.py").read_text(encoding="utf-8")
          source = helper + wrapper

          for forbidden in (
              "def deep_scan",
              "def monte",
              "def prescreen",
              "def _candidate_pool",
              "save_top5_snapshot(",
              "save_single_snapshot(",
              "np.random",
              "random.seed",
          ):
              if forbidden in source:
                  raise SystemExit(f"Step 4 crossed frozen model boundary: {forbidden}")

          assert r.MIN_P_ONE_PLUS == 0.60
          assert r.MIN_EXPECTED_AB == 3.80
          assert r.TOUGH_EDGE < 0
          assert "backfilled_tough" in helper
          print("MLB_HITS_STEP4_POST_MODEL_ONLY=PASS")
          PY

      - name: Certification marker
        run: echo "MLB_HITS_STEP4_FAVORABLE_RANKING_GREEN"
