name: API2 NFL Game Total Page1 Mobile Density Cache Bust R1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'tests/test_api2_nfl_game_total_page1_mobile_density_cache_bust_r1.py'
      - '.github/workflows/api2-nfl-game-total-page1-mobile-density-cache-bust-r1.yml'
      - 'devsystem/runless_proof_plans/api2-nfl-game-total-page1-mobile-density-cache-bust-r1.json'
      - 'devsystem/task_ledgers/api2-nfl-game-total-page1-mobile-density-cache-bust-r1.json'

permissions:
  contents: read

jobs:
  cache-bust-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas streamlit
      - name: Compile production entrypoint
        run: python -m py_compile app.py nfl_game_totals_page1_s_tier_v1.py universal_runtime_v5_loader.py
      - name: Cache-bust and Game Total regressions
        run: |
          python -m pytest --noconftest -q \
            tests/test_api2_nfl_game_total_page1_mobile_density_cache_bust_r1.py \
            tests/test_api2_nfl_game_total_page1_mobile_density_r1.py \
            tests/test_api2_nfl_game_totals_page1_s_tier_v1.py \
            tests/test_api2_nfl_game_total_production_route_r2.py \
            tests/test_api2_nfl_game_total_page1_mobile_density_deploy_r1.py
