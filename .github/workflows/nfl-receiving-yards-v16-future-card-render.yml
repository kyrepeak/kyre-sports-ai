name: NFL Receiving Yards V16 Future Card Render

on:
  pull_request:
    paths:
      - 'nfl_receiving_yards_future_card_render_v1.py'
      - 'nfl_receiving_yards_hub_v16.py'
      - 'streamlit_memory_lazy_router_v147.py'
      - 'app.py'
      - 'tests/test_nfl_receiving_yards_v16_future_card_render.py'
      - '.github/workflows/nfl-receiving-yards-v16-future-card-render.yml'

jobs:
  v16-future-card-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Receiving Yards V16 future-card render contract
        run: python -m pytest -q tests/test_nfl_receiving_yards_v16_future_card_render.py
