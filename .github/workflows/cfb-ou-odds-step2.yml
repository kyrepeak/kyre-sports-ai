name: CFB O-U odds integration Step 2

on:
  push:
    branches:
      - step2-cfb-odds-game-identity
  pull_request:
    branches:
      - cfb-ou-odds-integration-v1

jobs:
  certify-step2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen CFB O-U projection baseline is byte-identical
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path("cfb_over_under_pre_odds_freeze_manifest_v1.json").read_text()
          )
          failures = []
          for path, expected in manifest["exact_blobs"].items():
              actual = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              if actual != expected:
                  failures.append((path, expected, actual))
          if failures:
              for path, expected, actual in failures:
                  print(f"FROZEN BLOB CHANGED: {path} expected={expected} actual={actual}")
              raise SystemExit(1)
          print(f"Frozen CFB O-U baseline verified: {len(manifest['exact_blobs'])} blobs")
          PY

      - name: Verify Step 1 market contract remains byte-identical
        run: |
          test "$(git hash-object sports_api/api/cfb_markets.py)" = "385c6440ce648a2e3e18160d324b3f5cf13ac0a1"
          echo "Step 1 CFB market transport is unchanged."

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt\n          python -m pip install -r sports_api/requirements-mlb-step14b-persistence.txt\n          python -m pip install pytest

      - name: Run Step 1 and Step 2 market tests
        run: |
          python -m pytest -q             sports_api/tests/test_cfb_markets_step1.py             sports_api/tests/test_cfb_market_identity_step2.py

      - name: Compile CFB market identity routes
        run: |
          python -m py_compile             sports_api/api/cfb_markets.py             sports_api/api/cfb_market_identity_v1.py             sports_api/api/health.py

      - name: Certify market firewall
        run: |
          python - <<'PY'
          from sports_api.api.cfb_market_identity_v1 import MODEL_VERSION
          print(MODEL_VERSION)
          print("projection_weight=0.0")
          print("market_context_only=true")
          print("may_modify_projection=false")
          print("synthetic_official_ids=false")
          print("fuzzy_matching=false")
          print("CFB_ODDS_STEP2_GAME_IDENTITY_GREEN")
          PY
