name: WNBA Step 7G final release freeze cert

on:
  push:
    branches:
      - wnba-step7g-step4j-team-history-20260827
    paths:
      - '.github/workflows/wnba-step-7g-final-release-freeze-cert.yml'
      - 'sports_api/wnba_step7g_release_freeze.py'
      - 'sports_api/wnba_step7g_first_party_integration.py'
      - 'sports_api/wnba_step7g_first_party_officiating.py'
      - 'sports_api/wnba_step7g_first_party_advanced_stats.py'
      - 'sports_api/wnba_step7g_first_party_advanced_stats_contract_safe.py'
      - 'sports_api/wnba_step7g_first_party_shot_context.py'
      - 'sports_api/wnba_step7g_first_party_shot_context_identity_safe.py'
      - 'sports_api/wnba_step7g_first_party_rosters.py'
      - 'sports_api/wnba_step7g_first_party_injury_report.py'
      - 'sports_api/wnba_step7g_first_party_injury_report_coordinate.py'
      - 'sports_api/wnba_step7g_first_party_schedule_context.py'
      - 'sports_api/wnba_step7g_first_party_team_history.py'
      - 'sports_api/wnba_step7g_first_party_team_history_cup_safe.py'
      - 'sports_api/wnba_step7g_first_party_history.py'
      - 'sports_api/wnba_step7g_first_party_availability.py'
      - 'sports_api/tools/wnba_step7g_final_release_freeze_cert.py'
      - 'tests/test_wnba_step7g_cup_exclusion.py'
      - 'tests/test_wnba_step7g_first_party_advanced_contract_units.py'
      - 'tests/test_wnba_step7g_first_party_advanced_stats.py'
      - 'tests/test_wnba_step7g_first_party_injury_report.py'
      - 'tests/test_wnba_step7g_first_party_injury_report_coordinate.py'
      - 'tests/test_wnba_step7g_first_party_integration.py'
      - 'tests/test_wnba_step7g_first_party_officiating.py'
      - 'tests/test_wnba_step7g_first_party_rosters.py'
      - 'tests/test_wnba_step7g_first_party_shot_context.py'
      - 'tests/test_wnba_step7g_first_party_shot_context_identity_safe.py'
      - 'tests/test_wnba_step7g_schedule_context.py'
      - 'tests/test_wnba_step7g_team_history.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step7g-final-release-freeze-cert
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated Step 7G branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert every production switch OFF and Step 7G CI-only ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile final Step 7G release surface
        shell: bash
        run: |
          python -m py_compile sports_api/wnba_step7g_release_freeze.py
          python -m py_compile sports_api/wnba_step7g_first_party_integration.py
          python -m py_compile sports_api/wnba_step7g_first_party_officiating.py
          python -m py_compile sports_api/wnba_step7g_first_party_advanced_stats.py
          python -m py_compile sports_api/wnba_step7g_first_party_advanced_stats_contract_safe.py
          python -m py_compile sports_api/wnba_step7g_first_party_shot_context.py
          python -m py_compile sports_api/wnba_step7g_first_party_shot_context_identity_safe.py
          python -m py_compile sports_api/wnba_step7g_first_party_rosters.py
          python -m py_compile sports_api/wnba_step7g_first_party_injury_report.py
          python -m py_compile sports_api/wnba_step7g_first_party_injury_report_coordinate.py
          python -m py_compile sports_api/wnba_step7g_first_party_schedule_context.py
          python -m py_compile sports_api/wnba_step7g_first_party_team_history.py
          python -m py_compile sports_api/wnba_step7g_first_party_team_history_cup_safe.py
          python -m py_compile sports_api/wnba_step7g_first_party_history.py
          python -m py_compile sports_api/wnba_step7g_first_party_availability.py
          python -m py_compile sports_api/tools/wnba_step7g_final_release_freeze_cert.py

      - name: Run complete Step 7G fail-closed regression surface
        shell: bash
        run: |
          PYTHONPATH=. python tests/test_wnba_step7g_cup_exclusion.py
          PYTHONPATH=. python tests/test_wnba_step7g_schedule_context.py
          PYTHONPATH=. python tests/test_wnba_step7g_team_history.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_rosters.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_injury_report.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_injury_report_coordinate.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_shot_context.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_shot_context_identity_safe.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_advanced_stats.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_advanced_contract_units.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_officiating.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_integration.py

      - name: Prove complete inherited frozen chain unchanged from certified baseline
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE_SHA='368dbde84ea0aa6f570703688ae899285ecd7cfc'
          git fetch origin wnba-step7g-official-data-preflight-20260827 --depth=1
          ACTUAL_BASE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          git diff --exit-code "$EXPECTED_BASE_SHA" -- \
            sports_api/wnba_availability.py \
            sports_api/wnba_rosters.py \
            sports_api/wnba_season_stats.py \
            sports_api/wnba_lineup_context.py \
            sports_api/wnba_schedule.py \
            sports_api/wnba_schedule_context.py \
            sports_api/wnba_team_history.py \
            sports_api/wnba_model_input_readiness.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_shot_context.py \
            sports_api/wnba_advanced_stats.py \
            sports_api/wnba_officiating_context.py \
            sports_api/wnba_player_event_features.py \
            sports_api/wnba_player_opportunity_context.py \
            sports_api/wnba_event_lineup_context.py \
            sports_api/wnba_rotation_context.py

      - name: Certify and freeze real Step 7G release defaults
        shell: bash
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step7g_final_release_freeze_cert

      - name: Upload final Step 7G frozen release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-final-release-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-final-release-freeze-cert.json
          if-no-files-found: warn
          retention-days: 60

      - name: Re-assert every production switch OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
