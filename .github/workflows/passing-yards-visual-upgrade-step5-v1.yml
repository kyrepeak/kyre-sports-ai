name: Passing Yards Visual Upgrade Step 5

on:
  push:
    branches:
      - "monster/passing-yards-visual-upgrade-step5-responsive-v1"

permissions:
  contents: read

jobs:
  targeted-step5:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Step 5 responsive chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v50.py streamlit_memory_lazy_router_v196.py app.py
      - name: Prove desktop tablet mobile responsive contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_visual_upgrade_step5_v1.py
