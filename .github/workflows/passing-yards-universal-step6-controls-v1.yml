name: Passing Yards Universal Step 6 Controls

on:
  pull_request:
    paths:
      - 'app.py'
      - 'nfl_passing_yards_hub_v56.py'
      - 'streamlit_memory_lazy_router_v207.py'
      - 'tests/test_passing_yards_universal_step6_controls_v1.py'
      - 'devsystem/task_ledgers/passing-yards-universal-step6-controls-v1.json'
      - '.github/workflows/passing-yards-universal-step6-controls-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'nfl_passing_yards_hub_v56.py'
      - 'streamlit_memory_lazy_router_v207.py'
      - 'tests/test_passing_yards_universal_step6-controls-v1.py'
      - 'devsystem/task_ledgers/passing-yards-universal-step6-controls-v1.json'
      - '.github/workflows/passing-yards-universal-step6-controls-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-step6-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Step 6 controls chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v56.py streamlit_memory_lazy_router_v207.py app.py tests/test_passing_yards_universal_step6_controls_v1.py

      - name: Run Step 6 controls contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_universal_step6_controls_v1.py

      - name: Verify frozen source chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          v56 = Path("nfl_passing_yards_hub_v56.py").read_text()
          router = Path("streamlit_memory_lazy_router_v207.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v55"' in v56
          assert 'data-passing-yards-control-system="v56"' in v56
          assert 'build_semantic_tokens_css() + _CONTROL_CSS' in v56
          css = v56.split('_CONTROL_CSS = r"""',1)[1].split('"""',1)[0]
          assert not re.search(r'#[0-9a-fA-F]{3,8}', css)
          assert 'rgba(' not in css

          assert 'import streamlit_memory_lazy_router_v206 as prior' in router
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v56"' in router
          assert 'from streamlit_memory_lazy_router_v207 import record_bootstrap_import_ms, render_app' in app
          assert 'from streamlit_memory_lazy_router_v206 import record_bootstrap_import_ms, render_app' in app

          for token in (
              "build_baseline_projection(",
              "build_context_projection(",
              "build_distribution(",
              "evaluate_market(",
              "requests.get(",
              "st.selectbox(",
              "st.date_input(",
              "st.text_input(",
              "st.button(",
          ):
              assert token not in v56, token

          print("PASSING_YARDS_UNIVERSAL_STEP6_STATIC_GREEN")
          PY

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Passing Yards Step 6 controls
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _body_has_forbidden_error,
              BrowserQAFailure,
          )

          base = "https://kyre-sports-ai.streamlit.app"
          router_source = Path("streamlit_memory_lazy_router_v207.py").read_text()
          app_source = Path("app.py").read_text()
          if 'PASSING_HUB = "nfl_passing_yards_hub_v56"' not in router_source:
              raise BrowserQAFailure("PASSING_YARDS_STEP6_SOURCE_OWNER: V207 no longer owns V56")
          if 'from streamlit_memory_lazy_router_v207 import record_bootstrap_import_ms, render_app' not in app_source:
              raise BrowserQAFailure("PASSING_YARDS_STEP6_SOURCE_OWNER: app no longer boots V207")

          artifacts = Path("artifacts/passing-yards-universal-step6-public")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":1280,"height":1200})
              try:
                  route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)

                  revision_deadline = time.monotonic() + 480.0
                  next_route_retry = time.monotonic() + 20.0
                  revision_scan = []
                  while True:
                      revision_scan = []
                      revision_ready = False
                      for index, candidate in enumerate(page.frames):
                          try:
                              step6_style = candidate.locator(
                                  'style[data-passing-yards-control-system="v56"]'
                              ).count()
                              hidden_owner = candidate.locator(
                                  '[data-passing-yards-control-owner="v56"]'
                              ).count()
                              hidden_runtime = candidate.locator(
                                  '[data-passing-yards-v207-runtime="step6"]'
                              ).count()
                              body_start = candidate.locator("body").inner_text(timeout=3000)[:1200]
                          except Exception:
                              step6_style = 0
                              hidden_owner = 0
                              hidden_runtime = 0
                              body_start = ""
                          revision_scan.append({
                              "index": index,
                              "url": candidate.url,
                              "step6_control_style": step6_style,
                              "v56_hidden_owner_diagnostic": hidden_owner,
                              "v207_hidden_runtime_diagnostic": hidden_runtime,
                              "body_start": body_start,
                          })
                          if step6_style == 1:
                              revision_ready = True
                              break

                      if revision_ready:
                          break

                      if time.monotonic() >= revision_deadline:
                          raise BrowserQAFailure(
                              "PASSING_YARDS_STEP6_REVISION_READINESS: "
                              "public Streamlit never exposed the durable V56 control style witness; "
                              + json.dumps(revision_scan, sort_keys=True)
                          )

                      page.wait_for_timeout(1000)
                      now = time.monotonic()
                      if now >= next_route_retry:
                          page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                          next_route_retry = time.monotonic() + 20.0

                  frame, scan = _find_app_frame(page)

                  deadline = time.monotonic() + 75.0
                  evidence = {}
                  while True:
                      body = frame.locator("body").inner_text(timeout=5000)
                      forbidden = _body_has_forbidden_error(body)
                      if forbidden:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP6_RUNTIME: forbidden marker {forbidden}")

                      top = frame.locator(".st-key-kyre_passing_yards_top_v46")
                      evidence = {
                          "step6_control_style": frame.locator('style[data-passing-yards-control-system="v56"]').count(),
                          "v56_hidden_owner_diagnostic": frame.locator('[data-passing-yards-control-owner="v56"]').count(),
                          "v207_hidden_runtime_diagnostic": frame.locator('[data-passing-yards-v207-runtime="step6"]').count(),
                          "step5_analysis_style": frame.locator('style[data-passing-yards-analysis-system="v55"]').count(),
                          "step4_card_style": frame.locator('style[data-passing-yards-card-system="v54"]').count(),
                          "step3_shell_style": frame.locator('style[data-passing-yards-page-shell="v53"]').count(),
                          "step2_token_style": frame.locator('style[data-passing-yards-design-tokens="v52"]').count(),
                          "step1_owner_style": frame.locator('style[data-passing-yards-universal-owner="v51"]').count(),
                          "top_control_deck": top.count(),
                          "slate_date_control": top.locator('[data-testid="stDateInput"]').count() if top.count() else 0,
                          "matchup_control": top.locator('[data-testid="stSelectbox"]').count() if top.count() else 0,
                          "support_details": frame.locator(".ks-py48-support details").count(),
                          "passing_yards_text": "Passing Yards" in body,
                      }

                      if (
                          evidence["step6_control_style"] == 1
                          and evidence["step5_analysis_style"] >= 1
                          and evidence["step4_card_style"] >= 1
                          and evidence["step3_shell_style"] >= 1
                          and evidence["step2_token_style"] >= 1
                          and evidence["step1_owner_style"] >= 1
                          and evidence["top_control_deck"] >= 1
                          and evidence["slate_date_control"] >= 1
                          and evidence["matchup_control"] >= 1
                          and evidence["support_details"] >= 4
                          and evidence["passing_yards_text"]
                      ):
                          break

                      if time.monotonic() >= deadline:
                          raise BrowserQAFailure(
                              "PASSING_YARDS_STEP6_CONTROL_READINESS: "
                              + json.dumps(evidence, sort_keys=True)
                              + f"; body start={body[:2200]!r}"
                          )
                      page.wait_for_timeout(500)

                  top_style = frame.locator(".st-key-kyre_passing_yards_top_v46").first.evaluate(
                      """el => {
                          const s=getComputedStyle(el);
                          return {
                              backgroundImage:s.backgroundImage,
                              borderRadius:s.borderRadius,
                              borderTopColor:s.borderTopColor,
                              boxShadow:s.boxShadow,
                              paddingTop:s.paddingTop
                          };
                      }"""
                  )
                  date_style = frame.locator(
                      ".st-key-kyre_passing_yards_top_v46 [data-testid='stDateInput'] [data-baseweb='input']"
                  ).first.evaluate(
                      """el => {
                          const s=getComputedStyle(el);
                          return {minHeight:s.minHeight,borderRadius:s.borderRadius,backgroundColor:s.backgroundColor};
                      }"""
                  )
                  select_style = frame.locator(
                      ".st-key-kyre_passing_yards_top_v46 [data-testid='stSelectbox'] [data-baseweb='select']>div"
                  ).first.evaluate(
                      """el => {
                          const s=getComputedStyle(el);
                          return {minHeight:s.minHeight,borderRadius:s.borderRadius,backgroundColor:s.backgroundColor};
                      }"""
                  )
                  detail_style = frame.locator(".ks-py48-support details").first.evaluate(
                      """el => {
                          const s=getComputedStyle(el);
                          return {backgroundImage:s.backgroundImage,borderRadius:s.borderRadius,borderTopColor:s.borderTopColor};
                      }"""
                  )

                  if "gradient" not in top_style["backgroundImage"].lower():
                      raise BrowserQAFailure(f"PASSING_YARDS_STEP6_TOP_BACKGROUND: {top_style}")
                  if top_style["borderRadius"] in {"0px", "0"}:
                      raise BrowserQAFailure(f"PASSING_YARDS_STEP6_TOP_RADIUS: {top_style}")
                  if top_style["boxShadow"] in {"none", ""}:
                      raise BrowserQAFailure(f"PASSING_YARDS_STEP6_TOP_SHADOW: {top_style}")
                  for name, style in (("DATE", date_style), ("MATCHUP", select_style)):
                      if style["minHeight"] in {"0px", "0"}:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP6_{name}_HEIGHT: {style}")
                      if style["borderRadius"] in {"0px", "0"}:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP6_{name}_RADIUS: {style}")
                  if "gradient" not in detail_style["backgroundImage"].lower():
                      raise BrowserQAFailure(f"PASSING_YARDS_STEP6_DETAIL_BACKGROUND: {detail_style}")

                  result = {
                      "status":"GREEN",
                      "route":"NFL -> Passing Yards",
                      "owner":"nfl_passing_yards_hub_v56",
                      "frozen_step5":"nfl_passing_yards_hub_v55",
                      "evidence":evidence,
                      "top_control_style":top_style,
                      "date_control_style":date_style,
                      "matchup_control_style":select_style,
                      "detail_control_style":detail_style,
                      "frame_scan_count":len(scan),
                  }
                  (artifacts/"result.json").write_text(json.dumps(result,indent=2),encoding="utf-8")
                  page.screenshot(path=str(artifacts/"passing_yards_step6_controls_green.png"),full_page=True)
                  print("PASSING_YARDS_UNIVERSAL_STEP6_PUBLIC_GREEN")
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload Passing Yards Step 6 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-universal-step6-${{ github.run_id }}
          path: artifacts/passing-yards-universal-step6-public
          if-no-files-found: warn
          retention-days: 7
