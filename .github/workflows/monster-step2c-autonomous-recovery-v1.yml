name: MONSTER Step 2C Autonomous Recovery V1

on:
  pull_request:
    paths:
      - "devsystem/mandatory_2c_autonomous_recovery_v1.py"
      - "devsystem/mandatory_2b_reliability_gate_v1.py"
      - "devsystem/mandatory_2a_action_gate_v1.py"
      - "devsystem/automatic_loop_kill_v1.py"
      - "devsystem/mandatory_2bc_permanent_enforcement_v1.py"
      - "tests/test_devsystem_mandatory_2c_autonomous_recovery_v1.py"
      - "tests/test_devsystem_mandatory_2b_reliability_gate_v1.py"
      - "tests/test_devsystem_step2c_step2b_step2a_integration_v1.py"
      - "tests/test_devsystem_step2b_step2a_integration_v1.py"
      - "tests/test_devsystem_mandatory_2a_action_gate_v1.py"
      - "tests/test_devsystem_automatic_loop_kill_v1.py"
      - "tests/test_devsystem_step2bc_permanent_gate_v1.py"
      - ".github/workflows/monster-step2c-autonomous-recovery-v1.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/mandatory_2c_autonomous_recovery_v1.py"
      - "devsystem/mandatory_2b_reliability_gate_v1.py"
      - "devsystem/mandatory_2a_action_gate_v1.py"
      - "devsystem/automatic_loop_kill_v1.py"
      - "devsystem/mandatory_2bc_permanent_enforcement_v1.py"
      - "tests/test_devsystem_mandatory_2c_autonomous_recovery_v1.py"
      - "tests/test_devsystem_mandatory_2b_reliability_gate_v1.py"
      - "tests/test_devsystem_step2c_step2b_step2a_integration_v1.py"
      - "tests/test_devsystem_step2b_step2a_integration_v1.py"
      - "tests/test_devsystem_mandatory_2a_action_gate_v1.py"
      - "tests/test_devsystem_automatic_loop_kill_v1.py"
      - "tests/test_devsystem_step2bc_permanent_gate_v1.py"
      - ".github/workflows/monster-step2c-autonomous-recovery-v1.yml"

permissions:
  contents: read

concurrency:
  group: monster-step2c-autonomous-recovery-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  step2c-autonomous-recovery-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narrow test dependency
        run: python -m pip install -q pytest
      - name: Step 2C targeted contract tests
        run: python -m pytest -q tests/test_devsystem_mandatory_2c_autonomous_recovery_v1.py
      - name: Step 2C contract self-test
        if: ${{ hashFiles('devsystem/mandatory_2c_autonomous_recovery_v1.py') != '' }}
        run: python devsystem/mandatory_2c_autonomous_recovery_v1.py
      - name: Existing Step 2B contract self-test
        run: python devsystem/mandatory_2b_reliability_gate_v1.py
      - name: Existing Step 2A contract self-test
        run: python devsystem/mandatory_2a_action_gate_v1.py
      - name: Targeted Step 2A + Step 2B + Anti-Loop regressions
        run: |
          python -m pytest -q \
            tests/test_devsystem_mandatory_2b_reliability_gate_v1.py \
            tests/test_devsystem_step2b_step2a_integration_v1.py \
            tests/test_devsystem_mandatory_2a_action_gate_v1.py \
            tests/test_devsystem_automatic_loop_kill_v1.py
      - name: Step 2C end-to-end integration tests
        if: ${{ hashFiles('tests/test_devsystem_step2c_step2b_step2a_integration_v1.py') != '' }}
        run: python -m pytest -q tests/test_devsystem_step2c_step2b_step2a_integration_v1.py
      - name: Step 2B + Step 2C permanent enforcement self-test
        run: python devsystem/mandatory_2bc_permanent_enforcement_v1.py
      - name: Step 2B + Step 2C permanent DevSystem contract
        run: python -m pytest -q tests/test_devsystem_step2bc_permanent_gate_v1.py
