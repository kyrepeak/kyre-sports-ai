name: NFL Receiving Yards Context V1 cert

on:
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
    paths:
      - 'sports_api/collectors/nfl_receiving_yards_context_v1.py'
      - 'sports_api/api/nfl_receiving_yards_context_v1.py'
      - 'sports_api/api/health.py'
      - 'sports_api/tests/test_nfl_receiving_yards_context_v1.py'
      - '.github/workflows/nfl-receiving-yards-context-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-receiving-yards-context-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production API stack and pytest
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Enforce exact five-file Receiving API diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mlb-step17b-shared-host-cert:refs/remotes/origin/mlb-step17b-shared-host-cert
          git diff --name-only origin/mlb-step17b-shared-host-cert...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-receiving-yards-context-v1.yml
          sports_api/api/health.py
          sports_api/api/nfl_receiving_yards_context_v1.py
          sports_api/collectors/nfl_receiving_yards_context_v1.py
          sports_api/tests/test_nfl_receiving_yards_context_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Receiving API diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile additive NFL Receiving Yards files
        run: |
          python -m py_compile sports_api/collectors/nfl_receiving_yards_context_v1.py
          python -m py_compile sports_api/api/nfl_receiving_yards_context_v1.py
          python -m py_compile sports_api/tests/test_nfl_receiving_yards_context_v1.py

      - name: Run deterministic NFL Receiving Yards contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q sports_api/tests/test_nfl_receiving_yards_context_v1.py

      - name: Prove Receiving routes are mounted on the real shared app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from sports_api.main import app
          paths = {getattr(route, 'path', '') for route in app.routes}
          required = {
              '/api/v1/nfl/receiving-yards',
              '/api/v1/nfl/receiving-yards/status',
          }
          missing = sorted(required - paths)
          assert not missing, f'Receiving routes missing from sports_api.main:app: {missing}'
          print('Receiving route registration GREEN:', sorted(required))
          PY

      - name: Re-run frozen NFL Rushing context regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            sports_api/tests/test_nfl_rushing_yards_context_v1.py \
            sports_api/tests/test_nfl_rushing_yards_context_performance_v2.py \
            sports_api/tests/test_nfl_rushing_yards_context_cache_v3.py

      - name: Revalidate shared-host startup and observability contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_production_observability_backport_v1.py
