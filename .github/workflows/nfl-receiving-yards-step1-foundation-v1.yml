name: NFL Receiving Yards Step 1 Foundation V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_receiving_yards_hub_v1.py"
      - "streamlit_memory_lazy_router_v112.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_step1_foundation_v1.py"
      - ".github/workflows/nfl-receiving-yards-step1-foundation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-receiving-yards-step1-foundation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-receiving-step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile Receiving Yards Step 1 surface
        run: |
          python -m py_compile \
            nfl_receiving_yards_hub_v1.py \
            streamlit_memory_lazy_router_v112.py \
            app.py \
            tests/test_nfl_receiving_yards_step1_foundation_v1.py

      - name: Prove certified NFL owners were not modified
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_|nfl_rushing_yards_|streamlit_memory_lazy_router_v(80|81|82|83|84|85|86|87|88|89|90|91|92|93|94|95|96|97|98|99|100|101|102|103|104|105|106|107|108|109|110|111)\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "NFL_RECEIVING_STEP1_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "NFL_RECEIVING_STEP1_FROZEN_OWNER_GUARD_GREEN"

      - name: Run Receiving Yards Step 1 contracts
        run: python -m pytest -q tests/test_nfl_receiving_yards_step1_foundation_v1.py

      - name: Prove Step 1 safety boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path("nfl_receiving_yards_hub_v1.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v112.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          assert 'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0' in hub
          assert 'RECEIVING_YARDS_MARKET = "Receiving Yards"' in hub
          assert 'ACTIVE_RECEIVING_YARDS_HUB = "nfl_receiving_yards_hub_v1"' in router
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v111"' in router
          assert 'from streamlit_memory_lazy_router_v112 import record_bootstrap_import_ms, render_app' in app
          assert 'FROZEN_V111_DEPLOYMENT_HEARTBEAT' in app
          print("NFL_RECEIVING_YARDS_STEP1_FOUNDATION_GREEN")
          PY
