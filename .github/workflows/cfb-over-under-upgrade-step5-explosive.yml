name: CFB O/U Upgrade Step 5 explosive

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step5-explosive']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive Step 5 scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step5-explosive'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step5-explosive.yml' \
            'app.py' \
            'cfb_over_under_explosive_engine_v1.py' \
            'cfb_over_under_matchup_ui_v5.py' \
            'cfb_over_under_slate_v4.py' \
            'streamlit_memory_lazy_router_v45.py' \
            'tests/test_cfb_over_under_upgrade_step5_explosive_engine.py' \
            'tests/test_cfb_over_under_upgrade_step5_slate.py' \
            'tests/test_cfb_over_under_upgrade_step5_ui_router.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U Upgrade Step 5 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_UPGRADE_STEP5_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures=[]
          if rev("HEAD:cfb_freeze_manifest_v12.json") != "3ff2a727967e80dddbe03f747d9f32090cc39539":
              failures.append("CFB Step-12 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen CFB path changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 through 4 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v4.json") != "0d80ddc8269a75c1c999fbea5f432299f49cd511":
              failures.append("O/U Upgrade Step 4 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v4.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen Upgrade Step 1-4 path changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_4_FROZEN=PASS")
          PY

      - name: Enforce logo hotfix V1 through V4 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures=[]
          if rev("HEAD:cfb_over_under_logo_hotfix_freeze_manifest_v4.json") != "b5b42535b0771a6e15d1f8581de325777f3c4177":
              failures.append("logo V4 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v4.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen logo V1-V4 path changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_V4_FROZEN=PASS")
          PY

      - name: Compile Step 5
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_explosive_engine_v1.py \
            cfb_over_under_slate_v4.py \
            cfb_over_under_matchup_ui_v5.py \
            streamlit_memory_lazy_router_v45.py \
            tests/test_cfb_over_under_upgrade_step5_explosive_engine.py \
            tests/test_cfb_over_under_upgrade_step5_slate.py \
            tests/test_cfb_over_under_upgrade_step5_ui_router.py
          PYTHONPATH=. python -c "import cfb_over_under_explosive_engine_v1; import cfb_over_under_slate_v4; import cfb_over_under_matchup_ui_v5; import streamlit_memory_lazy_router_v45"

      - name: Run Step 5 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step5_explosive_engine.py \
            tests/test_cfb_over_under_upgrade_step5_slate.py \
            tests/test_cfb_over_under_upgrade_step5_ui_router.py \
            tests/test_cfb_over_under_upgrade_step4_pace_engine.py \
            tests/test_cfb_over_under_upgrade_step4_slate.py \
            tests/test_cfb_over_under_upgrade_step4_ui_router.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_cfb_over_under_multisource_logo_resolver_v2.py \
            tests/test_cfb_over_under_multisource_logo_hotfix_v4.py \
            tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live NCAA explosive proxy tables are discoverable
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_explosive_engine_v1 as exp

          exp.clear_explosive_engine_cache()
          required = {
              "pass_offense",
              "pass_defense",
              "pass_yards_per_completion",
              "rush_offense",
              "rush_defense",
          }
          for division in ("FBS", "FCS"):
              bundle, diag = exp._load_explosive_division(division)
              tables = bundle.get("tables") or {}
              baselines = bundle.get("baselines") or {}
              print(
                  division,
                  "categories", diag.get("categories"),
                  "rows", {k: len(v) for k, v in tables.items()},
                  "baselines", baselines,
              )
              if not required.issubset(set(tables)):
                  raise SystemExit(f"{division} missing explosive proxy tables: {required-set(tables)}")
              for key in required:
                  if len(tables.get(key) or {}) < 50:
                      raise SystemExit(f"{division} {key} table too small")
              for key in (
                  "pass_ypa",
                  "pass_ypc",
                  "pass_ypa_allowed",
                  "pass_ypc_allowed",
                  "rush_ypr",
                  "rush_ypr_allowed",
              ):
                  if not baselines.get(key):
                      raise SystemExit(f"{division} baseline missing: {key}")
          print("LIVE_NCAA_EXPLOSIVE_PROXY_TABLES=PASS")
          PY

      - name: Live Florida A&M at Miami Step 5 analysis
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v4 as slate

          games, _ = schedule.load_with_diagnostics("2026-09-10")
          game = next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          try:
              slate.analyze_game.clear()
          except Exception:
              pass

          result = slate.analyze_game(game, "2026-09-10", 50.5)
          engine = result.get("explosive_engine") or {}
          raw = result.get("raw") or {}
          away = engine.get("away_offense") or {}
          home = engine.get("home_offense") or {}

          print("EXPLOSIVE", json.dumps({
              "away_division": engine.get("away_division"),
              "home_division": engine.get("home_division"),
              "mixed_division": engine.get("mixed_division"),
              "away_coverage": away.get("coverage"),
              "home_coverage": home.get("coverage"),
              "away_sample": away.get("sample_factor"),
              "home_sample": home.get("sample_factor"),
              "away_signal": away.get("signal"),
              "home_signal": home.get("signal"),
              "away_adjustment": away.get("points_adjustment"),
              "home_adjustment": home.get("points_adjustment"),
              "total_adjustment": (raw.get("components") or {}).get("step5_total_explosive_adjustment"),
              "away_pass": away.get("pass"),
              "away_rush": away.get("rush"),
              "home_pass": home.get("pass"),
              "home_rush": home.get("rush"),
          }, indent=2))

          if not raw.get("ready"):
              raise SystemExit(f"Step 5 raw output not ready: {raw}")
          if not engine.get("model_ready"):
              raise SystemExit(f"Step 5 engine not ready: {engine.get('reason')}")
          if not raw.get("upgrade_step5_applied"):
              raise SystemExit("Step 5 adjustment did not apply")
          if engine.get("away_division") != "FCS" or engine.get("home_division") != "FBS":
              raise SystemExit("Step 5 FCS/FBS identity resolution is wrong")
          if not engine.get("mixed_division"):
              raise SystemExit("Florida A&M @ Miami must be mixed-division")
          if float(away.get("coverage") or 0.0) < 0.60:
              raise SystemExit("away explosive proxy coverage below certified minimum")
          if float(home.get("coverage") or 0.0) < 0.60:
              raise SystemExit("home explosive proxy coverage below certified minimum")
          if abs(float(away.get("points_adjustment") or 0.0)) > 1.750001:
              raise SystemExit("away explosive adjustment exceeded cap")
          if abs(float(home.get("points_adjustment") or 0.0)) > 1.750001:
              raise SystemExit("home explosive adjustment exceeded cap")
          if float(raw.get("analysis_line_explosive_weight") or 0.0) != 0.0:
              raise SystemExit("analysis line leaked into explosive engine")
          if engine.get("true_explosive_pass_rate_available") is not False:
              raise SystemExit("Step 5 falsely claimed true pass explosive rate")
          if engine.get("true_explosive_run_rate_available") is not False:
              raise SystemExit("Step 5 falsely claimed true run explosive rate")
          print("LIVE_FAMU_MIAMI_STEP5_EXPLOSIVE=PASS")
          PY

      - name: Live hero retains logos pace and adds explosive panel
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v4 as slate
          import cfb_over_under_matchup_ui_v5 as ui

          games, _ = schedule.load_with_diagnostics("2026-09-10")
          game = next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          result = slate.analyze_game(game, "2026-09-10", 50.5)
          html = ui._hero_v5(
              game,
              result.get("away") or {},
              result.get("home") or {},
          )
          for token in ("TEAM LOGOS VERIFIED", "UPGRADE STEP 4", "UPGRADE STEP 5"):
              if token not in html:
                  raise SystemExit(f"active Step 5 hero missing: {token}")
          if "20+ yard pass-play" not in html:
              raise SystemExit("explosive-rate transparency note missing")
          print("LIVE_STEP5_HERO_STACK=PASS")
          PY

      - name: Prove Step 5 model firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          exp = Path("cfb_over_under_explosive_engine_v1.py").read_text(encoding="utf-8")
          slate = Path("cfb_over_under_slate_v4.py").read_text(encoding="utf-8")
          ui = Path("cfb_over_under_matchup_ui_v5.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v45.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = exp + "\n" + slate + "\n" + ui + "\n" + router + "\n" + app

          required = [
              'FROZEN_STEP4_ENGINE = "cfb_over_under_pace_engine_v1"',
              'MAX_TEAM_EXPLOSIVE_ADJUSTMENT = 1.75',
              'MIN_SIDE_COVERAGE = 0.60',
              'ANALYSIS_LINE_EXPLOSIVE_WEIGHT = 0.0',
              '"true_explosive_pass_rate_available": False',
              '"true_explosive_run_rate_available": False',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v4"',
              'root._import("cfb_over_under_matchup_ui_v5")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v44"',
              'from streamlit_memory_lazy_router_v45 import render_app',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 5 marker: {token}")

          lower = combined.lower()
          for token in ("sportsbook_api", "np.random", "import random", "monte_carlo("):
              if token in lower:
                  raise SystemExit(f"Step 5 crossed model firewall: {token}")

          print("CFB_OU_UPGRADE_STEP5_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_UPGRADE_STEP5_EXPLOSIVE_GREEN"
