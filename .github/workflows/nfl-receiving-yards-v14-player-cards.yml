name: NFL Receiving Yards V14 Player Cards

on:
  pull_request:
    paths:
      - "nfl_receiving_yards_presentation_v1.py"
      - "nfl_receiving_yards_hub_v14.py"
      - "streamlit_memory_lazy_router_v145.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_player_cards_v14.py"
      - ".github/workflows/nfl-receiving-yards-v14-player-cards.yml"
  workflow_dispatch:

jobs:
  receiving-v14-player-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Receiving Yards V14 player-card contract
        run: python -m pytest -q tests/test_nfl_receiving_yards_player_cards_v14.py
