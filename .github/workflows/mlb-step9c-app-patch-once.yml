name: MLB Step9C app patch one-shot

on:
  push:
    branches:
      - mlb-step9c-live-state-consumer-integration
    paths:
      - .github/workflows/mlb-step9c-app-patch-once.yml

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mlb-step9c-live-state-consumer-integration
          fetch-depth: 0
      - name: Insert additive Step 9C installer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text()
          old = '''_STEP7E_MLB_TOTALS_ROUTE = _install_mlb_totals_step7e_route()
          source = _load_frozen_pre_live_app()
          '''
          new = '''_STEP7E_MLB_TOTALS_ROUTE = _install_mlb_totals_step7e_route()
          try:
              from mlb_step9c_live_state_consumer_v1 import install_step9c_live_state_consumer

              _STEP9C_MLB_LIVE_STATE_CONSUMER = install_step9c_live_state_consumer()
          except Exception as exc:
              _STEP9C_MLB_LIVE_STATE_CONSUMER = {
                  "installed": False,
                  "error_type": type(exc).__name__,
                  "legacy_direct_mlb_live_feed_preserved": True,
              }
          source = _load_frozen_pre_live_app()
          '''
          if old not in text:
              raise SystemExit('STEP9C_APP_SEAM_NOT_FOUND')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git diff --check
          git diff -- app.py
      - name: Commit app-only patch
        run: |
          if git diff --quiet -- app.py; then
            echo "No app change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Install MLB Step 9C consumer in app shell"
          git push origin HEAD:mlb-step9c-live-state-consumer-integration
