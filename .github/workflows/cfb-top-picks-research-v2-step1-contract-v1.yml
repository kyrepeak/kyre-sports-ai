name: CFB Top Picks Research V2 Step 1 Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-research-v2-step1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove audit and frozen data contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python devsystem/cfb_top_picks_research_v2_step1_contract_v1.py
          python -m pytest -q tests/test_cfb_top_picks_research_v2_step1_contract_v1.py
      - name: Freeze tokens
        run: |
          echo "CFB_TOP_PICKS_RESEARCH_V2_STEP1_AUDIT_GREEN"
          echo "CFB_TOP_PICKS_RESEARCH_V2_STEP1_CONTRACT_GREEN"
          echo "CFB_TOP_PICKS_RESEARCH_V2_STEP1_FROZEN_GREEN"
