name: Monster Speed V3 Step 1 Quarantine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-speed-v3-step1-app-fanout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quarantine-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile guard
        run: python -m py_compile devsystem/monster_speed_v3_step1_quarantine_v1.py
      - name: Prove 51 legacy app triggers are quarantined
        run: python devsystem/monster_speed_v3_step1_quarantine_v1.py
      - name: Run regression test
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_monster_speed_v3_step1_quarantine_v1.py
