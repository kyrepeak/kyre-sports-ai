name: WNBA Step 18A route diagnostic

on:
  push:
    branches:
      - wnba-step18a-streamlit-consumer-contract-20260829

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply main-only route registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sports_api/main.py')
          text=p.read_text()
          import_needle='from sports_api.api.wnba_step17c_reliability import router as wnba_step17c_reliability_router\n'
          include_needle='app.include_router(wnba_step17c_reliability_router)\n'
          assert text.count(import_needle)==1
          assert text.count(include_needle)==1
          text=text.replace(import_needle, import_needle+'from sports_api.api.wnba_step18a_consumer import router as wnba_step18a_consumer_router\n',1)
          text=text.replace(include_needle, include_needle+'app.include_router(wnba_step18a_consumer_router)\n',1)
          p.write_text(text)
          PY
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Trace nested route registration mechanics
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib, inspect
          from fastapi import FastAPI
          route_module=importlib.import_module('sports_api.api.wnba_step18a_consumer')
          router=route_module.router
          print('STEP18A_STANDALONE_ROUTER_ROUTES',[(getattr(r,'path',None),sorted(getattr(r,'methods',set()) or set()),type(r).__module__+'.'+type(r).__name__) for r in router.routes])
          import sports_api.main as main
          print('STEP18A_ROUTER_ID_MATCH',getattr(main,'wnba_step18a_consumer_router',None) is router)
          print('STEP18A_INCLUDE_ROUTER_BOUND_MODULE',getattr(main.app.include_router,'__module__',None))
          print('STEP18A_INCLUDE_ROUTER_BOUND_QUALNAME',getattr(main.app.include_router,'__qualname__',None))
          print('STEP18A_FASTAPI_INCLUDE_ROUTER_MODULE',FastAPI.include_router.__module__)
          print('STEP18A_FASTAPI_INCLUDE_ROUTER_QUALNAME',FastAPI.include_router.__qualname__)
          try:
              print('STEP18A_INCLUDE_ROUTER_SOURCE_FILE',inspect.getsourcefile(main.app.include_router))
          except Exception as exc:
              print('STEP18A_INCLUDE_ROUTER_SOURCE_FILE_ERROR',type(exc).__name__)
          tail=main.app.routes[-25:]
          for i,r in enumerate(tail):
              nested=getattr(r,'routes',None)
              nested_rows=[]
              if isinstance(nested,list):
                  nested_rows=[(getattr(x,'path',None),sorted(getattr(x,'methods',set()) or set()),type(x).__module__+'.'+type(x).__name__) for x in nested]
              print('STEP18A_APP_OBJECT',i,type(r).__module__+'.'+type(r).__name__,getattr(r,'path',None),'NESTED',nested_rows)
          direct=sum(1 for r in main.app.routes if getattr(r,'path',None)=='/api/v1/wnba/consumer/latest')
          nested=sum(1 for r in main.app.routes for x in (getattr(r,'routes',None) or []) if getattr(x,'path',None)=='/api/v1/wnba/consumer/latest')
          print('STEP18A_DIRECT_MATCH_COUNT',direct)
          print('STEP18A_NESTED_MATCH_COUNT',nested)
          PY
