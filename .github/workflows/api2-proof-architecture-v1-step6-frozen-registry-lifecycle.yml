name: API2 Proof Architecture V1 Step 6 Frozen Registry Lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api2-proof-architecture-v1-step6-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  registry-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 6 lifecycle contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_api2_frozen_registry_lifecycle_v1.py tests/test_devsystem_api2_frozen_registry_isolation_v1.py
          python devsystem/api2_frozen_artifact_registry_v1.py self-test
          python devsystem/api2_frozen_registry_lifecycle_v1.py self-test
      - name: Audit authoritative API2 registry lifecycle
        run: |
          git fetch origin api2-frozen-registry --depth=1
          git show FETCH_HEAD:devsystem/api2_frozen_registry_state_v1.json > /tmp/api2-step6-registry.json
          python devsystem/api2_frozen_registry_lifecycle_v1.py audit \
            --registry-file /tmp/api2-step6-registry.json \
            --json-out /tmp/api2-step6-audit.json
          cat /tmp/api2-step6-audit.json
          python devsystem/api2_frozen_artifact_registry_v1.py verify-head \
            --registry-file /tmp/api2-step6-registry.json \
            --head HEAD
      - name: Certify exact head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_PROOF_ARCHITECTURE_V1_STEP6_BRANCH_GREEN"
          echo "API2_PROOF_ARCHITECTURE_V1_STEP6_READY_TO_MERGE"
      - name: Certify merged API2 main freeze
        if: github.event_name == 'push' && github.ref == 'refs/heads/api2-main'
        run: |
          echo "API2_PROOF_ARCHITECTURE_V1_STEP6_GREEN"
          echo "API2_PROOF_ARCHITECTURE_V1_STEP6_FROZEN"
