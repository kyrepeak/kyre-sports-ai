name: CFB Game Total page cleanup Step 1 data

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_model_input_v1.py"
      - "cfb_game_total_slate_v2.py"
      - "cfb_game_total_clean_page_v20.py"
      - "streamlit_memory_lazy_router_v165.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step1.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step1-data.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step1.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_model_input_v1.py"
      - "cfb_game_total_slate_v2.py"
      - "cfb_game_total_clean_page_v20.py"
      - "streamlit_memory_lazy_router_v165.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step1.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step1-data.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step1.yml"

permissions:
  contents: read

jobs:
  verify-step1-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile additive Step 1 files
        run: |
          python -m py_compile             cfb_game_total_model_input_v1.py             cfb_game_total_slate_v2.py             cfb_game_total_clean_page_v20.py             streamlit_memory_lazy_router_v165.py             app.py
      - name: Run Step 1 contract regression
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_game_total_page_cleanup_step1.py
      - name: Prove Purdue UCLA normalized model data live
        run: |
          python - <<'PY'
          import json
          import cfb_game_total_clean_page_v9 as page
          import cfb_game_total_slate_v2 as slate_v2

          day = "2026-09-19"
          games, _ = page.frozen_page.frozen_v2.frozen_v1.schedule.load_with_diagnostics(day)
          matches = [
              dict(g) for g in games
              if str(g.get("away_team") or "").strip().casefold() == "purdue"
              and str(g.get("home_team") or "").strip().casefold() == "ucla"
          ]
          assert len(matches) == 1, matches
          result = slate_v2.analyze_game(matches[0], day)
          away = result["away"]
          home = result["home"]
          raw = result["raw"]
          final = result["final"]
          norm = (result["team_diag"].get("normalized_model_input") or {})

          assert int((away.get("record") or {}).get("games") or 0) > 0
          assert int((home.get("record") or {}).get("games") or 0) > 0
          assert away.get("ppg") is not None and away.get("points_allowed_pg") is not None
          assert home.get("ppg") is not None and home.get("points_allowed_pg") is not None
          assert str((away.get("data_quality") or {}).get("grade")) != "CHECK"
          assert str((home.get("data_quality") or {}).get("grade")) != "CHECK"
          assert raw.get("ready") is True, raw.get("reasons")
          assert float(raw["projected_combined_total"]) > 0
          assert final.get("ready") is True, final.get("reasons")
          assert float(final["projected_combined_total"]) > 0
          assert final.get("forecast_strength") is not None
          assert norm.get("fallback_used") is True
          assert norm.get("event_id") == "401858458"
          assert slate_v2.raw_model is slate_v2.frozen.raw_model
          assert slate_v2.final_model is slate_v2.frozen.final_model
          assert slate_v2.model_input.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert slate_v2.model_input.MAY_MODIFY_PROJECTION is False

          print(json.dumps({
              "marker": "CFB_GAME_TOTAL_PAGE_CLEANUP_STEP1_DATA_GREEN",
              "event_id": norm.get("event_id"),
              "away": {
                  "team": away.get("team"),
                  "games": (away.get("record") or {}).get("games"),
                  "ppg": away.get("ppg"),
                  "allowed": away.get("points_allowed_pg"),
              },
              "home": {
                  "team": home.get("team"),
                  "games": (home.get("record") or {}).get("games"),
                  "ppg": home.get("ppg"),
                  "allowed": home.get("points_allowed_pg"),
              },
              "projected_total": raw.get("projected_combined_total"),
              "forecast_strength": final.get("forecast_strength"),
              "final_grade": final.get("grade"),
              "fallback_source": norm.get("source"),
          }, indent=2))
          PY
