name: Passing Yards QB Drill-Down Step 1

on:
  pull_request:
    paths:
      - 'app.py'
      - 'nfl_passing_yards_hub_v58.py'
      - 'streamlit_memory_lazy_router_v209.py'
      - 'tests/test_passing_yards_qb_drilldown_step1_v1.py'
      - 'devsystem/task_ledgers/passing-yards-qb-drilldown-step1-v1.json'
      - '.github/workflows/passing-yards-qb-drilldown-step1-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'nfl_passing_yards_hub_v58.py'
      - 'streamlit_memory_lazy_router_v209.py'
      - 'tests/test_passing_yards_qb_drilldown_step1_v1.py'
      - 'devsystem/task_ledgers/passing-yards-qb-drilldown-step1-v1.json'
      - '.github/workflows/passing-yards-qb-drilldown-step1-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-step1-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce QB drill-down Step 1 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected-build.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step1-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-qb-drilldown-step1-v1.json
          nfl_passing_yards_hub_v58.py
          streamlit_memory_lazy_router_v209.py
          tests/test_passing_yards_qb_drilldown_step1_v1.py
          EOF
          cat > /tmp/expected-deploy-refresh.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step1-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-qb-drilldown-step1-v1.json
          EOF
          cat > /tmp/expected-runtime-classifier.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step1-v1.yml
          devsystem/task_ledgers/passing-yards-qb-drilldown-step1-v1.json
          EOF
          sort -o /tmp/expected-build.txt /tmp/expected-build.txt
          sort -o /tmp/expected-deploy-refresh.txt /tmp/expected-deploy-refresh.txt
          sort -o /tmp/expected-runtime-classifier.txt /tmp/expected-runtime-classifier.txt
          if diff -q /tmp/expected-build.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP1_BUILD_SCOPE_GREEN"
          elif diff -q /tmp/expected-deploy-refresh.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP1_DEPLOY_REFRESH_SCOPE_GREEN"
          elif diff -q /tmp/expected-runtime-classifier.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP1_RUNTIME_CLASSIFIER_SCOPE_GREEN"
          else
            echo "Unexpected Step 1 diff:"
            cat /tmp/actual.txt
            exit 1
          fi

      - name: Compile Step 1 chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v58.py streamlit_memory_lazy_router_v209.py app.py tests/test_passing_yards_qb_drilldown_step1_v1.py

      - name: Run Step 1 contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_qb_drilldown_step1_v1.py

      - name: Verify frozen V57 boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          v58 = Path("nfl_passing_yards_hub_v58.py").read_text()
          v57 = Path("nfl_passing_yards_hub_v57.py").read_text()
          router = Path("streamlit_memory_lazy_router_v209.py").read_text()
          app = Path("app.py").read_text()
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v57"' in v58
          assert 'data-passing-yards-selection-screen="v58"' in v58
          assert 'data-qb-selection-card=' in v58
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v56"' in v57
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v58"' in router
          assert 'from streamlit_memory_lazy_router_v209 import record_bootstrap_import_ms, render_app' in app
          assert 'PASSING_YARDS_QB_DRILLDOWN_STEP1_PUBLIC_DEPLOY_REFRESH = "NFL_PASSING_YARDS_V58_PUBLIC_REFRESH_2026_09_21_R1"' in app
          print("PASSING_YARDS_QB_DRILLDOWN_STEP1_STATIC_GREEN")
          PY

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public QB selection drill-down shell
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _body_has_forbidden_error,
              BrowserQAFailure,
          )

          base = "https://kyre-sports-ai.streamlit.app"
          artifacts = Path("artifacts/passing-yards-qb-drilldown-step1")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)

                  deadline = time.monotonic() + 480.0
                  evidence = {}
                  while True:
                      ready = False
                      for candidate in page.frames:
                          try:
                              cards = candidate.locator('[data-qb-selection-card]')
                              selection = candidate.locator('[data-passing-yards-selection-screen="v58"]')
                              style = candidate.locator('style[data-passing-yards-qb-selection="v58"]')
                              if selection.count() == 1 and cards.count() == 2 and style.count() >= 1:
                                  ready = True
                                  frame = candidate
                                  break
                          except Exception:
                              pass
                      if ready:
                          break
                      if time.monotonic() >= deadline:
                          raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_DEPLOYMENT_READINESS: V58 selection screen not live")
                      # Do not reload while Streamlit is hydrating. Repeated navigation
                      # starves the public app before the V58 DOM can stabilize.
                      page.wait_for_timeout(1500)

                  body = frame.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP1_RUNTIME: forbidden marker {forbidden}")

                  evidence = {
                      "selection_screen": frame.locator('[data-passing-yards-selection-screen="v58"]').count(),
                      "selection_cards": frame.locator('[data-qb-selection-card]').count(),
                      "select_links": frame.locator('a[data-qb-select]').count(),
                      "legacy_full_player_cards": frame.locator(".ks-py48-player").count(),
                      "legacy_step_blocks": frame.locator(".ks-py48-step").count(),
                      "legacy_market_blocks": frame.locator(".ks-py48-market").count(),
                      "old_evidence_board_text": "Steps 7–9 Evidence Board" in body,
                      "view_analysis_text": body.count("View Analysis"),
                  }
                  if evidence["selection_cards"] != 2 or evidence["select_links"] != 2:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_SELECTION_COUNT: " + json.dumps(evidence,sort_keys=True))
                  if evidence["legacy_full_player_cards"] or evidence["legacy_step_blocks"] or evidence["legacy_market_blocks"] or evidence["old_evidence_board_text"]:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_OLD_ONE_SCREEN_LEAK: " + json.dumps(evidence,sort_keys=True))
                  if evidence["view_analysis_text"] < 2:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_ACTIONS_MISSING: " + json.dumps(evidence,sort_keys=True))

                  shell = frame.locator(".st-key-kyre_passing_yards_shell_v1").first
                  shell_metrics = shell.evaluate("""el => ({clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,left:el.getBoundingClientRect().left,right:el.getBoundingClientRect().right})""")
                  if shell_metrics["scrollWidth"] > shell_metrics["clientWidth"] + 4:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP1_MOBILE_OVERFLOW: {shell_metrics}")

                  links = frame.locator('a[data-qb-select]')
                  href0 = links.nth(0).get_attribute("href") or ""
                  if "ks_qb_slot=1" not in href0 or "ks_py_matchup=" not in href0 or "ks_py_date=" not in href0:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP1_CONTEXT_LINK: {href0}")

                  first_link = frame.locator('a[data-qb-select="1"]').first
                  first_qb_name = first_link.locator(".kpass29-name").inner_text(timeout=5000).strip()
                  link_target = first_link.get_attribute("target")

                  # Streamlit's rendered markdown anchor opens in a new tab. Follow
                  # the actual user navigation instead of watching the original frame.
                  if link_target == "_blank":
                      with page.expect_popup(timeout=15000) as popup_info:
                          first_link.click()
                      interaction_page = popup_info.value
                      interaction_page.wait_for_load_state("domcontentloaded", timeout=120000)
                  else:
                      first_link.click()
                      interaction_page = page

                  selected_deadline = time.monotonic() + 90.0
                  while True:
                      selected = None
                      for candidate in interaction_page.frames:
                          try:
                              if candidate.locator('[data-passing-yards-selected-qb="1"]').count() == 1:
                                  selected = candidate
                                  break
                          except Exception:
                              pass
                      if selected is not None:
                          frame = selected
                          break
                      if time.monotonic() >= selected_deadline:
                          raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_SELECT_ACTION: selected QB shell did not render")
                      interaction_page.wait_for_timeout(500)

                  selected_body = frame.locator("body").inner_text(timeout=5000)
                  selected_evidence = {
                      "selected_shell": frame.locator('[data-passing-yards-selected-qb="1"]').count(),
                      "back_action": frame.locator('a[data-qb-back="true"]').count(),
                      "legacy_full_player_cards": frame.locator(".ks-py48-player").count(),
                      "legacy_step_blocks": frame.locator(".ks-py48-step").count(),
                      "selected_quarterback_text": "SELECTED QUARTERBACK" in selected_body,
                      "selected_qb_name": first_qb_name,
                      "selected_qb_identity_visible": bool(first_qb_name and first_qb_name in selected_body),
                      "navigation_target": link_target,
                  }
                  if selected_evidence["selected_shell"] != 1 or selected_evidence["back_action"] != 1:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_SELECTED_SHELL: " + json.dumps(selected_evidence,sort_keys=True))
                  if not selected_evidence["selected_qb_identity_visible"]:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_SELECTED_IDENTITY: " + json.dumps(selected_evidence,sort_keys=True))
                  if selected_evidence["legacy_full_player_cards"] or selected_evidence["legacy_step_blocks"]:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_SELECTED_OLD_ANALYSIS_LEAK: " + json.dumps(selected_evidence,sort_keys=True))

                  back_link = frame.locator('a[data-qb-back="true"]').first
                  back_target = back_link.get_attribute("target")
                  if back_target == "_blank":
                      with interaction_page.expect_popup(timeout=15000) as back_popup_info:
                          back_link.click()
                      return_page = back_popup_info.value
                      return_page.wait_for_load_state("domcontentloaded", timeout=120000)
                  else:
                      back_link.click()
                      return_page = interaction_page

                  back_deadline = time.monotonic() + 90.0
                  while True:
                      restored = None
                      for candidate in return_page.frames:
                          try:
                              if candidate.locator('[data-passing-yards-selection-screen="v58"]').count() == 1 and candidate.locator('[data-qb-selection-card]').count() == 2:
                                  restored = candidate
                                  break
                          except Exception:
                              pass
                      if restored is not None:
                          frame = restored
                          break
                      if time.monotonic() >= back_deadline:
                          raise BrowserQAFailure("PASSING_YARDS_QB_STEP1_BACK_ACTION: selection screen did not restore")
                      return_page.wait_for_timeout(500)

                  result = {
                      "status":"GREEN",
                      "route":"NFL -> Passing Yards",
                      "owner":"nfl_passing_yards_hub_v58",
                      "router":"streamlit_memory_lazy_router_v209",
                      "landing":evidence,
                      "selected":selected_evidence,
                      "mobile_shell":shell_metrics,
                  }
                  (artifacts/"result.json").write_text(json.dumps(result,indent=2),encoding="utf-8")
                  page.screenshot(path=str(artifacts/"qb_selection_mobile.png"),full_page=True)
                  print("PASSING_YARDS_QB_DRILLDOWN_STEP1_PUBLIC_GREEN")
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload QB drill-down Step 1 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-qb-drilldown-step1-${{ github.run_id }}
          path: artifacts/passing-yards-qb-drilldown-step1
          if-no-files-found: warn
          retention-days: 7


  public-runtime-classifier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install classifier dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Classify public runtime identity
        run: |
          python - <<'PY'
          import json
          import time
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health

          base = "https://kyre-sports-ai.streamlit.app"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                  page.wait_for_timeout(30000)

                  best = None
                  for candidate in page.frames:
                      try:
                          body = candidate.locator("body").inner_text(timeout=3000)
                          evidence = {
                              "url": candidate.url,
                              "v209_runtime": candidate.locator('[data-passing-yards-v209-runtime="qb-selection-step1"]').count(),
                              "v208_runtime": candidate.locator('[data-passing-yards-v208-runtime="step7"]').count(),
                              "v58_selection_style": candidate.locator('style[data-passing-yards-qb-selection="v58"]').count(),
                              "v58_selection_screen": candidate.locator('[data-passing-yards-selection-screen="v58"]').count(),
                              "v58_selection_cards": candidate.locator('[data-qb-selection-card]').count(),
                              "v57_responsive_style": candidate.locator('style[data-passing-yards-responsive-system="v57"]').count(),
                              "old_v48_players": candidate.locator(".ks-py48-player").count(),
                              "old_evidence_text": "Steps 7–9 Evidence Board" in body,
                              "passing_yards_text": "Passing Yards" in body or "PASSING YARDS" in body,
                              "body_excerpt": body[:1800],
                          }
                          score = sum(int(bool(v)) for k,v in evidence.items() if k not in {"url","body_excerpt"} and isinstance(v,(int,bool)))
                          if best is None or score > best[0]:
                              best = (score,evidence)
                      except Exception:
                          pass

                  evidence = best[1] if best else {"error":"no readable frame"}
                  if evidence.get("v209_runtime"):
                      classification = "V209_LIVE"
                  elif evidence.get("v208_runtime") or evidence.get("v57_responsive_style") or evidence.get("old_v48_players"):
                      classification = "STALE_PRE_V209_RUNTIME"
                  else:
                      classification = "UNRESOLVED_RUNTIME_IDENTITY"

                  print("PASSING_YARDS_QB_STEP1_RUNTIME_CLASSIFICATION=" + classification)
                  print(json.dumps(evidence, indent=2, sort_keys=True))
              finally:
                  browser.close()
          PY



  public-interaction-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install interaction proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public QB popup interaction path
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health

          base = "https://kyre-sports-ai.streamlit.app"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)

                  frame = None
                  deadline = time.monotonic() + 90.0
                  while time.monotonic() < deadline:
                      for candidate in page.frames:
                          try:
                              if (
                                  candidate.locator('[data-passing-yards-selection-screen="v58"]').count() == 1
                                  and candidate.locator('[data-qb-selection-card]').count() == 2
                              ):
                                  frame = candidate
                                  break
                          except Exception:
                              pass
                      if frame is not None:
                          break
                      page.wait_for_timeout(500)
                  assert frame is not None, "QB picker did not stabilize"

                  link = frame.locator('a[data-qb-select="1"]').first
                  href = link.get_attribute("href") or ""
                  assert "ks_qb_slot=1" in href, href
                  assert link.get_attribute("target") == "_blank"

                  with page.expect_popup(timeout=15000) as popup_info:
                      link.click()
                  selected_page = popup_info.value
                  selected_page.wait_for_load_state("domcontentloaded", timeout=120000)

                  selected_frame = None
                  selected_deadline = time.monotonic() + 90.0
                  while time.monotonic() < selected_deadline:
                      for candidate in selected_page.frames:
                          try:
                              if candidate.locator('[data-passing-yards-selected-qb="1"]').count() == 1:
                                  selected_frame = candidate
                                  break
                          except Exception:
                              pass
                      if selected_frame is not None:
                          break
                      selected_page.wait_for_timeout(500)
                  assert selected_frame is not None, "selected QB shell did not render in popup"

                  back = selected_frame.locator('a[data-qb-back="true"]').first
                  assert back.count() == 1
                  with selected_page.expect_popup(timeout=15000) as back_popup_info:
                      back.click()
                  return_page = back_popup_info.value
                  return_page.wait_for_load_state("domcontentloaded", timeout=120000)

                  restored = False
                  back_deadline = time.monotonic() + 90.0
                  while time.monotonic() < back_deadline:
                      for candidate in return_page.frames:
                          try:
                              if (
                                  candidate.locator('[data-passing-yards-selection-screen="v58"]').count() == 1
                                  and candidate.locator('[data-qb-selection-card]').count() == 2
                              ):
                                  restored = True
                                  break
                          except Exception:
                              pass
                      if restored:
                          break
                      return_page.wait_for_timeout(500)

                  assert restored, "Back to Quarterbacks did not restore picker"
                  print("PASSING_YARDS_QB_STEP1_POPUP_INTERACTION_GREEN")
              finally:
                  browser.close()
          PY
