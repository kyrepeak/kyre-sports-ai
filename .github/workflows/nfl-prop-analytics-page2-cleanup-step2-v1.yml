name: NFL Prop Analytics Page 2 Cleanup Step 2

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_prop_analytics_matchup_shell_v1.py"
      - "tests/test_nfl_prop_analytics_page2_cleanup_step2_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step2-remove-shell-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-cleanup-step2-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_matchup_shell_v1.py"
      - "tests/test_nfl_prop_analytics_page2_cleanup_step2_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step2-remove-shell-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-cleanup-step2-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-page2-cleanup-step2-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce cleanup Step 2 scope and frozen stack
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-cleanup-step2-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step2-remove-shell-v1.json' \
            'nfl_prop_analytics_matchup_shell_v1.py' \
            'tests/test_nfl_prop_analytics_page2_cleanup_step2_v1.py' | sort)"
          test "$actual" = "$expected" || { echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_SCOPE_VIOLATION; printf '%s\n' "$actual"; exit 1; }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || { echo "PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_FROZEN_BLOB_CHANGED:$1:$got:$2"; exit 1; }
          }
          check_blob nfl_prop_analytics_hub_v1.py 0a604db75dc630a1a75b2d5b43b8b2c9d2ebacfd
          check_blob nfl_prop_analytics_page2_responsive_polish_v1.py 61ae896231062e112cc6bb710d4f7c28a16e8d0a
          check_blob nfl_prop_analytics_page2_unified_roster_v1.py 2738254b5a914df777de5a66fc41b2bb4a9ea56c
          check_blob nfl_prop_analytics_page2_tap_player_v1.py 2cd66941f23582d138f8fe92c2e9b0af25150a3b
          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob nfl_prop_analytics_availability_depth_v1.py cf7fdeee4c18d95c19d2a737f59bda7818e059ae
          check_blob nfl_prop_analytics_player_select_v1.py b9aa4ec194ffea970d6858dcd0e0ed7c31ae0426
          check_blob nfl_prop_analytics_prop_page_v1.py c1dc331b6bb63558229ae2dba2e36b4b8c1951fe
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1
          echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_SCOPE_GREEN
          echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_FROZEN_STACK_GREEN

      - name: Install static stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Prove obsolete shell is no longer rendered
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_matchup_shell_v1.py
          python -m pytest -q tests/test_nfl_prop_analytics_page2_cleanup_step2_v1.py tests/test_nfl_prop_analytics_step4_page2_shell_v1.py
          echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_STATIC_GREEN

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Start branch Streamlit
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/cleanup-step2.log 2>&1 &
      - name: Prove obsolete shell removed and real Page 2 preserved
        run: |
          python - <<'PY'
          import time, requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          else: raise RuntimeError("CLEANUP_STEP2_LOCAL_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc.first
                      except Exception:pass
                  page.wait_for_timeout(250)
              raise RuntimeError("CLEANUP_STEP2_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":768,"height":1024})
              page.goto(base+"/?"+urlencode({
                  "ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics",
                  "ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"
              }),wait_until="domcontentloaded",timeout=120000)

              frame,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',150)
              find(page,'[data-prop-page2-premium-header="v1"]',60)
              _,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180)
              assert board.get_attribute("data-prop-page2-unified-state")=="live"
              _,flt=find(page,'[data-prop-page2-position-filter="v1"]',60)
              assert flt.get_attribute("data-prop-page2-position-filter-options")=="ALL,QB,RB,WR,TE"
              _,tap=find(page,'[data-prop-page2-tap-player="v1"]',180)
              assert tap.get_attribute("data-prop-page2-tap-state")=="ready"
              find(page,'[data-prop-page2-responsive-polish="v1"]',60)

              assert frame.locator('[data-prop-page2-team-shell]').count()==0
              assert frame.locator('[data-prop-page2-roster-state="pending"]').count()==0
              body=frame.locator("body").inner_text()
              assert "Position shell ready" not in body
              assert "Roster data is intentionally deferred to the next step." not in body
              assert "Roster layer arrives in the next step." not in body

              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_BRANCH_OBSOLETE_SHELL_GONE_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_BRANCH_REAL_ROSTER_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_BRANCH_GREEN")
              browser.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public obsolete shell gone and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc.first
                      except Exception:pass
                  page.wait_for_timeout(250)
              raise RuntimeError("CLEANUP_STEP2_PUBLIC_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              deadline=time.monotonic()+1200
              last=""
              while True:
                  context=browser.new_context(viewport={"width":768,"height":1024})
                  page=context.new_page()
                  try:
                      page.goto(base+"/?"+urlencode({
                          "ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics",
                          "ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"
                      }),wait_until="domcontentloaded",timeout=120000)
                      frame,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',150)
                      _,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',150)
                      _,tap=find(page,'[data-prop-page2-tap-player="v1"]',150)
                      body=frame.locator("body").inner_text()
                      old_count=frame.locator('[data-prop-page2-team-shell]').count()
                      if board.get_attribute("data-prop-page2-unified-state")=="live" and tap.get_attribute("data-prop-page2-tap-state")=="ready" and old_count==0 and "Position shell ready" not in body:
                          break
                      last=f"WAIT:old={old_count}"
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                  try: context.close()
                  except Exception: pass
                  if time.monotonic()>deadline: raise RuntimeError("CLEANUP_STEP2_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)
                  time.sleep(8)

              find(page,'[data-prop-page2-premium-header="v1"]',60)
              _,flt=find(page,'[data-prop-page2-position-filter="v1"]',60)
              assert flt.get_attribute("data-prop-page2-position-filter-options")=="ALL,QB,RB,WR,TE"
              find(page,'[data-prop-page2-responsive-polish="v1"]',60)
              assert frame.locator('[data-prop-page2-team-shell]').count()==0
              assert frame.locator('[data-prop-page2-roster-state="pending"]').count()==0
              body=frame.locator("body").inner_text()
              for token in ("Position shell ready","Roster data is intentionally deferred to the next step.","Roster layer arrives in the next step."):
                  assert token not in body,token

              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_PUBLIC_OBSOLETE_SHELL_GONE_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_PUBLIC_REAL_ROSTER_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_PUBLIC_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP2_FROZEN")
              page.close();context.close();browser.close()
          PY
