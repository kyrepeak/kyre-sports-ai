name: College Football scoreboard-completeness permanent freeze

on:
  workflow_dispatch:
  push:
    branches: ['cfb-scoreboard-completeness-freeze']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-scoreboard-completeness-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-scoreboard-completeness-permanent-freeze.yml' \
            'cfb_scoreboard_completeness_freeze_manifest_v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB scoreboard completeness freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_SCOREBOARD_FREEZE_SCOPE=PASS"

      - name: Enforce frozen prior CFB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v5.json").read_text())
          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB Step 1-5 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Step 1-5 blob changed: {path} expected={expected} actual={actual}"
                  )

          hotfix = json.loads(
              pathlib.Path("cfb_mixed_division_freeze_manifest_v1.json").read_text()
          )
          for path, expected in hotfix.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing mixed-division frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"mixed-division frozen blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_PRIOR_FREEZES=PASS")
          PY

      - name: Enforce scoreboard-completeness exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(
              pathlib.Path("cfb_scoreboard_completeness_freeze_manifest_v1.json").read_text()
          )

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 1:
              failures.append("scoreboard-completeness freeze version mismatch")
          if m.get("baseline_commit") != "cc985cbab14dcc81a744ae98ef2f91b1280328c2":
              failures.append("scoreboard-completeness baseline mismatch")
          if m.get("certified_pr") != 180:
              failures.append("scoreboard-completeness certified PR mismatch")

          required = {
              "cfb_schedule_v3.py",
              "cfb_moneyline_hub_v4.py",
              "streamlit_memory_lazy_router_v29.py",
          }
          if set(m.get("exact_blobs", {})) != required:
              failures.append("scoreboard-completeness exact path set mismatch")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing scoreboard-completeness path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen scoreboard-completeness blob changed: {path} "
                      f"expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_SCOREBOARD_EXACT_FREEZE=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_SCOREBOARD_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen scoreboard hotfix
        run: |
          python -m py_compile \
            cfb_schedule_v3.py \
            cfb_moneyline_hub_v4.py \
            streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py

      - name: Run frozen scoreboard regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Lock atomic official-slate boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          schedule = Path("cfb_schedule_v3.py").read_text(encoding="utf-8")
          hub = Path("cfb_moneyline_hub_v4.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v29.py").read_text(encoding="utf-8")

          required = [
              'FROZEN_SCHEDULE = "cfb_schedule_v2"',
              'NCAA_SCOREBOARD_DIVISION = 11',
              'NCAA_SCOREBOARD_HASH = "7287cda610a9326931931080cb3a604828febe6fe3c9016a7e4a36db99efdb7c"',
              'FROZEN_CFB_MONEYLINE_HUB = "cfb_moneyline_hub_v3"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v28"',
              'if official:',
              '"fallback_mode": 0',
          ]
          combined = schedule + "\n" + hub + "\n" + router
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing frozen scoreboard marker: {token}")

          print("CFB_SCOREBOARD_ATOMIC_SLATE_BOUNDARY=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_SCOREBOARD_PERMANENT_FREEZE_GREEN"
