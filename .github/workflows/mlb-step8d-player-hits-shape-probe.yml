name: MLB Step8D temporary player hits shape probe

on:
  push:
    branches:
      - mlb-step8d-player-hits-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe linked and hidden player-total surfaces
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json

          from sports_api.collectors.mlb_fanduel_player_props import (
              FANDUEL_FDX_BASE_URL,
              PLAYER_HITS,
              _get_json,
              _provider_market_type,
              _rows,
              collect_live_mlb_player_props,
              fetch_fanduel_event_prop_tab,
              market_family,
          )
          from sports_api.collectors.mlb_fanduel_direct import (
              FANDUEL_BASE_URL,
              FANDUEL_HEADERS,
              FANDUEL_PUBLIC_WEB_KEY,
          )

          snapshot = collect_live_mlb_player_props(now_utc=datetime.now(timezone.utc), max_events=4)
          event_ids = sorted({str(row.get('source_event_id')) for row in snapshot.get('props', []) if row.get('source_event_id')})
          assert event_ids, snapshot
          event_id = event_ids[0]
          batter = fetch_fanduel_event_prop_tab(event_id, 'batter-props')
          layout = batter.get('layout') or {}
          cards = layout.get('cards') or {}
          batter_card = cards.get('253') or cards.get(253) or {}
          card_market_types = list(batter_card.get('marketTypes') or []) if isinstance(batter_card, dict) else []
          hit_card_types = [str(x) for x in card_market_types if 'HIT' in str(x).upper()]
          print('BATTER_CARD_HIT_MARKET_TYPES', json.dumps(hit_card_types, sort_keys=True))
          print('BATTER_CARD_DISPLAY', json.dumps((batter_card.get('display') or []) if isinstance(batter_card,dict) else [], sort_keys=True, default=str))

          attachments = batter.get('attachments') or {}
          markets = _rows(attachments.get('markets')) if isinstance(attachments, dict) else []
          linked_ids = []
          for market in markets:
              ptype = _provider_market_type(market)
              if market_family(ptype) != PLAYER_HITS:
                  continue
              for assoc in market.get('associatedMarkets') or []:
                  if isinstance(assoc, dict) and assoc.get('externalMarketId'):
                      linked_ids.append(str(assoc['externalMarketId']))
          linked_ids = sorted(set(linked_ids))[:2]
          print('LINKED_EXTERNAL_MARKET_IDS', linked_ids)

          hidden_tabs = ['player-totals','batter-totals','player-hits','hits','player-props','all-props','all']
          for tab in hidden_tabs:
              try:
                  payload = _get_json(
                      f'{FANDUEL_BASE_URL}/sbapi/event-page',
                      {'_ak':FANDUEL_PUBLIC_WEB_KEY,'eventId':event_id,'tab':tab},
                      headers=FANDUEL_HEADERS,
                      timeout=15,
                  )
              except Exception as exc:
                  print('TAB_PROBE', tab, 'ERROR', type(exc).__name__, str(exc)[:200])
                  continue
              a = payload.get('attachments') or {}
              ms = _rows(a.get('markets')) if isinstance(a,dict) else []
              hit_types = sorted({_provider_market_type(m) for m in ms if 'HIT' in _provider_market_type(m)})
              two_way_hit = []
              for m in ms:
                  ptype = _provider_market_type(m)
                  if 'HIT' not in ptype:
                      continue
                  runners = _rows(m.get('runners'))
                  roles = sorted({str((r.get('result') or {}).get('type') or '').upper() for r in runners if isinstance(r,dict)})
                  if len(runners) == 2 and roles == ['OVER','UNDER']:
                      two_way_hit.append(ptype)
              print('TAB_PROBE', tab, 'MARKETS', len(ms), 'HIT_TYPES', hit_types, 'TWO_WAY_HIT_TYPES', sorted(set(two_way_hit)))

          candidate_paths = [
              f'/v1/live/event/{event_id}',
              f'/v1/live/event/{event_id}/markets',
          ]
          for ext in linked_ids:
              candidate_paths += [
                  f'/v1/live/market/{ext}',
                  f'/v1/live/markets/{ext}',
                  f'/v1/market/{ext}',
              ]
          for path in candidate_paths:
              try:
                  payload = _get_json(FANDUEL_FDX_BASE_URL + path, headers=FANDUEL_HEADERS, timeout=15)
                  text = json.dumps(payload, sort_keys=True, default=str)
                  hitish = 'TOTAL_HITS' in text.upper() or 'OVER' in text.upper() and 'UNDER' in text.upper() and 'HIT' in text.upper()
                  print('FDX_PROBE', path, 'OK', 'ROOT_KEYS', sorted(payload), 'HITISH_TWO_WAY_SIGNAL', hitish, 'SIZE', len(text))
              except Exception as exc:
                  print('FDX_PROBE', path, 'ERROR', type(exc).__name__, str(exc)[:220])

          print('MLB_STEP8D_LINKED_HIDDEN_SURFACE_PROBE_COMPLETE')
          PY
