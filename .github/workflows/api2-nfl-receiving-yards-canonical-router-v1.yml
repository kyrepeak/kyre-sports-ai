name: API2 NFL Receiving Yards Canonical Router V1

on:
  pull_request:
    branches: [api2-main]
    paths:
      - "api2_universal_sports_router_registry_v1.py"
      - "universal_runtime_v5_loader.py"
      - "nfl_receiving_yards_hub_v21.py"
      - "tests/test_api2_nfl_receiving_yards_canonical_router_v1.py"
      - ".github/workflows/api2-nfl-receiving-yards-canonical-router-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving-yards-canonical-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile router ownership files
        run: python -m py_compile api2_universal_sports_router_registry_v1.py universal_runtime_v5_loader.py nfl_receiving_yards_hub_v21.py tests/test_api2_nfl_receiving_yards_canonical_router_v1.py
      - name: Prove Receiving Yards canonical ownership
        run: python -m pytest --noconftest -q tests/test_api2_nfl_receiving_yards_canonical_router_v1.py
