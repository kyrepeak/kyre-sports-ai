name: Monster One-Command Certification V1

on:
  pull_request:
    branches: [main]
    paths:
      - "sports_api/monster_certification_v1.py"
      - "tests/test_monster_certification_v1.py"
      - ".github/workflows/monster-one-command-certification-v1.yml"
  push:
    branches: [main]
    paths:
      - "sports_api/monster_certification_v1.py"
      - "tests/test_monster_certification_v1.py"
      - ".github/workflows/monster-one-command-certification-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-one-command-certification-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monster-one-command-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile certification engine
        run: python -m py_compile sports_api/monster_certification_v1.py

      - name: Run certification engine contracts
        run: python -m pytest -q tests/test_monster_certification_v1.py

      - name: Run the real one-command certification
        run: |
          python -m sports_api.monster_certification_v1 --json > /tmp/monster-certification.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/monster-certification.json').read_text())
          assert receipt['certification_version'] == 'MONSTER_ONE_COMMAND_CERTIFICATION_V1'
          assert receipt['status'] == 'PASS'
          assert receipt['required_check_count'] == 7
          assert receipt['executed_check_count'] == 7
          assert receipt['passed_check_count'] == 7
          assert receipt['failed_check_count'] == 0
          assert receipt['all_required_executed'] is True
          protections = receipt['protections']
          assert protections['projection_weight'] == 0.0
          assert protections['may_modify_projection'] is False
          assert protections['may_modify_source_data'] is False
          assert protections['may_modify_runtime'] is False
          assert protections['network_calls'] is False
          assert protections['fuzzy_matching'] is False
          assert protections['replaces_devsystem_final_gate'] is False
          assert protections['authoritative_merge_gate'] == 'devsystem-final-gate'
          print(
              'certified:',
              receipt['passed_check_count'],
              '/',
              receipt['required_check_count'],
              'checks in',
              receipt['duration_ms'],
              'ms',
          )
          PY

      - name: Prove certification remains outside production entrypoints
        run: |
          python - <<'PY'
          from sports_api.monster_dependency_map_v1 import build_dependency_map

          graph = build_dependency_map('.')
          report = graph.impact_report('sports_api/monster_certification_v1.py')
          assert report['status'] == 'OK'
          assert report['impacted_entrypoints'] == []
          print(
              f"certification blast_radius={report['blast_radius']} "
              f"entrypoints={report['impacted_entrypoints']}"
          )
          PY

      - name: Prove Step 7 cannot weaken frozen protections
        run: |
          python - <<'PY'
          from sports_api.monster_certification_v1 import (
              AUTHORITATIVE_MERGE_GATE,
              FUZZY_MATCHING,
              MAY_MODIFY_PROJECTION,
              MAY_MODIFY_RUNTIME,
              MAY_MODIFY_SOURCE_DATA,
              NETWORK_CALLS,
              PROJECTION_WEIGHT,
              REPLACES_DEVSYSTEM_FINAL_GATE,
          )

          assert PROJECTION_WEIGHT == 0.0
          assert MAY_MODIFY_PROJECTION is False
          assert MAY_MODIFY_SOURCE_DATA is False
          assert MAY_MODIFY_RUNTIME is False
          assert NETWORK_CALLS is False
          assert FUZZY_MATCHING is False
          assert REPLACES_DEVSYSTEM_FINAL_GATE is False
          assert AUTHORITATIVE_MERGE_GATE == 'devsystem-final-gate'
          print('Step 7 is read-only; frozen DevSystem remains authoritative')
          PY
