name: MLB Step13B runtime supervisor certification

on:
  push:
    branches:
      - mlb-step13b-runtime-supervisor
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP13B_BASE_SHA: 1587b4825ad5ce01c8dcd669417da6046ede6921

jobs:
  certify-runtime-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests

      - name: Assert Step13B is exactly three-file additive MLB scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP13B_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/mlb_step13b_runtime_supervisor_v1.py|tests/test_mlb_step13b_runtime_supervisor_v1.py|\.github/workflows/mlb-step13b-runtime-supervisor-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP13B_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 3 ]; then
            echo "STEP13B_EXPECTED_EXACTLY_THREE_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP13B_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          git diff --check "$STEP13B_BASE_SHA"...HEAD
          numstat="$(git diff --numstat "$STEP13B_BASE_SHA"...HEAD)"
          printf '%s\n' "$numstat"
          if printf '%s\n' "$numstat" | awk '$2 != 0 { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'STEP13B_DELETIONS_FORBIDDEN'
            exit 1
          fi
          echo 'MLB_STEP13B_THREE_FILE_ADDITIVE_SCOPE_OK'

      - name: Prove Step13A Step12 and frozen production paths remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP13B_BASE_SHA"...HEAD -- \
            app.py engine.py history.py spread_engine.py \
            live_game_hub_v182.py live_game_hub_v19.py live_game_hub_v191.py \
            live_game_hub_v192.py live_game_hub_v1921.py mlb_live_hub_v193.py live_odds_feed.py \
            mlb_step9c_live_state_consumer_v1.py mlb_step9e_live_market_consumer_v1.py \
            sports_api/main.py sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/collectors/mlb_fanduel_inplay.py \
            sports_api/collectors/mlb_draftkings_provider.py \
            sports_api/mlb_official_game_id_join_v1.py \
            sports_api/mlb_live_market_context_v1.py \
            sports_api/mlb_step9a_live_game_state_api_contract_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/mlb_step9g_postfreeze_handoff_v1.py \
            sports_api/mlb_step10a_live_snapshot_persistence_contract_v1.py \
            sports_api/database/mlb_live_snapshot_store.py \
            sports_api/database/mlb_live_snapshot_recovery.py \
            sports_api/mlb_step10_final_persistence_freeze_v1.py \
            sports_api/mlb_step11a_provider_contract_v1.py \
            sports_api/mlb_step11c_multi_provider_shadow_board_v1.py \
            sports_api/mlb_step11d_provider_consensus_failover_shadow_policy_v1.py \
            sports_api/mlb_step11_final_provider_expansion_freeze_v1.py \
            sports_api/mlb_step12a_shadow_runtime_runner_v1.py \
            sports_api/mlb_step12b_live_runtime_assembly_v1.py \
            sports_api/mlb_step12c_live_board_runtime_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py
          echo 'MLB_STEP13B_STEP13A_STEP12_AND_PRODUCTION_PATHS_BYTE_IDENTICAL'

      - name: Assert Step13B adds no execution network or recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          file='sports_api/mlb_step13b_runtime_supervisor_v1.py'
          forbidden='(^|[^A-Za-z])(requests|httpx|urllib|socket|threading|multiprocessing|subprocess|apscheduler)([^A-Za-z]|$)|time\.sleep|asyncio\.create_task|os\.system|Popen\('
          if grep -Ein "$forbidden" "$file"; then
            echo 'STEP13B_FORBIDDEN_EXECUTION_OR_NETWORK_MACHINERY'
            exit 1
          fi
          echo 'MLB_STEP13B_NO_EXECUTION_NETWORK_OR_RECOVERY_MACHINERY_OK'

      - name: Compile Step13B Python
        run: |
          python -m py_compile \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            tests/test_mlb_step13b_runtime_supervisor_v1.py

      - name: Run Step13B targeted tests
        run: python -m pytest -q tests/test_mlb_step13b_runtime_supervisor_v1.py

      - name: Run complete MLB regression including Step13B
        run: python -m pytest -q tests/test_mlb_*.py

      - name: Certify lifecycle classification and failure isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sports_api.mlb_step12_final_runtime_freeze_v1 import final_runtime_freeze_manifest
          from sports_api.mlb_step13a_bounded_scheduler_v1 import (
              FINAL_CERTIFICATION_MARKER as STEP13A_MARKER,
              bounded_scheduler_manifest,
              build_bounded_scheduler_tick,
          )
          from sports_api.mlb_step13b_runtime_supervisor_v1 import (
              FINAL_CERTIFICATION_MARKER,
              RUNTIME_MODE,
              STEP13B_BASE_MAIN_SHA,
              build_runtime_supervision,
              runtime_supervisor_manifest,
              validate_runtime_supervision,
          )

          anchor = '2026-09-01T19:10:00Z'
          step12 = final_runtime_freeze_manifest()
          step13a = bounded_scheduler_manifest()
          manifest = runtime_supervisor_manifest()

          assert STEP13B_BASE_MAIN_SHA == '1587b4825ad5ce01c8dcd669417da6046ede6921'
          assert RUNTIME_MODE == 'SHADOW_ONLY'
          assert manifest['step13a_final_certification_marker_required'] == STEP13A_MARKER
          assert manifest['potentially_stuck_detection_enabled'] is True
          assert manifest['supervisor_is_observational_only'] is True
          assert manifest['retry_added_by_step13b'] is False
          assert manifest['restart_added_by_step13b'] is False
          assert manifest['stuck_cycle_release_added_by_step13b'] is False
          assert manifest['network_io_added_by_step13b'] is False
          assert manifest['production_scheduler_activation_enabled'] is False

          permit = build_bounded_scheduler_tick(
              evaluated_at_utc=anchor,
              scheduler_anchor_utc=anchor,
              scheduler_state=None,
              step12_final_manifest=step12,
              scheduler_enabled=True,
          )
          ready = build_runtime_supervision(
              permit,
              observed_at_utc='2026-09-01T19:10:01Z',
              cycle_observation=None,
              step13a_manifest=step13a,
          )
          assert ready['supervision_state'] == 'READY_TO_START'
          assert validate_runtime_supervision(ready)['supervision_valid'] is True

          active_state = {
              'last_granted_slot_utc': permit['permit_slot_utc'],
              'active_cycle_id': permit['permit_cycle_id'],
              'active_cycle_slot_utc': permit['permit_slot_utc'],
          }
          active_tick = build_bounded_scheduler_tick(
              evaluated_at_utc='2026-09-01T19:10:30Z',
              scheduler_anchor_utc=anchor,
              scheduler_state=active_state,
              step12_final_manifest=step12,
              scheduler_enabled=True,
          )
          base_observation = {
              'cycle_id': permit['permit_cycle_id'],
              'cycle_slot_utc': permit['permit_slot_utc'],
              'started_at_utc': anchor,
              'finished_at_utc': None,
              'outcome': None,
              'failure_code': None,
          }
          running = build_runtime_supervision(
              active_tick,
              observed_at_utc='2026-09-01T19:11:00Z',
              cycle_observation=base_observation,
              step13a_manifest=step13a,
          )
          assert running['supervision_state'] == 'RUNNING'
          assert running['cycle_age_seconds'] == 60.0
          assert running['scheduler_overlap_blocked'] is True

          stuck = build_runtime_supervision(
              active_tick,
              observed_at_utc='2026-09-01T19:12:01Z',
              cycle_observation=base_observation,
              step13a_manifest=step13a,
          )
          assert stuck['supervision_state'] == 'POTENTIALLY_STUCK'
          assert stuck['potentially_stuck'] is True
          assert stuck['retry_authorized'] is False
          assert stuck['restart_authorized'] is False
          assert stuck['stuck_cycle_released'] is False

          success_observation = dict(base_observation)
          success_observation.update({
              'finished_at_utc': '2026-09-01T19:10:45Z',
              'outcome': 'SUCCESS',
          })
          completed = build_runtime_supervision(
              active_tick,
              observed_at_utc='2026-09-01T19:11:00Z',
              cycle_observation=success_observation,
              step13a_manifest=step13a,
          )
          assert completed['supervision_state'] == 'COMPLETED'
          assert completed['scheduler_state_release_candidate'] is True
          assert completed['scheduler_state_mutated'] is False

          failure_observation = dict(base_observation)
          failure_observation.update({
              'finished_at_utc': '2026-09-01T19:10:40Z',
              'outcome': 'FAILURE',
              'failure_code': 'PROVIDER.TIMEOUT',
          })
          failed = build_runtime_supervision(
              active_tick,
              observed_at_utc='2026-09-01T19:11:00Z',
              cycle_observation=failure_observation,
              step13a_manifest=step13a,
          )
          assert failed['supervision_state'] == 'FAILED'
          assert failed['failure_observed'] is True
          assert failed['retry_authorized'] is False
          assert failed['restart_authorized'] is False
          assert failed['scheduler_state_mutated'] is False

          disabled_tick = build_bounded_scheduler_tick(
              evaluated_at_utc=anchor,
              scheduler_anchor_utc=anchor,
              scheduler_state=None,
              step12_final_manifest=step12,
              scheduler_enabled=False,
          )
          blocked = build_runtime_supervision(
              disabled_tick,
              observed_at_utc='2026-09-01T19:10:01Z',
              cycle_observation=None,
              step13a_manifest=step13a,
          )
          assert blocked['supervision_state'] == 'BLOCKED'

          for record in (ready, running, stuck, completed, failed, blocked):
              assert record['runtime_mode'] == 'SHADOW_ONLY'
              assert record['network_io_performed'] is False
              assert record['provider_network_calls'] == 0
              assert record['production_database_writes'] == 0
              assert record['production_scheduler_activation'] is False
              assert record['actionable_output_enabled'] is False

          print('STEP13B_READY_CASES=1')
          print('STEP13B_RUNNING_CASES=1')
          print('STEP13B_POTENTIALLY_STUCK_CASES=1')
          print('STEP13B_COMPLETED_CASES=1')
          print('STEP13B_FAILED_CASES=1')
          print('STEP13B_BLOCKED_CASES=1')
          print('STEP13B_RETRIES_AUTHORIZED=0')
          print('STEP13B_RESTARTS_AUTHORIZED=0')
          print('STEP13B_STUCK_RELEASES=0')
          print('STEP13B_PROVIDER_NETWORK_CALLS=0')
          print('STEP13B_PRODUCTION_DB_WRITES=0')
          print(FINAL_CERTIFICATION_MARKER)
          PY

      - name: Final Step13B certification marker
        run: echo 'MLB_STEP13B_RUNTIME_SUPERVISOR_GREEN'
