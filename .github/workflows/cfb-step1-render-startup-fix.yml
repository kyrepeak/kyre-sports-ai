name: CFB Step 1 Render startup fix

on:
  push:
    branches:
      - cfb-step1-render-startup-fix
  pull_request:
    branches:
      - mlb-step17b-shared-host-cert

jobs:
  certify-render-startup:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-mlb-step14b-persistence.txt
          python -m pip install pytest
      - name: Run CFB Step 1 regression tests
        run: python -m pytest -q sports_api/tests/test_cfb_markets_step1.py
      - name: Verify real shared-host lifespan startup
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from sports_api.main import app

          with TestClient(app) as client:
              health = client.get('/health')
              status = client.get('/api/v1/cfb/markets/status')
              assert health.status_code == 200
              assert status.status_code == 200
              body = status.json()
              assert body['market_semantics']['projection_weight'] == 0.0
              assert body['market_semantics']['market_context_only'] is True
          PY
