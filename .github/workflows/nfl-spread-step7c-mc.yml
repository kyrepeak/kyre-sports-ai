name: NFL Spread Step 7C Monte Carlo Certification

on:
  push:
    branches:
      - nfl-spread-model-mc-v1
    paths:
      - 'nfl_spread_mc_v1.py'
      - 'tests/test_nfl_spread_mc_v1.py'
      - '.github/workflows/nfl-spread-step7c-mc.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nfl_spread_mc_v1.py'
      - 'tests/test_nfl_spread_mc_v1.py'
      - '.github/workflows/nfl-spread-step7c-mc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-spread-step7c-mc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monte-carlo-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated Monte Carlo test stack
        run: |
          python -m pip install --disable-pip-version-check -q numpy pytest

      - name: Compile Step 7C surface
        run: |
          python -m py_compile nfl_spread_mc_v1.py
          python -m py_compile tests/test_nfl_spread_mc_v1.py

      - name: Run deterministic Monte Carlo certification tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_nfl_spread_mc_v1.py

      - name: Static sportsbook firewall proof
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import inspect
          import nfl_spread_mc_v1 as mc

          assert mc.CERTIFIED_SIMULATIONS == 5_000_000
          assert mc.DEFAULT_SIMULATIONS == 5_000_000
          assert mc.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0

          params = inspect.signature(mc.simulate_from_prediction).parameters
          assert 'market_away_spread' in params
          assert 'sportsbook' not in params
          assert 'price' not in params
          assert 'odds' not in params

          source = inspect.getsource(mc.simulate_from_prediction)
          assert source.index('rng.normal(loc=mean_margin, scale=predictive_sd') < source.index(
              'settlement = batch.astype'
          )
          print('NFL_SPREAD_STEP7C_MONTE_CARLO_FIREWALL_GREEN')
          PY
