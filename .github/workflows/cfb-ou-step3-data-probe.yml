name: CFB O/U Step 3 current-stat probe

on:
  push:
    branches: [cfb-ou-step3-readable-matchup-v20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe ESPN completed-game summary stats
        run: |
          python - <<'PY'
          import json, requests, re
          from datetime import datetime, timezone

          H={
            "User-Agent":"KyreSportsAI/CFB-Step3",
            "Accept":"application/json,text/plain,*/*",
            "Referer":"https://www.espn.com/",
          }

          def get(url, params=None):
            r=requests.get(url,params=params,headers=H,timeout=20)
            print("GET",r.url,"STATUS",r.status_code)
            r.raise_for_status()
            return r.json()

          def sides(event):
            comps=event.get("competitions") or []
            comp=comps[0] if comps else {}
            out={}
            for c in comp.get("competitors") or []:
              out[c.get("homeAway")]=c
            return out,comp

          teams={"50":"Florida A&M","2390":"Miami (FL)"}
          for tid,name in teams.items():
            print("\n=== TEAM",tid,name,"===")
            sched=get(
              f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/{tid}/schedule",
              {"season":2026}
            )
            for event in sched.get("events") or []:
              status=((event.get("status") or {}).get("type") or {})
              if not (status.get("completed") is True or status.get("state")=="post"):
                continue
              eid=str(event.get("id") or "")
              print("COMPLETED_EVENT",eid,event.get("date"),status.get("description"))
              summary=get(
                "https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary",
                {"event":eid}
              )
              box=summary.get("boxscore") or {}
              print("BOX_KEYS",sorted(box.keys()))
              print("TEAM_BLOCKS",len(box.get("teams") or []))
              for block in box.get("teams") or []:
                team=block.get("team") or {}
                print("TEAM",team.get("id"),team.get("displayName"))
                stats=block.get("statistics") or []
                picked=[]
                for st in stats:
                  key=str(st.get("name") or st.get("label") or "")
                  disp=st.get("displayValue")
                  picked.append((key,disp))
                print("STATS",json.dumps(picked,ensure_ascii=False))
          PY
