name: CFB O/U Step 3 current-stat probe

on:
  push:
    branches: [cfb-ou-step3-readable-matchup-v20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe completed-game summary stats through certified transports
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_over_under_deep_data_reconciliation_v1 as deep

          teams={"50":"Florida A&M","2390":"Miami (FL)"}
          for tid,name in teams.items():
              print("\n=== TEAM",tid,name,"===")
              sched,attempts=deep.history_engine._fetch_team_schedule(tid,2026)
              print("SCHEDULE_ATTEMPTS",json.dumps(attempts[-4:],default=str))
              for event in sched.get("events") or []:
                  status=((event.get("status") or {}).get("type") or {})
                  if not (status.get("completed") is True or status.get("state")=="post"):
                      continue
                  eid=str(event.get("id") or "")
                  print("COMPLETED_EVENT",eid,event.get("date"),status.get("description"))
                  summary,sum_attempts=deep.environment_engine._fetch_summary(eid)
                  print("SUMMARY_ATTEMPTS",json.dumps(sum_attempts[-4:],default=str))
                  box=summary.get("boxscore") or {}
                  print("BOX_KEYS",sorted(box.keys()))
                  print("TEAM_BLOCKS",len(box.get("teams") or []))
                  for block in box.get("teams") or []:
                      team=block.get("team") or {}
                      print("TEAM",team.get("id"),team.get("displayName"))
                      picked=[]
                      for st in block.get("statistics") or []:
                          key=str(st.get("name") or st.get("label") or "")
                          picked.append((key,st.get("displayValue")))
                      print("STATS",json.dumps(picked,ensure_ascii=False))
          PY
