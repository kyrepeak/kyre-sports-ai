name: CFB O/U Step 3 current-stat probe

on:
  push:
    branches: [cfb-ou-step3-readable-matchup-v20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe completed-game summary stats through certified parsers
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from datetime import datetime, timezone
          import cfb_over_under_deep_data_reconciliation_v1 as deep

          cutoff=datetime(2026,9,10,23,59,tzinfo=timezone.utc)
          teams={"50":"Florida A&M","2390":"Miami (FL)"}
          for tid,name in teams.items():
              print("\n=== TEAM",tid,name,"===")
              rows,hydration,attempts=deep._current_rows(tid,2026,cutoff,"401858213")
              print("CURRENT_ROWS",json.dumps([
                  {
                      "event_id":r.get("event_id"),
                      "date":str(r.get("date") or r.get("date_dt")),
                      "opponent":r.get("opponent_name"),
                      "pf":r.get("points_for"),
                      "pa":r.get("points_against"),
                      "location":r.get("location"),
                  } for r in rows
              ],default=str))
              for row in rows:
                  eid=str(row.get("event_id") or "")
                  if not eid:
                      continue
                  summary,sum_attempts=deep.environment_engine._fetch_summary(eid)
                  print("COMPLETED_EVENT",eid,row.get("opponent_name"))
                  print("SUMMARY_READY",bool(summary),"ATTEMPTS",json.dumps(sum_attempts[-3:],default=str))
                  box=summary.get("boxscore") or {}
                  print("TEAM_BLOCKS",len(box.get("teams") or []))
                  for block in box.get("teams") or []:
                      team=block.get("team") or {}
                      picked=[]
                      for st in block.get("statistics") or []:
                          key=str(st.get("name") or st.get("label") or "")
                          picked.append((key,st.get("displayValue")))
                      print("TEAM_STATS",team.get("id"),team.get("displayName"),json.dumps(picked,ensure_ascii=False))
                  print("PLAYER_BLOCKS",len(box.get("players") or []))
                  for pblock in box.get("players") or []:
                      pteam=pblock.get("team") or {}
                      print("PLAYER_TEAM",pteam.get("id"),pteam.get("displayName"))
                      for category in pblock.get("statistics") or []:
                          cname=category.get("name") or category.get("displayName") or ""
                          labels=category.get("labels") or []
                          totals=[]
                          for athlete in category.get("athletes") or []:
                              a=athlete.get("athlete") or {}
                              totals.append({
                                  "name":a.get("displayName"),
                                  "stats":athlete.get("stats"),
                              })
                          print("PLAYER_CATEGORY",cname,json.dumps({"labels":labels,"athletes":totals},ensure_ascii=False))
          PY
