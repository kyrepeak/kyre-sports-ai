name: CFB Over Under V39 compact evidence

on:
  pull_request:
    paths:
      - "cfb_over_under_clean_page_v39.py"
      - "streamlit_memory_lazy_router_v153.py"
      - "app.py"
      - "tests/test_cfb_over_under_v39_*.py"
      - "devsystem/cfb_over_under_v39_browser_qa.py"
      - ".github/workflows/cfb-over-under-v39-compact-evidence.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest streamlit pandas requests
      - name: Compile V39 surface
        run: python -m py_compile cfb_over_under_clean_page_v39.py streamlit_memory_lazy_router_v153.py
      - name: Run V39 compact evidence contracts
        run: >-
          python -m pytest -q
          tests/test_cfb_over_under_v39_compact_evidence.py
          tests/test_cfb_over_under_v39_evidence_states.py
          tests/test_cfb_over_under_v39_route.py
