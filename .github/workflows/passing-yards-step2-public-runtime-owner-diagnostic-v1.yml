name: Passing Yards Step 2 Public Runtime Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-step2-public-runtime-owner-diagnostic-v1.yml"
      - "devsystem/task_ledgers/passing-yards-step2-public-runtime-owner-diagnostic-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-step2-public-runtime-owner-diagnostic-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-public-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact diagnostic scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-step2-public-runtime-owner-diagnostic-v1.yml
          devsystem/task_ledgers/passing-yards-step2-public-runtime-owner-diagnostic-v1.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_STEP2_PUBLIC_OWNER_DIAG_SCOPE_GREEN"

      - name: Install diagnostic browser
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Inspect hosted runtime once
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          })

          selectors={
              "selected_detail": '[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',
              "v69_cleanup": '[data-passing-yards-detail-cleanup="v69"]',
              "v70_css": 'style[data-passing-yards-mobile-cleanup-css="v70"]',
              "v70_runtime": '[data-passing-yards-mobile-cleanup-runtime="v70"]',
              "v222_runtime": '[data-passing-yards-v222-runtime="projection-explainability-step2"]',
              "v71_ready": '[data-passing-yards-explainability-ready="v71"]',
              "v71_panel": '[data-passing-yards-projection-explainability="v71"]',
          }

          def snapshot(page):
              counts={key:0 for key in selectors}
              frame_urls=[]
              bodies=[]
              for frame in page.frames:
                  frame_urls.append(frame.url)
                  try:
                      bodies.append(frame.locator("body").inner_text(timeout=1800))
                  except Exception:
                      pass
                  for key,selector in selectors.items():
                      try:
                          counts[key]+=frame.locator(selector).count()
                      except Exception:
                          pass
              body="\n".join(bodies)
              return counts, frame_urls, body

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)

              deadline=time.monotonic()+120
              counts={}
              frame_urls=[]
              body=""
              while time.monotonic()<deadline:
                  counts,frame_urls,body=snapshot(page)
                  if counts["selected_detail"]>=1 and "Jordan Love" in body:
                      break
                  page.wait_for_timeout(500)

              has_typeerror="TypeError" in body
              has_traceback="Traceback" in body
              jordan="Jordan Love" in body

              if counts.get("v222_runtime",0)>0 and counts.get("v71_panel",0)>0:
                  if counts.get("v70_runtime",0)>0:
                      owner="CURRENT_RUNTIME_ALL_MARKERS_PRESENT"
                  else:
                      owner="PUBLIC_RUNTIME_V70_MARKER_CONTRACT"
              elif counts.get("v222_runtime",0)==0 and counts.get("v71_panel",0)==0:
                  owner="DEPLOYMENT_STALE_BEFORE_V222_V71"
              elif counts.get("v222_runtime",0)>0 and counts.get("v71_panel",0)==0:
                  owner="PUBLIC_RUNTIME_V71_RENDER"
              else:
                  owner="PUBLIC_RUNTIME_ROUTER_MARKER"

              result={
                  "public_url":base,
                  "frame_count":len(frame_urls),
                  "frame_urls":frame_urls,
                  "counts":counts,
                  "jordan_love":jordan,
                  "typeerror":has_typeerror,
                  "traceback":has_traceback,
                  "owner":owner,
              }
              print("PASSING_YARDS_STEP2_PUBLIC_OWNER_DIAGNOSTIC")
              print(json.dumps(result,indent=2,sort_keys=True))
              print("PASSING_YARDS_STEP2_OWNER="+owner)
              browser.close()
          PY
