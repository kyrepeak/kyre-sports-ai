name: WNBA Step 7G GameRotation host probe

on:
  push:
    branches:
      - wnba-step7g-official-data-preflight-20260827
    paths:
      - '.github/workflows/wnba-step-7g-gamerotation-host-probe.yml'
      - 'sports_api/tools/wnba_step7g_gamerotation_host_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step7g-gamerotation-host-probe
  cancel-in-progress: false

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Step 7G branch
        uses: actions/checkout@v4

      - name: Verify production remains OFF
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependency
        run: python -m pip install 'httpx==0.28.1'

      - name: Syntax-check probe
        run: python -m py_compile sports_api/tools/wnba_step7g_gamerotation_host_probe.py

      - name: Compare official GameRotation hosts
        run: python -m sports_api.tools.wnba_step7g_gamerotation_host_probe

      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-gamerotation-host-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-gamerotation-host-probe.json
          if-no-files-found: error
          retention-days: 30

      - name: Re-assert production remained OFF
        if: always()
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
