name: MLB Matchup V2 Step 2 hitter profile certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mlb_matchup_hitter_profile_v1.py'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v31.py'
      - 'mlb_matchup_player_v25.py'
      - 'tests/test_mlb_matchup_v2_step2_hitter_profile.py'
      - '.github/workflows/mlb-matchup-v2-step1-foundation.yml'
      - '.github/workflows/mlb-matchup-v2-step2-hitter-profile.yml'
  push:
    branches: ['mlb-matchup-v2-step2-hitter-profile']
    paths:
      - 'mlb_matchup_hitter_profile_v1.py'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v31.py'
      - 'mlb_matchup_player_v25.py'
      - 'tests/test_mlb_matchup_v2_step2_hitter_profile.py'
      - '.github/workflows/mlb-matchup-v2-step1-foundation.yml'
      - '.github/workflows/mlb-matchup-v2-step2-hitter-profile.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event_name == 'push' || github.head_ref == 'mlb-matchup-v2-step2-hitter-profile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact V2 Step 2 additive scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-v2-step1-foundation.yml' \
            '.github/workflows/mlb-matchup-v2-step2-hitter-profile.yml' \
            'mlb_matchup_hitter_profile_v1.py' \
            'mlb_matchup_hub_v27.py' \
            'mlb_matchup_hub_v31.py' \
            'mlb_matchup_player_v25.py' \
            'tests/test_mlb_matchup_v2_step2_hitter_profile.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup V2 Step 2 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "STEP2_EXACT_SEVEN_FILE_SCOPE=PASS"

      - name: Prove certified Step 1 implementation remains frozen
        run: |
          for path in \
            mlb_matchup_hub_v30.py \
            mlb_matchup_player_v24.py \
            tests/test_mlb_matchup_v2_step1_foundation.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Certified Step 1 implementation changed: $path"
              exit 1
            fi
          done
          echo "STEP1_IMPLEMENTATION_FREEZE=PASS"

      - name: Verify Step 1 CI is isolated from later V2 branches
        run: |
          grep -F "github.head_ref == 'mlb-matchup-v2-step1-foundation'" .github/workflows/mlb-matchup-v2-step1-foundation.yml
          echo "STEP1_CI_ISOLATION=PASS"

      - name: Prove Moneyline remains frozen
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py \
            tests/test_mlb_moneyline_clean_ui_v1.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline boundary changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_FREEZE=PASS"

      - name: Prove frozen V1 Matchup presentation and model chain unchanged
        run: |
          for path in \
            mlb_matchup_hub_v29.py \
            mlb_matchup_player_v23.py \
            mlb_matchup_hub_v28.py \
            mlb_matchup_player_v22.py \
            mlb_matchup_player_v21.py \
            mlb_matchup_player_v20.py \
            mlb_matchup_player_v19.py \
            mlb_matchup_player_v18.py \
            mlb_matchup_player_v15.py \
            mlb_matchup_hub_v14.py \
            mlb_matchup_hub_v13.py \
            mlb_matchup_hub_v12.py \
            mlb_matchup_rankings_v21.py \
            spread_engine.py \
            spread_history.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Matchup V1 boundary changed: $path"
              exit 1
            fi
          done
          echo "MATCHUP_V1_FREEZE=PASS"

      - name: Compile V2 Step 2 boundary
        run: |
          python -m py_compile \
            mlb_matchup_hitter_profile_v1.py \
            mlb_matchup_hub_v27.py \
            mlb_matchup_hub_v31.py \
            mlb_matchup_player_v25.py \
            tests/test_mlb_matchup_v2_step2_hitter_profile.py

      - name: Run V2 Step 2 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_v2_step2_hitter_profile.py

      - name: Prove Step 2 is skill profile only
        run: |
          grep -F 'PROBABILITY_IMPACT = "NONE"' mlb_matchup_player_v25.py
          grep -F 'STEP2_ROLE = "PLAYER_SKILL_PROFILE_ONLY"' mlb_matchup_player_v25.py
          grep -F '"xba"' mlb_matchup_hitter_profile_v1.py
          grep -F '"whiff_percent"' mlb_matchup_hitter_profile_v1.py
          grep -F '"iz_contact_percent"' mlb_matchup_hitter_profile_v1.py
          grep -F '"hard_hit_percent"' mlb_matchup_hitter_profile_v1.py
          ! grep -F 'def _simulate' mlb_matchup_player_v25.py mlb_matchup_hitter_profile_v1.py
          ! grep -F 'def _calibration_from_verdict' mlb_matchup_player_v25.py mlb_matchup_hitter_profile_v1.py
          ! grep -F 'p_one_plus_pre_matchup' mlb_matchup_player_v25.py mlb_matchup_hitter_profile_v1.py
          ! grep -F 'p_two_plus' mlb_matchup_player_v25.py mlb_matchup_hitter_profile_v1.py
          ! grep -F 'fair_odds' mlb_matchup_player_v25.py mlb_matchup_hitter_profile_v1.py
          echo "STEP2_GAME_PROBABILITY_IMPACT=NONE"

      - name: Certification marker
        run: echo "MLB_MATCHUP_V2_STEP2_HITTER_PROFILE_GREEN"
