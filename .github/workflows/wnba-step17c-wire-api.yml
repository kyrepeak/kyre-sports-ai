name: WNBA Step 17C wire API

on:
  push:
    branches:
      - wnba-step17c-production-reliability-monitoring-20260828
    paths:
      - .github/workflows/wnba-step17c-wire-api.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wnba-step17c-production-reliability-monitoring-20260828
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire Step 17C router without changing lifespan
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sports_api/main.py')
          text = path.read_text()
          old_import = 'from sports_api.api.wnba_step17b_runtime import router as wnba_step17b_runtime_router\n'
          new_import = old_import + 'from sports_api.api.wnba_step17c_reliability import router as wnba_step17c_reliability_router\n'
          old_include = 'app.include_router(wnba_step17b_runtime_router)\n'
          new_include = old_include + 'app.include_router(wnba_step17c_reliability_router)\n'
          if text.count(old_import) != 1 or text.count(old_include) != 1:
              raise SystemExit('Step 17C main.py anchors are not unique')
          text = text.replace(old_import, new_import, 1).replace(old_include, new_include, 1)
          path.write_text(text)
          PY
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Compile and test API surface
        run: |
          python -m py_compile sports_api/main.py sports_api/api/wnba_step17c_reliability.py sports_api/wnba_step17c_production_reliability.py
          PYTHONPATH=. python tests/test_wnba_step17c_production_reliability.py
          python - <<'PY'
          from sports_api.main import app
          paths = {getattr(route, 'path', None) for route in app.routes}
          assert '/api/v1/wnba/runtime/step17c' in paths
          assert '/api/v1/wnba/runtime/step17c/health' in paths
          print('STEP17C_FASTAPI_ROUTES_OK')
          PY
      - name: Commit exact main.py wiring
        run: |
          if git diff --quiet -- sports_api/main.py; then
            echo 'No main.py patch required'
            exit 0
          fi
          test "$(git diff --name-only | tr -d '\r')" = 'sports_api/main.py'
          git config user.name 'kyre-step17c-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports_api/main.py
          git commit -m 'Wire Step 17C reliability router into FastAPI'
          git push origin HEAD:wnba-step17c-production-reliability-monitoring-20260828
