name: College Football Step 2 permanent freeze contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-step2-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 2 freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step2-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step2-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v2.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 2 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP2_FREEZE_SCOPE=PASS"

      - name: Enforce immutable Step 1 freeze contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          EXPECTED_V1_MANIFEST = "3a7797ca8eb516b0457ebd7d3b2eb007e99ab087"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          try:
              actual_manifest = rev("HEAD:cfb_freeze_manifest_v1.json")
          except subprocess.CalledProcessError:
              actual_manifest = None
          if actual_manifest != EXPECTED_V1_MANIFEST:
              failures.append(
                  "cfb_freeze_manifest_v1.json changed or is missing "
                  f"expected={EXPECTED_V1_MANIFEST} actual={actual_manifest}"
              )

          try:
              v1 = json.loads(pathlib.Path("cfb_freeze_manifest_v1.json").read_text())
          except Exception as exc:
              failures.append(f"cannot read CFB freeze V1: {exc}")
              v1 = {}

          if v1.get("completed_steps") != [1]:
              failures.append("CFB freeze V1 completed_steps mismatch")

          for path, expected in v1.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen Step 1 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen Step 1 blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP1_FREEZE_CHAIN=PASS")
          PY

      - name: Enforce College Football Steps 1 and 2 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v2.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 2:
              failures.append("freeze manifest version mismatch")
          if m.get("completed_steps") != [1, 2]:
              failures.append("completed_steps mismatch")
          if m.get("step2_merge_commit") != "5dea6349b09a84191e5bfda885986529a8b06783":
              failures.append("Step 2 merge commit mismatch")

          required = {
              "cfb_hub_v1.py",
              "streamlit_memory_lazy_router_v23.py",
              "cfb_schedule_v1.py",
              "cfb_hub_v2.py",
              "streamlit_memory_lazy_router_v24.py",
          }
          if set(m.get("exact_blobs", {})) != required:
              failures.append("Step 2 exact frozen path set mismatch")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP2_EXACT_FREEZE=PASS")
          PY

      - name: Re-enforce protected MLB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP2_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen College Football Steps 1 and 2
        run: |
          python -m py_compile \
            cfb_hub_v1.py \
            streamlit_memory_lazy_router_v23.py \
            cfb_schedule_v1.py \
            cfb_hub_v2.py \
            streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py

      - name: Run frozen College Football contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove additive Step 2 chain
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path("streamlit_memory_lazy_router_v24.py").read_text(encoding="utf-8")
          hub = Path("cfb_hub_v2.py").read_text(encoding="utf-8")
          schedule = Path("cfb_schedule_v1.py").read_text(encoding="utf-8")

          if 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v23"' not in router:
              raise SystemExit("V24 frozen parent is not V23")
          if 'FROZEN_CFB_HUB = "cfb_hub_v1"' not in hub:
              raise SystemExit("Hub V2 frozen parent is not Hub V1")
          if "NCAA official schedule GraphQL" not in schedule:
              raise SystemExit("Step 2 official schedule identity marker missing")

          forbidden = [
              "np.random",
              "def simulate",
              "def win_probability",
              "fair_odds =",
              "projected_total =",
          ]
          for token in forbidden:
              if token in hub or token in schedule:
                  raise SystemExit(f"Frozen Step 2 crossed model boundary: {token}")

          print("CFB_STEP2_ADDITIVE_CHAIN=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP2_PERMANENT_FREEZE_GREEN"
