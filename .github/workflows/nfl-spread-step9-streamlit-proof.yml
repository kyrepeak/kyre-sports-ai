name: NFL Spread Step 9 Real Streamlit Proof

on:
  push:
    branches:
      - nfl-spread-page-visual-parity-v1
    paths:
      - 'app.py'
      - 'nfl_spread_hub_v3.py'
      - 'nfl_spread_hub_v4.py'
      - 'streamlit_memory_lazy_router_v132.py'
      - 'streamlit_memory_lazy_router_v133.py'
      - 'streamlit_memory_lazy_router_v134.py'
      - 'streamlit_memory_lazy_router_v135.py'
      - 'tests/test_nfl_spread_streamlit_v134_smoke.py'
      - 'requirements.txt'
      - '.github/workflows/nfl-spread-step9-streamlit-proof.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'nfl_spread_hub_v3.py'
      - 'nfl_spread_hub_v4.py'
      - 'streamlit_memory_lazy_router_v132.py'
      - 'streamlit_memory_lazy_router_v133.py'
      - 'streamlit_memory_lazy_router_v134.py'
      - 'streamlit_memory_lazy_router_v135.py'
      - 'tests/test_nfl_spread_streamlit_v134_smoke.py'
      - 'requirements.txt'
      - '.github/workflows/nfl-spread-step9-streamlit-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-spread-step9-streamlit-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-streamlit-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install real application runtime
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile active V135 Streamlit surface
        run: |
          python -m py_compile app.py
          python -m py_compile nfl_spread_hub_v3.py
          python -m py_compile nfl_spread_hub_v4.py
          python -m py_compile streamlit_memory_lazy_router_v132.py
          python -m py_compile streamlit_memory_lazy_router_v133.py
          python -m py_compile streamlit_memory_lazy_router_v134.py
          python -m py_compile streamlit_memory_lazy_router_v135.py
          python -m py_compile tests/test_nfl_spread_streamlit_v134_smoke.py

      - name: Execute real NFL Spread V135 V4 route with Streamlit AppTest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_nfl_spread_streamlit_v134_smoke.py

      - name: Boot real Streamlit server and require healthy runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/nfl-spread-streamlit.log
          streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --browser.gatherUsageStats false \
            >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          healthy=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health > /tmp/health.txt 2>/dev/null; then
              healthy=1
              break
            fi
            if ! kill -0 "$PID" >/dev/null 2>&1; then
              echo 'Streamlit process exited before becoming healthy.'
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo 'Streamlit health endpoint never became ready.'
            cat "$LOG"
            exit 1
          fi

          grep -qi 'ok' /tmp/health.txt
          kill -0 "$PID"
          echo 'NFL_SPREAD_STEP9_V135_REAL_STREAMLIT_SERVER_GREEN'

      - name: Prove active app contract is V135 visual parity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FROZEN_V134_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V134_NFL_SPREAD_MODEL_MC_2026-09-14"' app.py
          grep -F 'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V135_NFL_SPREAD_VISUAL_PARITY_2026-09-14"' app.py
          grep -F 'from streamlit_memory_lazy_router_v135 import record_bootstrap_import_ms, render_app' app.py
          echo 'NFL_SPREAD_STEP9_V135_ACTIVE_GREEN'

  final-step9-gate:
    if: always()
    needs: [real-streamlit-proof]
    runs-on: ubuntu-24.04
    steps:
      - name: Require real Streamlit proof green
        env:
          RESULT: ${{ needs.real-streamlit-proof.result }}
        run: |
          test "$RESULT" = "success"
          echo 'NFL_SPREAD_STEP9_V135_FINAL_GATE_GREEN'
