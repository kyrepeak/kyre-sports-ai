name: Passing Yards Visual Upgrade Step 4

on:
  push:
    branches:
      - "monster/passing-yards-visual-upgrade-step4-market-v1"

permissions:
  contents: read

jobs:
  targeted-step4:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Step 4 presentation chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v49.py streamlit_memory_lazy_router_v195.py app.py
      - name: Prove Step 10 market control panel contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_visual_upgrade_step4_v1.py
