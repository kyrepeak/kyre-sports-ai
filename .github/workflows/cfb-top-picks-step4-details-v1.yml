name: CFB Top Picks Step 4 details

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'cfb_top_picks_details_v1.py'
      - 'cfb_top_picks_page_v4.py'
      - 'streamlit_memory_lazy_router_v244.py'
      - 'tests/test_cfb_top_picks_step4_details_v1.py'
      - 'devsystem/task_ledgers/cfb-top-picks-step4-details-v1.json'
      - '.github/workflows/cfb-top-picks-step4-details-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-step4-details-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step4-details:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime requirements
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 4 owners
        run: |
          python -m py_compile cfb_top_picks_details_v1.py
          python -m py_compile cfb_top_picks_page_v4.py
          python -m py_compile streamlit_memory_lazy_router_v244.py
      - name: Step 4 Why History Benefits contract
        run: python -m pytest -q tests/test_cfb_top_picks_step4_details_v1.py
