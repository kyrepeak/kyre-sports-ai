name: MLB Step13D final scheduler freeze certification

on:
  push:
    branches:
      - mlb-step13d-final-scheduler-freeze
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP13D_BASE_SHA: 73e81b5dd6edab04e4e13d654f1a2c5a8d3eabe1

jobs:
  certify-final-scheduler-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests

      - name: Assert Step13D is exactly three-file additive MLB scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP13D_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/mlb_step13_final_scheduler_freeze_v1.py|tests/test_mlb_step13_final_scheduler_freeze_v1.py|\.github/workflows/mlb-step13d-final-scheduler-freeze-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP13D_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 3 ]; then
            echo "STEP13D_EXPECTED_EXACTLY_THREE_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP13D_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          git diff --check "$STEP13D_BASE_SHA"...HEAD
          numstat="$(git diff --numstat "$STEP13D_BASE_SHA"...HEAD)"
          printf '%s\n' "$numstat"
          if printf '%s\n' "$numstat" | awk '$2 != 0 { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'STEP13D_DELETIONS_FORBIDDEN'
            exit 1
          fi
          echo 'MLB_STEP13D_THREE_FILE_ADDITIVE_SCOPE_OK'

      - name: Prove Step13C Step13B Step13A Step12 and production paths remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP13D_BASE_SHA"...HEAD -- \
            app.py engine.py history.py spread_engine.py \
            live_game_hub_v182.py live_game_hub_v19.py live_game_hub_v191.py \
            live_game_hub_v192.py live_game_hub_v1921.py mlb_live_hub_v193.py live_odds_feed.py \
            mlb_step9c_live_state_consumer_v1.py mlb_step9e_live_market_consumer_v1.py \
            sports_api/main.py sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/collectors/mlb_fanduel_inplay.py \
            sports_api/collectors/mlb_draftkings_provider.py \
            sports_api/mlb_official_game_id_join_v1.py \
            sports_api/mlb_live_market_context_v1.py \
            sports_api/mlb_step9a_live_game_state_api_contract_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/mlb_step9g_postfreeze_handoff_v1.py \
            sports_api/mlb_step10a_live_snapshot_persistence_contract_v1.py \
            sports_api/database/mlb_live_snapshot_store.py \
            sports_api/database/mlb_live_snapshot_recovery.py \
            sports_api/mlb_step10_final_persistence_freeze_v1.py \
            sports_api/mlb_step11a_provider_contract_v1.py \
            sports_api/mlb_step11c_multi_provider_shadow_board_v1.py \
            sports_api/mlb_step11d_provider_consensus_failover_shadow_policy_v1.py \
            sports_api/mlb_step11_final_provider_expansion_freeze_v1.py \
            sports_api/mlb_step12a_shadow_runtime_runner_v1.py \
            sports_api/mlb_step12b_live_runtime_assembly_v1.py \
            sports_api/mlb_step12c_live_board_runtime_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py
          echo 'MLB_STEP13D_ALL_PARENT_AND_PRODUCTION_PATHS_BYTE_IDENTICAL'

      - name: Prove exact frozen parent Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$STEP13D_BASE_SHA:sports_api/mlb_step12_final_runtime_freeze_v1.py")" = 'ae0555e01c9c2787511ae9b7ee85e1e1a861d781'
          test "$(git rev-parse "$STEP13D_BASE_SHA:sports_api/mlb_step13a_bounded_scheduler_v1.py")" = 'fbb61033835afb76f5f49fa990001f8e5877a696'
          test "$(git rev-parse "$STEP13D_BASE_SHA:sports_api/mlb_step13b_runtime_supervisor_v1.py")" = 'fe0d415f4a5e41c834735f8cc81a13cf0398f583'
          test "$(git rev-parse "$STEP13D_BASE_SHA:sports_api/mlb_step13c_reliability_recovery_v1.py")" = '0d78c484d2f9c6e3162f55961c43688303882643'
          echo 'MLB_STEP13D_FROZEN_PARENT_SOURCE_BLOBS_EXACT'

      - name: Assert Step13D adds no execution network or persistence machinery
        shell: bash
        run: |
          set -euo pipefail
          file='sports_api/mlb_step13_final_scheduler_freeze_v1.py'
          forbidden='(^|[^A-Za-z])(requests|httpx|urllib|socket|threading|multiprocessing|subprocess|apscheduler|sqlalchemy|psycopg|supabase)([^A-Za-z]|$)|time\.sleep|asyncio\.create_task|os\.system|Popen\('
          if grep -Ein "$forbidden" "$file"; then
            echo 'STEP13D_FORBIDDEN_EXECUTION_NETWORK_OR_PERSISTENCE_MACHINERY'
            exit 1
          fi
          echo 'MLB_STEP13D_NONBEHAVIORAL_FREEZE_SAFETY_OK'

      - name: Compile Step13D Python
        run: |
          python -m py_compile \
            sports_api/mlb_step13_final_scheduler_freeze_v1.py \
            tests/test_mlb_step13_final_scheduler_freeze_v1.py

      - name: Run Step13D targeted tests
        run: python -m pytest -q tests/test_mlb_step13_final_scheduler_freeze_v1.py

      - name: Run complete MLB regression including Step13D
        run: python -m pytest -q tests/test_mlb_*.py

      - name: Certify complete Step13 scheduler recovery release freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy

          from sports_api.mlb_step12_final_runtime_freeze_v1 import final_runtime_freeze_manifest
          from sports_api.mlb_step13a_bounded_scheduler_v1 import bounded_scheduler_manifest
          from sports_api.mlb_step13b_runtime_supervisor_v1 import runtime_supervisor_manifest
          from sports_api.mlb_step13c_reliability_recovery_v1 import reliability_recovery_manifest
          from sports_api.mlb_step13_final_scheduler_freeze_v1 import (
              FINAL_CERTIFICATION_MARKER,
              FINAL_FREEZE_STATUS,
              FROZEN_PARENT_SOURCE_BLOBS,
              RUNTIME_MODE,
              STEP13D_BASE_MAIN_SHA,
              final_scheduler_freeze_manifest,
              validate_final_scheduler_freeze,
              validate_final_scheduler_freeze_manifest,
          )

          assert STEP13D_BASE_MAIN_SHA == '73e81b5dd6edab04e4e13d654f1a2c5a8d3eabe1'
          assert RUNTIME_MODE == 'SHADOW_ONLY'
          assert FINAL_FREEZE_STATUS == 'STEP13_FROZEN_SCHEDULER_RECOVERY_COMPLETE'
          assert FROZEN_PARENT_SOURCE_BLOBS == {
              'step12_final_runtime_freeze_blob': 'ae0555e01c9c2787511ae9b7ee85e1e1a861d781',
              'step13a_bounded_scheduler_blob': 'fbb61033835afb76f5f49fa990001f8e5877a696',
              'step13b_runtime_supervisor_blob': 'fe0d415f4a5e41c834735f8cc81a13cf0398f583',
              'step13c_reliability_recovery_blob': '0d78c484d2f9c6e3162f55961c43688303882643',
          }

          manifest = final_scheduler_freeze_manifest()
          assert manifest['runtime_mode'] == 'SHADOW_ONLY'
          assert manifest['step13_scheduler_recovery_block_frozen'] is True
          assert manifest['step13a_bounded_scheduler_frozen'] is True
          assert manifest['step13b_runtime_supervisor_frozen'] is True
          assert manifest['step13c_reliability_recovery_frozen'] is True
          assert manifest['maximum_permits_per_tick'] == 1
          assert manifest['default_scheduler_interval_seconds'] == 30
          assert manifest['default_max_cycle_runtime_seconds'] == 120
          assert manifest['default_max_recovery_attempts'] == 3
          assert manifest['maximum_max_recovery_attempts'] == 5
          assert manifest['default_base_cooldown_seconds'] == 15
          assert manifest['default_max_cooldown_seconds'] == 120
          assert manifest['default_stuck_grace_seconds'] == 30
          assert manifest['runtime_cycle_execution_added_by_step13d'] is False
          assert manifest['retry_execution_performed_by_step13d'] is False
          assert manifest['restart_execution_performed_by_step13d'] is False
          assert manifest['network_io_added_by_step13d'] is False
          assert manifest['production_database_writes_enabled'] is False
          assert manifest['production_scheduler_activation_enabled'] is False
          assert manifest['actionable_output_enabled'] is False
          assert validate_final_scheduler_freeze_manifest(manifest)['freeze_manifest_valid'] is True

          result = validate_final_scheduler_freeze(
              step12_manifest=final_runtime_freeze_manifest(),
              step13a_manifest=bounded_scheduler_manifest(),
              step13b_manifest=runtime_supervisor_manifest(),
              step13c_manifest=reliability_recovery_manifest(),
              step13a_scheduler_evidence_ok=True,
              step13b_supervisor_evidence_ok=True,
              step13c_recovery_evidence_ok=True,
              bounded_recovery_limits_evidence_ok=True,
              zero_parent_drift_ok=True,
              zero_runtime_execution_ok=True,
              zero_retry_restart_execution_ok=True,
              zero_network_calls_ok=True,
              zero_production_database_writes_ok=True,
              zero_production_activation_ok=True,
              zero_actionable_output_ok=True,
          )
          assert result['certified'] is True
          assert result['failures'] == []
          assert result['final_freeze_status'] == FINAL_FREEZE_STATUS
          assert result['final_certification_marker'] == FINAL_CERTIFICATION_MARKER
          assert result['runtime_cycle_executed'] is False
          assert result['retry_executed'] is False
          assert result['restart_executed'] is False
          assert result['scheduler_state_mutated'] is False
          assert result['recovery_state_mutated'] is False
          assert result['network_io_performed'] is False
          assert result['provider_network_calls'] == 0
          assert result['production_database_writes'] == 0
          assert result['production_scheduler_activation'] is False
          assert result['actionable_output_enabled'] is False

          tampered_parent = reliability_recovery_manifest()
          tampered_parent['tampered'] = True
          bad = validate_final_scheduler_freeze(
              step12_manifest=final_runtime_freeze_manifest(),
              step13a_manifest=bounded_scheduler_manifest(),
              step13b_manifest=runtime_supervisor_manifest(),
              step13c_manifest=tampered_parent,
              step13a_scheduler_evidence_ok=True,
              step13b_supervisor_evidence_ok=True,
              step13c_recovery_evidence_ok=True,
              bounded_recovery_limits_evidence_ok=True,
              zero_parent_drift_ok=True,
              zero_runtime_execution_ok=True,
              zero_retry_restart_execution_ok=True,
              zero_network_calls_ok=True,
              zero_production_database_writes_ok=True,
              zero_production_activation_ok=True,
              zero_actionable_output_ok=True,
          )
          assert bad['certified'] is False
          assert 'STEP13C_MANIFEST_MISMATCH' in bad['failures']

          tampered_manifest = deepcopy(manifest)
          tampered_manifest['runtime_mode'] = 'TAMPERED'
          assert validate_final_scheduler_freeze_manifest(tampered_manifest)['freeze_manifest_valid'] is False

          print('STEP13D_STEP13A_FREEZE_CERTIFIED=1')
          print('STEP13D_STEP13B_FREEZE_CERTIFIED=1')
          print('STEP13D_STEP13C_FREEZE_CERTIFIED=1')
          print('STEP13D_PARENT_SOURCE_BLOB_PINS=4')
          print('STEP13D_RECOVERY_MAX_ATTEMPTS=5')
          print('STEP13D_RUNTIME_EXECUTIONS=0')
          print('STEP13D_RETRY_EXECUTIONS=0')
          print('STEP13D_RESTART_EXECUTIONS=0')
          print('STEP13D_PROVIDER_NETWORK_CALLS=0')
          print('STEP13D_PRODUCTION_DB_WRITES=0')
          print('STEP13D_PRODUCTION_SCHEDULER_ACTIVATION=0')
          print(FINAL_CERTIFICATION_MARKER)
          PY

      - name: Final Step13D certification marker
        run: echo 'MLB_STEP13D_FINAL_SCHEDULER_FREEZE_GREEN'
