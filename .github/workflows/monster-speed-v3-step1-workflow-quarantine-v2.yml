name: Monster Speed V3 Step 1 Workflow Quarantine V2

on:
  pull_request:
    branches: [main]
    paths:
      - "devsystem/workflow_quarantine_v2.json"
      - "devsystem/workflow_quarantine_v2.py"
      - "devsystem/permanent_gate_v1.py"
      - "devsystem/task_ledgers/monster-speed-v3-step1-workflow-quarantine-v2.json"
      - "tests/test_workflow_quarantine_v2.py"
      - ".github/workflows/monster-speed-v3-step1-workflow-quarantine-v2.yml"
      - ".github/workflows/cfb-top-picks-step1-shell-v1.yml"
      - ".github/workflows/cfb-top-picks-step2-cards-v1.yml"
      - ".github/workflows/cfb-top-picks-step3-ranking-v1.yml"
      - ".github/workflows/cfb-top-picks-step4-details-v1.yml"
      - ".github/workflows/cfb-top-picks-step5-final-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step1-dropdown-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step2-selection-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step3-public-freeze-v1.yml"
      - ".github/workflows/passing-yards-speed-step1-bottleneck-v1.yml"
      - ".github/workflows/passing-yards-speed-step2-first-paint-v1.yml"
      - ".github/workflows/passing-yards-speed-step3-lazy-detail-v1.yml"
      - ".github/workflows/passing-yards-speed-step4-cache-v1.yml"
      - ".github/workflows/passing-yards-speed-step5-payload-dedupe-v1.yml"
      - ".github/workflows/passing-yards-speed-step6-full-latency-v1.yml"
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - ".github/workflows/passing-yards-speed-step8-final-freeze-v1.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/workflow_quarantine_v2.json"
      - "devsystem/workflow_quarantine_v2.py"
      - "devsystem/permanent_gate_v1.py"
      - "devsystem/task_ledgers/monster-speed-v3-step1-workflow-quarantine-v2.json"
      - "tests/test_workflow_quarantine_v2.py"
      - ".github/workflows/monster-speed-v3-step1-workflow-quarantine-v2.yml"
      - ".github/workflows/cfb-top-picks-step1-shell-v1.yml"
      - ".github/workflows/cfb-top-picks-step2-cards-v1.yml"
      - ".github/workflows/cfb-top-picks-step3-ranking-v1.yml"
      - ".github/workflows/cfb-top-picks-step4-details-v1.yml"
      - ".github/workflows/cfb-top-picks-step5-final-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step1-dropdown-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step2-selection-v1.yml"
      - ".github/workflows/cfb-top-picks-nav-step3-public-freeze-v1.yml"
      - ".github/workflows/passing-yards-speed-step1-bottleneck-v1.yml"
      - ".github/workflows/passing-yards-speed-step2-first-paint-v1.yml"
      - ".github/workflows/passing-yards-speed-step3-lazy-detail-v1.yml"
      - ".github/workflows/passing-yards-speed-step4-cache-v1.yml"
      - ".github/workflows/passing-yards-speed-step5-payload-dedupe-v1.yml"
      - ".github/workflows/passing-yards-speed-step6-full-latency-v1.yml"
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - ".github/workflows/passing-yards-speed-step8-final-freeze-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-speed-v3-step1-quarantine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quarantine-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove frozen workflows are manual-only
        run: python devsystem/workflow_quarantine_v2.py
      - name: Run Step 1 contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_workflow_quarantine_v2.py
      - name: Prove required permanent gate owns quarantine
        run: |
          python devsystem/permanent_gate_v1.py
          echo "MONSTER_SPEED_V3_STEP1_PERMANENT_GATE_GREEN"
      - name: Freeze Step 1
        run: |
          echo "MONSTER_SPEED_V3_STEP1_QUARANTINE_GREEN"
          echo "MONSTER_SPEED_V3_STEP1_FROZEN_GREEN"
