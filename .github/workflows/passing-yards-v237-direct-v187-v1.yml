name: NFL Passing Yards V237 Direct V187 Shell

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-v237-direct-v187-v1.yml"
      - "devsystem/task_ledgers/passing-yards-v237-direct-v187-v1.json"
      - "streamlit_memory_lazy_router_v237.py"
      - "tests/test_passing_yards_v237_lockless_owner.py"

permissions:
  contents: read

concurrency:
  group: passing-yards-v237-direct-v187-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-shell-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Protect Monster and enforce four-file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/passing-yards-v237-direct-v187-v1.yml' \
            'devsystem/task_ledgers/passing-yards-v237-direct-v187-v1.json' \
            'streamlit_memory_lazy_router_v237.py' \
            'tests/test_passing_yards_v237_lockless_owner.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "PASSING_YARDS_V237_DIRECT_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || {
              echo "PASSING_YARDS_V237_DIRECT_PROTECTED_BLOB_CHANGED:$1:$actual:$2"
              exit 1
            }
          }

          check_blob app.py a0329d64e226e57b7fb39624e3d4e68b604ed0ff
          check_blob streamlit_memory_lazy_router_v236.py 0380da16cd91bcf3801b4d105218b508dbaf43f2
          check_blob streamlit_memory_lazy_router_v187.py 449a6a0712ab0f6be70cebe5a3822e59f279e3b6
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob devsystem/sitewide_page_load_health_v1.py 6fb6750146a34b05f8ba2ff3b72da80e0153ec1e
          check_blob .github/workflows/sitewide-step45-targeted-close-v1.yml 8fdf57caa41828988adb1389fa34979a224385cc

          grep -F 'return identity_router._render_direct_prop()' streamlit_memory_lazy_router_v237.py
          grep -F 'return prior.render_app()' streamlit_memory_lazy_router_v237.py
          echo "PASSING_YARDS_V237_DIRECT_MONSTER_ISOLATION_GREEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused direct-shell tests
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest requests playwright
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_passing_yards_v237_lockless_owner.py
          python -m py_compile streamlit_memory_lazy_router_v237.py
          echo "PASSING_YARDS_V237_DIRECT_STATIC_GREEN"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start branch app
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/py_v237_direct.log 2>&1 &
          echo $! >/tmp/py_v237_direct_pid

      - name: Prove real UI enters V85 directly
        run: |
          python - <<'PY'
          import time
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=2).status_code<500:
                      break
              except Exception:
                  pass
              time.sleep(.3)
          else:
              raise RuntimeError("PY_V237_DIRECT_BRANCH_APP_NOT_READY")

          def app_frame(page,timeout=45):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          body=frame.locator("body").inner_text(timeout=1000)
                          combos=frame.get_by_role("combobox").count()
                      except Exception:
                          continue
                      if combos>=1 and "KYRE SPORTS AI" in body:
                          return frame
                  page.wait_for_timeout(200)
              raise RuntimeError("PY_V237_DIRECT_APP_FRAME_NOT_READY")

          def option(page,combo,value,timeout=30):
              combo.click(timeout=10000)
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role("option",name=value,exact=True)
                          if loc.count()>=1:
                              loc.first.click(timeout=10000)
                              return
                      except Exception:
                          pass
                  page.wait_for_timeout(100)
              raise RuntimeError("PY_V237_DIRECT_OPTION_NOT_READY:"+value)

          def marker(page,selector,timeout=60):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return
                      except Exception:
                          pass
                  page.wait_for_timeout(150)
              body="\n".join(
                  frame.locator("body").inner_text(timeout=1000)
                  for frame in page.frames
                  if frame.locator("body").count()
              )
              raise RuntimeError("PY_V237_DIRECT_MARKER_NOT_READY:"+selector+":"+body[-1800:])

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(base+"/",wait_until="domcontentloaded",timeout=120000)

              frame=app_frame(page)
              sport=frame.get_by_role("combobox",name="🏟️ Sport",exact=True)
              option(page,sport.first,"NFL")

              end=time.monotonic()+45
              market=None
              while time.monotonic()<end:
                  for candidate in page.frames:
                      try:
                          loc=candidate.get_by_role("combobox",name="🎯 NFL Market",exact=True)
                          if loc.count()==1:
                              market=loc.first
                              break
                      except Exception:
                          pass
                  if market is not None:
                      break
                  page.wait_for_timeout(150)
              if market is None:
                  raise RuntimeError("PY_V237_DIRECT_NFL_MARKET_NOT_READY")

              option(page,market,"Passing Yards")
              marker(page,'[data-passing-yards-visible-cleanup-owner="v85"]',60)
              body="\n".join(
                  frame.locator("body").inner_text(timeout=1000)
                  for frame in page.frames
                  if frame.locator("body").count()
              )
              if "Router V187 direct handler is player-prop identity only." in body:
                  raise RuntimeError("PY_V237_DIRECT_V187_CRASH_PRESENT")

              print("PASSING_YARDS_V237_DIRECT_REAL_UI_V85_GREEN")
              print("PASSING_YARDS_V237_DIRECT_NO_HISTORICAL_REENTRY_GREEN")
              browser.close()
          PY

      - name: Print branch log on failure
        if: failure()
        run: tail -n 1200 /tmp/py_v237_direct.log || true

      - name: Stop branch app
        if: always()
        run: kill "$(cat /tmp/py_v237_direct_pid)" 2>/dev/null || true
