name: Passing Yards Layered Phase 1 Step 1 Baseline

on:
  push:
    branches:
      - "monster/passing-yards-layered-phase1-step1-baseline-v1"
    paths:
      - "devsystem/task_ledgers/passing-yards-layered-phase1-step1-baseline-v1.json"
      - "tests/test_passing_yards_layered_phase1_step1_baseline_v1.py"
      - ".github/workflows/passing-yards-layered-phase1-step1-baseline-v1.yml"

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove frozen baseline contract
        run: python -m pytest -q tests/test_passing_yards_layered_phase1_step1_baseline_v1.py
