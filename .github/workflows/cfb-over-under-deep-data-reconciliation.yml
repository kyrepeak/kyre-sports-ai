name: CFB O/U deep current-data reconciliation

on:
  pull_request:
    branches: [main]
  push:
    branches: [cfb-ou-deep-data-reconciliation-v1]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact deep-data scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-deep-data-reconciliation.yml",
              "app.py",
              "cfb_over_under_deep_data_reconciliation_v1.py",
              "cfb_over_under_slate_v13_deep_data.py",
              "cfb_over_under_matchup_ui_v14_deep_data.py",
              "streamlit_memory_lazy_router_v54.py",
              "tests/test_cfb_over_under_deep_data_reconciliation_v1.py",
              "tests/test_cfb_over_under_deep_data_ui_router.py",
          }
          if actual!=expected:
              print("expected",sorted(expected)); print("actual",sorted(actual))
              sys.exit(1)
          print("CFB_OU_DEEP_DATA_SCOPE=PASS")
          PY

      - name: Enforce 12-of-12 and post-12 recovery freezes
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          failures=[]
          manifests=[
              (
                  "cfb_over_under_upgrade_freeze_manifest_v12.json",
                  "b2a798b4625bda5b8472a30e66cde2ecf6aef923",
                  "12/12 master",
              ),
              (
                  "cfb_over_under_post12_data_recovery_freeze_manifest_v1.json",
                  "8baab0745d2b6fb1214da47eb5c0c6dd22355944",
                  "post-12 recovery",
              ),
          ]
          for path,blob,label in manifests:
              if rev(f"HEAD:{path}")!=blob:
                  failures.append(f"{label} manifest changed")
              manifest=json.loads(pathlib.Path(path).read_text())
              for frozen,expected in (manifest.get("exact_blobs") or {}).items():
                  try:
                      actual=rev(f"HEAD:{frozen}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing {label} path: {frozen}")
                      continue
                  if actual!=expected:
                      failures.append(f"{label} frozen path changed: {frozen}")
          if failures:
              print(*failures,sep="\n"); sys.exit(1)
          print("CFB_OU_PARENT_FREEZES_UNTOUCHED=PASS")
          PY

      - name: Compile deep-data stack
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_deep_data_reconciliation_v1.py",
              "cfb_over_under_slate_v13_deep_data.py",
              "cfb_over_under_matchup_ui_v14_deep_data.py",
              "streamlit_memory_lazy_router_v54.py",
              "tests/test_cfb_over_under_deep_data_reconciliation_v1.py",
              "tests/test_cfb_over_under_deep_data_ui_router.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_DEEP_DATA_COMPILE=PASS")
          PY
          PYTHONPATH=. python -c "import cfb_over_under_deep_data_reconciliation_v1; import cfb_over_under_slate_v13_deep_data; import cfb_over_under_matchup_ui_v14_deep_data; import streamlit_memory_lazy_router_v54"

      - name: Run deep-data and inherited regression suite
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_deep_data_reconciliation_v1.py tests/test_cfb_over_under_deep_data_ui_router.py tests/test_cfb_over_under_post12_data_recovery.py tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py tests/test_cfb_over_under_upgrade_step12_certification.py tests/test_cfb_over_under_upgrade_step12_slate.py tests/test_cfb_over_under_upgrade_step12_ui_router.py tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py tests/test_cfb_over_under_upgrade_step11_slate.py tests/test_cfb_over_under_upgrade_step11_ui_router.py tests/test_cfb_over_under_upgrade_step10_history_engine.py tests/test_cfb_over_under_upgrade_step10_slate.py tests/test_cfb_over_under_upgrade_step10_ui_router.py tests/test_cfb_over_under_upgrade_step9_environment_engine.py tests/test_cfb_over_under_upgrade_step9_slate.py tests/test_cfb_over_under_upgrade_step9_ui_router.py tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live Florida A&M at Miami reconciliation certification
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_deep_data_reconciliation_v1 as deep

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          evidence,diag=deep.reconcile_matchup(game,"2026-09-10")
          g=evidence.get("game") or {}
          away=evidence.get("away") or {}
          home=evidence.get("home") or {}
          print("LIVE_RECONCILIATION",json.dumps({
              "event_id":g.get("espn_event_id"),
              "venue":g.get("venue"),
              "broadcast":g.get("broadcast"),
              "status":g.get("status"),
              "week":g.get("espn_week"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "away_conf_record":away.get("conference_record_text"),
              "home_conf_record":home.get("conference_record_text"),
              "away_games":away.get("current_schedule_games_verified"),
              "home_games":home.get("current_schedule_games_verified"),
              "away_ppg":away.get("ppg"),
              "away_pa":away.get("points_allowed_pg"),
              "home_ppg":home.get("ppg"),
              "home_pa":home.get("points_allowed_pg"),
              "away_recent":away.get("recent_form"),
              "home_recent":home.get("recent_form"),
              "away_coach":away.get("head_coach"),
              "home_coach":home.get("head_coach"),
              "home_ap":home.get("ap_rank"),
              "home_coaches":home.get("coaches_poll_rank"),
              "away_division":away.get("division_context"),
              "away_ap":away.get("ap_rank"),
          },indent=2,default=str))

          expected={
              "venue":"Hard Rock Stadium",
              "broadcast":"ACC Network",
              "away_record":"1-1",
              "home_record":"1-0",
              "away_conf_record":"0-0",
              "home_conf_record":"1-0",
              "away_games":2,
              "home_games":1,
              "home_ap":7,
              "home_coaches":7,
          }
          actual={
              "venue":g.get("venue"),
              "broadcast":g.get("broadcast"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "away_conf_record":away.get("conference_record_text"),
              "home_conf_record":home.get("conference_record_text"),
              "away_games":away.get("current_schedule_games_verified"),
              "home_games":home.get("current_schedule_games_verified"),
              "home_ap":home.get("ap_rank"),
              "home_coaches":home.get("coaches_poll_rank"),
          }
          for key,value in expected.items():
              if actual.get(key)!=value:
                  raise SystemExit(f"{key} expected {value!r}, got {actual.get(key)!r}")

          if abs(float(away.get("ppg"))-16.5)>1e-9:
              raise SystemExit(f"FAMU PPG wrong: {away.get('ppg')}")
          if abs(float(away.get("points_allowed_pg"))-19.0)>1e-9:
              raise SystemExit(f"FAMU PA wrong: {away.get('points_allowed_pg')}")
          if abs(float(home.get("ppg"))-45.0)>1e-9:
              raise SystemExit(f"Miami PPG wrong: {home.get('ppg')}")
          if abs(float(home.get("points_allowed_pg"))-6.0)>1e-9:
              raise SystemExit(f"Miami PA wrong: {home.get('points_allowed_pg')}")
          if "mario" not in str(home.get("head_coach") or "").lower() or "cristobal" not in str(home.get("head_coach") or "").lower():
              raise SystemExit(f"Miami coach wrong: {home.get('head_coach')}")
          away_coach=str(away.get("head_coach") or "").lower()
          if "quinn" not in away_coach or "gray" not in away_coach:
              raise SystemExit(f"FAMU coach wrong: {away.get('head_coach')}")
          if str(away.get("division_context") or "").upper()!="FCS":
              raise SystemExit("FAMU division context not FCS")
          if away.get("ap_rank") is not None:
              raise SystemExit("FAMU incorrectly received an FBS AP rank")
          print("LIVE_FAMU_MIAMI_DEEP_DATA_RECONCILIATION=PASS")
          PY

      - name: Live full frozen-stack certification with reconciled inputs
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v13_deep_data as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          try: slate.analyze_game.clear()
          except Exception: pass
          result=slate.analyze_game(game,"2026-09-10",50.5)
          cert=result.get("certification") or {}
          raw=result.get("raw") or {}
          away=result.get("away") or {}
          home=result.get("home") or {}
          form=result.get("form_strength_engine") or {}
          print("LIVE_FULL_STACK",json.dumps({
              "cert_status":cert.get("status"),
              "cert_failures":cert.get("checks_failed"),
              "projected_total":raw.get("projected_total"),
              "sigma":raw.get("structural_total_sigma"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "form_ready":form.get("model_ready"),
              "form_reason":form.get("reason"),
              "final_selection":(result.get("final") or {}).get("selection"),
          },indent=2,default=str))
          if cert.get("status")!="CERTIFIED" or int(cert.get("checks_failed") or 0)!=0:
              raise SystemExit(f"Step-12 integrity lost: {cert}")
          if away.get("record_text")!="1-1" or home.get("record_text")!="1-0":
              raise SystemExit("reconciled profiles did not reach model stack")
          if raw.get("ready") is not True:
              raise SystemExit(f"reconciled model not ready: {raw.get('reasons')}")
          if form.get("model_ready") is not False:
              raise SystemExit("Miami 1-game current-form gate should still be active")
          if "home current-season sample below 2 games" not in str(form.get("reason") or ""):
              raise SystemExit(f"unexpected Step-11 gate: {form.get('reason')}")
          print("LIVE_FAMU_MIAMI_DEEP_DATA_STEP12_CERTIFIED=PASS")
          PY

      - name: Live reconciled UI contains corrected fields
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v3 as schedule
          import cfb_over_under_deep_data_reconciliation_v1 as deep
          import cfb_over_under_matchup_ui_v14_deep_data as ui

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          evidence,_=deep.reconcile_matchup(game,"2026-09-10")
          panel=ui._current_data_panel(
              evidence.get("game") or {},
              evidence.get("away") or {},
              evidence.get("home") or {},
          )
          for token in (
              "Hard Rock Stadium",
              "ACC Network",
              "1-1",
              "1-0",
              "Mario Cristobal",
              "#7",
              "CURRENT RECORDS",
              "CURRENT-WEEK POLLS",
          ):
              if token not in panel:
                  raise SystemExit(f"deep-data UI missing {token!r}")
          if "Quinn" not in panel or "Gray" not in panel:
              raise SystemExit("FAMU head coach missing from UI")
          print("LIVE_FAMU_MIAMI_DEEP_DATA_UI=PASS")
          PY

      - name: Deep-data model firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_deep_data_reconciliation_v1.py",
              "cfb_over_under_slate_v13_deep_data.py",
              "cfb_over_under_matchup_ui_v14_deep_data.py",
              "streamlit_memory_lazy_router_v54.py",
              "app.py",
          ))
          required=[
              'FROZEN_PARENT_RECOVERY = "cfb_over_under_data_recovery_v1"',
              'FROZEN_STEP12_CERTIFIER = "cfb_over_under_slate_v11"',
              'FROZEN_PARENT_UI = "cfb_over_under_matchup_ui_v13_data_recovery"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v53"',
              'from streamlit_memory_lazy_router_v54 import render_app',
              'NEW_MODEL_FORMULA_ADDED = False',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing deep-data firewall marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"deep-data layer crossed model firewall: {token}")
          print("CFB_OU_DEEP_DATA_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo CFB_OU_DEEP_CURRENT_DATA_RECONCILIATION_GREEN
