name: NFL Prop Analytics Step 6 Availability Depth

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_availability_depth_v1.py"
      - "tests/test_nfl_prop_analytics_step6_availability_depth_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_availability_depth_v1.py"
      - "tests/test_nfl_prop_analytics_step6_availability_depth_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-step6-availability-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 6 scope and frozen Steps 1-5 / Passing Yards
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_availability_depth_v1.py' \
            'tests/test_nfl_prop_analytics_step6_availability_depth_v1.py' | sort)"
          step7_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_player_select_v1.py' \
            'tests/test_nfl_prop_analytics_step7_player_handoff_v1.py' | sort)"
          step8_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step8-prop-page-shell-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py' | sort)"
          visual_polish_step3_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json' \
            'nfl_prop_analytics_schedule_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_visual_polish_step3_v1.py' | sort)"
          page2_polish_step1_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json' \
            'nfl_prop_analytics_matchup_shell_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step1_v1.py'  | sort)"

          if [ "$actual" != "$expected" ] && [ "$actual" != "$step7_additive_expected" ] && \
             [ "$actual" != "$step8_additive_expected" ] && \
             [ "$actual" != "$visual_polish_step3_expected" ] && \
             [ "$actual" != "$page2_polish_step1_expected" ]; then
            echo "NFL_PROP_ANALYTICS_STEP6_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "NFL_PROP_ANALYTICS_STEP6_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob devsystem/task_ledgers/nfl-prop-analytics-step5-roster-truth-v1.json feee54609cc70337663bdadef3949271382b52f7
          check_blob nfl_prop_analytics_matchup_shell_v1.py 3052411d963354997f17f15358407db7a2c2c57e
          check_blob nfl_prop_analytics_game_select_v1.py 1187c13fc5bee03a955d014e87f237ed055a27ef
          check_blob nfl_prop_analytics_schedule_v1.py 3558f4581c0301c4fc57f8b5e761e1e0cc1eb63c
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          grep -F 'render_availability_depth_truth(handoff, roster_truth)' nfl_prop_analytics_hub_v1.py
          echo "NFL_PROP_ANALYTICS_STEP6_STEP5_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_STEP4_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_STEP3_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_STEP2_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_STEP1_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_PASSING_YARDS_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP6_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test Steps 1-6 contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile \
            nfl_prop_analytics_hub_v1.py \
            nfl_prop_analytics_roster_truth_v1.py \
            nfl_prop_analytics_availability_depth_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py \
            tests/test_nfl_prop_analytics_step3_game_handoff_v1.py \
            tests/test_nfl_prop_analytics_step4_page2_shell_v1.py \
            tests/test_nfl_prop_analytics_step5_roster_truth_v1.py \
            tests/test_nfl_prop_analytics_step6_availability_depth_v1.py
          echo "NFL_PROP_ANALYTICS_STEP6_STATIC_GREEN"

      - name: Prove live CAR-CLE exact-event availability + exact-ID depth
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from nfl_prop_analytics_roster_truth_v1 import load_verified_roster_truth
          from nfl_prop_analytics_availability_depth_v1 import load_availability_depth_truth, POSITIONS

          handoff={
              "state":"ready",
              "selection_key":"CAR-CLE",
              "away":"CAR",
              "home":"CLE",
              "away_name":"Panthers",
              "home_name":"Browns",
              "target_date":"2026-09-27",
              "week":3,
          }
          roster=load_verified_roster_truth(handoff)
          if roster["state"]!="live":
              raise RuntimeError("PROP_ANALYTICS_STEP6_STEP5_ROSTER_NOT_LIVE:"+str(roster.get("reason")))

          truth=load_availability_depth_truth(handoff,roster)
          if truth["state"]!="live":
              raise RuntimeError(
                  "PROP_ANALYTICS_STEP6_LIVE_NOT_READY:"
                  + str({
                      "reason":truth.get("reason"),
                      "event":truth.get("event"),
                      "snapshot":truth.get("snapshot"),
                      "teams":{
                          k:(v.get("depth_diag") if isinstance(v,dict) else v)
                          for k,v in (truth.get("teams") or {}).items()
                      },
                  })
              )
          if not str(truth["event_id"]).isdigit():
              raise RuntimeError("PROP_ANALYTICS_STEP6_EVENT_ID_NOT_ESPN_NUMERIC")
          if truth["availability_state"] not in {"PENDING","CONFIRMED","CLOSED"}:
              raise RuntimeError("PROP_ANALYTICS_STEP6_AVAILABILITY_STATE:"+str(truth["availability_state"]))

          for team in ("CAR","CLE"):
              for pos in POSITIONS:
                  rows=truth["teams"][team]["by_position"][pos]
                  if not any(row["depth_verified"] for row in rows):
                      raise RuntimeError(f"PROP_ANALYTICS_STEP6_DEPTH_EMPTY:{team}:{pos}")

          all_players=[
              row
              for team in ("CAR","CLE")
              for row in truth["teams"][team]["players"]
          ]
          if truth["availability_state"]=="PENDING":
              leaked=[row["name"] for row in all_players if row["availability_state"]=="AVAILABLE"]
              if leaked:
                  raise RuntimeError("PROP_ANALYTICS_STEP6_EARLY_AVAILABLE_LEAK:"+str(leaked))

          print("NFL_PROP_ANALYTICS_STEP6_LIVE_GREEN",truth["event_id"])
          print("NFL_PROP_ANALYTICS_STEP6_AVAILABILITY_GREEN",truth["availability_state"])
          print("NFL_PROP_ANALYTICS_STEP6_DEPTH_GREEN",truth["depth_verified_count"])
          print("NFL_PROP_ANALYTICS_STEP6_STARTERS_GREEN",truth["starter_count"])
          if truth["availability_state"]=="PENDING":
              print("NFL_PROP_ANALYTICS_STEP6_PENDING_FAIL_CLOSED_GREEN")
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/nfl-prop-analytics-step6
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/nfl-prop-analytics-step6/streamlit.log 2>&1 &
          echo $! > /tmp/prop_analytics_step6_pid

      - name: Prove Page 2 availability/depth overlay and frozen predecessors
        run: |
          python - <<'PY'
          import time
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("PROP_ANALYTICS_STEP6_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP6_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(
                  base+"/?ks_jump_sport=NFL&ks_jump_market=Prop+Analytics&ks_pa_game=CAR-CLE&ks_pa_page=matchup",
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              _,roster=find(page,'[data-nfl-prop-analytics-step5-roster="v1"]',180)
              _,step6=find(page,'[data-nfl-prop-analytics-step6-availability="v1"]',180)

              assert roster.get_attribute("data-prop-roster-state")=="live"
              assert step6.get_attribute("data-prop-step6-state")=="live"
              state=step6.get_attribute("data-prop-step6-availability-state")
              assert state in {"PENDING","CONFIRMED","CLOSED"},state
              event_id=step6.get_attribute("data-prop-step6-event-id")
              assert event_id and event_id.isdigit(),event_id
              depth_count=int(step6.get_attribute("data-prop-step6-depth-verified-count") or 0)
              assert depth_count>=8,depth_count

              for team in ("CAR","CLE"):
                  for pos in ("QB","RB","WR","TE"):
                      count=0
                      for frame in page.frames:
                          count+=frame.locator(
                              f'[data-prop-step6-position="{pos}"][data-prop-step6-team="{team}"]'
                          ).count()
                      assert count==1,(team,pos,count)

              if state=="PENDING":
                  available=0
                  for frame in page.frames:
                      available+=frame.locator('[data-prop-step6-availability="AVAILABLE"]').count()
                  assert available==0,available
                  print("NFL_PROP_ANALYTICS_STEP6_BRANCH_PENDING_FAIL_CLOSED_GREEN")

              print("NFL_PROP_ANALYTICS_STEP6_BRANCH_GREEN",event_id,state,depth_count)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=step6.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP6_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP6_BRANCH_{width}_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP6_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP6_STEP5_BRANCH_FROZEN_GREEN")

              passing.close()
              page.close()
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1800 artifacts/nfl-prop-analytics-step6/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/prop_analytics_step6_pid ]; then
            kill "$(cat /tmp/prop_analytics_step6_pid)" 2>/dev/null || true
          fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Step 6 availability/depth and freeze
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=150):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP6_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def open_step6(browser):
              deadline=time.monotonic()+1200
              last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(
                          base+"/?ks_jump_sport=NFL&ks_jump_market=Prop+Analytics&ks_pa_game=CAR-CLE&ks_pa_page=matchup",
                          wait_until="domcontentloaded",
                          timeout=120000,
                      )
                      _,roster=find(page,'[data-nfl-prop-analytics-step5-roster="v1"]',120)
                      _,step6=find(page,'[data-nfl-prop-analytics-step6-availability="v1"]',180)
                      state=step6.get_attribute("data-prop-step6-availability-state")
                      event_id=step6.get_attribute("data-prop-step6-event-id")
                      depth=int(step6.get_attribute("data-prop-step6-depth-verified-count") or 0)
                      if roster.get_attribute("data-prop-roster-state")!="live":
                          last="STEP5_ROSTER_NOT_LIVE"
                      elif step6.get_attribute("data-prop-step6-state")!="live":
                          last="STEP6_NOT_LIVE"
                      elif state not in {"PENDING","CONFIRMED","CLOSED"}:
                          last=f"STEP6_AVAILABILITY_STATE:{state}"
                      elif not event_id or not event_id.isdigit():
                          last=f"STEP6_EVENT_ID:{event_id}"
                      elif depth<8:
                          last=f"STEP6_DEPTH_COUNT:{depth}"
                      else:
                          return context,page,step6,state,event_id,depth
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PROP_ANALYTICS_STEP6_PUBLIC_DEPLOY_WAIT",last)
                  try:
                      context.close()
                  except Exception:
                      pass
                  time.sleep(8)
              raise RuntimeError("PROP_ANALYTICS_STEP6_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context,page,step6,state,event_id,depth=open_step6(browser)

              if state=="PENDING":
                  available=0
                  for frame in page.frames:
                      available+=frame.locator('[data-prop-step6-availability="AVAILABLE"]').count()
                  assert available==0,available
                  print("NFL_PROP_ANALYTICS_STEP6_PUBLIC_PENDING_FAIL_CLOSED_GREEN")

              for team in ("CAR","CLE"):
                  for pos in ("QB","RB","WR","TE"):
                      count=0
                      for frame in page.frames:
                          count+=frame.locator(
                              f'[data-prop-step6-position="{pos}"][data-prop-step6-team="{team}"]'
                          ).count()
                      assert count==1,(team,pos,count)

              print("NFL_PROP_ANALYTICS_STEP6_PUBLIC_GREEN",event_id,state,depth)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=step6.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP6_PUBLIC_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP6_PUBLIC_{width}_GREEN")

              passing=context.new_page()
