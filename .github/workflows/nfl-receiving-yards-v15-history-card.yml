name: NFL Receiving Yards V15 Player vs Defense History

on:
  pull_request:
    paths:
      - "nfl_receiving_yards_history_card_v1.py"
      - "nfl_receiving_yards_hub_v15.py"
      - "streamlit_memory_lazy_router_v146.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_history_card_v15.py"
      - ".github/workflows/nfl-receiving-yards-v15-history-card.yml"
  workflow_dispatch:

jobs:
  receiving-v15-history-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Receiving Yards V15 history-card contract
        run: python -m pytest -q tests/test_nfl_receiving_yards_history_card_v15.py
