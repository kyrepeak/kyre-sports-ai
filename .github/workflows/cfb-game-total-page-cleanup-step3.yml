name: CFB Game Total page cleanup Step 3 Team Evidence data

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_team_evidence_data_v1.py"
      - "cfb_game_total_clean_page_v22.py"
      - "streamlit_memory_lazy_router_v167.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step3.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step3-team-evidence-data.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step3.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_team_evidence_data_v1.py"
      - "cfb_game_total_clean_page_v22.py"
      - "streamlit_memory_lazy_router_v167.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step3.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step3-team-evidence-data.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step3.yml"

permissions:
  contents: read

jobs:
  verify-step3-team-evidence-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 3 data files
        run: |
          python -m py_compile cfb_game_total_team_evidence_data_v1.py cfb_game_total_clean_page_v22.py streamlit_memory_lazy_router_v167.py app.py
      - name: Run targeted Step 3 contract proof
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_game_total_page_cleanup_step3.py
      - name: Prove Purdue UCLA Team Evidence fields live
        run: |
          python - <<'PY'
          import json
          import cfb_game_total_clean_page_v4 as stats_owner
          import cfb_game_total_clean_page_v9 as compact
          import cfb_game_total_clean_page_v10 as presentation
          import cfb_game_total_clean_page_v22 as page
          import cfb_game_total_slate_v2 as slate_v2

          day = "2026-09-19"
          games, _ = compact.frozen_page.frozen_v2.frozen_v1.schedule.load_with_diagnostics(day)
          matches = [
              dict(g) for g in games
              if str(g.get("away_team") or "").strip().casefold() == "purdue"
              and str(g.get("home_team") or "").strip().casefold() == "ucla"
          ]
          assert len(matches) == 1, matches
          game = matches[0]
          result = slate_v2.analyze_game(game, day)
          display_game, away, home, diag = page._reconcile_display_bundle_v22(
              game,
              day,
              result["away"],
              result["home"],
          )
          away_stats = stats_owner._team_stats_state(away, display_game, "away")
          home_stats = stats_owner._team_stats_state(home, display_game, "home")

          required = ("ppg", "allowed_pg", "point_diff_pg", "recent_form")
          for label, state in (("away", away_stats), ("home", home_stats)):
              assert int(state.get("sample_games") or 0) > 0, (label, state)
              assert state.get("quality") == "GREEN", (label, state)
              for field in required:
                  assert state.get(field) not in (None, "", "—"), (label, field, state)

          identity = {
              "away": {"team": "Purdue", "conference": "Big Ten"},
              "home": {"team": "UCLA", "conference": "Big Ten"},
          }
          html = presentation._target_team_evidence_html(
              identity, away_stats, home_stats
          )
          for value in (
              away_stats["ppg"],
              away_stats["allowed_pg"],
              away_stats["point_diff_pg"],
              home_stats["ppg"],
              home_stats["allowed_pg"],
              home_stats["point_diff_pg"],
          ):
              assert f"{float(value):.1f}" in html
          assert away_stats["recent_form"] in html
          assert home_stats["recent_form"] in html

          proof = {
              "marker": "CFB_GAME_TOTAL_PAGE_CLEANUP_STEP3_TEAM_EVIDENCE_DATA_GREEN",
              "event_id": game.get("espn_event_id") or game.get("event_id"),
              "repair_diag": diag.get("step3_team_evidence"),
              "away": {k: away_stats.get(k) for k in required + ("sample_games", "quality")},
              "home": {k: home_stats.get(k) for k in required + ("sample_games", "quality")},
          }
          print(json.dumps(proof, indent=2, default=str))
          PY
