name: CFB O/U Intelligence V2 Upgrade Step 1 permanent freeze

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step1-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step1-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step1-permanent-freeze.yml' \
            'cfb_over_under_upgrade_freeze_manifest_v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U Upgrade Step 1 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_UPGRADE_STEP1_FREEZE_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          base_manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (base_manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen base path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"original frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce Upgrade Step 1 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v1.json").read_text()
          )

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if manifest.get("version") != 1:
              failures.append("upgrade freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1]:
              failures.append("completed upgrade steps changed")

          contract = manifest.get("step1_contract") or {}
          required_true = [
              "team_logos_active",
              "logo_fallback_active",
              "matchup_header_active",
              "presentation_only",
          ]
          for key in required_true:
              if contract.get(key) is not True:
                  failures.append(f"Step 1 contract lost {key}")

          required_false = [
              "projection_math_changed",
              "selection_math_changed",
              "ranking_math_changed",
              "analysis_line_behavior_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if contract.get(key) is not False:
                  failures.append(f"Step 1 contract changed {key}")

          if contract.get("next_upgrade_step") != 2:
              failures.append("Step 1 next-upgrade handoff changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Upgrade Step 1 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"Upgrade Step 1 blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_OU_UPGRADE_STEP1_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify active runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v37 import render_app' app.py
          python -m py_compile \
            cfb_over_under_matchup_ui_v1.py \
            streamlit_memory_lazy_router_v37.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step1.py \
            tests/test_streamlit_memory_lazy_router_v37.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_cfb_step9_over_under_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v36.py

      - name: Freeze marker
        run: echo "CFB_OU_UPGRADE_STEP1_PERMANENT_FREEZE_GREEN"
