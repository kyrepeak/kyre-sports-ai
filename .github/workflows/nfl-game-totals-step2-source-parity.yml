name: NFL Game Totals Step 2 Source Parity

on:
  push:
    branches:
      - monster/nfl-game-totals-step2-source-parity
  pull_request:
    branches:
      - main
    paths:
      - sports_api/collectors/nfl_fanduel_game_totals_v1.py
      - tests/test_nfl_game_totals_step2_source_parity.py
      - .github/workflows/nfl-game-totals-step2-source-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow test dependencies
        run: python -m pip install --upgrade pip pytest fastapi httpx
      - name: Freeze-scope guard
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'sports_api/collectors/nfl_fanduel_game_totals_v1.py',
              'tests/test_nfl_game_totals_step2_source_parity.py',
              '.github/workflows/nfl-game-totals-step2-source-parity.yml',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'Unexpected Step 2 parity paths: {extra}')
          forbidden = [p for p in changed if any(token in p.lower() for token in ('spread', 'moneyline', 'rushing', 'receiving', 'v136'))]
          if forbidden:
              raise SystemExit(f'Frozen surface changed: {forbidden}')
          print('freeze-scope OK:', sorted(changed))
          PY
      - name: Production collector blob parity guard
        run: |
          actual="$(git hash-object sports_api/collectors/nfl_fanduel_game_totals_v1.py)"
          expected="de4f830261f563a81f153920b795b38e6dff5750"
          echo "collector blob: $actual"
          test "$actual" = "$expected"
      - name: Compile collector
        run: python -m py_compile sports_api/collectors/nfl_fanduel_game_totals_v1.py
      - name: Run source parity regressions
        run: python -m pytest -q tests/test_nfl_game_totals_step2_source_parity.py
      - name: Run existing Game Totals regressions
        run: python -m pytest -q tests/test_nfl_fanduel_game_totals_v1.py tests/test_nfl_game_totals_market_v1.py
