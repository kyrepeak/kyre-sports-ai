name: MLB Hits Step 3 permanent freeze contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['mlb-hits-step3-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 3 freeze-contract creation scope
        if: github.event_name == 'push' || github.head_ref == 'mlb-hits-step3-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-hits-step3-permanent-freeze-contract.yml' \
            'mlb_hits_freeze_manifest_v3.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected MLB Hits Step 3 freeze-contract creation scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "MLB_HITS_STEP3_FREEZE_CREATION_SCOPE=PASS"

      - name: Enforce permanent Hits Steps 1-3 frozen-file manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(pathlib.Path('mlb_hits_freeze_manifest_v3.json').read_text())
          base = manifest['baseline_commit']

          def rev(spec):
              return subprocess.check_output(['git', 'rev-parse', spec], text=True).strip()

          failures = []
          for path in manifest['baseline_paths']:
              try:
                  expected = rev(f'{base}:{path}')
                  actual = rev(f'HEAD:{path}')
              except subprocess.CalledProcessError:
                  failures.append(f'missing frozen Hits path: {path}')
                  continue
              if expected != actual:
                  failures.append(
                      f'frozen Hits baseline changed: {path} expected={expected} actual={actual}'
                  )

          for path, expected in manifest['exact_blobs'].items():
              try:
                  actual = rev(f'HEAD:{path}')
              except subprocess.CalledProcessError:
                  failures.append(f'missing exact-frozen Hits path: {path}')
                  continue
              if expected != actual:
                  failures.append(
                      f'exact frozen Hits blob changed: {path} expected={expected} actual={actual}'
                  )

          if failures:
              print('\n'.join(failures))
              sys.exit(1)

          if manifest.get('completed_steps') != [1, 2, 3]:
              raise SystemExit('Hits completed_steps manifest mismatch')

          print('MLB_HITS_STEPS_1_3_PERMANENT_FREEZE_MANIFEST=PASS')
          PY

      - name: Compile frozen Hits Steps 1-3
        run: |
          python -m py_compile \
            mlb_hit_hub_v1316.py \
            mlb_hit_hub_v1317.py \
            mlb_hit_hitter_profile_v1.py \
            mlb_hit_hub_v1318.py \
            streamlit_memory_lazy_router_v3.py \
            streamlit_memory_lazy_router_v17.py \
            streamlit_memory_lazy_router_v18.py \
            tests/test_mlb_hits_step1_strength_evidence_summary.py \
            tests/test_mlb_hits_step2_mobile_top5.py \
            tests/test_streamlit_memory_lazy_router_v17.py \
            tests/test_mlb_hits_step3_hitter_profile.py \
            tests/test_streamlit_memory_lazy_router_v18.py
          PYTHONPATH=. python -c "import mlb_hit_hub_v1316; import mlb_hit_hub_v1317; import mlb_hit_hitter_profile_v1; import mlb_hit_hub_v1318; import streamlit_memory_lazy_router_v3; import streamlit_memory_lazy_router_v17; import streamlit_memory_lazy_router_v18"

      - name: Run frozen Hits Steps 1-3 contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_hits_step1_strength_evidence_summary.py \
            tests/test_mlb_hits_step2_mobile_top5.py \
            tests/test_streamlit_memory_lazy_router_v17.py \
            tests/test_mlb_hits_step3_hitter_profile.py \
            tests/test_streamlit_memory_lazy_router_v18.py \
            -k 'not app_activates_additive_router_v3 and not router_changes_only_hits_route_and_delegates_everything_else'

      - name: Certification marker
        run: |
          echo "MLB_HITS_STEP1_PERMANENT_FREEZE_GREEN"
          echo "MLB_HITS_STEP2_PERMANENT_FREEZE_GREEN"
          echo "MLB_HITS_STEP3_PERMANENT_FREEZE_GREEN"
