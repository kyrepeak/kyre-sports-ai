name: MLB Step5.10 canary-rollout certification

on:
  push:
    branches:
      - mlb-step5-10-canary-rollout-controller
    paths:
      - "sports_api/mlb_price_gate_canary_v1.py"
      - "mlb_daily_game_picks_price_gate_canary_v1.py"
      - "mlb_daily_game_picks_v217_guard.py"
      - "tests/test_mlb_price_gate_canary_v1.py"
      - ".github/workflows/mlb-step5-10-canary-rollout-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP5_10_BASE_SHA: 6028a1d8fc6f790e81628eacb8c16d1c712fa173
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true

jobs:
  certify-canary-rollout-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Assert additive MLB-only change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP5_10_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP5_10_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          allowed='^(sports_api/mlb_price_gate_canary_v1.py|mlb_daily_game_picks_price_gate_canary_v1.py|mlb_daily_game_picks_v217_guard.py|tests/test_mlb_price_gate_canary_v1.py|\.github/workflows/mlb-step5-10-canary-rollout-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP5_10_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          echo 'MLB_STEP5_10_CHANGE_SCOPE_OK'

      - name: Prove Step5.9 and V2.1.7 selector are frozen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP5_10_BASE_SHA"...HEAD -- \
            sports_api/mlb_controlled_price_gate_v1.py \
            mlb_daily_game_picks_controlled_price_gate_v1.py \
            mlb_daily_game_picks_v217.py
          echo 'MLB_STEP5_10_STEP5_9_AND_SELECTOR_FROZEN'

      - name: Prove V2.1.7 risk and lineup functions are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(
              ['git', 'show', f'{os.environ["STEP5_10_BASE_SHA"]}:mlb_daily_game_picks_v217_guard.py'],
              text=True,
          )
          head = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          protected = {
              '_safe_int', '_norm', '_lineup_members_bulk', '_official_snapshots_v217',
              '_player_lineup_guard', '_risk_context_v217_guard',
          }
          def dumps(source):
              tree = ast.parse(source)
              return {
                  node.name: ast.dump(node, include_attributes=False)
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in protected
              }
          if dumps(base) != dumps(head) or set(dumps(head)) != protected:
              raise SystemExit('STEP5_10_PROTECTED_V217_FUNCTION_DRIFT')
          print('MLB_STEP5_10_V217_RISK_FUNCTIONS_FROZEN')
          PY

      - name: Assert bounded canary and rollback contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('sports_api/mlb_price_gate_canary_v1.py').read_text(encoding='utf-8')
          presentation = Path('mlb_daily_game_picks_price_gate_canary_v1.py').read_text(encoding='utf-8')
          guard = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          combined = core + '\n' + presentation + '\n' + guard

          forbidden = ('difflib', 'SequenceMatcher', 'fuzzywuzzy', 'rapidfuzz', 'sqlite3', 'psycopg', 'sqlalchemy', 'INSERT INTO', 'requests.post(')
          if any(token in combined for token in forbidden):
              raise SystemExit('STEP5_10_FORBIDDEN_MATCHER_OR_WRITE_PATH')

          forbidden_writes = (
              'c["probability"] =', "c['probability'] =",
              'c["score"] =', "c['score'] =",
              'c["projection"] =', "c['projection'] =",
              'candidate["probability"] =', "candidate['probability'] =",
              'candidate["score"] =', "candidate['score'] =",
          )
          if any(token in presentation or token in guard for token in forbidden_writes):
              raise SystemExit('STEP5_10_PRODUCTION_FIELD_WRITE_PRESENT')

          required = (
              'MAX_CANARY_PERCENT = 25.0',
              'hashlib.sha256',
              'math.floor',
              'MLB_STEP5_10_CANARY_ENABLED',
              'MLB_STEP5_10_CANARY_PERCENT',
              'os.getenv(_CANARY_ENABLED_KEY, "0")',
              'os.getenv(_CANARY_PERCENT_KEY, "0")',
              'step59._BASE_ALL_LIVE_CONTEXT(games_df)',
              'selected = base_selected',
              'v217._select_risk_aware(eligible, risks)',
              'global_step5_9_gate_active',
              'GLOBAL_STEP5_9_GATE_PRECEDENCE',
              'external_host_activation_verified',
              'install_price_gate_canary_layer(games_df)',
              'exact_rollback_available',
              'unpriced_player_props_passthrough',
              'Pick Strength',
          )
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit('STEP5_10_CONTRACT_TOKEN_MISSING: ' + ' | '.join(missing))
          if '"external_host_activation_verified": False' not in presentation:
              raise SystemExit('STEP5_10_HOST_ACTIVATION_OVERCLAIM_RISK')
          if 'from mlb_daily_game_picks_price_gate_canary_v1 import install_price_gate_canary_layer' not in guard:
              raise SystemExit('STEP5_10_ACTIVE_GUARD_IMPORT_MISSING')
          print('MLB_STEP5_10_BOUNDED_CANARY_CONTRACT_OK')
          PY

      - name: Prove frozen app ancestry still routes Daily Picks to active V2.1.7 guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          ancestor = subprocess.check_output(
              ['git', 'show', '6fb976a9e20c96eb68b71ad0d3511e3be1734292:app.py'],
              text=True,
          )
          required = (
              'old = "from mlb_daily_game_picks_v198 import render_daily_game_picks"',
              'new = "from mlb_daily_game_picks_v217_guard import render_daily_game_picks"',
          )
          missing = [token for token in required if token not in ancestor]
          if missing:
              raise SystemExit('STEP5_10_ACTIVE_ROUTE_ANCESTRY_DRIFT: ' + ' | '.join(missing))
          print('MLB_STEP5_10_ACTIVE_ROUTE_CONFIRMED')
          PY

      - name: Compile Step5.10 Python files
        run: |
          python -m py_compile \
            sports_api/mlb_price_gate_canary_v1.py \
            mlb_daily_game_picks_price_gate_canary_v1.py \
            mlb_daily_game_picks_v217_guard.py \
            tests/test_mlb_price_gate_canary_v1.py

      - name: Run deterministic canary regression suite
        run: python -m pytest -q tests/test_mlb_price_gate_canary_v1.py

      - name: Certify live bounded canary and exact rollback behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request

          from sports_api.mlb_live_market_context_v1 import attach_live_market_context
          from sports_api.mlb_market_probability_v1 import derive_market_probability_contexts
          from sports_api.mlb_model_market_edge_v1 import model_market_edge
          from sports_api.mlb_price_discipline_v1 import price_discipline_context
          from sports_api.mlb_market_movement_v1 import build_market_observation, compare_market_observations
          from sports_api.mlb_price_health_v1 import price_health_context
          from sports_api.mlb_actionability_shadow_v1 import actionability_shadow_context
          from sports_api.mlb_controlled_price_gate_v1 import controlled_price_gate
          from sports_api.mlb_price_gate_canary_v1 import MAX_CANARY_PERCENT, select_canary_game_ids

          payload = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      os.environ['PRODUCTION_ODDS_URL'],
                      headers={'Accept': 'application/json', 'User-Agent': 'KyreSportsStep5-10Cert/1.0'},
                      method='GET',
                  )
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = int(response.status)
                      payload = json.loads(response.read(2_000_000).decode('utf-8'))
                  break
              except Exception as exc:
                  last_error = exc
                  print(f'STEP5_10_PRODUCTION_FETCH_ATTEMPT_{attempt}_FAILED: {type(exc).__name__}: {exc}')
                  if attempt < 3:
                      time.sleep(4)
          if payload is None:
              raise SystemExit(f'STEP5_10_PRODUCTION_FETCH_FAILED: {last_error}')

          if status != 200 or payload.get('source') != 'FanDuel' or payload.get('schema_version') != 1:
              raise SystemExit('STEP5_10_BAD_PRODUCTION_PAYLOAD')
          if payload.get('data_type') != 'mlb_live_odds_api_response_v1':
              raise SystemExit('STEP5_10_BAD_PRODUCTION_DATA_TYPE')
          if payload.get('transport') != 'anonymous_public_get_only':
              raise SystemExit('STEP5_10_BAD_PRODUCTION_TRANSPORT')
          collected_at = payload.get('collected_at_utc')
          games = payload.get('games') or []
          if not collected_at or not games:
              raise SystemExit('STEP5_10_MISSING_CURRENT_MARKET_SNAPSHOT')

          game_ids = [int(game['official_game_id']) for game in games]
          cohort = select_canary_game_ids(game_ids, enabled=True, requested_percent=25)
          rollback = select_canary_game_ids(game_ids, enabled=False, requested_percent=25)
          over_requested = select_canary_game_ids(game_ids, enabled=True, requested_percent=100)
          if rollback['selected_game_ids']:
              raise SystemExit('STEP5_10_ROLLBACK_COHORT_NOT_EMPTY')
          if over_requested['effective_percent'] != MAX_CANARY_PERCENT:
              raise SystemExit('STEP5_10_SAFETY_CAP_FAILED')
          if over_requested['selected_game_ids'] != cohort['selected_game_ids']:
              raise SystemExit('STEP5_10_ABOVE_CAP_CHANGED_COHORT')
          if cohort['realized_percent'] > MAX_CANARY_PERCENT + 1e-12:
              raise SystemExit('STEP5_10_REALIZED_COHORT_EXCEEDS_CAP')
          expected_selected_games = int(math.floor(len(set(game_ids)) * MAX_CANARY_PERCENT / 100.0))
          if cohort['selected_game_count'] != expected_selected_games:
              raise SystemExit('STEP5_10_COHORT_SIZE_MISMATCH')

          model_rows = [{'game_pk': game_id} for game_id in reversed(game_ids)]
          step52 = attach_live_market_context(model_rows, games)
          step53 = derive_market_probability_contexts(step52)
          if step52.get('attached_count') != len(games) or step53.get('derived_context_count') != len(games):
              raise SystemExit('STEP5_10_EXACT_ID_CHAIN_COUNT_MISMATCH')
          if step53.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_10_FALLBACK_WAS_USED')

          selected_games = set(cohort['selected_game_ids'])
          checks = 0
          rollback_passthrough = 0
          enrolled_checks = 0
          nonenrolled_passthrough = 0
          enrolled_allow = 0
          enrolled_block = 0
          line_bearing = 0

          for game in games:
              game_id = int(game['official_game_id'])
              context = (step53.get('contexts_by_game_id') or {}).get(game_id)
              if not context:
                  raise SystemExit(f'STEP5_10_MISSING_CONTEXT_{game_id}')
              away = str(game.get('away_team') or f'AWAY_{game_id}')
              home = str(game.get('home_team') or f'HOME_{game_id}')
              scenarios = [
                  ('Moneyline', 'Away', context['moneyline']['away']),
                  ('Moneyline', 'Home', context['moneyline']['home']),
                  ('Run Line', 'Away', context['run_line']['away']),
                  ('Run Line', 'Home', context['run_line']['home']),
                  ('Total', 'Over ' + str(context['total'].get('line')), context['total']['over']),
                  ('Total', 'Under ' + str(context['total'].get('line')), context['total']['under']),
              ]
              for market, side_text, side_block in scenarios:
                  no_vig = float(side_block['no_vig_probability'])
                  model_p = min(0.90, max(0.10, no_vig + 0.02))
                  candidate = {'game_pk': game_id, 'market': market, 'probability': model_p, 'side': side_text, 'name': None, 'team': None}
                  edge = model_market_edge(candidate, context, away_team=away, home_team=home)
                  price = price_discipline_context(edge)
                  observation = build_market_observation(price, collected_at_utc=collected_at)
                  movement = compare_market_observations(observation, as_of_utc=observation['collected_at_utc'])
                  health = price_health_context(movement)
                  shadow = actionability_shadow_context(health)

                  gate_rollback = controlled_price_gate(shadow, activation_requested=False)
                  if gate_rollback['gate_status'] != 'CONTROL_DISABLED' or gate_rollback['final_card_price_eligible'] is not True:
                      raise SystemExit(f'STEP5_10_ROLLBACK_CHANGED_ELIGIBILITY_{game_id}_{market}')
                  rollback_passthrough += 1

                  enrolled = game_id in selected_games
                  gate = controlled_price_gate(shadow, activation_requested=enrolled)
                  if enrolled:
                      enrolled_checks += 1
                      if shadow['shadow_status'].startswith('SHADOW_PLAYABLE'):
                          if gate['gate_status'] != 'GATE_ALLOW' or gate['final_card_price_eligible'] is not True:
                              raise SystemExit(f'STEP5_10_ENROLLED_ALLOW_MISMATCH_{game_id}_{market}')
                          enrolled_allow += 1
                      else:
                          if gate['gate_status'] != 'GATE_BLOCK' or gate['final_card_price_eligible'] is not False:
                              raise SystemExit(f'STEP5_10_ENROLLED_BLOCK_MISMATCH_{game_id}_{market}')
                          enrolled_block += 1
                  else:
                      if gate['gate_status'] != 'CONTROL_DISABLED' or gate['final_card_price_eligible'] is not True:
                          raise SystemExit(f'STEP5_10_NONENROLLED_NOT_PASSTHROUGH_{game_id}_{market}')
                      nonenrolled_passthrough += 1

                  for flag in ('model_math_impact', 'pick_strength_impact', 'ranking_math_impact', 'risk_logic_impact', 'wagering_impact'):
                      if gate.get(flag) is not False:
                          raise SystemExit(f'STEP5_10_PROTECTED_IMPACT_DRIFT_{flag}_{game_id}_{market}')
                  if gate.get('durable_persistence') is not False:
                      raise SystemExit(f'STEP5_10_PERSISTENCE_DRIFT_{game_id}_{market}')
                  checks += 1
                  if market in {'Run Line', 'Total'}:
                      line_bearing += 1

          expected = len(games) * 6
          if checks != expected or rollback_passthrough != expected:
              raise SystemExit('STEP5_10_COVERAGE_MISMATCH')
          if enrolled_checks != cohort['selected_game_count'] * 6:
              raise SystemExit('STEP5_10_ENROLLED_ATOMICITY_MISMATCH')
          if enrolled_allow + enrolled_block != enrolled_checks:
              raise SystemExit('STEP5_10_ENROLLED_POLICY_PARTITION_MISMATCH')
          if nonenrolled_passthrough + enrolled_checks != expected:
              raise SystemExit('STEP5_10_COHORT_PARTITION_MISMATCH')
          if line_bearing != len(games) * 4:
              raise SystemExit('STEP5_10_LINE_BEARING_COVERAGE_MISMATCH')

          evidence = {
              'certification_result': 'GREEN',
              'http_status': status,
              'production_game_count': len(games),
              'step5_2_attached_count': step52.get('attached_count'),
              'step5_3_derived_context_count': step53.get('derived_context_count'),
              'live_gate_observations_verified': checks,
              'rollback_passthrough_verified': rollback_passthrough,
              'canary_game_count': cohort['selected_game_count'],
              'canary_realized_percent': cohort['realized_percent'],
              'enrolled_gate_observations_verified': enrolled_checks,
              'enrolled_allow_count': enrolled_allow,
              'enrolled_block_count': enrolled_block,
              'nonenrolled_passthrough_verified': nonenrolled_passthrough,
              'line_bearing_checks_verified': line_bearing,
              'max_canary_percent': MAX_CANARY_PERCENT,
              'production_default_enabled': False,
              'production_default_percent': 0.0,
              'external_host_activation_verified': False,
              'step5_9_changed': False,
              'model_math_changed': False,
              'pick_strength_changed': False,
              'ranking_math_changed': False,
              'risk_logic_changed': False,
              'durable_persistence_added': False,
              'wagering_changed': False,
              'wnba_changed': False,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('MLB_STEP5_10_CANARY_ROLLOUT_CONTROLLER_GREEN')
          PY
