name: CFB O/U logo hotfix V2 diagnostics

on:
  push:
    branches: ['cfb-ou-logo-hotfix-v2']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect live ESPN alias resolution
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_over_under_logo_resolver_v1 as logos
          import cfb_schedule_v3 as schedule

          game = {
              "game_date": "2026-09-10",
              "away_team": "Florida A&M",
              "away_team_slug": "florida-a-m",
              "home_team": "Miami (FL)",
              "home_team_slug": "miami-fl",
              "identity_key": "ncaa:6604311",
              "espn_event_id": "",
          }

          payload, attempts = schedule.frozen._fetch_espn_fbs_payload("2026-09-10")
          print("attempts", json.dumps(attempts, indent=2))
          print("events", len(payload.get("events") or []))

          for event in payload.get("events") or []:
              sides = logos._event_sides(event)
              away = sides.get("away") or {}
              home = sides.get("home") or {}
              away_team = away.get("team") or {}
              home_team = home.get("team") or {}
              fields = {
                  "event_id": event.get("id"),
                  "away": {
                      k: away_team.get(k)
                      for k in ("id","location","displayName","shortDisplayName","name","abbreviation","slug")
                  },
                  "home": {
                      k: home_team.get(k)
                      for k in ("id","location","displayName","shortDisplayName","name","abbreviation","slug")
                  },
              }
              if "Florida" in json.dumps(fields) or "Miami" in json.dumps(fields):
                  print("candidate", json.dumps(fields, indent=2))
                  print("away aliases", sorted(logos._competitor_aliases(away)))
                  print("home aliases", sorted(logos._competitor_aliases(home)))
                  print("match", logos._event_matches_game(event, game))

          print("game away aliases", sorted(logos._game_aliases(game, "away")))
          print("game home aliases", sorted(logos._game_aliases(game, "home")))
          visuals = logos.resolve_visuals(game)
          print("resolved", json.dumps(visuals, indent=2))
          PY
