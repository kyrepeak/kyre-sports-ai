name: WNBA Step 13C reliability recovery certification

on:
  push:
    branches:
      - wnba-step13c-reliability-recovery-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
      WNBA_BOARD_SCHEDULER_ENABLED: "false"
      WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
      WNBA_STEP6J_CANARY_ENABLED: "false"
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
      WNBA_PERSISTENCE_ENABLED: "false"
      WNBA_SUPABASE_WRITE_ENABLED: "false"
      WNBA_WAGERING_ENABLED: "false"
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
      WNBA_STEP12_SCHEDULER_ENABLED: "false"
      WNBA_STEP9_FASTAPI_ENABLED: "true"
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

    steps:
      - name: Checkout Step 13C branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: Assert production persistence and legacy schedulers remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 13C reliability surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step13c_reliability_recovery.py
          python -m py_compile tests/test_wnba_step13c_reliability_recovery.py
          python -m py_compile sports_api/tools/wnba_step13c_reliability_recovery_cert.py

      - name: Run Step 13C reliability and recovery guards
        run: PYTHONPATH=. python tests/test_wnba_step13c_reliability_recovery.py

      - name: Run frozen Step 13B and Step 13A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step13b_runtime_supervisor.py
          PYTHONPATH=. python tests/test_wnba_step13a_bounded_scheduler.py

      - name: Run frozen Step 12D through Step 12A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 13B head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP13B_FROZEN_SHA='0a0e4381d0a4deac6bbd3741f893214e99afef7b'
          git merge-base --is-ancestor "$STEP13B_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP13B_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 13C files changed after frozen Step 13B
        shell: bash
        run: |
          set -euo pipefail
          STEP13B_FROZEN_SHA='0a0e4381d0a4deac6bbd3741f893214e99afef7b'
          git diff --name-only "$STEP13B_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step13c_reliability_recovery.py|\
              tests/test_wnba_step13c_reliability_recovery.py|\
              sports_api/tools/wnba_step13c_reliability_recovery_cert.py|\
              .github/workflows/wnba-step-13c-reliability-recovery-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step13B file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen lineage and Step 13C safety contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step13b_runtime_supervisor as s13b
          from sports_api import wnba_step13c_reliability_recovery as s13c
          assert s13c.STEP13B_FROZEN_SHA == '0a0e4381d0a4deac6bbd3741f893214e99afef7b'
          assert s13c.STEP13A_FROZEN_SHA == 'eaa744ae097a94d5f54c490ab13ca7d66bb725c2'
          assert s13c.STEP12D_FROZEN_SHA == '48517bac86ee3f55aa4c21d6caba06c41a0a7d60'
          assert s13b.STEP13A_FROZEN_SHA == s13c.STEP13A_FROZEN_SHA
          assert s13c.DEFAULT_ENABLED is False
          assert s13c.PRODUCTION_ACTIVATION_ALLOWED is False
          assert s13c.PERSISTENCE_ALLOWED is False
          assert s13c.SUPABASE_WRITE_ALLOWED is False
          assert s13c.PUBLIC_FASTAPI_ACTIVATION_ALLOWED is False
          assert s13c.WAGERING_ALLOWED is False
          assert s13c.AUTHENTICATION_ALLOWED is False
          assert s13c.COOKIES_ALLOWED is False
          assert s13c.BACKGROUND_DAEMON_ALLOWED is False
          assert s13c.BACKGROUND_THREAD_ALLOWED is False
          assert s13c.DURABLE_DISTRIBUTED_LEASE_ALLOWED is False
          assert s13c.FOREGROUND_RELIABILITY_MANAGER_ALLOWED is True
          assert s13c.PROCESS_LOCAL_ACTIVE_RUN_LEASE_ALLOWED is True
          assert s13c.step13c_reliability_recovery_enabled({}) is False
          print('STEP13C_FROZEN_LINEAGE_AND_SAFETY_OK')
          PY

      - name: Certify Step 13C reliability and recovery
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step13c_reliability_recovery_cert

      - name: Upload Step 13C certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step13c-reliability-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: step13c-reliability-recovery-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production persistence and legacy schedulers OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
