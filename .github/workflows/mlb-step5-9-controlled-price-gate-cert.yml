name: MLB Step5.9 controlled-price-gate certification

on:
  push:
    branches:
      - mlb-step5-9-controlled-price-gate
    paths:
      - "sports_api/mlb_controlled_price_gate_v1.py"
      - "mlb_daily_game_picks_controlled_price_gate_v1.py"
      - "mlb_daily_game_picks_v217_guard.py"
      - "tests/test_mlb_controlled_price_gate_v1.py"
      - ".github/workflows/mlb-step5-9-controlled-price-gate-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP5_9_BASE_SHA: e4e00099ce0ff029dc61c7486bf6f80a3c95cc42
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true

jobs:
  certify-controlled-price-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Assert additive MLB-only change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP5_9_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP5_9_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          allowed='^(sports_api/mlb_controlled_price_gate_v1.py|mlb_daily_game_picks_controlled_price_gate_v1.py|mlb_daily_game_picks_v217_guard.py|tests/test_mlb_controlled_price_gate_v1.py|\.github/workflows/mlb-step5-9-controlled-price-gate-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP5_9_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          echo 'MLB_STEP5_9_CHANGE_SCOPE_OK'

      - name: Prove Step5.8 and V2.1.7 selector implementation are frozen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP5_9_BASE_SHA"...HEAD -- \
            sports_api/mlb_actionability_shadow_v1.py \
            mlb_daily_game_picks_actionability_shadow_v1.py \
            mlb_daily_game_picks_v217.py
          echo 'MLB_STEP5_9_STEP5_8_AND_SELECTOR_FROZEN'

      - name: Prove V2.1.7 risk and lineup functions are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(
              ['git', 'show', f'{os.environ["STEP5_9_BASE_SHA"]}:mlb_daily_game_picks_v217_guard.py'],
              text=True,
          )
          head = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          protected = {
              '_safe_int', '_norm', '_lineup_members_bulk', '_official_snapshots_v217',
              '_player_lineup_guard', '_risk_context_v217_guard',
          }
          def dumps(source):
              tree = ast.parse(source)
              return {
                  node.name: ast.dump(node, include_attributes=False)
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in protected
              }
          if dumps(base) != dumps(head) or set(dumps(head)) != protected:
              raise SystemExit('STEP5_9_PROTECTED_V217_FUNCTION_DRIFT')
          print('MLB_STEP5_9_V217_RISK_FUNCTIONS_FROZEN')
          PY

      - name: Assert controlled activation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('sports_api/mlb_controlled_price_gate_v1.py').read_text(encoding='utf-8')
          presentation = Path('mlb_daily_game_picks_controlled_price_gate_v1.py').read_text(encoding='utf-8')
          guard = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          combined = core + '\n' + presentation + '\n' + guard

          forbidden_matchers = ('difflib', 'SequenceMatcher', 'fuzzywuzzy', 'rapidfuzz')
          if any(token in combined for token in forbidden_matchers):
              raise SystemExit('STEP5_9_HEURISTIC_MATCHER_PRESENT')

          forbidden_writes = (
              'c["probability"] =', "c['probability'] =",
              'c["score"] =', "c['score'] =",
              'c["projection"] =', "c['projection'] =",
              'candidate["probability"] =', "candidate['probability'] =",
              'candidate["score"] =', "candidate['score'] =",
              'candidate["projection"] =', "candidate['projection'] =",
          )
          if any(token in presentation or token in guard for token in forbidden_writes):
              raise SystemExit('STEP5_9_PRODUCTION_FIELD_WRITE_PRESENT')

          forbidden_persistence = (
              'sqlite3', 'psycopg', 'sqlalchemy', 'supabase',
              'INSERT INTO', 'UPDATE mlb_', 'DELETE FROM', 'requests.post(',
          )
          if any(token in combined for token in forbidden_persistence):
              raise SystemExit('STEP5_9_DURABLE_WRITE_PATH_PRESENT')

          required = (
              'MLB_STEP5_9_PRICE_GATE_ENABLED',
              'production_default_enabled',
              'CONTROL_DISABLED',
              'GATE_ALLOW',
              'GATE_BLOCK',
              'GATE_BLOCK_UNVERIFIED_PRICE_CONTEXT',
              'NOT_APPLICABLE_UNPRICED_MARKET',
              'final_card_price_eligible',
              'v217._select_risk_aware(eligible, risks)',
              'install_controlled_price_gate_layer(games_df)',
              'unpriced_player_props_passthrough',
              'ranking_math_impact',
              'Pick Strength',
          )
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit('STEP5_9_CONTRACT_TOKEN_MISSING: ' + ' | '.join(missing))

          if 'value = str(os.getenv(_ENV_KEY, "0") or "0")' not in presentation:
              raise SystemExit('STEP5_9_PRODUCTION_DEFAULT_NOT_OFF')
          if 'if not active:\n        selected = base_selected' not in presentation:
              raise SystemExit('STEP5_9_DISABLED_PASSTHROUGH_MISSING')
          if 'from mlb_daily_game_picks_controlled_price_gate_v1 import install_controlled_price_gate_layer' not in guard:
              raise SystemExit('STEP5_9_ACTIVE_GUARD_IMPORT_MISSING')

          print('MLB_STEP5_9_CONTROLLED_ACTIVATION_BOUNDARY_OK')
          PY

      - name: Prove frozen app ancestry still routes Daily Picks to active V2.1.7 guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          ancestor = subprocess.check_output(
              ['git', 'show', '6fb976a9e20c96eb68b71ad0d3511e3be1734292:app.py'],
              text=True,
          )
          required = (
              'old = "from mlb_daily_game_picks_v198 import render_daily_game_picks"',
              'new = "from mlb_daily_game_picks_v217_guard import render_daily_game_picks"',
          )
          missing = [token for token in required if token not in ancestor]
          if missing:
              raise SystemExit('STEP5_9_ACTIVE_ROUTE_ANCESTRY_DRIFT: ' + ' | '.join(missing))
          print('MLB_STEP5_9_ACTIVE_ROUTE_CONFIRMED')
          PY

      - name: Compile Step5.9 Python files
        run: |
          python -m py_compile \
            sports_api/mlb_controlled_price_gate_v1.py \
            mlb_daily_game_picks_controlled_price_gate_v1.py \
            mlb_daily_game_picks_v217_guard.py \
            tests/test_mlb_controlled_price_gate_v1.py

      - name: Run deterministic controlled-gate regression suite
        run: python -m pytest -q tests/test_mlb_controlled_price_gate_v1.py

      - name: Certify live controlled gate in OFF and ON modes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request

          from sports_api.mlb_live_market_context_v1 import attach_live_market_context
          from sports_api.mlb_market_probability_v1 import derive_market_probability_contexts
          from sports_api.mlb_model_market_edge_v1 import model_market_edge
          from sports_api.mlb_price_discipline_v1 import price_discipline_context
          from sports_api.mlb_market_movement_v1 import build_market_observation, compare_market_observations
          from sports_api.mlb_price_health_v1 import price_health_context
          from sports_api.mlb_actionability_shadow_v1 import actionability_shadow_context
          from sports_api.mlb_controlled_price_gate_v1 import controlled_price_gate

          payload = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      os.environ['PRODUCTION_ODDS_URL'],
                      headers={'Accept': 'application/json', 'User-Agent': 'KyreSportsStep5-9Cert/1.0'},
                      method='GET',
                  )
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = int(response.status)
                      payload = json.loads(response.read(2_000_000).decode('utf-8'))
                  break
              except Exception as exc:
                  last_error = exc
                  print(f'STEP5_9_PRODUCTION_FETCH_ATTEMPT_{attempt}_FAILED: {type(exc).__name__}: {exc}')
                  if attempt < 3:
                      time.sleep(4)
          if payload is None:
              raise SystemExit(f'STEP5_9_PRODUCTION_FETCH_FAILED: {last_error}')

          if status != 200 or payload.get('source') != 'FanDuel' or payload.get('schema_version') != 1:
              raise SystemExit('STEP5_9_BAD_PRODUCTION_PAYLOAD')
          if payload.get('data_type') != 'mlb_live_odds_api_response_v1':
              raise SystemExit('STEP5_9_BAD_PRODUCTION_DATA_TYPE')
          if payload.get('transport') != 'anonymous_public_get_only':
              raise SystemExit('STEP5_9_BAD_PRODUCTION_TRANSPORT')
          collected_at = payload.get('collected_at_utc')
          games = payload.get('games') or []
          if not collected_at or not games:
              raise SystemExit('STEP5_9_MISSING_CURRENT_MARKET_SNAPSHOT')

          model_rows = [{'game_pk': game.get('official_game_id')} for game in reversed(games)]
          step52 = attach_live_market_context(model_rows, games)
          step53 = derive_market_probability_contexts(step52)
          if step52.get('attached_count') != len(games) or step53.get('derived_context_count') != len(games):
              raise SystemExit('STEP5_9_EXACT_ID_CHAIN_COUNT_MISMATCH')
          if step53.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_9_FALLBACK_WAS_USED')

          checks = 0
          off_passthrough = 0
          on_allow = 0
          on_block = 0
          line_bearing = 0
          statuses = {}

          for game in games:
              game_id = int(game['official_game_id'])
              context = (step53.get('contexts_by_game_id') or {}).get(game_id)
              if not context:
                  raise SystemExit(f'STEP5_9_MISSING_CONTEXT_{game_id}')
              away = str(game.get('away_team') or f'AWAY_{game_id}')
              home = str(game.get('home_team') or f'HOME_{game_id}')
              scenarios = [
                  ('Moneyline', 'away', 'Away', context['moneyline']['away']),
                  ('Moneyline', 'home', 'Home', context['moneyline']['home']),
                  ('Run Line', 'away', 'Away', context['run_line']['away']),
                  ('Run Line', 'home', 'Home', context['run_line']['home']),
                  ('Total', 'over', 'Over ' + str(context['total'].get('line')), context['total']['over']),
                  ('Total', 'under', 'Under ' + str(context['total'].get('line')), context['total']['under']),
              ]
              for market, selected_side, side_text, side_block in scenarios:
                  no_vig = float(side_block['no_vig_probability'])
                  model_p = min(0.90, max(0.10, no_vig + 0.02))
                  candidate = {'game_pk': game_id, 'market': market, 'probability': model_p, 'side': side_text, 'name': None, 'team': None}
                  edge = model_market_edge(candidate, context, away_team=away, home_team=home)
                  price = price_discipline_context(edge)
                  observation = build_market_observation(price, collected_at_utc=collected_at)
                  movement = compare_market_observations(observation, as_of_utc=observation['collected_at_utc'])
                  health = price_health_context(movement)
                  shadow = actionability_shadow_context(health)
                  gate_off = controlled_price_gate(shadow, activation_requested=False)
                  gate_on = controlled_price_gate(shadow, activation_requested=True)

                  if gate_off['gate_status'] != 'CONTROL_DISABLED' or gate_off['final_card_price_eligible'] is not True:
                      raise SystemExit(f'STEP5_9_OFF_MODE_CHANGED_ELIGIBILITY_{game_id}_{market}_{selected_side}')
                  if gate_off['selection_eligibility_impact'] is not False:
                      raise SystemExit(f'STEP5_9_OFF_MODE_IMPACT_DRIFT_{game_id}_{market}_{selected_side}')
                  off_passthrough += 1

                  if shadow['shadow_status'].startswith('SHADOW_PLAYABLE'):
                      if gate_on['gate_status'] != 'GATE_ALLOW' or gate_on['final_card_price_eligible'] is not True:
                          raise SystemExit(f'STEP5_9_PLAYABLE_NOT_ALLOWED_{game_id}_{market}_{selected_side}')
                      on_allow += 1
                  else:
                      if gate_on['gate_status'] != 'GATE_BLOCK' or gate_on['final_card_price_eligible'] is not False:
                          raise SystemExit(f'STEP5_9_NONPLAYABLE_NOT_BLOCKED_{game_id}_{market}_{selected_side}')
                      on_block += 1

                  for flag in ('model_math_impact', 'pick_strength_impact', 'ranking_math_impact', 'risk_logic_impact', 'wagering_impact'):
                      if gate_on.get(flag) is not False:
                          raise SystemExit(f'STEP5_9_PROTECTED_IMPACT_DRIFT_{flag}_{game_id}_{market}_{selected_side}')
                  if gate_on.get('durable_persistence') is not False:
                      raise SystemExit(f'STEP5_9_PERSISTENCE_DRIFT_{game_id}_{market}_{selected_side}')
                  if not math.isclose(float(gate_on['model_probability']), model_p, rel_tol=0.0, abs_tol=1e-12):
                      raise SystemExit(f'STEP5_9_MODEL_PROBABILITY_DRIFT_{game_id}_{market}_{selected_side}')
                  if float(gate_on['current_market_odds']) != float(side_block['odds']):
                      raise SystemExit(f'STEP5_9_ODDS_DRIFT_{game_id}_{market}_{selected_side}')

                  statuses[gate_on['gate_status']] = statuses.get(gate_on['gate_status'], 0) + 1
                  checks += 1
                  if market in {'Run Line', 'Total'}:
                      line_bearing += 1

          expected = len(games) * 6
          if checks != expected or off_passthrough != expected or on_allow + on_block != expected:
              raise SystemExit('STEP5_9_COVERAGE_MISMATCH')
          if line_bearing != len(games) * 4:
              raise SystemExit('STEP5_9_LINE_BEARING_COVERAGE_MISMATCH')

          evidence = {
              'certification_result': 'GREEN',
              'http_status': status,
              'production_game_count': len(games),
              'step5_2_attached_count': step52.get('attached_count'),
              'step5_3_derived_context_count': step53.get('derived_context_count'),
              'step5_9_live_gate_observations_verified': checks,
              'off_mode_passthrough_verified': off_passthrough,
              'on_mode_allow_count': on_allow,
              'on_mode_block_count': on_block,
              'line_bearing_gate_checks_verified': line_bearing,
              'active_gate_status_counts': statuses,
              'production_default_enabled': False,
              'feature_flag': 'MLB_STEP5_9_PRICE_GATE_ENABLED',
              'step5_8_changed': False,
              'model_math_changed': False,
              'pick_strength_changed': False,
              'ranking_math_changed': False,
              'risk_logic_changed': False,
              'durable_persistence_added': False,
              'wagering_changed': False,
              'wnba_changed': False,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('MLB_STEP5_9_CONTROLLED_PRICE_GATE_GREEN')
          PY
