name: NFL Prop Analytics Rolling Schedule Snapshot V1

on:
  push:
    branches:
      - fix/nfl-prop-step2-certified-snapshot-v1
    paths:
      - ".github/workflows/nfl-prop-analytics-schedule-snapshot-v1.yml"
      - "scripts/build_nfl_prop_analytics_schedule_snapshot_v1.py"
      - "nfl_prop_analytics_schedule_v1.py"

permissions:
  contents: write

concurrency:
  group: nfl-prop-analytics-schedule-snapshot-v1
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nfl-prop-step2-certified-snapshot-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Build rolling certified snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/build_nfl_prop_analytics_schedule_snapshot_v1.py \
            --output data/nfl_prop_analytics_schedule_snapshot_v1.json \
            --weeks 15

      - name: Validate next-week coverage
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload=json.loads(
              Path("data/nfl_prop_analytics_schedule_snapshot_v1.json").read_text()
          )
          assert payload["version"] == 2
          slates=payload.get("slates") or []
          assert len(slates) >= 2, len(slates)

          az=ZoneInfo("America/Phoenix")
          today=datetime.now(az).date()
          current=today + timedelta(days=(6-today.weekday())%7)
          next_sunday=current+timedelta(days=7)
          by_date={row["target_date"]:row for row in slates}
          target=by_date.get(next_sunday.isoformat())
          assert target is not None, next_sunday
          assert int(target["game_count"]) > 0
          assert int(target["verified_count"]) == int(target["game_count"])
          assert len(target.get("sources_available") or []) >= 2

          for slate in slates:
              assert int(slate["game_count"]) > 0
              assert int(slate["verified_count"]) == int(slate["game_count"])
              for game in slate.get("games") or []:
                  assert game.get("verified") is True
                  assert game.get("kickoff_consensus") is True
                  assert int(game.get("source_count") or 0) >= 2

          print(
              "NFL_PROP_ANALYTICS_NEXT_WEEK_SNAPSHOT_GREEN",
              next_sunday.isoformat(),
              target["game_count"],
              target["sources_available"],
          )
          print("NFL_PROP_ANALYTICS_ROLLING_SNAPSHOT_GREEN", len(slates))
          PY

      - name: Publish generated snapshot to repair branch
        run: |
          if [ -z "$(git status --porcelain -- data/nfl_prop_analytics_schedule_snapshot_v1.json)" ]; then
            echo "NFL_PROP_ANALYTICS_SNAPSHOT_NO_CHANGE"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_prop_analytics_schedule_snapshot_v1.json
          git commit -m "Refresh NFL Prop Analytics rolling schedule snapshot"
          git push origin HEAD:fix/nfl-prop-step2-certified-snapshot-v1
          echo "NFL_PROP_ANALYTICS_SNAPSHOT_PUBLISHED"
