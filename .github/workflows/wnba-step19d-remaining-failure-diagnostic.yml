name: WNBA Step19D remaining failure diagnostic

on:
  push:
    branches:
      - wnba-step19d-remaining-failure-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .
  WEB_CONCURRENCY: '1'
  WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED: 'true'
  WNBA_STEP17B_ALWAYS_ON_ENABLED: 'true'
  WNBA_STEP14C_DURABLE_RESTART_LEASE_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_READ_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_WRITE_ENABLED: 'true'
  WNBA_STEP14A_PERSISTENCE_CONTRACT_ENABLED: 'true'
  WNBA_STEP13D_FINAL_SCHEDULER_FREEZE_ENABLED: 'true'
  WNBA_STEP13C_RELIABILITY_RECOVERY_ENABLED: 'true'
  WNBA_STEP13B_RUNTIME_SUPERVISOR_ENABLED: 'true'
  WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
  WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
  WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
  WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
  WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
  WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
  WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
  WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
  WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
  WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
  WNBA_STEP10_FASTAPI_ENABLED: 'true'
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
  WNBA_STEP9_FASTAPI_ENABLED: 'true'
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
  WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
  WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
  WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED: 'true'
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_STEP12_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_PERSISTENCE_ENABLED: 'false'
  WNBA_SUPABASE_WRITE_ENABLED: 'false'
  WNBA_WAGERING_ENABLED: 'false'
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: wnba-render-staging
    env:
      KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdde4a82b6cf6d0deb3e2b5d38b6dcf3d4cf1b2f
          fetch-depth: 1
      - name: Install runtime deps
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
      - name: Execute one read-only post-cooldown Step12B diagnostic
        run: |
          python - <<'PY'
          import json, os, traceback
          from datetime import datetime, timezone, timedelta
          import sports_api.main
          from sports_api import wnba_step14c_durable_restart_lease as s14c
          from sports_api import wnba_step12b_live_runtime_assembly as s12

          env=dict(os.environ)
          loaded=s14c.load_step14c_restart_checkpoint(slate_date='2026-08-29',env=env)
          state=loaded.get('controller_state_for_restart') if loaded.get('found') else None
          print('DIAG_CHECKPOINT',json.dumps({k:(state or {}).get(k) for k in ('circuit_state','consecutive_failure_count','last_failure_at_utc','next_refresh_due_at_utc','circuit_open_until_utc','policy')},sort_keys=True,default=str),flush=True)
          if not isinstance(state,dict): raise SystemExit('missing checkpoint')
          probe=datetime.now(timezone.utc)
          raw=state.get('circuit_open_until_utc')
          if raw:
              text=str(raw); text=text[:-1]+'+00:00' if text.endswith(('Z','z')) else text
              opened=datetime.fromisoformat(text).astimezone(timezone.utc)
              if opened>=probe: probe=opened+timedelta(seconds=1)
          policy=state.get('policy') or {}
          req=s12.build_step12b_request(season=2026,slate_date='2026-08-29',evaluated_at=probe,previous_state=state,controller_policy={'refresh_interval_seconds':int(policy.get('refresh_interval_seconds',60)),'failure_threshold':int(policy.get('failure_threshold',3)),'circuit_cooldown_seconds':int(policy.get('circuit_cooldown_seconds',180)),'provider_attempts':3},refresh_policy={},qualification_policy={})
          try:
              result=s12.run_step12b_live_runtime_job(req,env=env)
              tick=((result.get('step12a_result') or {}).get('step11e_tick') or {})
              execution=tick.get('execution') or {}; cb=tick.get('circuit_breaker') or {}; assembly=result.get('projection_assembly') or {}
              print('DIAG_RESULT',json.dumps({'status':result.get('status'),'health':result.get('health'),'cycle_outcome':execution.get('cycle_outcome'),'cycle_executed':execution.get('cycle_executed'),'error':execution.get('error'),'circuit':cb,'built':assembly.get('built_target_count'),'skipped':assembly.get('skipped_target_count'),'skipped_targets':assembly.get('skipped_targets')},sort_keys=True,default=str),flush=True)
          except Exception as exc:
              print('DIAG_TOP_EXCEPTION',type(exc).__name__,str(exc),flush=True)
              traceback.print_exc()
          print('STEP19D_REMAINING_FAILURE_DIAGNOSTIC_COMPLETE')
          PY
