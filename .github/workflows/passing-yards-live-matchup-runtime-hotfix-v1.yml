name: Passing Yards Live Matchup Runtime Hotfix

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-live-matchup-runtime-hotfix-v1.yml"
      - "devsystem/task_ledgers/passing-yards-live-matchup-runtime-hotfix-v1.json"
      - "nfl_passing_yards_defense_v1.py"
      - "tests/test_passing_yards_live_matchup_timezone_hotfix_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-live-matchup-runtime-hotfix-v1.yml"
      - "devsystem/task_ledgers/passing-yards-live-matchup-runtime-hotfix-v1.json"
      - "nfl_passing_yards_defense_v1.py"
      - "tests/test_passing_yards_live_matchup_timezone_hotfix_v1.py"

permissions:
  contents: read

jobs:
  timezone-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact hotfix scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-live-matchup-runtime-hotfix-v1.yml
          devsystem/task_ledgers/passing-yards-live-matchup-runtime-hotfix-v1.json
          nfl_passing_yards_defense_v1.py
          tests/test_passing_yards_live_matchup_timezone_hotfix_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_LIVE_MATCHUP_SCOPE_GREEN"

      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check -q pytest pandas requests streamlit

      - name: Compile hotfix
        run: python -m py_compile nfl_passing_yards_defense_v1.py tests/test_passing_yards_live_matchup_timezone_hotfix_v1.py

      - name: Run UTC regression contract
        run: python -m pytest -q tests/test_passing_yards_live_matchup_timezone_hotfix_v1.py

      - name: Verify frozen drill-down boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" --             nfl_passing_yards_hub_v58.py             nfl_passing_yards_hub_v59.py             nfl_passing_yards_hub_v60.py             nfl_passing_yards_hub_v61.py             streamlit_memory_lazy_router_v209.py             streamlit_memory_lazy_router_v210.py             streamlit_memory_lazy_router_v211.py             streamlit_memory_lazy_router_v212.py             app.py
          echo "PASSING_YARDS_LIVE_MATCHUP_FROZEN_BOUNDARY_GREEN"

  branch-live-matchup-proof:
    if: github.event_name == 'pull_request'
    needs: timezone-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Restore browser stack
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-py-live-hotfix
            ~/.cache/ms-playwright
          key: passing-yards-live-hotfix-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt') }}

      - name: Build browser stack
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-py-live-hotfix
          .venv-py-live-hotfix/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-py-live-hotfix/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-py-live-hotfix/bin/python -m playwright install chromium

      - name: Activate browser stack
        run: echo "$GITHUB_WORKSPACE/.venv-py-live-hotfix/bin" >> "$GITHUB_PATH"

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-live-hotfix
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-live-hotfix/streamlit.log 2>&1 &
          echo $! > /tmp/passing_yards_live_hotfix_pid

      - name: Prove exact 2026-09-24 matchup path
        run: |
          python - <<'PY'
          import json
          import time
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health

          base="http://127.0.0.1:8501"
          route=base+"/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          target_matchup="Atlanta Falcons @ Green Bay Packers"
          _wait_for_health(base)

          evidence={
              "DATE_CONTROL_FOUND":False,
              "DATE_SET_TO_2026_09_24":False,
              "MATCHUP_CONTROL_FOUND":False,
              "MATCHUP_CONTROL_TESTID":"",
              "MATCHUP_CONTROL_LABEL":"",
              "MATCHUP_CONTROL_TYPE":"",
              "CURRENT_SELECTED_VALUE":"",
              "ATLANTA_OPTION_PRESENT":False,
              "MATCHUP_SELECTED_ATLANTA_FALCONS_AT_GREEN_BAY_PACKERS":False,
              "TYPEERROR_AFTER_MATCHUP_SELECTION":False,
              "V60_HEADER":False,
              "V58_PICKER":False,
              "QB_CARDS":0,
              "MICHAEL_PENIX_JR":False,
              "JORDAN_LOVE":False,
              "QB1_DETAIL":False,
              "BACK_RETURNS_PICKER":False,
              "FIRST_BROKEN_ARROW":"",
              "FAILED_LAYER":"",
          }

          def all_body(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2500))
                  except Exception: pass
              return "\n".join(out)

          def fail_if_runtime_error(page,where):
              body=all_body(page)
              if "TypeError" in body or "Traceback" in body:
                  evidence["TYPEERROR_AFTER_MATCHUP_SELECTION"]=True
                  evidence["FIRST_BROKEN_ARROW"]=where+" -> runtime"
                  evidence["FAILED_LAYER"]="RUNTIME"
                  print("PASSING_YARDS_LIVE_MATCHUP_TRACEBACK")
                  print(body[:50000])
                  raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_TYPEERROR")
              return body

          def find_date_control(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  fail_if_runtime_error(page,"date control")
                  for frame in page.frames:
                      try:
                          if frame.locator('section[data-passing-yards-step3-header="v60"]').count()!=1:
                              continue
                          for i in range(frame.locator('[data-testid="stDateInput"]').count()):
                              root=frame.locator('[data-testid="stDateInput"]').nth(i)
                              text=(root.inner_text() or "").replace("\n"," ").strip()
                              if "Slate date" not in text:
                                  continue
                              date_parts={}
                              for part in ("month","day","year"):
                                  loc=root.get_by_role("spinbutton",name=f"{part}, Slate date")
                                  if loc.count():
                                      date_parts[part]=loc.first
                              if "day" in date_parts:
                                  print("PASSING_YARDS_LIVE_MATCHUP_DATE_CONTROL_DOM")
                                  print(json.dumps({"testid":root.get_attribute("data-testid") or "","text":text},indent=2))
                                  return frame,root,date_parts
                      except Exception:
                          pass
                  page.wait_for_timeout(300)
              evidence["FIRST_BROKEN_ARROW"]="V60 header -> Slate date control"
              evidence["FAILED_LAYER"]="VERIFIER_DATE_CONTROL_DISCOVERY"
              raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_DATE_CONTROL_NOT_READY")

          def find_matchup_control(page,timeout=120):
              deadline=time.monotonic()+timeout
              last=[]
              while time.monotonic()<deadline:
                  fail_if_runtime_error(page,"matchup control after date rerun")
                  for frame in page.frames:
                      try:
                          if frame.locator('section[data-passing-yards-step3-header="v60"]').count()!=1:
                              continue
                          inventory=[]
                          for i in range(frame.locator('[data-testid="stSelectbox"]').count()):
                              root=frame.locator('[data-testid="stSelectbox"]').nth(i)
                              text=(root.inner_text() or "").replace("\n"," ").strip()
                              inventory.append({"index":i,"text":text[:500]})
                              if "Matchup •" not in text:
                                  continue
                              combo=root.get_by_role("combobox")
                              if combo.count()==1:
                                  meta={
                                      "testid":root.get_attribute("data-testid") or "",
                                      "label":text[:500],
                                      "type":"selectbox/combobox",
                                  }
                                  print("PASSING_YARDS_LIVE_MATCHUP_MATCHUP_CONTROL_DISCOVERED")
                                  print(json.dumps(meta,indent=2))
                                  return frame,root,combo.first,meta
                          last=inventory
                      except Exception:
                          pass
                  page.wait_for_timeout(300)
              print("PASSING_YARDS_LIVE_MATCHUP_POST_DATE_SELECTBOX_INVENTORY")
              print(json.dumps(last,indent=2))
              evidence["FIRST_BROKEN_ARROW"]="date 2026-09-24 -> V46 Matchup control"
              evidence["FAILED_LAYER"]="VERIFIER_MATCHUP_CONTROL_DISCOVERY"
              raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_MATCHUP_CONTROL_NOT_READY")

          def find_landing(page,timeout=180):
              deadline=time.monotonic()+timeout
              last_snapshot={
                  "POST_SELECTION_FRAME_COUNT":0,
                  "V60_HEADER_MAX_COUNT":0,
                  "V58_PICKER_MAX_COUNT":0,
                  "QB_CARD_MAX_COUNT":0,
                  "QB1_LINK_MAX_COUNT":0,
                  "QB2_LINK_MAX_COUNT":0,
                  "PENIX_SEEN":False,
                  "LOVE_SEEN":False,
                  "PLACEHOLDER_REACHED":False,
                  "LAST_RENDERED_STATE":"",
                  "FRAME_STATES":[],
              }
              while time.monotonic()<deadline:
                  fail_if_runtime_error(page,"selected matchup -> post-selection landing")
                  frame_states=[]
                  v60_max=v58_max=cards_max=qb1_max=qb2_max=0
                  penix_seen=love_seen=placeholder_seen=False
                  last_rendered_state=""
                  for frame in page.frames:
                      try:
                          body=(frame.locator("body").inner_text(timeout=1500) or "").strip()
                          v60=frame.locator('section[data-passing-yards-step3-header="v60"]').count()
                          v58=frame.locator('[data-passing-yards-selection-screen="v58"]').count()
                          cards=frame.locator('[data-qb-selection-card]').count()
                          qb1=frame.locator('a[data-qb-select="1"]').count()
                          qb2=frame.locator('a[data-qb-select="2"]').count()
                          penix="Michael Penix Jr." in body
                          love="Jordan Love" in body
                          placeholder=(
                              "step1" in body.lower()
                              or "composition" in body.lower()
                              or frame.locator('[data-passing-yards-step1]').count()>0
                              or frame.locator('[data-composition-placeholder]').count()>0
                          )
                          state={
                              "FRAME_URL":frame.url,
                              "V60_HEADER_COUNT":v60,
                              "V58_PICKER_COUNT":v58,
                              "QB_CARD_COUNT":cards,
                              "QB1_LINK_COUNT":qb1,
                              "QB2_LINK_COUNT":qb2,
                              "MICHAEL_PENIX_PRESENT":penix,
                              "JORDAN_LOVE_PRESENT":love,
                              "STEP1_PLACEHOLDER_OR_COMPOSITION_MARKER_PRESENT":placeholder,
                              "BODY_TEXT":body[:1800],
                          }
                          frame_states.append(state)
                          v60_max=max(v60_max,v60)
                          v58_max=max(v58_max,v58)
                          cards_max=max(cards_max,cards)
                          qb1_max=max(qb1_max,qb1)
                          qb2_max=max(qb2_max,qb2)
                          penix_seen=penix_seen or penix
                          love_seen=love_seen or love
                          placeholder_seen=placeholder_seen or placeholder
                          if body:
                              last_rendered_state=body[:1800]
                          if v60==1 and v58==1 and cards==2:
                              print("PASSING_YARDS_LIVE_MATCHUP_POST_SELECTION_STATE")
                              print(json.dumps(state,indent=2))
                              return frame
                      except Exception:
                          pass
                  last_snapshot={
                      "POST_SELECTION_FRAME_COUNT":len(frame_states),
                      "V60_HEADER_MAX_COUNT":v60_max,
                      "V58_PICKER_MAX_COUNT":v58_max,
                      "QB_CARD_MAX_COUNT":cards_max,
                      "QB1_LINK_MAX_COUNT":qb1_max,
                      "QB2_LINK_MAX_COUNT":qb2_max,
                      "PENIX_SEEN":penix_seen,
                      "LOVE_SEEN":love_seen,
                      "PLACEHOLDER_REACHED":placeholder_seen,
                      "LAST_RENDERED_STATE":last_rendered_state,
                      "FRAME_STATES":frame_states,
                  }
                  page.wait_for_timeout(300)

              if last_snapshot["V60_HEADER_MAX_COUNT"]==1 and last_snapshot["V58_PICKER_MAX_COUNT"]==1 and last_snapshot["QB_CARD_MAX_COUNT"]==2:
                  first_missing="none; success state existed but verifier did not return it"
                  evidence["FAILED_LAYER"]="VERIFIER"
                  first_arrow="post-selection DOM -> verifier success detection"
                  token="PASSING_YARDS_LIVE_MATCHUP_VERIFIER_FRAME_OR_WAIT_MISS"
              elif last_snapshot["V60_HEADER_MAX_COUNT"]==1 and last_snapshot["V58_PICKER_MAX_COUNT"]==0:
                  first_missing="V58 picker"
                  evidence["FAILED_LAYER"]="VERIFIER_POST_SELECTION_RENDER"
                  first_arrow="V60/current page -> V58 composition seam"
                  token="PASSING_YARDS_LIVE_MATCHUP_V58_NOT_RENDERED"
              elif last_snapshot["V58_PICKER_MAX_COUNT"]==1 and last_snapshot["QB_CARD_MAX_COUNT"]!=2:
                  first_missing="2 QB cards"
                  evidence["FAILED_LAYER"]="QB_PAYLOAD_PICKER_CONTENT"
                  first_arrow="V58 picker -> 2 QB cards"
                  token="PASSING_YARDS_LIVE_MATCHUP_QB_CARDS_INCOMPLETE"
              elif last_snapshot["V60_HEADER_MAX_COUNT"]==0 and last_snapshot["V58_PICKER_MAX_COUNT"]==0:
                  first_missing="V60 and V58"
                  evidence["FAILED_LAYER"]="VERIFIER_POST_SELECTION_RENDER"
                  first_arrow="selected matchup -> actual rendered post-selection surface"
                  token="PASSING_YARDS_LIVE_MATCHUP_POST_SELECTION_SURFACE_UNKNOWN"
              else:
                  first_missing="frame-coherent V60+V58+2QB state"
                  evidence["FAILED_LAYER"]="VERIFIER_FRAME_SCOPE"
                  first_arrow="post-selection states -> same-frame verifier scope"
                  token="PASSING_YARDS_LIVE_MATCHUP_FRAME_SCOPE_MISMATCH"

              evidence["FIRST_BROKEN_ARROW"]=first_arrow
              print("PASSING_YARDS_LIVE_MATCHUP_POST_SELECTION_TIMEOUT_REPORT")
              print(json.dumps({
                  **last_snapshot,
                  "FIRST_ACTUALLY_MISSING_STATE":first_missing,
                  "FIRST_BROKEN_ARROW":first_arrow,
                  "FAILED_LAYER":evidence["FAILED_LAYER"],
                  "FAILURE_TOKEN":token,
              },indent=2))
              raise RuntimeError(token)

          def find_detail(page,timeout=120):
              selector='[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="1"]'
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  fail_if_runtime_error(page,"QB1 click -> V59 detail")
                  for frame in page.frames:
                      try:
                          if frame.locator(selector).count()==1: return frame
                      except Exception: pass
                  page.wait_for_timeout(300)
              evidence["FIRST_BROKEN_ARROW"]="QB1 click -> V59 detail"
              evidence["FAILED_LAYER"]="VERIFIER_DETAIL_NAVIGATION"
              raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_DETAIL_NOT_READY")

          def click_anchor(page,locator):
              if locator.get_attribute("target")=="_blank":
                  with page.expect_popup(timeout=15000) as popup:
                      locator.click()
                  nxt=popup.value
                  nxt.wait_for_load_state("domcontentloaded",timeout=120000)
                  return nxt
              locator.click()
              return page

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route,wait_until="domcontentloaded",timeout=120000)
                  frame,date_root,date_parts=find_date_control(page)
                  evidence["DATE_CONTROL_FOUND"]=True

                  if "month" in date_parts: date_parts["month"].fill("9")
                  date_parts["day"].fill("24")
                  if "year" in date_parts: date_parts["year"].fill("2026")
                  date_parts["day"].press("Tab")
                  page.wait_for_timeout(1500)

                  frame,date_root,date_parts=find_date_control(page,timeout=120)
                  rendered_date=(date_root.inner_text() or "").replace("\n"," ").strip()
                  evidence["DATE_SET_TO_2026_09_24"]=(
                      "2026 / 09 / 24" in rendered_date
                      or "2026/09/24" in rendered_date
                      or "09 / 24 / 2026" in rendered_date
                      or "09/24/2026" in rendered_date
                  )
                  print("PASSING_YARDS_LIVE_MATCHUP_DATE_STATE")
                  print(json.dumps({"rendered":rendered_date},indent=2))
                  if not evidence["DATE_SET_TO_2026_09_24"]:
                      evidence["FIRST_BROKEN_ARROW"]="date action -> rendered selected date"
                      evidence["FAILED_LAYER"]="VERIFIER_DATE_SELECTION"
                      raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_DATE_NOT_SET")

                  frame,matchup_root,matchup,matchup_meta=find_matchup_control(page,timeout=120)
                  evidence["MATCHUP_CONTROL_FOUND"]=True
                  evidence["MATCHUP_CONTROL_TESTID"]=matchup_meta.get("testid","")
                  evidence["MATCHUP_CONTROL_LABEL"]=matchup_meta.get("label","")
                  evidence["MATCHUP_CONTROL_TYPE"]=matchup_meta.get("type","")
                  def matchup_value(root,combo):
                      values=[]
                      try:
                          value=combo.input_value(timeout=1000)
                          if value: values.append(value)
                      except Exception:
                          pass
                      try:
                          value=combo.get_attribute("value")
                          if value: values.append(value)
                      except Exception:
                          pass
                      try:
                          text=(root.inner_text() or "").replace("\n"," ").strip()
                          if text: values.append(text)
                      except Exception:
                          pass
                      return " ".join(values)

                  evidence["CURRENT_SELECTED_VALUE"]=matchup_value(matchup_root,matchup)
                  already_selected=target_matchup in evidence["CURRENT_SELECTED_VALUE"]
                  if already_selected:
                      evidence["ATLANTA_OPTION_PRESENT"]=True
                      evidence["MATCHUP_SELECTED_ATLANTA_FALCONS_AT_GREEN_BAY_PACKERS"]=True
                      print("PASSING_YARDS_LIVE_MATCHUP_ALREADY_SELECTED")
                      print(evidence["CURRENT_SELECTED_VALUE"])
                  else:
                      matchup.click()
                      page.wait_for_timeout(250)
                      try:
                          matchup.press("ArrowDown")
                      except Exception:
                          pass
                      page.wait_for_timeout(300)

                      options=[]
                      target_option=None
                      for option_frame in page.frames:
                          try:
                              frame_options=[x.strip() for x in option_frame.get_by_role("option").all_inner_texts() if x.strip()]
                              options.extend(x for x in frame_options if x not in options)
                              candidate=option_frame.get_by_role("option").filter(has_text=target_matchup)
                              if target_option is None and candidate.count():
                                  target_option=candidate.first
                          except Exception:
                              pass

                      evidence["ATLANTA_OPTION_PRESENT"]=any(target_matchup in x for x in options)
                      print("PASSING_YARDS_LIVE_MATCHUP_MATCHUP_CONTROL_DOM")
                      print(json.dumps({
                          "testid":evidence["MATCHUP_CONTROL_TESTID"],
                          "label":evidence["MATCHUP_CONTROL_LABEL"],
                          "type":evidence["MATCHUP_CONTROL_TYPE"],
                          "current_selected_value":evidence["CURRENT_SELECTED_VALUE"],
                          "atlanta_option_present":evidence["ATLANTA_OPTION_PRESENT"],
                          "options":options
                      },indent=2))

                      if target_option is not None:
                          target_option.click()
                      else:
                          try:
                              matchup.press("Enter")
                          except Exception:
                              matchup.click()
                              matchup.press("ArrowDown")
                              matchup.press("Enter")
                      page.wait_for_timeout(1200)

                      frame,matchup_root,matchup,matchup_meta=find_matchup_control(page,timeout=120)
                      selected=matchup_value(matchup_root,matchup)
                      evidence["MATCHUP_SELECTED_ATLANTA_FALCONS_AT_GREEN_BAY_PACKERS"]=target_matchup in selected
                      evidence["ATLANTA_OPTION_PRESENT"]=evidence["ATLANTA_OPTION_PRESENT"] or evidence["MATCHUP_SELECTED_ATLANTA_FALCONS_AT_GREEN_BAY_PACKERS"]
                      print("PASSING_YARDS_LIVE_MATCHUP_SELECTED_VALUE")
                      print(selected)
                      if not evidence["MATCHUP_SELECTED_ATLANTA_FALCONS_AT_GREEN_BAY_PACKERS"]:
                          evidence["FIRST_BROKEN_ARROW"]="matchup click -> selected matchup"
                          evidence["FAILED_LAYER"]="VERIFIER_MATCHUP_SELECTION"
                          raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_NOT_SELECTED")

                  fail_if_runtime_error(page,"matchup selection -> runtime")
                  landing=find_landing(page)
                  evidence["V60_HEADER"]=landing.locator('section[data-passing-yards-step3-header="v60"]').count()==1
                  evidence["V58_PICKER"]=landing.locator('[data-passing-yards-selection-screen="v58"]').count()==1
                  evidence["QB_CARDS"]=landing.locator('[data-qb-selection-card]').count()
                  txt=landing.locator("body").inner_text(timeout=5000)
                  evidence["MICHAEL_PENIX_JR"]="Michael Penix Jr." in txt
                  evidence["JORDAN_LOVE"]="Jordan Love" in txt

                  if not (evidence["V60_HEADER"] and evidence["V58_PICKER"] and evidence["QB_CARDS"]==2 and evidence["MICHAEL_PENIX_JR"] and evidence["JORDAN_LOVE"]):
                      evidence["FIRST_BROKEN_ARROW"]="selected matchup -> expected QB picker contents"
                      evidence["FAILED_LAYER"]="VERIFIER_PICKER_CONTENT"
                      raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_PICKER_CONTENT_INCOMPLETE")

                  detail_page=click_anchor(page,landing.locator('a[data-qb-select="1"]').first)
                  detail=find_detail(detail_page)
                  evidence["QB1_DETAIL"]=detail.locator(".ks-py59-player").count()==1
                  if not evidence["QB1_DETAIL"]: raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_QB1_DETAIL_MISSING")

                  returned_page=click_anchor(detail_page,detail.locator('a[data-qb-back="true"]').first)
                  returned=find_landing(returned_page,timeout=120)
                  evidence["BACK_RETURNS_PICKER"]=returned.locator('[data-qb-selection-card]').count()==2
                  if not evidence["BACK_RETURNS_PICKER"]: raise RuntimeError("PASSING_YARDS_LIVE_MATCHUP_BACK_FAILED")

                  print("PASSING_YARDS_LIVE_MATCHUP_BRANCH_GREEN")
              except Exception:
                  if not evidence["FIRST_BROKEN_ARROW"]:
                      evidence["FIRST_BROKEN_ARROW"]="unclassified verifier transition"
                      evidence["FAILED_LAYER"]="VERIFIER"
                  raise
              finally:
                  print("PASSING_YARDS_LIVE_MATCHUP_BRANCH_EVIDENCE")
                  print(json.dumps(evidence,indent=2))
                  browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/passing-yards-live-hotfix/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/passing_yards_live_hotfix_pid ]; then
            kill "$(cat /tmp/passing_yards_live_hotfix_pid)" 2>/dev/null || true
          fi

  public-live-matchup-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: timezone-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Allow Streamlit deployment to publish
        run: sleep 90

      - name: Prove public 2026-09-24 matchup once
        run: |
          python - <<'PY'
          import json
          import time
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          route=base+"/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          target_matchup="Atlanta Falcons @ Green Bay Packers"

          def all_body(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2500))
                  except Exception: pass
              return "\n".join(out)

          def find_date_control(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=all_body(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("PUBLIC_LIVE_MATCHUP_TYPEERROR")
                  for frame in page.frames:
                      try:
                          if frame.locator('section[data-passing-yards-step3-header="v60"]').count()!=1: continue
                          for i in range(frame.locator('[data-testid="stDateInput"]').count()):
                              root=frame.locator('[data-testid="stDateInput"]').nth(i)
                              if "Slate date" not in ((root.inner_text() or "").replace("\n"," ").strip()): continue
                              date={}
                              for part in ("month","day","year"):
                                  loc=root.get_by_role("spinbutton",name=f"{part}, Slate date")
                                  if loc.count(): date[part]=loc.first
                              if "day" in date: return frame,date
                      except Exception: pass
                  page.wait_for_timeout(500)
              raise RuntimeError("PUBLIC_LIVE_MATCHUP_DATE_CONTROL_NOT_READY")

          def find_matchup_control(page,timeout=120):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=all_body(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("PUBLIC_LIVE_MATCHUP_TYPEERROR")
                  for frame in page.frames:
                      try:
                          if frame.locator('section[data-passing-yards-step3-header="v60"]').count()!=1: continue
                          for i in range(frame.locator('[data-testid="stSelectbox"]').count()):
                              root=frame.locator('[data-testid="stSelectbox"]').nth(i)
                              if "Matchup •" not in ((root.inner_text() or "").replace("\n"," ").strip()): continue
                              combo=root.get_by_role("combobox")
                              if combo.count()==1: return frame,root,combo.first
                      except Exception: pass
                  page.wait_for_timeout(500)
              raise RuntimeError("PUBLIC_LIVE_MATCHUP_MATCHUP_CONTROL_NOT_READY")

          def find_picker(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=all_body(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("PUBLIC_LIVE_MATCHUP_TYPEERROR")
                  for frame in page.frames:
                      try:
                          if frame.locator('[data-passing-yards-selection-screen="v58"]').count()==1 and frame.locator('[data-qb-selection-card]').count()==2:
                              return frame
                      except Exception: pass
                  page.wait_for_timeout(500)
              raise RuntimeError("PUBLIC_LIVE_MATCHUP_PICKER_NOT_READY")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1024,"height":1366})
              try:
                  page.goto(route,wait_until="domcontentloaded",timeout=120000)
                  frame,date=find_date_control(page)
                  if "month" in date: date["month"].fill("9")
                  date["day"].fill("24")
                  if "year" in date: date["year"].fill("2026")
                  date["day"].press("Tab")
                  page.wait_for_timeout(1500)

                  frame,date=find_date_control(page,timeout=120)
                  date_root=frame.locator('[data-testid="stDateInput"]').filter(has_text="Slate date").first
                  rendered_date=(date_root.inner_text() or "").replace("\n"," ").strip()
                  assert (
                      "2026 / 09 / 24" in rendered_date
                      or "2026/09/24" in rendered_date
                      or "09 / 24 / 2026" in rendered_date
                      or "09/24/2026" in rendered_date
                  )

                  def matchup_value(root,combo):
                      values=[]
                      try:
                          value=combo.input_value(timeout=1000)
                          if value: values.append(value)
                      except Exception:
                          pass
                      try:
                          value=combo.get_attribute("value")
                          if value: values.append(value)
                      except Exception:
                          pass
                      try:
                          text=(root.inner_text() or "").replace("\n"," ").strip()
                          if text: values.append(text)
                      except Exception:
                          pass
                      return " ".join(values)

                  frame,matchup_root,combo=find_matchup_control(page,timeout=120)
                  combo.click(); page.wait_for_timeout(250)
                  try:
                      combo.press("ArrowDown")
                  except Exception:
                      pass
                  page.wait_for_timeout(300)

                  target_option=None
                  for option_frame in page.frames:
                      try:
                          candidate=option_frame.get_by_role("option").filter(has_text=target_matchup)
                          if target_option is None and candidate.count():
                              target_option=candidate.first
                      except Exception:
                          pass

                  if target_option is not None:
                      target_option.click()
                  else:
                      try:
                          combo.press("Enter")
                      except Exception:
                          combo.click()
                          combo.press("ArrowDown")
                          combo.press("Enter")
                  page.wait_for_timeout(1200)

                  frame,matchup_root,combo=find_matchup_control(page,timeout=120)
                  assert target_matchup in matchup_value(matchup_root,combo)
                  picker=find_picker(page)
                  body=all_body(page)
                  assert "TypeError" not in body and "Traceback" not in body
                  txt=picker.locator("body").inner_text(timeout=5000)
                  assert picker.locator('[data-passing-yards-selection-screen="v58"]').count()==1
                  assert picker.locator('[data-qb-selection-card]').count()==2
                  assert "Michael Penix Jr." in txt
                  assert "Jordan Love" in txt
                  print("PASSING_YARDS_LIVE_MATCHUP_RUNTIME_PUBLIC_GREEN")
                  print(json.dumps({"date":"2026-09-24","matchup":target_matchup,"typeerror":False,"v58_picker":True,"qb_cards":2,"michael_penix_jr":True,"jordan_love":True},indent=2))
              finally:
                  browser.close()
          PY

