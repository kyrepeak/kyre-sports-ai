name: MONSTER V8 Step 3 Cross-Workstream Intent Arbiter

on:
  push:
    branches:
      - "monster/monster-v8-step3-cross-workstream-intent-arbiter-v1"
    paths:
      - "devsystem/cross_workstream_intent_arbiter_v1.py"
      - "tests/test_devsystem_cross_workstream_intent_arbiter_v1.py"
      - "devsystem/task_ledgers/monster-v8-step3-cross-workstream-intent-arbiter-v1.json"
      - ".github/workflows/monster-v8-step3-cross-workstream-intent-arbiter.yml"
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/cross_workstream_intent_arbiter_v1.py"
      - "tests/test_devsystem_cross_workstream_intent_arbiter_v1.py"
      - "devsystem/task_ledgers/monster-v8-step3-cross-workstream-intent-arbiter-v1.json"
      - ".github/workflows/monster-v8-step3-cross-workstream-intent-arbiter.yml"

permissions:
  contents: read

concurrency:
  group: monster-v8-step3-intent-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: cross-workstream intent arbiter focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen V8 Step 2 dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/transactional_rollback_engine_v1.py)" = "609e5b9b3f416cff47d5867b57a63782ea0e18b8"

      - name: Verify frozen V8 Step 1 dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/pre_mutation_blast_radius_simulator_v1.py)" = "75812e61e7b6dc4a12ee3e860f7cfd670e95dad6"

      - name: Verify frozen V7 sharding dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/shared_resource_lease_sharding_v1.py)" = "0e104b166bac9425ab2b84e253446b3faae5c0af"

      - name: Verify frozen V5 scope-lease dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/scope_aware_execution_lease_v1.py)" = "71383fa4ca36b0b4d80a6c87617912df6d52e4cf"

      - name: Verify frozen V5 detached-continuation dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/detached_execution_continuation_v1.py)" = "4c6d1b4b10f65e344491dbb2e78c62e4444db927"

      - name: Run intent-arbiter contract
        run: python devsystem/cross_workstream_intent_arbiter_v1.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_cross_workstream_intent_arbiter_v1.py

      - name: Emit V8 Step 3 GREEN marker
        run: echo "MONSTER_V8_STEP3_CROSS_WORKSTREAM_INTENT_ARBITER_GREEN"
