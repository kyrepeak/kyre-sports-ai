name: API2 NFL Moneyline Page2 War Room V1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sports_api/api/nfl_moneyline_page2_v1.py'
      - 'sports_api/nfl_moneyline_page2_v1.py'
      - 'nfl_moneyline_page2_war_room_v1.py'
      - 'nfl_moneyline_hub_v20.py'
      - 'universal_runtime_v5_loader_v21.py'
      - 'tests/test_api2_nfl_moneyline_page2_war_room_v1.py'
      - 'tests/test_nfl_moneyline_consumer_cleanup_v19.py'
      - '.github/workflows/api2-nfl-moneyline-page2-war-room-v1.yml'
      - 'devsystem/runless_proof_plans/api2-nfl-moneyline-page2-war-room-v1.json'
      - 'devsystem/task_ledgers/api2-nfl-moneyline-page2-war-room-v1.json'

permissions:
  contents: read

jobs:
  war-room-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas requests streamlit numpy
      - name: Compile Page 2 ownership chain
        run: python -m py_compile sports_api/api/nfl_moneyline_page2_v1.py sports_api/nfl_moneyline_page2_v1.py nfl_moneyline_page2_war_room_v1.py nfl_moneyline_hub_v20.py universal_runtime_v5_loader_v21.py
      - name: Page 2 and Moneyline regressions
        run: |
          python -m pytest --noconftest -q \
            tests/test_api2_nfl_moneyline_page2_war_room_v1.py \
            tests/test_nfl_moneyline_consumer_cleanup_v19.py \
            tests/test_nfl_moneyline_v10_kyre_api_v1.py \
            tests/test_nfl_moneyline_v11_no_flash_v1.py \
            tests/test_nfl_moneyline_v12_performance_fast_route_v1.py \
            tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py \
            -k 'not test_app_activates_v129_and_preserves_v128_descendant_anchor and not test_app_activates_v130_and_preserves_v129_descendant_anchor'
