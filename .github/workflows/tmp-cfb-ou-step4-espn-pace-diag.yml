name: TEMP pace ESPN diagnostic

on:
  push:
    branches: ['cfb-ou-upgrade-step4-pace']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe ESPN schedule and drives
        run: |
          python - <<'PY'
          import json, urllib.request

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          for team_id in ("2390","50"):
              url=f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/{team_id}/schedule?season=2026"
              data=get(url)
              print("TEAM",team_id,"KEYS",list(data)[:30])
              events=data.get("events") or []
              print("EVENT COUNT",len(events))
              for e in events[:5]:
                  status=((e.get("competitions") or [{}])[0].get("status") or {}).get("type") or {}
                  print("EVENT",e.get("id"),e.get("date"),status.get("state"),status.get("completed"),e.get("name"))
              completed=[]
              for e in events:
                  comp=(e.get("competitions") or [{}])[0]
                  status=(comp.get("status") or {}).get("type") or {}
                  if status.get("completed") or str(status.get("state") or "").lower()=="post":
                      completed.append(e)
              if completed:
                  eid=str(completed[-1].get("id"))
                  summary=get(f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event={eid}")
                  print("SUMMARY",eid,"KEYS",list(summary)[:40])
                  drives=summary.get("drives")
                  print("DRIVES TYPE",type(drives).__name__)
                  if isinstance(drives,dict):
                      print("DRIVE KEYS",list(drives))
                      for k,v in drives.items():
                          if isinstance(v,list):
                              print("DRIVE LIST",k,len(v))
                              for d in v[:3]:
                                  print("DRIVE SAMPLE",json.dumps(d,default=str)[:1500])
                                  break
                  print("BOX TEAMS",json.dumps(summary.get("boxscore"),default=str)[:3000])
          PY
