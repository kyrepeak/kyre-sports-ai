name: CFB Game Total V151 Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - streamlit_memory_lazy_router_v151.py
      - cfb_game_total_monster_page_v2.py
      - tests/test_cfb_game_total_v151_recovery.py
      - .github/workflows/cfb-game-total-v151-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert additive scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/cfb-game-total-v151-recovery.yml',
              'app.py',
              'cfb_game_total_monster_page_v2.py',
              'streamlit_memory_lazy_router_v151.py',
              'tests/test_cfb_game_total_v151_recovery.py',
          }
          subprocess.run(['git', 'fetch', 'origin', 'main', '--depth=1'], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'V151 scope mismatch: {sorted(changed)}')
          print('V151_ADDITIVE_SCOPE=PASS')
          PY

      - name: Compile V151 recovery files
        run: |
          python -m py_compile app.py streamlit_memory_lazy_router_v151.py cfb_game_total_monster_page_v2.py tests/test_cfb_game_total_v151_recovery.py

      - name: Run V151 recovery and inherited V150 tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_game_total_v151_recovery.py \
            tests/test_cfb_game_total_dashboard_v150.py

      - name: Guard frozen model influence
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_game_total_monster_page_v2 as page
          import streamlit_memory_lazy_router_v151 as router
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert router.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert page.MAY_MODIFY_PROJECTION is False
          assert router.MAY_MODIFY_PROJECTION is False
          print('V151_FROZEN_MATH_GUARD=PASS')
          PY

      - name: Assert live entrypoint is actually V151
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'from streamlit_memory_lazy_router_v151 import record_bootstrap_import_ms, render_app' in text
          assert 'STREAMLIT_MAIN_V151_CFB_GAME_TOTAL_LIVE_RECOVERY_2026-09-16' in text
          print('V151_LIVE_ENTRYPOINT=PASS')
          PY
