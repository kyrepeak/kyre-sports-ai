name: NFL Game Totals Multi-Source Router

on:
  push:
    branches:
      - monster/nfl-game-totals-multisource-spec
  pull_request:
    branches:
      - main
    paths:
      - sports_api/nfl_data_router_v1.py
      - sports_api/nfl_data_nflverse_v1.py
      - sports_api/nfl_data_nws_v1.py
      - sports_api/nfl_data_espn_fallback_v1.py
      - sports_api/nfl_stadium_coordinates_v1.py
      - sports_api/nfl_game_totals_scoring_context_v1.py
      - sports_api/nfl_game_totals_pace_context_v1.py
      - sports_api/nfl_game_totals_explosive_context_v1.py
      - sports_api/nfl_game_totals_red_zone_drive_context_v1.py
      - sports_api/nfl_game_totals_environment_context_v1.py
      - nfl_game_totals_hub_v8_1.py
      - tests/test_nfl_data_router_v1.py
      - tests/test_nfl_data_nflverse_v1.py
      - tests/test_nfl_data_nws_v1.py
      - tests/test_nfl_game_totals_multisource_step3_7.py
      - tests/test_nfl_game_totals_page_step3.py
      - tests/test_nfl_game_totals_page_step4.py
      - tests/test_nfl_game_totals_page_step5.py
      - tests/test_nfl_game_totals_page_step6.py
      - tests/test_nfl_game_totals_page_step7.py
      - tests/test_nfl_game_totals_page_step8.py
      - tests/test_nfl_game_totals_mobile_hotfix_v8_1.py
      - docs/superpowers/specs/2026-09-15-nfl-game-totals-multisource-data-router-design.md
      - docs/superpowers/plans/2026-09-15-nfl-game-totals-multisource-data-router-implementation.md
      - .github/workflows/nfl-game-totals-page-step7.yml
      - .github/workflows/nfl-game-totals-page-step8.yml
      - .github/workflows/nfl-game-totals-mobile-hotfix-v8-1.yml
      - .github/workflows/nfl-game-totals-multisource-router.yml

permissions:
  contents: read

jobs:
  multisource-router-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narrow test dependencies
        run: python -m pip install -q pytest pandas streamlit requests
      - name: Freeze-scope guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          allowed='^(\.github/workflows/(nfl-game-totals-multisource-router\.yml|nfl-game-totals-page-step7\.yml|nfl-game-totals-page-step8\.yml|nfl-game-totals-mobile-hotfix-v8-1\.yml)|docs/superpowers/(specs/2026-09-15-nfl-game-totals-multisource-data-router-design\.md|plans/2026-09-15-nfl-game-totals-multisource-data-router-implementation\.md)|nfl_game_totals_hub_v8_1\.py|sports_api/(nfl_data_router_v1\.py|nfl_data_nflverse_v1\.py|nfl_data_nws_v1\.py|nfl_data_espn_fallback_v1\.py|nfl_stadium_coordinates_v1\.py|nfl_game_totals_scoring_context_v1\.py|nfl_game_totals_pace_context_v1\.py|nfl_game_totals_explosive_context_v1\.py|nfl_game_totals_red_zone_drive_context_v1\.py|nfl_game_totals_environment_context_v1\.py)|tests/(test_nfl_data_router_v1\.py|test_nfl_data_nflverse_v1\.py|test_nfl_data_nws_v1\.py|test_nfl_game_totals_multisource_step3_7\.py|test_nfl_game_totals_page_step7\.py|test_nfl_game_totals_page_step8\.py|test_nfl_game_totals_mobile_hotfix_v8_1\.py))$'
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected NFL Game Totals multisource files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          frozen='^(sports_api/nfl_game_totals_total_projection_v1\.py|nfl_game_totals_hub_v8\.py|nfl_hub_v18\.py|streamlit_memory_lazy_router_v136\.py|nfl_spread_.*|nfl_moneyline_.*|nfl_passing_.*|nfl_rushing_.*|nfl_receiving_.*)$'
          if printf '%s\n' "$changed" | grep -Eq "$frozen"; then
            echo "Frozen NFL surface changed" >&2
            exit 1
          fi
      - name: Run full targeted certification suite
        run: |
          python -m pytest -q \
            tests/test_nfl_data_router_v1.py \
            tests/test_nfl_data_nflverse_v1.py \
            tests/test_nfl_data_nws_v1.py \
            tests/test_nfl_game_totals_multisource_step3_7.py \
            tests/test_nfl_game_totals_page_step3.py \
            tests/test_nfl_game_totals_page_step4.py \
            tests/test_nfl_game_totals_page_step5.py \
            tests/test_nfl_game_totals_page_step6.py \
            tests/test_nfl_game_totals_page_step7.py \
            tests/test_nfl_game_totals_page_step8.py \
            tests/test_nfl_game_totals_mobile_hotfix_v8_1.py
      - name: Compile approved runtime surface
        run: |
          python -m py_compile \
            sports_api/nfl_data_router_v1.py \
            sports_api/nfl_data_nflverse_v1.py \
            sports_api/nfl_data_nws_v1.py \
            sports_api/nfl_data_espn_fallback_v1.py \
            sports_api/nfl_stadium_coordinates_v1.py \
            sports_api/nfl_game_totals_scoring_context_v1.py \
            sports_api/nfl_game_totals_pace_context_v1.py \
            sports_api/nfl_game_totals_explosive_context_v1.py \
            sports_api/nfl_game_totals_red_zone_drive_context_v1.py \
            sports_api/nfl_game_totals_environment_context_v1.py \
            nfl_game_totals_hub_v8_1.py
