name: NFL Passing Yards New Phase Step 1 Category Navigation

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-new-phase-step1-category-navigation-v1.yml"
      - "devsystem/task_ledgers/passing-yards-new-phase-step1-category-navigation-v1.json"
      - "nfl_passing_yards_hub_v62.py"
      - "streamlit_memory_lazy_router_v213.py"
      - "app.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-new-phase-step1-category-navigation-v1.yml"
      - "devsystem/task_ledgers/passing-yards-new-phase-step1-category-navigation-v1.json"
      - "nfl_passing_yards_hub_v62.py"
      - "streamlit_memory_lazy_router_v213.py"
      - "app.py"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce new-phase Step 1 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-new-phase-step1-category-navigation-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-new-phase-step1-category-navigation-v1.json
          nfl_passing_yards_hub_v62.py
          streamlit_memory_lazy_router_v213.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_NEW_PHASE_STEP1_SCOPE_GREEN"

      - name: Compile Step 1 activation
        run: |
          python -m py_compile nfl_passing_yards_hub_v62.py
          python -m py_compile streamlit_memory_lazy_router_v213.py
          python -m py_compile app.py

      - name: Verify Category Navigation static contract
        run: |
          python - <<'PY'
          from pathlib import Path

          v62=Path("nfl_passing_yards_hub_v62.py").read_text()
          v213=Path("streamlit_memory_lazy_router_v213.py").read_text()
          app=Path("app.py").read_text()

          required_labels=[
              "Current Market + Edge",
              "Baseline Projection",
              "Context + Uncertainty",
              "Distribution + Probability",
              "Matchup Drivers",
              "Conditions + Personnel",
          ]
          required_targets=[
              "ks-py-category-market",
              "ks-py-category-projection",
              "ks-py-category-context",
              "ks-py-category-distribution",
              "ks-py-category-matchup",
              "ks-py-category-conditions",
          ]
          for token in required_labels + required_targets:
              assert token in v62, token

          for token in [
              'FROZEN_PRIOR = "nfl_passing_yards_hub_v61"',
              'CATEGORY_NAV_VERSION = "v62"',
              'NEW_PHASE_STEP = 1',
              'PRESENTATION_ONLY = True',
              'MAY_MODIFY_PROJECTION = False',
              'MAY_MODIFY_PROBABILITY = False',
              'MAY_MODIFY_MARKET_MATH = False',
              'MAY_MODIFY_DATA = False',
              'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
              'navigation._current_nav_url(slot)',
              'data-passing-yards-category-nav="v62"',
          ]:
              assert token in v62, token

          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v212"' in v213
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v62"' in v213
          assert 'from streamlit_memory_lazy_router_v213 import record_bootstrap_import_ms, render_app' in app

          print("PASSING_YARDS_NEW_PHASE_STEP1_STATIC_GREEN")
          PY

      - name: Verify original 8-step product files remain frozen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" --             nfl_passing_yards_hub_v58.py             nfl_passing_yards_hub_v59.py             nfl_passing_yards_hub_v60.py             nfl_passing_yards_hub_v61.py             streamlit_memory_lazy_router_v212.py
          echo "PASSING_YARDS_ORIGINAL_8_FROZEN_GREEN"

  branch-category-navigation-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium
      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-new-phase-step1
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-new-phase-step1/streamlit.log 2>&1 &
          echo $! > /tmp/pycat1_pid
      - name: Prove Category Navigation desktop tablet mobile
        run: |
          python - <<'PY'
          import time
          from urllib.parse import parse_qs, urlencode, urlparse
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          expected_date="2026-09-24"
          expected_matchup="Atlanta Falcons @ Green Bay Packers"
          expected_qb="2"
          params={
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":expected_date,
              "ks_py_matchup":expected_matchup,
              "ks_qb_slot":expected_qb,
          }
          route=base+"/?"+urlencode(params)
          categories=[
              ("market","ks-py-category-market"),
              ("projection","ks-py-category-projection"),
              ("context","ks-py-category-context"),
              ("distribution","ks-py-category-distribution"),
              ("matchup","ks-py-category-matchup"),
              ("conditions","ks-py-category-conditions"),
          ]

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500: break
              except Exception: pass
              time.sleep(.5)
          else:
              raise RuntimeError("CATEGORY_NAV_LOCAL_STREAMLIT_NOT_READY")

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2000))
                  except Exception: pass
              return "\n".join(out)

          def find_detail(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("CATEGORY_NAV_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          root=frame.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
                          if root.count()==1: return frame,root
                      except Exception: pass
                  page.wait_for_timeout(400)
              raise RuntimeError("CATEGORY_NAV_QB_DETAIL_NOT_READY")

          def find_picker(page,timeout=120):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          picker=frame.locator('[data-passing-yards-selection-screen="v58"]')
                          if picker.count()==1: return frame,picker
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("CATEGORY_NAV_QB_PICKER_NOT_READY")

          def canonical_matchup(value):
              return str(value or "").split(" • ", 1)[0].strip()

          def assert_state(page, qb=True):
              qs=parse_qs(urlparse(page.url).query)
              assert qs.get("ks_py_date")==[expected_date], qs
              matchup_values = qs.get("ks_py_matchup") or [""]
              assert canonical_matchup(matchup_values[0]) == expected_matchup, qs
              if qb:
                  assert qs.get("ks_qb_slot")==[expected_qb], qs
              else:
                  assert "ks_qb_slot" not in qs, qs

          def certify(page,width,height):
              page.set_viewport_size({"width":width,"height":height})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find_detail(page)
              assert_state(page,True)

              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "TypeError" not in body and "Traceback" not in body
              assert root.get_attribute("data-passing-yards-category-nav-ready")=="v62"

              nav=root.locator('[data-passing-yards-category-nav="v62"]')
              assert nav.count()==1
              assert nav.locator("a.ks-py62-category-link").count()==6

              dims=frame.locator("body").evaluate("""e => ({
                bodyScroll:e.scrollWidth,
                docScroll:document.documentElement.scrollWidth,
                viewport:window.innerWidth
              })""")
              assert dims["bodyScroll"] <= dims["viewport"] + 2, dims
              assert dims["docScroll"] <= dims["viewport"] + 2, dims
              nb=nav.bounding_box()
              assert nb and nb["width"] <= width + 2, nb

              for kind,target_id in categories:
                  nav=root.locator('[data-passing-yards-category-nav="v62"]')
                  link=nav.locator(f'a[data-category-target="{kind}"]')
                  assert link.count()==1
                  lb=link.bounding_box()
                  assert lb and lb["height"] >= 40, (kind,lb)
                  link.click()
                  page.wait_for_timeout(180)
                  frame,root=find_detail(page)
                  assert_state(page,True)
                  assert root.get_attribute("data-passing-yards-selected-qb")=="2"
                  assert frame.evaluate("() => location.hash")==f"#{target_id}"
                  target=root.locator(f"#{target_id}")
                  assert target.count()==1
                  rect=target.evaluate("""e => {
                    const r=e.getBoundingClientRect();
                    return {top:r.top,bottom:r.bottom,innerHeight:window.innerHeight};
                  }""")
                  assert rect["bottom"] > 0 and rect["top"] < rect["innerHeight"], (kind,rect)

              back=root.locator('a[data-qb-back="true"]')
              assert back.count()==1
              back.click()
              frame,picker=find_picker(page)
              assert picker.count()==1
              assert_state(page,False)
              assert frame.locator('[data-passing-yards-category-nav="v62"]').count()==0
              print(f"PASSING_YARDS_NEW_PHASE_STEP1_{width}_GREEN")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              certify(page,390,844)
              certify(page,768,1024)
              certify(page,1440,1000)
              print("PASSING_YARDS_NEW_PHASE_STEP1_BRANCH_GREEN")
              browser.close()
          PY
      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/passing-yards-new-phase-step1/streamlit.log || true
      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/pycat1_pid ]; then kill "$(cat /tmp/pycat1_pid)" 2>/dev/null || true; fi

  public-category-navigation-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Allow Streamlit deployment to publish
        run: sleep 90
      - name: Prove public Category Navigation once
        run: |
          python - <<'PY'
