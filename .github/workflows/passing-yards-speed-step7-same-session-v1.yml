name: NFL Passing Yards Speed Step 7 Same Session

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json"
      - "nfl_passing_yards_hub_v83.py"
      - "streamlit_memory_lazy_router_v234.py"
      - "tests/test_passing_yards_speed_step7_same_session_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json"
      - "nfl_passing_yards_hub_v83.py"
      - "streamlit_memory_lazy_router_v234.py"
      - "tests/test_passing_yards_speed_step7_same_session_v1.py"

permissions:
  contents: read

concurrency:
  group: passing-yards-speed-step7-same-session-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Step 7 build scope and protect Steps 1-6
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/passing-yards-speed-step7-same-session-v1.yml' \
              'devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json' | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected Step 7 diff:"
              printf '%s\n' "$actual"
              exit 1
            fi
            echo "PASSING_YARDS_SPEED_STEP7_SCOPE_GREEN"
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "SPEED_STEP7_FROZEN_BLOB_CHANGED:$1:$actual:$2"; exit 1; }
          }
          check_blob nfl_passing_yards_hub_v82.py 02e20db014ebb705bb57503873964db496d1d053
          check_blob streamlit_memory_lazy_router_v233.py feb9f65e312c2704823694c786496883283cda75
          check_blob devsystem/task_ledgers/passing-yards-speed-step6-full-latency-v1.json 82eca4ce71ab7dd3d59601148897226cb29538d8
          check_blob .github/workflows/passing-yards-speed-step6-full-latency-v1.yml 3f3940feadadef98274df650a45fc70fc143e7f9
          echo "PASSING_YARDS_SPEED_STEP7_STEPS1_6_FROZEN_GREEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test same-session transition contract
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q \
            tests/test_passing_yards_speed_step7_same_session_v1.py \
            tests/test_passing_yards_speed_step6_full_latency_v1.py
          python -m py_compile nfl_passing_yards_hub_v83.py streamlit_memory_lazy_router_v234.py app.py
          grep -F 'from streamlit_memory_lazy_router_v234 import record_bootstrap_import_ms, render_app' app.py
          grep -F 'FROZEN_PRIOR = "nfl_passing_yards_hub_v82"' nfl_passing_yards_hub_v83.py
          grep -F 'PASSING_HUB = "nfl_passing_yards_hub_v83"' streamlit_memory_lazy_router_v234.py
          echo "PASSING_YARDS_SPEED_STEP7_STATIC_GREEN"

  branch-live-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install branch browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Start branch app
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/py_step7.log 2>&1 &
          echo $! >/tmp/py_step7_pid
      - name: Prove same-session Load Full Analysis transition
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          common={
            "ks_jump_sport":"NFL","ks_jump_market":"Passing Yards",
            "ks_py_date":"2026-09-24","ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
            "ks_qb_slot":"2","ks_py_hint_name":"Jordan Love","ks_py_hint_meta":"GB • QB",
            "ks_py_hint_projection":"276.4","ks_py_hint_attempts":"34.8","ks_py_hint_ypa":"7.94",
            "ks_py_hint_line":"274.5","ks_py_hint_lean":"LEAN OVER"
          }
          lazy=base+"/?"+urlencode(common)
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
            try:
              if requests.get(base,timeout=2).status_code<500: break
            except Exception: pass
            time.sleep(.3)
          else: raise RuntimeError("SPEED_STEP7_BRANCH_APP_NOT_READY")

          def find(page,selector,timeout,interval=.15):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              for frame in page.frames:
                try:
                  loc=frame.locator(selector)
                  if loc.count()>=1: return frame,loc.first
                except Exception: pass
              time.sleep(interval)
            raise RuntimeError("SPEED_STEP7_BRANCH_SELECTOR_NOT_READY:"+selector)

          def find_button(page,timeout):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              for frame in page.frames:
                try:
                  loc=frame.locator("button").filter(has_text="Load Full Analysis")
                  if loc.count()>=1: return frame,loc.first
                except Exception: pass
              time.sleep(.15)
            raise RuntimeError("SPEED_STEP7_BRANCH_BUTTON_NOT_READY")

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
            context=browser.new_context(viewport={"width":390,"height":844})
            page=context.new_page()
            page.goto(lazy,wait_until="domcontentloaded",timeout=120000)
            find(page,'[data-passing-yards-same-session-owner="v83"]',30)
            find(page,'[data-passing-yards-lazy-detail="v79"]',30)
            legacy=sum(frame.locator('[data-passing-yards-load-full="v79"]').count() for frame in page.frames)
            if legacy:
              raise RuntimeError(f"SPEED_STEP7_BRANCH_LEGACY_BLANK_LINK_PRESENT:{legacy}")
            _,button=find_button(page,30)
            origin_before=float(page.evaluate("performance.timeOrigin"))
            started=time.monotonic()
            button.click(timeout=10000)
            frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',120,.15)
            ready=time.monotonic()-started
            origin_after=float(page.evaluate("performance.timeOrigin"))
            same_document=1 if abs(origin_after-origin_before)<=1 else 0
            if same_document != 1:
              raise RuntimeError("SPEED_STEP7_BRANCH_DOCUMENT_RELOADED")
            if "ks_py_full=1" not in page.url:
              raise RuntimeError("SPEED_STEP7_BRANCH_FULL_FLAG_NOT_ACTIVE:"+page.url)

            find(page,'[data-passing-yards-same-session-owner="v83"]',20)
            find(page,'[data-passing-yards-concurrent-prefetch-owner="v82"]',20)
            find(page,'[data-passing-yards-payload-dedupe-owner="v81"]',20)
            find(page,'[data-passing-yards-evidence-cache="v80"]',20)
            _,perf=find(page,'[data-passing-yards-performance-runtime="v77"]',20)
            _,step6=find(page,'[data-passing-yards-concurrent-prefetch="v82"]',20)

            name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
            if name!="Jordan Love": raise RuntimeError("SPEED_STEP7_BRANCH_IDENTITY:"+name)
            server_ms=float(perf.get_attribute("data-step8-server-render-ms") or "0")
            html_bytes=int(perf.get_attribute("data-step8-html-bytes-after") or "0")
            launched=int(step6.get_attribute("data-step6-prefetch-launched") or "0")
            hits=int(step6.get_attribute("data-step6-prefetch-hits") or "0")
            fallbacks=int(step6.get_attribute("data-step6-prefetch-fallbacks") or "0")
            nonserver=max(0.0,ready-(server_ms/1000.0))
            if ready>12.0: raise RuntimeError(f"SPEED_STEP7_BRANCH_READY_BUDGET:{ready:.3f}")
            if launched<7 or hits<7: raise RuntimeError(f"SPEED_STEP7_BRANCH_STEP6_PREFETCH_REGRESSION:{launched}:{hits}")
            if fallbacks>0: raise RuntimeError(f"SPEED_STEP7_BRANCH_STEP6_FALLBACK:{fallbacks}")
            if html_bytes>=10000000: raise RuntimeError(f"SPEED_STEP7_BRANCH_PAYLOAD_REGRESSION:{html_bytes}")

            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_CLICK_READY_SECONDS={ready:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_SERVER_RENDER_MS={server_ms:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_NONSERVER_SECONDS={nonserver:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_SAME_DOCUMENT={same_document}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_PREFETCH_LAUNCHED={launched}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_PREFETCH_HITS={hits}")
            print(f"PASSING_YARDS_SPEED_STEP7_BRANCH_HTML_BYTES={html_bytes}")
            print("PASSING_YARDS_SPEED_STEP7_BRANCH_SAME_SESSION_GREEN")
            context.close(); browser.close()
          PY
      - name: Print branch log on failure
        if: failure()
        run: tail -n 900 /tmp/py_step7.log || true
      - name: Stop branch app
        if: always()
        run: kill "$(cat /tmp/py_step7_pid)" 2>/dev/null || true

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public proof stack
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Prove public same-session transition and freeze
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          app=Path("app.py").read_text()
          router=Path("streamlit_memory_lazy_router_v234.py").read_text()
          hub=Path("nfl_passing_yards_hub_v83.py").read_text()
          if 'from streamlit_memory_lazy_router_v234 import record_bootstrap_import_ms, render_app' not in app:
            raise RuntimeError("SPEED_STEP7_PUBLIC_SOURCE_APP_NOT_V234")
          if 'PASSING_HUB = "nfl_passing_yards_hub_v83"' not in router:
            raise RuntimeError("SPEED_STEP7_PUBLIC_SOURCE_ROUTER_NOT_V83")
          if 'FROZEN_PRIOR = "nfl_passing_yards_hub_v82"' not in hub:
            raise RuntimeError("SPEED_STEP7_PUBLIC_SOURCE_V83_NOT_V82")
          print("PASSING_YARDS_SPEED_STEP7_PUBLIC_SOURCE_OWNERSHIP_GREEN")

          base="https://kyre-sports-ai.streamlit.app"
          common={
            "ks_jump_sport":"NFL","ks_jump_market":"Passing Yards",
            "ks_py_date":"2026-09-24","ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
            "ks_qb_slot":"2","ks_py_hint_name":"Jordan Love","ks_py_hint_meta":"GB • QB",
            "ks_py_hint_projection":"276.4","ks_py_hint_attempts":"34.8","ks_py_hint_ypa":"7.94",
            "ks_py_hint_line":"274.5","ks_py_hint_lean":"LEAN OVER"
          }
          lazy=base+"/?"+urlencode(common)

          def find(page,selector,timeout,interval=.2):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              for frame in page.frames:
                try:
                  loc=frame.locator(selector)
                  if loc.count()>=1: return frame,loc.first
                except Exception: pass
              time.sleep(interval)
            raise RuntimeError("SPEED_STEP7_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def find_button(page,timeout):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              for frame in page.frames:
                try:
                  loc=frame.locator("button").filter(has_text="Load Full Analysis")
                  if loc.count()>=1: return frame,loc.first
                except Exception: pass
              time.sleep(.2)
            raise RuntimeError("SPEED_STEP7_PUBLIC_BUTTON_NOT_READY")

          with sync_playwright() as p:
            deadline=time.monotonic()+600
            while True:
              b=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              c=b.new_context(viewport={"width":390,"height":844})
              page=c.new_page()
              active=False
              try:
                page.goto(lazy,wait_until="domcontentloaded",timeout=120000)
                try:
                  find(page,'[data-passing-yards-same-session-owner="v83"]',25)
                  find(page,'[data-passing-yards-lazy-detail="v79"]',25)
                  find_button(page,25)
                  active=True
                except Exception:
                  active=False
              finally:
                if not active:
                  try:c.close()
                  except Exception:pass
                  try:b.close()
                  except Exception:pass
              if active: break
              if time.monotonic()>=deadline:
                raise RuntimeError("SPEED_STEP7_PUBLIC_DEPLOYMENT_NOT_ACTIVE")
              time.sleep(12)

            legacy=sum(frame.locator('[data-passing-yards-load-full="v79"]').count() for frame in page.frames)
            if legacy:
              raise RuntimeError(f"SPEED_STEP7_PUBLIC_LEGACY_BLANK_LINK_PRESENT:{legacy}")
            _,button=find_button(page,20)
            print("PASSING_YARDS_SPEED_STEP7_PUBLIC_DEPLOYMENT_ACTIVE")
            print("PASSING_YARDS_SPEED_STEP7_PUBLIC_V83_OWNER_GREEN")
            print("PASSING_YARDS_SPEED_STEP7_PUBLIC_V82_DESCENDANT_GREEN")
            print("PASSING_YARDS_SPEED_STEP7_PUBLIC_V79_LAZY_GREEN")

            origin_before=float(page.evaluate("performance.timeOrigin"))
            started=time.monotonic()
            button.click(timeout=10000)

            flag_deadline=time.monotonic()+12
            while time.monotonic()<flag_deadline and "ks_py_full=1" not in page.url:
              time.sleep(.1)
            origin_after_click=float(page.evaluate("performance.timeOrigin"))
            same_document=1 if abs(origin_after_click-origin_before)<=1 else 0
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_POST_CLICK_URL={page.url}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_POST_CLICK_SAME_DOCUMENT={same_document}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_POST_CLICK_PAGE_COUNT={len(c.pages)}")
            owner_after_click=sum(frame.locator('[data-passing-yards-same-session-owner="v83"]').count() for frame in page.frames)
            lazy_after_click=sum(frame.locator('[data-passing-yards-lazy-detail="v79"]').count() for frame in page.frames)
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_POST_CLICK_V83_OWNER_COUNT={owner_after_click}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_POST_CLICK_LAZY_COUNT={lazy_after_click}")

            if same_document != 1:
              raise RuntimeError("SPEED_STEP7_PUBLIC_DOCUMENT_RELOADED")
            if "ks_py_full=1" not in page.url:
              raise RuntimeError("SPEED_STEP7_PUBLIC_FULL_FLAG_NOT_ACTIVE:"+page.url)

            try:
              frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',20,.15)
            except Exception:
              owner_now=sum(frame.locator('[data-passing-yards-same-session-owner="v83"]').count() for frame in page.frames)
              lazy_now=sum(frame.locator('[data-passing-yards-lazy-detail="v79"]').count() for frame in page.frames)
              print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_DETAIL_TIMEOUT_URL={page.url}")
              print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_DETAIL_TIMEOUT_V83_OWNER_COUNT={owner_now}")
              print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_DETAIL_TIMEOUT_LAZY_COUNT={lazy_now}")
              raise RuntimeError("SPEED_STEP7_PUBLIC_DETAIL_NOT_READY_AFTER_ACTIVE_FULL_FLAG")
            ready=time.monotonic()-started
            origin_after=float(page.evaluate("performance.timeOrigin"))
            same_document=1 if abs(origin_after-origin_before)<=1 else 0

            find(page,'[data-passing-yards-concurrent-prefetch-owner="v82"]',20)
            find(page,'[data-passing-yards-payload-dedupe-owner="v81"]',20)
            find(page,'[data-passing-yards-evidence-cache="v80"]',20)
            _,perf=find(page,'[data-passing-yards-performance-runtime="v77"]',20)
            _,step6=find(page,'[data-passing-yards-concurrent-prefetch="v82"]',20)

            name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
            if name!="Jordan Love": raise RuntimeError("SPEED_STEP7_PUBLIC_IDENTITY:"+name)
            server_ms=float(perf.get_attribute("data-step8-server-render-ms") or "0")
            html_bytes=int(perf.get_attribute("data-step8-html-bytes-after") or "0")
            launched=int(step6.get_attribute("data-step6-prefetch-launched") or "0")
            hits=int(step6.get_attribute("data-step6-prefetch-hits") or "0")
            fallbacks=int(step6.get_attribute("data-step6-prefetch-fallbacks") or "0")
            wrapper_ms=float(step6.get_attribute("data-step6-wrapper-render-ms") or "0")
            transport=max(0.0,ready-(wrapper_ms/1000.0))

            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_CLICK_READY_SECONDS={ready:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_SERVER_RENDER_MS={server_ms:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_V82_WRAPPER_RENDER_MS={wrapper_ms:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_TRANSPORT_OVERHEAD_SECONDS={transport:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_SAME_DOCUMENT={same_document}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_PREFETCH_LAUNCHED={launched}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_PREFETCH_HITS={hits}")
            print(f"PASSING_YARDS_SPEED_STEP7_PUBLIC_HTML_BYTES={html_bytes}")

            if wrapper_ms<=0: raise RuntimeError("SPEED_STEP7_PUBLIC_WRAPPER_TELEMETRY_MISSING")
            if ready>24.0: raise RuntimeError(f"SPEED_STEP7_PUBLIC_STEP6_READY_BUDGET:{ready:.3f}")
            if transport>1.5: raise RuntimeError(f"SPEED_STEP7_PUBLIC_TRANSPORT_BUDGET:{transport:.3f}")
            if launched<7 or hits<7: raise RuntimeError(f"SPEED_STEP7_PUBLIC_STEP6_PREFETCH_REGRESSION:{launched}:{hits}")
            if fallbacks>0: raise RuntimeError(f"SPEED_STEP7_PUBLIC_STEP6_FALLBACK:{fallbacks}")
            if html_bytes>=10000000: raise RuntimeError(f"SPEED_STEP7_PUBLIC_PAYLOAD_REGRESSION:{html_bytes}")

            print("PASSING_YARDS_SPEED_STEP7_PUBLIC_NAVIGATION_ACCEPTANCE_GREEN")
            print("PASSING_YARDS_SPEED_STEP7_SAME_SESSION_GREEN")
            print("PASSING_YARDS_SPEED_STEP7_GREEN")
            print("PASSING_YARDS_SPEED_STEP7_FROZEN")
            c.close(); b.close()
          PY
