name: NFL Passing Yards Speed Step 7 Same Session

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - "devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-speed-step7-same-session-v1.yml"
      - "devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-speed-step7-same-session-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce diagnostic-only scope and protect Steps 1-6
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
            expected="$(printf '%s\n' '.github/workflows/passing-yards-speed-step7-same-session-v1.yml' 'devsystem/task_ledgers/passing-yards-speed-step7-same-session-v1.json' | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected Step 7 diagnostic diff:"
              printf '%s\n' "$actual"
              exit 1
            fi
            echo "PASSING_YARDS_SPEED_STEP7_DIAGNOSTIC_SCOPE_GREEN"
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "SPEED_STEP7_FROZEN_BLOB_CHANGED:$1:$actual:$2"; exit 1; }
          }
          check_blob nfl_passing_yards_hub_v82.py 02e20db014ebb705bb57503873964db496d1d053
          check_blob streamlit_memory_lazy_router_v233.py feb9f65e312c2704823694c786496883283cda75
          check_blob devsystem/task_ledgers/passing-yards-speed-step6-full-latency-v1.json 82eca4ce71ab7dd3d59601148897226cb29538d8
          check_blob .github/workflows/passing-yards-speed-step6-full-latency-v1.yml 3f3940feadadef98274df650a45fc70fc143e7f9
          echo "PASSING_YARDS_SPEED_STEP7_STEPS1_6_FROZEN_GREEN"

  profile-current-transition:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transition profiler
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Start branch app
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/py_step7_profile.log 2>&1 &
          echo $! >/tmp/py_step7_profile_pid
      - name: Profile current Load Full Analysis transition
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          common={
            "ks_jump_sport":"NFL","ks_jump_market":"Passing Yards",
            "ks_py_date":"2026-09-24","ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
            "ks_qb_slot":"2","ks_py_hint_name":"Jordan Love","ks_py_hint_meta":"GB • QB",
            "ks_py_hint_projection":"276.4","ks_py_hint_attempts":"34.8","ks_py_hint_ypa":"7.94",
            "ks_py_hint_line":"274.5","ks_py_hint_lean":"LEAN OVER"
          }
          lazy=base+"/?"+urlencode(common)
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
            try:
              if requests.get(base,timeout=2).status_code<500: break
            except Exception: pass
            time.sleep(.3)
          else:
            raise RuntimeError("SPEED_STEP7_PROFILE_APP_NOT_READY")

          def find(page,selector,timeout,interval=.15):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              for frame in page.frames:
                try:
                  loc=frame.locator(selector)
                  if loc.count()>=1:
                    return frame,loc.first
                except Exception:
                  pass
              time.sleep(interval)
            raise RuntimeError("SPEED_STEP7_PROFILE_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
            context=browser.new_context(viewport={"width":390,"height":844})
            page=context.new_page()
            page.goto(lazy,wait_until="domcontentloaded",timeout=120000)
            _,load=find(page,'[data-passing-yards-load-full="v79"]',30)
            find(page,'[data-passing-yards-lazy-detail="v79"]',30)
            origin_before=float(page.evaluate("performance.timeOrigin"))
            href=load.get_attribute("href") or ""
            if "ks_py_full=1" not in href:
              raise RuntimeError("SPEED_STEP7_PROFILE_FULL_LINK_CONTRACT_MISSING")

            started=time.monotonic()
            load.click(timeout=10000,no_wait_after=True)
            frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',90,.15)
            click_ready=time.monotonic()-started
            origin_after=float(page.evaluate("performance.timeOrigin"))
            _,perf=find(page,'[data-passing-yards-performance-runtime="v77"]',20)
            server_ms=float(perf.get_attribute("data-step8-server-render-ms") or "0")
            nonserver=max(0.0,click_ready-(server_ms/1000.0))
            changed=1 if abs(origin_after-origin_before)>1 else 0
            if changed != 1:
              raise RuntimeError("SPEED_STEP7_PROFILE_NAVIGATION_NOT_CONFIRMED")
            name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
            if name!="Jordan Love":
              raise RuntimeError("SPEED_STEP7_PROFILE_IDENTITY:"+name)

            print(f"PASSING_YARDS_SPEED_STEP7_PROFILE_CLICK_READY_SECONDS={click_ready:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PROFILE_SERVER_RENDER_MS={server_ms:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PROFILE_NONSERVER_SECONDS={nonserver:.3f}")
            print(f"PASSING_YARDS_SPEED_STEP7_PROFILE_TIME_ORIGIN_CHANGED={changed}")
            print("PASSING_YARDS_SPEED_STEP7_PROFILE_OWNER=FULL_DOCUMENT_NAVIGATION")
            print("PASSING_YARDS_SPEED_STEP7_PROFILE_GREEN")
            context.close(); browser.close()
          PY
      - name: Print app log on failure
        if: failure()
        run: tail -n 900 /tmp/py_step7_profile.log || true
      - name: Stop branch app
        if: always()
        run: kill "$(cat /tmp/py_step7_profile_pid)" 2>/dev/null || true
