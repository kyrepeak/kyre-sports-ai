name: NFL Live Game Repair Step 4 Registry Freeze Once

on:
  push:
    branches: [monster-frozen-artifact-registry]
    paths:
      - ".github/workflows/nfl-live-game-repair-step4-freeze-once.yml"

permissions:
  contents: write

concurrency:
  group: nfl-live-game-repair-step4-registry-freeze-once
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact registry transaction identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:devsystem/frozen_artifact_registry_state_v1.json)" = "de0a786b7c94812c46dc4a4f5ddc6dd44a7b8fa5"

      - name: CAS revision 125 to 126 and freeze Step 4
        shell: bash
        env:
          REGISTRY: devsystem/frozen_artifact_registry_state_v1.json
          WORKFLOW: .github/workflows/nfl-live-game-repair-step4-freeze-once.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("devsystem/frozen_artifact_registry_state_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          expected_hash = "61fe0d1eb77a9af88b0ccb052f4588bb945c345b9364e9f87265f613222780d1"
          expected_source = "97421997566842f78f2cf048e54e97c0d9de7ebf"
          merge_sha = "5b9dd903c78a9705e55600f2e4b4a4f5b87da84b"
          checkpoint = "NFL_LIVE_GAME_REPAIR_STEP4_RECEIVING_LIVE"

          def state_hash(value):
              body = dict(value)
              body.pop("state_hash", None)
              canonical = json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          assert payload["schema_version"] == 1
          assert payload["version"] == "MONSTER_V4_FROZEN_ARTIFACT_REGISTRY_V1"
          assert payload["registry_ref"] == "refs/heads/monster-frozen-artifact-registry"
          assert payload["registry_path"] == "devsystem/frozen_artifact_registry_state_v1.json"
          assert payload["revision"] == 125, payload["revision"]
          assert payload["source_main_sha"] == expected_source, payload["source_main_sha"]
          assert payload["state_hash"] == expected_hash, payload["state_hash"]
          assert state_hash(payload) == expected_hash
          assert payload.get("active_thaws") == [], payload.get("active_thaws")
          assert checkpoint not in payload["entries"]
          assert "NFL_LIVE_GAME_REPAIR_STEP3_RUSHING_LIVE" in payload["entries"]

          payload["entries"][checkpoint] = {
              "status": "FROZEN",
              "checkpoint_id": checkpoint,
              "source_main_sha": merge_sha,
              "proven_merge_sha": merge_sha,
              "branch_proof_run_id": 37256090321,
              "branch_devsystem_run_id": 37256090296,
              "branch_identity_run_id": 37256090262,
              "branch_quarantine_run_id": 37256090336,
              "merged_main_proof_run_id": 37256530003,
              "merged_main_devsystem_run_id": 37256529976,
              "proof_run_id": 37256529976,
              "quarantine_run_id": 37256529945,
              "proof_kind": "MERGED_MAIN_REAL_LIVE_RECEIVING",
              "regression_debt_state": "CLEARED",
              "real_live_event_id": "401872978",
              "real_live_event": "DET @ CAR",
              "real_live_player_count": 17,
              "real_live_filtered_count": 2,
              "live_identity_state": "LIVE",
              "live_identity_verified": True,
              "live_prop_market_gate_open": False,
              "live_stale_api_player_filter": True,
              "malformed_identity_fail_closed": True,
              "team_mismatched_numeric_identity_fail_closed": True,
              "final_post_fail_closed": True,
              "receiving_mutation_scope": "LIVE_STALE_API_PLAYER_FILTER_ONLY",
              "rushing_untouched": True,
              "shared_step2_gate_unchanged": True,
              "router_unchanged": True,
              "render_deployment_mutated": False,
              "api2_used": False,
              "projection_changed": False,
              "probability_changed": False,
              "ranking_changed": False,
              "sportsbook_changed": False,
              "sportsbook_projection_influence": 0.0,
              "artifacts": {
                  "nfl_receiving_yards_hub_v17.py": "d69990d75666db414839470db20f68958c284b9e",
                  "tests/test_nfl_live_game_repair_step4_receiving_live_v1.py": "084bd1438b995fc85687890cb3f5ac00c1ecc88b",
                  "devsystem/nfl_live_game_repair_step4_receiving_live_v1.py": "6587df4fc628569ec217425b619e52a5d4be88c6",
                  "devsystem/task_ledgers/nfl-live-game-repair-step4-receiving-live-v1.json": "85dad99ff4258ddd9fa0e6f2da4abe6385932725",
                  ".github/workflows/nfl-live-game-repair-step4-receiving-live-v1.yml": "6285934136e289f34b600f51a4d681f87d323e86"
              }
          }
          payload["revision"] = 126
          payload["source_main_sha"] = merge_sha
          payload["state_hash"] = state_hash(payload)

          assert payload["revision"] == 126
          assert payload["source_main_sha"] == merge_sha
          assert payload["active_thaws"] == []
          assert payload["entries"][checkpoint]["status"] == "FROZEN"
          assert state_hash(payload) == payload["state_hash"]

          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("NFL_LIVE_GAME_REPAIR_STEP4_REGISTRY_CAS_GREEN")
          print("revision=126")
          print("state_hash=" + payload["state_hash"])
          PY

          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY" "$WORKFLOW"
          git diff --cached --check
          git commit -m "Freeze NFL live-game repair Step 4 Receiving live"
          git push origin HEAD:monster-frozen-artifact-registry
