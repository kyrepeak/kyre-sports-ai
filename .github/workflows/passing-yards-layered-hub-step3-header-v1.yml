name: Passing Yards Layered Hub Step 3 Header

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step3-header-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_header_v1.py"
      - "prototypes/passing_yards_layered_hub_app_step3_v1.py"
      - "tests/test_passing_yards_layered_hub_header_step3_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step3-header-v1.yml"

permissions:
  contents: read

jobs:
  targeted-header-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Step 3 header only
        run: python tests/test_passing_yards_layered_hub_header_step3_v1.py
