name: NFL Prop Analytics Step 2 Schedule Truth

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step2-schedule-truth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_schedule_v1.py"
      - "tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step2-schedule-truth-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_schedule_v1.py"
      - "tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-step2-schedule-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Step 2 scope and protect frozen Step 1 / Passing Yards
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step2-schedule-truth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_schedule_v1.py' \
            'tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py' | sort)"
          step3_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step3-game-handoff-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_step3_game_handoff_v1.py' | sort)"
          step4_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step4-page2-shell-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_matchup_shell_v1.py' \
            'tests/test_nfl_prop_analytics_step4_page2_shell_v1.py' | sort)"
          step5_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step5-roster-truth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_roster_truth_v1.py' \
            'tests/test_nfl_prop_analytics_step5_roster_truth_v1.py' | sort)"
          step6_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_availability_depth_v1.py' \
            'tests/test_nfl_prop_analytics_step6_availability_depth_v1.py' | sort)"
          step7_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_player_select_v1.py' \
            'tests/test_nfl_prop_analytics_step7_player_handoff_v1.py' | sort)"
          step8_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step8-prop-page-shell-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py' | sort)"
          visual_polish_step3_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json' \
            'nfl_prop_analytics_schedule_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_visual_polish_step3_v1.py' | sort)"
          page2_polish_step2_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step2-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step2-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_page2_unified_roster_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step2_v1.py' | sort)"
          if [ "$actual" != "$expected" ] && \
             [ "$actual" != "$step3_additive_expected" ] && \
             [ "$actual" != "$step4_additive_expected" ] && \
             [ "$actual" != "$step5_additive_expected" ] && \
             [ "$actual" != "$step6_additive_expected" ] && \
             [ "$actual" != "$step7_additive_expected" ] && \
             [ "$actual" != "$step8_additive_expected" ] && \
             [ "$actual" != "$visual_polish_step3_expected" ] && \
             [ "$actual" != "$page2_polish_step2_expected" ]; then
            echo "NFL_PROP_ANALYTICS_STEP2_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "NFL_PROP_ANALYTICS_STEP2_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1
          check_blob .github/workflows/passing-yards-step10-current-final-freeze-v1.yml 7b23f9d9ed9967a74cee9f1328c9817c2f71d956
          check_blob devsystem/task_ledgers/passing-yards-step10-current-final-freeze-v1.json b2f2110a5cfe3f77519f6eee6aef3bfe6969a1f5

          grep -F 'data-nfl-prop-analytics-route="v1"' nfl_prop_analytics_hub_v1.py
          grep -F 'data-prop-analytics-owner="nfl_prop_analytics_hub_v1"' nfl_prop_analytics_hub_v1.py
          grep -F 'data-prop-analytics-step="1"' nfl_prop_analytics_hub_v1.py
          grep -F 'render_schedule_truth_layer()' nfl_prop_analytics_hub_v1.py

          echo "NFL_PROP_ANALYTICS_STEP2_STEP1_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP2_PASSING_YARDS_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP2_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test Step 2 contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_hub_v1.py nfl_prop_analytics_schedule_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py
          echo "NFL_PROP_ANALYTICS_STEP2_STATIC_GREEN"

      - name: Prove live 2026 Week 3 Sunday schedule truth
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from datetime import date
          from nfl_prop_analytics_schedule_v1 import _load_schedule_truth_uncached

          truth=_load_schedule_truth_uncached(date(2026,9,27))
          games=truth["games"]
          pairs={(g["away"],g["home"]) for g in games}

          if len(games) < 12:
              raise RuntimeError(f"PROP_ANALYTICS_STEP2_LIVE_SLATE_INCOMPLETE:{len(games)}")
          if truth["verified_count"] < 10:
              raise RuntimeError(
                  f"PROP_ANALYTICS_STEP2_LIVE_VERIFICATION_INCOMPLETE:{truth['verified_count']}"
              )
          if len(truth["sources_available"]) < 2:
              raise RuntimeError(
                  "PROP_ANALYTICS_STEP2_SOURCE_ROUTER_INCOMPLETE:"
                  + ",".join(truth["sources_available"])
              )

          for pair in (("BAL","DAL"),("KC","MIA"),("LAR","DEN")):
              if pair not in pairs:
                  raise RuntimeError(f"PROP_ANALYTICS_STEP2_EXPECTED_GAME_MISSING:{pair}")

          print("NFL_PROP_ANALYTICS_STEP2_LIVE_SCHEDULE_GREEN",len(games))
          print("NFL_PROP_ANALYTICS_STEP2_SOURCE_ROUTER_GREEN",truth["sources_available"])
          print("NFL_PROP_ANALYTICS_STEP2_VERIFIED_GAMES_GREEN",truth["verified_count"])
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/nfl-prop-analytics-step2
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/nfl-prop-analytics-step2/streamlit.log 2>&1 &
          echo $! > /tmp/prop_analytics_step2_pid

      - name: Prove Page 1 schedule truth and frozen routes
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from urllib.parse import urlencode

          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("PROP_ANALYTICS_STEP2_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=150):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP2_SELECTOR_NOT_READY:"+selector)

          def find_combo(page,name,timeout=90):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role("combobox",name=name,exact=True)
                          if loc.count()==1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP2_COMBO_NOT_READY:"+name)

          def choose(page,name,value):
              _,combo=find_combo(page,name)
              combo.click(timeout=10000)
              page.keyboard.type(value,delay=20)
              end=time.monotonic()+25
              while time.monotonic()<end:
                  for candidate in page.frames:
                      try:
                          opt=candidate.get_by_role("option",name=value,exact=True)
                          if opt.count()>=1:
                              opt.first.click(timeout=10000)
                              return
                      except Exception:
                          pass
                  page.wait_for_timeout(175)
              raise RuntimeError("PROP_ANALYTICS_STEP2_OPTION_NOT_READY:"+value)

          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage","--no-sandbox"],
              )
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(base+"/",wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL")
              choose(page,"🎯 NFL Market","Prop Analytics")

              _,owner=find(page,'[data-nfl-prop-analytics-route="v1"]')
              assert owner.get_attribute("data-prop-analytics-owner")=="nfl_prop_analytics_hub_v1"
              assert owner.get_attribute("data-prop-analytics-step")=="1"

              _,board=find(page,'[data-nfl-prop-analytics-step2-schedule="v1"]')
              state=board.get_attribute("data-prop-schedule-state")
              count=int(board.get_attribute("data-prop-schedule-count") or 0)
              verified=int(board.get_attribute("data-prop-schedule-verified-count") or 0)
              source_text=board.get_attribute("data-prop-schedule-sources") or ""
              target=date.fromisoformat(board.get_attribute("data-prop-schedule-date"))

              assert state=="live",state
              assert target.weekday()==6,target
              assert count>=1,count
              assert verified>=1,verified
              assert len([s for s in source_text.split(",") if s])>=2,source_text
              print("NFL_PROP_ANALYTICS_STEP2_BRANCH_SCHEDULE_GREEN",count)
              print("NFL_PROP_ANALYTICS_STEP2_BRANCH_SOURCE_ROUTER_GREEN",source_text)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=board.evaluate("""e => ({
                    scroll:e.scrollWidth,
                    client:e.clientWidth
                  })""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(
                          f"PROP_ANALYTICS_STEP2_OVERFLOW:{width}:{dims}"
                      )
                  print(f"NFL_PROP_ANALYTICS_STEP2_BRANCH_{width}_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(
                  base+"/?"+urlencode({
                      "ks_jump_sport":"NFL",
                      "ks_jump_market":"Passing Yards",
                  }),
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP2_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP2_STEP1_BRANCH_FROZEN_GREEN")

              passing.close()
              page.close()
              browser.close()

          print("NFL_PROP_ANALYTICS_STEP2_BRANCH_GREEN")
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1200 artifacts/nfl-prop-analytics-step2/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/prop_analytics_step2_pid ]; then
            kill "$(cat /tmp/prop_analytics_step2_pid)" 2>/dev/null || true
          fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Step 2 schedule truth and freeze
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from urllib.parse import urlencode

          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=120):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP2_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def find_combo(page,name,timeout=90):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role("combobox",name=name,exact=True)
                          if loc.count()==1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP2_PUBLIC_COMBO_NOT_READY:"+name)

          def choose(page,name,value,timeout=30):
              _,combo=find_combo(page,name)
              combo.click(timeout=10000)
              page.keyboard.type(value,delay=20)
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for candidate in page.frames:
                      try:
                          opt=candidate.get_by_role("option",name=value,exact=True)
                          if opt.count()>=1:
                              opt.first.click(timeout=10000)
                              return True
                      except Exception:
                          pass
                  page.wait_for_timeout(175)
              return False

          def open_step2(browser):
              deadline=time.monotonic()+1200
              last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(base+"/",wait_until="domcontentloaded",timeout=120000)
                      choose(page,"🏟️ Sport","NFL")
                      if not choose(page,"🎯 NFL Market","Prop Analytics"):
                          last="PROP_ANALYTICS_STEP2_OPTION_NOT_PUBLISHED"
                          context.close()
                          time.sleep(8)
                          continue

                      _,owner=find(page,'[data-nfl-prop-analytics-route="v1"]',90)
                      _,board=find(page,'[data-nfl-prop-analytics-step2-schedule="v1"]',120)
                      state=board.get_attribute("data-prop-schedule-state")
                      count=int(board.get_attribute("data-prop-schedule-count") or 0)
                      verified=int(board.get_attribute("data-prop-schedule-verified-count") or 0)
                      source_text=board.get_attribute("data-prop-schedule-sources") or ""
                      if state!="live" or count<1 or verified<1:
                          last=f"STEP2_NOT_LIVE:{state}:{count}:{verified}"
                          context.close()
                          time.sleep(8)
                          continue
                      if len([s for s in source_text.split(",") if s])<2:
                          last="STEP2_SOURCE_ROUTER_NOT_READY:"+source_text
                          context.close()
                          time.sleep(8)
                          continue
                      return context,page,owner,board
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PROP_ANALYTICS_STEP2_PUBLIC_DEPLOY_WAIT",last)
                      try:
                          context.close()
                      except Exception:
                          pass
                      time.sleep(8)
              raise RuntimeError("PROP_ANALYTICS_STEP2_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
              )
              context,page,owner,board=open_step2(browser)

              assert owner.get_attribute("data-prop-analytics-owner")=="nfl_prop_analytics_hub_v1"
              assert owner.get_attribute("data-prop-analytics-step")=="1"

              target=date.fromisoformat(board.get_attribute("data-prop-schedule-date"))
              count=int(board.get_attribute("data-prop-schedule-count"))
              verified=int(board.get_attribute("data-prop-schedule-verified-count"))
              source_text=board.get_attribute("data-prop-schedule-sources") or ""

              assert target.weekday()==6,target
              assert count>=1,count
              assert verified>=1,verified
              print("NFL_PROP_ANALYTICS_STEP2_PUBLIC_SCHEDULE_GREEN",count)
              print("NFL_PROP_ANALYTICS_STEP2_PUBLIC_SOURCE_ROUTER_GREEN",source_text)
              print("NFL_PROP_ANALYTICS_STEP2_PUBLIC_VERIFIED_GREEN",verified)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=board.evaluate("""e => ({
                    scroll:e.scrollWidth,
                    client:e.clientWidth
                  })""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(
                          f"PROP_ANALYTICS_STEP2_PUBLIC_OVERFLOW:{width}:{dims}"
                      )
                  print(f"NFL_PROP_ANALYTICS_STEP2_PUBLIC_{width}_GREEN")

              passing=context.new_page()
              passing.goto(
                  base+"/?"+urlencode({
                      "ks_jump_sport":"NFL",
                      "ks_jump_market":"Passing Yards",
                  }),
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP2_PASSING_YARDS_PUBLIC_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP2_STEP1_PUBLIC_FROZEN_GREEN")

              passing.close()
              page.close()
              context.close()
              browser.close()

          print("NFL_PROP_ANALYTICS_STEP2_GREEN")
          print("NFL_PROP_ANALYTICS_STEP2_PUBLIC_GREEN")
          print("NFL_PROP_ANALYTICS_STEP2_FROZEN")
          PY          page2_polish_step2_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step2-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_page2_unified_roster_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step2_v1.py' | sort)"

