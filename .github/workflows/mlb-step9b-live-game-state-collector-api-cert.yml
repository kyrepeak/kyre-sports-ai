name: MLB Step9B live game state collector API certification

on:
  push:
    branches:
      - mlb-step9b-live-game-state-collector-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step9b-live-game-state-collector-api-cert
  cancel-in-progress: false

env:
  STEP9B_BASE_SHA: b8b41c202225dd292ea5a0c8929f9ed13a804d1e

jobs:
  certify-live-game-state-collector-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests

      - name: Assert Step9B exact four-file MLB scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP9B_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/api/mlb.py|sports_api/collectors/mlb_live_game_state.py|tests/test_mlb_step9b_live_game_state_collector_api.py|\.github/workflows/mlb-step9b-live-game-state-collector-api-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP9B_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 4 ]; then
            echo "STEP9B_EXPECTED_EXACTLY_FOUR_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP9B_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          echo 'MLB_STEP9B_FOUR_FILE_SCOPE_OK'

      - name: Prove MLB router change is additive only
        shell: bash
        run: |
          set -euo pipefail
          read adds dels path <<<"$(git diff --numstat "$STEP9B_BASE_SHA"...HEAD -- sports_api/api/mlb.py)"
          echo "mlb.py additions=$adds deletions=$dels path=$path"
          if [ "$adds" -ne 63 ] || [ "$dels" -ne 0 ]; then
            echo 'STEP9B_MLB_ROUTER_NOT_EXPECTED_ADDITIVE_PATCH'
            exit 1
          fi
          git diff "$STEP9B_BASE_SHA"...HEAD -- sports_api/api/mlb.py
          echo 'MLB_STEP9B_ROUTER_ADDITIVE_ONLY_OK'

      - name: Prove V19 Live Game and frozen Step8/9A contracts are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP9B_BASE_SHA"...HEAD -- \
            app.py \
            live_game_hub_v182.py \
            live_game_hub_v19.py \
            live_game_hub_v191.py \
            live_game_hub_v192.py \
            live_game_hub_v1921.py \
            mlb_live_hub_v193.py \
            live_odds_feed.py \
            spread_engine.py \
            engine.py \
            history.py \
            sports_api/main.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/mlb_step7_final_freeze_v1.py \
            sports_api/mlb_step8a_player_prop_api_contract_v1.py \
            sports_api/mlb_step8c_pitcher_strikeouts_integration_v1.py \
            sports_api/mlb_step8d_player_hits_integration_v1.py \
            sports_api/mlb_step8e_hits_runs_rbi_integration_v1.py \
            sports_api/mlb_step8_final_freeze_v1.py \
            mlb_step8f_player_prop_presentation_v1.py \
            sports_api/mlb_step9a_live_game_state_api_contract_v1.py
          echo 'MLB_STEP9B_V19_STEP8_STEP9A_FROZEN'

      - name: Assert read-only exact-game-ID collector boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          collector = Path('sports_api/collectors/mlb_live_game_state.py').read_text()
          router = Path('sports_api/api/mlb.py').read_text()
          assert 'official_game_id' in collector
          assert 'gamePk' in collector
          assert 'team_name_matching_used' in collector
          assert 'fuzzy_matching_used' in collector
          assert 'synthetic_game_id_used' in collector
          assert 'method="GET"' in collector
          assert '@router.get("/live-game-state")' in router
          for forbidden in ('@router.post("/live-game-state")','@router.put("/live-game-state")','@router.patch("/live-game-state")','@router.delete("/live-game-state")'):
              assert forbidden not in router
          for forbidden in ('method="POST"','method="PUT"','method="PATCH"','method="DELETE"'):
              assert forbidden not in collector
          assert '_same_team' not in collector
          assert '_normalize_team_name' not in collector
          assert 'difflib' not in collector
          assert 'fuzzywuzzy' not in collector
          print('MLB_STEP9B_READ_ONLY_EXACT_GAME_ID_BOUNDARY_OK')
          PY

      - name: Prove frozen Step8 prerequisite remains valid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sports_api.mlb_step8_final_freeze_v1 import (
              FINAL_FREEZE_STATUS,
              STEP8_CERTIFICATION_MARKERS,
              STEP8G_BASE_MAIN_SHA,
              validate_final_step8_certification,
          )
          state = validate_final_step8_certification(
              STEP8_CERTIFICATION_MARKERS,
              runtime_base_sha=STEP8G_BASE_MAIN_SHA,
          )
          assert state['freeze_eligible'] is True
          assert state['freeze_status'] == FINAL_FREEZE_STATUS
          assert state['failures'] == []
          print('MLB_STEP9B_STEP8_FINAL_FREEZE_PREREQUISITE_OK')
          PY

      - name: Compile Step9B Python
        run: |
          python -m py_compile \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/api/mlb.py \
            tests/test_mlb_step9b_live_game_state_collector_api.py

      - name: Run Step9B targeted tests
        run: python -m pytest -q tests/test_mlb_step9b_live_game_state_collector_api.py

      - name: Run complete certified MLB regression through Step9B
        run: |
          python -m pytest -q \
            tests/test_mlb_official_game_id_join_v1.py \
            tests/test_mlb_live_market_context_v1.py \
            tests/test_mlb_market_probability_v1.py \
            tests/test_mlb_model_market_edge_v1.py \
            tests/test_mlb_price_discipline_v1.py \
            tests/test_mlb_market_movement_v1.py \
            tests/test_mlb_price_health_v1.py \
            tests/test_mlb_actionability_shadow_v1.py \
            tests/test_mlb_controlled_price_gate_v1.py \
            tests/test_mlb_price_gate_canary_v1.py \
            tests/test_mlb_price_gate_canary_streamlit_v1.py \
            tests/test_mlb_step6a_production_canary_v1.py \
            tests/test_mlb_step6b_canary_monitor_v1.py \
            tests/test_mlb_step6c_evidence_gate_v1.py \
            tests/test_mlb_step6d_production_expansion_v1.py \
            tests/test_mlb_step6e_25pct_stability_monitor_v1.py \
            tests/test_mlb_step6f_production_graduation_gate_v1.py \
            tests/test_mlb_step6g_controlled_graduation_v1.py \
            tests/test_mlb_step6_final_freeze_v1.py \
            tests/test_mlb_step7a_daily_game_picks_api_integration_v1.py \
            tests/test_mlb_step7b_spread_api_integration_v1.py \
            tests/test_mlb_step7c_moneyline_api_integration_v1.py \
            tests/test_mlb_step7d_total_api_integration_v1.py \
            tests/test_mlb_step7e_total_presentation_integration_v1.py \
            tests/test_mlb_step7_final_freeze_v1.py \
            tests/test_mlb_step8a_player_prop_api_contract_v1.py \
            tests/test_mlb_step8b_fanduel_player_prop_collector_api.py \
            tests/test_mlb_step8c_pitcher_strikeouts_integration_v1.py \
            tests/test_mlb_step8d_player_hits_integration_v1.py \
            tests/test_mlb_step8e_hits_runs_rbi_integration_v1.py \
            tests/test_mlb_step8f_player_prop_presentation_v1.py \
            tests/test_mlb_step8_final_freeze_v1.py \
            tests/test_mlb_step9a_live_game_state_api_contract_v1.py \
            tests/test_mlb_step9b_live_game_state_collector_api.py

      - name: Certify real MLB Stats API exact-ID live-state boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          from sports_api.collectors.mlb_live_game_state import collect_live_mlb_game_state
          from sports_api.mlb_step9a_live_game_state_api_contract_v1 import (
              API_CONNECTED,
              MATCH_METHOD,
              build_live_game_state_api_state,
              enforce_live_game_state_api_freshness,
              live_game_state_for_official_game_id,
          )

          day = datetime.now(ZoneInfo('America/Phoenix')).date().isoformat()
          now = datetime.now(timezone.utc)
          snapshot = collect_live_mlb_game_state(
              slate_date=day,
              now_utc=now,
              max_games=30,
          )
          print('STEP9B_LIVE_SLATE', {
              'date': day,
              'schedule_game_count': snapshot['schedule_game_count'],
              'candidate_game_count': snapshot['candidate_game_count'],
              'game_count': snapshot['game_count'],
              'detailed_feed_count': snapshot['detailed_feed_count'],
              'rejected_game_count': snapshot['rejected_game_count'],
          })
          assert snapshot['provider'] == 'MLB Stats API'
          assert snapshot['http_methods'] == ['GET']
          assert snapshot['team_name_matching_used'] is False
          assert snapshot['player_name_matching_used'] is False
          assert snapshot['fuzzy_matching_used'] is False
          assert snapshot['synthetic_game_id_used'] is False
          if not snapshot['games']:
              raise RuntimeError('STEP9B_LIVE_MLB_SLATE_EMPTY_OR_UNUSABLE')

          payload = {
              'data_type': 'mlb_live_game_state_api_response_v1',
              'schema_version': 1,
              'source': snapshot['provider'],
              'collected_at_utc': snapshot['collected_at_utc'],
              'games': snapshot['games'],
          }
          state = enforce_live_game_state_api_freshness(
              build_live_game_state_api_state(payload),
              as_of_utc=datetime.now(timezone.utc),
          )
          assert state['integration_status'] == API_CONNECTED, state['failures']
          assert state['feed_fresh'] is True
          assert state['match_method'] == MATCH_METHOD

          selected_id = snapshot['games'][0]['official_game_id']
          selected = collect_live_mlb_game_state(
              slate_date=day,
              official_game_id=selected_id,
              now_utc=datetime.now(timezone.utc),
              max_games=30,
          )
          assert selected['requested_official_game_id'] == selected_id
          assert selected['game_count'] == 1, selected
          assert selected['games'][0]['official_game_id'] == selected_id
          selected_payload = {
              'data_type': 'mlb_live_game_state_api_response_v1',
              'schema_version': 1,
              'source': selected['provider'],
              'collected_at_utc': selected['collected_at_utc'],
              'games': selected['games'],
          }
          selected_state = enforce_live_game_state_api_freshness(
              build_live_game_state_api_state(selected_payload),
              as_of_utc=datetime.now(timezone.utc),
          )
          context = live_game_state_for_official_game_id(
              selected_state,
              official_game_id=selected_id,
          )
          assert context is not None, selected_state['failures']
          assert context['official_game_id'] == selected_id
          assert live_game_state_for_official_game_id(
              selected_state,
              official_game_id=selected_id + 999999,
          ) is None
          print('STEP9B_LIVE_SELECTED', {
              'official_game_id': selected_id,
              'state': context['state'],
              'status': context['status'],
              'away_team': context['away_team'],
              'home_team': context['home_team'],
              'score': f"{context['away_runs']}-{context['home_runs']}",
              'feed_fresh': context['feed_fresh'],
          })
          print('MLB_STEP9B_REAL_MLB_EXACT_ID_LIVE_STATE_OK')
          PY

      - name: Final Step9B certification marker
        run: echo 'MLB_STEP9B_LIVE_GAME_STATE_COLLECTOR_API_GREEN'
