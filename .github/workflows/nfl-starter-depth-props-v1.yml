name: NFL Starter Depth Props V1

on:
  pull_request:
    paths:
      - "sports_api/nfl_prop_player_eligibility_v1.py"
      - "sports_api/collectors/nfl_rushing_yards_context_v1.py"
      - "sports_api/collectors/nfl_receiving_yards_context_v1.py"
      - "tests/test_nfl_prop_player_eligibility_v1.py"
      - "devsystem/nfl_starter_depth_props_v1.py"
      - ".github/workflows/nfl-starter-depth-props-v1.yml"

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run shared prop-player eligibility unit proof
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_prop_player_eligibility_v1.py
      - name: Run live 14-game starter/depth prop-player audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_starter_depth_props_v1.py
