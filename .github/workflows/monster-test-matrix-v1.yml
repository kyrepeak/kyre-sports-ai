name: Monster Test Matrix V1

on:
  pull_request:
    paths:
      - 'sports_api/monster_test_matrix_v1.py'
      - 'sports_api/monster_page_factory_v1.py'
      - 'tests/test_monster_test_matrix_v1.py'
      - '.github/workflows/monster-test-matrix-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monster-test-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install Test Matrix dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile Monster Test Matrix
        run: python -m py_compile sports_api/monster_test_matrix_v1.py

      - name: Run Monster Test Matrix contracts
        run: python -m pytest -q tests/test_monster_test_matrix_v1.py

      - name: Prove all canonical CFB weird-case scenarios pass
        run: |
          python -m sports_api.monster_test_matrix_v1 --sport CFB --json > /tmp/monster-test-matrix.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/monster-test-matrix.json').read_text())
          assert payload['version'] == 'MONSTER_TEST_MATRIX_V1'
          assert payload['passed'] is True
          assert payload['scenario_count'] >= 20
          assert payload['failed_count'] == 0
          assert payload['projection_weight'] == 0.0
          assert payload['may_modify_projection'] is False
          assert payload['may_modify_source_data'] is False
          required = {
              'baseline', 'temporal', 'availability', 'provider',
              'identity', 'lifecycle', 'cache', 'enrichment',
          }
          assert required <= set(payload['category_counts'])
          print(
              'Monster Test Matrix:',
              f"{payload['passed_count']}/{payload['scenario_count']} green",
              'categories=', sorted(payload['category_counts']),
          )
          PY

      - name: Prove shared matrix works across future sport totals shells
        run: |
          python - <<'PY'
          from sports_api.monster_test_matrix_v1 import run_totals_matrix

          for sport in ('NFL', 'MLB', 'WNBA', 'NBA', 'NHL'):
              report = run_totals_matrix(sport)
              assert report.passed, (sport, [r.as_dict() for r in report.results if not r.passed])
              print(f'{sport}: {report.passed_count}/{len(report.results)} green')
          PY

      - name: Prove Test Matrix remains outside production entrypoints
        run: |
          python - <<'PY'
          from sports_api.monster_dependency_map_v1 import build_dependency_map

          graph = build_dependency_map('.')
          report = graph.impact_report('sports_api/monster_test_matrix_v1.py')
          assert report['status'] == 'OK'
          assert report['impacted_entrypoints'] == []
          print(
              f"test_matrix blast_radius={report['blast_radius']} "
              f"entrypoints={report['impacted_entrypoints']}"
          )
          PY
