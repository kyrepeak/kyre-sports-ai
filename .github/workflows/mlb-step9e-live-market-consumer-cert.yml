name: MLB Step9E live market consumer certification

on:
  push:
    branches:
      - mlb-step9e-live-market-consumer-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step9e-live-market-consumer-cert
  cancel-in-progress: false

env:
  STEP9E_BASE_SHA: 3afe6ba0758cdfd5f742beee80bc7bfbf05d54e2

jobs:
  certify-live-market-consumer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests

      - name: Assert Step9E exact four-file scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP9E_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(app.py|mlb_step9e_live_market_consumer_v1.py|tests/test_mlb_step9e_live_market_consumer_v1.py|\.github/workflows/mlb-step9e-live-market-consumer-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP9E_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 4 ]; then
            echo "STEP9E_EXPECTED_EXACTLY_FOUR_CHANGED_PATHS_GOT_$count"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP9E_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          git diff --check "$STEP9E_BASE_SHA"...HEAD
          echo 'MLB_STEP9E_FOUR_FILE_SCOPE_OK'

      - name: Prove app hook is additive eleven lines only
        shell: bash
        run: |
          set -euo pipefail
          read adds dels path <<<"$(git diff --numstat "$STEP9E_BASE_SHA"...HEAD -- app.py)"
          echo "app.py additions=$adds deletions=$dels path=$path"
          if [ "$adds" -ne 11 ] || [ "$dels" -ne 0 ]; then
            echo 'STEP9E_APP_NOT_EXPECTED_ADDITIVE_11_0_PATCH'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text()
          assert text.count('from mlb_step9e_live_market_consumer_v1 import install_step9e_live_market_consumer') == 1
          assert text.count('_STEP9E_MLB_LIVE_MARKET_CONSUMER = install_step9e_live_market_consumer()') == 1
          assert text.count('legacy_odds_api_io_fallback_preserved') >= 1
          assert text.count('v1922_market_sync_function_preserved') >= 1
          install_at = text.index('_STEP9E_MLB_LIVE_MARKET_CONSUMER = install_step9e_live_market_consumer()')
          replay_at = text.index('source = _load_frozen_pre_live_app()')
          assert install_at < replay_at
          print('MLB_STEP9E_APP_ADDITIVE_SEAM_OK')
          PY

      - name: Prove frozen V19 market/model stack and Step9D runtime are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP9E_BASE_SHA"...HEAD -- \
            live_game_hub_v182.py \
            live_game_hub_v19.py \
            live_game_hub_v191.py \
            live_game_hub_v192.py \
            live_game_hub_v1921.py \
            mlb_live_hub_v193.py \
            live_odds_feed.py \
            spread_engine.py \
            engine.py \
            history.py \
            sports_api/main.py \
            sports_api/api/mlb.py \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_live_game_state.py \
            sports_api/collectors/mlb_fanduel_inplay.py \
            sports_api/mlb_official_game_id_join_v1.py \
            sports_api/mlb_live_market_context_v1.py \
            sports_api/mlb_step7_final_freeze_v1.py \
            sports_api/mlb_step8a_player_prop_api_contract_v1.py \
            sports_api/mlb_step8c_pitcher_strikeouts_integration_v1.py \
            sports_api/mlb_step8d_player_hits_integration_v1.py \
            sports_api/mlb_step8e_hits_runs_rbi_integration_v1.py \
            sports_api/mlb_step8_final_freeze_v1.py \
            mlb_step8f_player_prop_presentation_v1.py \
            sports_api/mlb_step9a_live_game_state_api_contract_v1.py \
            mlb_step9c_live_state_consumer_v1.py
          echo 'MLB_STEP9E_V19_STEP9D_MODEL_BYTES_FROZEN'

      - name: Assert pure API-first exact-gamePk transport boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('mlb_step9e_live_market_consumer_v1.py').read_text()
          assert '/api/v1/mlb/live-odds' in text
          assert 'market_context_from_game' in text
          assert 'official_mlb_game_id_exact' in text
          assert 'method="GET"' in text
          assert 'legacy_odds_api_io_fallback_preserved' in text
          assert 'v1922_market_sync_function_preserved' in text
          assert 'module.render_connection_setup = render_connection_setup_api_first' in text
          assert 'module.get_bookmakers = get_bookmakers_api_first' in text
          assert 'module.snapshots_for_games = snapshots_for_games_api_first' in text
          assert 'module._market_sync =' not in text
          assert 'v192._market_sync =' not in text
          assert 'v1921._market_sync =' not in text
          assert 'difflib' not in text
          assert 'fuzzywuzzy' not in text
          for forbidden in ('method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"'):
              assert forbidden not in text
          for forbidden in ('requests.post(', 'requests.put(', 'requests.patch(', 'requests.delete('):
              assert forbidden not in text
          print('MLB_STEP9E_API_FIRST_EXACT_ID_TRANSPORT_BOUNDARY_OK')
          PY

      - name: Compile Step9E Python and app seam
        run: |
          python -m py_compile \
            app.py \
            mlb_step9e_live_market_consumer_v1.py \
            tests/test_mlb_step9e_live_market_consumer_v1.py

      - name: Run Step9E targeted tests
        run: python -m pytest -q tests/test_mlb_step9e_live_market_consumer_v1.py

      - name: Prove installer leaves real V19.2.2 market sync function intact
        run: |
          python - <<'PY'
          import live_game_hub_v192 as v192
          import live_game_hub_v1921 as v1921
          from mlb_step9e_live_market_consumer_v1 import install_step9e_live_market_consumer

          before_192 = v192._market_sync
          before_1921 = v1921._market_sync
          result = install_step9e_live_market_consumer()
          assert v192._market_sync is before_192
          assert v1921._market_sync is before_1921
          assert getattr(v1921.snapshots_for_games, '_step9e_wrapper', False) is True
          assert getattr(v1921.render_connection_setup, '_step9e_wrapper', False) is True
          assert getattr(v1921.get_bookmakers, '_step9e_wrapper', False) is True
          assert result['v1922_market_sync_function_preserved'] is True
          assert result['model_math_impact'] is False
          assert result['simulation_math_impact'] is False
          assert result['probability_math_impact'] is False
          assert result['edge_grading_math_impact'] is False
          print('MLB_STEP9E_REAL_V1922_SYNC_OWNER_PRESERVED')
          PY

      - name: Run complete certified MLB regression through Step9E
        run: |
          python -m pytest -q \
            tests/test_mlb_official_game_id_join_v1.py \
            tests/test_mlb_live_market_context_v1.py \
            tests/test_mlb_market_probability_v1.py \
            tests/test_mlb_model_market_edge_v1.py \
            tests/test_mlb_price_discipline_v1.py \
            tests/test_mlb_market_movement_v1.py \
            tests/test_mlb_price_health_v1.py \
            tests/test_mlb_actionability_shadow_v1.py \
            tests/test_mlb_controlled_price_gate_v1.py \
            tests/test_mlb_price_gate_canary_v1.py \
            tests/test_mlb_price_gate_canary_streamlit_v1.py \
            tests/test_mlb_step6a_production_canary_v1.py \
            tests/test_mlb_step6b_canary_monitor_v1.py \
            tests/test_mlb_step6c_evidence_gate_v1.py \
            tests/test_mlb_step6d_production_expansion_v1.py \
            tests/test_mlb_step6e_25pct_stability_monitor_v1.py \
            tests/test_mlb_step6f_production_graduation_gate_v1.py \
            tests/test_mlb_step6g_controlled_graduation_v1.py \
            tests/test_mlb_step6_final_freeze_v1.py \
            tests/test_mlb_step7a_daily_game_picks_api_integration_v1.py \
            tests/test_mlb_step7b_spread_api_integration_v1.py \
            tests/test_mlb_step7c_moneyline_api_integration_v1.py \
            tests/test_mlb_step7d_total_api_integration_v1.py \
            tests/test_mlb_step7e_total_presentation_integration_v1.py \
            tests/test_mlb_step7_final_freeze_v1.py \
            tests/test_mlb_step8a_player_prop_api_contract_v1.py \
            tests/test_mlb_step8b_fanduel_player_prop_collector_api.py \
            tests/test_mlb_step8c_pitcher_strikeouts_integration_v1.py \
            tests/test_mlb_step8d_player_hits_integration_v1.py \
            tests/test_mlb_step8e_hits_runs_rbi_integration_v1.py \
            tests/test_mlb_step8f_player_prop_presentation_v1.py \
            tests/test_mlb_step8_final_freeze_v1.py \
            tests/test_mlb_step9a_live_game_state_api_contract_v1.py \
            tests/test_mlb_step9b_live_game_state_collector_api.py \
            tests/test_mlb_step9c_live_state_consumer_v1.py \
            tests/test_mlb_step9d_live_inplay_market_collector_api.py \
            tests/test_mlb_step9e_live_market_consumer_v1.py

      - name: Probe hosted Step9D endpoint through Step9E consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          from mlb_step9e_live_market_consumer_v1 import snapshot_for_official_game_id

          params = urlencode({'max_events': 30, 'fully_priced_only': 'true'})
          request = Request(
              f'https://kyre-sports-api.onrender.com/api/v1/mlb/live-odds?{params}',
              headers={'Accept': 'application/json', 'User-Agent': 'KyreSportsMLBStep9ECert/1.0'},
              method='GET',
          )
          with urlopen(request, timeout=90) as response:
              assert int(response.status) == 200
              payload = json.loads(response.read().decode('utf-8'))
          assert payload['data_type'] == 'mlb_inplay_odds_api_response_v1'
          assert payload['schema_version'] == 1
          assert payload['source'] == 'FanDuel'
          assert payload['market_phase'] == 'IN_PLAY'
          assert payload['fuzzy_matching_used'] is False
          assert payload['synthetic_game_id_used'] is False
          games = payload.get('games') or []
          print('STEP9E_HOSTED_LIVE_ODDS', {
              'game_count': payload.get('game_count'),
              'candidate_started_event_count': payload.get('candidate_started_event_count'),
              'matched_inplay_game_count': payload.get('matched_inplay_game_count'),
              'fully_priced_game_count': payload.get('fully_priced_game_count'),
          })
          if games:
              game_id = games[0]['official_game_id']
              snapshot = snapshot_for_official_game_id(game_id)
              assert snapshot is not None
              assert snapshot['official_game_id'] == game_id
              assert snapshot['source'] == 'FanDuel'
              assert snapshot['transport'] == 'kyre_sports_api_step9d'
              assert snapshot['match_method'] == 'official_mlb_game_id_exact'
              assert snapshot['fallback_matching_used'] is False
              assert snapshot['rows'] and snapshot['rows'][0]['Book'] == 'FanDuel'
              print('MLB_STEP9E_HOSTED_EXACT_GAMEPK_CONSUMER_OK', game_id)
          else:
              print('MLB_STEP9E_NO_FULLY_PRICED_INPLAY_GAME_AT_CERT_TIME_FAIL_CLOSED_OK')
          PY

      - name: Final Step9E certification marker
        run: echo 'MLB_STEP9E_LIVE_MARKET_CONSUMER_GREEN'
