name: CFB Game Total V163 Router V159 permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [freeze/cfb-game-total-v163-v159-production-215]

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze scope guard
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-game-total-v163-permanent-freeze-v4.yml",
              "cfb_game_total_v163_freeze_manifest_v4.json",
              "devsystem/task_ledgers/cfb-game-total-v163-permanent-freeze-v4.json",
          }
          if changed != expected:
              raise SystemExit("V163/V159 freeze branch changed active code: " + str(sorted(changed)))
          print("CFB_GAME_TOTAL_V163_V159_FREEZE_SCOPE=PASS")
          PY

      - name: Verify permanent-freeze metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v163_freeze_manifest_v4.json").read_text())
          assert m["version"] == 4
          assert m["baseline_commit"] == "4577325b681a9e46d808dd1055edc0626dc3f308"
          assert m["feature_pr"] == 580
          assert m["devsystem_pr_run"] == 1002
          assert m["browser_certification_run"] == 4
          assert m["production_verification_run"] == 215
          c=m["contract"]
          assert c["active_page"] == "cfb_game_total_clean_page_v14"
          assert c["active_router"] == "streamlit_memory_lazy_router_v159"
          assert c["production_verifier"] == "devsystem.production_verify_v4"
          assert c["production_heartbeat"] == "CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE"
          assert c["event_query_key"] == "ks_cfb_game_total_event_id"
          assert c["visible_game_selector"] is True
          assert c["horizontal_game_scroller"] is True
          assert c["official_espn_event_identity"] is True
          assert c["selected_game_survives_refresh"] is True
          assert c["selected_game_switches_full_analysis"] is True
          assert c["projection_math_changed"] is False
          assert c["distribution_math_changed"] is False
          assert c["step12_qualification_changed"] is False
          assert c["top5_ranking_changed"] is False
          assert c["api_model_behavior_changed"] is False
          assert c["sportsbook_projection_influence"] == 0.0
          assert c["future_changes_must_be_additive"] is True
          assert c["permanently_frozen"] is True
          print("CFB_GAME_TOTAL_V163_V159_FREEZE_METADATA=PASS")
          PY

      - name: Verify every frozen blob exactly
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v163_freeze_manifest_v4.json").read_text())
          failures=[]
          for path, expected in m["exact_blobs"].items():
              actual=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"], text=True).strip()
              if actual != expected:
                  failures.append(f"{path}: expected {expected}, got {actual}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("CFB_GAME_TOTAL_V163_V159_EXACT_BLOBS=PASS", len(m["exact_blobs"]))
          PY

      - name: Enforce frozen V163 selector boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path("app.py").read_text(encoding="utf-8")
          page=Path("cfb_game_total_clean_page_v14.py").read_text(encoding="utf-8")
          router=Path("streamlit_memory_lazy_router_v159.py").read_text(encoding="utf-8")
          browser=Path("devsystem/cfb_game_total_browser_qa_v4.py").read_text(encoding="utf-8")
          production=Path("devsystem/production_verify_v4.py").read_text(encoding="utf-8")
          browser_workflow=Path(".github/workflows/cfb-game-total-v163-browser.yml").read_text(encoding="utf-8")
          production_workflow=Path(".github/workflows/devsystem-production-verification.yml").read_text(encoding="utf-8")

          required={
              "app": (app, [
                  "CFB Game Total V163 activation",
                  "from streamlit_memory_lazy_router_v159 import record_bootstrap_import_ms, render_app",
                  "from streamlit_memory_lazy_router_v158 import record_bootstrap_import_ms, render_app",
                  "Sportsbook projection influence stays 0.0%",
              ]),
              "page": (page, [
                  'FROZEN_PRESENTATION = "cfb_game_total_clean_page_v13"',
                  'EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"',
                  'GAMES ON THIS DAY',
                  'data-testid="gt163-game-strip"',
                  'aria-current="true"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
                  'MAY_MODIFY_PROJECTION = False',
              ]),
              "router": (router, [
                  'FROZEN_ROUTER = "streamlit_memory_lazy_router_v158"',
                  'ACTIVE_PAGE = "cfb_game_total_clean_page_v14"',
                  'PRODUCTION_HEARTBEAT = "CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE"',
                  'LEGACY_V162_HEARTBEAT = "CFB_GAME_TOTAL_V162_PRODUCTION_ACTIVE"',
                  'LEGACY_V161_HEARTBEAT = "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
              ]),
              "browser": (browser, [
                  'EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"',
                  'GAMES ON THIS DAY',
                  'CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE',
                  'Expected at least two verified games',
              ]),
              "production": (production, [
                  'FROZEN_VERIFIER = "devsystem.production_verify_v3"',
                  'EXPECTED_ROUTER = "streamlit_memory_lazy_router_v159"',
                  'GAME_TOTAL_REQUIRED_HEARTBEAT = "CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE"',
                  'GAME_SELECTOR_REQUIRED_TEXT = "GAMES ON THIS DAY"',
                  'EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"',
              ]),
              "browser_workflow": (browser_workflow, [
                  'tests/test_devsystem_production_verify_v4.py',
                  'devsystem/production_verify_v4.py',
                  'Certify visible game switching and event persistence',
              ]),
              "production_workflow": (production_workflow, [
                  'tests/test_devsystem_production_verify_v4.py',
                  'python devsystem/production_verify_v4.py',
              ]),
          }
          for label, (source, tokens) in required.items():
              for token in tokens:
                  if token not in source:
                      raise SystemExit(f"missing frozen {label} marker: {token}")
          print("CFB_GAME_TOTAL_V163_V159_ROUTE_SELECTOR_FIREWALL=PASS")
          PY

      - name: Compile frozen V163 V159 surface
        run: |
          python -m py_compile \
            app.py \
            cfb_game_total_clean_page_v14.py \
            streamlit_memory_lazy_router_v159.py \
            devsystem/cfb_game_total_browser_qa_v4.py \
            devsystem/production_verify_v4.py \
            tests/test_cfb_game_total_v163_game_selector.py \
            tests/test_devsystem_production_verify_v4.py

      - name: Certification marker
        run: echo "CFB_GAME_TOTAL_V163_V159_PERMANENT_FREEZE_GREEN"
