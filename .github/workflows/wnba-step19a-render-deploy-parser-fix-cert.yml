name: WNBA Step 19A production live compatibility certification

on:
  push:
    branches:
      - wnba-step19a-render-deploy-parser-fix-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  STEP19A_TARGET_SHA: 03cfdf0c48094dd35e1f8f491af2bd08f0c4c8b6

jobs:
  certify-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: wnba-render-staging
    steps:
      - name: Checkout exact non-production certified Step19A candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP19A_TARGET_SHA }}
          fetch-depth: 500

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-persistence.txt
          python -m pip install pytest

      - name: Re-certify Step19A compatibility and 57-failure recovery
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step19a_draftkings_sportscontent.py
          python -m py_compile sports_api/wnba_step19a_live_compat.py
          python -m py_compile sports_api/wnba_step19a_step17b_bridge.py
          pytest -q tests/test_wnba_step19a_draftkings_sportscontent.py tests/test_wnba_step19a_live_compat.py
          pytest -q tests/test_wnba_step19a_circuit_recovery.py
          git merge-base --is-ancestor d5da3830ab2194074f2e077d6b1ea41d4bc98633 "$STEP19A_TARGET_SHA"
          git diff --exit-code 70aa357df98ef8ce931a249677484fd205f25467.."$STEP19A_TARGET_SHA" -- \
            sports_api/wnba_step11_draftkings_provider.py \
            sports_api/wnba_step11_fanduel_provider.py \
            sports_api/wnba_step11_multibook_shadow_board.py \
            sports_api/wnba_step11_controlled_automation.py \
            sports_api/wnba_reconciled_direct_sync.py \
            sports_api/wnba_step6d_direct_integration.py \
            sports_api/wnba_step17b_always_on_runtime.py

      - name: Build and boot exact production Docker image
        run: |
          set -euo pipefail
          docker build --build-arg WNBA_RELEASE_REVISION="$STEP19A_TARGET_SHA" --build-arg WNBA_RELEASE_ID="wnba-step19a-live-compat" -f sports_api/Dockerfile -t "kyre-step19a:$STEP19A_TARGET_SHA" .
          cid=$(docker run -d -e PORT=8000 -e WEB_CONCURRENCY=1 -p 18000:8000 "kyre-step19a:$STEP19A_TARGET_SHA")
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then echo STEP19A_DOCKER_HEALTH_OK; exit 0; fi
            sleep 2
          done
          exit 1

      - name: Live read-only two-book WNBA provider probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          from sports_api import wnba_step19a_step17b_bridge
          from sports_api import wnba_step11_draftkings_provider as dk
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step19a_draftkings_sportscontent as s19
          now=datetime.now(timezone.utc); slate=now.astimezone(ZoneInfo('America/New_York')).date().isoformat()
          env=dict(os.environ); env.update({
              s19.STEP19A_ENABLED_ENV:'true', s19.STEP19A_SITE_ENV:'dkusaz',
              'WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true','WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true',
              'WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true','WNBA_STEP10_FASTAPI_ENABLED':'true',
              'WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true','WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true',
              'WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true','WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true',
          })
          def records(result):
              attempts=(result.get('provider_refresh') or {}).get('attempts') or []
              assert len(attempts)==1 and attempts[0].get('ok') is True, attempts
              return (attempts[0].get('payload') or {}).get('records') or []
          dkr=records(dk.fetch_step11a_draftkings_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=env))
          fdr=records(fd.fetch_step11c_fanduel_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=env))
          assert dkr and fdr
          for name,rows in [('DraftKings',dkr),('FanDuel',fdr)]:
              stats={str(r.get('stat')) for r in rows}
              assert {'points','rebounds','assists','pra'} <= stats, (name,stats)
              assert all(r.get('over_price') is not None and r.get('under_price') is not None for r in rows), name
          common={(str(r['game_id']),int(r['player_id'])) for r in dkr} & {(str(r['game_id']),int(r['player_id'])) for r in fdr}
          assert common
          print('STEP19A_TWO_BOOK_LIVE_PROBE_OK', {'slate':slate,'draftkings':len(dkr),'fanduel':len(fdr),'common_players':len(common)})
          PY

      - name: Capture safe production state and configure additive Step19A gate
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sid='srv-da84q6ifngtc73bdbm6g'; base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step19a-live-compat/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode(); r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          def unwrap(value):
              if isinstance(value,dict) and isinstance(value.get('deploy'),dict): return value['deploy']
              return value if isinstance(value,dict) else {}
          deploys=req('GET',f'/services/{sid}/deploys?limit=20')
          rows=deploys if isinstance(deploys,list) else ((deploys or {}).get('items') or (deploys or {}).get('data') or [])
          live=None
          for row in rows:
              d=unwrap(row)
              if str(d.get('status','')).lower()=='live': live=d; break
          if not live: raise SystemExit('No prior live Render deployment')
          commit=live.get('commit'); prior_sha=(commit.get('id') if isinstance(commit,dict) else commit)
          if not prior_sha or len(str(prior_sha))!=40: raise SystemExit('Could not capture prior live commit SHA')
          envs=req('GET',f'/services/{sid}/env-vars') or []
          erows=envs if isinstance(envs,list) else ((envs or {}).get('items') or (envs or {}).get('data') or [])
          values={}
          for row in erows:
              e=row.get('envVar') if isinstance(row,dict) and isinstance(row.get('envVar'),dict) else row
              if isinstance(e,dict): values[str(e.get('key') or '')]=e.get('value')
          watched=['WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED','WNBA_STEP19A_DRAFTKINGS_SITE','WNBA_DEPLOYMENT_REVISION','WNBA_RELEASE_ID']
          prior={key:values.get(key) for key in watched if key in values}
          open('/tmp/step19a-prior-env.json','w').write(json.dumps(prior))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'STEP19A_RENDER_SERVICE_ID={sid}\nSTEP19A_PRIOR_COMMIT_SHA={prior_sha}\nSTEP19A_RENDER_URL=https://kyre-sports-api.onrender.com\n')
          req('PATCH',f'/services/{sid}',{'autoDeploy':'no'})
          desired={
              'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true',
              'WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz',
              'WNBA_DEPLOYMENT_REVISION':os.environ['STEP19A_TARGET_SHA'],
              'WNBA_RELEASE_ID':'wnba-step19a-live-compat',
          }
          for key,value in desired.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          print('STEP19A_ADDITIVE_GATE_CONFIGURED_PRIOR',prior_sha)
          PY

      - name: Deploy exact Step19A candidate with wrapped-response support
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          sid=os.environ['STEP19A_RENDER_SERVICE_ID']; sha=os.environ['STEP19A_TARGET_SHA']; base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step19a-live-compat/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode(); r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          def unwrap(value):
              if isinstance(value,dict) and isinstance(value.get('deploy'),dict): return value['deploy']
              return value if isinstance(value,dict) else {}
          raw=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=unwrap(raw).get('id')
          if not did: raise SystemExit('Render returned no deploy ID after envelope normalization')
          print('STEP19A_RENDER_DEPLOY_CREATED',did)
          for _ in range(180):
              detail=unwrap(req('GET',f'/services/{sid}/deploys/{did}') or {}); status=str(detail.get('status','')).lower()
              if status=='live': print('STEP19A_EXACT_COMMIT_LIVE',did,sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('Step19A deploy failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Step19A deploy timed out')
          PY

      - name: Verify Step17B host safety and Step19A transport
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=30) as r: return json.loads(r.read().decode())
          last=None
          for _ in range(36):
              try:
                  h=get('/health'); direct=get('/api/v1/wnba/markets/direct/draftkings/status'); runtime=get('/api/v1/wnba/runtime/step17b')
                  last=(h,direct,runtime); dk=direct.get('draftkings') or {}
                  if h.get('status')=='ok' and direct.get('direct_sync_active') is False and dk.get('model_version')=='wnba_step_19a_draftkings_sportscontent_v1' and dk.get('ready') is True and dk.get('secret_required') is False and runtime.get('legacy_production_switches_enabled') is False:
                      print('STEP19A_PRODUCTION_SAFETY_OK'); break
              except Exception as exc: last=repr(exc)
              time.sleep(5)
          else: raise SystemExit('Step19A production safety did not converge: '+repr(last))
          PY

      - name: Verify natural circuit recovery and consumer provider readiness
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base='https://kyre-sports-api.onrender.com'
          today=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(path):
              with urllib.request.urlopen(base+path,timeout=30) as r: return json.loads(r.read().decode())
          last=None
          # Intentionally only observe. No circuit reset or controller mutation is permitted.
          for attempt in range(72):
              try:
                  runtime=get('/api/v1/wnba/runtime/step17b'); consumer=get('/api/v1/wnba/consumer/latest'); last=(runtime,consumer)
                  cr=consumer.get('runtime') or {}; board=consumer.get('board') or {}; snap=consumer.get('snapshot') or {}
                  circuit=str(cr.get('circuit_state') or '').lower(); failures=int(cr.get('consecutive_failures') or 0)
                  reason=str(consumer.get('reason') or ''); health=str(consumer.get('health') or '')
                  provider_ready=(reason!='provider_transient_not_ready' and health!='blocked')
                  closed=(circuit=='closed' and failures==0)
                  current_slate=(str(runtime.get('last_slate_date') or consumer.get('slate_date') or '')==today)
                  scheduler_ok=(int(runtime.get('success_count') or 0)>=1 and runtime.get('last_error_class') is None and runtime.get('last_status')=='cycle_completed')
                  snapshot_ok=bool(snap.get('snapshot_content_sha256'))
                  available=consumer.get('available') is True and board.get('available') is True
                  if scheduler_ok and current_slate and closed and provider_ready and snapshot_ok and available:
                      print('STEP19A_NATURAL_RECOVERY_AND_CONSUMER_OK', {
                          'attempt':attempt+1,'slate':today,'circuit':circuit,'failures':failures,
                          'consumer_available':consumer.get('available'),'qualified_props':board.get('qualified_prop_count'),
                          'snapshot_hash':str(snap.get('snapshot_content_sha256'))[:12],
                      }); break
                  if attempt % 6 == 0:
                      print('STEP19A_RECOVERY_WAIT', {'attempt':attempt+1,'circuit':circuit,'failures':failures,'reason':reason,'health':health,'last_status':runtime.get('last_status')})
              except Exception as exc: last=repr(exc)
              time.sleep(10)
          else: raise SystemExit('Step19A circuit/consumer did not naturally recover: '+repr(last))
          PY

      - name: Restore prior production state on failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          sid=os.environ.get('STEP19A_RENDER_SERVICE_ID'); prior_sha=os.environ.get('STEP19A_PRIOR_COMMIT_SHA')
          if not sid or not prior_sha: raise SystemExit(0)
          base='https://api.render.com/v1'; headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step19a-rollback/4'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode(); r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          def unwrap(value):
              if isinstance(value,dict) and isinstance(value.get('deploy'),dict): return value['deploy']
              return value if isinstance(value,dict) else {}
          try: prior=json.load(open('/tmp/step19a-prior-env.json'))
          except Exception: prior={}
          watched=['WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED','WNBA_STEP19A_DRAFTKINGS_SITE','WNBA_DEPLOYMENT_REVISION','WNBA_RELEASE_ID']
          for key in watched:
              if key in prior: req('PUT',f'/services/{sid}/env-vars/{key}',{'value':prior[key]})
              else:
                  try: req('DELETE',f'/services/{sid}/env-vars/{key}')
                  except Exception: pass
          raw=req('POST',f'/services/{sid}/deploys',{'commitId':prior_sha,'clearCache':'do_not_clear'}) or {}; did=unwrap(raw).get('id')
          if not did: raise SystemExit('Rollback could not obtain Render deploy ID')
          for _ in range(120):
              detail=unwrap(req('GET',f'/services/{sid}/deploys/{did}') or {}); status=str(detail.get('status','')).lower()
              if status=='live': print('STEP19A_PRIOR_COMMIT_REDEPLOYED',prior_sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('Rollback redeploy failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Rollback redeploy timed out')
          PY
