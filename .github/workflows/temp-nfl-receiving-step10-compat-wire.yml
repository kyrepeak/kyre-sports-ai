name: TEMP NFL Receiving Step 10 Compat Wire

on:
  push:
    branches: [nfl-receiving-yards-v10-final-polish-speed-cert]
    paths:
      - '.github/workflows/temp-nfl-receiving-step10-compat-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-receiving-yards-v10-final-polish-speed-cert
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve prior router certification imports under TYPE_CHECKING
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = '    from streamlit_memory_lazy_router_v118 import record_bootstrap_import_ms, render_app\n'
          new = (
              old
              + '    from streamlit_memory_lazy_router_v119 import record_bootstrap_import_ms, render_app\n'
              + '    from streamlit_memory_lazy_router_v120 import record_bootstrap_import_ms, render_app\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'guard failed: expected one V118 compatibility import, got {text.count(old)}')
          if '    from streamlit_memory_lazy_router_v119 import record_bootstrap_import_ms, render_app\n' in text:
              raise SystemExit('guard failed: V119 compatibility import already present')
          if '    from streamlit_memory_lazy_router_v120 import record_bootstrap_import_ms, render_app\n' in text:
              raise SystemExit('guard failed: V120 compatibility import already present')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('RECEIVING_STEP10_DESCENDANT_COMPAT_GREEN')
          PY

      - name: Commit compatibility wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kyrepeak
          git config user.email kyrewhite15@gmail.com
          git add app.py
          git diff --cached --check
          git commit -m 'Preserve Receiving prior-router certification compatibility'
          git push origin HEAD:nfl-receiving-yards-v10-final-polish-speed-cert
