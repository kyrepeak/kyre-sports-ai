name: NFL Game Totals Market API V1

on:
  push:
    branches:
      - monster/nfl-game-totals-api-v1
  pull_request:
    branches: [main]
    paths:
      - "sports_api/api/nfl_game_totals_market_v1.py"
      - "sports_api/collectors/nfl_fanduel_game_totals_v1.py"
      - "sports_api/main.py"
      - "tests/test_nfl_game_totals_market_v1.py"
      - "tests/test_nfl_fanduel_game_totals_v1.py"
      - ".github/workflows/nfl-game-totals-market-api-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Freeze-scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(sports_api/api/nfl_game_totals_market_v1\.py|sports_api/collectors/nfl_fanduel_game_totals_v1\.py|sports_api/main\.py|tests/test_nfl_game_totals_market_v1\.py|tests/test_nfl_fanduel_game_totals_v1\.py|\.github/workflows/nfl-game-totals-market-api-v1\.yml)$' || true)"
          if [ -n "$disallowed" ]; then
            echo "Disallowed files changed in the Game Totals certification scope:"
            echo "$disallowed"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ei '(nfl.*spread|spread.*nfl|v136|moneyline)'; then
            echo "Frozen NFL Spread V136 / Moneyline boundary was touched."
            exit 1
          fi

      - name: Compile new contract
        run: |
          python -m py_compile \
            sports_api/api/nfl_game_totals_market_v1.py \
            sports_api/collectors/nfl_fanduel_game_totals_v1.py \
            tests/test_nfl_game_totals_market_v1.py \
            tests/test_nfl_fanduel_game_totals_v1.py

      - name: Contract and collector tests
        run: |
          python -m pytest -q \
            tests/test_nfl_game_totals_market_v1.py \
            tests/test_nfl_fanduel_game_totals_v1.py

      - name: Route/startup registration smoke
        run: |
          python - <<'PY'
          from sports_api.main import app

          paths = {route.path for route in app.routes}
          assert "/api/v1/nfl/totals/market" in paths
          print("NFL Game Totals route registered exactly once:", sum(route.path == "/api/v1/nfl/totals/market" for route in app.routes))
          assert sum(route.path == "/api/v1/nfl/totals/market" for route in app.routes) == 1
          PY

      - name: Projection-isolation guard
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("sports_api/api/nfl_game_totals_market_v1.py").read_text()
          assert '"sportsbook_projection_weight": 0.0' in api
          assert '"projection_use": "context_only"' in api
          assert '"wager_actions_enabled": False' in api
          print("Sportsbook projection influence locked at 0.0%")
          PY
