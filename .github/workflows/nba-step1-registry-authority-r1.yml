name: NBA Step 1 Registry Authority R3

on:
  push:
    branches:
      - nba-step1-registry-authority-r1
    paths:
      - .github/workflows/nba-step1-registry-authority-r1.yml

permissions:
  contents: write

concurrency:
  group: nba-step1-registry-authority-r1
  cancel-in-progress: false

jobs:
  retarget-exact-thaw:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final proof head and retarget only the existing NBA Step-1 thaw
        shell: bash
        env:
          EXPECTED_MAIN: 9a1fe7ba34e1325e544dc76f0a6798478511a47c
          FINAL_HEAD: 5ad719200a6c2520d7c1d9fe8a2082b4863a5abc
          FINAL_BRANCH: nba-step1-proof-head-staging-r1
          EXPECTED_REGISTRY_HEAD: 5770c640a002a9f34246ad0b7cdc5cd5cb4ffd9c
          REGISTRY_BRANCH: monster-frozen-artifact-registry
          OLD_TARGET: d787e29f14cd842e6d5af14c25711caf117d566a
          THAW_ID: THAW-NBA-OU-STEP1-CLASSIFIER-R1
        run: |
          set -euo pipefail

          git fetch --no-tags origin main "$FINAL_BRANCH" "$REGISTRY_BRANCH" --force
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$FINAL_BRANCH)" = "$FINAL_HEAD"
          test "$(git rev-parse origin/$REGISTRY_BRANCH)" = "$EXPECTED_REGISTRY_HEAD"

          git checkout --detach "origin/$FINAL_BRANCH"
          changed_since_old="$(git diff --name-only "$OLD_TARGET" "$FINAL_HEAD")"
          test "$changed_since_old" = "devsystem/task_ledgers/nba-over-under-step1-page-isolation-v1.json"
          python - <<'PY'
          import json, subprocess
          ledger = json.loads(subprocess.check_output([
              'git','show','HEAD:devsystem/task_ledgers/nba-over-under-step1-page-isolation-v1.json'
          ], text=True))
          assert ledger['status'] == 'DONE', ledger['status']
          assert ledger['action_log']['head_chain_hash'] == '0' * 64
          assert ledger['action_log']['events'] == []
          assert ledger['action_log']['consumed_receipts'] == []
          PY
          python devsystem/action_ledger_v2.py verify-pr --base "$EXPECTED_MAIN" --head "$FINAL_HEAD"

          git checkout -B registry-write "origin/$REGISTRY_BRANCH"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          path = Path('devsystem/frozen_artifact_registry_state_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['revision'] == 127, payload['revision']
          assert payload['source_main_sha'] == os.environ['EXPECTED_MAIN']
          thaws = payload.get('active_thaws') or []
          assert len(thaws) == 1, thaws
          grant = thaws[0]
          assert grant['thaw_id'] == os.environ['THAW_ID'], grant
          assert grant['status'] == 'ACTIVE', grant
          assert grant['target_head_sha'] == os.environ['OLD_TARGET'], grant

          expected_files = {
              'devsystem/change_classifier_v1.py': {
                  'from_blob': '6f151c5ece852a461e37af1a319712f0ec384890',
                  'to_blob': '352074abc9d5f807ef6bfad593743c19cef49e00',
              },
              'tests/test_devsystem_change_classifier_v1.py': {
                  'from_blob': '09312069fdc91928196bfee9ee34a772394ac930',
                  'to_blob': '265129d2ce89da49426b36059294fcba381cfb7b',
              },
          }
          assert grant['files'] == expected_files, grant['files']

          grant['target_head_sha'] = os.environ['FINAL_HEAD']
          payload['revision'] = 128
          payload['source_main_sha'] = os.environ['EXPECTED_MAIN']
          unsigned = dict(payload)
          unsigned.pop('state_hash', None)
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), ensure_ascii=True)
          payload['state_hash'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print('NBA_STEP1_THAW_RETARGETED=' + os.environ['FINAL_HEAD'])
          print('NBA_STEP1_REGISTRY_REVISION=128')
          print('NBA_STEP1_REGISTRY_STATE_HASH=' + payload['state_hash'])
          PY

          git config user.name 'nba-step1-registry-authority'
          git config user.email 'actions@users.noreply.github.com'
          git add devsystem/frozen_artifact_registry_state_v1.json
          git commit -m 'registry: retarget NBA Step 1 thaw after ledger finalization'
          git push --force-with-lease=refs/heads/${REGISTRY_BRANCH}:${EXPECTED_REGISTRY_HEAD} origin HEAD:${REGISTRY_BRANCH}
