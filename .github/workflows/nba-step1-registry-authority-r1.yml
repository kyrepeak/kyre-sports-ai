name: NBA Registry Authority Step 2 R1

on:
  push:
    branches:
      - nba-step1-registry-authority-r1
    paths:
      - .github/workflows/nba-step1-registry-authority-r1.yml

permissions:
  contents: write

concurrency:
  group: nba-step1-registry-authority-r1
  cancel-in-progress: false

jobs:
  authorize-step2-targeted-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact NBA Step 2 CI candidate and mint thaw
        shell: bash
        env:
          EXPECTED_MAIN: eb4ed13666055cd426d57f154641064ad73e535e
          PRODUCT_HEAD: 7e43334ffa08873cda8019a6f16533a7d5917796
          PRODUCT_BRANCH: nba-step2-atomic-staging-r1
          EXPECTED_REGISTRY_HEAD: edfdc12d9dec459b611b09cf2ff2ec42e30f284b
          REGISTRY_BRANCH: monster-frozen-artifact-registry
          BASE_WORKFLOW_BLOB: eaf314176069a90ab4de25a9f73933b708951768
          THAW_ID: THAW-NBA-OU-STEP2-TARGETED-CI-R1
        run: |
          set -euo pipefail

          git fetch --no-tags origin main "$PRODUCT_BRANCH" "$REGISTRY_BRANCH" --force
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$PRODUCT_BRANCH)" = "$PRODUCT_HEAD"
          test "$(git rev-parse origin/$REGISTRY_BRANCH)" = "$EXPECTED_REGISTRY_HEAD"

          git checkout -B step2-candidate "origin/$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD:.github/workflows/devsystem-targeted-ci.yml)" = "$BASE_WORKFLOW_BLOB"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/devsystem-targeted-ci.yml')
          text = path.read_text(encoding='utf-8')
          assert '  nba-step2-data-foundation:\n' not in text

          job = '''  nba-step2-data-foundation:\n    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]\n    if: >-\n      needs.classify.outputs.nba == 'true' ||\n      needs.classify.outputs.core == 'true'\n    runs-on: ubuntu-24.04\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install NBA Step 2 proof dependency\n        run: python -m pip install --disable-pip-version-check -q pytest\n      - name: Run NBA Over/Under Step 2 data + Kyre API contracts\n        run: >-\n          python -m pytest -q\n          tests/test_nba_data_foundation_v1.py\n          tests/test_nba_kyre_api_bridge_v1.py\n\n'''
          marker = '  core-smoke:\n'
          assert text.count(marker) == 1
          text = text.replace(marker, job + marker, 1)

          needs_old = '      - nfl-critical\n      - core-smoke\n'
          assert text.count(needs_old) == 2, text.count(needs_old)
          text = text.replace(
              needs_old,
              '      - nfl-critical\n      - nba-step2-data-foundation\n      - core-smoke\n',
          )

          full_env_old = '          NFL_CRITICAL_RESULT: ${{ needs.nfl-critical.result }}\n          CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}\n'
          assert text.count(full_env_old) == 2, text.count(full_env_old)
          text = text.replace(
              full_env_old,
              '          NFL_CRITICAL_RESULT: ${{ needs.nfl-critical.result }}\n          NBA_STEP2_RESULT: ${{ needs.nba-step2-data-foundation.result }}\n          CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}\n',
          )

          full_loop_old = 'CFB_CRITICAL_RESULT MLB_CRITICAL_RESULT WNBA_CRITICAL_RESULT NFL_CRITICAL_RESULT CORE_SMOKE_RESULT'
          assert text.count(full_loop_old) == 1
          text = text.replace(
              full_loop_old,
              'CFB_CRITICAL_RESULT MLB_CRITICAL_RESULT WNBA_CRITICAL_RESULT NFL_CRITICAL_RESULT NBA_STEP2_RESULT CORE_SMOKE_RESULT',
              1,
          )

          final_loop_old = '            NFL_CRITICAL_RESULT \\\n            CORE_SMOKE_RESULT \\\n'
          assert text.count(final_loop_old) == 1, text.count(final_loop_old)
          text = text.replace(
              final_loop_old,
              '            NFL_CRITICAL_RESULT \\\n            NBA_STEP2_RESULT \\\n            CORE_SMOKE_RESULT \\\n',
              1,
          )

          touched_old = '          NFL_TOUCHED: ${{ needs.classify.outputs.nfl }}\n          CORE_TOUCHED: ${{ needs.classify.outputs.core }}\n'
          assert text.count(touched_old) == 1
          text = text.replace(
              touched_old,
              '          NFL_TOUCHED: ${{ needs.classify.outputs.nfl }}\n          NBA_TOUCHED: ${{ needs.classify.outputs.nba }}\n          CORE_TOUCHED: ${{ needs.classify.outputs.core }}\n',
              1,
          )

          require_old = '          require_success_if "nfl-critical" "$NFL_CRITICAL_RESULT" "$NFL_TOUCHED" "$CORE_TOUCHED"\n          require_success_if "core-smoke" "$CORE_SMOKE_RESULT" "$CORE_TOUCHED"\n'
          assert text.count(require_old) == 1
          text = text.replace(
              require_old,
              '          require_success_if "nfl-critical" "$NFL_CRITICAL_RESULT" "$NFL_TOUCHED" "$CORE_TOUCHED"\n          require_success_if "nba-step2-data-foundation" "$NBA_STEP2_RESULT" "$NBA_TOUCHED" "$CORE_TOUCHED"\n          require_success_if "core-smoke" "$CORE_SMOKE_RESULT" "$CORE_TOUCHED"\n',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

          python devsystem/permanent_gate_v1.py
          python -m pytest -q tests/test_nba_data_foundation_v1.py tests/test_nba_kyre_api_bridge_v1.py

          git config user.name 'nba-registry-authority'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/devsystem-targeted-ci.yml
          git commit -m 'ci(nba): add protected Step 2 critical lane'
          CANDIDATE_HEAD="$(git rev-parse HEAD)"
          NEW_WORKFLOW_BLOB="$(git rev-parse HEAD:.github/workflows/devsystem-targeted-ci.yml)"
          export CANDIDATE_HEAD NEW_WORKFLOW_BLOB

          python devsystem/action_ledger_v2.py verify-pr --base "$EXPECTED_MAIN" --head "$CANDIDATE_HEAD"

          git show "origin/$REGISTRY_BRANCH:devsystem/frozen_artifact_registry_state_v1.json" > /tmp/registry.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          registry = json.loads(Path('/tmp/registry.json').read_text(encoding='utf-8'))
          assert registry['revision'] == 129, registry['revision']
          assert registry['source_main_sha'] == os.environ['EXPECTED_MAIN']
          assert registry.get('active_thaws') == [], registry.get('active_thaws')

          path = '.github/workflows/devsystem-targeted-ci.yml'
          old_blob = os.environ['BASE_WORKFLOW_BLOB']
          owners = [
              checkpoint
              for checkpoint, entry in registry['entries'].items()
              if (entry.get('artifacts') or {}).get(path) == old_blob
          ]
          assert owners, 'frozen targeted-CI owner missing'

          registry['active_thaws'] = [{
              'thaw_id': os.environ['THAW_ID'],
              'status': 'ACTIVE',
              'target_head_sha': os.environ['CANDIDATE_HEAD'],
              'files': {
                  path: {
                      'from_blob': old_blob,
                      'to_blob': os.environ['NEW_WORKFLOW_BLOB'],
                  }
              },
          }]
          registry['revision'] = 130
          registry['source_main_sha'] = os.environ['EXPECTED_MAIN']
          unsigned = dict(registry)
          unsigned.pop('state_hash', None)
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), ensure_ascii=True)
          registry['state_hash'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          Path('/tmp/registry.next.json').write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')
          print('NBA_STEP2_CANDIDATE_HEAD=' + os.environ['CANDIDATE_HEAD'])
          print('NBA_STEP2_TARGETED_CI_BLOB=' + os.environ['NEW_WORKFLOW_BLOB'])
          print('NBA_STEP2_THAW_REVISION=130')
          print('NBA_STEP2_THAW_STATE_HASH=' + registry['state_hash'])
          print('NBA_STEP2_FROZEN_OWNERS=' + ','.join(sorted(owners)))
          PY

          git checkout -B registry-write "origin/$REGISTRY_BRANCH"
          cp /tmp/registry.next.json devsystem/frozen_artifact_registry_state_v1.json
          git add devsystem/frozen_artifact_registry_state_v1.json
          git commit -m 'registry: authorize NBA Step 2 targeted CI lane'
          git push --force-with-lease=refs/heads/${REGISTRY_BRANCH}:${EXPECTED_REGISTRY_HEAD} origin HEAD:${REGISTRY_BRANCH}

          git checkout step2-candidate
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${PRODUCT_HEAD} origin HEAD:${PRODUCT_BRANCH}

          echo "NBA_STEP2_REGISTRY_AUTHORITY_GREEN"
          echo "NBA_STEP2_CANDIDATE_HEAD=$CANDIDATE_HEAD"
          echo "NBA_STEP2_TARGETED_CI_BLOB=$NEW_WORKFLOW_BLOB"
