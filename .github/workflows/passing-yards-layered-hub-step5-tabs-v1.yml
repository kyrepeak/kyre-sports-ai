name: Passing Yards Layered Hub Step 5 Tabs

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step5-tabs-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_tabs_v1.py"
      - "prototypes/passing_yards_layered_hub_app_step5_v1.py"
      - "tests/test_passing_yards_layered_hub_tabs_step5_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step5-tabs-v1.yml"

permissions:
  contents: read

jobs:
  targeted-tabs-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Step 5 layered tabs only
        run: python tests/test_passing_yards_layered_hub_tabs_step5_v1.py
