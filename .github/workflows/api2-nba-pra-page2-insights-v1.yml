name: API2 NBA PRA Page 2 Insights V1

on:
  push:
    branches:
      - api2-nba-pra-page2-insights-v1
  pull_request:
    branches:
      - api2-main
    paths:
      - "nba_pra_page2_insights_v1.py"
      - "nba_pra_page2_v1.py"
      - "tests/test_api2_nba_pra_page2_insights_v1.py"
      - ".github/workflows/api2-nba-pra-page2-insights-v1.yml"

jobs:
  insights-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Insights boundary when present
        run: |
          if [ -f nba_pra_page2_insights_v1.py ]; then
            python -m py_compile nba_pra_page2_insights_v1.py nba_pra_page2_v1.py
          else
            echo "Insights implementation intentionally absent during TDD RED"
          fi
      - name: Run Insights contract and protected Page 2 regression lane
        run: >-
          python -m pytest --noconftest -q
          tests/test_api2_nba_pra_page2_insights_v1.py
          tests/test_api2_nba_pra_page2_s_tier_v2.py
          tests/test_api2_nba_pra_page2_source_guard_v2.py
          tests/test_api2_nba_pra_page1_page2_sync_v1.py
          tests/test_api2_nba_pra_page2_handoff_repair_r1.py
          tests/test_api2_nba_pra_page2_runtime_v1.py
          tests/test_api2_nba_pra_page2_context_v1.py
          tests/test_api2_nba_pra_page2_integration_v1.py
          tests/test_api2_nba_pra_page2_line_lab_v1.py
          tests/test_api2_nba_pra_page2_matchup_v1.py
          tests/test_api2_nba_pra_gateway_only_v1.py
          tests/test_api2_nba_pra_model_behavior_v1.py
