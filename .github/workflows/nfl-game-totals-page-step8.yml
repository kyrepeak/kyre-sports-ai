name: NFL Game Totals Page Step 8

on:
  push:
    branches:
      - monster/nfl-game-totals-page-step8
  pull_request:
    branches:
      - main
    paths:
      - nfl_game_totals_hub_v8.py
      - nfl_hub_v18.py
      - sports_api/nfl_game_totals_total_projection_v1.py
      - tests/test_nfl_game_totals_page_step8.py
      - .github/workflows/nfl-game-totals-page-step8.yml

permissions:
  contents: read

jobs:
  page-step8-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narrow test dependencies
        run: python -m pip install -q pytest requests pandas streamlit
      - name: Freeze-scope guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          allowed='^(\.github/workflows/nfl-game-totals-page-step8\.yml|nfl_game_totals_hub_v8\.py|nfl_hub_v18\.py|sports_api/nfl_game_totals_total_projection_v1\.py|tests/test_nfl_game_totals_page_step8\.py)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Step 8 files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(streamlit_memory_lazy_router_v136\.py|nfl_spread_|nfl_moneyline_hub_|nfl_rushing_yards_|nfl_receiving_yards_)'; then
            echo "Frozen NFL surface changed" >&2
            exit 1
          fi
      - name: Run Step 8 contract
        run: python -m pytest -q tests/test_nfl_game_totals_page_step8.py
      - name: Compile Step 8 runtime files
        run: python -m py_compile nfl_game_totals_hub_v8.py sports_api/nfl_game_totals_total_projection_v1.py nfl_hub_v18.py
