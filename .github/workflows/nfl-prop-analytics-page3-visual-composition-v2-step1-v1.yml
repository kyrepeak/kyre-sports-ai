name: NFL Prop Analytics Page 3 Visual Composition V2 Step 1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-visual-composition-v2-step1-v1.yml"
      - "devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json"
      - "devsystem/task_ledgers/nfl-prop-page3-visual-composition-v2-step1-contract-v1.json"
      - "tests/test_nfl_prop_analytics_page3_visual_composition_v2_step1_contract_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-visual-composition-v2-step1-v1.yml"
      - "devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json"
      - "devsystem/task_ledgers/nfl-prop-page3-visual-composition-v2-step1-contract-v1.json"
      - "tests/test_nfl_prop_analytics_page3_visual_composition_v2_step1_contract_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-page3-visual-composition-v2-step1-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock exact contract-only scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page3-visual-composition-v2-step1-v1.yml' \
            'devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json' \
            'devsystem/task_ledgers/nfl-prop-page3-visual-composition-v2-step1-contract-v1.json' \
            'tests/test_nfl_prop_analytics_page3_visual_composition_v2_step1_contract_v1.py' | sort)"
          test "$actual" = "$expected" || { echo VISUAL_COMPOSITION_V2_STEP1_SCOPE_VIOLATION; printf '%s\n' "$actual"; exit 1; }
          check_blob(){ got="$(git hash-object "$1")"; test "$got" = "$2" || { echo "VISUAL_COMPOSITION_V2_STEP1_FROZEN_BLOB_CHANGED:$1:$got:$2"; exit 1; }; }
          check_blob app.py 2a3922af385cd0fc43bfd540783be15d582aefad
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob nfl_prop_analytics_prop_page_v1.py d5588fe6dc99b223427599d6d245a494f8e7cfc4
          check_blob nfl_prop_analytics_page3_final_polish_v1.py a4b69169d6a30eda5af59ea2e8cbd375eab963d5
          check_blob nfl_prop_analytics_page3_redesign_step6_certification_v1.py 9b5e87ff0eec1b0dcb42ee2b256dc8ed55e3aa03
          echo VISUAL_COMPOSITION_V2_STEP1_SCOPE_GREEN
          echo VISUAL_COMPOSITION_V2_STEP1_FROZEN_PRODUCT_GREEN
      - name: Prove reference contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH=. python -m pytest -q tests/test_nfl_prop_analytics_page3_visual_composition_v2_step1_contract_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json").read_text())
          assert c["reference_regions"][1]["id"]=="hero"
          assert c["reference_regions"][2]["id"]=="quick_stat_ribbon"
          assert c["reference_regions"][3]["id"]=="analysis_settings"
          assert c["reference_regions"][4]["id"]=="line_lab"
          assert c["reference_regions"][5]["id"]=="live_recalculation"
          assert c["reference_regions"][6]["id"]=="game_chart"
          assert c["freeze_rule"].startswith("Once Step 1 is GREEN + FROZEN")
          print("VISUAL_COMPOSITION_V2_STEP1_CONTRACT_GREEN")
          PY

  branch-baseline-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/v2-step1.log 2>&1 &
      - name: Prove frozen baseline remains interactive
        run: |
          python - <<'PY'
          import re,time,requests
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8501"
          for _ in range(240):
              try:
                  if requests.get(base,timeout=2).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          def find(page,sel,timeout=240):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for fr in page.frames:
                      try:
                          l=fr.locator(sel)
                          if l.count(): return fr,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("V2_STEP1_SELECTOR_NOT_READY:"+sel)
          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for fr in page.frames:
                      try:
                          l=fr.get_by_role(kind,name=name,exact=True)
                          if l.count(): return fr,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"V2_STEP1_ROLE_NOT_READY:{kind}:{name}")
          def choose(page,name,value):
              _,l=role(page,"combobox",name);l.click();page.keyboard.type(value,delay=10);_,o=role(page,"option",value,30);o.click()
          def seg(page,name):
              for _ in range(480):
                  for fr in page.frames:
                      l=fr.locator("button").filter(has_text=name)
                      for i in range(l.count()):
                          if l.nth(i).inner_text().strip()==name:return fr,l.nth(i)
                  page.wait_for_timeout(250)
              raise RuntimeError("V2_STEP1_SEGMENT_NOT_READY:"+name)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=["--no-sandbox"]);ctx=b.new_context(viewport={"width":768,"height":1100});page=ctx.new_page()
              page.goto(base,wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL");choose(page,"🎯 NFL Market","Prop Analytics");_,o=role(page,"button","Open matchup");o.click()
              f2,_=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180);f2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first.click()
              _,o=role(page,"button","Open prop page",90);o.click()
              fr,_=find(page,'[data-prop-page3-redesign-step6="v1"]',240)
              for sel in (".ks-pa3-hero",".ks-pa3-stats",".ks-pa3-nav-marker",'[data-prop-page3-step4-line-control="v1"]','[data-prop-page3-step5-chart="v1"]','[data-prop-page3-step6-supporting-stats="v1"]','[data-prop-page3-step7-market-insights="v1"]'): find(page,sel,180)
              _,l5=seg(page,"L5");l5.click();find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-history="L5"]',180)
              _,att=seg(page,"ATT");att.click();find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-market="attempts"]',180)
              lf,line=find(page,'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]',180);mn=line.get_attribute("data-prop-page3-step4-min");mx=line.get_attribute("data-prop-page3-step4-max");slider=lf.get_by_role("slider").first
              slider.press("Home");find(page,f'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-line="{float(mn):.1f}"]',180)
              slider.press("End");find(page,f'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-line="{float(mx):.1f}"]',180)
              for w in (390,768,1440):
                  page.set_viewport_size({"width":w,"height":1100});page.wait_for_timeout(400)
                  q=fr.evaluate("()=>({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})");assert max(q["d"],q["b"])<=q["i"]+2,(w,q)
                  print(f"VISUAL_COMPOSITION_V2_STEP1_BRANCH_{w}_GREEN")
              print("VISUAL_COMPOSITION_V2_STEP1_BRANCH_BASELINE_GREEN")
              ctx.close();b.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public frozen baseline and freeze visual contract
        run: |
          python - <<'PY'
          import re,time,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          contract=json.loads(Path("devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json").read_text())
          assert contract["status"]=="LOCKED_ON_GREEN"
          base="https://kyre-sports-ai.streamlit.app"
          def find(page,sel,timeout=300):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for fr in page.frames:
                      try:
                          l=fr.locator(sel)
                          if l.count(): return fr,l.first
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("V2_STEP1_PUBLIC_SELECTOR_NOT_READY:"+sel)
          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for fr in page.frames:
                      try:
                          l=fr.get_by_role(kind,name=name,exact=True)
                          if l.count(): return fr,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"V2_STEP1_PUBLIC_ROLE_NOT_READY:{kind}:{name}")
          def choose(page,name,value):
              _,l=role(page,"combobox",name);l.click();page.keyboard.type(value,delay=10);_,o=role(page,"option",value,30);o.click()
          def seg(page,name):
              for _ in range(480):
                  for fr in page.frames:
                      l=fr.locator("button").filter(has_text=name)
                      for i in range(l.count()):
                          if l.nth(i).inner_text().strip()==name:return fr,l.nth(i)
                  page.wait_for_timeout(250)
              raise RuntimeError("V2_STEP1_PUBLIC_SEGMENT_NOT_READY:"+name)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=["--no-sandbox","--disable-gpu"]);ctx=b.new_context(viewport={"width":768,"height":1100});page=ctx.new_page()
              page.goto(base,wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL");choose(page,"🎯 NFL Market","Prop Analytics");_,o=role(page,"button","Open matchup");o.click()
              f2,_=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180);f2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first.click()
              _,o=role(page,"button","Open prop page",90);o.click()
              fr,_=find(page,'[data-prop-page3-redesign-step6="v1"]',300)
              for sel in (".ks-pa3-hero",".ks-pa3-stats",".ks-pa3-nav-marker",'[data-prop-page3-step4-line-control="v1"]','[data-prop-page3-step5-chart="v1"]','[data-prop-page3-step6-supporting-stats="v1"]','[data-prop-page3-step7-market-insights="v1"]'): find(page,sel,180)
              _,l5=seg(page,"L5");l5.click();find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-history="L5"]',180)
              _,att=seg(page,"ATT");att.click();find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-market="attempts"]',180)
              for w in (390,768,1440):
                  page.set_viewport_size({"width":w,"height":1100});page.wait_for_timeout(400)
                  q=fr.evaluate("()=>({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})");assert max(q["d"],q["b"])<=q["i"]+2,(w,q)
                  print(f"VISUAL_COMPOSITION_V2_STEP1_PUBLIC_{w}_GREEN")
              print("VISUAL_COMPOSITION_V2_STEP1_PUBLIC_BASELINE_GREEN")
              print("VISUAL_COMPOSITION_V2_STEP1_CONTRACT_GREEN")
              print("VISUAL_COMPOSITION_V2_STEP1_GREEN")
              print("VISUAL_COMPOSITION_V2_STEP1_FROZEN")
              ctx.close();b.close()
          PY
