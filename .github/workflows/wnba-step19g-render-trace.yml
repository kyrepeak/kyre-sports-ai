name: WNBA Step19G guarded Render provider trace

on:
  push:
    branches: [wnba-step19g-render-trace-20260829]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wnba-step19g-render-trace
  cancel-in-progress: true

env:
  CERTIFICATION_RUN_ID: '33281510567'
  ROLLBACK_SHA: '222550f3d2db46d470e4ba050848a9110920fcab'
  RENDER_SERVICE_ID: 'srv-da84q6ifngtc73bdbm6g'
  RENDER_SERVICE_URL: 'https://kyre-sports-api.onrender.com'

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: wnba-render-staging
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require successful Step19G certification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          run_id=os.environ['CERTIFICATION_RUN_ID']
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}"
          headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          last=None
          for _ in range(90):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  last=json.loads(response.read().decode())
              status=last.get('status'); conclusion=last.get('conclusion')
              print('CERT_GATE',status,conclusion,flush=True)
              if status=='completed':
                  if conclusion!='success':
                      raise SystemExit(f'Step19G certification did not pass: {conclusion}')
                  print('STEP19G_PARENT_CERTIFICATION_REQUIRED_AND_PASSED')
                  break
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for Step19G certification')
          PY

      - name: Re-run focused trace regression on exact deploy SHA
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null
          python -m pytest -q \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py \
            tests/test_wnba_step19e_cooldown_aware_cycle.py

      - name: Deploy diagnostic candidate to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'
          sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={
              'Authorization': f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json','Content-Type':'application/json'
          }
          def req(method,path,body=None):
              request=urllib.request.Request(
                  base+path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION': sha,
              'WNBA_DEPLOYMENT_REVISION': sha,
              'WNBA_RELEASE_ID': 'wnba-step19g-hosted-provider-trace',
          }.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deploy=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deploy.get('id')
          if not did: raise SystemExit('Render diagnostic deploy id missing')
          print('STEP19G_RENDER_DEPLOY_STARTED',did,sha)
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower():
                      raise SystemExit('Render live diagnostic SHA mismatch')
                  print('STEP19G_RENDER_DIAGNOSTIC_LIVE',did,sha)
                  break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}:
                  raise SystemExit('Render diagnostic deploy failed: '+status)
              time.sleep(5)
          else:
              raise SystemExit('Render diagnostic deploy timed out')
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Capture first hosted Step12B provider trace
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['RENDER_SERVICE_URL']
          def get(path):
              request=urllib.request.Request(base+path,headers={'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  return json.loads(response.read().decode())
          trace=None
          for index in range(90):
              health=get('/health')
              trace=get('/api/v1/wnba/runtime/step19g-provider-trace')
              if index % 3 == 0:
                  print('TRACE_WAIT',json.dumps({
                      'index':index,
                      'health_status':health.get('status'),
                      'installed':trace.get('installed'),
                      'call_count':trace.get('call_count'),
                      'has_latest':bool(trace.get('latest')),
                  },sort_keys=True),flush=True)
              if trace.get('installed') is True and int(trace.get('call_count') or 0) >= 1 and isinstance(trace.get('latest'),dict):
                  break
              time.sleep(10)
          else:
              raise SystemExit('No hosted Step12B call was captured during observation window')

          latest=trace['latest']
          compact={
              'call_count': trace.get('call_count'),
              'status': latest.get('status'),
              'health': latest.get('health'),
              'slate_date': latest.get('slate_date'),
              'cycle_outcome': latest.get('cycle_outcome'),
              'transient_provider_short_circuit': latest.get('transient_provider_short_circuit'),
              'draftkings': latest.get('draftkings'),
              'fanduel': latest.get('fanduel'),
              'compatibility': latest.get('compatibility'),
              'exception': latest.get('exception'),
              'guardrails': latest.get('guardrails'),
          }
          print('STEP19G_HOSTED_PROVIDER_TRACE',json.dumps(compact,sort_keys=True))

          consumer=get('/api/v1/wnba/consumer/latest')
          runtime=get('/api/v1/wnba/runtime/step17b')
          dk=get('/api/v1/wnba/markets/direct/draftkings/status')
          cr=consumer.get('runtime') or {}
          dkrow=dk.get('draftkings') or {}
          print('STEP19G_HOSTED_CONTEXT',json.dumps({
              'consumer_reason':consumer.get('reason'),
              'consumer_cycle_outcome':cr.get('cycle_outcome'),
              'consumer_circuit':cr.get('circuit_state'),
              'consumer_failures':cr.get('consecutive_failures'),
              'runtime_status':runtime.get('last_status'),
              'runtime_success_count':runtime.get('success_count'),
              'runtime_failure_count':runtime.get('failure_count'),
              'draftkings_direct_ready':dkrow.get('ready'),
          },sort_keys=True))
          print('STEP19G_HOSTED_PROVIDER_TRACE_CAPTURED')
          PY

      - name: Roll back diagnostic deployment
        if: ${{ always() && steps.deploy.outputs.deployed == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={
              'Authorization': f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json','Content-Type':'application/json'
          }
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION': sha,
              'WNBA_DEPLOYMENT_REVISION': sha,
              'WNBA_RELEASE_ID': 'wnba-step19e-certified-rollback',
          }.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deploy=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deploy.get('id')
          if not did: raise SystemExit('Rollback deploy id missing')
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower(): raise SystemExit('Rollback SHA mismatch')
                  print('STEP19G_DIAGNOSTIC_ROLLED_BACK',did,sha)
                  break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}:
                  raise SystemExit('Rollback failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Rollback timeout')
          PY
