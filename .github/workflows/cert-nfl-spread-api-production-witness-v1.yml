name: CERT NFL Spread API Production Witness V1

on:
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
    paths:
      - '.github/workflows/cert-nfl-spread-api-production-witness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cert-nfl-spread-api-production-witness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce cert-only one-file surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mlb-step17b-shared-host-cert:refs/remotes/origin/mlb-step17b-shared-host-cert
          git diff --name-only origin/mlb-step17b-shared-host-cert...HEAD | sort > /tmp/actual.txt
          printf '%s\n' '.github/workflows/cert-nfl-spread-api-production-witness-v1.yml' > /tmp/expected.txt
          echo 'Actual cert-only diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo 'NFL_SPREAD_PRODUCTION_WITNESS_EXACT_SURFACE_GREEN'

      - name: Probe live Render health and NFL Spread endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = 'https://kyre-sports-api.onrender.com'
          EVENT_ID = '401872931'
          EXPECTED_COMMIT = 'd75142aaa9ade317efe915c6eee823c12577d835'
          EXPECTED_BRANCH = 'mlb-step17b-shared-host-cert'

          def get_json(url: str, attempts: int = 4):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'Accept': 'application/json',
                              'User-Agent': 'Kyre-Sports-AI-NFL-Spread-Production-Witness/1.0',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=30) as response:
                          status = int(response.status)
                          body = response.read().decode('utf-8')
                      if status != 200:
                          raise RuntimeError(f'HTTP {status}: {body[:300]}')
                      return json.loads(body)
                  except Exception as exc:
                      last = exc
                      if attempt < attempts:
                          time.sleep(2 * attempt)
              raise RuntimeError(f'Production probe failed after {attempts} attempts: {last}')

          health = get_json(f'{BASE}/health')
          deployment = health.get('deployment') or {}
          assert health.get('status') == 'ok', health
          assert deployment.get('branch') == EXPECTED_BRANCH, deployment
          assert deployment.get('commit') == EXPECTED_COMMIT, deployment
          assert deployment.get('branch_aligned') is True, deployment

          status = get_json(f'{BASE}/api/v1/nfl/spread/market/status')
          assert status.get('status') == 'ready', status
          assert status.get('schema_version') == 'nfl_spread_market_v1', status
          assert status.get('market') == 'spread', status
          assert status.get('official_event_id_required') is True, status
          assert status.get('fuzzy_matching') is False, status
          assert status.get('synthetic_event_ids') is False, status
          assert status.get('projection_weight') == 0.0, status
          assert status.get('market_context_only') is True, status
          assert status.get('model_probability_input') is False, status
          assert status.get('stake_sizing_enabled') is False, status
          assert status.get('wager_actions') is False, status

          query = urllib.parse.urlencode({'event_id': EVENT_ID})
          market = get_json(f'{BASE}/api/v1/nfl/spread/market?{query}')
          assert market.get('schema_version') == 'nfl_spread_market_v1', market
          assert market.get('official_event_id') == EVENT_ID, market
          assert market.get('ready') is True, market
          assert market.get('market_available') is True, market

          identity = market.get('identity') or {}
          semantics = market.get('market_semantics') or {}
          assert identity.get('official_event_id') == EVENT_ID, identity
          assert identity.get('fuzzy_matching') is False, identity
          assert identity.get('synthetic_event_ids') is False, identity
          assert identity.get('team_name_matching') is False, identity
          assert semantics.get('projection_weight') == 0.0, semantics
          assert semantics.get('market_context_only') is True, semantics
          assert semantics.get('may_modify_projection') is False, semantics
          assert semantics.get('model_probability_input') is False, semantics
          assert semantics.get('stake_sizing_enabled') is False, semantics
          assert semantics.get('wager_actions') is False, semantics

          books = market.get('books') or []
          assert len(books) >= 1, market
          book = books[0]
          assert book.get('sportsbook') == 'FanDuel', book
          away_spread = float(book['away_spread'])
          home_spread = float(book['home_spread'])
          away_price = int(book['away_price'])
          home_price = int(book['home_price'])
          assert abs(away_spread + home_spread) < 1e-9, book
          assert abs(away_price) >= 100 and away_price != 0, book
          assert abs(home_price) >= 100 and home_price != 0, book
          assert str(book.get('line_status', '')).lower() == 'active', book

          evidence = {
              'status': 'GREEN',
              'service': BASE,
              'deploy_branch': deployment.get('branch'),
              'deploy_commit': deployment.get('commit'),
              'official_event_id': EVENT_ID,
              'provider_event_id': identity.get('provider_event_id'),
              'away_abbr': identity.get('away_abbr'),
              'home_abbr': identity.get('home_abbr'),
              'sportsbook': book.get('sportsbook'),
              'away_spread': away_spread,
              'home_spread': home_spread,
              'away_price': away_price,
              'home_price': home_price,
              'fuzzy_matching': identity.get('fuzzy_matching'),
              'synthetic_event_ids': identity.get('synthetic_event_ids'),
              'projection_weight': semantics.get('projection_weight'),
              'stake_sizing_enabled': semantics.get('stake_sizing_enabled'),
              'wager_actions': semantics.get('wager_actions'),
          }
          Path('nfl-spread-production-witness.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('NFL_SPREAD_API_PRODUCTION_GREEN', json.dumps(evidence, sort_keys=True))
          PY

      - name: Upload production witness
        uses: actions/upload-artifact@v4
        with:
          name: cert-nfl-spread-api-production-witness-${{ github.run_id }}
          path: nfl-spread-production-witness.json
          if-no-files-found: error
          retention-days: 30
