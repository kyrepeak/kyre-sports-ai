name: College Football Step 12 final permanent freeze contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-step12-final-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert final freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step12-final-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step12-final-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v12.json' | sort)"
          test "$actual" = "$expected"
          echo "CFB_STEP12_FREEZE_SCOPE=PASS"

      - name: Pin prior and final CFB freeze manifests
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              "cfb_freeze_manifest_v11.json": "c6c218bb57a60d5b6d7a81e5d71ce8a11c4f2951",
              "cfb_freeze_manifest_v12.json": "3ff2a727967e80dddbe03f747d9f32090cc39539",
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              assert actual == blob, (path, blob, actual)
          print("CFB_STEP12_MANIFEST_PINS=PASS")
          PY

      - name: Enforce final College Football Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          m = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())

          assert m["version"] == 12
          assert m["completed_steps"] == list(range(1,13))
          assert m["completed_sections"] == {
              "moneyline": True,
              "over_under": True,
              "game_total": True,
          }
          assert m["cfb_build_complete"] is True
          assert m["step12_merge_commit"] == "5c19cb471dc3e39a6c79ccd1d7a67a7d3d1ba259"

          contract = m["step12_contract"]
          expected = {
              "market": "Game Total",
              "section_complete": True,
              "cfb_build_complete": True,
              "final_model_version": "CFB GAME TOTAL FINAL V1 • STEP 12 FINAL SYNTHESIS + RANKING",
              "minimum_reliability": 0.72,
              "minimum_feature_coverage": 0.70,
              "minimum_within_7_probability": 0.30,
              "pass_allowed": True,
              "forced_ranking_allowed": False,
              "final_forecast_active": True,
              "betting_pick_active": False,
              "core_50_range_active": True,
              "most_likely_band_active": True,
              "slate_ranking_active": True,
              "sportsbook_total_input": False,
              "sportsbook_price_input": False,
              "market_implied_probability_input": False,
              "edge_or_ev_active": False,
              "empirical_calibration_claimed": False,
              "monte_carlo_active": False,
              "pregame_only": True,
              "final_step": 12,
          }
          for key, value in expected.items():
              assert contract.get(key) == value, (key, value, contract.get(key))

          formula = contract["forecast_strength_formula"]
          assert formula == {
              "reliability_weight": 0.45,
              "feature_coverage_weight": 0.35,
              "within_7_probability_weight": 0.20,
          }

          required = {
              "cfb_game_total_final_v1.py",
              "cfb_game_total_slate_v1.py",
              "cfb_game_total_hub_v3.py",
              "streamlit_memory_lazy_router_v36.py",
          }
          assert required.issubset(m["exact_blobs"])

          for path, expected_blob in m["exact_blobs"].items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              assert actual == expected_blob, (path, expected_blob, actual)

          print("CFB_STEPS_1_12_FINAL_FREEZE=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]
              for path in m.get("baseline_paths", []):
                  expected = subprocess.check_output(
                      ["git", "rev-parse", f"{base}:{path}"], text=True
                  ).strip()
                  actual = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{path}"], text=True
                  ).strip()
                  assert actual == expected, (name, path)
              for path, expected in m.get("exact_blobs", {}).items():
                  actual = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{path}"], text=True
                  ).strip()
                  assert actual == expected, (name, path)
          print("CFB_STEP12_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile final CFB runtime
        run: |
          python -m py_compile \
            cfb_game_total_final_v1.py \
            cfb_game_total_slate_v1.py \
            cfb_game_total_hub_v3.py \
            streamlit_memory_lazy_router_v36.py \
            tests/test_cfb_step12_game_total_final_v1.py \
            tests/test_cfb_step12_game_total_slate_v1.py \
            tests/test_cfb_step12_game_total_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v36.py

      - name: Run final and frozen CFB contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step12_game_total_final_v1.py \
            tests/test_cfb_step12_game_total_slate_v1.py \
            tests/test_cfb_step12_game_total_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v36.py \
            tests/test_cfb_step11_game_total_model_v1.py \
            tests/test_cfb_step11_game_total_hub_v2.py \
            tests/test_streamlit_memory_lazy_router_v35.py \
            tests/test_cfb_step10_game_total_foundation.py \
            tests/test_streamlit_memory_lazy_router_v34.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_cfb_step9_over_under_slate_v1.py \
            tests/test_cfb_step9_over_under_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v33.py \
            tests/test_cfb_step8_over_under_model_v1.py \
            tests/test_cfb_step8_over_under_hub_v2.py \
            tests/test_streamlit_memory_lazy_router_v32.py \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_step6_moneyline_slate_v1.py \
            tests/test_streamlit_memory_lazy_router_v30.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Lock final Game Total synthesis contract
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_game_total_final_v1 as final

          assert final.MODEL_VERSION == "CFB GAME TOTAL FINAL V1 • STEP 12 FINAL SYNTHESIS + RANKING"
          assert final.MIN_RELIABILITY == 0.72
          assert final.MIN_FEATURE_COVERAGE == 0.70
          assert final.MIN_WITHIN_7_PROBABILITY == 0.30

          game = {"identity_key": "test"}
          raw = {
              "ready": True,
              "projected_combined_total": 54.2,
              "median_total": 54,
              "mode_total": 54,
              "mode_probability": 0.03,
              "structural_interval_80": {"low": 37, "high": 72},
              "structural_interval_90": {"low": 32, "high": 77},
              "percentiles": {"p25": 45, "p75": 63},
              "standard_bands": [
                  {"label": "50-59", "low": 50, "high": 59, "probability": 0.28},
                  {"label": "40-49", "low": 40, "high": 49, "probability": 0.22},
              ],
              "around_projection": {
                  "within_7": {"low": 47, "high": 61, "probability": 0.40},
              },
              "reliability": 0.86,
              "feature_coverage": {"score": 0.90},
              "confidence": "HIGH",
          }
          out = final.synthesize(game, raw)

          assert out["ready"] is True
          assert out["forecast_status"] == "QUALIFIED"
          assert out["rank_eligible"] is True
          assert out["projected_combined_total"] == 54.2
          assert out["core_50_range"] == {"low": 45, "high": 63}
          assert out["most_likely_band"]["label"] == "50-59"
          assert out["final_forecast_active"] is True
          assert out["betting_pick_active"] is False
          assert out["sportsbook_input_used"] is False
          assert out["market_price_used"] is False
          assert out["market_probability_used"] is False
          assert out["edge_or_ev_used"] is False
          assert out["monte_carlo_used"] is False
          assert out["empirical_calibration_claimed"] is False

          print("CFB_STEP12_FINAL_SYNTHESIS_FROZEN=PASS")
          PY

      - name: Final certification marker
        run: echo "CFB_STEPS_1_12_PERMANENTLY_FROZEN_GREEN"
