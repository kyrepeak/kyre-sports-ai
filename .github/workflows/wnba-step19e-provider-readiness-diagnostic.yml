name: WNBA Step19E provider readiness diagnostic

on:
  push:
    branches:
      - wnba-step19e-provider-readiness-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_STEP6J_CANARY_ENABLED: 'false'
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 222550f3d2db46d470e4ba050848a9110920fcab
          fetch-depth: 1
      - name: Install runtime dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Inspect offending DraftKings event and slate relation
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from sports_api import wnba_step11_draftkings_provider as dk
          from sports_api.wnba_official_reconciliation import parse_official_schedule

          schedule=dk._get_json(dk.OFFICIAL_SCHEDULE_URL, requester=None, timeout_seconds=15.0)
          docs=[]
          for url in dk.FROZEN_DRAFTKINGS_ENDPOINTS:
              doc=dk._get_json(url, requester=None, timeout_seconds=15.0)
              docs.append({'url':url,'captured_at_utc':datetime.now(timezone.utc).isoformat(),'document':doc})
          offers,events,sources=dk._normalize_documents(docs)
          games=parse_official_schedule(schedule)
          event_ids={str(o.get('source_event_id') or '').strip() for o in offers}
          print('EVENT_COUNT',len(events),'OFFER_COUNT',len(offers),'OFFER_EVENT_IDS',sorted(event_ids))
          for e in events:
              eid=str(e.get('source_event_id') or '').strip()
              if eid in event_ids or eid=='34579785':
                  print('EVENT',json.dumps(e,sort_keys=True))
                  print('EVENT_OFFER_COUNT',eid,sum(1 for o in offers if str(o.get('source_event_id') or '').strip()==eid))
          for g in games:
              if str(g.get('game_date')) in {'2026-08-28','2026-08-29','2026-08-30','2026-08-31','2026-09-01'}:
                  print('OFFICIAL_GAME',json.dumps({k:g.get(k) for k in ('game_id','game_date','home_team_name','away_team_name')},sort_keys=True))
          PY
