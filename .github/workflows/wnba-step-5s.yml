name: WNBA Step 5S deployment + live smoke tests

on:
  push:
    branches:
      - api-foundation-v1
    paths:
      - "sports_api/wnba_deployment_smoke_readiness.py"
      - "sports_api/api/wnba_deployment_smoke.py"
      - "sports_api/tools/wnba_live_smoke.py"
      - "sports_api/tests/test_wnba_deployment_smoke_readiness.py"
      - "sports_api/Dockerfile"
      - "sports_api/production.env.example"
      - "sports_api/main.py"
      - "sports_api/README.md"
      - ".dockerignore"
      - ".github/workflows/wnba-step-5s.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sports_api/wnba_deployment_smoke_readiness.py"
      - "sports_api/api/wnba_deployment_smoke.py"
      - "sports_api/tools/wnba_live_smoke.py"
      - "sports_api/tests/test_wnba_deployment_smoke_readiness.py"
      - "sports_api/Dockerfile"
      - "sports_api/production.env.example"
      - "sports_api/main.py"
      - "sports_api/README.md"
      - ".dockerignore"
      - ".github/workflows/wnba-step-5s.yml"

jobs:
  step5s:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sports_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 5S modules
        run: |
          python -m py_compile sports_api/wnba_deployment_smoke_readiness.py
          python -m py_compile sports_api/api/wnba_deployment_smoke.py
          python -m py_compile sports_api/tools/wnba_live_smoke.py
          python -m py_compile sports_api/main.py

      - name: Run Step 5I regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_historical_backtest_calibration.py

      - name: Run Step 5J regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_pregame_prediction_store.py

      - name: Run Step 5K regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_player_prop_top_five_board.py

      - name: Run Step 5L regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_daily_slate_top_five.py

      - name: Run Step 5M regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_prop_line_feed_adapter.py

      - name: Run Step 5N regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_prop_feed_collector.py

      - name: Run Step 5O regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_prop_feed_failover.py

      - name: Run Step 5P regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_pregame_board_scheduler.py

      - name: Run Step 5Q regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_scheduler_cycle_lock.py

      - name: Run Step 5R regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_production_runtime_readiness.py

      - name: Run Step 5S deterministic harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_deployment_smoke_readiness.py

      - name: Build production container
        run: docker build -f sports_api/Dockerfile -t kyre-sports-api:step5s .

      - name: Start pre-activation container on persistent volume
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.step5s-data"
          chmod 0777 "$GITHUB_WORKSPACE/.step5s-data"
          docker run -d --name kyre-step5s -p 18000:8000 \
            -v "$GITHUB_WORKSPACE/.step5s-data:/var/lib/kyre-sports-api" \
            -e WNBA_PRODUCTION_RUNTIME_ENABLED=false \
            -e WNBA_CURRENT_BOARD_STORE_PATH=/var/lib/kyre-sports-api/wnba_current_board.sqlite3 \
            -e WNBA_PROP_FEED_STORE_PATH=/var/lib/kyre-sports-api/wnba_prop_feed.sqlite3 \
            -e WNBA_BACKTEST_STORE_PATH=/var/lib/kyre-sports-api/wnba_backtest.sqlite3 \
            -e WNBA_BOARD_SCHEDULER_LOCK_PATH=/var/lib/kyre-sports-api/wnba_scheduler_lock.sqlite3 \
            -e WNBA_BOARD_SCHEDULER_ENABLED=true \
            -e WNBA_BOARD_AUTO_ARCHIVE_ENABLED=true \
            -e SPORTSGAMEODDS_API_KEY=step5s-ci-demo-key \
            -e WNBA_BACKTEST_ARCHIVE_HMAC_SECRET=step5s-ci-secret-material-12345678901234567890 \
            kyre-sports-api:step5s

      - name: Wait for container liveness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kyre-step5s
          exit 1

      - name: Run real read-only container smoke
        env:
          PYTHONPATH: .
        run: python -m sports_api.tools.wnba_live_smoke http://127.0.0.1:18000

      - name: Show container logs on failure
        if: failure()
        run: docker logs kyre-step5s || true

      - name: Stop container
        if: always()
        run: docker rm -f kyre-step5s || true
