name: NFL Passing Yards V37 Certification

on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - nfl_passing_yards_slate_controller_v1.py
      - nfl_passing_yards_hub_v37.py
      - streamlit_memory_lazy_router_v138.py
      - tests/test_nfl_passing_yards_v37_smart_slate.py
      - .github/workflows/nfl-passing-yards-v37-cert.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run V37 smart-slate contract
        run: python -m pytest -q tests/test_nfl_passing_yards_v37_smart_slate.py
