name: CFB Game Total V152 activation

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "streamlit_memory_lazy_router_v152.py"
      - "cfb_game_total_clean_page_v3.py"
      - "cfb_game_total_clean_page_v4.py"
      - "cfb_game_total_clean_page_v5.py"
      - "cfb_game_total_clean_page_v6.py"
      - "cfb_game_total_runtime_display_v1.py"
      - "cfb_over_under_runtime_team_data_v1.py"
      - "devsystem/cfb_game_total_v152_activation_qa.py"
      - "devsystem/cfb_game_total_live_evidence_qa_v2.py"
      - "devsystem/cfb_game_total_browser_qa_v2.py"
      - "devsystem/production_verify_v3.py"
      - "tests/test_cfb_game_total_v152_activation.py"
      - "tests/test_cfb_game_total_v152_identity.py"
      - "tests/test_cfb_game_total_v152_team_stats.py"
      - "tests/test_cfb_game_total_v152_evidence_center.py"
      - "tests/test_cfb_game_total_v152_layout.py"
      - "tests/test_cfb_game_total_browser_v152.py"
      - "tests/test_devsystem_production_verify_v3.py"
      - "tests/conftest.py"
      - ".github/workflows/cfb-game-total-v152-activation.yml"
      - ".github/workflows/cfb-game-total-v152-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v152-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-v152-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install activation certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V152 activation surface
        run: |
          python -m py_compile app.py
          python -m py_compile streamlit_memory_lazy_router_v152.py
          python -m py_compile devsystem/cfb_game_total_v152_activation_qa.py
          python -m py_compile devsystem/cfb_game_total_live_evidence_qa_v2.py
          python -m py_compile devsystem/cfb_game_total_browser_qa_v2.py
          python -m py_compile devsystem/production_verify_v3.py
          python -m py_compile cfb_game_total_clean_page_v3.py
          python -m py_compile cfb_game_total_clean_page_v4.py
          python -m py_compile cfb_game_total_clean_page_v5.py
          python -m py_compile cfb_game_total_clean_page_v6.py
          python -m py_compile cfb_game_total_runtime_display_v1.py
          python -m py_compile cfb_over_under_runtime_team_data_v1.py

      - name: Run V152 activation, freshness, identity, stats, evidence, layout, and browser contracts
        run: |
          python -m pytest -q \
            tests/test_cfb_game_total_v152_activation.py \
            tests/test_cfb_game_total_dashboard_v151.py \
            tests/test_devsystem_production_verify_v3.py \
            tests/test_cfb_game_total_v152_identity.py \
            tests/test_cfb_game_total_v152_team_stats.py \
            tests/test_cfb_game_total_v152_evidence_center.py \
            tests/test_cfb_game_total_v152_layout.py \
            tests/test_cfb_game_total_browser_v152.py

      - name: Prove Syracuse at Pittsburgh live team evidence
        run: python -m devsystem.cfb_game_total_live_evidence_qa_v2

      - name: Start real production entrypoint locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-v152-activation
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-v152-activation/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v152_activation_pid

      - name: Prove app.py reaches V152 Game Total heartbeat
        run: |
          python devsystem/cfb_game_total_v152_activation_qa.py \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-v152-activation

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/cfb-game-total-v152-activation/streamlit.log || true

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v152-activation-${{ github.run_id }}
          path: artifacts/cfb-game-total-v152-activation
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v152_activation_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v152_activation_pid)" 2>/dev/null || true
          fi
