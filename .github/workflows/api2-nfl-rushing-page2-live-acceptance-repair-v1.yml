name: API2 NFL Rushing Page2 Live Acceptance Repair V1

on:
  pull_request:
    branches: [main]
    paths:
      - "sports_api/nfl_rushing_yards_page2_live_repair_v1.py"
      - "sports_api/api/nfl_rushing_yards_detail_v4.py"
      - "kyre_sports_api_vercel_v1.py"
      - "tests/test_api2_nfl_rushing_page2_live_acceptance_repair_v1.py"
      - ".github/workflows/api2-nfl-rushing-page2-live-acceptance-repair-v1.yml"

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests httpx fastapi pandas numpy pypdf
      - name: Run live acceptance repair contract
        run: python -m pytest --noconftest -q tests/test_api2_nfl_rushing_page2_live_acceptance_repair_v1.py
      - name: Compile successor path
        run: python -m py_compile sports_api/nfl_rushing_yards_page2_live_repair_v1.py sports_api/api/nfl_rushing_yards_detail_v4.py kyre_sports_api_vercel_v1.py