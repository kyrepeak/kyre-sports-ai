name: Sitewide Theme Rollout Step 2 Moneyline

on:
  push:
    branches:
      - "monster/sitewide-theme-rollout-step2-moneyline-v1"
    paths:
      - "app.py"
      - "kyre_moneyline_theme_v1.py"
      - "nfl_moneyline_hub_v13.py"
      - "streamlit_memory_lazy_router_v189.py"
      - "tests/test_sitewide_theme_rollout_step2_moneyline_v1.py"
      - ".github/workflows/sitewide-theme-rollout-step2-moneyline-v1.yml"

permissions:
  contents: read

jobs:
  targeted-moneyline-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Moneyline universal presentation only
        run: python tests/test_sitewide_theme_rollout_step2_moneyline_v1.py
