name: MLB Step9B fix test one-shot

on:
  push:
    branches:
      - mlb-step9b-live-game-state-collector-api

permissions:
  contents: write

jobs:
  fix-test:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Step 9B wrong-ID test fixture') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mlb-step9b-live-game-state-collector-api
          fetch-depth: 0
      - name: Fix wrong-ID assertion fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_mlb_step9b_live_game_state_collector_api.py')
          text = path.read_text()
          old = 'state, official_game_id=GAME_LIVE + 1\n'
          new = 'state, official_game_id=GAME_LIVE + 999999\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit deterministic test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_mlb_step9b_live_game_state_collector_api.py
          git commit -m 'Fix Step 9B wrong-ID test fixture'
          git push origin HEAD:mlb-step9b-live-game-state-collector-api
