name: MLB Step7D Game Total API integration certification

on:
  push:
    branches:
      - step7d-mlb-game-total-api-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step7d-game-total-api-integration-cert
  cancel-in-progress: false

env:
  STEP7D_BASE_SHA: 5d8783bfab57bcab73cc1a959a071d31e297d0c6
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true
  STREAMLIT_URL: https://kyre-sports-ai.streamlit.app

jobs:
  certify-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Assert Step7D narrow Game Total scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP7D_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(sports_api/mlb_step7d_total_api_integration_v1.py|tests/test_mlb_step7d_total_api_integration_v1.py|\.github/workflows/mlb-step7d-game-total-api-integration-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP7D_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP7D_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          echo 'MLB_STEP7D_NARROW_GAME_TOTAL_SCOPE_OK'

      - name: Prove frozen MLB runtime remains byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP7D_BASE_SHA"...HEAD -- \
            app.py \
            mlb_daily_game_picks_v217.py \
            mlb_daily_game_picks_v217_guard.py \
            mlb_daily_game_picks_step7a_api_integration_v1.py \
            mlb_spread_hub_v157.py \
            mlb_spread_hub_v156.py \
            mlb_spread_hub_v155.py \
            spread_hub_v154.py \
            spread_hub_v153.py \
            spread_hub_v152.py \
            spread_history.py \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v163.py \
            moneyline_hub_v162.py \
            moneyline_hub_v161.py \
            moneyline_hub_v16.py \
            sports_api/mlb_step7a_daily_game_picks_api_integration_v1.py \
            sports_api/mlb_step7b_spread_api_integration_v1.py \
            sports_api/mlb_step7c_moneyline_api_integration_v1.py \
            sports_api/mlb_live_market_context_v1.py \
            sports_api/mlb_market_probability_v1.py \
            sports_api/mlb_model_market_edge_v1.py \
            sports_api/mlb_price_discipline_v1.py \
            sports_api/mlb_market_movement_v1.py \
            sports_api/mlb_price_health_v1.py \
            sports_api/mlb_actionability_shadow_v1.py \
            sports_api/mlb_controlled_price_gate_v1.py \
            sports_api/mlb_price_gate_canary_v1.py \
            sports_api/mlb_step6a_production_canary_v1.py \
            sports_api/mlb_step6b_canary_monitor_v1.py \
            sports_api/mlb_step6c_evidence_gate_v1.py \
            sports_api/mlb_step6d_production_expansion_v1.py \
            sports_api/mlb_step6e_25pct_stability_monitor_v1.py \
            sports_api/mlb_step6f_production_graduation_gate_v1.py \
            sports_api/mlb_step6g_controlled_graduation_v1.py \
            sports_api/mlb_step6_final_freeze_v1.py
          echo 'MLB_STEP7D_FROZEN_RUNTIME_BYTE_IDENTICAL'

      - name: Prove Step7D is context-only and not a new totals model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('sports_api/mlb_step7d_total_api_integration_v1.py').read_text()
          required = (
              'markets.get("total")',
              'total.get("line")',
              'total.get("over_odds")',
              'total.get("under_odds")',
              'official_mlb_game_id_exact',
              'sportsbook_price_model_input": False',
              'model_math_impact": False',
              'simulation_impact": False',
              'ranking_impact": False',
              'selection_impact": False',
              'fair_odds_impact": False',
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('STEP7D_CONTEXT_CONTRACT_MISSING:' + ','.join(missing))
          forbidden = (
              'MonteCarlo',
              'monte_carlo',
              'projected_total =',
              'win_prob =',
              'fair_odds =',
              'sportsbook_price_model_input": True',
              'fallback_matching_used": True',
          )
          bad = [token for token in forbidden if token in text]
          if bad:
              raise SystemExit('STEP7D_FORBIDDEN_MODEL_OR_FUZZY_SURFACE:' + ','.join(bad))
          print('MLB_STEP7D_CONTEXT_ONLY_CONTRACT_OK')
          PY

      - name: Compile Step7D Python
        run: |
          python -m py_compile \
            sports_api/mlb_step7d_total_api_integration_v1.py \
            tests/test_mlb_step7d_total_api_integration_v1.py

      - name: Run frozen MLB regression plus Step7A Step7B Step7C Step7D
        run: |
          python -m pytest -q \
            tests/test_mlb_official_game_id_join_v1.py \
            tests/test_mlb_live_market_context_v1.py \
            tests/test_mlb_market_probability_v1.py \
            tests/test_mlb_model_market_edge_v1.py \
            tests/test_mlb_price_discipline_v1.py \
            tests/test_mlb_market_movement_v1.py \
            tests/test_mlb_price_health_v1.py \
            tests/test_mlb_actionability_shadow_v1.py \
            tests/test_mlb_controlled_price_gate_v1.py \
            tests/test_mlb_price_gate_canary_v1.py \
            tests/test_mlb_price_gate_canary_streamlit_v1.py \
            tests/test_mlb_step6a_production_canary_v1.py \
            tests/test_mlb_step6b_canary_monitor_v1.py \
            tests/test_mlb_step6c_evidence_gate_v1.py \
            tests/test_mlb_step6d_production_expansion_v1.py \
            tests/test_mlb_step6e_25pct_stability_monitor_v1.py \
            tests/test_mlb_step6f_production_graduation_gate_v1.py \
            tests/test_mlb_step6g_controlled_graduation_v1.py \
            tests/test_mlb_step6_final_freeze_v1.py \
            tests/test_mlb_step7a_daily_game_picks_api_integration_v1.py \
            tests/test_mlb_step7b_spread_api_integration_v1.py \
            tests/test_mlb_step7c_moneyline_api_integration_v1.py \
            tests/test_mlb_step7d_total_api_integration_v1.py

  certify-live-game-total-api-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live certification dependencies
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Certify live Kyre Sports API Total Runs contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy
          from datetime import datetime, timedelta, timezone
          import json, os
          import requests

          from sports_api.mlb_step7d_total_api_integration_v1 import (
              API_CONNECTED,
              FALLBACK,
              build_total_api_state,
              enforce_total_api_freshness,
              total_api_context_for_result,
          )

          response = requests.get(
              os.environ['PRODUCTION_ODDS_URL'],
              timeout=45,
              headers={'Accept':'application/json','User-Agent':'KyreSportsStep7DCert/1.0','Cache-Control':'no-cache'},
          )
          response.raise_for_status()
          payload = response.json()
          games = payload.get('games')
          if not isinstance(games, list) or not games:
              raise RuntimeError('STEP7D_EMPTY_OR_INVALID_API_SLATE')

          state = enforce_total_api_freshness(build_total_api_state(payload))
          if state.get('integration_status') != API_CONNECTED or state.get('api_integration_active') is not True:
              raise RuntimeError('STEP7D_API_STATE_NOT_GREEN:' + json.dumps(state, sort_keys=True))
          if state.get('feed_fresh') is not True or float(state.get('snapshot_age_seconds') or 0) > 60.0:
              raise RuntimeError('STEP7D_API_FEED_NOT_FRESH:' + json.dumps(state, sort_keys=True))
          if state.get('usable_game_total_game_count') != len(games) or state.get('unusable_game_ids'):
              raise RuntimeError('STEP7D_TOTAL_COVERAGE_NOT_COMPLETE:' + json.dumps(state, sort_keys=True))

          game_ids = [int(game['official_game_id']) for game in games]
          if len(game_ids) != len(set(game_ids)):
              raise RuntimeError('STEP7D_DUPLICATE_OFFICIAL_GAME_IDS')

          checked_games = 0
          for game in games:
              gid = int(game['official_game_id'])
              market = game['markets']['total']
              result = {
                  'game_pk': gid,
                  'away_team': (game.get('away_team') or {}).get('name'),
                  'home_team': (game.get('home_team') or {}).get('name'),
                  'projection': {'sentinel': 1},
              }
              before = deepcopy(result)
              context = total_api_context_for_result(result, state)
              if context is None:
                  raise RuntimeError(f'STEP7D_EXACT_CONTEXT_MISSING_{gid}')
              if float(context.get('live_fanduel_total_line')) != float(market['line']):
                  raise RuntimeError(f'STEP7D_TOTAL_LINE_MISMATCH_{gid}')
              if int(context.get('live_fanduel_over_odds')) != int(market['over_odds']):
                  raise RuntimeError(f'STEP7D_OVER_PRICE_MISMATCH_{gid}')
              if int(context.get('live_fanduel_under_odds')) != int(market['under_odds']):
                  raise RuntimeError(f'STEP7D_UNDER_PRICE_MISMATCH_{gid}')
              if context.get('match_method') != 'official_mlb_game_id_exact' or context.get('fallback_matching_used') is not False:
                  raise RuntimeError(f'STEP7D_EXACT_MATCH_PROOF_FAILED_{gid}')
              if context.get('sportsbook_price_model_input') is not False or context.get('display_only') is not True:
                  raise RuntimeError(f'STEP7D_DISPLAY_ONLY_CONTRACT_FAILED_{gid}')
              if result != before:
                  raise RuntimeError(f'STEP7D_RESULT_MUTATED_{gid}')
              checked_games += 1

          duplicate_payload = deepcopy(payload)
          duplicate_payload['games'].append(deepcopy(duplicate_payload['games'][0]))
          duplicate = enforce_total_api_freshness(build_total_api_state(duplicate_payload))
          if duplicate.get('integration_status') != FALLBACK or duplicate.get('api_integration_active') is not False:
              raise RuntimeError('STEP7D_DUPLICATE_FAIL_CLOSED_FAILED')

          missing_payload = deepcopy(payload)
          missing_payload['games'][0]['markets']['total']['over_odds'] = None
          missing = enforce_total_api_freshness(build_total_api_state(missing_payload))
          if missing.get('integration_status') != FALLBACK or missing.get('api_integration_active') is not False:
              raise RuntimeError('STEP7D_MISSING_PRICE_FAIL_CLOSED_FAILED')

          stale_payload = deepcopy(payload)
          stale_payload['collected_at_utc'] = (datetime.now(timezone.utc) - timedelta(seconds=120)).isoformat()
          stale = enforce_total_api_freshness(build_total_api_state(stale_payload))
          if stale.get('integration_status') != FALLBACK or stale.get('feed_fresh') is not False:
              raise RuntimeError('STEP7D_STALE_FAIL_CLOSED_FAILED')

          print(json.dumps({
              'marker':'MLB_STEP7D_GAME_TOTAL_API_BOUNDARY_GREEN',
              'live_games':len(games),
              'usable_game_total_contexts':state.get('usable_game_total_game_count'),
              'exact_game_checks':checked_games,
              'feed_age_seconds':state.get('snapshot_age_seconds'),
              'integration_status':state.get('integration_status'),
              'fallback_matching_used':state.get('fallback_matching_used'),
              'duplicate_fallback':duplicate.get('integration_status'),
              'missing_price_fallback':missing.get('integration_status'),
              'stale_fallback':stale.get('integration_status'),
          }, sort_keys=True))
          PY

  certify-streamlit-transport:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Streamlit transport only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/streamlit.html -w '%{http_code}' --max-time 45 "$STREAMLIT_URL")"
          test "$code" = "200"
          grep -Eo 'Streamlit, Inc\. \([0-9.]+\)' /tmp/streamlit.html | head -1 || true
          echo "MLB_STEP7D_STREAMLIT_HTTP_${code}"
          echo 'MLB_STEP7D_RENDERED_STREAMLIT_BODY_UNVERIFIED_BY_AUTOMATION'

  certification-marker:
    needs:
      - certify-contract
      - certify-live-game-total-api-boundary
      - certify-streamlit-transport
    runs-on: ubuntu-24.04
    steps:
      - name: Emit final marker
        run: echo 'MLB_STEP7D_GAME_TOTAL_API_INTEGRATION_GREEN'
