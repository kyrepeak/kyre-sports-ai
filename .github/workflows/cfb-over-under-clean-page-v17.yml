name: CFB O/U clean page V17

on:
  push:
    branches: [cfb-ou-clean-page-v17]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact clean-page scope and frozen parents
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-clean-page-v17.yml",
              "app.py",
              "cfb_over_under_clean_page_v17.py",
              "cfb_over_under_runtime_team_data_v1.py",
              "cfb_over_under_slate_v14_runtime.py",
              "streamlit_memory_lazy_router_v57.py",
              "scripts/build_cfb_runtime_snapshot.py",
              "tests/test_cfb_over_under_clean_page_v17.py",
              "tests/test_cfb_over_under_router_v57.py",
          }
          failures=[]
          if actual!=expected:
              failures.append(f"scope mismatch expected={sorted(expected)} actual={sorted(actual)}")

          manifests=[
              "cfb_over_under_upgrade_freeze_manifest_v12.json",
              "cfb_over_under_post12_data_recovery_freeze_manifest_v1.json",
              "cfb_over_under_deep_data_reconciliation_freeze_manifest_v1.json",
              "cfb_over_under_visible_data_path_freeze_manifest_v1.json",
          ]
          for path in manifests:
              m=json.loads(pathlib.Path(path).read_text())
              for frozen,blob in (m.get("exact_blobs") or {}).items():
                  try:
                      current=rev(f"HEAD:{frozen}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing frozen path: {frozen}")
                      continue
                  if current!=blob:
                      failures.append(f"frozen parent changed: {frozen}")

          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_V17_SCOPE_AND_PARENT_FREEZES=PASS")
          PY

      - name: Prove legacy Step-1 / Step-2 UI is not in clean page
        run: |
          python - <<'PY'
          from pathlib import Path

          text=Path("cfb_over_under_clean_page_v17.py").read_text()
          forbidden=(
              "cfb_over_under_matchup_ui_v1",
              "cfb_over_under_matchup_ui_v2",
              "cfb_over_under_matchup_ui_v15",
              "cfb_over_under_matchup_ui_v16",
              "frozen_v1",
              "frozen_v2",
          )
          failures=[token for token in forbidden if token in text]
          if failures:
              raise SystemExit(f"legacy UI dependency leaked into clean page: {failures}")

          router=Path("streamlit_memory_lazy_router_v57.py").read_text()
          if 'root._import("cfb_over_under_clean_page_v17")' not in router:
              raise SystemExit("Router V57 does not directly import clean page")

          print("CFB_OU_V17_LEGACY_STEP1_STEP2_RETIRED=PASS")
          PY

      - name: Compile V17
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_clean_page_v17.py",
              "cfb_over_under_runtime_team_data_v1.py",
              "cfb_over_under_slate_v14_runtime.py",
              "streamlit_memory_lazy_router_v57.py",
              "tests/test_cfb_over_under_clean_page_v17.py",
              "tests/test_cfb_over_under_router_v57.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_V17_COMPILE=PASS")
          PY

      - name: Run V17 and inherited regressions
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_cfb_over_under_clean_page_v17.py             tests/test_cfb_over_under_router_v57.py             tests/test_cfb_over_under_runtime_team_data_v1.py             tests/test_cfb_schedule_v5_runtime_snapshot.py             tests/test_cfb_over_under_runtime_ui_router_v56.py             tests/test_cfb_schedule_v4_visible_enrichment.py             tests/test_cfb_over_under_visible_data_path_v15.py             tests/test_cfb_over_under_deep_data_reconciliation_v1.py             tests/test_cfb_over_under_deep_data_ui_router.py             tests/test_cfb_over_under_post12_data_recovery.py             tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py             tests/test_cfb_over_under_upgrade_step12_certification.py             tests/test_cfb_over_under_upgrade_step12_slate.py             tests/test_cfb_over_under_upgrade_step12_ui_router.py             tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py             tests/test_cfb_over_under_upgrade_step11_slate.py             tests/test_cfb_over_under_upgrade_step11_ui_router.py             tests/test_cfb_over_under_upgrade_step10_history_engine.py             tests/test_cfb_over_under_upgrade_step10_slate.py             tests/test_cfb_over_under_upgrade_step10_ui_router.py             tests/test_cfb_over_under_upgrade_step9_environment_engine.py             tests/test_cfb_over_under_upgrade_step9_slate.py             tests/test_cfb_over_under_upgrade_step9_ui_router.py             tests/test_cfb_over_under_upgrade_step8_turnover_engine.py             tests/test_cfb_over_under_upgrade_step8_slate.py             tests/test_cfb_over_under_upgrade_step8_ui_router.py             tests/test_cfb_over_under_upgrade_step7_third_down_engine.py             tests/test_cfb_over_under_upgrade_step7_slate.py             tests/test_cfb_over_under_upgrade_step7_ui_router.py             tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py             tests/test_cfb_over_under_upgrade_step6_slate.py             tests/test_cfb_over_under_upgrade_step6_ui_router.py             tests/test_cfb_over_under_upgrade_step5_explosive_engine.py             tests/test_cfb_over_under_upgrade_step5_slate.py             tests/test_cfb_over_under_upgrade_step5_ui_router.py             tests/test_cfb_over_under_upgrade_step4_pace_engine.py             tests/test_cfb_over_under_upgrade_step4_slate.py             tests/test_cfb_over_under_upgrade_step4_ui_router.py             tests/test_cfb_over_under_upgrade_step3_engine.py             tests/test_cfb_over_under_upgrade_step3_slate.py             tests/test_cfb_over_under_upgrade_step3_ui.py             tests/test_cfb_over_under_multisource_logo_resolver_v2.py             tests/test_cfb_over_under_multisource_logo_hotfix_v4.py             tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Rebuild current runtime snapshot for certification
        run: |
          PYTHONPATH=. python scripts/build_cfb_runtime_snapshot.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/cfb_runtime_snapshot_v1.json").read_text())
          row=next(g for g in payload.get("games") or [] if str(g.get("event_id"))=="401858213")
          away=row.get("away") or {}
          home=row.get("home") or {}
          print("REBUILT_FORM", {
              "away_recent": away.get("recent_form"),
              "home_recent": home.get("recent_form"),
              "away_completed": len(away.get("completed_games") or []),
              "home_completed": len(home.get("completed_games") or []),
          })
          if away.get("recent_form")!="WL":
              raise SystemExit(f"FAMU recent form not rebuilt: {away.get('recent_form')}")
          if home.get("recent_form")!="W":
              raise SystemExit(f"Miami recent form not rebuilt: {home.get('recent_form')}")
          print("CFB_OU_V17_SNAPSHOT_FORM_REBUILT=PASS")
          PY

      - name: Live alias-safe snapshot lookup
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_over_under_runtime_team_data_v1 as runtime

          assert runtime._key("Miami (FL)")==runtime._key("Miami")
          game={
              "game_date":"2026-09-10",
              "away_team":"Florida A&M",
              "home_team":"Miami (FL)",
          }
          snap=runtime._find_snapshot(game)
          print("ALIAS_SAFE_SNAPSHOT",json.dumps({
              "found":bool(snap),
              "event_id":snap.get("event_id"),
              "venue":snap.get("venue"),
              "broadcast":snap.get("broadcast"),
              "away_record":(snap.get("away") or {}).get("record_text"),
              "home_record":(snap.get("home") or {}).get("record_text"),
          },indent=2))
          if not snap:
              raise SystemExit("Miami (FL) did not match ESPN Miami runtime snapshot")
          if str(snap.get("event_id"))!="401858213":
              raise SystemExit(f"wrong snapshot event: {snap.get('event_id')}")
          print("LIVE_V17_ALIAS_SAFE_SNAPSHOT=PASS")
          PY

      - name: Live direct runtime slate
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v5_runtime_snapshot as schedule
          import cfb_over_under_slate_v14_runtime as slate

          games,diag=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          try: slate.analyze_game.clear()
          except Exception: pass
          result=slate.analyze_game(game,"2026-09-10",50.5)

          away=result.get("away") or {}
          home=result.get("home") or {}
          g=result.get("game") or {}
          cert=result.get("certification") or {}

          snapshot={
              "schedule_matches":diag.get("espn_matches"),
              "venue_missing":diag.get("venue_missing"),
              "broadcast_missing":diag.get("broadcast_missing"),
              "runtime_status":(result.get("team_diag") or {}).get("runtime_status"),
              "venue":g.get("venue"),
              "broadcast":g.get("broadcast"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "away_form":away.get("recent_form"),
              "home_form":home.get("recent_form"),
              "away_coach":away.get("head_coach"),
              "home_coach":home.get("head_coach"),
              "home_ap":home.get("ap_rank"),
              "home_coaches":home.get("coaches_poll_rank"),
              "cert_status":cert.get("status"),
              "cert_failures":cert.get("checks_failed"),
          }
          print("LIVE_V17_RUNTIME_SLATE",json.dumps(snapshot,indent=2,default=str))

          expected={
              "runtime_status":"GREEN",
              "venue":"Hard Rock Stadium",
              "broadcast":"ACC Network",
              "away_record":"1-1",
              "home_record":"1-0",
              "away_form":"WL",
              "home_form":"W",
              "away_coach":"Quinn Gray Sr.",
              "home_coach":"Mario Cristobal",
              "home_ap":7,
              "home_coaches":7,
              "cert_status":"CERTIFIED",
              "cert_failures":0,
          }
          for key,value in expected.items():
              if snapshot.get(key)!=value:
                  raise SystemExit(f"{key}: expected {value!r}, got {snapshot.get(key)!r}")
          print("LIVE_V17_DIRECT_RUNTIME_SLATE=PASS")
          PY

      - name: Live new Step-1 and Step-2 HTML
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v5_runtime_snapshot as schedule
          import cfb_over_under_slate_v14_runtime as slate
          import cfb_over_under_clean_page_v17 as page

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )
          result=slate.analyze_game(game,"2026-09-10",50.5)
          g=result.get("game") or {}
          away=result.get("away") or {}
          home=result.get("home") or {}

          page.logo_resolver.resolve_visuals=lambda game: {"away":{},"home":{}}
          step1=page._step1(g,away,home)
          step2=page._step2(away,home)
          combined=step1+step2

          required=(
              "NEW RENDERER",
              "NO LEGACY STEP-2 ENGINE",
              "Hard Rock Stadium",
              "ACC Network",
              "1-1 overall",
              "1-0 overall",
              "Mario Cristobal",
              "Quinn Gray Sr.",
              "#7 AP",
              ">#7<",
          )
          for token in required:
              if token not in combined:
                  raise SystemExit(f"new direct UI missing {token!r}")

          if "Venue unavailable" in combined or "Broadcast unavailable" in combined:
              raise SystemExit("new direct UI leaked unavailable venue/broadcast")
          if "acc • 0-0" in combined.lower() or "swac • 0-0 overall" in combined.lower():
              raise SystemExit("new direct UI leaked stale 0-0 team record")

          print("LIVE_V17_NEW_STEP1_STEP2_UI=PASS")
          PY

      - name: V17 firewall
        run: |
          grep -F 'from streamlit_memory_lazy_router_v57 import render_app' app.py
          python - <<'PY'
          from pathlib import Path

          text="\n".join(Path(p).read_text() for p in (
              "cfb_over_under_clean_page_v17.py",
              "cfb_over_under_slate_v14_runtime.py",
              "streamlit_memory_lazy_router_v57.py",
          ))
          required=(
              'root._import("cfb_over_under_clean_page_v17")',
              'import cfb_over_under_runtime_deep_adapter_v1 as deep_data',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v56"',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing V17 marker: {token}")

          lower=text.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"V17 crossed model firewall: {token}")

          print("CFB_OU_V17_FIREWALL=PASS")
          PY

      - run: echo CFB_OU_CLEAN_PAGE_V17_GREEN
