name: Repair CFB O/U V149 deep-evidence scope once

on:
  push:
    branches: [v149-cfb-over-under-visual-correction]
    paths:
      - .github/workflows/cfb-ou-v149-indent-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v149-cfb-over-under-visual-correction
          fetch-depth: 0

      - name: Indent deep-evidence block into renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cfb_over_under_clean_page_v17.py")
          text = path.read_text()
          start_token = 'with st.expander("Deep evidence • Steps 2–12", expanded=False):\n'
          end_token = '    st.markdown(_cert_step(result), unsafe_allow_html=True)\n'
          start = text.find(start_token)
          end_start = text.find(end_token, start)
          if start < 0 or end_start < 0:
              raise SystemExit("V149 deep-evidence block markers not found")
          end = end_start + len(end_token)
          block = text[start:end]
          fixed = ''.join('    ' + line if line.strip() else line for line in block.splitlines(keepends=True))
          text = text[:start] + fixed + text[end:]
          path.write_text(text)
          print("CFB_OU_V149_DEEP_EVIDENCE_SCOPE_REPAIRED")
          PY

      - name: Compile repaired renderer
        run: python -m py_compile cfb_over_under_clean_page_v17.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb_over_under_clean_page_v17.py
          git diff --cached --check
          git commit -m "fix(cfb-ou): keep V149 deep evidence inside renderer"
          git push origin HEAD:v149-cfb-over-under-visual-correction