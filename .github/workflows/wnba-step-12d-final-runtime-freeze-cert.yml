name: WNBA Step 12D final runtime freeze certification

on:
  push:
    branches:
      - wnba-step12d-final-runtime-freeze-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
      WNBA_BOARD_SCHEDULER_ENABLED: "false"
      WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
      WNBA_STEP6J_CANARY_ENABLED: "false"
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
      WNBA_PERSISTENCE_ENABLED: "false"
      WNBA_SUPABASE_WRITE_ENABLED: "false"
      WNBA_WAGERING_ENABLED: "false"
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
      WNBA_STEP12_SCHEDULER_ENABLED: "false"
      WNBA_STEP9_FASTAPI_ENABLED: "true"
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

    steps:
      - name: Checkout Step 12D branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 360

      - name: Assert production scheduler persistence writes remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 12D final freeze surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step12_release_freeze.py
          python -m py_compile tests/test_wnba_step12_release_freeze.py
          python -m py_compile sports_api/tools/wnba_step12d_final_runtime_freeze_cert.py

      - name: Run Step 12D final freeze guards
        run: PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py

      - name: Run frozen Step 12C through Step 12A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Re-certify frozen Step 12C board presentation boundary
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step12c_live_board_runtime_cert

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 12C head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP12C_FROZEN_SHA='26902667212e670903b19002f7166ea435b238c2'
          git merge-base --is-ancestor "$STEP12C_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP12C_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 12D files changed after frozen Step 12C
        shell: bash
        run: |
          set -euo pipefail
          STEP12C_FROZEN_SHA='26902667212e670903b19002f7166ea435b238c2'
          git diff --name-only "$STEP12C_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step12_release_freeze.py|\
              tests/test_wnba_step12_release_freeze.py|\
              sports_api/tools/wnba_step12d_final_runtime_freeze_cert.py|\
              .github/workflows/wnba-step-12d-final-runtime-freeze-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step12C file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify final Step 12 frozen lineage and safety contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step12_release_freeze as f
          from sports_api import wnba_step12_shadow_runner as s12a
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step12c_live_board_runtime as s12c
          assert f.STEP12C_FROZEN_SHA == '26902667212e670903b19002f7166ea435b238c2'
          assert f.STEP12B_FROZEN_SHA == 'a109be6116fde66e6857d6c676c0f08790a334f3'
          assert f.STEP12A_FROZEN_SHA == '4523abb8b230e8e29d9f9d298232dfb8948fc883'
          assert f.STEP11E_FROZEN_SHA == 'f96d580e398aaa199c424e3b70b7a8f1386a8452'
          assert s12c.STEP12B_FROZEN_SHA == f.STEP12B_FROZEN_SHA
          assert s12b.STEP12A_FROZEN_SHA == f.STEP12A_FROZEN_SHA
          assert s12a.STEP11E_FROZEN_SHA == f.STEP11E_FROZEN_SHA
          assert f.CERTIFIED_SIMULATIONS == 5_000_000
          assert f.DEFAULT_ENABLED is False
          assert f.PRODUCTION_ACTIVATION_ALLOWED is False
          assert f.BACKGROUND_SCHEDULER_ALLOWED is False
          assert f.PERSISTENCE_ALLOWED is False
          assert f.SUPABASE_WRITE_ALLOWED is False
          assert f.PUBLIC_FASTAPI_ACTIVATION_ALLOWED is False
          assert f.WAGERING_ALLOWED is False
          assert f.AUTHENTICATION_ALLOWED is False
          assert f.COOKIES_ALLOWED is False
          assert f.RUNTIME_MUTATION_ALLOWED is False
          assert all(value is False for value in f.SAFETY_CONTRACT.values())
          assert f.step12d_final_runtime_freeze_enabled({}) is False
          print('STEP12D_FROZEN_LINEAGE_AND_SAFETY_OK')
          PY

      - name: Certify and freeze Step 12 final runtime release
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step12d_final_runtime_freeze_cert

      - name: Upload Step 12D final freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step12d-final-runtime-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: step12d-final-runtime-freeze-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production scheduler persistence writes OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
