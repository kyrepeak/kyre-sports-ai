name: WNBA Step 13A bounded scheduler certification

on:
  push:
    branches:
      - wnba-step13a-bounded-scheduler-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
      WNBA_BOARD_SCHEDULER_ENABLED: "false"
      WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
      WNBA_STEP6J_CANARY_ENABLED: "false"
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
      WNBA_PERSISTENCE_ENABLED: "false"
      WNBA_SUPABASE_WRITE_ENABLED: "false"
      WNBA_WAGERING_ENABLED: "false"
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
      WNBA_STEP12_SCHEDULER_ENABLED: "false"
      WNBA_STEP9_FASTAPI_ENABLED: "true"
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

    steps:
      - name: Checkout Step 13A branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 400

      - name: Assert production persistence and legacy schedulers remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 13A scheduler surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step13a_bounded_scheduler.py
          python -m py_compile tests/test_wnba_step13a_bounded_scheduler.py
          python -m py_compile sports_api/tools/wnba_step13a_bounded_scheduler_cert.py

      - name: Run Step 13A bounded scheduler guards
        run: PYTHONPATH=. python tests/test_wnba_step13a_bounded_scheduler.py

      - name: Run frozen Step 12D through Step 12A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 12D head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP12D_FROZEN_SHA='48517bac86ee3f55aa4c21d6caba06c41a0a7d60'
          git merge-base --is-ancestor "$STEP12D_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP12D_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 13A files changed after frozen Step 12D
        shell: bash
        run: |
          set -euo pipefail
          STEP12D_FROZEN_SHA='48517bac86ee3f55aa4c21d6caba06c41a0a7d60'
          git diff --name-only "$STEP12D_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step13a_bounded_scheduler.py|\
              tests/test_wnba_step13a_bounded_scheduler.py|\
              sports_api/tools/wnba_step13a_bounded_scheduler_cert.py|\
              .github/workflows/wnba-step-13a-bounded-scheduler-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step12D file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen lineage and Step 13A safety contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step12_release_freeze as f12
          from sports_api import wnba_step13a_bounded_scheduler as s13a
          assert s13a.STEP12D_FROZEN_SHA == '48517bac86ee3f55aa4c21d6caba06c41a0a7d60'
          assert f12.STEP12C_FROZEN_SHA == '26902667212e670903b19002f7166ea435b238c2'
          assert f12.CERTIFIED_SIMULATIONS == 5_000_000
          assert s13a.DEFAULT_ENABLED is False
          assert s13a.PRODUCTION_ACTIVATION_ALLOWED is False
          assert s13a.PERSISTENCE_ALLOWED is False
          assert s13a.SUPABASE_WRITE_ALLOWED is False
          assert s13a.PUBLIC_FASTAPI_ACTIVATION_ALLOWED is False
          assert s13a.WAGERING_ALLOWED is False
          assert s13a.AUTHENTICATION_ALLOWED is False
          assert s13a.COOKIES_ALLOWED is False
          assert s13a.BACKGROUND_DAEMON_ALLOWED is False
          assert s13a.FOREGROUND_BOUNDED_SCHEDULER_ALLOWED is True
          assert s13a.step13a_bounded_scheduler_enabled({}) is False
          print('STEP13A_FROZEN_LINEAGE_AND_SAFETY_OK')
          PY

      - name: Certify Step 13A bounded scheduler
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step13a_bounded_scheduler_cert

      - name: Upload Step 13A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step13a-bounded-scheduler-${{ github.run_id }}-${{ github.run_attempt }}
          path: step13a-bounded-scheduler-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production persistence and legacy schedulers OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
