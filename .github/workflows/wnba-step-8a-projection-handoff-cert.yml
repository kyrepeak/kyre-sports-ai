name: WNBA Step 8A projection handoff cert

on:
  push:
    branches:
      - wnba-step8-projection-contract-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step8a-projection-handoff-cert
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Step 8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert production OFF and only isolated Step 7G Step 8A gates ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'
          test "$WNBA_STEP8_PROJECTION_HANDOFF_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 8A contract tests and live certificate
        shell: bash
        run: |
          python -m py_compile sports_api/wnba_step8_projection_handoff.py
          python -m py_compile sports_api/tools/wnba_step8a_projection_handoff_cert.py
          python -m py_compile tests/test_wnba_step8_projection_handoff.py
          python -m py_compile sports_api/wnba_step7g_release_freeze.py
          python -m py_compile sports_api/wnba_step7g_first_party_integration.py

      - name: Run fail-closed Step 8A contract regressions
        shell: bash
        run: |
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step7g_first_party_integration.py

      - name: Prove complete certified Step 7G release surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          STEP7G_FROZEN_SHA='1d1842937b51695d5776b73fc0cca55e407ecf39'
          git fetch origin wnba-step7g-step4j-team-history-20260827 --depth=1
          ACTUAL_FROZEN_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_FROZEN_SHA" = "$STEP7G_FROZEN_SHA"
          git diff --exit-code "$STEP7G_FROZEN_SHA" -- \
            sports_api/main.py \
            sports_api/api/wnba_model_input_readiness.py \
            sports_api/wnba_step7g_release_freeze.py \
            sports_api/wnba_step7g_first_party_integration.py \
            sports_api/wnba_step7g_first_party_availability.py \
            sports_api/wnba_step7g_first_party_rosters.py \
            sports_api/wnba_step7g_first_party_injury_report.py \
            sports_api/wnba_step7g_first_party_injury_report_coordinate.py \
            sports_api/wnba_step7g_first_party_schedule_context.py \
            sports_api/wnba_step7g_first_party_team_history.py \
            sports_api/wnba_step7g_first_party_team_history_cup_safe.py \
            sports_api/wnba_step7g_first_party_history.py \
            sports_api/wnba_step7g_first_party_shot_context.py \
            sports_api/wnba_step7g_first_party_shot_context_identity_safe.py \
            sports_api/wnba_step7g_first_party_advanced_stats.py \
            sports_api/wnba_step7g_first_party_advanced_stats_contract_safe.py \
            sports_api/wnba_step7g_first_party_officiating.py \
            sports_api/wnba_availability.py \
            sports_api/wnba_rosters.py \
            sports_api/wnba_season_stats.py \
            sports_api/wnba_lineup_context.py \
            sports_api/wnba_schedule.py \
            sports_api/wnba_schedule_context.py \
            sports_api/wnba_team_history.py \
            sports_api/wnba_model_input_readiness.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_shot_context.py \
            sports_api/wnba_advanced_stats.py \
            sports_api/wnba_officiating_context.py \
            sports_api/wnba_player_event_features.py \
            sports_api/wnba_player_opportunity_context.py \
            sports_api/wnba_event_lineup_context.py \
            sports_api/wnba_rotation_context.py

      - name: Certify live Step 8A handoff against frozen real FastAPI defaults
        shell: bash
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step8a_projection_handoff_cert

      - name: Upload sanitized Step 8A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step8a-projection-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: step8a-projection-handoff-cert.json
          if-no-files-found: warn
          retention-days: 60

      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
