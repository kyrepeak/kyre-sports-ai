name: NFL Receiving Yards Page Step 6 Projection Recipe V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_receiving_yards_projection_v1.py"
      - "nfl_receiving_yards_hub_v6.py"
      - "streamlit_memory_lazy_router_v117.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_page_step6_projection_recipe_v1.py"
      - ".github/workflows/nfl-receiving-yards-page-step6-projection-recipe-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-receiving-yards-page-step6-projection-recipe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-receiving-step6:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pandas streamlit

      - name: Prove exact six-file Step 6 boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-receiving-yards-page-step6-projection-recipe-v1.yml
          app.py
          nfl_receiving_yards_hub_v6.py
          nfl_receiving_yards_projection_v1.py
          streamlit_memory_lazy_router_v117.py
          tests/test_nfl_receiving_yards_page_step6_projection_recipe_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo "Actual Step 6 diff:"
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "NFL_RECEIVING_PAGE_STEP6_EXACT_DIFF_GREEN"

      - name: Compile Step 6 surface
        run: |
          python -m py_compile \
            nfl_receiving_yards_projection_v1.py \
            nfl_receiving_yards_hub_v6.py \
            streamlit_memory_lazy_router_v117.py \
            app.py \
            tests/test_nfl_receiving_yards_page_step6_projection_recipe_v1.py

      - name: Run Receiving Steps 1-6 plus frozen Rushing projection regression
        run: |
          python -m pytest -q \
            tests/test_nfl_receiving_yards_step1_foundation_v1.py \
            tests/test_nfl_receiving_yards_page_step2_player_cards_v1.py \
            tests/test_nfl_receiving_yards_page_step3_summary_metrics_v1.py \
            tests/test_nfl_receiving_yards_page_step4_volume_efficiency_v1.py \
            tests/test_nfl_receiving_yards_page_step5_defense_history_v1.py \
            tests/test_nfl_receiving_yards_page_step6_projection_recipe_v1.py \
            tests/test_nfl_rushing_yards_projection_v1.py

      - name: Prove frozen owners were not modified
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_|nfl_rushing_yards_|nfl_receiving_yards_context_api_v1\.py|nfl_receiving_yards_history_v1\.py|nfl_receiving_yards_hub_v(1|2|3|4|5)\.py|streamlit_memory_lazy_router_v(80|81|82|83|84|85|86|87|88|89|90|91|92|93|94|95|96|97|98|99|100|101|102|103|104|105|106|107|108|109|110|111|112|113|114|115|116)\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "NFL_RECEIVING_PAGE_STEP6_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "NFL_RECEIVING_PAGE_STEP6_FROZEN_OWNER_GUARD_GREEN"

      - name: Prove live production Receiving API remains context-only
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          url = "https://kyre-sports-api.onrender.com/api/v1/nfl/receiving-yards/status"
          req = Request(url, headers={"Accept": "application/json", "User-Agent": "KyreSportsAI-Step6-Cert/1.0"})
          with urlopen(req, timeout=45) as response:
              assert response.status == 200, response.status
              payload = json.loads(response.read().decode("utf-8"))
          assert payload["status"] == "ready"
          assert payload["schema_version"] == "nfl_receiving_yards_context_v1"
          assert payload["official_event_id_required"] is True
          assert payload["official_athlete_id_required"] is True
          assert payload["official_team_id_required"] is True
          assert payload["fuzzy_matching"] is False
          assert payload["targets_explicit_only"] is True
          assert payload["targets_inferred"] is False
          assert payload["projection_enabled"] is False
          assert payload["market_enabled"] is False
          assert payload["sportsbook_influence"] == 0.0
          print("NFL_RECEIVING_PAGE_STEP6_LIVE_CONTEXT_API_GREEN")
          PY

      - name: Prove Step 6 projection safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("nfl_receiving_yards_projection_v1.py").read_text(encoding="utf-8")
          page = Path("nfl_receiving_yards_hub_v6.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v117.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          assert 'PAGE_BUILD_STEP = 6' in page
          assert 'PAGE_BUILD_TOTAL = 10' in page
          assert '60%!important' in page
          assert 'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0' in page
          assert 'EFFICIENCY_WEIGHTS' in engine
          assert '"player_yards_per_reception": 0.65' in engine
          assert '"opponent_yards_per_reception_allowed": 0.35' in engine
          assert '"targets_used": False' in engine
          assert '"sportsbook_influence": 0.0' in engine
          assert '"market_enabled": False' in engine
          assert '"probability_enabled": False' in engine
          assert '"monte_carlo_enabled": False' in engine
          assert 'ACTIVE_RECEIVING_YARDS_HUB = "nfl_receiving_yards_hub_v6"' in router
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v116"' in router
          assert 'from streamlit_memory_lazy_router_v117 import record_bootstrap_import_ms, render_app' in app
          assert 'FROZEN_V116_DEPLOYMENT_HEARTBEAT' in app
          print("NFL_RECEIVING_YARDS_PAGE_STEP6_PROJECTION_RECIPE_GREEN")
          PY
