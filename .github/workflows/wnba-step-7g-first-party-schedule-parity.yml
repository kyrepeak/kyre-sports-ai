name: WNBA Step 7G first-party schedule parity

on:
  push:
    branches:
      - wnba-step7g-official-data-preflight-20260827
    paths:
      - '.github/workflows/wnba-step-7g-first-party-schedule-parity.yml'
      - 'sports_api/wnba_step7g_first_party_schedule.py'
      - 'sports_api/tools/wnba_step7g_first_party_schedule_parity.py'

permissions:
  contents: read

concurrency:
  group: wnba-step7g-first-party-schedule-parity
  cancel-in-progress: false

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated Step 7G branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen schedule and scheduler files are unchanged from main
        shell: bash
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- sports_api/wnba_schedule.py
          git diff --exit-code origin/main -- sports_api/wnba_pregame_board_scheduler.py

      - name: Verify production activation switches are OFF
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API and test dependencies
        run: python -m pip install -r sports_api/requirements.txt pytest

      - name: Certify live first-party schedule parity
        shell: bash
        run: python -m sports_api.tools.wnba_step7g_first_party_schedule_parity

      - name: Run frozen schedule and scheduler regression tests
        shell: bash
        run: |
          python -m pytest -q \
            sports_api/tests/test_wnba_schedule.py \
            sports_api/tests/test_wnba_schedule_context.py \
            sports_api/tests/test_wnba_pregame_board_scheduler.py

      - name: Compile isolated adapter and parity tool
        shell: bash
        run: |
          python -m py_compile \
            sports_api/wnba_step7g_first_party_schedule.py \
            sports_api/tools/wnba_step7g_first_party_schedule_parity.py

      - name: Upload sanitized parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-first-party-schedule-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-first-party-schedule-parity.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-assert production remained OFF
        if: always()
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
