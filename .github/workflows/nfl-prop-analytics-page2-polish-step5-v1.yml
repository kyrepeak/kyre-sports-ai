name: NFL Prop Analytics Page 2 Polish Step 5

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_prop_analytics_page2_responsive_polish_v1.py"
      - "nfl_prop_analytics_hub_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step5_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step5-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step5-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_page2_responsive_polish_v1.py"
      - "nfl_prop_analytics_hub_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step5_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step5-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step5-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-page2-polish-step5-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 5 scope and frozen Steps 1-4
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step5-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step5-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_page2_responsive_polish_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step5_v1.py' | sort)"
          test "$actual" = "$expected" || {
            echo "PROP_ANALYTICS_PAGE2_POLISH_STEP5_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "PROP_ANALYTICS_PAGE2_POLISH_STEP5_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_matchup_shell_v1.py 3052411d963354997f17f15358407db7a2c2c57e
          check_blob nfl_prop_analytics_page2_unified_roster_v1.py 2738254b5a914df777de5a66fc41b2bb4a9ea56c
          check_blob nfl_prop_analytics_page2_tap_player_v1.py 2cd66941f23582d138f8fe92c2e9b0af25150a3b
          check_blob nfl_prop_analytics_player_select_v1.py b9aa4ec194ffea970d6858dcd0e0ed7c31ae0426
          check_blob nfl_prop_analytics_prop_page_v1.py c1dc331b6bb63558229ae2dba2e36b4b8c1951fe
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          echo PROP_ANALYTICS_PAGE2_POLISH_STEP5_FROZEN_STACK_GREEN
          echo PROP_ANALYTICS_PAGE2_POLISH_STEP5_SCOPE_GREEN

      - name: Install static test stack
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test responsive contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_page2_responsive_polish_v1.py nfl_prop_analytics_hub_v1.py
          python -m pytest -q tests/test_nfl_prop_analytics_page2_polish_step5_v1.py
          echo PROP_ANALYTICS_PAGE2_POLISH_STEP5_RESPONSIVE_CONTRACT_GREEN
          echo PROP_ANALYTICS_PAGE2_POLISH_STEP5_STATIC_GREEN

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/page2-polish-step5
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/page2-polish-step5/streamlit.log 2>&1 &
          echo $! > /tmp/page2_polish_step5_pid

      - name: Prove responsive Page 2 + exact handoff
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("PAGE2_POLISH_STEP5_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE2_POLISH_STEP5_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(base+"/?"+urlencode({
                  "ks_jump_sport":"NFL",
                  "ks_jump_market":"Prop Analytics",
                  "ks_pa_game":"CAR-CLE",
                  "ks_pa_page":"matchup",
              }),wait_until="domcontentloaded",timeout=120000)

              frame,responsive=find(page,'[data-prop-page2-responsive-polish="v1"]',180)
              assert responsive.get_attribute("data-prop-page2-responsive-targets")=="390,768,1440"
              _,header=find(page,'[data-prop-page2-premium-header="v1"]',60)
              _,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180)
              assert board.get_attribute("data-prop-page2-unified-state")=="live"
              _,position_filter=find(page,'[data-prop-page2-position-filter="v1"]',60)
              assert position_filter.get_attribute("data-prop-page2-position-filter-options")=="ALL,QB,RB,WR,TE"
              _,tap=find(page,'[data-prop-page2-tap-player="v1"]',180)
              assert tap.get_attribute("data-prop-page2-tap-state")=="ready"
              _,handoff=find(page,'[data-prop-page2-tap-handoff="v1"]',60)
              player_id=handoff.get_attribute("data-prop-page2-tap-handoff-player-id")
              assert player_id and player_id.isdigit()
              _,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',60)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(350)
                  dims=page2.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                  if dims["scroll"]>dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_OVERFLOW:{width}:{dims}")
                  root_dims=frame.evaluate("()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth})")
                  if root_dims["scroll"]>root_dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_ROOT_OVERFLOW:{width}:{root_dims}")
                  grid=frame.locator(".ks-pa-u-grid").first
                  cols=grid.evaluate("e=>getComputedStyle(e).gridTemplateColumns.split(' ').filter(Boolean).length")
                  if width==390 and cols!=1:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_PHONE_GRID:{cols}")
                  if width in (768,1440) and cols!=2:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_WIDE_GRID:{width}:{cols}")
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP5_BRANCH_{width}_GREEN")

              page.set_viewport_size({"width":390,"height":844})
              page.wait_for_timeout(250)
              blocks=frame.locator('div[data-testid="stHorizontalBlock"]')
              tap_block=None
              for i in range(blocks.count()):
                  candidate=blocks.nth(i)
                  texts=candidate.locator("button").all_text_contents()
                  player_buttons=[t for t in texts if " • " in t and (t.startswith("CAR") or t.startswith("CLE"))]
                  if len(player_buttons)>=2:
                      tap_block=candidate
                      break
              if tap_block is None:
                  raise RuntimeError("PAGE2_POLISH_STEP5_TAP_BLOCK_NOT_FOUND")
              buttons=tap_block.locator("button")
              first_box=buttons.nth(0).evaluate("e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}}")
              second_box=buttons.nth(1).evaluate("e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}}")
              if second_box["top"] < first_box["bottom"]-1:
                  raise RuntimeError(f"PAGE2_POLISH_STEP5_PHONE_TAP_NOT_STACKED:{first_box}:{second_box}")
              if first_box["height"]<47 or second_box["height"]<47:
                  raise RuntimeError(f"PAGE2_POLISH_STEP5_TOUCH_TARGET_TOO_SMALL:{first_box}:{second_box}")

              open_button=frame.get_by_role("button",name="Open prop page")
              assert open_button.count()>=1
              open_button.first.click()
              prop_frame,prop_page=find(page,'[data-nfl-prop-analytics-step8-prop-page="v1"]',180)
              assert prop_page.get_attribute("data-prop-step8-state")=="ready"
              assert prop_page.get_attribute("data-prop-step8-player-id")==player_id
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_BRANCH_TAP_HANDOFF_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              passing.close();page.close();browser.close()

          print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_BRANCH_GREEN")
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1600 artifacts/page2-polish-step5/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/page2_polish_step5_pid ]; then kill "$(cat /tmp/page2_polish_step5_pid)" 2>/dev/null || true; fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public responsive Page 2 and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE2_POLISH_STEP5_PUBLIC_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              deadline=time.monotonic()+1200
              last=""
              while True:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(base+"/?"+urlencode({
                          "ks_jump_sport":"NFL",
                          "ks_jump_market":"Prop Analytics",
                          "ks_pa_game":"CAR-CLE",
                          "ks_pa_page":"matchup",
                      }),wait_until="domcontentloaded",timeout=120000)
                      frame,responsive=find(page,'[data-prop-page2-responsive-polish="v1"]',150)
                      _,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',150)
                      _,tap=find(page,'[data-prop-page2-tap-player="v1"]',150)
                      if (
                          responsive.get_attribute("data-prop-page2-responsive-targets")=="390,768,1440"
                          and board.get_attribute("data-prop-page2-unified-state")=="live"
                          and tap.get_attribute("data-prop-page2-tap-state")=="ready"
                      ):
                          break
                      last="MARKERS_NOT_READY"
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PAGE2_POLISH_STEP5_PUBLIC_DEPLOY_WAIT",last)
                  try:
                      context.close()
                  except Exception:
                      pass
                  if time.monotonic()>deadline:
                      raise RuntimeError("PAGE2_POLISH_STEP5_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)
                  time.sleep(8)

              _,header=find(page,'[data-prop-page2-premium-header="v1"]',60)
              _,position_filter=find(page,'[data-prop-page2-position-filter="v1"]',60)
              assert position_filter.get_attribute("data-prop-page2-position-filter-options")=="ALL,QB,RB,WR,TE"
              _,handoff=find(page,'[data-prop-page2-tap-handoff="v1"]',60)
              player_id=handoff.get_attribute("data-prop-page2-tap-handoff-player-id")
              assert player_id and player_id.isdigit()
              _,page2=find(page,'[data-nfl-prop-analytics-step4-page2="v1"]',60)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(350)
                  dims=page2.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                  if dims["scroll"]>dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_OVERFLOW:{width}:{dims}")
                  root_dims=frame.evaluate("()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth})")
                  if root_dims["scroll"]>root_dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_ROOT_OVERFLOW:{width}:{root_dims}")
                  grid=frame.locator(".ks-pa-u-grid").first
                  cols=grid.evaluate("e=>getComputedStyle(e).gridTemplateColumns.split(' ').filter(Boolean).length")
                  if width==390 and cols!=1:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_PHONE_GRID:{cols}")
                  if width in (768,1440) and cols!=2:
                      raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_WIDE_GRID:{width}:{cols}")
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP5_PUBLIC_{width}_GREEN")

              page.set_viewport_size({"width":390,"height":844})
              page.wait_for_timeout(250)
              blocks=frame.locator('div[data-testid="stHorizontalBlock"]')
              tap_block=None
              for i in range(blocks.count()):
                  candidate=blocks.nth(i)
                  texts=candidate.locator("button").all_text_contents()
                  player_buttons=[t for t in texts if " • " in t and (t.startswith("CAR") or t.startswith("CLE"))]
                  if len(player_buttons)>=2:
                      tap_block=candidate
                      break
              if tap_block is None:
                  raise RuntimeError("PAGE2_POLISH_STEP5_PUBLIC_TAP_BLOCK_NOT_FOUND")
              buttons=tap_block.locator("button")
              first_box=buttons.nth(0).evaluate("e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}}")
              second_box=buttons.nth(1).evaluate("e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}}")
              if second_box["top"] < first_box["bottom"]-1:
                  raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_PHONE_TAP_NOT_STACKED:{first_box}:{second_box}")
              if first_box["height"]<47 or second_box["height"]<47:
                  raise RuntimeError(f"PAGE2_POLISH_STEP5_PUBLIC_TOUCH_TARGET_TOO_SMALL:{first_box}:{second_box}")

              open_button=frame.get_by_role("button",name="Open prop page")
              assert open_button.count()>=1
              open_button.first.click()
              prop_frame,prop_page=find(page,'[data-nfl-prop-analytics-step8-prop-page="v1"]',180)
              assert prop_page.get_attribute("data-prop-step8-state")=="ready"
              assert prop_page.get_attribute("data-prop-step8-player-id")==player_id
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_PUBLIC_TAP_HANDOFF_GREEN")

              passing=context.new_page()
              passing.set_viewport_size({"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_PASSING_YARDS_PUBLIC_FROZEN_GREEN")
              passing.close();page.close();context.close();browser.close()

          print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_GREEN")
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_PUBLIC_GREEN")
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP5_FROZEN")
          PY
