name: WNBA Step19H guarded Render transport probe v2

on:
  push:
    branches: [wnba-step19h-render-transport-probe-v2-20260829]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wnba-step19h-render-transport-probe-v2
  cancel-in-progress: true

env:
  CERTIFICATION_RUN_ID: '33281929116'
  ROLLBACK_SHA: '222550f3d2db46d470e4ba050848a9110920fcab'
  RENDER_SERVICE_ID: 'srv-da84q6ifngtc73bdbm6g'
  RENDER_SERVICE_URL: 'https://kyre-sports-api.onrender.com'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: wnba-render-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require certified Step19H parent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{os.environ['CERTIFICATION_RUN_ID']}"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              run=json.loads(response.read().decode())
          print('STEP19H_PARENT_GATE',run.get('status'),run.get('conclusion'))
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('Step19H certified parent is not green')
          PY

      - name: Exact-SHA probe regression
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install pytest >/dev/null
          python -m pytest -q \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py

      - name: Deploy exact metadata-only probe
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              r=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          for key,value in {'WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19h-render-transport-probe-v2'}.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deployment=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deployment.get('id')
          if not did: raise SystemExit('Step19H Render deploy id missing')
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower(): raise SystemExit('Step19H Render SHA mismatch')
                  print('STEP19H_RENDER_PROBE_LIVE',did,sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('Step19H Render deploy failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Step19H Render deploy timeout')
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Capture Render FanDuel transport metadata
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['RENDER_SERVICE_URL']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.loads(response.read().decode())
          transport=None
          for index in range(90):
              transport=get('/api/v1/wnba/runtime/step19h-fanduel-transport')
              count=int(transport.get('captured_event_count') or 0)
              if index % 3 == 0:
                  print('STEP19H_RENDER_WAIT',json.dumps({'index':index,'installed':transport.get('installed'),'captured_event_count':count,'invalid_json_event_count':transport.get('invalid_json_event_count')},sort_keys=True),flush=True)
              if transport.get('installed') is True and count >= 1:
                  break
              time.sleep(10)
          else: raise SystemExit('No Render FanDuel transport response captured')

          events=transport.get('events') or []
          safe=[]
          for event in events:
              safe.append({key:event.get(key) for key in (
                  'host','path','status_code','content_type','content_encoding','content_length_header',
                  'body_byte_length','body_sha256','body_shape','first_non_whitespace_byte_hex',
                  'json_decodable','json_error_type','transport_error_type','body_captured','query_captured'
              )})
          print('STEP19H_RENDER_TRANSPORT_METADATA',json.dumps(safe,sort_keys=True))

          trace=get('/api/v1/wnba/runtime/step19g-provider-trace')
          latest=trace.get('latest') or {}
          consumer=get('/api/v1/wnba/consumer/latest')
          cr=consumer.get('runtime') or {}
          print('STEP19H_RENDER_PROVIDER_CONTEXT',json.dumps({
              'cycle_outcome':latest.get('cycle_outcome'),
              'draftkings':latest.get('draftkings'),
              'fanduel':latest.get('fanduel'),
              'consumer_reason':consumer.get('reason'),
              'circuit_state':cr.get('circuit_state'),
              'consecutive_failures':cr.get('consecutive_failures'),
          },sort_keys=True))

          if any(event.get('body_captured') is not False or event.get('query_captured') is not False for event in events):
              raise SystemExit('Step19H metadata-only guardrail drift')
          print('STEP19H_RENDER_TRANSPORT_CAPTURED')
          PY

      - name: Roll back probe deployment
        if: ${{ always() && steps.deploy.outputs.deployed == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              r=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          for key,value in {'WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19e-certified-rollback'}.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deployment=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deployment.get('id')
          if not did: raise SystemExit('Step19H rollback id missing')
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower(): raise SystemExit('Step19H rollback SHA mismatch')
                  print('STEP19H_PROBE_ROLLED_BACK',did,sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('Step19H rollback failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Step19H rollback timeout')
          PY
