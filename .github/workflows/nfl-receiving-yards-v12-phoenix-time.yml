name: NFL Receiving Yards V12 Phoenix Time

on:
  pull_request:
    paths:
      - "nfl_receiving_yards_phoenix_time_v1.py"
      - "nfl_receiving_yards_hub_v12.py"
      - "streamlit_memory_lazy_router_v143.py"
      - "app.py"
      - "tests/test_nfl_receiving_yards_phoenix_time_v12.py"
      - ".github/workflows/nfl-receiving-yards-v12-phoenix-time.yml"
  workflow_dispatch:

jobs:
  receiving-v12-phoenix-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Receiving Yards V12 Phoenix-time contract
        run: python -m pytest -q tests/test_nfl_receiving_yards_phoenix_time_v12.py
