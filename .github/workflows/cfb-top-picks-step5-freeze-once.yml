name: CFB Top Picks Step 5 Registry Freeze Once

on:
  push:
    branches: [monster-frozen-artifact-registry]
    paths:
      - ".github/workflows/cfb-top-picks-step5-freeze-once.yml"

permissions:
  contents: write

concurrency:
  group: cfb-top-picks-step5-registry-freeze-once
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact registry transaction identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:devsystem/frozen_artifact_registry_state_v1.json)" = "e7067892414b0a588f1b6191dd1cd78f52b16890"

      - name: CAS revision 121 to 122 and freeze Step 5
        shell: bash
        env:
          REGISTRY: devsystem/frozen_artifact_registry_state_v1.json
          WORKFLOW: .github/workflows/cfb-top-picks-step5-freeze-once.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("devsystem/frozen_artifact_registry_state_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          expected_hash = "44f27680ab270d6bb5aa62bc3382a0b963db7d6501cfd924a3324ed32b89e050"
          expected_source = "4845a4101ddcb76fa8b6819f6b3c6dc786d41dce"
          merge_sha = "08112c19f588362f27022dfb07d65ec0eed94754"
          checkpoint = "CFB_TOP_PICKS_REPAIR_STEP5_FINAL_CLOSEOUT"

          def state_hash(value):
              body = dict(value)
              body.pop("state_hash", None)
              canonical = json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          assert payload["schema_version"] == 1
          assert payload["version"] == "MONSTER_V4_FROZEN_ARTIFACT_REGISTRY_V1"
          assert payload["registry_ref"] == "refs/heads/monster-frozen-artifact-registry"
          assert payload["registry_path"] == "devsystem/frozen_artifact_registry_state_v1.json"
          assert payload["revision"] == 121, payload["revision"]
          assert payload["source_main_sha"] == expected_source, payload["source_main_sha"]
          assert payload["state_hash"] == expected_hash, payload["state_hash"]
          assert state_hash(payload) == expected_hash
          assert payload.get("active_thaws") == [], payload.get("active_thaws")
          assert checkpoint not in payload["entries"]
          assert "CFB_TOP_PICKS_REPAIR_STEP4_DETAIL_INTEGRITY" in payload["entries"]

          payload["entries"][checkpoint] = {
              "status": "FROZEN",
              "checkpoint_id": checkpoint,
              "source_main_sha": merge_sha,
              "proven_merge_sha": merge_sha,
              "branch_proof_run_id": 37245732018,
              "proof_run_id": 37246033946,
              "focused_final_closeout_proof_run_id": 37246033948,
              "regression_debt_state": "CLEARED",
              "proof_kind": "MERGED_MAIN_PUBLIC",
              "live_top10_closeout_10_of_10": True,
              "public_visual_detail_surface_green": True,
              "public_repaired_detail_surface_green": True,
              "required_viewports": [390, 768, 1440],
              "step1_history_router_preserved": True,
              "step2_defense_pace_preserved": True,
              "step3_market_reasoning_preserved": True,
              "step4_detail_integrity_preserved": True,
              "history_projection_weight": 0.0,
              "history_selection_weight": 0.0,
              "history_ranking_weight": 0.0,
              "sportsbook_projection_weight": 0.0,
              "api2_used": False,
              "product_mutation": False,
              "regression_guard": {
                  "test": "tests/test_cfb_top_picks_repair_step5_final_closeout_v1.py",
                  "contract": "devsystem/cfb_top_picks_repair_step5_final_closeout_v1.py",
              },
              "artifacts": {
                  "devsystem/cfb_top_picks_repair_step5_final_closeout_v1.py": "895748fd5f69f50d54bdc95038e4ed79d67b03be",
                  "tests/test_cfb_top_picks_repair_step5_final_closeout_v1.py": "bf1dee6b7f354cb465ff16004227874c17986688",
                  "devsystem/task_ledgers/cfb-top-picks-repair-step5-final-closeout-v1.json": "752f6a5f7442b6cfdc1183b94acbe4e3f93fdc68",
                  ".github/workflows/cfb-top-picks-repair-step5-final-closeout-v1.yml": "a695242001c9db05397bcdf86f6375e9a4b2b9a4",
                  "devsystem/cfb_top_picks_step5_visual_cert_v1.py": "49e607a815e99e2d3eb1eaef82dac4fc1384e99f",
              },
          }
          payload["revision"] = 122
          payload["source_main_sha"] = merge_sha
          payload["state_hash"] = state_hash(payload)

          assert payload["revision"] == 122
          assert payload["source_main_sha"] == merge_sha
          assert payload["active_thaws"] == []
          assert payload["entries"][checkpoint]["status"] == "FROZEN"
          assert state_hash(payload) == payload["state_hash"]

          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("CFB_TOP_PICKS_REPAIR_STEP5_REGISTRY_CAS_GREEN")
          print("revision=122")
          print("state_hash=" + payload["state_hash"])
          PY

          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY" "$WORKFLOW"
          git diff --cached --check
          git commit -m "Freeze CFB Top Picks Repair Step 5 final closeout"
          git push origin HEAD:monster-frozen-artifact-registry
