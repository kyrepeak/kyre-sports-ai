name: WNBA Step19J guarded production release

on:
  push:
    branches: [wnba-step19j-production-release-20260830]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step19j-production-release
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 148f370ed10f2cd8785bb0f0395cac9822e61c92
  ROLLBACK_SHA: 222550f3d2db46d470e4ba050848a9110920fcab
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: wnba-render-staging
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'
    steps:
      - name: Checkout exact Step19J candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Exact-candidate regression wall
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -m pytest -q tests/test_wnba_step11_fanduel_provider.py
          python -m pytest -q \
            tests/test_wnba_step19j_runtime_acceleration.py \
            tests/test_wnba_step7g_cup_exclusion.py \
            tests/test_wnba_step12b_live_runtime_assembly.py \
            tests/test_wnba_step8_joint_monte_carlo.py
          python -m pytest -q \
            tests/test_wnba_step19i_official_slate_transport.py \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py \
            tests/test_wnba_step19e_cooldown_aware_cycle.py

      - name: Prove hosted wrapper chain and unchanged 5M contract
        run: |
          python - <<'PY'
          from sports_api import wnba_projection_input_snapshot as snap
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19g_hosted_provider_trace as s19g
          from sports_api import wnba_step19j_runtime_acceleration as s19j
          import sports_api.api.wnba_step17b_runtime
          if s12b.CERTIFIED_SIMULATIONS != 5_000_000:
              raise SystemExit('certified simulation count drift')
          if s12b.CERTIFIED_BATCH_SIZE != 250_000:
              raise SystemExit('certified batch size drift')
          if s12b.run_step12b_live_runtime_job is not s19j.run_step12b_with_cycle_local_context:
              raise SystemExit('Step19J Step12B wrapper not installed')
          if s19j._UPSTREAM_RUN_STEP12B is not s19g.run_step12b_with_hosted_trace:
              raise SystemExit('Step19G trace chain not preserved')
          if snap.get_game_rest_travel_context is not s19j.get_game_rest_travel_context_step19j:
              raise SystemExit('Step19J game-context cache not installed')
          guards=s19j.installation_status()['guardrails']
          if any((guards['monte_carlo_simulation_count_modified'],guards['monte_carlo_batch_size_modified'],guards['projection_math_modified'],guards['readiness_relaxed'],guards['sportsbook_transport_modified'],guards['controller_state_modified'],guards['persistence_modified'],guards['wagering_enabled'])):
              raise SystemExit('Step19J safety guardrail drift')
          print('STEP19J_EXACT_HOST_CHAIN_CERTIFIED')
          PY

      - name: Read-only live provider preflight
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          from sports_api import wnba_step11_draftkings_provider as dk
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step11_multibook_shadow_board as mb
          import sports_api.api.wnba_step17b_runtime
          slate=datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York')).date().isoformat()
          now=datetime.now(timezone.utc)
          d=dk.fetch_step11a_draftkings_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=os.environ)
          f=fd.fetch_step11c_fanduel_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=os.environ)
          dp=mb._verify_bridge(d,provider=dk.PROVIDER); fp=mb._verify_bridge(f,provider=fd.PROVIDER)
          summary={'slate':slate,'draftkings_records':len(dp.get('records') or []),'fanduel_records':len(fp.get('records') or [])}
          print('STEP19J_PROVIDER_PREFLIGHT',json.dumps(summary,sort_keys=True))
          if summary['draftkings_records']<=0 or summary['fanduel_records']<=0:
              raise SystemExit('live provider preflight returned no records')
          print('STEP19J_PROVIDER_PREFLIGHT_CERTIFIED')
          PY

      - name: Deploy exact Step19J candidate to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              r=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          desired={
            'WEB_CONCURRENCY':'1','WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED':'true','WNBA_STEP17B_ALWAYS_ON_ENABLED':'true','WNBA_STEP17B_LOOP_SECONDS':'60','WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_STEP17C_MONITORING_ENABLED':'true','WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED':'true',
            'WNBA_STEP14C_DURABLE_RESTART_LEASE_ENABLED':'true','WNBA_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED':'true','WNBA_STEP14B_DATABASE_READ_ENABLED':'true','WNBA_STEP14B_DATABASE_WRITE_ENABLED':'true','WNBA_STEP14A_PERSISTENCE_CONTRACT_ENABLED':'true','WNBA_STEP13D_FINAL_SCHEDULER_FREEZE_ENABLED':'true','WNBA_STEP13C_RELIABILITY_RECOVERY_ENABLED':'true','WNBA_STEP13B_RUNTIME_SUPERVISOR_ENABLED':'true','WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED':'true','WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED':'true','WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED':'true','WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED':'true','WNBA_STEP12A_SHADOW_RUNNER_ENABLED':'true',
            'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true','WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz','WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true','WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true','WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true','WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED':'true','WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED':'true','WNBA_STEP10_FASTAPI_ENABLED':'true','WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true','WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true','WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true','WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true','WNBA_STEP9_FASTAPI_ENABLED':'true','WNBA_STEP9_THRESHOLD_PRICING_ENABLED':'true','WNBA_STEP9B_MARKET_COMPARISON_ENABLED':'true','WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED':'true','WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED':'true','WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true','WNBA_STEP7G_FIRST_PARTY_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_STEP6J_CANARY_ENABLED':'false','WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false','WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED':'false','WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19j-runtime-acceleration-candidate'
          }
          for key,value in desired.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('deploy id missing')
          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('deploy timeout')
          if sha.lower() not in json.dumps(d).lower(): raise SystemExit('live SHA mismatch')
          print('STEP19J_EXACT_CANDIDATE_LIVE',did,sha)
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for genuine completed Step19J cycle
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as r:return json.loads(r.read().decode())
          last=None
          for i in range(180):
              try:
                  rt=get('/api/v1/wnba/runtime/step17b'); c=get('/api/v1/wnba/consumer/latest'); dk=get('/api/v1/wnba/markets/direct/draftkings/status'); j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration')
              except Exception as exc:
                  if i%6==0: print('WAIT_HTTP',i,type(exc).__name__,str(exc),flush=True)
                  time.sleep(10); continue
              cr=c.get('runtime') or {}; d=(dk.get('draftkings') or {}); last_cycle=j.get('last_cycle') or {}
              last={'i':i,'runtime_status':rt.get('last_status'),'runtime_success':rt.get('success_count'),'runtime_failures':rt.get('failure_count'),'consumer_reason':c.get('reason'),'consumer_available':c.get('available'),'cycle_executed':cr.get('cycle_executed'),'outcome':cr.get('cycle_outcome'),'circuit':cr.get('circuit_state'),'consecutive_failures':cr.get('consecutive_failures'),'dk_ready':d.get('ready'),'step19j_active':j.get('step12b_wrapper_active'),'step19j_cycle':last_cycle}
              if i%6==0: print('WAIT_STEP19J',json.dumps(last,sort_keys=True),flush=True)
              runtime_ok=(int(rt.get('success_count') or 0)>=1 and int(rt.get('failure_count') or 0)==0 and rt.get('last_status')=='cycle_completed')
              j_ok=(j.get('installed') is True and j.get('step12b_wrapper_active') is True and j.get('game_rest_cycle_cache_active') is True and isinstance(last_cycle,dict) and bool(last_cycle) and float(last_cycle.get('elapsed_seconds') or 99999)<900)
              provider_ok=(d.get('ready') is True and c.get('reason')!='provider_transient_not_ready')
              consumer_runtime_ok=(not cr) or (cr.get('circuit_state')=='closed' and int(cr.get('consecutive_failures') or 0)==0 and cr.get('cycle_outcome') in {'shadow_board_ready','market_board_not_ready','not_executed'})
              if runtime_ok and j_ok and provider_ok and consumer_runtime_ok:
                  print('STEP19J_SAFE_CYCLE_CERTIFIED',json.dumps(last,sort_keys=True)); break
              time.sleep(10)
          else:
              raise SystemExit('no completed safe Step19J cycle '+repr(last))
          PY

      - name: Verify hosted provider and runtime diagnostics
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as r:return json.loads(r.read().decode())
          g=get('/api/v1/wnba/runtime/step19g-provider-trace'); h=get('/api/v1/wnba/runtime/step19h-fanduel-transport'); i=get('/api/v1/wnba/runtime/step19i-official-slate-transport'); j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration')
          latest=g.get('latest') or {}; fd=(latest.get('fanduel') or {}); dk=(latest.get('draftkings') or {})
          checks={
            'step19i_active':i.get('official_schedule_transport_active') is True,
            'step19j_active':j.get('step12b_wrapper_active') is True and j.get('game_rest_cycle_cache_active') is True,
            'step19j_cycle_seen':bool(j.get('last_cycle')),
            'fanduel_transport_valid':int(h.get('invalid_json_event_count') or 0)==0,
            'trace_seen':int(g.get('call_count') or 0)>=1,
            'provider_transient_absent':latest.get('cycle_outcome')!='provider_transient_not_ready',
          }
          if latest:
              checks['draftkings_trace_no_errors']=not (dk.get('errors') or [])
              checks['fanduel_trace_no_errors']=not (fd.get('errors') or [])
          print('STEP19J_HOSTED_DIAGNOSTICS',json.dumps({'checks':checks,'trace':latest,'runtime_acceleration':j},sort_keys=True,default=str))
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('hosted diagnostics failed: '+','.join(failed))
          print('STEP19J_HOSTED_DIAGNOSTICS_CERTIFIED')
          PY

      - name: Random live WNBA read certification
        run: |
          python - <<'PY'
          import json,random,urllib.parse,urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as r:return json.loads(r.read().decode())
          teams=get('/api/v1/wnba/teams'); games=get('/api/v1/wnba/games/today')
          rows=teams.get('teams') or []; game_rows=games.get('games') or []
          if not rows: raise SystemExit('teams empty')
          if not game_rows: raise SystemExit('today games empty')
          team=random.SystemRandom().choice(rows); key=str(team.get('team_key') or '')
          roster=get('/api/v1/wnba/teams/'+urllib.parse.quote(key,safe='')+'/roster')
          if not (roster.get('players') or []): raise SystemExit('random roster empty')
          print('STEP19J_RANDOM_READ_CERTIFIED',json.dumps({'team':team.get('full_name'),'team_count':len(rows),'today_game_count':len(game_rows),'roster_count':len(roster.get('players') or [])},sort_keys=True))
          PY

      - name: Final Step19J production verification
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as r:return json.loads(r.read().decode())
          root=get('/'); rt=get('/api/v1/wnba/runtime/step17b'); c=get('/api/v1/wnba/consumer/latest'); d=get('/api/v1/wnba/markets/direct/draftkings/status'); j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration')
          cr=c.get('runtime') or {}; dk=d.get('draftkings') or {}; lc=j.get('last_cycle') or {}
          checks={
            'api_online':root.get('status')=='online',
            'runtime_success':int(rt.get('success_count') or 0)>=1,
            'runtime_zero_failures':int(rt.get('failure_count') or 0)==0,
            'runtime_cycle_completed':rt.get('last_status')=='cycle_completed',
            'provider_transient_bug_absent':c.get('reason')!='provider_transient_not_ready',
            'draftkings_ready':dk.get('ready') is True,
            'step19j_installed':j.get('installed') is True and j.get('step12b_wrapper_active') is True,
            'step19j_cycle_finished':bool(lc),
            'step19j_cycle_under_15m':float(lc.get('elapsed_seconds') or 99999)<900,
          }
          if cr:
              checks['consumer_circuit_closed']=cr.get('circuit_state')=='closed'
              checks['consumer_zero_failures']=int(cr.get('consecutive_failures') or 0)==0
          print('STEP19J_FINAL_CHECKS',json.dumps(checks,sort_keys=True))
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('final Step19J verification failed: '+','.join(failed))
          print('STEP19J_PRODUCTION_CERTIFIED')
          PY

      - name: Capture failure diagnostics before rollback
        if: ${{ failure() && steps.deploy.outputs.deployed == 'true' }}
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://kyre-sports-api.onrender.com'
          paths=['/api/v1/wnba/runtime/step17b','/api/v1/wnba/consumer/latest','/api/v1/wnba/runtime/step19g-provider-trace','/api/v1/wnba/runtime/step19h-fanduel-transport','/api/v1/wnba/runtime/step19i-official-slate-transport','/api/v1/wnba/runtime/step19j-runtime-acceleration']
          for path in paths:
              try:
                  with urllib.request.urlopen(base+path,timeout=45) as r:value=json.loads(r.read().decode())
                  print('STEP19J_FAILURE_DIAGNOSTIC',path,json.dumps(value,sort_keys=True,default=str))
              except Exception as exc: print('STEP19J_FAILURE_DIAGNOSTIC_ERROR',path,type(exc).__name__,str(exc))
          PY

      - name: Roll back if post-deploy certification fails
        if: ${{ failure() && steps.deploy.outputs.deployed == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              r=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          for key,value in {'WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19j-auto-rollback'}.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('rollback deploy id missing')
          for _ in range(180):
              d=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(d.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('rollback failed '+status)
              time.sleep(5)
          else: raise SystemExit('rollback timeout')
          print('STEP19J_ROLLED_BACK',did,sha)
          PY
