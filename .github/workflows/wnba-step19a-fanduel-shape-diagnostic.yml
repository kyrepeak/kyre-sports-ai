name: WNBA Step 19A FanDuel shape diagnostic

on:
  push:
    branches:
      - wnba-step19a-step11-provider-preflight-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sports_api/requirements.txt
      - name: Inspect anonymous current FanDuel schema
        run: |
          python - <<'PY'
          from sports_api import wnba_step11_fanduel_provider as fd
          content=fd._get_json(fd.FANDUEL_BASE_URL+fd.CONTENT_PAGE_PATH,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'page':'CUSTOM','customPageId':'wnba','timezone':'America/New_York'},requester=None,timeout=20)
          events=fd._extract_events(content)
          print('CONTENT_KEYS',sorted(content.keys()))
          print('EVENT_COUNT',len(events))
          for event in events[:3]:
              eid=fd._event_id(event); print('EVENT',eid,fd._event_name(event),fd._event_date(event))
              doc=fd._get_json(fd.FANDUEL_BASE_URL+fd.EVENT_PAGE_PATH,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'eventId':eid},requester=None,timeout=20)
              print('EVENT_DOC_KEYS',sorted(doc.keys()))
              layout=doc.get('layout') or {}
              print('LAYOUT_KEYS',sorted(layout.keys()) if isinstance(layout,dict) else type(layout).__name__)
              tabs=layout.get('tabs') if isinstance(layout,dict) else None
              rows=fd._iter_mapping_or_list(tabs)
              print('TAB_COUNT',len(rows),'RELEVANT_TAB_IDS',fd._relevant_tab_ids(doc))
              for tab in rows[:30]:
                  print('TAB',tab.get('id') or tab.get('tabId') or tab.get('_attachment_key'),tab.get('title') or tab.get('name') or tab.get('displayName'))
              markets=fd._extract_markets(doc)
              print('BASE_MARKET_COUNT',len(markets))
              for m in markets[:40]:
                  runners=fd._iter_mapping_or_list(m.get('runners'))
                  print('MARKET',m.get('marketId') or m.get('id'),m.get('marketName') or m.get('name'),m.get('marketType') or m.get('type'),'STAT',fd._market_stat(m),'RUNNERS',[(r.get('runnerName') or r.get('name'),r.get('handicap'),r.get('resultType'),r.get('side')) for r in runners[:4]])
          PY
