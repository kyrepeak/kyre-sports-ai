name: NFL Game Totals Page Step 7

on:
  push:
    branches:
      - monster/nfl-game-totals-page-step7
  pull_request:
    branches:
      - main
    paths:
      - nfl_game_totals_hub_v7.py
      - nfl_hub_v18.py
      - sports_api/nfl_game_totals_environment_context_v1.py
      - tests/test_nfl_game_totals_page_step7.py
      - .github/workflows/nfl-game-totals-page-step7.yml

permissions:
  contents: read

jobs:
  page-step7-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narrow test dependencies
        run: python -m pip install -q pytest requests pandas streamlit
      - name: Freeze-scope guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [ "${GITHUB_HEAD_REF:-}" = "monster/nfl-game-totals-multisource-spec" ]; then
            allowed='^(\.github/workflows/(nfl-game-totals-page-step7\.yml|nfl-game-totals-multisource-router\.yml)|docs/superpowers/(specs/2026-09-15-nfl-game-totals-multisource-data-router-design\.md|plans/2026-09-15-nfl-game-totals-multisource-data-router-implementation\.md)|nfl_game_totals_hub_v8_1\.py|sports_api/(nfl_data_router_v1\.py|nfl_data_nflverse_v1\.py|nfl_data_nws_v1\.py|nfl_data_espn_fallback_v1\.py|nfl_stadium_coordinates_v1\.py|nfl_game_totals_scoring_context_v1\.py|nfl_game_totals_pace_context_v1\.py|nfl_game_totals_explosive_context_v1\.py|nfl_game_totals_red_zone_drive_context_v1\.py|nfl_game_totals_environment_context_v1\.py)|tests/(test_nfl_data_router_v1\.py|test_nfl_data_nflverse_v1\.py|test_nfl_data_nws_v1\.py|test_nfl_game_totals_multisource_step3_7\.py|test_nfl_game_totals_page_step7\.py))$'
          else
            allowed='^(\.github/workflows/nfl-game-totals-page-step7\.yml|nfl_game_totals_hub_v7\.py|nfl_hub_v18\.py|sports_api/nfl_game_totals_environment_context_v1\.py|tests/test_nfl_game_totals_page_step7\.py)$'
          fi
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Step 7 files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(streamlit_memory_lazy_router_v136\.py|nfl_spread_|nfl_moneyline_hub_|nfl_rushing_yards_|nfl_receiving_yards_)'; then
            echo "Frozen NFL surface changed" >&2
            exit 1
          fi
      - name: Run Step 7 contract
        run: python -m pytest -q tests/test_nfl_game_totals_page_step7.py
      - name: Compile Step 7 runtime files
        run: python -m py_compile nfl_game_totals_hub_v7.py sports_api/nfl_game_totals_environment_context_v1.py nfl_hub_v18.py
