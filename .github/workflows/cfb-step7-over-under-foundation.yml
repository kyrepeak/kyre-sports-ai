name: College Football Step 7 Over-Under foundation certification

on:
  workflow_dispatch:
  push:
    branches: ['feature/cfb-step7-over-under-foundation']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 7 scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step7-over-under-foundation'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step6-moneyline-final.yml' \
            '.github/workflows/cfb-step7-over-under-foundation.yml' \
            'app.py' \
            'cfb_over_under_hub_v1.py' \
            'streamlit_memory_lazy_router_v31.py' \
            'tests/test_cfb_step7_over_under_foundation.py' \
            'tests/test_streamlit_memory_lazy_router_v31.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 7 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP7_SCOPE=PASS"

      - name: Pin Step 6 freeze manifest itself
        run: |
          python - <<'PY'
          import subprocess
          import sys

          expected = "505cbf2cc7269138d9bdaba2449717615558f9a5"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:cfb_freeze_manifest_v6.json"],
              text=True,
          ).strip()
          if actual != expected:
              print(f"cfb_freeze_manifest_v6.json changed expected={expected} actual={actual}")
              sys.exit(1)
          print("CFB_STEP6_MANIFEST_PIN=PASS")
          PY

      - name: Enforce permanently frozen CFB Steps 1 through 6
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v6.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 6:
              failures.append("CFB freeze version changed")
          if m.get("completed_steps") != [1,2,3,4,5,6]:
              failures.append("CFB completed steps changed")
          if (m.get("completed_sections") or {}).get("moneyline") is not True:
              failures.append("Moneyline Step 6 completion contract changed")
          if (m.get("completed_sections") or {}).get("over_under") is not False:
              failures.append("Over/Under was marked complete before Step 7 certification")
          if (m.get("step6_contract") or {}).get("market_probability_weight") != 0:
              failures.append("Step 6 market probability weight changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Steps 1-6 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEPS_1_6_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]
              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")
              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP7_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile Step 7
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_hub_v1.py \
            streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py
          PYTHONPATH=. python -c "import cfb_over_under_hub_v1; import streamlit_memory_lazy_router_v31"

      - name: Run Step 7 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_step6_moneyline_slate_v1.py \
            tests/test_streamlit_memory_lazy_router_v30.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove Step 7 market isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path("cfb_over_under_hub_v1.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v31.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          required = [
              'MARKET = "Over/Under"',
              'SCHEDULE_PROVIDER = "cfb_schedule_v3"',
              'TEAM_DATA_PROVIDER = "cfb_team_data_v2"',
              'root._import("cfb_over_under_hub_v1")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v30"',
              'Step 8 owns the first Over/Under model',
              'Step 9 owns slate ranking',
          ]
          combined = hub + "\n" + router + "\n" + app
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 7 marker: {token}")

          forbidden = [
              "import numpy",
              "np.random",
              "sportsbook_total =",
              "sportsbook_price =",
              "over_probability =",
              "under_probability =",
              "projected_total =",
              "expected_value =",
              "cfb_moneyline_final_v1",
              "cfb_moneyline_model_v1",
          ]
          for token in forbidden:
              if token in hub:
                  raise SystemExit(f"Step 7 crossed model/market boundary: {token}")

          import re
          match = re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", app)
          if not match or int(match.group(1)) < 31:
              raise SystemExit("app.py regressed below frozen Router V31")
          current = int(match.group(1))
          for version in range(current, 31, -1):
              source = Path(f"streamlit_memory_lazy_router_v{version}.py").read_text(encoding="utf-8")
              if f"import streamlit_memory_lazy_router_v{version - 1} as prior" not in source:
                  raise SystemExit(
                      f"Router V{version} does not preserve additive chain to frozen Router V31"
                  )

          print("CFB_STEP7_OVER_UNDER_FIREWALL=PASS")
          PY

      - name: Live Sept 12 foundation smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_hub_v1 as hub
          import cfb_schedule_v3 as schedule
          import cfb_team_data_v2 as team_data

          schedule.clear_schedule_cache()
          games, diag = schedule.load_with_diagnostics("2026-09-12")
          target = None
          for game in games:
              away = str(game.get("away_team") or "").lower()
              home = str(game.get("home_team") or "").lower()
              if "oklahoma" in away and "michigan" in home:
                  target = game
                  break

          print("LIVE_SCHEDULE_COUNT", len(games))
          print("LIVE_TARGET", target)
          if target is None:
              raise SystemExit("Oklahoma @ Michigan missing from live Sept 12 slate")

          team_data.clear_team_data_cache()
          profiles, team_diag = team_data.load_matchup_team_data(target, "2026-09-12")
          away = profiles.get("away") or {}
          home = profiles.get("home") or {}
          print("LIVE_AWAY_GRADE", (away.get("data_quality") or {}).get("grade"))
          print("LIVE_HOME_GRADE", (home.get("data_quality") or {}).get("grade"))
          print("LIVE_FOUNDATION_READY", hub._foundation_ready(target, away, home))

          if not hub._foundation_ready(target, away, home):
              raise SystemExit("Step 7 live scoring foundation is not ready")

          print("CFB_STEP7_LIVE_FOUNDATION=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP7_OVER_UNDER_FOUNDATION_GREEN"
