name: CFB O/U post-12 data recovery permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-post12-data-recovery-permanent-freeze]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact recovery-freeze scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-post12-data-recovery-permanent-freeze.yml",
              "cfb_over_under_post12_data_recovery_freeze_manifest_v1.json",
          }
          if actual!=expected:
              print("expected",sorted(expected))
              print("actual",sorted(actual))
              sys.exit(1)
          print("CFB_OU_POST12_RECOVERY_FREEZE_SCOPE=PASS")
          PY

      - name: Enforce untouched 12-of-12 parent freeze
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          failures=[]
          parent_path="cfb_over_under_upgrade_freeze_manifest_v12.json"
          if rev(f"HEAD:{parent_path}")!="b2a798b4625bda5b8472a30e66cde2ecf6aef923":
              failures.append("V12 master freeze manifest changed")
          parent=json.loads(pathlib.Path(parent_path).read_text())
          if parent.get("upgrade_complete") is not True:
              failures.append("V12 upgrade_complete changed")
          if parent.get("completed_upgrade_steps")!=list(range(1,13)):
              failures.append("V12 completed step list changed")
          for path,expected in (parent.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen V12 path: {path}")
                  continue
              if actual!=expected:
                  failures.append(f"frozen V12 path changed: {path}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_12_OF_12_PARENT_FREEZE_UNTOUCHED=PASS")
          PY

      - name: Enforce recovery exact blobs and contract
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          path="cfb_over_under_post12_data_recovery_freeze_manifest_v1.json"
          manifest=json.loads(pathlib.Path(path).read_text())
          failures=[]

          if rev(f"HEAD:{path}")!="8baab0745d2b6fb1214da47eb5c0c6dd22355944":
              failures.append("recovery freeze manifest blob changed")
          if manifest.get("version")!=1:
              failures.append("recovery freeze version changed")
          if manifest.get("baseline_commit")!="e41c41baccea856fa0463c5fbe7b8e2c8ac40baf":
              failures.append("recovery baseline commit changed")
          if manifest.get("frozen_parent_manifest_blob")!="b2a798b4625bda5b8472a30e66cde2ecf6aef923":
              failures.append("recovery parent manifest blob changed")

          c=manifest.get("contract") or {}
          expected_equal={
              "name":"multi-source data recovery above frozen 12/12 stack",
              "market":"Over/Under",
              "active_recovery_engine":"cfb_over_under_data_recovery_v1",
              "active_slate":"cfb_over_under_slate_v12_data_recovery",
              "active_ui":"cfb_over_under_matchup_ui_v13_data_recovery",
              "active_router":"streamlit_memory_lazy_router_v53",
              "frozen_router_parent":"streamlit_memory_lazy_router_v52",
              "external_h2h_source":"Winsipedia",
              "external_history_projection_weight":0,
              "external_history_selection_weight":0,
              "external_history_analysis_line_weight":0,
              "live_event_id":"401858213",
              "live_florida_am_espn_team_id":"50",
              "live_miami_espn_team_id":"2390",
              "live_h2h_meetings":12,
              "live_florida_am_wins":1,
              "live_miami_wins":11,
              "live_latest_h2h_date":"2024-09-07",
              "live_latest_h2h_florida_am_points":9,
              "live_latest_h2h_miami_points":56,
              "live_recovered_step12_status":"CERTIFIED",
              "live_recovered_step12_failures":0,
              "live_form_gate_reason":"home current-season sample below 2 games",
              "clean_regression_tests_passed":226,
          }
          for key,expected in expected_equal.items():
              if c.get(key)!=expected:
                  failures.append(f"recovery contract changed: {key}")

          required_true=[
              "espn_visual_team_id_recovery_active",
              "espn_team_directory_recovery_active",
              "espn_team_schedule_exact_pair_date_recovery_active",
              "recovered_event_summary_weather_venue_roster_active",
              "winsipedia_direct_fetch_active",
              "winsipedia_reader_fallback_active",
              "reversed_matchup_orientation_fallback_active",
              "verified_partial_data_display_active",
              "blank_gate_replacement_active",
              "current_season_form_gate_preserved",
              "step12_certification_reused",
              "live_florida_am_miami_forced_espn_recovery_certified",
              "recovery_ui_not_blank_certified",
              "recovery_firewall_certified",
              "permanently_frozen",
          ]
          for key in required_true:
              if c.get(key) is not True:
                  failures.append(f"recovery lost true invariant: {key}")

          required_false=[
              "projection_math_changed",
              "selection_math_changed",
              "frozen_step9_10_11_rules_changed",
              "frozen_step12_certification_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
              "live_form_ready",
          ]
          for key in required_false:
              if c.get(key) is not False:
                  failures.append(f"recovery violated false invariant: {key}")

          for frozen,expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{frozen}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing recovery frozen path: {frozen}")
                  continue
              if actual!=expected:
                  failures.append(f"recovery frozen blob changed: {frozen}")

          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_POST12_RECOVERY_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Verify Router V53 and compile recovery stack
        run: |
          grep -F 'from streamlit_memory_lazy_router_v53 import render_app' app.py
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_data_recovery_v1.py",
              "cfb_over_under_slate_v12_data_recovery.py",
              "cfb_over_under_matchup_ui_v13_data_recovery.py",
              "streamlit_memory_lazy_router_v53.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_POST12_RECOVERY_FROZEN_COMPILE=PASS")
          PY

      - name: Run recovery and inherited regression suite
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_post12_data_recovery.py tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py tests/test_cfb_over_under_upgrade_step12_certification.py tests/test_cfb_over_under_upgrade_step12_slate.py tests/test_cfb_over_under_upgrade_step12_ui_router.py tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py tests/test_cfb_over_under_upgrade_step11_slate.py tests/test_cfb_over_under_upgrade_step11_ui_router.py tests/test_cfb_over_under_upgrade_step10_history_engine.py tests/test_cfb_over_under_upgrade_step10_slate.py tests/test_cfb_over_under_upgrade_step10_ui_router.py tests/test_cfb_over_under_upgrade_step9_environment_engine.py tests/test_cfb_over_under_upgrade_step9_slate.py tests/test_cfb_over_under_upgrade_step9_ui_router.py tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Recovery permanent-freeze firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_data_recovery_v1.py",
              "cfb_over_under_slate_v12_data_recovery.py",
              "cfb_over_under_matchup_ui_v13_data_recovery.py",
              "streamlit_memory_lazy_router_v53.py",
          ))
          required=[
              'FROZEN_STEP12_COMPLETE = True',
              'EXTERNAL_HISTORY_PROJECTION_WEIGHT = 0.0',
              'EXTERNAL_HISTORY_SELECTION_WEIGHT = 0.0',
              'EXTERNAL_HISTORY_ANALYSIS_LINE_WEIGHT = 0.0',
              'FROZEN_STEP12_SLATE = "cfb_over_under_slate_v11"',
              'FROZEN_STEP12_UI = "cfb_over_under_matchup_ui_v12"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v52"',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing recovery frozen marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"recovery freeze crossed model firewall: {token}")
          print("CFB_OU_POST12_RECOVERY_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - name: Permanent freeze marker
        run: echo CFB_OU_POST12_MULTI_SOURCE_DATA_RECOVERY_PERMANENTLY_FROZEN_GREEN
