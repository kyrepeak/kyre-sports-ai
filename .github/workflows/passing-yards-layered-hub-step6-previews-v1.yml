name: Passing Yards Layered Hub Step 6 Previews

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step6-previews-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_previews_v1.py"
      - "prototypes/passing_yards_layered_hub_app_step6_v1.py"
      - "tests/test_passing_yards_layered_hub_previews_step6_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step6-previews-v1.yml"

permissions:
  contents: read

jobs:
  targeted-previews-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Step 6 hub previews only
        run: python tests/test_passing_yards_layered_hub_previews_step6_v1.py
