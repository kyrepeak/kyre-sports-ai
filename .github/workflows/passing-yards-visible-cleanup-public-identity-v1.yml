name: NFL Passing Yards Visible Cleanup Public Identity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-visible-cleanup-public-identity-v1.yml"
      - "devsystem/task_ledgers/passing-yards-visible-cleanup-public-identity-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-visible-cleanup-public-identity-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Protect cleanup and Monster owners
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/passing-yards-visible-cleanup-public-identity-v1.yml' \
            'devsystem/task_ledgers/passing-yards-visible-cleanup-public-identity-v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || {
              echo "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_PROTECTED_BLOB_CHANGED:$1:$actual:$2"
              exit 1
            }
          }

          check_blob app.py 0d6d73d82945f25db16c31fe8737d93e49995efb
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob streamlit_memory_lazy_router_v237.py 6cc43e4ea5c9b892e03c721abb6cdb8689fa4e44
          check_blob streamlit_memory_lazy_router_v236.py 0380da16cd91bcf3801b4d105218b508dbaf43f2
          check_blob devsystem/sitewide_page_load_health_v1.py 6fb6750146a34b05f8ba2ff3b72da80e0153ec1e
          check_blob .github/workflows/sitewide-step45-targeted-close-v1.yml 8fdf57caa41828988adb1389fa34979a224385cc

          echo "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_MONSTER_ISOLATION_GREEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public identity browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Fingerprint live Passing Yards production identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode

          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          direct_params={
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
              "ks_py_hint_name":"Jordan Love",
              "ks_py_hint_meta":"GB • QB",
              "ks_py_hint_projection":"276.4",
              "ks_py_hint_attempts":"34.8",
              "ks_py_hint_ypa":"7.94",
              "ks_py_hint_line":"274.5",
              "ks_py_hint_lean":"LEAN OVER",
          }

          markers={
              "v85":'[data-passing-yards-visible-cleanup-owner="v85"]',
              "v84":'[data-passing-yards-single-rerun-owner="v84"]',
              "v83":'[data-passing-yards-same-session-owner="v83"]',
              "v82":'[data-passing-yards-concurrent-prefetch-owner="v82"]',
              "v81":'[data-passing-yards-payload-dedupe-owner="v81"]',
              "v80":'[data-passing-yards-evidence-cache="v80"]',
              "v79":'[data-passing-yards-lazy-detail="v79"]',
              "v77":'[data-passing-yards-performance-runtime="v77"]',
              "v74":'[data-passing-yards-availability-game-day="v74"]',
              "v70":'[data-passing-yards-mobile-cleanup-runtime="v70"]',
              "v69":'[data-passing-yards-detail-cleanup="v69"]',
              "v60":'[data-passing-yards-step3-header="v60"]',
              "v59":'[data-passing-yards-qb-detail="v59"]',
              "v58":'[data-passing-yards-selection-screen="v58"]',
              "qb_cards":'[data-qb-selection-card]',
              "qb_links":'a[data-qb-select]',
          }

          visible_needles=(
              "PASSING YARDS CONTROL DECK",
              "Choose a quarterback",
              "Load Full Analysis",
              "Availability + Game-Day Conditions",
              "Certified Market Tape",
              "Jordan Love",
              "Passing Yards",
          )

          def body_and_frames(page):
              chunks=[]
              frame_rows=[]
              for index,frame in enumerate(page.frames):
                  try:
                      body=frame.locator("body").inner_text(timeout=3000)
                  except Exception as exc:
                      body=""
                  chunks.append(body)
                  frame_rows.append({
                      "index":index,
                      "url":frame.url,
                      "body_start":" ".join(body.split())[:1200],
                  })
              return "\n".join(chunks),frame_rows

          def marker_counts(page):
              out={}
              for name,selector in markers.items():
                  total=0
                  for frame in page.frames:
                      try:
                          total += frame.locator(selector).count()
                      except Exception:
                          pass
                  out[name]=total
              return out

          def combo_state(page):
              rows=[]
              for frame_index,frame in enumerate(page.frames):
                  try:
                      combos=frame.get_by_role("combobox")
                      count=combos.count()
                  except Exception:
                      count=0
                  if not count:
                      continue
                  for i in range(count):
                      loc=combos.nth(i)
                      try:
                          value=loc.input_value(timeout=1200)
                      except Exception:
                          try:
                              value=loc.inner_text(timeout=1200)
                          except Exception:
                              value=""
                      try:
                          aria=loc.get_attribute("aria-label") or ""
                      except Exception:
                          aria=""
                      rows.append({
                          "frame":frame_index,
                          "index":i,
                          "value":value,
                          "aria_label":aria,
                      })
              return rows

          def snapshot(label,page):
              body,frames=body_and_frames(page)
              counts=marker_counts(page)
              compact=" ".join(body.split())
              needles={needle:(needle.casefold() in body.casefold()) for needle in visible_needles}
              runtime_error=any(
                  token in body
                  for token in (
                      "Traceback",
                      "ModuleNotFoundError",
                      "ImportError",
                      "TypeError",
                      "KeyError",
                  )
              )
              data={
                  "label":label,
                  "page_url":page.url,
                  "title":page.title(),
                  "frame_count":len(page.frames),
                  "frames":frames,
                  "markers":counts,
                  "needles":needles,
                  "comboboxes":combo_state(page),
                  "body_chars":len(body),
                  "body_excerpt":compact[:3500],
                  "body_tail":compact[-7000:],
                  "traceback_tail":[
                      line.strip()
                      for line in body.splitlines()
                      if line.strip()
                  ][-80:],
                  "runtime_error_text":runtime_error,
              }
              print("PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_SNAPSHOT="+json.dumps(data,sort_keys=True))
              return data

          def find_app_frame(page,timeout=45):
              deadline=time.monotonic()+timeout
              last=[]
              while time.monotonic()<deadline:
                  last=[]
                  for index,frame in enumerate(page.frames):
                      try:
                          body=frame.locator("body").inner_text(timeout=1500)
                      except Exception:
                          body=""
                      try:
                          combos=frame.get_by_role("combobox").count()
                      except Exception:
                          combos=0
                      last.append((index,frame.url,combos," ".join(body.split())[:300]))
                      if "get this app back up" in body.casefold():
                          try:
                              wake=frame.get_by_text("Yes, get this app back up!",exact=False)
                              if wake.count()>0:
                                  wake.click()
                                  page.wait_for_timeout(5000)
                                  continue
                          except Exception:
                              pass
                      if combos>=1 and ("KYRE SPORTS AI" in body or "Sport" in body):
                          return frame
                  page.wait_for_timeout(500)
              print("PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_APP_FRAME_MISS="+json.dumps(last))
              return None

          def choose_value(page,frame,index,value):
              try:
                  combos=frame.get_by_role("combobox")
                  if combos.count()<=index:
                      return False
                  combo=combos.nth(index)
                  combo.click()
                  page.keyboard.type(value)
                  page.keyboard.press("Enter")
                  return True
              except Exception as exc:
                  print(
                      "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_CHOOSE_ERROR="
                      +f"{index}:{value}:{type(exc).__name__}:{exc}"
                  )
                  return False

          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
              )

              # Lane A: certified query family, no assumptions about which owner
              # should appear. We only fingerprint what production actually serves.
              direct_context=browser.new_context(viewport={"width":390,"height":844})
              direct=direct_context.new_page()
              direct_url=base+"/?"+urlencode(direct_params)
              try:
                  direct.goto(direct_url,wait_until="domcontentloaded",timeout=120000)
                  direct.wait_for_timeout(12000)
                  direct_data=snapshot("direct_selected_qb",direct)
              except Exception as exc:
                  print(
                      "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_DIRECT_ERROR="
                      +f"{type(exc).__name__}:{exc}"
                  )
                  direct_data={"error":f"{type(exc).__name__}:{exc}"}

              # Lane B: real UI path. Snapshot before and after every successful
              # selection so the exact public routing transition is observable.
              ui_context=browser.new_context(viewport={"width":1440,"height":1000})
              ui=ui_context.new_page()
              try:
                  ui.goto(base+"/",wait_until="domcontentloaded",timeout=120000)
                  ui.wait_for_timeout(5000)
                  snapshot("ui_home",ui)

                  frame=find_app_frame(ui,45)
                  if frame is not None and choose_value(ui,frame,0,"NFL"):
                      ui.wait_for_timeout(3500)
                      snapshot("ui_after_nfl",ui)
                      frame=find_app_frame(ui,30)

                      if frame is not None and choose_value(ui,frame,1,"Passing Yards"):
                          ui.wait_for_timeout(10000)
                          ui_data=snapshot("ui_after_passing_yards",ui)
                      else:
                          ui_data={"route":"market_selection_failed"}
                  else:
                      ui_data={"route":"sport_selection_failed"}
              except Exception as exc:
                  print(
                      "PASSING_YARDS_VISIBLE_CLEANUP_IDENTITY_UI_ERROR="
                      +f"{type(exc).__name__}:{exc}"
                  )
                  ui_data={"error":f"{type(exc).__name__}:{exc}"}

              combined={
                  "direct":direct_data,
                  "ui":ui_data,
              }
              print(
                  "PASSING_YARDS_VISIBLE_CLEANUP_PUBLIC_IDENTITY_RESULT="
                  +json.dumps(combined,sort_keys=True)
              )
              print("PASSING_YARDS_VISIBLE_CLEANUP_PUBLIC_IDENTITY_DIAGNOSTIC_COMPLETE")

              direct_context.close()
              ui_context.close()
              browser.close()
          PY
