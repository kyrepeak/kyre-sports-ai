name: NFL Moneyline Step 1 Public Production Proof

on:
  pull_request:
    paths:
      - '.github/workflows/nfl-moneyline-step1-public-proof-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove NFL Moneyline Step 1 on public production
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          BASE = "https://kyre-sports-ai.streamlit.app"
          QUERY = urlencode({
              "ks_nfl_sport": "NFL",
              "ks_nfl_market": "Moneyline",
          })
          URL = BASE + "/?" + QUERY
          required_text = (
              "NFL Moneyline",
              "Command Center",
              "PREGAME VERIFIED",
              "Slate date",
          )
          forbidden_text = (
              "Matchup Board",
              "PREGAME ONLY",
          )

          artifact_dir = Path("artifacts/nfl-moneyline-step1-public-proof")
          artifact_dir.mkdir(parents=True, exist_ok=True)

          last = {"url": URL, "frames": []}
          deadline = time.time() + 480

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1180, "height": 1600})

              while time.time() < deadline:
                  try:
                      page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                  except Exception:
                      time.sleep(10)
                      continue

                  page.wait_for_timeout(8000)
                  scans = []
                  matched = None

                  for index, frame in enumerate(page.frames):
                      try:
                          body = frame.locator("body").inner_text(timeout=5000)
                          style_count = frame.locator(
                              'style[data-nfl-moneyline-visual-step="1"]'
                          ).count()
                      except Exception:
                          body = ""
                          style_count = 0

                      scan = {
                          "index": index,
                          "url": frame.url,
                          "body_start": body[:1200],
                          "step1_style_count": style_count,
                      }
                      scans.append(scan)

                      if (
                          all(token in body for token in required_text)
                          and all(token not in body for token in forbidden_text)
                          and style_count >= 1
                      ):
                          matched = {
                              "frame_index": index,
                              "frame_url": frame.url,
                              "body": body,
                              "step1_style_count": style_count,
                          }
                          break

                  last = {"url": page.url, "frames": scans}

                  if matched:
                      screenshot = artifact_dir / "nfl_moneyline_step1_public_green.png"
                      page.screenshot(path=str(screenshot), full_page=True)
                      result = {
                          "status": "GREEN",
                          "public_url": page.url,
                          "frame_url": matched["frame_url"],
                          "required_text": list(required_text),
                          "forbidden_text_absent": list(forbidden_text),
                          "step1_style_count": matched["step1_style_count"],
                          "production_marker": 'data-nfl-moneyline-visual-step="1"',
                      }
                      (artifact_dir / "result.json").write_text(
                          json.dumps(result, indent=2), encoding="utf-8"
                      )
                      print("NFL_MONEYLINE_STEP1_PUBLIC_PRODUCTION_GREEN")
                      print(json.dumps(result, indent=2))
                      browser.close()
                      raise SystemExit(0)

                  time.sleep(15)

              page.screenshot(
                  path=str(artifact_dir / "nfl_moneyline_step1_public_failure.png"),
                  full_page=True,
              )
              (artifact_dir / "failure.json").write_text(
                  json.dumps(last, indent=2), encoding="utf-8"
              )
              browser.close()

          raise SystemExit(
              "Public Step 1 proof timed out: V14 Command Center markers not observed."
          )
          PY

      - name: Upload public production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-step1-public-proof-${{ github.run_id }}
          path: artifacts/nfl-moneyline-step1-public-proof
          if-no-files-found: error
          retention-days: 7
