name: NFL Spread Step 7E V3 Model MC Certification

on:
  push:
    branches:
      - nfl-spread-model-mc-v1
    paths:
      - 'nfl_spread_hub_v3.py'
      - 'streamlit_memory_lazy_router_v134.py'
      - 'tests/test_nfl_spread_v3_model_mc.py'
      - '.github/workflows/nfl-spread-step7e-v3.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nfl_spread_hub_v3.py'
      - 'streamlit_memory_lazy_router_v134.py'
      - 'tests/test_nfl_spread_v3_model_mc.py'
      - '.github/workflows/nfl-spread-step7e-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-spread-step7e-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-model-mc-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated V3 test stack
        run: |
          python -m pip install --disable-pip-version-check -q requests pandas numpy streamlit pytest

      - name: Compile V3 integration surface
        run: |
          python -m py_compile nfl_spread_hub_v3.py
          python -m py_compile streamlit_memory_lazy_router_v134.py
          python -m py_compile tests/test_nfl_spread_v3_model_mc.py

      - name: Run V3 model and Monte Carlo integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_nfl_spread_v3_model_mc.py

      - name: Prove frozen owners and safety flags
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import nfl_spread_hub_v3 as page
          import streamlit_memory_lazy_router_v134 as router

          assert page.FROZEN_PRESENTATION == 'nfl_spread_hub_v2'
          assert page.FROZEN_TRANSPORT == 'nfl_spread_hub_v1'
          assert page.PROJECTION_MODEL_ENABLED is True
          assert page.MONTE_CARLO_ENABLED is True
          assert page.CERTIFIED_SIMULATIONS == 5_000_000
          assert page.MARKET_LINE_ROLE == 'settlement_only'
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert page.RANKINGS_ENABLED is False
          assert page.STAKE_SIZING_ENABLED is False
          assert page.WAGER_ACTIONS_ENABLED is False

          assert router.FROZEN_ROUTER == 'streamlit_memory_lazy_router_v133'
          assert router.ACTIVE_SPREAD_HUB == 'nfl_spread_hub_v3'
          assert router.PROJECTION_MODEL_ENABLED is True
          assert router.MONTE_CARLO_ENABLED is True
          assert router.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert router.STAKE_SIZING_ENABLED is False
          assert router.WAGER_ACTIONS_ENABLED is False
          print('NFL_SPREAD_STEP7E_V3_FIREWALL_GREEN')
          PY
