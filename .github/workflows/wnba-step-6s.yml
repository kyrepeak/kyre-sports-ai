name: WNBA Step 6S storage-aware Step 6J canary

on:
  push:
    branches:
      - api-foundation-v1
    paths:
      - 'sports_api/wnba_step6s_canary_storage.py'
      - 'sports_api/api/wnba_step6j_canary.py'
      - 'sports_api/tests/test_wnba_step6s_canary_storage.py'
      - '.github/workflows/wnba-step-6s.yml'
  pull_request:
    paths:
      - 'sports_api/wnba_step6s_canary_storage.py'
      - 'sports_api/api/wnba_step6j_canary.py'
      - 'sports_api/tests/test_wnba_step6s_canary_storage.py'
      - '.github/workflows/wnba-step-6s.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step6s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step6s-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Step 6S revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Step 6S revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Certified exact Step 6S revision: $EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 6S core and transported Step 6J API
        run: |
          python -m py_compile \
            sports_api/wnba_step6s_canary_storage.py \
            sports_api/api/wnba_step6j_canary.py

      - name: Run Step 6S storage-aware canary tests
        run: python -m unittest sports_api.tests.test_wnba_step6s_canary_storage

      - name: Run existing Step 6J filesystem canary regression
        run: python -m unittest sports_api.tests.test_wnba_step6j_canary_activation

      - name: Run frozen Step 6R Supabase backend regression
        run: python -m unittest sports_api.tests.test_wnba_step6r_supabase_storage

      - name: Run frozen Step 6Q durable-storage regression
        run: python -m unittest sports_api.tests.test_wnba_step6q_durable_storage

      - name: Run Step 6K scheduler-preflight regression
        run: python -m unittest sports_api.tests.test_wnba_step6k_activation_preflight

      - name: Run Phase 6 master certification regression
        run: python -m unittest sports_api.tests.test_wnba_step6p_phase6_certification

      - name: Prove Step 6J filesystem core was not rewritten
        shell: bash
        run: |
          git diff --exit-code 06781062a93a69cb27982d4e20dec9c8d9bbd9e4 -- \
            sports_api/wnba_step6j_canary_activation.py
          echo 'Step 6J filesystem core remains exactly unchanged from frozen Step 6R revision.'

      - name: Prove frozen Step 6Q and Step 6R implementations were not rewritten
        shell: bash
        run: |
          git diff --exit-code 06781062a93a69cb27982d4e20dec9c8d9bbd9e4 -- \
            sports_api/wnba_step6q_durable_storage.py \
            sports_api/api/wnba_step6q_durable_storage.py \
            sports_api/tests/test_wnba_step6q_durable_storage.py \
            sports_api/wnba_step6r_supabase_storage.py \
            sports_api/api/wnba_step6r_supabase_storage.py \
            sports_api/sql/wnba_step6r_supabase.sql \
            sports_api/tests/test_wnba_step6r_supabase_storage.py
          echo 'Frozen Step 6Q/6R implementations are unchanged.'

      - name: Prove Step 6K preflight remains network-free and untouched
        shell: bash
        run: |
          git diff --exit-code 7bcf8ddcbfedc91e20baac5bbaeb69f21945f611 -- \
            sports_api/wnba_step6k_activation_preflight.py
          python - <<'PY'
          from pathlib import Path
          source = Path('sports_api/wnba_step6k_activation_preflight.py').read_text(encoding='utf-8').lower()
          assert 'readiness_is_network_free' in source
          assert 'scheduler_authorized' in source
          print('Step 6K remains untouched and fail-closed.')
          PY

      - name: Prove Step 6S readiness is network-free and secret-free
        shell: bash
        run: |
          python - <<'PY'
          import json
          import httpx
          from unittest.mock import patch
          from sports_api.wnba_step6q_durable_storage import STORAGE_BACKEND_ENV, SUPABASE_BACKEND
          from sports_api.wnba_step6r_supabase_storage import SUPABASE_SECRET_KEY_ENV, SUPABASE_URL_ENV
          from sports_api.wnba_step6s_canary_storage import get_step6s_canary_storage_status

          secret = 'sb_secret_certification_placeholder_abcdefghijklmnopqrstuvwxyz'
          env = {
              STORAGE_BACKEND_ENV: SUPABASE_BACKEND,
              SUPABASE_URL_ENV: 'https://certification.supabase.co',
              SUPABASE_SECRET_KEY_ENV: secret,
          }
          with patch.object(httpx.Client, 'request', side_effect=AssertionError('status must not call network')):
              result = get_step6s_canary_storage_status(env)
          assert result['configuration_ready'] is True
          assert result['safety']['network_used_by_status'] is False
          assert result['safety']['remote_storage_read_performed_by_status'] is False
          assert result['safety']['storage_write_performed_by_status'] is False
          assert secret not in json.dumps(result, sort_keys=True)
          print('Step 6S readiness is network-free, read-only, and secret-free.')
          PY

      - name: Prove Step 6S transport cannot silently bypass Step 6J gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('sports_api/wnba_step6s_canary_storage.py').read_text(encoding='utf-8')
          assert '_require_canary_gate(environment, activation_id)' in source
          assert 'storage.exclusive_lock(CANARY_LOCK_OBJECT_KEY)' in source
          assert 'write_bytes_atomic(FEED_OBJECT_KEY, post_raw)' in source
          assert '_restore_prewrite_state(' in source
          assert '_legacy_run_step6j_canary(' in source
          assert 'step6k_remains_fail_closed_for_supabase_until_later_step' in source
          print('Step 6S preserves Step 6J gates, locking, rollback, and filesystem delegation.')
          PY

      - name: Prove certification performs no live activation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/wnba-step-6s.yml').read_text(encoding='utf-8').lower()
          forbidden_render_action = 'render' + ' api'
          forbidden_secret_context = 'secrets' + '.'
          assert forbidden_render_action not in workflow
          assert 'workflow_dispatch' in workflow
          assert forbidden_secret_context not in workflow
          print('Step 6S certification contains no live hosting or Supabase activation action.')
          PY
