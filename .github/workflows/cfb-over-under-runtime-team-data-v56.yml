name: CFB O/U runtime team data V56

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-runtime-team-data-hotfix-v1]
permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive scope and frozen parents
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()

          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-runtime-team-data-v56.yml",
              "app.py",
              "data/cfb_runtime_snapshot_v1.json",
              "cfb_schedule_v5_runtime_snapshot.py",
              "cfb_over_under_runtime_team_data_v1.py",
              "cfb_over_under_runtime_deep_adapter_v1.py",
              "cfb_over_under_matchup_ui_v16_runtime_team_data.py",
              "streamlit_memory_lazy_router_v56.py",
              "tests/test_cfb_over_under_runtime_team_data_v1.py",
              "tests/test_cfb_schedule_v5_runtime_snapshot.py",
              "tests/test_cfb_over_under_runtime_ui_router_v56.py",
          }
          failures=[]
          if actual!=expected:
              failures.append(f"scope mismatch expected={sorted(expected)} actual={sorted(actual)}")

          manifests=[
              ("cfb_over_under_upgrade_freeze_manifest_v12.json","b2a798b4625bda5b8472a30e66cde2ecf6aef923"),
              ("cfb_over_under_post12_data_recovery_freeze_manifest_v1.json","8baab0745d2b6fb1214da47eb5c0c6dd22355944"),
              ("cfb_over_under_deep_data_reconciliation_freeze_manifest_v1.json","d4734a3533a7a9a3f3d8ff570a00e831a1ada4ab"),
              ("cfb_over_under_visible_data_path_freeze_manifest_v1.json","068457e3baa267ba7f824f1c22c109d4f48402c3"),
          ]
          for path, blob in manifests:
              if rev(f"HEAD:{path}")!=blob:
                  failures.append(f"parent manifest changed: {path}")
              m=json.loads(pathlib.Path(path).read_text())
              for frozen, expected_blob in (m.get("exact_blobs") or {}).items():
                  try:
                      current=rev(f"HEAD:{frozen}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing frozen path: {frozen}")
                      continue
                  if current!=expected_blob:
                      failures.append(f"frozen blob changed: {frozen}")

          if failures:
              print(*failures, sep="\n")
              sys.exit(1)
          print("CFB_OU_V56_SCOPE_AND_PARENT_FREEZES=PASS")
          PY

      - name: Compile V56
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_schedule_v5_runtime_snapshot.py",
              "cfb_over_under_runtime_team_data_v1.py",
              "cfb_over_under_runtime_deep_adapter_v1.py",
              "cfb_over_under_matchup_ui_v16_runtime_team_data.py",
              "streamlit_memory_lazy_router_v56.py",
              "tests/test_cfb_over_under_runtime_team_data_v1.py",
              "tests/test_cfb_schedule_v5_runtime_snapshot.py",
              "tests/test_cfb_over_under_runtime_ui_router_v56.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_V56_COMPILE=PASS")
          PY

      - name: Run V56 and inherited regression suite
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_cfb_over_under_runtime_team_data_v1.py             tests/test_cfb_schedule_v5_runtime_snapshot.py             tests/test_cfb_over_under_runtime_ui_router_v56.py             tests/test_cfb_schedule_v4_visible_enrichment.py             tests/test_cfb_over_under_visible_data_path_v15.py             tests/test_cfb_over_under_deep_data_reconciliation_v1.py             tests/test_cfb_over_under_deep_data_ui_router.py             tests/test_cfb_over_under_post12_data_recovery.py             tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py             tests/test_cfb_over_under_upgrade_step12_certification.py             tests/test_cfb_over_under_upgrade_step12_slate.py             tests/test_cfb_over_under_upgrade_step12_ui_router.py             tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py             tests/test_cfb_over_under_upgrade_step11_slate.py             tests/test_cfb_over_under_upgrade_step11_ui_router.py             tests/test_cfb_over_under_upgrade_step10_history_engine.py             tests/test_cfb_over_under_upgrade_step10_slate.py             tests/test_cfb_over_under_upgrade_step10_ui_router.py             tests/test_cfb_over_under_upgrade_step9_environment_engine.py             tests/test_cfb_over_under_upgrade_step9_slate.py             tests/test_cfb_over_under_upgrade_step9_ui_router.py             tests/test_cfb_over_under_upgrade_step8_turnover_engine.py             tests/test_cfb_over_under_upgrade_step8_slate.py             tests/test_cfb_over_under_upgrade_step8_ui_router.py             tests/test_cfb_over_under_upgrade_step7_third_down_engine.py             tests/test_cfb_over_under_upgrade_step7_slate.py             tests/test_cfb_over_under_upgrade_step7_ui_router.py             tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py             tests/test_cfb_over_under_upgrade_step6_slate.py             tests/test_cfb_over_under_upgrade_step6_ui_router.py             tests/test_cfb_over_under_upgrade_step5_explosive_engine.py             tests/test_cfb_over_under_upgrade_step5_slate.py             tests/test_cfb_over_under_upgrade_step5_ui_router.py             tests/test_cfb_over_under_upgrade_step4_pace_engine.py             tests/test_cfb_over_under_upgrade_step4_slate.py             tests/test_cfb_over_under_upgrade_step4_ui_router.py             tests/test_cfb_over_under_upgrade_step3_engine.py             tests/test_cfb_over_under_upgrade_step3_slate.py             tests/test_cfb_over_under_upgrade_step3_ui.py             tests/test_cfb_over_under_multisource_logo_resolver_v2.py             tests/test_cfb_over_under_multisource_logo_hotfix_v4.py             tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Force deployed-runtime provider failure and require snapshot recovery
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_over_under_runtime_team_data_v1 as runtime

          stale={
              "away":{
                  "team":"Florida A&M","conference":"SWAC","division_context":"FCS",
                  "record_text":"0-0","record":{"games":0},"home_record":{},"away_record":{},
                  "recent_form":"—","ppg":16.5,"points_allowed_pg":19.0,"official_stats":{},
              },
              "home":{
                  "team":"Miami (FL)","conference":"ACC","division_context":"FBS",
                  "record_text":"0-0","record":{"games":0},"home_record":{},"away_record":{},
                  "recent_form":"—","ppg":45.0,"points_allowed_pg":6.0,"official_stats":{},
                  "ap_rank":None,
              },
          }
          game={
              "game_date":"2026-09-10",
              "away_team":"Florida A&M",
              "home_team":"Miami (FL)",
              "venue":"Venue unavailable",
              "broadcast":"Broadcast unavailable",
          }

          original_frozen=runtime.frozen.load_matchup_team_data
          original_deep=runtime.deep.reconcile_matchup
          runtime.frozen.load_matchup_team_data=lambda *a,**k:(stale,{"attempts":[]})
          runtime.deep.reconcile_matchup=lambda *a,**k:(_ for _ in ()).throw(RuntimeError("forced provider block"))
          try:
              g, away, home, diag=runtime.reconcile_runtime(game,"2026-09-10")
          finally:
              runtime.frozen.load_matchup_team_data=original_frozen
              runtime.deep.reconcile_matchup=original_deep

          print("FORCED_RUNTIME_RECOVERY",json.dumps({
              "status":diag.get("runtime_status"),
              "snapshot_used":diag.get("runtime_snapshot_used"),
              "venue":g.get("venue"),
              "broadcast":g.get("broadcast"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "away_form":away.get("recent_form"),
              "home_form":home.get("recent_form"),
              "away_coach":away.get("head_coach"),
              "home_coach":home.get("head_coach"),
              "home_ap":home.get("ap_rank"),
              "home_coaches":home.get("coaches_poll_rank"),
          },indent=2,default=str))

          expected={
              "status":"GREEN",
              "snapshot_used":True,
              "venue":"Hard Rock Stadium",
              "broadcast":"ACC Network",
              "away_record":"1-1",
              "home_record":"1-0",
              "away_form":"WL",
              "home_form":"W",
              "away_coach":"Quinn Gray Sr.",
              "home_coach":"Mario Cristobal",
              "home_ap":7,
              "home_coaches":7,
          }
          actual={
              "status":diag.get("runtime_status"),
              "snapshot_used":diag.get("runtime_snapshot_used"),
              "venue":g.get("venue"),
              "broadcast":g.get("broadcast"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "away_form":away.get("recent_form"),
              "home_form":home.get("recent_form"),
              "away_coach":away.get("head_coach"),
              "home_coach":home.get("head_coach"),
              "home_ap":home.get("ap_rank"),
              "home_coaches":home.get("coaches_poll_rank"),
          }
          for key,value in expected.items():
              if actual.get(key)!=value:
                  raise SystemExit(f"{key}: expected {value!r}, got {actual.get(key)!r}")
          print("FORCED_STREAMLIT_RUNTIME_SNAPSHOT_RECOVERY=PASS")
          PY

      - name: Force zero ESPN runtime match and require Schedule V5 green
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v5_runtime_snapshot as schedule

          game={
              "game_date":"2026-09-10",
              "away_team":"Florida A&M",
              "home_team":"Miami (FL)",
              "venue":"Venue unavailable",
              "broadcast":"Broadcast unavailable",
              "identity_verified":True,
              "date_matches_query":True,
          }

          original=schedule.frozen.load_with_diagnostics
          schedule.frozen.load_with_diagnostics=lambda day:([game],{
              "games":1,
              "identity_ready":True,
              "espn_matches":0,
              "venue_missing":1,
              "broadcast_missing":1,
          })
          try:
              rows,diag=schedule.load_with_diagnostics.__wrapped__("2026-09-10")
          finally:
              schedule.frozen.load_with_diagnostics=original

          row=rows[0]
          print("FORCED_SCHEDULE_V5",json.dumps({
              "espn_matches":diag.get("espn_matches"),
              "snapshot_matches":diag.get("runtime_snapshot_matches"),
              "venue_missing":diag.get("venue_missing"),
              "broadcast_missing":diag.get("broadcast_missing"),
              "venue":row.get("venue"),
              "broadcast":row.get("broadcast"),
              "record_away":row.get("away_record_summary"),
              "record_home":row.get("home_record_summary"),
              "home_rank":row.get("home_rank"),
          },indent=2,default=str))

          if int(diag.get("espn_matches") or 0)!=1:
              raise SystemExit("Schedule V5 failed to replace zero enrichment match")
          if int(diag.get("venue_missing") or 0)!=0:
              raise SystemExit("Schedule V5 venue still missing")
          if int(diag.get("broadcast_missing") or 0)!=0:
              raise SystemExit("Schedule V5 broadcast still missing")
          if row.get("away_record_summary")!="1-1" or row.get("home_record_summary")!="1-0":
              raise SystemExit("Schedule V5 current records missing")
          if row.get("home_rank")!=7:
              raise SystemExit("Schedule V5 Miami rank missing")
          print("FORCED_STREAMLIT_SCHEDULE_V5_GREEN=PASS")
          PY

      - name: Central base-hub handoff certification
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_matchup_ui_v16_runtime_team_data as ui

          original_render=ui.frozen_v15.render_over_under_hub
          seen={}
          def fake_render(*args,**kwargs):
              seen["team_data"]=ui.base_hub.team_data
              seen["hero"]=ui.frozen_v15._hero_v15
              seen["deep_data"]=ui.deep_slate.deep_data
              seen["schedule"]=ui.frozen_v15.schedule_v4
              return None

          ui.frozen_v15.render_over_under_hub=fake_render
          ui._reset_runtime_caches_once=lambda:None
          try:
              ui.render_over_under_hub()
          finally:
              ui.frozen_v15.render_over_under_hub=original_render

          if seen.get("team_data") is not ui.runtime_team_data:
              raise SystemExit("base hub did not receive central runtime team-data adapter")
          if seen.get("hero") is not ui._hero_v16:
              raise SystemExit("V16 hero not active")
          if seen.get("deep_data") is not ui.runtime_deep:
              raise SystemExit("model deep-slate adapter not active")
          if seen.get("schedule") is not ui.schedule_v5:
              raise SystemExit("snapshot-backed Schedule V5 not active")
          print("CFB_OU_V56_CENTRAL_HANDOFF=PASS")
          PY

      - name: Live full model remains Step-12 certified using runtime adapter
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v5_runtime_snapshot as schedule
          import cfb_over_under_slate_v13_deep_data as slate
          import cfb_over_under_runtime_deep_adapter_v1 as runtime_deep

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(
              g for g in games
              if "Florida A&M" in str(g.get("away_team"))
              and "Miami" in str(g.get("home_team"))
          )

          original=slate.deep_data
          slate.deep_data=runtime_deep
          try:
              try: slate.analyze_game.clear()
              except Exception: pass
              result=slate.analyze_game(game,"2026-09-10",50.5)
          finally:
              slate.deep_data=original

          cert=result.get("certification") or {}
          away=result.get("away") or {}
          home=result.get("home") or {}
          print("LIVE_V56_MODEL",json.dumps({
              "cert_status":cert.get("status"),
              "cert_failures":cert.get("checks_failed"),
              "away_record":away.get("record_text"),
              "home_record":home.get("record_text"),
              "home_ap":home.get("ap_rank"),
              "projected_total":(result.get("raw") or {}).get("projected_total"),
              "selection":(result.get("final") or {}).get("selection"),
          },indent=2,default=str))

          if cert.get("status")!="CERTIFIED" or int(cert.get("checks_failed") or 0)!=0:
              raise SystemExit(f"Step-12 certification lost: {cert}")
          if away.get("record_text")!="1-1" or home.get("record_text")!="1-0":
              raise SystemExit("runtime profiles did not reach model stack")
          print("LIVE_V56_RUNTIME_MODEL_STEP12_CERTIFIED=PASS")
          PY

      - name: V56 firewall
        run: |
          grep -F 'from streamlit_memory_lazy_router_v56 import render_app' app.py
          python - <<'PY'
          from pathlib import Path
          text="\n".join(Path(p).read_text() for p in (
              "cfb_schedule_v5_runtime_snapshot.py",
              "cfb_over_under_runtime_team_data_v1.py",
              "cfb_over_under_runtime_deep_adapter_v1.py",
              "cfb_over_under_matchup_ui_v16_runtime_team_data.py",
              "streamlit_memory_lazy_router_v56.py",
          ))
          for token in (
              'FROZEN_SCHEDULE = "cfb_schedule_v4"',
              'FROZEN_TEAM_DATA = "cfb_team_data_v2"',
              'FROZEN_PARENT_UI = "cfb_over_under_matchup_ui_v15_visible_data_path"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v55"',
          ):
              if token not in text:
                  raise SystemExit(f"missing frozen-parent marker: {token}")
          lower=text.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"V56 crossed model firewall: {token}")
          print("CFB_OU_V56_FIREWALL=PASS")
          PY

      - run: echo CFB_OU_RUNTIME_TEAM_DATA_V56_GREEN
