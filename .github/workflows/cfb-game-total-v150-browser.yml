name: CFB Game Total V150 browser certification

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v1.py"
      - "streamlit_memory_lazy_router_v149.py"
      - "streamlit_memory_lazy_router_v150.py"
      - "devsystem/cfb_game_total_browser_qa_v1.py"
      - "tests/conftest.py"
      - ".github/workflows/cfb-game-total-v150-browser.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v1.py"
      - "streamlit_memory_lazy_router_v149.py"
      - "streamlit_memory_lazy_router_v150.py"
      - "devsystem/cfb_game_total_browser_qa_v1.py"
      - "tests/conftest.py"
      - ".github/workflows/cfb-game-total-v150-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v150-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-total-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-browser-qa
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-browser-qa/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v150_streamlit_pid

      - name: Drive College Football to Game Total with Playwright
        run: |
          python devsystem/cfb_game_total_browser_qa_v1.py \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-browser-qa

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/cfb-game-total-browser-qa/streamlit.log || true

      - name: Upload Game Total browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v150-browser-${{ github.run_id }}
          path: artifacts/cfb-game-total-browser-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v150_streamlit_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v150_streamlit_pid)" 2>/dev/null || true
          fi
