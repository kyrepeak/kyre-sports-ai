name: CFB Game Total V150 browser certification

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "tests/conftest.py"
      - "cfb_game_total_page1_atier_v4.py"
      - "cfb_game_total_page1_atier_v6.py"
      - "devsystem/guardian_cfb_game_total_terminal_browser_qa_v1.py"
      - "tests/test_guardian_cfb_game_total_terminal_browser_qa_v1.py"
      - ".github/workflows/cfb-game-total-v150-browser.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "tests/conftest.py"
      - "cfb_game_total_page1_atier_v4.py"
      - "cfb_game_total_page1_atier_v6.py"
      - "devsystem/guardian_cfb_game_total_terminal_browser_qa_v1.py"
      - "tests/test_guardian_cfb_game_total_terminal_browser_qa_v1.py"
      - ".github/workflows/cfb-game-total-v150-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v150-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-total-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile current terminal Guardian proof
        run: |
          python -m py_compile app.py
          python -m py_compile devsystem/guardian_cfb_game_total_terminal_browser_qa_v1.py

      - name: Prove terminal certification contract
        run: |
          PYTHONPATH=. python -m pytest --noconftest -q \
            tests/test_guardian_cfb_game_total_terminal_browser_qa_v1.py

      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-browser-qa
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-browser-qa/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v150_streamlit_pid

      - name: Capture one current terminal render boundary
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          url = "http://127.0.0.1:8501/?" + urlencode({"sport": "cfb", "market": "game-total"})
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width": 1067, "height": 1536})
              page.goto(url, wait_until="domcontentloaded", timeout=120000)
              snapshots = []
              for delay_ms in (2000, 5000, 10000):
                  page.wait_for_timeout(delay_ms if not snapshots else delay_ms - snapshots[-1]["at_ms"])
                  body = page.locator("body").inner_text(timeout=10000)
                  snapshots.append({"at_ms": delay_ms, "url": page.url, "body": body[:12000]})
              print("GUARDIAN_TERMINAL_RENDER_BOUNDARY_BEGIN")
              print(json.dumps(snapshots, indent=2, ensure_ascii=False))
              print("GUARDIAN_TERMINAL_RENDER_BOUNDARY_END")
              browser.close()
          PY

      - name: Certify current CFB Game Total terminal route
        run: |
          python -m devsystem.guardian_cfb_game_total_terminal_browser_qa_v1 \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-browser-qa

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/cfb-game-total-browser-qa/streamlit.log || true

      - name: Upload Game Total browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v150-browser-${{ github.run_id }}
          path: artifacts/cfb-game-total-browser-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v150_streamlit_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v150_streamlit_pid)" 2>/dev/null || true
          fi
