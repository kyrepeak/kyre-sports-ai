name: MONSTER Step 2G Final Production Convergence V1

on:
  pull_request:
    branches: [monster-main]
    paths:
      - "app.py"
      - "devsystem/monster_runtime_identity_v1.py"
      - "devsystem/monster_step2g_live_convergence_probe_v1.py"
      - "devsystem/monster_step2g_frozen_checkpoint_v1.py"
      - "devsystem/mandatory_2g_final_production_convergence_v1.py"
      - "devsystem/mandatory_2c2d2e2f_permanent_enforcement_v1.py"
      - "devsystem/monster_authoritative_proof_receipt_v1.py"
      - "devsystem/monster_proof_plans/monster-step2g-final-production-convergence-v1.json"
      - "devsystem/task_ledgers/monster-step2g-final-production-convergence-v1.json"
      - "tests/test_devsystem_monster_runtime_identity_v1.py"
      - "tests/test_devsystem_monster_step2g_frozen_checkpoint_v1.py"
      - "tests/test_devsystem_mandatory_2g_final_production_convergence_v1.py"
      - "tests/test_devsystem_monster_step2g_permanent_integration_v1.py"
      - ".github/workflows/monster-step2g-final-production-convergence-v1.yml"
  push:
    branches: [monster-main]

permissions:
  contents: read

concurrency:
  group: monster-step2g-final-production-convergence-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  monster-step2g-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narrow test dependency
        run: python -m pip install -q pytest
      - name: Existing MONSTER Step 2A + Anti-Loop controls
        run: |
          python devsystem/automatic_loop_kill_v1.py
          python devsystem/mandatory_2a_action_gate_v1.py
      - name: Compile Step 2G controls
        run: |
          python -m py_compile devsystem/mandatory_2g_final_production_convergence_v1.py
          python -m py_compile devsystem/monster_runtime_identity_v1.py
          python -m py_compile devsystem/monster_step2g_live_convergence_probe_v1.py
          python -m py_compile devsystem/monster_step2g_frozen_checkpoint_v1.py
      - name: Step 2G focused + permanent integration contracts
        run: |
          python -m pytest --noconftest -q \
            tests/test_devsystem_monster_runtime_identity_v1.py \
            tests/test_devsystem_monster_step2g_frozen_checkpoint_v1.py \
            tests/test_devsystem_mandatory_2g_final_production_convergence_v1.py \
            tests/test_devsystem_monster_step2g_permanent_integration_v1.py

  monster-step2g-live-convergence:
    if: github.event_name == 'push'
    needs: monster-step2g-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout certified MONSTER state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout protected production main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser proof dependency
        run: |
          python -m pip install -q playwright==1.62.0
          python -m playwright install chromium
      - name: Prove exact live MONSTER convergence
        run: |
          CERTIFIED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          RUNTIME_SHA="$(git -C production-main rev-parse HEAD)"
          RUNTIME_TREE_SHA="$(git -C production-main rev-parse 'HEAD^{tree}')"
          python devsystem/monster_step2g_live_convergence_probe_v1.py \
            --url "https://pickvault.streamlit.app" \
            --expected-sha "${GITHUB_SHA}" \
            --expected-tree-sha "${CERTIFIED_TREE_SHA}" \
            --expected-runtime-sha "${RUNTIME_SHA}" \
            --expected-runtime-tree-sha "${RUNTIME_TREE_SHA}" \
            --output "devsystem/evidence/monster_step2g_live_convergence_v1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-step2g-live-convergence-${{ github.sha }}
          path: devsystem/evidence/monster_step2g_live_convergence_v1.json
          if-no-files-found: warn
