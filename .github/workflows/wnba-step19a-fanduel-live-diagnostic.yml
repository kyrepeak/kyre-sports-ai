name: WNBA Step19A FanDuel Live Diagnostic

on:
  push:
    branches:
      - wnba-step19a-fanduel-live-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Inspect current FanDuel player runner contract
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import json
          from sports_api import wnba_step11_fanduel_provider as fd

          now = datetime.now(timezone.utc)
          target = now.astimezone(ZoneInfo("America/New_York")).date().isoformat()
          content = fd._get_json(
              fd.FANDUEL_BASE_URL + fd.CONTENT_PAGE_PATH,
              params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "page": "CUSTOM", "customPageId": fd.WNBA_CUSTOM_PAGE_ID, "timezone": "America/New_York"},
              requester=None, timeout=15.0,
          )
          events = fd._extract_events(content)
          event = None
          for row in events:
              raw = row.get("openDate") or row.get("startTime") or row.get("startEventDate")
              try:
                  day = fd._utc(raw, "event time").astimezone(ZoneInfo("America/New_York")).date().isoformat()
              except Exception:
                  continue
              if day == target and len(fd._event_participants(row)) == 2:
                  event = row; break
          assert event is not None
          eid = fd._event_id(event)
          url = fd.FANDUEL_BASE_URL + fd.EVENT_PAGE_PATH

          for slug in ("player-points", "player-assists", "player-rebounds", "player-combos"):
              doc = fd._get_json(url, params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "eventId": eid, "tab": slug}, requester=None, timeout=15.0)
              markets = fd._extract_markets(doc)
              player_markets = [m for m in markets if str(m.get("marketType") or m.get("type") or "").startswith("PLAYER_")]
              print("FD_SLUG_SUMMARY", json.dumps({"slug": slug, "market_count": len(markets), "player_market_count": len(player_markets), "market_names": [(m.get("marketName") or m.get("name")) for m in player_markets[:8]]}, sort_keys=True, default=str))
              if player_markets:
                  market = player_markets[0]
                  runners = fd._iter_mapping_or_list(market.get("runners"))
                  print("FD_RAW_PLAYER_MARKET", json.dumps({
                      "slug": slug,
                      "market": market,
                      "runner_side_line_results": [fd._runner_side_line(r) for r in runners],
                      "declares_player": fd._declares_player_market(market, runners),
                  }, sort_keys=True, default=str))
          PY
