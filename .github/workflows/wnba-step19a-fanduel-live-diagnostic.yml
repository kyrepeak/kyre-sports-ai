name: WNBA Step19A FanDuel Live Diagnostic

on:
  push:
    branches:
      - wnba-step19a-fanduel-live-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: "true"
  WNBA_STEP10_FASTAPI_ENABLED: "true"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Inspect current FanDuel WNBA surface
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import json
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api.wnba_step7g_first_party_rosters import get_first_party_current_players_dataset

          now = datetime.now(timezone.utc)
          target_et = now.astimezone(ZoneInfo("America/New_York")).date().isoformat()
          common = {"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "page": "CUSTOM", "customPageId": fd.WNBA_CUSTOM_PAGE_ID, "timezone": "America/New_York"}
          content = fd._get_json(fd.FANDUEL_BASE_URL + fd.CONTENT_PAGE_PATH, params=common, requester=None, timeout=15.0)
          events = fd._extract_events(content)
          print("FD_TARGET_ET_DATE", target_et)
          for event in events:
              raw_time = event.get("openDate") or event.get("startTime") or event.get("startEventDate")
              et_day = None
              try:
                  et_day = fd._utc(raw_time, "event time").astimezone(ZoneInfo("America/New_York")).date().isoformat()
              except Exception:
                  pass
              print("FD_EVENT", json.dumps({
                  "id": fd._event_id(event), "name": fd._event_name(event),
                  "participants": fd._event_participants(event), "raw_time": raw_time,
                  "utc_day": fd._event_date(event), "et_day": et_day,
              }, sort_keys=True, default=str))

          roster = fd._roster_index(get_first_party_current_players_dataset(2026, current_roster_only=True)["players"])
          today = []
          for event in events:
              raw_time = event.get("openDate") or event.get("startTime") or event.get("startEventDate")
              try:
                  et_day = fd._utc(raw_time, "event time").astimezone(ZoneInfo("America/New_York")).date().isoformat()
              except Exception:
                  et_day = None
              if et_day == target_et:
                  today.append(event)

          print("FD_TODAY_ET_COUNT", len(today))
          for event in today:
              eid = fd._event_id(event)
              base = fd._get_json(fd.FANDUEL_BASE_URL + fd.EVENT_PAGE_PATH, params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "eventId": eid}, requester=None, timeout=15.0)
              layout = base.get("layout") or {}
              all_tabs = fd._iter_mapping_or_list(layout.get("tabs") if isinstance(layout, dict) else None)
              print("FD_TABS", json.dumps([{"id": t.get("id") or t.get("tabId") or t.get("_attachment_key"), "title": t.get("title") or t.get("name") or t.get("displayName")} for t in all_tabs], sort_keys=True, default=str))
              tab_ids = fd._relevant_tab_ids(base)
              docs = [("base", base)]
              for tab_id in tab_ids:
                  docs.append((str(tab_id), fd._get_json(fd.FANDUEL_BASE_URL + fd.EVENT_PAGE_PATH, params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "eventId": eid, "tab": tab_id}, requester=None, timeout=15.0)))
              for label, doc in docs:
                  markets = fd._extract_markets(doc)
                  stats = Counter()
                  parsed = []
                  for market in markets:
                      stat = fd._market_stat(market)
                      if stat:
                          stats[stat] += 1
                          runners = fd._iter_mapping_or_list(market.get("runners"))
                          player = fd._market_player_name(market, runners, stat)
                          sides = [fd._runner_side_line(r) for r in runners]
                          parsed.append({
                              "name": market.get("marketName") or market.get("name"),
                              "type": market.get("marketType") or market.get("type"),
                              "stat": stat, "player": player,
                              "roster_match": fd._name_key(player) in roster if player else False,
                              "runner_names": [(r.get("runnerName") or r.get("name") or r.get("selectionName")) for r in runners[:2]],
                              "side_lines": sides[:2],
                          })
                  print("FD_DOC", json.dumps({"event_id": eid, "doc": label, "markets": len(markets), "stats": dict(stats), "parsed_samples": parsed[:20]}, sort_keys=True, default=str))

          try:
              result = fd.fetch_step11c_fanduel_provider_bridge(season=2026, slate_date=target_et, evaluated_at=now, env=dict(__import__('os').environ))
          except Exception as exc:
              print("FD_FINAL_FAIL", type(exc).__name__, " ".join(str(exc).split())[:1000])
          else:
              payload = (((result.get("provider_refresh") or {}).get("attempts") or [{}])[0].get("payload") or {})
              print("FD_FINAL_OK", len(payload.get("records") or []))
          PY
