name: Passing Yards Layered Hub Step 2 Shell

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step2-shell-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_shell_v1.py"
      - "prototypes/passing_yards_layered_hub_app_v1.py"
      - "tests/test_passing_yards_layered_hub_shell_step2_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step2-shell-v1.yml"

permissions:
  contents: read

jobs:
  targeted-shell-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Step 2 shell only
        run: python tests/test_passing_yards_layered_hub_shell_step2_v1.py
