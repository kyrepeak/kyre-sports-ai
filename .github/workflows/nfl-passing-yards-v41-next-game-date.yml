name: NFL Passing Yards V41 Next Game Date

on:
  pull_request:
    paths:
      - "nfl_passing_yards_hub_v41.py"
      - "streamlit_memory_lazy_router_v186.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v41_next_game_date.py"
      - ".github/workflows/nfl-passing-yards-v41-next-game-date.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run V41 next-game-date contract
        run: python -m pytest -q tests/test_nfl_passing_yards_v41_next_game_date.py
