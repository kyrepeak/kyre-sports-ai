name: API2 NFL Anytime TD Canonical Router V1

on:
  pull_request:
    branches:
      - api2-main
    paths:
      - 'nfl_anytime_td_runtime_v1.py'
      - 'api2_universal_sports_router_registry_v1.py'
      - 'universal_runtime_v5_loader.py'
      - 'tests/test_api2_nfl_anytime_td_canonical_router_v1.py'
      - 'tests/test_api2_step2e_universal_router_completion_v1.py'
      - '.github/workflows/api2-nfl-anytime-td-canonical-router-v1.yml'

permissions:
  contents: read

jobs:
  anytime-td-router-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile route boundary
        run: python -m py_compile api2_universal_sports_router_registry_v1.py universal_runtime_v5_loader.py nfl_anytime_td_runtime_v1.py
      - name: Anytime TD canonical ownership + Step 2E regression proof
        run: |
          python -m pytest -q --noconftest \
            tests/test_api2_nfl_anytime_td_canonical_router_v1.py \
            tests/test_api2_step2e_universal_router_completion_v1.py
