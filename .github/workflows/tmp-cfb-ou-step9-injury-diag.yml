name: TEMP CFB O/U Step 9 injury diagnostic

on:
  push:
    branches: [cfb-ou-upgrade-step9-availability-injury]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Summarize ESPN roster availability
        run: |
          python - <<'PY'
          import json,requests

          for tid,name in (("50","Florida A&M"),("2390","Miami (FL)")):
              url=f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/{tid}/roster"
              r=requests.get(url,timeout=20)
              print("HTTP",name,r.status_code,url)
              p=r.json()
              rows=[]
              total=0
              active=0
              for group in p.get("athletes") or []:
                  group_name=group.get("position")
                  for a in group.get("items") or []:
                      total+=1
                      status=a.get("status") or {}
                      injuries=a.get("injuries") or []
                      pos=a.get("position") or {}
                      if str(status.get("type") or "").lower()=="active":
                          active+=1
                      if injuries or str(status.get("type") or "").lower()!="active":
                          rows.append({
                              "name":a.get("displayName"),
                              "position":pos.get("abbreviation") or pos.get("displayName"),
                              "group":group_name,
                              "status":status,
                              "injuries":injuries,
                              "experience":a.get("experience"),
                          })
              print("SUMMARY",name,json.dumps({
                  "timestamp":p.get("timestamp"),
                  "status":p.get("status"),
                  "total":total,
                  "active":active,
                  "flagged":len(rows),
              }))
              print("FLAGGED",name,json.dumps(rows,default=str,indent=2))
          PY
