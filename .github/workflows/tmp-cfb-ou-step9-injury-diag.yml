name: TEMP CFB O/U Step 9 injury diagnostic

on:
  push:
    branches: [cfb-ou-upgrade-step9-availability-injury]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sample ESPN roster injury coverage across the slate
        run: |
          python - <<'PY'
          import json,requests

          s=requests.Session()
          board=s.get(
              "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",
              params={"dates":"20260912","limit":1000},
              timeout=20,
          ).json()
          teams={}
          for e in board.get("events") or []:
              comps=(e.get("competitions") or [{}])[0]
              for c in comps.get("competitors") or []:
                  t=c.get("team") or {}
                  tid=str(t.get("id") or "")
                  if tid:
                      teams[tid]=t.get("displayName") or t.get("shortDisplayName") or tid
          print("TEAM_COUNT",len(teams))
          flagged_teams=[]
          checked=0
          for tid,name in list(teams.items())[:60]:
              try:
                  p=s.get(
                      f"https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/{tid}/roster",
                      timeout=20,
                  ).json()
              except Exception as e:
                  print("ERROR",tid,name,type(e).__name__,str(e))
                  continue
              checked+=1
              flags=[]
              total=0
              for group in p.get("athletes") or []:
                  group_name=group.get("position")
                  for a in group.get("items") or []:
                      total+=1
                      status=a.get("status") or {}
                      injuries=a.get("injuries") or []
                      st=str(status.get("type") or "").lower()
                      if injuries or st not in ("","active"):
                          flags.append({
                              "name":a.get("displayName"),
                              "pos":(a.get("position") or {}).get("abbreviation"),
                              "group":group_name,
                              "status":status,
                              "injuries":injuries,
                          })
              if flags:
                  flagged_teams.append({"id":tid,"team":name,"total":total,"flags":flags})
                  print("FLAGGED_TEAM",tid,name,json.dumps(flags,default=str)[:12000])
          print("CHECKED",checked)
          print("FLAGGED_TEAM_COUNT",len(flagged_teams))
          print("FLAGGED_SUMMARY",json.dumps([
              {"id":x["id"],"team":x["team"],"flag_count":len(x["flags"])}
              for x in flagged_teams
          ]))
          PY
