name: WNBA Step19H guarded Render transport probe

on:
  push:
    branches: [wnba-step19h-render-transport-probe-20260829]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wnba-step19h-render-transport-probe
  cancel-in-progress: true

env:
  CERTIFICATION_RUN_ID: '33281877135'
  ROLLBACK_SHA: '222550f3d2db46d470e4ba050848a9110920fcab'
  RENDER_SERVICE_ID: 'srv-da84q6ifngtc73bdbm6g'
  RENDER_SERVICE_URL: 'https://kyre-sports-api.onrender.com'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: wnba-render-staging
    steps:
      - name: Checkout exact Step19H diagnostic candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require successful Step19H certification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          run_id=os.environ['CERTIFICATION_RUN_ID']
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}"
          headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for _ in range(90):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  run=json.loads(response.read().decode())
              print('STEP19H_CERT_GATE',run.get('status'),run.get('conclusion'),flush=True)
              if run.get('status')=='completed':
                  if run.get('conclusion')!='success':
                      raise SystemExit('Step19H certification did not pass: '+str(run.get('conclusion')))
                  print('STEP19H_PARENT_CERTIFICATION_PASSED')
                  break
              time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for Step19H certification')
          PY

      - name: Re-run exact-SHA focused regression
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install pytest >/dev/null
          python -m pytest -q \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py

      - name: Deploy metadata-only diagnostic to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={
              'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json','Content-Type':'application/json',
          }
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step19h-render-transport-probe',
          }.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deploy=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deploy.get('id')
          if not did: raise SystemExit('Step19H Render deploy id missing')
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower(): raise SystemExit('Step19H Render SHA mismatch')
                  print('STEP19H_RENDER_PROBE_LIVE',did,sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}:
                  raise SystemExit('Step19H Render deploy failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Step19H Render deploy timeout')
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Capture sanitized Render FanDuel response metadata
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['RENDER_SERVICE_URL']
          def get(path):
              request=urllib.request.Request(base+path,headers={'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  return json.loads(response.read().decode())
          status=None
          for index in range(90):
              status=get('/api/v1/wnba/runtime/step19h-fanduel-transport')
              count=int(status.get('captured_event_count') or 0)
              if index % 3 == 0:
                  print('STEP19H_WAIT',json.dumps({'index':index,'installed':status.get('installed'),'captured_event_count':count,'invalid_json_event_count':status.get('invalid_json_event_count')},sort_keys=True),flush=True)
              if status.get('installed') is True and count >= 1:
                  break
              time.sleep(10)
          else:
              raise SystemExit('Step19H captured no hosted FanDuel transport response')

          events=status.get('events') or []
          safe=[{
              'host':e.get('host'),
              'path':e.get('path'),
              'status_code':e.get('status_code'),
              'content_type':e.get('content_type'),
              'content_encoding':e.get('content_encoding'),
              'content_length_header':e.get('content_length_header'),
              'body_byte_length':e.get('body_byte_length'),
              'body_sha256':e.get('body_sha256'),
              'body_shape':e.get('body_shape'),
              'first_non_whitespace_byte_hex':e.get('first_non_whitespace_byte_hex'),
              'json_decodable':e.get('json_decodable'),
              'json_error_type':e.get('json_error_type'),
              'transport_error_type':e.get('transport_error_type'),
              'body_captured':e.get('body_captured'),
              'query_captured':e.get('query_captured'),
          } for e in events]
          print('STEP19H_RENDER_TRANSPORT_METADATA',json.dumps(safe,sort_keys=True))

          trace=get('/api/v1/wnba/runtime/step19g-provider-trace')
          latest=trace.get('latest') or {}
          consumer=get('/api/v1/wnba/consumer/latest')
          runtime=get('/api/v1/wnba/runtime/step17b')
          cr=consumer.get('runtime') or {}
          print('STEP19H_RENDER_CONTEXT',json.dumps({
              'provider_cycle_outcome':latest.get('cycle_outcome'),
              'draftkings':latest.get('draftkings'),
              'fanduel':latest.get('fanduel'),
              'consumer_reason':consumer.get('reason'),
              'consumer_circuit':cr.get('circuit_state'),
              'consumer_failures':cr.get('consecutive_failures'),
              'runtime_status':runtime.get('last_status'),
              'runtime_failure_count':runtime.get('failure_count'),
          },sort_keys=True))
          if any(e.get('body_captured') is not False or e.get('query_captured') is not False for e in events):
              raise SystemExit('Step19H metadata-only guardrail drift')
          print('STEP19H_RENDER_TRANSPORT_METADATA_CAPTURED')
          PY

      - name: Roll back diagnostic deployment
        if: ${{ always() && steps.deploy.outputs.deployed == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {
              'WNBA_STEP17B_EXPECTED_REVISION':sha,
              'WNBA_DEPLOYMENT_REVISION':sha,
              'WNBA_RELEASE_ID':'wnba-step19e-certified-rollback',
          }.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          deploy=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
          did=deploy.get('id')
          if not did: raise SystemExit('Step19H rollback deploy id missing')
          for _ in range(180):
              state=req('GET',f'/services/{sid}/deploys/{did}') or {}
              status=str(state.get('status') or '').lower()
              if status=='live':
                  if sha.lower() not in json.dumps(state).lower(): raise SystemExit('Step19H rollback SHA mismatch')
                  print('STEP19H_DIAGNOSTIC_ROLLED_BACK',did,sha); break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}:
                  raise SystemExit('Step19H rollback failed: '+status)
              time.sleep(5)
          else: raise SystemExit('Step19H rollback timeout')
          PY
