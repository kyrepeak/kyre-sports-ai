name: CFB Game Total V181 Step 5 production verification

on:
  pull_request:
    branches: [main]
    paths:
      - "devsystem/production_verify_step5_v181.py"
      - "tests/test_devsystem_production_verify_step5_v181.py"
      - "devsystem/production_verify_v164_logos.py"
      - "cfb_game_total_step5_pace_v1.py"
      - "streamlit_memory_lazy_router_v162.py"
      - "devsystem/task_ledgers/cfb-game-total-evidence-step5.json"
      - ".github/workflows/cfb-game-total-v181-step5-production.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/production_verify_step5_v181.py"
      - "tests/test_devsystem_production_verify_step5_v181.py"
      - "devsystem/production_verify_v164_logos.py"
      - "cfb_game_total_step5_pace_v1.py"
      - "streamlit_memory_lazy_router_v162.py"
      - "devsystem/task_ledgers/cfb-game-total-evidence-step5.json"
      - ".github/workflows/cfb-game-total-v181-step5-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v181-step5-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-step5-v181-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Step 5 production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile Step 5 V181 production verifier
        run: |
          python -m py_compile devsystem/production_verify_step5_v181.py
          python -m py_compile devsystem/production_verify_v164_logos.py

      - name: Self-test Step 5 V181 production contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_devsystem_production_verify_step5_v181.py \
            tests/test_devsystem_production_verify_v164_logos.py \
            tests/test_cfb_game_total_v168_step5_pace.py

      - name: Prove live Step 5 READY 100 percent 12 of 12
        run: |
          python -m devsystem.production_verify_step5_v181 \
            --artifact-dir artifacts/production-step5-v181

      - name: Upload Step 5 V181 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v181-step5-production-${{ github.run_id }}
          path: artifacts/production-step5-v181
          if-no-files-found: warn
          retention-days: 14
