name: Monster Error Radar V1

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "sports_api/observability_v1.py"
      - "sports_api/posthog_error_radar_v1.py"
      - "sports_api/requirements.txt"
      - "tests/test_monster_error_radar_v1.py"
      - ".github/workflows/monster-error-radar-v1.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "sports_api/observability_v1.py"
      - "sports_api/posthog_error_radar_v1.py"
      - "sports_api/requirements.txt"
      - "tests/test_monster_error_radar_v1.py"
      - ".github/workflows/monster-error-radar-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-error-radar-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monster-error-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install Monster Error Radar test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile Monster Error Radar entry points
        run: |
          python -m py_compile \
            app.py \
            sports_api/posthog_error_radar_v1.py \
            sports_api/observability_v1.py

      - name: Run Monster Error Radar contracts
        run: |
          python -m pytest -q \
            tests/test_monster_error_radar_v1.py \
            tests/test_sports_api_observability_v1.py
