name: API2 NFL Game Total Page1 Mobile Density R1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'nfl_game_totals_page1_s_tier_v1.py'
      - 'tests/test_api2_nfl_game_total_page1_mobile_density_r1.py'
      - '.github/workflows/api2-nfl-game-total-page1-mobile-density-r1.yml'
      - 'devsystem/runless_proof_plans/api2-nfl-game-total-page1-mobile-density-r1.json'
      - 'devsystem/task_ledgers/api2-nfl-game-total-page1-mobile-density-r1.json'

permissions:
  contents: read

jobs:
  mobile-density-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas streamlit
      - name: Compile Page 1
        run: python -m py_compile nfl_game_totals_page1_s_tier_v1.py
      - name: Page 1 density and route regressions
        run: |
          python -m pytest --noconftest -q \
            tests/test_api2_nfl_game_total_page1_mobile_density_r1.py \
            tests/test_api2_nfl_game_totals_page1_s_tier_v1.py \
            tests/test_api2_nfl_game_total_production_route_r2.py
