name: WNBA Step 18D final production certification

on:
  push:
    branches:
      - wnba-step18d-final-production-cert-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP18D_TARGET_SHA: a2e1dc6ec2b6c0c8c5e0bd15cd73b24fa9a56ab2
  STEP18B_MAIN_SHA: f3436c70621ed4033ba365c1ef0c6053a8cc5a3a
  STEP18A_API_SHA: d5da3830ab2194074f2e077d6b1ea41d4bc98633
  STEP17D_FROZEN_SHA: 8448984adc779fb9af7c7a8187b0eaeb67d034c8

jobs:
  certify-final-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen Step 18C frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP18D_TARGET_SHA }}
          fetch-depth: 500

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Prove exact target and frontend-only promotion scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STEP18D_TARGET_SHA"
          git merge-base --is-ancestor "$STEP18B_MAIN_SHA" "$STEP18D_TARGET_SHA"
          test -z "$(git diff --name-only "$STEP18B_MAIN_SHA" "$STEP18D_TARGET_SHA" -- sports_api)"
          python - <<'PY'
          import os, subprocess
          base=os.environ['STEP18B_MAIN_SHA']
          head=os.environ['STEP18D_TARGET_SHA']
          names=set(subprocess.check_output(['git','diff','--name-only',base,head]).decode().splitlines())
          expected={
              '.github/workflows/wnba-step18c-streamlit-reliability-staging.yml',
              'app.py',
              'tests/test_wnba_step18c_streamlit_reliability.py',
              'wnba_daily_picks_hub_v36.py',
              'wnba_step18c_consumer_bridge_v1.py',
              'wnba_streamlit_consumer_v2.py',
          }
          if names != expected:
              raise SystemExit(f'STEP18D_FRONTEND_DIFF_DRIFT:{sorted(names)}')
          print('STEP18D_FRONTEND_ONLY_FAST_FORWARD_OK')
          PY

      - name: Compile final consumer presentation chain
        run: |
          python -m py_compile \
            app.py \
            wnba_api_client_v1.py \
            wnba_streamlit_consumer_v1.py \
            wnba_streamlit_consumer_v2.py \
            wnba_daily_picks_hub_v35.py \
            wnba_daily_picks_hub_v36.py \
            wnba_step18b_consumer_bridge_v1.py \
            wnba_step18c_consumer_bridge_v1.py

      - name: Run Step 18B plus Step 18C regression gates
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_wnba_step18b_streamlit_consumer.py \
            tests/test_wnba_step18c_streamlit_reliability.py \
            -k 'not test_root_app_keeps_frozen_replay_and_installs_step18b_before_source_exec'

      - name: Prove no legacy Daily Picks compute fallback in final root
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          bridge=Path('wnba_step18c_consumer_bridge_v1.py').read_text()
          assert '_STEP18C_WNBA_CONSUMER_BRIDGE = _install_step18c_wnba_consumer_bridge()' in app
          assert '_STEP18B_WNBA_CONSUMER_BRIDGE =' not in app
          assert 'legacy_daily_picks_compute_fallback": False' in app
          assert '"legacy_daily_picks_compute_fallback": False' in bridge
          for path in ('wnba_streamlit_consumer_v2.py','wnba_daily_picks_hub_v36.py','wnba_step18c_consumer_bridge_v1.py'):
              text=Path(path).read_text()
              assert 'from sports_api' not in text
              assert 'import sports_api' not in text
          print('STEP18D_FAIL_CLOSED_NO_LEGACY_COMPUTE_OK')
          PY

      - name: Live certify frozen Step 18A API handshake and fresh snapshot
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, time
          from wnba_api_client_v1 import KyreWNBAAPIClient
          from wnba_streamlit_consumer_v2 import normalize_consumer_payload

          client=KyreWNBAAPIClient(timeout_seconds=20,attempts=3)
          health=client.health()
          root=client.root()
          if health.get('status')!='ok' or root.get('name')!='Kyre Sports API':
              raise SystemExit('STEP18D_HOSTED_API_IDENTITY_FAILED')

          first=None
          last=None
          for _ in range(10):
              payload=client.consumer_latest()
              if payload.get('schema_version')!='wnba_step_18a_streamlit_consumer_v1':
                  raise SystemExit('STEP18D_CONSUMER_SCHEMA_DRIFT')
              lineage=payload.get('lineage') or {}
              if lineage.get('step17d_frozen_runtime_sha') != os.environ['STEP17D_FROZEN_SHA']:
                  raise SystemExit('STEP18D_LIVE_STEP17D_LINEAGE_DRIFT')
              semantics=payload.get('semantics') or {}
              dangerous=(
                  'database_connection_opened','database_read_performed','database_write_performed',
                  'scheduler_started','scheduler_cycle_triggered','sportsbook_network_called',
                  'projection_run','monte_carlo_run','wager_action_performed','database_secret_exposed',
                  'new_render_service_created'
              )
              if semantics.get('read_only_get') is not True or any(semantics.get(k) is True for k in dangerous):
                  raise SystemExit('STEP18D_LIVE_READ_ONLY_SEMANTICS_FAILED')
              view=normalize_consumer_payload(payload)
              snap=view.get('snapshot') or {}
              last=(view.get('state'),view.get('reason'),snap.get('age_seconds'),snap.get('effective_stale'))
              if view.get('state') in {'ready','unavailable'} and snap.get('effective_stale') is False and snap.get('snapshot_content_sha256'):
                  first=(snap.get('snapshot_content_sha256'),snap.get('captured_at_utc'),view.get('state'),view.get('reason'))
                  break
              time.sleep(12)
          if first is None:
              raise SystemExit(f'STEP18D_NO_CURRENT_LIVE_CONSUMER:{last}')
          if view.get('state')!='ready' and view.get('cards')!=[]:
              raise SystemExit('STEP18D_NONREADY_CARD_LEAK')
          print('STEP18D_LIVE_18A_TO_18C_HANDSHAKE_OK',first[2:])

          advanced=None
          for _ in range(12):
              time.sleep(12)
              view=normalize_consumer_payload(client.consumer_latest())
              snap=view.get('snapshot') or {}
              if snap.get('effective_stale') is False and snap.get('snapshot_content_sha256') and (
                  snap.get('snapshot_content_sha256') != first[0] or snap.get('captured_at_utc') != first[1]
              ):
                  advanced=(snap.get('snapshot_content_sha256'),snap.get('captured_at_utc'),view.get('state'),view.get('reason'))
                  break
          if advanced is None:
              raise SystemExit(f'STEP18D_LIVE_SNAPSHOT_DID_NOT_ADVANCE:{first}')
          if view.get('state')!='ready' and view.get('cards')!=[]:
              raise SystemExit('STEP18D_ADVANCED_NONREADY_CARD_LEAK')
          print('STEP18D_LIVE_SNAPSHOT_ADVANCE_OK',advanced[2:])
          PY

      - name: Boot exact hardened Streamlit target
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/step18d-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then
              ok=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/step18d-streamlit.log
              exit 1
            fi
            sleep 2
          done
          test "$ok" -eq 1
          grep -qi 'ok' /tmp/health.txt
          curl -fsS --max-time 10 http://127.0.0.1:8501/ >/tmp/root.html
          test -s /tmp/root.html
          echo STEP18D_EXACT_STREAMLIT_BOOT_OK

      - name: Final certification marker
        run: |
          echo "STEP18D_FINAL_PRODUCTION_CERTIFIED"
          echo "frontend_sha=$STEP18D_TARGET_SHA"
          echo "api_sha=$STEP18A_API_SHA"
          echo "runtime_sha=$STEP17D_FROZEN_SHA"
