name: API2 Proof Architecture V1 Step 2 Required Integration Lanes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api2-proof-architecture-v1-step2-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  required-integration-lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 2 classifier and required-lane contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_devsystem_change_classifier_v1.py \
            tests/test_devsystem_workflow_parallelism_v1.py \
            tests/test_devsystem_required_integration_lanes_v1.py
      - name: Validate Step 2 execution plan
        run: |
          python - <<'PY'
          import json
          from pathlib import import Path
          plan = json.loads(Path("devsystem/execution_plans/api2-proof-architecture-v1-step2-required-integration-lanes.json").read_text())
          assert plan["status"] == "COMPILED"
          assert plan["step"] == "2/7"
          assert plan["base_main_sha"] == "e4de274ca6d0f8399e9e9a2d26a22896a800a4cd"
          assert plan["required_lane_result"] == "success"
          assert plan["optional_lane_result"] == "success_or_skipped"
          print("API2_PROOF_ARCHITECTURE_V1_STEP2_PLAN_GREEN")
          PY
      - name: Certify exact head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_PROOF_ARCHITECTURE_V1_STEP2_BRANCH_GREEN"
          echo "API2_PROOF_ARCHITECTURE_V1_STEP2_READY_TO_MERGE"
      - name: Certify merged main freeze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "API2_PROOF_ARCHITECTURE_V1_STEP2_GREEN"
          echo "API2_PROOF_ARCHITECTURE_V1_STEP2_FROZEN"
