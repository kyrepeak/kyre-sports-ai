name: NFL Prop Analytics Page 2 Polish Step 2

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_page2_unified_roster_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step2_v1.py"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step2-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_page2_unified_roster_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step2_v1.py"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step2-v1.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce exact Step 2 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step2-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step2-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_page2_unified_roster_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step2_v1.py' | sort)"
          test "$actual" = "$expected" || { echo "PROP_ANALYTICS_PAGE2_POLISH_STEP2_SCOPE_VIOLATION"; printf '%s\n' "$actual"; exit 1; }
      - name: Install test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile and test Step 2
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_page2_unified_roster_v1.py nfl_prop_analytics_hub_v1.py
          python -m pytest -q tests/test_nfl_prop_analytics_page2_polish_step2_v1.py
          echo "PROP_ANALYTICS_PAGE2_POLISH_STEP2_STATIC_GREEN"

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Start Streamlit
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/page2step2.log 2>&1 &
      - name: Prove one unified player board
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8501"
          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc
                      except Exception:pass
                  page.wait_for_timeout(250)
              raise RuntimeError("NOT_READY:"+selector)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"}),wait_until="domcontentloaded",timeout=120000)
              frame,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]')
              assert board.first.get_attribute("data-prop-page2-unified-state")=="live"
              players=frame.locator('[data-prop-page2-unified-player-id]')
              assert players.count()>=16,players.count()
              assert frame.locator('[data-nfl-prop-analytics-step5-roster="v1"]').count()==0
              assert frame.locator('[data-nfl-prop-analytics-step6-availability="v1"]').count()==0
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height});page.wait_for_timeout(250)
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP2_BRANCH_{width}_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP2_BRANCH_UNIFIED_GREEN")
              browser.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public unified board and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          base="https://kyre-sports-ai.streamlit.app"
          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc
                      except Exception:pass
                  page.wait_for_timeout(250)
              raise RuntimeError("NOT_READY:"+selector)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              deadline=time.monotonic()+1200
              while True:
                  page=browser.new_page(viewport={"width":390,"height":844})
                  try:
                      page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"}),wait_until="domcontentloaded",timeout=120000)
                      frame,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',150)
                      if board.first.get_attribute("data-prop-page2-unified-state")=="live":break
                  except Exception:
                      pass
                  page.close()
                  if time.monotonic()>deadline: raise RuntimeError("STEP2_PUBLIC_DEPLOYMENT_NOT_ACTIVE")
                  time.sleep(8)
              players=frame.locator('[data-prop-page2-unified-player-id]')
              assert players.count()>=16
              assert frame.locator('[data-nfl-prop-analytics-step5-roster="v1"]').count()==0
              assert frame.locator('[data-nfl-prop-analytics-step6-availability="v1"]').count()==0
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height});page.wait_for_timeout(250)
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP2_PUBLIC_{width}_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP2_PUBLIC_UNIFIED_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP2_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP2_PUBLIC_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP2_FROZEN")
              browser.close()
          PY
