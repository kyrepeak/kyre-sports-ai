name: Monster A9 Production Session Proof

on:
  push:
    branches:
      - monster-a9-production-session-proof

jobs:
  production-session-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Establish real production Streamlit session
        shell: bash
        run: |
          python - <<'PY'
          import re
          import time
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          url = "https://kyre-sports-ai.streamlit.app/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.on("requestfailed", lambda req: print(f"request_failed={req.url} :: {req.failure}"))
              page.on("pageerror", lambda exc: print(f"page_error={exc}"))
              page.on("websocket", lambda ws: print(f"websocket_opened={ws.url}"))

              response = page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              print(f"document_status={response.status if response else 'none'}")
              print(f"initial_url={page.url}")
              print(f"initial_title={page.title()}")

              wake = page.get_by_text("Yes, get this app back up!", exact=False)
              if wake.count() > 0:
                  print("sleep_state_detected=true")
                  wake.first.click(timeout=10_000)
              else:
                  print("sleep_state_detected=false")

              try:
                  page.wait_for_selector('[data-testid="stAppViewContainer"]', state="visible", timeout=120_000)
              except PlaywrightTimeoutError:
                  body = page.locator("body").inner_text(timeout=10_000)
                  html = page.content()
                  print("streamlit_app_container_visible=false")
                  print("body_prefix=" + re.sub(r"\s+", " ", body)[:1500])
                  print("html_prefix=" + re.sub(r"\s+", " ", html)[:2000])
                  browser.close()
                  raise SystemExit("A9 production Streamlit app container never became visible")

              print("streamlit_app_container_visible=true")
              time.sleep(35)
              body = page.locator("body").inner_text(timeout=10_000)
              print(f"final_url={page.url}")
              print(f"final_title={page.title()}")
              print("final_body_prefix=" + re.sub(r"\s+", " ", body)[:1500])
              print("MONSTER_A9_PRODUCTION_SESSION_PROOF=established")
              browser.close()
          PY
