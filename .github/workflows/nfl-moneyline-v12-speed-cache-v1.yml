name: NFL Moneyline V12 Speed Cache V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_moneyline_market_api_v2.py"
      - "nfl_moneyline_hub_v12.py"
      - "streamlit_memory_lazy_router_v131.py"
      - "app.py"
      - "tests/test_nfl_moneyline_v12_speed_cache_v1.py"
      - ".github/workflows/nfl-moneyline-v12-speed-cache-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v12-speed-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pandas numpy streamlit

      - name: Enforce exact six-file V12 diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-moneyline-v12-speed-cache-v1.yml
          app.py
          nfl_moneyline_hub_v12.py
          nfl_moneyline_market_api_v2.py
          streamlit_memory_lazy_router_v131.py
          tests/test_nfl_moneyline_v12_speed_cache_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Moneyline V12 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile V12 speed surface
        run: |
          python -m py_compile \
            nfl_moneyline_market_api_v2.py \
            nfl_moneyline_hub_v12.py \
            streamlit_memory_lazy_router_v131.py \
            app.py \
            tests/test_nfl_moneyline_v12_speed_cache_v1.py

      - name: Prove frozen Moneyline V1-V11 and sibling owners stay untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_moneyline_hub_v([1-9]|10|11)\.py$|nfl_moneyline_market_v1\.py$|nfl_moneyline_market_api_v1\.py$|nfl_hub_v18\.py$|streamlit_memory_lazy_router_v(128|129|130)\.py$|nfl_passing_yards_.*\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo 'NFL_MONEYLINE_V12_FROZEN_OWNER_MODIFICATION_BLOCKED'
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo 'NFL_MONEYLINE_V12_FROZEN_OWNER_GUARD_GREEN'

      - name: Run deterministic V12 cache and fallback contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v12_speed_cache_v1.py

      - name: Re-run frozen V11 no-flash contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v11_no_flash_v1.py

      - name: Re-run frozen V10 Kyre API contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v10_kyre_api_v1.py

      - name: Re-run frozen V9 matchup-card contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py

      - name: Prove V12 remains transport-only
        shell: bash
        run: |
          python - <<'PY'
          import nfl_moneyline_hub_v12 as v12
          import nfl_moneyline_market_api_v2 as market
          import streamlit_memory_lazy_router_v131 as router

          assert v12.FROZEN_HUB == 'nfl_moneyline_hub_v11'
          assert v12.FROZEN_TRANSPORT_WRAPPER == 'nfl_moneyline_hub_v10'
          assert v12.ACTIVE_MARKET_ADAPTER == 'nfl_moneyline_market_api_v2'
          assert v12.SPORTSBOOK_MODEL_INFLUENCE == 0.0
          assert v12.STAKE_SIZING_ENABLED is False
          assert market.FROZEN_ADAPTER == 'nfl_moneyline_market_api_v1'
          assert market.HOT_CACHE_TTL_SECONDS == 45.0
          assert market.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert market.STAKE_SIZING_ENABLED is False
          assert router.FROZEN_ROUTER == 'streamlit_memory_lazy_router_v130'
          assert router.ACTIVE_MONEYLINE_HUB == 'nfl_moneyline_hub_v12'
          print('NFL_MONEYLINE_V12_TRANSPORT_ONLY_GREEN')
          PY

      - name: Probe deployed Kyre Sports API Moneyline safety contract
        shell: bash
        run: |
          python - <<'PY'
          import time
          import requests

          url = 'https://kyre-sports-api.onrender.com/api/v1/nfl/moneyline/market/status'
          last = None
          for attempt in range(1, 4):
              try:
                  response = requests.get(
                      url,
                      timeout=(5, 30),
                      headers={'Accept': 'application/json', 'User-Agent': 'KyreSportsAI-V12Cert/1.0'},
                  )
                  if response.status_code == 200:
                      payload = response.json()
                      assert payload['status'] == 'ready'
                      assert payload['schema_version'] == 'nfl_moneyline_market_v1'
                      assert payload['sport'] == 'nfl'
                      assert payload['market'] == 'moneyline'
                      assert payload['official_event_id_required'] is True
                      assert payload['fuzzy_matching'] is False
                      assert payload['synthetic_event_ids'] is False
                      assert payload['projection_weight'] == 0.0
                      assert payload['market_context_only'] is True
                      assert payload['may_modify_projection'] is False
                      assert payload['model_probability_input'] is False
                      assert payload['stake_sizing_enabled'] is False
                      assert payload['wager_actions'] is False
                      print('NFL_MONEYLINE_V12_PUBLIC_API_GREEN')
                      break
                  last = RuntimeError(f'HTTP {response.status_code}: {response.text[:300]}')
              except Exception as exc:
                  last = exc
              if attempt < 3:
                  time.sleep(5)
          else:
              raise last or RuntimeError('Kyre Sports API Moneyline status probe failed')
          PY

  benchmark-v12-vs-v130:
    needs: certify-v12-speed-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_V130_SHA: b8cef6467174b5724a7635b03d3c330bbd3aaf3b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Prepare identical base-vs-V12 benchmark harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/moneyline-v12-speed
          git worktree add --detach "$RUNNER_TEMP/moneyline-base-v130" "$BASE_V130_SHA"
          cat > "$RUNNER_TEMP/moneyline_speed_probe.py" <<'PY'
          import json
          import os
          import statistics
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _find_app_frame, _wait_for_text, _body_has_forbidden_error, _choose, BrowserQAFailure

          site = os.environ['SITE']
          label = os.environ['LABEL']
          out = Path(os.environ['OUT'])
          out.parent.mkdir(parents=True, exist_ok=True)
          result = {
              'label': label,
              'site': site,
              'viewport': '1024x1366',
              'warm_visit_count': 7,
              'visits': [],
          }

          def save():
              out.write_text(json.dumps(result, indent=2))

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-dev-shm-usage', '--no-sandbox'])
              page = browser.new_page(viewport={'width': 1024, 'height': 1366})
              try:
                  nav0 = time.perf_counter()
                  page.goto(site, wait_until='domcontentloaded', timeout=120000)
                  frame, _ = _find_app_frame(page)
                  result['initial_dom_seconds'] = round(time.perf_counter() - nav0, 4)

                  nfl0 = time.perf_counter()
                  _choose(page, frame, 0, 'NFL')
                  combo = frame.get_by_role('combobox', name='🎯 NFL Market', exact=True)
                  combo.wait_for(state='visible', timeout=60000)
                  result['nfl_selector_seconds'] = round(time.perf_counter() - nfl0, 4)
                  save()

                  def wait_moneyline_gone():
                      deadline = time.time() + 60
                      while time.time() < deadline:
                          cards = frame.locator('.kml9-matchup-card').count()
                          titles = frame.get_by_text('NFL Moneyline Matchup Board', exact=False).count()
                          if cards == 0 and titles == 0:
                              return
                          time.sleep(0.10)
                      raise BrowserQAFailure('Moneyline DOM did not clear after leaving page')

                  def load_moneyline(visit_label):
                      t0 = time.perf_counter()
                      _choose(page, frame, 1, 'Moneyline')
                      _wait_for_text(frame, 'NFL Moneyline Matchup Board', 300.0)
                      cards = frame.locator('.kml9-matchup-card')
                      deadline = time.time() + 300
                      while time.time() < deadline and cards.count() < 1:
                          time.sleep(0.10)
                      if cards.count() < 1:
                          raise BrowserQAFailure(f'{visit_label}: no Moneyline matchup card')
                      elapsed = time.perf_counter() - t0
                      time.sleep(0.35)
                      body = frame.locator('body').inner_text()
                      forbidden = _body_has_forbidden_error(body)
                      if forbidden:
                          raise BrowserQAFailure(f'{visit_label}: runtime error marker {forbidden}')
                      target = cards.nth(0).inner_text()
                      visit = {
                          'label': visit_label,
                          'seconds': round(elapsed, 4),
                          'cards': cards.count(),
                          'market_available': 'MARKET UNAVAILABLE' not in target.upper(),
                          'fanduel_visible': 'FANDUEL' in target.upper(),
                      }
                      result['visits'].append(visit)
                      save()

                  load_moneyline('first_visit')
                  for idx in range(7):
                      _choose(page, frame, 1, 'Slate')
                      wait_moneyline_gone()
                      frame.get_by_role('combobox', name='🎯 NFL Market', exact=True).wait_for(state='visible', timeout=60000)
                      load_moneyline(f'warm_visit_{idx + 1}')

                  visits = result['visits']
                  warm = [row['seconds'] for row in visits[1:]]
                  result['first_moneyline_seconds'] = visits[0]['seconds']
                  result['warm_moneyline_seconds'] = warm
                  result['warm_p50_seconds'] = round(statistics.median(warm), 4)
                  result['warm_mean_seconds'] = round(statistics.mean(warm), 4)
                  result['warm_best_seconds'] = round(min(warm), 4)
                  result['warm_worst_seconds'] = round(max(warm), 4)
                  result['market_available_visits'] = sum(1 for row in visits if row['market_available'])
                  result['fanduel_visible_visits'] = sum(1 for row in visits if row['fanduel_visible'])
                  result['matchup_cards'] = visits[-1]['cards']
                  result['horizontal_overflow_px'] = frame.evaluate('() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth')
                  result['sportsbook_model_influence'] = 0.0
                  page.screenshot(path=str(out.with_suffix('.png')), full_page=True)
                  result['status'] = 'GREEN'
                  save()
              finally:
                  browser.close()

          print(json.dumps(result, indent=2))
          PY

      - name: Benchmark frozen V130 on local runner
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/moneyline-base-v130"
          (
            cd "$BASE_DIR"
            nohup "$GITHUB_WORKSPACE/.venv-browser-qa/bin/python" -m streamlit run app.py \
              --server.headless true \
              --server.address 127.0.0.1 \
              --server.port 8521 \
              > "$GITHUB_WORKSPACE/artifacts/moneyline-v12-speed/v130-streamlit.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/v130.pid"
          )
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8521/_stcore/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8521/_stcore/health >/dev/null
          SITE=http://127.0.0.1:8521 \
          LABEL=frozen_v130 \
          OUT="$GITHUB_WORKSPACE/artifacts/moneyline-v12-speed/v130.json" \
          PYTHONPATH="$GITHUB_WORKSPACE" \
          python "$RUNNER_TEMP/moneyline_speed_probe.py"
          kill "$(cat "$RUNNER_TEMP/v130.pid")" || true
          sleep 1

      - name: Benchmark V12 on same local runner
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8522 \
            > artifacts/moneyline-v12-speed/v12-streamlit.log 2>&1 &
          echo $! > "$RUNNER_TEMP/v12.pid"
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8522/_stcore/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8522/_stcore/health >/dev/null
          SITE=http://127.0.0.1:8522 \
          LABEL=v12 \
          OUT="$GITHUB_WORKSPACE/artifacts/moneyline-v12-speed/v12.json" \
          PYTHONPATH="$GITHUB_WORKSPACE" \
          python "$RUNNER_TEMP/moneyline_speed_probe.py"
          kill "$(cat "$RUNNER_TEMP/v12.pid")" || true
          sleep 1

      - name: Compare V130 versus V12 and enforce warm-speed gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/moneyline-v12-speed')
          base = json.loads((root / 'v130.json').read_text())
          v12 = json.loads((root / 'v12.json').read_text())

          base_p50 = float(base['warm_p50_seconds'])
          v12_p50 = float(v12['warm_p50_seconds'])
          base_mean = float(base['warm_mean_seconds'])
          v12_mean = float(v12['warm_mean_seconds'])
          speedup_pct = ((base_p50 - v12_p50) / base_p50 * 100.0) if base_p50 else 0.0
          mean_speedup_pct = ((base_mean - v12_mean) / base_mean * 100.0) if base_mean else 0.0

          comparison = {
              'status': 'GREEN',
              'base_sha': 'b8cef6467174b5724a7635b03d3c330bbd3aaf3b',
              'base_warm_p50_seconds': base_p50,
              'v12_warm_p50_seconds': v12_p50,
              'warm_p50_speedup_pct': round(speedup_pct, 2),
              'base_warm_mean_seconds': base_mean,
              'v12_warm_mean_seconds': v12_mean,
              'warm_mean_speedup_pct': round(mean_speedup_pct, 2),
              'base_first_seconds': base['first_moneyline_seconds'],
              'v12_first_seconds': v12['first_moneyline_seconds'],
              'base_market_available_visits': base['market_available_visits'],
              'v12_market_available_visits': v12['market_available_visits'],
              'base_fanduel_visible_visits': base['fanduel_visible_visits'],
              'v12_fanduel_visible_visits': v12['fanduel_visible_visits'],
              'base_matchup_cards': base['matchup_cards'],
              'v12_matchup_cards': v12['matchup_cards'],
              'base_horizontal_overflow_px': base['horizontal_overflow_px'],
              'v12_horizontal_overflow_px': v12['horizontal_overflow_px'],
              'sportsbook_model_influence': 0.0,
          }

          failures = []
          if not v12_p50 < base_p50:
              failures.append(f'warm p50 did not improve: base={base_p50:.4f}s v12={v12_p50:.4f}s')
          if not v12_mean <= base_mean * 1.02:
              failures.append(f'warm mean regressed >2%: base={base_mean:.4f}s v12={v12_mean:.4f}s')
          expected_visits = 8
          if v12['market_available_visits'] != expected_visits:
              failures.append(f'V12 market availability {v12["market_available_visits"]}/{expected_visits}')
          if v12['fanduel_visible_visits'] != expected_visits:
              failures.append(f'V12 FanDuel visibility {v12["fanduel_visible_visits"]}/{expected_visits}')
          if int(v12['matchup_cards']) < 1:
              failures.append('V12 rendered no matchup cards')
          if int(v12['horizontal_overflow_px']) != 0:
              failures.append(f'V12 horizontal overflow {v12["horizontal_overflow_px"]}px')
          if float(v12['sportsbook_model_influence']) != 0.0:
              failures.append('sportsbook model influence drifted from 0.0%')

          if failures:
              comparison['status'] = 'RED'
              comparison['failures'] = failures
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          if failures:
              raise SystemExit('NFL_MONEYLINE_V12_SPEED_GATE_RED: ' + '; '.join(failures))
          print('NFL_MONEYLINE_V12_SPEED_GATE_GREEN')
          PY

      - name: Upload V12 speed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-v12-speed-${{ github.run_id }}
          path: artifacts/moneyline-v12-speed
          if-no-files-found: warn
          retention-days: 7