name: MLB Step5.6 market-movement certification

on:
  push:
    branches:
      - mlb-step5-6-market-movement-freshness
    paths:
      - "sports_api/mlb_market_movement_v1.py"
      - "mlb_daily_game_picks_market_movement_v1.py"
      - "mlb_daily_game_picks_v217_guard.py"
      - "tests/test_mlb_market_movement_v1.py"
      - ".github/workflows/mlb-step5-6-market-movement-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP5_6_BASE_SHA: 7743cb61b8c1fbd001cd3ffd2935a47ea40381ba
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true

jobs:
  certify-market-movement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Assert additive MLB-only change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP5_6_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP5_6_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          allowed='^(sports_api/mlb_market_movement_v1.py|mlb_daily_game_picks_market_movement_v1.py|mlb_daily_game_picks_v217_guard.py|tests/test_mlb_market_movement_v1.py|\.github/workflows/mlb-step5-6-market-movement-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP5_6_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          echo 'MLB_STEP5_6_CHANGE_SCOPE_OK'

      - name: Prove Step5.5 implementation is byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP5_6_BASE_SHA"...HEAD -- \
            sports_api/mlb_price_discipline_v1.py \
            mlb_daily_game_picks_price_discipline_v1.py
          echo 'MLB_STEP5_6_STEP5_5_FROZEN'

      - name: Prove V2.1.7 risk and lineup functions are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(
              ['git', 'show', f'{os.environ["STEP5_6_BASE_SHA"]}:mlb_daily_game_picks_v217_guard.py'],
              text=True,
          )
          head = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          protected = {
              '_safe_int',
              '_norm',
              '_lineup_members_bulk',
              '_official_snapshots_v217',
              '_player_lineup_guard',
              '_risk_context_v217_guard',
          }

          def dumps(source):
              tree = ast.parse(source)
              out = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in protected:
                      out[node.name] = ast.dump(node, include_attributes=False)
              return out

          base_dump = dumps(base)
          head_dump = dumps(head)
          if base_dump != head_dump or set(head_dump) != protected:
              raise SystemExit('STEP5_6_PROTECTED_V217_FUNCTION_DRIFT')
          print('MLB_STEP5_6_V217_RISK_FUNCTIONS_FROZEN')
          PY

      - name: Assert read-only ephemeral movement contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('sports_api/mlb_market_movement_v1.py').read_text(encoding='utf-8')
          presentation = Path('mlb_daily_game_picks_market_movement_v1.py').read_text(encoding='utf-8')
          guard = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          combined = core + '\n' + presentation + '\n' + guard

          forbidden_matchers = ('difflib', 'SequenceMatcher', 'fuzzywuzzy', 'rapidfuzz')
          bad_matchers = [token for token in forbidden_matchers if token in combined]
          if bad_matchers:
              raise SystemExit('STEP5_6_HEURISTIC_MATCHER_PRESENT: ' + ','.join(bad_matchers))

          forbidden_writes = (
              'c["probability"] =', "c['probability'] =",
              'c["score"] =', "c['score'] =",
              'c["projection"] =', "c['projection'] =",
              'candidate["probability"] =', "candidate['probability'] =",
              'candidate["score"] =', "candidate['score'] =",
              'candidate["projection"] =', "candidate['projection'] =",
          )
          bad_writes = [token for token in forbidden_writes if token in presentation or token in guard]
          if bad_writes:
              raise SystemExit('STEP5_6_PRODUCTION_FIELD_WRITE_PRESENT: ' + ','.join(bad_writes))

          forbidden_persistence = (
              'sqlite3', 'psycopg', 'sqlalchemy', 'supabase',
              'INSERT INTO', 'UPDATE mlb_', 'DELETE FROM', 'requests.post(',
          )
          bad_persistence = [token for token in forbidden_persistence if token in combined]
          if bad_persistence:
              raise SystemExit('STEP5_6_DURABLE_WRITE_PATH_PRESENT: ' + ','.join(bad_persistence))

          required = (
              'import mlb_daily_game_picks_price_discipline_v1 as step55',
              'step55.install_price_discipline_layer(games_df, payload=payload)',
              'build_market_observation(',
              'compare_market_observations(',
              'ephemeral_session_history',
              'durable_persistence',
              'price_comparison_comparable',
              'NOT_COMPARABLE_DIFFERENT_LINE',
              'ev_comparison_holds_current_model_probability_constant',
              'install_market_movement_layer(games_df)',
              'Pick Strength',
          )
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit('STEP5_6_CONTRACT_TOKEN_MISSING: ' + ' | '.join(missing))

          if 'from mlb_daily_game_picks_market_movement_v1 import install_market_movement_layer' not in guard:
              raise SystemExit('STEP5_6_ACTIVE_GUARD_IMPORT_MISSING')

          print('MLB_STEP5_6_EPHEMERAL_READ_ONLY_CONTRACT_OK')
          PY

      - name: Prove frozen app ancestry still routes Daily Picks to active V2.1.7 guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          ancestor = subprocess.check_output(
              ['git', 'show', '6fb976a9e20c96eb68b71ad0d3511e3be1734292:app.py'],
              text=True,
          )
          required = (
              'old = "from mlb_daily_game_picks_v198 import render_daily_game_picks"',
              'new = "from mlb_daily_game_picks_v217_guard import render_daily_game_picks"',
          )
          missing = [token for token in required if token not in ancestor]
          if missing:
              raise SystemExit('STEP5_6_ACTIVE_ROUTE_ANCESTRY_DRIFT: ' + ' | '.join(missing))
          print('MLB_STEP5_6_ACTIVE_ROUTE_CONFIRMED')
          PY

      - name: Compile Step5.6 Python files
        run: |
          python -m py_compile \
            sports_api/mlb_market_movement_v1.py \
            mlb_daily_game_picks_market_movement_v1.py \
            mlb_daily_game_picks_v217_guard.py \
            tests/test_mlb_market_movement_v1.py

      - name: Run deterministic market-movement regression suite
        run: python -m pytest -q tests/test_mlb_market_movement_v1.py

      - name: Certify live FanDuel observation ingestion without fabricated movement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import urllib.request

          from sports_api.mlb_live_market_context_v1 import attach_live_market_context
          from sports_api.mlb_market_probability_v1 import derive_market_probability_contexts
          from sports_api.mlb_model_market_edge_v1 import model_market_edge
          from sports_api.mlb_price_discipline_v1 import price_discipline_context
          from sports_api.mlb_market_movement_v1 import (
              build_market_observation,
              compare_market_observations,
              parse_utc_timestamp,
          )

          req = urllib.request.Request(
              os.environ['PRODUCTION_ODDS_URL'],
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'KyreSportsStep5-6Cert/1.0',
              },
              method='GET',
          )
          with urllib.request.urlopen(req, timeout=35) as response:
              status = int(response.status)
              payload = json.loads(response.read(2_000_000).decode('utf-8'))

          if status != 200:
              raise SystemExit(f'STEP5_6_PRODUCTION_HTTP_{status}')
          if payload.get('data_type') != 'mlb_live_odds_api_response_v1':
              raise SystemExit('STEP5_6_BAD_PRODUCTION_DATA_TYPE')
          if payload.get('schema_version') != 1:
              raise SystemExit('STEP5_6_BAD_PRODUCTION_SCHEMA')
          if payload.get('source') != 'FanDuel':
              raise SystemExit('STEP5_6_BAD_PRODUCTION_SOURCE')
          if payload.get('transport') != 'anonymous_public_get_only':
              raise SystemExit('STEP5_6_BAD_PRODUCTION_TRANSPORT')
          collected_at = payload.get('collected_at_utc')
          if not collected_at:
              raise SystemExit('STEP5_6_MISSING_COLLECTION_TIMESTAMP')
          parsed_collected = parse_utc_timestamp(collected_at)
          games = payload.get('games') or []
          if not games:
              raise SystemExit('STEP5_6_NO_CURRENT_PRODUCTION_MARKET_GAMES')

          model_rows = [{'game_pk': game.get('official_game_id')} for game in reversed(games)]
          step52 = attach_live_market_context(model_rows, games)
          step53 = derive_market_probability_contexts(step52)
          if step52.get('attached_count') != len(games):
              raise SystemExit('STEP5_6_STEP52_ATTACH_COUNT_MISMATCH')
          if step53.get('derived_context_count') != len(games):
              raise SystemExit('STEP5_6_STEP53_DERIVED_COUNT_MISMATCH')
          if step53.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_6_STEP53_FALLBACK_WAS_USED')

          observation_checks = 0
          baseline_checks = 0
          same_snapshot_checks = 0
          line_bearing_checks = 0

          for game in games:
              game_id = int(game['official_game_id'])
              context = (step53.get('contexts_by_game_id') or {}).get(game_id)
              if not context:
                  raise SystemExit(f'STEP5_6_MISSING_STEP53_CONTEXT_{game_id}')

              away = str(game.get('away_team') or f'AWAY_{game_id}')
              home = str(game.get('home_team') or f'HOME_{game_id}')
              scenarios = [
                  ('Moneyline', 'away', 'Away', context['moneyline']['away']),
                  ('Moneyline', 'home', 'Home', context['moneyline']['home']),
                  ('Run Line', 'away', 'Away', context['run_line']['away']),
                  ('Run Line', 'home', 'Home', context['run_line']['home']),
                  ('Total', 'over', 'Over ' + str(context['total'].get('line')), context['total']['over']),
                  ('Total', 'under', 'Under ' + str(context['total'].get('line')), context['total']['under']),
              ]

              for market, selected_side, side_text, side_block in scenarios:
                  no_vig = float(side_block['no_vig_probability'])
                  model_p = min(0.90, max(0.10, no_vig + 0.02))
                  candidate = {
                      'game_pk': game_id,
                      'market': market,
                      'probability': model_p,
                      'side': side_text,
                      'name': None,
                      'team': None,
                  }
                  edge = model_market_edge(candidate, context, away_team=away, home_team=home)
                  price = price_discipline_context(edge)
                  observation = build_market_observation(price, collected_at_utc=collected_at)

                  if observation.get('official_game_id') != game_id:
                      raise SystemExit(f'STEP5_6_OBSERVATION_GAME_ID_DRIFT_{game_id}_{market}_{selected_side}')
                  if observation.get('selected_side') != selected_side:
                      raise SystemExit(f'STEP5_6_OBSERVATION_SIDE_DRIFT_{game_id}_{market}_{selected_side}')
                  if parse_utc_timestamp(observation.get('collected_at_utc')) != parsed_collected:
                      raise SystemExit(f'STEP5_6_OBSERVATION_TIMESTAMP_DRIFT_{game_id}_{market}_{selected_side}')
                  if float(observation['market_odds']) != float(side_block['odds']):
                      raise SystemExit(f'STEP5_6_OBSERVATION_ODDS_DRIFT_{game_id}_{market}_{selected_side}')
                  if observation.get('durable_persistence') is not False:
                      raise SystemExit(f'STEP5_6_OBSERVATION_PERSISTENCE_DRIFT_{game_id}_{market}_{selected_side}')

                  baseline = compare_market_observations(
                      observation,
                      as_of_utc=observation['collected_at_utc'],
                  )
                  if baseline.get('movement_status') != 'NO_PRIOR_OBSERVATION':
                      raise SystemExit(f'STEP5_6_BASELINE_MOVEMENT_FABRICATED_{game_id}_{market}_{selected_side}')
                  if baseline.get('movement_available') is not False:
                      raise SystemExit(f'STEP5_6_BASELINE_MOVEMENT_FLAG_DRIFT_{game_id}_{market}_{selected_side}')
                  if baseline.get('snapshot_age_seconds') != 0.0:
                      raise SystemExit(f'STEP5_6_BASELINE_AGE_DRIFT_{game_id}_{market}_{selected_side}')
                  if baseline.get('selection_impact') is not False or baseline.get('ranking_impact') is not False or baseline.get('wagering_impact') is not False:
                      raise SystemExit(f'STEP5_6_IMPACT_FLAG_DRIFT_{game_id}_{market}_{selected_side}')

                  same = compare_market_observations(observation, dict(observation))
                  if same.get('movement_status') != 'NO_NEW_OBSERVATION':
                      raise SystemExit(f'STEP5_6_SAME_SNAPSHOT_MOVEMENT_FABRICATED_{game_id}_{market}_{selected_side}')
                  if same.get('movement_available') is not False:
                      raise SystemExit(f'STEP5_6_SAME_SNAPSHOT_MOVEMENT_FLAG_DRIFT_{game_id}_{market}_{selected_side}')

                  if market in {'Run Line', 'Total'}:
                      line_bearing_checks += 1
                  observation_checks += 1
                  baseline_checks += 1
                  same_snapshot_checks += 1

          expected_count = len(games) * 6
          if observation_checks != expected_count:
              raise SystemExit('STEP5_6_OBSERVATION_COUNT_MISMATCH')
          if baseline_checks != expected_count or same_snapshot_checks != expected_count:
              raise SystemExit('STEP5_6_BASELINE_COVERAGE_MISMATCH')
          if line_bearing_checks != len(games) * 4:
              raise SystemExit('STEP5_6_LINE_BEARING_COVERAGE_MISMATCH')

          evidence = {
              'certification_result': 'GREEN',
              'http_status': status,
              'production_game_count': len(games),
              'step5_2_attached_count': step52.get('attached_count'),
              'step5_3_derived_context_count': step53.get('derived_context_count'),
              'step5_6_live_observations_verified': observation_checks,
              'no_prior_baselines_verified': baseline_checks,
              'same_snapshot_no_movement_verified': same_snapshot_checks,
              'line_bearing_observations_verified': line_bearing_checks,
              'production_source': payload.get('source'),
              'production_transport': payload.get('transport'),
              'collected_at_utc': collected_at,
              'step5_5_changed': False,
              'model_math_changed': False,
              'pick_strength_changed': False,
              'ranking_changed': False,
              'selection_changed': False,
              'risk_logic_changed': False,
              'durable_persistence_added': False,
              'wagering_changed': False,
              'actual_movement_fabricated': False,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('MLB_STEP5_6_MARKET_MOVEMENT_GREEN')
          PY
