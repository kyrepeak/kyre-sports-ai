name: Monster Anti-Loop TDD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'devsystem/checkpoint_ledger_v1.py'
      - 'devsystem/forward_motion_v1.py'
      - 'devsystem/forward_motion_policy_v1.json'
      - 'tests/test_devsystem_checkpoint_ledger_v1.py'
      - 'tests/test_devsystem_forward_motion_v1.py'
      - 'tests/test_monster_a9_anti_loop_replay_v1.py'
      - '.github/workflows/monster-anti-loop-tdd-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-loop-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run anti-loop contract tests
        run: |
          python -m pytest -q \
            tests/test_devsystem_checkpoint_ledger_v1.py
