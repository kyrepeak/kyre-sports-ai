name: CFB O/U Upgrade Step 12 final certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [cfb-ou-upgrade-step12-final-certification]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive Step 12 scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-upgrade-step12-final-certification.yml",
              "app.py",
              "cfb_over_under_certification_v1.py",
              "cfb_over_under_slate_v11.py",
              "cfb_over_under_matchup_ui_v12.py",
              "streamlit_memory_lazy_router_v52.py",
              "tests/test_cfb_over_under_upgrade_step12_certification.py",
              "tests/test_cfb_over_under_upgrade_step12_slate.py",
              "tests/test_cfb_over_under_upgrade_step12_ui_router.py",
          }
          if actual!=expected:
              print("expected",sorted(expected)); print("actual",sorted(actual)); sys.exit(1)
          print("CFB_OU_UPGRADE_STEP12_SCOPE=PASS")
          PY

      - name: Enforce original CFB, logo hotfixes, and Upgrade 1 through 11 freeze
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec): return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          manifests=[
              ("cfb_freeze_manifest_v12.json","3ff2a727967e80dddbe03f747d9f32090cc39539","original CFB"),
              ("cfb_over_under_logo_hotfix_freeze_manifest_v4.json","b5b42535b0771a6e15d1f8581de325777f3c4177","logo V4"),
              ("cfb_over_under_upgrade_freeze_manifest_v11.json","553a574f79c8997af91694654b3800cf17705eb7","O/U Upgrade Step 11"),
          ]
          for path,blob,label in manifests:
              if rev(f"HEAD:{path}")!=blob: failures.append(f"{label} manifest changed")
              manifest=json.loads(pathlib.Path(path).read_text())
              for frozen,expected in (manifest.get("exact_blobs") or {}).items():
                  try: actual=rev(f"HEAD:{frozen}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing frozen path: {frozen}"); continue
                  if actual!=expected: failures.append(f"frozen path changed: {frozen}")
          if failures:
              print(*failures,sep="\n"); sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_11_FROZEN=PASS")
          PY

      - name: Compile Step 12
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_certification_v1.py",
              "cfb_over_under_slate_v11.py",
              "cfb_over_under_matchup_ui_v12.py",
              "streamlit_memory_lazy_router_v52.py",
              "tests/test_cfb_over_under_upgrade_step12_certification.py",
              "tests/test_cfb_over_under_upgrade_step12_slate.py",
              "tests/test_cfb_over_under_upgrade_step12_ui_router.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_UPGRADE_STEP12_COMPILE=PASS")
          PY
          PYTHONPATH=. python -c "import cfb_over_under_certification_v1; import cfb_over_under_slate_v11; import cfb_over_under_matchup_ui_v12; import streamlit_memory_lazy_router_v52"

      - name: Run Step 12 and inherited regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_upgrade_step12_certification.py tests/test_cfb_over_under_upgrade_step12_slate.py tests/test_cfb_over_under_upgrade_step12_ui_router.py tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py tests/test_cfb_over_under_upgrade_step11_slate.py tests/test_cfb_over_under_upgrade_step11_ui_router.py tests/test_cfb_over_under_upgrade_step10_history_engine.py tests/test_cfb_over_under_upgrade_step10_slate.py tests/test_cfb_over_under_upgrade_step10_ui_router.py tests/test_cfb_over_under_upgrade_step9_environment_engine.py tests/test_cfb_over_under_upgrade_step9_slate.py tests/test_cfb_over_under_upgrade_step9_ui_router.py tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live Florida A&M at Miami final certification
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v11 as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          try: slate.analyze_game.clear()
          except Exception: pass
          result=slate.analyze_game(game,"2026-09-10",50.5)
          cert=result.get("certification") or {}
          raw=result.get("raw") or {}
          step11=result.get("step11_raw") or {}
          final=result.get("final") or {}
          print("FINAL_CERT",json.dumps({
              "status":cert.get("status"),
              "checks_passed":cert.get("checks_passed"),
              "checks_failed":cert.get("checks_failed"),
              "checks_skipped":cert.get("checks_skipped"),
              "fingerprint":cert.get("projection_fingerprint"),
              "step11_applied":raw.get("upgrade_step11_applied"),
              "step11_reason":raw.get("form_strength_reason"),
              "projected_total":raw.get("projected_total"),
              "sigma":raw.get("structural_total_sigma"),
              "selection":final.get("selection"),
          },indent=2,default=str))

          if cert.get("status")!="CERTIFIED":
              raise SystemExit(f"live Step 12 not certified: {cert}")
          if cert.get("integrity_passed") is not True or int(cert.get("checks_failed") or 0)!=0:
              raise SystemExit("live Step 12 integrity check failed")
          if not str(cert.get("projection_fingerprint") or ""):
              raise SystemExit("projection fingerprint missing")
          for key in (
              "projected_away_points","projected_home_points","projected_total",
              "structural_total_sigma","over_probability","under_probability",
              "push_probability","reliability","analysis_line","feature_coverage",
          ):
              if step11.get(key)!=raw.get(key):
                  raise SystemExit(f"Step 12 changed Step 11 output: {key}")
          if result.get("final") != (result.get("final") or {}):
              raise SystemExit("unreachable final mutation check")
          if raw.get("upgrade_step12_integrity_passed") is not True:
              raise SystemExit("Step 12 raw certification metadata missing")
          print("LIVE_FAMU_MIAMI_STEP12_FINAL_CERTIFICATION=PASS")
          PY

      - name: Multi-game slate certification smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v11 as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          verified=[g for g in games if g.get("identity_verified") and g.get("date_matches_query")]
          sample=verified[:min(2,len(verified))]
          if not sample:
              raise SystemExit("no verified live games for Step 12 slate smoke")
          lines={str(g.get("identity_key") or g.get("game_id")):50.5 for g in sample}
          rows,diag=slate.scan_slate(sample,"2026-09-10",lines,workers=2)
          print("SLATE_CERT",json.dumps({
              "games":len(rows),
              "certified":diag.get("step12_certified_games"),
              "data_gated":diag.get("step12_data_gated_games"),
              "integrity_failed":diag.get("step12_integrity_failed_games"),
              "integrity_pass_rate":diag.get("step12_integrity_pass_rate"),
              "errors":diag.get("errors"),
          },indent=2,default=str))
          if len(rows)!=len(sample):
              raise SystemExit("Step 12 slate smoke lost a game")
          if int(diag.get("step12_integrity_failed_games") or 0)!=0:
              raise SystemExit("Step 12 slate smoke found integrity failure")
          if float(diag.get("step12_integrity_pass_rate") or 0.0)!=1.0:
              raise SystemExit("Step 12 slate integrity pass rate below 100%")
          if diag.get("errors"):
              raise SystemExit(f"Step 12 slate errors: {diag.get('errors')}")
          print("LIVE_STEP12_MULTI_GAME_SLATE=PASS")
          PY

      - name: Live hero retains full frozen stack and Step 12 badge
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v11 as slate
          import cfb_over_under_matchup_ui_v12 as ui
          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          result=slate.analyze_game(game,"2026-09-10",50.5)
          hero=ui._hero_v12(game,result.get("away") or {},result.get("home") or {})
          panel=ui._cert_panel(result.get("raw") or {})
          for token in ("TEAM LOGOS VERIFIED","UPGRADE STEP 4","UPGRADE STEP 5","UPGRADE STEP 6","UPGRADE STEP 7","UPGRADE STEP 8","UPGRADE STEP 9","UPGRADE STEP 10","UPGRADE STEP 11","UPGRADE STEP 12"):
              if token not in hero: raise SystemExit(f"active Step 12 hero missing: {token}")
          for token in ("FINAL SYSTEM CERTIFICATION","CERTIFIED","12/12 upgrade stack checked"):
              if token not in panel: raise SystemExit(f"Step 12 panel missing: {token}")
          print("LIVE_STEP12_UI_STACK=PASS")
          PY

      - name: Prove Step 12 read-only firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_certification_v1.py",
              "cfb_over_under_slate_v11.py",
              "cfb_over_under_matchup_ui_v12.py",
              "streamlit_memory_lazy_router_v52.py",
              "app.py",
          ))
          required=[
              'FROZEN_STEP11_SLATE = "cfb_over_under_slate_v10"',
              'CERTIFIED_UPGRADE_STEPS = tuple(range(1, 13))',
              'PROJECTION_MATH_CHANGED = False',
              'SELECTION_MATH_CHANGED = False',
              'RELIABILITY_CHANGED = False',
              'STRUCTURAL_SIGMA_CHANGED = False',
              'QUALIFICATION_THRESHOLDS_CHANGED = False',
              'FROZEN_SLATE = "cfb_over_under_slate_v10"',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v11"',
              'root._import("cfb_over_under_matchup_ui_v12")',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v51"',
              'from streamlit_memory_lazy_router_v52 import render_app',
          ]
          for token in required:
              if token not in combined: raise SystemExit(f"missing Step 12 marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower: raise SystemExit(f"Step 12 crossed model firewall: {token}")
          print("CFB_OU_UPGRADE_STEP12_READ_ONLY_FIREWALL=PASS")
          PY

      - name: Final certification marker
        run: echo CFB_OU_UPGRADE_STEP12_FINAL_CERTIFICATION_GREEN
