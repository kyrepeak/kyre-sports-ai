name: WNBA PRA Speed V3 Step 9 Final Certification

on:
  pull_request:
    paths:
      - "devsystem/wnba_pra_speed_v3_step9_final_cert.py"
      - "tests/test_wnba_pra_speed_v3_step9.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step9-final-cert.json"
      - ".github/workflows/wnba-pra-speed-v3-step9-final-cert.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/wnba_pra_speed_v3_step9_final_cert.py"
      - "tests/test_wnba_pra_speed_v3_step9.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step9-final-cert.json"
      - ".github/workflows/wnba-pra-speed-v3-step9-final-cert.yml"
  workflow_dispatch:

concurrency:
  group: wnba-pra-speed-v3-step9-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step-9 PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step9-final-cert.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step9-final-cert.json
          devsystem/wnba_pra_speed_v3_step9_final_cert.py
          tests/test_wnba_pra_speed_v3_step9.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          echo "WNBA_PRA_SPEED_V3_STEP9_EXACT_SCOPE_GREEN"

      - name: Install Step-9 contract dependencies
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run Step-9 permanent contract
        run: python -m pytest -q tests/test_wnba_pra_speed_v3_step9.py

      - name: Certify Step-9 branch contract
        run: |
          echo "WNBA_PRA_SPEED_V3_STEP9_FROZEN_STEPS1_8_SCOPE_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP9_SPEED_BUDGET_CONTRACT_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP9_BRANCH_GREEN"

  production-profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          python -m playwright install chromium
      - name: Run final production speed certification
        run: |
          echo "WNBA_PRA_SPEED_V3_STEP9_IMPORT_PATH_REPAIR_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP9_ROUTE_PRIME_VERIFIER_SCOPE_GREEN"
          python -m devsystem.wnba_pra_speed_v3_step9_final_cert --artifact-dir artifacts/wnba-pra-speed-v3-step9
      - name: Upload Step-9 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-pra-speed-v3-step9-${{ github.run_id }}
          path: artifacts/wnba-pra-speed-v3-step9
          if-no-files-found: warn
          retention-days: 14
