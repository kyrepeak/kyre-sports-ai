name: Universal Theme Step 5 Responsive

on:
  push:
    branches:
      - "monster/universal-theme-step5-responsive-v1"
    paths:
      - "kyre_universal_responsive_v1.py"
      - "nfl_passing_yards_hub_v45.py"
      - "streamlit_memory_lazy_router_v188.py"
      - "prototypes/universal_theme_responsive_step5_v1.py"
      - "tests/test_universal_theme_responsive_step5_v1.py"
      - ".github/workflows/universal-theme-step5-responsive-v1.yml"

permissions:
  contents: read

jobs:
  targeted-responsive-polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted UI dependency
        run: pip install -q streamlit
      - name: Prove universal responsive polish only
        run: python tests/test_universal_theme_responsive_step5_v1.py
