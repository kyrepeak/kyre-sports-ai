name: CFB O/U Upgrade Step 4 pace permanent freeze

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step4-pace-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step4-pace-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step4-pace-permanent-freeze.yml' \
            'cfb_over_under_upgrade_freeze_manifest_v4.json' | sort)"
          test "$actual" = "$expected"
          echo "CFB_OU_UPGRADE_STEP4_FREEZE_SCOPE=PASS"

      - name: Enforce previous Upgrade Step 3 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()

          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v3.json") != "7c3408833b931fbb9d2e41e6660ebdf4f975f723":
              failures.append("Upgrade Step 3 freeze manifest changed")

          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing previous frozen upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"previous frozen upgrade changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_3_FROZEN=PASS")
          PY

      - name: Enforce logo hotfix V4 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()

          failures=[]
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v4.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen logo path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_V4_FROZEN=PASS")
          PY

      - name: Enforce Upgrade Step 4 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()

          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v4.json").read_text())
          failures=[]

          if manifest.get("version") != 4:
              failures.append("Upgrade freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1,2,3,4]:
              failures.append("completed upgrade list changed")

          c=manifest.get("step4_contract") or {}
          required_true=[
              "ncaa_total_offense_plays_per_game_active",
              "ncaa_time_of_possession_seconds_per_play_active",
              "division_baseline_pace_active",
              "fbs_fcs_table_identity_resolution_active",
              "identity_safe_lookup_active",
              "mixed_fbs_fcs_absolute_pace_allowed",
              "early_sample_shrinkage_active",
              "expected_combined_plays_active",
              "live_florida_am_miami_certified",
          ]
          for key in required_true:
              if c.get(key) is not True:
                  failures.append(f"Step 4 contract lost {key}")

          if c.get("direct_possession_count_available") is not False:
              failures.append("direct possession availability changed")
          if c.get("direct_possession_count_fabricated") is not False:
              failures.append("direct possession fabrication contract changed")
          if c.get("max_total_pace_adjustment_points") != 2.75:
              failures.append("pace cap changed")
          if c.get("analysis_line_pace_weight") != 0.0:
              failures.append("analysis line pace weight changed")
          if c.get("analysis_line_projection_weight") != 0.0:
              failures.append("analysis line projection weight changed")

          for key in (
              "frozen_step9_thresholds_changed",
              "frozen_reliability_changed",
              "frozen_structural_sigma_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ):
              if c.get(key) is not False:
                  failures.append(f"unexpected Step 4 behavior: {key}")

          if c.get("live_florida_am_division") != "FCS":
              failures.append("Florida A&M live division certification changed")
          if c.get("live_miami_division") != "FBS":
              failures.append("Miami live division certification changed")
          if c.get("next_upgrade_step") != 5:
              failures.append("next upgrade step changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 4 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 4 frozen blob changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP4_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify active runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v44 import render_app' app.py
          python -m py_compile \
            cfb_over_under_pace_engine_v1.py \
            cfb_over_under_slate_v3.py \
            cfb_over_under_matchup_ui_v4.py \
            streamlit_memory_lazy_router_v44.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step4_pace_engine.py \
            tests/test_cfb_over_under_upgrade_step4_slate.py \
            tests/test_cfb_over_under_upgrade_step4_ui_router.py \
            tests/test_cfb_over_under_multisource_logo_hotfix_v4.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py

      - name: Freeze marker
        run: echo "CFB_OU_UPGRADE_STEP4_PACE_PERMANENT_FREEZE_GREEN"
