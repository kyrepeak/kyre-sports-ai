name: CFB Over-Under Intelligence V2 Upgrade Step 2

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step2-rankings-records']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive Step 2 scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step2-rankings-records'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step2-rankings-records.yml' \
            'app.py' \
            'cfb_over_under_matchup_ui_v2.py' \
            'cfb_over_under_rankings_v1.py' \
            'streamlit_memory_lazy_router_v38.py' \
            'tests/test_cfb_over_under_upgrade_step2_rankings.py' \
            'tests/test_cfb_over_under_upgrade_step2_ui.py' \
            'tests/test_streamlit_memory_lazy_router_v38.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U Upgrade Step 2 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_UPGRADE_STEP2_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = "cfb_freeze_manifest_v12.json"
          expected_manifest_blob = "3ff2a727967e80dddbe03f747d9f32090cc39539"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev(f"HEAD:{manifest_path}") != expected_manifest_blob:
              failures.append("CFB Step-12 freeze manifest changed")

          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB path changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce permanently frozen O/U Upgrade Step 1
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = "cfb_over_under_upgrade_freeze_manifest_v1.json"
          expected_manifest_blob = "8dc5ddbf06744953b5e6689eefcdfb92e0c116fe"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev(f"HEAD:{manifest_path}") != expected_manifest_blob:
              failures.append("O/U Upgrade Step 1 freeze manifest changed")

          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          if manifest.get("completed_upgrade_steps") != [1]:
              failures.append("O/U Upgrade Step 1 completion contract changed")
          if (manifest.get("step1_contract") or {}).get("next_upgrade_step") != 2:
              failures.append("O/U Upgrade Step 1 handoff changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen Upgrade Step 1 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen Upgrade Step 1 path changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP1_FROZEN=PASS")
          PY

      - name: Compile Upgrade Step 2
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_rankings_v1.py \
            cfb_over_under_matchup_ui_v2.py \
            streamlit_memory_lazy_router_v38.py \
            tests/test_cfb_over_under_upgrade_step2_rankings.py \
            tests/test_cfb_over_under_upgrade_step2_ui.py \
            tests/test_streamlit_memory_lazy_router_v38.py
          PYTHONPATH=. python -c "import cfb_over_under_rankings_v1; import cfb_over_under_matchup_ui_v2; import streamlit_memory_lazy_router_v38"

      - name: Run Upgrade Step 2 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step2_rankings.py \
            tests/test_cfb_over_under_upgrade_step2_ui.py \
            tests/test_streamlit_memory_lazy_router_v38.py \
            tests/test_cfb_over_under_upgrade_step1.py \
            tests/test_streamlit_memory_lazy_router_v37.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_cfb_step9_over_under_slate_v1.py \
            tests/test_cfb_step9_over_under_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v36.py \
            tests/test_cfb_step12_game_total_final_v1.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_cfb_mixed_division_hotfix.py

      - name: Prove ranking-context firewall and Router V38 handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path("cfb_over_under_rankings_v1.py").read_text(encoding="utf-8")
          ui = Path("cfb_over_under_matchup_ui_v2.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v38.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = provider + "\n" + ui + "\n" + router + "\n" + app

          required = [
              'MODEL_VERSION = "CFB O/U RANKINGS V1 • UPGRADE STEP 2"',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v1"',
              'root._import("cfb_over_under_matchup_ui_v2")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v37"',
              'from streamlit_memory_lazy_router_v38 import render_app',
              '"projection_weight": 0.0',
              '"selection_weight": 0.0',
              '"ranking_selection_weight": 0.0',
              'CFP shows NOT YET before November',
              'not a new power-rating formula',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Upgrade Step 2 marker: {token}")

          provider_forbidden = [
              "cfb_over_under_model_v1",
              "cfb_over_under_final_v1",
              "cfb_over_under_slate_v1",
              "projected_total",
              "over_probability",
              "under_probability",
              "selection_probability",
              "rank_slate(",
              "expected_value",
              "np.random",
              "random.",
          ]
          lower_provider = provider.lower()
          for token in provider_forbidden:
              if token.lower() in lower_provider:
                  raise SystemExit(f"ranking provider crossed model firewall: {token}")

          ui_forbidden = [
              "projected_total =",
              "over_probability =",
              "under_probability =",
              "selection_probability =",
              "rank_slate(",
              "analyze_game(",
              "expected_value",
              "np.random",
          ]
          lower_ui = ui.lower()
          for token in ui_forbidden:
              if token.lower() in lower_ui:
                  raise SystemExit(f"ranking UI crossed model firewall: {token}")

          print("CFB_OU_UPGRADE_STEP2_RANKING_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_UPGRADE_STEP2_GREEN"
