name: NFL Prop Analytics Step 7 Player Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_player_select_v1.py"
      - "tests/test_nfl_prop_analytics_step7_player_handoff_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json"
      - "nfl_prop_analytics_hub_v1.py"
      - "nfl_prop_analytics_player_select_v1.py"
      - "tests/test_nfl_prop_analytics_step7_player_handoff_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-step7-player-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 7 scope and frozen Steps 1-6 / Passing Yards
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step7-player-handoff-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_player_select_v1.py' \
            'tests/test_nfl_prop_analytics_step7_player_handoff_v1.py' | sort)"
          step8_additive_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step1-route-ownership-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-step8-prop-page-shell-v1.json' \
            'nfl_prop_analytics_hub_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py' | sort)"
          visual_polish_step3_expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json' \
            'nfl_prop_analytics_schedule_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_visual_polish_step3_v1.py' | sort)"
          page2_polish_step1_expected="$(printf '%s\n' \\
            '.github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \\
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \\
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json' \\
            'nfl_prop_analytics_matchup_shell_v1.py' \\
            'tests/test_nfl_prop_analytics_page2_polish_step1_v1.py'  | sort)"

          if [ "$actual" != "$expected" ] && \
             [ "$actual" != "$step8_additive_expected" ] && \
             [ "$actual" != "$visual_polish_step3_expected" ] && \
             [ "$actual" != "$page2_polish_step1_expected" ]; then
            echo "NFL_PROP_ANALYTICS_STEP7_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "NFL_PROP_ANALYTICS_STEP7_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_availability_depth_v1.py cf7fdeee4c18d95c19d2a737f59bda7818e059ae
          check_blob devsystem/task_ledgers/nfl-prop-analytics-step6-availability-depth-v1.json e0d465cb15839fffa08cffe2126b839b91719c42
          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob nfl_prop_analytics_matchup_shell_v1.py 3052411d963354997f17f15358407db7a2c2c57e
          check_blob nfl_prop_analytics_game_select_v1.py 1187c13fc5bee03a955d014e87f237ed055a27ef
          check_blob nfl_prop_analytics_schedule_v1.py 3558f4581c0301c4fc57f8b5e761e1e0cc1eb63c
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          grep -F 'render_player_selection_handoff(handoff, availability_truth)' nfl_prop_analytics_hub_v1.py
          echo "NFL_PROP_ANALYTICS_STEP7_STEP6_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_STEP5_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_STEP4_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_STEP3_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_STEP2_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_STEP1_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_PASSING_YARDS_FROZEN_GREEN"
          echo "NFL_PROP_ANALYTICS_STEP7_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test Steps 1-7 contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile \
            nfl_prop_analytics_hub_v1.py \
            nfl_prop_analytics_availability_depth_v1.py \
            nfl_prop_analytics_player_select_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py \
            tests/test_nfl_prop_analytics_step3_game_handoff_v1.py \
            tests/test_nfl_prop_analytics_step4_page2_shell_v1.py \
            tests/test_nfl_prop_analytics_step5_roster_truth_v1.py \
            tests/test_nfl_prop_analytics_step6_availability_depth_v1.py \
            tests/test_nfl_prop_analytics_step7_player_handoff_v1.py
          echo "NFL_PROP_ANALYTICS_STEP7_STATIC_GREEN"

      - name: Prove live CAR-CLE eligible-player handoffs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from nfl_prop_analytics_roster_truth_v1 import load_verified_roster_truth
          from nfl_prop_analytics_availability_depth_v1 import load_availability_depth_truth
          from nfl_prop_analytics_player_select_v1 import eligible_players, build_player_handoff

          handoff={
              "state":"ready",
              "selection_key":"CAR-CLE",
              "away":"CAR",
              "home":"CLE",
              "away_name":"Panthers",
              "home_name":"Browns",
              "target_date":"2026-09-27",
              "week":3,
          }
          roster=load_verified_roster_truth(handoff)
          if roster["state"]!="live":
              raise RuntimeError("PROP_ANALYTICS_STEP7_STEP5_NOT_LIVE:"+str(roster.get("reason")))
          step6=load_availability_depth_truth(handoff,roster)
          if step6["state"]!="live":
              raise RuntimeError("PROP_ANALYTICS_STEP7_STEP6_NOT_LIVE:"+str(step6.get("reason")))

          players=eligible_players(step6)
          if len(players)<8:
              raise RuntimeError(f"PROP_ANALYTICS_STEP7_CANDIDATES_TOO_SMALL:{len(players)}")
          if any(p["availability_state"] not in {"PENDING","AVAILABLE"} for p in players):
              raise RuntimeError("PROP_ANALYTICS_STEP7_BLOCKED_PLAYER_LEAK")
          if any(not p["depth_verified"] for p in players):
              raise RuntimeError("PROP_ANALYTICS_STEP7_DEPTH_UNVERIFIED_LEAK")

          handoffs=[build_player_handoff(handoff,step6,p) for p in players]
          if len({h["player_id"] for h in handoffs}) != len(handoffs):
              raise RuntimeError("PROP_ANALYTICS_STEP7_PLAYER_IDS_NOT_UNIQUE")
          if not all(h["event_id"]==step6["event_id"] for h in handoffs):
              raise RuntimeError("PROP_ANALYTICS_STEP7_EVENT_ID_DRIFT")
          if not all(h["selection_key"]=="CAR-CLE" for h in handoffs):
              raise RuntimeError("PROP_ANALYTICS_STEP7_MATCHUP_DRIFT")
          if step6["availability_state"]=="PENDING":
              leaked=[h["player_name"] for h in handoffs if h["prop_analysis_gate_open"]]
              if leaked:
                  raise RuntimeError("PROP_ANALYTICS_STEP7_PENDING_PROP_GATE_LEAK:"+str(leaked))
              print("NFL_PROP_ANALYTICS_STEP7_PENDING_GATE_CLOSED_GREEN")

          print("NFL_PROP_ANALYTICS_STEP7_LIVE_CANDIDATES_GREEN",len(players))
          print("NFL_PROP_ANALYTICS_STEP7_LIVE_HANDOFFS_GREEN",len(handoffs))
          print("NFL_PROP_ANALYTICS_STEP7_EXACT_IDS_GREEN")
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/nfl-prop-analytics-step7
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/nfl-prop-analytics-step7/streamlit.log 2>&1 &
          echo $! > /tmp/prop_analytics_step7_pid

      - name: Prove real player selection, deep-link handoff, responsive layout, and frozen predecessors
        run: |
          python - <<'PY'
          import time
          import requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("PROP_ANALYTICS_STEP7_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP7_SELECTOR_NOT_READY:"+selector)

          def open_player(page,player_id=""):
              params={
                  "ks_jump_sport":"NFL",
                  "ks_jump_market":"Prop Analytics",
                  "ks_pa_game":"CAR-CLE",
                  "ks_pa_page":"matchup",
              }
              if player_id:
                  params["ks_pa_player"]=player_id
              page.goto(base+"/?"+urlencode(params),wait_until="domcontentloaded",timeout=120000)
              return find(page,'[data-nfl-prop-analytics-step7-player-selection="v1"]',180)[1]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              step7=open_player(page)

              assert step7.get_attribute("data-prop-step7-state")=="ready"
              candidates=int(step7.get_attribute("data-prop-step7-candidate-count") or 0)
              assert candidates>=8,candidates
              ids=[x for x in (step7.get_attribute("data-prop-step7-candidate-ids") or "").split(",") if x]
              assert len(ids)==candidates,(len(ids),candidates)
              first=step7.get_attribute("data-prop-step7-player-id")
              assert first in ids,first

              availability=step7.get_attribute("data-prop-step7-availability")
              gate=step7.get_attribute("data-prop-step7-prop-gate")
              if availability=="PENDING":
                  assert gate=="CLOSED",gate
                  print("NFL_PROP_ANALYTICS_STEP7_BRANCH_PENDING_GATE_CLOSED_GREEN")

              second=next(x for x in ids if x!=first)
              step7=open_player(page,second)
              assert step7.get_attribute("data-prop-step7-player-id")==second
              assert step7.get_attribute("data-prop-step7-player-id")!=first
              assert step7.get_attribute("data-prop-step7-prop-page-ready")=="true"
              print("NFL_PROP_ANALYTICS_STEP7_BRANCH_SELECTION_CHANGE_GREEN",first,second)
              print("NFL_PROP_ANALYTICS_STEP7_BRANCH_HANDOFF_GREEN",candidates)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=step7.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP7_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP7_BRANCH_{width}_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("NFL_PROP_ANALYTICS_STEP7_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              print("NFL_PROP_ANALYTICS_STEP7_STEP6_BRANCH_FROZEN_GREEN")

              passing.close()
              page.close()
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1900 artifacts/nfl-prop-analytics-step7/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/prop_analytics_step7_pid ]; then
            kill "$(cat /tmp/prop_analytics_step7_pid)" 2>/dev/null || true
          fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Step 7 player handoff and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=150):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PROP_ANALYTICS_STEP7_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def open_url(page,player_id=""):
              params={
                  "ks_jump_sport":"NFL",
                  "ks_jump_market":"Prop Analytics",
                  "ks_pa_game":"CAR-CLE",
                  "ks_pa_page":"matchup",
              }
              if player_id:
                  params["ks_pa_player"]=player_id
              page.goto(base+"/?"+urlencode(params),wait_until="domcontentloaded",timeout=120000)

          def open_step7(browser):
              deadline=time.monotonic()+1200
              last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      open_url(page)
                      _,step7=find(page,'[data-nfl-prop-analytics-step7-player-selection="v1"]',180)
                      state=step7.get_attribute("data-prop-step7-state")
                      candidates=int(step7.get_attribute("data-prop-step7-candidate-count") or 0)
                      player_id=step7.get_attribute("data-prop-step7-player-id")
                      if state!="ready":
                          last=f"STEP7_STATE:{state}"
                      elif candidates<8:
                          last=f"STEP7_CANDIDATES:{candidates}"
                      elif not player_id or not player_id.isdigit():
                          last=f"STEP7_PLAYER_ID:{player_id}"
                      else:
                          return context,page,step7,candidates
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PROP_ANALYTICS_STEP7_PUBLIC_DEPLOY_WAIT",last)
                  try:
                      context.close()
                  except Exception:
                      pass
                  time.sleep(8)
              raise RuntimeError("PROP_ANALYTICS_STEP7_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context,page,step7,candidates=open_step7(browser)

              ids=[x for x in (step7.get_attribute("data-prop-step7-candidate-ids") or "").split(",") if x]
              assert len(ids)==candidates,(len(ids),candidates)
              first=step7.get_attribute("data-prop-step7-player-id")
              assert first in ids,first

              availability=step7.get_attribute("data-prop-step7-availability")
              gate=step7.get_attribute("data-prop-step7-prop-gate")
              if availability=="PENDING":
                  assert gate=="CLOSED",gate
                  print("NFL_PROP_ANALYTICS_STEP7_PUBLIC_PENDING_GATE_CLOSED_GREEN")

              second=next(x for x in ids if x!=first)
              open_url(page,second)
              _,changed=find(page,'[data-nfl-prop-analytics-step7-player-selection="v1"]',180)
              assert changed.get_attribute("data-prop-step7-player-id")==second
              assert changed.get_attribute("data-prop-step7-player-id")!=first
              assert changed.get_attribute("data-prop-step7-prop-page-ready")=="true"
              print("NFL_PROP_ANALYTICS_STEP7_PUBLIC_SELECTION_CHANGE_GREEN",first,second)
              print("NFL_PROP_ANALYTICS_STEP7_PUBLIC_HANDOFF_GREEN",candidates)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(200)
                  dims=changed.evaluate("""e => ({scroll:e.scrollWidth,client:e.clientWidth})""")
                  if dims["scroll"] > dims["client"] + 4:
                      raise RuntimeError(f"PROP_ANALYTICS_STEP7_PUBLIC_OVERFLOW:{width}:{dims}")
                  print(f"NFL_PROP_ANALYTICS_STEP7_PUBLIC_{width}_GREEN")

              passing=context.new_page()
