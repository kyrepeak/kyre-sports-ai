name: NFL Passing Yards Performance Step 8 V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-performance-step8-v2.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-performance-step8-v1.json"
      - "nfl_passing_yards_hub_v77.py"
      - "streamlit_memory_lazy_router_v228.py"
      - "tests/test_passing_yards_performance_step8_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-performance-step8-v2.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-performance-step8-v1.json"
      - "nfl_passing_yards_hub_v77.py"
      - "streamlit_memory_lazy_router_v228.py"
      - "tests/test_passing_yards_performance_step8_v1.py"

permissions:
  contents: read

concurrency:
  group: passing-yards-performance-step8-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step 8 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected-build.txt <<'EOF'
          .github/workflows/passing-yards-performance-step8-v2.yml
          app.py
          devsystem/task_ledgers/passing-yards-performance-step8-v1.json
          nfl_passing_yards_hub_v77.py
          streamlit_memory_lazy_router_v228.py
          tests/test_passing-yards-performance-step8-v1.py
          EOF
          cat > /tmp/expected-deploy-refresh.txt <<'EOF'
          .github/workflows/passing-yards-performance-step8-v2.yml
          app.py
          devsystem/task_ledgers/passing-yards-performance-step8-v1.json
          EOF
          sort -o /tmp/expected-build.txt /tmp/expected-build.txt
          sort -o /tmp/expected-deploy-refresh.txt /tmp/expected-deploy-refresh.txt
          if diff -q /tmp/expected-build.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_PERFORMANCE_STEP8_SCOPE_GREEN"
          elif diff -q /tmp/expected-deploy-refresh.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_PERFORMANCE_STEP8_DEPLOY_REFRESH_SCOPE_GREEN"
          else
            echo "Unexpected Step 8 diff:"
            cat /tmp/actual.txt
            exit 1
          fi

      - name: Prove Steps 1-7 and data-math owners remain frozen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" -- \
            nfl_passing_yards_hub_v71.py \
            nfl_passing_yards_hub_v72.py \
            nfl_passing_yards_hub_v73.py \
            nfl_passing_yards_hub_v74.py \
            nfl_passing_yards_hub_v75.py \
            nfl_passing_yards_hub_v76.py \
            streamlit_memory_lazy_router_v222.py \
            streamlit_memory_lazy_router_v223.py \
            streamlit_memory_lazy_router_v224.py \
            streamlit_memory_lazy_router_v225.py \
            streamlit_memory_lazy_router_v226.py \
            streamlit_memory_lazy_router_v227.py \
            nfl_game_day_availability_v1.py \
            nfl_passing_yards_personnel_v3.py \
            nfl_passing_yards_environment_v2.py \
            nfl_passing_yards_market_v1.py \
            nfl_passing_yards_market_api_v2.py
          echo "PASSING_YARDS_STEPS1_7_AND_DATA_MATH_OWNERS_FROZEN_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test Step 8 performance contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_passing_yards_hub_v77.py streamlit_memory_lazy_router_v228.py app.py
          python -m pytest -q \
            tests/test_passing_yards_ux_presentation_step7_v1.py \
            tests/test_passing_yards_performance_step8_v1.py
          python - <<'PY'
          from pathlib import Path
          import json
          import nfl_passing_yards_hub_v77 as v77
          import streamlit_memory_lazy_router_v228 as v228

          ledger=json.loads(Path("devsystem/task_ledgers/passing-yards-performance-step8-v1.json").read_text())
          assert ledger["status"] == "DONE"
          assert ledger["step8_status"] == "DONE"
          assert ledger["sportsbook_projection_influence"] == 0
          assert ledger["stake_sizing_enabled"] is False

          assert v77.FROZEN_PRIOR == "nfl_passing_yards_hub_v76"
          assert v77.NEW_PHASE_STEP == 8
          assert v77.HTML_COMPACTION == "intertag-whitespace-v1"
          assert v77.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert v228.FROZEN_ROUTER == "streamlit_memory_lazy_router_v227"
          assert v228.PASSING_HUB == "nfl_passing_yards_hub_v77"
          assert v228.FALLBACK_HUB == "nfl_passing_yards_hub_v76"

          source=Path("nfl_passing_yards_hub_v77.py").read_text()
          for token in (
              'data-passing-yards-performance="v77"',
              'data-passing-yards-performance-ready="v77"',
              'data-step8-compose-ms=',
              'data-step8-html-bytes-before=',
              'data-step8-html-bytes-after=',
              'data-step8-server-render-ms=',
          ):
              assert token in source, token
          for forbidden in ("build_baseline_projection(", "evaluate_market(", "collect_fanduel_nfl_passing_yards("):
              assert forbidden not in source, forbidden

          app=Path("app.py").read_text()
          assert "from streamlit_memory_lazy_router_v228 import record_bootstrap_import_ms, render_app" in app
          assert "PASSING_YARDS_PERFORMANCE_STEP8_RUNTIME" in app
          assert "PASSING_YARDS_PERFORMANCE_STEP8_PUBLIC_DEPLOY_REFRESH" in app
          print("PASSING_YARDS_PERFORMANCE_STEP8_STATIC_GREEN")
          PY

  branch-step8-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-performance-step8
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-performance-step8/streamlit.log 2>&1 &
          echo $! > /tmp/py_step8_pid

      - name: Prove Step 8 at phone tablet desktop
        run: |
          python - <<'PY'
          import math
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright
          from playwright._impl._errors import TargetClosedError

          base="http://127.0.0.1:8501"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          })
          budget=180.0

          class BrowserCrash(RuntimeError):
              pass

          def streamlit_health():
              try:
                  response=requests.get(base,timeout=3)
                  return response.status_code < 500, f"HTTP_{response.status_code}"
              except Exception as exc:
                  return False, f"ERROR_{type(exc).__name__}"

          deadline=time.monotonic()+150
          while time.monotonic()<deadline:
              healthy,status=streamlit_health()
              if healthy:
                  break
              time.sleep(.5)
          else:
              raise RuntimeError("STEP8_STREAMLIT_SERVER_UNHEALTHY")

          def ensure_alive(page,browser,flags,selector):
              if flags["page_crashed"]:
                  raise BrowserCrash("STEP8_PAGE_CRASHED:"+selector)
              if flags["browser_disconnected"] or not browser.is_connected():
                  raise BrowserCrash("STEP8_BROWSER_DISCONNECTED:"+selector)
              if page.is_closed():
                  raise BrowserCrash("STEP8_PAGE_CLOSED:"+selector)

          def find(page,browser,flags,selector,timeout=210):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  ensure_alive(page,browser,flags,selector)
                  try:
                      frames=list(page.frames)
                  except TargetClosedError as exc:
                      raise BrowserCrash("STEP8_TARGET_CLOSED:"+selector) from exc
                  for frame in frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except TargetClosedError as exc:
                          raise BrowserCrash("STEP8_TARGET_CLOSED:"+selector) from exc
                      except Exception:
                          pass
                  time.sleep(.45)
              raise RuntimeError("STEP8_SELECTOR_NOT_READY:"+selector)

          def runtime_text(page,browser,flags,frame,root):
              ensure_alive(page,browser,flags,"runtime-text")
              try:
                  owner=frame.locator('[data-testid="stAppViewContainer"]')
                  if owner.count()>=1:
                      return owner.first.inner_text(timeout=5000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:runtime-text") from exc
              except Exception:
                  pass
              try:
                  return root.inner_text(timeout=5000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:runtime-root") from exc
              except Exception:
                  return ""

          def assert_no_runtime_errors(page,browser,flags,frame,root):
              text=runtime_text(page,browser,flags,frame,root)
              for token in ("TypeError","KeyError","Traceback","RecursionError"):
                  if token in text:
                      raise RuntimeError("STEP8_RUNTIME_ERROR_"+token)

          def require_contract(condition,detail):
              if not condition:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:"+detail)

          def crash_evidence(width,height,page,browser):
              print(f"STEP8_CRASH_EVIDENCE VIEWPORT={width}x{height}")
              try:
                  print("PAGE_URL="+str(page.url))
              except Exception as exc:
                  print("PAGE_URL=UNAVAILABLE_"+type(exc).__name__)
              try:
                  print("PAGE_CLOSED="+str(page.is_closed()).lower())
              except Exception as exc:
                  print("PAGE_CLOSED=UNAVAILABLE_"+type(exc).__name__)
              try:
                  print("BROWSER_CONNECTED="+str(browser.is_connected()).lower())
              except Exception as exc:
                  print("BROWSER_CONNECTED=UNAVAILABLE_"+type(exc).__name__)
              try:
                  frames=list(page.frames)
                  print("FRAME_COUNT="+str(len(frames)))
                  print("FRAME_URLS="+" | ".join(str(frame.url) for frame in frames))
              except Exception as exc:
                  print("FRAME_COUNT=UNAVAILABLE_"+type(exc).__name__)
                  print("FRAME_URLS=UNAVAILABLE_"+type(exc).__name__)
              healthy,status=streamlit_health()
              print("STREAMLIT_HTTP_HEALTH="+status)
              try:
                  wanted=("MemAvailable:","MemFree:","SwapFree:")
                  with open("/proc/meminfo","r",encoding="utf-8") as handle:
                      for line in handle:
                          if line.startswith(wanted):
                              print("MEMINFO_"+line.strip())
              except Exception as exc:
                  print("MEMINFO=UNAVAILABLE_"+type(exc).__name__)

          def safe_close(page,context,browser):
              for obj in (page,context,browser):
                  if obj is None:
                      continue
                  try:
                      obj.close()
                  except Exception:
                      pass

          def certify(page,browser,flags,width,height):
              started=time.monotonic()
              try:
                  page.goto(route,wait_until="domcontentloaded",timeout=120000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:navigation") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_SELECTOR_NOT_READY:NAVIGATION") from exc

              frame,root=find(
                  page,browser,flags,
                  '[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',
              )
              runtime_frame,runtime=find(
                  page,browser,flags,
                  '[data-passing-yards-performance-ready="v77"][data-passing-yards-performance-runtime="v77"]',
              )
              ready_s=time.monotonic()-started
              if ready_s > budget:
                  raise RuntimeError(f"STEP8_PERFORMANCE_BUDGET_FAILED:{width}:{ready_s:.3f}")

              assert_no_runtime_errors(page,browser,flags,frame,root)
              try:
                  identity_name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:qb-identity") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:QB_IDENTITY_MISSING") from exc
              require_contract(identity_name=="Jordan Love",f"QB_IDENTITY:{identity_name}")

              try:
                  require_contract(root.get_attribute("data-passing-yards-explainability-ready")=="v71","V71")
                  require_contract(root.get_attribute("data-passing-yards-matchup-intelligence-ready")=="v72","V72")
                  require_contract(root.get_attribute("data-passing-yards-live-market-ready")=="v73","V73")
                  require_contract(root.get_attribute("data-passing-yards-availability-game-day-ready")=="v74","V74")
                  require_contract(root.get_attribute("data-passing-yards-failure-proofing-ready")=="v75","V75")
                  require_contract(root.get_attribute("data-passing-yards-ux-presentation-ready")=="v76","V76")
                  require_contract(runtime.get_attribute("data-passing-yards-performance")=="v77","V77")
                  require_contract(runtime.get_attribute("data-passing-yards-performance-ready")=="v77","V77_READY")

                  before=int(runtime.get_attribute("data-step8-html-bytes-before"))
                  after=int(runtime.get_attribute("data-step8-html-bytes-after"))
                  compose=float(runtime.get_attribute("data-step8-compose-ms"))
                  render_ms=float(runtime.get_attribute("data-step8-server-render-ms"))
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:contract") from exc
              except RuntimeError:
                  raise
              except Exception as exc:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:METRICS") from exc

              require_contract(0 < after <= before,f"HTML_BYTES:{before}->{after}")
              require_contract(math.isfinite(compose) and compose >= 0.0,f"COMPOSE_MS:{compose}")
              require_contract(math.isfinite(render_ms) and render_ms >= 0.0,f"SERVER_RENDER_MS:{render_ms}")

              try:
                  dims=frame.locator("body").evaluate("""e => ({
                    bodyScroll:e.scrollWidth,
                    docScroll:document.documentElement.scrollWidth,
                    viewport:window.innerWidth
                  })""")
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:overflow") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_OVERFLOW_FAILED:EVALUATION") from exc
              if dims["bodyScroll"] > dims["viewport"] + 2 or dims["docScroll"] > dims["viewport"] + 2:
                  raise RuntimeError(f"STEP8_OVERFLOW_FAILED:{width}:{dims}")

              print(f"PASSING_YARDS_PERFORMANCE_STEP8_{width}_GREEN ready_s={ready_s:.3f} server_ms={render_ms:.3f} html={before}->{after}")
              return ready_s

          def run_viewport(p,width,height):
              for attempt in (1,2):
                  browser=context=page=None
                  flags={"page_crashed":False,"browser_disconnected":False}
                  try:
                      browser=p.chromium.launch(
                          headless=True,
                          args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
                      )
                      browser.on("disconnected",lambda *_: flags.__setitem__("browser_disconnected",True))
                      context=browser.new_context(viewport={"width":width,"height":height})
                      page=context.new_page()
                      page.on("crash",lambda *_: flags.__setitem__("page_crashed",True))
                      ready_s=certify(page,browser,flags,width,height)
                      if attempt==2:
                          print(f"RETRY_READY_S={ready_s:.3f}")
                      safe_close(page,context,browser)
                      return
                  except TargetClosedError as exc:
                      crash=BrowserCrash("STEP8_TARGET_CLOSED:viewport")
                      crash.__cause__=exc
                  except BrowserCrash as exc:
                      crash=exc
                  except Exception:
                      safe_close(page,context,browser)
                      raise

                  crash_evidence(width,height,page,browser)
                  safe_close(page,context,browser)
                  if attempt==1:
                      healthy,status=streamlit_health()
                      if not healthy:
                          raise RuntimeError("STEP8_STREAMLIT_SERVER_UNHEALTHY")
                      print(f"FIRST_ATTEMPT_CRASHED viewport={width}x{height} token={crash}")
                      continue
                  raise RuntimeError(f"STEP8_CHROMIUM_CRASH_REPRODUCED_{width}") from crash

          with sync_playwright() as p:
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  run_viewport(p,width,height)
              print("PASSING_YARDS_PERFORMANCE_STEP8_BRANCH_GREEN")
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 900 artifacts/passing-yards-performance-step8/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/py_step8_pid ]; then kill "$(cat /tmp/py_step8_pid)" 2>/dev/null || true; fi

  public-step8-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Step 8 public deployment activation
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
              "ks_step8_deploy_probe":"1",
          })
          selector='[data-passing-yards-v228-router-runtime="performance-step8"]'
          deadline=time.monotonic()+480

          with sync_playwright() as p:
              while time.monotonic()<deadline:
                  browser=p.chromium.launch(
                      headless=True,
                      args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
                  )
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(route,wait_until="domcontentloaded",timeout=120000)
                      found=False
                      probe_deadline=time.monotonic()+45
                      while time.monotonic()<probe_deadline:
                          for frame in page.frames:
                              try:
                                  if frame.locator(selector).count()>=1:
                                      found=True
                                      break
                              except Exception:
                                  pass
                          if found:
                              break
                          time.sleep(.5)
                      if found:
                          print("PASSING_YARDS_PERFORMANCE_STEP8_PUBLIC_DEPLOYMENT_ACTIVE")
                          context.close()
                          browser.close()
                          break
                  finally:
                      try:
                          context.close()
                      except Exception:
                          pass
                      try:
                          browser.close()
                      except Exception:
                          pass
                  time.sleep(10)
              else:
                  raise RuntimeError("STEP8_PUBLIC_DEPLOYMENT_NOT_ACTIVE")
          PY

      - name: Prove public Step 8 and freeze
        run: |
          python - <<'PY'
          import math
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright
          from playwright._impl._errors import TargetClosedError

          base="https://kyre-sports-ai.streamlit.app"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          })
          budget=180.0

          class BrowserCrash(RuntimeError):
              pass

          def streamlit_health():
              try:
                  response=requests.get(base,timeout=5)
                  return response.status_code < 500, f"HTTP_{response.status_code}"
              except Exception as exc:
                  return False, f"ERROR_{type(exc).__name__}"

          def ensure_alive(page,browser,flags,selector):
              if flags["page_crashed"]:
                  raise BrowserCrash("STEP8_PAGE_CRASHED:"+selector)
              if flags["browser_disconnected"] or not browser.is_connected():
                  raise BrowserCrash("STEP8_BROWSER_DISCONNECTED:"+selector)
              if page.is_closed():
                  raise BrowserCrash("STEP8_PAGE_CLOSED:"+selector)

          def find(page,browser,flags,selector,timeout=260):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  ensure_alive(page,browser,flags,selector)
                  try:
                      frames=list(page.frames)
                  except TargetClosedError as exc:
                      raise BrowserCrash("STEP8_TARGET_CLOSED:"+selector) from exc
                  for frame in frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except TargetClosedError as exc:
                          raise BrowserCrash("STEP8_TARGET_CLOSED:"+selector) from exc
                      except Exception:
                          pass
                  time.sleep(.5)
              raise RuntimeError("STEP8_SELECTOR_NOT_READY:"+selector)

          def runtime_text(page,browser,flags,frame,root):
              ensure_alive(page,browser,flags,"runtime-text")
              try:
                  owner=frame.locator('[data-testid="stAppViewContainer"]')
                  if owner.count()>=1:
                      return owner.first.inner_text(timeout=5000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:runtime-text") from exc
              except Exception:
                  pass
              try:
                  return root.inner_text(timeout=5000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:runtime-root") from exc
              except Exception:
                  return ""

          def assert_no_runtime_errors(page,browser,flags,frame,root):
              text=runtime_text(page,browser,flags,frame,root)
              for token in ("TypeError","KeyError","Traceback","RecursionError"):
                  if token in text:
                      raise RuntimeError("STEP8_RUNTIME_ERROR_"+token)

          def require_contract(condition,detail):
              if not condition:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:"+detail)

          def crash_evidence(width,height,page,browser):
              print(f"STEP8_CRASH_EVIDENCE VIEWPORT={width}x{height}")
              try:
                  print("PAGE_URL="+str(page.url))
              except Exception as exc:
                  print("PAGE_URL=UNAVAILABLE_"+type(exc).__name__)
              try:
                  print("PAGE_CLOSED="+str(page.is_closed()).lower())
              except Exception as exc:
                  print("PAGE_CLOSED=UNAVAILABLE_"+type(exc).__name__)
              try:
                  print("BROWSER_CONNECTED="+str(browser.is_connected()).lower())
              except Exception as exc:
                  print("BROWSER_CONNECTED=UNAVAILABLE_"+type(exc).__name__)
              try:
                  frames=list(page.frames)
                  print("FRAME_COUNT="+str(len(frames)))
                  print("FRAME_URLS="+" | ".join(str(frame.url) for frame in frames))
              except Exception as exc:
                  print("FRAME_COUNT=UNAVAILABLE_"+type(exc).__name__)
                  print("FRAME_URLS=UNAVAILABLE_"+type(exc).__name__)
              healthy,status=streamlit_health()
              print("STREAMLIT_HTTP_HEALTH="+status)
              try:
                  wanted=("MemAvailable:","MemFree:","SwapFree:")
                  with open("/proc/meminfo","r",encoding="utf-8") as handle:
                      for line in handle:
                          if line.startswith(wanted):
                              print("MEMINFO_"+line.strip())
              except Exception as exc:
                  print("MEMINFO=UNAVAILABLE_"+type(exc).__name__)

          def safe_close(page,context,browser):
              for obj in (page,context,browser):
                  if obj is None:
                      continue
                  try:
                      obj.close()
                  except Exception:
                      pass

          def certify(page,browser,flags,width,height):
              started=time.monotonic()
              try:
                  page.goto(route,wait_until="domcontentloaded",timeout=120000)
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:navigation") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_SELECTOR_NOT_READY:NAVIGATION") from exc

              frame,root=find(
                  page,browser,flags,
                  '[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',
              )
              runtime_frame,runtime=find(
                  page,browser,flags,
                  '[data-passing-yards-performance-ready="v77"][data-passing-yards-performance-runtime="v77"]',
              )
              ready_s=time.monotonic()-started
              if ready_s > budget:
                  raise RuntimeError(f"STEP8_PERFORMANCE_BUDGET_FAILED:{width}:{ready_s:.3f}")

              assert_no_runtime_errors(page,browser,flags,frame,root)
              try:
                  identity_name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:qb-identity") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:QB_IDENTITY_MISSING") from exc
              require_contract(identity_name=="Jordan Love",f"QB_IDENTITY:{identity_name}")

              try:
                  require_contract(root.get_attribute("data-passing-yards-explainability-ready")=="v71","V71")
                  require_contract(root.get_attribute("data-passing-yards-matchup-intelligence-ready")=="v72","V72")
                  require_contract(root.get_attribute("data-passing-yards-live-market-ready")=="v73","V73")
                  require_contract(root.get_attribute("data-passing-yards-availability-game-day-ready")=="v74","V74")
                  require_contract(root.get_attribute("data-passing-yards-failure-proofing-ready")=="v75","V75")
                  require_contract(root.get_attribute("data-passing-yards-ux-presentation-ready")=="v76","V76")
                  require_contract(runtime.get_attribute("data-passing-yards-performance")=="v77","V77")
                  require_contract(runtime.get_attribute("data-passing-yards-performance-ready")=="v77","V77_READY")

                  before=int(runtime.get_attribute("data-step8-html-bytes-before"))
                  after=int(runtime.get_attribute("data-step8-html-bytes-after"))
                  compose=float(runtime.get_attribute("data-step8-compose-ms"))
                  render_ms=float(runtime.get_attribute("data-step8-server-render-ms"))
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:contract") from exc
              except RuntimeError:
                  raise
              except Exception as exc:
                  raise RuntimeError("STEP8_V77_CONTRACT_FAILED:METRICS") from exc

              require_contract(0 < after <= before,f"HTML_BYTES:{before}->{after}")
              require_contract(math.isfinite(compose) and compose >= 0.0,f"COMPOSE_MS:{compose}")
              require_contract(math.isfinite(render_ms) and render_ms >= 0.0,f"SERVER_RENDER_MS:{render_ms}")

              try:
                  dims=frame.locator("body").evaluate("""e => ({
                    bodyScroll:e.scrollWidth,
                    docScroll:document.documentElement.scrollWidth,
                    viewport:window.innerWidth
                  })""")
              except TargetClosedError as exc:
                  raise BrowserCrash("STEP8_TARGET_CLOSED:overflow") from exc
              except Exception as exc:
                  raise RuntimeError("STEP8_OVERFLOW_FAILED:EVALUATION") from exc
              if dims["bodyScroll"] > dims["viewport"] + 2 or dims["docScroll"] > dims["viewport"] + 2:
                  raise RuntimeError(f"STEP8_OVERFLOW_FAILED:{width}:{dims}")

              print(f"PASSING_YARDS_PERFORMANCE_STEP8_PUBLIC_{width}_GREEN ready_s={ready_s:.3f} server_ms={render_ms:.3f} html={before}->{after}")
              return ready_s

          def run_viewport(p,width,height):
              for attempt in (1,2):
                  browser=context=page=None
                  flags={"page_crashed":False,"browser_disconnected":False}
                  try:
                      browser=p.chromium.launch(
                          headless=True,
                          args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
                      )
                      browser.on("disconnected",lambda *_: flags.__setitem__("browser_disconnected",True))
                      context=browser.new_context(viewport={"width":width,"height":height})
                      page=context.new_page()
                      page.on("crash",lambda *_: flags.__setitem__("page_crashed",True))
                      ready_s=certify(page,browser,flags,width,height)
                      if attempt==2:
                          print(f"RETRY_READY_S={ready_s:.3f}")
                      safe_close(page,context,browser)
                      return
                  except TargetClosedError as exc:
                      crash=BrowserCrash("STEP8_TARGET_CLOSED:viewport")
                      crash.__cause__=exc
                  except BrowserCrash as exc:
                      crash=exc
                  except Exception:
                      safe_close(page,context,browser)
                      raise

                  crash_evidence(width,height,page,browser)
                  safe_close(page,context,browser)
                  if attempt==1:
                      healthy,status=streamlit_health()
                      if not healthy:
                          raise RuntimeError("STEP8_STREAMLIT_SERVER_UNHEALTHY")
                      print(f"FIRST_ATTEMPT_CRASHED viewport={width}x{height} token={crash}")
                      continue
                  raise RuntimeError(f"STEP8_CHROMIUM_CRASH_REPRODUCED_{width}") from crash

          with sync_playwright() as p:
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  run_viewport(p,width,height)
          print("PASSING_YARDS_PERFORMANCE_STEP8_PUBLIC_GREEN")
          print("PASSING_YARDS_PERFORMANCE_STEP8_FROZEN")
          PY
