name: WNBA Step19F FanDuel market diagnostic

on:
  push:
    branches:
      - wnba-step19f-fanduel-market-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Inspect FanDuel target event pages and player markets
        run: |
          python - <<'PY'
          import json
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step19f_draftkings_identity as s19f

          s19f.install_step19f_draftkings_identity()
          content_url=fd.FANDUEL_BASE_URL+fd.CONTENT_PAGE_PATH
          common={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'page':'CUSTOM','customPageId':fd.WNBA_CUSTOM_PAGE_ID,'timezone':'America/New_York'}
          content=fd._get_json(content_url,params=common,requester=None,timeout=15.0)
          events=fd._extract_events(content)
          print('LANDING_EVENTS',len(events))
          target=[]
          for e in events:
              print('LANDING_EVENT',json.dumps({'id':fd._event_id(e),'name':fd._event_name(e),'date':fd._event_date(e),'raw_open':e.get('openDate') or e.get('startTime') or e.get('startEventDate')},sort_keys=True))
              if fd._event_date(e)=='2026-08-29': target.append(e)
          print('TARGET_EVENTS',len(target))
          for e in target:
              eid=fd._event_id(e)
              url=fd.FANDUEL_BASE_URL+fd.EVENT_PAGE_PATH
              base=fd._get_json(url,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'eventId':eid},requester=None,timeout=15.0)
              layout=base.get('layout') or {}
              tabs=fd._iter_mapping_or_list(layout.get('tabs'))
              print('EVENT_BASE',eid,fd._event_name(e),'TABS',len(tabs),'MARKETS',len(fd._extract_markets(base)))
              for t in tabs:
                  print('TAB',json.dumps({'id':fd._clean(t.get('id') or t.get('tabId') or t.get('_attachment_key')),'title':fd._clean(t.get('title') or t.get('name') or t.get('displayName'))},sort_keys=True))
              print('RELEVANT_TAB_IDS',fd._relevant_tab_ids(base))
              docs=[('base',base)]
              # Fetch every tab for diagnosis only, bounded by provider safety max.
              for t in tabs[:fd.MAX_RELEVANT_TABS_PER_EVENT]:
                  tid=fd._clean(t.get('id') or t.get('tabId') or t.get('_attachment_key'))
                  if not tid: continue
                  try:
                      doc=fd._get_json(url,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'eventId':eid,'tab':tid},requester=None,timeout=15.0)
                      docs.append((tid,doc))
                  except Exception as exc:
                      print('TAB_FETCH_ERROR',tid,type(exc).__name__,str(exc))
              for label,doc in docs:
                  markets=fd._extract_markets(doc)
                  print('DOC',label,'MARKET_COUNT',len(markets))
                  for m in markets[:80]:
                      runners=fd._iter_mapping_or_list(m.get('runners'))
                      print('MARKET',json.dumps({
                          'id':fd._clean(m.get('marketId') or m.get('id') or m.get('_attachment_key')),
                          'name':fd._clean(m.get('marketName') or m.get('name') or m.get('displayName')),
                          'type':fd._clean(m.get('marketType') or m.get('type')),
                          'runner_count':len(runners),
                          'runner_names':[fd._clean(r.get('runnerName') or r.get('name') or r.get('displayName')) for r in runners[:6]],
                      },sort_keys=True))
          PY
