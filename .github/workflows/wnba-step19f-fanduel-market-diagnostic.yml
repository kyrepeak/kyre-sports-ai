name: WNBA Step19F FanDuel market diagnostic

on:
  push:
    branches:
      - wnba-step19f-fanduel-market-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Probe FanDuel player tab request variants
        run: |
          python - <<'PY'
          import hashlib, json
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step19f_draftkings_identity as s19f
          s19f.install_step19f_draftkings_identity()
          content=fd._get_json(fd.FANDUEL_BASE_URL+fd.CONTENT_PAGE_PATH,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'page':'CUSTOM','customPageId':fd.WNBA_CUSTOM_PAGE_ID,'timezone':'America/New_York'},requester=None,timeout=15.0)
          event=next(e for e in fd._extract_events(content) if fd._event_date(e)=='2026-08-29')
          eid=fd._event_id(event); url=fd.FANDUEL_BASE_URL+fd.EVENT_PAGE_PATH
          base=fd._get_json(url,params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'eventId':eid},requester=None,timeout=15.0)
          tabs=fd._iter_mapping_or_list((base.get('layout') or {}).get('tabs'))
          for t in tabs:
              title=fd._clean(t.get('title') or t.get('name') or t.get('displayName'))
              if title.startswith('Player'):
                  print('FULL_TAB',json.dumps(t,sort_keys=True,default=str)[:10000])
          variants=[
            ('tab_numeric',{'tab':'168'}),('tab_slug',{'tab':'player-points'}),('tab_title',{'tab':'Player Points'}),
            ('tabId_numeric',{'tabId':'168'}),('tabName_slug',{'tabName':'player-points'}),('marketTab_numeric',{'marketTab':'168'}),
          ]
          for label,extra in variants:
              params={'_ak':fd.FANDUEL_PUBLIC_WEB_KEY,'eventId':eid,**extra}
              try:
                  doc=fd._get_json(url,params=params,requester=None,timeout=15.0)
              except Exception as exc:
                  print('VARIANT_ERROR',label,type(exc).__name__,str(exc)); continue
              markets=fd._extract_markets(doc)
              raw=json.dumps(doc,sort_keys=True,default=str).encode()
              print('VARIANT',label,'HASH',hashlib.sha256(raw).hexdigest()[:16],'MARKETS',len(markets))
              for m in markets[:120]:
                  name=fd._clean(m.get('marketName') or m.get('name') or m.get('displayName'))
                  typ=fd._clean(m.get('marketType') or m.get('type'))
                  runners=fd._iter_mapping_or_list(m.get('runners'))
                  if 'player' in (name+' '+typ).casefold() or any('over' in fd._clean(r.get('runnerName') or r.get('name')).casefold() for r in runners):
                      print('PLAYERISH',label,json.dumps({'name':name,'type':typ,'runners':runners[:2]},sort_keys=True,default=str)[:12000])
          PY
