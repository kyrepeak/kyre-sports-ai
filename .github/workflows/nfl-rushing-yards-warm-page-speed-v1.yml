name: NFL Rushing Yards Warm Page Speed V1

on:
  push:
    branches: [nfl-rushing-yards-warm-page-speed-v1]

permissions:
  contents: read

jobs:
  benchmark-warm-rushing-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate Browser QA stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Prewarm exact-event context and market
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://kyre-sports-api.onrender.com/api/v1/nfl/rushing-yards?event_id=401872925' \
            -o /tmp/context.json
          curl --fail --silent --show-error --max-time 30 \
            'https://kyre-sports-api.onrender.com/api/v1/nfl/rushing-yards/market?event_id=401872925' \
            -o /tmp/market.json
          python - <<'PY'
          import json
          context = json.load(open('/tmp/context.json'))
          market = json.load(open('/tmp/market.json'))
          assert context['schema_version'] == 'nfl_rushing_yards_context_v1'
          assert context['official_event_id'] == '401872925'
          assert context['semantics']['sportsbook_influence'] == 0.0
          assert market['schema_version'] == 'nfl_rushing_yards_market_v1'
          assert market['official_event_id'] == '401872925'
          assert market['market_semantics']['projection_weight'] == 0.0
          assert market['market_available'] is True
          print('RUSH_WARM_PAGE_PREWARM_GREEN')
          PY

      - name: Start one clean branch-local Streamlit process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rushing-warm/cold artifacts/rushing-warm/warm
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8504 \
            > artifacts/rushing-warm/streamlit.log 2>&1 &
          echo $! > /tmp/rushing_warm_pid

      - name: First page drive on cold module state
        run: |
          python devsystem/nfl_rushing_yards_fast_route_browser_v1.py \
            --base-url http://127.0.0.1:8504 \
            --artifact-dir artifacts/rushing-warm/cold

      - name: Refresh live market cache immediately before warm drive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://kyre-sports-api.onrender.com/api/v1/nfl/rushing-yards/market?event_id=401872925' \
            -o /tmp/market-warm.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/market-warm.json'))
          assert payload['schema_version'] == 'nfl_rushing_yards_market_v1'
          assert payload['official_event_id'] == '401872925'
          assert payload['market_semantics']['projection_weight'] == 0.0
          assert payload['market_available'] is True
          print('RUSH_WARM_PAGE_MARKET_REFRESH_GREEN')
          PY

      - name: Second page drive on same warm Streamlit process
        run: |
          python devsystem/nfl_rushing_yards_fast_route_browser_v1.py \
            --base-url http://127.0.0.1:8504 \
            --artifact-dir artifacts/rushing-warm/warm

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/rushing-warm/streamlit.log || true

      - name: Upload warm-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-rushing-warm-page-${{ github.run_id }}
          path: artifacts/rushing-warm
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rushing_warm_pid ]; then
            kill "$(cat /tmp/rushing_warm_pid)" 2>/dev/null || true
          fi
