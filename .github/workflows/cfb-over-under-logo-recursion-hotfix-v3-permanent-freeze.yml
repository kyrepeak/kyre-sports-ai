name: CFB O/U logo recursion hotfix V3 permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-ou-logo-recursion-hotfix-v3-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-logo-recursion-hotfix-v3-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-logo-recursion-hotfix-v3-permanent-freeze.yml' \
            'cfb_over_under_logo_hotfix_freeze_manifest_v3.json' | sort)"
          test "$actual" = "$expected"
          echo "CFB_OU_LOGO_RECURSION_HOTFIX_V3_FREEZE_SCOPE=PASS"

      - name: Enforce previous hotfix freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_logo_hotfix_freeze_manifest_v2.json") != "9cb574b8171a3dc01c31f9a638777d0b234ed76c":
              failures.append("V2 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v2.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen path changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_V2_FROZEN=PASS")
          PY

      - name: Enforce V3 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v3.json").read_text())
          failures=[]
          if manifest.get("completed_hotfixes") != [1,2,3]:
              failures.append("completed hotfixes changed")
          c=manifest.get("hotfix3_contract") or {}
          if c.get("immutable_step1_hero_capture_active") is not True:
              failures.append("immutable capture disabled")
          if c.get("mutable_step1_hero_symbol_called_from_composite") is not False:
              failures.append("mutable hero symbol contract changed")
          for key in (
              "projection_math_changed","probability_math_changed","selection_math_changed",
              "top5_ranking_math_changed","reliability_changed","sportsbook_input_added",
              "market_probability_input_added","edge_or_ev_added","monte_carlo_added"
          ):
              if c.get(key) is not False:
                  failures.append(f"unexpected model change: {key}")
          if c.get("next_upgrade_step") != 4:
              failures.append("next upgrade step changed")
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing V3 path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"V3 frozen blob changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_RECURSION_HOTFIX_V3_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v42 import render_app' app.py
          python -m py_compile             cfb_over_under_matchup_ui_v3_logo_hotfix_v3.py             streamlit_memory_lazy_router_v42.py
          PYTHONPATH=. python -m pytest -q             tests/test_cfb_over_under_logo_recursion_hotfix_v3.py             tests/test_cfb_over_under_logo_hotfix_v2.py             tests/test_cfb_over_under_upgrade_step3_ui.py

      - name: Freeze marker
        run: echo "CFB_OU_LOGO_RECURSION_HOTFIX_V3_PERMANENT_FREEZE_GREEN"
