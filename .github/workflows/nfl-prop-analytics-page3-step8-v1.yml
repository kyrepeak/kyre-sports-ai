name: NFL Prop Analytics Page 3 Step 8

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_prop_analytics_prop_page_v1.py"
      - "nfl_prop_analytics_page3_final_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page3_step8_final_polish_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page3-step8-final-polish-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step2-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step3-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step4-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step5-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step6-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step7-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step8-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_prop_page_v1.py"
      - "nfl_prop_analytics_page3_final_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page3_step8_final_polish_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page3-step8-final-polish-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step2-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step3-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step4-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step5-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step6-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step7-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step8-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-page3-step8-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Page 3 Step 8 exact scope and frozen stack
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step1-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step2-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step3-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step4-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step5-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step6-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step7-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step8-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page3-step8-final-polish-v1.json' \
            'nfl_prop_analytics_page3_final_polish_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_page3_step8_final_polish_v1.py' | sort)"
          test "$actual" = "$expected" || {
            echo PROP_ANALYTICS_PAGE3_STEP8_SCOPE_VIOLATION
            printf '%s\n' "$actual"
            exit 1
          }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "PROP_ANALYTICS_PAGE3_STEP8_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob nfl_prop_analytics_hub_v1.py 0a604db75dc630a1a75b2d5b43b8b2c9d2ebacfd
          check_blob nfl_prop_analytics_schedule_v1.py 3558f4581c0301c4fc57f8b5e761e1e0cc1eb63c
          check_blob nfl_prop_analytics_game_select_v1.py 1187c13fc5bee03a955d014e87f237ed055a27ef
          check_blob nfl_prop_analytics_matchup_shell_v1.py 0441b2ca34a0206f92f32f5a14a47916067b98a1
          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob nfl_prop_analytics_availability_depth_v1.py cf7fdeee4c18d95c19d2a737f59bda7818e059ae
          check_blob nfl_prop_analytics_player_select_v1.py b9aa4ec194ffea970d6858dcd0e0ed7c31ae0426
          check_blob nfl_prop_analytics_page2_tap_player_v1.py 2cd66941f23582d138f8fe92c2e9b0af25150a3b
          check_blob nfl_prop_analytics_page2_unified_roster_v1.py 9c8e537f58528d3cc3091beebc6fb7244040a073
          check_blob nfl_prop_analytics_history_stats_v1.py c54e686296e6fb8781b482a0375c266ddec9332f
          check_blob nfl_prop_analytics_page3_line_control_v1.py fbeabc240196b30fc966f1a69779c543410e9e3c
          check_blob nfl_prop_analytics_page3_game_chart_v1.py b21876dfe88bed91009e9edf65cb89f472745c8e
          check_blob nfl_prop_analytics_page3_supporting_stats_v1.py 5c0107606bd7a82056176a575629b049067fdd1e
          check_blob nfl_prop_analytics_page3_market_insights_v1.py dd848e1d52e021e44da4ed8530c5de441359bc19
          check_blob nfl_passing_yards_market_api_v2.py f18c9aa9c122d306d1670538e45ebe0caabe5d92
          check_blob nfl_receiving_yards_market_api_v1.py bcd9fcc718b68bf4a6618b1336e6dbc970e81e8e
          check_blob nfl_rushing_yards_market_api_v1.py 0bc9c90251809a0afa0fb67d2f58f9af45950747
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py 2a3922af385cd0fc43bfd540783be15d582aefad
          echo PROP_ANALYTICS_PAGE3_STEP8_SCOPE_GREEN
          echo PROP_ANALYTICS_PAGE3_STEP8_FROZEN_STEPS_1_7_GREEN

      - name: Install static test stack
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Prove Page 3 Steps 1-8 contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile \
            nfl_prop_analytics_history_stats_v1.py \
            nfl_prop_analytics_page3_line_control_v1.py \
            nfl_prop_analytics_page3_game_chart_v1.py \
            nfl_prop_analytics_page3_supporting_stats_v1.py \
            nfl_prop_analytics_page3_market_insights_v1.py \
            nfl_prop_analytics_page3_final_polish_v1.py \
            nfl_prop_analytics_prop_page_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_page3_step1_premium_hero_v1.py \
            tests/test_nfl_prop_analytics_page3_step2_prop_history_nav_v1.py \
            tests/test_nfl_prop_analytics_page3_step3_stats_hit_rate_v1.py \
            tests/test_nfl_prop_analytics_page3_step4_line_control_v1.py \
            tests/test_nfl_prop_analytics_page3_step5_game_chart_v1.py \
            tests/test_nfl_prop_analytics_page3_step6_supporting_stats_v1.py \
            tests/test_nfl_prop_analytics_page3_step7_market_insights_v1.py \
            tests/test_nfl_prop_analytics_page3_step8_final_polish_v1.py
          echo PROP_ANALYTICS_PAGE3_STEP8_STATIC_GREEN

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start branch Streamlit
        run: nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/page3-step8.log 2>&1 &
      - name: Prove final professional polish through complete real flow
        run: |
          python - <<'PY'
          import re,time,requests
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8501"
          end=time.monotonic()+120
          while time.monotonic()<end:
              try:
                  if requests.get(base,timeout=3).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          else: raise RuntimeError("PAGE3_STEP8_LOCAL_NOT_READY")

          def find(page,sel,timeout=300):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(sel)
                          if loc.count(): return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_SELECTOR_NOT_READY:"+sel)

          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role(kind,name=name,exact=True)
                          if loc.count(): return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"PAGE3_STEP8_ROLE_NOT_READY:{kind}:{name}")

          def segmented_heights(page):
              labels={"PASS YDS","PASS TD","INT","COMP","ATT","RUSH","CARRIES","REC","REC YDS","LONG REC","TD","H2H","L5","L10","L20","2026","2025","OVER","UNDER","STATISTICS","SUPPORTING STATS","INSIGHTS","KEY NOTES"}
              heights=[]
              for candidate in page.frames:
                  try:
                      buttons=candidate.locator("button")
                      for i in range(buttons.count()):
                          item=buttons.nth(i)
                          label=(item.inner_text() or "").strip()
                          if label not in labels: continue
                          box=item.bounding_box()
                          if box and box.get("width",0)>0 and box.get("height",0)>0:
                              heights.append(float(box["height"]))
                  except Exception: pass
              return heights

          def choose(page,name,value):
              _,loc=role(page,"combobox",name,120); loc.click(timeout=10000)
              page.keyboard.type(value,delay=15); _,opt=role(page,"option",value,30); opt.click(timeout=10000)

          def segmented(page,name,timeout=90):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator("button").filter(has_text=name)
                          for i in range(loc.count()):
                              if loc.nth(i).inner_text().strip()==name: return frame,loc.nth(i)
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE3_STEP8_SEGMENT_NOT_READY:"+name)

          def wait_step8(page,market=None,history=None,timeout=300):
              end=time.monotonic()+timeout
              last=None
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator('[data-prop-page3-step8-final-polish="v1"]')
                          if loc.count():
                              item=loc.first
                              last={
                                  "state":item.get_attribute("data-prop-page3-step8-state"),
                                  "market":item.get_attribute("data-prop-page3-step8-market"),
                                  "history":item.get_attribute("data-prop-page3-step8-history"),
                                  "player":item.get_attribute("data-prop-page3-step8-player-id"),
                                  "gate":item.get_attribute("data-prop-page3-step8-gate"),
                                  "step7":item.get_attribute("data-prop-page3-step8-step7-state"),
                              }
                              if (last["state"]=="ready"
                                  and (market is None or last["market"]==market)
                                  and (history is None or last["history"]==history)):
                                  return frame,item,last
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_FINAL_MARKER_NOT_READY:"+repr(last))

          def wait_line(page,expected=None,timeout=240):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      loc=frame.locator('[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]')
                      if loc.count():
                          item=loc.first
                          line=item.get_attribute("data-prop-page3-step4-line")
                          if expected is None or line==expected: return frame,item
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_LINE_NOT_READY:"+str(expected))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              context=browser.new_context(viewport={"width":768,"height":1100}); page=context.new_page()
              page.goto(base+"/",wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL"); choose(page,"🎯 NFL Market","Prop Analytics")
              _,handoff=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]',180)
              assert handoff.get_attribute("data-prop-handoff-state")=="ready"
              _,open_matchup=role(page,"button","Open matchup",180); open_matchup.click(timeout=10000)
              frame2,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180)
              assert board.get_attribute("data-prop-page2-unified-state")=="live"
              qb=frame2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first
              assert qb.count()==1; qb.click(timeout=10000)
              _,tap=find(page,'[data-prop-page2-tap-handoff="v1"]',60)
              player_id=tap.get_attribute("data-prop-page2-tap-handoff-player-id")
              assert player_id and player_id.isdigit()
              _,open_prop=role(page,"button","Open prop page",60); open_prop.click(timeout=10000)

              frame,marker,state=wait_step8(page,"passing_yards","L10",300)
              assert state["player"]==player_id,(state,player_id)
              assert marker.get_attribute("data-prop-page3-step8-presentation-only")=="true"
              assert marker.get_attribute("data-prop-page3-step8-frozen-steps-1-7")=="true"
              assert marker.get_attribute("data-prop-page3-step8-min-touch-target")=="44"
              assert marker.get_attribute("data-prop-page3-step8-projection-weight")=="0.0"
              assert marker.get_attribute("data-prop-page3-step8-recommendations")=="0"
              assert marker.get_attribute("data-prop-page3-step8-wager-actions")=="0"

              for sel in (
                  '[data-prop-page3-step1-hero="v1"]',
                  '[data-prop-page3-step2-navigation="v1"]',
                  '[data-prop-page3-step3-stats="v1"][data-prop-page3-step3-state="ready"]',
                  '[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]',
                  '[data-prop-page3-step5-chart="v1"][data-prop-page3-step5-state="ready"]',
                  '[data-prop-page3-step6-supporting-stats="v1"]',
                  '[data-prop-page3-step7-market-insights="v1"]',
              ): find(page,sel,180)

              logos=frame.locator('[data-prop-page3-team-logo]')
              assert logos.count()==2,logos.count()
              end_logo=time.monotonic()+30
              while time.monotonic()<end_logo:
                  if logos.evaluate_all("els=>els.filter(e=>e.complete&&e.naturalWidth>0).length")==2: break
                  page.wait_for_timeout(300)
              else: raise RuntimeError("PAGE3_STEP8_TEAM_LOGOS_NOT_READY")

              line_frame,line=wait_line(page)
              old_line=line.get_attribute("data-prop-page3-step4-line")
              max_line=line.get_attribute("data-prop-page3-step4-max")
              assert old_line and max_line and float(old_line)<float(max_line)
              slider=line_frame.get_by_role("slider").first; assert slider.count()==1
              slider.press("End")
              line_frame,moved=wait_line(page,f"{float(max_line):.1f}",240)
              chart=find(page,f'[data-prop-page3-step5-chart="v1"][data-prop-page3-step5-state="ready"][data-prop-page3-step5-line="{float(max_line):.1f}"]',240)[1]
              assert chart.count()==1
              find(page,'[data-prop-page3-step6-supporting-stats="v1"]',180)
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_LINE_MOVE_GREEN")

              _,att=segmented(page,"ATT",90); att.click(timeout=10000)
              frame,marker,att_state=wait_step8(page,"attempts","L10",300)
              assert att_state["player"]==player_id
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_PROP_NAV_GREEN")

              _,l5=segmented(page,"L5",90); l5.click(timeout=10000)
              frame,marker,l5_state=wait_step8(page,"attempts","L5",300)
              assert l5_state["player"]==player_id
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_HISTORY_NAV_GREEN")

              s7=find(page,'[data-prop-page3-step7-market-insights="v1"]',180)[1]
              shell=find(page,'[data-nfl-prop-analytics-step8-prop-page="v1"]',120)[1]
              gate=shell.get_attribute("data-prop-step8-prop-gate")
              s7state=s7.get_attribute("data-prop-page3-step7-state")
              if gate=="CLOSED": assert s7state=="locked",(gate,s7state)
              else: assert gate=="OPEN" and s7state=="ready",(gate,s7state)
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_STEP7_STATE_GREEN")

              for width in (390,768,1440):
                  page.set_viewport_size({"width":width,"height":1100}); page.wait_for_timeout(450)
                  metrics=frame.evaluate("() => ({inner:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth})")
                  assert max(metrics["doc"],metrics["body"])<=metrics["inner"]+2,(width,metrics)
                  heights=segmented_heights(page)
                  assert heights and min(heights)>=43.5,(width,heights)
                  print(f"PROP_ANALYTICS_PAGE3_STEP8_BRANCH_{width}_GREEN")

              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_TOUCH_TARGET_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_FULL_FLOW_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_BRANCH_GREEN")
              context.close(); browser.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public Page 3 final polish and freeze
        run: |
          python - <<'PY'
          import re,time
          from playwright.sync_api import sync_playwright
          base="https://kyre-sports-ai.streamlit.app"

          def find(page,sel,timeout=300):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(sel)
                          if loc.count(): return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_PUBLIC_SELECTOR_NOT_READY:"+sel)

          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role(kind,name=name,exact=True)
                          if loc.count(): return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"PAGE3_STEP8_PUBLIC_ROLE_NOT_READY:{kind}:{name}")

          def segmented_heights(page):
              labels={"PASS YDS","PASS TD","INT","COMP","ATT","RUSH","CARRIES","REC","REC YDS","LONG REC","TD","H2H","L5","L10","L20","2026","2025","OVER","UNDER","STATISTICS","SUPPORTING STATS","INSIGHTS","KEY NOTES"}
              heights=[]
              for candidate in page.frames:
                  try:
                      buttons=candidate.locator("button")
                      for i in range(buttons.count()):
                          item=buttons.nth(i)
                          label=(item.inner_text() or "").strip()
                          if label not in labels: continue
                          box=item.bounding_box()
                          if box and box.get("width",0)>0 and box.get("height",0)>0:
                              heights.append(float(box["height"]))
                  except Exception: pass
              return heights

          def choose(page,name,value):
              _,loc=role(page,"combobox",name,120); loc.click(timeout=10000)
              page.keyboard.type(value,delay=15); _,opt=role(page,"option",value,30); opt.click(timeout=10000)

          def segmented(page,name,timeout=90):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator("button").filter(has_text=name)
                          for i in range(loc.count()):
                              if loc.nth(i).inner_text().strip()==name: return frame,loc.nth(i)
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE3_STEP8_PUBLIC_SEGMENT_NOT_READY:"+name)

          def wait_step8(page,market=None,history=None,timeout=300):
              end=time.monotonic()+timeout
              last=None
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator('[data-prop-page3-step8-final-polish="v1"]')
                          if loc.count():
                              item=loc.first
                              last={
                                  "state":item.get_attribute("data-prop-page3-step8-state"),
                                  "market":item.get_attribute("data-prop-page3-step8-market"),
                                  "history":item.get_attribute("data-prop-page3-step8-history"),
                                  "player":item.get_attribute("data-prop-page3-step8-player-id"),
                              }
                              if (last["state"]=="ready"
                                  and (market is None or last["market"]==market)
                                  and (history is None or last["history"]==history)):
                                  return frame,item,last
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_PUBLIC_FINAL_MARKER_NOT_READY:"+repr(last))

          def wait_line(page,expected=None,timeout=240):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      loc=frame.locator('[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]')
                      if loc.count():
                          item=loc.first
                          line=item.get_attribute("data-prop-page3-step4-line")
                          if expected is None or line==expected: return frame,item
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_STEP8_PUBLIC_LINE_NOT_READY:"+str(expected))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context=browser.new_context(viewport={"width":768,"height":1100}); page=context.new_page()
              page.goto(base+"/",wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL"); choose(page,"🎯 NFL Market","Prop Analytics")
              _,handoff=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]',180)
              assert handoff.get_attribute("data-prop-handoff-state")=="ready"
              _,open_matchup=role(page,"button","Open matchup",180); open_matchup.click(timeout=10000)
              frame2,board=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180)
              assert board.get_attribute("data-prop-page2-unified-state")=="live"
              qb=frame2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first
              assert qb.count()==1; qb.click(timeout=10000)
              _,tap=find(page,'[data-prop-page2-tap-handoff="v1"]',60)
              player_id=tap.get_attribute("data-prop-page2-tap-handoff-player-id")
              assert player_id and player_id.isdigit()
              _,open_prop=role(page,"button","Open prop page",60); open_prop.click(timeout=10000)

              frame,marker,state=wait_step8(page,"passing_yards","L10",300)
              assert state["player"]==player_id
              assert marker.get_attribute("data-prop-page3-step8-presentation-only")=="true"
              assert marker.get_attribute("data-prop-page3-step8-frozen-steps-1-7")=="true"
              assert marker.get_attribute("data-prop-page3-step8-min-touch-target")=="44"
              assert marker.get_attribute("data-prop-page3-step8-projection-weight")=="0.0"

              line_frame,line=wait_line(page)
              max_line=line.get_attribute("data-prop-page3-step4-max")
              slider=line_frame.get_by_role("slider").first; assert slider.count()==1
              slider.press("End")
              wait_line(page,f"{float(max_line):.1f}",240)
              find(page,f'[data-prop-page3-step5-chart="v1"][data-prop-page3-step5-state="ready"][data-prop-page3-step5-line="{float(max_line):.1f}"]',240)
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_LINE_MOVE_GREEN")

              _,att=segmented(page,"ATT",90); att.click(timeout=10000)
              frame,marker,att_state=wait_step8(page,"attempts","L10",300)
              assert att_state["player"]==player_id
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_PROP_NAV_GREEN")

              _,l5=segmented(page,"L5",90); l5.click(timeout=10000)
              frame,marker,l5_state=wait_step8(page,"attempts","L5",300)
              assert l5_state["player"]==player_id
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_HISTORY_NAV_GREEN")

              s7=find(page,'[data-prop-page3-step7-market-insights="v1"]',180)[1]
              shell=find(page,'[data-nfl-prop-analytics-step8-prop-page="v1"]',120)[1]
              gate=shell.get_attribute("data-prop-step8-prop-gate")
              s7state=s7.get_attribute("data-prop-page3-step7-state")
              if gate=="CLOSED": assert s7state=="locked",(gate,s7state)
              else: assert gate=="OPEN" and s7state=="ready",(gate,s7state)
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_STEP7_STATE_GREEN")

              for width in (390,768,1440):
                  page.set_viewport_size({"width":width,"height":1100}); page.wait_for_timeout(450)
                  metrics=frame.evaluate("() => ({inner:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth})")
                  assert max(metrics["doc"],metrics["body"])<=metrics["inner"]+2,(width,metrics)
                  heights=segmented_heights(page)
                  assert heights and min(heights)>=43.5,(width,heights)
                  print(f"PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_{width}_GREEN")

              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_TOUCH_TARGET_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_FULL_FLOW_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_PUBLIC_GREEN")
              print("PROP_ANALYTICS_PAGE3_STEP8_FROZEN")
              context.close(); browser.close()
          PY
