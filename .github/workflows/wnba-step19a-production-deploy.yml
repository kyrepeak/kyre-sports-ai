name: WNBA Step19A exact-candidate production deploy

on:
  push:
    branches:
      - wnba-step19a-release-control-20260829

permissions:
  contents: read

env:
  CANDIDATE_SHA: e676f4cbfb64dee64bf73f2dbd8034162d69922e
  CERTIFIED_STEP18_SHA: a2e1dc6ec2b6c0c8c5e0bd15cd73b24fa9a56ab2
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_NAME: kyre-sports-api
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com
  STEP19A_IMAGE_REF: ghcr.io/kyrepeak/kyre-sports-api@sha256:fabf80bd6a2439a77d1b80779b0f7a261ed753551865542b3b77af51a01af93a
  RELEASE_ID: wnba-step19a-e676f4cb

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: wnba-render-staging
    steps:
      - name: Checkout release-control workflow
        uses: actions/checkout@v4

      - name: Checkout exact certified Step19A application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 500

      - name: Prove exact candidate and frozen-source integrity
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          BASE='70aa357df98ef8ce931a249677484fd205f25467'
          git diff --exit-code "$BASE"..HEAD -- \
            sports_api/wnba_step11_draftkings_provider.py \
            sports_api/wnba_step11_fanduel_provider.py \
            sports_api/wnba_step11_multibook_shadow_board.py \
            sports_api/wnba_step11_controlled_automation.py \
            sports_api/wnba_step17b_always_on_runtime.py \
            sports_api/wnba_step6d_direct_integration.py \
            sports_api/wnba_reconciled_direct_sync.py
          echo STEP19A_EXACT_CANDIDATE_AND_FROZEN_SOURCES_OK

      - name: Verify immutable Step19A publication record from prior guarded run
        run: |
          set -euo pipefail
          test "$STEP19A_IMAGE_REF" = 'ghcr.io/kyrepeak/kyre-sports-api@sha256:fabf80bd6a2439a77d1b80779b0f7a261ed753551865542b3b77af51a01af93a'
          echo STEP19A_IMMUTABLE_IMAGE_PIN_OK "$STEP19A_IMAGE_REF"

      - name: Stage certified Step18 baseline then deploy exact Step19A with automatic rollback
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$KYRE_DATABASE_URL"
          python - <<'PY'
          import json, os, re, time, urllib.request

          base='https://api.render.com/v1'
          sid=os.environ['RENDER_SERVICE_ID']
          step18=os.environ['CERTIFIED_STEP18_SHA'].lower()
          candidate=os.environ['CANDIDATE_SHA'].lower()
          public_url=os.environ['RENDER_SERVICE_URL'].rstrip('/')
          headers={
              'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json',
              'Content-Type':'application/json',
              'User-Agent':'kyre-step19a-staged-deploy/2',
          }

          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode()
                  return json.loads(raw) if raw else None

          def contains_sha(value,sha):
              if isinstance(value,str):
                  return value.strip().lower()==sha
              if isinstance(value,dict):
                  return any(contains_sha(v,sha) for v in value.values())
              if isinstance(value,list):
                  return any(contains_sha(v,sha) for v in value)
              return False

          def observed_shas(value):
              text=json.dumps(value,sort_keys=True)
              return sorted(set(re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',text.lower())))

          def current_health():
              with urllib.request.urlopen(public_url+'/health',timeout=45) as h:
                  doc=json.loads(h.read().decode())
              if doc.get('status')!='ok':
                  raise RuntimeError(f'production health is not ok: {doc!r}')
              return doc

          def wait_deploy(deploy_id,expected_sha,label):
              terminal_bad={'build_failed','update_failed','canceled','cancelled','deactivated'}
              detail={}
              status=''
              for _ in range(180):
                  detail=req('GET',f'/services/{sid}/deploys/{deploy_id}') or {}
                  status=str(detail.get('status','')).lower()
                  if status=='live':
                      break
                  if status in terminal_bad:
                      raise RuntimeError(f'{label} Render deploy failed closed: {status}')
                  time.sleep(5)
              if status!='live':
                  raise RuntimeError(f'{label} Render deploy did not become live: {status}')
              if not contains_sha(detail,expected_sha):
                  raise RuntimeError(f'{label} live deploy did not attest exact SHA {expected_sha}')
              current_health()
              return detail

          def deploy_commit(sha,label):
              d=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}
              did=d.get('id')
              if not did:
                  raise RuntimeError(f'{label} deploy did not return an ID')
              wait_deploy(str(did),sha,label)
              return str(did)

          def rollback_to(deploy_id,label):
              out=req('POST',f'/services/{sid}/rollback',{'deployId':deploy_id}) or {}
              rid=out.get('id') if isinstance(out,dict) else None
              print(label,'ROLLBACK_REQUESTED',deploy_id,'rollback_deploy',rid or 'not_returned')
              if rid:
                  # A rollback deploy represents the captured revision; require only
                  # that it becomes live, because Render may omit source metadata.
                  terminal_bad={'build_failed','update_failed','canceled','cancelled','deactivated'}
                  status=''
                  for _ in range(120):
                      detail=req('GET',f'/services/{sid}/deploys/{rid}') or {}
                      status=str(detail.get('status','')).lower()
                      if status=='live': break
                      if status in terminal_bad: break
                      time.sleep(5)
              current_health()

          svc=req('GET',f'/services/{sid}')
          details=svc.get('serviceDetails') if isinstance(svc.get('serviceDetails'),dict) else {}
          observed={
              'id':str(svc.get('id') or ''),
              'name':str(svc.get('name') or ''),
              'type':str(svc.get('type') or '').lower(),
              'runtime':str(details.get('runtime') or details.get('env') or '').lower(),
              'repo':str(svc.get('repo') or '').rstrip('/'),
              'url':str(details.get('url') or svc.get('url') or '').rstrip('/'),
          }
          expected={
              'id':sid,
              'name':os.environ['RENDER_SERVICE_NAME'],
              'type':'web_service',
              'runtime':'docker',
              'repo':'https://github.com/kyrepeak/kyre-sports-ai',
              'url':public_url,
          }
          if observed != expected:
              raise SystemExit(f'Render service identity drift: {observed!r}')

          current_health()
          rows_doc=req('GET',f'/services/{sid}/deploys?limit=20')
          rows=rows_doc if isinstance(rows_doc,list) else (rows_doc.get('items') or rows_doc.get('data') or [])
          current_live_id=None
          for row in rows:
              d=row.get('deploy') if isinstance(row,dict) and isinstance(row.get('deploy'),dict) else row
              if isinstance(d,dict) and str(d.get('status','')).lower()=='live' and d.get('id'):
                  current_live_id=str(d['id'])
                  break
          if not current_live_id:
              raise SystemExit('No currently-live Render deploy found; refusing production mutation')
          current_detail=req('GET',f'/services/{sid}/deploys/{current_live_id}') or {}
          current_shas=observed_shas(current_detail)
          print('STEP19A_CURRENT_PRODUCTION_CAPTURED',current_live_id,current_shas)

          preflight={
              'service':observed,
              'current_live_deploy_id':current_live_id,
              'current_live_revision_candidates':current_shas,
              'current_health_status':'ok',
              'certified_step18_sha':step18,
              'candidate_sha':candidate,
              'mutation_performed':False,
          }
          open('step19a-render-preflight.json','w',encoding='utf-8').write(json.dumps(preflight,indent=2,sort_keys=True)+'\n')

          legacy_rollback_id=current_live_id
          step18_deploy_id=None
          candidate_deploy_id=None

          # Freeze automatic deploys before any controlled release operation.
          req('PATCH',f'/services/{sid}',{'autoDeploy':'no'})

          safe_base_env={
              'KYRE_DATABASE_URL':os.environ['KYRE_DATABASE_URL'],
              'WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED':'false',
              'WNBA_PRODUCTION_RUNTIME_ENABLED':'false',
              'WNBA_BOARD_SCHEDULER_ENABLED':'false',
              'WNBA_STEP12_SCHEDULER_ENABLED':'false',
              'WNBA_KYRE_DIRECT_SYNC_ENABLED':'false',
              'WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false',
              'WNBA_STEP6J_CANARY_ENABLED':'false',
              'WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED':'false',
              'WNBA_PERSISTENCE_ENABLED':'false',
              'WNBA_SUPABASE_WRITE_ENABLED':'false',
              'WNBA_WAGERING_ENABLED':'false',
              'WNBA_STEP17A_HOST_CONTRACT_ENABLED':'false',
          }
          for key,value in safe_base_env.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})

          # Hop 1: if production is not already Step18, make certified Step18 live
          # first. This creates the exact rollback target for Step19A.
          if contains_sha(current_detail,step18):
              step18_deploy_id=current_live_id
              print('STEP19A_STEP18_BASELINE_ALREADY_LIVE',step18_deploy_id,step18)
          else:
              try:
                  req('PUT',f'/services/{sid}/env-vars/WNBA_DEPLOYMENT_REVISION',{'value':step18})
                  req('PUT',f'/services/{sid}/env-vars/WNBA_RELEASE_ID',{'value':'wnba-step18-certified-baseline'})
                  step18_deploy_id=deploy_commit(step18,'STEP18_BASELINE')
                  print('STEP19A_STEP18_BASELINE_LIVE_OK',step18_deploy_id,step18)
              except Exception:
                  rollback_to(legacy_rollback_id,'STEP18_BASELINE')
                  raise

          # Hop 2: exact Step19A candidate. Read-only provider/market feature gates
          # are enabled, while every production scheduler/sync/write/wager gate stays OFF.
          candidate_env={
              'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true',
              'WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz',
              'WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true',
              'WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true',
              'WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true',
              'WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED':'true',
              'WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED':'true',
              'WNBA_STEP10_FASTAPI_ENABLED':'true',
              'WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true',
              'WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true',
              'WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true',
              'WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true',
              'WNBA_STEP9_FASTAPI_ENABLED':'true',
              'WNBA_STEP9_THRESHOLD_PRICING_ENABLED':'true',
              'WNBA_STEP9B_MARKET_COMPARISON_ENABLED':'true',
              'WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED':'true',
              'WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED':'true',
              'WNBA_DEPLOYMENT_REVISION':candidate,
              'WNBA_RELEASE_ID':os.environ['RELEASE_ID'],
          }
          for key,value in candidate_env.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})

          try:
              candidate_deploy_id=deploy_commit(candidate,'STEP19A_CANDIDATE')
          except Exception:
              rollback_to(step18_deploy_id,'STEP19A_CANDIDATE')
              raise

          evidence={
              'step':'19A-production-deploy',
              'status':'live',
              'service_id':sid,
              'service_name':os.environ['RENDER_SERVICE_NAME'],
              'service_url':public_url,
              'candidate_deploy_id':candidate_deploy_id,
              'candidate_sha':candidate,
              'immutable_reference_image_ref':os.environ['STEP19A_IMAGE_REF'],
              'step18_rollback_deploy_id':step18_deploy_id,
              'step18_rollback_revision':step18,
              'legacy_pre_step18_deploy_id':legacy_rollback_id,
              'rollback_ready':True,
              'health_status':'ok',
              'auto_deploy_enabled':False,
              'production_runtime_enabled':False,
              'board_scheduler_enabled':False,
              'direct_sync_enabled':False,
              'reconciled_sync_enabled':False,
              'persistence_write_enabled':False,
              'supabase_write_enabled':False,
              'wagering_enabled':False,
              'database_secret_configured':True,
              'database_secret_exposed':False,
              'new_render_service_created':False,
          }
          open('step19a-render-deploy-evidence.json','w',encoding='utf-8').write(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('STEP19A_RENDER_DEPLOY_LIVE_OK',candidate_deploy_id,candidate,'ROLLBACK',step18_deploy_id,step18)
          PY

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step19a-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            step19a-render-preflight.json
            step19a-render-deploy-evidence.json
          if-no-files-found: warn
          retention-days: 90
