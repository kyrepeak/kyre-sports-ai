name: WNBA Step19A release-control diagnostic

on:
  push:
    branches:
      - wnba-step19a-release-control-20260829

permissions:
  contents: read
  packages: read

env:
  CANDIDATE_SHA: e676f4cbfb64dee64bf73f2dbd8034162d69922e
  CERTIFIED_STEP18_SHA: a2e1dc6ec2b6c0c8c5e0bd15cd73b24fa9a56ab2
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com
  STEP19A_IMAGE_REF: ghcr.io/kyrepeak/kyre-sports-api@sha256:fabf80bd6a2439a77d1b80779b0f7a261ed753551865542b3b77af51a01af93a
  RELEASE_ID: wnba-step19a-e676f4cb

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: wnba-render-staging
    steps:
      - name: Confirm exact immutable candidate
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = 'e676f4cbfb64dee64bf73f2dbd8034162d69922e'
          test "$STEP19A_IMAGE_REF" = 'ghcr.io/kyrepeak/kyre-sports-api@sha256:fabf80bd6a2439a77d1b80779b0f7a261ed753551865542b3b77af51a01af93a'
          echo STEP19A_DIAGNOSTIC_EXACT_CANDIDATE_OK

      - name: Read current Render state and prepare sanitized runtime env
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$KYRE_DATABASE_URL"
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          base='https://api.render.com/v1'
          sid=os.environ['RENDER_SERVICE_ID']
          candidate=os.environ['CANDIDATE_SHA'].lower()
          step18=os.environ['CERTIFIED_STEP18_SHA'].lower()
          headers={
              'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json',
              'User-Agent':'kyre-step19a-readonly-diagnostic/1',
          }

          def get(path):
              r=urllib.request.Request(base+path,headers=headers,method='GET')
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode()
                  return json.loads(raw) if raw else None

          def deploy_obj(row):
              if isinstance(row,dict) and isinstance(row.get('deploy'),dict):
                  return row['deploy']
              return row if isinstance(row,dict) else {}

          def commit_id(d):
              for key in ('commitId','commit_id'):
                  value=d.get(key)
                  if isinstance(value,str) and len(value)==40:
                      return value.lower()
              c=d.get('commit')
              if isinstance(c,dict):
                  value=c.get('id') or c.get('sha')
                  if isinstance(value,str) and len(value)==40:
                      return value.lower()
              text=json.dumps(d,sort_keys=True).lower()
              hits=re.findall(r'(?<![0-9a-f])[0-9a-f]{40}(?![0-9a-f])',text)
              return hits[0] if hits else None

          def safe_deploy(d):
              return {
                  'id':d.get('id'),
                  'status':d.get('status'),
                  'commit_id':commit_id(d),
                  'created_at':d.get('createdAt') or d.get('created_at'),
                  'updated_at':d.get('updatedAt') or d.get('updated_at'),
                  'finished_at':d.get('finishedAt') or d.get('finished_at'),
                  'trigger':d.get('trigger'),
              }

          svc=get(f'/services/{sid}') or {}
          rows_doc=get(f'/services/{sid}/deploys?limit=50')
          rows=rows_doc if isinstance(rows_doc,list) else ((rows_doc or {}).get('items') or (rows_doc or {}).get('data') or [])
          deploys=[safe_deploy(deploy_obj(r)) for r in rows if deploy_obj(r)]
          live=next((d for d in deploys if str(d.get('status','')).lower()=='live'),None)
          candidate_rows=[d for d in deploys if d.get('commit_id')==candidate]
          step18_rows=[d for d in deploys if d.get('commit_id')==step18]

          events_doc=get(f'/services/{sid}/events?limit=50')
          erows=events_doc if isinstance(events_doc,list) else ((events_doc or {}).get('items') or (events_doc or {}).get('data') or [])
          events=[]
          for row in erows[:50]:
              e=row.get('event') if isinstance(row,dict) and isinstance(row.get('event'),dict) else row
              if not isinstance(e,dict):
                  continue
              events.append({
                  'id':e.get('id'),
                  'type':e.get('type'),
                  'timestamp':e.get('timestamp') or e.get('createdAt') or e.get('created_at'),
                  'deploy_id':e.get('deployId') or e.get('deploy_id'),
              })

          with urllib.request.urlopen(os.environ['RENDER_SERVICE_URL'].rstrip('/')+'/health',timeout=45) as h:
              health=json.loads(h.read().decode())

          evidence={
              'mutation_performed':False,
              'service_id':sid,
              'service_name':svc.get('name'),
              'repo':svc.get('repo'),
              'branch':svc.get('branch'),
              'auto_deploy':svc.get('autoDeploy'),
              'current_live':live,
              'candidate_deploys':candidate_rows,
              'step18_deploys':step18_rows,
              'recent_deploys':deploys[:12],
              'recent_events':events[:20],
              'health_status':health.get('status'),
          }
          Path('step19a-render-diagnostic.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('STEP19A_RENDER_READONLY_STATE',json.dumps({
              'current_live':live,
              'candidate_deploys':candidate_rows,
              'step18_deploys':step18_rows[:3],
              'health_status':health.get('status'),
              'auto_deploy':svc.get('autoDeploy'),
              'branch':svc.get('branch'),
          },sort_keys=True))

          env_doc=get(f'/services/{sid}/env-vars?limit=100')
          env_rows=env_doc if isinstance(env_doc,list) else ((env_doc or {}).get('items') or (env_doc or {}).get('data') or [])
          values={}
          for row in env_rows:
              item=row.get('envVar') if isinstance(row,dict) and isinstance(row.get('envVar'),dict) else row
              if not isinstance(item,dict):
                  continue
              k=item.get('key')
              v=item.get('value')
              if isinstance(k,str) and v is not None:
                  values[k]=str(v)

          values['KYRE_DATABASE_URL']=os.environ['KYRE_DATABASE_URL']
          safe_off={
              'WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED':'false',
              'WNBA_PRODUCTION_RUNTIME_ENABLED':'false',
              'WNBA_BOARD_SCHEDULER_ENABLED':'false',
              'WNBA_STEP12_SCHEDULER_ENABLED':'false',
              'WNBA_KYRE_DIRECT_SYNC_ENABLED':'false',
              'WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false',
              'WNBA_STEP6J_CANARY_ENABLED':'false',
              'WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED':'false',
              'WNBA_PERSISTENCE_ENABLED':'false',
              'WNBA_SUPABASE_WRITE_ENABLED':'false',
              'WNBA_WAGERING_ENABLED':'false',
              'WNBA_STEP17A_HOST_CONTRACT_ENABLED':'false',
          }
          candidate_on={
              'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true',
              'WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz',
              'WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true',
              'WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true',
              'WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true',
              'WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED':'true',
              'WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED':'true',
              'WNBA_STEP10_FASTAPI_ENABLED':'true',
              'WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true',
              'WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true',
              'WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true',
              'WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true',
              'WNBA_STEP9_FASTAPI_ENABLED':'true',
              'WNBA_STEP9_THRESHOLD_PRICING_ENABLED':'true',
              'WNBA_STEP9B_MARKET_COMPARISON_ENABLED':'true',
              'WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED':'true',
              'WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED':'true',
              'WNBA_DEPLOYMENT_REVISION':candidate,
              'WNBA_RELEASE_ID':os.environ['RELEASE_ID'],
          }
          values.update(safe_off)
          values.update(candidate_on)
          for k,v in values.items():
              if '\n' in k or '\n' in v or '\r' in v:
                  raise SystemExit(f'unsafe newline in Render env entry {k!r}')
          Path('/tmp/step19a-render.env').write_text(''.join(f'{k}={v}\n' for k,v in sorted(values.items())),encoding='utf-8')
          Path('/tmp/step19a-redactions.json').write_text(json.dumps(sorted({v for k,v in values.items() if any(x in k.upper() for x in ('SECRET','TOKEN','KEY','PASSWORD','DATABASE_URL')) and len(v)>=4})),encoding='utf-8')
          print('STEP19A_RUNTIME_ENV_PREPARED',len(values),'variables; values not printed')
          PY

      - name: Pull and boot exact Step19A image without touching Render
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$STEP19A_IMAGE_REF" >/dev/null
          docker run -d --name step19a-local-smoke --env-file /tmp/step19a-render.env -p 18000:8000 "$STEP19A_IMAGE_REF" >/tmp/step19a-container-id
          ok=false
          for i in $(seq 1 36); do
            if curl -fsS --max-time 5 http://127.0.0.1:18000/health >/tmp/step19a-health.json 2>/dev/null; then
              ok=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' step19a-local-smoke 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            docker logs step19a-local-smoke >/tmp/step19a-raw.log 2>&1 || true
            python - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/step19a-raw.log').read_text(encoding='utf-8',errors='replace')[-20000:]
          for value in json.loads(Path('/tmp/step19a-redactions.json').read_text(encoding='utf-8')):
              text=text.replace(value,'***REDACTED***')
          print('STEP19A_LOCAL_IMAGE_BOOT_FAILED')
          print(text)
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/step19a-health.json',encoding='utf-8'))
          if d.get('status')!='ok':
              raise SystemExit(f'local candidate health not ok: {d!r}')
          print('STEP19A_LOCAL_IMMUTABLE_IMAGE_HEALTH_OK')
          PY

      - name: Clean local diagnostic container
        if: always()
        run: docker rm -f step19a-local-smoke >/dev/null 2>&1 || true

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step19a-readonly-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: step19a-render-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
