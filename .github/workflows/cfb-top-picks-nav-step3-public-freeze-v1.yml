name: CFB Top Picks Nav Step 3 Public Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-nav-step3-public-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public proof stack
        run: |
          python -m pip install --disable-pip-version-check -q pytest requests playwright
          python -m playwright install --with-deps chromium
      - name: Static Step 3 contract
        run: |
          python -m py_compile devsystem/cfb_top_picks_nav_step3_public_cert_v1.py
          python -m pytest -q tests/test_cfb_top_picks_nav_step3_public_v1.py
      - name: Certify public normal navigation and freeze
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/cfb_top_picks_nav_step3_public_cert_v1.py \
            --base-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/cfb-top-picks-nav-step3-public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-top-picks-nav-step3-public-${{ github.run_id }}
          path: artifacts/cfb-top-picks-nav-step3-public
          if-no-files-found: warn
          retention-days: 14
