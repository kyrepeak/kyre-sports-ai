name: TEMP Passing Step 5 V124 Compatibility

on:
  push:
    branches: [nfl-passing-yards-visual-parity-step5-analytics]
    paths:
      - ".github/workflows/tmp-passing-step5-v124-compat.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-passing-yards-visual-parity-step5-analytics
          fetch-depth: 0

      - name: Restore V124 compatibility literal while preserving V125 runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          runtime = (
              '    _bootstrap_started = perf_counter()\n'
              '    from streamlit_memory_lazy_router_v125 import record_bootstrap_import_ms, render_app\n'
          )
          if runtime not in text:
              raise SystemExit('APP_V125_RUNTIME_NOT_ACTIVE')

          target = '    from streamlit_memory_lazy_router_v124 import record_bootstrap_import_ms, render_app\n'
          if target in text:
              raise SystemExit('APP_V124_COMPAT_ALREADY_PRESENT')

          anchor = (
              '    from streamlit_memory_lazy_router_v122 import record_bootstrap_import_ms, render_app\n'
              '    from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app\n'
          )
          if anchor not in text:
              raise SystemExit('APP_TYPE_CHECKING_V122_V123_ANCHOR_MISSING')

          text = text.replace(anchor, anchor + target, 1)

          if runtime not in text:
              raise SystemExit('APP_V125_RUNTIME_CHANGED_UNEXPECTEDLY')
          if text.count(target) != 1:
              raise SystemExit(f'APP_V124_COMPAT_COUNT_BAD={text.count(target)}')

          path.write_text(text, encoding='utf-8')
          print('PASSING_STEP5_V124_DESCENDANT_COMPAT_GREEN')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "Preserve Passing V124 descendant cert compatibility"
          git push origin HEAD:nfl-passing-yards-visual-parity-step5-analytics
