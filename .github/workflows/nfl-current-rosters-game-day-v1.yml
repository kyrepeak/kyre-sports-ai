name: NFL Current Rosters Game Day V1

on:
  pull_request:
    paths:
      - "nfl_game_day_availability_v1.py"
      - "nfl_passing_yards_identity_v1.py"
      - "tests/test_nfl_game_day_roster_availability_v1.py"
      - "devsystem/nfl_current_rosters_game_day_v1.py"
      - ".github/workflows/nfl-current-rosters-game-day-v1.yml"

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests
      - name: Run game-day availability unit proof
        run: python -m pytest -q tests/test_nfl_game_day_roster_availability_v1.py
      - name: Run live 32-team roster + Atlanta QB proof
        run: python devsystem/nfl_current_rosters_game_day_v1.py
