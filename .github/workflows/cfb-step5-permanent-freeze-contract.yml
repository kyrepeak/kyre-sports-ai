name: College Football Step 5 permanent freeze contract

on:
  workflow_dispatch:
  push:
    branches: ['cfb-step5-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 5 freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step5-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step5-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v5.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 5 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP5_FREEZE_SCOPE=PASS"

      - name: Enforce immutable prior CFB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifests = {
              "cfb_freeze_manifest_v1.json": "3a7797ca8eb516b0457ebd7d3b2eb007e99ab087",
              "cfb_freeze_manifest_v2.json": "1b4eb71f6f17dcae873bcfd7ac4091bd2fa1498f",
              "cfb_freeze_manifest_v3.json": "127bfbd1aa1e8d9c439e88846c49fadbfb0dbb5a",
              "cfb_freeze_manifest_v4.json": "f8b009c849a1f5180f09cb60f82ea62862c584c8",
          }

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path, expected in expected_manifests.items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  actual = None
              if actual != expected:
                  failures.append(
                      f"{path} changed or missing expected={expected} actual={actual}"
                  )

          for path, expected_steps in (
              ("cfb_freeze_manifest_v1.json", [1]),
              ("cfb_freeze_manifest_v2.json", [1, 2]),
              ("cfb_freeze_manifest_v3.json", [1, 2, 3]),
              ("cfb_freeze_manifest_v4.json", [1, 2, 3, 4]),
          ):
              try:
                  data = json.loads(pathlib.Path(path).read_text())
              except Exception as exc:
                  failures.append(f"cannot read {path}: {exc}")
                  continue
              if data.get("completed_steps") != expected_steps:
                  failures.append(f"{path} completed_steps mismatch")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_PRIOR_FREEZE_MANIFESTS_V1_V4=PASS")
          PY

      - name: Enforce College Football Steps 1 through 5 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v5.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 5:
              failures.append("freeze manifest version mismatch")
          if m.get("completed_steps") != [1, 2, 3, 4, 5]:
              failures.append("completed_steps mismatch")
          if m.get("step5_merge_commit") != "f444ad1951460fe010a4fe21cb9ec8a33f6cf37f":
              failures.append("Step 5 merge commit mismatch")

          required = {
              "cfb_hub_v1.py",
              "streamlit_memory_lazy_router_v23.py",
              "cfb_schedule_v1.py",
              "cfb_hub_v2.py",
              "streamlit_memory_lazy_router_v24.py",
              "cfb_team_data_v1.py",
              "cfb_hub_v3.py",
              "streamlit_memory_lazy_router_v25.py",
              "cfb_moneyline_hub_v1.py",
              "streamlit_memory_lazy_router_v26.py",
              "cfb_moneyline_model_v1.py",
              "cfb_moneyline_hub_v2.py",
              "streamlit_memory_lazy_router_v27.py",
          }
          if set(m.get("exact_blobs", {})) != required:
              failures.append("Step 5 exact frozen path set mismatch")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP5_EXACT_FREEZE=PASS")
          PY

      - name: Re-enforce protected MLB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP5_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen College Football Steps 1 through 5
        run: |
          python -m py_compile \
            cfb_hub_v1.py \
            streamlit_memory_lazy_router_v23.py \
            cfb_schedule_v1.py \
            cfb_hub_v2.py \
            streamlit_memory_lazy_router_v24.py \
            cfb_team_data_v1.py \
            cfb_hub_v3.py \
            streamlit_memory_lazy_router_v25.py \
            cfb_moneyline_hub_v1.py \
            streamlit_memory_lazy_router_v26.py \
            cfb_moneyline_model_v1.py \
            cfb_moneyline_hub_v2.py \
            streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py

      - name: Run frozen College Football contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Lock Step 5 raw-model contract
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_moneyline_model_v1 as m

          assert m.HOME_FIELD_POINTS == 2.5
          assert m.MARGIN_LOGISTIC_SCALE == 10.5
          assert m.SAMPLE_GAMES_FULL_WEIGHT == 5

          def profile(team):
              return {
                  "team": team,
                  "record": {"games": 5},
                  "record_text": "5-0",
                  "ppg": 30.0,
                  "points_allowed_pg": 20.0,
                  "recent_ppg": 30.0,
                  "recent_points_allowed_pg": 20.0,
                  "sos_opponent_win_pct": .50,
                  "sos_coverage": 1.0,
                  "data_quality": {"grade": "READY"},
                  "official_stats": {
                      "scoring_offense": {"value_numeric": 30.0},
                      "scoring_defense": {"value_numeric": 20.0},
                      "total_offense": {"value_numeric": 400.0},
                      "total_defense": {"value_numeric": 400.0},
                      "turnover_margin": {"value_numeric": 0.0},
                  },
              }

          game = {
              "identity_verified": True,
              "date_matches_query": True,
              "neutral_site": True,
              "away_team": "Away",
              "home_team": "Home",
          }
          out = m.project_matchup(game, profile("Away"), profile("Home"))

          assert out["ready"] is True
          assert abs(out["home_win_probability_raw"] - 0.5) < 1e-12
          assert abs(out["away_win_probability_raw"] - 0.5) < 1e-12
          assert out["sportsbook_input_used"] is False
          assert out["monte_carlo_used"] is False
          assert out["fair_moneyline_ready"] is False
          assert out["final_pick_ready"] is False
          assert out["components"]["away_qb_adjustment_points"] == 0.0
          assert out["components"]["home_qb_adjustment_points"] == 0.0
          assert out["components"]["away_qb_state"] == "UNVERIFIED • ZERO IMPACT"
          assert out["components"]["home_qb_state"] == "UNVERIFIED • ZERO IMPACT"

          print("CFB_STEP5_RAW_MODEL_CONTRACT_FROZEN=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP5_PERMANENT_FREEZE_GREEN"
