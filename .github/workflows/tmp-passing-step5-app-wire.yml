name: TEMP Passing Step 5 App Wire

on:
  push:
    branches: [nfl-passing-yards-visual-parity-step5-analytics]
    paths:
      - ".github/workflows/tmp-passing-step5-app-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-passing-yards-visual-parity-step5-analytics
          fetch-depth: 0

      - name: Guard and wire V125
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('app.py')
          text=path.read_text(encoding='utf-8')

          frozen_v123='    from streamlit_memory_lazy_router_v123 import render_app as _frozen_v123_render_app\n'
          frozen_v124='    from streamlit_memory_lazy_router_v124 import render_app as _frozen_v124_render_app\n'
          if frozen_v123 not in text:
              raise SystemExit('APP_FROZEN_V123_ANCHOR_MISSING')
          if frozen_v124 not in text:
              text=text.replace(frozen_v123, frozen_v123+frozen_v124, 1)

          compat_v123='    from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app\n'
          compat_v124='    from streamlit_memory_lazy_router_v124 import record_bootstrap_import_ms, render_app\n'
          if compat_v123 not in text:
              raise SystemExit('APP_COMPAT_V123_ANCHOR_MISSING')
          if compat_v124 not in text:
              text=text.replace(compat_v123, compat_v123+compat_v124, 1)

          old_heart=(
              'FROZEN_V123_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13"\n'
              'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V124_NFL_PASSING_YARDS_VISUAL_PARITY_STEP4_CONTEXT_CARDS_2026-09-13"'
          )
          new_heart=(
              'FROZEN_V123_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13"\n'
              'FROZEN_V124_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V124_NFL_PASSING_YARDS_VISUAL_PARITY_STEP4_CONTEXT_CARDS_2026-09-13"\n'
              'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V125_NFL_PASSING_YARDS_VISUAL_PARITY_STEP5_ANALYTICAL_READOUTS_2026-09-13"'
          )
          if old_heart not in text:
              raise SystemExit('APP_V124_HEARTBEAT_ANCHOR_MISSING')
          text=text.replace(old_heart,new_heart,1)

          old_runtime=(
              '    _bootstrap_started = perf_counter()\n'
              '    from streamlit_memory_lazy_router_v124 import record_bootstrap_import_ms, render_app\n'
          )
          new_runtime=(
              '    _bootstrap_started = perf_counter()\n'
              '    from streamlit_memory_lazy_router_v125 import record_bootstrap_import_ms, render_app\n'
          )
          if old_runtime not in text:
              raise SystemExit('APP_V124_RUNTIME_ANCHOR_MISSING')
          text=text.replace(old_runtime,new_runtime,1)

          text=text.replace(
              'Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 4.',
              'Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 5.',
              1,
          )
          path.write_text(text,encoding='utf-8')
          print('PASSING_STEP5_APP_WIRE_GREEN')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "Activate Passing visual Step 5 Router V125"
          git push origin HEAD:nfl-passing-yards-visual-parity-step5-analytics
