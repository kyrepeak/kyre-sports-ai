name: College Football Step 1 section-router certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/cfb-step1-section-router-foundation']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 1 implementation scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step1-section-router-foundation'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step1-section-router.yml' \
            '.github/workflows/mlb-hits-router-v22-root-route.yml' \
            'app.py' \
            'cfb_hub_v1.py' \
            'streamlit_memory_lazy_router_v23.py' \
            'tests/test_cfb_step1_hub_foundation.py' \
            'tests/test_streamlit_memory_lazy_router_v23.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 1 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP1_SCOPE=PASS"

      - name: Enforce frozen MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP1_EXISTING_FROZEN_CONTRACTS=PASS")
          PY

      - name: Compile College Football Step 1
        run: |
          python -m py_compile \
            app.py \
            cfb_hub_v1.py \
            streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py
          PYTHONPATH=. python -c "import cfb_hub_v1; import streamlit_memory_lazy_router_v23"

      - name: Run College Football Step 1 regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove current bootstrap and isolated CFB route
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v23.py").read_text(encoding="utf-8")
          hub = Path("cfb_hub_v1.py").read_text(encoding="utf-8")

          if "streamlit_memory_lazy_router_v23" not in app:
              raise SystemExit("app.py is not booting Router V23")
          if 'CFB_SPORT_LABEL = "College Football"' not in router:
              raise SystemExit("College Football sport route missing")
          if '["Moneyline", "Over/Under", "Game Total"]' not in hub.replace("\n", " "):
              # Exact logical list is also asserted in pytest; this keeps a lightweight source marker.
              if '"Moneyline"' not in hub or '"Over/Under"' not in hub or '"Game Total"' not in hub:
                  raise SystemExit("College Football Step 1 page set incomplete")
          if 'return _ORIGINAL_RENDER_NFL(market)' not in router:
              raise SystemExit("Frozen NFL delegation missing")
          if 'prior.render_app()' not in router:
              raise SystemExit("Frozen Router V22 delegation missing")

          print("CFB_STEP1_ROUTER_ISOLATION=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP1_SECTION_ROUTER_GREEN"
