name: CFB O/U Upgrade Step 8 turnover permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: [cfb-ou-upgrade-step8-turnover-permanent-freeze]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact permanent-freeze scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess, sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-upgrade-step8-turnover-permanent-freeze.yml",
              "cfb_over_under_upgrade_freeze_manifest_v8.json",
          }
          if actual != expected:
              print("expected",sorted(expected))
              print("actual",sorted(actual))
              sys.exit(1)
          print("CFB_OU_STEP8_PERMANENT_FREEZE_SCOPE=PASS")
          PY

      - name: Enforce previous Upgrade Step 7 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v7.json") != "1c17321eeca073b3022b0c82c3e4ec10bc9727ae":
              failures.append("Upgrade Step 7 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v7.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 1-7 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 1-7 frozen path changed: {path}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_7_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Enforce Step 8 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v8.json").read_text())
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v8.json") != "08e48fca0137c396da39b3be159ab68390f7739d":
              failures.append("Step 8 freeze manifest blob changed")
          if manifest.get("version") != 8:
              failures.append("Step 8 freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1,2,3,4,5,6,7,8]:
              failures.append("completed upgrade-step list changed")
          if manifest.get("baseline_commit") != "83d3d2d917440b7eab8aeb64e8dc22905d6b8c55":
              failures.append("Step 8 baseline commit changed")
          c=manifest.get("step8_contract") or {}
          expected_equal={
              "name":"turnover-possession volatility engine",
              "market":"Over/Under",
              "frozen_parent_upgrade":"cfb_over_under_matchup_ui_v7",
              "frozen_parent_slate":"cfb_over_under_slate_v6",
              "active_engine":"cfb_over_under_turnover_engine_v1",
              "active_slate":"cfb_over_under_slate_v7",
              "active_ui":"cfb_over_under_matchup_ui_v8",
              "active_router":"streamlit_memory_lazy_router_v48",
              "offense_giveaway_weight":0.5,
              "defense_takeaway_weight":0.5,
              "full_sample_games":6.0,
              "minimum_side_coverage":1.0,
              "max_total_sigma_adjustment_points":1.25,
              "projected_total_turnover_weight":0.0,
              "analysis_line_turnover_weight":0.0,
              "live_florida_am_division":"FCS",
              "live_miami_division":"FBS",
              "next_upgrade_step":9,
          }
          for key,expected in expected_equal.items():
              if c.get(key) != expected:
                  failures.append(f"Step 8 contract changed: {key}")
          required_true=[
              "ncaa_turnover_margin_direct_counts_active",
              "rankless_tie_safe_parser_active",
              "tied_blank_rank_rows_preserved",
              "division_baseline_normalization_active",
              "mixed_fbs_fcs_absolute_rate_matching_allowed",
              "live_florida_am_miami_certified",
          ]
          for key in required_true:
              if c.get(key) is not True:
                  failures.append(f"Step 8 contract lost required true invariant: {key}")
          required_false=[
              "cross_division_rank_comparison_allowed",
              "field_position_data_available",
              "field_position_points_adjustment_used",
              "frozen_step9_thresholds_changed",
              "frozen_reliability_changed",
              "projected_team_points_changed",
              "projected_total_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if c.get(key) is not False:
                  failures.append(f"Step 8 contract violated false invariant: {key}")
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 8 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 8 frozen blob changed: {path}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP8_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Verify active Router V48 and compile frozen Step 8
        run: |
          grep -F 'from streamlit_memory_lazy_router_v48 import render_app' app.py
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_turnover_engine_v1.py",
              "cfb_over_under_slate_v7.py",
              "cfb_over_under_matchup_ui_v8.py",
              "streamlit_memory_lazy_router_v48.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_STEP8_FROZEN_COMPILE=PASS")
          PY

      - name: Run Step 8 and inherited regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Step 8 permanent-freeze model firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_turnover_engine_v1.py",
              "cfb_over_under_slate_v7.py",
              "cfb_over_under_matchup_ui_v8.py",
              "streamlit_memory_lazy_router_v48.py",
          ))
          required=[
              'FROZEN_STEP7_ENGINE = "cfb_over_under_third_down_engine_v1"',
              'MAX_TOTAL_SIGMA_ADJUSTMENT = 1.25',
              'MIN_SIDE_COVERAGE = 1.00',
              'OFFENSE_GIVEAWAY_WEIGHT = 0.50',
              'DEFENSE_TAKEAWAY_WEIGHT = 0.50',
              'FULL_SAMPLE_GAMES = 6.0',
              'ANALYSIS_LINE_TURNOVER_WEIGHT = 0.0',
              'PROJECTED_TOTAL_TURNOVER_WEIGHT = 0.0',
              '"field_position_data_available": False',
              '"field_position_points_adjustment_used": False',
              '"rankless_tie_safe_parser_active": True',
              '"cross_division_rank_comparison_used": False',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v7"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v47"',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing frozen Step 8 marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"Step 8 permanent freeze crossed firewall: {token}")
          print("CFB_OU_UPGRADE_STEP8_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - name: Permanent freeze marker
        run: echo CFB_OU_UPGRADE_STEP8_TURNOVER_PERMANENTLY_FROZEN_GREEN
