name: WNBA Step19A consumer verifier certification

on:
  push:
    branches:
      - wnba-step19a-live-compat-fix-20260829
    paths:
      - 'sports_api/wnba_step19a_consumer_verifier.py'
      - 'tests/test_wnba_step19a_consumer_verifier.py'
      - '.github/workflows/wnba-step19a-consumer-verifier-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-consumer-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 500
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile Step19A consumer verifier
        run: |
          python -m py_compile sports_api/wnba_step19a_consumer_verifier.py
          python -m py_compile tests/test_wnba_step19a_consumer_verifier.py

      - name: Run fail-closed consumer verification regressions
        run: pytest -q tests/test_wnba_step19a_consumer_verifier.py

      - name: Prove frozen scheduler and provider sources remain unchanged
        run: |
          set -euo pipefail
          BASE='70aa357df98ef8ce931a249677484fd205f25467'
          git diff --exit-code "$BASE"..HEAD -- \
            sports_api/wnba_step11_draftkings_provider.py \
            sports_api/wnba_step11_fanduel_provider.py \
            sports_api/wnba_step11_multibook_shadow_board.py \
            sports_api/wnba_step11_controlled_automation.py \
            sports_api/wnba_step17b_always_on_runtime.py \
            sports_api/wnba_step6d_direct_integration.py \
            sports_api/wnba_reconciled_direct_sync.py
          echo STEP19A_CONSUMER_VERIFIER_FROZEN_SOURCES_OK

      - name: Prove verifier is read-only and production stays protected
        run: |
          python - <<'PY'
          from sports_api import wnba_step19a_consumer_verifier as verifier
          assert verifier.MIN_BOOKS_AT_EXACT_LINE == 2
          assert verifier.CERTIFIED_SIMULATIONS == 5_000_000
          assert verifier.EXPECTED_DATA_TYPE == 'wnba_step18a_streamlit_consumer_latest'
          assert verifier.EXPECTED_SCHEMA_VERSION == 'wnba_step_18a_streamlit_consumer_v1'
          print('STEP19A_CONSUMER_VERIFIER_FAIL_CLOSED_OK')
          PY
