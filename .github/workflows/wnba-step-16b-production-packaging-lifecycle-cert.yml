name: WNBA Step 16B production packaging lifecycle certification

on:
  push:
    branches:
      - wnba-step16b-production-packaging-lifecycle-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"
  WNBA_STEP12_SCHEDULER_ENABLED: "false"
  WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Step 16B branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: Assert production runtime and canary remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED" = 'false'
          test -z "${KYRE_DATABASE_URL:-}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API plus persistence dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-persistence.txt
          python - <<'PY'
          import psycopg
          assert psycopg.__version__.split('.')[0] == '3'
          print('STEP16B_PSYCOPG3_PACKAGING_OK', psycopg.__version__)
          PY

      - name: Compile Step 16B packaging lifecycle surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step16b_production_lifecycle.py
          python -m py_compile sports_api/wnba_step16b_packaging_lifecycle_contract.py
          python -m py_compile tests/test_wnba_step16b_production_packaging_lifecycle.py
          python -m py_compile sports_api/tools/wnba_step16b_production_packaging_lifecycle_cert.py
          python -m py_compile sports_api/main.py
          python -m json.tool sports_api/certification/wnba_step16b_production_packaging_lifecycle_evidence.json >/dev/null

      - name: Run Step 16B production packaging lifecycle guards
        run: PYTHONPATH=. python tests/test_wnba_step16b_production_packaging_lifecycle.py

      - name: Run frozen Step 16A guards at exact parent SHA
        shell: bash
        run: |
          set -euo pipefail
          STEP16A_FROZEN_SHA='4ea88aa9a54f5110a03e9e4374219ed15ab30def'
          rm -rf /tmp/wnba-step16a-parent
          git worktree add --detach /tmp/wnba-step16a-parent "$STEP16A_FROZEN_SHA"
          (
            cd /tmp/wnba-step16a-parent
            PYTHONPATH=. python tests/test_wnba_step16a_production_activation_contract.py
          )
          git worktree remove /tmp/wnba-step16a-parent --force

      - name: Run frozen Step 15C through Step 15A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step15_live_persistence_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step15b_live_adapter_transaction_smoke.py
          PYTHONPATH=. python tests/test_wnba_step15a_live_postgres_preflight.py

      - name: Run frozen Step 14D through Step 14A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step14_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step14c_durable_restart_lease.py
          PYTHONPATH=. python tests/test_wnba_step14b_database_checkpoint_adapter.py
          PYTHONPATH=. python tests/test_wnba_step14a_persistence_contract.py

      - name: Run frozen Step 13D through Step 13A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step13_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step13c_reliability_recovery.py
          PYTHONPATH=. python tests/test_wnba_step13b_runtime_supervisor.py
          PYTHONPATH=. python tests/test_wnba_step13a_bounded_scheduler.py

      - name: Run frozen Step 12D through Step 12A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 16A head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP16A_FROZEN_SHA='4ea88aa9a54f5110a03e9e4374219ed15ab30def'
          git merge-base --is-ancestor "$STEP16A_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP16A_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only approved Step 16B files changed after frozen Step 16A
        shell: bash
        run: |
          set -euo pipefail
          STEP16A_FROZEN_SHA='4ea88aa9a54f5110a03e9e4374219ed15ab30def'
          git diff --name-only "$STEP16A_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/Dockerfile|\
              sports_api/production.env.example|\
              sports_api/main.py|\
              sports_api/wnba_step16b_production_lifecycle.py|\
              sports_api/wnba_step16b_packaging_lifecycle_contract.py|\
              sports_api/certification/wnba_step16b_production_packaging_lifecycle_evidence.json|\
              tests/test_wnba_step16b_production_packaging_lifecycle.py|\
              sports_api/tools/wnba_step16b_production_packaging_lifecycle_cert.py|\
              .github/workflows/wnba-step-16b-production-packaging-lifecycle-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step16A file drift: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$(git diff --name-only "$STEP16A_FROZEN_SHA" HEAD | wc -l | tr -d ' ')" = '9'

      - name: Prove frozen persistence requirement is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object sports_api/requirements-persistence.txt)" = '46331822d0a55f5a4983d289c73a45ea9745ca89'
          test "$(cat sports_api/requirements-persistence.txt)" = 'psycopg[binary]>=3.2,<4'

      - name: Verify Step 16B blocker closure and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step16b_packaging_lifecycle_contract as c
          from sports_api import wnba_step16b_production_lifecycle as l
          manifest = c.build_step16b_contract_manifest(
              generated_at_utc='2026-08-28T20:00:00+00:00'
          )
          assert c.STEP16A_CERTIFIED_SHA == '4ea88aa9a54f5110a03e9e4374219ed15ab30def'
          assert manifest['blocker_resolution']['all_step16a_packaging_lifecycle_blockers_closed'] is True
          assert manifest['packaging_contract']['psycopg3_in_container'] is True
          assert manifest['packaging_contract']['database_url_secret_manager_reference'] is True
          assert manifest['packaging_contract']['database_url_value_in_git'] is False
          assert manifest['packaging_contract']['fastapi_lifespan_bound'] is True
          assert manifest['runtime_contract']['database_connection_on_app_startup'] is False
          assert manifest['runtime_contract']['scheduler_cycle_on_app_startup'] is False
          assert manifest['runtime_contract']['production_activation_ready'] is False
          assert manifest['runtime_contract']['step16c_live_canary_required'] is True
          assert l.get_step16b_runtime_binding({}) is None
          assert all(value is False for value in manifest['safety_contract'].values())
          print('STEP16B_BLOCKERS_CLOSED_PRODUCTION_STILL_OFF_OK')
          PY

      - name: Certify Step 16B production packaging lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m sports_api.tools.wnba_step16b_production_packaging_lifecycle_cert

      - name: Upload Step 16B certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step16b-production-packaging-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: step16b-production-packaging-lifecycle-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production runtime and canary remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED" = 'false'
          test -z "${KYRE_DATABASE_URL:-}"
