name: MLB Step20B production-release certification

on:
  push:
    branches:
      - mlb-step20b-production-release
    paths:
      - sports_api/mlb_step20b_production_release_certification_v1.py
      - tests/test_mlb_step20b_production_release_certification_v1.py
      - .github/workflows/mlb-step20b-production-release-cert.yml
  pull_request:
    branches: [main]
    paths:
      - sports_api/mlb_step20b_production_release_certification_v1.py
      - tests/test_mlb_step20b_production_release_certification_v1.py
      - .github/workflows/mlb-step20b-production-release-cert.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step20b-production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  STEP20B_BASE_SHA: 6c616cfa19a3c5fdadda2781694654c8f6d2db59
  STEP18D_MERGED_SHA: e3fc9f58beae938919332808e1edb7ae511f57ef
  STEP17B_MERGED_SHA: 911e917d9d1552289bab5f8c74604103c056982f
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"
  MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED: "false"
  MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED: "false"
  MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED: "false"

jobs:
  certify-production-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact three-file additive Step20B scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP20B_BASE_SHA" HEAD
          git merge-base --is-ancestor "$STEP18D_MERGED_SHA" HEAD
          git merge-base --is-ancestor "$STEP17B_MERGED_SHA" HEAD
          git diff --check "$STEP20B_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$STEP20B_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          expected='^(sports_api/mlb_step20b_production_release_certification_v1.py|tests/test_mlb_step20b_production_release_certification_v1.py|\.github/workflows/mlb-step20b-production-release-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$expected" || true)"
          test -z "$bad"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 3
          test -z "$(git diff --name-status "$STEP20B_BASE_SHA"...HEAD | awk '$1 == "D" {print}')"
          echo MLB_STEP20B_EXACT_SCOPE_OK

      - name: Prove frozen production activation and rollback boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false
          test "$MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED" = false
          test "$MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED" = false
          test "$MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED" = false
          git diff --exit-code "$STEP20B_BASE_SHA"...HEAD -- \
            sports_api/main.py \
            sports_api/api/mlb.py \
            sports_api/mlb_step17a_production_host_contract_v1.py \
            sports_api/mlb_step17b_always_on_runtime_v1.py \
            sports_api/api/mlb_step17b_runtime.py \
            sports_api/tools/mlb_step18a_production_baseline.py \
            sports_api/tools/mlb_step18b_production_observability.py \
            sports_api/tools/mlb_step18c_incident_response.py \
            sports_api/tools/mlb_step18d_final_production_freeze.py \
            sports_api/collectors/mlb_official_slate.py \
            sports_api/collectors/mlb_live_market_feed.py \
            sports_api/collectors/mlb_event_player_identity.py \
            sports_api/collectors/mlb_provider_reliability.py \
            sports_api/mlb_step19e_production_persistence_validation_v1.py \
            sports_api/sql/mlb_step19e_live_data_persistence.sql \
            sports_api/mlb_step20a_end_to_end_certification_v1.py \
            tests/test_mlb_step20a_end_to_end_certification_v1.py \
            .github/workflows/mlb-step20a-end-to-end-certification-cert.yml
          echo MLB_STEP20B_FROZEN_BOUNDARIES_OK

      - name: Prove PR workflow has no deployment authority
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/mlb-step20b-production-release-cert.yml
          grep -F 'permissions:' "$workflow"
          grep -F 'contents: read' "$workflow"
          python - <<'PY'
          from pathlib import Path
          text = Path(
              '.github/workflows/mlb-step20b-production-release-cert.yml'
          ).read_text(encoding='utf-8')
          forbidden = (
              'secrets.' + 'RENDER',
              'workflow_' + 'run:',
              'curl -X ' + 'POST',
              'gh api --method ' + 'POST',
              'deploy_' + 'hook',
              'deploy-' + 'hook',
          )
          found = [needle for needle in forbidden if needle in text]
          if found:
              raise SystemExit(f'MLB_STEP20B_DEPLOY_PRIMITIVE_FOUND: {found}')
          print('MLB_STEP20B_NO_DEPLOY_PRIMITIVES_OK')
          PY
          echo MLB_STEP20B_NO_DEPLOY_AUTHORITY_OK

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests httpx
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Compile Step20B certification surface
        run: |
          python -m py_compile \
            sports_api/mlb_step20b_production_release_certification_v1.py \
            tests/test_mlb_step20b_production_release_certification_v1.py

      - name: Run Step20B fail-closed release tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_step20b_production_release_certification_v1.py

      - name: Revalidate Step20A end-to-end contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_step20a_end_to_end_certification_v1.py

      - name: Run current MLB regression excluding historical snapshot-only guards
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            case "$path" in
              tests/test_mlb_step16a_production_activation_contract_v1.py|\
              tests/test_mlb_step16b_production_packaging_lifecycle_v1.py|\
              tests/test_mlb_step17a_production_host_contract_v1.py)
                continue
                ;;
            esac
            files+=("$path")
          done
          test "${#files[@]}" -gt 0
          PYTHONPATH=. python -m pytest -q "${files[@]}"

      - name: Build non-deploying Step20B release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .step20b
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          from pathlib import Path

          from sports_api import mlb_step20a_end_to_end_certification_v1 as step20a
          from sports_api.mlb_step20b_production_release_certification_v1 import (
              FINAL_CERTIFICATION_MARKER,
              certify_step20b_production_release_candidate,
          )

          source = {
              'data_type': step20a.DATA_TYPE,
              'schema_version': step20a.SCHEMA_VERSION,
              'certification_status': 'certified',
              'final_certification_marker': step20a.FINAL_CERTIFICATION_MARKER,
              'checkpoint_version': 1,
              'checkpoint_id': 'step20a-certified-lineage',
              'checkpoint_envelope_sha256': 'a' * 64,
              'consumer_api_path': step20a.EXISTING_CONSUMER_PATH,
              'consumer_api_data_type': step20a.EXISTING_API_DATA_TYPE,
              'consumer_game_count': 1,
              'consumer_card_count': 1,
              'consumer_official_game_ids': [777001],
              'provider_network_calls_added_by_step20a': 0,
              'database_reads_added_by_step20a': 0,
              'database_writes_added_by_step20a': 0,
              'production_runtime_wiring': False,
              'production_scheduler_mutation': False,
              'model_probability_mutation': False,
              'projection_mutation': False,
              'actionable_output': False,
              'wagering': False,
              'fuzzy_matching_used': False,
              'synthetic_game_id_used': False,
              'synthetic_player_id_used': False,
              'price_fabrication_used': False,
          }
          result = certify_step20b_production_release_candidate(
              source,
              candidate_sha=os.environ['GITHUB_SHA'],
              env=os.environ,
          )
          assert result['final_certification_marker'] == FINAL_CERTIFICATION_MARKER
          assert result['ready_for_merge_decision'] is True
          assert result['deployment_performed'] is False
          assert result['activation_performed'] is False
          assert result['render_mutation_performed'] is False
          assert result['production_database_write_performed'] is False
          assert result['automatic_rollback_performed'] is False
          assert result['manual_merge_required'] is True
          assert result['manual_post_merge_activation_required'] is True
          assert result['actionable_output'] is False
          assert result['wagering'] is False

          path = Path('.step20b/mlb-step20b-production-release-evidence.json')
          path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          print(FINAL_CERTIFICATION_MARKER)
          PY

      - name: Upload Step20B release evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step20b-production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .step20b/mlb-step20b-production-release-evidence.json
          if-no-files-found: error
          retention-days: 90
