name: NFL Game Totals Step 2P Render Bridge

on:
  push:
    branches:
      - monster/nfl-game-totals-step2p-render-bridge
  pull_request:
    branches:
      - mlb-step17b-shared-host-cert
    paths:
      - sports_api/api/nfl_game_totals_market_v1.py
      - sports_api/collectors/nfl_fanduel_game_totals_v1.py
      - sports_api/main.py
      - tests/test_nfl_game_totals_market_v1.py
      - tests/test_nfl_fanduel_game_totals_v1.py
      - .github/workflows/nfl-game-totals-step2p-render-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-render-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install narrow test dependencies
        run: python -m pip install --upgrade pip pytest fastapi httpx

      - name: Freeze-scope guard
        shell: bash
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -z "$base_ref" ]; then
            base_ref="mlb-step17b-shared-host-cert"
          fi
          changed="$(git diff --name-only "origin/${base_ref}"...HEAD)"
          printf '%s\n' "$changed"
          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(sports_api/api/nfl_game_totals_market_v1\.py|sports_api/collectors/nfl_fanduel_game_totals_v1\.py|sports_api/main\.py|tests/test_nfl_game_totals_market_v1\.py|tests/test_nfl_fanduel_game_totals_v1\.py|\.github/workflows/nfl-game-totals-step2p-render-bridge\.yml)$' || true)"
          if [ -n "$disallowed" ]; then
            echo "Unexpected Render bridge paths:"
            echo "$disallowed"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ei '(spread|moneyline|rushing|receiving|v136)'; then
            echo "Frozen NFL sibling surface was touched."
            exit 1
          fi

      - name: Compile Game Totals bridge
        run: |
          python -m py_compile \
            sports_api/api/nfl_game_totals_market_v1.py \
            sports_api/collectors/nfl_fanduel_game_totals_v1.py \
            tests/test_nfl_game_totals_market_v1.py \
            tests/test_nfl_fanduel_game_totals_v1.py

      - name: Run certified Game Totals tests
        run: |
          python -m pytest -q \
            tests/test_nfl_game_totals_market_v1.py \
            tests/test_nfl_fanduel_game_totals_v1.py

      - name: Route registration smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("sports_api/main.py").read_text()
          expected_import = "from sports_api.api.nfl_game_totals_market_v1 import router as nfl_game_totals_market_router"
          expected_mount = "app.include_router(nfl_game_totals_market_router)"
          assert source.count(expected_import) == 1
          assert source.count(expected_mount) == 1
          print("Render bridge mounts NFL Game Totals route exactly once")
          PY

      - name: Projection isolation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("sports_api/api/nfl_game_totals_market_v1.py").read_text()
          assert '"identity_mode": "exact_espn_event_id"' in api
          assert '"sportsbook_projection_weight": 0.0' in api
          assert '"projection_use": "context_only"' in api
          assert '"wager_actions_enabled": False' in api
          print("Exact identity + 0.0% sportsbook projection influence certified")
          PY
