name: WNBA PRA Speed V3 Step 3 Detail Bundle

on:
  pull_request:
    paths:
      - "sports_api/api/wnba_pra_detail_bundle.py"
      - "sports_api/main.py"
      - "wnba_pra_speed_v3_step3_bundle.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py"
      - "devsystem/wnba_pra_speed_v3_step3_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step3-detail-bundle.json"
      - "tests/test_wnba_pra_speed_v3_step3.py"
      - ".github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml"
      - "app.py"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "sports_api/api/wnba_pra_detail_bundle.py"
      - "sports_api/main.py"
      - "wnba_pra_speed_v3_step3_bundle.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py"
      - "devsystem/wnba_pra_speed_v3_step3_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step3-detail-bundle.json"
      - "tests/test_wnba_pra_speed_v3_step3.py"
      - ".github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml"
      - "app.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: pip install pytest requests fastapi streamlit httpx pandas pypdf

      - name: Run Step 3 detail-bundle contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_wnba_pra_speed_v3_step3.py

      - name: Enforce Step 3 exact scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml
          app.py
          devsystem/task_ledgers/wnba-pra-speed-v3-step3-detail-bundle.json
          devsystem/wnba_pra_speed_v3_step3_public_profile.py
          sports_api/api/wnba_pra_detail_bundle.py
          sports_api/main.py
          streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py
          tests/test_wnba_pra_speed_v3_step3.py
          wnba_pra_speed_v3_step3_bundle.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt

          cat > /tmp/cert_closeout.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step3-detail-bundle.json
          EOF
          sort -o /tmp/cert_closeout.txt /tmp/cert_closeout.txt

          cat > /tmp/full_redeploy.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step3-detail-bundle.json
          requirements.txt
          EOF
          sort -o /tmp/full_redeploy.txt /tmp/full_redeploy.txt

          cat > /tmp/stats_host_repair.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step3-detail-bundle.yml
          sports_api/api/wnba_pra_detail_bundle.py
          sports_api/wnba_game_history.py
          tests/test_wnba_pra_speed_v3_step3.py
          EOF
          sort -o /tmp/stats_host_repair.txt /tmp/stats_host_repair.txt

          if diff -q /tmp/expected.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP3_SCOPE_GREEN"
          elif diff -q /tmp/cert_closeout.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP3_CERT_CLOSEOUT_SCOPE_GREEN"
          elif diff -q /tmp/full_redeploy.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP3_FULL_REDEPLOY_SCOPE_GREEN"
          elif diff -q /tmp/stats_host_repair.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP3_STATS_HOST_REPAIR_SCOPE_GREEN"
          else
            echo "WNBA_PRA_SPEED_V3_STEP3_SCOPE_RED"
            diff -u /tmp/cert_closeout.txt /tmp/actual.txt || true
            exit 1
          fi

      - name: Protect frozen Navigation V2 and Speed V3 Steps 1-2
        shell: bash
        run: |
          set -euo pipefail
          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "STEP3_FROZEN_BLOB_CHANGED:$1:$actual:$2"; exit 1; }
          }
          check_blob wnba_pra_navigation_v2_step1.py 2ff0c0c7f4b5973755f4a53b9ef110a3eafd7cb9
          check_blob wnba_pra_slate_v2_step2.py 4636cb4314489e3458b70cb3c17c6a6af4c5ea3d
          check_blob wnba_pra_game_center_v2_step3.py a181c8949991bb139521f7d379046f34147e5306
          check_blob wnba_pra_player_intelligence_v2_step4.py 393c29711962bf1d42b8fc58322938c92e23000a
          check_blob wnba_pra_performance_v2_step5.py 48f0ee6352c56de4a7d224aa05a6c5f584456086
          check_blob wnba_pra_responsive_v2_step6.py fa42253c48c4df793b4ee0d307e3b843c410cf03
          check_blob wnba_pra_final_v2_step7.py f0e2e6135712cfe10c54b3a90070fd595607fd90
          check_blob streamlit_memory_lazy_router_wnba_nav_v2_step7.py 53bc4026f9e8bb5161762af6d9051bc3a105dfd6
          check_blob wnba_pra_speed_v3_step1_profiler.py df406e7f3753f5707274d5287c87ee49832515bf
          check_blob streamlit_memory_lazy_router_wnba_pra_speed_v3_step1.py 649b9af7e33be34b6cc931f9a3699d0e002f22d3
          check_blob wnba_pra_speed_v3_step2_transport.py 9a682f1ef27e663f1254d16895ed955f7dc0987e
          check_blob streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py 3e14bb8b9607cce6f026ba3ae479f7536b0ac9eb
          check_blob wnba_api_client_v1.py a371d30e59fc44c441cf08a411bc8210a111913d
          echo "WNBA_PRA_SPEED_V3_STEP3_FROZEN_STEPS1_2_GREEN"

      - name: Compile Step 3 surfaces
        run: |
          python -m py_compile \
            sports_api/api/wnba_pra_detail_bundle.py \
            sports_api/main.py \
            wnba_pra_speed_v3_step3_bundle.py \
            streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py \
            devsystem/wnba_pra_speed_v3_step3_public_profile.py

      - name: Certify one-request contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"streamlit_hosted_reads_required": 1' sports_api/api/wnba_pra_detail_bundle.py
          grep -F '"cold_pair_streamlit_api_reads": 1' wnba_pra_speed_v3_step3_bundle.py
          grep -F '"projection_math_changed": False' wnba_pra_speed_v3_step3_bundle.py
          grep -F 'performance._FROZEN_PLAYER_LOADER = bundle.load_bundle_pair' streamlit_memory_lazy_router_wnba_pra_speed_v3_step3.py
          grep -F 'from streamlit_memory_lazy_router_wnba_pra_speed_v3_step3 import record_bootstrap_import_ms, render_app' app.py
          echo "WNBA_PRA_SPEED_V3_STEP3_ONE_REQUEST_CONTRACT_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP3_BRANCH_GREEN"

  public-profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: focused-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          pip install playwright requests streamlit
          python -m playwright install --with-deps chromium

      - name: Prove real API bundle and PickVault one-read path
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/wnba_pra_speed_v3_step3_public_profile.py \
            --production-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/wnba-pra-speed-v3-step3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wnba-pra-speed-v3-step3-profile
          path: artifacts/wnba-pra-speed-v3-step3
          if-no-files-found: ignore
