name: Registry Race V1 Step 2 Descendant Thaw Awareness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/registry-race-v1-step2-descendant-thaw-awareness.yml"
      - "devsystem/descendant_thaw_awareness_v1.py"
      - "devsystem/execution_plans/registry-race-v1-step2-descendant-thaw-awareness.json"
      - "devsystem/task_ledgers/registry-race-v1-step2-descendant-thaw-awareness.json"
      - "tests/test_devsystem_descendant_thaw_awareness_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/registry-race-v1-step2-descendant-thaw-awareness.yml"
      - "devsystem/descendant_thaw_awareness_v1.py"
      - "devsystem/execution_plans/registry-race-v1-step2-descendant-thaw-awareness.json"
      - "devsystem/task_ledgers/registry-race-v1-step2-descendant-thaw-awareness.json"
      - "tests/test_devsystem_descendant_thaw_awareness_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-race-v1-step2-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  descendant-thaw-awareness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 2 descendant authority contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile devsystem/descendant_thaw_awareness_v1.py
          python -m pytest -q             tests/test_devsystem_descendant_thaw_awareness_v1.py             tests/test_devsystem_registry_reconciliation_barrier_v1.py             tests/test_devsystem_frozen_registry_auto_reconciler_v1.py
          python devsystem/descendant_thaw_awareness_v1.py
      - name: Prove Step 1 and existing frozen registry remain exact
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/registry.json
          python devsystem/frozen_artifact_registry_v1.py verify-head             --registry-file /tmp/registry.json             --head HEAD
          echo "REGISTRY_RACE_V1_STEP2_FROZEN_PARENTS_GREEN"
      - name: Certify exact PR head
        if: github.event_name == 'pull_request'
        run: |
          echo "REGISTRY_RACE_V1_STEP2_BRANCH_GREEN"
          echo "REGISTRY_RACE_V1_STEP2_READY_TO_MERGE"
      - name: Certify merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "REGISTRY_RACE_V1_STEP2_MAIN_GREEN"
