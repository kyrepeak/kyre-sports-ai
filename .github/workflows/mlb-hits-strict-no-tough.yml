name: MLB Hits strict no-TOUGH certification

on:
  workflow_dispatch:
  push:
    branches: ['fix/mlb-hits-strict-no-tough-visible']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify frozen MLB Hits Steps 1-5 boundary
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(pathlib.Path("mlb_hits_freeze_manifest_v5.json").read_text())
          base = manifest["baseline_commit"]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path in manifest["baseline_paths"]:
              try:
                  expected = rev(f"{base}:{path}")
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen Hits path: {path}")
                  continue
              if expected != actual:
                  failures.append(f"frozen Hits baseline changed: {path}")

          for path, expected in manifest["exact_blobs"].items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing exact-frozen Hits path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"exact frozen Hits blob changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("MLB_HITS_STEPS_1_5_FROZEN_BOUNDARY=PASS")
          PY

      - name: Compile strict no-TOUGH route
        run: |
          python -m py_compile \
            app.py \
            mlb_hit_strict_no_tough_v1.py \
            mlb_hit_hub_v1321.py \
            streamlit_memory_lazy_router_v21.py \
            tests/test_mlb_hits_strict_no_tough.py \
            tests/test_streamlit_memory_lazy_router_v21.py
          PYTHONPATH=. python -c "import mlb_hit_strict_no_tough_v1; import mlb_hit_hub_v1321; import streamlit_memory_lazy_router_v21"

      - name: Prove additive app bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("app.py").read_text(encoding="utf-8")
          match = re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", text)
          if not match or int(match.group(1)) < 21:
              raise SystemExit("strict no-TOUGH bootstrap regressed below Router V21")
          if "streamlit_memory_lazy_router_v1" not in text:
              raise SystemExit("lazy-router lineage marker missing")
          print("MLB_HITS_STRICT_NO_TOUGH_BOOTSTRAP=PASS")
          PY

      - name: Run strict no-TOUGH contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_hits_strict_no_tough.py \
            tests/test_streamlit_memory_lazy_router_v21.py \
            tests/test_mlb_hits_step5_starter_vulnerability.py \
            tests/test_streamlit_memory_lazy_router_v20.py \
            tests/test_mlb_hits_step4_favorable_ranking.py \
            tests/test_streamlit_memory_lazy_router_v19.py \
            tests/test_mlb_hits_step3_hitter_profile.py \
            tests/test_streamlit_memory_lazy_router_v18.py \
            tests/test_mlb_hits_step2_mobile_top5.py \
            tests/test_streamlit_memory_lazy_router_v17.py \
            tests/test_mlb_hits_step1_strength_evidence_summary.py \
            -k 'not app_activates_additive_router_v3 and not router_changes_only_hits_route_and_delegates_everything_else'

      - name: Assert exact visible TOUGH gate
        run: |
          PYTHONPATH=. python - <<'PY'
          import mlb_hit_strict_no_tough_v1 as s

          assert s.STEP2_TOUGH_ERA_MAX == 3.35
          assert s.STEP2_TOUGH_WHIP_MAX == 1.12
          assert s.STEP2_TOUGH_K_PCT_MIN == 0.27
          assert s.certified_step2_starter_grade({"era": 3.18, "whip": 1.16, "k_pct": .209}) == "TOUGH"
          assert s.certified_step2_starter_grade({"era": 4.00, "whip": 1.25, "k_pct": .22}) == "NEUTRAL"
          print("MLB_HITS_STRICT_NO_TOUGH_RULE=PASS")
          PY

      - name: Certification marker
        run: echo "MLB_HITS_STRICT_NO_TOUGH_GREEN"
