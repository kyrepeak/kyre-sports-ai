name: WNBA Step20B Render in-flight runtime trace

on:
  push:
    branches:
      - wnba-step20b-render-inflight-trace-20260830
    paths:
      - 'sports_api/wnba_step20b_render_inflight_trace.py'
      - 'sports_api/api/wnba_step17b_runtime.py'
      - 'tests/test_wnba_step20b_render_inflight_trace.py'
      - '.github/workflows/wnba-step20b-render-inflight-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step20b-render-inflight-runtime-trace
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}
  ROLLBACK_SHA: aaf8b8a5425ea6e1b0ab33e6c42f35c95e8905ab
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: wnba-render-staging
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
      WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
      WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_STEP6J_CANARY_ENABLED: 'false'
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Trace semantics and regression wall
        run: |
          python -m pytest -q tests/test_wnba_step20b_render_inflight_trace.py
          python -m pytest -q tests/test_wnba_step20b_shared_input_cache.py tests/test_wnba_step20b_fanduel_period_filter.py
          python -m pytest -q tests/test_wnba_step11_fanduel_provider.py
          python -m pytest -q \
            tests/test_wnba_step8_official_box_baseline.py \
            tests/test_wnba_step8_core_projection.py \
            tests/test_wnba_step8_context_adjustment.py \
            tests/test_wnba_step8_joint_monte_carlo.py \
            tests/test_wnba_step8_projection_handoff.py
          python -m pytest -q \
            tests/test_wnba_step19j_runtime_acceleration.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19l_fanduel_identity_trace.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19n_fanduel_empty_market.py

      - name: Prove hosted trace is semantics neutral
        run: |
          python - <<'PY'
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step20b_shared_input_cache as b
          from sports_api import wnba_step20b_render_inflight_trace as t
          import sports_api.api.wnba_step17b_runtime
          assert s12b.run_step12b_live_runtime_job is b.run_step12b_with_shared_input_cache
          status=t.installation_status()
          assert status['installed'] is True
          assert all(status['private_seams_active'].values())
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          for key,value in status['guardrails'].items():
              if key == 'diagnostic_only':
                  assert value is True
              else:
                  assert value is False, key
          print('STEP20B_RENDER_TRACE_SEMANTICS_CERTIFIED')
          PY

      - name: Deploy exact diagnostic candidate to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          desired={
            'WEB_CONCURRENCY':'1','WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED':'true','WNBA_STEP17B_ALWAYS_ON_ENABLED':'true','WNBA_STEP17B_LOOP_SECONDS':'60','WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_STEP17C_MONITORING_ENABLED':'true','WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED':'true',
            'WNBA_STEP14C_DURABLE_RESTART_LEASE_ENABLED':'true','WNBA_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED':'true','WNBA_STEP14B_DATABASE_READ_ENABLED':'true','WNBA_STEP14B_DATABASE_WRITE_ENABLED':'true','WNBA_STEP14A_PERSISTENCE_CONTRACT_ENABLED':'true','WNBA_STEP13D_FINAL_SCHEDULER_FREEZE_ENABLED':'true','WNBA_STEP13C_RELIABILITY_RECOVERY_ENABLED':'true','WNBA_STEP13B_RUNTIME_SUPERVISOR_ENABLED':'true','WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED':'true','WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED':'true','WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED':'true','WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED':'true','WNBA_STEP12A_SHADOW_RUNNER_ENABLED':'true',
            'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true','WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz','WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true','WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true','WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true','WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED':'true','WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED':'true','WNBA_STEP10_FASTAPI_ENABLED':'true','WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true','WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true','WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true','WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true','WNBA_STEP9_FASTAPI_ENABLED':'true','WNBA_STEP9_THRESHOLD_PRICING_ENABLED':'true','WNBA_STEP9B_MARKET_COMPARISON_ENABLED':'true','WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED':'true','WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED':'true','WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true','WNBA_STEP7G_FIRST_PARTY_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_STEP6J_CANARY_ENABLED':'false','WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false','WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED':'false','WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step20b-render-inflight-trace'
          }
          for key,value in desired.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('deploy id missing')
          for _ in range(180):
              deploy=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(deploy.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('deploy timeout')
          if sha.lower() not in json.dumps(deploy).lower(): raise SystemExit('live SHA mismatch')
          print('STEP20B_RENDER_TRACE_LIVE',did,sha)
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Capture in-flight hosted execution
        id: observe
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'kyre-step20b-inflight-trace/1.0'})
              with urllib.request.urlopen(req,timeout=45) as response: return json.loads(response.read().decode())
          last=None
          for poll in range(1,151):
              try:
                  rt=get('/api/v1/wnba/runtime/step17b')
                  tr=get('/api/v1/wnba/runtime/step20b-render-inflight-trace')
                  b=get('/api/v1/wnba/runtime/step20b-shared-input-cache')
                  j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration')
                  h=get('/api/v1/wnba/runtime/step19h-fanduel-transport')
                  l=get('/api/v1/wnba/runtime/step19l-fanduel-identity-trace')
                  c=get('/api/v1/wnba/consumer/latest')
              except Exception as exc:
                  if poll%3==0: print('STEP20B_TRACE_HTTP_WAIT',poll,type(exc).__name__,str(exc),flush=True)
                  time.sleep(10); continue
              trace=tr.get('trace') or {}; cur=trace.get('current_target') or {}
              last={
                'poll':poll,
                'runtime_status':rt.get('last_status'),'runtime_cycles':rt.get('cycle_count'),'runtime_successes':rt.get('success_count'),'runtime_failures':rt.get('failure_count'),'duplicate_lease_skips':rt.get('duplicate_lease_skip_count'),
                'trace_phase':trace.get('phase'),'trace_elapsed':trace.get('elapsed_seconds'),'target_total':trace.get('target_total'),'target_started':trace.get('target_started_count'),'target_completed':trace.get('target_completed_count'),'target_raised':trace.get('target_raised_count'),
                'current_target_index':cur.get('index'),'current_game_id':cur.get('game_id'),'current_player_id':cur.get('player_id'),'current_phase_seconds':cur.get('phase_seconds'),
                'cache_cycle_hits':trace.get('shared_cache_cycle_hits'),'cache_cycle_misses':trace.get('shared_cache_cycle_misses'),'step19j_rest_hits':trace.get('step19j_rest_hits'),'step19j_rest_misses':trace.get('step19j_rest_misses'),
                'cache_last_cycle':(b.get('last_cycle') or {}).get('elapsed_seconds'),'j_cycle_count':j.get('cycle_count'),'j_last_cycle':(j.get('last_cycle') or {}).get('elapsed_seconds'),
                'fd_invalid_json':h.get('invalid_json_event_count'),'fd_identity_errors':l.get('identity_error_count'),'consumer_reason':c.get('reason'),'consumer_available':c.get('available')
              }
              if poll%3==0: print('STEP20B_RENDER_INFLIGHT',json.dumps(last,sort_keys=True),flush=True)
              if int(trace.get('target_completed_count') or 0)>=5:
                  print('STEP20B_RENDER_INFLIGHT_SUFFICIENT_TARGET_SAMPLE',json.dumps(last,sort_keys=True),flush=True); break
              if int(rt.get('success_count') or 0)>=1:
                  print('STEP20B_RENDER_INFLIGHT_CYCLE_COMPLETED',json.dumps(last,sort_keys=True),flush=True); break
              time.sleep(10)
          print('STEP20B_RENDER_INFLIGHT_FINAL',json.dumps(last,sort_keys=True),flush=True)
          PY

      - name: Restore certified Step19N production revision
        if: ${{ always() && steps.deploy.outputs.deployed == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {'WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19n-safe-market-state-candidate'}.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('restore deploy id missing')
          for _ in range(180):
              deploy=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(deploy.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('restore failed '+status)
              time.sleep(5)
          else: raise SystemExit('restore timeout')
          if sha.lower() not in json.dumps(deploy).lower(): raise SystemExit('restore SHA mismatch')
          print('STEP20B_RENDER_TRACE_RESTORE_COMPLETE',did,sha)
          PY

      - name: Diagnostic marker
        if: ${{ always() }}
        run: echo STEP20B_RENDER_INFLIGHT_DIAGNOSTIC_FINISHED
