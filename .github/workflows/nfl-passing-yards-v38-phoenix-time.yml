name: NFL Passing Yards V38 Phoenix Time

on:
  pull_request:
    paths:
      - 'nfl_passing_yards_phoenix_time_v1.py'
      - 'nfl_passing_yards_hub_v38.py'
      - 'streamlit_memory_lazy_router_v139.py'
      - 'app.py'
      - 'tests/test_nfl_passing_yards_v38_phoenix_time.py'
      - '.github/workflows/nfl-passing-yards-v38-phoenix-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run V38 Phoenix-time contract
        run: python -m pytest -q tests/test_nfl_passing_yards_v38_phoenix_time.py
