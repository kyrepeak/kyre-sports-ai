name: NFL Passing Yards V32 Visual Parity Step 5 V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_passing_yards_hub_v32.py"
      - "streamlit_memory_lazy_router_v125.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v32_visual_parity_step5_v1.py"
      - ".github/workflows/nfl-passing-yards-v32-visual-parity-step5-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-visual-step5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests streamlit

      - name: Enforce exact five-file Passing visual Step 5 diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-passing-yards-v32-visual-parity-step5-v1.yml
          app.py
          nfl_passing_yards_hub_v32.py
          streamlit_memory_lazy_router_v125.py
          tests/test_nfl_passing_yards_v32_visual_parity_step5_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Passing visual Step 5 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile Passing visual Step 5 surface
        run: |
          python -m py_compile \
            nfl_passing_yards_hub_v32.py \
            streamlit_memory_lazy_router_v125.py \
            app.py \
            tests/test_nfl_passing_yards_v32_visual_parity_step5_v1.py

      - name: Prove frozen Passing and certified sibling owners remain untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_hub_v([1-9]|1[0-9]|2[0-9]|3[01])\.py$|nfl_hub_v35\.py$|streamlit_memory_lazy_router_v124\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "PASSING_VISUAL_STEP5_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "PASSING_VISUAL_STEP5_FROZEN_OWNER_GUARD_GREEN"

      - name: Run Passing V32 visual parity Step 5 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v32_visual_parity_step5_v1.py

      - name: Re-run frozen visual Step 4 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py

      - name: Re-run frozen visual Step 3 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py

      - name: Re-run frozen visual Step 2 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v29_visual_parity_step2_v1.py

      - name: Re-run frozen V28 exact-ID personnel regression
        run: python -m pytest -q tests/test_nfl_passing_yards_step5_personnel_v2.py

      - name: Prove V32 remains display-only and analytical-value blind
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import nfl_passing_yards_hub_v32 as page
          assert page.DISPLAY_ONLY is True
          assert page.FROZEN_PRIOR == 'nfl_passing_yards_hub_v31'
          assert page.FROZEN_PASSING_ENGINE == 'nfl_passing_yards_hub_v28'
          assert page.VISUAL_BUILD_STEP == 5
          assert page.VISUAL_BUILD_TOTAL == 6
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          source = inspect.getsource(page.render_nfl_passing_yards_hub)
          for forbidden in (
              'build_baseline_projection', 'build_context_projection', 'build_distribution',
              'evaluate_market', 'projection_yards', 'fair_odds', 'no_vig',
              'over_ev', 'under_ev', 'stake_size', 'projection_adjustment',
              'over_odds', 'under_odds',
          ):
              assert forbidden not in source, forbidden
          print('NFL_PASSING_YARDS_V32_VISUAL_ONLY_GREEN')
          PY

  browser-visual-step5:
    needs: certify-visual-step5
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start clean branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/passing-visual-step5
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8515 \
            > artifacts/passing-visual-step5/streamlit.log 2>&1 &
          echo $! > /tmp/passing_visual_step5_pid

      - name: Drive real Passing Yards visual Step 5 UI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _wait_for_text,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base='http://127.0.0.1:8515'
          artifacts=Path('artifacts/passing-visual-step5')
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':2600})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  nfl_market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  nfl_market_combo.wait_for(state='visible',timeout=30000)
                  _choose(page,frame,1,'Passing Yards')
                  body=_wait_for_text(frame,'VISUAL STEP 5 / 6',180.0)
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Passing visual Step 5 runtime error marker: {forbidden}')
                  for required in ('Passing Yards','Visual Parity Build','VISUAL STEP 5 / 6','V31 + V28 FROZEN','SPORTSBOOK 0%'):
                      if required not in body:
                          raise BrowserQAFailure(f'missing Passing visual Step 5 marker: {required}')

                  # Preserve the certified Step 4 context stack underneath V32.
                  preserved={'.kpy-defense':2,'.kpy-pressure':2,'.kpy-personnel':2,'.kpy-env':1}
                  deadline=time.time()+90
                  while time.time() < deadline:
                      if all(frame.locator(s).count() >= n for s,n in preserved.items()):
                          break
                      time.sleep(2)
                  for selector,expected in preserved.items():
                      count=frame.locator(selector).count()
                      if count != expected:
                          raise BrowserQAFailure(f'expected preserved {expected} {selector}, got {count}')

                  expected_counts={
                      '.kpy-proj':2,
                      '.kpy8-card':2,
                      '.kpy9-card':2,
                      '.kpy10-card':2,
                  }
                  deadline=time.time()+120
                  while time.time() < deadline:
                      counts={selector:frame.locator(selector).count() for selector in expected_counts}
                      if all(counts[selector] >= expected for selector,expected in expected_counts.items()):
                          break
                      time.sleep(2)
                  counts={selector:frame.locator(selector).count() for selector in expected_counts}
                  for selector,expected in expected_counts.items():
                      if counts[selector] != expected:
                          raise BrowserQAFailure(f'expected {expected} {selector} analytical cards, got {counts[selector]}')

                  outer_styles={}
                  for selector in expected_counts:
                      outer_styles[selector]=frame.locator(selector).first.evaluate(
                          """(e) => { const s=getComputedStyle(e); return {borderColor:s.borderColor,borderRadius:s.borderRadius,backgroundImage:s.backgroundImage}; }"""
                      )
                      style=outer_styles[selector]
                      if style['borderColor'] != 'rgb(43, 75, 57)':
                          raise BrowserQAFailure(f'{selector} is not using V32 green border: {style}')
                      if style['borderRadius'] != '16px':
                          raise BrowserQAFailure(f'{selector} is not using V32 16px radius: {style}')
                      if 'linear-gradient' not in style['backgroundImage']:
                          raise BrowserQAFailure(f'{selector} is missing V32 green/black gradient: {style}')

                  hero_selectors=(
                      '.kpy-projhero>div', '.kpy8-hero>div', '.kpy9-hero>div', '.kpy10-hero>div',
                  )
                  hero_styles={}
                  for selector in hero_selectors:
                      if frame.locator(selector).count() < 1:
                          raise BrowserQAFailure(f'missing analytical hero metric selector: {selector}')
                      hero_styles[selector]=frame.locator(selector).first.evaluate(
                          """(e) => { const s=getComputedStyle(e); return {borderColor:s.borderColor,borderRadius:s.borderRadius,backgroundColor:s.backgroundColor}; }"""
                      )
                      style=hero_styles[selector]
                      if style['borderColor'] != 'rgb(29, 53, 39)':
                          raise BrowserQAFailure(f'{selector} hero border mismatch: {style}')
                      if style['borderRadius'] != '10px':
                          raise BrowserQAFailure(f'{selector} hero radius mismatch: {style}')
                      if style['backgroundColor'] != 'rgb(9, 20, 15)':
                          raise BrowserQAFailure(f'{selector} hero background mismatch: {style}')

                  analytics_text=' '.join(frame.locator('.kpy-proj,.kpy8-card,.kpy9-card,.kpy10-card').all_inner_texts()).lower()
                  for required in ('baseline projection','context projection','outcome distribution','market evaluation','projection influence remains 0.0%'):
                      if required not in analytics_text:
                          raise BrowserQAFailure(f'analytical surface missing marker: {required}')

                  result={
                      'status':'GREEN',
                      'visual_step':'5/6',
                      'analytical_card_counts':counts,
                      'outer_styles':outer_styles,
                      'hero_styles':hero_styles,
                      'sportsbook_projection_influence':0.0,
                      'analytical_values_recomputed':False,
                      'frozen_passing_engine':'v28',
                      'frozen_visual_prior':'v31',
                  }
                  (artifacts/'passing_visual_step5_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'passing_visual_step5.png'),full_page=True)
                  print('NFL_PASSING_YARDS_V32_BROWSER_VISUAL_STEP5_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/passing-visual-step5/streamlit.log || true

      - name: Upload Passing visual Step 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-passing-visual-step5-${{ github.run_id }}
          path: artifacts/passing-visual-step5
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/passing_visual_step5_pid ]; then
            kill "$(cat /tmp/passing_visual_step5_pid)" 2>/dev/null || true
          fi
