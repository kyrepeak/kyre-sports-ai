name: API2 Control-Plane Efficiency V1 Step 5 State-Aware Proof Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.yml"
      - "devsystem/state_aware_proof_contract_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.json"
      - "tests/test_devsystem_state_aware_proof_contract_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.yml"
      - "devsystem/state_aware_proof_contract_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step5-state-aware-proof-contracts.json"
      - "tests/test_devsystem_state_aware_proof_contract_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api2-control-plane-efficiency-v1-step5-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  state-aware-proof-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 5 permanent contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile devsystem/state_aware_proof_contract_v1.py
          python -m pytest -q             tests/test_devsystem_state_aware_proof_contract_v1.py             tests/test_devsystem_wait_state_machine_v1.py             tests/test_devsystem_frozen_registry_auto_reconciler_v1.py
          python devsystem/state_aware_proof_contract_v1.py self-test
      - name: Prove frozen parents remain exact
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/registry.json
          python devsystem/frozen_artifact_registry_v1.py verify-head             --registry-file /tmp/registry.json             --head HEAD
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP5_FROZEN_PARENTS_GREEN"
      - name: Certify exact PR head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP5_BRANCH_GREEN"
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP5_READY_TO_MERGE"
      - name: Certify merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP5_MAIN_GREEN"
