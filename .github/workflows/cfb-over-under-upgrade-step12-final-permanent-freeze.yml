name: CFB O/U Upgrade Step 12 final permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: [cfb-ou-upgrade-step12-final-permanent-freeze]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact final-freeze scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-upgrade-step12-final-permanent-freeze.yml",
              "cfb_over_under_upgrade_freeze_manifest_v12.json",
          }
          if actual!=expected:
              print("expected",sorted(expected)); print("actual",sorted(actual)); sys.exit(1)
          print("CFB_OU_STEP12_FINAL_FREEZE_SCOPE=PASS")
          PY

      - name: Enforce previous Upgrade Step 11 freeze
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec): return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v11.json")!="553a574f79c8997af91694654b3800cf17705eb7":
              failures.append("Upgrade Step 11 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v11.json").read_text())
          for path,expected in (manifest.get("exact_blobs") or {}).items():
              try: actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 1-11 frozen path: {path}"); continue
              if actual!=expected: failures.append(f"Step 1-11 frozen path changed: {path}")
          if failures:
              print(*failures,sep="\n"); sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_11_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Enforce final V12 exact blobs and contract
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec): return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v12.json").read_text())
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v12.json")!="b2a798b4625bda5b8472a30e66cde2ecf6aef923":
              failures.append("final V12 freeze manifest blob changed")
          if manifest.get("version")!=12: failures.append("final freeze version changed")
          if manifest.get("completed_upgrade_steps")!=list(range(1,13)):
              failures.append("final completed upgrade-step list changed")
          if manifest.get("upgrade_complete") is not True:
              failures.append("upgrade_complete flag changed")
          if manifest.get("baseline_commit")!="594dff76417d612e4c7cb8bc5ee01b0df98d6f60":
              failures.append("Step 12 baseline commit changed")
          c=manifest.get("step12_contract") or {}
          expected_equal={
              "name":"final certification and polish",
              "market":"Over/Under",
              "frozen_parent_upgrade":"cfb_over_under_matchup_ui_v11",
              "frozen_parent_slate":"cfb_over_under_slate_v10",
              "active_certifier":"cfb_over_under_certification_v1",
              "active_slate":"cfb_over_under_slate_v11",
              "active_ui":"cfb_over_under_matchup_ui_v12",
              "active_router":"streamlit_memory_lazy_router_v52",
              "certified_upgrade_steps":list(range(1,13)),
              "completed_upgrade_count":12,
              "certification_statuses":["CERTIFIED","DATA_GATED","INTEGRITY_FAIL"],
              "live_certification_status":"CERTIFIED",
              "live_checks_passed":18,
              "live_checks_failed":0,
              "live_checks_skipped":0,
              "live_projection_fingerprint":"38d4c0b8b270751c",
              "live_available_slate_integrity_pass_rate":1,
              "live_available_slate_integrity_failures":0,
              "final_regression_tests_passed":215,
              "next_upgrade_step":None,
          }
          for key,expected in expected_equal.items():
              if c.get(key)!=expected: failures.append(f"Step 12 contract changed: {key}")
          required_true=[
              "read_only_certification_layer",
              "game_identity_check_active",
              "date_gate_check_active",
              "projected_total_arithmetic_check_active",
              "probability_mass_check_active",
              "raw_final_coherence_check_active",
              "frozen_selection_threshold_check_active",
              "step11_gate_apply_check_active",
              "analysis_line_weight_firewall_active",
              "sportsbook_market_ev_monte_carlo_firewall_active",
              "projection_fingerprint_active",
              "live_florida_am_miami_certified",
              "upgrade_complete",
          ]
          for key in required_true:
              if c.get(key) is not True: failures.append(f"Step 12 lost true invariant: {key}")
          required_false=[
              "projection_math_changed",
              "selection_math_changed",
              "reliability_changed",
              "structural_sigma_changed",
              "feature_coverage_changed",
              "qualification_thresholds_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if c.get(key) is not False: failures.append(f"Step 12 violated false invariant: {key}")
          for path,expected in (manifest.get("exact_blobs") or {}).items():
              try: actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing final frozen path: {path}"); continue
              if actual!=expected: failures.append(f"final frozen blob changed: {path}")
          if failures:
              print(*failures,sep="\n"); sys.exit(1)
          print("CFB_OU_UPGRADE_STEP12_FINAL_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Verify active Router V52 and compile final stack
        run: |
          grep -F 'from streamlit_memory_lazy_router_v52 import render_app' app.py
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_certification_v1.py",
              "cfb_over_under_slate_v11.py",
              "cfb_over_under_matchup_ui_v12.py",
              "streamlit_memory_lazy_router_v52.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_STEP12_FINAL_FROZEN_COMPILE=PASS")
          PY

      - name: Run final 12-step regression suite
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_upgrade_step12_certification.py tests/test_cfb_over_under_upgrade_step12_slate.py tests/test_cfb_over_under_upgrade_step12_ui_router.py tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py tests/test_cfb_over_under_upgrade_step11_slate.py tests/test_cfb_over_under_upgrade_step11_ui_router.py tests/test_cfb_over_under_upgrade_step10_history_engine.py tests/test_cfb_over_under_upgrade_step10_slate.py tests/test_cfb_over_under_upgrade_step10_ui_router.py tests/test_cfb_over_under_upgrade_step9_environment_engine.py tests/test_cfb_over_under_upgrade_step9_slate.py tests/test_cfb_over_under_upgrade_step9_ui_router.py tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Final permanent-freeze firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_certification_v1.py",
              "cfb_over_under_slate_v11.py",
              "cfb_over_under_matchup_ui_v12.py",
              "streamlit_memory_lazy_router_v52.py",
          ))
          required=[
              'FROZEN_STEP11_SLATE = "cfb_over_under_slate_v10"',
              'CERTIFIED_UPGRADE_STEPS = tuple(range(1, 13))',
              'PROJECTION_MATH_CHANGED = False',
              'SELECTION_MATH_CHANGED = False',
              'RELIABILITY_CHANGED = False',
              'STRUCTURAL_SIGMA_CHANGED = False',
              'QUALIFICATION_THRESHOLDS_CHANGED = False',
              'FROZEN_SLATE = "cfb_over_under_slate_v10"',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v11"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v51"',
          ]
          for token in required:
              if token not in combined: raise SystemExit(f"missing final frozen marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower: raise SystemExit(f"final freeze crossed firewall: {token}")
          print("CFB_OU_UPGRADE_STEP12_FINAL_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - name: Final permanent freeze marker
        run: echo CFB_OU_OVER_UNDER_UPGRADE_12_OF_12_PERMANENTLY_FROZEN_GREEN
