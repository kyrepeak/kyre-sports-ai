name: MLB Step9C mapping fallback fix one-shot

on:
  push:
    branches: [mlb-step9c-live-state-consumer-integration]
    paths: [.github/workflows/mlb-step9c-mapping-fallback-fix-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mlb-step9c-live-state-consumer-integration
          fetch-depth: 0
      - name: Repair mapping fallback with exact indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mlb_step9c_live_state_consumer_v1.py')
          text = p.read_text()
          start_marker = '    def state_api_first(feed):\n'
          end_marker = '    state_api_first._step9c_legacy = legacy_state\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('STEP9C_STATE_WRAPPER_BOUNDARY_NOT_FOUND')

          lines = [
              '    def state_api_first(feed):',
              '        if isinstance(feed, Mapping) and TAG in feed:',
              '            context = feed.get(TAG)',
              '            meta = _CURRENT_GAME.get()',
              '            try:',
              '                if isinstance(context, Mapping) and isinstance(meta, Mapping):',
              '                    return _state_from_context(context, meta, v19_module=v19)',
              '                raise RuntimeError("Step 9C tagged state missing exact selected-game metadata")',
              '            except Exception as exc:',
              '                game_id = _strict_positive_int(',
              '                    context.get("official_game_id") if isinstance(context, Mapping) else None',
              '                )',
              '                _LAST_STATUS.update({',
              '                    "api_used": False,',
              '                    "legacy_fallback_used": True,',
              '                    "failure": type(exc).__name__,',
              '                })',
              '                if game_id is not None:',
              '                    return legacy_state(legacy_feed(game_id))',
              '                raise',
              '        return legacy_state(feed)',
              '',
              '',
          ]
          new = '\n'.join(lines)
          p.write_text(text[:start] + new + text[end:])
          PY
          python -m py_compile mlb_step9c_live_state_consumer_v1.py tests/test_mlb_step9c_live_state_consumer_v1.py
          git diff --check
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb_step9c_live_state_consumer_v1.py
          git commit -m "Repair MLB Step 9C mapping fallback indentation"
          git push origin HEAD:mlb-step9c-live-state-consumer-integration
