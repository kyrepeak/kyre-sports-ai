name: NFL Passing Yards Step 2 QB Identity

on:
  push:
    branches:
      - "monster/nfl-passing-step2-preserve-qb-identity-v1"
    paths:
      - "nfl_prop_app_eligibility_v1.py"
      - "tests/test_nfl_passing_yards_step2_preserve_qb_identity_v1.py"
      - ".github/workflows/nfl-passing-yards-step2-qb-identity-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-passing-step2-qb-identity-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Prove verified QB identity survives closed prop availability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_nfl_passing_yards_step2_preserve_qb_identity_v1.py
          echo "NFL_PASSING_STEP2_QB_IDENTITY_GREEN"
