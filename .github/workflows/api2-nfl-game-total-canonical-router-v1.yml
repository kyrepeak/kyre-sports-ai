name: API2 NFL Game Total Canonical Router V1

on:
  pull_request:
    branches:
      - api2-main
    paths:
      - 'api2_universal_sports_router_registry_v1.py'
      - 'universal_runtime_v5_loader.py'
      - 'nfl_game_totals_compact_layout_v1.py'
      - 'nfl_game_totals_hub_v10.py'
      - 'nfl_hub_v36.py'
      - 'streamlit_memory_lazy_router_v97.py'
      - 'tests/test_api2_nfl_game_total_canonical_router_v1.py'
      - 'tests/test_nfl_game_totals_compact_layout_v1.py'
      - 'tests/test_api2_step2e_universal_router_completion_v1.py'
      - '.github/workflows/api2-nfl-game-total-canonical-router-v1.yml'

permissions:
  contents: read

jobs:
  nfl-game-total-router-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile canonical route boundary
        run: |
          python -m py_compile \
            api2_universal_sports_router_registry_v1.py \
            universal_runtime_v5_loader.py \
            nfl_game_totals_compact_layout_v1.py \
            nfl_game_totals_hub_v10.py \
            nfl_hub_v36.py \
            streamlit_memory_lazy_router_v97.py
      - name: Game Total canonical ownership + compact V10 + Step 2E proof
        run: |
          python -m pytest -q --noconftest \
            tests/test_api2_nfl_game_total_canonical_router_v1.py \
            tests/test_nfl_game_totals_compact_layout_v1.py \
            tests/test_api2_step2e_universal_router_completion_v1.py
