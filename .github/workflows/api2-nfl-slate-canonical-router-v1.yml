name: API2 NFL Slate Canonical Router V1

on:
  pull_request:
    branches:
      - api2-main
    paths:
      - 'sports_api/api/nfl_slate_v1.py'
      - 'nfl_slate_gateway_v1.py'
      - 'nfl_slate_runtime_v1.py'
      - 'api2_universal_sports_router_registry_v1.py'
      - 'universal_runtime_v5_loader.py'
      - 'kyre_sports_api_vercel_v1.py'
      - 'tests/test_api2_nfl_slate_canonical_router_v1.py'
      - 'tests/test_api2_step2e_universal_router_completion_v1.py'
      - '.github/workflows/api2-nfl-slate-canonical-router-v1.yml'

permissions:
  contents: read

jobs:
  nfl-slate-router-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests
      - name: Compile route boundary
        run: |
          python -m py_compile api2_universal_sports_router_registry_v1.py universal_runtime_v5_loader.py kyre_sports_api_vercel_v1.py
          if [ -f nfl_slate_gateway_v1.py ]; then python -m py_compile nfl_slate_gateway_v1.py; fi
          if [ -f nfl_slate_runtime_v1.py ]; then python -m py_compile nfl_slate_runtime_v1.py; fi
          if [ -f sports_api/api/nfl_slate_v1.py ]; then python -m py_compile sports_api/api/nfl_slate_v1.py; fi
      - name: NFL Slate canonical ownership + Step 2E regression proof
        run: |
          python -m pytest -q --noconftest \
            tests/test_api2_nfl_slate_canonical_router_v1.py \
            tests/test_api2_step2e_universal_router_completion_v1.py
