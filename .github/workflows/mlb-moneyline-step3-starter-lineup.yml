name: MLB Moneyline Step 3 starter-vs-lineup certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/mlb-moneyline-step3-starter-lineup']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify frozen Moneyline Steps 1-2 boundary
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(pathlib.Path("mlb_moneyline_freeze_manifest_v2.json").read_text())
          failures = []
          for path, expected in manifest["exact_blobs"].items():
              try:
                  actual = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{path}"], text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen Moneyline Steps 1-2 changed: {path} expected={expected} actual={actual}"
                  )
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("MLB_MONEYLINE_STEPS_1_2_BOUNDARY=PASS")
          PY

      - name: Compile Step 3 route and evidence layer
        run: |
          python -m py_compile \
            app.py \
            mlb_moneyline_hub_v168.py \
            streamlit_memory_lazy_router_v6.py \
            tests/test_mlb_moneyline_step3_starter_lineup.py \
            tests/test_streamlit_memory_lazy_router_v6.py
          PYTHONPATH=. python -c "import mlb_moneyline_hub_v168; import streamlit_memory_lazy_router_v6"

      - name: Prove additive app bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("app.py").read_text(encoding="utf-8")
          if "streamlit_memory_lazy_router_v6" not in text:
              raise SystemExit("Router V6 is not the Streamlit bootstrap")
          if "streamlit_memory_lazy_router_v1" not in text:
              raise SystemExit("lazy-router bootstrap lineage marker missing")
          print("MLB_MONEYLINE_STEP3_BOOTSTRAP=PASS")
          PY

      - name: Run Step 3 focused contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_moneyline_step3_starter_lineup.py \
            tests/test_streamlit_memory_lazy_router_v6.py \
            test_mlb_moneyline_v167.py \
            test_streamlit_memory_lazy_router_v5.py

      - name: Certification marker
        run: echo "MLB_MONEYLINE_STEP3_STARTER_LINEUP_GREEN"
