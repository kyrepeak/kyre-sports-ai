name: Monster Speed V3 Step 3 WNBA Cache Repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-speed-v3-step3-wnba-cache-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fresh repaired WNBA environment
        shell: bash
        run: |
          python -m venv .venv-step3-wnba-repair
          .venv-step3-wnba-repair/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          if [ -f sports_api/requirements.txt ]; then .venv-step3-wnba-repair/bin/python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt; fi
          .venv-step3-wnba-repair/bin/python -m pip install --disable-pip-version-check -q pytest
      - name: Prove pandas and exact WNBA critical path
        shell: bash
        run: |
          .venv-step3-wnba-repair/bin/python -c "import pandas; print('WNBA_PANDAS_DEPENDENCY_GREEN')"
          .venv-step3-wnba-repair/bin/python -m pytest -q \
            tests/test_wnba_step20b_runtime_acceleration.py \
            tests/test_wnba_step20b_monte_carlo_acceleration.py \
            tests/test_wnba_step20b_step2_exact_reuse_timing.py \
            tests/test_wnba_pra_api_market_bridge_v1.py \
            tests/test_wnba_pra_page_cleanup_v1.py
      - name: Freeze repair token
        run: echo "MONSTER_SPEED_V3_STEP3_WNBA_CACHE_REPAIR_GREEN"
