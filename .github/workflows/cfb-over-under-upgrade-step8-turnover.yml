name: CFB O/U Upgrade Step 8 turnover volatility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cfb-ou-upgrade-step8-turnover-field-position]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive Step 8 scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess, sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-upgrade-step8-turnover.yml",
              "app.py",
              "cfb_over_under_turnover_engine_v1.py",
              "cfb_over_under_slate_v7.py",
              "cfb_over_under_matchup_ui_v8.py",
              "streamlit_memory_lazy_router_v48.py",
              "tests/test_cfb_over_under_upgrade_step8_turnover_engine.py",
              "tests/test_cfb_over_under_upgrade_step8_slate.py",
              "tests/test_cfb_over_under_upgrade_step8_ui_router.py",
          }
          if actual != expected:
              print("expected", sorted(expected))
              print("actual", sorted(actual))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP8_SCOPE=PASS")
          PY

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_freeze_manifest_v12.json") != "3ff2a727967e80dddbe03f747d9f32090cc39539":
              failures.append("CFB Step-12 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen CFB path changed: {path}")
          if failures:
              print(*failures, sep="\n")
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 through 7 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v7.json") != "1c17321eeca073b3022b0c82c3e4ec10bc9727ae":
              failures.append("O/U Upgrade Step 7 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v7.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen Upgrade Step 1-7 path changed: {path}")
          if failures:
              print(*failures, sep="\n")
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_7_FROZEN=PASS")
          PY

      - name: Enforce logo hotfix V1 through V4 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_logo_hotfix_freeze_manifest_v4.json") != "b5b42535b0771a6e15d1f8581de325777f3c4177":
              failures.append("logo V4 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v4.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen logo V1-V4 path changed: {path}")
          if failures:
              print(*failures, sep="\n")
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_V4_FROZEN=PASS")
          PY

      - name: Compile Step 8
        run: |
          python - <<'PY'
          import py_compile
          files=[
              "app.py",
              "cfb_over_under_turnover_engine_v1.py",
              "cfb_over_under_slate_v7.py",
              "cfb_over_under_matchup_ui_v8.py",
              "streamlit_memory_lazy_router_v48.py",
              "tests/test_cfb_over_under_upgrade_step8_turnover_engine.py",
              "tests/test_cfb_over_under_upgrade_step8_slate.py",
              "tests/test_cfb_over_under_upgrade_step8_ui_router.py",
          ]
          for path in files:
              py_compile.compile(path,doraise=True)
          print("CFB_OU_UPGRADE_STEP8_COMPILE=PASS")
          PY
          PYTHONPATH=. python -c "import cfb_over_under_turnover_engine_v1; import cfb_over_under_slate_v7; import cfb_over_under_matchup_ui_v8; import streamlit_memory_lazy_router_v48"

      - name: Run Step 8 and frozen regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live NCAA turnover tables retain zero/tied rows
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_turnover_engine_v1 as to
          to.clear_turnover_engine_cache()
          for division, expected_rows in (("FBS",137),("FCS",116)):
              bundle,diag=to._load_turnover_division(division)
              table=bundle.get("table") or {}
              baselines=bundle.get("baselines") or {}
              print(division,"rows",len(table),"baselines",baselines)
              if len(table) != expected_rows:
                  raise SystemExit(f"{division} turnover table coverage mismatch")
              for key in ("giveaways_per_game","takeaways_per_game"):
                  if baselines.get(key) is None:
                      raise SystemExit(f"{division} turnover baseline missing: {key}")
          print("LIVE_NCAA_TURNOVER_TIE_SAFE_TABLES=PASS")
          PY

      - name: Live Florida A&M at Miami Step 8 analysis
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v7 as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          try:
              slate.analyze_game.clear()
          except Exception:
              pass

          result=slate.analyze_game(game,"2026-09-10",50.5)
          engine=result.get("turnover_engine") or {}
          raw=result.get("raw") or {}
          step7=result.get("step7_raw") or {}
          away=engine.get("away_offense") or {}
          home=engine.get("home_offense") or {}

          print("TURNOVER",json.dumps({
              "away_division":engine.get("away_division"),
              "home_division":engine.get("home_division"),
              "mixed_division":engine.get("mixed_division"),
              "away_coverage":away.get("coverage"),
              "home_coverage":home.get("coverage"),
              "away_sample":away.get("sample_factor"),
              "home_sample":home.get("sample_factor"),
              "away_signal":away.get("shrunk_signal"),
              "home_signal":home.get("shrunk_signal"),
              "total_volatility_signal":engine.get("total_volatility_signal"),
              "sigma_adjustment":engine.get("sigma_adjustment"),
              "step7_total":step7.get("projected_total"),
              "step8_total":raw.get("projected_total"),
              "step7_sigma":step7.get("structural_total_sigma"),
              "step8_sigma":raw.get("structural_total_sigma"),
              "away_offense":away.get("offense"),
              "away_defense":away.get("defense"),
              "home_offense":home.get("offense"),
              "home_defense":home.get("defense"),
          },indent=2))

          if not raw.get("ready") or not engine.get("model_ready") or not raw.get("upgrade_step8_applied"):
              raise SystemExit("Step 8 live model did not apply")
          if engine.get("away_division") != "FCS" or engine.get("home_division") != "FBS" or not engine.get("mixed_division"):
              raise SystemExit("Step 8 FCS/FBS identity resolution is wrong")
          if float(away.get("coverage") or 0.0) != 1.0 or float(home.get("coverage") or 0.0) != 1.0:
              raise SystemExit("Step 8 turnover direct coverage must be 100%")
          if abs(float(engine.get("sigma_adjustment") or 0.0)) > 1.250001:
              raise SystemExit("Step 8 sigma adjustment exceeded cap")
          if float(raw.get("analysis_line_turnover_weight") or 0.0) != 0.0:
              raise SystemExit("analysis line leaked into turnover engine")
          if float(raw.get("projected_total_turnover_weight") or 0.0) != 0.0:
              raise SystemExit("turnover engine moved projected total by policy")
          if float(raw.get("projected_total")) != float(step7.get("projected_total")):
              raise SystemExit("Step 8 changed Step-7 projected total")
          if float(raw.get("projected_away_points")) != float(step7.get("projected_away_points")):
              raise SystemExit("Step 8 changed Step-7 away points")
          if float(raw.get("projected_home_points")) != float(step7.get("projected_home_points")):
              raise SystemExit("Step 8 changed Step-7 home points")
          if engine.get("field_position_data_available") is not False or engine.get("field_position_points_adjustment_used") is not False:
              raise SystemExit("Step 8 fabricated field-position point value")
          if engine.get("rankless_tie_safe_parser_active") is not True or engine.get("cross_division_rank_comparison_used") is not False:
              raise SystemExit("Step 8 parser/rank firewall failed")

          aoff=away.get("offense") or {}
          adef=away.get("defense") or {}
          hoff=home.get("offense") or {}
          hdef=home.get("defense") or {}
          if float(aoff.get("turnovers_gained") or 0) != 4.0 or float(aoff.get("turnovers_lost") or 0) != 1.0:
              raise SystemExit("Florida A&M turnover evidence mismatch")
          if float(adef.get("turnovers_gained") or 0) != 0.0 or float(adef.get("turnovers_lost") or 0) != 1.0:
              raise SystemExit("Miami turnover evidence mismatch")
          if float(hoff.get("turnovers_gained") or 0) != 0.0 or float(hoff.get("turnovers_lost") or 0) != 1.0:
              raise SystemExit("Miami offense turnover evidence mismatch")
          if float(hdef.get("turnovers_gained") or 0) != 4.0 or float(hdef.get("turnovers_lost") or 0) != 1.0:
              raise SystemExit("Florida A&M defense turnover evidence mismatch")
          print("LIVE_FAMU_MIAMI_STEP8_TURNOVER=PASS")
          PY

      - name: Live hero retains frozen stack and adds Step 8
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v7 as slate
          import cfb_over_under_matchup_ui_v8 as ui
          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          result=slate.analyze_game(game,"2026-09-10",50.5)
          html=ui._hero_v8(game,result.get("away") or {},result.get("home") or {})
          for token in ("TEAM LOGOS VERIFIED","UPGRADE STEP 4","UPGRADE STEP 5","UPGRADE STEP 6","UPGRADE STEP 7","UPGRADE STEP 8"):
              if token not in html:
                  raise SystemExit(f"active Step 8 hero missing: {token}")
          if "does not invent a points adjustment" not in html:
              raise SystemExit("Step 8 no-field-position-fabrication disclosure missing")
          print("LIVE_STEP8_HERO_STACK=PASS")
          PY

      - name: Prove Step 8 model firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_turnover_engine_v1.py",
              "cfb_over_under_slate_v7.py",
              "cfb_over_under_matchup_ui_v8.py",
              "streamlit_memory_lazy_router_v48.py",
              "app.py",
          ))
          required=[
              'FROZEN_STEP7_ENGINE = "cfb_over_under_third_down_engine_v1"',
              'MAX_TOTAL_SIGMA_ADJUSTMENT = 1.25',
              'MIN_SIDE_COVERAGE = 1.00',
              'OFFENSE_GIVEAWAY_WEIGHT = 0.50',
              'DEFENSE_TAKEAWAY_WEIGHT = 0.50',
              'FULL_SAMPLE_GAMES = 6.0',
              'ANALYSIS_LINE_TURNOVER_WEIGHT = 0.0',
              'PROJECTED_TOTAL_TURNOVER_WEIGHT = 0.0',
              '"field_position_data_available": False',
              '"field_position_points_adjustment_used": False',
              '"rankless_tie_safe_parser_active": True',
              '"cross_division_rank_comparison_used": False',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v7"',
              'root._import("cfb_over_under_matchup_ui_v8")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v47"',
              'from streamlit_memory_lazy_router_v48 import render_app',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 8 marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"Step 8 crossed model firewall: {token}")
          print("CFB_OU_UPGRADE_STEP8_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo CFB_OU_UPGRADE_STEP8_TURNOVER_GREEN
