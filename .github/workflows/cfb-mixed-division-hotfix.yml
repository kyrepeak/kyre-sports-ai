name: College Football mixed-division hotfix certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/cfb-mixed-division-schedule-hotfix']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact hotfix scope
        if: github.event_name == 'push' || github.head_ref == 'fix/cfb-mixed-division-schedule-hotfix'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-mixed-division-hotfix.yml' \
            '.github/workflows/cfb-step5-moneyline-model-v1.yml' \
            'app.py' \
            'cfb_moneyline_hub_v3.py' \
            'cfb_schedule_v2.py' \
            'cfb_team_data_v2.py' \
            'streamlit_memory_lazy_router_v28.py' \
            'tests/test_cfb_mixed_division_hotfix.py' \
            'tests/test_cfb_moneyline_mixed_division_wrapper.py' \
            'tests/test_streamlit_memory_lazy_router_v28.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB mixed-division hotfix scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_MIXED_DIVISION_HOTFIX_SCOPE=PASS"

      - name: Enforce frozen College Football Steps 1 through 5
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v5.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 5 or m.get("completed_steps") != [1,2,3,4,5]:
              failures.append("CFB freeze V5 metadata changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Steps 1-5 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEPS_1_5_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_MIXED_DIVISION_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile hotfix
        run: |
          python -m py_compile \
            app.py \
            cfb_schedule_v2.py \
            cfb_team_data_v2.py \
            cfb_moneyline_hub_v3.py \
            streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py
          PYTHONPATH=. python -c "import cfb_schedule_v2; import cfb_team_data_v2; import cfb_moneyline_hub_v3; import streamlit_memory_lazy_router_v28"

      - name: Run hotfix + frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove additive data-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          schedule = Path("cfb_schedule_v2.py").read_text(encoding="utf-8")
          team = Path("cfb_team_data_v2.py").read_text(encoding="utf-8")
          hub = Path("cfb_moneyline_hub_v3.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v28.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          required = [
              'FROZEN_SCHEDULE = "cfb_schedule_v1"',
              'NCAA_FCS_DIVISION = 12',
              'ESPN_FBS_GROUP = 80',
              'FROZEN_TEAM_DATA = "cfb_team_data_v1"',
              'FROZEN_CFB_MONEYLINE_HUB = "cfb_moneyline_hub_v2"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v27"',
              'root._import("cfb_moneyline_hub_v3")',
          ]
          combined = schedule + "\n" + team + "\n" + hub + "\n" + router
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing hotfix boundary marker: {token}")

          forbidden = [
              "def win_probability",
              "fair_moneyline =",
              "expected_value =",
              "np.random",
              "def simulate",
              "moneyline_price =",
          ]
          for token in forbidden:
              if token in schedule or token in team:
                  raise SystemExit(f"hotfix crossed data boundary: {token}")

          if "streamlit_memory_lazy_router_v28" not in app:
              raise SystemExit("app.py is not booting Router V28")

          print("CFB_MIXED_DIVISION_DATA_ONLY_BOUNDARY=PASS")
          PY

      - name: Live Sept 10 crossover smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          import time
          import cfb_schedule_v2 as schedule

          target = None
          last_diag = {}
          for attempt in range(3):
              schedule.clear_schedule_cache()
              games, diag = schedule.load_with_diagnostics("2026-09-10")
              last_diag = diag
              for game in games:
                  away = str(game.get("away_team") or "").lower()
                  home = str(game.get("home_team") or "").lower()
                  if "florida a&m" in away and "miami" in home:
                      target = game
                      break
              if target:
                  break
              time.sleep(3)

          print("LIVE_DIAG", last_diag)
          print("LIVE_TARGET", target)
          if target is None:
              raise SystemExit("Florida A&M @ Miami was not recovered on 2026-09-10")
          if not target.get("identity_verified"):
              raise SystemExit("Recovered crossover identity is not verified")
          if not target.get("mixed_division_supplement"):
              raise SystemExit("Recovered game is missing crossover-supplement marker")
          if not str(target.get("identity_key") or "").startswith("ncaa:"):
              raise SystemExit("Recovered game did not preserve NCAA contest identity")

          print("CFB_SEPT10_FAMU_MIAMI_LIVE_SMOKE=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_MIXED_DIVISION_HOTFIX_GREEN"
