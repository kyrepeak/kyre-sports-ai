name: MLB production API smoke

on:
  push:
    branches:
      - mlb-live-odds-release-20260831
    paths:
      - .github/workflows/mlb-production-api-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-render-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Poll deployed Render MLB odds endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://kyre-sports-api.onrender.com/api/v1/mlb/odds'
          query = urllib.parse.urlencode({'max_events': 30, 'fully_priced_only': 'true'})
          url = f'{base}?{query}'
          last_error = None

          for attempt in range(1, 31):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'Accept': 'application/json', 'User-Agent': 'KyreSportsProductionSmoke/1.0'},
                      method='GET',
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = int(response.status)
                      raw = response.read(2_000_000)
                  payload = json.loads(raw.decode('utf-8'))
                  if status != 200:
                      raise RuntimeError(f'HTTP {status}')
                  if payload.get('data_type') != 'mlb_live_odds_api_response_v1':
                      raise RuntimeError(f"unexpected data_type {payload.get('data_type')!r}")
                  if payload.get('schema_version') != 1:
                      raise RuntimeError(f"unexpected schema_version {payload.get('schema_version')!r}")
                  if payload.get('source') != 'FanDuel':
                      raise RuntimeError(f"unexpected source {payload.get('source')!r}")
                  if payload.get('transport') != 'anonymous_public_get_only':
                      raise RuntimeError(f"unexpected transport {payload.get('transport')!r}")
                  if payload.get('http_methods') != ['GET']:
                      raise RuntimeError(f"unexpected http_methods {payload.get('http_methods')!r}")
                  if int(payload.get('game_count') or 0) <= 0:
                      raise RuntimeError('no fully priced production games')

                  evidence = {
                      'certification_result': 'GREEN',
                      'url': url,
                      'http_status': status,
                      'data_type': payload.get('data_type'),
                      'schema_version': payload.get('schema_version'),
                      'source': payload.get('source'),
                      'transport': payload.get('transport'),
                      'http_methods': payload.get('http_methods'),
                      'game_count': payload.get('game_count'),
                      'matched_game_count': payload.get('matched_game_count'),
                      'fully_priced_game_count': payload.get('fully_priced_game_count'),
                      'collected_at_utc': payload.get('collected_at_utc'),
                      'attempt': attempt,
                  }
                  print(json.dumps(evidence, indent=2, sort_keys=True))
                  print('MLB_PRODUCTION_RENDER_ENDPOINT_GREEN')
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
                  print(f'Attempt {attempt}/30 not green yet: {last_error}')
                  if attempt < 30:
                      time.sleep(15)

          raise SystemExit(f'MLB_PRODUCTION_RENDER_ENDPOINT_NOT_GREEN: {last_error}')
          PY
