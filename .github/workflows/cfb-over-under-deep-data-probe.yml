name: CFB O/U deep data provider probe

on:
  push:
    branches: [cfb-ou-deep-data-reconciliation-v1]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe ESPN current data schemas
        run: |
          python - <<'PY'
          import json, requests
          def get(url):
              for headers in (
                  {"Accept":"application/json,text/plain,*/*"},
                  {"User-Agent":"KyreSportsAI/1.0","Accept":"application/json"},
                  {},
              ):
                  try:
                      r=requests.get(url,timeout=20,headers=headers)
                      print("\nURL",url,"STATUS",r.status_code,"LEN",len(r.content),"UA",headers.get("User-Agent"))
                      if r.status_code==200:
                          return r.json()
                  except Exception as exc:
                      print("ERR",type(exc).__name__,exc)
              return {}

          for team_id,name in [("2390","Miami"),("50","Florida A&M")]:
              coaches=get(f"https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/teams/{team_id}/coaches?lang=en&region=us")
              print(name,"COACHES",json.dumps(coaches,indent=2)[:16000])
              for item in (coaches.get("items") or [])[:4]:
                  ref=item.get("$ref") if isinstance(item,dict) else None
                  if ref:
                      detail=get(ref)
                      print(name,"COACH_DETAIL",json.dumps(detail,indent=2)[:12000])

              ranks=get(f"https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/weeks/2/teams/{team_id}/ranks?lang=en&region=us")
              print(name,"RANKS",json.dumps(ranks,indent=2)[:16000])
              for item in (ranks.get("items") or [])[:6]:
                  ref=item.get("$ref") if isinstance(item,dict) else None
                  if ref:
                      detail=get(ref)
                      print(name,"RANK_DETAIL",json.dumps(detail,indent=2)[:12000])

          summary=get("https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=401858213")
          print("SUMMARY_HEADER",json.dumps(summary.get("header"),indent=2)[:18000])
          print("SUMMARY_GAMEINFO",json.dumps(summary.get("gameInfo"),indent=2)[:10000])
          print("SUMMARY_BROADCASTS",json.dumps(summary.get("broadcasts"),indent=2)[:10000])
          PY
