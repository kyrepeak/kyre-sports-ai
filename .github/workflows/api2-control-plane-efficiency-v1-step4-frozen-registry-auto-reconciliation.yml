name: API2 Control-Plane Efficiency V1 Step 4 Frozen Registry Auto-Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.yml"
      - "devsystem/frozen_registry_auto_reconciler_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.json"
      - "tests/test_devsystem_frozen_registry_auto_reconciler_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.yml"
      - "devsystem/frozen_registry_auto_reconciler_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step4-frozen-registry-auto-reconciliation.json"
      - "tests/test_devsystem_frozen_registry_auto_reconciler_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api2-control-plane-efficiency-v1-step4-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry-auto-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 4 permanent contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile devsystem/frozen_registry_auto_reconciler_v1.py
          python -m pytest -q             tests/test_devsystem_frozen_registry_auto_reconciler_v1.py             tests/test_devsystem_api2_frozen_registry_lifecycle_v1.py
          python devsystem/frozen_registry_auto_reconciler_v1.py self-test
      - name: Audit current head for registry reconciliation need
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/registry.json
          python devsystem/frozen_registry_auto_reconciler_v1.py plan-git-head             --registry-file /tmp/registry.json             --head HEAD             --json-out /tmp/reconciliation.json
          cat /tmp/reconciliation.json
      - name: Prove exact PR head preserves frozen parents
        if: github.event_name == 'pull_request'
        run: |
          python devsystem/frozen_artifact_registry_v1.py verify-head             --registry-file /tmp/registry.json             --head HEAD
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP4_FROZEN_PARENTS_GREEN"
      - name: Certify exact PR head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP4_BRANCH_GREEN"
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP4_READY_TO_MERGE"
      - name: Certify merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP4_MAIN_GREEN"
