name: Production Theme Activation Step 3 Live Visual Proof

on:
  push:
    branches:
      - "monster/production-theme-activation-step3-live-proof-v1"
    paths:
      - ".github/workflows/production-theme-activation-step3-live-proof-v1.yml"

permissions:
  contents: read

jobs:
  live-visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Prove live universal theme surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import requests
          from playwright.sync_api import sync_playwright

          sys.path.insert(0, str(Path.cwd() / "devsystem"))
          import nfl_passing_yards_public_prod_cert_v1 as prod

          url = "https://kyre-sports-ai.streamlit.app"

          health = requests.get(url + "/_stcore/health", timeout=30)
          assert health.status_code == 200, health.status_code

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto(url, wait_until="domcontentloaded", timeout=120000)

              frame, scans = prod._find_app_frame(page, timeout_seconds=120.0)
              body = prod._body(frame)

              assert "UNIVERSAL THEME LIVE" in body, body[:3000]
              assert "KYRE SPORTS AI" in body, body[:3000]

              topbar = frame.locator('[data-kyre-sitewide-topbar="v1"]')
              assert topbar.count() >= 1
              assert topbar.first.is_visible()

              print("PRODUCTION_THEME_STEP3_LIVE_VISUAL_GREEN")
              print("FRAME_URL", frame.url)
              print("VISIBLE_MARKER", "UNIVERSAL THEME LIVE")
              print("FRAME_SCANS", len(scans))
              browser.close()
          PY
