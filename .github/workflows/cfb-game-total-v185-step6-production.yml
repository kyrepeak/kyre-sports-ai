name: CFB Game Total V185 Step 6 production verification

on:
  pull_request:
    branches: [main]
    paths:
      - "devsystem/production_verify_step6_v185.py"
      - "tests/test_devsystem_production_verify_step6_v185.py"
      - "devsystem/task_ledgers/cfb-game-total-v185-step6-visual-parity.json"
      - ".github/workflows/cfb-game-total-v185-step6-production.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/production_verify_step6_v185.py"
      - "tests/test_devsystem_production_verify_step6_v185.py"
      - "devsystem/task_ledgers/cfb-game-total-v185-step6-visual-parity.json"
      - ".github/workflows/cfb-game-total-v185-step6-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v185-step6-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-step6-v185-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install V185 production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V185 production verifier
        run: |
          python -m py_compile devsystem/production_verify_step6_v185.py

      - name: Self-test V185 production contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_devsystem_production_verify_step6_v185.py \
            tests/test_devsystem_production_verify_step6_v184.py \
            tests/test_cfb_game_total_v185_step6_visual_parity.py

      - name: Prove live V185 visual parity and frozen Step 6 data contract
        if: github.event_name != 'pull_request'
        run: |
          python -m devsystem.production_verify_step6_v185 \
            --artifact-dir artifacts/production-step6-v185

      - name: Upload V185 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v185-step6-production-${{ github.run_id }}
          path: artifacts/production-step6-v185
          if-no-files-found: warn
          retention-days: 14
