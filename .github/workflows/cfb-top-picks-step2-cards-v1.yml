name: CFB Top Picks Step 2 compact cards

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-step2-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step2-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore shared Browser QA stack
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}
      - name: Build Browser QA stack on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium
      - name: Activate Browser QA virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Static Step 2 contract
        run: python -m pytest -q tests/test_cfb_top_picks_step2_cards_v1.py
      - name: Compile Step 2 owners
        run: |
          python -m py_compile cfb_top_picks_page_v2.py
          python -m py_compile streamlit_memory_lazy_router_v242.py
          python -m py_compile devsystem/cfb_top_picks_step2_browser_qa_v1.py
      - name: Start branch-local Streamlit
        shell: bash
        run: |
          mkdir -p artifacts/cfb-top-picks-step2
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/cfb-top-picks-step2/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_top_picks_step2_pid
      - name: Drive compact 10-card board
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/cfb_top_picks_step2_browser_qa_v1.py --base-url http://127.0.0.1:8501 --artifact-dir artifacts/cfb-top-picks-step2
      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 400 artifacts/cfb-top-picks-step2/streamlit.log || true
      - name: Upload Step 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-top-picks-step2-${{ github.run_id }}
          path: artifacts/cfb-top-picks-step2
          if-no-files-found: warn
          retention-days: 14
      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_top_picks_step2_pid ]; then
            kill "$(cat /tmp/cfb_top_picks_step2_pid)" 2>/dev/null || true
          fi
