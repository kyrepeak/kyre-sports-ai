name: MONSTER Step 2G Production Convergence V1

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "devsystem/monster_runtime_identity_v1.py"
      - "devsystem/monster_step2g_production_live_probe_v1.py"
      - "tests/test_devsystem_monster_step2g_production_convergence_v1.py"
      - "devsystem/runless_proof_plans/monster-step2g-production-convergence-v1.json"
      - "devsystem/task_ledgers/monster-step2g-production-convergence-v1.json"
      - ".github/workflows/monster-step2g-production-convergence-v1.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monster-step2g-production-convergence-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest
      - name: MONSTER production identity contract
        run: |
          python -m pytest --noconftest -q tests/test_devsystem_monster_step2g_production_convergence_v1.py
          python -m py_compile app.py devsystem/monster_runtime_identity_v1.py devsystem/monster_step2g_production_live_probe_v1.py

  live-production-proof:
    if: github.event_name == 'push'
    needs: production-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser proof dependency
        run: |
          python -m pip install -q playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Prove live shared-main MONSTER identity
        run: |
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python devsystem/monster_step2g_production_live_probe_v1.py \
            --url "https://pickvault.streamlit.app" \
            --expected-sha "${GITHUB_SHA}" \
            --expected-tree-sha "${TREE_SHA}" \
            --output "devsystem/evidence/monster_step2g_production_convergence_v1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-step2g-production-convergence-${{ github.sha }}
          path: devsystem/evidence/monster_step2g_production_convergence_v1.json
          if-no-files-found: warn
