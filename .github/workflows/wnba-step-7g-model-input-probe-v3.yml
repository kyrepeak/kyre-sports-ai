name: WNBA Step 7G real Step 4X probe v3

on:
  push:
    branches:
      - wnba-step7g-step4j-team-history-20260827
    paths:
      - '.github/workflows/wnba-step-7g-model-input-probe-v3.yml'
      - 'sports_api/tools/wnba_step7g_model_input_dependency_probe_v3.py'
      - 'sports_api/wnba_step7g_first_party_team_history.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step7g-real-step4x-probe-v3
  cancel-in-progress: false

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated Step 7G Step 4J branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert every production switch is OFF
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile post-Step4J real-chain probe
        run: |
          python -m py_compile \
            sports_api/tools/wnba_step7g_model_input_dependency_probe_v3.py \
            sports_api/wnba_step7g_first_party_team_history.py

      - name: Prove inherited dependency-chain files unchanged from exact Step 7G baseline
        shell: bash
        run: |
          EXPECTED_BASE_SHA='368dbde84ea0aa6f570703688ae899285ecd7cfc'
          git fetch origin wnba-step7g-official-data-preflight-20260827 --depth=1
          ACTUAL_BASE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          git diff --exit-code "$EXPECTED_BASE_SHA" -- \
            sports_api/wnba_team_history.py \
            sports_api/wnba_schedule.py \
            sports_api/wnba_schedule_context.py \
            sports_api/wnba_model_input_readiness.py \
            sports_api/wnba_player_event_features.py \
            sports_api/wnba_player_opportunity_context.py \
            sports_api/wnba_event_lineup_context.py \
            sports_api/wnba_rotation_context.py

      - name: Run real frozen Step 4X chain past certified Step 4J
        shell: bash
        run: python -m sports_api.tools.wnba_step7g_model_input_dependency_probe_v3

      - name: Upload sanitized dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-model-input-probe-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-model-input-dependency-probe-v3.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-assert every production switch is still OFF
        if: always()
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
