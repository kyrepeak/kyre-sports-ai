name: MLB Matchup Explorer cleanup Step 8 developer diagnostics certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step8-dev-diagnostics.yml'
      - 'app.py'
      - 'streamlit_memory_lazy_router_v2.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step8_dev_diagnostics.py'
  push:
    branches: ['mlb-matchup-explorer-cleanup-step8-dev-diagnostics']
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step8-dev-diagnostics.yml'
      - 'app.py'
      - 'streamlit_memory_lazy_router_v2.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step8_dev_diagnostics.py'

permissions:
  contents: read

jobs:
  certify:
    # Historical exact-scope certification belongs only to Cleanup Step 8.
    # Later additive route layers have their own dedicated certification.
    if: github.event_name == 'push' || github.head_ref == 'mlb-matchup-explorer-cleanup-step8-dev-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact cleanup Step 8 scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-explorer-cleanup-step8-dev-diagnostics.yml' \
            'app.py' \
            'streamlit_memory_lazy_router_v2.py' \
            'tests/test_mlb_matchup_explorer_cleanup_step8_dev_diagnostics.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup Explorer cleanup Step 8 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CLEANUP_STEP8_EXACT_FOUR_FILE_SCOPE=PASS"

      - name: Prove frozen router, Matchup V2 and rankings are untouched
        run: |
          for path in \
            streamlit_memory_lazy_router_v1.py \
            mlb_matchup_hub_v48.py \
            mlb_matchup_hub_v47.py \
            mlb_matchup_hub_v46.py \
            mlb_matchup_hub_v45.py \
            mlb_matchup_hub_v44.py \
            mlb_matchup_hub_v43.py \
            mlb_matchup_hub_v42.py \
            mlb_matchup_hub_v41.py \
            mlb_matchup_player_v35.py \
            mlb_matchup_probability_v1.py \
            mlb_matchup_calibration_v1.py \
            mlb_matchup_rankings_v21.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen routing/model boundary changed: $path"
              exit 1
            fi
          done
          echo "ROUTER_MATCHUP_V2_RANKING_FREEZE=PASS"

      - name: Prove Moneyline page is untouched
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline presentation changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_PAGE_FREEZE=PASS"

      - name: Compile cleanup presentation
        run: |
          python -m py_compile \
            app.py \
            streamlit_memory_lazy_router_v2.py \
            tests/test_mlb_matchup_explorer_cleanup_step8_dev_diagnostics.py

      - name: Run cleanup Step 8 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_explorer_cleanup_step8_dev_diagnostics.py

      - name: Certification marker
        run: echo "MLB_MATCHUP_EXPLORER_CLEANUP_STEP8_DEV_DIAGNOSTICS_GREEN"
