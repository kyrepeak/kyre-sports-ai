name: NFL Passing Yards API V1 cert

on:
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
    paths:
      - 'sports_api/collectors/nfl_fanduel_passing_yards.py'
      - 'sports_api/api/nfl_passing_yards_market_v1.py'
      - 'sports_api/api/health.py'
      - 'sports_api/tests/test_nfl_passing_yards_api_v1.py'
      - 'devsystem/nfl_passing_yards_api_live_cert_v1.py'
      - '.github/workflows/nfl-passing-yards-api-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-passing-yards-api-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production API stack and pytest
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile new NFL Passing Yards API files
        run: |
          python -m py_compile sports_api/collectors/nfl_fanduel_passing_yards.py
          python -m py_compile sports_api/api/nfl_passing_yards_market_v1.py
          python -m py_compile devsystem/nfl_passing_yards_api_live_cert_v1.py
      - name: Run deterministic NFL Passing Yards API contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q sports_api/tests/test_nfl_passing_yards_api_v1.py
      - name: Revalidate shared-host production observability and startup contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_production_observability_backport_v1.py
      - name: Certify live exact-ID ESPN + FanDuel Passing Yards chain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_api_live_cert_v1.py
