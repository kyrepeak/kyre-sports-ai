name: NFL Game Totals Step 4 Source Probe

on:
  push:
    branches:
      - monster/nfl-game-totals-step4-source-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-pace-possession:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ESPN pace and possession stat labels
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/ari/statistics'
          url = base + '?' + urlencode({'season': 2026})
          request = Request(url, headers={
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0 kyre-sports-ai-step4-source-probe',
          })
          with urlopen(request, timeout=20) as response:
              print('HTTP_STATUS=' + str(getattr(response, 'status', 200)))
              payload = json.load(response)

          results = payload.get('results') or {}
          stats_root = results.get('stats') if isinstance(results, dict) else {}
          categories = stats_root.get('categories') if isinstance(stats_root, dict) else []
          if not isinstance(categories, list):
              categories = []

          print('RESULTS_KEYS=' + ','.join(sorted(str(k) for k in results.keys())) if isinstance(results, dict) else 'RESULTS_KEYS=')
          print('CATEGORY_COUNT=' + str(len(categories)))
          print('CATEGORY_NAMES=' + json.dumps([
              {
                  'name': category.get('name'),
                  'displayName': category.get('displayName'),
                  'stat_count': len(category.get('stats') or []) if isinstance(category.get('stats'), list) else 0,
              }
              for category in categories if isinstance(category, dict)
          ], sort_keys=True))

          pattern = re.compile(r'\b(possession|possessions|play|plays|drive|drives|snap|snaps|pace)\b', re.I)
          matches = []
          for category in categories:
              if not isinstance(category, dict):
                  continue
              category_name = str(category.get('displayName') or category.get('name') or '')
              for stat in category.get('stats') or []:
                  if not isinstance(stat, dict):
                      continue
                  searchable = ' '.join(str(stat.get(key) or '') for key in (
                      'name','displayName','shortDisplayName','description','abbreviation'
                  ))
                  if not pattern.search(searchable):
                      continue
                  matches.append({
                      'category': category_name,
                      'name': stat.get('name'),
                      'displayName': stat.get('displayName'),
                      'shortDisplayName': stat.get('shortDisplayName'),
                      'description': stat.get('description'),
                      'value': stat.get('value'),
                      'displayValue': stat.get('displayValue'),
                      'perGameValue': stat.get('perGameValue'),
                      'perGameDisplayValue': stat.get('perGameDisplayValue'),
                      'rank': stat.get('rank'),
                  })

          print('MATCH_COUNT=' + str(len(matches)))
          for item in matches:
              print('PACE_POSSESSION_STAT=' + json.dumps(item, sort_keys=True, default=str))
          PY
