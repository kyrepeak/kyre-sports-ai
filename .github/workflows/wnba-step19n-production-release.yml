name: WNBA Step19N guarded production release

on:
  push:
    branches:
      - wnba-step19n-production-release-20260830
    paths:
      - '.github/workflows/wnba-step19n-production-release.yml'

permissions:
  contents: read

concurrency:
  group: wnba-step19n-production-release
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}
  ROLLBACK_SHA: 222550f3d2db46d470e4ba050848a9110920fcab
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: wnba-render-staging
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
      WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
      WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

    steps:
      - name: Checkout exact Step19N candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Exact-candidate regression wall
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -m pytest -q tests/test_wnba_step11_fanduel_provider.py
          python -m pytest -q \
            tests/test_wnba_step19n_fanduel_empty_market.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19l_fanduel_identity_trace.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19j_runtime_acceleration.py \
            tests/test_wnba_step19i_official_slate_transport.py \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py \
            tests/test_wnba_step19e_cooldown_aware_cycle.py

      - name: Prove exact hosted chain and strict safety
        run: |
          python - <<'PY'
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19h_fanduel_hosted_transport as h
          from sports_api import wnba_step19k_market_not_ready as k
          from sports_api import wnba_step19l_fanduel_identity_trace as l
          from sports_api import wnba_step19m_fanduel_line_move as m
          from sports_api import wnba_step19n_fanduel_empty_market as n
          import sports_api.api.wnba_step17b_runtime

          assert fd.fetch_step11c_fanduel_provider_bridge is l.fetch_step11c_with_identity_trace
          assert l._UPSTREAM_FETCH_STEP11C is h.fetch_step11c_with_transport_probe
          assert fd._market_identity_surface is m.market_identity_surface_step19m
          assert m._UPSTREAM_IDENTITY_SURFACE is l.market_identity_surface_step19l
          assert s12b.run_step12b_live_runtime_job is n.run_step12b_fanduel_empty_market_compatible
          assert n._UPSTREAM_RUN_STEP12B is k.run_step12b_market_not_ready_compatible
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          mg=m.installation_status()['guardrails']; ng=n.installation_status()['guardrails']
          for key in ('selection_id_change_allowed','runner_side_change_allowed','market_type_change_allowed','player_identity_change_allowed','different_lines_blended','exact_line_matching_modified','official_game_reconciliation_modified','official_roster_reconciliation_modified','projection_logic_modified','monte_carlo_simulation_count_modified','readiness_relaxed','provider_retry_policy_modified','controller_state_modified','persistence_modified','wagering_enabled'):
              assert mg[key] is False, key
          for key in ('identity_failure_reclassified','transport_failure_reclassified','upstream_failure_reclassified','landing_page_failure_reclassified','fanduel_bridge_fabricated','different_lines_blended','fake_projection_created','monte_carlo_simulation_count_modified','projection_math_modified','provider_transport_modified','readiness_relaxed','persistence_modified','wagering_enabled'):
              assert ng[key] is False, key
          print('STEP19N_EXACT_HOST_CHAIN_CERTIFIED')
          PY

      - name: Read-only live Step12B preflight
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19h_fanduel_hosted_transport as h
          from sports_api import wnba_step19l_fanduel_identity_trace as l
          import sports_api.api.wnba_step17b_runtime

          slate=datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York')).date().isoformat()
          req=s12b.build_step12b_request(season=2026,slate_date=slate,evaluated_at=datetime.now(timezone.utc),previous_state=None,controller_policy={'provider_attempts':2})
          started=time.perf_counter(); out=s12b.run_step12b_live_runtime_job(req,env=os.environ); elapsed=time.perf_counter()-started
          tick=((out.get('step12a_result') or {}).get('step11e_tick') or {}); exe=tick.get('execution') or {}; state=tick.get('automation_state') or {}
          discovery=out.get('provider_discovery') or {}; dk=discovery.get('draftkings') or {}; fd=discovery.get('fanduel') or {}
          summary={'slate':slate,'seconds':round(elapsed,3),'status':out.get('status'),'health':out.get('health'),'cycle_outcome':exe.get('cycle_outcome'),'circuit':state.get('circuit_state'),'failures':state.get('consecutive_failure_count'),'dk_records':dk.get('record_count'),'fd_records':fd.get('record_count'),'fd_identity_errors':l.get_step19l_fanduel_identity_trace().get('identity_error_count'),'fd_invalid_json':h.get_step19h_fanduel_transport_status().get('invalid_json_event_count'),'built_targets':(out.get('projection_assembly') or {}).get('built_target_count')}
          print('STEP19N_EXACT_CANDIDATE_LIVE',json.dumps(summary,sort_keys=True),flush=True)
          if int(dk.get('record_count') or 0)<=0: raise SystemExit('DraftKings preflight not ready')
          if int(l.get_step19l_fanduel_identity_trace().get('identity_error_count') or 0)!=0: raise SystemExit('FanDuel identity error in preflight')
          if int(h.get_step19h_fanduel_transport_status().get('invalid_json_event_count') or 0)!=0: raise SystemExit('FanDuel invalid JSON in preflight')
          if exe.get('cycle_outcome') not in {'market_board_not_ready','shadow_board_ready'}: raise SystemExit('unsafe preflight outcome '+repr(exe.get('cycle_outcome')))
          if state.get('circuit_state')!='closed' or int(state.get('consecutive_failure_count') or 0)!=0: raise SystemExit('preflight circuit not closed')
          PY

      - name: Deploy exact Step19N candidate to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['CANDIDATE_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          desired={
            'WEB_CONCURRENCY':'1','WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED':'true','WNBA_STEP17B_ALWAYS_ON_ENABLED':'true','WNBA_STEP17B_LOOP_SECONDS':'60','WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_STEP17C_MONITORING_ENABLED':'true','WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED':'true',
            'WNBA_STEP14C_DURABLE_RESTART_LEASE_ENABLED':'true','WNBA_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED':'true','WNBA_STEP14B_DATABASE_READ_ENABLED':'true','WNBA_STEP14B_DATABASE_WRITE_ENABLED':'true','WNBA_STEP14A_PERSISTENCE_CONTRACT_ENABLED':'true','WNBA_STEP13D_FINAL_SCHEDULER_FREEZE_ENABLED':'true','WNBA_STEP13C_RELIABILITY_RECOVERY_ENABLED':'true','WNBA_STEP13B_RUNTIME_SUPERVISOR_ENABLED':'true','WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED':'true','WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED':'true','WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED':'true','WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED':'true','WNBA_STEP12A_SHADOW_RUNNER_ENABLED':'true',
            'WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED':'true','WNBA_STEP19A_DRAFTKINGS_SITE':'dkusaz','WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED':'true','WNBA_STEP11B_NETWORK_REFRESH_ENABLED':'true','WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED':'true','WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED':'true','WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED':'true','WNBA_STEP10_FASTAPI_ENABLED':'true','WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED':'true','WNBA_STEP10B_MARKET_ADAPTER_ENABLED':'true','WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED':'true','WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED':'true','WNBA_STEP9_FASTAPI_ENABLED':'true','WNBA_STEP9_THRESHOLD_PRICING_ENABLED':'true','WNBA_STEP9B_MARKET_COMPARISON_ENABLED':'true','WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED':'true','WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED':'true','WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true','WNBA_STEP7G_FIRST_PARTY_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_STEP6J_CANARY_ENABLED':'false','WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false','WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED':'false','WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19n-safe-market-state-candidate'
          }
          for key,value in desired.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('deploy id missing')
          for _ in range(180):
              deploy=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(deploy.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('deploy failed '+status)
              time.sleep(5)
          else: raise SystemExit('deploy timeout')
          if sha.lower() not in json.dumps(deploy).lower(): raise SystemExit('live SHA mismatch')
          print('STEP19N_RENDER_CANDIDATE_LIVE',did,sha)
          PY
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Certify repeated genuine scheduler cycles
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as response: return json.loads(response.read().decode())
          last=None
          for poll in range(1,151):
              try:
                  rt=get('/api/v1/wnba/runtime/step17b'); c=get('/api/v1/wnba/consumer/latest'); dk=get('/api/v1/wnba/markets/direct/draftkings/status'); h=get('/api/v1/wnba/runtime/step19h-fanduel-transport'); i=get('/api/v1/wnba/runtime/step19i-official-slate-transport'); j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration'); k=get('/api/v1/wnba/runtime/step19k-market-not-ready'); l=get('/api/v1/wnba/runtime/step19l-fanduel-identity-trace'); m=get('/api/v1/wnba/runtime/step19m-fanduel-line-move'); n=get('/api/v1/wnba/runtime/step19n-fanduel-empty-market')
              except Exception as exc:
                  if poll%6==0: print('STEP19N_WAIT_HTTP',poll,type(exc).__name__,str(exc),flush=True)
                  time.sleep(10); continue
              cr=c.get('runtime') or {}; d=dk.get('draftkings') or {}
              last={'poll':poll,'cycles':rt.get('cycle_count'),'successes':rt.get('success_count'),'runtime_failures':rt.get('failure_count'),'runtime_status':rt.get('last_status'),'consumer_reason':c.get('reason'),'cycle_outcome':cr.get('cycle_outcome'),'circuit':cr.get('circuit_state'),'consecutive_failures':cr.get('consecutive_failures'),'dk_ready':d.get('ready'),'fd_invalid_json':h.get('invalid_json_event_count'),'fd_identity_errors':l.get('identity_error_count'),'step19i_active':i.get('official_schedule_transport_active'),'step19j_active':j.get('game_rest_cycle_cache_active'),'step19k_transforms':k.get('transformed_count'),'step19m_active':m.get('market_identity_repair_active'),'step19m_calls':m.get('identity_surface_call_count'),'step19n_active':n.get('installed'),'step19n_transforms':n.get('transformed_count')}
              if poll%6==0: print('STEP19N_WAIT',json.dumps(last,sort_keys=True),flush=True)
              if int(rt.get('failure_count') or 0)>0: raise SystemExit('scheduler failure observed '+json.dumps(last,sort_keys=True))
              if int(l.get('identity_error_count') or 0)>0: raise SystemExit('FanDuel identity error remained '+json.dumps(l.get('latest_error') or {},sort_keys=True))
              if int(h.get('invalid_json_event_count') or 0)>0: raise SystemExit('FanDuel invalid JSON observed')
              if cr and (cr.get('circuit_state')!='closed' or int(cr.get('consecutive_failures') or 0)!=0 or cr.get('cycle_outcome') not in {'market_board_not_ready','shadow_board_ready','not_executed'}): raise SystemExit('unsafe consumer state '+json.dumps(last,sort_keys=True))
              if int(rt.get('success_count') or 0)>=8 and rt.get('last_status')=='cycle_completed' and d.get('ready') is True and i.get('official_schedule_transport_active') is True and j.get('game_rest_cycle_cache_active') is True and m.get('market_identity_repair_active') is True and n.get('installed') is True:
                  print('STEP19N_REPEATED_CYCLES_CERTIFIED',json.dumps(last,sort_keys=True),flush=True)
                  break
              time.sleep(10)
          else:
              raise SystemExit('did not reach eight safe completed cycles '+repr(last))
          PY

      - name: Final Step19N production verification
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as response: return json.loads(response.read().decode())
          rt=get('/api/v1/wnba/runtime/step17b'); c=get('/api/v1/wnba/consumer/latest'); dk=get('/api/v1/wnba/markets/direct/draftkings/status'); h=get('/api/v1/wnba/runtime/step19h-fanduel-transport'); i=get('/api/v1/wnba/runtime/step19i-official-slate-transport'); j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration'); k=get('/api/v1/wnba/runtime/step19k-market-not-ready'); l=get('/api/v1/wnba/runtime/step19l-fanduel-identity-trace'); m=get('/api/v1/wnba/runtime/step19m-fanduel-line-move'); n=get('/api/v1/wnba/runtime/step19n-fanduel-empty-market')
          cr=c.get('runtime') or {}; d=dk.get('draftkings') or {}; mg=m.get('guardrails') or {}; ng=n.get('guardrails') or {}
          checks={
            'runtime_completed':int(rt.get('success_count') or 0)>=8 and int(rt.get('failure_count') or 0)==0 and rt.get('last_status')=='cycle_completed',
            'draftkings_ready':d.get('ready') is True,
            'fanduel_transport_valid':int(h.get('invalid_json_event_count') or 0)==0,
            'fanduel_identity_errors_zero':int(l.get('identity_error_count') or 0)==0,
            'official_schedule_fix_active':i.get('official_schedule_transport_active') is True,
            'runtime_acceleration_active':j.get('game_rest_cycle_cache_active') is True,
            'no_exact_line_fix_active':k.get('installed') is True,
            'line_move_fix_active':m.get('market_identity_repair_active') is True,
            'empty_market_fix_active':n.get('installed') is True,
            'different_lines_not_blended':mg.get('different_lines_blended') is False and ng.get('different_lines_blended') is False,
            'exact_line_matching_unchanged':mg.get('exact_line_matching_modified') is False,
            'selection_id_change_forbidden':mg.get('selection_id_change_allowed') is False,
            'player_identity_change_forbidden':mg.get('player_identity_change_allowed') is False,
            'identity_failure_not_reclassified':ng.get('identity_failure_reclassified') is False,
            'transport_failure_not_reclassified':ng.get('transport_failure_reclassified') is False,
            'fanduel_bridge_not_fabricated':ng.get('fanduel_bridge_fabricated') is False,
            'readiness_not_relaxed':mg.get('readiness_relaxed') is False and ng.get('readiness_relaxed') is False,
            'consumer_circuit_safe':(not cr) or (cr.get('circuit_state')=='closed' and int(cr.get('consecutive_failures') or 0)==0 and cr.get('cycle_outcome') in {'market_board_not_ready','shadow_board_ready','not_executed'}),
            'wagering_off':mg.get('wagering_enabled') is False and ng.get('wagering_enabled') is False,
          }
          print('STEP19N_FINAL_CHECKS',json.dumps(checks,sort_keys=True))
          if not all(checks.values()): raise SystemExit('final Step19N verification failed')
          print('STEP19N_PRODUCTION_CERTIFIED')
          PY

      - name: Capture failure diagnostics
        if: failure() && steps.deploy.outputs.deployed == 'true'
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://kyre-sports-api.onrender.com'
          paths=('/api/v1/wnba/runtime/step17b','/api/v1/wnba/consumer/latest','/api/v1/wnba/runtime/step19g-provider-trace','/api/v1/wnba/runtime/step19h-fanduel-transport','/api/v1/wnba/runtime/step19i-official-slate-transport','/api/v1/wnba/runtime/step19j-runtime-acceleration','/api/v1/wnba/runtime/step19k-market-not-ready','/api/v1/wnba/runtime/step19l-fanduel-identity-trace','/api/v1/wnba/runtime/step19m-fanduel-line-move','/api/v1/wnba/runtime/step19n-fanduel-empty-market')
          for path in paths:
              try:
                  with urllib.request.urlopen(base+path,timeout=45) as response: value=json.loads(response.read().decode())
                  print('STEP19N_FAILURE_DIAGNOSTIC',path,json.dumps(value,sort_keys=True,default=str))
              except Exception as exc: print('STEP19N_FAILURE_DIAGNOSTIC_ERROR',path,type(exc).__name__,str(exc))
          PY

      - name: Roll back on certification failure
        if: failure() && steps.deploy.outputs.deployed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.render.com/v1'; sid=os.environ['RENDER_SERVICE_ID']; sha=os.environ['ROLLBACK_SHA']
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,body=None):
              request=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read().decode(); return json.loads(raw) if raw else None
          for key,value in {'WNBA_STEP17B_EXPECTED_REVISION':sha,'WNBA_DEPLOYMENT_REVISION':sha,'WNBA_RELEASE_ID':'wnba-step19n-certification-rollback'}.items(): req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          out=req('POST',f'/services/{sid}/deploys',{'commitId':sha,'clearCache':'do_not_clear'}) or {}; did=out.get('id')
          if not did: raise SystemExit('rollback deploy id missing')
          for _ in range(180):
              deploy=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(deploy.get('status','')).lower()
              if status=='live': break
              if status in {'build_failed','update_failed','canceled','cancelled','deactivated'}: raise SystemExit('rollback failed '+status)
              time.sleep(5)
          else: raise SystemExit('rollback timeout')
          print('STEP19N_ROLLBACK_COMPLETE',did,sha)
          PY
