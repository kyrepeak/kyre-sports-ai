name: NFL Passing Yards New Phase Step 8 Final Certification

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-new-phase-step8-final-certification-v1.yml"
      - "devsystem/task_ledgers/passing-yards-new-phase-step8-final-certification-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-new-phase-step8-final-certification-v1.yml"
      - "devsystem/task_ledgers/passing-yards-new-phase-step8-final-certification-v1.json"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Step 8 certification-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-new-phase-step8-final-certification-v1.yml
          devsystem/task_ledgers/passing-yards-new-phase-step8-final-certification-v1.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_NEW_PHASE_STEP8_SCOPE_GREEN"

      - name: Compile frozen Step 7 activation
        run: |
          python -m py_compile nfl_passing_yards_hub_v68.py
          python -m py_compile streamlit_memory_lazy_router_v219.py
          python -m py_compile app.py

      - name: Verify frozen Steps 1-7 certification contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def constants(path):
              source=Path(path).read_text()
              tree=ast.parse(source)
              values={}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0], ast.Name):
                      try:
                          values[node.targets[0].id]=ast.literal_eval(node.value)
                      except Exception:
                          pass
              return source,values

          v68_source,v68=constants("nfl_passing_yards_hub_v68.py")
          v219_source,v219=constants("streamlit_memory_lazy_router_v219.py")
          app=Path("app.py").read_text()

          assert v68["FROZEN_PRIOR"] == "nfl_passing_yards_hub_v67"
          assert v68["NAVIGATION_MOBILE_VERSION"] == "v68"
          assert v68["NEW_PHASE_STEP"] == 7
          assert v68["PRESENTATION_ONLY"] is True
          assert v68["MAY_MODIFY_PROJECTION"] is False
          assert v68["MAY_MODIFY_CONTEXT"] is False
          assert v68["MAY_MODIFY_PROBABILITY"] is False
          assert v68["MAY_MODIFY_MARKET_MATH"] is False
          assert v68["MAY_MODIFY_DATA"] is False
          assert v68["MAY_MODIFY_NAVIGATION_STATE"] is False
          assert v68["SPORTSBOOK_PROJECTION_INFLUENCE"] == 0.0

          assert v219["FROZEN_ROUTER"] == "streamlit_memory_lazy_router_v218"
          assert v219["PASSING_HUB"] == "nfl_passing_yards_hub_v68"
          assert v219["MAY_MODIFY_NAVIGATION_STATE"] is False
          assert v219["SPORTSBOOK_PROJECTION_INFLUENCE"] == 0.0

          for token in (
              'data-passing-yards-navigation-mobile="v68"',
              'data-passing-yards-navigation-mobile-ready="v68"',
              'id="ks-py-deep-evidence"',
              'data-passing-yards-navigation-mobile-css="v68"',
          ):
              assert token in v68_source, token

          assert 'from streamlit_memory_lazy_router_v219 import record_bootstrap_import_ms, render_app' in app
          print("PASSING_YARDS_NEW_PHASE_STEP8_STATIC_GREEN")
          PY

      - name: Verify Steps 1-7 product files frozen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" -- \
            nfl_passing_yards_hub_v58.py \
            nfl_passing_yards_hub_v59.py \
            nfl_passing_yards_hub_v60.py \
            nfl_passing_yards_hub_v61.py \
            nfl_passing_yards_hub_v62.py \
            nfl_passing_yards_hub_v63.py \
            nfl_passing_yards_hub_v64.py \
            nfl_passing_yards_hub_v65.py \
            nfl_passing_yards_hub_v66.py \
            nfl_passing_yards_hub_v67.py \
            nfl_passing_yards_hub_v68.py \
            streamlit_memory_lazy_router_v213.py \
            streamlit_memory_lazy_router_v214.py \
            streamlit_memory_lazy_router_v215.py \
            streamlit_memory_lazy_router_v216.py \
            streamlit_memory_lazy_router_v217.py \
            streamlit_memory_lazy_router_v218.py \
            streamlit_memory_lazy_router_v219.py \
            app.py
          echo "PASSING_YARDS_NEW_PHASE_STEPS1_7_FROZEN_GREEN"

  branch-final-certification:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-new-phase-step8
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-new-phase-step8/streamlit.log 2>&1 &
          echo $! > /tmp/py_step8_pid

      - name: Certify frozen Steps 1-7 at mobile tablet desktop
        run: |
          python - <<'PY'
          import time
          from urllib.parse import parse_qs, urlencode, urlparse
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          expected_date="2026-09-24"
          expected_matchup="Atlanta Falcons @ Green Bay Packers"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":expected_date,
              "ks_py_matchup":expected_matchup,
              "ks_qb_slot":"2",
          })

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("STEP8_LOCAL_STREAMLIT_NOT_READY")

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try:
                      out.append(frame.locator("body").inner_text(timeout=2000))
                  except Exception:
                      pass
              return "\n".join(out)

          def find_detail(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000])
                      raise RuntimeError("STEP8_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          root=frame.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
                          if root.count()==1:
                              return frame,root
                      except Exception:
                          pass
                  page.wait_for_timeout(400)
              raise RuntimeError("STEP8_QB_DETAIL_NOT_READY")

          def find_picker(page,timeout=120):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          picker=frame.locator('[data-passing-yards-selection-screen="v58"]')
                          if picker.count()==1:
                              return frame,picker
                      except Exception:
                          pass
                  page.wait_for_timeout(300)
              raise RuntimeError("STEP8_QB_PICKER_NOT_READY")

          def find_back(page,timeout=30):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          back=frame.get_by_role("button",name="← Back to Quarterbacks",exact=True)
                          if back.count()==1:
                              return frame,back
                      except Exception:
                          pass
                  page.wait_for_timeout(200)
              raise RuntimeError("STEP8_BACK_NOT_READY")

          def frame_query(frame):
              href=frame.evaluate("() => window.location.href")
              return parse_qs(urlparse(href).query)

          def canonical_matchup(value):
              return str(value or "").split(" • ",1)[0].strip()

          targets={
              "market":"#ks-py-category-market",
              "projection":"#ks-py-category-projection",
              "context":"#ks-py-category-context",
              "distribution":"#ks-py-category-distribution",
              "matchup":"#ks-py-category-matchup",
              "conditions":"#ks-py-category-conditions",
          }

          def certify(page,width,height):
              page.set_viewport_size({"width":width,"height":height})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find_detail(page)
              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "TypeError" not in body and "Traceback" not in body
              assert root.get_attribute("data-passing-yards-deep-evidence-ready")=="v67"
              assert root.get_attribute("data-passing-yards-navigation-mobile-ready")=="v68"
              assert root.get_attribute("data-passing-yards-navigation-mobile")=="v68"

              nav=root.locator('[data-passing-yards-category-nav="v62"]')
              assert nav.count()==1
              assert nav.locator("a.ks-py62-category-link").count()==6

              qs_before=frame_query(frame)
              assert qs_before.get("ks_qb_slot")==["2"],qs_before
              assert qs_before.get("ks_py_date")==[expected_date],qs_before
              mv=qs_before.get("ks_py_matchup") or [""]
              assert canonical_matchup(mv[0])==expected_matchup,qs_before

              for kind,target in targets.items():
                  link=nav.locator(f'a[data-category-target="{kind}"]')
                  assert link.count()==1,kind
                  box=link.bounding_box()
                  assert box and box["height"]>=44,(kind,box)
                  link.click()
                  page.wait_for_timeout(120)
                  frame,root=find_detail(page,timeout=30)
                  assert frame.evaluate("() => location.hash")==target,(kind,frame.evaluate("() => location.hash"))
                  qs_after=frame_query(frame)
                  assert qs_after.get("ks_qb_slot")==["2"],(kind,qs_after)
                  assert qs_after.get("ks_py_date")==[expected_date],(kind,qs_after)
                  mv=qs_after.get("ks_py_matchup") or [""]
                  assert canonical_matchup(mv[0])==expected_matchup,(kind,qs_after)
                  nav=root.locator('[data-passing-yards-category-nav="v62"]')

              evidence=root.locator('#ks-py-deep-evidence[data-passing-yards-deep-evidence="v67"]')
              assert evidence.count()==1
              assert evidence.locator('[data-deep-evidence-kind]').count()==5

              if width <= 560:
                  for selector in (
                      ".ks-py63-market-grid",
                      ".ks-py64-projection-grid",
                      ".ks-py65-context-grid",
                      ".ks-py66-distribution-grid",
                      ".ks-py67-grid",
                  ):
                      grid=root.locator(selector)
                      assert grid.count()==1,selector
                      columns=grid.evaluate("e => getComputedStyle(e).gridTemplateColumns")
                      assert len([x for x in columns.split(" ") if x])==1,(selector,columns)

              dims=frame.locator("body").evaluate("""e => ({
                bodyScroll:e.scrollWidth,
                docScroll:document.documentElement.scrollWidth,
                viewport:window.innerWidth
              })""")
              assert dims["bodyScroll"] <= dims["viewport"] + 2,dims
              assert dims["docScroll"] <= dims["viewport"] + 2,dims
              print(f"PASSING_YARDS_NEW_PHASE_STEP8_{width}_VIEWPORT_GREEN")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              certify(page,390,844)
              certify(page,768,1024)
              certify(page,1440,1000)

              page.set_viewport_size({"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              _,root=find_detail(page)
              _,back=find_back(page)
              bb=back.bounding_box()
              assert bb and bb["height"]>=44,bb
              back.click()
              picker_frame,picker=find_picker(page,timeout=120)
              assert picker.count()==1
              assert picker.locator('a[data-qb-select]').count()==2
              qs=frame_query(picker_frame)
              assert "ks_qb_slot" not in qs,qs
              assert qs.get("ks_py_date")==[expected_date],qs
              mv=qs.get("ks_py_matchup") or [""]
              assert canonical_matchup(mv[0])==expected_matchup,qs

              print("PASSING_YARDS_NEW_PHASE_STEP8_BRANCH_CERT_GREEN")
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/passing-yards-new-phase-step8/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/py_step8_pid ]; then kill "$(cat /tmp/py_step8_pid)" 2>/dev/null || true; fi

  public-final-certification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Allow Streamlit deployment to publish
        run: sleep 60

      - name: Final public certification
        run: |
          python - <<'PY'
          import time
          from urllib.parse import parse_qs, urlencode, urlparse
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          expected_date="2026-09-24"
          expected_matchup="Atlanta Falcons @ Green Bay Packers"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":expected_date,
              "ks_py_matchup":expected_matchup,
              "ks_qb_slot":"2",
          })

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try:
                      out.append(frame.locator("body").inner_text(timeout=2500))
                  except Exception:
                      pass
              return "\n".join(out)

          def find_detail(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000])
                      raise RuntimeError("STEP8_PUBLIC_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          root=frame.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
                          if root.count()==1:
                              return frame,root
                      except Exception:
                          pass
                  page.wait_for_timeout(500)
              raise RuntimeError("STEP8_PUBLIC_QB_DETAIL_NOT_READY")

          def find_picker(page,timeout=120):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          picker=frame.locator('[data-passing-yards-selection-screen="v58"]')
                          if picker.count()==1:
                              return frame,picker
                      except Exception:
                          pass
                  page.wait_for_timeout(350)
              raise RuntimeError("STEP8_PUBLIC_QB_PICKER_NOT_READY")

          def find_back(page,timeout=30):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  for frame in page.frames:
                      try:
                          back=frame.get_by_role("button",name="← Back to Quarterbacks",exact=True)
                          if back.count()==1:
                              return frame,back
                      except Exception:
                          pass
                  page.wait_for_timeout(200)
              raise RuntimeError("STEP8_PUBLIC_BACK_NOT_READY")

          def frame_query(frame):
              href=frame.evaluate("() => window.location.href")
              return parse_qs(urlparse(href).query)

          def canonical_matchup(value):
              return str(value or "").split(" • ",1)[0].strip()

          targets={
              "market":"#ks-py-category-market",
              "projection":"#ks-py-category-projection",
              "context":"#ks-py-category-context",
              "distribution":"#ks-py-category-distribution",
              "matchup":"#ks-py-category-matchup",
              "conditions":"#ks-py-category-conditions",
          }

          def certify_viewport(page,width,height):
              page.set_viewport_size({"width":width,"height":height})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find_detail(page)
              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "TypeError" not in body and "Traceback" not in body
              assert root.get_attribute("data-passing-yards-deep-evidence-ready")=="v67"
              assert root.get_attribute("data-passing-yards-navigation-mobile-ready")=="v68"
              assert root.get_attribute("data-passing-yards-navigation-mobile")=="v68"

              nav=root.locator('[data-passing-yards-category-nav="v62"]')
              assert nav.count()==1
              assert nav.locator("a.ks-py62-category-link").count()==6

              for kind,target in targets.items():
                  link=nav.locator(f'a[data-category-target="{kind}"]')
                  assert link.count()==1,kind
                  link.click()
                  page.wait_for_timeout(140)
                  frame,root=find_detail(page,timeout=30)
                  assert frame.evaluate("() => location.hash")==target,(kind,frame.evaluate("() => location.hash"))
                  qs=frame_query(frame)
                  assert qs.get("ks_qb_slot")==["2"],(kind,qs)
                  assert qs.get("ks_py_date")==[expected_date],(kind,qs)
                  mv=qs.get("ks_py_matchup") or [""]
                  assert canonical_matchup(mv[0])==expected_matchup,(kind,qs)
                  nav=root.locator('[data-passing-yards-category-nav="v62"]')

              evidence=root.locator('#ks-py-deep-evidence[data-passing-yards-deep-evidence="v67"]')
              assert evidence.count()==1
              assert evidence.locator('[data-deep-evidence-kind]').count()==5

              if width <= 560:
                  for selector in (
                      ".ks-py63-market-grid",
                      ".ks-py64-projection-grid",
                      ".ks-py65-context-grid",
                      ".ks-py66-distribution-grid",
                      ".ks-py67-grid",
                  ):
                      grid=root.locator(selector)
                      assert grid.count()==1,selector
                      columns=grid.evaluate("e => getComputedStyle(e).gridTemplateColumns")
                      assert len([x for x in columns.split(" ") if x])==1,(selector,columns)

              dims=frame.locator("body").evaluate("""e => ({
                bodyScroll:e.scrollWidth,
                docScroll:document.documentElement.scrollWidth,
                viewport:window.innerWidth
              })""")
              assert dims["bodyScroll"] <= dims["viewport"] + 2,dims
              assert dims["docScroll"] <= dims["viewport"] + 2,dims
              print(f"PASSING_YARDS_NEW_PHASE_STEP8_PUBLIC_{width}_GREEN")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              certify_viewport(page,390,844)
              certify_viewport(page,768,1024)
              certify_viewport(page,1440,1000)

              page.set_viewport_size({"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              _,root=find_detail(page)
              _,back=find_back(page)
              back.click()
              picker_frame,picker=find_picker(page,timeout=120)
              assert picker.count()==1
              assert picker.locator('a[data-qb-select]').count()==2
              qs=frame_query(picker_frame)
              assert "ks_qb_slot" not in qs,qs
              assert qs.get("ks_py_date")==[expected_date],qs
              mv=qs.get("ks_py_matchup") or [""]
              assert canonical_matchup(mv[0])==expected_matchup,qs

              print("PASSING_YARDS_NEW_PHASE_STEP8_PUBLIC_CERT_GREEN")
              browser.close()
          PY
