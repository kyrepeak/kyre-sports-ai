name: MLB Step8F fix live diagnostic one-shot

on:
  push:
    branches:
      - mlb-step8f-player-prop-presentation-integration
    paths:
      - .github/workflows/mlb-step8f-fix-live-diagnostic-once.yml

permissions:
  contents: write

jobs:
  patch-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mlb-step8f-player-prop-presentation-integration
          fetch-depth: 0
      - name: Replace tuple-keyed diagnostic dump with scalar summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mlb-step8f-player-prop-presentation-cert.yml')
          text = path.read_text(encoding='utf-8')
          old = "          print('STEP8F_LIVE_STATE', json.dumps(raw_state, sort_keys=True, default=str)[:5000])"
          new = "          print('STEP8F_LIVE_STATE', json.dumps({'integration_status':raw_state.get('integration_status'),'api_integration_active':raw_state.get('api_integration_active'),'feed_fresh':raw_state.get('feed_fresh'),'snapshot_age_seconds':raw_state.get('snapshot_age_seconds'),'usable_player_prop_count':raw_state.get('usable_player_prop_count'),'failures':raw_state.get('failures'),'player_name_matching_used':raw_state.get('player_name_matching_used'),'fuzzy_matching_allowed':raw_state.get('fuzzy_matching_allowed'),'sportsbook_price_model_input':raw_state.get('sportsbook_price_model_input')}, sort_keys=True, default=str))"
          if text.count(old) != 1:
              raise SystemExit(f'STEP8F_EXPECTED_ONE_DIAGNOSTIC_LINE_GOT_{text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/mlb-step8f-player-prop-presentation-cert.yml
      - name: Commit diagnostic-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mlb-step8f-player-prop-presentation-cert.yml
          git commit -m 'Fix Step 8F live diagnostic serialization'
          git push origin HEAD:mlb-step8f-player-prop-presentation-integration
