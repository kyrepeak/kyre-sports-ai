name: API2 NBA PRA History Exact Candidate Handoff

on:
  push:
    branches:
      - api2-nba-pra-history-coverage-v1
    paths:
      - .github/workflows/api2-nba-pra-history-coverage-v1-handoff.yml

permissions:
  contents: write

jobs:
  exact-tree-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: api2-nba-pra-history-coverage-v1
          fetch-depth: 0

      - name: Reconstruct exact tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/candidate.patch.gz.b64
          for sha in \
            9a8fead046ebbf06ab2e5b2b3b02d12443ce1c5c \
            3965f6fef064ce52df14bd67bc393bc8a29e81e9 \
            2d142fb588d3f8171b41e9a3aff050ead6d8c2de \
            39f7025b47808ca7ec8af732c1bf002ad27e8c32 \
            698d3d7e49f60f1f23fb8c7891ea36b83e1fc38d \
            e5d84207b8b452083070cbf0c3e7b3a5336d6101 \
            5643c54955b649edf9d1beabbfc903b67c1443b5 \
            54c1570d2554c521b484874483c8e14c68a7a98e \
            e5b5bf68daa631a51a00065760b6c369b9610880
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | tr -d '\n' | base64 -d >> /tmp/candidate.patch.gz.b64
          done
          base64 -d /tmp/candidate.patch.gz.b64 > /tmp/candidate.patch.gz
          echo 'f405320b47c5e695fca75492774177557381c31d6e09c96051d9a8bd96dc3ba1  /tmp/candidate.patch.gz' | sha256sum -c -
          gzip -dc /tmp/candidate.patch.gz > /tmp/candidate.patch
          echo 'a5b82e1f8b40993c22cbc35c8b0f50ecfa206a22525989f16a269bab9beb8781  /tmp/candidate.patch' | sha256sum -c -

      - name: Apply candidate and require exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/candidate.patch
          git rm .github/workflows/api2-nba-pra-history-coverage-v1-handoff.yml
          tree="$(git write-tree)"
          test "$tree" = '29ac07f2330580823ca7bb961d076b85f698d5e8'
          git config user.name 'Kyre Sports AI Transport'
          git config user.email 'kyre-sports-ai-transport@users.noreply.github.com'
          git commit -m 'API2: restore NBA PRA history analytics coverage'
          test "$(git rev-parse HEAD^{tree})" = '29ac07f2330580823ca7bb961d076b85f698d5e8'
          git push origin HEAD:api2-nba-pra-history-coverage-v1
