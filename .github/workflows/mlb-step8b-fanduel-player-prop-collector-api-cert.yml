name: MLB Step8B FanDuel player prop collector + API certification

on:
  push:
    branches:
      - mlb-step8b-fanduel-player-prop-collector-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step8b-fanduel-player-prop-collector-api-cert
  cancel-in-progress: false

jobs:
  discover-live-fanduel-player-prop-shape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inventory live FanDuel MLB player-prop market shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          from sports_api.collectors.mlb_fanduel_direct import fetch_fanduel_mlb_landing

          WEB_KEY='FhMFpcPWXMeyZxOx'
          SB='https://api.sportsbook.fanduel.com'
          HEADERS={
              'Accept':'application/json, text/plain, */*',
              'User-Agent':'Mozilla/5.0 (compatible; KyreSportsAPI-MLB/1.0; read-only)',
              'Origin':'https://sportsbook.fanduel.com',
              'Referer':'https://sportsbook.fanduel.com/',
              'x-sportsbook-region':'NJ',
          }

          def get_json(url,params=None):
              if params: url += '?' + urlencode(params)
              req=Request(url,headers=HEADERS,method='GET')
              with urlopen(req,timeout=25) as r: raw=r.read(20_000_001)
              if len(raw)>20_000_000: raise RuntimeError('response too large')
              return json.loads(raw.decode('utf-8'))

          def rows(value):
              if isinstance(value,dict):
                  return [dict(v,_attachment_key=str(k)) for k,v in value.items() if isinstance(v,dict)]
              if isinstance(value,list): return [dict(v) for v in value if isinstance(v,dict)]
              return []

          landing=fetch_fanduel_mlb_landing()
          events=rows(((landing.get('attachments') or {}).get('events')))
          now=datetime.now(timezone.utc)
          chosen=[]
          for event in events:
              name=str(event.get('name') or '')
              eid=str(event.get('eventId') or event.get('id') or event.get('_attachment_key') or '')
              start=str(event.get('openDate') or '')
              if not eid or ' @ ' not in name or not start: continue
              try:
                  dt=datetime.fromisoformat(start.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception: continue
              if dt>now: chosen.append((dt,eid,name))
          chosen.sort()
          if not chosen: raise SystemExit('STEP8B_NO_PREGAME_EVENT')

          found_two_way={}
          for _,eid,name in chosen[:6]:
              print('EVENT',eid,name)
              for tab in ('pitcher-props','batter-props','player-combos'):
                  payload=get_json(SB+'/sbapi/event-page',{'_ak':WEB_KEY,'eventId':eid,'tab':tab})
                  markets=rows(((payload.get('attachments') or {}).get('markets')))
                  print('TAB',tab,'MARKETS',len(markets))
                  for market in markets:
                      runners=[r for r in rows(market.get('runners')) if str(r.get('runnerStatus') or '').upper() in {'','ACTIVE'}]
                      if not any(r.get('isPlayerSelection') is True for r in runners): continue
                      roles=[]; handicaps=[]
                      for runner in runners:
                          result=runner.get('result') or {}
                          roles.append(str(result.get('type') or ''))
                          handicaps.append(runner.get('handicap'))
                      code=(market.get('marketType') or market.get('marketTypeCode') or market.get('type') or '')
                      mname=str(market.get('marketName') or market.get('name') or '')
                      two_way=(len(runners)==2 and sorted(x.upper() for x in roles)==['OVER','UNDER'])
                      if two_way:
                          key=(tab,str(code),mname)
                          found_two_way[key]=(roles,handicaps,str(market.get('marketId') or market.get('_attachment_key') or ''))
                      print('MARKET_SHAPE',json.dumps({
                          'tab':tab,'market_type':code,'market_name':mname,
                          'runner_count':len(runners),'roles':roles,'handicaps':handicaps,
                          'two_way_over_under':two_way,
                      },sort_keys=True)[:1800])
              if found_two_way: break

          print('TWO_WAY_PLAYER_MARKET_COUNT',len(found_two_way))
          for key,value in found_two_way.items():
              print('TWO_WAY_PLAYER_MARKET',json.dumps({'tab':key[0],'market_type':key[1],'market_name':key[2],'roles':value[0],'handicaps':value[1],'market_id':value[2]},sort_keys=True))
          if not found_two_way: raise SystemExit('STEP8B_NO_TWO_WAY_PLAYER_MARKETS_OBSERVED')
          print('MLB_STEP8B_LIVE_MARKET_SHAPE_INVENTORY_COMPLETE')
          PY
