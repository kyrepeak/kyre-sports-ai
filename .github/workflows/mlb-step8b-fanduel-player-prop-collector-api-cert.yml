name: MLB Step8B FanDuel player prop collector + API certification

on:
  push:
    branches:
      - mlb-step8b-fanduel-player-prop-collector-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step8b-fanduel-player-prop-collector-api-cert
  cancel-in-progress: false

jobs:
  discover-live-fanduel-player-prop-shape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract FanDuel participant-statistics request signature
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          ROOT='https://sportsbook.fanduel.com/'
          HEADERS={'User-Agent':'Mozilla/5.0 (compatible; KyreSportsAPI-MLB/1.0; read-only)','Accept':'text/html,application/javascript,*/*'}
          NEEDLES=(
              '/participant-statistics',
              '/api/v1/see-more-players',
              'FDX_API',
              'participantStatistics',
              'participant-statistics',
              'recentPerformance',
              'lastFiveStatCard',
          )

          def get(url,limit=12_000_000):
              req=Request(url,headers=HEADERS,method='GET')
              with urlopen(req,timeout=25) as r: raw=r.read(limit+1)
              if len(raw)>limit: return ''
              return raw.decode('utf-8',errors='ignore')

          html=get(ROOT,2_000_000)
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,flags=re.I):
              url=urljoin(ROOT,src)
              if url not in scripts: scripts.append(url)
          print('SCRIPT_COUNT',len(scripts))
          found=0
          for url in scripts:
              try: text=get(url)
              except Exception as exc:
                  print('FETCH_ERROR',url,type(exc).__name__,str(exc)[:160]); continue
              low=text.casefold()
              for needle in NEEDLES:
                  start_pos=0
                  while True:
                      pos=low.find(needle.casefold(),start_pos)
                      if pos<0: break
                      left=max(0,pos-4500); right=min(len(text),pos+6500)
                      print('SIGNATURE_CONTEXT',needle,'SCRIPT',url)
                      print(text[left:right].replace('\n',' ')[:11000])
                      found+=1
                      start_pos=pos+len(needle)
                      if found>=30: break
                  if found>=30: break
              if found>=30: break
          print('SIGNATURE_CONTEXT_COUNT',found)
          if found==0: raise SystemExit('STEP8B_PARTICIPANT_STATISTICS_SIGNATURE_NOT_FOUND')
          print('MLB_STEP8B_PARTICIPANT_STATISTICS_SIGNATURE_DISCOVERY_COMPLETE')
          PY
