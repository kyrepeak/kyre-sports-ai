name: MLB Step8B FanDuel player prop collector + API certification

on:
  push:
    branches:
      - mlb-step8b-fanduel-player-prop-collector-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step8b-fanduel-player-prop-collector-api-cert
  cancel-in-progress: false

jobs:
  discover-live-fanduel-player-prop-shape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect live FanDuel MLB player-prop card definitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import json

          from sports_api.collectors.mlb_fanduel_direct import (
              fetch_fanduel_event_page,
              fetch_fanduel_mlb_landing,
          )

          TARGET_IDS = {'123', '248', '253', '350', '386'}

          def rows(value):
              if isinstance(value, dict):
                  out = []
                  for key, item in value.items():
                      if isinstance(item, dict):
                          row = dict(item)
                          row.setdefault('_attachment_key', str(key))
                          out.append(row)
                  return out
              if isinstance(value, list):
                  return [dict(item) for item in value if isinstance(item, dict)]
              return []

          def row_id(row):
              return str(row.get('id') or row.get('cardId') or row.get('_attachment_key') or '').strip()

          def eid(event):
              return str(event.get('eventId') or event.get('id') or event.get('_attachment_key') or '').strip()

          def safe(value, depth=0):
              if depth >= 5:
                  if isinstance(value, dict):
                      return {'_keys': sorted(value)[:50]}
                  if isinstance(value, list):
                      return {'_list_len': len(value)}
                  return value
              if isinstance(value, dict):
                  result = {}
                  for key, item in list(value.items())[:80]:
                      if key in {'winRunnerOdds', 'previousWinRunnerOdds'}:
                          continue
                      result[str(key)] = safe(item, depth + 1)
                  return result
              if isinstance(value, list):
                  return [safe(item, depth + 1) for item in value[:40]]
              return value

          landing = fetch_fanduel_mlb_landing(timeout=25)
          att = landing.get('attachments') or {}
          events = rows(att.get('events') if isinstance(att, dict) else None)
          now = datetime.now(timezone.utc)
          upcoming = []
          for event in events:
              name = str(event.get('name') or event.get('eventName') or event.get('displayName') or '')
              open_date = str(event.get('openDate') or '')
              if ' @ ' not in name or not open_date:
                  continue
              try:
                  start = datetime.fromisoformat(open_date.replace('Z', '+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              if start > now:
                  upcoming.append((start, event))
          upcoming.sort(key=lambda item: item[0])
          if not upcoming:
              raise SystemExit('STEP8B_NO_UPCOMING_FANDUEL_MLB_EVENT_FOR_DISCOVERY')

          found = set()
          for _, event in upcoming[:5]:
              event_id = eid(event)
              doc = fetch_fanduel_event_page(event_id, timeout=25)
              layout = doc.get('layout') or {}
              cards_raw = layout.get('cards') if isinstance(layout, dict) else None
              cards = rows(cards_raw)
              print('EVENT', event_id, str(event.get('name') or event.get('eventName') or ''))
              print('LAYOUT_CARD_CONTAINER', type(cards_raw).__name__, 'COUNT', len(cards))
              print('LAYOUT_CARD_IDS', [row_id(card) for card in cards])
              for card in cards:
                  cid = row_id(card)
                  if cid not in TARGET_IDS:
                      continue
                  found.add(cid)
                  print('TARGET_CARD', cid, json.dumps(safe(card), sort_keys=True, default=str))
              if found == TARGET_IDS:
                  break

          print('TARGET_CARD_IDS_FOUND', sorted(found))
          missing = TARGET_IDS - found
          if missing:
              raise SystemExit('STEP8B_MISSING_CARD_DEFINITIONS_' + '_'.join(sorted(missing)))
          print('MLB_STEP8B_FANDUEL_CARD_DEFINITION_DISCOVERY_COMPLETE')
          PY
