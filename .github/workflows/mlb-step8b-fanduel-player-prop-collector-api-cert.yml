name: MLB Step8B FanDuel player prop collector + API certification

on:
  push:
    branches:
      - mlb-step8b-fanduel-player-prop-collector-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step8b-fanduel-player-prop-collector-api-cert
  cancel-in-progress: false

jobs:
  discover-live-fanduel-player-prop-shape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load live FanDuel MLB player-prop slug attachments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json

          from sports_api.collectors.mlb_fanduel_direct import (
              FANDUEL_BASE_URL,
              FANDUEL_HEADERS,
              FANDUEL_PUBLIC_WEB_KEY,
              _get_json,
              fetch_fanduel_mlb_landing,
          )

          SLUGS = (
              'pitcher-props',
              'batter-props',
              'player-combos',
              'hits-runs',
              'hits-and-runs',
              'moonshots',
          )
          TARGET_TYPES = {
              'PITCHER_D_STRIKEOUTS',
              'PLAYER_PROPS',
              'PLAYER_TO_RECORD_A_HIT',
              'PLAYER_TO_RECORD_2+_HITS',
              'PLAYER_TO_RECORD_3+_HITS',
              'PLAYER_TO_RECORD_4+_HITS',
              'PLAYER_TO_RECORD_1+_HITS+RUNS+RBIS',
              'PLAYER_TO_RECORD_2+_HITS+RUNS+RBIS',
              'PLAYER_TO_RECORD_3+_HITS+RUNS+RBIS',
              'PLAYER_TO_RECORD_4+_HITS+RUNS+RBIS',
          }

          def rows(value):
              if isinstance(value, dict):
                  out = []
                  for key, item in value.items():
                      if isinstance(item, dict):
                          row = dict(item)
                          row.setdefault('_attachment_key', str(key))
                          out.append(row)
                  return out
              if isinstance(value, list):
                  return [dict(item) for item in value if isinstance(item, dict)]
              return []

          def eid(event):
              return str(event.get('eventId') or event.get('id') or event.get('_attachment_key') or '').strip()

          landing = fetch_fanduel_mlb_landing(timeout=25)
          att = landing.get('attachments') or {}
          events = rows(att.get('events') if isinstance(att, dict) else None)
          now = datetime.now(timezone.utc)
          upcoming = []
          for event in events:
              name = str(event.get('name') or event.get('eventName') or event.get('displayName') or '')
              open_date = str(event.get('openDate') or '')
              if ' @ ' not in name or not open_date:
                  continue
              try:
                  start = datetime.fromisoformat(open_date.replace('Z', '+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              if start > now:
                  upcoming.append((start, event))
          upcoming.sort(key=lambda item: item[0])
          if not upcoming:
              raise SystemExit('STEP8B_NO_UPCOMING_FANDUEL_MLB_EVENT_FOR_DISCOVERY')

          event = upcoming[0][1]
          event_id = eid(event)
          print('EVENT', event_id, str(event.get('name') or event.get('eventName') or ''))
          url = f'{FANDUEL_BASE_URL}/sbapi/event-page'
          found_target = False
          for slug in SLUGS:
              doc = _get_json(
                  url,
                  {'_ak': FANDUEL_PUBLIC_WEB_KEY, 'eventId': event_id, 'tab': slug},
                  headers=FANDUEL_HEADERS,
                  timeout=25,
              )
              raw = json.dumps(doc, sort_keys=True, default=str).encode()
              attachments = doc.get('attachments') or {}
              markets = rows(attachments.get('markets') if isinstance(attachments, dict) else None)
              target = [m for m in markets if str(m.get('marketType') or m.get('type') or '') in TARGET_TYPES]
              print('SLUG_RESULT', json.dumps({
                  'slug': slug,
                  'hash': hashlib.sha256(raw).hexdigest()[:16],
                  'market_count': len(markets),
                  'target_market_count': len(target),
                  'target_types': sorted({str(m.get('marketType') or m.get('type') or '') for m in target}),
              }, sort_keys=True))
              for market in target[:30]:
                  found_target = True
                  runners = rows(market.get('runners'))
                  print('TARGET_MARKET', json.dumps({
                      'slug': slug,
                      'market_id': market.get('marketId') or market.get('_attachment_key'),
                      'market_name': market.get('marketName') or market.get('name'),
                      'market_type': market.get('marketType') or market.get('type'),
                      'status': market.get('marketStatus') or market.get('status'),
                      'in_play': market.get('inPlay'),
                      'market_keys': sorted(market),
                      'runners': [{
                          'runner_name': r.get('runnerName') or r.get('name'),
                          'handicap': r.get('handicap'),
                          'selection_id': r.get('selectionId'),
                          'result': r.get('result'),
                          'is_player_selection': r.get('isPlayerSelection'),
                          'logo': r.get('logo'),
                          'secondary_logo': r.get('secondaryLogo'),
                          'player_id': r.get('playerId'),
                          'participant_id': r.get('participantId'),
                          'runner_keys': sorted(r),
                      } for r in runners[:6]],
                  }, sort_keys=True, default=str))

          if not found_target:
              raise SystemExit('STEP8B_PLAYER_PROP_SLUG_ATTACHMENTS_NOT_LOADED')
          print('MLB_STEP8B_FANDUEL_PLAYER_PROP_SLUG_LOAD_COMPLETE')
          PY
