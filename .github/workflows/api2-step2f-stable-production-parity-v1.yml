name: API2 Step 2F Stable Production Parity V1

on:
  push:
    branches: [api2-main]
  pull_request:
    branches: [api2-main]
    paths:
      - 'devsystem/api2_isolation_guard_v1.py'
      - 'devsystem/api2_anti_loop_v1.py'
      - 'devsystem/api2_step2a_authority_v1.py'
      - 'devsystem/api2_execution_controller_v3.py'
      - 'devsystem/api2_execution_plan_compiler_cert_v1.py'
      - 'devsystem/api2_step2bc_cert_v1.py'
      - 'devsystem/api2_step2d_data_truth_gate_v1.py'
      - 'sports_api/nfl_rushing_yards_data_truth_v1.py'
      - 'sports_api/collectors/nfl_the_odds_api_rushing_yards_v1.py'
      - 'api2_universal_sports_router_registry_v1.py'
      - 'universal_sports_nav_registry_v1.py'
      - 'universal_runtime_v5_loader.py'
      - 'streamlit_memory_lazy_router_universal_runtime_v5_nfl_rushing_route_restore_v1.py'
      - 'api2_step2f_stable_production_parity_v1.py'
      - 'sports_api/api/step2f_deployment_receipt_v1.py'
      - 'kyre_sports_api_vercel_v1.py'
      - 'tests/test_api2_step2a_anti_loop_hard_guard_v2.py'
      - 'tests/test_api2_step2bc_cert_v1.py'
      - 'tests/test_api2_step2bc_control_plane_v1.py'
      - 'tests/test_api2_step2d_data_truth_gate_v1.py'
      - 'tests/test_api2_step2d_integration_v1.py'
      - 'tests/test_api2_step2e_universal_router_completion_v1.py'
      - 'tests/test_api2_step2f_stable_production_parity_v1.py'
      - '.github/workflows/api2-step2f-stable-production-parity-v1.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact production commit SHA required for strict live proof'
        required: true
        type: string

permissions:
  contents: read

jobs:
  step2f-static-contract:
    name: Step 2A + 2B + 2C + 2D + 2E + 2F exact-head contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt
      - name: Compile Step 2F authority
        run: |
          python -m py_compile \
            api2_step2f_stable_production_parity_v1.py \
            sports_api/api/step2f_deployment_receipt_v1.py \
            kyre_sports_api_vercel_v1.py
      - name: Prove Step 2A + Anti-Loop + Step 2B/2C control plane
        run: >-
          python -m pytest -q
          tests/test_api2_step2a_anti_loop_hard_guard_v2.py
          tests/test_api2_step2bc_cert_v1.py
          tests/test_api2_step2bc_control_plane_v1.py
      - name: Prove Step 2D data truth
        run: >-
          python -m pytest -q
          tests/test_api2_step2d_data_truth_gate_v1.py
          tests/test_api2_step2d_integration_v1.py
          tests/test_api2_step2bc_cert_v1.py
          tests/test_api2_step2bc_control_plane_v1.py
      - name: Prove Step 2E universal router coverage
        run: python -m pytest -q --noconftest tests/test_api2_step2e_universal_router_completion_v1.py
      - name: Prove Step 2F 39-page stable-production contract
        run: python -m pytest -q tests/test_api2_step2f_stable_production_parity_v1.py

  step2f-strict-production:
    name: Step 2F strict stable production
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: step2f-static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify stable production alias and full page matrix
        env:
          API2_STEP2F_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: |
          python api2_step2f_stable_production_parity_v1.py \
            --live \
            --expected-sha "$API2_STEP2F_EXPECTED_SHA" \
            --receipt-out api2-step2f-stable-production-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api2-step2f-stable-production-receipt
          path: api2-step2f-stable-production-receipt.json
          if-no-files-found: ignore
