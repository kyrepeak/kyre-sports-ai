name: MLB Step17A production host contract certification

on:
  push:
    branches:
      - mlb-step17a-production-host-contract
    paths:
      - sports_api/mlb_step17a_production_host_contract_v1.py
      - sports_api/certification/mlb_step17a_production_host_contract_evidence.json
      - sports_api/tools/mlb_step17a_production_host_contract.py
      - tests/test_mlb_step17a_production_host_contract_v1.py
      - .github/workflows/mlb-step17a-render-inventory.yml
      - .github/workflows/mlb-step17a-production-host-contract-cert.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP17A_BASE_SHA: 9676d4b657b4928a61563014e1bc519dfe52fa26
  STEP16A_FROZEN_SHA: c5ad6047224aaf014cec13f5efa6e5cd650da939
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"
  MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED: "false"
  MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED: "false"
  MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED: "false"
  MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED: "false"
  MLB_STEP17A_HOST_CONTRACT_ENABLED: "false"
  MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED: "false"
  MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED: "false"
  MLB_STEP14B_DATABASE_READ_ENABLED: "false"
  MLB_STEP14B_DATABASE_WRITE_ENABLED: "false"
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"
  WNBA_STEP12_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"

jobs:
  certify-host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: wnba-render-staging

    steps:
      - name: Checkout Step17A candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact frozen Step16E release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP17A_BASE_SHA }}
          path: frozen-step16e

      - name: Prove six-file Step17A scope and exact Step16E ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP17A_BASE_SHA" HEAD
          git diff --check "$STEP17A_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$STEP17A_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 6
          allowed='^(sports_api/mlb_step17a_production_host_contract_v1.py|sports_api/certification/mlb_step17a_production_host_contract_evidence.json|sports_api/tools/mlb_step17a_production_host_contract.py|tests/test_mlb_step17a_production_host_contract_v1.py|\.github/workflows/mlb-step17a-render-inventory.yml|\.github/workflows/mlb-step17a-production-host-contract-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad"
          test -z "$(git diff --name-status "$STEP17A_BASE_SHA"...HEAD | awk '$1 == "D" {print}')"

      - name: Prove frozen Step16E runtime packaging persistence and model surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP17A_BASE_SHA"...HEAD -- \
            sports_api/Dockerfile \
            sports_api/main.py \
            sports_api/production.env.example \
            sports_api/requirements.txt \
            sports_api/requirements-mlb-step14b-persistence.txt \
            sports_api/mlb_step16e_final_production_freeze_v1.py \
            sports_api/mlb_step16d_controlled_production_activation_v1.py \
            sports_api/mlb_step16c_live_postgresql_canary_v1.py \
            sports_api/mlb_step16b_production_lifecycle_v1.py \
            sports_api/mlb_step16b_packaging_lifecycle_contract_v1.py \
            sports_api/mlb_step16a_production_activation_contract_v1.py \
            sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/mlb_step14b_database_checkpoint_adapter_v1.py \
            sports_api/mlb_step14a_persistence_contract_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/api/mlb.py app.py
          test "$(git hash-object sports_api/Dockerfile)" = '34a542b0a32456de58b81fd711fef215e618469f'
          test "$(git hash-object sports_api/main.py)" = '839a7cae1b69b456260031803856df1f7f9661ec'

      - name: Assert every MLB activation and write switch remains OFF
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            MLB_PRODUCTION_RUNTIME_ENABLED \
            MLB_PRODUCTION_SCHEDULER_ENABLED \
            MLB_ACTIONABLE_OUTPUT_ENABLED \
            MLB_WAGERING_ENABLED \
            MLB_SUPABASE_REST_WRITE_ENABLED \
            MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED \
            MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED \
            MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED \
            MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED \
            MLB_STEP17A_HOST_CONTRACT_ENABLED \
            MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED \
            MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED \
            MLB_STEP14B_DATABASE_READ_ENABLED \
            MLB_STEP14B_DATABASE_WRITE_ENABLED; do
              test "${!key}" = false
          done
          test -z "${KYRE_DATABASE_URL:-}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test and persistence dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Compile Step17A host contract surface
        run: |
          python -m py_compile \
            sports_api/mlb_step17a_production_host_contract_v1.py \
            sports_api/tools/mlb_step17a_production_host_contract.py \
            tests/test_mlb_step17a_production_host_contract_v1.py
          python -m json.tool sports_api/certification/mlb_step17a_production_host_contract_evidence.json >/dev/null

      - name: Run Step17A targeted fail-closed tests
        run: python -m pytest -q tests/test_mlb_step17a_production_host_contract_v1.py

      - name: Run frozen Step16E through Step16B guards
        run: |
          python -m pytest -q tests/test_mlb_step16e_final_production_freeze_v1.py
          python -m pytest -q tests/test_mlb_step16d_controlled_production_activation_v1.py
          python -m pytest -q tests/test_mlb_step16c_live_postgresql_canary_v1.py
          python -m pytest -q tests/test_mlb_step16b_production_packaging_lifecycle_v1.py

      - name: Run frozen Step16A guards at exact certified SHA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mlb-step16a-parent
          git worktree add --detach /tmp/mlb-step16a-parent "$STEP16A_FROZEN_SHA"
          (
            cd /tmp/mlb-step16a-parent
            PYTHONPATH=. python -m pytest -q tests/test_mlb_step16a_production_activation_contract_v1.py
          )
          git worktree remove /tmp/mlb-step16a-parent --force

      - name: Run current MLB regression excluding frozen Step16A snapshot guard
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            if [ "$path" != "tests/test_mlb_step16a_production_activation_contract_v1.py" ]; then
              files+=("$path")
            fi
          done
          test "${#files[@]}" -gt 0
          python -m pytest -q "${files[@]}"

      - name: Prove secret-manager PostgreSQL credential is available without connecting
        env:
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KYRE_DATABASE_URL"
          case "$KYRE_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'KYRE_DATABASE_URL is not PostgreSQL'; exit 1 ;;
          esac
          echo 'MLB_STEP17A_DATABASE_SECRET_PRESENT_NO_CONNECTION'

      - name: Re-verify existing Render host identity read-only
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY"
          PYTHONPATH=. python - <<'PY'
          import json, os, urllib.request
          from sports_api import mlb_step17a_production_host_contract_v1 as contract

          headers={
              'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json',
              'User-Agent':'kyre-mlb-step17a-cert/1',
          }
          url=f"https://api.render.com/v1/services/{contract.EXPECTED_RENDER_SERVICE_ID}"
          req=urllib.request.Request(url,headers=headers,method='GET')
          with urllib.request.urlopen(req,timeout=30) as resp:
              service=json.loads(resp.read().decode())
          if isinstance(service,dict) and isinstance(service.get('service'),dict):
              service=service['service']
          identity=contract.validate_render_service_identity(service)
          safe={
              'service_id':identity['id'],
              'service_name':identity['name'],
              'service_type':identity['type'],
              'runtime':identity['runtime'],
              'url':identity['url'],
              'region':identity['region'],
              'health_check_path':identity['health_check_path'],
              'num_instances':identity['num_instances'],
              'auto_deploy':identity['auto_deploy'],
              'branch':identity['branch'],
              'mutation_performed':False,
              'deploy_triggered':False,
          }
          open('mlb-step17a-live-render-readonly.json','w',encoding='utf-8').write(json.dumps(safe,indent=2,sort_keys=True)+'\n')
          print('MLB_STEP17A_EXISTING_RENDER_HOST_IDENTITY_OK',identity['id'],identity['runtime'],identity['auto_deploy'])
          PY

      - name: Verify currently-hosted shared service health read-only
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://kyre-sports-api.onrender.com/health'
          with urllib.request.urlopen(url,timeout=60) as resp:
              data=json.loads(resp.read().decode())
          assert data.get('status')=='ok', data
          assert data.get('service')=='kyre-sports-api', data
          print('MLB_STEP17A_EXISTING_HOST_HEALTH_OK')
          PY

      - name: Build exact frozen Step16E Docker container locally
        working-directory: frozen-step16e
        run: |
          test "$(git rev-parse HEAD)" = "$STEP17A_BASE_SHA"
          test "$(git hash-object sports_api/Dockerfile)" = '34a542b0a32456de58b81fd711fef215e618469f'
          docker build \
            -f sports_api/Dockerfile \
            --build-arg WNBA_RELEASE_REVISION="$STEP17A_BASE_SHA" \
            --build-arg WNBA_RELEASE_ID="mlb-step16e-frozen-host-proof" \
            -t "mlb-step17a-frozen:$STEP17A_BASE_SHA" .

      - name: Prove frozen Step16E container boots and answers health with all runtimes OFF
        shell: bash
        run: |
          set -euo pipefail
          name="mlb-step17a-host-proof-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$name" 2>/dev/null || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" -p 18080:8000 \
            -e PORT=8000 \
            -e WEB_CONCURRENCY=2 \
            -e MLB_PRODUCTION_RUNTIME_ENABLED=false \
            -e MLB_PRODUCTION_SCHEDULER_ENABLED=false \
            -e MLB_ACTIONABLE_OUTPUT_ENABLED=false \
            -e MLB_WAGERING_ENABLED=false \
            -e MLB_SUPABASE_REST_WRITE_ENABLED=false \
            -e MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED=false \
            -e MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED=false \
            -e MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED=false \
            -e MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED=false \
            -e MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED=false \
            -e MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED=false \
            -e MLB_STEP14B_DATABASE_READ_ENABLED=false \
            -e MLB_STEP14B_DATABASE_WRITE_ENABLED=false \
            -e WNBA_PRODUCTION_RUNTIME_ENABLED=false \
            -e WNBA_BOARD_SCHEDULER_ENABLED=false \
            -e WNBA_PERSISTENCE_ENABLED=false \
            -e WNBA_SUPABASE_WRITE_ENABLED=false \
            -e WNBA_WAGERING_ENABLED=false \
            -e WNBA_STEP12_SCHEDULER_ENABLED=false \
            -e WNBA_KYRE_DIRECT_SYNC_ENABLED=false \
            -e WNBA_KYRE_RECONCILED_SYNC_ENABLED=false \
            "mlb-step17a-frozen:$STEP17A_BASE_SHA"
          python - <<'PY'
          import json, time, urllib.request
          last=None
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health',timeout=3) as resp:
                      last=json.loads(resp.read().decode())
                  if last.get('status')=='ok' and last.get('service')=='kyre-sports-api':
                      print('MLB_STEP17A_FROZEN_CONTAINER_HEALTH_OK')
                      raise SystemExit(0)
              except Exception as exc:
                  last=repr(exc)
              time.sleep(1)
          raise SystemExit(f'frozen container health did not become ready: {last!r}')
          PY
          test -z "$(docker inspect "$name" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^KYRE_DATABASE_URL=' || true)"

      - name: Build sanitized Step17A certification
        env:
          MLB_STEP17A_HOST_CONTRACT_ENABLED: "true"
          MLB_STEP17A_EXPECTED_REVISION: ${{ env.STEP17A_BASE_SHA }}
          MLB_DEPLOYMENT_MODE: container
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        run: PYTHONPATH=. python -m sports_api.tools.mlb_step17a_production_host_contract

      - name: Upload Step17A host-contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step17a-production-host-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mlb-step17a-production-host-contract-cert.json
            mlb-step17a-live-render-readonly.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert zero activation and zero credential exposure
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false
          test "$MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED" = false
          test "$MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED" = false
          test "$MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED" = false
          test "$MLB_STEP17A_HOST_CONTRACT_ENABLED" = false
          test -z "${KYRE_DATABASE_URL:-}"

      - name: Final marker
        run: echo MLB_STEP17A_PRODUCTION_HOST_CONTRACT_GREEN
