name: CERT ONLY NFL Moneyline Speed Baseline V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cert-nfl-moneyline-speed-baseline-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Benchmark deployed API and Streamlit cold/warm Moneyline loads
        shell: bash
        run: |
          mkdir -p artifacts/moneyline-speed-baseline
          python - <<'PY'
          import json
          import statistics
          import time
          from pathlib import Path
          import requests
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _find_app_frame, _wait_for_text, _body_has_forbidden_error, _choose, BrowserQAFailure

          site='https://kyre-sports-ai.streamlit.app'
          api='https://kyre-sports-api.onrender.com/api/v1/nfl/moneyline/market'
          event='401872931'
          artifacts=Path('artifacts/moneyline-speed-baseline')
          metrics_path=artifacts/'moneyline_speed_baseline.json'
          result={
              'status':'RUNNING',
              'site':site,
              'event_id':event,
              'viewport':'1024x1366',
              'visits':[],
          }

          def save():
              metrics_path.write_text(json.dumps(result,indent=2))

          api_times=[]
          api_statuses=[]
          for i in range(5):
              t=time.perf_counter()
              r=requests.get(api,params={'event_id':event},timeout=(5,35),headers={'Accept':'application/json','User-Agent':'KyreSportsAI-SpeedBaseline/1.1'})
              elapsed=time.perf_counter()-t
              api_times.append(elapsed)
              api_statuses.append(r.status_code)
              if r.status_code == 200:
                  p=r.json()
                  assert p.get('official_event_id') == event
              time.sleep(0.15)
          result['api_seconds']=[round(x,4) for x in api_times]
          result['api_http_statuses']=api_statuses
          result['api_p50_seconds']=round(statistics.median(api_times),4)
          save()

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1024,'height':1366})
              try:
                  nav0=time.perf_counter()
                  page.goto(site,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  result['initial_dom_seconds']=round(time.perf_counter()-nav0,4)

                  nfl0=time.perf_counter()
                  _choose(page,frame,0,'NFL')
                  combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  combo.wait_for(state='visible',timeout=60000)
                  result['nfl_selector_seconds']=round(time.perf_counter()-nfl0,4)
                  save()

                  def wait_moneyline_gone():
                      deadline=time.time()+60
                      while time.time() < deadline:
                          cards=frame.locator('.kml9-matchup-card').count()
                          titles=frame.get_by_text('NFL Moneyline Matchup Board',exact=False).count()
                          if cards == 0 and titles == 0:
                              return
                          time.sleep(0.10)
                      raise BrowserQAFailure('Moneyline DOM did not clear after leaving page')

                  def load_moneyline(label):
                      t0=time.perf_counter()
                      _choose(page,frame,1,'Moneyline')
                      _wait_for_text(frame,'NFL Moneyline Matchup Board',300.0)
                      cards=frame.locator('.kml9-matchup-card')
                      deadline=time.time()+300
                      while time.time() < deadline and cards.count() < 1:
                          time.sleep(0.10)
                      if cards.count() < 1:
                          raise BrowserQAFailure(f'{label}: no Moneyline matchup card')
                      elapsed=time.perf_counter()-t0
                      time.sleep(0.35)
                      body=frame.locator('body').inner_text()
                      forbidden=_body_has_forbidden_error(body)
                      if forbidden:
                          raise BrowserQAFailure(f'{label}: runtime error marker {forbidden}')
                      target=cards.nth(0).inner_text()
                      visit={
                          'label':label,
                          'seconds':round(elapsed,4),
                          'cards':cards.count(),
                          'market_available':'MARKET UNAVAILABLE' not in target.upper(),
                          'fanduel_visible':'FANDUEL' in target.upper(),
                      }
                      result['visits'].append(visit)
                      save()
                      return visit

                  load_moneyline('first_visit')
                  for idx in range(3):
                      _choose(page,frame,1,'Slate')
                      wait_moneyline_gone()
                      frame.get_by_role('combobox',name='🎯 NFL Market',exact=True).wait_for(state='visible',timeout=60000)
                      load_moneyline(f'warm_visit_{idx+1}')

                  visits=result['visits']
                  first=visits[0]
                  warm=[x['seconds'] for x in visits[1:]]
                  result['first_moneyline_seconds']=first['seconds']
                  result['warm_moneyline_seconds']=warm
                  result['warm_p50_seconds']=round(statistics.median(warm),4)
                  result['warm_best_seconds']=round(min(warm),4)
                  result['market_available_visits']=sum(1 for x in visits if x['market_available'])
                  result['matchup_cards']=visits[-1]['cards']
                  result['horizontal_overflow_px']=frame.evaluate('() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth')
                  result['sportsbook_model_influence']=0.0
                  result['status']='GREEN'
                  page.screenshot(path=str(artifacts/'moneyline_speed_baseline_ipad.png'),full_page=True)
                  save()
              finally:
                  browser.close()

          print('NFL_MONEYLINE_SPEED_BASELINE_GREEN')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload speed baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-nfl-moneyline-speed-baseline-${{ github.run_id }}
          path: artifacts/moneyline-speed-baseline
          if-no-files-found: warn
          retention-days: 7
