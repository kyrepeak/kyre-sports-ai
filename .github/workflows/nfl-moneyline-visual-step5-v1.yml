name: NFL Moneyline Visual Step 5

on:
  pull_request:
    paths:
      - 'app.py'
      - 'nfl_moneyline_hub_v18.py'
      - 'streamlit_memory_lazy_router_v201.py'
      - 'devsystem/task_ledgers/nfl-moneyline-visual-step5-v1.json'
      - '.github/workflows/nfl-moneyline-visual-step5-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'nfl_moneyline_hub_v18.py'
      - 'streamlit_memory_lazy_router_v201.py'
      - 'devsystem/task_ledgers/nfl-moneyline-visual-step5-v1.json'
      - '.github/workflows/nfl-moneyline-visual-step5-v1.yml'
  workflow_dispatch:

jobs:
  visual-step5-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Step 5 layer
        run: |
          python -m py_compile nfl_moneyline_hub_v18.py streamlit_memory_lazy_router_v201.py app.py

      - name: Verify Step 5 responsive frozen contract
        run: |
          python - <<'PY'
          from pathlib import Path

          v18 = Path("nfl_moneyline_hub_v18.py").read_text()
          router = Path("streamlit_memory_lazy_router_v201.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_moneyline_hub_v17"' in v18
          assert 'VISUAL_UPGRADE_STEP = 5' in v18
          assert 'PRESENTATION_ONLY = True' in v18
          assert 'RESPONSIVE_ONLY = True' in v18
          assert 'MAY_MODIFY_PROJECTION = False' in v18
          assert 'MAY_MODIFY_MARKET_MATH = False' in v18
          assert 'SPORTSBOOK_MODEL_INFLUENCE = 0.0' in v18
          assert 'STAKE_SIZING_ENABLED = False' in v18
          assert 'MONTE_CARLO_SIMULATIONS = 5_000_000' in v18

          assert '_FROZEN_STEP4_CSS = prior._step4_css' in v18
          assert 'prior._step4_css = lambda base: _step5_css(original_step4_css(base))' in v18
          assert 'data-nfl-moneyline-visual-step="5"' in v18
          assert '@media(max-width:900px)' in v18
          assert '@media(max-width:640px)' in v18
          assert '@media(max-width:430px)' in v18

          for marker in (
              '.kml15-grid{grid-template-columns:1fr}',
              '.kml16-snapshots{grid-template-columns:1fr}',
              '.kml17-grid{grid-template-columns:1fr}',
              '.kml17-price-grid{grid-template-columns:1fr}',
              'overflow-wrap:anywhere',
          ):
              assert marker in v18, marker

          assert 'import streamlit_memory_lazy_router_v200 as prior' in router
          assert 'MONEYLINE_HUB = "nfl_moneyline_hub_v18"' in router
          assert 'from streamlit_memory_lazy_router_v201 import record_bootstrap_import_ms, render_app' in app
          assert 'from streamlit_memory_lazy_router_v200 import record_bootstrap_import_ms, render_app' in app
          assert 'NFL_MONEYLINE_VISUAL_STEP5_RUNTIME' in app

          banned = (
              "_build_final(",
              "_fit_calibration_model(",
              "_build_game_output(",
              "fetch_nfl_moneyline_markets(",
              "_market_html(",
              "_market_matchup_html(",
              "random.",
              "np.random",
          )
          for token in banned:
              assert token not in v18, f"Step 5 unexpectedly owns non-responsive token: {token}"

          print("NFL Moneyline visual Step 5 responsive contract GREEN")
          PY

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public NFL Moneyline Step 5 responsive final
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base = "https://kyre-sports-ai.streamlit.app"
          artifacts = Path("artifacts/nfl-moneyline-step5-public")
          artifacts.mkdir(parents=True, exist_ok=True)
          no_games_marker = "No verified pregame NFL matchup is available for this date."
          viewports = (
              ("desktop", 1280, 900),
              ("tablet", 820, 1180),
              ("mobile", 390, 844),
          )

          def overflow_metrics(locator):
              return locator.evaluate(
                  """el => ({
                      scrollWidth: el.scrollWidth,
                      clientWidth: el.clientWidth,
                      overflow: Math.max(0, el.scrollWidth - el.clientWidth)
                  })"""
              )

          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage", "--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              try:
                  page.goto(base, wait_until="domcontentloaded", timeout=120000)
                  frame, initial_scan = _find_app_frame(page)

                  _choose(page, frame, 0, "NFL")
                  nfl_market = frame.get_by_role(
                      "combobox", name="🎯 NFL Market", exact=True
                  )
                  nfl_market.wait_for(state="visible", timeout=60000)
                  _choose(page, frame, 1, "Moneyline")

                  readiness_deadline = time.monotonic() + 45.0
                  while True:
                      body_text = frame.locator("body").inner_text(timeout=5000)
                      forbidden = _body_has_forbidden_error(body_text)
                      if forbidden:
                          raise BrowserQAFailure(
                              f"MONEYLINE_RUNTIME: forbidden marker {forbidden}"
                          )

                      core_ready = all(
                          marker in body_text
                          for marker in ("NFL Moneyline", "Command Center", "PREGAME VERIFIED")
                      )
                      styles = {
                          step: frame.locator(
                              f'style[data-nfl-moneyline-visual-step="{step}"]'
                          ).count()
                          for step in (2, 3, 4, 5)
                      }
                      card_count = frame.locator("article.kml15-card").count()
                      no_games = no_games_marker in body_text

                      settled = (
                          core_ready
                          and all(styles[step] >= 1 for step in (2, 3, 4, 5))
                          and (card_count > 0 or no_games)
                      )
                      if settled:
                          break

                      if time.monotonic() >= readiness_deadline:
                          raise BrowserQAFailure(
                              "MONEYLINE_STEP5_ROUTE_READINESS: settled route did not appear; "
                              f"core_ready={core_ready}; styles={styles}; "
                              f"card_count={card_count}; no_games={no_games}; "
                              f"body start={body_text[:1800]!r}"
                          )
                      page.wait_for_timeout(500)

                  structural = {}
                  if not no_games:
                      card = frame.locator("article.kml15-card").first
                      structural = {
                          "step2_team_count": card.locator(
                              ".kml15-grid > section.kml15-team"
                          ).count(),
                          "step3_analysis_count": card.locator(".kml16-analysis").count(),
                          "step4_market_count": card.locator(".kml17-market").count(),
                          "forbidden_pre_code_count": card.locator(
                              'pre, code, [data-testid="stMarkdownPre"]'
                          ).count(),
                      }
                      if structural != {
                          "step2_team_count": 2,
                          "step3_analysis_count": 1,
                          "step4_market_count": 1,
                          "forbidden_pre_code_count": 0,
                      }:
                          raise BrowserQAFailure(
                              f"MONEYLINE_STEP5_FROZEN_STRUCTURE: {structural}"
                          )

                  viewport_results = {}
                  for name, width, height in viewports:
                      page.set_viewport_size({"width": width, "height": height})
                      page.wait_for_timeout(700)

                      app = frame.locator('[data-testid="stAppViewContainer"]').first
                      app_metrics = overflow_metrics(app)
                      card_metrics = None
                      layout = {}

                      if not no_games:
                          card = frame.locator("article.kml15-card").first
                          card_metrics = overflow_metrics(card)
                          layout = card.evaluate(
                              """el => {
                                  const q = s => el.querySelector(s);
                                  const cols = s => {
                                      const node = q(s);
                                      return node ? getComputedStyle(node).gridTemplateColumns : "";
                                  };
                                  return {
                                      step2Grid: cols(".kml15-grid"),
                                      step3Snapshots: cols(".kml16-snapshots"),
                                      step4Grid: cols(".kml17-grid"),
                                      step4Prices: cols(".kml17-price-grid")
                                  };
                              }"""
                          )

                      if app_metrics["overflow"] > 12:
                          raise BrowserQAFailure(
                              f"MONEYLINE_STEP5_RESPONSIVE_OVERFLOW: viewport={name}; "
                              f"app={app_metrics}"
                          )
                      if card_metrics and card_metrics["overflow"] > 8:
                          raise BrowserQAFailure(
                              f"MONEYLINE_STEP5_CARD_OVERFLOW: viewport={name}; "
                              f"card={card_metrics}"
                          )

                      if not no_games and width <= 900:
                          if len(layout["step2Grid"].split()) != 1:
                              raise BrowserQAFailure(
                                  f"MONEYLINE_STEP5_TABLET_LAYOUT: viewport={name}; "
                                  f"step2Grid={layout['step2Grid']!r}"
                              )
                          if len(layout["step3Snapshots"].split()) != 1:
                              raise BrowserQAFailure(
                                  f"MONEYLINE_STEP5_TABLET_LAYOUT: viewport={name}; "
                                  f"step3Snapshots={layout['step3Snapshots']!r}"
                              )
                          if len(layout["step4Grid"].split()) != 1:
                              raise BrowserQAFailure(
                                  f"MONEYLINE_STEP5_TABLET_LAYOUT: viewport={name}; "
                                  f"step4Grid={layout['step4Grid']!r}"
                              )

                      if not no_games and width <= 430:
                          if len(layout["step4Prices"].split()) != 1:
                              raise BrowserQAFailure(
                                  f"MONEYLINE_STEP5_MOBILE_LAYOUT: viewport={name}; "
                                  f"step4Prices={layout['step4Prices']!r}"
                              )

                      viewport_results[name] = {
                          "width": width,
                          "height": height,
                          "app": app_metrics,
                          "card": card_metrics,
                          "layout": layout,
                      }

                  result = {
                      "status": "GREEN",
                      "route": "NFL -> Moneyline",
                      "render_state": (
                          "NO_VERIFIED_PREGAME_GAMES" if no_games else "RESPONSIVE_MATCHUP"
                      ),
                      "style_counts": styles,
                      "card_count": card_count,
                      "frozen_structure": structural,
                      "viewports": viewport_results,
                      "initial_frame_scan_count": len(initial_scan),
                  }
                  (artifacts / "result.json").write_text(
                      json.dumps(result, indent=2), encoding="utf-8"
                  )
                  page.screenshot(
                      path=str(artifacts / "nfl_moneyline_step5_mobile_green.png"),
                      full_page=True,
                  )
                  print("NFL_MONEYLINE_STEP5_PUBLIC_PRODUCTION_GREEN")
                  print(json.dumps(result, indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload isolated Moneyline Step 5 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-step5-isolated-public-${{ github.run_id }}
          path: artifacts/nfl-moneyline-step5-public
          if-no-files-found: warn
          retention-days: 7
