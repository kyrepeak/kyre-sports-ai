name: WNBA Step 7E schedule diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wnba-step7e-step6u-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-schedule:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read hosted WNBA games today endpoint only
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.request
          url='https://kyre-sports-api.onrender.com/api/v1/wnba/games/today?season=2026'
          req=urllib.request.Request(url, headers={'User-Agent':'kyre-sports-api-step7e-diagnostic/1'})
          try:
              with urllib.request.urlopen(req, timeout=45) as r:
                  raw=r.read().decode('utf-8', 'replace')
                  print('HTTP', r.status)
                  try:
                      body=json.loads(raw)
                      safe={k: body.get(k) for k in ('source','data_type','date','season','game_count','games') if k in body}
                      if isinstance(safe.get('games'), list):
                          safe['games']={'count': len(safe['games'])}
                      print(json.dumps(safe, indent=2, sort_keys=True))
                  except Exception:
                      print(raw[:2000])
          except urllib.error.HTTPError as exc:
              raw=exc.read().decode('utf-8', 'replace')
              print('HTTP', exc.code)
              print(raw[:4000])
              raise
          PY
