name: WNBA Step 7E official CDN diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wnba-step7e-step6u-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-official-cdn:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read current official WNBA schedule CDN only
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://cdn.wnba.com/static/json/staticData/scheduleLeagueV2.json'
          req=urllib.request.Request(url, headers={
              'User-Agent':'Mozilla/5.0',
              'Accept':'application/json, text/plain, */*',
              'Referer':'https://www.wnba.com/',
          })
          with urllib.request.urlopen(req, timeout=45) as r:
              raw=r.read()
          body=json.loads(raw.decode('utf-8'))
          root=body.get('leagueSchedule') or {}
          dates=root.get('gameDates') or []
          assert str(root.get('leagueId')) == '10', root.get('leagueId')
          assert str(root.get('seasonYear')) == '2026', root.get('seasonYear')
          assert isinstance(dates, list) and dates, type(dates)
          games=sum(len(x.get('games') or []) for x in dates if isinstance(x, dict))
          print(json.dumps({
              'http_status': r.status,
              'league_id': root.get('leagueId'),
              'season_year': root.get('seasonYear'),
              'date_blocks': len(dates),
              'game_count': games,
          }, indent=2, sort_keys=True))
          PY
