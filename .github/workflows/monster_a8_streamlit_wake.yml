name: Monster A8 Streamlit Production Wake

on:
  pull_request:
    branches:
      - main

jobs:
  wake-production-streamlit:
    if: github.head_ref == 'monster-a8-streamlit-wake'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake production Streamlit once
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-redirs 3 --connect-timeout 10 --max-time 30 --output /tmp/streamlit-health.txt --write-out '%{http_code}' -A 'monster-a8-production-wake/1' 'https://kyre-sports-ai.streamlit.app/_stcore/health')"
          echo "production_streamlit_health_status=${status}"
          cat /tmp/streamlit-health.txt || true
          case "${status}" in
            2*|3*) ;;
            *) exit 1 ;;
          esac
