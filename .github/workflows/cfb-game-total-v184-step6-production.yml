name: CFB Game Total V184 Step 6 production verification

on:
  pull_request:
    branches: [main]
    paths:
      - "devsystem/production_verify_step6_v184.py"
      - "tests/test_devsystem_production_verify_step6_v184.py"
      - "cfb_game_total_step6_scoring_v1.py"
      - "cfb_game_total_clean_page_v18.py"
      - "streamlit_memory_lazy_router_v163.py"
      - "app.py"
      - "devsystem/task_ledgers/cfb-game-total-evidence-step6-final.json"
      - ".github/workflows/cfb-game-total-v184-step6-production.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/production_verify_step6_v184.py"
      - "tests/test_devsystem_production_verify_step6_v184.py"
      - "cfb_game_total_step6_scoring_v1.py"
      - "cfb_game_total_clean_page_v18.py"
      - "streamlit_memory_lazy_router_v163.py"
      - "app.py"
      - "devsystem/task_ledgers/cfb-game-total-evidence-step6-final.json"
      - ".github/workflows/cfb-game-total-v184-step6-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v184-step6-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-step6-v184-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Step 6 production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile Step 6 V184 production verifier
        run: |
          python -m py_compile devsystem/production_verify_step6_v184.py

      - name: Self-test Step 6 V184 production contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_devsystem_production_verify_step6_v184.py \
            tests/test_cfb_game_total_v184_step6_scoring.py

      - name: Prove live Step 6 READY 100 percent 12 of 12
        if: github.event_name != 'pull_request'
        run: |
          python -m devsystem.production_verify_step6_v184 \
            --artifact-dir artifacts/production-step6-v184

      - name: Upload Step 6 V184 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v184-step6-production-${{ github.run_id }}
          path: artifacts/production-step6-v184
          if-no-files-found: warn
          retention-days: 14
