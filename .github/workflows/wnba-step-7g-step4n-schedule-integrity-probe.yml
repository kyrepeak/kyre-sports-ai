name: WNBA Step 7G Step 4N schedule integrity probe

on:
  push:
    branches:
      - wnba-step7g-official-data-preflight-20260827
    paths:
      - '.github/workflows/wnba-step-7g-step4n-schedule-integrity-probe.yml'
      - 'sports_api/tools/wnba_step7g_step4n_schedule_integrity_probe.py'
      - 'sports_api/wnba_step7g_first_party_schedule.py'
      - 'sports_api/wnba_schedule.py'

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert production OFF
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sports_api/requirements.txt
      - run: python -m py_compile sports_api/tools/wnba_step7g_step4n_schedule_integrity_probe.py
      - name: Run read-only Step 4N schedule identity probe
        run: python -m sports_api.tools.wnba_step7g_step4n_schedule_integrity_probe
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-step4n-schedule-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: step7g-step4n-schedule-integrity-probe.json
          if-no-files-found: warn
          retention-days: 30
      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
