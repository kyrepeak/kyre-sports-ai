name: NFL Rushing Yards Performance Fast Route V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_rushing_yards_hub_v10.py"
      - "streamlit_memory_lazy_router_v106.py"
      - "app.py"
      - "tests/test_nfl_rushing_yards_performance_fast_route_v1.py"
      - "devsystem/nfl_rushing_yards_fast_route_browser_v1.py"
      - ".github/workflows/nfl-rushing-yards-performance-fast-route-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-rushing-yards-performance-fast-route-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-performance-fast-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate Browser QA stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Compile performance fast-route surface
        run: |
          python -m py_compile nfl_rushing_yards_hub_v10.py
          python -m py_compile streamlit_memory_lazy_router_v106.py
          python -m py_compile app.py
          python -m py_compile tests/test_nfl_rushing_yards_performance_fast_route_v1.py
          python -m py_compile devsystem/nfl_rushing_yards_fast_route_browser_v1.py

      - name: Prove certified frozen owners were not modified
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_|nfl_rushing_yards_hub_v[1-9]\.py$|nfl_rushing_yards_(context_api|projection|market_api)_v1\.py$|streamlit_memory_lazy_router_v(7[7-9]|8[0-9]|9[0-9]|10[0-5])\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "RUSH_PERFORMANCE_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "RUSH_PERFORMANCE_FROZEN_OWNER_GUARD_GREEN"

      - name: Re-run certified Rushing contracts and all six page steps
        run: |
          python -m pytest -q \
            tests/test_nfl_rushing_yards_context_api_v1.py \
            tests/test_nfl_rushing_yards_projection_v1.py \
            tests/test_nfl_rushing_yards_step3_surface_v1.py \
            tests/test_nfl_rushing_yards_market_api_v1.py \
            tests/test_nfl_rushing_yards_step4_surface_v1.py \
            tests/test_nfl_rushing_yards_page_step1_compact_v1.py \
            tests/test_nfl_rushing_yards_page_step2_summary_v1.py \
            tests/test_nfl_rushing_yards_page_step3_workload_v1.py \
            tests/test_nfl_rushing_yards_page_step4_opponent_run_defense_v1.py \
            tests/test_nfl_rushing_yards_page_step5_projection_recipe_v1.py \
            tests/test_nfl_rushing_yards_page_step6_support_concerns_v1.py \
            tests/test_nfl_rushing_yards_performance_fast_route_v1.py

      - name: Prove fresh V106 import skips frozen V105 router spine
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import streamlit_memory_lazy_router_v106 as router
          assert router.FROZEN_ROUTER not in sys.modules
          assert router.ACTIVE_PAGE not in sys.modules
          assert router.FROZEN_ROUTER == "streamlit_memory_lazy_router_v105"
          assert router.ACTIVE_PAGE == "nfl_rushing_yards_hub_v10"
          print("NFL_RUSHING_YARDS_COLD_IMPORT_SKIP_GREEN")
          PY

      - name: Start branch-local Streamlit for real Rushing witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rushing-fast-route
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8502 \
            > artifacts/rushing-fast-route/streamlit.log 2>&1 &
          echo $! > /tmp/rushing_fast_streamlit_pid

      - name: Drive real NFL Rushing Yards fast route with Playwright
        run: |
          python devsystem/nfl_rushing_yards_fast_route_browser_v1.py \
            --base-url http://127.0.0.1:8502 \
            --artifact-dir artifacts/rushing-fast-route

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/rushing-fast-route/streamlit.log || true

      - name: Upload Rushing fast-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-rushing-yards-fast-route-${{ github.run_id }}
          path: artifacts/rushing-fast-route
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rushing_fast_streamlit_pid ]; then
            kill "$(cat /tmp/rushing_fast_streamlit_pid)" 2>/dev/null || true
          fi
