name: NFL Receiving Yards Market API V1

on:
  pull_request:
    branches: [nfl-receiving-yards-api-v1]
    paths:
      - 'sports_api/collectors/nfl_fanduel_receiving_yards_v1.py'
      - 'sports_api/api/nfl_receiving_yards_market_v1.py'
      - 'sports_api/api/health.py'
      - 'sports_api/tests/test_nfl_receiving_yards_market_v1.py'
      - '.github/workflows/nfl-receiving-yards-market-api-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-receiving-yards-market-api-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production API stack and pytest
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Enforce exact five-file Receiving market API diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nfl-receiving-yards-api-v1:refs/remotes/origin/nfl-receiving-yards-api-v1
          git diff --name-only origin/nfl-receiving-yards-api-v1...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-receiving-yards-market-api-v1.yml
          sports_api/api/health.py
          sports_api/api/nfl_receiving_yards_market_v1.py
          sports_api/collectors/nfl_fanduel_receiving_yards_v1.py
          sports_api/tests/test_nfl_receiving_yards_market_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Receiving market API diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile additive NFL Receiving Yards market files
        run: |
          python -m py_compile sports_api/collectors/nfl_fanduel_receiving_yards_v1.py
          python -m py_compile sports_api/api/nfl_receiving_yards_market_v1.py
          python -m py_compile sports_api/tests/test_nfl_receiving_yards_market_v1.py

      - name: Run deterministic NFL Receiving Yards market tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q sports_api/tests/test_nfl_receiving_yards_market_v1.py

      - name: Prove frozen Receiving projection owner was not modified
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/nfl-receiving-yards-api-v1...HEAD)"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_receiving_yards_projection_v1\.py$|nfl_receiving_yards_context_api_v1\.py$|sports_api/api/nfl_receiving_yards_context_v1\.py$|sports_api/collectors/nfl_receiving_yards_context_v1\.py$|nfl_passing_yards_|nfl_rushing_yards_)' || true)"
          if [ -n "$blocked" ]; then
            echo 'RECEIVING_MARKET_FROZEN_OWNER_MODIFICATION_BLOCKED'
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo 'NFL_RECEIVING_MARKET_FROZEN_OWNER_GUARD_GREEN'

      - name: Prove Receiving market routes on certified shared-host router
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from sports_api.api.health import router as health_router
          from sports_api.main import app

          health_paths = [getattr(route, 'path', '') for route in health_router.routes]
          app_paths = [getattr(route, 'path', '') for route in app.routes]
          receiving = {
              '/api/v1/nfl/receiving-yards',
              '/api/v1/nfl/receiving-yards/status',
              '/api/v1/nfl/receiving-yards/market',
              '/api/v1/nfl/receiving-yards/market/status',
          }
          frozen_rushing = {
              '/api/v1/nfl/rushing-yards',
              '/api/v1/nfl/rushing-yards/status',
              '/api/v1/nfl/rushing-yards/fast',
              '/api/v1/nfl/rushing-yards/fast/status',
              '/api/v1/nfl/rushing-yards/market',
              '/api/v1/nfl/rushing-yards/market/status',
          }

          for path in sorted(receiving | frozen_rushing):
              print(path, health_paths.count(path), app_paths.count(path))

          for path in sorted(receiving):
              assert health_paths.count(path) == 1, (path, health_paths.count(path))
          for path in sorted(frozen_rushing):
              assert health_paths.count(path) == 1, (path, health_paths.count(path))

          print('NFL_RECEIVING_MARKET_V1_SHARED_HOST_GREEN')
          PY

      - name: Prove post-projection market semantics remain hard locked
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from sports_api.api.nfl_receiving_yards_market_v1 import CONTRACT

          assert CONTRACT['projection_weight'] == 0.0
          assert CONTRACT['market_context_only'] is True
          assert CONTRACT['may_modify_projection'] is False
          for key in (
              'probability_enabled',
              'fair_odds_enabled',
              'ev_enabled',
              'grading_enabled',
              'stake_sizing_enabled',
              'wager_actions',
          ):
              assert CONTRACT[key] is False, key
          assert CONTRACT['player_name_matching'] is False
          assert CONTRACT['fuzzy_matching'] is False
          assert CONTRACT['synthetic_event_ids'] is False
          assert CONTRACT['synthetic_player_ids'] is False
          print('NFL_RECEIVING_MARKET_V1_SAFETY_GREEN')
          PY

      - name: Re-run frozen NFL Rushing context regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            sports_api/tests/test_nfl_rushing_yards_context_v1.py \
            sports_api/tests/test_nfl_rushing_yards_context_performance_v2.py \
            sports_api/tests/test_nfl_rushing_yards_context_cache_v3.py

      - name: Revalidate shared-host startup and observability contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_production_observability_backport_v1.py
