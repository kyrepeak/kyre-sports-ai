name: WNBA Step 11A DraftKings provider certification

on:
  push:
    branches:
      - wnba-step11a-draftkings-provider-20260828
    paths:
      - sports_api/wnba_step11_draftkings_provider.py
      - tests/test_wnba_step11_draftkings_provider.py
      - sports_api/tools/wnba_step11a_draftkings_provider_cert.py
      - .github/workflows/wnba-step-11a-draftkings-provider-cert.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: "true"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
  WNBA_STEP10_FASTAPI_ENABLED: "true"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Step 11A branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 120

      - name: Assert production scheduler sync OFF; Step 11A isolated gate ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED" = 'true'
          test "$WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED" = 'true'
          test "$WNBA_STEP10B_MARKET_ADAPTER_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 11A surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step11_draftkings_provider.py
          python -m py_compile tests/test_wnba_step11_draftkings_provider.py
          python -m py_compile sports_api/tools/wnba_step11a_draftkings_provider_cert.py

      - name: Run Step 11A DraftKings provider guards
        run: PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 10 head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP10_FROZEN_SHA='4341d178aa65806e9bc001c8759eccb4a003ea63'
          git merge-base --is-ancestor "$STEP10_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP10_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 11A files changed after frozen Step 10
        shell: bash
        run: |
          set -euo pipefail
          STEP10_FROZEN_SHA='4341d178aa65806e9bc001c8759eccb4a003ea63'
          git diff --name-only "$STEP10_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step11_draftkings_provider.py|\
              tests/test_wnba_step11_draftkings_provider.py|\
              sports_api/tools/wnba_step11a_draftkings_provider_cert.py|\
              .github/workflows/wnba-step-11a-draftkings-provider-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step10 file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen endpoint lineage and Step 10 remains default OFF
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step10_release_freeze as step10
          from sports_api import wnba_step11_draftkings_provider as step11
          from sports_api.wnba_draftkings_shadow_ingestion import frozen_draftkings_urls
          assert step11.STEP10_FROZEN_SHA == '4341d178aa65806e9bc001c8759eccb4a003ea63'
          assert list(step11.FROZEN_DRAFTKINGS_ENDPOINTS) == frozen_draftkings_urls()
          assert step11.OFFICIAL_SCHEDULE_URL == 'https://cdn.wnba.com/static/json/staticData/scheduleLeagueV2.json'
          assert step10.DEFAULT_ENABLED is False
          assert step10.PRODUCTION_ACTIVATION_ALLOWED is False
          assert all(value is False for value in step10.SAFETY_CONTRACT.values())
          assert step11.step11a_draftkings_provider_enabled({}) is False
          print('STEP11A_FROZEN_LINEAGE_STATIC_GUARDS_OK')
          PY

      - name: Certify Step 11A DraftKings provider bridge
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step11a_draftkings_provider_cert

      - name: Upload Step 11A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step11a-draftkings-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: step11a-draftkings-provider-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production scheduler sync OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
