name: NFL Passing Yards V40 Phoenix Selector

on:
  pull_request:
    paths:
      - "nfl_passing_yards_hub_v40.py"
      - "streamlit_memory_lazy_router_v141.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v40_phoenix_matchup_selector.py"
      - ".github/workflows/nfl-passing-yards-v40-phoenix-selector.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run V40 Phoenix selector contract
        run: python -m pytest -q tests/test_nfl_passing_yards_v40_phoenix_matchup_selector.py
