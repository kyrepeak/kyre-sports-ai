name: Universal Theme Step 2 Shell

on:
  push:
    branches:
      - "monster/universal-theme-step2-shell-v1"
    paths:
      - "kyre_universal_shell_v1.py"
      - "prototypes/universal_theme_shell_step2_v1.py"
      - "tests/test_universal_theme_shell_step2_v1.py"
      - ".github/workflows/universal-theme-step2-shell-v1.yml"

permissions:
  contents: read

jobs:
  targeted-universal-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove universal shell only
        run: python tests/test_universal_theme_shell_step2_v1.py
