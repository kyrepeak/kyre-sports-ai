name: College Football Step 10 Game Total foundation certification

on:
  workflow_dispatch:
  push:
    branches: ['feature/cfb-step10-game-total-foundation']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 10 scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step10-game-total-foundation'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step10-game-total-foundation.yml' \
            'app.py' \
            'cfb_game_total_hub_v1.py' \
            'streamlit_memory_lazy_router_v34.py' \
            'tests/test_cfb_step10_game_total_foundation.py' \
            'tests/test_streamlit_memory_lazy_router_v34.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 10 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP10_SCOPE=PASS"

      - name: Pin Step 9 freeze manifest itself
        run: |
          python - <<'PY'
          import subprocess
          import sys

          expected = "0f7eed88de6046a6e125c32bbaab199720ff5caf"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:cfb_freeze_manifest_v9.json"],
              text=True,
          ).strip()
          if actual != expected:
              print(f"cfb_freeze_manifest_v9.json changed expected={expected} actual={actual}")
              sys.exit(1)
          print("CFB_STEP9_MANIFEST_PIN=PASS")
          PY

      - name: Enforce permanently frozen CFB Steps 1 through 9
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v9.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 9:
              failures.append("CFB freeze version changed")
          if m.get("completed_steps") != [1,2,3,4,5,6,7,8,9]:
              failures.append("CFB completed steps changed")

          sections = m.get("completed_sections") or {}
          if sections.get("moneyline") is not True:
              failures.append("Moneyline completion contract changed")
          if sections.get("over_under") is not True:
              failures.append("Over/Under completion contract changed")
          if sections.get("game_total") is not False:
              failures.append("Game Total was marked complete before Step 10")

          contract = m.get("step9_contract") or {}
          if contract.get("next_section") != "Game Total":
              failures.append("Step 9 next-section handoff changed")
          if contract.get("next_step") != 10:
              failures.append("Step 9 next-step handoff changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Steps 1-9 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEPS_1_9_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]
              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")
              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP10_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile Step 10
        run: |
          python -m py_compile \
            app.py \
            cfb_game_total_hub_v1.py \
            streamlit_memory_lazy_router_v34.py \
            tests/test_cfb_step10_game_total_foundation.py \
            tests/test_streamlit_memory_lazy_router_v34.py
          PYTHONPATH=. python -c "import cfb_game_total_hub_v1; import streamlit_memory_lazy_router_v34"

      - name: Run Step 10 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step10_game_total_foundation.py \
            tests/test_streamlit_memory_lazy_router_v34.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_cfb_step9_over_under_slate_v1.py \
            tests/test_cfb_step9_over_under_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v33.py \
            tests/test_cfb_step8_over_under_model_v1.py \
            tests/test_cfb_step8_over_under_hub_v2.py \
            tests/test_streamlit_memory_lazy_router_v32.py \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_step6_moneyline_slate_v1.py \
            tests/test_streamlit_memory_lazy_router_v30.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove Step 10 Game Total isolation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          hub = Path("cfb_game_total_hub_v1.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v34.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          required = [
              'MARKET = "Game Total"',
              'SCHEDULE_PROVIDER = "cfb_schedule_v3"',
              'TEAM_DATA_PROVIDER = "cfb_team_data_v2"',
              'root._import("cfb_game_total_hub_v1")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v33"',
              'Step 11 owns the first independent Game Total distribution model',
              'Step 12 owns final synthesis/ranking',
          ]
          combined = hub + "\n" + router + "\n" + app
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 10 marker: {token}")

          forbidden = [
              "cfb_over_under_model_v1",
              "cfb_moneyline_model_v1",
              "projected_total =",
              "exact_total_probability",
              "def simulate",
              "import numpy",
              "np.random",
              "sportsbook_price",
              "expected_value",
          ]
          lower_hub = hub.lower()
          for token in forbidden:
              if token.lower() in lower_hub:
                  raise SystemExit(f"Step 10 crossed model/market boundary: {token}")

          match = re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", app)
          if not match or int(match.group(1)) < 34:
              raise SystemExit("app.py regressed below Step 10 Router V34")
          current = int(match.group(1))
          for version in range(current, 34, -1):
              source = Path(f"streamlit_memory_lazy_router_v{version}.py").read_text(encoding="utf-8")
              if f"import streamlit_memory_lazy_router_v{version - 1} as prior" not in source:
                  raise SystemExit(
                      f"Router V{version} does not preserve additive chain to Router V34"
                  )

          print("CFB_STEP10_GAME_TOTAL_FIREWALL=PASS")
          PY

      - name: Live Sept 12 Game Total foundation smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_game_total_hub_v1 as hub
          import cfb_schedule_v3 as schedule
          import cfb_team_data_v2 as team_data

          schedule.clear_schedule_cache()
          games, diag = schedule.load_with_diagnostics("2026-09-12")
          target = None
          for game in games:
              away = str(game.get("away_team") or "").lower()
              home = str(game.get("home_team") or "").lower()
              if "oklahoma" in away and "michigan" in home:
                  target = game
                  break

          print("LIVE_SCHEDULE_COUNT", len(games))
          print("LIVE_TARGET", target)
          if target is None:
              raise SystemExit("Oklahoma @ Michigan missing from live Sept 12 slate")

          team_data.clear_team_data_cache()
          profiles, team_diag = team_data.load_matchup_team_data(target, "2026-09-12")
          away = profiles.get("away") or {}
          home = profiles.get("home") or {}

          print("LIVE_AWAY_GRADE", (away.get("data_quality") or {}).get("grade"))
          print("LIVE_HOME_GRADE", (home.get("data_quality") or {}).get("grade"))
          print("LIVE_FOUNDATION_READY", hub._foundation_ready(target, away, home))
          print("LIVE_COMBINED_CONTEXT", hub._descriptive_combined_context(away, home))

          if not hub._foundation_ready(target, away, home):
              raise SystemExit("Step 10 live Game Total foundation is not ready")

          print("CFB_STEP10_LIVE_GAME_TOTAL_FOUNDATION=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP10_GAME_TOTAL_FOUNDATION_GREEN"
