name: CFB Over-Under Intelligence V2 Upgrade Step 3

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step3-offense-defense-engine']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive Step 3 scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step3-offense-defense-engine'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step3-offense-defense.yml' \
            'app.py' \
            'cfb_over_under_matchup_engine_v1.py' \
            'cfb_over_under_matchup_ui_v3.py' \
            'cfb_over_under_slate_v2.py' \
            'streamlit_memory_lazy_router_v39.py' \
            'tests/test_cfb_over_under_upgrade_step3_engine.py' \
            'tests/test_cfb_over_under_upgrade_step3_slate.py' \
            'tests/test_cfb_over_under_upgrade_step3_ui.py' \
            'tests/test_streamlit_memory_lazy_router_v39.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U Upgrade Step 3 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_UPGRADE_STEP3_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = "cfb_freeze_manifest_v12.json"
          expected_manifest_blob = "3ff2a727967e80dddbe03f747d9f32090cc39539"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev(f"HEAD:{manifest_path}") != expected_manifest_blob:
              failures.append("CFB Step-12 freeze manifest changed")

          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB path changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce permanently frozen O/U Upgrade Steps 1 and 2
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = "cfb_over_under_upgrade_freeze_manifest_v2.json"
          expected_manifest_blob = "f4357679a318217686eec38a4cb0ed32333fef00"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev(f"HEAD:{manifest_path}") != expected_manifest_blob:
              failures.append("O/U Upgrade Step 2 freeze manifest changed")

          manifest = json.loads(pathlib.Path(manifest_path).read_text())
          if manifest.get("completed_upgrade_steps") != [1, 2]:
              failures.append("O/U Upgrade Steps 1-2 completion contract changed")
          if (manifest.get("step2_contract") or {}).get("next_upgrade_step") != 3:
              failures.append("O/U Upgrade Step 2 handoff changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen O/U upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen O/U Upgrade Step 1-2 path changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_2_FROZEN=PASS")
          PY

      - name: Compile Upgrade Step 3
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_matchup_engine_v1.py \
            cfb_over_under_slate_v2.py \
            cfb_over_under_matchup_ui_v3.py \
            streamlit_memory_lazy_router_v39.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py
          PYTHONPATH=. python -c "import cfb_over_under_matchup_engine_v1; import cfb_over_under_slate_v2; import cfb_over_under_matchup_ui_v3; import streamlit_memory_lazy_router_v39"

      - name: Run Upgrade Step 3 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py \
            tests/test_cfb_over_under_upgrade_step2_rankings.py \
            tests/test_cfb_over_under_upgrade_step2_ui.py \
            tests/test_streamlit_memory_lazy_router_v38.py \
            tests/test_cfb_over_under_upgrade_step1.py \
            tests/test_streamlit_memory_lazy_router_v37.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_cfb_step9_over_under_slate_v1.py \
            tests/test_cfb_step9_over_under_hub_v3.py \
            tests/test_streamlit_memory_lazy_router_v36.py \
            tests/test_cfb_step12_game_total_final_v1.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_cfb_mixed_division_hotfix.py

      - name: Prove Step 3 model firewall and bounded adjustment
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("cfb_over_under_matchup_engine_v1.py").read_text(encoding="utf-8")
          slate = Path("cfb_over_under_slate_v2.py").read_text(encoding="utf-8")
          ui = Path("cfb_over_under_matchup_ui_v3.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v39.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = engine + "\n" + slate + "\n" + ui + "\n" + router + "\n" + app

          required = [
              'MODEL_VERSION = "CFB O/U MATCHUP ENGINE V1 • UPGRADE STEP 3 OFFENSE VS DEFENSE"',
              'MAX_TEAM_MATCHUP_ADJUSTMENT = 3.5',
              'MIN_ENGINE_MODEL_COVERAGE = 0.40',
              'MIN_ENGINE_DIMENSIONS = 3',
              'ANALYSIS_LINE_MATCHUP_WEIGHT = 0.0',
              '"analysis_line_matchup_weight": 0.0',
              'FROZEN_SLATE = "cfb_over_under_slate_v1"',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v2"',
              'root._import("cfb_over_under_matchup_ui_v3")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v38"',
              'from streamlit_memory_lazy_router_v39 import render_app',
              'cross-division rank pools are not directly comparable',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Upgrade Step 3 marker: {token}")

          forbidden = [
              "sportsbook_price",
              "market_probability =",
              "expected_value",
              "import numpy",
              "np.random",
              "import random",
              "random.",
          ]
          lower = (engine + "\n" + slate).lower()
          for token in forbidden:
              if token.lower() in lower:
                  raise SystemExit(f"Step 3 crossed market/simulation firewall: {token}")

          print("CFB_OU_UPGRADE_STEP3_MODEL_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_UPGRADE_STEP3_GREEN"
