name: CFB O/U ESPN logo hotfix V1 permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-ou-logo-hotfix-v1-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-logo-hotfix-v1-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-logo-hotfix-v1-permanent-freeze.yml' \
            'cfb_over_under_logo_hotfix_freeze_manifest_v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U logo hotfix freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_LOGO_HOTFIX_FREEZE_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen base path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"original frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 through 3 permanent freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "7c3408833b931fbb9d2e41e6660ebdf4f975f723"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v3.json") != expected_manifest_blob:
              failures.append("O/U Upgrade Step 3 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text()
          )
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen O/U Upgrade Step 1-3 path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen O/U Upgrade Step 1-3 path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_3_PERMANENT_FREEZE=PASS")
          PY

      - name: Enforce logo hotfix exact blobs and contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(
              pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v1.json").read_text()
          )

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if manifest.get("version") != 1:
              failures.append("logo hotfix freeze version changed")
          if manifest.get("completed_hotfixes") != [1]:
              failures.append("logo hotfix completion contract changed")

          contract = manifest.get("hotfix1_contract") or {}
          required_true = [
              "espn_scoreboard_alias_matching_active",
              "espn_event_id_match_active",
              "espn_event_summary_fallback_active",
              "espn_team_id_cdn_fallback_active",
              "florida_am_alias_case_certified",
              "miami_fl_alias_case_certified",
              "presentation_only",
          ]
          for key in required_true:
              if contract.get(key) is not True:
                  failures.append(f"logo hotfix contract lost {key}")

          required_false = [
              "projection_math_changed",
              "probability_math_changed",
              "selection_math_changed",
              "top5_ranking_math_changed",
              "reliability_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if contract.get(key) is not False:
                  failures.append(f"logo hotfix contract changed {key}")

          if contract.get("florida_am_espn_team_id") != "50":
              failures.append("Florida A&M ESPN team id changed")
          if contract.get("miami_espn_team_id") != "2390":
              failures.append("Miami ESPN team id changed")
          if contract.get("next_upgrade_step") != 4:
              failures.append("next upgrade handoff changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo hotfix path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"logo hotfix blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_OU_ESPN_LOGO_HOTFIX_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify active runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v40 import render_app' app.py
          python -m py_compile \
            cfb_over_under_logo_resolver_v1.py \
            cfb_over_under_matchup_ui_v3_logo_hotfix_v1.py \
            streamlit_memory_lazy_router_v40.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_logo_hotfix_v1.py \
            tests/test_cfb_over_under_logo_hotfix_router_v40.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py

      - name: Freeze marker
        run: echo "CFB_OU_ESPN_LOGO_HOTFIX_PERMANENT_FREEZE_GREEN"
