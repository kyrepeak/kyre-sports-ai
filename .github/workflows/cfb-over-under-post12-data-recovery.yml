name: CFB O/U post-12 multi-source data recovery

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-post12-data-recovery-hotfix]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact post-12 hotfix scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-post12-data-recovery.yml",
              "app.py",
              "cfb_over_under_data_recovery_v1.py",
              "cfb_over_under_slate_v12_data_recovery.py",
              "cfb_over_under_matchup_ui_v13_data_recovery.py",
              "streamlit_memory_lazy_router_v53.py",
              "tests/test_cfb_over_under_post12_data_recovery.py",
              "tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py",
          }
          if actual!=expected:
              print("expected",sorted(expected)); print("actual",sorted(actual)); sys.exit(1)
          print("CFB_OU_POST12_DATA_RECOVERY_SCOPE=PASS")
          PY

      - name: Enforce full 12-step permanent freeze
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec): return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v12.json")!="b2a798b4625bda5b8472a30e66cde2ecf6aef923":
              failures.append("V12 master freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v12.json").read_text())
          if manifest.get("upgrade_complete") is not True:
              failures.append("12/12 upgrade_complete changed")
          for path,expected in (manifest.get("exact_blobs") or {}).items():
              try: actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen path: {path}"); continue
              if actual!=expected: failures.append(f"frozen 12-step blob changed: {path}")
          if failures:
              print(*failures,sep="\n"); sys.exit(1)
          print("CFB_OU_12_OF_12_PERMANENT_FREEZE_UNTOUCHED=PASS")
          PY

      - name: Compile post-12 recovery hotfix
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_data_recovery_v1.py",
              "cfb_over_under_slate_v12_data_recovery.py",
              "cfb_over_under_matchup_ui_v13_data_recovery.py",
              "streamlit_memory_lazy_router_v53.py",
              "tests/test_cfb_over_under_post12_data_recovery.py",
              "tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_POST12_DATA_RECOVERY_COMPILE=PASS")
          PY
          PYTHONPATH=. python -c "import cfb_over_under_data_recovery_v1; import cfb_over_under_slate_v12_data_recovery; import cfb_over_under_matchup_ui_v13_data_recovery; import streamlit_memory_lazy_router_v53"

      - name: Run post-12 and full inherited regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_post12_data_recovery.py tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py tests/test_cfb_over_under_upgrade_step12_certification.py tests/test_cfb_over_under_upgrade_step12_slate.py tests/test_cfb_over_under_upgrade_step12_ui_router.py tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py tests/test_cfb_over_under_upgrade_step11_slate.py tests/test_cfb_over_under_upgrade_step11_ui_router.py tests/test_cfb_over_under_upgrade_step10_history_engine.py tests/test_cfb_over_under_upgrade_step10_slate.py tests/test_cfb_over_under_upgrade_step10_ui_router.py tests/test_cfb_over_under_upgrade_step9_environment_engine.py tests/test_cfb_over_under_upgrade_step9_slate.py tests/test_cfb_over_under_upgrade_step9_ui_router.py tests/test_cfb_over_under_upgrade_step8_turnover_engine.py tests/test_cfb_over_under_upgrade_step8_slate.py tests/test_cfb_over_under_upgrade_step8_ui_router.py tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Live forced ESPN recovery for Florida A&M at Miami
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_data_recovery_v1 as recovery

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))

          original=recovery._FROZEN_ENV_BUILD
          recovery._FROZEN_ENV_BUILD=lambda *a,**k:{
              "ready":True,
              "model_ready":False,
              "reason":"forced exact-date scoreboard miss for recovery certification",
              "event_id":"",
              "diagnostics":{},
              "analysis_line_environment_weight":0.0,
              "projected_total_environment_weight":0.0,
              "injury_model_weight":0.0,
              "sportsbook_input_used":False,
              "market_price_used":False,
              "market_probability_used":False,
              "edge_or_ev_used":False,
              "monte_carlo_used":False,
          }
          try:
              out=recovery.build_environment_engine(
                  game,
                  {"team":"Florida A&M"},
                  {"team":"Miami (FL)"},
              )
          finally:
              recovery._FROZEN_ENV_BUILD=original

          print("FORCED_RECOVERY",json.dumps({
              "model_ready":out.get("model_ready"),
              "event_id":out.get("event_id"),
              "away_id":out.get("away_espn_team_id"),
              "home_id":out.get("home_espn_team_id"),
              "source":out.get("recovery_source"),
              "venue":(out.get("venue") or {}).get("name"),
              "temperature":(out.get("weather") or {}).get("temperature_f"),
              "recovery_used":out.get("recovery_used"),
          },indent=2,default=str))
          if out.get("away_espn_team_id")!="50" or out.get("home_espn_team_id")!="2390":
              raise SystemExit("team-id recovery failed")
          if out.get("event_id")!="401858213":
              raise SystemExit(f"exact team-schedule event recovery failed: {out.get('event_id')}")
          if out.get("recovery_used") is not True:
              raise SystemExit("forced recovery path did not mark recovery_used")
          if not str(out.get("recovery_source") or ""):
              raise SystemExit("recovery source missing")
          print("LIVE_FAMU_MIAMI_FORCED_ESPN_DATA_RECOVERY=PASS")
          PY

      - name: Live Winsipedia H2H recovery
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_over_under_data_recovery_v1 as recovery

          try: recovery._fetch_winsipedia_games.clear()
          except Exception: pass
          out=recovery._fetch_winsipedia_games("Florida A&M","Miami (FL)")
          print("WINSIPEDIA_H2H",json.dumps({
              "ready":out.get("ready"),
              "source":out.get("source"),
              "url":out.get("source_url"),
              "meetings":out.get("meetings"),
              "away_wins":out.get("away_wins"),
              "home_wins":out.get("home_wins"),
              "avg_total":out.get("avg_combined_total"),
              "latest":out.get("latest"),
          },indent=2,default=str))
          if out.get("ready") is not True:
              raise SystemExit("Winsipedia H2H fallback unavailable")
          if int(out.get("meetings") or 0)!=12:
              raise SystemExit(f"expected 12 FAMU-Miami meetings, got {out.get('meetings')}")
          if int(out.get("away_wins") or 0)!=1 or int(out.get("home_wins") or 0)!=11:
              raise SystemExit("FAMU-Miami all-time record mismatch")
          latest=out.get("latest") or {}
          if latest.get("date")!="2024-09-07":
              raise SystemExit(f"latest H2H date mismatch: {latest}")
          if int(latest.get("away_points") or -1)!=9 or int(latest.get("home_points") or -1)!=56:
              raise SystemExit(f"latest H2H score mismatch: {latest}")
          if float(out.get("projection_weight") or 0)!=0.0 or float(out.get("selection_weight") or 0)!=0.0:
              raise SystemExit("external H2H crossed projection/selection firewall")
          print("LIVE_FAMU_MIAMI_WINSIPEDIA_H2H_RECOVERY=PASS")
          PY

      - name: Live recovered full result remains Step-12 certified
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_schedule_v3 as schedule
          import cfb_over_under_slate_v12_data_recovery as slate

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          try: slate.analyze_game.clear()
          except Exception: pass
          result=slate.analyze_game(game,"2026-09-10",50.5)
          cert=result.get("certification") or {}
          history=result.get("history_engine") or {}
          env=result.get("environment_engine") or {}
          form=result.get("form_strength_engine") or {}
          ext=history.get("all_time_head_to_head") or {}
          print("RECOVERED_RESULT",json.dumps({
              "cert_status":cert.get("status"),
              "cert_failures":cert.get("checks_failed"),
              "env_ready":env.get("model_ready"),
              "env_recovery_used":env.get("recovery_used"),
              "event_id":env.get("event_id"),
              "external_h2h_ready":ext.get("ready"),
              "external_h2h_meetings":ext.get("meetings"),
              "form_ready":form.get("model_ready"),
              "form_reason":form.get("reason"),
              "projected_total":(result.get("raw") or {}).get("projected_total"),
          },indent=2,default=str))
          if cert.get("status")!="CERTIFIED" or int(cert.get("checks_failed") or 0)!=0:
              raise SystemExit(f"recovered full result lost Step-12 certification: {cert}")
          if ext.get("ready") is not True or int(ext.get("meetings") or 0)!=12:
              raise SystemExit("all-time H2H did not reach recovered result")
          print("LIVE_FAMU_MIAMI_RECOVERED_STEP12_CERTIFIED=PASS")
          PY

      - name: Live UI shows recovered data instead of blank gate
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_schedule_v3 as schedule
          import cfb_over_under_matchup_ui_v13_data_recovery as ui

          games,_=schedule.load_with_diagnostics("2026-09-10")
          game=next(g for g in games if "Florida A&M" in str(g.get("away_team")) and "Miami" in str(g.get("home_team")))
          away={"team":"Florida A&M"}
          home={"team":"Miami (FL)"}
          hero=ui._hero_v13(game,away,home)
          for token in (
              "STEP 9 • ENVIRONMENT + IDENTITY RECOVERY",
              "STEP 10 • RECENT TEAM HISTORY",
              "ALL-TIME SERIES • EXTERNAL VERIFIED FALLBACK",
              "12",
              "2024-09-07",
              "STEP 11 • CURRENT FORM + SCHEDULE STRENGTH",
              "STEP 12 FINAL CERTIFICATION REMAINS ACTIVE",
          ):
              if token not in hero:
                  raise SystemExit(f"recovery UI missing: {token}")
          if "projection weight 0%" not in hero:
              raise SystemExit("external history weighting disclosure missing")
          print("LIVE_FAMU_MIAMI_RECOVERY_UI_NOT_BLANK=PASS")
          PY

      - name: Prove post-12 model firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_data_recovery_v1.py",
              "cfb_over_under_slate_v12_data_recovery.py",
              "cfb_over_under_matchup_ui_v13_data_recovery.py",
              "streamlit_memory_lazy_router_v53.py",
              "app.py",
          ))
          required=[
              'FROZEN_STEP12_COMPLETE = True',
              'EXTERNAL_HISTORY_PROJECTION_WEIGHT = 0.0',
              'EXTERNAL_HISTORY_SELECTION_WEIGHT = 0.0',
              'EXTERNAL_HISTORY_ANALYSIS_LINE_WEIGHT = 0.0',
              'FROZEN_STEP12_SLATE = "cfb_over_under_slate_v11"',
              'FROZEN_STEP12_UI = "cfb_over_under_matchup_ui_v12"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v52"',
              'from streamlit_memory_lazy_router_v53 import render_app',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing post-12 firewall marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"post-12 recovery crossed model firewall: {token}")
          print("CFB_OU_POST12_DATA_RECOVERY_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo CFB_OU_POST12_MULTI_SOURCE_DATA_RECOVERY_GREEN
