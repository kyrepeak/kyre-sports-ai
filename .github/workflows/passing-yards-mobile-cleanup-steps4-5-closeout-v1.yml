name: NFL Passing Yards Mobile Cleanup Steps 4-5 Closeout V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-mobile-cleanup-steps4-5-closeout-v1.yml"
      - "devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py"
      - "devsystem/task_ledgers/passing-yards-mobile-cleanup-steps4-5-closeout-v1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-mobile-cleanup-steps4-5-closeout-v1.yml"
      - "devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py"
      - "devsystem/task_ledgers/passing-yards-mobile-cleanup-steps4-5-closeout-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-mobile-cleanup-steps4-5-closeout-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact certification-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-mobile-cleanup-steps4-5-closeout-v1.yml
          devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py
          devsystem/task_ledgers/passing-yards-mobile-cleanup-steps4-5-closeout-v1.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_MOBILE_CLEANUP_STEPS4_5_SCOPE_GREEN"

      - name: Install static runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Compile closeout verifier
        run: python -m py_compile devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py

      - name: Verify frozen activation and closeout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import nfl_passing_yards_hub_v70 as v70
          import streamlit_memory_lazy_router_v221 as v221

          ledger=json.loads(Path("devsystem/task_ledgers/passing-yards-mobile-cleanup-steps4-5-closeout-v1.json").read_text())
          assert ledger["status"] == "DONE"
          assert ledger["step4_status"] == "DONE"
          assert ledger["step5_status"] == "DONE"
          assert ledger["certification_only"] is True
          assert ledger["product_files_changed"] is False

          assert v70.MOBILE_CLEANUP_VERSION == "v70"
          assert v70.PRESENTATION_ONLY is True
          assert v70.MAY_MODIFY_PROJECTION is False
          assert v70.MAY_MODIFY_DATA is False
          assert v70.MAY_MODIFY_NAVIGATION_STATE is False
          assert v70.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0

          assert v221.PASSING_HUB == "nfl_passing_yards_hub_v70"
          assert v221.PRESENTATION_ONLY is True
          assert v221.MAY_MODIFY_NAVIGATION_STATE is False
          assert v221.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0

          app=Path("app.py").read_text()
          assert 'from streamlit_memory_lazy_router_v221 import record_bootstrap_import_ms, render_app' in app
          print("PASSING_YARDS_MOBILE_CLEANUP_STEPS4_5_STATIC_GREEN")
          PY

  step4-desktop-closeout-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install branch proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-mobile-cleanup-steps4-5
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-mobile-cleanup-steps4-5/streamlit.log 2>&1 &
          echo $! > /tmp/passing_yards_steps4_5_pid

      - name: Prove Step 4 desktop visual closeout
        run: |
          python devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py \
            --base-url http://127.0.0.1:8501 \
            --mode desktop \
            --artifact-dir artifacts/passing-yards-mobile-cleanup-steps4-5/step4

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 600 artifacts/passing-yards-mobile-cleanup-steps4-5/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/passing_yards_steps4_5_pid ]; then kill "$(cat /tmp/passing_yards_steps4_5_pid)" 2>/dev/null || true; fi

      - name: Upload Step 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-mobile-cleanup-step4-${{ github.run_id }}
          path: artifacts/passing-yards-mobile-cleanup-steps4-5
          if-no-files-found: warn
          retention-days: 7

  step5-public-final-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Run one final public production proof
        run: |
          python devsystem/passing_yards_mobile_cleanup_steps4_5_closeout_v1.py \
            --base-url https://kyre-sports-ai.streamlit.app \
            --mode public \
            --artifact-dir artifacts/passing-yards-mobile-cleanup-steps4-5/step5-public

      - name: Upload Step 5 public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-mobile-cleanup-step5-public-${{ github.run_id }}
          path: artifacts/passing-yards-mobile-cleanup-steps4-5
          if-no-files-found: warn
          retention-days: 14
