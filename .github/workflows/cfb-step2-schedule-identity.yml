name: College Football Step 2 schedule-identity certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/cfb-step2-schedule-identity']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 2 implementation scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step2-schedule-identity'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step2-schedule-identity.yml' \
            'app.py' \
            'cfb_hub_v2.py' \
            'cfb_schedule_v1.py' \
            'streamlit_memory_lazy_router_v24.py' \
            'tests/test_cfb_step2_schedule_identity.py' \
            'tests/test_streamlit_memory_lazy_router_v24.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 2 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP2_SCOPE=PASS"

      - name: Enforce frozen College Football Step 1
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v1.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("completed_steps") != [1]:
              failures.append("Step 1 completed_steps contract changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB Step 1 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Step 1 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP1_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP2_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile College Football Step 2
        run: |
          python -m py_compile \
            app.py \
            cfb_schedule_v1.py \
            cfb_hub_v2.py \
            streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py
          PYTHONPATH=. python -c "import cfb_schedule_v1; import cfb_hub_v2; import streamlit_memory_lazy_router_v24"

      - name: Run College Football Step 2 regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove Step 2 source and no-model boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          schedule = Path("cfb_schedule_v1.py").read_text(encoding="utf-8")
          hub = Path("cfb_hub_v2.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v24.py").read_text(encoding="utf-8")

          required_schedule = [
              "https://sdataprod.ncaa.com/",
              "NCAA_schedules_today_web",
              "a25ad021179ce1d97fb951a49954dc98da150089f9766e7e85890e439516ffbf",
              "NCAA_FBS_DIVISION = 11",
              "ESPN_SCOREBOARD_URL",
              "identity_key",
              "duplicate_event_ids_dropped",
              "off_date_contests_ignored",
          ]
          for token in required_schedule:
              if token not in schedule:
                  raise SystemExit(f"missing Step 2 schedule marker: {token}")

          forbidden = [
              "import numpy",
              "np.random",
              "def simulate",
              "def win_probability",
              "fair_odds =",
              "projected_total =",
          ]
          for token in forbidden:
              if token in hub or token in schedule:
                  raise SystemExit(f"Step 2 crossed model boundary: {token}")

          if "streamlit_memory_lazy_router_v24" not in app:
              raise SystemExit("app.py is not booting Router V24")
          if 'root._import("cfb_hub_v2")' not in router:
              raise SystemExit("Router V24 is not routing CFB to Hub V2")
          if 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v23"' not in router:
              raise SystemExit("Router V24 is not additive over frozen V23")

          print("CFB_STEP2_DATA_IDENTITY_BOUNDARY=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP2_SCHEDULE_IDENTITY_GREEN"
