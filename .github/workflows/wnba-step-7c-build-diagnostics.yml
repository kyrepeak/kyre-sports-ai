name: WNBA Step 7C Render build diagnostics

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wnba-step-7c-build-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - name: Read Render build logs only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          import httpx

          token = os.environ['RENDER_API_KEY']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
          with httpx.Client(base_url='https://api.render.com', headers=headers, timeout=30) as c:
              owners = c.get('/v1/owners', params={'limit': 100})
              owners.raise_for_status()
              owner_rows = owners.json()
              owner_ids = []
              for row in owner_rows if isinstance(owner_rows, list) else []:
                  obj = row.get('owner') if isinstance(row, dict) and isinstance(row.get('owner'), dict) else row
                  if isinstance(obj, dict) and obj.get('id'):
                      owner_ids.append(obj['id'])
              configured = (os.environ.get('RENDER_OWNER_ID') or '').strip()
              owner_id = configured or (owner_ids[0] if len(owner_ids) == 1 else '')
              assert owner_id, f'Could not resolve exactly one Render owner; count={len(owner_ids)}'

              services = c.get('/v1/services', params={'ownerId': owner_id, 'name': 'kyre-sports-api', 'limit': 100})
              services.raise_for_status()
              rows = services.json()
              matches = []
              for row in rows if isinstance(rows, list) else []:
                  obj = row.get('service') if isinstance(row, dict) and isinstance(row.get('service'), dict) else row
                  if isinstance(obj, dict) and obj.get('id'):
                      matches.append(obj)
              assert len(matches) == 1, f'Expected one kyre-sports-api service; found={len(matches)}'
              service_id = matches[0]['id']

              logs = c.get('/v1/logs', params=[
                  ('ownerId', owner_id),
                  ('resource', service_id),
                  ('type', 'build'),
                  ('direction', 'backward'),
                  ('limit', '100'),
              ])
              logs.raise_for_status()
              doc = logs.json()

          def collect_messages(value):
              out = []
              if isinstance(value, dict):
                  for k, v in value.items():
                      if k in {'message', 'text'} and isinstance(v, str):
                          out.append(v)
                      else:
                          out.extend(collect_messages(v))
              elif isinstance(value, list):
                  for v in value:
                      out.extend(collect_messages(v))
              return out

          messages = collect_messages(doc)
          secret = token
          print(f'Render service id: {service_id}')
          print(f'Build log lines found: {len(messages)}')
          for line in reversed(messages[-100:]):
              safe = line.replace(secret, '***')
              print(safe)
          PY
