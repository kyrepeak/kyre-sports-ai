name: MLB Matchup Explorer cleanup Step 4 player hero certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step3-roster-groups.yml'
      - '.github/workflows/mlb-matchup-explorer-cleanup-step4-player-hero.yml'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v45.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step4_player_hero.py'
  push:
    branches: ['mlb-matchup-explorer-cleanup-step4-player-hero']
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step3-roster-groups.yml'
      - '.github/workflows/mlb-matchup-explorer-cleanup-step4-player-hero.yml'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v45.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step4_player_hero.py'

permissions:
  contents: read

jobs:
  certify:
    # Historical exact-scope certification belongs only to its original branch.
    # Later additive Matchup presentation layers have their own freeze workflow.
    if: github.event_name == 'push' || github.head_ref == 'mlb-matchup-explorer-cleanup-step4-player-hero'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact cleanup Step 4 scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-explorer-cleanup-step3-roster-groups.yml' \
            '.github/workflows/mlb-matchup-explorer-cleanup-step4-player-hero.yml' \
            'mlb_matchup_hub_v27.py' \
            'mlb_matchup_hub_v45.py' \
            'tests/test_mlb_matchup_explorer_cleanup_step4_player_hero.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup Explorer cleanup Step 4 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CLEANUP_STEP4_EXACT_FIVE_FILE_SCOPE=PASS"

      - name: Prove Steps 1-3, V2 model and ranking chain are frozen
        run: |
          for path in \
            mlb_matchup_hub_v44.py \
            mlb_matchup_hub_v43.py \
            mlb_matchup_hub_v42.py \
            mlb_matchup_hub_v41.py \
            mlb_matchup_hub_v14.py \
            mlb_matchup_player_v35.py \
            mlb_matchup_probability_v1.py \
            mlb_matchup_calibration_v1.py \
            mlb_matchup_rankings_v21.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Matchup boundary changed: $path"
              exit 1
            fi
          done
          echo "MATCHUP_STEPS1_3_AND_V2_FREEZE=PASS"

      - name: Prove Moneyline page is untouched
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline presentation changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_PAGE_FREEZE=PASS"

      - name: Compile cleanup presentation
        run: |
          python -m py_compile \
            mlb_matchup_hub_v27.py \
            mlb_matchup_hub_v45.py \
            tests/test_mlb_matchup_explorer_cleanup_step4_player_hero.py

      - name: Run cleanup Step 4 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_explorer_cleanup_step4_player_hero.py

      - name: Certification marker
        run: echo "MLB_MATCHUP_EXPLORER_CLEANUP_STEP4_PLAYER_HERO_GREEN"
