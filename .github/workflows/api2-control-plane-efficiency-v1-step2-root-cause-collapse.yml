name: API2 Control-Plane Efficiency V1 Step 2 Root-Cause Collapse

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step2-root-cause-collapse.yml"
      - "devsystem/failure_packet_v1.py"
      - "devsystem/root_cause_collapse_engine_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step2-root-cause-collapse.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step2-root-cause-collapse.json"
      - "tests/test_devsystem_root_cause_collapse_engine_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/api2-control-plane-efficiency-v1-step2-root-cause-collapse.yml"
      - "devsystem/failure_packet_v1.py"
      - "devsystem/root_cause_collapse_engine_v1.py"
      - "devsystem/execution_plans/api2-control-plane-efficiency-v1-step2-root-cause-collapse.json"
      - "devsystem/task_ledgers/api2-control-plane-efficiency-v1-step2-root-cause-collapse.json"
      - "tests/test_devsystem_root_cause_collapse_engine_v1.py"

permissions:
  contents: read

concurrency:
  group: api2-control-plane-efficiency-v1-step2-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root-cause-collapse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Step 2 permanent contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m py_compile devsystem/root_cause_collapse_engine_v1.py devsystem/failure_packet_v1.py
          python -m pytest -q             tests/test_devsystem_root_cause_collapse_engine_v1.py             tests/test_devsystem_failure_packet_v1.py
          python devsystem/root_cause_collapse_engine_v1.py
      - name: Prove exact head preserves frozen artifacts
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/frozen-registry.json
          python devsystem/frozen_artifact_registry_v1.py verify-head             --registry-file /tmp/frozen-registry.json             --head HEAD
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP2_FROZEN_PARENTS_GREEN"
      - name: Certify exact PR head
        if: github.event_name == 'pull_request'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP2_BRANCH_GREEN"
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP2_READY_TO_MERGE"
      - name: Certify merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "API2_CONTROL_PLANE_EFFICIENCY_V1_STEP2_MAIN_GREEN"
