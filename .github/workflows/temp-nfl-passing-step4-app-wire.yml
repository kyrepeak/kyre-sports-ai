name: TEMP Passing Step4 App Wire

on:
  push:
    branches: [nfl-passing-yards-visual-parity-step4-context-cards]
    paths:
      - ".github/workflows/temp-nfl-passing-step4-app-wire.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-passing-yards-visual-parity-step4-context-cards
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guarded app V124 activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()

          replacements = [
              (
                  '"""Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 3.',
                  '"""Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 4.',
              ),
              (
                  '    from streamlit_memory_lazy_router_v122 import render_app as _frozen_v122_render_app\n',
                  '    from streamlit_memory_lazy_router_v122 import render_app as _frozen_v122_render_app\n'
                  '    from streamlit_memory_lazy_router_v123 import render_app as _frozen_v123_render_app\n'
                  '    from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app\n',
              ),
              (
                  'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13"',
                  'FROZEN_V123_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V123_NFL_PASSING_YARDS_VISUAL_PARITY_STEP3_QB_PROFILE_2026-09-13"\n'
                  'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V124_NFL_PASSING_YARDS_VISUAL_PARITY_STEP4_CONTEXT_CARDS_2026-09-13"',
              ),
              (
                  '    from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app\n    _bootstrap_import_ms =',
                  '    from streamlit_memory_lazy_router_v124 import record_bootstrap_import_ms, render_app\n    _bootstrap_import_ms =',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'APP_WIRE_GUARD_FAILED count={count} anchor={old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          python -m py_compile app.py
          grep -F 'STREAMLIT_MAIN_V124_NFL_PASSING_YARDS_VISUAL_PARITY_STEP4_CONTEXT_CARDS_2026-09-13' app.py
          grep -F 'from streamlit_memory_lazy_router_v124 import record_bootstrap_import_ms, render_app' app.py
          grep -F 'from streamlit_memory_lazy_router_v123 import record_bootstrap_import_ms, render_app' app.py
      - name: Commit guarded app wire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && { echo 'No app change produced'; exit 1; }
          git commit -m "Wire Passing visual Step 4 Router V124"
          git push origin HEAD:nfl-passing-yards-visual-parity-step4-context-cards
