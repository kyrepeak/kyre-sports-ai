name: NFL Prop Analytics Visual Polish Step 3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json"
      - "nfl_prop_analytics_schedule_v1.py"
      - "nfl_prop_analytics_game_select_v1.py"
      - "tests/test_nfl_prop_analytics_visual_polish_step3_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json"
      - "nfl_prop_analytics_schedule_v1.py"
      - "nfl_prop_analytics_game_select_v1.py"
      - "tests/test_nfl_prop_analytics_visual_polish_step3_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-visual-polish-step3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact visual-polish scope and frozen downstream product
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-step2-schedule-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step3-game-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-visual-polish-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-visual-polish-step3-v1.json' \
            'nfl_prop_analytics_schedule_v1.py' \
            'nfl_prop_analytics_game_select_v1.py' \
            'tests/test_nfl_prop_analytics_visual_polish_step3_v1.py' | sort)"
          test "$actual" = "$expected" || {
            echo "PROP_ANALYTICS_VISUAL_POLISH_STEP3_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "PROP_ANALYTICS_VISUAL_POLISH_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_hub_v1.py 0f0016e5e34ea026aed31b548b5c639444a8a75b
          check_blob nfl_prop_analytics_matchup_shell_v1.py 0d2770ff641090e396ae43bea4bf512213c59564
          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob nfl_prop_analytics_availability_depth_v1.py cf7fdeee4c18d95c19d2a737f59bda7818e059ae
          check_blob nfl_prop_analytics_player_select_v1.py b9aa4ec194ffea970d6858dcd0e0ed7c31ae0426
          check_blob nfl_prop_analytics_prop_page_v1.py c1dc331b6bb63558229ae2dba2e36b4b8c1951fe
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          echo "PROP_ANALYTICS_VISUAL_POLISH_DOWNSTREAM_FROZEN_GREEN"
          echo "PROP_ANALYTICS_VISUAL_POLISH_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test full Prop Analytics regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_schedule_v1.py nfl_prop_analytics_game_select_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py \
            tests/test_nfl_prop_analytics_step3_game_handoff_v1.py \
            tests/test_nfl_prop_analytics_step4_page2_shell_v1.py \
            tests/test_nfl_prop_analytics_step5_roster_truth_v1.py \
            tests/test_nfl_prop_analytics_step6_availability_depth_v1.py \
            tests/test_nfl_prop_analytics_step7_player_handoff_v1.py \
            tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py \
            tests/test_nfl_prop_analytics_visual_polish_step3_v1.py
          echo "PROP_ANALYTICS_VISUAL_POLISH_STATIC_GREEN"

      - name: Prove live logos and kickoff contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from datetime import date
          import requests
          from nfl_prop_analytics_schedule_v1 import _load_schedule_truth_uncached, team_logo_url
          from nfl_prop_analytics_game_select_v1 import build_matchup_handoff, _handoff_kickoff_label

          truth=_load_schedule_truth_uncached(date(2026,9,27))
          games=[g for g in truth["games"] if g["verified"]]
          if len(games)!=14:
              raise RuntimeError(f"VISUAL_POLISH_EXPECTED_14_GAMES:{len(games)}")

          teams=sorted({g["away"] for g in games}|{g["home"] for g in games})
          for team in teams:
              url=team_logo_url(team)
              r=requests.get(url,timeout=10)
              if r.status_code != 200 or not r.content:
                  raise RuntimeError(f"VISUAL_POLISH_LOGO_NOT_LOADABLE:{team}:{r.status_code}")

          carcle=next(g for g in games if g["away"]=="CAR" and g["home"]=="CLE")
          handoff=build_matchup_handoff(carcle,truth["target_date"])
          kickoff=_handoff_kickoff_label(handoff)
          if kickoff!="1:00 PM ET":
              raise RuntimeError(f"VISUAL_POLISH_KICKOFF_WRONG:{kickoff}")

          print("PROP_ANALYTICS_VISUAL_POLISH_14_GAMES_GREEN")
          print("PROP_ANALYTICS_VISUAL_POLISH_LOGO_URLS_GREEN",len(teams))
          print("PROP_ANALYTICS_VISUAL_POLISH_KICKOFF_GREEN",kickoff)
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/visual-polish-step3
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/visual-polish-step3/streamlit.log 2>&1 &
          echo $! > /tmp/visual_polish_pid

      - name: Prove logos, kickoff, responsive layout, and frozen Passing Yards
        run: |
          python - <<'PY'
          import time, requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          else: raise RuntimeError("VISUAL_POLISH_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("VISUAL_POLISH_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1200})
              page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE"}),wait_until="domcontentloaded",timeout=120000)

              _,board=find(page,'[data-nfl-prop-analytics-step2-schedule="v1"]')
              _,sel=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]')
              assert int(board.get_attribute("data-prop-schedule-count") or 0)==14

              logos=page.locator('[data-prop-team-logo]')
              if logos.count()!=28:
                  raise RuntimeError(f"VISUAL_POLISH_SCHEDULE_LOGO_COUNT:{logos.count()}")
              end=time.monotonic()+30
              while time.monotonic()<end:
                  good=logos.evaluate_all("els=>els.filter(e=>e.complete&&e.naturalWidth>0).length")
                  if good==28: break
                  page.wait_for_timeout(300)
              if good!=28: raise RuntimeError(f"VISUAL_POLISH_SCHEDULE_LOGOS_NOT_LOADED:{good}")

              selected_logos=page.locator('[data-prop-selected-team-logo]')
              assert selected_logos.count()==2,selected_logos.count()
              kickoff=sel.locator('[data-prop-selected-kickoff]').get_attribute("data-prop-selected-kickoff")
              assert kickoff=="1:00 PM ET",kickoff

              print("PROP_ANALYTICS_VISUAL_POLISH_BRANCH_28_LOGOS_GREEN")
              print("PROP_ANALYTICS_VISUAL_POLISH_BRANCH_SELECTED_LOGOS_GREEN")
              print("PROP_ANALYTICS_VISUAL_POLISH_BRANCH_TIME_GREEN",kickoff)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height}); page.wait_for_timeout(200)
                  for el,name in ((board,"schedule"),(sel,"selection")):
                      dims=el.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                      if dims["scroll"]>dims["client"]+4:
                          raise RuntimeError(f"VISUAL_POLISH_OVERFLOW:{name}:{width}:{dims}")
                  print(f"PROP_ANALYTICS_VISUAL_POLISH_BRANCH_{width}_GREEN")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_VISUAL_POLISH_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              passing.close(); page.close(); browser.close()

          print("PROP_ANALYTICS_VISUAL_POLISH_BRANCH_GREEN")
          PY

      - name: Print log on failure
        if: failure()
        run: tail -n 1600 artifacts/visual-polish-step3/streamlit.log || true

      - name: Stop branch Streamlit
        if: always()
        run: |
          if [ -f /tmp/visual_polish_pid ]; then kill "$(cat /tmp/visual_polish_pid)" 2>/dev/null || true; fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public logos + kickoff and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("VISUAL_POLISH_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def open_polish(browser):
              deadline=time.monotonic()+1200; last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE"}),wait_until="domcontentloaded",timeout=120000)
                      _,board=find(page,'[data-nfl-prop-analytics-step2-schedule="v1"]',150)
                      _,sel=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]',150)
                      logos=page.locator('[data-prop-team-logo]')
                      selected=page.locator('[data-prop-selected-team-logo]')
                      kickoff=sel.locator('[data-prop-selected-kickoff]').get_attribute("data-prop-selected-kickoff")
                      if int(board.get_attribute("data-prop-schedule-count") or 0)!=14: last="GAME_COUNT"
                      elif logos.count()!=28: last=f"LOGO_COUNT:{logos.count()}"
                      elif selected.count()!=2: last=f"SELECTED_LOGOS:{selected.count()}"
                      elif kickoff!="1:00 PM ET": last=f"KICKOFF:{kickoff}"
                      else: return context,page,board,sel,logos,kickoff
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"; print("VISUAL_POLISH_PUBLIC_DEPLOY_WAIT",last)
                  try: context.close()
                  except Exception: pass
                  time.sleep(8)
              raise RuntimeError("VISUAL_POLISH_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context,page,board,sel,logos,kickoff=open_polish(browser)
              end=time.monotonic()+30
              good=0
              while time.monotonic()<end:
                  good=logos.evaluate_all("els=>els.filter(e=>e.complete&&e.naturalWidth>0).length")
                  if good==28: break
                  page.wait_for_timeout(300)
              assert good==28,good

              print("PROP_ANALYTICS_VISUAL_POLISH_PUBLIC_28_LOGOS_GREEN")
              print("PROP_ANALYTICS_VISUAL_POLISH_PUBLIC_SELECTED_LOGOS_GREEN")
              print("PROP_ANALYTICS_VISUAL_POLISH_PUBLIC_TIME_GREEN",kickoff)

              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height}); page.wait_for_timeout(200)
                  for el,name in ((board,"schedule"),(sel,"selection")):
                      dims=el.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                      if dims["scroll"]>dims["client"]+4:
                          raise RuntimeError(f"VISUAL_POLISH_PUBLIC_OVERFLOW:{name}:{width}:{dims}")
                  print(f"PROP_ANALYTICS_VISUAL_POLISH_PUBLIC_{width}_GREEN")

              passing=context.new_page()
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_VISUAL_POLISH_PASSING_YARDS_PUBLIC_FROZEN_GREEN")
              passing.close(); page.close(); context.close(); browser.close()

          print("PROP_ANALYTICS_VISUAL_POLISH_STEP3_GREEN")
          print("PROP_ANALYTICS_VISUAL_POLISH_STEP3_PUBLIC_GREEN")
          print("PROP_ANALYTICS_VISUAL_POLISH_STEP3_FROZEN")
          print("PROP_ANALYTICS_LOGOS_TIMES_POLISH_COMPLETE")
          PY
