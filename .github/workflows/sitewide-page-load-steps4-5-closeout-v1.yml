name: Sitewide Page Load Steps 4-5 Closeout V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sitewide-page-load-steps4-5-closeout-v1.yml"
      - "devsystem/task_ledgers/sitewide-steps4-5-closeout-v2.json"
      - "streamlit_memory_lazy_router_v236.py"
      - "app.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sitewide-page-load-steps4-5-closeout-v1.yml"
      - "devsystem/task_ledgers/sitewide-steps4-5-closeout-v2.json"
      - "streamlit_memory_lazy_router_v236.py"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitewide-page-load-steps4-5-closeout-v1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receptions-static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove V236 Receptions-only additive contract
        run: |
          python -m py_compile streamlit_memory_lazy_router_v236.py
          python - <<'PY'
          from pathlib import Path
          router = Path("streamlit_memory_lazy_router_v236.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v235"' in router
          assert 'RECEPTIONS_MARKET = "Receptions"' in router
          assert 'legacy_receptions.RECEPTIONS_MARKET = "__V236_RECEPTIONS_BYPASS__"' in router
          assert 'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0' in router
          assert 'MAY_MODIFY_PROJECTION = False' in router
          assert 'MAY_MODIFY_PROBABILITY = False' in router
          assert 'MAY_MODIFY_MARKET_MATH = False' in router
          assert 'from streamlit_memory_lazy_router_v236 import record_bootstrap_import_ms, render_app' in app

          print("NFL_RECEPTIONS_V236_STATIC_GREEN")
          PY

  branch-receptions-product-proof:
    if: github.event_name == 'pull_request'
    needs: receptions-static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install branch browser runtime
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start branch Streamlit
        run: |
          python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            >/tmp/receptions-v236-streamlit.log 2>&1 &
          echo $! >/tmp/receptions-v236.pid

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "NFL_RECEPTIONS_V236_BRANCH_SERVER_GREEN"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/receptions-v236-streamlit.log || true
          exit 1

      - name: Prove branch NFL Receptions route
        run: |
          python devsystem/sitewide_page_load_health_v1.py \
            --base-url "http://127.0.0.1:8501" \
            --only-sport "NFL" \
            --only-market "Receptions" \
            --steps23-only \
            --json-out /tmp/receptions-v236-branch.json

          echo "NFL_RECEPTIONS_V236_BRANCH_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP45_PR_PROOF_GREEN"

      - name: Print branch log on failure
        if: failure()
        run: |
          tail -n 400 /tmp/receptions-v236-streamlit.log || true
          cat /tmp/receptions-v236-branch.json || true

  public-receptions-closeout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: receptions-static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused browser proof
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove NFL Receptions public route and freeze Steps 4-5
        run: |
          python devsystem/sitewide_page_load_health_v1.py \
            --base-url "https://kyre-sports-ai.streamlit.app" \
            --only-sport "NFL" \
            --only-market "Receptions" \
            --steps23-only \
            --json-out /tmp/sitewide-step45-receptions.json

          echo "NFL_RECEPTIONS_PUBLIC_V236_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP4_ROOT_CAUSE_RESOLVED_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP4_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP4_FROZEN"
          echo "SITEWIDE_PAGE_LOAD_STEP5_REPAIR_CERTIFIED_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP5_GREEN"
          echo "SITEWIDE_PAGE_LOAD_STEP5_FROZEN"

      - name: Print focused result packet
        if: always()
        run: |
          if [ -f /tmp/sitewide-step45-receptions.json ]; then
            cat /tmp/sitewide-step45-receptions.json
          fi
