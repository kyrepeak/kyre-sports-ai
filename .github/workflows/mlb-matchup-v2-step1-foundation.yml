name: MLB Matchup V2 Step 1 foundation certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v30.py'
      - 'mlb_matchup_player_v24.py'
      - 'tests/test_mlb_matchup_v2_step1_foundation.py'
      - '.github/workflows/mlb-matchup-v2-step1-foundation.yml'
      - '.github/workflows/mlb-matchup-unified-intelligence-v1.yml'
  push:
    branches: ['mlb-matchup-v2-step1-foundation']
    paths:
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v30.py'
      - 'mlb_matchup_player_v24.py'
      - 'tests/test_mlb_matchup_v2_step1_foundation.py'
      - '.github/workflows/mlb-matchup-v2-step1-foundation.yml'
      - '.github/workflows/mlb-matchup-unified-intelligence-v1.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event_name == 'push' || github.head_ref == 'mlb-matchup-v2-step1-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact V2 Step 1 additive scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-unified-intelligence-v1.yml' \
            '.github/workflows/mlb-matchup-v2-step1-foundation.yml' \
            'mlb_matchup_hub_v27.py' \
            'mlb_matchup_hub_v30.py' \
            'mlb_matchup_player_v24.py' \
            'tests/test_mlb_matchup_v2_step1_foundation.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup V2 Step 1 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi

      - name: Prove Moneyline remains frozen
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py \
            tests/test_mlb_moneyline_clean_ui_v1.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline boundary changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_FREEZE=PASS"

      - name: Prove frozen V1 Matchup presentation and model chain unchanged
        run: |
          for path in \
            mlb_matchup_hub_v29.py \
            mlb_matchup_player_v23.py \
            mlb_matchup_hub_v28.py \
            mlb_matchup_player_v22.py \
            mlb_matchup_player_v21.py \
            mlb_matchup_player_v20.py \
            mlb_matchup_player_v19.py \
            mlb_matchup_player_v18.py \
            mlb_matchup_player_v15.py \
            mlb_matchup_hub_v14.py \
            mlb_matchup_hub_v13.py \
            mlb_matchup_hub_v12.py \
            mlb_matchup_rankings_v21.py \
            spread_engine.py \
            spread_history.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Matchup V1 boundary changed: $path"
              exit 1
            fi
          done
          echo "MATCHUP_V1_FREEZE=PASS"

      - name: Verify historical V1 CI is isolated
        run: |
          grep -F "github.head_ref == 'mlb-matchup-unified-intelligence-v1'" .github/workflows/mlb-matchup-unified-intelligence-v1.yml
          echo "HISTORICAL_V1_CI_ISOLATION=PASS"

      - name: Compile V2 Step 1 boundary
        run: |
          python -m py_compile \
            mlb_matchup_hub_v27.py \
            mlb_matchup_hub_v30.py \
            mlb_matchup_player_v24.py \
            tests/test_mlb_matchup_v2_step1_foundation.py

      - name: Run V2 Step 1 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_v2_step1_foundation.py

      - name: Prove no probability or simulation implementation entered Step 1
        run: |
          ! grep -F "def _calibration_from_verdict" mlb_matchup_player_v24.py
          ! grep -F "def _simulate" mlb_matchup_player_v24.py
          ! grep -F "p_one_plus_pre_matchup" mlb_matchup_player_v24.py
          grep -F 'PROBABILITY_IMPACT = "NONE"' mlb_matchup_player_v24.py
          echo "STEP1_PROBABILITY_IMPACT=NONE"

      - name: Certification marker
        run: echo "MLB_MATCHUP_V2_STEP1_FOUNDATION_GREEN"
