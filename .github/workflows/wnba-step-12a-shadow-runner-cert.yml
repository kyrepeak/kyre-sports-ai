name: WNBA Step 12A shadow runner deployment-readiness certification

on:
  push:
    branches:
      - wnba-step12a-shadow-runner-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: "true"
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: "true"
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: "true"
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: "true"
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: "true"
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: "true"
      WNBA_STEP10_FASTAPI_ENABLED: "true"
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
      WNBA_STEP9_FASTAPI_ENABLED: "true"
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"
      WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
      WNBA_BOARD_SCHEDULER_ENABLED: "false"
      WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
      WNBA_STEP6J_CANARY_ENABLED: "false"
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
      WNBA_PERSISTENCE_ENABLED: "false"
      WNBA_SUPABASE_WRITE_ENABLED: "false"
      WNBA_WAGERING_ENABLED: "false"
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
      WNBA_STEP12_SCHEDULER_ENABLED: "false"

    steps:
      - name: Checkout Step 12A branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 260

      - name: Assert Step 12A ON while production scheduler persistence writes remain OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_STEP12A_SHADOW_RUNNER_ENABLED" = 'true'
          test "$WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED" = 'true'
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 12A external execution surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step12_shadow_runner.py
          python -m py_compile sports_api/tools/wnba_step12a_shadow_runner.py
          python -m py_compile sports_api/tools/wnba_step12a_shadow_runner_cert.py
          python -m py_compile tests/test_wnba_step12_shadow_runner.py

      - name: Run Step 12A shadow runner guards
        run: PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 11E head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP11E_FROZEN_SHA='f96d580e398aaa199c424e3b70b7a8f1386a8452'
          git merge-base --is-ancestor "$STEP11E_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP11E_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 12A files changed after frozen Step 11E
        shell: bash
        run: |
          set -euo pipefail
          STEP11E_FROZEN_SHA='f96d580e398aaa199c424e3b70b7a8f1386a8452'
          git diff --name-only "$STEP11E_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step12_shadow_runner.py|\
              sports_api/tools/wnba_step12a_shadow_runner.py|\
              sports_api/tools/wnba_step12a_shadow_runner_cert.py|\
              tests/test_wnba_step12_shadow_runner.py|\
              .github/workflows/wnba-step-12a-shadow-runner-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step11E file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen lineage and deployment safety contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step11_release_freeze as release
          from sports_api import wnba_step12_shadow_runner as s12
          assert s12.STEP11E_FROZEN_SHA == 'f96d580e398aaa199c424e3b70b7a8f1386a8452'
          assert s12.DEFAULT_ENABLED is False
          assert s12.PRODUCTION_ACTIVATION_ALLOWED is False
          assert s12.BACKGROUND_SCHEDULER_ALLOWED is False
          assert s12.PERSISTENCE_ALLOWED is False
          assert s12.SUPABASE_WRITE_ALLOWED is False
          assert s12.PUBLIC_FASTAPI_ACTIVATION_ALLOWED is False
          assert s12.WAGERING_ALLOWED is False
          assert release.DEFAULT_ENABLED is False
          assert release.PRODUCTION_ACTIVATION_ALLOWED is False
          assert release.BACKGROUND_SCHEDULER_ALLOWED is False
          assert release.PERSISTENCE_ALLOWED is False
          assert release.SUPABASE_WRITE_ALLOWED is False
          assert release.WAGERING_ALLOWED is False
          assert s12.step12a_shadow_runner_enabled({}) is False
          print('STEP12A_FROZEN_LINEAGE_AND_SAFETY_OK')
          PY

      - name: Certify Step 12A shadow runner
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step12a_shadow_runner_cert

      - name: Upload Step 12A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step12a-shadow-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: step12a-shadow-runner-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production scheduler persistence writes OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
