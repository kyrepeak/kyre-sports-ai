name: CFB O/U Upgrade Step 7 third down permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-upgrade-step7-third-down-permanent-freeze]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact permanent-freeze scope
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess, sys
          actual=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              ".github/workflows/cfb-over-under-upgrade-step7-third-down-permanent-freeze.yml",
              "cfb_over_under_upgrade_freeze_manifest_v7.json",
          }
          if actual != expected:
              print("expected",sorted(expected))
              print("actual",sorted(actual))
              sys.exit(1)
          print("CFB_OU_STEP7_PERMANENT_FREEZE_SCOPE=PASS")
          PY

      - name: Enforce previous Upgrade Step 6 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v6.json") != "7eb86b48a782c11e46cec0ec08ed4becd525e378":
              failures.append("Upgrade Step 6 freeze manifest changed")
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v6.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 1-6 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 1-6 frozen path changed: {path}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_6_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Enforce Step 7 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          manifest=json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v7.json").read_text())
          failures=[]
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v7.json") != "1c17321eeca073b3022b0c82c3e4ec10bc9727ae":
              failures.append("Step 7 freeze manifest blob changed")
          if manifest.get("version") != 7:
              failures.append("Step 7 freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1,2,3,4,5,6,7]:
              failures.append("completed upgrade-step list changed")
          if manifest.get("baseline_commit") != "ed30eb6ed12775688d46d3d4e1269d971713d75d":
              failures.append("Step 7 baseline commit changed")
          c=manifest.get("step7_contract") or {}
          expected_equal={
              "name":"third-down drive-sustain engine",
              "market":"Over/Under",
              "frozen_parent_upgrade":"cfb_over_under_matchup_ui_v6",
              "frozen_parent_slate":"cfb_over_under_slate_v5",
              "active_engine":"cfb_over_under_third_down_engine_v1",
              "active_slate":"cfb_over_under_slate_v6",
              "active_ui":"cfb_over_under_matchup_ui_v7",
              "active_router":"streamlit_memory_lazy_router_v47",
              "offense_rate_weight":0.5,
              "defense_allowed_rate_weight":0.5,
              "rate_full_signal_ratio":0.2,
              "full_sample_third_down_attempts":30.0,
              "minimum_side_coverage":1.0,
              "max_team_third_down_adjustment_points":1.25,
              "analysis_line_third_down_weight":0.0,
              "analysis_line_projection_weight":0.0,
              "live_florida_am_division":"FCS",
              "live_miami_division":"FBS",
              "next_upgrade_step":8,
          }
          for key, expected in expected_equal.items():
              if c.get(key) != expected:
                  failures.append(f"Step 7 contract changed: {key}")
          required_true=[
              "ncaa_third_down_offense_direct_counts_active",
              "ncaa_third_down_defense_direct_counts_active",
              "rankless_tie_safe_parser_active",
              "tied_blank_rank_rows_preserved",
              "division_baseline_normalization_active",
              "mixed_fbs_fcs_absolute_rate_matching_allowed",
              "live_florida_am_miami_certified",
          ]
          for key in required_true:
              if c.get(key) is not True:
                  failures.append(f"Step 7 contract lost required true invariant: {key}")
          required_false=[
              "cross_division_rank_comparison_allowed",
              "frozen_step9_thresholds_changed",
              "frozen_reliability_changed",
              "frozen_structural_sigma_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if c.get(key) is not False:
                  failures.append(f"Step 7 contract violated false invariant: {key}")
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 7 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 7 frozen blob changed: {path}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP7_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Verify active Router V47 and compile frozen Step 7
        run: |
          grep -F 'from streamlit_memory_lazy_router_v47 import render_app' app.py
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_over_under_third_down_engine_v1.py",
              "cfb_over_under_slate_v6.py",
              "cfb_over_under_matchup_ui_v7.py",
              "streamlit_memory_lazy_router_v47.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_STEP7_FROZEN_COMPILE=PASS")
          PY

      - name: Run Step 7 and inherited regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_upgrade_step7_third_down_engine.py tests/test_cfb_over_under_upgrade_step7_slate.py tests/test_cfb_over_under_upgrade_step7_ui_router.py tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py tests/test_cfb_over_under_upgrade_step6_slate.py tests/test_cfb_over_under_upgrade_step6_ui_router.py tests/test_cfb_over_under_upgrade_step5_explosive_engine.py tests/test_cfb_over_under_upgrade_step5_slate.py tests/test_cfb_over_under_upgrade_step5_ui_router.py tests/test_cfb_over_under_upgrade_step4_pace_engine.py tests/test_cfb_over_under_upgrade_step4_slate.py tests/test_cfb_over_under_upgrade_step4_ui_router.py tests/test_cfb_over_under_upgrade_step3_engine.py tests/test_cfb_over_under_upgrade_step3_slate.py tests/test_cfb_over_under_upgrade_step3_ui.py tests/test_cfb_over_under_multisource_logo_resolver_v2.py tests/test_cfb_over_under_multisource_logo_hotfix_v4.py tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Step 7 permanent-freeze model firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          combined="\n".join(Path(p).read_text(encoding="utf-8") for p in (
              "cfb_over_under_third_down_engine_v1.py",
              "cfb_over_under_slate_v6.py",
              "cfb_over_under_matchup_ui_v7.py",
              "streamlit_memory_lazy_router_v47.py",
          ))
          required=[
              'FROZEN_STEP6_ENGINE = "cfb_over_under_red_zone_engine_v1"',
              'MAX_TEAM_THIRD_DOWN_ADJUSTMENT = 1.25',
              'MIN_SIDE_COVERAGE = 1.00',
              'OFFENSE_RATE_WEIGHT = 0.50',
              'DEFENSE_ALLOWED_RATE_WEIGHT = 0.50',
              'FULL_SAMPLE_THIRD_DOWN_ATTEMPTS = 30.0',
              'ANALYSIS_LINE_THIRD_DOWN_WEIGHT = 0.0',
              '"rankless_tie_safe_parser_active": True',
              '"cross_division_rank_comparison_used": False',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v6"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v46"',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing frozen Step 7 marker: {token}")
          lower=combined.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"Step 7 permanent freeze crossed firewall: {token}")
          print("CFB_OU_UPGRADE_STEP7_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - name: Permanent freeze marker
        run: echo CFB_OU_UPGRADE_STEP7_THIRD_DOWN_PERMANENTLY_FROZEN_GREEN
