name: NFL Step 7 App Identity Fail Closed V1

on:
  pull_request:
    paths:
      - "app.py"
      - "nfl_prop_app_eligibility_v1.py"
      - "nfl_passing_yards_hub_v42.py"
      - "nfl_rushing_yards_hub_v16.py"
      - "nfl_receiving_yards_hub_v17.py"
      - "streamlit_memory_lazy_router_v187.py"
      - "tests/test_nfl_prop_app_eligibility_v1.py"
      - "devsystem/nfl_step7_app_identity_fail_closed_v1.py"
      - "devsystem/task_ledgers/nfl-step7-app-identity-fail-closed-v1.json"
      - ".github/workflows/nfl-step7-app-identity-fail-closed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-proof:
    name: nfl-step7-app-identity-fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run Step 7 identity unit proof
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_prop_app_eligibility_v1.py
      - name: Verify live app owners and fail-closed route
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_step7_app_identity_fail_closed_v1.py
