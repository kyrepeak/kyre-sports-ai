name: MLB Step9D Render deploy one-shot

on:
  push:
    branches:
      - mlb-step9d-production-control-20260901
  workflow_dispatch:

permissions:
  contents: read

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  TARGET_SHA: dbcbd03fa26a18fe50d04682118983b3752692ae
  ROLLBACK_SHA: bc86ada81142e81851a16fcecf40ce3f8906d9be
  API_BASE_URL: https://kyre-sports-api.onrender.com

jobs:
  deploy-exact-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -q httpx

      - name: Deploy exact Step9D release with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          python - <<'PY'
          from datetime import datetime
          import json
          import os
          import time
          from zoneinfo import ZoneInfo

          import httpx

          render_api = 'https://api.render.com'
          sid = os.environ['RENDER_SERVICE_ID']
          token = os.environ['RENDER_API_KEY']
          target = os.environ['TARGET_SHA']
          rollback = os.environ['ROLLBACK_SHA']
          base = os.environ['API_BASE_URL'].rstrip('/')
          headers = {
              'Accept': 'application/json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'KyreSportsMLBStep9DDeploy/1.0',
          }

          def unwrap(value):
              if isinstance(value, dict) and isinstance(value.get('deploy'), dict):
                  return value['deploy']
              return value if isinstance(value, dict) else {}

          def list_deploys(client):
              response = client.get(
                  f'{render_api}/v1/services/{sid}/deploys',
                  params={'limit': 30},
                  headers=headers,
              )
              response.raise_for_status()
              body = response.json()
              return [unwrap(row) for row in body] if isinstance(body, list) else []

          def deploy_sha(row):
              commit = row.get('commit') if isinstance(row.get('commit'), dict) else {}
              return str(row.get('commitId') or commit.get('id') or commit.get('sha') or '').strip()

          def current_live_sha(client):
              for row in list_deploys(client):
                  if str(row.get('status') or '').strip().casefold() == 'live':
                      return deploy_sha(row), row
              return '', {}

          def deploy_commit(client, sha):
              response = client.post(
                  f'{render_api}/v1/services/{sid}/deploys',
                  headers=headers,
                  json={'commitId': sha},
              )
              response.raise_for_status()
              row = unwrap(response.json())
              deploy_id = str(row.get('id') or '').strip()
              if not deploy_id:
                  raise RuntimeError(f'Render deploy response missing id: {row}')
              print('STEP9D_RENDER_DEPLOY_TRIGGERED', {'deploy_id': deploy_id, 'commit_sha': sha})
              return deploy_id

          def wait_for_deploy(client, deploy_id, expected_sha, timeout_seconds=1200):
              deadline = time.time() + timeout_seconds
              last = None
              while time.time() < deadline:
                  rows = list_deploys(client)
                  row = next((item for item in rows if str(item.get('id')) == deploy_id), None)
                  if row:
                      status = str(row.get('status') or '').strip().casefold()
                      sha = deploy_sha(row)
                      current = (status, sha)
                      if current != last:
                          print('STEP9D_RENDER_DEPLOY_STATUS', {
                              'deploy_id': deploy_id,
                              'status': status,
                              'commit_sha': sha,
                          })
                          last = current
                      if status == 'live':
                          if sha and sha != expected_sha:
                              raise RuntimeError(
                                  f'live deploy SHA mismatch: expected {expected_sha}, got {sha}'
                              )
                          return row
                      if status in {
                          'build_failed', 'update_failed', 'canceled', 'cancelled', 'deactivated'
                      }:
                          raise RuntimeError(
                              f'Render deploy {deploy_id} failed with status {status}'
                          )
                  time.sleep(10)
              raise TimeoutError(f'Render deploy {deploy_id} did not become live before timeout')

          def json_get(client, path, *, params=None, allowed_status=(200,), timeout=90.0):
              response = client.get(f'{base}{path}', params=params, timeout=timeout)
              if response.status_code not in allowed_status:
                  raise RuntimeError(
                      f'{path} returned HTTP {response.status_code}: {response.text[:700]}'
                  )
              try:
                  data = response.json()
              except Exception as exc:
                  raise RuntimeError(f'{path} did not return JSON') from exc
              if not isinstance(data, dict):
                  raise RuntimeError(f'{path} did not return a JSON object')
              return response.status_code, data

          with httpx.Client(timeout=60.0, follow_redirects=True) as client:
              service_response = client.get(f'{render_api}/v1/services/{sid}', headers=headers)
              service_response.raise_for_status()
              service_before = service_response.json()
              details_before = (
                  service_before.get('serviceDetails')
                  if isinstance(service_before.get('serviceDetails'), dict)
                  else {}
              )
              plan_before = details_before.get('plan')
              auto_before = service_before.get('autoDeploy')
              if str(plan_before).casefold() != 'free':
                  raise RuntimeError(f'expected Render free plan before deploy, got {plan_before!r}')
              if str(auto_before).casefold() != 'no':
                  raise RuntimeError(f'expected autoDeploy=no before deploy, got {auto_before!r}')

              live_before_sha, live_before = current_live_sha(client)
              print('STEP9D_RENDER_PREDEPLOY', {
                  'current_live_sha': live_before_sha,
                  'expected_live_sha': rollback,
                  'plan': plan_before,
                  'autoDeploy': auto_before,
              })
              if live_before_sha != rollback:
                  raise RuntimeError(
                      f'production moved since certification: expected live {rollback}, got {live_before_sha}'
                  )

              deploy_id = deploy_commit(client, target)
              try:
                  live = wait_for_deploy(client, deploy_id, target)

                  _, health = json_get(client, '/health')
                  _, root = json_get(client, '/')
                  _, odds = json_get(
                      client,
                      '/api/v1/mlb/odds',
                      params={'max_events': 5, 'fully_priced_only': 'false'},
                  )
                  _, props = json_get(
                      client,
                      '/api/v1/mlb/player-props',
                      params={'max_events': 5},
                  )
                  day = datetime.now(ZoneInfo('America/Phoenix')).date().isoformat()
                  _, live_state = json_get(
                      client,
                      '/api/v1/mlb/live-game-state',
                      params={'date': day, 'max_games': 30},
                  )
                  live_odds_status, live_odds = json_get(
                      client,
                      '/api/v1/mlb/live-odds',
                      params={'max_events': 30, 'fully_priced_only': 'false'},
                  )

                  if health.get('status') != 'ok':
                      raise RuntimeError(f"health endpoint not ok: {health.get('status')!r}")
                  if root.get('status') != 'online':
                      raise RuntimeError('root endpoint not online')
                  if odds.get('data_type') != 'mlb_live_odds_api_response_v1':
                      raise RuntimeError('existing pregame odds endpoint contract changed')
                  if props.get('data_type') != 'mlb_player_prop_api_response_v1':
                      raise RuntimeError('existing player-props endpoint contract changed')
                  if live_state.get('data_type') != 'mlb_live_game_state_api_response_v1':
                      raise RuntimeError('existing live-game-state endpoint contract changed')

                  if live_odds_status != 200:
                      raise RuntimeError(f'live-odds returned unexpected HTTP {live_odds_status}')
                  if live_odds.get('data_type') != 'mlb_inplay_odds_api_response_v1':
                      raise RuntimeError(
                          f"unexpected live-odds data_type: {live_odds.get('data_type')!r}"
                      )
                  if live_odds.get('schema_version') != 1:
                      raise RuntimeError('unexpected live-odds schema version')
                  if live_odds.get('source') != 'FanDuel':
                      raise RuntimeError(f"unexpected live-odds source: {live_odds.get('source')!r}")
                  if live_odds.get('market_phase') != 'IN_PLAY':
                      raise RuntimeError('live-odds market phase was not IN_PLAY')
                  if live_odds.get('fuzzy_matching_used') is not False:
                      raise RuntimeError('live-odds fuzzy_matching_used was not false')
                  if live_odds.get('synthetic_game_id_used') is not False:
                      raise RuntimeError('live-odds synthetic_game_id_used was not false')

                  for game in live_odds.get('games') or []:
                      if not isinstance(game, dict):
                          raise RuntimeError('live-odds games contained a non-object row')
                      game_id = game.get('official_game_id')
                      if not isinstance(game_id, int) or isinstance(game_id, bool) or game_id <= 0:
                          raise RuntimeError(f'invalid live-odds official_game_id: {game_id!r}')
                      if game.get('market_phase') != 'IN_PLAY' or game.get('in_play') is not True:
                          raise RuntimeError('live-odds emitted a non-in-play game')

                  service_after_response = client.get(
                      f'{render_api}/v1/services/{sid}', headers=headers
                  )
                  service_after_response.raise_for_status()
                  service_after = service_after_response.json()
                  details_after = (
                      service_after.get('serviceDetails')
                      if isinstance(service_after.get('serviceDetails'), dict)
                      else {}
                  )
                  if details_after.get('plan') != plan_before:
                      raise RuntimeError('Render plan changed during deployment')
                  if service_after.get('autoDeploy') != auto_before:
                      raise RuntimeError('Render autoDeploy setting changed during deployment')

                  live_after_sha, _ = current_live_sha(client)
                  if live_after_sha != target:
                      raise RuntimeError(
                          f'production live SHA after smoke was {live_after_sha}, expected {target}'
                      )

                  evidence = {
                      'deploy_id': deploy_id,
                      'deploy_status': live.get('status'),
                      'previous_live_sha': rollback,
                      'target_sha': target,
                      'health_status': health.get('status'),
                      'root_status': root.get('status'),
                      'pregame_odds_game_count': odds.get('game_count'),
                      'player_prop_count': props.get('prop_count'),
                      'live_state_game_count': live_state.get('game_count'),
                      'live_odds_game_count': live_odds.get('game_count'),
                      'live_odds_candidate_started_event_count': live_odds.get(
                          'candidate_started_event_count'
                      ),
                      'live_odds_matched_inplay_game_count': live_odds.get(
                          'matched_inplay_game_count'
                      ),
                      'plan_preserved': details_after.get('plan') == plan_before,
                      'auto_deploy_preserved': service_after.get('autoDeploy') == auto_before,
                      'rollback_triggered': False,
                  }
                  safe = json.dumps(evidence, sort_keys=True)
                  if token in safe:
                      raise RuntimeError('secret leakage')
                  print('STEP9D_PRODUCTION_SMOKE', safe)
                  print('MLB_STEP9D_RENDER_PRODUCTION_GREEN')
              except Exception as primary_exc:
                  print('STEP9D_PRODUCTION_FAILURE', type(primary_exc).__name__, str(primary_exc))
                  rollback_id = deploy_commit(client, rollback)
                  rollback_live = wait_for_deploy(client, rollback_id, rollback)
                  try:
                      json_get(client, '/health')
                      json_get(client, '/')
                  except Exception as rollback_smoke_exc:
                      raise RuntimeError(
                          f'primary deploy failed: {primary_exc}; rollback became '
                          f'{rollback_live.get("status")} but smoke failed: {rollback_smoke_exc}'
                      ) from primary_exc
                  print('STEP9D_ROLLBACK_COMPLETE', {
                      'deploy_id': rollback_id,
                      'rollback_sha': rollback,
                      'status': rollback_live.get('status'),
                  })
                  raise
          PY
