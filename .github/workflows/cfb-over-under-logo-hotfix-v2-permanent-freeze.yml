name: CFB O/U ESPN logo hotfix V2 permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-ou-logo-hotfix-v2-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-logo-hotfix-v2-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-logo-hotfix-v2-permanent-freeze.yml' \
            'cfb_over_under_logo_hotfix_freeze_manifest_v2.json' | sort)"
          test "$actual" = "$expected" || { echo "$actual"; exit 1; }

      - name: Enforce base and Upgrade Step freezes
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()
          failures=[]
          for manifest_path in (
              "cfb_freeze_manifest_v12.json",
              "cfb_over_under_upgrade_freeze_manifest_v3.json",
              "cfb_over_under_logo_hotfix_freeze_manifest_v1.json",
          ):
              manifest=json.loads(pathlib.Path(manifest_path).read_text())
              for path, expected in (manifest.get("exact_blobs") or {}).items():
                  try:
                      actual=rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"missing frozen path: {path}")
                      continue
                  if actual != expected:
                      failures.append(f"frozen path changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("PREVIOUS_CFB_OU_FREEZES=PASS")
          PY

      - name: Enforce logo hotfix V2 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          manifest=json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v2.json").read_text())
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec], text=True).strip()
          failures=[]
          if manifest.get("completed_hotfixes") != [1,2]:
              failures.append("completed hotfix contract changed")
          contract=manifest.get("hotfix2_contract") or {}
          for key in (
              "direct_step3_hero_patch_active",
              "forced_in_call_step1_resolver_active",
              "live_blank_espn_event_id_case_certified",
              "live_active_hero_html_certified",
              "team_logos_verified_badge_certified",
              "florida_am_logo_url_certified",
              "miami_logo_url_certified",
              "presentation_only",
          ):
              if contract.get(key) is not True:
                  failures.append(f"hotfix V2 lost {key}")
          for key in (
              "projection_math_changed",
              "probability_math_changed",
              "selection_math_changed",
              "top5_ranking_math_changed",
              "reliability_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ):
              if contract.get(key) is not False:
                  failures.append(f"hotfix V2 changed {key}")
          if contract.get("next_upgrade_step") != 4:
              failures.append("next upgrade handoff changed")
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual=rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing hotfix path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"hotfix blob changed: {path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_ESPN_LOGO_HOTFIX_V2_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify active runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v41 import render_app' app.py
          python -m py_compile \
            cfb_over_under_matchup_ui_v3_logo_hotfix_v2.py \
            streamlit_memory_lazy_router_v41.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_logo_hotfix_v2.py \
            tests/test_cfb_over_under_logo_hotfix_v1.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py

      - name: Freeze marker
        run: echo "CFB_OU_ESPN_LOGO_HOTFIX_V2_PERMANENT_FREEZE_GREEN"
