name: WNBA Step 5U hosted staging contract tests

on:
  pull_request:
    paths:
      - "sports_api/**"
      - ".github/workflows/wnba-step-5u.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step5u:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sports_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 5U modules
        run: |
          python -m py_compile sports_api/wnba_hosted_staging_readiness.py
          python -m py_compile sports_api/api/wnba_hosted_staging.py
          python -m py_compile sports_api/tools/wnba_staging_verify.py
          python -m py_compile sports_api/main.py

      - name: Run Step 5I regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_historical_backtest_calibration.py

      - name: Run Step 5J regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_pregame_prediction_store.py

      - name: Run Step 5K regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_player_prop_top_five_board.py

      - name: Run Step 5L regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_daily_slate_top_five.py

      - name: Run Step 5M regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_line_feed_adapter.py

      - name: Run Step 5N regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_feed_collector.py

      - name: Run Step 5O regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_prop_feed_failover.py

      - name: Run Step 5P regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_pregame_board_scheduler.py

      - name: Run Step 5Q regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_scheduler_cycle_lock.py

      - name: Run Step 5R regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_production_runtime_readiness.py

      - name: Run Step 5S regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_deployment_smoke_readiness.py

      - name: Run Step 5T regression harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_release_activation_readiness.py

      - name: Run Step 5U deterministic harness
        env: { PYTHONPATH: . }
        run: python sports_api/tests/test_wnba_hosted_staging_readiness.py

      - name: Build Step 5U immutable staging candidate
        run: |
          docker build \
            --build-arg WNBA_RELEASE_REVISION="$GITHUB_SHA" \
            --build-arg WNBA_RELEASE_ID="step5u-ci-$GITHUB_RUN_ID" \
            -f sports_api/Dockerfile \
            -t kyre-sports-api:step5u .
          IMAGE_ID="$(docker image inspect -f '{{.Id}}' kyre-sports-api:step5u)"
          echo "STEP5U_IMAGE_REF=kyre-sports-api@${IMAGE_ID}" >> "$GITHUB_ENV"
          echo "STEP5U_RELEASE_ID=step5u-ci-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Prepare Step 5U persistent volume
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.step5u-data"
          chmod 0777 "$GITHUB_WORKSPACE/.step5u-data"

      - name: Start Render-like pre-activation staging container
        run: |
          docker run -d --name kyre-step5u -p 18001:8000 \
            -v "$GITHUB_WORKSPACE/.step5u-data:/var/lib/kyre-sports-api" \
            -e WNBA_PRODUCTION_RUNTIME_ENABLED=false \
            -e WNBA_CURRENT_BOARD_STORE_PATH=/var/lib/kyre-sports-api/wnba_current_board.sqlite3 \
            -e WNBA_PROP_FEED_STORE_PATH=/var/lib/kyre-sports-api/wnba_prop_feed.sqlite3 \
            -e WNBA_BACKTEST_STORE_PATH=/var/lib/kyre-sports-api/wnba_backtest.sqlite3 \
            -e WNBA_BOARD_SCHEDULER_LOCK_PATH=/var/lib/kyre-sports-api/wnba_scheduler_lock.sqlite3 \
            -e WNBA_BOARD_SCHEDULER_ENABLED=true \
            -e WNBA_BOARD_AUTO_ARCHIVE_ENABLED=true \
            -e SPORTSGAMEODDS_API_KEY=step5u-ci-demo-key \
            -e WNBA_BACKTEST_ARCHIVE_HMAC_SECRET=step5u-ci-secret-material-12345678901234567890 \
            -e WNBA_DEPLOYMENT_REVISION="$GITHUB_SHA" \
            -e WNBA_RELEASE_ID="$STEP5U_RELEASE_ID" \
            -e WNBA_RELEASE_CHANNEL=production \
            -e WNBA_DEPLOYMENT_IMAGE_REF="$STEP5U_IMAGE_REF" \
            -e WNBA_RELEASE_INITIAL_DEPLOYMENT=true \
            -e WNBA_STAGING_HOST_PROVIDER=render \
            -e WNBA_HOST_ENVIRONMENT=staging \
            -e WNBA_STAGING_EXTERNAL_URL=https://kyre-step5u-ci.onrender.com \
            -e WNBA_STAGING_EXPECTED_SERVICE_NAME=kyre-sports-api-staging \
            -e WNBA_STAGING_EXPECTED_GIT_BRANCH=api-foundation-v1 \
            -e RENDER=true \
            -e RENDER_SERVICE_ID=srv-step5u-ci \
            -e RENDER_SERVICE_NAME=kyre-sports-api-staging \
            -e RENDER_SERVICE_TYPE=web \
            -e RENDER_EXTERNAL_URL=https://kyre-step5u-ci.onrender.com \
            -e RENDER_EXTERNAL_HOSTNAME=kyre-step5u-ci.onrender.com \
            -e RENDER_GIT_COMMIT="$GITHUB_SHA" \
            -e RENDER_GIT_BRANCH=api-foundation-v1 \
            -e RENDER_GIT_REPO_SLUG=kyrepeak/kyre-sports-ai \
            -e RENDER_INSTANCE_ID=instance-step5u-ci \
            kyre-sports-api:step5u

      - name: Wait for Step 5U liveness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kyre-step5u
          exit 1

      - name: Verify hosted staging contract is green
        run: |
          curl --fail --silent http://127.0.0.1:18001/api/v1/wnba/runtime/hosting \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["host_contract_ready"] is True; assert d["remote_smoke_allowed"] is True; assert d["activation_requested"] is False; assert d["provider"] == "render"'

      - name: Confirm production runtime remains fail-closed
        run: |
          STATUS="$(curl --silent --output /tmp/step5u-health.json --write-out '%{http_code}' http://127.0.0.1:18001/api/v1/wnba/runtime/health)"
          test "$STATUS" = "503"

      - name: Capture Step 5U storage identity
        run: |
          STORAGE_IDENTITY="$(curl --fail --silent http://127.0.0.1:18001/api/v1/wnba/runtime/release | python -c 'import json,sys; print(json.load(sys.stdin)["storage_identity_sha256"])')"
          test "${#STORAGE_IDENTITY}" -eq 64
          echo "STEP5U_STORAGE_IDENTITY=$STORAGE_IDENTITY" >> "$GITHUB_ENV"

      - name: Exercise Step 5U GET-only verifier against running container
        env: { PYTHONPATH: . }
        run: |
          python -m sports_api.tools.wnba_staging_verify \
            http://127.0.0.1:18001 \
            --revision "$GITHUB_SHA" \
            --release-id "$STEP5U_RELEASE_ID" \
            --storage-identity "$STEP5U_STORAGE_IDENTITY" \
            --service-name kyre-sports-api-staging

      - name: Show container logs on failure
        if: failure()
        run: docker logs kyre-step5u || true

      - name: Stop Step 5U container
        if: always()
        run: docker rm -f kyre-step5u || true
