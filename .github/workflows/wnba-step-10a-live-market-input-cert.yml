name: WNBA Step 10A live market input certification

on:
  push:
    branches:
      - wnba-step10a-live-market-input-contract-20260828
    paths:
      - sports_api/wnba_step10_live_market_input.py
      - tests/test_wnba_step10_live_market_input.py
      - sports_api/tools/wnba_step10a_live_market_input_cert.py
      - .github/workflows/wnba-step-10a-live-market-input-cert.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
      WNBA_BOARD_SCHEDULER_ENABLED: "false"
      WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
      WNBA_STEP6J_CANARY_ENABLED: "false"
      WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"

    steps:
      - name: Checkout Step 10A branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Assert production OFF and isolated Step 10A gate ON
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED" = 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 10A certification surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step10_live_market_input.py
          python -m py_compile tests/test_wnba_step10_live_market_input.py
          python -m py_compile sports_api/tools/wnba_step10a_live_market_input_cert.py

      - name: Run Step 10A live market input guards
        run: PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run inherited frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 9 head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP9_FROZEN_SHA='bd228921ea993c8c74b6454ae56cee94711b0e94'
          git merge-base --is-ancestor "$STEP9_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP9_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 10A files changed after frozen Step 9
        shell: bash
        run: |
          set -euo pipefail
          STEP9_FROZEN_SHA='bd228921ea993c8c74b6454ae56cee94711b0e94'
          git diff --name-only "$STEP9_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step10_live_market_input.py|\
              tests/test_wnba_step10_live_market_input.py|\
              sports_api/tools/wnba_step10a_live_market_input_cert.py|\
              .github/workflows/wnba-step-10a-live-market-input-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step9 file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify frozen Step 9 and Step 10A release constants
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from sports_api import wnba_step9_release_freeze as s9
          from sports_api import wnba_step10_live_market_input as s10
          assert s9.RELEASE_ID == 'wnba_step9_market_board_2026_regular_season_frozen_v1'
          assert s9.DEFAULT_ENABLED is False
          assert s9.PRODUCTION_ACTIVATION_ALLOWED is False
          assert s10.STEP9_FROZEN_HEAD_SHA == 'bd228921ea993c8c74b6454ae56cee94711b0e94'
          assert s10.SCHEMA_VERSION == 'wnba_step_10a_live_market_input_v1'
          assert s10.MODEL_VERSION == 'wnba_step10a_strict_live_market_normalization_2026_regular_v1'
          assert s10.RELEASE_ID == 'wnba_step10a_live_market_input_2026_regular_season_v1'
          assert s10.step10a_live_market_input_enabled({}) is False
          print('STEP10A_RELEASE_CONTRACT_STATIC_GUARDS_OK')
          PY

      - name: Certify frozen Step 10A live market input contract
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step10a_live_market_input_cert

      - name: Upload Step 10A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step10a-live-market-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: step10a-live-market-input-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
