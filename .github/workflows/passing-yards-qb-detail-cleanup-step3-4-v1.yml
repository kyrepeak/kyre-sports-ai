name: NFL Passing Yards QB Detail Cleanup Steps 3-4

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-qb-detail-cleanup-step3-4-v1.yml"
      - "devsystem/task_ledgers/passing-yards-qb-detail-cleanup-step3-4-v1.json"
      - "nfl_passing_yards_hub_v59.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-qb-detail-cleanup-step3-4-v1.yml"
      - "devsystem/task_ledgers/passing-yards-qb-detail-cleanup-step3-4-v1.json"
      - "nfl_passing_yards_hub_v59.py"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Step 3-4 visual-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-qb-detail-cleanup-step3-4-v1.yml
          devsystem/task_ledgers/passing-yards-qb-detail-cleanup-step3-4-v1.json
          nfl_passing_yards_hub_v59.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_QB_DETAIL_STEP3_4_SCOPE_GREEN"

      - name: Compile V59
        run: python -m py_compile nfl_passing_yards_hub_v59.py

      - name: Verify presentation-only cleanup contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("nfl_passing_yards_hub_v59.py").read_text()
          required=[
              'DETAIL_CLEANUP_VERSION = "step1-2-v1"',
              'DETAIL_CLEANUP_STEPS = 2',
              'DETAIL_CLEANUP_STEP34_VERSION = "step3-4-v1"',
              'DETAIL_CLEANUP_COMPLETED_STEPS = 4',
              'PRESENTATION_ONLY = True',
              'DISPLAY_ONLY = True',
              'MAY_MODIFY_PROJECTION = False',
              'MAY_MODIFY_PROBABILITY = False',
              'MAY_MODIFY_MARKET_MATH = False',
              'MAY_MODIFY_DATA = False',
              'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
              'data-qb-detail-cleanup-step1="green"',
              'data-qb-detail-cleanup-step2="green"',
              'data-qb-detail-cleanup-step3="green"',
              'data-qb-detail-cleanup-step4="green"',
          ]
          missing=[token for token in required if token not in text]
          if missing:
              raise SystemExit("MISSING_STEP34_CLEANUP_CONTRACT: "+", ".join(missing))
          print("PASSING_YARDS_QB_DETAIL_STEP3_STATIC_GREEN")
          print("PASSING_YARDS_QB_DETAIL_STEP4_STATIC_GREEN")
          PY

      - name: Verify frozen boundaries
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" -- \
            nfl_passing_yards_hub_v58.py \
            nfl_passing_yards_hub_v60.py \
            nfl_passing_yards_hub_v61.py \
            streamlit_memory_lazy_router_v209.py \
            streamlit_memory_lazy_router_v210.py \
            streamlit_memory_lazy_router_v211.py \
            streamlit_memory_lazy_router_v212.py \
            app.py
          echo "PASSING_YARDS_QB_DETAIL_STEP3_4_FROZEN_BOUNDARIES_GREEN"

  branch-mobile-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-qb-detail-step3-4
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-qb-detail-step3-4/streamlit.log 2>&1 &
          echo $! > /tmp/passing_yards_qb_detail_step34_pid

      - name: Prove Step 3-4 mobile cleanup
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          params={
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          }
          route=base+"/?"+urlencode(params)

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500: break
              except Exception: pass
              time.sleep(.5)
          else:
              raise RuntimeError("QB_DETAIL_STEP34_LOCAL_STREAMLIT_NOT_READY")

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2000))
                  except Exception: pass
              return "\n".join(out)

          def find_detail(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("QB_DETAIL_STEP34_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          root=frame.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
                          if root.count()==1: return frame,root
                      except Exception: pass
                  page.wait_for_timeout(400)
              raise RuntimeError("QB_DETAIL_STEP34_V59_NOT_READY")

          def assert_no_horizontal_overflow(locator,label):
              ok=locator.evaluate("(e)=>e.scrollWidth <= e.clientWidth + 2")
              if not ok:
                  raise AssertionError(label+" horizontal overflow")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find_detail(page)

              # Frozen Steps 1-2 remain intact.
              assert root.locator('[data-qb-detail-cleanup-step1="green"]').count()==1
              assert root.locator('[data-qb-detail-cleanup-step2="green"]').count()==1

              # Step 3 — Current Market + Edge.
              market=root.locator('[data-qb-detail-cleanup-step3="green"]').first
              assert market.count()==1
              assert market.locator(".kpy10-card").count()==1
              assert market.locator(".kpy10-hero>div").count()==3
              assert market.locator(".kpy10-metrics>div").count()==6
              assert_no_horizontal_overflow(market,"step3 market")
              for i in range(6):
                  item=market.locator(".kpy10-metrics>div").nth(i)
                  assert item.locator("b").count()==1
                  assert_no_horizontal_overflow(item,f"step3 metric {i}")

              # Step 4 — Baseline Projection.
              projection=root.locator('[data-qb-detail-cleanup-step4="green"]').first
              assert projection.count()==1
              assert projection.locator(".kpy-proj").count()==1
              assert projection.locator(".kpy-projhero>div").count()==3
              assert projection.locator(".kpy-projmeta>div").count()==4
              assert_no_horizontal_overflow(projection,"step4 projection")
              for i in range(4):
                  item=projection.locator(".kpy-projmeta>div").nth(i)
                  assert item.locator("b").count()==1
                  assert_no_horizontal_overflow(item,f"step4 metric {i}")

              body=frame.locator("body").inner_text(timeout=5000)
              body_lower=body.lower()
              assert "jordan love" in body_lower
              assert "current market + edge" in body_lower
              assert "baseline projection" in body_lower
              assert "typeerror" not in body_lower and "traceback" not in body_lower

              print("PASSING_YARDS_QB_DETAIL_STEP3_BRANCH_GREEN")
              print("PASSING_YARDS_QB_DETAIL_STEP4_BRANCH_GREEN")
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 500 artifacts/passing-yards-qb-detail-step3-4/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/passing_yards_qb_detail_step34_pid ]; then
            kill "$(cat /tmp/passing_yards_qb_detail_step34_pid)" 2>/dev/null || true
          fi

  public-mobile-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Allow Streamlit deployment to publish
        run: sleep 90

      - name: Prove public Step 3-4 mobile cleanup once
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          params={
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          }
          route=base+"/?"+urlencode(params)

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2500))
                  except Exception: pass
              return "\n".join(out)

          def find_detail(page,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "TypeError" in body or "Traceback" in body:
                      print(body[:50000]); raise RuntimeError("QB_DETAIL_STEP34_PUBLIC_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          root=frame.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
                          if root.count()==1: return frame,root
                      except Exception: pass
                  page.wait_for_timeout(500)
              raise RuntimeError("QB_DETAIL_STEP34_PUBLIC_V59_NOT_READY")

          def assert_no_horizontal_overflow(locator,label):
              ok=locator.evaluate("(e)=>e.scrollWidth <= e.clientWidth + 2")
              if not ok:
                  raise AssertionError(label+" horizontal overflow")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find_detail(page)

              assert root.locator('[data-qb-detail-cleanup-step1="green"]').count()==1
              assert root.locator('[data-qb-detail-cleanup-step2="green"]').count()==1

              market=root.locator('[data-qb-detail-cleanup-step3="green"]').first
              projection=root.locator('[data-qb-detail-cleanup-step4="green"]').first
              assert market.count()==1 and projection.count()==1
              assert market.locator(".kpy10-hero>div").count()==3
              assert market.locator(".kpy10-metrics>div").count()==6
              assert projection.locator(".kpy-projhero>div").count()==3
              assert projection.locator(".kpy-projmeta>div").count()==4
              assert_no_horizontal_overflow(market,"public step3 market")
              assert_no_horizontal_overflow(projection,"public step4 projection")

              body=frame.locator("body").inner_text(timeout=5000)
              body_lower=body.lower()
              assert "jordan love" in body_lower
              assert "current market + edge" in body_lower
              assert "baseline projection" in body_lower
              assert "typeerror" not in body_lower and "traceback" not in body_lower

              print("PASSING_YARDS_QB_DETAIL_STEP3_PUBLIC_GREEN")
              print("PASSING_YARDS_QB_DETAIL_STEP4_PUBLIC_GREEN")
              browser.close()
          PY
