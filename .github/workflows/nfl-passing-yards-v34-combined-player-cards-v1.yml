name: NFL Passing Yards V34 Combined Player Cards V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_passing_yards_hub_v34.py"
      - "streamlit_memory_lazy_router_v127.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v34_combined_player_cards_v1.py"
      - ".github/workflows/nfl-passing-yards-v34-combined-player-cards-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-player-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests streamlit

      - name: Enforce exact five-file combined-player-card diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-passing-yards-v34-combined-player-cards-v1.yml
          app.py
          nfl_passing_yards_hub_v34.py
          streamlit_memory_lazy_router_v127.py
          tests/test_nfl_passing_yards_v34_combined_player_cards_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Passing combined-card diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile V34 combined-card surface
        run: |
          python -m py_compile \
            nfl_passing_yards_hub_v34.py \
            streamlit_memory_lazy_router_v127.py \
            app.py \
            tests/test_nfl_passing_yards_v34_combined_player_cards_v1.py

      - name: Prove certified Passing/Receiving/Rushing owners remain frozen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_hub_v([1-9]|1[0-9]|2[0-9]|3[0-3])\.py$|nfl_hub_v35\.py$|streamlit_memory_lazy_router_v126\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "PASSING_COMBINED_CARD_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "PASSING_COMBINED_CARD_FROZEN_OWNER_GUARD_GREEN"

      - name: Run V34 combined-player-card contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v34_combined_player_cards_v1.py

      - name: Re-run frozen V33 final certification contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v33_visual_parity_step6_final_v1.py

      - name: Re-run frozen visual Steps 5 through 2
        run: |
          python -m pytest -q tests/test_nfl_passing_yards_v32_visual_parity_step5_v1.py
          python -m pytest -q tests/test_nfl_passing_yards_v31_visual_parity_step4_v1.py
          python -m pytest -q tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py
          python -m pytest -q tests/test_nfl_passing_yards_v29_visual_parity_step2_v1.py

      - name: Re-run frozen V28 exact-ID personnel regression
        run: python -m pytest -q tests/test_nfl_passing_yards_step5_personnel_v2.py

      - name: Prove V34 owns composition only
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import nfl_passing_yards_hub_v34 as page
          assert page.DISPLAY_ONLY is True
          assert page.PLAYER_CARD_COMPOSITION_ONLY is True
          assert page.PLAYER_CARD_STEP_COUNT == 10
          assert page.FROZEN_PRIOR == 'nfl_passing_yards_hub_v33'
          assert page.FROZEN_PASSING_ENGINE == 'nfl_passing_yards_hub_v28'
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          assert page.STAKE_SIZING_ENABLED is False
          source = inspect.getsource(page.render_nfl_passing_yards_hub)
          for forbidden in (
              'build_baseline_projection', 'build_context_projection', 'build_distribution',
              'evaluate_market', 'projection_yards', 'fair_odds', 'no_vig',
              'over_ev', 'under_ev', 'projection_adjustment', 'stake_size',
          ):
              assert forbidden not in source, forbidden
          print('NFL_PASSING_YARDS_V34_COMPOSITION_ONLY_GREEN')
          PY

  browser-player-cards:
    needs: certify-player-cards
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/passing-combined-cards
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8517 \
            > artifacts/passing-combined-cards/streamlit.log 2>&1 &
          echo $! > /tmp/passing_combined_cards_pid

      - name: Drive real Passing combined player-card UI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _wait_for_text,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base='http://127.0.0.1:8517'
          artifacts=Path('artifacts/passing-combined-cards')
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1600,'height':3200})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  nfl_market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  nfl_market_combo.wait_for(state='visible',timeout=30000)
                  _choose(page,frame,1,'Passing Yards')
                  body=_wait_for_text(frame,'ALL 10 STEPS • PLAYER CARDS',180.0)
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Passing combined-card runtime error marker: {forbidden}')

                  deadline=time.time()+160
                  while time.time() < deadline:
                      if frame.locator('.kpass34-player').count() == 2:
                          cards=frame.locator('.kpass34-player')
                          complete=True
                          for idx in range(2):
                              card=cards.nth(idx)
                              required=(
                                  ('.kpass29-card',1),('.kpass30-profile',1),('.kpy-defense',1),
                                  ('.kpy-pressure',1),('.kpy-personnel',1),('.kpy-env',1),
                                  ('.kpy-proj',1),('.kpy8-card',1),('.kpy9-card',1),('.kpy10-card',1),
                                  ('.kpass34-step',9),
                              )
                              if not all(card.locator(selector).count() == count for selector,count in required):
                                  complete=False
                                  break
                          if complete:
                              break
                      time.sleep(2)

                  cards=frame.locator('.kpass34-player')
                  if cards.count() != 2:
                      raise BrowserQAFailure(f'expected exactly 2 combined QB cards, got {cards.count()}')

                  per_card=[]
                  required=(
                      ('.kpass29-card',1),('.kpass30-profile',1),('.kpy-defense',1),
                      ('.kpy-pressure',1),('.kpy-personnel',1),('.kpy-env',1),
                      ('.kpy-proj',1),('.kpy8-card',1),('.kpy9-card',1),('.kpy10-card',1),
                      ('.kpass34-step',9),
                  )
                  for idx in range(2):
                      card=cards.nth(idx)
                      counts={selector:card.locator(selector).count() for selector,_ in required}
                      for selector,want in required:
                          if counts[selector] != want:
                              raise BrowserQAFailure(f'QB card {idx+1} expected {want} {selector}, got {counts[selector]}')
                      step_numbers=card.locator('.kpass34-stepnum').all_inner_texts()
                      expected_steps=[f'STEP {n} / 10' for n in range(2,11)]
                      if step_numbers != expected_steps:
                          raise BrowserQAFailure(f'QB card {idx+1} step ordering mismatch: {step_numbers}')
                      per_card.append(counts)

                  legacy_grids=(
                      '.kpy-qbgrid','.kpy-pgrid','.kpy-dgrid','.kpy-xgrid','.kpy-igrid',
                      '.kpy-projgrid','.kpy8-grid','.kpy9-grid','.kpy10-grid',
                  )
                  legacy_deadline=time.time()+30
                  legacy_counts={selector:frame.locator(selector).count() for selector in legacy_grids}
                  while time.time() < legacy_deadline and any(legacy_counts.values()):
                      time.sleep(1)
                      legacy_counts={selector:frame.locator(selector).count() for selector in legacy_grids}
                  if any(legacy_counts.values()):
                      raise BrowserQAFailure(f'legacy per-step grids still rendered after reconciliation wait: {legacy_counts}')

                  if frame.locator('.kpass34-market-controls').count() != 1:
                      raise BrowserQAFailure('live market controls heading missing after player-card composition')

                  result={
                      'status':'GREEN',
                      'combined_player_cards':2,
                      'steps_per_card':10,
                      'nested_section_counts':per_card,
                      'legacy_grid_counts':legacy_counts,
                      'shared_environment_copied_per_player':True,
                      'sportsbook_projection_influence':0.0,
                      'stake_sizing_enabled':False,
                      'analytical_values_recomputed':False,
                      'frozen_visual_prior':'v33',
                      'frozen_passing_engine':'v28',
                  }
                  (artifacts/'passing_combined_cards_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'passing_combined_cards.png'),full_page=True)
                  print('NFL_PASSING_YARDS_V34_COMBINED_PLAYER_CARDS_BROWSER_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/passing-combined-cards/streamlit.log || true

      - name: Upload combined-card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-passing-combined-player-cards-${{ github.run_id }}
          path: artifacts/passing-combined-cards
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/passing_combined_cards_pid ]; then
            kill "$(cat /tmp/passing_combined_cards_pid)" 2>/dev/null || true
          fi
