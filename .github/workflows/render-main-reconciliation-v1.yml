name: Render Main Reconciliation V1

on:
  pull_request:
    branches: [main]
    paths:
      - "sports_api/api/health.py"
      - "sports_api/api/cfb_*.py"
      - "sports_api/api/nfl_*.py"
      - "sports_api/collectors/cfb_fanduel*.py"
      - "sports_api/collectors/nfl_*.py"
      - "tests/test_render_main_reconciliation_v1.py"
      - ".github/workflows/render-main-reconciliation-v1.yml"
  push:
    branches: [main]
    paths:
      - "sports_api/api/health.py"
      - "sports_api/api/cfb_*.py"
      - "sports_api/api/nfl_*.py"
      - "sports_api/collectors/cfb_fanduel*.py"
      - "sports_api/collectors/nfl_*.py"
      - "tests/test_render_main_reconciliation_v1.py"
      - ".github/workflows/render-main-reconciliation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-main-reconciliation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install reconciliation dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright

      - name: Compile restored shared-host surface
        run: |
          python -m compileall -q sports_api/api sports_api/collectors
          python -m py_compile tests/test_render_main_reconciliation_v1.py

      - name: Run focused reconciliation regressions
        run: python -m pytest -q tests/test_render_main_reconciliation_v1.py

      - name: Record health-router dependency impact
        run: |
          python - <<'PY'
          from sports_api.monster_dependency_map_v1 import build_dependency_map
          graph = build_dependency_map('.')
          report = graph.impact_report('sports_api/api/health.py')
          assert report['status'] == 'OK', report
          print('health-router risk=', report['risk'])
          print('health-router blast_radius=', report['blast_radius'])
          print('health-router entrypoints=', report['impacted_entrypoints'])
          print('health-router protected_reach=', report['protected_reach'])
          PY

      - name: Run existing Monster one-command certification
        run: |
          python -m sports_api.monster_certification_v1 --json > /tmp/monster-cert.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/monster-cert.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['failed_check_count'] == 0
          print('monster-certification:', receipt['passed_check_count'], '/', receipt['required_check_count'])
          PY

      - name: Prove reconciliation safety invariants
        run: |
          python - <<'PY'
          from sports_api.api import cfb_odds_v1
          from sports_api.api import nfl_moneyline_market_v1
          from sports_api.api import nfl_passing_yards_market_v1
          from sports_api.api import nfl_receiving_yards_market_v1
          from sports_api.api import nfl_rushing_yards_market_v1
          from sports_api.api import nfl_spread_market_v1

          cfb = cfb_odds_v1.odds_status()
          assert cfb['market_semantics']['projection_weight'] == 0.0
          assert cfb['market_semantics']['may_modify_projection'] is False
          assert cfb['identity_policy']['fuzzy_matching'] is False
          assert cfb['identity_policy']['synthetic_ids'] is False

          for module in (
              nfl_moneyline_market_v1,
              nfl_passing_yards_market_v1,
              nfl_receiving_yards_market_v1,
              nfl_rushing_yards_market_v1,
              nfl_spread_market_v1,
          ):
              contract = module.CONTRACT
              assert contract['projection_weight'] == 0.0
              assert contract['may_modify_projection'] is False
              assert contract['fuzzy_matching'] is False
              assert contract['synthetic_event_ids'] is False
              assert contract['stake_sizing_enabled'] is False
              assert contract['wager_actions'] is False
          print('reconciliation safety invariants: preserved')
          PY
