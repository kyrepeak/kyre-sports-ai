name: Passing Yards Layered Hub Step 4 QB Cards

on:
  push:
    branches:
      - "monster/passing-yards-layered-hub-step4-qb-cards-v1"
    paths:
      - "prototypes/passing_yards_layered_hub_qb_cards_v1.py"
      - "prototypes/passing_yards_layered_hub_app_step4_v1.py"
      - "tests/test_passing_yards_layered_hub_qb_cards_step4_v1.py"
      - ".github/workflows/passing-yards-layered-hub-step4-qb-cards-v1.yml"

permissions:
  contents: read

jobs:
  targeted-qb-cards-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove Step 4 QB cards only
        run: python tests/test_passing_yards_layered_hub_qb_cards_step4_v1.py
