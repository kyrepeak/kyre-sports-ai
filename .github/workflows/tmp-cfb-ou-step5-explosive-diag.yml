name: TEMP CFB O/U Step 5 explosive category diagnostic

on:
  push:
    branches: ['cfb-ou-upgrade-step5-explosive']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect NCAA explosive proxy tables
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import cfb_team_data_v1 as team
          import cfb_over_under_matchup_engine_v1 as engine
          import cfb_over_under_pace_engine_v1 as pace

          specs = {
              "pass_offense": 465,
              "pass_defense": 40,
              "rush_offense": 23,
              "rush_defense": 24,
              "pass_yards_per_completion": 741,
          }
          targets = [
              {"team":"Miami (FL)","team_slug":"miami-fl"},
              {"team":"Florida A&M","team_slug":"florida-a-m"},
          ]

          for division in ("FBS","FCS"):
              print("\nDIVISION", division)
              for key, cat in specs.items():
                  url=f"https://www.ncaa.com/stats/football/{division.lower()}/current/team/{cat}"
                  table, diag = engine._load_category_table.__wrapped__(
                      url, f"NCAA {division} {key}"
                  )
                  print("TABLE", key, "rows", len(table), "url", url)
                  first=next(iter(table.values()),{})
                  print("HEADERS", key, json.dumps(first.get("headers") or []))
                  for profile in targets:
                      hit=pace._lookup(table, profile)
                      if hit:
                          print("TARGET", key, profile["team"], json.dumps({
                              "team":hit.get("team"),
                              "headers":hit.get("headers"),
                              "row":hit.get("row"),
                              "rank":hit.get("rank"),
                              "value":hit.get("value"),
                          }))
          PY
