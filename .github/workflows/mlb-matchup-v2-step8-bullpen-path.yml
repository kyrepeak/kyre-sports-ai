name: MLB Matchup V2 Step 8 bullpen path certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-matchup-v2-step7-park-weather-defense.yml'
      - '.github/workflows/mlb-matchup-v2-step8-bullpen-path.yml'
      - 'mlb_matchup_bullpen_v1.py'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v37.py'
      - 'mlb_matchup_player_v31.py'
      - 'tests/test_mlb_matchup_v2_step8_bullpen_path.py'
  push:
    branches: ['mlb-matchup-v2-step8-bullpen-path']
    paths:
      - '.github/workflows/mlb-matchup-v2-step7-park-weather-defense.yml'
      - '.github/workflows/mlb-matchup-v2-step8-bullpen-path.yml'
      - 'mlb_matchup_bullpen_v1.py'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v37.py'
      - 'mlb_matchup_player_v31.py'
      - 'tests/test_mlb_matchup_v2_step8_bullpen_path.py'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact V2 Step 8 bounded scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-v2-step7-park-weather-defense.yml' \
            '.github/workflows/mlb-matchup-v2-step8-bullpen-path.yml' \
            'mlb_matchup_bullpen_v1.py' \
            'mlb_matchup_hub_v27.py' \
            'mlb_matchup_hub_v37.py' \
            'mlb_matchup_player_v31.py' \
            'tests/test_mlb_matchup_v2_step8_bullpen_path.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup V2 Step 8 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "STEP8_EXACT_SEVEN_FILE_SCOPE=PASS"

      - name: Prove certified Steps 1-7 implementations remain frozen
        run: |
          for path in \
            mlb_matchup_hub_v30.py \
            mlb_matchup_player_v24.py \
            mlb_matchup_hitter_profile_v1.py \
            mlb_matchup_hub_v31.py \
            mlb_matchup_player_v25.py \
            mlb_matchup_pitcher_profile_v1.py \
            mlb_matchup_hub_v32.py \
            mlb_matchup_player_v26.py \
            mlb_matchup_platoon_bvp_v1.py \
            mlb_matchup_hub_v33.py \
            mlb_matchup_player_v27.py \
            mlb_matchup_pitch_mix_v1.py \
            mlb_matchup_hub_v34.py \
            mlb_matchup_player_v28.py \
            mlb_matchup_batted_ball_v1.py \
            mlb_matchup_hub_v35.py \
            mlb_matchup_player_v29.py \
            mlb_matchup_environment_v1.py \
            mlb_matchup_hub_v36.py \
            mlb_matchup_player_v30.py \
            tests/test_mlb_matchup_v2_step1_foundation.py \
            tests/test_mlb_matchup_v2_step2_hitter_profile.py \
            tests/test_mlb_matchup_v2_step3_starting_pitcher_quality.py \
            tests/test_mlb_matchup_v2_step4_platoon_bvp.py \
            tests/test_mlb_matchup_v2_step5_pitch_mix.py \
            tests/test_mlb_matchup_v2_step6_batted_ball_quality.py \
            tests/test_mlb_matchup_v2_step7_park_weather_defense.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Certified prior-step implementation changed: $path"
              exit 1
            fi
          done
          echo "STEPS1_7_IMPLEMENTATION_FREEZE=PASS"

      - name: Verify prior V2 certification jobs are isolated
        run: |
          grep -F "github.head_ref == 'mlb-matchup-v2-step1-foundation'" .github/workflows/mlb-matchup-v2-step1-foundation.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step2-hitter-profile'" .github/workflows/mlb-matchup-v2-step2-hitter-profile.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step3-starting-pitcher-quality'" .github/workflows/mlb-matchup-v2-step3-starting-pitcher-quality.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step4-platoon-bvp'" .github/workflows/mlb-matchup-v2-step4-platoon-bvp.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step5-pitch-mix'" .github/workflows/mlb-matchup-v2-step5-pitch-mix.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step6-batted-ball-quality'" .github/workflows/mlb-matchup-v2-step6-batted-ball-quality.yml
          grep -F "github.head_ref == 'mlb-matchup-v2-step7-park-weather-defense'" .github/workflows/mlb-matchup-v2-step7-park-weather-defense.yml
          echo "PRIOR_V2_CI_ISOLATION=PASS"

      - name: Prove Moneyline remains frozen
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py \
            tests/test_mlb_moneyline_clean_ui_v1.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline boundary changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_FREEZE=PASS"

      - name: Prove frozen V1 Matchup presentation and model chain unchanged
        run: |
          for path in \
            mlb_matchup_hub_v29.py \
            mlb_matchup_player_v23.py \
            mlb_matchup_hub_v28.py \
            mlb_matchup_player_v22.py \
            mlb_matchup_player_v21.py \
            mlb_matchup_player_v20.py \
            mlb_matchup_player_v19.py \
            mlb_matchup_player_v18.py \
            mlb_matchup_player_v15.py \
            mlb_matchup_hub_v14.py \
            mlb_matchup_hub_v13.py \
            mlb_matchup_hub_v12.py \
            mlb_matchup_rankings_v21.py \
            spread_engine.py \
            spread_history.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Matchup V1 boundary changed: $path"
              exit 1
            fi
          done
          echo "MATCHUP_V1_FREEZE=PASS"

      - name: Compile V2 Step 8 boundary
        run: |
          python -m py_compile \
            mlb_matchup_bullpen_v1.py \
            mlb_matchup_hub_v27.py \
            mlb_matchup_hub_v37.py \
            mlb_matchup_player_v31.py \
            tests/test_mlb_matchup_v2_step8_bullpen_path.py

      - name: Run V2 Step 8 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_v2_step8_bullpen_path.py

      - name: Prove Step 8 bullpen context and no game probability implementation
        run: |
          grep -F 'PROBABILITY_IMPACT = "NONE"' mlb_matchup_player_v31.py
          grep -F 'STEP8_ROLE = "BULLPEN_PATH_CONTEXT_ONLY"' mlb_matchup_player_v31.py
          grep -F 'RELIEVER_MAX_STARTS = 3' mlb_matchup_bullpen_v1.py
          grep -F 'RELIEVER_MAX_START_SHARE = 0.35' mlb_matchup_bullpen_v1.py
          grep -F 'WORKLOAD_DAYS = 3' mlb_matchup_bullpen_v1.py
          grep -F 'def fatigue_status' mlb_matchup_bullpen_v1.py
          grep -F 'def bullpen_quality_score' mlb_matchup_bullpen_v1.py
          grep -F 'def starter_to_bullpen_exposure' mlb_matchup_bullpen_v1.py
          grep -F 'Baseball Savant expected statistics' mlb_matchup_bullpen_v1.py
          ! grep -Fi 'def _simulate' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          ! grep -Fi 'def _calibration_from_verdict' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          ! grep -Fi 'p_one_plus_pre_matchup =' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          ! grep -Fi 'p_two_plus =' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          ! grep -Fi 'def fair_odds' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          ! grep -Fi 'def monte_carlo' mlb_matchup_player_v31.py mlb_matchup_bullpen_v1.py
          echo "STEP8_GAME_PROBABILITY_IMPACT=NONE"

      - name: Certification marker
        run: echo "MLB_MATCHUP_V2_STEP8_BULLPEN_PATH_GREEN"
