name: MLB Step5.8 actionability-shadow certification

on:
  push:
    branches:
      - mlb-step5-8-actionability-shadow-policy
    paths:
      - "sports_api/mlb_actionability_shadow_v1.py"
      - "mlb_daily_game_picks_actionability_shadow_v1.py"
      - "mlb_daily_game_picks_v217_guard.py"
      - "tests/test_mlb_actionability_shadow_v1.py"
      - ".github/workflows/mlb-step5-8-actionability-shadow-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP5_8_BASE_SHA: 691994f5707a5c1b046d8753dbe51d12c841ff4f
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true

jobs:
  certify-actionability-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Assert additive MLB-only change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP5_8_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP5_8_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          allowed='^(sports_api/mlb_actionability_shadow_v1.py|mlb_daily_game_picks_actionability_shadow_v1.py|mlb_daily_game_picks_v217_guard.py|tests/test_mlb_actionability_shadow_v1.py|\.github/workflows/mlb-step5-8-actionability-shadow-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "STEP5_8_UNEXPECTED_CHANGED_PATHS: $bad"
            exit 1
          fi
          echo 'MLB_STEP5_8_CHANGE_SCOPE_OK'

      - name: Prove Step5.7 implementation is byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP5_8_BASE_SHA"...HEAD -- \
            sports_api/mlb_price_health_v1.py \
            mlb_daily_game_picks_price_health_v1.py
          echo 'MLB_STEP5_8_STEP5_7_FROZEN'

      - name: Prove V2.1.7 risk and lineup functions are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(
              ['git', 'show', f'{os.environ["STEP5_8_BASE_SHA"]}:mlb_daily_game_picks_v217_guard.py'],
              text=True,
          )
          head = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          protected = {
              '_safe_int',
              '_norm',
              '_lineup_members_bulk',
              '_official_snapshots_v217',
              '_player_lineup_guard',
              '_risk_context_v217_guard',
          }

          def dumps(source):
              tree = ast.parse(source)
              out = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in protected:
                      out[node.name] = ast.dump(node, include_attributes=False)
              return out

          if dumps(base) != dumps(head) or set(dumps(head)) != protected:
              raise SystemExit('STEP5_8_PROTECTED_V217_FUNCTION_DRIFT')
          print('MLB_STEP5_8_V217_RISK_FUNCTIONS_FROZEN')
          PY

      - name: Assert shadow-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('sports_api/mlb_actionability_shadow_v1.py').read_text(encoding='utf-8')
          presentation = Path('mlb_daily_game_picks_actionability_shadow_v1.py').read_text(encoding='utf-8')
          guard = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          combined = core + '\n' + presentation + '\n' + guard

          forbidden_matchers = ('difflib', 'SequenceMatcher', 'fuzzywuzzy', 'rapidfuzz')
          bad_matchers = [token for token in forbidden_matchers if token in combined]
          if bad_matchers:
              raise SystemExit('STEP5_8_HEURISTIC_MATCHER_PRESENT: ' + ','.join(bad_matchers))

          forbidden_writes = (
              'c["probability"] =', "c['probability'] =",
              'c["score"] =', "c['score'] =",
              'c["projection"] =', "c['projection'] =",
              'candidate["probability"] =', "candidate['probability'] =",
              'candidate["score"] =', "candidate['score'] =",
              'candidate["projection"] =', "candidate['projection'] =",
          )
          bad_writes = [token for token in forbidden_writes if token in presentation or token in guard]
          if bad_writes:
              raise SystemExit('STEP5_8_PRODUCTION_FIELD_WRITE_PRESENT: ' + ','.join(bad_writes))

          forbidden_persistence = (
              'sqlite3', 'psycopg', 'sqlalchemy', 'supabase',
              'INSERT INTO', 'UPDATE mlb_', 'DELETE FROM', 'requests.post(',
          )
          bad_persistence = [token for token in forbidden_persistence if token in combined]
          if bad_persistence:
              raise SystemExit('STEP5_8_DURABLE_WRITE_PATH_PRESENT: ' + ','.join(bad_persistence))

          required = (
              'import mlb_daily_game_picks_price_health_v1 as step57',
              'step57.install_price_health_layer(games_df, payload=payload)',
              'actionability_shadow_context(',
              'SHADOW_PLAYABLE',
              'SHADOW_MONITOR_REFRESH',
              'SHADOW_REPRICE_LINE_CHANGE',
              'SHADOW_PASS_NEGATIVE_VALUE',
              'SHADOW_BLOCK_STALE',
              'strict_positive_ev_required',
              'fresh_snapshot_required_for_shadow_playable',
              'shadow_only',
              'activation_enabled',
              'install_actionability_shadow_layer(games_df)',
              'Pick Strength',
          )
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit('STEP5_8_CONTRACT_TOKEN_MISSING: ' + ' | '.join(missing))

          if '"activation_enabled": False' not in core or '"activation_enabled": False' not in presentation:
              raise SystemExit('STEP5_8_ACTIVATION_NOT_EXPLICITLY_DISABLED')
          if 'from mlb_daily_game_picks_actionability_shadow_v1 import install_actionability_shadow_layer' not in guard:
              raise SystemExit('STEP5_8_ACTIVE_GUARD_IMPORT_MISSING')

          print('MLB_STEP5_8_SHADOW_ONLY_CONTRACT_OK')
          PY

      - name: Prove frozen app ancestry still routes Daily Picks to active V2.1.7 guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          ancestor = subprocess.check_output(
              ['git', 'show', '6fb976a9e20c96eb68b71ad0d3511e3be1734292:app.py'],
              text=True,
          )
          required = (
              'old = "from mlb_daily_game_picks_v198 import render_daily_game_picks"',
              'new = "from mlb_daily_game_picks_v217_guard import render_daily_game_picks"',
          )
          missing = [token for token in required if token not in ancestor]
          if missing:
              raise SystemExit('STEP5_8_ACTIVE_ROUTE_ANCESTRY_DRIFT: ' + ' | '.join(missing))
          print('MLB_STEP5_8_ACTIVE_ROUTE_CONFIRMED')
          PY

      - name: Compile Step5.8 Python files
        run: |
          python -m py_compile \
            sports_api/mlb_actionability_shadow_v1.py \
            mlb_daily_game_picks_actionability_shadow_v1.py \
            mlb_daily_game_picks_v217_guard.py \
            tests/test_mlb_actionability_shadow_v1.py

      - name: Run deterministic actionability-shadow regression suite
        run: python -m pytest -q tests/test_mlb_actionability_shadow_v1.py

      - name: Certify live shadow policy without changing decisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request

          from sports_api.mlb_live_market_context_v1 import attach_live_market_context
          from sports_api.mlb_market_probability_v1 import derive_market_probability_contexts
          from sports_api.mlb_model_market_edge_v1 import model_market_edge
          from sports_api.mlb_price_discipline_v1 import price_discipline_context
          from sports_api.mlb_market_movement_v1 import build_market_observation, compare_market_observations
          from sports_api.mlb_price_health_v1 import price_health_context
          from sports_api.mlb_actionability_shadow_v1 import actionability_shadow_context

          payload = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      os.environ['PRODUCTION_ODDS_URL'],
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'KyreSportsStep5-8Cert/1.0',
                      },
                      method='GET',
                  )
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = int(response.status)
                      payload = json.loads(response.read(2_000_000).decode('utf-8'))
                  break
              except Exception as exc:
                  last_error = exc
                  print(f'STEP5_8_PRODUCTION_FETCH_ATTEMPT_{attempt}_FAILED: {type(exc).__name__}: {exc}')
                  if attempt < 3:
                      time.sleep(4)
          if payload is None:
              raise SystemExit(f'STEP5_8_PRODUCTION_FETCH_FAILED: {last_error}')

          if status != 200:
              raise SystemExit(f'STEP5_8_PRODUCTION_HTTP_{status}')
          if payload.get('data_type') != 'mlb_live_odds_api_response_v1':
              raise SystemExit('STEP5_8_BAD_PRODUCTION_DATA_TYPE')
          if payload.get('schema_version') != 1:
              raise SystemExit('STEP5_8_BAD_PRODUCTION_SCHEMA')
          if payload.get('source') != 'FanDuel':
              raise SystemExit('STEP5_8_BAD_PRODUCTION_SOURCE')
          if payload.get('transport') != 'anonymous_public_get_only':
              raise SystemExit('STEP5_8_BAD_PRODUCTION_TRANSPORT')
          collected_at = payload.get('collected_at_utc')
          games = payload.get('games') or []
          if not collected_at or not games:
              raise SystemExit('STEP5_8_MISSING_CURRENT_MARKET_SNAPSHOT')

          model_rows = [{'game_pk': game.get('official_game_id')} for game in reversed(games)]
          step52 = attach_live_market_context(model_rows, games)
          step53 = derive_market_probability_contexts(step52)
          if step52.get('attached_count') != len(games):
              raise SystemExit('STEP5_8_STEP52_ATTACH_COUNT_MISMATCH')
          if step53.get('derived_context_count') != len(games):
              raise SystemExit('STEP5_8_STEP53_DERIVED_COUNT_MISMATCH')
          if step53.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_8_STEP53_FALLBACK_WAS_USED')

          shadow_checks = 0
          playable = 0
          pass_or_wait = 0
          refresh_or_reprice = 0
          line_bearing_checks = 0
          status_counts = {}

          for game in games:
              game_id = int(game['official_game_id'])
              context = (step53.get('contexts_by_game_id') or {}).get(game_id)
              if not context:
                  raise SystemExit(f'STEP5_8_MISSING_STEP53_CONTEXT_{game_id}')

              away = str(game.get('away_team') or f'AWAY_{game_id}')
              home = str(game.get('home_team') or f'HOME_{game_id}')
              scenarios = [
                  ('Moneyline', 'away', 'Away', context['moneyline']['away']),
                  ('Moneyline', 'home', 'Home', context['moneyline']['home']),
                  ('Run Line', 'away', 'Away', context['run_line']['away']),
                  ('Run Line', 'home', 'Home', context['run_line']['home']),
                  ('Total', 'over', 'Over ' + str(context['total'].get('line')), context['total']['over']),
                  ('Total', 'under', 'Under ' + str(context['total'].get('line')), context['total']['under']),
              ]

              for market, selected_side, side_text, side_block in scenarios:
                  no_vig = float(side_block['no_vig_probability'])
                  model_p = min(0.90, max(0.10, no_vig + 0.02))
                  candidate = {
                      'game_pk': game_id,
                      'market': market,
                      'probability': model_p,
                      'side': side_text,
                      'name': None,
                      'team': None,
                  }
                  edge = model_market_edge(candidate, context, away_team=away, home_team=home)
                  price = price_discipline_context(edge)
                  observation = build_market_observation(price, collected_at_utc=collected_at)
                  movement = compare_market_observations(observation, as_of_utc=observation['collected_at_utc'])
                  health = price_health_context(movement)
                  shadow = actionability_shadow_context(health)

                  if shadow.get('official_game_id') != game_id:
                      raise SystemExit(f'STEP5_8_GAME_ID_DRIFT_{game_id}_{market}_{selected_side}')
                  if shadow.get('market') != market or shadow.get('selected_side') != selected_side:
                      raise SystemExit(f'STEP5_8_MARKET_SIDE_DRIFT_{game_id}_{market}_{selected_side}')
                  if float(shadow['current_market_odds']) != float(side_block['odds']):
                      raise SystemExit(f'STEP5_8_ODDS_DRIFT_{game_id}_{market}_{selected_side}')
                  if not math.isclose(float(shadow['model_probability']), model_p, rel_tol=0.0, abs_tol=1e-12):
                      raise SystemExit(f'STEP5_8_MODEL_PROBABILITY_DRIFT_{game_id}_{market}_{selected_side}')
                  if shadow.get('snapshot_freshness_status') != 'FRESH':
                      raise SystemExit(f'STEP5_8_BASELINE_NOT_FRESH_{game_id}_{market}_{selected_side}')
                  if shadow.get('snapshot_age_seconds') != 0.0:
                      raise SystemExit(f'STEP5_8_BASELINE_AGE_DRIFT_{game_id}_{market}_{selected_side}')
                  if shadow.get('shadow_only') is not True or shadow.get('activation_enabled') is not False:
                      raise SystemExit(f'STEP5_8_SHADOW_ACTIVATION_DRIFT_{game_id}_{market}_{selected_side}')
                  for flag in (
                      'model_math_impact', 'pick_strength_impact', 'selection_impact',
                      'ranking_impact', 'risk_logic_impact', 'wagering_impact',
                  ):
                      if shadow.get(flag) is not False:
                          raise SystemExit(f'STEP5_8_PROTECTED_IMPACT_DRIFT_{flag}_{game_id}_{market}_{selected_side}')
                  if shadow.get('durable_persistence') is not False:
                      raise SystemExit(f'STEP5_8_PERSISTENCE_DRIFT_{game_id}_{market}_{selected_side}')

                  status_name = str(shadow.get('shadow_status') or '')
                  status_counts[status_name] = status_counts.get(status_name, 0) + 1
                  if status_name.startswith('SHADOW_PLAYABLE'):
                      if health.get('current_value_status') != 'POSITIVE_VALUE':
                          raise SystemExit(f'STEP5_8_NONPOSITIVE_MARKED_PLAYABLE_{game_id}_{market}_{selected_side}')
                      playable += 1
                  elif status_name in {
                      'SHADOW_PASS_NEGATIVE_VALUE',
                      'SHADOW_PASS_BREAK_EVEN',
                      'SHADOW_WAIT_NEGATIVE_IMPROVING',
                  }:
                      pass_or_wait += 1
                  elif status_name in {
                      'SHADOW_MONITOR_REFRESH',
                      'SHADOW_REPRICE_LINE_CHANGE',
                      'SHADOW_BLOCK_STALE',
                      'SHADOW_BLOCK_UNKNOWN_FRESHNESS',
                  }:
                      refresh_or_reprice += 1
                  else:
                      raise SystemExit(f'STEP5_8_UNKNOWN_SHADOW_STATUS_{status_name}')

                  shadow_checks += 1
                  if market in {'Run Line', 'Total'}:
                      line_bearing_checks += 1

          expected_count = len(games) * 6
          if shadow_checks != expected_count:
              raise SystemExit('STEP5_8_SHADOW_COUNT_MISMATCH')
          if playable + pass_or_wait + refresh_or_reprice != expected_count:
              raise SystemExit('STEP5_8_POLICY_PARTITION_MISMATCH')
          if line_bearing_checks != len(games) * 4:
              raise SystemExit('STEP5_8_LINE_BEARING_COVERAGE_MISMATCH')

          evidence = {
              'certification_result': 'GREEN',
              'http_status': status,
              'production_game_count': len(games),
              'step5_2_attached_count': step52.get('attached_count'),
              'step5_3_derived_context_count': step53.get('derived_context_count'),
              'step5_8_live_shadow_observations_verified': shadow_checks,
              'line_bearing_shadow_checks_verified': line_bearing_checks,
              'shadow_playable_count': playable,
              'shadow_pass_or_wait_count': pass_or_wait,
              'shadow_refresh_or_reprice_count': refresh_or_reprice,
              'shadow_status_counts': status_counts,
              'production_source': payload.get('source'),
              'production_transport': payload.get('transport'),
              'collected_at_utc': collected_at,
              'step5_7_changed': False,
              'activation_enabled': False,
              'model_math_changed': False,
              'pick_strength_changed': False,
              'ranking_changed': False,
              'selection_changed': False,
              'risk_logic_changed': False,
              'durable_persistence_added': False,
              'wagering_changed': False,
              'wnba_changed': False,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('MLB_STEP5_8_ACTIONABILITY_SHADOW_GREEN')
          PY
