name: WNBA PRA Repair V1 Step 2 Team Identity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step2-team-identity.yml"
      - "app.py"
      - "devsystem/wnba_pra_repair_v1_step2_team_identity_cert.py"
      - "devsystem/task_ledgers/wnba-pra-repair-v1-step2-team-identity.json"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py"
      - "tests/test_wnba_pra_repair_v1_step2.py"
      - "wnba_pra_repair_v1_step2_team_identity.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step2-team-identity.yml"
      - "app.py"
      - "devsystem/wnba_pra_repair_v1_step2_team_identity_cert.py"
      - "devsystem/task_ledgers/wnba-pra-repair-v1-step2-team-identity.json"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py"
      - "tests/test_wnba_pra_repair_v1_step2.py"
      - "wnba_pra_repair_v1_step2_team_identity.py"

permissions:
  contents: read

concurrency:
  group: wnba-pra-repair-v1-step2-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step-2 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/wnba-pra-repair-v1-step2-team-identity.yml
          app.py
          devsystem/task_ledgers/wnba-pra-repair-v1-step2-team-identity.json
          devsystem/wnba_pra_repair_v1_step2_team_identity_cert.py
          streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py
          tests/test_wnba_pra_repair_v1_step2.py
          wnba_pra_repair_v1_step2_team_identity.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          test -s /tmp/changed.txt
          comm -23 /tmp/changed.txt /tmp/allowed.txt > /tmp/unexpected.txt
          if [ -s /tmp/unexpected.txt ]; then
            echo "WNBA_PRA_REPAIR_V1_STEP2_SCOPE_BLOCKED"
            cat /tmp/unexpected.txt
            exit 1
          fi
          echo "WNBA_PRA_REPAIR_V1_STEP2_EXACT_SCOPE_GREEN"

      - name: Verify frozen WNBA PRA dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object wnba_pra_slate_v2_step2.py)" = "4636cb4314489e3458b70cb3c17c6a6af4c5ea3d"
          test "$(git hash-object wnba_pra_game_center_v2_step3.py)" = "a181c8949991bb139521f7d379046f34147e5306"
          test "$(git hash-object wnba_pra_player_intelligence_v2_step4.py)" = "393c29711962bf1d42b8fc58322938c92e23000a"
          test "$(git hash-object streamlit_memory_lazy_router_wnba_pra_speed_v3_step9_duplicate_key_guard.py)" = "51eef1fe2526801a467f155d1c0b32d516ef8a35"
          echo "WNBA_PRA_REPAIR_V1_STEP2_FROZEN_DEPENDENCIES_GREEN"

      - name: Compile Step-2 repair
        run: |
          python -m py_compile wnba_pra_repair_v1_step2_team_identity.py
          python -m py_compile streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py
          python -m py_compile devsystem/wnba_pra_repair_v1_step2_team_identity_cert.py

      - name: Install Step-2 contract dependencies
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run Step-2 permanent contract
        run: python -m pytest -q tests/test_wnba_pra_repair_v1_step2.py tests/test_wnba_pra_speed_v3_step9.py

      - name: Certify Step-2 branch contract
        run: |
          echo "WNBA_PRA_REPAIR_V1_STEP2_IDENTITY_ONLY_SCOPE_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP2_FROZEN_SPEED_V3_STEPS1_9_SCOPE_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP2_BRANCH_GREEN"

  public-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          python -m playwright install chromium

      - name: Run one authoritative Page-2 production proof
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m devsystem.wnba_pra_repair_v1_step2_team_identity_cert \
            --production-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/wnba-pra-repair-v1-step2-team-identity

      - name: Upload Step-2 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-pra-repair-v1-step2-${{ github.run_id }}
          path: artifacts/wnba-pra-repair-v1-step2-team-identity
          if-no-files-found: warn
          retention-days: 14
