name: MONSTER Step 2D Data Truth V1

on:
  pull_request:
    branches: [monster-main]
    paths:
      - "devsystem/mandatory_2d_data_truth_gate_v1.py"
      - "devsystem/mandatory_2d_permanent_enforcement_v1.py"
      - "devsystem/monster_proof_plans/monster-step2d-data-truth-v1.json"
      - "devsystem/task_ledgers/monster-step2d-data-truth-v1.json"
      - "tests/test_devsystem_mandatory_2d_data_truth_gate_v1.py"
      - "tests/test_devsystem_step2d_recovery_integration_v1.py"
      - "tests/test_devsystem_monster_step2d_global_permanence_v1.py"
      - ".github/workflows/monster-step2d-data-truth-v1.yml"
      - "docs/superpowers/specs/2026-10-24-monster-step2d-data-truth-v1.md"
      - "docs/superpowers/plans/2026-10-24-monster-step2d-data-truth-v1.md"
  push:
    branches: [monster-main]
    paths:
      - "devsystem/mandatory_2d_data_truth_gate_v1.py"
      - "devsystem/mandatory_2d_permanent_enforcement_v1.py"
      - "devsystem/monster_proof_plans/monster-step2d-data-truth-v1.json"
      - "devsystem/task_ledgers/monster-step2d-data-truth-v1.json"
      - "tests/test_devsystem_mandatory_2d_data_truth_gate_v1.py"
      - "tests/test_devsystem_step2d_recovery_integration_v1.py"
      - "tests/test_devsystem_monster_step2d_global_permanence_v1.py"
      - ".github/workflows/monster-step2d-data-truth-v1.yml"
      - "docs/superpowers/specs/2026-10-24-monster-step2d-data-truth-v1.md"
      - "docs/superpowers/plans/2026-10-24-monster-step2d-data-truth-v1.md"

permissions:
  contents: read

concurrency:
  group: monster-step2d-data-truth-${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  monster-step2d-data-truth-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narrow test dependency
        run: python -m pip install -q pytest
      - name: Compile MONSTER Step 2D chain
        run: |
          python -m py_compile \
            devsystem/monster_system_isolation_v1.py \
            devsystem/automatic_loop_kill_v1.py \
            devsystem/mandatory_2a_action_gate_v1.py \
            devsystem/mandatory_2b_reliability_gate_v1.py \
            devsystem/mandatory_2c_autonomous_recovery_v1.py \
            devsystem/mandatory_2d_data_truth_gate_v1.py \
            devsystem/mandatory_2d_permanent_enforcement_v1.py
      - name: MONSTER hard isolation baseline
        run: python -m devsystem.monster_system_isolation_v1
      - name: MONSTER Anti-Loop baseline
        run: python devsystem/automatic_loop_kill_v1.py
      - name: MONSTER Step 2C baseline
        run: python devsystem/mandatory_2c_autonomous_recovery_v1.py
      - name: MONSTER Step 2B baseline
        run: python devsystem/mandatory_2b_reliability_gate_v1.py
      - name: MONSTER Step 2A baseline
        run: python devsystem/mandatory_2a_action_gate_v1.py
      - name: MONSTER Step 2D data-truth gate
        run: python -m devsystem.mandatory_2d_data_truth_gate_v1
      - name: Existing MONSTER permanent baseline
        run: python -m devsystem.monster_system_permanent_gate_v1
      - name: MONSTER Step 2D permanent enforcement
        run: python -m devsystem.mandatory_2d_permanent_enforcement_v1
      - name: MONSTER Step 2D focused regressions
        run: |
          python -m pytest --noconftest -q \
            tests/test_devsystem_mandatory_2d_data_truth_gate_v1.py \
            tests/test_devsystem_step2d_recovery_integration_v1.py \
            tests/test_devsystem_monster_step2d_global_permanence_v1.py
