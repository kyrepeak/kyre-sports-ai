name: CFB production 503 diagnostic

on:
  push:
    branches:
      - cfb-prod-503-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe production CFB routes and unmatched identity rows
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://kyre-sports-api.onrender.com'

          def fetch(path):
              req = urllib.request.Request(
                  base + path,
                  headers={'User-Agent': 'Kyre-CFB-prod-diagnostic/1.1'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return int(response.status), response.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read().decode('utf-8', 'replace')

          for path in [
              '/health',
              '/api/v1/cfb/markets/status',
              '/api/v1/cfb/markets/identity-status',
              '/api/v1/cfb/odds/status',
              '/api/v1/cfb/odds',
              '/api/v1/cfb/odds?game_date=2026-09-10&sportsbook=FanDuel',
          ]:
              status, body = fetch(path)
              print('CFB_PROBE', json.dumps({
                  'path': path,
                  'status': status,
                  'body': body[:4000],
              }, sort_keys=True))

          status, body = fetch('/api/v1/cfb/markets/reconciled')
          print('CFB_RECON_HTTP', status)
          try:
              payload = json.loads(body)
          except Exception:
              print('CFB_RECON_RAW', body[:8000])
          else:
              diag = payload.get('diagnostics') or {}
              identity = payload.get('identity_resolution') or {}
              unmatched = payload.get('unmatched') or []
              compact = {
                  'diagnostics': diag,
                  'identity_resolution': identity,
                  'unmatched_count': len(unmatched),
                  'unmatched': unmatched[:40],
              }
              print('CFB_RECON', json.dumps(compact, sort_keys=True))
          PY
