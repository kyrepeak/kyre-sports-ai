name: MLB Matchup Explorer cleanup Step 15 step strength certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step14-selection-lock.yml'
      - '.github/workflows/mlb-matchup-explorer-cleanup-step15-step-strength.yml'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v55.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step15_step_strength.py'
  push:
    branches: ['mlb-matchup-explorer-cleanup-step15-step-strength']
    paths:
      - '.github/workflows/mlb-matchup-explorer-cleanup-step14-selection-lock.yml'
      - '.github/workflows/mlb-matchup-explorer-cleanup-step15-step-strength.yml'
      - 'mlb_matchup_hub_v27.py'
      - 'mlb_matchup_hub_v55.py'
      - 'tests/test_mlb_matchup_explorer_cleanup_step15_step_strength.py'

permissions:
  contents: read

jobs:
  certify:
    # Historical exact-scope certification belongs only to Cleanup Step 15.
    if: github.event_name == 'push' || github.head_ref == 'mlb-matchup-explorer-cleanup-step15-step-strength'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact cleanup Step 15 scope
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-matchup-explorer-cleanup-step14-selection-lock.yml' \
            '.github/workflows/mlb-matchup-explorer-cleanup-step15-step-strength.yml' \
            'mlb_matchup_hub_v27.py' \
            'mlb_matchup_hub_v55.py' \
            'tests/test_mlb_matchup_explorer_cleanup_step15_step_strength.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Matchup Explorer cleanup Step 15 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CLEANUP_STEP15_EXACT_FIVE_FILE_SCOPE=PASS"

      - name: Prove Step 14, V2 model, router and rankings are frozen
        run: |
          for path in \
            streamlit_memory_lazy_router_v1.py \
            streamlit_memory_lazy_router_v2.py \
            mlb_matchup_hub_v54.py \
            mlb_matchup_hub_v53.py \
            mlb_matchup_hub_v52.py \
            mlb_matchup_hub_v51.py \
            mlb_matchup_hub_v50.py \
            mlb_matchup_hub_v49.py \
            mlb_matchup_hub_v48.py \
            mlb_matchup_hub_v47.py \
            mlb_matchup_hub_v46.py \
            mlb_matchup_hub_v45.py \
            mlb_matchup_hub_v44.py \
            mlb_matchup_hub_v43.py \
            mlb_matchup_hub_v42.py \
            mlb_matchup_hub_v41.py \
            mlb_matchup_hub_v14.py \
            mlb_matchup_player_v22.py \
            mlb_matchup_player_v24.py \
            mlb_matchup_player_v25.py \
            mlb_matchup_player_v26.py \
            mlb_matchup_player_v27.py \
            mlb_matchup_player_v28.py \
            mlb_matchup_player_v29.py \
            mlb_matchup_player_v30.py \
            mlb_matchup_player_v31.py \
            mlb_matchup_player_v32.py \
            mlb_matchup_player_v33.py \
            mlb_matchup_player_v34.py \
            mlb_matchup_player_v35.py \
            mlb_matchup_probability_v1.py \
            mlb_matchup_calibration_v1.py \
            mlb_matchup_rankings_v21.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Matchup boundary changed: $path"
              exit 1
            fi
          done
          echo "MATCHUP_STEP14_AND_V2_MODEL_FREEZE=PASS"

      - name: Prove Moneyline page is untouched
        run: |
          for path in \
            mlb_moneyline_hub_v164.py \
            mlb_moneyline_hub_v165.py
          do
            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              echo "Frozen Moneyline presentation changed: $path"
              exit 1
            fi
          done
          echo "MONEYLINE_PAGE_FREEZE=PASS"

      - name: Compile and import step-strength presentation
        run: |
          python -m py_compile \
            mlb_matchup_hub_v27.py \
            mlb_matchup_hub_v55.py \
            tests/test_mlb_matchup_explorer_cleanup_step15_step_strength.py
          PYTHONPATH=. python -c "import mlb_matchup_hub_v55"

      - name: Run cleanup Step 15 regression tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_mlb_matchup_explorer_cleanup_step15_step_strength.py

      - name: Certification marker
        run: echo "MLB_MATCHUP_EXPLORER_CLEANUP_STEP15_STEP_STRENGTH_GREEN"
