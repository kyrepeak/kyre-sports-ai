name: CFB Game Total V163 wrapper query-sync V5 permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [freeze/cfb-game-total-v163-wrapper-query-sync-v5-production-7]

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze scope guard
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-game-total-v163-permanent-freeze-v5.yml",
              "cfb_game_total_v163_freeze_manifest_v5.json",
              "devsystem/task_ledgers/cfb-game-total-v163-wrapper-query-sync-v5-permanent-freeze.json",
          }
          if changed != expected:
              raise SystemExit("V163 V5 freeze branch changed active code: " + str(sorted(changed)))
          print("CFB_GAME_TOTAL_V163_V5_FREEZE_SCOPE=PASS")
          PY

      - name: Verify permanent-freeze metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v163_freeze_manifest_v5.json").read_text())
          assert m["version"] == 5
          assert m["baseline_commit"] == "03c34dc63a71e774d9cf84a9b0c240d762dfd00c"
          assert m["feature_pr"] == 601
          assert m["devsystem_pr_run"] == 1035
          assert m["browser_certification_run"] == 31
          assert m["production_verification_run"] == 7
          assert m["production_verification_run_id"] == 35288865442
          assert m["render_shared_host_commit"] == "6f65c868c7b92e8813280462c6679a98df24ff00"
          c=m["contract"]
          assert c["active_page"] == "cfb_game_total_clean_page_v14"
          assert c["active_router"] == "streamlit_memory_lazy_router_v159"
          assert c["production_verifier"] == "devsystem.production_verify_v5"
          assert c["event_query_key"] == "ks_cfb_game_total_event_id"
          assert c["selector_sync_query_key"] == "ks_cfb_game_total_selector_sync"
          assert c["full_slate_server_identity"] is True
          assert c["official_espn_event_identity"] is True
          assert c["synthetic_event_ids"] is False
          assert c["streamlit_frame_local_query_sync"] is True
          assert c["transient_wrapper_sync_marker"] is True
          assert c["selected_game_survives_refresh"] is True
          assert c["selected_game_switches_full_analysis"] is True
          assert c["render_source_branch"] == "mlb-step17b-shared-host-cert"
          assert c["render_certified_commit"] == "6f65c868c7b92e8813280462c6679a98df24ff00"
          assert c["projection_math_changed"] is False
          assert c["distribution_math_changed"] is False
          assert c["step12_qualification_changed"] is False
          assert c["top5_ranking_changed"] is False
          assert c["api_model_behavior_changed"] is False
          assert c["sportsbook_projection_influence"] == 0.0
          assert c["future_changes_must_be_additive"] is True
          assert c["permanently_frozen"] is True
          print("CFB_GAME_TOTAL_V163_V5_FREEZE_METADATA=PASS")
          PY

      - name: Verify every frozen blob exactly
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v163_freeze_manifest_v5.json").read_text())
          failures=[]
          for path, expected in m["exact_blobs"].items():
              actual=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"], text=True).strip()
              if actual != expected:
                  failures.append(f"{path}: expected {expected}, got {actual}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("CFB_GAME_TOTAL_V163_V5_EXACT_BLOBS=PASS", len(m["exact_blobs"]))
          PY

      - name: Enforce frozen V163 production boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          page=Path("cfb_game_total_clean_page_v14.py").read_text(encoding="utf-8")
          router=Path("streamlit_memory_lazy_router_v159.py").read_text(encoding="utf-8")
          api=Path("sports_api/api/cfb_odds_v1.py").read_text(encoding="utf-8")
          browser=Path("devsystem/cfb_game_total_browser_qa_v4.py").read_text(encoding="utf-8")
          production=Path("devsystem/production_verify_v5.py").read_text(encoding="utf-8")
          targets=json.loads(Path("devsystem/production_targets_v1.json").read_text())

          required={
              "page": (page, [
                  'FROZEN_PRESENTATION = "cfb_game_total_clean_page_v13"',
                  'EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"',
                  'SELECTOR_SYNC_QUERY_KEY = "ks_cfb_game_total_selector_sync"',
                  'return "?" + urlencode(params)',
                  'target="_self"',
                  'del st.query_params[SELECTOR_SYNC_QUERY_KEY]',
                  'GAMES ON THIS DAY',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
                  'MAY_MODIFY_PROJECTION = False',
              ]),
              "router": (router, [
                  'FROZEN_ROUTER = "streamlit_memory_lazy_router_v158"',
                  'ACTIVE_PAGE = "cfb_game_total_clean_page_v14"',
                  'PRODUCTION_HEARTBEAT = "CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE"',
                  'LEGACY_V162_HEARTBEAT = "CFB_GAME_TOTAL_V162_PRODUCTION_ACTIVE"',
                  'LEGACY_V161_HEARTBEAT = "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
              ]),
              "api": (api, [
                  '/selector/verified-games',
                  'projection_weight',
                  'synthetic_ids',
              ]),
              "browser": (browser, [
                  'EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"',
                  'GAMES ON THIS DAY',
                  'CFB_GAME_TOTAL_V163_PRODUCTION_ACTIVE',
                  'Expected at least two verified games',
              ]),
              "production": (production, [
                  'SUPERSEDES_VERIFIER = "devsystem.production_verify_v4"',
                  '_wait_for_initial_top_level_selection',
                  '_wait_for_top_level_selection',
                  '_event_from_url(page.url)',
                  'page.reload',
              ]),
          }
          for label, (source, tokens) in required.items():
              for token in tokens:
                  if token not in source:
                      raise SystemExit(f"missing frozen {label} marker: {token}")

          render=targets["render_api"]
          assert render["service_id"] == "srv-da84q6ifngtc73bdbm6g"
          assert render["source_branch"] == "mlb-step17b-shared-host-cert"
          assert render["certified_commit"] == "6f65c868c7b92e8813280462c6679a98df24ff00"
          assert render["auto_deploy"] is False
          print("CFB_GAME_TOTAL_V163_V5_PRODUCTION_FIREWALL=PASS")
          PY

      - name: Compile frozen V163 V5 surface
        run: |
          python -m py_compile \
            app.py \
            cfb_game_total_clean_page_v14.py \
            streamlit_memory_lazy_router_v159.py \
            sports_api/api/cfb_odds_v1.py \
            devsystem/cfb_game_total_browser_qa_v4.py \
            devsystem/production_verify_v5.py \
            tests/test_cfb_game_total_v163_game_selector.py \
            tests/test_cfb_game_total_v163_server_identity.py \
            tests/test_devsystem_production_verify_v5.py \
            tests/test_devsystem_production_identity_verify_v1.py

      - name: Certification marker
        run: echo "CFB_GAME_TOTAL_V163_WRAPPER_QUERY_SYNC_V5_PERMANENT_FREEZE_GREEN"
