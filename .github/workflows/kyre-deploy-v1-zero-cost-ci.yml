name: KYRE DEPLOY V1 Zero-Cost CI

on:
  pull_request:
    paths:
      - "deploy/kyre-deploy/**"
      - "devsystem/kyre_deploy_v1_contract.py"
      - "devsystem/runless_proof_plans/kyre-deploy-cloud-run-foundation-v1.json"
      - "runless_v2/__init__.py"
      - "runless_v2/kyre_deploy_cloud_run_foundation_proof_v1.py"
      - "tests/test_kyre_deploy_v1_contract.py"
      - ".github/workflows/kyre-deploy-v1-zero-cost-ci.yml"
      - "sports_api/Dockerfile"
      - "sports_api/requirements.txt"
      - "sports_api/requirements-mlb-step14b-persistence.txt"
      - "requirements.txt"
      - "app.py"
  workflow_dispatch:

concurrency:
  group: kyre-deploy-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install contract test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run KYRE DEPLOY V1 contract
        run: python -m pytest -q tests/test_kyre_deploy_v1_contract.py

  build-images:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - name: Build provider-neutral Streamlit image
        run: docker build -f deploy/kyre-deploy/streamlit.Dockerfile -t kyre-streamlit:ci .
      - name: Build existing Kyre Sports API image
        run: docker build -f sports_api/Dockerfile -t kyre-sports-api:ci .
