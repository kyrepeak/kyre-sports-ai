name: NFL Moneyline V9 Fresh Matchup Cards V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_moneyline_hub_v9.py"
      - "nfl_hub_v18.py"
      - "tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py"
      - ".github/workflows/nfl-moneyline-v9-fresh-matchup-cards-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-fresh-moneyline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pandas numpy streamlit

      - name: Enforce exact four-file Moneyline rebuild diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-moneyline-v9-fresh-matchup-cards-v1.yml
          nfl_hub_v18.py
          nfl_moneyline_hub_v9.py
          tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Moneyline V9 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile fresh Moneyline surface
        run: |
          python -m py_compile nfl_moneyline_hub_v9.py nfl_hub_v18.py tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py

      - name: Prove frozen Moneyline engine and certified sibling owners stay untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_moneyline_hub_v([1-8])\.py$|nfl_passing_yards_.*\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$|streamlit_memory_lazy_router_.*\.py$|app\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "NFL_MONEYLINE_V9_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "NFL_MONEYLINE_V9_FROZEN_OWNER_GUARD_GREEN"

      - name: Run fresh Moneyline V9 contracts
        run: python -m pytest -q tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py

      - name: Compile frozen Moneyline V1 through V8 owners
        run: |
          python -m py_compile \
            nfl_moneyline_hub_v1.py nfl_moneyline_hub_v2.py nfl_moneyline_hub_v3.py \
            nfl_moneyline_hub_v4.py nfl_moneyline_hub_v5.py nfl_moneyline_hub_v6.py \
            nfl_moneyline_hub_v7.py nfl_moneyline_hub_v8.py

      - name: Prove V9 owns presentation only
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import nfl_moneyline_hub_v9 as page
          assert page.PRESENTATION_ONLY is True
          assert page.MATCHUP_CARD_FIRST is True
          assert page.FROZEN_ENGINE == 'nfl_moneyline_hub_v8'
          assert page.SPORTSBOOK_MODEL_INFLUENCE == 0.0
          assert page.STAKE_SIZING_ENABLED is False
          source = inspect.getsource(page)
          for forbidden in (
              'np.random','default_rng','_expected_return(','_fair_american(',
              'QUALIFIED_EDGE =','QUALIFIED_EV =','LEAN_EDGE =','MAX_COMFORTABLE_INTERVAL =',
          ):
              assert forbidden not in source, forbidden
          print('NFL_MONEYLINE_V9_PRESENTATION_ONLY_GREEN')
          PY

  browser-fresh-moneyline:
    needs: certify-fresh-moneyline
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/moneyline-v9-fresh
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8519 \
            > artifacts/moneyline-v9-fresh/streamlit.log 2>&1 &
          echo $! > /tmp/moneyline_v9_pid

      - name: Drive real iPad-size Moneyline UI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _wait_for_text,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base='http://127.0.0.1:8519'
          artifacts=Path('artifacts/moneyline-v9-fresh')
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1024,'height':1366})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  market_combo.wait_for(state='visible',timeout=30000)
                  _choose(page,frame,1,'Moneyline')

                  _wait_for_text(frame,'NFL Moneyline Matchup Board',180.0)
                  deadline=time.time()+180
                  cards=frame.locator('.kml9-matchup-card')
                  while time.time() < deadline and cards.count() < 1:
                      time.sleep(2)
                  if cards.count() < 1:
                      raise BrowserQAFailure('expected at least one fresh Moneyline matchup card')

                  body=frame.locator('body').inner_text()
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Moneyline V9 runtime error marker: {forbidden}')

                  first=cards.nth(0)
                  if first.locator('.kml9-team-panel').count() != 2:
                      raise BrowserQAFailure('first Moneyline matchup card must contain exactly two team panels')
                  required_text=('MODEL P(WIN)','MARKET NO-VIG','EDGE','EV / 1U','FINAL MONEYLINE STATE')
                  first_text=first.inner_text()
                  for label in required_text:
                      if label not in first_text:
                          raise BrowserQAFailure(f'missing fresh Moneyline card label: {label}')

                  legacy=(
                      'NFL Moneyline Command Center',
                      'STEP 1A PASSED',
                      'STEP 1B PASSED',
                      'Step 2 — QB Depth + Current Availability',
                      'Step 3 — Preseason Game-Plan Intelligence',
                      'Step 5 — Sportsbook Moneyline Market',
                      'Step 7 — No-Vig Edge + Expected Value',
                  )
                  leaked=[text for text in legacy if text in body]
                  if leaked:
                      raise BrowserQAFailure(f'legacy step-first UI leaked into V9: {leaked}')

                  overflow=frame.evaluate('() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth')
                  if overflow > 4:
                      raise BrowserQAFailure(f'iPad horizontal overflow detected: {overflow}px')

                  if frame.get_by_text('Model details & guardrails',exact=False).count() < 1:
                      raise BrowserQAFailure('fresh Moneyline details/guardrails drawer missing')

                  result={
                      'status':'GREEN',
                      'viewport':'1024x1366',
                      'matchup_cards':cards.count(),
                      'team_panels_first_card':2,
                      'legacy_step_ui_count':0,
                      'horizontal_overflow_px':overflow,
                      'frozen_engine':'nfl_moneyline_hub_v8',
                      'sportsbook_model_influence':0.0,
                      'stake_sizing_enabled':False,
                  }
                  (artifacts/'moneyline_v9_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'moneyline_v9_ipad.png'),full_page=True)
                  print('NFL_MONEYLINE_V9_FRESH_BROWSER_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/moneyline-v9-fresh/streamlit.log || true

      - name: Upload Moneyline V9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-v9-fresh-${{ github.run_id }}
          path: artifacts/moneyline-v9-fresh
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/moneyline_v9_pid ]; then
            kill "$(cat /tmp/moneyline_v9_pid)" || true
          fi
