name: WNBA Step 5L deterministic tests

on:
  push:
    branches:
      - api-foundation-v1
    paths:
      - "sports_api/wnba_daily_slate_top_five.py"
      - "sports_api/api/wnba_daily_slate_top_five.py"
      - "sports_api/tests/test_wnba_daily_slate_top_five.py"
      - "sports_api/wnba_player_prop_top_five_board.py"
      - "sports_api/database/wnba_pregame_prediction_store.py"
      - "sports_api/main.py"
      - ".github/workflows/wnba-step-5l.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sports_api/wnba_daily_slate_top_five.py"
      - "sports_api/api/wnba_daily_slate_top_five.py"
      - "sports_api/tests/test_wnba_daily_slate_top_five.py"
      - "sports_api/wnba_player_prop_top_five_board.py"
      - "sports_api/database/wnba_pregame_prediction_store.py"
      - "sports_api/main.py"
      - ".github/workflows/wnba-step-5l.yml"

jobs:
  step5l:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sports_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 5L modules
        run: |
          python -m py_compile sports_api/wnba_daily_slate_top_five.py
          python -m py_compile sports_api/api/wnba_daily_slate_top_five.py
          python -m py_compile sports_api/main.py

      - name: Run Step 5I regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_historical_backtest_calibration.py

      - name: Run Step 5J regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_pregame_prediction_store.py

      - name: Run Step 5K regression harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_player_prop_top_five_board.py

      - name: Run Step 5L deterministic harness
        env:
          PYTHONPATH: .
        run: python sports_api/tests/test_wnba_daily_slate_top_five.py
