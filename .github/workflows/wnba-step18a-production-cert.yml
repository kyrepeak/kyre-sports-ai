name: WNBA Step 18A production consumer certification

on:
  push:
    branches:
      - wnba-step18a-production-cert-controller-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP18A_TARGET_SHA: d5da3830ab2194074f2e077d6b1ea41d4bc98633
  STEP17D_FROZEN_SHA: 8448984adc779fb9af7c7a8187b0eaeb67d034c8
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"
  WNBA_STEP12_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"

jobs:
  certify-and-activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: wnba-render-staging
    steps:
      - name: Checkout exact clean Step 18A production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP18A_TARGET_SHA }}
          fetch-depth: 500

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API and persistence dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-persistence.txt

      - name: Test Step 18A and certified parent stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STEP18A_TARGET_SHA"
          python -m py_compile sports_api/wnba_step18a_streamlit_consumer.py
          python -m py_compile sports_api/api/wnba_step18a_consumer.py
          python -m py_compile sports_api/wnba_step17b_always_on_runtime.py
          python -m py_compile sports_api/main.py
          PYTHONPATH=. python tests/test_wnba_step18a_streamlit_consumer.py
          PYTHONPATH=. python tests/test_wnba_step17b_always_on_runtime.py
          PYTHONPATH=. python tests/test_wnba_step17c_production_reliability.py
          PYTHONPATH=. python tests/test_wnba_step14c_durable_restart_lease.py
          PYTHONPATH=. python tests/test_wnba_step13c_reliability_recovery.py

      - name: Prove exact clean runtime diff and frozen core
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP17D_FROZEN_SHA" HEAD
          test "$(git hash-object sports_api/wnba_step18a_streamlit_consumer.py)" = '60016ecf83f72498a58dab1dfdbd7170b6e50bf8'
          test "$(git hash-object sports_api/api/wnba_step18a_consumer.py)" = 'a75e178b17c3bcc6db2061fe057de15d008a106d'
          test "$(git hash-object sports_api/wnba_step17b_always_on_runtime.py)" = 'c915391555bb64bfec5d590f2fd60b4ebc708885'
          test "$(git hash-object sports_api/main.py)" = 'd9e71818a40282052d41b0af8b7147fee6f04b7a'
          test "$(git hash-object tests/test_wnba_step18a_streamlit_consumer.py)" = '7d8cf5885470ed3e7758a33fb013e759d78f5b53'
          test "$(git hash-object sports_api/Dockerfile)" = '324defd214f334c372f3b0b2dcafd958c962a6aa'
          test "$(git show "$STEP17D_FROZEN_SHA":sports_api/wnba_step14c_durable_restart_lease.py | git hash-object --stdin)" = "$(git hash-object sports_api/wnba_step14c_durable_restart_lease.py)"
          test "$(git show "$STEP17D_FROZEN_SHA":sports_api/wnba_step13c_reliability_recovery.py | git hash-object --stdin)" = "$(git hash-object sports_api/wnba_step13c_reliability_recovery.py)"
          test "$(git show "$STEP17D_FROZEN_SHA":sports_api/wnba_step12c_live_board_runtime.py | git hash-object --stdin)" = "$(git hash-object sports_api/wnba_step12c_live_board_runtime.py)"
          python - <<'PY'
          import os, subprocess
          frozen=os.environ['STEP17D_FROZEN_SHA']
          names=set(subprocess.check_output(['git','diff','--name-only',frozen,'HEAD']).decode().splitlines())
          expected={
              'sports_api/wnba_step18a_streamlit_consumer.py',
              'sports_api/api/wnba_step18a_consumer.py',
              'sports_api/wnba_step17b_always_on_runtime.py',
              'sports_api/main.py',
              'tests/test_wnba_step18a_streamlit_consumer.py',
          }
          if names != expected:
              raise SystemExit(f'STEP18A_PRODUCTION_DIFF_DRIFT:{sorted(names)}')
          print('STEP18A_CLEAN_PRODUCTION_DIFF_OK')
          PY

      - name: Verify protected deployment credentials exist
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$KYRE_DATABASE_URL"
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          p=urlsplit(os.environ['KYRE_DATABASE_URL'])
          assert p.scheme.lower() in {'postgres','postgresql'} and p.hostname and p.path not in {'','/'}
          print('STEP18A_PROTECTED_SECRETS_PRESENT_REDACTED_OK')
          PY

      - name: Read-only verify frozen Step 17D host and capture rollback state
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from sports_api import wnba_step17a_production_host_contract as host

          expected_sha=os.environ['STEP17D_FROZEN_SHA']
          base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step18a-cert/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          def public(path,attempts=18):
              last=None
              for _ in range(attempts):
                  try:
                      with urllib.request.urlopen(identity['url'].rstrip('/')+path,timeout=30) as r:
                          return r.status,json.loads(r.read().decode())
                  except Exception as exc:
                      last=type(exc).__name__; time.sleep(10)
              raise SystemExit(f'STEP18A_PREFLIGHT_PUBLIC_TIMEOUT:{path}:{last}')

          sid=host.EXPECTED_RENDER_SERVICE_ID
          service=req('GET',f'/services/{sid}') or {}
          identity=host.validate_render_service_identity(service)
          details=service.get('serviceDetails') if isinstance(service.get('serviceDetails'),dict) else {}
          if details.get('numInstances') != 1:
              raise SystemExit(f'Step 18A requires exactly one configured Render instance; got {details.get("numInstances")!r}')
          if str(service.get('autoDeploy') or '').lower() not in {'no','false'}:
              raise SystemExit('Step 18A requires autoDeploy=no')

          deploys=req('GET',f'/services/{sid}/deploys?limit=20')
          rows=deploys if isinstance(deploys,list) else ((deploys or {}).get('items') or (deploys or {}).get('data') or [])
          previous=None; previous_blob=''
          for row in rows:
              d=row.get('deploy') if isinstance(row,dict) and isinstance(row.get('deploy'),dict) else row
              if isinstance(d,dict) and str(d.get('status','')).lower()=='live' and d.get('id'):
                  previous=d['id']; previous_blob=json.dumps(d).lower(); break
          if not previous or expected_sha not in previous_blob:
              raise SystemExit('Step 18A refuses activation because live Render deploy is not exact frozen Step 17D runtime')

          h_code,health=public('/health')
          b_code,b=public('/api/v1/wnba/runtime/step17b')
          c_code,c=public('/api/v1/wnba/runtime/step17c')
          if h_code!=200 or not isinstance(health,dict) or health.get('status')!='ok':
              raise SystemExit('Step 18A preflight health is not OK')
          if b_code!=200 or not isinstance(b,dict) or b.get('role')!='leader' or b.get('leadership_acquired') is not True:
              raise SystemExit('Step 18A preflight Step 17B is not current leader')
          if int(b.get('failure_count') or 0)!=0 or b.get('recovered_from_checkpoint') is not True:
              raise SystemExit('Step 18A preflight Step 17B reliability contract failed')
          if c_code!=200 or not isinstance(c,dict) or c.get('state')!='healthy' or c.get('incident_active') is not False:
              raise SystemExit('Step 18A preflight Step 17C monitor is not healthy')

          pre={
              'started_at_utc':b.get('started_at_utc'),
              'checkpoint_version':int(b.get('last_checkpoint_version') or 0),
              'success_count':int(b.get('success_count') or 0),
          }
          open('/tmp/step18a-predeploy.json','w').write(json.dumps(pre))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"STEP18A_RENDER_SERVICE_ID={sid}\n")
              f.write(f"STEP18A_RENDER_URL={identity['url'].rstrip('/')}\n")
              f.write(f"STEP18A_ROLLBACK_DEPLOY_ID={previous}\n")
          print('STEP18A_FROZEN_STEP17D_HOST_PREFLIGHT_OK',sid,previous,pre['checkpoint_version'])
          PY

      - name: Configure existing Render host for Step 18A only
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sid=os.environ['STEP18A_RENDER_SERVICE_ID']; base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step18a-cert/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          target=os.environ['STEP18A_TARGET_SHA']
          req('PATCH',f'/services/{sid}',{'autoDeploy':'no'})
          updates={
              'WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED':'true',
              'WNBA_STEP17B_EXPECTED_REVISION':target,
              'WNBA_DEPLOYMENT_REVISION':target,
              'WNBA_RELEASE_ID':'wnba-step18a-streamlit-consumer',
          }
          for key,value in updates.items():
              req('PUT',f'/services/{sid}/env-vars/{key}',{'value':value})
          print('STEP18A_EXISTING_RENDER_HOST_CONFIGURED_NO_NEW_SERVICE',sid)
          PY

      - name: Deploy exact clean Step 18A target commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          sid=os.environ['STEP18A_RENDER_SERVICE_ID']; target=os.environ['STEP18A_TARGET_SHA']; base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step18a-cert/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          d=req('POST',f'/services/{sid}/deploys',{'commitId':target,'clearCache':'do_not_clear'}) or {}
          did=d.get('id')
          if not did: raise SystemExit('Render returned no Step 18A deploy ID')
          bad={'build_failed','update_failed','canceled','cancelled','deactivated'}; detail={}
          for _ in range(180):
              detail=req('GET',f'/services/{sid}/deploys/{did}') or {}; status=str(detail.get('status','')).lower()
              if status=='live': break
              if status in bad: raise SystemExit(f'Step 18A deploy failed: {status}')
              time.sleep(5)
          else: raise SystemExit('Step 18A deploy timed out')
          if target.lower() not in json.dumps(detail).lower():
              raise SystemExit('Render live deploy does not attest exact clean Step 18A target SHA')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"STEP18A_DEPLOY_ID={did}\n")
          print('STEP18A_EXACT_CLEAN_COMMIT_LIVE',did,target)
          PY

      - name: Certify first recovered cycle and captured consumer snapshot
        env:
          KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          import psycopg
          from sports_api.wnba_step17b_always_on_runtime import LEADERSHIP_LOCK_KEY

          url=os.environ['STEP18A_RENDER_URL'].rstrip('/')
          pre=json.load(open('/tmp/step18a-predeploy.json'))
          def get(path):
              with urllib.request.urlopen(url+path,timeout=30) as r:
                  return r.status,json.loads(r.read().decode())
          def hex64(value):
              text=str(value or '').strip().lower()
              return len(text)==64 and all(ch in '0123456789abcdef' for ch in text)
          first=None
          for _ in range(120):
              try:
                  h_code,h=get('/health')
                  b_code,b=get('/api/v1/wnba/runtime/step17b')
                  c_code,c=get('/api/v1/wnba/runtime/step17c')
                  a_code,a=get('/api/v1/wnba/consumer/latest')
                  restarted = not pre.get('started_at_utc') or b.get('started_at_utc') != pre.get('started_at_utc')
                  progressed = int(b.get('last_checkpoint_version') or 0) > int(pre.get('checkpoint_version') or 0)
                  snap=a.get('snapshot') if isinstance(a,dict) and isinstance(a.get('snapshot'),dict) else {}
                  lineage=a.get('lineage') if isinstance(a,dict) and isinstance(a.get('lineage'),dict) else {}
                  board=a.get('board') if isinstance(a,dict) and isinstance(a.get('board'),dict) else {}
                  semantics=a.get('semantics') if isinstance(a,dict) and isinstance(a.get('semantics'),dict) else {}
                  safe_semantics=(
                      semantics.get('read_only_get') is True and semantics.get('in_memory_snapshot_only') is True and
                      semantics.get('database_connection_opened') is False and semantics.get('database_read_performed') is False and
                      semantics.get('database_write_performed') is False and semantics.get('scheduler_started') is False and
                      semantics.get('scheduler_cycle_triggered') is False and semantics.get('sportsbook_network_called') is False and
                      semantics.get('projection_run') is False and semantics.get('monte_carlo_run') is False and
                      semantics.get('wager_action_performed') is False and semantics.get('database_secret_exposed') is False and
                      semantics.get('new_render_service_created') is False
                  )
                  consumer_ready=(
                      a_code==200 and a.get('data_type')=='wnba_step18a_streamlit_consumer_latest' and a.get('enabled') is True and
                      a.get('reason') not in {'consumer_disabled','awaiting_first_successful_scheduler_cycle'} and
                      isinstance(a.get('slate_date'),str) and bool(a.get('slate_date')) and
                      isinstance(board.get('available'),bool) and snap.get('captured_at_utc') and snap.get('stale') is False and
                      hex64(snap.get('snapshot_content_sha256')) and lineage.get('step17d_frozen_runtime_sha')==os.environ['STEP17D_FROZEN_SHA'] and
                      hex64(lineage.get('source_step13c_reliability_content_sha256')) and
                      hex64(lineage.get('source_step13a_scheduler_content_sha256')) and safe_semantics
                  )
                  runtime_ready=(
                      h_code==200 and h.get('status')=='ok' and b_code==200 and restarted and progressed and
                      b.get('role')=='leader' and b.get('leadership_acquired') is True and int(b.get('success_count') or 0)>=1 and
                      b.get('recovered_from_checkpoint') is True and int(b.get('failure_count') or 0)==0 and
                      int(b.get('duplicate_lease_skip_count') or 0)==0 and c_code==200 and c.get('monitor_enabled') is True and
                      c.get('state')=='healthy' and c.get('healthy') is True and c.get('incident_active') is False and
                      (c.get('semantics') or {}).get('read_only') is True
                  )
                  if runtime_ready and consumer_ready:
                      first={'b':b,'c':c,'a':a}; break
              except Exception:
                  pass
              time.sleep(10)
          if first is None:
              raise SystemExit('Step 18A did not reach recovered scheduler + healthy monitor + captured consumer state in time')

          with psycopg.connect(os.environ['KYRE_DATABASE_URL'],connect_timeout=10,autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT pg_try_advisory_lock(%s)',(LEADERSHIP_LOCK_KEY,)); acquired=cur.fetchone()[0]
                  if acquired:
                      cur.execute('SELECT pg_advisory_unlock(%s)',(LEADERSHIP_LOCK_KEY,))
                      raise SystemExit('External process acquired Step 17B leadership during Step 18A certification')

          b=first['b']; a=first['a']; snap=a['snapshot']; lineage=a['lineage']
          evidence={
              'started_at_utc':b.get('started_at_utc'),
              'checkpoint_version':int(b.get('last_checkpoint_version') or 0),
              'success_count':int(b.get('success_count') or 0),
              'heartbeat_at_utc':b.get('heartbeat_at_utc'),
              'consumer_captured_at_utc':snap.get('captured_at_utc'),
              'consumer_snapshot_content_sha256':snap.get('snapshot_content_sha256'),
              'source_step13c_reliability_content_sha256':lineage.get('source_step13c_reliability_content_sha256'),
              'board_available':a['board'].get('available'),
              'consumer_available':a.get('available'),
              'consumer_reason':a.get('reason'),
          }
          open('/tmp/step18a-first.json','w').write(json.dumps(evidence))
          print('STEP18A_FIRST_CAPTURED_CONSUMER_OK',json.dumps(evidence,sort_keys=True))
          PY

      - name: Prove consumer snapshot and durable runtime progress together
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['STEP18A_RENDER_URL'].rstrip('/')
          first=json.load(open('/tmp/step18a-first.json'))
          def get(path):
              with urllib.request.urlopen(url+path,timeout=30) as r:
                  return r.status,json.loads(r.read().decode())
          final=None
          for _ in range(30):
              try:
                  _,b=get('/api/v1/wnba/runtime/step17b')
                  _,c=get('/api/v1/wnba/runtime/step17c')
                  _,a=get('/api/v1/wnba/consumer/latest')
                  snap=a.get('snapshot') or {}; lineage=a.get('lineage') or {}; semantics=a.get('semantics') or {}
                  if (
                      int(b.get('last_checkpoint_version') or 0)>int(first['checkpoint_version']) and
                      int(b.get('success_count') or 0)>int(first['success_count']) and b.get('heartbeat_at_utc')!=first.get('heartbeat_at_utc') and
                      b.get('role')=='leader' and b.get('leadership_acquired') is True and int(b.get('failure_count') or 0)==0 and
                      int(b.get('duplicate_lease_skip_count') or 0)==0 and c.get('state')=='healthy' and c.get('incident_active') is False and
                      a.get('enabled') is True and a.get('reason') not in {'consumer_disabled','awaiting_first_successful_scheduler_cycle'} and
                      snap.get('captured_at_utc') and snap.get('captured_at_utc')!=first.get('consumer_captured_at_utc') and snap.get('stale') is False and
                      (snap.get('snapshot_content_sha256')!=first.get('consumer_snapshot_content_sha256') or
                       lineage.get('source_step13c_reliability_content_sha256')!=first.get('source_step13c_reliability_content_sha256')) and
                      semantics.get('read_only_get') is True and semantics.get('scheduler_cycle_triggered') is False and
                      semantics.get('sportsbook_network_called') is False and semantics.get('projection_run') is False and
                      semantics.get('monte_carlo_run') is False and semantics.get('database_write_performed') is False
                  ):
                      final={'b':b,'c':c,'a':a}; break
              except Exception:
                  pass
              time.sleep(10)
          if final is None:
              raise SystemExit('Step 18A did not prove a second healthy durable cycle with a new consumer snapshot')

          b=final['b']; c=final['c']; a=final['a']; snap=a['snapshot']
          evidence={
              'step':'18A',
              'status':'certified',
              'revision':os.environ['STEP18A_TARGET_SHA'],
              'render_service_id':os.environ['STEP18A_RENDER_SERVICE_ID'],
              'deploy_id':os.environ.get('STEP18A_DEPLOY_ID'),
              'first_checkpoint_version':first['checkpoint_version'],
              'final_checkpoint_version':b.get('last_checkpoint_version'),
              'final_success_count':b.get('success_count'),
              'leadership_acquired':b.get('leadership_acquired'),
              'recovered_from_checkpoint':b.get('recovered_from_checkpoint'),
              'monitor_state':c.get('state'),
              'monitor_incident_active':c.get('incident_active'),
              'consumer_enabled':a.get('enabled'),
              'consumer_available':a.get('available'),
              'consumer_reason':a.get('reason'),
              'board_available':(a.get('board') or {}).get('available'),
              'consumer_snapshot_stale':snap.get('stale'),
              'consumer_snapshot_progressed':True,
              'consumer_read_only':(a.get('semantics') or {}).get('read_only_get'),
              'consumer_in_memory_only':(a.get('semantics') or {}).get('in_memory_snapshot_only'),
              'consumer_triggered_extra_scheduler_cycle':False,
              'consumer_triggered_sportsbook_call':False,
              'consumer_triggered_projection_run':False,
              'consumer_triggered_monte_carlo_run':False,
              'consumer_database_write':False,
              'new_render_service_created':False,
              'database_secret_exposed':False,
              'render_plan':'free',
              'availability_mode':'best_effort_free_tier',
              'guaranteed_24_7':False,
          }
          open('step18a-live-certification.json','w').write(json.dumps(evidence,indent=2,sort_keys=True))
          print('STEP18A_PRODUCTION_CONSUMER_OK',json.dumps(evidence,sort_keys=True))
          PY

      - name: Upload Step 18A production certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step18a-production-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: step18a-live-certification.json
          if-no-files-found: error
          retention-days: 90

      - name: Roll back exactly to frozen Step 17D on certification failure
        if: failure() && env.STEP18A_RENDER_SERVICE_ID != '' && env.STEP18A_ROLLBACK_DEPLOY_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sid=os.environ['STEP18A_RENDER_SERVICE_ID']; previous=os.environ['STEP18A_ROLLBACK_DEPLOY_ID']; base='https://api.render.com/v1'
          headers={'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",'Accept':'application/json','Content-Type':'application/json','User-Agent':'kyre-step18a-rollback/1'}
          def req(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read().decode(); return json.loads(raw) if raw else None
          frozen=os.environ['STEP17D_FROZEN_SHA']
          restore={
              'WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED':'false',
              'WNBA_STEP17B_EXPECTED_REVISION':frozen,
              'WNBA_DEPLOYMENT_REVISION':frozen,
