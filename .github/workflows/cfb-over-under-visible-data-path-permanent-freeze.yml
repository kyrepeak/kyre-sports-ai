name: CFB O/U visible data path permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [cfb-ou-visible-data-path-permanent-freeze]
permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify freeze scope and parent freezes
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()

          actual=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-over-under-visible-data-path-permanent-freeze.yml",
              "cfb_over_under_visible_data_path_freeze_manifest_v1.json",
          }
          failures=[]
          if actual!=expected:
              failures.append(f"scope mismatch: {sorted(actual)}")

          parents=[
              "cfb_over_under_upgrade_freeze_manifest_v12.json",
              "cfb_over_under_post12_data_recovery_freeze_manifest_v1.json",
              "cfb_over_under_deep_data_reconciliation_freeze_manifest_v1.json",
          ]
          for path in parents:
              m=json.loads(pathlib.Path(path).read_text())
              for frozen,blob in (m.get("exact_blobs") or {}).items():
                  if rev(f"HEAD:{frozen}")!=blob:
                      failures.append(f"parent frozen blob changed: {frozen}")

          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_VISIBLE_PATH_PARENT_FREEZES_AND_SCOPE=PASS")
          PY

      - name: Enforce visible-path exact blobs and contract
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          def rev(spec):
              return subprocess.check_output(["git","rev-parse",spec],text=True).strip()
          path="cfb_over_under_visible_data_path_freeze_manifest_v1.json"
          failures=[]
          if rev(f"HEAD:{path}")!="068457e3baa267ba7f824f1c22c109d4f48402c3":
              failures.append("visible-path freeze manifest changed")
          m=json.loads(pathlib.Path(path).read_text())
          for frozen,blob in (m.get("exact_blobs") or {}).items():
              if rev(f"HEAD:{frozen}")!=blob:
                  failures.append(f"visible-path blob changed: {frozen}")
          c=m.get("contract") or {}
          for key in (
              "visible_game_profile_triplet_reconciled",
              "parenthetical_alias_match",
              "venue_enriched",
              "broadcast_enriched",
              "current_event_records_enriched",
              "current_event_rank_enriched",
              "event_and_team_ids_enriched",
              "live_visible_html_reconciled",
              "live_step12_certified",
              "permanently_frozen",
          ):
              if c.get(key) is not True:
                  failures.append(f"lost true invariant: {key}")
          for key in (
              "model_formula_changed",
              "sportsbook_input_added",
              "market_probability_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ):
              if c.get(key) is not False:
                  failures.append(f"violated false invariant: {key}")
          expected={
              "active_router":"streamlit_memory_lazy_router_v55",
              "schedule_provider":"cfb_schedule_v4",
              "visible_ui":"cfb_over_under_matchup_ui_v15_visible_data_path",
              "live_espn_matches":1,
              "live_venue_missing":0,
              "live_broadcast_missing":0,
              "live_event_id":"401858213",
              "live_away_record":"1-1",
              "live_home_record":"1-0",
              "live_home_rank":7,
              "live_venue":"Hard Rock Stadium",
              "live_broadcast":"ACC Network",
              "regression_tests_passed":241,
          }
          for key,value in expected.items():
              if c.get(key)!=value:
                  failures.append(f"contract changed: {key}")
          if failures:
              print(*failures,sep="\n")
              sys.exit(1)
          print("CFB_OU_VISIBLE_PATH_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Compile and regress visible path
        run: |
          python - <<'PY'
          import py_compile
          for path in (
              "app.py",
              "cfb_schedule_v4.py",
              "cfb_over_under_matchup_ui_v15_visible_data_path.py",
              "streamlit_memory_lazy_router_v55.py",
          ):
              py_compile.compile(path,doraise=True)
          print("CFB_OU_VISIBLE_PATH_FROZEN_COMPILE=PASS")
          PY
          PYTHONPATH=. python -m pytest -q             tests/test_cfb_schedule_v4_visible_enrichment.py             tests/test_cfb_over_under_visible_data_path_v15.py             tests/test_cfb_over_under_deep_data_reconciliation_v1.py             tests/test_cfb_over_under_deep_data_ui_router.py             tests/test_cfb_over_under_post12_data_recovery.py             tests/test_cfb_over_under_post12_data_recovery_slate_ui_router.py             tests/test_cfb_over_under_upgrade_step12_certification.py             tests/test_cfb_over_under_upgrade_step12_slate.py             tests/test_cfb_over_under_upgrade_step12_ui_router.py             tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py             tests/test_cfb_over_under_upgrade_step11_slate.py             tests/test_cfb_over_under_upgrade_step11_ui_router.py             tests/test_cfb_over_under_upgrade_step10_history_engine.py             tests/test_cfb_over_under_upgrade_step10_slate.py             tests/test_cfb_over_under_upgrade_step10_ui_router.py             tests/test_cfb_over_under_upgrade_step9_environment_engine.py             tests/test_cfb_over_under_upgrade_step9_slate.py             tests/test_cfb_over_under_upgrade_step9_ui_router.py             tests/test_cfb_over_under_upgrade_step8_turnover_engine.py             tests/test_cfb_over_under_upgrade_step8_slate.py             tests/test_cfb_over_under_upgrade_step8_ui_router.py             tests/test_cfb_over_under_upgrade_step7_third_down_engine.py             tests/test_cfb_over_under_upgrade_step7_slate.py             tests/test_cfb_over_under_upgrade_step7_ui_router.py             tests/test_cfb_over_under_upgrade_step6_red_zone_engine.py             tests/test_cfb_over_under_upgrade_step6_slate.py             tests/test_cfb_over_under_upgrade_step6_ui_router.py             tests/test_cfb_over_under_upgrade_step5_explosive_engine.py             tests/test_cfb_over_under_upgrade_step5_slate.py             tests/test_cfb_over_under_upgrade_step5_ui_router.py             tests/test_cfb_over_under_upgrade_step4_pace_engine.py             tests/test_cfb_over_under_upgrade_step4_slate.py             tests/test_cfb_over_under_upgrade_step4_ui_router.py             tests/test_cfb_over_under_upgrade_step3_engine.py             tests/test_cfb_over_under_upgrade_step3_slate.py             tests/test_cfb_over_under_upgrade_step3_ui.py             tests/test_cfb_over_under_multisource_logo_resolver_v2.py             tests/test_cfb_over_under_multisource_logo_hotfix_v4.py             tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Freeze firewall
        run: |
          grep -F 'from streamlit_memory_lazy_router_v55 import render_app' app.py
          python - <<'PY'
          from pathlib import Path
          text="\n".join(Path(p).read_text() for p in (
              "cfb_schedule_v4.py",
              "cfb_over_under_matchup_ui_v15_visible_data_path.py",
              "streamlit_memory_lazy_router_v55.py",
          ))
          for token in (
              'FROZEN_SCHEDULE = "cfb_schedule_v3"',
              'FROZEN_PARENT_UI = "cfb_over_under_matchup_ui_v14_deep_data"',
              'FROZEN_ROUTER="streamlit_memory_lazy_router_v54"',
          ):
              if token not in text:
                  raise SystemExit(f"missing marker: {token}")
          lower=text.lower()
          for token in ("sportsbook_api","np.random","import random","monte_carlo("):
              if token in lower:
                  raise SystemExit(f"firewall crossed: {token}")
          print("CFB_OU_VISIBLE_PATH_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - run: echo CFB_OU_VISIBLE_DATA_PATH_PERMANENTLY_FROZEN_GREEN
