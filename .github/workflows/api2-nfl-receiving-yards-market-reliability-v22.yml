name: API2 NFL Receiving Yards Market Reliability V22

on:
  pull_request:
    branches: [api2-main]
    paths:
      - "sports_api/collectors/nfl_fanduel_receiving_yards_nflverse_v2.py"
      - "sports_api/api/nfl_receiving_yards_slate_v2.py"
      - "tests/test_api2_nfl_receiving_yards_market_reliability_v22.py"
      - ".github/workflows/api2-nfl-receiving-yards-market-reliability-v22.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving-yards-market-reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas fastapi requests
      - name: Compile market reliability boundary
        run: |
          python -m py_compile \
            sports_api/collectors/nfl_fanduel_receiving_yards_nflverse_v2.py \
            sports_api/api/nfl_receiving_yards_slate_v2.py \
            tests/test_api2_nfl_receiving_yards_market_reliability_v22.py
      - name: Prove exact market reconciliation and bounded transport recovery
        run: python -m pytest --noconftest -q tests/test_api2_nfl_receiving_yards_market_reliability_v22.py
