name: Sitewide Theme Rollout Step 4 Remaining Pages

on:
  push:
    branches:
      - "monster/sitewide-theme-rollout-step4-remaining-pages-v1"
    paths:
      - "app.py"
      - "kyre_remaining_pages_theme_v1.py"
      - "streamlit_memory_lazy_router_v191.py"
      - "tests/test_sitewide_theme_rollout_step4_remaining_pages_v1.py"
      - ".github/workflows/sitewide-theme-rollout-step4-remaining-pages-v1.yml"

permissions:
  contents: read

jobs:
  targeted-remaining-pages-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove remaining pages universal compatibility only
        run: python tests/test_sitewide_theme_rollout_step4_remaining_pages_v1.py
