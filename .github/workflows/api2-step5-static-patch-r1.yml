name: API2 Step5 Static Patch R1

on:
  push:
    branches:
      - api2-step5-static-diagnostic-r1
    paths:
      - .github/workflows/api2-step5-static-patch-r1.yml

permissions:
  contents: write

concurrency:
  group: api2-step5-static-patch-r1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact authoritative candidate
        uses: actions/checkout@v4
        with:
          ref: api2-universal-sports-source-finalization-v1-step5-health-identity
          fetch-depth: 0
      - name: Guard exact failed candidate and apply one-line root-cause patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_OLD_HEAD="63c5c14993901128934400c284fde8bc576341cb"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_HEAD"
          python -c "from pathlib import Path; p=Path('devsystem/universal_sports_identity_health_v1.py'); t=p.read_text(encoding='utf-8'); old='        validated_contract,\\n        snapshot,'; new='        contract,\\n        snapshot,'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new), encoding='utf-8')"
          test "$(git diff --name-only)" = "devsystem/universal_sports_identity_health_v1.py"
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run exact Runless static slice before push
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_devsystem_universal_sports_identity_health_step5_v1.py
          python -m pytest -q tests/test_devsystem_universal_sports_provider_registry_step2_v1.py tests/test_devsystem_universal_sports_field_router_step3_v1.py tests/test_devsystem_universal_sports_trust_quorum_step4_v1.py tests/test_devsystem_universal_sports_identity_health_step5_v1.py tests/test_devsystem_unified_data_identity_provider_health_graph_v1.py
          python -m py_compile devsystem/universal_sports_identity_health_v1.py
      - name: Commit and CAS-push authoritative candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_OLD_HEAD="63c5c14993901128934400c284fde8bc576341cb"
          git config user.name "api2-step5-maintenance[bot]"
          git config user.email "api2-step5-maintenance[bot]@users.noreply.github.com"
          git add devsystem/universal_sports_identity_health_v1.py
          test "$(git diff --cached --name-only)" = "devsystem/universal_sports_identity_health_v1.py"
          git commit -m "fix(api2): avoid Step5 contract re-fingerprint drift"
          git push --force-with-lease="refs/heads/api2-universal-sports-source-finalization-v1-step5-health-identity:${EXPECTED_OLD_HEAD}" origin "HEAD:refs/heads/api2-universal-sports-source-finalization-v1-step5-health-identity"
          echo "API2_STEP5_STATIC_ROOT_CAUSE_PATCH_GREEN"
