name: NFL Game Totals Page Step 1

on:
  push:
    branches:
      - monster/nfl-game-totals-page-step1
  pull_request:
    branches:
      - main
    paths:
      - nfl_game_totals_hub_v1.py
      - nfl_hub_v18.py
      - tests/test_nfl_game_totals_page_step1.py
      - .github/workflows/nfl-game-totals-page-step1.yml
  workflow_dispatch:

jobs:
  page-step1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Step 1 contract
        run: python -m pytest -q tests/test_nfl_game_totals_page_step1.py
