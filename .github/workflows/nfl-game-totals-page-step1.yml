name: NFL Game Totals Page Step 1

on:
  push:
    branches:
      - monster/nfl-game-totals-page-step1
  pull_request:
    branches:
      - main
    paths:
      - nfl_game_totals_hub_v1.py
      - nfl_hub_v18.py
      - tests/test_nfl_game_totals_page_step1.py
      - .github/workflows/nfl-game-totals-page-step1.yml
  workflow_dispatch:

jobs:
  page-step1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Freeze-scope guard
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              nfl_game_totals_hub_v1.py|nfl_hub_v18.py|tests/test_nfl_game_totals_page_step1.py|.github/workflows/nfl-game-totals-page-step1.yml)
                ;;
              *)
                echo "Unexpected Step 1 file: $path"
                exit 1
                ;;
            esac
          done
          if git diff --name-only origin/main...HEAD | grep -E '(^|/)(streamlit_memory_lazy_router_v136\.py|nfl_spread_|nfl_moneyline_hub_|nfl_rushing_yards_|nfl_receiving_yards_)'; then
            echo 'Frozen NFL surface changed unexpectedly.'
            exit 1
          fi
      - name: Compile Step 1 runtime files
        run: python -m py_compile nfl_game_totals_hub_v1.py nfl_hub_v18.py
      - name: Run Step 1 contract
        run: python -m pytest -q tests/test_nfl_game_totals_page_step1.py
