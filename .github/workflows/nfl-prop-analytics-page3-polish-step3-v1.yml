name: NFL Prop Analytics Page 3 Fun Polish Step 3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-polish-step2-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-polish-step3-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step8-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-page3-polish-step3-controls-v1.json"
      - "nfl_prop_analytics_page3_controls_polish_v1.py"
      - "nfl_prop_analytics_page3_final_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page3_polish_step3_controls_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-polish-step2-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-polish-step3-v1.yml"
      - ".github/workflows/nfl-prop-analytics-page3-step8-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-page3-polish-step3-controls-v1.json"
      - "nfl_prop_analytics_page3_controls_polish_v1.py"
      - "nfl_prop_analytics_page3_final_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page3_polish_step3_controls_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-page3-polish-step3-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce exact scope and frozen layers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page3-polish-step1-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-polish-step2-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-polish-step3-v1.yml' \
            '.github/workflows/nfl-prop-analytics-page3-step8-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page3-polish-step3-controls-v1.json' \
            'nfl_prop_analytics_page3_controls_polish_v1.py' \
            'nfl_prop_analytics_page3_final_polish_v1.py' \
            'tests/test_nfl_prop_analytics_page3_polish_step3_controls_v1.py' | sort)"
          test "$actual" = "$expected" || { echo PROP_ANALYTICS_PAGE3_POLISH_STEP3_SCOPE_VIOLATION; printf '%s\n' "$actual"; exit 1; }
          check_blob(){ got="$(git hash-object "$1")"; test "$got" = "$2" || { echo "PROP_ANALYTICS_PAGE3_POLISH_STEP3_FROZEN_BLOB_CHANGED:$1:$got:$2"; exit 1; }; }
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob nfl_prop_analytics_prop_page_v1.py d5588fe6dc99b223427599d6d245a494f8e7cfc4
          check_blob nfl_prop_analytics_page3_cleanup_polish_v1.py 470d2737885c0047ed9f7fe5612d6ef249f65e70
          check_blob nfl_prop_analytics_page3_hero_polish_v1.py f3356b9178ccf648a06bd643a4509b944e4d6fc0
          check_blob nfl_prop_analytics_page3_line_control_v1.py fbeabc240196b30fc966f1a69779c543410e9e3c
          check_blob nfl_prop_analytics_page3_game_chart_v1.py b21876dfe88bed91009e9edf65cb89f472745c8e
          check_blob nfl_prop_analytics_page3_supporting_stats_v1.py 5c0107606bd7a82056176a575629b049067fdd1e
          check_blob nfl_prop_analytics_page3_market_insights_v1.py dd848e1d52e021e44da4ed8530c5de441359bc19
          check_blob app.py 2a3922af385cd0fc43bfd540783be15d582aefad
          echo PROP_ANALYTICS_PAGE3_POLISH_STEP3_SCOPE_GREEN
          echo PROP_ANALYTICS_PAGE3_POLISH_STEP3_FROZEN_STACK_GREEN
      - name: Static tests
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          PYTHONPATH=. python -m py_compile nfl_prop_analytics_page3_controls_polish_v1.py nfl_prop_analytics_page3_final_polish_v1.py
          PYTHONPATH=. python -m pytest -q tests/test_nfl_prop_analytics_page3_polish_step1_cleanup_v1.py tests/test_nfl_prop_analytics_page3_polish_step2_hero_v1.py tests/test_nfl_prop_analytics_page3_polish_step3_controls_v1.py tests/test_nfl_prop_analytics_page3_step8_final_polish_v1.py
          echo PROP_ANALYTICS_PAGE3_POLISH_STEP3_STATIC_GREEN

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/step3.log 2>&1 &
      - name: Prove controls and behavior
        run: |
          python - <<'PY'
          import re,time,requests
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8501"
          for _ in range(240):
              try:
                  if requests.get(base,timeout=2).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          def find(page,sel,timeout=240):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for f in page.frames:
                      try:
                          l=f.locator(sel)
                          if l.count(): return f,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("STEP3_SELECTOR_NOT_READY:"+sel)
          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for f in page.frames:
                      try:
                          l=f.get_by_role(kind,name=name,exact=True)
                          if l.count(): return f,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"STEP3_ROLE_NOT_READY:{kind}:{name}")
          def choose(page,name,value):
              _,l=role(page,"combobox",name); l.click(); page.keyboard.type(value,delay=10); _,o=role(page,"option",value,30); o.click()
          def seg(page,name):
              end=time.monotonic()+120
              while time.monotonic()<end:
                  for f in page.frames:
                      l=f.locator("button").filter(has_text=name)
                      for i in range(l.count()):
                          if l.nth(i).inner_text().strip()==name: return f,l.nth(i)
                  page.wait_for_timeout(250)
              raise RuntimeError("SEGMENT_NOT_READY:"+name)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=["--no-sandbox"]); ctx=b.new_context(viewport={"width":768,"height":1100}); page=ctx.new_page()
              page.goto(base,wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL"); choose(page,"🎯 NFL Market","Prop Analytics")
              _,h=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]',180); assert h.get_attribute("data-prop-handoff-state")=="ready"
              _,o=role(page,"button","Open matchup"); o.click()
              f2,_=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180); qb=f2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first; qb.click()
              _,o=role(page,"button","Open prop page",90); o.click()
              f,m=find(page,'[data-prop-page3-fun-polish-step3="v1"]',240)
              assert m.get_attribute("data-prop-page3-fun-polish-step3-presentation-only")=="true"
              _,l10=seg(page,"L10"); style=l10.evaluate("e=>{const s=getComputedStyle(e);return {h:e.getBoundingClientRect().height,b:s.borderTopWidth,r:s.borderTopLeftRadius}}"); assert style["h"]>=43.5 and style["r"]!="0px",style
              _,l5=seg(page,"L5"); l5.click()
              _,nav=find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-history="L5"]',180)
              print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_BRANCH_HISTORY_GREEN")
              _,att=seg(page,"ATT"); att.click()
              _,nav=find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-market="attempts"]',180)
              print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_BRANCH_PROP_GREEN")
              lf,line=find(page,'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]',180); old=line.get_attribute("data-prop-page3-step4-line"); mx=line.get_attribute("data-prop-page3-step4-max")
              slider=lf.get_by_role("slider").first; box=slider.bounding_box(); assert box and box["width"]>=43.5 and box["height"]>=43.5,box; slider.press("End")
              find(page,f'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-line="{float(mx):.1f}"]',180)
              assert old!=f"{float(mx):.1f}"
              print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_BRANCH_SLIDER_GREEN")
              for w in (390,768,1440):
                  page.set_viewport_size({"width":w,"height":1100}); page.wait_for_timeout(350)
                  q=f.evaluate("() => ({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})"); assert max(q["d"],q["b"])<=q["i"]+2,(w,q)
                  print(f"PROP_ANALYTICS_PAGE3_POLISH_STEP3_BRANCH_{w}_GREEN")
              print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_BRANCH_GREEN"); ctx.close(); b.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public controls and freeze
        run: |
          python - <<'PY'
          import re,time
          from playwright.sync_api import sync_playwright
          base="https://kyre-sports-ai.streamlit.app"
          def find(page,sel,timeout=300):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for f in page.frames:
                      try:
                          l=f.locator(sel)
                          if l.count(): return f,l.first
                      except Exception: pass
                  page.wait_for_timeout(300)
              raise RuntimeError("PAGE3_POLISH_STEP3_PUBLIC_SELECTOR_NOT_READY:"+sel)
          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for f in page.frames:
                      try:
                          l=f.get_by_role(kind,name=name,exact=True)
                          if l.count(): return f,l.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"PAGE3_POLISH_STEP3_PUBLIC_ROLE_NOT_READY:{kind}:{name}")
          def choose(page,name,value):
              _,l=role(page,"combobox",name); l.click(); page.keyboard.type(value,delay=10); _,o=role(page,"option",value,30); o.click()
          def seg(page,name):
              end=time.monotonic()+120
              while time.monotonic()<end:
                  for f in page.frames:
                      l=f.locator("button").filter(has_text=name)
                      for i in range(l.count()):
                          if l.nth(i).inner_text().strip()==name: return f,l.nth(i)
                  page.wait_for_timeout(250)
              raise RuntimeError("PUBLIC_SEGMENT_NOT_READY:"+name)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=["--no-sandbox","--disable-gpu"]); ctx=b.new_context(viewport={"width":768,"height":1100}); page=ctx.new_page()
              page.goto(base,wait_until="domcontentloaded",timeout=120000)
              choose(page,"🏟️ Sport","NFL"); choose(page,"🎯 NFL Market","Prop Analytics")
              _,h=find(page,'[data-nfl-prop-analytics-step3-selection="v1"]',180); assert h.get_attribute("data-prop-handoff-state")=="ready"
              _,o=role(page,"button","Open matchup"); o.click()
              f2,_=find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',180); f2.get_by_role("button",name=re.compile(r"^[A-Z]{2,3} • QB • ")).first.click()
              _,o=role(page,"button","Open prop page",90); o.click()
              f,m=find(page,'[data-prop-page3-fun-polish-step3="v1"]',300); assert m.get_attribute("data-prop-page3-fun-polish-step3-presentation-only")=="true"
              _,l5=seg(page,"L5"); l5.click(); find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-history="L5"]',180); print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_PUBLIC_HISTORY_GREEN")
              _,att=seg(page,"ATT"); att.click(); find(page,'[data-prop-page3-step2-nav-state="ready"][data-prop-page3-step2-active-market="attempts"]',180); print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_PUBLIC_PROP_GREEN")
              lf,line=find(page,'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-state="ready"]',180); mx=line.get_attribute("data-prop-page3-step4-max"); slider=lf.get_by_role("slider").first; box=slider.bounding_box(); assert box and box["width"]>=43.5 and box["height"]>=43.5; slider.press("End"); find(page,f'[data-prop-page3-step4-line-control="v1"][data-prop-page3-step4-line="{float(mx):.1f}"]',180); print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_PUBLIC_SLIDER_GREEN")
              for w in (390,768,1440):
                  page.set_viewport_size({"width":w,"height":1100}); page.wait_for_timeout(400); q=f.evaluate("() => ({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})"); assert max(q["d"],q["b"])<=q["i"]+2,(w,q); print(f"PROP_ANALYTICS_PAGE3_POLISH_STEP3_PUBLIC_{w}_GREEN")
              print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_GREEN"); print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_PUBLIC_GREEN"); print("PROP_ANALYTICS_PAGE3_POLISH_STEP3_FROZEN"); ctx.close(); b.close()
          PY
