name: WNBA Step 19A DraftKings endpoint probe

on:
  push:
    branches:
      - wnba-step19a-market-feed-audit-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP19A_BACKEND_SHA: d5da3830ab2194074f2e077d6b1ea41d4bc98633

jobs:
  probe-draftkings-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP19A_BACKEND_SHA }}
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Probe current WNBA DraftKings public JSON endpoints without writes
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          import json
          import httpx
          from sports_api.collectors.wnba_draftkings_direct import fetch_draftkings_canonical_feed

          candidates=[
              'https://sportsbook.draftkings.com/sites/US-SB/api/v5/eventgroups/94682?format=json',
              'https://sportsbook-nash.draftkings.com/sites/US-SB/api/v5/eventgroups/94682?format=json',
          ]
          headers={'User-Agent':'Mozilla/5.0 (compatible; kyre-sports-api-market-research/1)','Accept':'application/json','Referer':'https://sportsbook.draftkings.com/leagues/basketball/wnba'}
          successes=[]
          with httpx.Client(headers=headers,timeout=20,follow_redirects=True) as client:
              for url in candidates:
                  try:
                      r=client.get(url)
                      ctype=str(r.headers.get('content-type') or '')
                      info={'host':httpx.URL(url).host,'status':r.status_code,'content_type':ctype,'bytes':len(r.content)}
                      if r.status_code==200 and 'json' in ctype.casefold():
                          body=r.json()
                          eg=body.get('eventGroup') if isinstance(body,dict) and isinstance(body.get('eventGroup'),dict) else body
                          events=(eg or {}).get('events') or [] if isinstance(eg,dict) else []
                          cats=(eg or {}).get('offerCategories') or [] if isinstance(eg,dict) else []
                          info['event_count']=len(events) if isinstance(events,list) else -1
                          info['category_count']=len(cats) if isinstance(cats,list) else -1
                          info['categories']=[
                              {'id':c.get('offerCategoryId'),'name':c.get('name')}
                              for c in cats if isinstance(c,dict)
                          ][:30]
                          successes.append(url)
                      print('STEP19A_DK_ENDPOINT',json.dumps(info,sort_keys=True))
                  except Exception as exc:
                      print('STEP19A_DK_ENDPOINT_ERROR',httpx.URL(url).host,type(exc).__name__)

          if not successes:
              raise SystemExit('STEP19A_NO_WORKING_DRAFTKINGS_WNBA_V5_ENDPOINT')

          for target_date in ('2026-08-28','2026-08-29'):
              for url in successes:
                  try:
                      feed=fetch_draftkings_canonical_feed(date=target_date,season=2026,urls=[url])
                      offers=feed.get('offers') or []
                      stats=Counter(str(x.get('stat')) for x in offers if isinstance(x,dict))
                      print('STEP19A_DK_NORMALIZER',json.dumps({
                          'host':httpx.URL(url).host,
                          'date':target_date,
                          'offer_count':len(offers),
                          'stat_counts':dict(stats),
                          'source_event_count':len(feed.get('source_events') or []),
                      },sort_keys=True))
                  except Exception as exc:
                      print('STEP19A_DK_NORMALIZER_ERROR',httpx.URL(url).host,target_date,type(exc).__name__,str(exc)[:160])
          PY
