name: WNBA Step 19A DraftKings sportscontent compatibility probe

on:
  push:
    branches:
      - wnba-step19a-market-feed-audit-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP19A_BACKEND_SHA: d5da3830ab2194074f2e077d6b1ea41d4bc98633

jobs:
  probe-draftkings-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP19A_BACKEND_SHA }}
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt
          python -m pip install curl_cffi
      - name: Prove current WNBA sportscontent is compatible with frozen canonical normalizer
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          import json
          from curl_cffi import requests as cffi_requests
          from sports_api.collectors.wnba_draftkings_direct import normalize_draftkings_document
          from sports_api.wnba_official_reconciliation import extract_draftkings_events

          league_id=94682
          site='dkusaz'
          league_url=f'https://sportsbook-nash.draftkings.com/api/sportscontent/{site}/v1/leagues/{league_id}'
          r=cffi_requests.get(league_url,impersonate='chrome120',timeout=20)
          r.raise_for_status()
          league=r.json()
          categories=[x for x in (league.get('categories') or []) if isinstance(x,dict)]
          subcategories=[x for x in (league.get('subcategories') or []) if isinstance(x,dict)]
          category_names={str(x.get('id')):str(x.get('name') or '') for x in categories}
          targets={
              ('Player Points','Points O/U'):'points',
              ('Player Rebounds','Rebounds O/U'):'rebounds',
              ('Player Assists','Assists O/U'):'assists',
              ('Player Combos','Pts + Reb + Ast O/U'):'pra',
          }
          chosen=[]
          for sc in subcategories:
              cat_name=category_names.get(str(sc.get('categoryId') or ''),'')
              sub_name=str(sc.get('name') or '')
              stat=targets.get((cat_name,sub_name))
              if stat:
                  chosen.append((str(sc.get('categoryId')),str(sc.get('id')),cat_name,sub_name,stat))
          if {row[4] for row in chosen}!={'points','rebounds','assists','pra'}:
              raise SystemExit(f'STEP19A_REQUIRED_PROP_DISCOVERY_FAILED:{chosen}')

          all_offers=[]; all_events={}; summaries=[]
          for cid,sid,cat_name,sub_name,expected_stat in chosen:
              url=f'https://sportsbook-nash.draftkings.com/api/sportscontent/{site}/v1/leagues/{league_id}/categories/{cid}/subcategories/{sid}'
              response=cffi_requests.get(url,impersonate='chrome120',timeout=20)
              response.raise_for_status()
              document=response.json()
              offers=normalize_draftkings_document(document)
              events=extract_draftkings_events(document)
              stats=Counter(str(x.get('stat')) for x in offers)
              sides=Counter(str(x.get('side')) for x in offers)
              named=sum(bool(str(x.get('player_name') or '').strip()) for x in offers)
              priced=sum(('american_odds' in x or 'decimal_odds' in x) for x in offers)
              if not offers or stats.get(expected_stat,0)<=0:
                  raise SystemExit(f'STEP19A_NORMALIZER_NO_{expected_stat.upper()}_OFFERS')
              if sides.get('over',0)<=0 or sides.get('under',0)<=0:
                  raise SystemExit(f'STEP19A_NORMALIZER_MISSING_SIDES:{expected_stat}:{dict(sides)}')
              if named!=len(offers) or priced!=len(offers) or not events:
                  raise SystemExit(f'STEP19A_NORMALIZER_INCOMPLETE:{expected_stat}')
              all_offers.extend(offers)
              for event in events:
                  if event.get('source_event_id'):
                      all_events[str(event['source_event_id'])]=event
              summaries.append({'stat':expected_stat,'category_id':cid,'subcategory_id':sid,'offer_count':len(offers),'event_count':len(events),'side_counts':dict(sides)})

          stats=Counter(str(x.get('stat')) for x in all_offers)
          print('STEP19A_FROZEN_NORMALIZER_COMPAT_OK',json.dumps({'site':site,'offer_count':len(all_offers),'event_count':len(all_events),'stat_counts':dict(stats),'sources':summaries},sort_keys=True))
          PY
