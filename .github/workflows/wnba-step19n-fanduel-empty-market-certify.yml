name: WNBA Step19N FanDuel empty-market certification

on:
  push:
    branches:
      - wnba-step19n-fanduel-market-state-20260830
    paths:
      - '.github/workflows/wnba-step19n-fanduel-empty-market-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
      WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
      WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Compile Step19N chain
        run: |
          python -m py_compile \
            sports_api/wnba_step19n_fanduel_empty_market.py \
            sports_api/wnba_step19m_fanduel_line_move.py \
            sports_api/api/wnba_step17b_runtime.py

      - name: Frozen and Step19 regression wall
        run: |
          python -m pytest -q tests/test_wnba_step11_fanduel_provider.py
          python -m pytest -q \
            tests/test_wnba_step19n_fanduel_empty_market.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19l_fanduel_identity_trace.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19j_runtime_acceleration.py \
            tests/test_wnba_step19i_official_slate_transport.py \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py \
            tests/test_wnba_step19e_cooldown_aware_cycle.py

      - name: Prove hosted wrapper order and safety
        run: |
          python - <<'PY'
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19k_market_not_ready as k
          from sports_api import wnba_step19l_fanduel_identity_trace as l
          from sports_api import wnba_step19m_fanduel_line_move as m
          from sports_api import wnba_step19n_fanduel_empty_market as n
          import sports_api.api.wnba_step17b_runtime

          assert s12b.run_step12b_live_runtime_job is n.run_step12b_fanduel_empty_market_compatible
          assert n._UPSTREAM_RUN_STEP12B is k.run_step12b_market_not_ready_compatible
          assert fd.fetch_step11c_fanduel_provider_bridge is l.fetch_step11c_with_identity_trace
          assert fd._market_identity_surface is m.market_identity_surface_step19m
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          g=n.installation_status()['guardrails']
          assert g['requires_preinstalled_step19k'] is True
          assert g['draftkings_verified_nonempty_required'] is True
          assert g['all_fanduel_attempts_must_match'] is True
          for key in ('identity_failure_reclassified','transport_failure_reclassified','upstream_failure_reclassified','landing_page_failure_reclassified','fanduel_bridge_fabricated','different_lines_blended','fake_projection_created','monte_carlo_simulation_count_modified','projection_math_modified','provider_transport_modified','readiness_relaxed','persistence_modified','wagering_enabled'):
              assert g[key] is False, key
          print('STEP19N_HOST_CHAIN_CERTIFIED')
          PY

      - name: Current live Step12B state must be safe
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19h_fanduel_hosted_transport as h
          from sports_api import wnba_step19l_fanduel_identity_trace as l
          from sports_api import wnba_step19n_fanduel_empty_market as n
          import sports_api.api.wnba_step17b_runtime

          slate=datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York')).date().isoformat()
          req=s12b.build_step12b_request(
              season=2026,slate_date=slate,evaluated_at=datetime.now(timezone.utc),
              previous_state=None,controller_policy={'provider_attempts':2}
          )
          started=time.perf_counter()
          out=s12b.run_step12b_live_runtime_job(req,env=os.environ)
          elapsed=time.perf_counter()-started
          tick=((out.get('step12a_result') or {}).get('step11e_tick') or {})
          exe=tick.get('execution') or {}; state=tick.get('automation_state') or {}
          discovery=out.get('provider_discovery') or {}; dk=discovery.get('draftkings') or {}; fd=discovery.get('fanduel') or {}
          summary={
            'slate':slate,'seconds':round(elapsed,3),'status':out.get('status'),'health':out.get('health'),
            'cycle_outcome':exe.get('cycle_outcome'),'circuit_state':state.get('circuit_state'),'consecutive_failures':state.get('consecutive_failure_count'),
            'dk_records':dk.get('record_count'),'fd_records':fd.get('record_count'),'step19n_transforms':n.installation_status().get('transformed_count'),
            'fd_identity_errors':l.get_step19l_fanduel_identity_trace().get('identity_error_count'),'fd_invalid_json':h.get_step19h_fanduel_transport_status().get('invalid_json_event_count'),
            'projection_count':(out.get('projection_assembly') or {}).get('built_target_count')
          }
          print('STEP19N_LIVE_STATE',json.dumps(summary,sort_keys=True),flush=True)
          if int(dk.get('record_count') or 0)<=0:
              raise SystemExit('DraftKings was not verified nonempty in Step19N live certification')
          if int(l.get_step19l_fanduel_identity_trace().get('identity_error_count') or 0)!=0:
              raise SystemExit('FanDuel identity error remained during Step19N certification')
          if int(h.get_step19h_fanduel_transport_status().get('invalid_json_event_count') or 0)!=0:
              raise SystemExit('FanDuel invalid JSON observed during Step19N certification')
          if exe.get('cycle_outcome')=='market_board_not_ready':
              if state.get('circuit_state')!='closed' or int(state.get('consecutive_failure_count') or 0)!=0:
                  raise SystemExit('market-not-ready state damaged provider circuit')
          elif exe.get('cycle_outcome')=='shadow_board_ready':
              if state.get('circuit_state')!='closed': raise SystemExit('healthy board left circuit open')
          else:
              raise SystemExit('unexpected live Step19N cycle outcome '+repr(exe.get('cycle_outcome')))
          print('STEP19N_LIVE_STATE_CERTIFIED')
          PY
