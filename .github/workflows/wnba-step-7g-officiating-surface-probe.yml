name: WNBA Step 7G officiating surface probe

on:
  workflow_dispatch:
  push:
    branches:
      - wnba-step7g-step4j-team-history-20260827
    paths:
      - sports_api/tools/wnba_step7g_officiating_surface_probe.py
      - .github/workflows/wnba-step-7g-officiating-surface-probe.yml

concurrency:
  group: wnba-step7g-officiating-surface-probe
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_STEP7G_FIRST_PARTY_ENABLED: "false"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Assert all runtime switches OFF
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            WNBA_PRODUCTION_RUNTIME_ENABLED \
            WNBA_BOARD_SCHEDULER_ENABLED \
            WNBA_KYRE_DIRECT_SYNC_ENABLED \
            WNBA_KYRE_RECONCILED_SYNC_ENABLED \
            WNBA_STEP6J_CANARY_ENABLED \
            WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED \
            WNBA_STEP7G_FIRST_PARTY_ENABLED
          do
            test "${!name}" = "false"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile structural probe
        run: python -m py_compile sports_api/tools/wnba_step7g_officiating_surface_probe.py

      - name: Probe official WNBA.com officiating surfaces
        run: python -m sports_api.tools.wnba_step7g_officiating_surface_probe

      - name: Upload sanitized structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step7g-officiating-surface-probe
          path: /tmp/wnba_step7g_officiating_surface_probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Reassert production OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = "false"
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = "false"
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = "false"
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = "false"
          test "$WNBA_STEP6J_CANARY_ENABLED" = "false"
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = "false"
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = "false"
