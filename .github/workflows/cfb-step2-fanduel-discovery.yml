name: CFB Step 2 FanDuel discovery

on:
  push:
    branches:
      - cfb-step2-fanduel-discovery
  pull_request:
    branches:
      - mlb-step17b-shared-host-cert

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover CFB public FanDuel page identity
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          AK = "FhMFpcPWXMeyZxOx"
          BASE = "https://api.sportsbook.fanduel.com"
          headers = {
              "Accept": "application/json, text/plain, */*",
              "User-Agent": "Mozilla/5.0 (compatible; KyreSportsAPI-CFB/1.0; read-only)",
              "Origin": "https://sportsbook.fanduel.com",
              "Referer": "https://sportsbook.fanduel.com/",
              "x-sportsbook-region": "NJ",
          }

          def get_json(url, params=None):
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(20_000_001)
                  assert response.status == 200, response.status
              assert len(raw) <= 20_000_000
              return json.loads(raw.decode("utf-8"))

          context = get_json(
              BASE + "/sbapi/application-context",
              {"_ak": AK, "dataEntries": "EVENT_TYPES"},
          )

          matches = []
          needles = ("college football", "ncaaf", "ncaa football", "college-football")

          def walk(value, path="$"):
              if isinstance(value, dict):
                  text = " ".join(
                      str(v) for v in value.values()
                      if isinstance(v, (str, int, float, bool))
                  ).casefold()
                  if any(n in text for n in needles):
                      matches.append((path, value))
                  for key, child in value.items():
                      if isinstance(child, (dict, list)):
                          walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for idx, child in enumerate(value):
                      if isinstance(child, (dict, list)):
                          walk(child, f"{path}[{idx}]")

          walk(context)
          print("FANDUEL_CFB_DISCOVERY_MATCH_COUNT", len(matches))
          for path, row in matches[:30]:
              safe = {
                  str(k): v
                  for k, v in row.items()
                  if isinstance(v, (str, int, float, bool, type(None)))
              }
              print("MATCH", path, json.dumps(safe, sort_keys=True)[:3000])

          # Probe the current production market transport without printing secrets.
          status = get_json("https://kyre-sports-api.onrender.com/api/v1/cfb/markets/status")
          print(
              "PRODUCTION_CFB_STATUS",
              json.dumps(
                  {
                      "feed_configured": status.get("feed_configured"),
                      "feed_present": status.get("feed_present"),
                      "ingest_configured": status.get("ingest_configured"),
                      "route_ready": status.get("route_ready"),
                  },
                  sort_keys=True,
              ),
          )
          # Verify a bounded set of page ids derived from FanDuel's public
          # college-football URL vocabulary and sportsbook nomenclature. Nothing
          # is accepted unless the returned event surface proves it is CFB.
          candidates = ["college-football", "ncaaf", "ncaa-football"]
          for page_id in candidates:
              try:
                  page = get_json(
                      BASE + "/sbapi/content-managed-page",
                      {
                          "_ak": AK,
                          "page": "CUSTOM",
                          "customPageId": page_id,
                          "timezone": "America/New_York",
                      },
                  )
                  attachments = page.get("attachments")
                  events_raw = attachments.get("events") if isinstance(attachments, dict) else None
                  if isinstance(events_raw, dict):
                      events = [v for v in events_raw.values() if isinstance(v, dict)]
                  elif isinstance(events_raw, list):
                      events = [v for v in events_raw if isinstance(v, dict)]
                  else:
                      events = []
                  names = [
                      str(e.get("name") or e.get("eventName") or e.get("displayName") or "")
                      for e in events[:8]
                  ]
                  cfb_like = sum(
                      1 for name in names
                      if " @ " in name and any(
                          token in name.casefold()
                          for token in (
                              "state", "university", "tigers", "bulldogs", "wildcats",
                              "hurricanes", "seminoles", "buckeyes", "longhorns",
                              "crimson tide", "trojans", "aggies", "volunteers",
                          )
                      )
                  )
                  print(
                      "PAGE_PROBE",
                      json.dumps(
                          {
                              "customPageId": page_id,
                              "event_count": len(events),
                              "sample_names": names,
                              "cfb_like_sample_count": cfb_like,
                          },
                          sort_keys=True,
                      ),
                  )
              except Exception as exc:
                  print(
                      "PAGE_PROBE",
                      json.dumps(
                          {
                              "customPageId": page_id,
                              "error": f"{type(exc).__name__}: {exc}"[:250],
                          },
                          sort_keys=True,
                      ),
                  )

          # Inspect one real upcoming CFB event to discover the exact total-market
          # contract before writing the production collector.
          ncaaf = get_json(
              BASE + "/sbapi/content-managed-page",
              {
                  "_ak": AK,
                  "page": "CUSTOM",
                  "customPageId": "ncaaf",
                  "timezone": "America/New_York",
              },
          )
          attachments = ncaaf.get("attachments")
          raw_events = attachments.get("events") if isinstance(attachments, dict) else None
          if isinstance(raw_events, dict):
              event_rows = [dict(v, _attachment_key=str(k)) for k, v in raw_events.items() if isinstance(v, dict)]
          elif isinstance(raw_events, list):
              event_rows = [dict(v) for v in raw_events if isinstance(v, dict)]
          else:
              event_rows = []

          matchup_events = [
              e for e in event_rows
              if " @ " in str(e.get("name") or e.get("eventName") or e.get("displayName") or "")
          ]
          assert matchup_events, "FanDuel ncaaf page returned no matchup events"
          matchup_events.sort(key=lambda e: str(e.get("openDate") or ""))
          sample = matchup_events[0]
          event_id = str(sample.get("eventId") or sample.get("id") or sample.get("_attachment_key") or "").strip()
          sample_name = str(sample.get("name") or sample.get("eventName") or sample.get("displayName") or "")
          event_page = get_json(
              BASE + "/sbapi/event-page",
              {"_ak": AK, "eventId": event_id},
          )
          event_attachments = event_page.get("attachments")
          raw_markets = event_attachments.get("markets") if isinstance(event_attachments, dict) else None
          if isinstance(raw_markets, dict):
              markets = [dict(v, _attachment_key=str(k)) for k, v in raw_markets.items() if isinstance(v, dict)]
          elif isinstance(raw_markets, list):
              markets = [dict(v) for v in raw_markets if isinstance(v, dict)]
          else:
              markets = []

          def rows(value):
              if isinstance(value, dict):
                  return [dict(v, _attachment_key=str(k)) for k, v in value.items() if isinstance(v, dict)]
              if isinstance(value, list):
                  return [dict(v) for v in value if isinstance(v, dict)]
              return []

          discovered = []
          for market in markets:
              name = str(market.get("marketName") or market.get("name") or market.get("displayName") or "")
              if "total" not in name.casefold() and "over" not in name.casefold():
                  continue
              runners = []
              for runner in rows(market.get("runners")):
                  result = runner.get("result") if isinstance(runner.get("result"), dict) else {}
                  win = runner.get("winRunnerOdds") if isinstance(runner.get("winRunnerOdds"), dict) else {}
                  display = win.get("americanDisplayOdds") if isinstance(win.get("americanDisplayOdds"), dict) else {}
                  runners.append({
                      "runnerName": runner.get("runnerName"),
                      "role": result.get("type"),
                      "handicap": runner.get("handicap"),
                      "american": display.get("americanOddsInt") or display.get("americanOdds"),
                      "runnerStatus": runner.get("runnerStatus"),
                  })
              discovered.append({
                  "marketName": name,
                  "marketId": market.get("marketId") or market.get("_attachment_key"),
                  "marketStatus": market.get("marketStatus") or market.get("status"),
                  "inPlay": market.get("inPlay"),
                  "runners": runners,
              })
          print("EVENT_PROBE", json.dumps({"event_id": event_id, "event_name": sample_name}, sort_keys=True))
          print("TOTAL_MARKET_PROBE_COUNT", len(discovered))
          for row in discovered[:20]:
              print("TOTAL_MARKET_PROBE", json.dumps(row, sort_keys=True)[:4000])

          # Check whether the NCAAF landing already contains Total Points markets
          # for all game events, which lets production refresh in one public GET.
          landing_markets_raw = attachments.get("markets") if isinstance(attachments, dict) else None
          landing_markets = rows(landing_markets_raw)
          total_points = []
          for market in landing_markets:
              name = str(market.get("marketName") or market.get("name") or market.get("displayName") or "")
              if name != "Total Points":
                  continue
              event_ref = str(
                  market.get("eventId")
                  or market.get("eventID")
                  or market.get("event_id")
                  or ""
              ).strip()
              runner_rows = rows(market.get("runners"))
              total_points.append({
                  "market_id": market.get("marketId") or market.get("_attachment_key"),
                  "event_id": event_ref,
                  "status": market.get("marketStatus") or market.get("status"),
                  "inPlay": market.get("inPlay"),
                  "runner_count": len(runner_rows),
                  "handicaps": [r.get("handicap") for r in runner_rows[:2]],
                  "roles": [
                      (r.get("result") or {}).get("type") if isinstance(r.get("result"), dict) else None
                      for r in runner_rows[:2]
                  ],
              })
          print(
              "LANDING_MARKET_COVERAGE",
              json.dumps(
                  {
                      "landing_market_count": len(landing_markets),
                      "total_points_market_count": len(total_points),
                      "matchup_event_count": len(matchup_events),
                      "total_points_sample": total_points[:8],
                  },
                  sort_keys=True,
              )[:10000],
          )

          print("CFB_FANDUEL_DISCOVERY_GREEN")
          PY
