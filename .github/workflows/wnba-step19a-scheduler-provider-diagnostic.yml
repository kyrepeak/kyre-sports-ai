name: WNBA Step19A Scheduler Provider Diagnostic

on:
  push:
    branches:
      - wnba-step19a-scheduler-provider-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: "true"
  WNBA_STEP19A_DRAFTKINGS_SITE: "dkusaz"
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: "true"
  WNBA_STEP11B_NETWORK_REFRESH_ENABLED: "true"
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: "true"
  WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: "true"
  WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: "true"
  WNBA_STEP10_FASTAPI_ENABLED: "true"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"

jobs:
  provider-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
      - name: Trace exact provider and official schedule identity
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          import json
          import os

          from sports_api import wnba_step19a_step17b_bridge as step19a_bridge
          from sports_api import wnba_step19a_draftkings_sportscontent as sportscontent
          from sports_api import wnba_step11_draftkings_provider as draftkings
          from sports_api import wnba_step11_fanduel_provider as fanduel
          from sports_api.wnba_official_reconciliation import parse_official_schedule

          now = datetime.now(timezone.utc)
          slate_date = now.date().isoformat()
          print("STEP19A_DIAGNOSTIC_START", {"slate_date": slate_date, "bridge": step19a_bridge.MODEL_VERSION})

          snap = sportscontent.build_step19a_draftkings_snapshot(
              date=slate_date,
              season=2026,
              env=os.environ,
          )
          events = snap.get("source_events") or []
          print("STEP19A_RAW_EVENTS", json.dumps(events, sort_keys=True, default=str))

          official_document = draftkings._get_json(
              draftkings.OFFICIAL_SCHEDULE_URL,
              requester=None,
              timeout_seconds=15.0,
          )
          games = parse_official_schedule(official_document)
          target = date.fromisoformat(slate_date)
          nearby = []
          for game in games:
              try:
                  game_day = date.fromisoformat(str(game.get("game_date")))
              except Exception:
                  continue
              if abs((game_day - target).days) <= 2:
                  nearby.append(game)
          print("STEP19A_OFFICIAL_NEARBY_GAMES", json.dumps(nearby, sort_keys=True, default=str))
          print("STEP19A_OFFICIAL_GAME_COUNT", len(games))

          # Reproduce the Step11A pair matching logic visibly.
          for event in events:
              event_id = str(event.get("source_event_id") or "")
              participant_keys = {
                  draftkings._team_identity_key(name)
                  for name in (event.get("participants") or [])
                  if draftkings._team_identity_key(name)
              }
              pair_matches = []
              for game in nearby:
                  pair = {
                      draftkings._team_identity_key(game.get("home_team_name")),
                      draftkings._team_identity_key(game.get("away_team_name")),
                  }
                  if pair == participant_keys:
                      pair_matches.append(game)
              print("STEP19A_EVENT_MATCH_TRACE", json.dumps({
                  "event_id": event_id,
                  "event_date": event.get("event_date"),
                  "participants": event.get("participants"),
                  "participant_keys": sorted(participant_keys),
                  "pair_match_count": len(pair_matches),
                  "pair_matches": pair_matches,
              }, sort_keys=True, default=str))

          results = {}
          def probe(name, fn):
              try:
                  value = fn(season=2026, slate_date=slate_date, evaluated_at=now, env=os.environ)
              except Exception as exc:
                  results[name] = {"ok": False, "error_type": type(exc).__name__, "error_message": " ".join(str(exc).split())[:1000]}
                  print(f"STEP19A_PROVIDER_{name.upper()}_FAIL", json.dumps(results[name], sort_keys=True))
                  return
              refresh = value.get("provider_refresh") or {}
              attempts = refresh.get("attempts") or []
              payload = attempts[0].get("payload") if attempts and isinstance(attempts[0], dict) else {}
              records = (payload or {}).get("records") or []
              results[name] = {"ok": True, "provider": value.get("provider"), "record_count": len(records), "bridge_hash": value.get("provider_bridge_content_sha256")}
              print(f"STEP19A_PROVIDER_{name.upper()}_OK", json.dumps(results[name], sort_keys=True))

          probe("draftkings", draftkings.fetch_step11a_draftkings_provider_bridge)
          probe("fanduel", fanduel.fetch_step11c_fanduel_provider_bridge)
          print("STEP19A_PROVIDER_DIAGNOSTIC", json.dumps(results, sort_keys=True))
          PY
