name: WNBA Step19A Scheduler Provider Diagnostic

on:
  push:
    branches:
      - wnba-step19a-scheduler-provider-diagnostic-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: "true"
  WNBA_STEP19A_DRAFTKINGS_SITE: "dkusaz"
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: "true"
  WNBA_STEP11B_NETWORK_REFRESH_ENABLED: "true"
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: "true"
  WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: "true"
  WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: "true"
  WNBA_STEP10_FASTAPI_ENABLED: "true"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"

jobs:
  provider-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
      - name: Trace current FanDuel player prop surface
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          import json
          import os

          # Keep the Step19A DK patch installed while inspecting the exact sibling
          # provider required by the Step11D two-book scheduler contract.
          from sports_api import wnba_step19a_step17b_bridge  # noqa: F401
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api.wnba_step7g_first_party_rosters import get_first_party_current_players_dataset

          now = datetime.now(timezone.utc)
          slate_date = now.date().isoformat()
          content_url = fd.FANDUEL_BASE_URL + fd.CONTENT_PAGE_PATH
          event_url = fd.FANDUEL_BASE_URL + fd.EVENT_PAGE_PATH
          common = {
              "_ak": fd.FANDUEL_PUBLIC_WEB_KEY,
              "page": "CUSTOM",
              "customPageId": fd.WNBA_CUSTOM_PAGE_ID,
              "timezone": "America/New_York",
          }
          content = fd._get_json(content_url, params=common, requester=None, timeout=15.0)
          discovered = fd._extract_events(content)
          discovered_summary = [{
              "id": fd._event_id(e),
              "name": fd._event_name(e),
              "participants": fd._event_participants(e),
              "event_day_utc": fd._event_date(e),
          } for e in discovered]
          print("FANDUEL_DISCOVERED_EVENTS", json.dumps(discovered_summary, sort_keys=True))

          target_events = [e for e in discovered if fd._event_date(e) is None or fd._event_date(e) == slate_date]
          print("FANDUEL_TARGET_EVENT_COUNT", len(target_events))

          roster_dataset = get_first_party_current_players_dataset(2026, current_roster_only=True)
          roster = fd._roster_index(roster_dataset["players"])
          total_markets = 0
          total_supported = 0
          total_player_declared = 0
          total_roster_match = 0
          total_two_side = 0

          for event in target_events:
              eid = fd._event_id(event)
              base = fd._get_json(event_url, params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "eventId": eid}, requester=None, timeout=15.0)
              tab_ids = fd._relevant_tab_ids(base)
              print("FANDUEL_EVENT", json.dumps({
                  "id": eid,
                  "name": fd._event_name(event),
                  "participants": fd._event_participants(event),
                  "event_day_utc": fd._event_date(event),
                  "tab_ids": tab_ids,
                  "base_market_count": len(fd._extract_markets(base)),
              }, sort_keys=True))

              docs = [("base", base)]
              for tab_id in tab_ids:
                  tab = fd._get_json(event_url, params={"_ak": fd.FANDUEL_PUBLIC_WEB_KEY, "eventId": eid, "tab": tab_id}, requester=None, timeout=15.0)
                  docs.append((f"tab:{tab_id}", tab))

              for label, doc in docs:
                  markets = fd._extract_markets(doc)
                  total_markets += len(markets)
                  stats = Counter()
                  samples = []
                  for market in markets:
                      stat = fd._market_stat(market)
                      if stat:
                          total_supported += 1
                          stats[stat] += 1
                      runners = fd._iter_mapping_or_list(market.get("runners"))
                      declared = fd._declares_player_market(market, runners)
                      if declared:
                          total_player_declared += 1
                      player_name = fd._market_player_name(market, runners, stat) if stat else ""
                      roster_match = bool(player_name and fd._name_key(player_name) in roster)
                      if stat and roster_match:
                          total_roster_match += 1
                      side_lines = [fd._runner_side_line(r) for r in runners]
                      sides = {item[0] for item in side_lines if item is not None}
                      if stat and roster_match and sides == {"over", "under"}:
                          total_two_side += 1
                      if stat and len(samples) < 12:
                          samples.append({
                              "market_id": market.get("marketId") or market.get("id"),
                              "market_name": market.get("marketName") or market.get("name"),
                              "market_type": market.get("marketType") or market.get("type"),
                              "market_status": market.get("marketStatus") or market.get("status"),
                              "stat": stat,
                              "declared_player": declared,
                              "player_name": player_name,
                              "roster_match": roster_match,
                              "runner_count": len(runners),
                              "runner_samples": [{
                                  "runner_name": r.get("runnerName") or r.get("name") or r.get("selectionName"),
                                  "result_type": r.get("resultType") or r.get("side"),
                                  "handicap": r.get("handicap") if r.get("handicap") is not None else r.get("line"),
                                  "player_name": r.get("playerName") or r.get("participantName") or r.get("player"),
                                  "status": r.get("runnerStatus") or r.get("status"),
                              } for r in runners[:2]],
                          })
                  print("FANDUEL_DOCUMENT_TRACE", json.dumps({
                      "event_id": eid,
                      "document": label,
                      "market_count": len(markets),
                      "supported_stat_counts": dict(stats),
                      "samples": samples,
                  }, sort_keys=True, default=str))

          print("FANDUEL_PARSE_TOTALS", json.dumps({
              "markets": total_markets,
              "supported_stat_markets": total_supported,
              "declared_player_markets": total_player_declared,
              "roster_matched_supported_markets": total_roster_match,
              "complete_two_side_candidates": total_two_side,
          }, sort_keys=True))

          try:
              result = fd.fetch_step11c_fanduel_provider_bridge(
                  season=2026,
                  slate_date=slate_date,
                  evaluated_at=now,
                  env=os.environ,
              )
          except Exception as exc:
              print("FANDUEL_FINAL_FAIL", json.dumps({"type": type(exc).__name__, "message": " ".join(str(exc).split())[:1000]}, sort_keys=True))
          else:
              attempts = (result.get("provider_refresh") or {}).get("attempts") or []
              payload = attempts[0].get("payload") if attempts else {}
              print("FANDUEL_FINAL_OK", json.dumps({"records": len((payload or {}).get("records") or [])}, sort_keys=True))
          PY
