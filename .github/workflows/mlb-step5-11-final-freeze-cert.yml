name: MLB Step5.11 final Step 5 freeze certification

on:
  push:
    branches:
      - mlb-step5-11-final-freeze-cert
    paths:
      - '.github/workflows/mlb-step5-11-final-freeze-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP5_11_BASE_SHA: b4df5a6562d909c3eca9eb45a65e4e17774648ac
  PRODUCTION_ODDS_URL: https://kyre-sports-api.onrender.com/api/v1/mlb/odds?max_events=30&fully_priced_only=true
  STREAMLIT_URL: https://kyre-sports-ai.streamlit.app

jobs:
  certify-final-step5-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused certification dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests

      - name: Assert certification-only change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP5_11_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if [ "$changed" != ".github/workflows/mlb-step5-11-final-freeze-cert.yml" ]; then
            echo "STEP5_11_RUNTIME_OR_SCOPE_DRIFT: $changed"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)wnba|WNBA' >/dev/null; then
            echo 'STEP5_11_WNBA_SCOPE_VIOLATION'
            exit 1
          fi
          echo 'MLB_STEP5_11_CERT_ONLY_SCOPE_OK'

      - name: Prove complete Step 5 runtime is frozen
        shell: bash
        run: |
          set -euo pipefail
          frozen_paths=(
            sports_api/mlb_official_game_id_join_v1.py
            sports_api/mlb_live_market_context_v1.py
            sports_api/mlb_market_probability_v1.py
            sports_api/mlb_model_market_edge_v1.py
            sports_api/mlb_price_discipline_v1.py
            sports_api/mlb_market_movement_v1.py
            sports_api/mlb_price_health_v1.py
            sports_api/mlb_actionability_shadow_v1.py
            sports_api/mlb_controlled_price_gate_v1.py
            sports_api/mlb_price_gate_canary_v1.py
            sports_api/mlb_streamlit_canary_control_v1.py
            mlb_daily_game_picks_live_market_context_v1.py
            mlb_daily_game_picks_market_probability_v1.py
            mlb_daily_game_picks_model_market_edge_v1.py
            mlb_daily_game_picks_price_discipline_v1.py
            mlb_daily_game_picks_market_movement_v1.py
            mlb_daily_game_picks_price_health_v1.py
            mlb_daily_game_picks_actionability_shadow_v1.py
            mlb_daily_game_picks_controlled_price_gate_v1.py
            mlb_daily_game_picks_price_gate_canary_v1.py
            mlb_daily_game_picks_price_gate_canary_streamlit_v1.py
            mlb_daily_game_picks_v217_guard.py
            mlb_daily_game_picks_v217.py
            app.py
          )
          for path in "${frozen_paths[@]}"; do
            test -f "$path" || { echo "STEP5_11_FROZEN_PATH_MISSING: $path"; exit 1; }
          done
          git diff --exit-code "$STEP5_11_BASE_SHA"...HEAD -- "${frozen_paths[@]}"
          echo 'MLB_STEP5_11_RUNTIME_BYTE_FREEZE_OK'

      - name: Assert final safety, rollback, and active-route contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ['STEP5_11_BASE_SHA']
          guard = Path('mlb_daily_game_picks_v217_guard.py').read_text(encoding='utf-8')
          step510 = Path('mlb_daily_game_picks_price_gate_canary_v1.py').read_text(encoding='utf-8')
          step510b = Path('mlb_daily_game_picks_price_gate_canary_streamlit_v1.py').read_text(encoding='utf-8')
          canary_core = Path('sports_api/mlb_price_gate_canary_v1.py').read_text(encoding='utf-8')
          session_core = Path('sports_api/mlb_streamlit_canary_control_v1.py').read_text(encoding='utf-8')
          combined = canary_core + '\n' + step510 + '\n' + session_core + '\n' + step510b + '\n' + guard

          required = (
              'MAX_CANARY_PERCENT = 25.0',
              'MLB_STEP5_10_CANARY_ENABLED',
              'MLB_STEP5_10_CANARY_PERCENT',
              'os.getenv(_CANARY_ENABLED_KEY, "0")',
              'os.getenv(_CANARY_PERCENT_KEY, "0")',
              'selected = base_selected',
              'exact_rollback_available',
              'unpriced_player_props_passthrough',
              'mlb_step5_10b_canary',
              'mlb_step5_10b_percent',
              'STREAMLIT_QUERY_SESSION',
              'DEFAULT_OFF',
              'host_env_precedence',
              'exact_query_rollback',
              'session_only',
              'install_streamlit_session_canary_layer(games_df)',
          )
          missing = [token for token in required if token not in combined]
          if missing:
              raise SystemExit('STEP5_11_FINAL_CONTRACT_TOKEN_MISSING: ' + ' | '.join(missing))

          if 'from mlb_daily_game_picks_price_gate_canary_streamlit_v1 import install_streamlit_session_canary_layer' not in guard:
              raise SystemExit('STEP5_11_ACTIVE_STEP5_10B_GUARD_IMPORT_MISSING')

          exact_id = Path('sports_api/mlb_official_game_id_join_v1.py').read_text(encoding='utf-8')
          for token in ('difflib', 'SequenceMatcher', 'fuzzywuzzy', 'rapidfuzz'):
              if token in exact_id:
                  raise SystemExit('STEP5_11_EXACT_ID_FUZZY_FALLBACK_PRESENT: ' + token)
          if '"fallback_matching_used": False' not in exact_id:
              raise SystemExit('STEP5_11_EXACT_ID_FALLBACK_CONTRACT_MISSING')

          step5_core_paths = (
              'sports_api/mlb_official_game_id_join_v1.py',
              'sports_api/mlb_live_market_context_v1.py',
              'sports_api/mlb_market_probability_v1.py',
              'sports_api/mlb_model_market_edge_v1.py',
              'sports_api/mlb_price_discipline_v1.py',
              'sports_api/mlb_market_movement_v1.py',
              'sports_api/mlb_price_health_v1.py',
              'sports_api/mlb_actionability_shadow_v1.py',
              'sports_api/mlb_controlled_price_gate_v1.py',
              'sports_api/mlb_price_gate_canary_v1.py',
              'sports_api/mlb_streamlit_canary_control_v1.py',
          )
          source = '\n'.join(Path(path).read_text(encoding='utf-8') for path in step5_core_paths)
          forbidden = ('sqlite3', 'psycopg', 'sqlalchemy', 'INSERT INTO', 'requests.post(')
          bad = [token for token in forbidden if token in source]
          if bad:
              raise SystemExit('STEP5_11_WRITE_OR_PERSISTENCE_PATH_PRESENT: ' + ' | '.join(bad))

          ancestor = subprocess.check_output(
              ['git', 'show', '6fb976a9e20c96eb68b71ad0d3511e3be1734292:app.py'],
              text=True,
          )
          route_required = (
              'old = "from mlb_daily_game_picks_v198 import render_daily_game_picks"',
              'new = "from mlb_daily_game_picks_v217_guard import render_daily_game_picks"',
          )
          route_missing = [token for token in route_required if token not in ancestor]
          if route_missing:
              raise SystemExit('STEP5_11_ACTIVE_ROUTE_ANCESTRY_DRIFT: ' + ' | '.join(route_missing))

          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          if changed != ['.github/workflows/mlb-step5-11-final-freeze-cert.yml']:
              raise SystemExit('STEP5_11_NOT_ZERO_RUNTIME_DELTA')

          print('MLB_STEP5_11_FINAL_SAFETY_AND_ROUTE_CONTRACTS_OK')
          PY

      - name: Run complete deterministic Step 5 regression chain
        run: |
          python -m pytest -q \
            tests/test_mlb_official_game_id_join_v1.py \
            tests/test_mlb_live_market_context_v1.py \
            tests/test_mlb_market_probability_v1.py \
            tests/test_mlb_model_market_edge_v1.py \
            tests/test_mlb_price_discipline_v1.py \
            tests/test_mlb_market_movement_v1.py \
            tests/test_mlb_price_health_v1.py \
            tests/test_mlb_actionability_shadow_v1.py \
            tests/test_mlb_controlled_price_gate_v1.py \
            tests/test_mlb_price_gate_canary_v1.py \
            tests/test_mlb_price_gate_canary_streamlit_v1.py

      - name: Certify live end-to-end Step 5 chain and Streamlit transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import time

          import requests

          from sports_api.mlb_official_game_id_join_v1 import join_model_games_to_markets
          from sports_api.mlb_live_market_context_v1 import attach_live_market_context
          from sports_api.mlb_market_probability_v1 import derive_market_probability_contexts
          from sports_api.mlb_model_market_edge_v1 import model_market_edge
          from sports_api.mlb_price_discipline_v1 import price_discipline_context
          from sports_api.mlb_market_movement_v1 import build_market_observation, compare_market_observations
          from sports_api.mlb_price_health_v1 import price_health_context
          from sports_api.mlb_actionability_shadow_v1 import actionability_shadow_context
          from sports_api.mlb_controlled_price_gate_v1 import controlled_price_gate
          from sports_api.mlb_price_gate_canary_v1 import MAX_CANARY_PERCENT, select_canary_game_ids
          from sports_api.mlb_streamlit_canary_control_v1 import resolve_streamlit_canary_config

          session = requests.Session()
          session.headers.update({'User-Agent': 'KyreSportsStep5-11FinalFreeze/1.0'})

          def fetch_json(url, label):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = session.get(url, timeout=45, allow_redirects=True, headers={'Accept': 'application/json'})
                      response.raise_for_status()
                      return int(response.status_code), response.json()
                  except Exception as exc:
                      last_error = exc
                      print(f'{label}_ATTEMPT_{attempt}_FAILED: {type(exc).__name__}: {exc}')
                      if attempt < 3:
                          time.sleep(4)
              raise SystemExit(f'{label}_FAILED: {last_error}')

          def fetch_text(url, label):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = session.get(url, timeout=45, allow_redirects=True, headers={'Accept': 'text/html,*/*'})
                      response.raise_for_status()
                      return int(response.status_code), response.text, response.url
                  except Exception as exc:
                      last_error = exc
                      print(f'{label}_ATTEMPT_{attempt}_FAILED: {type(exc).__name__}: {exc}')
                      if attempt < 3:
                          time.sleep(4)
              raise SystemExit(f'{label}_FAILED: {last_error}')

          status, payload = fetch_json(os.environ['PRODUCTION_ODDS_URL'], 'STEP5_11_ODDS_FETCH')
          if status != 200 or payload.get('source') != 'FanDuel':
              raise SystemExit('STEP5_11_BAD_PRODUCTION_SOURCE_OR_STATUS')
          if payload.get('data_type') != 'mlb_live_odds_api_response_v1' or payload.get('schema_version') != 1:
              raise SystemExit('STEP5_11_BAD_PRODUCTION_CONTRACT')
          if payload.get('transport') != 'anonymous_public_get_only':
              raise SystemExit('STEP5_11_BAD_PRODUCTION_TRANSPORT')
          collected_at = payload.get('collected_at_utc')
          games = payload.get('games') or []
          if not collected_at or not games:
              raise SystemExit('STEP5_11_EMPTY_CURRENT_SLATE')

          game_ids = [int(game['official_game_id']) for game in games]
          identity_rows = [{'game_pk': game_id} for game_id in reversed(game_ids)]

          step51 = join_model_games_to_markets(identity_rows, games)
          if step51.get('matched_count') != len(games) or step51.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_11_STEP5_1_EXACT_JOIN_FAILED')
          if step51.get('unmatched_model_game_ids') or step51.get('unmatched_market_game_ids'):
              raise SystemExit('STEP5_11_STEP5_1_UNMATCHED_IDS')

          step52 = attach_live_market_context(identity_rows, games)
          step53 = derive_market_probability_contexts(step52)
          if step52.get('attached_count') != len(games) or step53.get('derived_context_count') != len(games):
              raise SystemExit('STEP5_11_STEP5_2_3_COUNT_MISMATCH')
          if step53.get('fallback_matching_used') is not False:
              raise SystemExit('STEP5_11_STEP5_3_FALLBACK_USED')

          cohort = select_canary_game_ids(game_ids, enabled=True, requested_percent=25)
          over_cap = select_canary_game_ids(game_ids, enabled=True, requested_percent=100)
          rollback = select_canary_game_ids(game_ids, enabled=False, requested_percent=25)
          expected_games = int(math.floor(len(set(game_ids)) * MAX_CANARY_PERCENT / 100.0))
          if cohort['selected_game_count'] != expected_games or cohort['realized_percent'] > MAX_CANARY_PERCENT + 1e-12:
              raise SystemExit('STEP5_11_CANARY_BOUND_FAILED')
          if over_cap['selected_game_ids'] != cohort['selected_game_ids']:
              raise SystemExit('STEP5_11_ABOVE_CAP_CHANGED_COHORT')
          if rollback['selected_game_ids']:
              raise SystemExit('STEP5_11_CANARY_ROLLBACK_NOT_EMPTY')
          selected_games = set(cohort['selected_game_ids'])

          base_config = {
              'enabled': False,
              'requested_percent': 0.0,
              'config_valid': True,
              'production_default_enabled': False,
              'production_default_percent': 0.0,
          }
          session_armed = resolve_streamlit_canary_config(
              base_config,
              host_env_present=False,
              query_enabled_value='1',
              query_percent_value='25',
          )
          session_rollback = resolve_streamlit_canary_config(base_config, host_env_present=False)
          host_base = dict(base_config)
          host_base.update({'enabled': True, 'requested_percent': 10.0})
          host_control = resolve_streamlit_canary_config(
              host_base,
              host_env_present=True,
              query_enabled_value='1',
              query_percent_value='25',
          )
          if session_armed['control_source'] != 'STREAMLIT_QUERY_SESSION' or session_armed['requested_percent'] != 25.0:
              raise SystemExit('STEP5_11_SESSION_CANARY_CONTROL_FAILED')
          if session_rollback['enabled'] is not False or session_rollback['requested_percent'] != 0.0:
              raise SystemExit('STEP5_11_SESSION_QUERY_ROLLBACK_FAILED')
          if host_control['control_source'] != 'HOST_ENV' or host_control['requested_percent'] != 10.0:
              raise SystemExit('STEP5_11_HOST_PRECEDENCE_FAILED')

          checks = 0
          line_bearing = 0
          shadow_playable = 0
          shadow_nonplayable = 0
          enrolled_checks = 0
          enrolled_allow = 0
          enrolled_block = 0
          nonenrolled_passthrough = 0
          rollback_passthrough = 0

          for game in games:
              game_id = int(game['official_game_id'])
              context = (step53.get('contexts_by_game_id') or {}).get(game_id)
              if not context:
                  raise SystemExit(f'STEP5_11_MISSING_CONTEXT_{game_id}')
              away = str(game.get('away_team') or f'AWAY_{game_id}')
              home = str(game.get('home_team') or f'HOME_{game_id}')
              scenarios = [
                  ('Moneyline', 'Away', context['moneyline']['away']),
                  ('Moneyline', 'Home', context['moneyline']['home']),
                  ('Run Line', 'Away', context['run_line']['away']),
                  ('Run Line', 'Home', context['run_line']['home']),
                  ('Total', 'Over ' + str(context['total'].get('line')), context['total']['over']),
                  ('Total', 'Under ' + str(context['total'].get('line')), context['total']['under']),
              ]
              for market, side_text, side_block in scenarios:
                  no_vig = float(side_block['no_vig_probability'])
                  model_p = min(0.90, max(0.10, no_vig + 0.02))
                  candidate = {
                      'game_pk': game_id,
                      'market': market,
                      'probability': model_p,
                      'side': side_text,
                      'name': None,
                      'team': None,
                  }
                  edge = model_market_edge(candidate, context, away_team=away, home_team=home)
                  price = price_discipline_context(edge)
                  observation = build_market_observation(price, collected_at_utc=collected_at)
                  movement = compare_market_observations(observation, as_of_utc=observation['collected_at_utc'])
                  health = price_health_context(movement)
                  shadow = actionability_shadow_context(health)

                  if shadow['shadow_status'].startswith('SHADOW_PLAYABLE'):
                      shadow_playable += 1
                  else:
                      shadow_nonplayable += 1

                  gate_off = controlled_price_gate(shadow, activation_requested=False)
                  if gate_off['gate_status'] != 'CONTROL_DISABLED' or gate_off['final_card_price_eligible'] is not True:
                      raise SystemExit(f'STEP5_11_ROLLBACK_CHANGED_{game_id}_{market}')
                  rollback_passthrough += 1

                  enrolled = game_id in selected_games
                  gate = controlled_price_gate(shadow, activation_requested=enrolled)
                  if enrolled:
                      enrolled_checks += 1
                      if shadow['shadow_status'].startswith('SHADOW_PLAYABLE'):
                          if gate['gate_status'] != 'GATE_ALLOW' or gate['final_card_price_eligible'] is not True:
                              raise SystemExit(f'STEP5_11_ALLOW_MISMATCH_{game_id}_{market}')
                          enrolled_allow += 1
                      else:
                          if gate['gate_status'] != 'GATE_BLOCK' or gate['final_card_price_eligible'] is not False:
                              raise SystemExit(f'STEP5_11_BLOCK_MISMATCH_{game_id}_{market}')
                          enrolled_block += 1
                  else:
                      if gate['gate_status'] != 'CONTROL_DISABLED' or gate['final_card_price_eligible'] is not True:
                          raise SystemExit(f'STEP5_11_NONENROLLED_CHANGED_{game_id}_{market}')
                      nonenrolled_passthrough += 1

                  for flag in ('model_math_impact', 'pick_strength_impact', 'ranking_math_impact', 'risk_logic_impact', 'wagering_impact'):
                      if gate.get(flag) is not False:
                          raise SystemExit(f'STEP5_11_PROTECTED_IMPACT_DRIFT_{flag}_{game_id}_{market}')
                  if gate.get('durable_persistence') is not False:
                      raise SystemExit(f'STEP5_11_PERSISTENCE_DRIFT_{game_id}_{market}')

                  checks += 1
                  if market in {'Run Line', 'Total'}:
                      line_bearing += 1

          expected_checks = len(games) * 6
          if checks != expected_checks or rollback_passthrough != expected_checks:
              raise SystemExit('STEP5_11_LIVE_CHAIN_COVERAGE_MISMATCH')
          if line_bearing != len(games) * 4:
              raise SystemExit('STEP5_11_LINE_BEARING_COVERAGE_MISMATCH')
          if enrolled_checks != cohort['selected_game_count'] * 6:
              raise SystemExit('STEP5_11_CANARY_ATOMICITY_MISMATCH')
          if enrolled_allow + enrolled_block != enrolled_checks:
              raise SystemExit('STEP5_11_CANARY_POLICY_PARTITION_MISMATCH')
          if nonenrolled_passthrough + enrolled_checks != expected_checks:
              raise SystemExit('STEP5_11_CANARY_COHORT_PARTITION_MISMATCH')
          if shadow_playable + shadow_nonplayable != expected_checks:
              raise SystemExit('STEP5_11_SHADOW_PARTITION_MISMATCH')

          streamlit = os.environ['STREAMLIT_URL'].rstrip('/')
          root_status, root, root_url = fetch_text(streamlit + '/', 'STEP5_11_STREAMLIT_ROOT')
          canary_status, canary_root, canary_url = fetch_text(
              streamlit + '/?mlb_step5_10b_canary=1&mlb_step5_10b_percent=25',
              'STEP5_11_STREAMLIT_CANARY_ROOT',
          )
          rollback_status, rollback_root, rollback_url = fetch_text(streamlit + '/', 'STEP5_11_STREAMLIT_ROLLBACK_ROOT')
          app_status_http, app_status = fetch_json(streamlit + '/api/v2/app/status', 'STEP5_11_STREAMLIT_APP_STATUS')
          if any(code != 200 for code in (root_status, canary_status, rollback_status, app_status_http)):
              raise SystemExit('STEP5_11_STREAMLIT_TRANSPORT_NOT_200')
          if '<html' not in root.lower() or '<html' not in canary_root.lower() or '<html' not in rollback_root.lower():
              raise SystemExit('STEP5_11_STREAMLIT_ROOT_NOT_HTML')
          if 'mlb_step5_10b_canary=1' not in canary_url or 'mlb_step5_10b_percent=25' not in canary_url:
              raise SystemExit('STEP5_11_STREAMLIT_CANARY_QUERY_NOT_PRESERVED')

          evidence = {
              'certification_result': 'GREEN',
              'base_main_sha': os.environ['STEP5_11_BASE_SHA'],
              'production_http_status': status,
              'production_game_count': len(games),
              'source': payload.get('source'),
              'collected_at_utc': collected_at,
              'step5_1_exact_join_matched_count': step51.get('matched_count'),
              'step5_2_attached_count': step52.get('attached_count'),
              'step5_3_derived_context_count': step53.get('derived_context_count'),
              'step5_4_through_5_9_live_observations_verified': checks,
              'line_bearing_checks_verified': line_bearing,
              'shadow_playable_count': shadow_playable,
              'shadow_nonplayable_count': shadow_nonplayable,
              'canary_game_count': cohort['selected_game_count'],
              'canary_realized_percent': cohort['realized_percent'],
              'canary_enrolled_checks': enrolled_checks,
              'canary_allow_count': enrolled_allow,
              'canary_block_count': enrolled_block,
              'nonenrolled_passthrough_verified': nonenrolled_passthrough,
              'rollback_passthrough_verified': rollback_passthrough,
              'max_canary_percent': MAX_CANARY_PERCENT,
              'step5_10b_session_control_source': session_armed['control_source'],
              'step5_10b_query_removed_enabled': session_rollback['enabled'],
              'step5_10b_query_removed_percent': session_rollback['requested_percent'],
              'step5_10b_host_precedence_verified': True,
              'streamlit_root_http_status': root_status,
              'streamlit_canary_http_status': canary_status,
              'streamlit_rollback_http_status': rollback_status,
              'streamlit_app_status_http_status': app_status_http,
              'streamlit_version': app_status.get('streamlitVersion'),
              'streamlit_transport_verified': True,
              'rendered_streamlit_ui_verified': False,
              'zero_runtime_code_delta': True,
              'production_default_canary_enabled': False,
              'production_default_canary_percent': 0.0,
              'model_math_changed': False,
              'pick_strength_changed': False,
              'ranking_math_changed': False,
              'risk_logic_changed': False,
              'durable_persistence_added': False,
              'wagering_changed': False,
              'wnba_changed': False,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print('MLB_STEP5_11_FINAL_STEP5_FREEZE_GREEN')
          PY
