name: NFL Prop Analytics Page 3 Visual V2 Step 3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-visual-v2-step3-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-page3-visual-v2-step3-stat-ribbon-v1.json"
      - "nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py"
      - "nfl_prop_analytics_prop_page_v1.py"
      - "tests/test_nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page3-visual-v2-step3-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-page3-visual-v2-step3-stat-ribbon-v1.json"
      - "nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py"
      - "nfl_prop_analytics_prop_page_v1.py"
      - "tests/test_nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-page3-visual-v2-step3-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Visual V2 Step 3 scope and frozen Step 2
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page3-visual-v2-step3-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-page3-visual-v2-step3-stat-ribbon-v1.json' \
            'nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py' \
            'nfl_prop_analytics_prop_page_v1.py' \
            'tests/test_nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py' | sort)"
          test "$actual" = "$expected" || {
            echo "VISUAL_V2_STEP3_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "VISUAL_V2_STEP3_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob devsystem/contracts/nfl-prop-page3-visual-composition-v2-contract-v1.json 9819289fd34d53008df8656d9244319e025b27c4
          check_blob nfl_prop_analytics_page3_visual_v2_step2_hero_v1.py 907ab1094d6e4441a569c055f753fc9539d40b79

          echo "VISUAL_V2_STEP3_SCOPE_GREEN"
          echo "VISUAL_V2_STEP2_FROZEN_PROTECTION_GREEN"

      - name: Static contract
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          PYTHONPATH=. python -m py_compile \
            nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py \
            nfl_prop_analytics_prop_page_v1.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_nfl_prop_analytics_page3_visual_v2_step2_hero_v1.py \
            tests/test_nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1.py
          echo "VISUAL_V2_STEP3_STATIC_GREEN"

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser stack and start isolated composition harness
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          cat > .v2_step3_harness.py <<'PY'
          import streamlit as st
          from nfl_prop_analytics_page3_visual_v2_step2_hero_v1 import render_visual_v2_hero
          from nfl_prop_analytics_page3_visual_v2_step3_stat_ribbon_v1 import render_visual_v2_stat_ribbon

          st.set_page_config(layout="wide")
          render_visual_v2_hero(
              player_team="LAR",
              player_team_name="Rams",
              player_logo="https://a.espncdn.com/i/teamlogos/nfl/500/lar.png",
              opponent="DEN",
              opponent_name="Broncos",
              opponent_logo="https://a.espncdn.com/i/teamlogos/nfl/500/den.png",
              player_name="Matthew Stafford",
              position="QB",
              market_label="Passing Yards",
              headshot="https://a.espncdn.com/i/headshots/nfl/players/full/12483.png",
              depth_role="QB1 • STARTER",
              player_id="12483",
              gate_state="OPEN",
              display_date="SUN • SEP 27",
              kickoff="8:20 PM ET",
              network="NBC",
              venue="Empower Field at Mile High",
          )
          ribbon_slot = st.empty()
          st.markdown(
              '<section class="ks-pa3-hero" data-prop-page3-step1-hero="v1">Frozen V1 hero</section>',
              unsafe_allow_html=True,
          )
          st.markdown(
              '<section data-harness-analysis-settings="v1" style="height:100px">Frozen controls placeholder</section>',
              unsafe_allow_html=True,
          )
          render_visual_v2_stat_ribbon(
              summary={
                  "ready": True,
                  "sample_size": 10,
                  "average": 267.4,
                  "median": 271.0,
                  "high": 389,
                  "low": 181,
                  "hit_rate_pct": 70.0,
                  "hit_count": 7,
                  "hit_rate_state": "ready",
              },
              market_label="Passing Yards",
              history_label="L10",
              source_note="ESPN exact-ID completed game books",
              available=True,
              target=ribbon_slot,
          )
          st.markdown(
              '<section class="ks-pa3-stats" data-prop-page3-step3-stats="v1">Frozen V1 stats</section>',
              unsafe_allow_html=True,
          )
          PY
          nohup python -m streamlit run .v2_step3_harness.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 >/tmp/v2-step3.log 2>&1 &

      - name: Prove five-card stat ribbon composition
        run: |
          python - <<'PY'
          import time
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("VISUAL_V2_STEP3_LOCAL_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count():
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("VISUAL_V2_STEP3_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              context=browser.new_context(viewport={"width":1080,"height":1440})
              page=context.new_page()
              page.goto(base,wait_until="domcontentloaded",timeout=120000)

              frame,hero=find(page,'[data-page3-visual-v2-step2="v1"]')
              _,ribbon=find(page,'[data-page3-visual-v2-step3="v1"][data-page3-visual-v2-step3-real-composition="true"]')
              _,controls=find(page,'[data-harness-analysis-settings="v1"]')
              _,old=find(page,'[data-prop-page3-step3-stats="v1"]')

              assert ribbon.get_attribute("data-page3-visual-v2-step3-state")=="ready"
              cards=ribbon.locator('[data-v2-stat-card]')
              assert cards.count()==5,cards.count()
              assert old.evaluate("e=>getComputedStyle(e).display")=="none"

              hb=hero.bounding_box()
              rb=ribbon.bounding_box()
              cb=controls.bounding_box()
              assert hb["y"]+hb["height"] <= rb["y"]+8,(hb,rb)
              assert rb["y"]+rb["height"] <= cb["y"]+8,(rb,cb)

              widths=[cards.nth(i).bounding_box()["width"] for i in range(5)]
              assert max(widths)-min(widths)<=2,widths
              assert rb["height"]>=80,rb
              print("VISUAL_V2_STEP3_BRANCH_COMPOSITION_GREEN")
              print("VISUAL_V2_STEP2_BRANCH_FROZEN_GREEN")

              for width in (390,768,1440):
                  page.set_viewport_size({"width":width,"height":1100})
                  page.wait_for_timeout(350)
                  dims=frame.evaluate("()=>({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})")
                  assert max(dims["d"],dims["b"])<=dims["i"]+2,(width,dims)
                  print(f"VISUAL_V2_STEP3_BRANCH_{width}_GREEN")

              print("VISUAL_V2_STEP3_BRANCH_GREEN")
              context.close()
              browser.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove public stat ribbon and freeze
        run: |
          python - <<'PY'
          import re
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=300):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count():
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(300)
              raise RuntimeError("VISUAL_V2_STEP3_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def role(page,kind,name,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.get_by_role(kind,name=name,exact=True)
                          if loc.count():
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError(f"VISUAL_V2_STEP3_PUBLIC_ROLE_NOT_READY:{kind}:{name}")

          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox","--disable-gpu","--disable-dev-shm-usage"],
              )
              context=browser.new_context(viewport={"width":1080,"height":1440})
              page=context.new_page()
              page.goto(
                  base+"/?"+urlencode({
                      "ks_jump_sport":"NFL",
                      "ks_jump_market":"Prop Analytics",
                  }),
                  wait_until="domcontentloaded",
                  timeout=120000,
              )

              _,open_matchup=role(page,"button","Open matchup",240)
              open_matchup.click(timeout=10000)
              roster_frame,_=find(
                  page,
                  '[data-nfl-prop-analytics-page2-unified-roster="v1"]',
                  240,
              )
              qb=roster_frame.get_by_role(
                  "button",
                  name=re.compile(r"^[A-Z]{2,3} • QB • "),
              ).first
              assert qb.count()==1
              qb.click(timeout=10000)

              _,open_prop=role(page,"button","Open prop page",120)
              open_prop.click(timeout=10000)

              frame,hero=find(page,'[data-page3-visual-v2-step2="v1"]',300)
              _,ribbon=find(
                  page,
                  '[data-page3-visual-v2-step3="v1"][data-page3-visual-v2-step3-real-composition="true"]',
                  300,
              )
              _,old=find(page,'[data-prop-page3-step3-stats="v1"]',240)

              cards=ribbon.locator('[data-v2-stat-card]')
              assert cards.count()==5,cards.count()
              assert old.evaluate("e=>getComputedStyle(e).display")=="none"
              state=ribbon.get_attribute("data-page3-visual-v2-step3-state")
              assert state in ("ready","unavailable"),state
              if state=="ready":
                  assert int(ribbon.get_attribute("data-page3-visual-v2-step3-sample") or 0)>0
                  assert ribbon.get_attribute("data-page3-visual-v2-step3-average") not in ("","—")

              hb=hero.bounding_box()
              rb=ribbon.bounding_box()
              assert hb["y"]+hb["height"] <= rb["y"]+8,(hb,rb)
              print("VISUAL_V2_STEP3_PUBLIC_COMPOSITION_GREEN")
              print("VISUAL_V2_STEP2_PUBLIC_FROZEN_GREEN")
              print("VISUAL_V2_STEP3_PUBLIC_STATE",state)

              for width in (390,768,1440):
                  page.set_viewport_size({"width":width,"height":1100})
                  page.wait_for_timeout(400)
                  dims=frame.evaluate("()=>({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth})")
                  assert max(dims["d"],dims["b"])<=dims["i"]+2,(width,dims)
                  print(f"VISUAL_V2_STEP3_PUBLIC_{width}_GREEN")

              print("VISUAL_V2_STEP3_PUBLIC_GREEN")
              print("VISUAL_V2_STEP3_GREEN")
              print("VISUAL_V2_STEP3_FROZEN")
              context.close()
              browser.close()
          PY
