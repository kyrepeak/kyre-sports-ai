name: CFB O/U multi-source logo hotfix V4

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-ou-multisource-logo-hotfix-v4']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive V4 scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-multisource-logo-hotfix-v4'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-multisource-logo-hotfix-v4.yml' \
            'app.py' \
            'cfb_over_under_logo_resolver_v2.py' \
            'cfb_over_under_matchup_ui_v3_logo_hotfix_v4.py' \
            'streamlit_memory_lazy_router_v43.py' \
            'tests/test_cfb_over_under_multisource_logo_hotfix_v4.py' \
            'tests/test_cfb_over_under_multisource_logo_resolver_v2.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U multi-source logo V4 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_MULTISOURCE_LOGO_V4_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_freeze_manifest_v12.json") != "3ff2a727967e80dddbe03f747d9f32090cc39539":
              failures.append("CFB Step-12 freeze manifest changed")

          manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 through 3 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v3.json") != "7c3408833b931fbb9d2e41e6660ebdf4f975f723":
              failures.append("O/U Upgrade Step 3 freeze manifest changed")

          manifest = json.loads(pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen upgrade path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_3_FROZEN=PASS")
          PY

      - name: Enforce logo hotfix V1 through V3 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_logo_hotfix_freeze_manifest_v3.json") != "f07c05ac5947ca5a6e23ae5633545e8f1fbe1724":
              failures.append("logo hotfix V3 freeze manifest changed")

          manifest = json.loads(pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v3.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo-hotfix path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen logo-hotfix V1-V3 path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_V3_FROZEN=PASS")
          PY

      - name: Compile V4
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_logo_resolver_v2.py \
            cfb_over_under_matchup_ui_v3_logo_hotfix_v4.py \
            streamlit_memory_lazy_router_v43.py \
            tests/test_cfb_over_under_multisource_logo_resolver_v2.py \
            tests/test_cfb_over_under_multisource_logo_hotfix_v4.py
          PYTHONPATH=. python -c "import cfb_over_under_logo_resolver_v2; import cfb_over_under_matchup_ui_v3_logo_hotfix_v4; import streamlit_memory_lazy_router_v43"

      - name: Run V4 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_multisource_logo_resolver_v2.py \
            tests/test_cfb_over_under_multisource_logo_hotfix_v4.py \
            tests/test_cfb_over_under_logo_recursion_hotfix_v3.py \
            tests/test_cfb_over_under_logo_hotfix_v2.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_streamlit_memory_lazy_router_v39.py

      - name: Live non-ESPN fallback for Florida A&M and Miami
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_logo_resolver_v2 as logos

          original = logos.espn.resolve_visuals
          logos.espn.resolve_visuals = lambda game: {"away": {}, "home": {}}
          try:
              game = {
                  "game_date": "2026-09-10",
                  "away_team": "Florida A&M",
                  "away_team_slug": "florida-a-m",
                  "away_conference": "SWAC",
                  "home_team": "Miami (FL)",
                  "home_team_slug": "miami-fl",
                  "home_conference": "ACC",
                  "identity_key": "ncaa:6604311",
                  "espn_event_id": "",
              }
              visuals = logos.resolve_visuals(game)
          finally:
              logos.espn.resolve_visuals = original

          for side in ("away", "home"):
              item = visuals.get(side) or {}
              print(side, item.get("logo_provider"), item.get("source"), item.get("logo"))
              if not str(item.get("logo") or "").startswith(("http://", "https://")):
                  raise SystemExit(f"non-ESPN logo fallback missing for {side}: {item}")
              if item.get("logo_provider") == "espn":
                  raise SystemExit(f"non-ESPN certification unexpectedly used ESPN: {item}")

          print("LIVE_NON_ESPN_FAMU_MIAMI_LOGOS=PASS")
          PY

      - name: Live multi-source coverage sample across FBS and FCS
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_logo_resolver_v2 as logos

          sample = [
              ("Alabama", "alabama", "SEC"),
              ("Oregon", "oregon", "Big Ten"),
              ("Notre Dame", "notre-dame", "FBS"),
              ("North Dakota State", "north-dakota-state", "MVFC"),
              ("Harvard", "harvard", "Ivy"),
              ("Florida A&M", "florida-a-m", "SWAC"),
          ]

          failures = []
          for name, slug, conference in sample:
              item = logos.resolve_team_logo(name, slug, conference)
              print(name, item.get("logo_provider"), item.get("source"), item.get("logo"))
              if not str(item.get("logo") or "").startswith(("http://", "https://")):
                  failures.append(name)

          if failures:
              raise SystemExit(f"multi-source coverage sample failed: {failures}")
          print("LIVE_MULTISOURCE_FBS_FCS_SAMPLE=PASS")
          PY

      - name: Prove provider chain and model firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path("cfb_over_under_logo_resolver_v2.py").read_text(encoding="utf-8")
          ui = Path("cfb_over_under_matchup_ui_v3_logo_hotfix_v4.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v43.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = resolver + "\n" + ui + "\n" + router + "\n" + app

          required = [
              'FROZEN_ESPN_RESOLVER = "cfb_over_under_logo_resolver_v1"',
              'WIKIPEDIA_API = "https://en.wikipedia.org/w/api.php"',
              'COMMONS_API = "https://commons.wikimedia.org/w/api.php"',
              '"logo_provider": "official_athletics"',
              '"logo_provider": "wikipedia_pageimage"',
              '"logo_provider": "wikimedia_commons"',
              'FROZEN_HOTFIX = "cfb_over_under_matchup_ui_v3_logo_hotfix_v3"',
              'root._import("cfb_over_under_matchup_ui_v3_logo_hotfix_v4")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v42"',
              'from streamlit_memory_lazy_router_v43 import render_app',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing V4 multi-source marker: {token}")

          forbidden = [
              "projected_total =",
              "over_probability =",
              "under_probability =",
              "selection_probability =",
              "rank_slate(",
              "expected_value",
              "np.random",
              "import random",
          ]
          lower = (resolver + "\n" + ui).lower()
          for token in forbidden:
              if token.lower() in lower:
                  raise SystemExit(f"V4 logo layer crossed model firewall: {token}")

          print("CFB_OU_MULTISOURCE_LOGO_V4_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_MULTISOURCE_LOGO_HOTFIX_V4_GREEN"
