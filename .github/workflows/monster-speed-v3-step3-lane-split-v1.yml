name: Monster Speed V3 Step 3 Lane Split

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-speed-v3-step3-lane-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove fast PR / full merge split
        run: |
          python devsystem/monster_speed_v3_step3_lane_split_v1.py
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_monster_speed_v3_step3_lane_split_v1.py tests/test_devsystem_workflow_parallelism_v1.py
      - name: Freeze tokens
        run: |
          echo "MONSTER_SPEED_V3_STEP3_GREEN"
          echo "MONSTER_SPEED_V3_STEP3_FROZEN_GREEN"
