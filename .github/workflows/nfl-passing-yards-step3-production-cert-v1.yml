name: NFL Passing Yards Step 3 Production Cert

on:
  push:
    branches:
      - "monster/nfl-passing-step3-production-cert-v1"
    paths:
      - "devsystem/nfl_passing_yards_step3_production_cert_v1.py"
      - ".github/workflows/nfl-passing-yards-step3-production-cert-v1.yml"

permissions:
  contents: read

concurrency:
  group: nfl-passing-step3-production-cert-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove all 14 Passing Yards games in public production
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/devsystem
        run: |
          python devsystem/nfl_passing_yards_step3_production_cert_v1.py
      - name: Upload Step 3 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-passing-step3-production-${{ github.run_id }}
          path: artifacts/nfl-passing-step3
          if-no-files-found: warn
          retention-days: 14
