        with:
          path: .venv-cfb-critical
          key: devsystem-cfb-venv-${{ runner.os }}-py${{ steps.cfb-python.outputs.python-version }}-${{ hashFiles('devsystem/root_requirements_fingerprint_v1.txt', 'devsystem/sport_cache_epoch_v1.txt') }}
      - name: Build CFB critical virtualenv on cache miss
        if: steps.cfb-venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-cfb-critical
          .venv-cfb-critical/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-cfb-critical/bin/python -m pip install --disable-pip-version-check -q pytest
      - name: Activate CFB critical virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-cfb-critical/bin" >> "$GITHUB_PATH"
      - name: Run current CFB critical path
        run: |
          python -m pytest -q \
            tests/test_cfb_schedule_v6_runtime_snapshot.py \
            tests/test_cfb_over_under_market_adapter_v1.py \
