name: DevSystem targeted CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - devsystem-step2-targeted-ci
      - devsystem-step3-regression-shield
      - devsystem-step4-browser-qa
      - devsystem-step5-production-verification
      - devsystem-step6-permanent-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsystem-targeted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      cfb: ${{ steps.changed.outputs.cfb }}
      mlb: ${{ steps.changed.outputs.mlb }}
      wnba: ${{ steps.changed.outputs.wnba }}
      nfl: ${{ steps.changed.outputs.nfl }}
      nba: ${{ steps.changed.outputs.nba }}
      nhl: ${{ steps.changed.outputs.nhl }}
      soccer: ${{ steps.changed.outputs.soccer }}
      core: ${{ steps.changed.outputs.core }}
      ui: ${{ steps.changed.outputs.ui }}
      api: ${{ steps.changed.outputs.api }}
      data: ${{ steps.changed.outputs.data }}
      model: ${{ steps.changed.outputs.model }}
      infra: ${{ steps.changed.outputs.infra }}
      unprotected_domains: ${{ steps.changed.outputs.unprotected_domains }}
      risk_tier: ${{ steps.changed.outputs.risk_tier }}
      changed_count: ${{ steps.changed.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Classify changed paths with permanent DevSystem registry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python devsystem/change_classifier_v1.py \
              --manual \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          fi

          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          python devsystem/change_classifier_v1.py \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

  workflow-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove legacy PR fan-out is quarantined
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("devsystem/legacy_broad_pr_workflows_2026-09-09.txt")
          paths = [
              line.strip()
              for line in manifest.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          failures = []
          for item in paths:
              text = Path(item).read_text(encoding="utf-8")
              if re.search(r"(?m)^  pull_request\s*:", text):
                  failures.append(item)
              if not re.search(r"(?m)^  (workflow_dispatch|push|schedule)\s*:", text):
                  failures.append(item + " [no retained trigger]")
          if failures:
              print("LEGACY_PR_FANOUT_STILL_ACTIVE")
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"DEVSYSTEM_WORKFLOW_HYGIENE_GREEN quarantined={len(paths)}")
          PY

  permanent-contract:
    needs: [classify, workflow-hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed for sport domains without a dedicated test lane
        env:
          UNPROTECTED: ${{ needs.classify.outputs.unprotected_domains }}
        run: |
          if [ -n "$UNPROTECTED" ]; then
            echo "DEVSYSTEM_UNPROTECTED_DOMAIN_BLOCKED: $UNPROTECTED"
            echo "Activate its manifest entry + dedicated critical tests before changing it."
            exit 1
          fi
      - name: Validate permanent DevSystem contract
        run: python devsystem/permanent_gate_v1.py
      - name: Self-test classifier and final gate
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_devsystem_change_classifier_v1.py \
            tests/test_devsystem_permanent_gate_v1.py

  regression-shield:
    needs: [classify, workflow-hygiene, permanent-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-light invariant shield
        run: python devsystem/regression_shield_v1.py
      - name: Self-test regression shield
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_regression_shield_v1.py

  browser-qa:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: >-
      needs.classify.outputs.ui == 'true' ||
      needs.classify.outputs.cfb == 'true' ||
      needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore browser QA virtualenv
        id: browser-venv-cache
        uses: actions/cache@v4
        with:
          path: .venv-browser-qa
          key: devsystem-browser-venv-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser QA virtualenv on cache miss
        if: steps.browser-venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q pytest requests playwright

      - name: Activate browser QA virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Resolve Playwright cache identity
        id: playwright-meta
        shell: bash
        run: |
          version="$(.venv-browser-qa/bin/python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DEVSYSTEM_PLAYWRIGHT_VERSION=$version"

      - name: Restore Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: devsystem-playwright-${{ runner.os }}-${{ steps.playwright-meta.outputs.version }}-${{ hashFiles('devsystem/browser_cache_epoch_v1.txt') }}

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Verify Chromium can launch
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content('<title>DevSystem Browser Cache</title>')
              assert page.title() == 'DevSystem Browser Cache'
              browser.close()
          print('DEVSYSTEM_BROWSER_RUNTIME_GREEN')
          PY

      - name: Self-test browser QA and cache contracts
        run: |
          python -m pytest -q \
            tests/test_devsystem_browser_qa_v1.py \
            tests/test_devsystem_browser_cache_v1.py
      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-qa
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/browser-qa/streamlit.log 2>&1 &
          echo $! > /tmp/devsystem_streamlit_pid
      - name: Drive the real Streamlit UI with Playwright
        run: |
          python devsystem/browser_qa_v1.py \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/browser-qa
      - name: Print Streamlit log on browser failure
        if: failure()
        run: tail -n 500 artifacts/browser-qa/streamlit.log || true
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsystem-browser-qa-${{ github.run_id }}
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/devsystem_streamlit_pid ]; then
            kill "$(cat /tmp/devsystem_streamlit_pid)" 2>/dev/null || true
          fi

  cfb-critical:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: needs.classify.outputs.cfb == 'true' || needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CFB test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Run current CFB critical path
        run: |
          python -m pytest -q \
            tests/test_cfb_schedule_v6_runtime_snapshot.py \
            tests/test_cfb_over_under_market_adapter_v1.py \
            tests/test_cfb_over_under_market_adapter_v2.py \
            tests/test_cfb_over_under_market_intelligence_v1.py \
            tests/test_cfb_over_under_clean_page_v18.py \
            tests/test_cfb_over_under_clean_page_v19.py \
            tests/test_cfb_over_under_router_v58.py \
            tests/test_cfb_over_under_router_v59.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_cfb_over_under_upgrade_step9_environment_engine.py \
            tests/test_cfb_over_under_upgrade_step9_slate.py \
            tests/test_cfb_over_under_readable_step9_v1.py \
            tests/test_cfb_over_under_router_v66.py \
            tests/test_cfb_over_under_upgrade_step10_history_engine.py \
            tests/test_cfb_over_under_upgrade_step10_slate.py \
            tests/test_cfb_over_under_readable_step10_v1.py \
            tests/test_cfb_over_under_router_v67.py \
            tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py \
            tests/test_cfb_over_under_upgrade_step11_slate.py \
            tests/test_cfb_over_under_readable_step11_v1.py \
            tests/test_cfb_over_under_router_v68.py \
            tests/test_cfb_over_under_upgrade_step12_certification.py \
            tests/test_cfb_over_under_upgrade_step12_slate.py \
            tests/test_cfb_over_under_readable_step12_v1.py \
            tests/test_cfb_over_under_router_v69.py \
            tests/test_cfb_step3_team_data_foundation.py

  mlb-critical:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: needs.classify.outputs.mlb == 'true' || needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MLB test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          if [ -f sports_api/requirements.txt ]; then python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt; fi
          python -m pip install --disable-pip-version-check -q pytest
      - name: Run current MLB critical path
        run: |
          python -m pytest -q \
            tests/test_mlb_step20a_end_to_end_certification_v1.py \
            tests/test_mlb_step20b_production_release_certification_v1.py \
            tests/test_mlb_step9g_postfreeze_handoff_v1.py \
            tests/test_mlb_step8d_player_hits_integration_v1.py

  wnba-critical:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: needs.classify.outputs.wnba == 'true' || needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install WNBA test dependencies
        run: |
          if [ -f sports_api/requirements.txt ]; then python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt; fi
          python -m pip install --disable-pip-version-check -q pytest
      - name: Run current WNBA critical path
        run: |
          python -m pytest -q \
            tests/test_wnba_step20b_runtime_acceleration.py \
            tests/test_wnba_step20b_monte_carlo_acceleration.py \
            tests/test_wnba_step20b_step2_exact_reuse_timing.py

  core-smoke:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile shared entry points
        run: python -m py_compile app.py

  devsystem-final-gate:
    if: always()
    needs:
      - classify
      - workflow-hygiene
      - permanent-contract
      - regression-shield
      - browser-qa
      - cfb-critical
      - mlb-critical
      - wnba-critical
      - core-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate every required DevSystem lane
        env:
          DEVSYSTEM_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python devsystem/final_gate_v1.py
