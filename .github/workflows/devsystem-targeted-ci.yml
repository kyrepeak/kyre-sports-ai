name: DevSystem targeted CI

# Browser dependency intent remains frozen in devsystem/browser_tooling_v1.txt; Step 6 exact locks own cache/install identity.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - devsystem-step2-targeted-ci
      - devsystem-step3-regression-shield
      - devsystem-step4-browser-qa
      - devsystem-step5-production-verification
      - devsystem-step6-permanent-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsystem-targeted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      cfb: ${{ steps.changed.outputs.cfb }}
      mlb: ${{ steps.changed.outputs.mlb }}
      wnba: ${{ steps.changed.outputs.wnba }}
      nfl: ${{ steps.changed.outputs.nfl }}
      nba: ${{ steps.changed.outputs.nba }}
      nhl: ${{ steps.changed.outputs.nhl }}
      soccer: ${{ steps.changed.outputs.soccer }}
      core: ${{ steps.changed.outputs.core }}
      ui: ${{ steps.changed.outputs.ui }}
      api: ${{ steps.changed.outputs.api }}
      data: ${{ steps.changed.outputs.data }}
      model: ${{ steps.changed.outputs.model }}
      infra: ${{ steps.changed.outputs.infra }}
      unprotected_domains: ${{ steps.changed.outputs.unprotected_domains }}
      risk_tier: ${{ steps.changed.outputs.risk_tier }}
      changed_count: ${{ steps.changed.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Classify changed paths with permanent DevSystem registry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python devsystem/change_classifier_v1.py \
              --manual \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          fi

          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          python devsystem/change_classifier_v1.py \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

  workflow-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove legacy PR fan-out is quarantined
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("devsystem/legacy_broad_pr_workflows_2026-09-09.txt")
          paths = [
              line.strip()
              for line in manifest.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          failures = []
          for item in paths:
              text = Path(item).read_text(encoding="utf-8")
              if re.search(r"(?m)^  pull_request\s*:", text):
                  failures.append(item)
              if not re.search(r"(?m)^  (workflow_dispatch|push|schedule)\s*:", text):
                  failures.append(item + " [no retained trigger]")
          if failures:
              print("LEGACY_PR_FANOUT_STILL_ACTIVE")
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"DEVSYSTEM_WORKFLOW_HYGIENE_GREEN quarantined={len(paths)}")
          PY

  permanent-contract:
    needs: [classify, workflow-hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed for sport domains without a dedicated test lane
        env:
          UNPROTECTED: ${{ needs.classify.outputs.unprotected_domains }}
        run: |
          if [ -n "$UNPROTECTED" ]; then
            echo "DEVSYSTEM_UNPROTECTED_DOMAIN_BLOCKED: $UNPROTECTED"
            echo "Activate its manifest entry + dedicated critical tests before changing it."
            exit 1
          fi
      - name: Validate permanent DevSystem contract
        run: python devsystem/permanent_gate_v1.py
      - name: Validate MONSTER Persistent Execution Brain V1
        run: python devsystem/persistent_execution_brain_v1.py self-test
      - name: Validate MONSTER Automatic Loop Kill V1
        run: python devsystem/automatic_loop_kill_v1.py
      - name: Validate MONSTER 2A Mandatory Action Gate V1
        run: python devsystem/mandatory_2a_action_gate_v1.py
      - name: Validate MONSTER 2A Single-Use Authorization Receipt V1
        run: python devsystem/mandatory_2a_receipt_v1.py
      - name: Validate MONSTER 2A Replay + Loop Lock V1
        run: python devsystem/mandatory_2a_replay_lock_v1.py
      - name: Validate MONSTER 2A Global Enforcement + Tripwire V1
        run: python devsystem/mandatory_2a_global_enforcement_v1.py
      - name: Validate MONSTER 2A Permanent Adversarial Certification V1
        run: python devsystem/mandatory_2a_adversarial_certification_v1.py
      - name: Validate MONSTER V4 Distributed Execution Lease V1
        run: python devsystem/distributed_execution_lease_v1.py
      - name: Validate MONSTER V4 Semantic Action Normalizer V1
        run: python devsystem/semantic_action_normalizer_v1.py
      - name: Validate MONSTER V4 Frozen Artifact Registry V1
        run: python devsystem/frozen_artifact_registry_v1.py
      - name: Enforce authoritative frozen artifact registry
        run: |
          git fetch origin monster-frozen-artifact-registry --depth=1
          git show FETCH_HEAD:devsystem/frozen_artifact_registry_state_v1.json > /tmp/monster-frozen-artifact-registry.json
          python devsystem/frozen_artifact_registry_v1.py verify-head --registry-file /tmp/monster-frozen-artifact-registry.json --head HEAD
      - name: Validate MONSTER V4 Cross-Chat Truth Handshake V1
        run: python devsystem/cross_chat_truth_handshake_v1.py
      - name: Validate authoritative cross-chat truth packet
        run: |
          git fetch origin monster-cross-chat-truth --depth=1
          git show FETCH_HEAD:devsystem/cross_chat_truth_state_v1.json > /tmp/monster-cross-chat-truth.json
          python devsystem/cross_chat_truth_handshake_v1.py verify-packet --truth-file /tmp/monster-cross-chat-truth.json
      - name: Validate MONSTER Evidence Truth Ledger V1
        run: python devsystem/evidence_truth_ledger_v1.py
      - name: Validate MONSTER Failure Ownership Engine V1
        run: python devsystem/failure_ownership_engine_v1.py
      - name: Validate MONSTER Deployment Truth Control Plane V1
        run: python devsystem/deployment_truth_control_plane_v1.py
      - name: Validate MONSTER Adaptive Proof Engine V1
        run: python devsystem/adaptive_proof_engine_v1.py
      - name: Validate MONSTER Project Blast-Radius Map V1
        run: python devsystem/project_blast_radius_map_v1.py
      - name: Validate MONSTER Self-Benchmark V1
        run: python devsystem/monster_self_benchmark_v1.py
      - name: Validate Monster Speed V3 Step 2 cache split
        run: python devsystem/monster_speed_v3_step2_cache_split_v1.py
      - name: Validate Monster Speed V3 Step 3 fast/full lane split
        run: python devsystem/monster_speed_v3_step3_lane_split_v1.py
      - name: Validate Monster Speed V3 Step 4 user-visible contract
        run: python devsystem/monster_speed_v3_step4_contract_guard_v1.py
      - name: Validate Monster Speed V3 Step 5 repository automation
        run: python devsystem/monster_speed_v3_step5_repo_settings_v1.py
      - name: Validate Monster Speed V3 Step 6 permanent hot cache
        run: python devsystem/monster_speed_v3_step6_hot_cache_v1.py
      - name: Validate CFB Top Picks Research V2 Step 1 completeness contract
        run: python devsystem/cfb_top_picks_research_v2_step1_contract_v1.py
      - name: Validate CFB Top Picks Research V2 Step 2 real-logo contract
        run: python devsystem/cfb_top_picks_research_v2_step2_logos_v1.py
      - name: Validate CFB Top Picks Research V2 Step 3 multi-source history contract
        run: python devsystem/cfb_top_picks_research_v2_step3_history_v1.py
      - name: Validate CFB Top Picks Research V2 Step 4 offense-research contract
        run: python devsystem/cfb_top_picks_research_v2_step4_offense_v1.py
      - name: Validate CFB Top Picks Research V2 Step 5 defense-pace contract
        run: python devsystem/cfb_top_picks_research_v2_step5_defense_pace_v1.py
      - name: Validate CFB Top Picks Research V2 Step 6 market-reasoning contract
        run: python devsystem/cfb_top_picks_research_v2_step6_market_reasoning_v1.py
      - name: Certify CFB Top Picks Research V2 Step 6 all-market reasoning
        run: python -m devsystem.cfb_top_picks_research_v2_step6_market_reasoning_cert_v1
      - name: Compile CFB Top Picks Research V2 Step 6 owners
        run: |
          python -m py_compile cfb_top_picks_market_reasoning_v1.py
          python -m py_compile cfb_top_picks_details_v2.py
          python -m py_compile cfb_top_picks_page_v6.py
          python -m py_compile streamlit_memory_lazy_router_cfb_top_picks_research_v2_step6.py
      - name: Validate CFB Top Picks Research V2 Step 7 benefits-risks contract
        run: python devsystem/cfb_top_picks_research_v2_step7_benefits_risks_v1.py
      - name: Certify CFB Top Picks Research V2 Step 7 verified benefits-risks
        run: python -m devsystem.cfb_top_picks_research_v2_step7_benefits_risks_cert_v1
      - name: Compile CFB Top Picks Research V2 Step 7 owners
        run: |
          python -m py_compile cfb_top_picks_benefits_risks_v1.py
          python -m py_compile cfb_top_picks_details_v3.py
          python -m py_compile cfb_top_picks_page_v7.py
          python -m py_compile streamlit_memory_lazy_router_cfb_top_picks_research_v2_step7.py
      - name: Validate CFB Top Picks Research V2 Step 8 source-router contract
        run: python devsystem/cfb_top_picks_research_v2_step8_source_router_v1.py
      - name: Certify CFB Top Picks Research V2 Step 8 DATA_FIELD provenance
        run: python -m devsystem.cfb_top_picks_research_v2_step8_source_router_cert_v1
      - name: Compile CFB Top Picks Research V2 Step 8 owners
        run: |
          python -m py_compile cfb_top_picks_source_router_v1.py
          python -m py_compile cfb_top_picks_details_v4.py
          python -m py_compile cfb_top_picks_page_v8.py
          python -m py_compile streamlit_memory_lazy_router_cfb_top_picks_research_v2_step8.py
      - name: Validate CFB Top Picks Research V2 Step 9 full-slate contract
        run: python devsystem/cfb_top_picks_research_v2_step9_full_slate_v1.py
      - name: Compile CFB Top Picks Research V2 Step 9 owners
        run: |
          python -m py_compile cfb_top_picks_source_router_v2.py
          python -m py_compile cfb_top_picks_details_v5.py
          python -m py_compile cfb_top_picks_page_v9.py
          python -m py_compile streamlit_memory_lazy_router_cfb_top_picks_research_v2_step9.py
          python -m py_compile devsystem/cfb_top_picks_research_v2_step9_full_slate_cert_v1.py
      - name: Validate Monster Anti-Loop V2 hard gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python devsystem/forward_motion_contract_v2.py
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            ledger_base="$PR_BASE"
            if git merge-base --is-ancestor "$PR_BASE" origin/main; then
              ledger_base="$(git merge-base origin/main "$PR_HEAD")"
            fi
            echo "DEVSYSTEM_ACTION_LEDGER_BASE=$ledger_base"
            python devsystem/action_ledger_v2.py verify-pr \
              --base "$ledger_base" \
              --head "$PR_HEAD"
          fi
      - name: Self-test classifier and final gate
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_devsystem_change_classifier_v1.py \
            tests/test_devsystem_permanent_gate_v1.py \
            tests/test_devsystem_persistent_execution_brain_v1.py \
            tests/test_devsystem_automatic_loop_kill_v1.py \
            tests/test_devsystem_mandatory_2a_action_gate_v1.py \
            tests/test_devsystem_mandatory_2a_receipt_v1.py \
            tests/test_devsystem_mandatory_2a_replay_lock_v1.py \
            tests/test_devsystem_mandatory_2a_global_enforcement_v1.py \
            tests/test_devsystem_mandatory_2a_adversarial_certification_v1.py \
            tests/test_devsystem_distributed_execution_lease_v1.py \
            tests/test_devsystem_semantic_action_normalizer_v1.py \
            tests/test_devsystem_frozen_artifact_registry_v1.py \
            tests/test_devsystem_cross_chat_truth_handshake_v1.py \
            tests/test_devsystem_evidence_truth_ledger_v1.py \
            tests/test_devsystem_failure_ownership_engine_v1.py \
            tests/test_devsystem_deployment_truth_control_plane_v1.py \
            tests/test_devsystem_adaptive_proof_engine_v1.py \
            tests/test_devsystem_project_blast_radius_map_v1.py \
            tests/test_devsystem_monster_self_benchmark_v1.py \
            tests/test_devsystem_sport_cache_v1.py \
            tests/test_monster_speed_v3_step2_cache_split_v1.py \
            tests/test_monster_speed_v3_step3_lane_split_v1.py \
            tests/test_user_visible_contract_v1.py \
            tests/test_monster_speed_v3_step4_contract_guard_v1.py \
            tests/test_monster_speed_v3_step5_repo_settings_v1.py \
            tests/test_monster_speed_v3_step6_hot_cache_v1.py \
            tests/test_cfb_top_picks_research_v2_step1_contract_v1.py \
            tests/test_cfb_top_picks_research_v2_step2_contract_v1.py \
            tests/test_cfb_top_picks_research_v2_step3_contract_v1.py \
            tests/test_cfb_top_picks_research_v2_step4_contract_v1.py \
            tests/test_cfb_top_picks_research_v2_step5_contract_v1.py \
            tests/test_devsystem_workflow_parallelism_v1.py \
            tests/test_github_speed_benchmark_v1.py

  regression-shield:
    needs: [classify, workflow-hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-light invariant shield
        run: python devsystem/regression_shield_v1.py
      - name: Self-test regression shield
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_regression_shield_v1.py

  browser-qa:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: >-
      github.event_name != 'pull_request' &&
      (needs.classify.outputs.ui == 'true' ||
      needs.classify.outputs.cfb == 'true' ||
      needs.classify.outputs.nfl == 'true' ||
      needs.classify.outputs.core == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Build Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          .venv-browser-qa/bin/python -m playwright install chromium
      - name: Activate browser QA virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Self-test browser QA and cache contracts
        run: |
          python -m pytest -q \
            tests/test_devsystem_browser_qa_v1.py \
            tests/test_devsystem_production_verify_v2.py \
            tests/test_devsystem_browser_cache_v1.py
      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-qa
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/browser-qa/streamlit.log 2>&1 &
          echo $! > /tmp/devsystem_streamlit_pid
      - name: Drive the real Streamlit UI with Playwright
        run: |
          python devsystem/browser_qa_v1.py \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/browser-qa
      - name: Print Streamlit log on browser failure
        if: failure()
        run: tail -n 500 artifacts/browser-qa/streamlit.log || true
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsystem-browser-qa-${{ github.run_id }}
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/devsystem_streamlit_pid ]; then
            kill "$(cat /tmp/devsystem_streamlit_pid)" 2>/dev/null || true
          fi

  cfb-critical:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: >-
      (github.event_name != 'pull_request' || needs.classify.outputs.model == 'true') &&
      (needs.classify.outputs.cfb == 'true' || needs.classify.outputs.core == 'true')
