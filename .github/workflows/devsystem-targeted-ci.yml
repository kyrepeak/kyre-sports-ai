  core-smoke:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: needs.classify.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile shared entry points
        run: python -m py_compile app.py

  pr-fast:
    if: always() && github.event_name == 'pull_request'
    needs:
      - classify
      - workflow-hygiene
      - permanent-contract
      - regression-shield
      - core-smoke
      - wnba-pra-speed-v3-step4-contract
      - wnba-pra-speed-v3-step5-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Certify fast PR safety lane
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WORKFLOW_HYGIENE_RESULT: ${{ needs.workflow-hygiene.result }}
          PERMANENT_CONTRACT_RESULT: ${{ needs.permanent-contract.result }}
          REGRESSION_SHIELD_RESULT: ${{ needs.regression-shield.result }}
          CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}
          WNBA_PRA_STEP4_RESULT: ${{ needs.wnba-pra-speed-v3-step4-contract.result }}
          WNBA_PRA_STEP5_RESULT: ${{ needs.wnba-pra-speed-v3-step5-contract.result }}
        run: |
          set -euo pipefail
          allowed="success skipped"
          for name in CLASSIFY_RESULT WORKFLOW_HYGIENE_RESULT PERMANENT_CONTRACT_RESULT REGRESSION_SHIELD_RESULT CORE_SMOKE_RESULT WNBA_PRA_STEP4_RESULT WNBA_PRA_STEP5_RESULT
          do
            result="${!name:-}"
            printf '%s=%s\n' "$name" "${result:-unknown}"
            grep -qw -- "$result" <<< "$allowed" || exit 1
          done
          echo "MONSTER_SPEED_V3_STEP3_FAST_PR_GREEN"

  full-merge-certification:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - classify
      - workflow-hygiene
      - permanent-contract
      - regression-shield
      - browser-qa
      - cfb-critical
      - mlb-critical
      - wnba-critical
      - nfl-critical
      - core-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Certify merged-main full lane
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WORKFLOW_HYGIENE_RESULT: ${{ needs.workflow-hygiene.result }}
          PERMANENT_CONTRACT_RESULT: ${{ needs.permanent-contract.result }}
          REGRESSION_SHIELD_RESULT: ${{ needs.regression-shield.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
          CFB_CRITICAL_RESULT: ${{ needs.cfb-critical.result }}
          MLB_CRITICAL_RESULT: ${{ needs.mlb-critical.result }}
          WNBA_CRITICAL_RESULT: ${{ needs.wnba-critical.result }}
          NFL_CRITICAL_RESULT: ${{ needs.nfl-critical.result }}
          CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}
        run: |
          set -euo pipefail
          allowed="success skipped"
          for name in CLASSIFY_RESULT WORKFLOW_HYGIENE_RESULT PERMANENT_CONTRACT_RESULT REGRESSION_SHIELD_RESULT BROWSER_QA_RESULT CFB_CRITICAL_RESULT MLB_CRITICAL_RESULT WNBA_CRITICAL_RESULT NFL_CRITICAL_RESULT CORE_SMOKE_RESULT
          do
            result="${!name:-}"
            printf '%s=%s\n' "$name" "${result:-unknown}"
            grep -qw -- "$result" <<< "$allowed" || exit 1
          done
          echo "MONSTER_SPEED_V3_STEP3_FULL_MERGE_GREEN"

  devsystem-final-gate:
    if: always()
    needs:
      - classify
      - workflow-hygiene
      - permanent-contract
      - regression-shield
      - browser-qa
      - cfb-critical
      - mlb-critical
      - wnba-critical
      - nfl-critical
      - core-smoke
      - pr-fast
      - full-merge-certification
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate every required DevSystem lane
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WORKFLOW_HYGIENE_RESULT: ${{ needs.workflow-hygiene.result }}
          PERMANENT_CONTRACT_RESULT: ${{ needs.permanent-contract.result }}
          REGRESSION_SHIELD_RESULT: ${{ needs.regression-shield.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
          CFB_CRITICAL_RESULT: ${{ needs.cfb-critical.result }}
          MLB_CRITICAL_RESULT: ${{ needs.mlb-critical.result }}
          WNBA_CRITICAL_RESULT: ${{ needs.wnba-critical.result }}
          NFL_CRITICAL_RESULT: ${{ needs.nfl-critical.result }}
          CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}
          PR_FAST_RESULT: ${{ needs.pr-fast.result }}
          FULL_MERGE_RESULT: ${{ needs.full-merge-certification.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          allowed="success skipped"
          failed=0
          for name in \
            CLASSIFY_RESULT \
            WORKFLOW_HYGIENE_RESULT \
            PERMANENT_CONTRACT_RESULT \
            REGRESSION_SHIELD_RESULT \
            BROWSER_QA_RESULT \
            CFB_CRITICAL_RESULT \
            MLB_CRITICAL_RESULT \
            WNBA_CRITICAL_RESULT \
            NFL_CRITICAL_RESULT \
            CORE_SMOKE_RESULT \
            PR_FAST_RESULT \
            FULL_MERGE_RESULT
          do
            result="${!name:-}"
            printf '%s=%s\n' "$name" "${result:-unknown}"
            if ! grep -qw -- "$result" <<< "$allowed"; then
              failed=1
            fi
          done
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_FAST_RESULT" != "success" ]; then
            echo "MONSTER_SPEED_V3_STEP3_FAST_PR_REQUIRED"
            failed=1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$FULL_MERGE_RESULT" != "success" ]; then
            echo "MONSTER_SPEED_V3_STEP3_FULL_MERGE_REQUIRED"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "DEVSYSTEM_FINAL_GATE_BLOCKED"
            exit 1
          fi
          echo "DEVSYSTEM_FINAL_GATE_GREEN"
