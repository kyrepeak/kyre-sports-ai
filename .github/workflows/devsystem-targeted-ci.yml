            tests/test_wnba_pra_api_market_bridge_v1.py \
            tests/test_wnba_pra_page_cleanup_v1.py \
            tests/test_wnba_pra_navigation_v2_step1.py \
            tests/test_wnba_pra_speed_v3_step4.py \
            tests/test_wnba_pra_speed_v3_step5.py


  wnba-pra-speed-v3-step4-contract:
    needs: [classify]
    if: >-
      github.event_name == 'pull_request' &&
      (needs.classify.outputs.wnba == 'true' || needs.classify.outputs.core == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Step-4 focused dependencies
        run: pip install -q pytest requests fastapi streamlit httpx pandas pypdf
      - name: Run WNBA PRA Speed V3 Step-4 focused contract
        run: python -m pytest -q tests/test_wnba_pra_speed_v3_step4.py
      - name: Certify WNBA PRA Speed V3 Step-4 branch proof
        run: |
          echo "WNBA_PRA_SPEED_V3_STEP4_DEVSYSTEM_FOCUSED_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP4_BRANCH_GREEN"

  wnba-pra-speed-v3-step5-contract:
    needs: [classify]
    if: >-
      github.event_name == 'pull_request' &&
      (needs.classify.outputs.wnba == 'true' || needs.classify.outputs.core == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
