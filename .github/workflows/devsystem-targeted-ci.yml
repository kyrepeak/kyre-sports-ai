            tests/test_cfb_over_under_router_v58.py \
            tests/test_cfb_over_under_router_v59.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_cfb_over_under_upgrade_step9_environment_engine.py \
            tests/test_cfb_over_under_upgrade_step9_slate.py \
            tests/test_cfb_over_under_readable_step9_v1.py \
            tests/test_cfb_over_under_router_v66.py \
            tests/test_cfb_over_under_upgrade_step10_history_engine.py \
            tests/test_cfb_over_under_upgrade_step10_slate.py \
            tests/test_cfb_over_under_readable_step10_v1.py \
            tests/test_cfb_over_under_router_v67.py \
            tests/test_cfb_over_under_upgrade_step11_form_strength_engine.py \
            tests/test_cfb_over_under_upgrade_step11_slate.py \
            tests/test_cfb_over_under_readable_step11_v1.py \
            tests/test_cfb_over_under_router_v68.py \
            tests/test_cfb_over_under_upgrade_step12_certification.py \
            tests/test_cfb_over_under_upgrade_step12_slate.py \
            tests/test_cfb_over_under_readable_step12_v1.py \
            tests/test_cfb_over_under_router_v69.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_cfb_game_total_visual_step6.py \
            tests/test_cfb_game_total_page_cleanup_debug_wall_v174.py \
            tests/test_cfb_game_total_page_cleanup_navigation_v175.py \
            tests/test_cfb_game_total_page_cleanup_final_v1.py \
            tests/test_cfb_game_total_debug_wall_hidden_v1.py \
            tests/test_cfb_game_total_sport_nav_step1.py \
            tests/test_cfb_game_total_sport_nav_step2.py \
            tests/test_cfb_game_total_sport_nav_step3.py \
            tests/test_cfb_game_total_sport_nav_step4_final.py \
            tests/test_sport_nav_dropdown_category_contract_v1.py \
            tests/test_sport_nav_dropdown_step2_ui.py \
            tests/test_sport_nav_dropdown_step3_functional.py \
            tests/test_sport_nav_dropdown_step4_final.py \
            tests/test_cfb_game_total_live_tap_router_v181.py \
            tests/test_cfb_sport_nav_raw_html_safari_fix.py \
            tests/test_nfl_passing_yards_entry_slate_reset_v182.py \
            tests/test_nfl_passing_yards_keyerror_safe_entry_v183.py \
            tests/test_nfl_passing_yards_stuck_slate_v184.py \
            tests/test_nfl_all_markets_no_rerun_v185.py \
            tests/test_cfb_top_picks_research_v2_step7_benefits_risks_v1.py \
            tests/test_cfb_top_picks_research_v2_step8_source_router_v1.py \
            tests/test_cfb_top_picks_research_v2_step9_full_slate_v1.py
          python -m devsystem.cfb_top_picks_research_v2_step9_full_slate_cert_v1

  mlb-critical:
    needs: [classify, workflow-hygiene, permanent-contract, regression-shield]
    if: >-
      (github.event_name != 'pull_request' || needs.classify.outputs.model == 'true') &&
      (needs.classify.outputs.mlb == 'true' || needs.classify.outputs.core == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up MLB Python
        id: mlb-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore MLB critical virtualenv
        id: mlb-venv-cache
        uses: actions/cache@v4
        with:
          path: .venv-mlb-critical
          key: devsystem-mlb-venv-${{ runner.os }}-py${{ steps.mlb-python.outputs.python-version }}-${{ hashFiles('devsystem/root_requirements_fingerprint_v1.txt', 'sports_api/requirements.txt', 'devsystem/sport_cache_epoch_v1.txt') }}
      - name: Build MLB critical virtualenv on cache miss
        if: steps.mlb-venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-mlb-critical
          .venv-mlb-critical/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          if [ -f sports_api/requirements.txt ]; then .venv-mlb-critical/bin/python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt; fi
          .venv-mlb-critical/bin/python -m pip install --disable-pip-version-check -q pytest
      - name: Activate MLB critical virtualenv
