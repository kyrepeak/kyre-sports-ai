name: College Football Step 8 Over-Under Model V1 certification

on:
  workflow_dispatch:
  push:
    branches: ['feature/cfb-step8-over-under-model-v1']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 8 scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step8-over-under-model-v1'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step8-over-under-model-v1.yml' \
            'app.py' \
            'cfb_over_under_hub_v2.py' \
            'cfb_over_under_model_v1.py' \
            'streamlit_memory_lazy_router_v32.py' \
            'tests/test_cfb_step8_over_under_hub_v2.py' \
            'tests/test_cfb_step8_over_under_model_v1.py' \
            'tests/test_streamlit_memory_lazy_router_v32.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 8 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP8_SCOPE=PASS"

      - name: Pin Step 7 freeze manifest itself
        run: |
          python - <<'PY'
          import subprocess
          import sys

          expected = "504a9f8f18a9b6b59497bc610bb77c1042286dc4"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:cfb_freeze_manifest_v7.json"],
              text=True,
          ).strip()
          if actual != expected:
              print(f"cfb_freeze_manifest_v7.json changed expected={expected} actual={actual}")
              sys.exit(1)
          print("CFB_STEP7_MANIFEST_PIN=PASS")
          PY

      - name: Enforce permanently frozen CFB Steps 1 through 7
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v7.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 7:
              failures.append("CFB freeze version changed")
          if m.get("completed_steps") != [1,2,3,4,5,6,7]:
              failures.append("CFB completed steps changed")

          sections = m.get("completed_sections") or {}
          if sections.get("moneyline") is not True:
              failures.append("Moneyline completion contract changed")
          if sections.get("over_under") is not False:
              failures.append("Over/Under was marked complete before Step 8 certification")

          contract = m.get("step7_contract") or {}
          if contract.get("foundation_only") is not True:
              failures.append("Step 7 foundation contract changed")
          if contract.get("next_model_step") != 8:
              failures.append("Step 7 next-model handoff changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Steps 1-7 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEPS_1_7_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]
              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")
              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP8_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile Step 8
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_model_v1.py \
            cfb_over_under_hub_v2.py \
            streamlit_memory_lazy_router_v32.py \
            tests/test_cfb_step8_over_under_model_v1.py \
            tests/test_cfb_step8_over_under_hub_v2.py \
            tests/test_streamlit_memory_lazy_router_v32.py
          PYTHONPATH=. python -c "import cfb_over_under_model_v1; import cfb_over_under_hub_v2; import streamlit_memory_lazy_router_v32"

      - name: Run Step 8 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step8_over_under_model_v1.py \
            tests/test_cfb_step8_over_under_hub_v2.py \
            tests/test_streamlit_memory_lazy_router_v32.py \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_step6_moneyline_slate_v1.py \
            tests/test_streamlit_memory_lazy_router_v30.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_cfb_moneyline_mixed_division_wrapper.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove Step 8 model and market firewall
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          model = Path("cfb_over_under_model_v1.py").read_text(encoding="utf-8")
          hub = Path("cfb_over_under_hub_v2.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v32.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          required = [
              'MODEL_VERSION = "CFB OVER/UNDER MODEL V1 • STEP 8 RAW TOTAL MODEL"',
              'ANALYSIS_LINE_PROJECTION_WEIGHT = 0.0',
              '"sportsbook_input_used": False',
              '"market_price_used": False',
              '"empirical_calibration_claimed": False',
              '"monte_carlo_used": False',
              '"slate_ranking_ready": False',
              '"final_pick_ready": False',
              'FROZEN_OVER_UNDER_HUB = "cfb_over_under_hub_v1"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v31"',
              'root._import("cfb_over_under_hub_v2")',
          ]
          combined = model + "\n" + hub + "\n" + router
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 8 marker: {token}")

          forbidden_model = [
              "import numpy",
              "np.random",
              "import requests",
              "urllib",
              "sportsbook_price",
              "sportsbook_total",
              "market_probability",
              "expected_value",
              "import random",
              "random.",
          ]
          lower_model = model.lower()
          for token in forbidden_model:
              if token.lower() in lower_model:
                  raise SystemExit(f"Step 8 model crossed firewall: {token}")

          forbidden_hub = [
              "scan_slate",
              "rank_slate",
              "top-5 scanner",
              "sportsbook_price",
              "expected_value",
          ]
          lower_hub = hub.lower()
          for token in forbidden_hub:
              if token.lower() in lower_hub:
                  raise SystemExit(f"Step 8 hub crossed ranking/market boundary: {token}")

          match = re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", app)
          if not match or int(match.group(1)) < 32:
              raise SystemExit("app.py regressed below Step 8 Router V32")
          current = int(match.group(1))
          for version in range(current, 32, -1):
              source = Path(f"streamlit_memory_lazy_router_v{version}.py").read_text(encoding="utf-8")
              if f"import streamlit_memory_lazy_router_v{version - 1} as prior" not in source:
                  raise SystemExit(
                      f"Router V{version} does not preserve additive chain to Router V32"
                  )

          print("CFB_STEP8_MODEL_FIREWALL=PASS")
          PY

      - name: Live Sept 12 total-model smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_model_v1 as model
          import cfb_schedule_v3 as schedule
          import cfb_team_data_v2 as team_data

          schedule.clear_schedule_cache()
          games, diag = schedule.load_with_diagnostics("2026-09-12")
          target = None
          for game in games:
              away = str(game.get("away_team") or "").lower()
              home = str(game.get("home_team") or "").lower()
              if "oklahoma" in away and "michigan" in home:
                  target = game
                  break

          print("LIVE_SCHEDULE_COUNT", len(games))
          print("LIVE_TARGET", target)
          if target is None:
              raise SystemExit("Oklahoma @ Michigan missing from live Sept 12 slate")

          team_data.clear_team_data_cache()
          profiles, team_diag = team_data.load_matchup_team_data(
              target,
              "2026-09-12",
          )
          away = profiles.get("away") or {}
          home = profiles.get("home") or {}

          out = model.project_matchup(target, away, home, 50.5)
          out_alt = model.project_matchup(target, away, home, 60.5)

          print("LIVE_MODEL", out)
          if not out.get("ready"):
              raise SystemExit(f"Step 8 live model gated: {out.get('reasons')}")
          if not out.get("projected_total_ready"):
              raise SystemExit("Step 8 projected total not ready")
          if not out.get("over_under_probability_ready"):
              raise SystemExit("Step 8 Over/Under probability not ready")

          p_sum = (
              float(out["over_probability"])
              + float(out["under_probability"])
              + float(out["push_probability"])
          )
          if abs(p_sum - 1.0) > 1e-9:
              raise SystemExit("Step 8 probabilities do not sum to one")

          if float(out["projected_total"]) != float(out_alt["projected_total"]):
              raise SystemExit("Analysis line leaked into projected total")
          if float(out["projected_away_points"]) != float(out_alt["projected_away_points"]):
              raise SystemExit("Analysis line leaked into away projection")
          if float(out["projected_home_points"]) != float(out_alt["projected_home_points"]):
              raise SystemExit("Analysis line leaked into home projection")

          if out.get("analysis_line_projection_weight") != 0.0:
              raise SystemExit("Analysis line has nonzero projection weight")
          if out.get("sportsbook_input_used") is not False:
              raise SystemExit("Sportsbook input leaked into Step 8")
          if out.get("monte_carlo_used") is not False:
              raise SystemExit("Monte Carlo leaked into Step 8")

          print("CFB_STEP8_LIVE_TOTAL_MODEL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP8_OVER_UNDER_MODEL_GREEN"
