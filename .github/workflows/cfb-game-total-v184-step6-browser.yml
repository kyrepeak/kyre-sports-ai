name: CFB Game Total V184 Step 6 browser certification

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_step6_scoring_v1.py"
      - "cfb_game_total_clean_page_v18.py"
      - "streamlit_memory_lazy_router_v163.py"
      - "app.py"
      - "devsystem/cfb_game_total_step6_browser_qa_v184.py"
      - "devsystem/cfb_game_total_browser_qa_v4.py"
      - "tests/test_cfb_game_total_v184_step6_scoring.py"
      - "tests/test_cfb_game_total_v184_step6_browser.py"
      - "tests/test_cfb_game_total_v168_step5_pace.py"
      - ".github/workflows/cfb-game-total-v184-step6-browser.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_step6_scoring_v1.py"
      - "cfb_game_total_clean_page_v18.py"
      - "streamlit_memory_lazy_router_v163.py"
      - "app.py"
      - "devsystem/cfb_game_total_step6_browser_qa_v184.py"
      - "devsystem/cfb_game_total_browser_qa_v4.py"
      - "tests/test_cfb_game_total_v184_step6_scoring.py"
      - "tests/test_cfb_game_total_v184_step6_browser.py"
      - "tests/test_cfb_game_total_v168_step5_pace.py"
      - ".github/workflows/cfb-game-total-v184-step6-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v184-step6-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-v184-step6-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install V184 browser certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V184 Step 6 browser surface
        run: |
          python -m py_compile \
            cfb_game_total_step6_scoring_v1.py \
            cfb_game_total_clean_page_v18.py \
            streamlit_memory_lazy_router_v163.py \
            devsystem/cfb_game_total_step6_browser_qa_v184.py

      - name: Run V184 Step 6 regression contracts
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_cfb_game_total_v184_step6_scoring.py \
            tests/test_cfb_game_total_v184_step6_browser.py \
            tests/test_cfb_game_total_v168_step5_pace.py

      - name: Start real production entrypoint locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-v184-step6
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-v184-step6/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v184_step6_browser_pid

      - name: Certify exact-route Step 6 in Chromium
        run: |
          python -m devsystem.cfb_game_total_step6_browser_qa_v184 \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-v184-step6

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 700 artifacts/cfb-game-total-v184-step6/streamlit.log || true

      - name: Upload V184 Step 6 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v184-step6-browser-${{ github.run_id }}
          path: artifacts/cfb-game-total-v184-step6
          if-no-files-found: warn
          retention-days: 14

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v184_step6_browser_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v184_step6_browser_pid)" 2>/dev/null || true
          fi
