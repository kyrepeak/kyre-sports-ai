name: MLB Step16A production activation readiness certification

on:
  push:
    branches:
      - mlb-step16a-production-activation-contract
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP16A_BASE_SHA: a67d415e5e1d8614d632fd34cfa09d551792a71f
  MLB_STEP16A_PRODUCTION_ACTIVATION_CONTRACT_ENABLED: "true"
  MLB_STEP15C_FINAL_LIVE_PERSISTENCE_FREEZE_ENABLED: "true"
  MLB_STEP15B_LIVE_ADAPTER_SMOKE_ENABLED: "true"
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"

jobs:
  certify-step16a:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert activation remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = 'false'
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = 'false'
          test "$MLB_WAGERING_ENABLED" = 'false'
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Verify five-file additive Step16A scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP16A_BASE_SHA" HEAD
          changed="$(git diff --name-only "$STEP16A_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 5
          allowed='^(sports_api/mlb_step16a_production_activation_contract_v1.py|sports_api/certification/mlb_step16a_production_activation_readiness_evidence.json|tests/test_mlb_step16a_production_activation_contract_v1.py|sports_api/tools/mlb_step16a_production_activation_contract_cert.py|\.github/workflows/mlb-step16a-production-activation-contract-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad"
          git diff --check "$STEP16A_BASE_SHA"...HEAD
          test -z "$(git diff --numstat "$STEP16A_BASE_SHA"...HEAD | awk '$2 != 0 {print}')"
          echo MLB_STEP16A_FIVE_FILE_ADDITIVE_SCOPE_OK

      - name: Verify frozen Step15C and deployment surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP16A_BASE_SHA"...HEAD -- \
            sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py \
            sports_api/mlb_step15b_live_adapter_transaction_smoke_v1.py \
            sports_api/mlb_step15a_live_postgresql_preflight_v1.py \
            sports_api/mlb_step14_final_persistence_freeze_v1.py \
            sports_api/Dockerfile \
            sports_api/README.md \
            sports_api/main.py \
            sports_api/production.env.example \
            sports_api/requirements.txt \
            sports_api/requirements-mlb-step14b-persistence.txt \
            sports_api/api/mlb.py app.py
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py")" = 2ba73d80704054a5de8da4ea6daab8b9537bc7e0
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/Dockerfile")" = e06eed5c3b9d65c238e47b3fd2fde1529a785fdf
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/README.md")" = 4f93bb2c1890a1c65ff7b6c7cc21bb857a39f5b5
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/main.py")" = 4816cc7eff7ae140c503f6fa7c1e97f5f0074192
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/production.env.example")" = 6962aa11e75906691869d2ed04d2bf50822821c8
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/requirements.txt")" = 84e666d78549778a84f216e80d2bb979c1f6160a
          test "$(git rev-parse "$STEP16A_BASE_SHA:sports_api/requirements-mlb-step14b-persistence.txt")" = 46331822d0a55f5a4983d289c73a45ea9745ca89
          echo MLB_STEP16A_FROZEN_PARENT_AND_DEPLOYMENT_EXACT

      - name: Compile Step16A
        run: |
          python -m py_compile \
            sports_api/mlb_step16a_production_activation_contract_v1.py \
            sports_api/tools/mlb_step16a_production_activation_contract_cert.py \
            tests/test_mlb_step16a_production_activation_contract_v1.py
          python -m json.tool sports_api/certification/mlb_step16a_production_activation_readiness_evidence.json >/dev/null

      - name: Run Step16A targeted tests
        run: python -m pytest -q tests/test_mlb_step16a_production_activation_contract_v1.py

      - name: Run full MLB regression
        run: python -m pytest -q tests/test_mlb_*.py

      - name: Certify production activation readiness contract
        run: python -m sports_api.tools.mlb_step16a_production_activation_contract_cert

      - name: Upload Step16A certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step16a-production-activation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: mlb-step16a-production-activation-contract-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Final marker
        run: echo MLB_STEP16A_PRODUCTION_ACTIVATION_CONTRACT_GREEN
