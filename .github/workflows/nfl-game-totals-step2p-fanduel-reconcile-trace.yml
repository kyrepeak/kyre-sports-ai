name: NFL Game Totals Step 2P FanDuel Reconcile Trace

on:
  push:
    branches:
      - monster/nfl-game-totals-step2p-fanduel-reconcile-trace
    paths:
      - .github/workflows/nfl-game-totals-step2p-fanduel-reconcile-trace.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-fanduel-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FanDuel American Football event type
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          HOST = "https://sbapi.az.sportsbook.fanduel.com"
          AK = "FhMFpcPWXMeyZxOx"
          EVENT_TYPE_ID = "6423"
          TARGET_KICKOFF = datetime.fromisoformat("2026-09-20T17:00:00+00:00")
          ESPN_AWAY = {"carolina panthers", "panthers", "car"}
          ESPN_HOME = {"atlanta falcons", "falcons", "atl"}

          def rows(value):
              if isinstance(value, dict):
                  return [x for x in value.values() if isinstance(x, dict)]
              if isinstance(value, list):
                  return [x for x in value if isinstance(x, dict)]
              return []

          def canon(value):
              return re.sub(r"[^a-z0-9]+", " ", str(value or "").lower()).strip()

          def parse_dt(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          def split_name(name):
              text = str(name or "").strip()
              for sep in (" @ ", " at ", " v ", " vs ", " vs. "):
                  if sep in text:
                      away, home = text.split(sep, 1)
                      return canon(away), canon(home), sep
              return None

          params = {
              "page": "SPORT",
              "eventTypeId": EVENT_TYPE_ID,
              "_ak": AK,
              "timezone": "America/Phoenix",
          }
          request = Request(
              f"{HOST}/api/content-managed-page?{urlencode(params)}",
              headers={"Accept": "application/json", "User-Agent": "kyre-sports-ai/nfl-game-totals-v1"},
          )
          with urlopen(request, timeout=20) as response:
              print(f"HTTP_STATUS={getattr(response, 'status', 200)}")
              payload = json.load(response)

          attachments = payload.get("attachments") or {}
          events = rows(attachments.get("events"))
          event_types = rows(attachments.get("eventTypes"))
          competitions = rows(attachments.get("competitions"))
          print(f"REQUESTED_EVENT_TYPE_ID={EVENT_TYPE_ID}")
          print(f"EVENT_COUNT={len(events)}")
          for row in event_types:
              print("EVENT_TYPE=" + json.dumps({
                  "eventTypeId": row.get("eventTypeId") or row.get("id"),
                  "name": row.get("name") or row.get("displayName"),
              }, sort_keys=True))

          nfl_competitions = []
          for row in competitions:
              blob = json.dumps(row, sort_keys=True).lower()
              if "nfl" in blob or "national football" in blob:
                  nfl_competitions.append(row)
          print(f"NFL_COMPETITION_COUNT={len(nfl_competitions)}")
          for row in nfl_competitions[:20]:
              print("NFL_COMPETITION=" + json.dumps({
                  "id": row.get("competitionId") or row.get("id"),
                  "name": row.get("name") or row.get("competitionName") or row.get("displayName"),
                  "eventTypeId": row.get("eventTypeId"),
              }, sort_keys=True))

          relevant = []
          exact = []
          for row in events:
              name = str(row.get("name") or "")
              lower = name.lower()
              kickoff_raw = row.get("openDate") or row.get("startDate")
              kickoff = parse_dt(kickoff_raw)
              event_id = row.get("eventId") or row.get("id")
              if any(token in lower for token in ("panther", "falcon", "carolina", "atlanta")):
                  relevant.append(row)
              split = split_name(name)
              if split and kickoff:
                  away, home, sep = split
                  delta = abs((kickoff - TARGET_KICKOFF).total_seconds())
                  if away in ESPN_AWAY and home in ESPN_HOME and delta <= 300:
                      exact.append((row, delta, sep))

          print(f"TEAM_SUBSTRING_ROWS={len(relevant)}")
          for row in relevant[:20]:
              print("RELEVANT_ROW=" + json.dumps({
                  "name": row.get("name"),
                  "event_id": str(row.get("eventId") or row.get("id")),
                  "openDate": row.get("openDate"),
                  "startDate": row.get("startDate"),
                  "eventTypeId": row.get("eventTypeId"),
                  "competitionId": row.get("competitionId"),
              }, sort_keys=True))

          print(f"EXACT_CANDIDATE_COUNT={len(exact)}")
          for row, delta, sep in exact:
              print("EXACT_CANDIDATE=" + json.dumps({
                  "name": row.get("name"),
                  "event_id": str(row.get("eventId") or row.get("id")),
                  "kickoff": row.get("openDate") or row.get("startDate"),
                  "kickoff_delta_seconds": delta,
                  "separator": sep,
              }, sort_keys=True))

          assert any(
              str((row.get("name") or row.get("displayName") or "")).lower().find("football") >= 0
              for row in event_types
          ), "FanDuel did not identify eventTypeId 6423 as football"
          assert len(exact) == 1, f"expected one Panthers-Falcons exact candidate, got {len(exact)}"
          PY
