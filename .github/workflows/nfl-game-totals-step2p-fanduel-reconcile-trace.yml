name: NFL Game Totals Step 2P FanDuel Reconcile Trace

on:
  push:
    branches:
      - monster/nfl-game-totals-step2p-fanduel-reconcile-trace
    paths:
      - .github/workflows/nfl-game-totals-step2p-fanduel-reconcile-trace.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-fanduel-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Discover FanDuel NFL event type and competition identity
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          HOST = "https://sbapi.az.sportsbook.fanduel.com"
          AK = "FhMFpcPWXMeyZxOx"
          CURRENT_EVENT_TYPE_ID = "7522"
          TARGET_KICKOFF = datetime.fromisoformat("2026-09-20T17:00:00+00:00")

          def rows(value):
              if isinstance(value, dict):
                  return [x for x in value.values() if isinstance(x, dict)]
              if isinstance(value, list):
                  return [x for x in value if isinstance(x, dict)]
              return []

          def parse_dt(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          params = {
              "page": "SPORT",
              "eventTypeId": CURRENT_EVENT_TYPE_ID,
              "_ak": AK,
              "timezone": "America/Phoenix",
          }
          request = Request(
              f"{HOST}/api/content-managed-page?{urlencode(params)}",
              headers={"Accept": "application/json", "User-Agent": "kyre-sports-ai/nfl-game-totals-v1"},
          )
          with urlopen(request, timeout=20) as response:
              print(f"HTTP_STATUS={getattr(response, 'status', 200)}")
              payload = json.load(response)

          attachments = payload.get("attachments") or {}
          events = rows(attachments.get("events"))
          event_types = rows(attachments.get("eventTypes"))
          competitions = rows(attachments.get("competitions"))

          print(f"CURRENT_EVENT_TYPE_ID={CURRENT_EVENT_TYPE_ID}")
          print(f"EVENT_COUNT={len(events)}")
          print(f"EVENT_TYPE_COUNT={len(event_types)}")
          print(f"COMPETITION_COUNT={len(competitions)}")

          counts = Counter(str(e.get("eventTypeId")) for e in events if e.get("eventTypeId") is not None)
          print("EVENT_TYPE_COUNTS=" + json.dumps(dict(sorted(counts.items())), sort_keys=True))

          def compact(row):
              keep = (
                  "eventTypeId", "id", "name", "displayName", "shortDisplayName",
                  "competitionId", "competitionName", "openDate", "startDate",
                  "sport", "sportName", "region", "regionName"
              )
              return {k: row.get(k) for k in keep if k in row}

          football_types = []
          for row in event_types:
              blob = json.dumps(row, sort_keys=True).lower()
              if "nfl" in blob or "football" in blob:
                  football_types.append(row)
          print(f"FOOTBALL_EVENT_TYPES={len(football_types)}")
          for row in football_types[:30]:
              print("FOOTBALL_EVENT_TYPE=" + json.dumps(compact(row), sort_keys=True))

          football_competitions = []
          for row in competitions:
              blob = json.dumps(row, sort_keys=True).lower()
              if any(token in blob for token in ("nfl", "football", "national football")):
                  football_competitions.append(row)
          print(f"FOOTBALL_COMPETITIONS={len(football_competitions)}")
          for row in football_competitions[:40]:
              print("FOOTBALL_COMPETITION=" + json.dumps(compact(row), sort_keys=True))

          same_day = []
          for row in events:
              kickoff_raw = row.get("openDate") or row.get("startDate")
              kickoff = parse_dt(kickoff_raw)
              if kickoff and kickoff.date() == TARGET_KICKOFF.date():
                  same_day.append(row)
          print(f"TARGET_DAY_EVENTS={len(same_day)}")
          for row in same_day[:40]:
              print("TARGET_DAY_EVENT=" + json.dumps(compact(row), sort_keys=True))

          if not football_types:
              print("EVENT_TYPES_SAMPLE_BEGIN")
              for row in event_types[:30]:
                  print("EVENT_TYPE_SAMPLE=" + json.dumps(compact(row), sort_keys=True))
              print("EVENT_TYPES_SAMPLE_END")
          PY
