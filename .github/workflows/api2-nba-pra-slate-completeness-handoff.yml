name: API2 NBA PRA slate completeness handoff

on:
  push:
    branches:
      - api2-nba-pra-slate-completeness-v1
    paths:
      - .github/workflows/api2-nba-pra-slate-completeness-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct completed candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat devsystem/.handoff/api2-nba-pra-slate-completeness-v1/part*.b64 > /tmp/candidate.b64
          test "$(wc -c < /tmp/candidate.b64)" = "22872"
          base64 -d /tmp/candidate.b64 > /tmp/candidate.gz
          python - <<'PY'
          from pathlib import Path
          import zlib
          raw = Path('/tmp/candidate.gz').read_bytes()
          dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
          patch = dec.decompress(raw)
          marker = b'diff --git a/tests/test_api2_nba_pra_slate_completeness_v1.py b/tests/test_api2_nba_pra_slate_completeness_v1.py'
          idx = patch.find(marker)
          if idx <= 0:
              raise SystemExit('FINAL_TEST_MARKER_NOT_FOUND')
          Path('/tmp/trimmed.patch').write_bytes(patch[:idx])
          PY
          git apply --index /tmp/trimmed.patch

      - name: Add compact final slate contract test
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_api2_nba_pra_slate_completeness_v1.py <<'PY'
          from datetime import date

          from nba_pra_page1_model_v1 import grade_market
          from nba_pra_team_identity_v1 import resolve_nba_team_logo
          from runless_v2.nba_pra_player_context_v1 import (
              NbaPraPlayerContextRequest,
              _parse_cbs_roster_html,
          )


          def test_official_nba_logo_path_is_complete_and_non_espn():
              logo = resolve_nba_team_logo("PHX")
              assert logo == "https://cdn.nba.com/logos/nba/1610612756/global/L/logo.svg"
              assert "espn" not in logo.casefold()
              assert resolve_nba_team_logo("UNKNOWN") is None


          def test_cbs_roster_identity_fallback_builds_player_card_fields():
              document = '''
              <table><tbody><tr class="TableBase-bodyTr">
                <td>13</td>
                <td><span class="CellPlayerName--long"><a href="/nba/players/2844706/bam-adebayo/">Bam Adebayo</a></span></td>
                <td>PF</td><td>6-9</td><td>255</td>
              </tr></tbody></table>
              '''
              row = _parse_cbs_roster_html(document, "MIA")["bamadebayo"]
              assert row["team"] == "MIA"
              assert row["position"] == "PF"
              assert row["provider_ids"]["cbs_sports"] == "2844706"
              assert row["headshot"] == "https://sportshub.cbsistatic.com/i/sports/player/headshot/2844706.png?width=160"
              assert row["stats_source"] == "CBS Sports roster verification"


          def test_player_context_contract_accepts_full_121_player_slate():
              request = NbaPraPlayerContextRequest(
                  date=date(2026, 10, 21),
                  player_names=[f"Player {i}" for i in range(121)],
                  team_codes=["MIA", "LAL"],
              )
              assert len(request.player_names) == 121
              assert request.team_codes == ["MIA", "LAL"]


          def test_edge_remains_available_without_fabricating_probability():
              grade = grade_market(21.3, 17.5, None)
              assert grade["edge"] == 3.8
              assert grade["over_probability"] is None
              assert grade["lean"] == "PASS"
              assert grade["confidence"] == "UNAVAILABLE"
          PY
          git add tests/test_api2_nba_pra_slate_completeness_v1.py

      - name: Verify exact transferred blobs and provider bans
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2"; }
          check_blob devsystem/execution_plans/api2-nba-pra-slate-completeness-v1.json 5e4b0aba37e84f24e065a0610dfba3d4720849b1
          check_blob devsystem/runless_proof_plans/api2-nba-pra-slate-completeness-v1.json 567d82c4593f590578e07f7826405d191eab561b
          check_blob devsystem/task_ledgers/api2-nba-pra-slate-completeness-v1.json 9f8b97463d6611042a531677ac4e101baa4414e5
          check_blob docs/superpowers/plans/2026-10-21-nba-pra-slate-completeness-v1.md 720059c96c878850aa9517c60f1dc965b4e549c7
          check_blob nba_pra_page1_api_only_v1.py fed22da146591dd421326cc95ebcc1f6538f09dd
          check_blob nba_pra_page1_model_v1.py 282a6b87ecd326bb1e3da91dafbe194037a8ab32
          check_blob nba_pra_page1_ui_v2.py d7877560331d14ac1a89a35558ee47932c1c03f7
          check_blob nba_pra_page1_v2.py 273376aa7be460ea494fabe57814c898f751ac68
          check_blob nba_pra_player_context_api_v1.py 8ee6473cc9db9d69cd9db8909aad786314755604
          check_blob nba_pra_team_identity_v1.py d25a105f57f14eb9d8ddc1b801e385d41bc3eaa1
          check_blob runless_v2/nba_pra_player_context_v1.py 0a5c4fe348bc25d9563634f8f0514f3e11d7dabb
          check_blob runless_v2/nba_pra_schedule_v1.py eeb3d2281481c96be9774d9ea9bcd3ea81bf5ebe
          check_blob tests/test_api2_nba_pra_model_behavior_v1.py 5f122c6b3675baebbcedf2a1b41ab7dc303db388
          check_blob tests/test_api2_nba_pra_page1_hard_analytics_ui_v1.py d2de6fea1837e215d6bde9bc690509cb66d32091
          check_blob tests/test_api2_nba_pra_page1_s_tier_ui_v1.py dbda8bee393bff6f5514f389d0ec5de75a78b78c
          check_blob tests/test_api2_nba_pra_page1_v2_ui_contract.py a2ecb85c22ae61535b94135efae8801871ebf168

          active=(
            nba_pra_page1_api_only_v1.py
            nba_pra_page1_model_v1.py
            nba_pra_page1_ui_v2.py
            nba_pra_page1_v2.py
            nba_pra_player_context_api_v1.py
            nba_pra_team_identity_v1.py
            runless_v2/nba_pra_player_context_v1.py
            runless_v2/nba_pra_schedule_v1.py
            runless_v2/nba_pra_market_v1.py
          )
          if grep -RniEi 'sportsgameodds|espn bet|a\.espncdn\.com|site\.api\.espn|site\.web\.api\.espn' "${active[@]}"; then exit 17; fi
          if grep -RniE '(^|[^[:alnum:]_])sgo([^[:alnum:]_]|$)' "${active[@]}"; then exit 18; fi

      - name: Remove transport artifacts and publish one clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -r devsystem/.handoff/api2-nba-pra-slate-completeness-v1
          git rm .github/workflows/api2-nba-pra-slate-completeness-handoff.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete NBA PRA slate identity and timing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
