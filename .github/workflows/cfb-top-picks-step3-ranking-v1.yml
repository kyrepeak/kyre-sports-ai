name: CFB Top Picks Step 3 ranking

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-step3-ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step3-ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime requirements
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 3 owners
        run: |
          python -m py_compile cfb_top_picks_market_context_v1.py
          python -m py_compile cfb_top_picks_engine_v1.py
          python -m py_compile cfb_top_picks_page_v3.py
          python -m py_compile streamlit_memory_lazy_router_v243.py
      - name: Step 3 ranking contract
        run: python -m pytest -q tests/test_cfb_top_picks_step3_ranking_v1.py
