name: CFB Game Total V164 production logo verification

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "streamlit_memory_lazy_router_v160.py"
      - "cfb_game_total_clean_page_v15.py"
      - "cfb_game_total_step1_identity_v1.py"
      - "cfb_game_total_team_logo_identity_v1.py"
      - "devsystem/production_verify_v164_logos.py"
      - "tests/test_devsystem_production_verify_v164_logos.py"
      - ".github/workflows/cfb-game-total-v164-production-logos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v164-production-logos
  cancel-in-progress: true

jobs:
  verify-v164-production-logos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V164 production proof
        run: |
          python -m py_compile cfb_game_total_clean_page_v15.py
          python -m py_compile cfb_game_total_step1_identity_v1.py
          python -m py_compile cfb_game_total_team_logo_identity_v1.py
          python -m py_compile streamlit_memory_lazy_router_v160.py
          python -m py_compile devsystem/production_verify_v164_logos.py

      - name: Self-test V164 production logo contract
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_game_total_v164_team_logos.py \
            tests/test_cfb_game_total_step1_identity_v1.py \
            tests/test_devsystem_production_verify_v164_logos.py

      - name: Verify live V164 exact team logos
        run: |
          python -m devsystem.production_verify_v164_logos \
            --artifact-dir artifacts/production-v164-logos

      - name: Upload V164 production logo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v164-production-logos-${{ github.run_id }}
          path: artifacts/production-v164-logos
          if-no-files-found: warn
          retention-days: 14
