name: CFB Step 4 production regression

on:
  push:
    branches:
      - cfb-step4-production-regression
    paths:
      - '.github/workflows/cfb-step4-production-regression.yml'

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: c51ad11d79cc08402ddf982f64ee283e27517f6a
  STREAMLIT_URL: https://kyre-sports-ai.streamlit.app
  API_BASE_URL: https://kyre-sports-api.onrender.com
  TARGET_DATE: "2026-09-10"
  TARGET_GAME_ID: "401858213"

jobs:
  production-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout regression branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove isolated witness over exact Step 4 main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)"
          echo "Changed paths from certified Step 4 main:"
          echo "$changed"
          count="$(echo "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" = "1"
          test "$changed" = ".github/workflows/cfb-step4-production-regression.yml"
          grep -F 'STREAMLIT_MAIN_V58_CFB_OU_LIVE_ODDS_2026-09-09T22:58Z' app.py
          grep -F 'streamlit_memory_lazy_router_v58' app.py
          echo 'CFB_STEP4_MAIN_SOURCE_HEARTBEAT_GREEN'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused production-regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Validate live production CFB odds contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import requests

          base = os.environ["API_BASE_URL"].rstrip("/")
          day = os.environ["TARGET_DATE"]
          target_game_id = os.environ["TARGET_GAME_ID"]
          headers = {
              "Accept": "application/json",
              "User-Agent": "KyreSportsAI-CFB-Step4-Prod-Regress/1.2",
              "Cache-Control": "no-cache",
          }

          payload = None
          last = None
          for attempt in range(1, 4):
              try:
                  response = requests.get(
                      base + "/api/v1/cfb/odds",
                      params={"game_date": day, "sportsbook": "FanDuel"},
                      timeout=60,
                      headers=headers,
                  )
                  response.raise_for_status()
                  payload = response.json()
                  break
              except Exception as exc:
                  last = exc
                  print("CFB_STEP4_API_ATTEMPT_FAILED", attempt, type(exc).__name__, str(exc))
                  if attempt < 3:
                      time.sleep(5)
          if payload is None:
              raise SystemExit("CFB_STEP4_PRODUCTION_API_UNREACHABLE: " + str(last))

          assert int(payload.get("step") or 0) == 3
          assert payload.get("schema_version") == "cfb_odds_v1"
          diagnostics = payload.get("diagnostics") or {}
          semantics = payload.get("market_semantics") or {}
          assert diagnostics.get("complete_identity_coverage") is True
          assert int(diagnostics.get("unmatched_market_rows") or 0) == 0
          assert diagnostics.get("synthetic_official_ids") is False
          assert diagnostics.get("fuzzy_matching") is False
          assert float(semantics.get("projection_weight")) == 0.0
          assert semantics.get("market_context_only") is True
          assert semantics.get("may_modify_projection") is False

          games = payload.get("games") or []
          target = next((g for g in games if str(g.get("game_id")) == target_game_id), None)
          assert target is not None
          assert target.get("identity_verified") is True
          assert target.get("market_type") == "game_total"
          assert str(target.get("sportsbook") or "").casefold() == "fanduel"
          total = float(target.get("total"))
          assert 20.0 <= total <= 100.0

          print("CFB_STEP4_PRODUCTION_API_GREEN")
          print(json.dumps({
              "http": response.status_code,
              "game_count": len(games),
              "target_game_id": target_game_id,
              "target_matchup": str(target.get("away_team")) + " @ " + str(target.get("home_team")),
              "target_total": total,
              "projection_weight": semantics.get("projection_weight"),
              "complete_identity_coverage": diagnostics.get("complete_identity_coverage"),
              "fuzzy_matching": diagnostics.get("fuzzy_matching"),
              "synthetic_official_ids": diagnostics.get("synthetic_official_ids"),
          }, indent=2))
          PY

      - name: Verify production Streamlit transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import requests

          root = os.environ["STREAMLIT_URL"].rstrip("/")
          session = requests.Session()
          session.headers.update({"User-Agent": "KyreSportsAI-CFB-Step4-Streamlit-Prod-Regress/1.2"})

          def fetch(url, label):
              last = None
              for attempt in range(1, 4):
                  try:
                      r = session.get(url, timeout=60, allow_redirects=True)
                      r.raise_for_status()
                      return r
                  except Exception as exc:
                      last = exc
                      print(label + "_ATTEMPT_FAILED", attempt, type(exc).__name__, str(exc))
                      if attempt < 3:
                          time.sleep(5)
              raise SystemExit(label + "_FAILED: " + str(last))

          root_response = fetch(root + "/", "CFB_STEP4_STREAMLIT_ROOT")
          health_response = fetch(root + "/_stcore/health", "CFB_STEP4_STREAMLIT_HEALTH")

          assert root_response.status_code == 200
          assert health_response.status_code == 200
          assert "<html" in root_response.text.lower()
          assert "streamlit" in root_response.text.lower()
          print("CFB_STEP4_STREAMLIT_TRANSPORT_GREEN")
          print("ROOT_HTTP", root_response.status_code)
          print("HEALTH_HTTP", health_response.status_code)
          PY

      - name: Browser-verify deployed Clean Page V18 and live FanDuel total
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import requests
          from playwright.sync_api import sync_playwright

          streamlit_url = os.environ["STREAMLIT_URL"].rstrip("/")
          api_url = os.environ["API_BASE_URL"].rstrip("/") + "/api/v1/cfb/odds"
          day = os.environ["TARGET_DATE"]
          target_game_id = os.environ["TARGET_GAME_ID"]

          api = requests.get(
              api_url,
              params={"game_date": day, "sportsbook": "FanDuel"},
              timeout=60,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "KyreSportsAI-CFB-Step4-Browser-Regress/1.3",
                  "Cache-Control": "no-cache",
              },
          )
          api.raise_for_status()
          payload = api.json()
          target = next(g for g in payload["games"] if str(g.get("game_id")) == target_game_id)
          expected_total = float(target["total"])

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage", "--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1440, "height": 1400})
              page.goto(streamlit_url + "/", wait_until="domcontentloaded", timeout=120000)

              app_frame = None
              for attempt in range(1, 9):
                  page.wait_for_timeout(5000)
                  print("CFB_STEP4_FRAME_SCAN", attempt, "frames", len(page.frames))
                  for idx, frame in enumerate(page.frames):
                      try:
                          frame_body = frame.locator("body").inner_text(timeout=10000)
                      except Exception as exc:
                          frame_body = ""
                          print("FRAME_BODY_ERROR", idx, type(exc).__name__, str(exc))
                      try:
                          combos = frame.get_by_role("combobox").count()
                      except Exception:
                          combos = 0
                      print("FRAME", idx, "URL", frame.url)
                      print("FRAME", idx, "COMBOBOXES", combos)
                      print("FRAME", idx, "BODY_START", repr(frame_body[:2500]))

                      lower = frame_body.lower()
                      if "get this app back up" in lower:
                          wake = frame.get_by_text("Yes, get this app back up!", exact=False)
                          if wake.count() > 0:
                              print("CFB_STEP4_STREAMLIT_WAKE_CLICK", idx)
                              wake.click()
                              page.wait_for_timeout(10000)

                      if combos >= 1:
                          app_frame = frame
                          break

                  if app_frame is not None:
                      break
                  if attempt in (3, 6):
                      page.reload(wait_until="domcontentloaded", timeout=120000)

              if app_frame is None:
                  print("CFB_STEP4_BROWSER_FINAL_PAGE_HTML", page.content()[:12000])
                  print("CFB_STEP4_BROWSER_IFRAMES", page.locator("iframe").count())
                  raise SystemExit("CFB_STEP4_STREAMLIT_APP_FRAME_NOT_READY")

              print("CFB_STEP4_APP_FRAME_FOUND", app_frame.url)
              combos = app_frame.get_by_role("combobox")
              combos.nth(0).click()
              page.keyboard.type("College Football")
              page.keyboard.press("Enter")
              page.wait_for_timeout(5000)

              combos = app_frame.get_by_role("combobox")
              print("CFB_STEP4_COMBOBOX_COUNT_AFTER_SPORT", combos.count())
              if combos.count() < 2:
                  raise SystemExit("CFB_STEP4_CFB_MARKET_COMBOBOX_MISSING")
              combos.nth(1).click()
              page.keyboard.type("Over/Under")
              page.keyboard.press("Enter")
              page.wait_for_timeout(7000)

              date_input = app_frame.locator('[data-testid="stDateInput"] input').first
              if date_input.count() == 0:
                  print("CFB_STEP4_APP_BODY_NO_DATE", app_frame.locator("body").inner_text()[:10000])
                  raise SystemExit("CFB_STEP4_DATE_INPUT_MISSING")
              print("CFB_STEP4_DATE_BEFORE", date_input.input_value())
              date_input.fill(day, force=True)
              date_input.dispatch_event("change")
              page.wait_for_timeout(12000)
              print("CFB_STEP4_DATE_AFTER", date_input.input_value())

              body = app_frame.locator("body").inner_text()
              print("CFB_STEP4_BROWSER_FINAL_BODY", body[:20000])

              required = [
                  "CFB O/U • CLEAN PAGE V18 ACTIVE • LIVE ODDS CONNECTED • FROZEN PROJECTION MATH PRESERVED",
                  "LIVE CFB ODDS API CONNECTED",
                  "LIVE FANDUEL GAME TOTAL",
                  "market projection weight 0%",
              ]
              missing = [item for item in required if item not in body]
              if missing:
                  raise SystemExit("CFB_STEP4_DEPLOYED_V18_TEXT_MISSING: " + " | ".join(missing))

              expected = format(expected_total, ".1f")
              if expected not in body:
                  raise SystemExit("CFB_STEP4_LIVE_TOTAL_MISMATCH: expected visible " + expected)

              print("CFB_STEP4_DEPLOYED_STREAMLIT_V18_GREEN")
              print(json.dumps({
                  "streamlit_url": streamlit_url,
                  "app_frame_url": app_frame.url,
                  "clean_page": "V18",
                  "target_game_id": target_game_id,
                  "target_total_api": expected_total,
                  "target_total_visible": expected,
                  "projection_weight_visible": "0%",
                  "live_api_connected_visible": True,
              }, indent=2))
              browser.close()
          PY

      - name: Final Step 4 production marker
        run: |
          echo 'CFB_STEP4_PRODUCTION_REGRESSION_GREEN'
          echo 'CFB_STEP4_COMPLETE'
