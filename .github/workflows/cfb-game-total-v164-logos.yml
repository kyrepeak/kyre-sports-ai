name: CFB Game Total V164 exact team logos

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "streamlit_memory_lazy_router_v160.py"
      - "cfb_game_total_clean_page_v15.py"
      - "cfb_game_total_step1_identity_v1.py"
      - "cfb_game_total_step1_profile_v1.py"
      - "cfb_game_total_step2_profile_v1.py"
      - "cfb_game_total_team_logo_identity_v1.py"
      - "devsystem/cfb_game_total_logo_browser_qa_v1.py"
      - "tests/test_cfb_game_total_v164_team_logos.py"
      - ".github/workflows/cfb-game-total-v164-logos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v164-logos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-v164-team-logos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V164 logo surface
        run: |
          python -m py_compile app.py
          python -m py_compile streamlit_memory_lazy_router_v160.py
          python -m py_compile cfb_game_total_clean_page_v15.py
          python -m py_compile cfb_game_total_step1_identity_v1.py
          python -m py_compile cfb_game_total_step1_profile_v1.py
          python -m py_compile cfb_game_total_step2_profile_v1.py
          python -m py_compile cfb_game_total_team_logo_identity_v1.py
          python -m py_compile devsystem/cfb_game_total_logo_browser_qa_v1.py
          python -m py_compile devsystem/production_verify_v164_logos.py

      - name: Run focused V164 contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_game_total_v164_team_logos.py \
            tests/test_cfb_game_total_step1_identity_v1.py \
            tests/test_cfb_game_total_step1_profile_v1.py \
            tests/test_cfb_game_total_step2_profile_v1.py \
            tests/test_devsystem_production_verify_v164_logos.py

      - name: Start real production entrypoint locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-v164-logos
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-v164-logos/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v164_logo_pid

      - name: Certify exact ESPN logos in header and team evidence
        run: |
          python -m devsystem.cfb_game_total_logo_browser_qa_v1 \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-v164-logos

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 600 artifacts/cfb-game-total-v164-logos/streamlit.log || true

      - name: Upload V164 logo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v164-logos-${{ github.run_id }}
          path: artifacts/cfb-game-total-v164-logos
          if-no-files-found: warn
          retention-days: 14

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v164_logo_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v164_logo_pid)" 2>/dev/null || true
          fi
