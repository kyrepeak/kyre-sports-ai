name: API2 NBA PRA Page 2 Command Center V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "nba_pra_page2_command_center_v1.py"
      - "nba_pra_page2_sync_v1.py"
      - "tests/test_api2_nba_pra_page2_command_center_v1.py"
      - "tests/test_api2_nba_pra_page2_command_center_activation_v1.py"
      - "tests/test_api2_nba_pra_page2_insights_v1.py"
      - "tests/test_api2_nba_pra_page2_s_tier_v2.py"
      - "tests/test_api2_nba_pra_page2_ui_v1.py"
      - "tests/test_api2_nba_pra_page2_source_guard_v2.py"
      - "tests/test_api2_nba_pra_page1_page2_sync_v1.py"
      - "tests/test_api2_nba_pra_page2_integration_v1.py"
      - "devsystem/runless_proof_plans/api2-nba-pra-page2-command-center-v1.json"
      - "devsystem/task_ledgers/api2-nba-pra-page2-command-center-v1.json"
      - "docs/superpowers/specs/2026-10-25-nba-pra-page2-s-tier-command-center-v1-design.md"
      - "docs/superpowers/plans/2026-10-25-nba-pra-page2-s-tier-command-center-v1.md"
      - ".github/workflows/api2-nba-pra-page2-command-center-v1.yml"

jobs:
  command-center-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests httpx fastapi pyjwt pandas numpy streamlit
      - name: Run Page 2 command-center regressions
        run: >-
          python -m pytest --noconftest -q
          tests/test_api2_nba_pra_page2_command_center_v1.py
          tests/test_api2_nba_pra_page2_command_center_activation_v1.py
          tests/test_api2_nba_pra_page2_insights_v1.py
          tests/test_api2_nba_pra_page2_s_tier_v2.py
          tests/test_api2_nba_pra_page2_ui_v1.py
          tests/test_api2_nba_pra_page2_source_guard_v2.py
          tests/test_api2_nba_pra_page1_page2_sync_v1.py
          tests/test_api2_nba_pra_page2_integration_v1.py
      - name: Compile Page 2 command center
        run: python -m py_compile nba_pra_page2_command_center_v1.py nba_pra_page2_sync_v1.py
