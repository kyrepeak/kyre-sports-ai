name: CFB Game Total V185 Step 6 visual parity

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_step6_visual_v2.py"
      - "cfb_game_total_clean_page_v19.py"
      - "streamlit_memory_lazy_router_v164.py"
      - "app.py"
      - "tests/test_cfb_game_total_v185_step6_visual_parity.py"
      - "tests/test_cfb_game_total_v184_step6_scoring.py"
      - "tests/test_cfb_game_total_v168_step5_pace.py"
      - ".github/workflows/cfb-game-total-v185-step6-visual-parity.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_step6_visual_v2.py"
      - "cfb_game_total_clean_page_v19.py"
      - "streamlit_memory_lazy_router_v164.py"
      - "app.py"
      - "tests/test_cfb_game_total_v185_step6_visual_parity.py"
      - ".github/workflows/cfb-game-total-v185-step6-visual-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-game-total-v185-step6-visual-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-v185-step6-visual-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile V185 additive surface
        run: |
          python -m py_compile \
            cfb_game_total_step6_visual_v2.py \
            cfb_game_total_clean_page_v19.py \
            streamlit_memory_lazy_router_v164.py \
            app.py

      - name: Prove V185 visual and frozen V184/V168 contracts
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_cfb_game_total_v185_step6_visual_parity.py \
            tests/test_cfb_game_total_v184_step6_scoring.py \
            tests/test_cfb_game_total_v168_step5_pace.py

      - name: Start real Streamlit entrypoint locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cfb-game-total-v185-step6
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/cfb-game-total-v185-step6/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_game_total_v185_step6_browser_pid

      - name: Run frozen V184 browser QA against V185 live surface
        run: |
          python -m devsystem.cfb_game_total_step6_browser_qa_v184 \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-game-total-v185-step6

      - name: Prove target visual geometry in Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlencode
          from devsystem import cfb_game_total_step6_browser_qa_v184 as qa
          from devsystem import cfb_game_total_browser_qa_v4 as selector

          query=urlencode({
              selector.ROUTE_QUERY_SPORT: selector.CFB_SPORT,
              selector.ROUTE_QUERY_MARKET: selector.GAME_TOTAL_MARKET,
              selector.DATE_QUERY_KEY: selector.CERT_DATE,
          })
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1067,"height":1536})
              page.goto("http://127.0.0.1:8501/?"+query,wait_until="domcontentloaded",timeout=120000)
              frame, body, _=qa._find_v184_frame(page)
              step6=frame.locator('details[data-testid="gt157-step-6"]').first
              parent=step6.locator("xpath=..").first
              panel_width=float(step6.evaluate("(el)=>el.getBoundingClientRect().width"))
              parent_width=float(parent.evaluate("(el)=>el.getBoundingClientRect().width"))
              if parent_width <= 0 or panel_width / parent_width < 0.94:
                  raise SystemExit(f"Step 6 is not full width: panel={panel_width} parent={parent_width}")
              if step6.locator(".gt185-s6-battlepair").count() != 2:
                  raise SystemExit("Expected exactly two V185 battle pairs")
              if step6.locator(".gt185-s6-panel.offense").count() != 2:
                  raise SystemExit("Expected two scoring-creation panels")
              if step6.locator(".gt185-s6-panel.defense").count() != 2:
                  raise SystemExit("Expected two scoring-prevention panels")
              if step6.locator('[data-testid="gt185-step6-defense-tile"]').count() != 12:
                  raise SystemExit("Expected 12 prevention tiles")
              if "CFB_GAME_TOTAL_STEP6_TARGET_MOCK_PARITY_ACTIVE" != (
                  step6.get_attribute("data-step6-visual-parity-marker") or ""
              ):
                  raise SystemExit("V185 target visual marker missing")
              page.screenshot(path="artifacts/cfb-game-total-v185-step6/v185-full-page.png",full_page=True)
              step6.screenshot(path="artifacts/cfb-game-total-v185-step6/v185-step6-target.png")
              print("CFB_GAME_TOTAL_V185_STEP6_VISUAL_PARITY_GREEN")
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 700 artifacts/cfb-game-total-v185-step6/streamlit.log || true

      - name: Upload V185 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-game-total-v185-step6-visual-parity-${{ github.run_id }}
          path: artifacts/cfb-game-total-v185-step6
          if-no-files-found: warn
          retention-days: 14

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cfb_game_total_v185_step6_browser_pid ]; then
            kill "$(cat /tmp/cfb_game_total_v185_step6_browser_pid)" 2>/dev/null || true
          fi
