name: WNBA Step19A failing historical substitution inspection

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e676f4cbfb64dee64bf73f2dbd8034162d69922e
          fetch-depth: 1
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Inspect box roster and raw/normalized substitution identity semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from sports_api import wnba_step7g_first_party_history as fp
          from sports_api.wnba_live_game import _normalize_action

          game_id='1022600265'; season=2026
          box=fp.get_first_party_game_box_score_dataset(game_id,season)
          for side in ('away','home'):
              team=box[side]
              roster=[]
              for p in team.get('players') or []:
                  roster.append({k:p.get(k) for k in ('player_id','full_name','first_name','last_name','name_initial','is_starter')})
              print('BOX_TEAM',side,team.get('team_key'),team.get('team_full_name'))
              print('BOX_ROSTER',side,json.dumps(roster,sort_keys=True,ensure_ascii=False))

          props, game, retrieved, cache_hit, ttl, url = fp._game_page(game_id,ttl_seconds=fp.PLAY_BY_PLAY_CACHE_TTL_SECONDS)
          raw_surface=props.get('playByPlay')
          raw_actions=fp._extract_action_rows(raw_surface)
          print('RAW_ACTION_COUNT',len(raw_actions),'SOURCE_URL',url)
          rows=[]
          for raw in raw_actions:
              desc=str(raw.get('description') or '').strip()
              action_type=str(raw.get('actionType') or raw.get('action_type') or '')
              if 'SUB:' not in desc.upper() and 'substitut' not in action_type.casefold():
                  continue
              normalized=_normalize_action(raw,season)
              raw_identity={k:raw.get(k) for k in (
                  'actionNumber','actionId','actionType','subType','description','personId','person_id','playerId','player_id','personName','playerName','teamId','teamTricode','period','clock'
              ) if k in raw}
              norm_identity={k:normalized.get(k) for k in (
                  'action_number','action_id','event_category','description','person_id','person_name','team_key','team_tricode','period','clock','elapsed_game_seconds'
              )}
              rows.append({'raw':raw_identity,'normalized':norm_identity})
          print('SUBSTITUTION_IDENTITIES',json.dumps(rows,sort_keys=True,ensure_ascii=False,default=str))
          if not rows:
              raise SystemExit('No substitution source rows found for failing historical game')
          PY
