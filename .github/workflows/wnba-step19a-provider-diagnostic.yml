name: WNBA Step19A official minute precision diagnostic

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  inspect-minutes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 631ad9c3f065433557279c6eaa5eadd3b23d5aa3
          fetch-depth: 1
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Measure normalized and raw official player-minute totals
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from sports_api import wnba_step7g_first_party_history as fp
          game_id='1022600265'; season=2026
          box=fp.get_first_party_game_box_score_dataset(game_id,season)
          props,game,*_=fp._game_page(game_id,ttl_seconds=fp.BOX_SCORE_CACHE_TTL_SECONDS)
          raw_teams={'away':game.get('awayTeam') or {},'home':game.get('homeTeam') or {}}
          for side in ('away','home'):
              team=box[side]; rows=[]; total=0.0
              for p in team.get('players') or []:
                  minutes=(p.get('stats') or {}).get('minutes')
                  if minutes is not None:
                      total += float(minutes)
                  rows.append({'player_id':p.get('player_id'),'full_name':p.get('full_name'),'minutes':minutes})
              raw=raw_teams[side]
              raw_players=raw.get('players') if isinstance(raw,dict) else None
              raw_min=[]
              if isinstance(raw_players,list):
                  for p in raw_players:
                      if isinstance(p,dict):
                          stats=p.get('statistics') if isinstance(p.get('statistics'),dict) else (p.get('stats') if isinstance(p.get('stats'),dict) else {})
                          raw_min.append({'personId':p.get('personId') or p.get('playerId') or p.get('id'),'name':p.get('name') or p.get('nameI') or p.get('familyName'),'minutes_candidates':{k:stats.get(k) for k in ('minutes','minutesCalculated','MIN','min') if k in stats}})
              print('MINUTE_SIDE',side,json.dumps({'normalized_total_minutes':round(total,6),'normalized_total_seconds':round(total*60,3),'expected_seconds':12000.0,'delta_seconds':round(total*60-12000.0,3),'normalized_players':rows,'raw_players':raw_min},sort_keys=True,ensure_ascii=False,default=str))
          PY
