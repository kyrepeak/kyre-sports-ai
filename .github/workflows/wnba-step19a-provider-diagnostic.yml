name: WNBA Step19A historical rotation trace

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  trace-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e676f4cbfb64dee64bf73f2dbd8034162d69922e
          fetch-depth: 1
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Trace rotation game IDs through one live projection target
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          os.environ.update({
            'WNBA_STEP7G_FIRST_PARTY_ENABLED':'true',
            'WNBA_STEP8_PROJECTION_HANDOFF_ENABLED':'true','WNBA_STEP8_CORE_PROJECTION_ENABLED':'true','WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED':'true','WNBA_STEP8_MONTE_CARLO_ENABLED':'true',
            'WNBA_PRODUCTION_RUNTIME_ENABLED':'false','WNBA_BOARD_SCHEDULER_ENABLED':'false','WNBA_STEP12_SCHEDULER_ENABLED':'false','WNBA_KYRE_DIRECT_SYNC_ENABLED':'false','WNBA_KYRE_RECONCILED_SYNC_ENABLED':'false','WNBA_PERSISTENCE_ENABLED':'false','WNBA_SUPABASE_WRITE_ENABLED':'false','WNBA_WAGERING_ENABLED':'false'
          })
          import sports_api.wnba_step7g_first_party_integration as i
          i.install_step7g_first_party_integration()
          from sports_api import wnba_rotation_context as rot
          from sports_api import wnba_step8_projection_handoff as s8
          original=rot.get_game_rotation
          seen=[]
          def traced(game_id,season,**kwargs):
            print('ROTATION_ATTEMPT',game_id,season,flush=True)
            seen.append(str(game_id))
            try:
              out=original(game_id,season,**kwargs)
            except Exception as exc:
              print('ROTATION_FAILURE_GAME',game_id,type(exc).__name__,' '.join(str(exc).split())[:2000],flush=True)
              raise
            print('ROTATION_OK',game_id,flush=True)
            return out
          rot.get_game_rotation=traced
          try:
            s8.get_player_game_step8_projection_handoff(202664,'1022600295',env=os.environ)
          except Exception as exc:
            print('PROJECTION_HANDOFF_FAILED',type(exc).__name__,' '.join(str(exc).split())[:2500])
            print('ROTATION_GAMES_SEEN',seen)
            raise
          print('PROJECTION_HANDOFF_OK',seen)
          PY
