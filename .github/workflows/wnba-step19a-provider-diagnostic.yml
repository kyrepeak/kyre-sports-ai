name: WNBA Step19A substitution identity diagnostic

on:
  push:
    branches:
      - wnba-step19a-provider-diagnostic-20260829

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  diagnose-substitutions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e676f4cbfb64dee64bf73f2dbd8034162d69922e
          fetch-depth: 1
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt >/dev/null
      - name: Inspect official box roster and substitution identities
        run: |
          python - <<'PY'
          import json
          from sports_api.wnba_step7g_first_party_history import get_first_party_game_box_score_dataset,get_first_party_play_by_play_dataset
          game_id='1022600295'; season=2026
          box=get_first_party_game_box_score_dataset(game_id,season)
          pbp=get_first_party_play_by_play_dataset(game_id,season)
          for side in ('away','home'):
            team=box[side]
            print('TEAM',side,team.get('team_key'),team.get('team_full_name'))
            roster=[]
            for p in team.get('players') or []:
              roster.append({k:p.get(k) for k in ('player_id','full_name','first_name','last_name','name_initial')})
            print('ROSTER',side,json.dumps(roster,sort_keys=True,ensure_ascii=False))
          subs=[]
          for a in pbp.get('actions') or []:
            if a.get('event_category')=='substitution':
              subs.append({k:a.get(k) for k in ('action_number','period','clock','elapsed_game_seconds','team_key','person_id','person_name','description')})
          print('SUBSTITUTIONS',json.dumps(subs,sort_keys=True,ensure_ascii=False))
          PY
