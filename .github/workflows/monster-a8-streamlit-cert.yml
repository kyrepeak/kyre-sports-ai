name: Monster A8 Streamlit Cert

on:
  push:
    branches:
      - monster-a8-streamlit-telemetry-cert
  pull_request:
    branches:
      - main

jobs:
  a8-streamlit-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Prove A8 Streamlit telemetry contract
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_streamlit_telemetry_activation_probe_v1.py
