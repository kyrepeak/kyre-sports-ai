name: NFL Moneyline Visual Step 1

on:
  pull_request:
    paths:
      - 'app.py'
      - 'nfl_moneyline_hub_v14.py'
      - 'streamlit_memory_lazy_router_v197.py'
      - '.github/workflows/nfl-moneyline-visual-step1-v1.yml'
  workflow_dispatch:

jobs:
  visual-step1-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Step 1 layer
        run: |
          python -m py_compile nfl_moneyline_hub_v14.py streamlit_memory_lazy_router_v197.py app.py
      - name: Verify Step 1 frozen contract
        run: |
          python - <<'PY'
          from pathlib import Path
          v14 = Path("nfl_moneyline_hub_v14.py").read_text()
          router = Path("streamlit_memory_lazy_router_v197.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_moneyline_hub_v13"' in v14
          assert 'VISUAL_UPGRADE_STEP = 1' in v14
          assert 'PRESENTATION_ONLY = True' in v14
          assert 'MAY_MODIFY_PROJECTION = False' in v14
          assert 'SPORTSBOOK_MODEL_INFLUENCE = 0.0' in v14
          assert 'STAKE_SIZING_ENABLED = False' in v14
          assert 'MONTE_CARLO_SIMULATIONS = 5_000_000' in v14
          assert 'MONEYLINE_HUB = "nfl_moneyline_hub_v14"' in router
          assert 'from streamlit_memory_lazy_router_v197 import record_bootstrap_import_ms, render_app' in app

          banned = (
              "_build_final(",
              "_fit_calibration_model(",
              "_build_game_output(",
              "fetch_nfl_moneyline_markets(",
              "random.",
              "np.random",
          )
          for token in banned:
              assert token not in v14, f"Step 1 unexpectedly owns analytical token: {token}"

          print("NFL Moneyline visual Step 1 GREEN")
          PY

  public-production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Prove Step 1 on public Streamlit production
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          BASE = "https://kyre-sports-ai.streamlit.app"
          URL = BASE + "/?" + urlencode({
              "ks_nfl_sport": "NFL",
              "ks_nfl_market": "Moneyline",
          })
          required = ("NFL Moneyline", "Command Center", "PREGAME VERIFIED", "Slate date")
          forbidden = ("Matchup Board", "PREGAME ONLY")
          artifacts = Path("artifacts/nfl-moneyline-step1-public-proof")
          artifacts.mkdir(parents=True, exist_ok=True)
          deadline = time.time() + 480
          last = {}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1180, "height": 1600})

              while time.time() < deadline:
                  try:
                      page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                      page.wait_for_timeout(8000)
                  except Exception as exc:
                      last = {"navigation_error": type(exc).__name__}
                      time.sleep(15)
                      continue

                  scans = []
                  match = None
                  for index, frame in enumerate(page.frames):
                      try:
                          body = frame.locator("body").inner_text(timeout=5000)
                          style_count = frame.locator(
                              'style[data-nfl-moneyline-visual-step="1"]'
                          ).count()
                      except Exception:
                          body = ""
                          style_count = 0

                      scans.append({
                          "index": index,
                          "url": frame.url,
                          "body_start": body[:1200],
                          "step1_style_count": style_count,
                      })

                      if (
                          all(token in body for token in required)
                          and all(token not in body for token in forbidden)
                          and style_count >= 1
                      ):
                          match = {
                              "frame_index": index,
                              "frame_url": frame.url,
                              "step1_style_count": style_count,
                          }
                          break

                  last = {"public_url": page.url, "frames": scans}

                  if match:
                      page.screenshot(
                          path=str(artifacts / "nfl_moneyline_step1_public_green.png"),
                          full_page=True,
                      )
                      result = {
                          "status": "GREEN",
                          "public_url": page.url,
                          "frame_url": match["frame_url"],
                          "required_text": list(required),
                          "forbidden_text_absent": list(forbidden),
                          "step1_style_count": match["step1_style_count"],
                          "production_marker": 'data-nfl-moneyline-visual-step="1"',
                      }
                      (artifacts / "result.json").write_text(
                          json.dumps(result, indent=2), encoding="utf-8"
                      )
                      print("NFL_MONEYLINE_STEP1_PUBLIC_PRODUCTION_GREEN")
                      print(json.dumps(result, indent=2))
                      browser.close()
                      raise SystemExit(0)

                  time.sleep(15)

              page.screenshot(
                  path=str(artifacts / "nfl_moneyline_step1_public_failure.png"),
                  full_page=True,
              )
              (artifacts / "failure.json").write_text(
                  json.dumps(last, indent=2), encoding="utf-8"
              )
              browser.close()

          raise SystemExit("Step 1 public production proof timed out.")
          PY

      - name: Upload public proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-step1-public-proof-${{ github.run_id }}
          path: artifacts/nfl-moneyline-step1-public-proof
          if-no-files-found: error
          retention-days: 7

