name: NFL Moneyline Visual Step 1

on:
  push:
    branches: [proof/nfl-moneyline-step1-public-v1]
    paths:
      - '.github/workflows/nfl-moneyline-visual-step1-v1.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'nfl_moneyline_hub_v14.py'
      - 'streamlit_memory_lazy_router_v197.py'
      - '.github/workflows/nfl-moneyline-visual-step1-v1.yml'
  workflow_dispatch:

jobs:
  visual-step1-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Step 1 layer
        run: |
          python -m py_compile nfl_moneyline_hub_v14.py streamlit_memory_lazy_router_v197.py app.py
      - name: Verify Step 1 frozen contract
        run: |
          python - <<'PY'
          from pathlib import Path
          v14 = Path("nfl_moneyline_hub_v14.py").read_text()
          router = Path("streamlit_memory_lazy_router_v197.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_moneyline_hub_v13"' in v14
          assert 'VISUAL_UPGRADE_STEP = 1' in v14
          assert 'PRESENTATION_ONLY = True' in v14
          assert 'MAY_MODIFY_PROJECTION = False' in v14
          assert 'SPORTSBOOK_MODEL_INFLUENCE = 0.0' in v14
          assert 'STAKE_SIZING_ENABLED = False' in v14
          assert 'MONTE_CARLO_SIMULATIONS = 5_000_000' in v14
          assert 'MONEYLINE_HUB = "nfl_moneyline_hub_v14"' in router
          assert 'from streamlit_memory_lazy_router_v197 import record_bootstrap_import_ms, render_app' in app

          banned = (
              "_build_final(",
              "_fit_calibration_model(",
              "_build_game_output(",
              "fetch_nfl_moneyline_markets(",
              "random.",
              "np.random",
          )
          for token in banned:
              assert token not in v14, f"Step 1 unexpectedly owns analytical token: {token}"

          print("NFL Moneyline visual Step 1 GREEN")
          PY

  public-production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public NFL Moneyline Step 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base = "https://kyre-sports-ai.streamlit.app"
          artifacts = Path("artifacts/nfl-moneyline-step1-public")
          artifacts.mkdir(parents=True, exist_ok=True)

          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage", "--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1024, "height": 1366})
              try:
                  page.goto(base, wait_until="domcontentloaded", timeout=120000)

                  # Deployment-source probe: inspect only public app chrome/Fork
                  # metadata before entering the app frame.
                  try:
                      links = page.locator("a").evaluate_all(
                          """els => els.map(e => ({
                              text: (e.innerText || e.textContent || '').trim(),
                              href: e.href || ''
                          })).filter(x => x.text || x.href)"""
                      )
                  except Exception:
                      links = []
                  print("STREAMLIT_PUBLIC_TOP_LEVEL_LINKS=" + json.dumps(links))

                  try:
                      host_config = page.request.get(
                          base.rstrip("/") + "/_stcore/host-config",
                          timeout=15000,
                      )
                      print(
                          "STREAMLIT_PUBLIC_HOST_CONFIG="
                          + host_config.text()[:12000]
                      )
                  except Exception as exc:
                      print(
                          "STREAMLIT_PUBLIC_HOST_CONFIG_ERROR="
                          + type(exc).__name__
                      )

                  frame, initial_scan = _find_app_frame(page)

                  # Deterministic route selection: never certify whatever route
                  # happened to render first on the shared host.
                  _choose(page, frame, 0, "NFL")
                  nfl_market = frame.get_by_role(
                      "combobox", name="🎯 NFL Market", exact=True
                  )
                  nfl_market.wait_for(state="visible", timeout=60000)
                  _choose(page, frame, 1, "Moneyline")

                  # Streamlit Community Cloud may replace/rerun the app frame
                  # after a selectbox change. Reacquire it and prove route
                  # identity from the actual selected controls, not hero copy.
                  import time
                  deadline = time.time() + 60
                  last_identity = {}
                  while time.time() < deadline:
                      frame, _ = _find_app_frame(page)
                      combos = frame.get_by_role("combobox")
                      sport_value = ""
                      market_value = ""
                      try:
                          sport_value = combos.nth(0).input_value(timeout=3000)
                      except Exception:
                          try:
                              sport_value = combos.nth(0).inner_text(timeout=3000)
                          except Exception:
                              sport_value = ""
                      try:
                          market_box = frame.get_by_role(
                              "combobox", name="🎯 NFL Market", exact=True
                          )
                          market_value = market_box.input_value(timeout=3000)
                      except Exception:
                          try:
                              market_value = market_box.inner_text(timeout=3000)
                          except Exception:
                              market_value = ""
                      last_identity = {
                          "sport": str(sport_value).strip(),
                          "market": str(market_value).strip(),
                      }
                      if (
                          last_identity["sport"] == "NFL"
                          and last_identity["market"] == "Moneyline"
                      ):
                          break
                      page.wait_for_timeout(500)
                  else:
                      body = frame.locator("body").inner_text(timeout=5000)
                      raise BrowserQAFailure(
                          "ROUTE_TARGET_MISMATCH: expected NFL -> Moneyline; "
                          f"actual={last_identity!r}; body start={body[:1800]!r}"
                      )

                  # Route identity is now proven. Wait only for a Moneyline
                  # presentation terminal: V14 Step 1 or frozen legacy V9.
                  new_marker = frame.get_by_text(
                      "PREGAME VERIFIED", exact=False
                  ).first
                  legacy_marker = frame.get_by_text(
                      "PREGAME ONLY", exact=False
                  ).first
                  terminal = new_marker.or_(legacy_marker).first
                  try:
                      terminal.wait_for(state="visible", timeout=90000)
                  except Exception as exc:
                      body = frame.locator("body").inner_text(timeout=5000)
                      style_count = frame.locator(
                          'style[data-nfl-moneyline-visual-step="1"]'
                      ).count()
                      page.screenshot(
                          path=str(artifacts / "nfl_moneyline_step1_public_failure.png"),
                          full_page=True,
                      )
                      (artifacts / "failure.json").write_text(
                          json.dumps({
                              "failure": "MONEYLINE_RENDER",
                              "route": last_identity,
                              "body": body,
                              "step1_style_count": style_count,
                          }, indent=2),
                          encoding="utf-8",
                      )
                      raise BrowserQAFailure(
                          "MONEYLINE_RENDER: NFL -> Moneyline selected but no "
                          "new or legacy Moneyline presentation became visible; "
                          f"style_count={style_count}; body start={body[:1800]!r}"
                      ) from exc

                  body = frame.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(
                          f"MONEYLINE_RUNTIME: forbidden marker {forbidden}"
                      )

                  if "PREGAME ONLY" in body and "PREGAME VERIFIED" not in body:
                      raise BrowserQAFailure(
                          "MONEYLINE_STEP1_MARKER: legacy PREGAME ONLY presentation "
                          "is live; V14 Step 1 presentation is not active"
                      )

                  required = (
                      "NFL Moneyline",
                      "Command Center",
                      "PREGAME VERIFIED",
                      "Slate date",
                  )
                  missing = [marker for marker in required if marker not in body]
                  if missing:
                      raise BrowserQAFailure(
                          "MONEYLINE_STEP1_MARKER: missing " + " | ".join(missing)
                      )

                  style_count = frame.locator(
                      'style[data-nfl-moneyline-visual-step="1"]'
                  ).count()
                  if style_count < 1:
                      raise BrowserQAFailure(
                          "MONEYLINE_STEP1_MARKER: "
                          'data-nfl-moneyline-visual-step="1" absent'
                      )

                  # Existing controls must still be present and usable.
                  if nfl_market.count() != 1:
                      raise BrowserQAFailure(
                          "MONEYLINE_RENDER: NFL Market control missing"
                      )
                  date_control = frame.get_by_text("Slate date", exact=True)
                  if date_control.count() < 1:
                      raise BrowserQAFailure(
                          "MONEYLINE_RENDER: Slate date control missing"
                      )

                  result = {
                      "status": "GREEN",
                      "route": "NFL -> Moneyline",
                      "public_url": page.url,
                      "route_identity": "NFL Moneyline",
                      "step1_markers": list(required),
                      "step1_style_count": style_count,
                      "nfl_market_control": "present",
                      "slate_date_control": "present",
                      "initial_frame_scan_count": len(initial_scan),
                  }
                  (artifacts / "result.json").write_text(
                      json.dumps(result, indent=2), encoding="utf-8"
                  )
                  page.screenshot(
                      path=str(artifacts / "nfl_moneyline_step1_public_green.png"),
                      full_page=True,
                  )
                  print("NFL_MONEYLINE_STEP1_PUBLIC_PRODUCTION_GREEN")
                  print(json.dumps(result, indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload isolated Moneyline proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-step1-isolated-public-${{ github.run_id }}
          path: artifacts/nfl-moneyline-step1-public
          if-no-files-found: warn
          retention-days: 7
