name: Monster Speed V3 Step 6 Hot Cache

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.lock"
      - "devsystem/browser_requirements.lock"
      - "devsystem/monster_speed_v3_step6_hot_cache_v1.py"
      - "tests/test_monster_speed_v3_step6_hot_cache_v1.py"
      - "tests/test_devsystem_browser_cache_v1.py"
      - "devsystem/task_ledgers/monster-speed-v3-step6-hot-cache-v1.json"
      - ".github/workflows/devsystem-targeted-ci.yml"
      - ".github/workflows/devsystem-cache-seed-v1.yml"
      - ".github/workflows/devsystem-production-verification-v5.yml"
      - ".github/workflows/monster-speed-v3-step4-user-visible-contract-v1.yml"
      - ".github/workflows/monster-speed-v3-step6-hot-cache-v1.yml"
  push:
    branches: [main]
    paths:
      - "requirements.lock"
      - "devsystem/browser_requirements.lock"
      - "devsystem/monster_speed_v3_step6_hot_cache_v1.py"
      - "tests/test_monster_speed_v3_step6_hot_cache_v1.py"
      - "tests/test_devsystem_browser_cache_v1.py"
      - "devsystem/task_ledgers/monster-speed-v3-step6-hot-cache-v1.json"
      - ".github/workflows/devsystem-targeted-ci.yml"
      - ".github/workflows/devsystem-cache-seed-v1.yml"
      - ".github/workflows/devsystem-production-verification-v5.yml"
      - ".github/workflows/monster-speed-v3-step4-user-visible-contract-v1.yml"
      - ".github/workflows/monster-speed-v3-step6-hot-cache-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-speed-v3-step6-hot-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-hot-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent Step 6 contract
        run: python devsystem/monster_speed_v3_step6_hot_cache_v1.py
      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact-lock Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Build exact-lock Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          .venv-browser-qa/bin/python -m playwright install chromium
      - name: Activate exact-lock Browser QA stack
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Prove lock and cache contracts
        run: |
          python -m pip check
          python -m pytest -q             tests/test_monster_speed_v3_step6_hot_cache_v1.py             tests/test_devsystem_browser_cache_v1.py
          echo "MONSTER_SPEED_V3_STEP6_HOT_STACK_SEEDED_GREEN"

  hot-cache-proof:
    needs: seed-hot-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact same Browser QA stack
        id: hot-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Require real hot cache hit
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.hot-cache.outputs.cache-hit }}" = "true"
          echo "MONSTER_SPEED_V3_STEP6_HOT_CACHE_HIT_GREEN"
      - name: Activate hot Browser QA stack
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Prove cached Python and Chromium are executable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python - <<'PY'
          import numpy
          import pandas
          import playwright
          import requests
          import streamlit
          from playwright.sync_api import sync_playwright

          with sync_playwright() as pw:
              browser = pw.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage", "--no-sandbox"],
              )
              page = browser.new_page()
              page.set_content("<main data-monster-step6='green'>hot cache</main>")
              assert page.locator("[data-monster-step6='green']").inner_text() == "hot cache"
              browser.close()
          print("MONSTER_SPEED_V3_STEP6_CACHED_PYTHON_GREEN")
          print("MONSTER_SPEED_V3_STEP6_CACHED_CHROMIUM_GREEN")
          PY
      - name: Freeze tokens
        run: |
          echo "MONSTER_SPEED_V3_STEP6_GREEN"
          echo "MONSTER_SPEED_V3_STEP6_FROZEN_GREEN"
