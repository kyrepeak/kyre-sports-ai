name: Passing Yards Universal Step 8 Final Certification

on:
  pull_request:
    paths:
      - '.github/workflows/passing-yards-universal-step8-final-cert-v1.yml'
      - 'devsystem/task_ledgers/passing-yards-universal-step8-final-cert-v1.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/passing-yards-universal-step8-final-cert-v1.yml'
      - 'devsystem/task_ledgers/passing-yards-universal-step8-final-cert-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-step8-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce certification-only Step 8 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-universal-step8-final-cert-v1.yml
          devsystem/task_ledgers/passing-yards-universal-step8-final-cert-v1.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_STEP8_CERTIFICATION_ONLY_SCOPE_GREEN"

      - name: Verify frozen source chain
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v208.py").read_text(encoding="utf-8")
          v57 = Path("nfl_passing_yards_hub_v57.py").read_text(encoding="utf-8")
          v56 = Path("nfl_passing_yards_hub_v56.py").read_text(encoding="utf-8")
          v55 = Path("nfl_passing_yards_hub_v55.py").read_text(encoding="utf-8")
          v54 = Path("nfl_passing_yards_hub_v54.py").read_text(encoding="utf-8")
          v53 = Path("nfl_passing_yards_hub_v53.py").read_text(encoding="utf-8")
          v52 = Path("nfl_passing_yards_hub_v52.py").read_text(encoding="utf-8")
          v51 = Path("nfl_passing_yards_hub_v51.py").read_text(encoding="utf-8")

          assert "from streamlit_memory_lazy_router_v208 import record_bootstrap_import_ms, render_app" in app
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v57"' in router
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v207"' in router

          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v56"' in v57
          assert 'data-passing-yards-responsive-system="v57"' in v57
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v55"' in v56
          assert 'data-passing-yards-control-system="v56"' in v56
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v54"' in v55
          assert 'data-passing-yards-analysis-system="v55"' in v55
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v53"' in v54
          assert 'data-passing-yards-card-system="v54"' in v54
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v52"' in v53
          assert 'data-passing-yards-page-shell="v53"' in v53
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v51"' in v52
          assert 'data-passing-yards-design-tokens="v52"' in v52
          assert 'data-passing-yards-universal-owner="v51"' in v51

          for source in (router, v57, v56, v55, v54, v53, v52, v51):
              assert "SPORTSBOOK_PROJECTION_INFLUENCE = 0.0" in source

          print("PASSING_YARDS_UNIVERSAL_STEP8_STATIC_GREEN")
          PY

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Final public Passing Yards certification
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _body_has_forbidden_error,
              BrowserQAFailure,
          )

          base = "https://kyre-sports-ai.streamlit.app"
          router_source = Path("streamlit_memory_lazy_router_v208.py").read_text()
          app_source = Path("app.py").read_text()
          if 'PASSING_HUB = "nfl_passing_yards_hub_v57"' not in router_source:
              raise BrowserQAFailure("PASSING_YARDS_STEP8_SOURCE_OWNER: V208 no longer owns V57")
          if 'from streamlit_memory_lazy_router_v208 import record_bootstrap_import_ms, render_app' not in app_source:
              raise BrowserQAFailure("PASSING_YARDS_STEP8_SOURCE_OWNER: app no longer boots V208")

          artifacts = Path("artifacts/passing-yards-universal-step8-final")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":1280,"height":1100})
              try:
                  route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)

                  revision_deadline = time.monotonic() + 480.0
                  next_route_retry = time.monotonic() + 20.0
                  while True:
                      ready = False
                      for candidate in page.frames:
                          try:
                              ready = (
                                  candidate.locator('style[data-passing-yards-responsive-system="v57"]').count() == 1
                                  and candidate.locator('style[data-passing-yards-control-system="v56"]').count() >= 1
                                  and candidate.locator('style[data-passing-yards-analysis-system="v55"]').count() >= 1
                                  and candidate.locator('style[data-passing-yards-card-system="v54"]').count() >= 1
                                  and candidate.locator('style[data-passing-yards-page-shell="v53"]').count() >= 1
                                  and candidate.locator('style[data-passing-yards-design-tokens="v52"]').count() >= 1
                                  and candidate.locator('style[data-passing-yards-universal-owner="v51"]').count() >= 1
                              )
                          except Exception:
                              ready = False
                          if ready:
                              break
                      if ready:
                          break
                      if time.monotonic() >= revision_deadline:
                          raise BrowserQAFailure("PASSING_YARDS_STEP8_REVISION_READINESS: durable Step 1-7 witnesses not all present")
                      page.wait_for_timeout(1000)
                      if time.monotonic() >= next_route_retry:
                          page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                          next_route_retry = time.monotonic() + 20.0

                  frame, scan = _find_app_frame(page)
                  deadline = time.monotonic() + 90.0
                  while True:
                      body = frame.locator("body").inner_text(timeout=5000)
                      forbidden = _body_has_forbidden_error(body)
                      if forbidden:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP8_RUNTIME: forbidden marker {forbidden}")

                      top = frame.locator(".st-key-kyre_passing_yards_top_v46")
                      evidence = {
                          "step1_owner_style": frame.locator('style[data-passing-yards-universal-owner="v51"]').count(),
                          "step2_token_style": frame.locator('style[data-passing-yards-design-tokens="v52"]').count(),
                          "step3_shell_style": frame.locator('style[data-passing-yards-page-shell="v53"]').count(),
                          "step4_card_style": frame.locator('style[data-passing-yards-card-system="v54"]').count(),
                          "step5_analysis_style": frame.locator('style[data-passing-yards-analysis-system="v55"]').count(),
                          "step6_control_style": frame.locator('style[data-passing-yards-control-system="v56"]').count(),
                          "step7_responsive_style": frame.locator('style[data-passing-yards-responsive-system="v57"]').count(),
                          "player_cards": frame.locator(".ks-py48-player").count(),
                          "player_headers": frame.locator(".ks-py48-playerhead").count(),
                          "step_sections": frame.locator(".ks-py48-step").count(),
                          "support_details": frame.locator(".ks-py48-support details").count(),
                          "top_control_deck": top.count(),
                          "date_control": top.locator('[data-testid="stDateInput"]').count() if top.count() else 0,
                          "matchup_control": top.locator('[data-testid="stSelectbox"]').count() if top.count() else 0,
                          "passing_yards_text": "Passing Yards" in body,
                      }
                      if (
                          all(evidence[k] >= 1 for k in (
                              "step1_owner_style","step2_token_style","step3_shell_style",
                              "step4_card_style","step5_analysis_style","step6_control_style",
                              "step7_responsive_style","top_control_deck","date_control","matchup_control"
                          ))
                          and evidence["player_cards"] >= 2
                          and evidence["player_headers"] >= 2
                          and evidence["step_sections"] >= 6
                          and evidence["support_details"] >= 4
                          and evidence["passing_yards_text"]
                      ):
                          break
                      if time.monotonic() >= deadline:
                          raise BrowserQAFailure("PASSING_YARDS_STEP8_PRODUCT_READINESS: " + json.dumps(evidence, sort_keys=True))
                      page.wait_for_timeout(500)

                  results = {}
                  for label, width, height in (
                      ("desktop",1280,1100),
                      ("tablet",820,1180),
                      ("mobile",390,844),
                  ):
                      page.set_viewport_size({"width":width,"height":height})
                      page.wait_for_timeout(800)
                      frame, _ = _find_app_frame(page)

                      shell = frame.locator(".st-key-kyre_passing_yards_shell_v1").first
                      shell_metrics = shell.evaluate(
                          """el => {
                              const r=el.getBoundingClientRect();
                              return {
                                  left:r.left,right:r.right,width:r.width,
                                  clientWidth:el.clientWidth,scrollWidth:el.scrollWidth
                              };
                          }"""
                      )
                      doc_width = frame.locator("html").evaluate("el => el.clientWidth")
                      if shell_metrics["left"] < -2 or shell_metrics["right"] > doc_width + 2:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP8_{label}_SHELL_BOUNDS: {shell_metrics}; doc={doc_width}")
                      if shell_metrics["scrollWidth"] > shell_metrics["clientWidth"] + 4:
                          raise BrowserQAFailure(f"PASSING_YARDS_STEP8_{label}_HORIZONTAL_OVERFLOW: {shell_metrics}")

                      cards = frame.locator(".ks-py48-player")
                      card0 = cards.nth(0).evaluate("el => { const r=el.getBoundingClientRect(); return {top:r.top,left:r.left,right:r.right,width:r.width}; }")
                      card1 = cards.nth(1).evaluate("el => { const r=el.getBoundingClientRect(); return {top:r.top,left:r.left,right:r.right,width:r.width}; }")
                      for name, card in (("CARD0",card0),("CARD1",card1)):
                          if card["left"] < shell_metrics["left"] - 2 or card["right"] > shell_metrics["right"] + 2:
                              raise BrowserQAFailure(f"PASSING_YARDS_STEP8_{label}_{name}_BOUNDS: {card}; shell={shell_metrics}")

                      control_flex = frame.locator(
                          ".st-key-kyre_passing_yards_top_v46 [data-testid='stHorizontalBlock']"
                      ).first.evaluate("el => getComputedStyle(el).flexDirection")

                      if label == "desktop":
                          if abs(card0["top"] - card1["top"]) > 12:
                              raise BrowserQAFailure(f"PASSING_YARDS_STEP8_DESKTOP_TWO_COLUMN: {card0} {card1}")
                      else:
                          if card1["top"] <= card0["top"] + 20:
                              raise BrowserQAFailure(f"PASSING_YARDS_STEP8_{label}_STACKED_PLAYERS: {card0} {card1}")
                          if control_flex != "column":
                              raise BrowserQAFailure(f"PASSING_YARDS_STEP8_{label}_CONTROL_STACK: {control_flex}")

                      touch = {}
                      if label == "mobile":
                          def control_surface(selector):
                              return frame.locator(selector).first.evaluate(
                                  """host => {
                                      const hostRect=host.getBoundingClientRect();
                                      const interactive=host.querySelector('input,[role="textbox"],[role="combobox"],button');
                                      if (!interactive) return {interactive:false,width:0,height:0};
                                      let node=interactive;
                                      let best=interactive.getBoundingClientRect();
                                      for (let i=0; i<5 && node && node!==host; i++) {
                                          const r=node.getBoundingClientRect();
                                          if (r.height >= best.height && r.height <= hostRect.height + 2 && r.width > 0) best=r;
                                          node=node.parentElement;
                                      }
                                      return {interactive:true,width:best.width,height:best.height};
                                  }"""
                              )
                          date_surface = control_surface(".st-key-kyre_passing_yards_top_v46 [data-testid='stDateInput']")
                          select_surface = control_surface(".st-key-kyre_passing_yards_top_v46 [data-testid='stSelectbox']")
                          for name, surface in (("DATE",date_surface),("MATCHUP",select_surface)):
                              if not surface["interactive"] or surface["width"] <= 0 or surface["height"] < 47:
                                  raise BrowserQAFailure(f"PASSING_YARDS_STEP8_MOBILE_{name}_TOUCH_TARGET: {surface}")
                          touch={"date":date_surface,"matchup":select_surface}

                      results[label]={
                          "viewport":{"width":width,"height":height},
                          "shell":shell_metrics,
                          "player_0":card0,
                          "player_1":card1,
                          "control_flex":control_flex,
                          "touch":touch,
                      }
                      page.screenshot(path=str(artifacts/f"passing_yards_step8_{label}.png"),full_page=True)

                  result={
                      "status":"GREEN",
                      "route":"NFL -> Passing Yards",
                      "owner":"nfl_passing_yards_hub_v57",
                      "router":"streamlit_memory_lazy_router_v208",
                      "certified_steps":"1-8",
                      "evidence":evidence,
                      "responsive_results":results,
                      "frame_scan_count":len(scan),
                  }
                  (artifacts/"result.json").write_text(json.dumps(result,indent=2),encoding="utf-8")
                  print("PASSING_YARDS_UNIVERSAL_STEP8_FINAL_GREEN")
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload final Passing Yards proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-universal-step8-${{ github.run_id }}
          path: artifacts/passing-yards-universal-step8-final
          if-no-files-found: warn
          retention-days: 7
