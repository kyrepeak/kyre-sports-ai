name: Passing Yards Step 8 Local Cold Route Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-step8-local-cold-route-diagnostic-v1.yml"
      - "devsystem/task_ledgers/passing-yards-step8-local-cold-route-diagnostic-v1.json"

permissions:
  contents: read

jobs:
  exact-local-cold-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact-route browser runtime
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          set -euo pipefail
          nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            > /tmp/step8-local-streamlit.log 2>&1 &
          echo $! > /tmp/step8-local-streamlit.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "STEP8_LOCAL_STREAMLIT_HEALTH_GREEN"
              exit 0
            fi
            sleep 1
          done
          echo "STEP8_LOCAL_STREAMLIT_HEALTH_TIMEOUT"
          tail -n 500 /tmp/step8-local-streamlit.log || true
          exit 1

      - name: Drive exact cold Passing Yards route
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          query=urlencode({
            "ks_jump_sport":"NFL",
            "ks_jump_market":"Passing Yards",
            "ks_py_date":"2026-09-24",
            "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
            "ks_qb_slot":"2",
            "ks_py_hint_name":"Jordan Love",
            "ks_py_hint_meta":"GB • QB",
            "ks_py_hint_projection":"276.4",
            "ks_py_hint_attempts":"34.8",
            "ks_py_hint_ypa":"7.94",
            "ks_py_hint_line":"274.5",
            "ks_py_hint_lean":"LEAN OVER",
          })
          url=base+"/?"+query

          def count_all(page, selector):
            total=0
            for frame in page.frames:
              try:
                total += frame.locator(selector).count()
              except Exception:
                pass
            return total

          def wait_for(page, selector, timeout=60):
            end=time.monotonic()+timeout
            while time.monotonic()<end:
              if count_all(page, selector):
                return True
              time.sleep(.2)
            return False

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
            context=browser.new_context(viewport={"width":390,"height":844})
            page=context.new_page()
            page.goto(url,wait_until="domcontentloaded",timeout=120000)

            ok=wait_for(page,'[data-passing-yards-visible-cleanup-owner="v85"]',60)
            counts={
              "v203":count_all(page,'[data-passing-yards-v203-runtime]'),
              "v206":count_all(page,'[data-passing-yards-v206-runtime]'),
              "v225":count_all(page,'[data-passing-yards-v225-router-runtime]'),
              "v230":count_all(page,'[data-passing-yards-lazy-detail-router="v230"]'),
              "v79":count_all(page,'[data-passing-yards-lazy-detail="v79"]'),
              "v84":count_all(page,'[data-passing-yards-single-rerun-owner="v84"]'),
              "v85":count_all(page,'[data-passing-yards-visible-cleanup-owner="v85"]'),
              "topbar":count_all(page,'[data-kyre-sitewide-topbar="v1"]'),
              "exception":count_all(page,'[data-testid="stException"]'),
            }
            print("STEP8_LOCAL_ROUTE_COUNTS="+repr(counts))
            print("STEP8_LOCAL_PAGE_URL="+page.url)
            for i,frame in enumerate(page.frames):
              try:
                txt=frame.locator("body").inner_text(timeout=3000).replace("\n"," | ")[:4000]
              except Exception as exc:
                txt=f"FRAME_TEXT_ERROR:{type(exc).__name__}"
              print(f"STEP8_LOCAL_FRAME_{i}_URL={frame.url}")
              print(f"STEP8_LOCAL_FRAME_{i}_TEXT={txt}")

            if not ok:
              raise RuntimeError("STEP8_LOCAL_V85_NOT_READY")
            if counts["v79"] < 1 or counts["v84"] < 1:
              raise RuntimeError("STEP8_LOCAL_FROZEN_SPEED_CHAIN_NOT_READY")
            print("PASSING_YARDS_STEP8_LOCAL_COLD_ROUTE_GREEN")
            context.close()
            browser.close()
          PY

      - name: Print branch-local Streamlit log on failure
        if: failure()
        run: |
          echo "===== STEP8 LOCAL STREAMLIT LOG ====="
          tail -n 800 /tmp/step8-local-streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/step8-local-streamlit.pid ]; then
            kill "$(cat /tmp/step8-local-streamlit.pid)" 2>/dev/null || true
          fi
