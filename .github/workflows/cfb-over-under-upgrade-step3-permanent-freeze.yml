name: CFB O/U Intelligence V2 Upgrade Step 3 permanent freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-ou-upgrade-step3-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step3-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step3-permanent-freeze.yml' \
            'cfb_over_under_upgrade_freeze_manifest_v3.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U Upgrade Step 3 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_UPGRADE_STEP3_FREEZE_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen base path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"original frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 and 2 permanent freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "f4357679a318217686eec38a4cb0ed32333fef00"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v2.json") != expected_manifest_blob:
              failures.append("Upgrade Step 2 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v2.json").read_text()
          )
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen Upgrade Step 1/2 path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Upgrade Step 1/2 frozen blob changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_2_PERMANENT_FREEZE=PASS")
          PY

      - name: Enforce Upgrade Steps 1 through 3 exact blobs and contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text()
          )

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if manifest.get("version") != 3:
              failures.append("upgrade freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1, 2, 3]:
              failures.append("completed upgrade steps changed")

          step3 = manifest.get("step3_contract") or {}
          required_true = [
              "offense_vs_defense_projection_adjustment_active",
              "same_division_rank_pool_only",
          ]
          for key in required_true:
              if step3.get(key) is not True:
                  failures.append(f"Step 3 contract lost {key}")

          required_false = [
              "mixed_fbs_fcs_adjustment_allowed",
              "missing_category_invention_allowed",
              "epa_play_fabricated",
              "success_rate_fabricated",
              "frozen_step9_thresholds_changed",
              "frozen_reliability_inflated",
              "frozen_structural_sigma_reduced",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if step3.get(key) is not False:
                  failures.append(f"Step 3 contract changed {key}")

          if step3.get("max_team_matchup_adjustment_points") != 3.5:
              failures.append("Step 3 adjustment cap changed")
          if step3.get("minimum_weighted_coverage") != 0.40:
              failures.append("Step 3 coverage floor changed")
          if step3.get("minimum_ready_dimensions") != 3:
              failures.append("Step 3 minimum dimensions changed")
          if step3.get("analysis_line_matchup_weight") != 0.0:
              failures.append("Step 3 analysis-line matchup firewall changed")
          if step3.get("analysis_line_projection_weight") != 0.0:
              failures.append("Step 3 analysis-line projection firewall changed")
          if step3.get("next_upgrade_step") != 4:
              failures.append("Step 3 next-upgrade handoff changed")

          required_dimensions = {
              "scoring_offense_vs_scoring_defense",
              "total_offense_vs_total_defense",
              "passing_offense_vs_passing_defense",
              "rushing_offense_vs_rushing_defense",
              "third_down_offense_vs_third_down_defense",
              "red_zone_offense_vs_red_zone_defense",
              "sacks_allowed_vs_team_sacks",
              "turnovers_lost_vs_turnovers_gained",
          }
          if set(step3.get("matchup_dimensions") or []) != required_dimensions:
              failures.append("Step 3 matchup dimension contract changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Upgrade Step 1-3 path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"Upgrade Step 1-3 blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_OU_UPGRADE_STEP3_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Verify active runtime and regressions
        run: |
          grep -F 'from streamlit_memory_lazy_router_v39 import render_app' app.py
          python -m py_compile \
            cfb_over_under_matchup_engine_v1.py \
            cfb_over_under_slate_v2.py \
            cfb_over_under_matchup_ui_v3.py \
            streamlit_memory_lazy_router_v39.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py \
            tests/test_cfb_over_under_upgrade_step2_rankings.py \
            tests/test_cfb_over_under_upgrade_step2_ui.py \
            tests/test_streamlit_memory_lazy_router_v38.py \
            tests/test_cfb_over_under_upgrade_step1.py \
            tests/test_streamlit_memory_lazy_router_v37.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_streamlit_memory_lazy_router_v36.py

      - name: Freeze marker
        run: echo "CFB_OU_UPGRADE_STEP3_PERMANENT_FREEZE_GREEN"
