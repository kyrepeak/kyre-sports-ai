name: NFL Game Totals Page Step 2

on:
  push:
    branches:
      - monster/nfl-game-totals-page-step2
  pull_request:
    branches:
      - main
    paths:
      - nfl_game_totals_hub_v2.py
      - nfl_hub_v18.py
      - sports_api/nfl_game_totals_page_client_v1.py
      - tests/test_nfl_game_totals_page_step2.py
      - .github/workflows/nfl-game-totals-page-step2.yml
  workflow_dispatch:

jobs:
  page-step2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Freeze-scope guard
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'nfl_game_totals_hub_v2.py',
              'nfl_hub_v18.py',
              'sports_api/nfl_game_totals_page_client_v1.py',
              'tests/test_nfl_game_totals_page_step2.py',
              '.github/workflows/nfl-game-totals-page-step2.yml',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'Unexpected Step 2 paths: {extra}')
          forbidden = [p for p in changed if any(token in p.lower() for token in ('spread', 'moneyline', 'rushing', 'receiving', 'v136'))]
          if forbidden:
              raise SystemExit(f'Frozen surface changed: {forbidden}')
          print('freeze-scope OK:', sorted(changed))
          PY
      - name: Compile Step 2 runtime files
        run: python -m py_compile nfl_game_totals_hub_v2.py sports_api/nfl_game_totals_page_client_v1.py nfl_hub_v18.py
      - name: Run Step 2 contract
        run: python -m pytest -q tests/test_nfl_game_totals_page_step2.py
