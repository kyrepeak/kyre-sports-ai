name: NFL Live Game Repair Step 1 Registry Freeze Once

on:
  push:
    branches: [monster-frozen-artifact-registry]
    paths:
      - ".github/workflows/nfl-live-game-repair-step1-freeze-once.yml"

permissions:
  contents: write

concurrency:
  group: nfl-live-game-repair-step1-registry-freeze-once
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact registry transaction identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:devsystem/frozen_artifact_registry_state_v1.json)" = "d7f7fd60262800ec410b2c2ed0b5e27d20653f28"

      - name: CAS revision 122 to 123 and freeze Step 1
        shell: bash
        env:
          REGISTRY: devsystem/frozen_artifact_registry_state_v1.json
          WORKFLOW: .github/workflows/nfl-live-game-repair-step1-freeze-once.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("devsystem/frozen_artifact_registry_state_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          expected_hash = "44d69ef4cf54dc73041598340710949577887536f908c4bf3397157c013835f9"
          expected_source = "08112c19f588362f27022dfb07d65ec0eed94754"
          merge_sha = "997539f1904676aa7db11c7bcd7b5f16e1638926"
          checkpoint = "NFL_LIVE_GAME_REPAIR_STEP1_ROOT_CAUSE"

          def state_hash(value):
              body = dict(value)
              body.pop("state_hash", None)
              canonical = json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          assert payload["schema_version"] == 1
          assert payload["version"] == "MONSTER_V4_FROZEN_ARTIFACT_REGISTRY_V1"
          assert payload["registry_ref"] == "refs/heads/monster-frozen-artifact-registry"
          assert payload["registry_path"] == "devsystem/frozen_artifact_registry_state_v1.json"
          assert payload["revision"] == 122, payload["revision"]
          assert payload["source_main_sha"] == expected_source, payload["source_main_sha"]
          assert payload["state_hash"] == expected_hash, payload["state_hash"]
          assert state_hash(payload) == expected_hash
          assert payload.get("active_thaws") == [], payload.get("active_thaws")
          assert checkpoint not in payload["entries"]
          assert "CFB_TOP_PICKS_REPAIR_STEP5_FINAL_CLOSEOUT" in payload["entries"]

          payload["entries"][checkpoint] = {
              "status": "FROZEN",
              "checkpoint_id": checkpoint,
              "source_main_sha": merge_sha,
              "proven_merge_sha": merge_sha,
              "branch_focused_proof_run_id": 37247386646,
              "branch_devsystem_proof_run_id": 37247386697,
              "merged_main_focused_proof_run_id": 37247726321,
              "proof_run_id": 37247726207,
              "regression_debt_state": "CLEARED",
              "proof_kind": "MERGED_MAIN_STATIC_ROOT_CAUSE",
              "root_cause_class": "PREGAME_ONLY_APP_IDENTITY_GATE",
              "rushing_owner": "nfl_rushing_yards_hub_v16",
              "receiving_owner": "nfl_receiving_yards_hub_v17",
              "shared_gate": "nfl_prop_app_eligibility_v1.py",
              "live_state_forced_closed": True,
              "guard_accepts_only_pregame_identity_states": True,
              "kickoff_is_failure_boundary": True,
              "page_specific_patch_required": False,
              "next_patch_owner": "nfl_prop_app_eligibility_v1.py",
              "product_mutation": False,
              "api2_used": False,
              "artifacts": {
                  "devsystem/nfl_live_game_repair_step1_root_cause_v1.py": "f02bb3babfba2da9dd4efe04a2fe23b01e61730e",
                  "tests/test_nfl_live_game_repair_step1_root_cause_v1.py": "03392dfe00d8c3931c8ffd2a75fcd56c95de634c",
                  "devsystem/task_ledgers/nfl-live-game-repair-step1-root-cause-v1.json": "67f91c9a717c867f3ddb4000ebebe6114fd3f06f",
                  ".github/workflows/nfl-live-game-repair-step1-root-cause-v1.yml": "6edbb51dac93df0a81b1e65b6f547db8fa57d949"
              }
          }
          payload["revision"] = 123
          payload["source_main_sha"] = merge_sha
          payload["state_hash"] = state_hash(payload)

          assert payload["revision"] == 123
          assert payload["source_main_sha"] == merge_sha
          assert payload["active_thaws"] == []
          assert payload["entries"][checkpoint]["status"] == "FROZEN"
          assert state_hash(payload) == payload["state_hash"]

          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("NFL_LIVE_GAME_REPAIR_STEP1_REGISTRY_CAS_GREEN")
          print("revision=123")
          print("state_hash=" + payload["state_hash"])
          PY

          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY" "$WORKFLOW"
          git diff --cached --check
          git commit -m "Freeze NFL live-game repair Step 1 root cause"
          git push origin HEAD:monster-frozen-artifact-registry
