name: MONSTER V7 Step 5 Atomic Wait Queue Handoff

on:
  push:
    branches:
      - "monster/monster-v7-step5-atomic-wait-queue-handoff-v1"
    paths:
      - "devsystem/atomic_wait_queue_lease_handoff_v1.py"
      - "tests/test_devsystem_atomic_wait_queue_lease_handoff_v1.py"
      - "devsystem/task_ledgers/monster-v7-step5-atomic-wait-queue-handoff-v1.json"
      - ".github/workflows/monster-v7-step5-atomic-wait-queue-handoff.yml"
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/atomic_wait_queue_lease_handoff_v1.py"
      - "tests/test_devsystem_atomic_wait_queue_lease_handoff_v1.py"
      - "devsystem/task_ledgers/monster-v7-step5-atomic-wait-queue-handoff-v1.json"
      - ".github/workflows/monster-v7-step5-atomic-wait-queue-handoff.yml"

permissions:
  contents: read

concurrency:
  group: monster-v7-step5-wait-queue-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: atomic wait queue handoff focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen V5 scope lease dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/scope_aware_execution_lease_v1.py)" = "71383fa4ca36b0b4d80a6c87617912df6d52e4cf"

      - name: Verify frozen Step 4 sharding dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/shared_resource_lease_sharding_v1.py)" = "0e104b166bac9425ab2b84e253446b3faae5c0af"

      - name: Run atomic wait queue handoff contract
        run: python devsystem/atomic_wait_queue_lease_handoff_v1.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_atomic_wait_queue_lease_handoff_v1.py

      - name: Emit Step 5 GREEN marker
        run: echo "MONSTER_V7_STEP5_ATOMIC_WAIT_QUEUE_HANDOFF_GREEN"
