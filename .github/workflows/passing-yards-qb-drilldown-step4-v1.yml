name: Passing Yards QB Drill-Down Step 4

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-qb-drilldown-step4-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-qb-drilldown-step4-v1.json"
      - "nfl_passing_yards_hub_v61.py"
      - "streamlit_memory_lazy_router_v212.py"
      - "tests/test_passing_yards_qb_drilldown_step4_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-qb-drilldown-step4-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-qb-drilldown-step4-v1.json"
      - "nfl_passing_yards_hub_v61.py"
      - "streamlit_memory_lazy_router_v212.py"
      - "tests/test_passing_yards_qb_drilldown_step4_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-step4-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce QB drill-down Step 4 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step4-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-qb-drilldown-step4-v1.json
          nfl_passing_yards_hub_v61.py
          streamlit_memory_lazy_router_v212.py
          tests/test_passing_yards_qb_drilldown_step4_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_QB_DRILLDOWN_STEP4_SCOPE_GREEN"

      - name: Compile Step 4 chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v61.py streamlit_memory_lazy_router_v212.py app.py tests/test_passing_yards_qb_drilldown_step4_v1.py

      - name: Run Step 4 contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_qb_drilldown_step4_v1.py

      - name: Verify frozen Step 1 through Step 3 boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          v61 = Path("nfl_passing_yards_hub_v61.py").read_text()
          v60 = Path("nfl_passing_yards_hub_v60.py").read_text()
          v59 = Path("nfl_passing_yards_hub_v59.py").read_text()
          v58 = Path("nfl_passing_yards_hub_v58.py").read_text()
          r212 = Path("streamlit_memory_lazy_router_v212.py").read_text()
          r211 = Path("streamlit_memory_lazy_router_v211.py").read_text()
          r210 = Path("streamlit_memory_lazy_router_v210.py").read_text()
          r209 = Path("streamlit_memory_lazy_router_v209.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v60"' in v61
          assert 'data-passing-yards-step4-card-system="v61"' in v61
          assert 'data-passing-yards-step3-header="v60"' in v60
          assert 'data-passing-yards-qb-detail="v59"' in v59
          assert 'data-passing-yards-selection-screen="v58"' in v58
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v211"' in r212
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v61"' in r212
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v60"' in r211
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v59"' in r210
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v58"' in r209
          assert 'from streamlit_memory_lazy_router_v212 import record_bootstrap_import_ms, render_app' in app
          print("PASSING_YARDS_QB_DRILLDOWN_STEP4_FROZEN_BOUNDARY_GREEN")
          PY

  branch-local-step4-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: step4-python
        with:
          python-version: "3.12"

      - name: Restore Step 4 browser stack
        id: step4-browser-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-step4-browser
            ~/.cache/ms-playwright
          key: passing-yards-step4-browser-${{ runner.os }}-py${{ steps.step4-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt') }}

      - name: Build Step 4 browser stack
        if: steps.step4-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-step4-browser
          .venv-step4-browser/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-step4-browser/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-step4-browser/bin/python -m playwright install chromium

      - name: Activate Step 4 browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-step4-browser/bin" >> "$GITHUB_PATH"

      - name: Start branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/passing-yards-qb-step4-branch
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-qb-step4-branch/streamlit.log 2>&1 &
          echo $! > /tmp/passing_yards_step4_streamlit_pid

      - name: Prove Step 4 premium cards through real Streamlit
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health, _body_has_forbidden_error, BrowserQAFailure

          base = "http://127.0.0.1:8501"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          artifacts = Path("artifacts/passing-yards-qb-step4-branch")
          _wait_for_health(base)

          def find_landing(page, timeout=180):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  for frame in page.frames:
                      try:
                          if (
                              frame.locator('style[data-passing-yards-step4-card-system="v61"]').count() >= 1
                              and frame.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                              and frame.locator('[data-passing-yards-selection-screen="v58"]').count() == 1
                              and frame.locator('[data-qb-selection-card]').count() == 2
                          ):
                              return frame
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise BrowserQAFailure("PASSING_YARDS_QB_STEP4_BRANCH_LANDING_NOT_READY")

          def find_detail(page, slot, timeout=120):
              selector = f'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="{slot}"]'
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  for frame in page.frames:
                      try:
                          if (
                              frame.locator('style[data-passing-yards-step4-card-system="v61"]').count() >= 1
                              and frame.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                              and frame.locator(selector).count() == 1
                          ):
                              return frame
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_BRANCH_DETAIL_NOT_READY: slot={slot}")

          def click_anchor(page, frame, locator):
              target = locator.get_attribute("target")
              if target == "_blank":
                  with page.expect_popup(timeout=15000) as popup_info:
                      locator.click()
                  new_page = popup_info.value
                  new_page.wait_for_load_state("domcontentloaded", timeout=120000)
                  return new_page, target
              locator.click()
              return page, target

          def card_style(locator):
              return locator.evaluate(
                  """el => {
                    const s = getComputedStyle(el);
                    return {
                      borderRadius:s.borderRadius,
                      borderStyle:s.borderTopStyle,
                      boxShadow:s.boxShadow,
                      backgroundImage:s.backgroundImage,
                      clientWidth:el.clientWidth,
                      scrollWidth:el.scrollWidth
                    };
                  }"""
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage","--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                  landing = find_landing(page)
                  body = landing.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_BRANCH_RUNTIME: {forbidden}")

                  picker_card = landing.locator(".ks-py58-card").first
                  picker_style = card_style(picker_card)
                  result = {
                      "style_witness": landing.locator('style[data-passing-yards-step4-card-system="v61"]').count(),
                      "header": landing.locator('section[data-passing-yards-step3-header="v60"]').count(),
                      "picker": landing.locator('[data-passing-yards-selection-screen="v58"]').count(),
                      "cards": landing.locator('[data-qb-selection-card]').count(),
                      "links": landing.locator('a[data-qb-select]').count(),
                      "picker_style": picker_style,
                  }
                  assert result["style_witness"] >= 1, result
                  assert result["header"] == 1 and result["picker"] == 1, result
                  assert result["cards"] == 2 and result["links"] == 2, result
                  assert picker_style["borderStyle"] == "solid", picker_style
                  assert picker_style["boxShadow"] != "none", picker_style
                  assert picker_style["backgroundImage"] != "none", picker_style
                  assert picker_style["scrollWidth"] <= picker_style["clientWidth"] + 4, picker_style

                  qb1_name = landing.locator('a[data-qb-select="1"] .kpass29-name').first.inner_text(timeout=5000).strip()
                  detail_page, target = click_anchor(page, landing, landing.locator('a[data-qb-select="1"]').first)
                  detail = find_detail(detail_page, 1)
                  detail_body = detail.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(detail_body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_BRANCH_DETAIL_RUNTIME: {forbidden}")

                  detail_style = card_style(detail.locator(".ks-py59-player").first)
                  detail_result = {
                      "navigation_target": target,
                      "header": detail.locator('section[data-passing-yards-step3-header="v60"]').count(),
                      "detail": detail.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="1"]').count(),
                      "player_cards": detail.locator(".ks-py59-player").count(),
                      "market": detail.locator('[data-qb-analysis-section="market"]').count(),
                      "projection": detail.locator('[data-qb-analysis-section="projection"]').count(),
                      "context": detail.locator('[data-qb-analysis-section="context"]').count(),
                      "distribution": detail.locator('[data-qb-analysis-section="distribution"]').count(),
                      "support": detail.locator("[data-qb-analysis-support]").count(),
                      "identity_visible": bool(qb1_name and qb1_name in detail_body),
                      "back": detail.locator('a[data-qb-back="true"]').count(),
                      "detail_style": detail_style,
                  }
                  assert detail_result["header"] == 1 and detail_result["detail"] == 1, detail_result
                  assert detail_result["player_cards"] == 1 and detail_result["identity_visible"], detail_result
                  assert detail_result["market"] == 1, detail_result
                  assert detail_result["projection"] == 1 and detail_result["context"] == 1 and detail_result["distribution"] == 1, detail_result
                  assert detail_result["support"] == 2 and detail_result["back"] == 1, detail_result
                  assert detail_style["borderStyle"] == "solid", detail_style
                  assert detail_style["boxShadow"] != "none", detail_style
                  assert detail_style["backgroundImage"] != "none", detail_style
                  assert detail_style["scrollWidth"] <= detail_style["clientWidth"] + 4, detail_style

                  returned_page, _ = click_anchor(detail_page, detail, detail.locator('a[data-qb-back="true"]').first)
                  returned = find_landing(returned_page, timeout=120)
                  back_ok = returned.locator('[data-qb-selection-card]').count() == 2
                  assert back_ok

                  proof = {
                      "status":"GREEN",
                      "landing":result,
                      "detail":detail_result,
                      "back_restored_picker":back_ok,
                  }
                  (artifacts/"result.json").write_text(json.dumps(proof,indent=2),encoding="utf-8")
                  returned_page.screenshot(path=str(artifacts/"step4-branch-proof.png"),full_page=True)
                  print("PASSING_YARDS_QB_DRILLDOWN_STEP4_BRANCH_GREEN")
                  print(json.dumps(proof,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log on targeted proof failure
        if: failure()
        run: tail -n 500 artifacts/passing-yards-qb-step4-branch/streamlit.log || true

      - name: Upload Step 4 branch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-qb-step4-branch-${{ github.run_id }}
          path: artifacts/passing-yards-qb-step4-branch
          if-no-files-found: warn
          retention-days: 7

      - name: Stop branch-local Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/passing_yards_step4_streamlit_pid ]; then
            kill "$(cat /tmp/passing_yards_step4_streamlit_pid)" 2>/dev/null || true
          fi

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Passing Yards Step 4 premium cards
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health, _body_has_forbidden_error, BrowserQAFailure

          base = "https://kyre-sports-ai.streamlit.app"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          artifacts = Path("artifacts/passing-yards-qb-drilldown-step4")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          def landing_ready(page):
              for frame in page.frames:
                  try:
                      if (
                          frame.locator('style[data-passing-yards-step4-card-system="v61"]').count() >= 1
                          and frame.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                          and frame.locator('[data-passing-yards-selection-screen="v58"]').count() == 1
                          and frame.locator('[data-qb-selection-card]').count() == 2
                      ):
                          return frame
                  except Exception:
                      pass
              return None

          def find_landing(page, timeout=600):
              deadline = time.monotonic() + timeout
              next_refresh = time.monotonic() + 20
              while time.monotonic() < deadline:
                  found = landing_ready(page)
                  if found is not None:
                      return found
                  if time.monotonic() >= next_refresh:
                      page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                      next_refresh = time.monotonic() + 20
                  page.wait_for_timeout(500)
              raise BrowserQAFailure("PASSING_YARDS_QB_STEP4_PUBLIC_LANDING_NOT_READY")

          def find_detail(page, slot, timeout=120):
              selector = f'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="{slot}"]'
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  for frame in page.frames:
                      try:
                          if (
                              frame.locator('style[data-passing-yards-step4-card-system="v61"]').count() >= 1
                              and frame.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                              and frame.locator(selector).count() == 1
                          ):
                              return frame
                      except Exception:
                          pass
                  page.wait_for_timeout(500)
              raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_PUBLIC_DETAIL_NOT_READY: slot={slot}")

          def click_anchor(page, frame, locator):
              target = locator.get_attribute("target")
              if target == "_blank":
                  with page.expect_popup(timeout=15000) as popup_info:
                      locator.click()
                  new_page = popup_info.value
                  new_page.wait_for_load_state("domcontentloaded", timeout=120000)
                  return new_page, target
              locator.click()
              return page, target

          def card_style(locator):
              return locator.evaluate(
                  """el => {
                    const s = getComputedStyle(el);
                    return {
                      borderRadius:s.borderRadius,
                      borderStyle:s.borderTopStyle,
                      boxShadow:s.boxShadow,
                      backgroundImage:s.backgroundImage,
                      clientWidth:el.clientWidth,
                      scrollWidth:el.scrollWidth
                    };
                  }"""
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage","--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                  landing = find_landing(page)
                  body = landing.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_PUBLIC_RUNTIME: {forbidden}")

                  picker_style = card_style(landing.locator(".ks-py58-card").first)
                  result = {
                      "status":"GREEN",
                      "main_revision_witness":"v61",
                      "route":"NFL -> Passing Yards",
                      "owner":"nfl_passing_yards_hub_v61",
                      "router":"streamlit_memory_lazy_router_v212",
                      "style_witness":landing.locator('style[data-passing-yards-step4-card-system="v61"]').count(),
                      "header":landing.locator('section[data-passing-yards-step3-header="v60"]').count(),
                      "title":landing.locator(".ks-py60-title").first.inner_text(timeout=5000).strip(),
                      "picker":landing.locator('[data-passing-yards-selection-screen="v58"]').count(),
                      "selection_cards":landing.locator('[data-qb-selection-card]').count(),
                      "select_links":landing.locator('a[data-qb-select]').count(),
                      "picker_style":picker_style,
                  }
                  assert result["style_witness"] >= 1, result
                  assert result["header"] == 1 and result["title"] == "Passing Yards", result
                  assert result["picker"] == 1 and result["selection_cards"] == 2 and result["select_links"] == 2, result
                  assert picker_style["borderStyle"] == "solid", picker_style
                  assert picker_style["boxShadow"] != "none", picker_style
                  assert picker_style["backgroundImage"] != "none", picker_style
                  assert picker_style["scrollWidth"] <= picker_style["clientWidth"] + 4, picker_style

                  qb1_name = landing.locator('a[data-qb-select="1"] .kpass29-name').first.inner_text(timeout=5000).strip()
                  detail_page, target = click_anchor(page, landing, landing.locator('a[data-qb-select="1"]').first)
                  detail = find_detail(detail_page, 1)
                  detail_body = detail.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(detail_body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP4_PUBLIC_DETAIL_RUNTIME: {forbidden}")

                  detail_style = card_style(detail.locator(".ks-py59-player").first)
                  detail_result = {
                      "navigation_target":target,
                      "header":detail.locator('section[data-passing-yards-step3-header="v60"]').count(),
                      "detail":detail.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="1"]').count(),
                      "player_cards":detail.locator(".ks-py59-player").count(),
                      "market":detail.locator('[data-qb-analysis-section="market"]').count(),
                      "projection":detail.locator('[data-qb-analysis-section="projection"]').count(),
                      "context":detail.locator('[data-qb-analysis-section="context"]').count(),
                      "distribution":detail.locator('[data-qb-analysis-section="distribution"]').count(),
                      "support":detail.locator("[data-qb-analysis-support]").count(),
                      "identity_visible":bool(qb1_name and qb1_name in detail_body),
                      "back":detail.locator('a[data-qb-back="true"]').count(),
                      "detail_style":detail_style,
                  }
                  assert detail_result["header"] == 1 and detail_result["detail"] == 1, detail_result
                  assert detail_result["player_cards"] == 1 and detail_result["identity_visible"], detail_result
                  assert detail_result["market"] == 1, detail_result
                  assert detail_result["projection"] == 1 and detail_result["context"] == 1 and detail_result["distribution"] == 1, detail_result
                  assert detail_result["support"] == 2 and detail_result["back"] == 1, detail_result
                  assert detail_style["borderStyle"] == "solid", detail_style
                  assert detail_style["boxShadow"] != "none", detail_style
                  assert detail_style["backgroundImage"] != "none", detail_style
                  assert detail_style["scrollWidth"] <= detail_style["clientWidth"] + 4, detail_style

                  returned_page, _ = click_anchor(detail_page, detail, detail.locator('a[data-qb-back="true"]').first)
                  returned = find_landing(returned_page, timeout=120)
                  result["back_restored_picker"] = returned.locator('[data-qb-selection-card]').count() == 2
                  result["qb1_regression"] = detail_result
                  assert result["back_restored_picker"], result

                  (artifacts/"result.json").write_text(json.dumps(result,indent=2),encoding="utf-8")
                  returned_page.screenshot(path=str(artifacts/"step4-public-mobile.png"),full_page=True)
                  print("PASSING_YARDS_QB_DRILLDOWN_STEP4_PUBLIC_GREEN")
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload QB drill-down Step 4 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-qb-drilldown-step4-${{ github.run_id }}
          path: artifacts/passing-yards-qb-drilldown-step4
          if-no-files-found: warn
          retention-days: 7
