name: Monster WNBA PRA Max-Speed Exact Transfer V1

on:
  push:
    branches:
      - monster-wnba-pra-max-speed-snapshot-v1

permissions:
  contents: write

concurrency:
  group: monster-wnba-pra-max-speed-snapshot-v1-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: contains(github.event.head_commit.message, '[WNBA-MAX-SPEED-TRANSFER]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .monster-transfer/chunk-* | base64 --decode > /tmp/wnba-speed-candidate.tar.gz
          echo "7783b713d912520c522a9d088771cd776df368f4d831463dd1675789a83d8325  /tmp/wnba-speed-candidate.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          expected = {
              'devsystem/runless_proof_plans/monster-wnba-pra-max-speed-snapshot-v1.json',
              'devsystem/wnba_pra_max_speed_profile_v1.py',
              'runless_v2/app.py',
              'runless_v2/wnba_pra_page_snapshot_store_v1.py',
              'runless_v2/wnba_pra_page_snapshot_v1.py',
              'supabase/migrations/20261021_wnba_pra_page_snapshot_publish_fence_v1.sql',
              'supabase/migrations/20261021_wnba_pra_page_snapshots_v1.sql',
              'tests/test_wnba_pra_max_speed_snapshot_v1.py',
              'tests/test_wnba_pra_max_speed_streamlit_v1.py',
              'wnba_pra_hub_v3617.py',
              'wnba_pra_page_model_artifact_v1.py',
              'wnba_pra_page_snapshot_client_v1.py',
              'wnba_pra_page_snapshot_publish_v1.py',
              'wnba_pra_page_snapshot_renderer_v1.py',
              'wnba_pra_source_clean_guard_v1.py',
          }
          with tarfile.open('/tmp/wnba-speed-candidate.tar.gz','r:gz') as tf:
              names = {m.name.removeprefix('./') for m in tf.getmembers() if m.isfile()}
          if names != expected:
              raise SystemExit(f'FILE_SET_MISMATCH actual={sorted(names)} expected={sorted(expected)}')
          print('SEALED_FILE_SET_OK', len(expected))
          PY
          tar -xzf /tmp/wnba-speed-candidate.tar.gz -C .
          rm -rf .monster-transfer
          rm -f .github/workflows/monster-wnba-pra-max-speed-transfer-v1.yml
          python - <<'PY'
          import subprocess
          expected = {
            'devsystem/runless_proof_plans/monster-wnba-pra-max-speed-snapshot-v1.json':'8b7eb517f81ce54d18c1c7fd547da0ad5028bb52',
            'devsystem/wnba_pra_max_speed_profile_v1.py':'f43831c14661b077ebf286fd8c4608d06c021fc8',
            'runless_v2/app.py':'713c2ed0b95164160e131120b8b779eccafd7867',
            'runless_v2/wnba_pra_page_snapshot_store_v1.py':'3d1fab0818124b28e2ca5eed8ef66a9cf66665cc',
            'runless_v2/wnba_pra_page_snapshot_v1.py':'602157306c0e0dff7949a1ff56d927a966f849e6',
            'supabase/migrations/20261021_wnba_pra_page_snapshot_publish_fence_v1.sql':'8cff4634dab401a79753d1aa847ad13575d4ace4',
            'supabase/migrations/20261021_wnba_pra_page_snapshots_v1.sql':'c9f481b7ce84de5374350b23b154ab7b25830ff3',
            'tests/test_wnba_pra_max_speed_snapshot_v1.py':'cccbe0f94bbe41d8d4acabf42524a85b8a0fc97b',
            'tests/test_wnba_pra_max_speed_streamlit_v1.py':'dbf8d22cc713a66db1136fbc11a0ef8fcf104c34',
            'wnba_pra_hub_v3617.py':'777be8663c5b7a020fd96aa83145fc39a39580ac',
            'wnba_pra_page_model_artifact_v1.py':'63f9bfe947c751a64e528d16b58d90d6179f961f',
            'wnba_pra_page_snapshot_client_v1.py':'6bc7126b39bae00b1551f9f3a6f402e0ded6cd12',
            'wnba_pra_page_snapshot_publish_v1.py':'8a45f40f06e4821e874b31597ada4acc2dc3e0f5',
            'wnba_pra_page_snapshot_renderer_v1.py':'202e1c6981346f34dba33c68ff4632b7e3f6e2b1',
            'wnba_pra_source_clean_guard_v1.py':'88789cf68eb7e22fa57297e147d369d2ba0eb1b2',
          }
          for path, want in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if got != want:
                  raise SystemExit(f'BLOB_MISMATCH {path} {got} {want}')
          print('EXACT_CANDIDATE_BLOBS_OK', len(expected))
          PY
      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code --quiet && { echo "No candidate diff"; exit 1; }
          git commit -m "Implement WNBA PRA maximum-speed snapshot V1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
