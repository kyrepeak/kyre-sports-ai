name: Monster WNBA PRA Max-Speed Exact Transfer V1

on:
  push:
    branches:
      - monster-wnba-pra-max-speed-snapshot-v1

permissions:
  contents: write

concurrency:
  group: monster-wnba-pra-max-speed-snapshot-v1-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: contains(github.event.head_commit.message, '[WNBA-MAX-SPEED-TRANSFER]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified base and exact final delta
        shell: bash
        run: |
          set -euo pipefail
          cat .monster-transfer/chunk-* | base64 --decode > /tmp/wnba-speed-base.tar.gz
          echo "7783b713d912520c522a9d088771cd776df368f4d831463dd1675789a83d8325  /tmp/wnba-speed-base.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wnba-speed-base.tar.gz -C .

          cat .monster-transfer-delta/chunk-* | base64 --decode > /tmp/wnba-speed-final.patch.gz
          echo "3323d4f0eb2209de00598b1d0bdeaf726ad7814d7b0f31978e42ab2fccb0a112  /tmp/wnba-speed-final.patch.gz" | sha256sum -c -
          gzip -dc /tmp/wnba-speed-final.patch.gz > /tmp/wnba-speed-final.patch
          echo "48de5c8a5c2e33cdeb2b48b9a9ccdc00f3caff01c97bac497ac4af5c7dc71d0e  /tmp/wnba-speed-final.patch" | sha256sum -c -
          git apply --check /tmp/wnba-speed-final.patch
          git apply /tmp/wnba-speed-final.patch

      - name: Verify exact final candidate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .monster-transfer .monster-transfer-delta
          rm -f .github/workflows/monster-wnba-pra-max-speed-transfer-v1.yml
          python - <<'PY'
          import subprocess
          expected = {
            'devsystem/runless_proof_plans/monster-wnba-pra-max-speed-snapshot-v1.json':'8b7eb517f81ce54d18c1c7fd547da0ad5028bb52',
            'devsystem/wnba_pra_max_speed_profile_v1.py':'f43831c14661b077ebf286fd8c4608d06c021fc8',
            'runless_v2/app.py':'713c2ed0b95164160e131120b8b779eccafd7867',
            'runless_v2/wnba_pra_page_snapshot_store_v1.py':'3d1fab0818124b28e2ca5eed8ef66a9cf66665cc',
            'runless_v2/wnba_pra_page_snapshot_v1.py':'e9159d93a8fb6f6fca754391a5fa52a8d09ef407',
            'supabase/migrations/20261021_wnba_pra_page_snapshot_publish_fence_v1.sql':'8cff4634dab401a79753d1aa847ad13575d4ace4',
            'supabase/migrations/20261021_wnba_pra_page_snapshots_v1.sql':'c9f481b7ce84de5374350b23b154ab7b25830ff3',
            'tests/test_wnba_pra_max_speed_snapshot_v1.py':'203870b695e9af151c2add36826edacaff8b1fbd',
            'tests/test_wnba_pra_max_speed_streamlit_v1.py':'0902c0fe97d72a60a4e854080111b58c690f9465',
            'wnba_pra_hub_v3617.py':'777be8663c5b7a020fd96aa83145fc39a39580ac',
            'wnba_pra_page_model_artifact_v1.py':'63f9bfe947c751a64e528d16b58d90d6179f961f',
            'wnba_pra_page_snapshot_client_v1.py':'6bc7126b39bae00b1551f9f3a6f402e0ded6cd12',
            'wnba_pra_page_snapshot_publish_v1.py':'b25fda63d03e01cc67ba1f3945ea587dc6be43be',
            'wnba_pra_page_snapshot_renderer_v1.py':'202e1c6981346f34dba33c68ff4632b7e3f6e2b1',
            'wnba_pra_source_clean_guard_v1.py':'88789cf68eb7e22fa57297e147d369d2ba0eb1b2',
          }
          for path, want in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if got != want:
                  raise SystemExit(f'BLOB_MISMATCH {path} {got} {want}')
          print('EXACT_FINAL_CANDIDATE_BLOBS_OK', len(expected))
          PY

      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code --quiet && { echo "No candidate diff"; exit 1; }
          git commit -m "Implement WNBA PRA maximum-speed snapshot V1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
