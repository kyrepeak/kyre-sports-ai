name: WNBA Step19 final production freeze certification

on:
  push:
    branches:
      - wnba-step19-final-production-freeze-20260830
    paths:
      - '.github/workflows/wnba-step19-final-freeze-cert.yml'

permissions:
  contents: read

concurrency:
  group: wnba-step19-final-production-freeze-cert
  cancel-in-progress: true

env:
  FREEZE_SOURCE_SHA: aaf8b8a5425ea6e1b0ab33e6c42f35c95e8905ab
  PROD_CERT_RUN_ID: '33290456020'
  RENDER_SERVICE_URL: https://kyre-sports-api.onrender.com

jobs:
  freeze-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
      WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
      WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
      WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
      WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
      WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
      WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
      WNBA_STEP10_FASTAPI_ENABLED: 'true'
      WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
      WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
      WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
      WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
      WNBA_STEP9_FASTAPI_ENABLED: 'true'
      WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
      WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
      WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
      WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
      WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
      WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
      WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
      WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
      WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
      WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
      WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
      WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
      WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
      WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
      WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
      WNBA_BOARD_SCHEDULER_ENABLED: 'false'
      WNBA_STEP12_SCHEDULER_ENABLED: 'false'
      WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
      WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
      WNBA_PERSISTENCE_ENABLED: 'false'
      WNBA_SUPABASE_WRITE_ENABLED: 'false'
      WNBA_WAGERING_ENABLED: 'false'
      WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

    steps:
      - name: Checkout freeze head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove freeze contains no production code drift
        run: |
          git cat-file -e "$FREEZE_SOURCE_SHA^{commit}"
          python - <<'PY'
          import os, subprocess
          source=os.environ['FREEZE_SOURCE_SHA']
          allowed={
              'checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md',
              '.github/workflows/wnba-step19-final-freeze-cert.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',source+'..HEAD'],text=True).splitlines()))
          print('STEP19_FREEZE_DIFF',sorted(changed))
          if changed != allowed:
              raise SystemExit('freeze contains unexpected drift: '+repr(sorted(changed)))
          print('STEP19_FREEZE_NO_CODE_DRIFT_CERTIFIED')
          PY

      - name: Verify checkpoint pins the production certification
        run: |
          grep -F "$FREEZE_SOURCE_SHA" checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md
          grep -F "$PROD_CERT_RUN_ID" checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md
          grep -F '5,000,000 simulations per built target' checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md
          grep -F 'SportsGameOdds is not used' checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md
          grep -F 'Wagering remains disabled' checkpoints/WNBA_STEP19_FINAL_PRODUCTION_FROZEN_20260830.md
          echo STEP19_FREEZE_CHECKPOINT_CERTIFIED

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
          python -m pip install pytest >/dev/null

      - name: Re-run frozen Step19 regression wall
        run: |
          python -m pytest -q tests/test_wnba_step11_fanduel_provider.py
          python -m pytest -q \
            tests/test_wnba_step19n_fanduel_empty_market.py \
            tests/test_wnba_step19m_fanduel_line_move.py \
            tests/test_wnba_step19l_fanduel_identity_trace.py \
            tests/test_wnba_step19k_market_not_ready.py \
            tests/test_wnba_step19j_runtime_acceleration.py \
            tests/test_wnba_step19i_official_slate_transport.py \
            tests/test_wnba_step19h_fanduel_hosted_transport.py \
            tests/test_wnba_step19g_hosted_provider_trace.py \
            tests/test_wnba_step19f_draftkings_identity.py \
            tests/test_wnba_step19e_cooldown_aware_cycle.py

      - name: Prove frozen runtime and model invariants
        run: |
          python - <<'PY'
          from sports_api import wnba_step11_fanduel_provider as fd
          from sports_api import wnba_step12b_live_runtime_assembly as s12b
          from sports_api import wnba_step19h_fanduel_hosted_transport as h
          from sports_api import wnba_step19k_market_not_ready as k
          from sports_api import wnba_step19l_fanduel_identity_trace as l
          from sports_api import wnba_step19m_fanduel_line_move as m
          from sports_api import wnba_step19n_fanduel_empty_market as n
          import sports_api.api.wnba_step17b_runtime
          assert fd.fetch_step11c_fanduel_provider_bridge is l.fetch_step11c_with_identity_trace
          assert l._UPSTREAM_FETCH_STEP11C is h.fetch_step11c_with_transport_probe
          assert fd._market_identity_surface is m.market_identity_surface_step19m
          assert m._UPSTREAM_IDENTITY_SURFACE is l.market_identity_surface_step19l
          assert s12b.run_step12b_live_runtime_job is n.run_step12b_fanduel_empty_market_compatible
          assert n._UPSTREAM_RUN_STEP12B is k.run_step12b_market_not_ready_compatible
          assert s12b.CERTIFIED_SIMULATIONS == 5_000_000
          assert s12b.CERTIFIED_BATCH_SIZE == 250_000
          mg=m.installation_status()['guardrails']; ng=n.installation_status()['guardrails']
          for key in ('selection_id_change_allowed','runner_side_change_allowed','market_type_change_allowed','player_identity_change_allowed','different_lines_blended','exact_line_matching_modified','projection_logic_modified','monte_carlo_simulation_count_modified','readiness_relaxed','provider_retry_policy_modified','controller_state_modified','persistence_modified','wagering_enabled'):
              assert mg[key] is False, key
          for key in ('identity_failure_reclassified','transport_failure_reclassified','upstream_failure_reclassified','landing_page_failure_reclassified','fanduel_bridge_fabricated','different_lines_blended','fake_projection_created','monte_carlo_simulation_count_modified','projection_math_modified','provider_transport_modified','readiness_relaxed','persistence_modified','wagering_enabled'):
              assert ng[key] is False, key
          print('STEP19_FREEZE_INVARIANTS_CERTIFIED')
          PY

      - name: Read-only production freeze verification
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://kyre-sports-api.onrender.com'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=45) as response:
                  return json.loads(response.read().decode())
          rt=get('/api/v1/wnba/runtime/step17b')
          c=get('/api/v1/wnba/consumer/latest')
          dk=get('/api/v1/wnba/markets/direct/draftkings/status')
          h=get('/api/v1/wnba/runtime/step19h-fanduel-transport')
          i=get('/api/v1/wnba/runtime/step19i-official-slate-transport')
          j=get('/api/v1/wnba/runtime/step19j-runtime-acceleration')
          k=get('/api/v1/wnba/runtime/step19k-market-not-ready')
          l=get('/api/v1/wnba/runtime/step19l-fanduel-identity-trace')
          m=get('/api/v1/wnba/runtime/step19m-fanduel-line-move')
          n=get('/api/v1/wnba/runtime/step19n-fanduel-empty-market')
          cr=c.get('runtime') or {}; d=dk.get('draftkings') or {}
          checks={
              'runtime_has_success':int(rt.get('success_count') or 0)>=8,
              'runtime_failures_zero':int(rt.get('failure_count') or 0)==0,
              'draftkings_ready':d.get('ready') is True,
              'fanduel_invalid_json_zero':int(h.get('invalid_json_event_count') or 0)==0,
              'fanduel_identity_errors_zero':int(l.get('identity_error_count') or 0)==0,
              'official_schedule_fix_active':i.get('official_schedule_transport_active') is True,
              'runtime_acceleration_active':j.get('game_rest_cycle_cache_active') is True,
              'no_exact_line_fix_active':k.get('installed') is True,
              'line_move_fix_active':m.get('market_identity_repair_active') is True,
              'empty_market_fix_active':n.get('installed') is True,
              'consumer_safe':(not cr) or (cr.get('circuit_state')=='closed' and int(cr.get('consecutive_failures') or 0)==0 and cr.get('cycle_outcome') in {'market_board_not_ready','shadow_board_ready','not_executed'}),
          }
          print('STEP19_FREEZE_PRODUCTION_CHECKS',json.dumps(checks,sort_keys=True))
          if not all(checks.values()):
              raise SystemExit('production freeze verification failed')
          print('STEP19_FINAL_PRODUCTION_FREEZE_CERTIFIED')
          PY
