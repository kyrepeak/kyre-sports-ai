name: College Football Step 4 permanent freeze contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['cfb-step4-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 4 freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step4-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step4-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v4.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 4 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP4_FREEZE_SCOPE=PASS"

      - name: Enforce immutable prior CFB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifests = {
              "cfb_freeze_manifest_v1.json": "3a7797ca8eb516b0457ebd7d3b2eb007e99ab087",
              "cfb_freeze_manifest_v2.json": "1b4eb71f6f17dcae873bcfd7ac4091bd2fa1498f",
              "cfb_freeze_manifest_v3.json": "127bfbd1aa1e8d9c439e88846c49fadbfb0dbb5a",
          }

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path, expected in expected_manifests.items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  actual = None
              if actual != expected:
                  failures.append(
                      f"{path} changed or missing expected={expected} actual={actual}"
                  )

          for path, expected_steps in (
              ("cfb_freeze_manifest_v1.json", [1]),
              ("cfb_freeze_manifest_v2.json", [1, 2]),
              ("cfb_freeze_manifest_v3.json", [1, 2, 3]),
          ):
              try:
                  data = json.loads(pathlib.Path(path).read_text())
              except Exception as exc:
                  failures.append(f"cannot read {path}: {exc}")
                  continue
              if data.get("completed_steps") != expected_steps:
                  failures.append(f"{path} completed_steps mismatch")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_PRIOR_FREEZE_MANIFESTS_V1_V3=PASS")
          PY

      - name: Enforce College Football Steps 1 through 4 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v4.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 4:
              failures.append("freeze manifest version mismatch")
          if m.get("completed_steps") != [1, 2, 3, 4]:
              failures.append("completed_steps mismatch")
          if m.get("step4_merge_commit") != "52bd68966a98d50cca60aef4a94e0905aefa8a8f":
              failures.append("Step 4 merge commit mismatch")

          required = {
              "cfb_hub_v1.py",
              "streamlit_memory_lazy_router_v23.py",
              "cfb_schedule_v1.py",
              "cfb_hub_v2.py",
              "streamlit_memory_lazy_router_v24.py",
              "cfb_team_data_v1.py",
              "cfb_hub_v3.py",
              "streamlit_memory_lazy_router_v25.py",
              "cfb_moneyline_hub_v1.py",
              "streamlit_memory_lazy_router_v26.py",
          }
          if set(m.get("exact_blobs", {})) != required:
              failures.append("Step 4 exact frozen path set mismatch")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP4_EXACT_FREEZE=PASS")
          PY

      - name: Re-enforce protected MLB freeze manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP4_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen College Football Steps 1 through 4
        run: |
          python -m py_compile \
            cfb_hub_v1.py \
            streamlit_memory_lazy_router_v23.py \
            cfb_schedule_v1.py \
            cfb_hub_v2.py \
            streamlit_memory_lazy_router_v24.py \
            cfb_team_data_v1.py \
            cfb_hub_v3.py \
            streamlit_memory_lazy_router_v25.py \
            cfb_moneyline_hub_v1.py \
            streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py

      - name: Run frozen College Football contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove frozen Step 4 Moneyline-only UI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path("cfb_moneyline_hub_v1.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v26.py").read_text(encoding="utf-8")

          if 'FROZEN_CFB_HUB = "cfb_hub_v3"' not in hub:
              raise SystemExit("Step 4 frozen parent is not Hub V3")
          if 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v25"' not in router:
              raise SystemExit("Router V26 frozen parent is not V25")
          if 'MARKET = "Moneyline"' not in hub:
              raise SystemExit("Step 4 Moneyline market contract missing")
          if 'market != MONEYLINE_MARKET' not in router:
              raise SystemExit("V26 market isolation contract missing")

          forbidden = [
              "import numpy",
              "np.random",
              "def simulate",
              "def win_probability",
              "fair_odds =",
              "fair_moneyline =",
              "projected_score =",
              "moneyline_pick =",
              "sportsbook_line =",
          ]
          for token in forbidden:
              if token in hub:
                  raise SystemExit(f"Frozen Step 4 crossed model boundary: {token}")

          print("CFB_STEP4_MONEYLINE_UI_FROZEN=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP4_PERMANENT_FREEZE_GREEN"
