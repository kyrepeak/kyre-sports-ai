name: NFL Passing Yards V237 Lockless Owner

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-v237-lockless-owner-v1.yml"
      - "streamlit_memory_lazy_router_v237.py"
      - "tests/test_passing_yards_v237_lockless_owner.py"
      - "devsystem/task_ledgers/passing-yards-v237-lockless-owner-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-v237-lockless-owner-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockless-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Protect Monster and exact scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/passing-yards-v237-lockless-owner-v1.yml' \
            'devsystem/task_ledgers/passing-yards-v237-lockless-owner-v1.json' \
            'streamlit_memory_lazy_router_v237.py' \
            'tests/test_passing_yards_v237_lockless_owner.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "PASSING_YARDS_V237_LOCKLESS_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || {
              echo "PASSING_YARDS_V237_LOCKLESS_PROTECTED_BLOB_CHANGED:$1:$actual:$2"
              exit 1
            }
          }

          check_blob app.py a0329d64e226e57b7fb39624e3d4e68b604ed0ff
          check_blob streamlit_memory_lazy_router_v236.py 0380da16cd91bcf3801b4d105218b508dbaf43f2
          check_blob streamlit_memory_lazy_router_v187.py 449a6a0712ab0f6be70cebe5a3822e59f279e3b6
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob requirements.txt ff1adb99af7cf829f291e6edd1813de9d0040849
          check_blob devsystem/sitewide_page_load_health_v1.py 6fb6750146a34b05f8ba2ff3b72da80e0153ec1e
          check_blob .github/workflows/sitewide-step45-targeted-close-v1.yml 8fdf57caa41828988adb1389fa34979a224385cc

          grep -F 'def _install_passing_owners()' streamlit_memory_lazy_router_v237.py
          grep -F 'identity_router.PROP_HUBS[PASSING_MARKET] = PASSING_HUB' streamlit_memory_lazy_router_v237.py
          if grep -F '_PROCESS_PASSING_ROUTE_RLOCK' streamlit_memory_lazy_router_v237.py; then
            echo "PASSING_YARDS_V237_RENDER_LOCK_STILL_PRESENT"
            exit 1
          fi
          echo "PASSING_YARDS_V237_LOCKLESS_MONSTER_ISOLATION_GREEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cross-session lock regression
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest requests playwright
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_passing_yards_v237_lockless_owner.py
          python -m py_compile streamlit_memory_lazy_router_v237.py
          echo "PASSING_YARDS_V237_TWO_SESSION_CONCURRENCY_GREEN"
          echo "PASSING_YARDS_V237_LOCKLESS_STATIC_GREEN"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start branch app
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/v237_lockless.log 2>&1 &
          echo $! >/tmp/v237_lockless_pid

      - name: Prove exact cold route still reaches V85
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          query=urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
              "ks_py_hint_name":"Jordan Love",
              "ks_py_hint_meta":"GB • QB",
              "ks_py_hint_projection":"276.4",
              "ks_py_hint_attempts":"34.8",
              "ks_py_hint_ypa":"7.94",
              "ks_py_hint_line":"274.5",
              "ks_py_hint_lean":"LEAN OVER",
          })
          url=base+"/?"+query

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=2).status_code<500:
                      break
              except Exception:
                  pass
              time.sleep(.25)
          else:
              raise RuntimeError("PY_V237_LOCKLESS_BRANCH_APP_NOT_READY")

          def count_all(page,selector):
              total=0
              for frame in page.frames:
                  try:
                      total += frame.locator(selector).count()
                  except Exception:
                      pass
              return total

          def wait_for(page,selector,timeout=60):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  if count_all(page,selector)>=1:
                      return
                  page.wait_for_timeout(200)
              raise RuntimeError("PY_V237_LOCKLESS_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context=browser.new_context(viewport={"width":390,"height":844})
              page=context.new_page()
              page.goto(url,wait_until="domcontentloaded",timeout=120000)

              wait_for(page,'[data-passing-yards-visible-cleanup-owner="v85"]',60)
              wait_for(page,'[data-passing-yards-lazy-detail="v79"]',60)

              body="\n".join(
                  frame.locator("body").inner_text(timeout=1500)
                  for frame in page.frames
                  if frame.locator("body").count()
              )
              if "Router V187 direct handler is player-prop identity only." in body:
                  raise RuntimeError("PY_V237_LOCKLESS_V187_CRASH_PRESENT")

              print("PASSING_YARDS_V237_LOCKLESS_BRANCH_V85_GREEN")
              print("PASSING_YARDS_V237_LOCKLESS_BRANCH_NO_V187_CRASH_GREEN")
              context.close()
              browser.close()
          PY

      - name: Print branch log on failure
        if: failure()
        run: tail -n 900 /tmp/v237_lockless.log || true

      - name: Stop branch app
        if: always()
        run: kill "$(cat /tmp/v237_lockless_pid)" 2>/dev/null || true
