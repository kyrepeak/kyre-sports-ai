name: NFL Moneyline V11 No Flash V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_moneyline_hub_v11.py"
      - "streamlit_memory_lazy_router_v130.py"
      - "app.py"
      - "tests/test_nfl_moneyline_v11_no_flash_v1.py"
      - ".github/workflows/nfl-moneyline-v11-no-flash-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-v11-no-flash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pandas numpy streamlit

      - name: Enforce exact five-file V11 no-flash diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-moneyline-v11-no-flash-v1.yml
          app.py
          nfl_moneyline_hub_v11.py
          streamlit_memory_lazy_router_v130.py
          tests/test_nfl_moneyline_v11_no_flash_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Moneyline V11 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile V11 no-flash surface
        run: |
          python -m py_compile \
            nfl_moneyline_hub_v11.py \
            streamlit_memory_lazy_router_v130.py \
            app.py \
            tests/test_nfl_moneyline_v11_no_flash_v1.py

      - name: Prove frozen Moneyline V1-V10 and sibling owners stay untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_moneyline_hub_v([1-9]|10)\.py$|nfl_moneyline_market_v1\.py$|nfl_moneyline_market_api_v1\.py$|nfl_hub_v18\.py$|streamlit_memory_lazy_router_v129\.py$|streamlit_memory_lazy_router_v128\.py$|nfl_passing_yards_.*\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "NFL_MONEYLINE_V11_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "NFL_MONEYLINE_V11_FROZEN_OWNER_GUARD_GREEN"

      - name: Run V11 deterministic no-flash contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v11_no_flash_v1.py

      - name: Re-run certified V10 Kyre API contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v10_kyre_api_v1.py

      - name: Re-run certified V9 matchup-card contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_moneyline_v9_fresh_matchup_cards_v1.py

      - name: Compile frozen Moneyline V1-V10 chain
        run: |
          python -m py_compile \
            nfl_moneyline_hub_v1.py nfl_moneyline_hub_v2.py nfl_moneyline_hub_v3.py \
            nfl_moneyline_hub_v4.py nfl_moneyline_hub_v5.py nfl_moneyline_hub_v6.py \
            nfl_moneyline_hub_v7.py nfl_moneyline_hub_v8.py nfl_moneyline_hub_v9.py \
            nfl_moneyline_hub_v10.py nfl_moneyline_market_v1.py nfl_moneyline_market_api_v1.py \
            nfl_hub_v18.py streamlit_memory_lazy_router_v129.py

      - name: Probe deployed Kyre Sports API Moneyline contract
        shell: bash
        run: |
          python - <<'PY'
          import time
          import requests
          url='https://kyre-sports-api.onrender.com/api/v1/nfl/moneyline/market/status'
          last=None
          for attempt in range(1,4):
              try:
                  r=requests.get(url,timeout=(5,30),headers={'Accept':'application/json','User-Agent':'KyreSportsAI-V11Cert/1.0'})
                  if r.status_code == 200:
                      p=r.json()
                      assert p['status'] == 'ready'
                      assert p['schema_version'] == 'nfl_moneyline_market_v1'
                      assert p['sport'] == 'nfl'
                      assert p['market'] == 'moneyline'
                      assert p['official_event_id_required'] is True
                      assert p['fuzzy_matching'] is False
                      assert p['synthetic_event_ids'] is False
                      assert p['projection_weight'] == 0.0
                      assert p['market_context_only'] is True
                      assert p['may_modify_projection'] is False
                      assert p['model_probability_input'] is False
                      assert p['stake_sizing_enabled'] is False
                      assert p['wager_actions'] is False
                      print('NFL_MONEYLINE_V11_PUBLIC_API_GREEN')
                      break
                  last=RuntimeError(f'HTTP {r.status_code}: {r.text[:300]}')
              except Exception as exc:
                  last=exc
              if attempt < 3:
                  time.sleep(5)
          else:
              raise last or RuntimeError('Kyre Sports API Moneyline probe failed')
          PY

  browser-v11-no-flash:
    needs: certify-v11-no-flash
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start branch-local Streamlit V130
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/moneyline-v11-no-flash
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8521 \
            > artifacts/moneyline-v11-no-flash/streamlit.log 2>&1 &
          echo $! > /tmp/moneyline_v11_pid

      - name: Prove old Moneyline UI never becomes visible
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health, _find_app_frame, _wait_for_text, _body_has_forbidden_error, _choose, BrowserQAFailure

          base='http://127.0.0.1:8521'
          artifacts=Path('artifacts/moneyline-v11-no-flash')
          legacy=[
              'NFL Moneyline Command Center',
              'STEP 1A PASSED',
              'STEP 1B PASSED',
              'Step 2 — QB Depth + Current Availability',
              'Step 3 — Preseason Game-Plan Intelligence',
              'Step 5 — Sportsbook Moneyline Market',
              'Step 7 — No-Vig Edge + Expected Value',
          ]
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1024,'height':1366})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  market_combo.wait_for(state='visible',timeout=30000)

                  frame.evaluate("""(markers) => {
                      window.__moneylineVisibleLegacyFlashes = [];

                      const hiddenByAncestry = (el) => {
                          for (let cur = el; cur; cur = cur.parentElement) {
                              if (cur.hidden) return true;
                              const style = window.getComputedStyle(cur);
                              if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) {
                                  return true;
                              }
                          }
                          return false;
                      };

                      const inspectTextNode = (textNode) => {
                          if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return;
                          const parent = textNode.parentElement;
                          if (!parent || hiddenByAncestry(parent)) return;
                          const text = textNode.textContent || '';
                          for (const marker of markers) {
                              if (text.includes(marker) && !window.__moneylineVisibleLegacyFlashes.includes(marker)) {
                                  window.__moneylineVisibleLegacyFlashes.push(marker);
                              }
                          }
                      };

                      const scan = (node) => {
                          if (!node) return;
                          if (node.nodeType === Node.TEXT_NODE) {
                              inspectTextNode(node);
                              return;
                          }
                          if (node.nodeType !== Node.ELEMENT_NODE && node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE && node.nodeType !== Node.DOCUMENT_NODE) {
                              return;
                          }
                          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
                          let current = walker.nextNode();
                          while (current) {
                              inspectTextNode(current);
                              current = walker.nextNode();
                          }
                      };

                      scan(document.body);
                      window.__moneylineLegacyObserver = new MutationObserver((mutations) => {
                          for (const mutation of mutations) {
                              if (mutation.type === 'characterData') scan(mutation.target);
                              for (const node of mutation.addedNodes || []) scan(node);
                          }
                      });
                      window.__moneylineLegacyObserver.observe(document.body,{subtree:true,childList:true,characterData:true});
                  }""", legacy)

                  _choose(page,frame,1,'Moneyline')
                  _wait_for_text(frame,'NFL Moneyline Matchup Board',240.0)
                  cards=frame.locator('.kml9-matchup-card')
                  deadline=time.time()+240
                  while time.time() < deadline and cards.count() < 1:
                      time.sleep(2)
                  if cards.count() < 1:
                      raise BrowserQAFailure('expected at least one Moneyline V11 matchup card')
                  time.sleep(2)

                  flashes=frame.evaluate("() => window.__moneylineVisibleLegacyFlashes || []")
                  if flashes:
                      raise BrowserQAFailure(f'legacy Moneyline UI became visible before V11 cards: {flashes}')

                  hidden_selector='.st-key-nfl_moneyline_v11_legacy_hidden'
                  hidden_count=frame.locator(hidden_selector).count()
                  hidden_display=None
                  if hidden_count:
                      hidden_display=frame.locator(hidden_selector).first.evaluate('(el) => getComputedStyle(el).display')
                      if hidden_display != 'none':
                          raise BrowserQAFailure(f'V11 legacy execution container is not hidden: display={hidden_display!r}')

                  body=frame.locator('body').inner_text()
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Moneyline V11 runtime error marker: {forbidden}')
                  leaked=[marker for marker in legacy if marker in body]
                  if leaked:
                      raise BrowserQAFailure(f'legacy Moneyline UI remains visible in final page: {leaked}')
                  if 'no sportsbook provider key is connected' in body.lower():
                      raise BrowserQAFailure('legacy provider-key gate leaked into V11')

                  first=cards.nth(0)
                  if first.locator('.kml9-team-panel').count() != 2:
                      raise BrowserQAFailure('first V11 matchup card must contain exactly two team panels')
                  first_text=first.inner_text()
                  for label in ('MODEL P(WIN)','MARKET NO-VIG','EDGE','EV / 1U','FINAL MONEYLINE STATE'):
                      if label not in first_text:
                          raise BrowserQAFailure(f'missing Moneyline V11 card label: {label}')

                  overflow=frame.evaluate('() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth')
                  if overflow > 4:
                      raise BrowserQAFailure(f'iPad horizontal overflow detected: {overflow}px')
                  if frame.get_by_text('Model details & guardrails',exact=False).count() < 1:
                      raise BrowserQAFailure('Moneyline details/guardrails drawer missing')

                  result={
                      'status':'GREEN',
                      'viewport':'1024x1366',
                      'matchup_cards':cards.count(),
                      'team_panels_first_card':2,
                      'legacy_visible_flash_count':len(flashes),
                      'legacy_visible_final_count':len(leaked),
                      'hidden_legacy_container_count':hidden_count,
                      'hidden_legacy_container_display':hidden_display,
                      'horizontal_overflow_px':overflow,
                      'active_router':'streamlit_memory_lazy_router_v130',
                      'active_moneyline_hub':'nfl_moneyline_hub_v11',
                      'frozen_transport':'nfl_moneyline_hub_v10',
                      'frozen_presentation':'nfl_moneyline_hub_v9',
                      'sportsbook_model_influence':0.0,
                      'stake_sizing_enabled':False,
                  }
                  (artifacts/'moneyline_v11_no_flash_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'moneyline_v11_no_flash_ipad.png'),full_page=True)
                  print('NFL_MONEYLINE_V11_NO_VISIBLE_FLASH_BROWSER_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 600 artifacts/moneyline-v11-no-flash/streamlit.log || true

      - name: Upload V11 no-flash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-v11-no-flash-${{ github.run_id }}
          path: artifacts/moneyline-v11-no-flash
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/moneyline_v11_pid ]; then
            kill "$(cat /tmp/moneyline_v11_pid)" || true
          fi
