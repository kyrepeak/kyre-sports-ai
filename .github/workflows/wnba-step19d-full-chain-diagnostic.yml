name: WNBA Step19E full-chain read-only certification

on:
  push:
    branches: [wnba-step19d-full-chain-diagnostic-20260829]

permissions:
  contents: read

env:
  PYTHONPATH: .
  WEB_CONCURRENCY: '1'
  WNBA_STEP16B_DURABLE_LIFECYCLE_ENABLED: 'true'
  WNBA_STEP17B_ALWAYS_ON_ENABLED: 'true'
  WNBA_STEP17B_LOOP_SECONDS: '60'
  WNBA_STEP14C_DURABLE_RESTART_LEASE_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_READ_ENABLED: 'true'
  WNBA_STEP14B_DATABASE_WRITE_ENABLED: 'true'
  WNBA_STEP14A_PERSISTENCE_CONTRACT_ENABLED: 'true'
  WNBA_STEP13D_FINAL_SCHEDULER_FREEZE_ENABLED: 'true'
  WNBA_STEP13C_RELIABILITY_RECOVERY_ENABLED: 'true'
  WNBA_STEP13B_RUNTIME_SUPERVISOR_ENABLED: 'true'
  WNBA_STEP13A_BOUNDED_SCHEDULER_ENABLED: 'true'
  WNBA_STEP12D_FINAL_RUNTIME_FREEZE_ENABLED: 'true'
  WNBA_STEP12C_LIVE_BOARD_RUNTIME_ENABLED: 'true'
  WNBA_STEP12B_LIVE_RUNTIME_ASSEMBLY_ENABLED: 'true'
  WNBA_STEP12A_SHADOW_RUNNER_ENABLED: 'true'
  WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: 'true'
  WNBA_STEP19A_DRAFTKINGS_SITE: dkusaz
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: 'true'
  WNBA_STEP11B_NETWORK_REFRESH_ENABLED: 'true'
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: 'true'
  WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: 'true'
  WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: 'true'
  WNBA_STEP10_FASTAPI_ENABLED: 'true'
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: 'true'
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: 'true'
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: 'true'
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: 'true'
  WNBA_STEP9_FASTAPI_ENABLED: 'true'
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: 'true'
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: 'true'
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: 'true'
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
  WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
  WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
  WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP18A_STREAMLIT_CONSUMER_ENABLED: 'true'
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_STEP12_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_PERSISTENCE_ENABLED: 'false'
  WNBA_SUPABASE_WRITE_ENABLED: 'false'
  WNBA_WAGERING_ENABLED: 'false'
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: 'false'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: wnba-render-staging
    env:
      KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 222550f3d2db46d470e4ba050848a9110920fcab
          fetch-depth: 1
      - name: Install runtime dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt >/dev/null
          python -m pip install -r sports_api/requirements-persistence.txt >/dev/null
      - name: Prove exact candidate and full scheduler recovery read-only
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          import sports_api.main
          from sports_api import wnba_step17b_always_on_runtime as s17b
          from sports_api import wnba_step19e_cooldown_aware_cycle as s19e
          from sports_api import wnba_step14c_durable_restart_lease as s14c
          from sports_api import wnba_step13b_runtime_supervisor as s13b
          from sports_api import wnba_step13c_reliability_recovery as s13c
          assert s17b.run_one_cycle is s19e.run_one_cycle_step19e
          env=dict(os.environ)
          loaded=s14c.load_step14c_restart_checkpoint(slate_date='2026-08-29',env=env)
          state=loaded.get('controller_state_for_restart') if loaded.get('found') else None
          if not isinstance(state,dict): raise SystemExit('missing durable checkpoint')
          before={k:state.get(k) for k in ('circuit_state','consecutive_failure_count','circuit_open_until_utc','policy')}
          print('STEP19E_REAL_CHECKPOINT_BEFORE',json.dumps(before,sort_keys=True,default=str),flush=True)
          policy=state.get('policy') or {}
          probe=datetime.now(timezone.utc)
          raw=str(state.get('circuit_open_until_utc') or '').strip()
          if raw.endswith(('Z','z')): raw=raw[:-1]+'+00:00'
          if raw:
              opened=datetime.fromisoformat(raw).astimezone(timezone.utc)
              if opened>=probe: probe=opened+timedelta(seconds=1)
          parent=s13b.build_step13b_request(
              season=2026, initial_slate_date='2026-08-29', slate_timezone='America/New_York',
              rollover_policy='stop', max_supervisor_sessions=1, max_supervisor_runtime_seconds=300,
              max_total_intersession_sleep_seconds=0, scheduler_cycles_per_session=1,
              scheduler_sleep_budget_seconds_per_session=0, initial_previous_state=state,
              controller_policy={'refresh_interval_seconds':int(policy.get('refresh_interval_seconds',60)),'failure_threshold':int(policy.get('failure_threshold',3)),'circuit_cooldown_seconds':int(policy.get('circuit_cooldown_seconds',180)),'provider_attempts':3},
              refresh_policy={}, qualification_policy={})
          req=s13c.build_step13c_request(supervisor_request=parent,max_recovery_attempts=2,base_recovery_backoff_seconds=5,max_total_recovery_sleep_seconds=10)
          result=s13c.run_step13c_reliability_recovery(req,env=env,stop_requested=lambda:False,clock=lambda:probe)
          final=result.get('final_controller_state_for_restart_handoff') or {}
          latest=result.get('latest_supervisor') or {}
          sessions=latest.get('sessions') or latest.get('session_history') or []
          last=sessions[-1] if sessions else {}
          summary={'status':result.get('status'),'health':result.get('health'),'circuit':final.get('circuit_state'),'failures':final.get('consecutive_failure_count'),'board_available':last.get('latest_board_available'),'session_health':last.get('health')}
          print('STEP19E_FULL_CHAIN_RESULT',json.dumps(summary,sort_keys=True,default=str),flush=True)
          assert result.get('status')=='completed', summary
          assert result.get('health')=='healthy', summary
          assert final.get('circuit_state')=='closed', summary
          assert int(final.get('consecutive_failure_count') or 0)==0, summary
          assert last.get('latest_board_available') is True, summary
          assert last.get('health')=='healthy', summary
          print('STEP19E_REAL_FULL_CHAIN_CLOSED_ZERO_CERTIFIED')
          PY
