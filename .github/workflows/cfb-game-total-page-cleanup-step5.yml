name: CFB Game Total page cleanup Step 5 Game Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_game_evidence_v1.py"
      - "cfb_game_total_clean_page_v24.py"
      - "streamlit_memory_lazy_router_v169.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step5.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step5-game-evidence.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step5.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_game_evidence_v1.py"
      - "cfb_game_total_clean_page_v24.py"
      - "streamlit_memory_lazy_router_v169.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step5.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step5-game-evidence.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step5.yml"

permissions:
  contents: read

jobs:
  verify-step5-game-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 5 data files
        run: |
          python -m py_compile cfb_game_total_game_evidence_v1.py cfb_game_total_clean_page_v24.py streamlit_memory_lazy_router_v169.py app.py
      - name: Run targeted Step 5 contract proof
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_game_total_page_cleanup_step5.py
      - name: Prove Purdue UCLA Game Evidence fields live
        run: |
          python - <<'PY'
          import json
          import cfb_game_total_clean_page_v9 as compact
          import cfb_game_total_clean_page_v24 as page
          import cfb_game_total_slate_v2 as slate_v2

          day = "2026-09-19"
          games, _ = compact.frozen_page.frozen_v2.frozen_v1.schedule.load_with_diagnostics(day)
          matches = [
              dict(g) for g in games
              if str(g.get("away_team") or "").strip().casefold() == "purdue"
              and str(g.get("home_team") or "").strip().casefold() == "ucla"
          ]
          assert len(matches) == 1, matches
          game = matches[0]
          result = slate_v2.analyze_game(game, day)
          display_game, away, home, diag = page._reconcile_display_bundle_v24(
              game, day, result["away"], result["home"]
          )

          def usable(value):
              text = str(value or "").strip()
              return bool(text and text != "—" and "unavailable" not in text.lower())

          checks = {
              "venue": usable(display_game.get("venue")),
              "kickoff": usable(
                  display_game.get("kickoff")
                  or display_game.get("kickoff_iso")
                  or display_game.get("date")
                  or display_game.get("start_time")
              ),
              "temperature": display_game.get("temperature") not in (None, "", "—"),
              "weather": usable(display_game.get("weather") or display_game.get("forecast")),
              "wind": usable(display_game.get("wind") or display_game.get("wind_mph")),
              "status": usable(display_game.get("status") or display_game.get("game_status")),
          }
          assert all(checks.values()), (checks, display_game, diag)
          evidence_diag = diag.get("step5_game_evidence") or {}
          assert evidence_diag.get("data_green") is True, evidence_diag
          assert float(evidence_diag.get("sportsbook_projection_influence") or 0.0) == 0.0

          print(json.dumps({
              "marker": "CFB_GAME_TOTAL_PAGE_CLEANUP_STEP5_GAME_EVIDENCE_DATA_GREEN",
              "event_id": game.get("espn_event_id") or game.get("event_id"),
              "checks": checks,
              "venue": display_game.get("venue"),
              "venue_location": display_game.get("venue_location"),
              "temperature": display_game.get("temperature"),
              "weather": display_game.get("weather"),
              "wind": display_game.get("wind"),
              "kickoff": (
                  display_game.get("kickoff")
                  or display_game.get("kickoff_iso")
                  or display_game.get("date")
              ),
              "status": display_game.get("status") or display_game.get("game_status"),
              "diag": evidence_diag,
          }, indent=2, default=str))
          PY
