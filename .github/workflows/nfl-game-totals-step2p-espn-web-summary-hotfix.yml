name: NFL Game Totals Step 2P ESPN Web Summary Hotfix

on:
  push:
    branches:
      - monster/nfl-game-totals-step2p-espn-web-summary-hotfix
  pull_request:
    branches:
      - mlb-step17b-shared-host-cert
    paths:
      - sports_api/collectors/nfl_fanduel_game_totals_v1.py
      - tests/test_nfl_game_totals_espn_web_summary_hotfix.py
      - tests/test_nfl_fanduel_game_totals_v1.py
      - tests/test_nfl_game_totals_market_v1.py
      - .github/workflows/nfl-game-totals-step2p-espn-web-summary-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow test dependencies
        run: python -m pip install --upgrade pip pytest fastapi httpx
      - name: Freeze-scope guard
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'sports_api/collectors/nfl_fanduel_game_totals_v1.py',
              'tests/test_nfl_game_totals_espn_web_summary_hotfix.py',
              '.github/workflows/nfl-game-totals-step2p-espn-web-summary-hotfix.yml',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/mlb-step17b-shared-host-cert...HEAD'],
              text=True,
          ).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'Unexpected hotfix paths: {extra}')
          print('freeze-scope OK:', sorted(changed))
          PY
      - name: Compile collector
        run: python -m py_compile sports_api/collectors/nfl_fanduel_game_totals_v1.py
      - name: Run ESPN host regression
        run: python -m pytest -q tests/test_nfl_game_totals_espn_web_summary_hotfix.py
      - name: Run certified Game Totals regressions
        run: python -m pytest -q tests/test_nfl_fanduel_game_totals_v1.py tests/test_nfl_game_totals_market_v1.py
