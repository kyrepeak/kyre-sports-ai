name: WNBA Navigation V2 Step 4 Fast Cert

on:
  push:
    branches:
      - feature/wnba-navigation-v2-step4-player-intelligence
    paths:
      - "wnba_pra_player_intelligence_v2_step4.py"
      - "streamlit_memory_lazy_router_wnba_nav_v2_step4.py"
      - "devsystem/wnba_nav_step4_fast_cert.py"
      - ".github/workflows/wnba-nav-step4-fast-cert.yml"
      - "app.py"
  pull_request:
    branches: [main]
    paths:
      - "wnba_pra_player_intelligence_v2_step4.py"
      - "streamlit_memory_lazy_router_wnba_nav_v2_step4.py"
      - "devsystem/wnba_nav_step4_fast_cert.py"
      - ".github/workflows/wnba-nav-step4-fast-cert.yml"
      - "app.py"

permissions:
  contents: read

concurrency:
  group: wnba-nav-step4-fast-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Certify WNBA Navigation Step 4
        run: python3 devsystem/wnba_nav_step4_fast_cert.py
