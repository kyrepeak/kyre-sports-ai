name: WNBA Step19A live compatibility certification

on:
  push:
    branches:
      - wnba-step19a-live-compat-fix-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  WNBA_STEP19A_DRAFTKINGS_SPORTSCONTENT_ENABLED: "true"
  WNBA_STEP19A_DRAFTKINGS_SITE: "dkusaz"
  WNBA_STEP11A_DRAFTKINGS_PROVIDER_ENABLED: "true"
  WNBA_STEP11B_NETWORK_REFRESH_ENABLED: "true"
  WNBA_STEP11C_FANDUEL_PROVIDER_ENABLED: "true"
  WNBA_STEP11D_MULTIBOOK_SHADOW_ENABLED: "true"
  WNBA_STEP11E_CONTROLLED_AUTOMATION_ENABLED: "true"
  WNBA_STEP10_FASTAPI_ENABLED: "true"
  WNBA_STEP10A_LIVE_MARKET_INPUT_ENABLED: "true"
  WNBA_STEP10B_MARKET_ADAPTER_ENABLED: "true"
  WNBA_STEP10C_MARKET_SNAPSHOT_ENABLED: "true"
  WNBA_STEP10D_REFRESH_CONTROLLER_ENABLED: "true"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 500
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt
          python -m pip install pytest

      - name: Compile Step19A compatibility surfaces
        run: |
          python -m py_compile sports_api/wnba_step19a_draftkings_sportscontent.py
          python -m py_compile sports_api/wnba_step19a_live_compat.py
          python -m py_compile sports_api/wnba_step19a_step17b_bridge.py

      - name: Run Step19A deterministic regressions
        run: |
          pytest -q tests/test_wnba_step19a_draftkings_sportscontent.py tests/test_wnba_step19a_live_compat.py

      - name: Run explicit 57-failure circuit recovery certification
        run: pytest -q tests/test_wnba_step19a_circuit_recovery.py

      - name: Prove frozen provider scheduler and reconciliation sources unchanged
        run: |
          set -euo pipefail
          BASE='70aa357df98ef8ce931a249677484fd205f25467'
          git diff --exit-code "$BASE"..HEAD -- \
            sports_api/wnba_step11_draftkings_provider.py \
            sports_api/wnba_step11_fanduel_provider.py \
            sports_api/wnba_step11_multibook_shadow_board.py \
            sports_api/wnba_step11_controlled_automation.py \
            sports_api/wnba_step17b_always_on_runtime.py \
            sports_api/wnba_step6d_direct_integration.py \
            sports_api/wnba_reconciled_direct_sync.py
          echo STEP19A_FROZEN_SOURCES_UNCHANGED

      - name: Prove Step17B local reconciliation gates stay process-OFF
        run: |
          python - <<'PY'
          from sports_api import wnba_step17b_always_on_runtime as s17
          from sports_api import wnba_step19a_step17b_bridge as bridge
          from sports_api import wnba_step6d_direct_integration as s6d
          from sports_api import wnba_reconciled_direct_sync as s6i
          from sports_api import wnba_step19a_draftkings_sportscontent as s19
          source={s19.STEP19A_ENABLED_ENV:'true', s6d.DIRECT_SYNC_ENABLED_ENV:'false', s6i.RECONCILED_SYNC_ENABLED_ENV:'false'}
          runtime=s17.build_runtime_env(source)
          assert runtime[s6d.DIRECT_SYNC_ENABLED_ENV]=='false'
          assert runtime[s6i.RECONCILED_SYNC_ENABLED_ENV]=='false'
          assert runtime[s19.STEP19A_ENABLED_ENV]=='true'
          status=bridge.INSTALLATION
          assert status['live_provider_compat']['installed'] is True
          assert status['frozen_step11a_source_modified'] is False
          assert status['frozen_step11c_source_modified'] is False
          assert status['frozen_step11d_source_modified'] is False
          print('STEP19A_BRIDGE_SAFETY_OK')
          PY

      - name: Live read-only DraftKings and FanDuel provider certification
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          from sports_api import wnba_step19a_step17b_bridge as bridge  # installs compatibility
          from sports_api import wnba_step11_draftkings_provider as dk
          from sports_api import wnba_step11_fanduel_provider as fd

          now=datetime.now(timezone.utc)
          slate=now.astimezone(ZoneInfo('America/New_York')).date().isoformat()
          env=dict(os.environ)
          dk_result=dk.fetch_step11a_draftkings_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=env)
          fd_result=fd.fetch_step11c_fanduel_provider_bridge(season=2026,slate_date=slate,evaluated_at=now,env=env)
          def records(result):
              attempts=(result.get('provider_refresh') or {}).get('attempts') or []
              assert len(attempts)==1 and attempts[0].get('ok') is True
              return (attempts[0].get('payload') or {}).get('records') or []
          dkr=records(dk_result); fdr=records(fd_result)
          assert dkr, 'DraftKings bridge returned no live records'
          assert fdr, 'FanDuel bridge returned no live records'
          for name,rows in [('DraftKings',dkr),('FanDuel',fdr)]:
              stats={str(r.get('stat')) for r in rows}
              assert {'points','rebounds','assists','pra'} <= stats, (name,stats)
              sides={str(r.get('side')) for r in rows}
              assert {'over','under'} <= sides, (name,sides)
          print('STEP19A_LIVE_TWO_PROVIDER_OK', {'slate':slate,'draftkings_records':len(dkr),'fanduel_records':len(fdr)})
          PY

      - name: Live read-only frozen Step11D two-book board certification
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          from sports_api import wnba_step19a_step17b_bridge  # install bridge + live compat
          from sports_api import wnba_step11_multibook_shadow_board as step11d
          now=datetime.now(timezone.utc)
          slate=now.astimezone(ZoneInfo('America/New_York')).date().isoformat()
          result=step11d.run_step11d_multibook_shadow_board(
              season=2026,
              slate_date=slate,
              step8_distributions=[],
              evaluated_at=now,
              provider_attempts=1,
              env=dict(os.environ),
          )
          providers=result.get('providers') or []
          assert len(providers)==2
          assert all(p.get('succeeded') is True for p in providers), providers
          summary=result.get('shadow_summary') or {}
          assert summary.get('successful_provider_count')==2, summary
          assert result.get('shadow_only') is True
          assert (result.get('guardrails') or {}).get('supabase_mutated') is False
          assert (result.get('guardrails') or {}).get('persistence_mutated') is False
          print('STEP19A_STEP11D_LIVE_OK', {'slate':slate,'summary':summary})
          PY

      - name: Reassert production and write switches remain OFF
        if: always()
        run: |
          python - <<'PY'
          import os
          keys=[
            'WNBA_PRODUCTION_RUNTIME_ENABLED','WNBA_BOARD_SCHEDULER_ENABLED',
            'WNBA_KYRE_DIRECT_SYNC_ENABLED','WNBA_KYRE_RECONCILED_SYNC_ENABLED',
            'WNBA_STEP6J_CANARY_ENABLED','WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED',
            'WNBA_PERSISTENCE_ENABLED','WNBA_SUPABASE_WRITE_ENABLED','WNBA_WAGERING_ENABLED',
          ]
          truthy=lambda v:str(v or '').strip().casefold() not in {'','0','false','no','off','disabled'}
          bad=[k for k in keys if truthy(os.environ.get(k))]
          assert not bad, bad
          print('STEP19A_NONPRODUCTION_CERT_SAFETY_OK')
          PY
