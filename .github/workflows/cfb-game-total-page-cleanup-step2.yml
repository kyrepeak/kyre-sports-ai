name: CFB Game Total page cleanup Step 2 presentation

on:
  pull_request:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v21.py"
      - "streamlit_memory_lazy_router_v166.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step2.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step2-presentation.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step2.yml"
  push:
    branches: [main]
    paths:
      - "cfb_game_total_clean_page_v21.py"
      - "streamlit_memory_lazy_router_v166.py"
      - "app.py"
      - "tests/test_cfb_game_total_page_cleanup_step2.py"
      - "devsystem/task_ledgers/cfb-game-total-page-cleanup-step2-presentation.json"
      - ".github/workflows/cfb-game-total-page-cleanup-step2.yml"

permissions:
  contents: read

jobs:
  verify-step2-presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Compile Step 2 presentation files
        run: |
          python -m py_compile cfb_game_total_clean_page_v21.py streamlit_memory_lazy_router_v166.py app.py
      - name: Run targeted Step 2 presentation proof
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_game_total_page_cleanup_step2.py
