name: Passing Yards Visual Upgrade Step 1

on:
  push:
    branches:
      - "monster/passing-yards-visual-upgrade-step1-top-v1"

permissions:
  contents: read

jobs:
  targeted-step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Step 1 presentation chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v46.py streamlit_memory_lazy_router_v192.py app.py
      - name: Prove compact top control deck contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_visual_upgrade_step1_v1.py
