name: MLB Step16C live PostgreSQL canary

on:
  push:
    branches:
      - mlb-step16c-live-postgresql-canary
    paths:
      - sports_api/mlb_step16c_live_postgresql_canary_v1.py
      - sports_api/tools/mlb_step16c_live_postgresql_canary.py
      - tests/test_mlb_step16c_live_postgresql_canary_v1.py
      - .github/workflows/mlb-step16c-live-postgresql-canary.yml
  pull_request:
    branches: [main]
    paths:
      - sports_api/mlb_step16c_live_postgresql_canary_v1.py
      - sports_api/tools/mlb_step16c_live_postgresql_canary.py
      - tests/test_mlb_step16c_live_postgresql_canary_v1.py
      - .github/workflows/mlb-step16c-live-postgresql-canary.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"
  MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED: "true"
  MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED: "true"
  MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED: "true"
  MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED: "true"
  MLB_STEP14B_DATABASE_READ_ENABLED: "true"
  MLB_STEP14B_DATABASE_WRITE_ENABLED: "true"

jobs:
  certify-and-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KYRE_DATABASE_URL: ${{ secrets.KYRE_DATABASE_URL }}
      MLB_STEP16C_CANARY_OWNER_ID: step16c-gha-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert frozen Step16C parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor eb0ea430caea02f90b6367b8bc0ea28f698246bf HEAD
          git diff --check eb0ea430caea02f90b6367b8bc0ea28f698246bf...HEAD
          git diff --exit-code eb0ea430caea02f90b6367b8bc0ea28f698246bf...HEAD -- \
            sports_api/mlb_step16a_production_activation_contract_v1.py \
            sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/api/mlb.py app.py
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API, test, and PostgreSQL dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Compile Step16C
        run: |
          python -m py_compile \
            sports_api/mlb_step16c_live_postgresql_canary_v1.py \
            sports_api/tools/mlb_step16c_live_postgresql_canary.py \
            tests/test_mlb_step16c_live_postgresql_canary_v1.py

      - name: Run Step16C targeted tests
        env:
          KYRE_DATABASE_URL: ""
        run: python -m pytest -q tests/test_mlb_step16c_live_postgresql_canary_v1.py

      - name: Re-run Step16B targeted guards unchanged
        env:
          KYRE_DATABASE_URL: ""
        run: python -m pytest -q tests/test_mlb_step16b_production_packaging_lifecycle_v1.py

      - name: Run frozen Step16A guards at exact certified parent
        env:
          KYRE_DATABASE_URL: ""
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mlb-step16a-parent
          git worktree add --detach /tmp/mlb-step16a-parent c5ad6047224aaf014cec13f5efa6e5cd650da939
          (
            cd /tmp/mlb-step16a-parent
            PYTHONPATH=. python -m pytest -q tests/test_mlb_step16a_production_activation_contract_v1.py
          )
          git worktree remove /tmp/mlb-step16a-parent --force

      - name: Run current MLB regression excluding frozen Step16A snapshot guards
        env:
          KYRE_DATABASE_URL: ""
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            if [ "$path" != "tests/test_mlb_step16a_production_activation_contract_v1.py" ]; then
              files+=("$path")
            fi
          done
          test "${#files[@]}" -gt 0
          python -m pytest -q "${files[@]}"

      - name: Require secret-manager database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KYRE_DATABASE_URL:-}"
          case "$KYRE_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "KYRE_DATABASE_URL is not PostgreSQL"; exit 1 ;;
          esac

      - name: Execute one-shot packaged lifecycle canary
        run: PYTHONPATH=. python -m sports_api.tools.mlb_step16c_live_postgresql_canary

      - name: Upload Step16C live evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step16c-live-postgresql-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: mlb-step16c-live-postgresql-canary.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false

      - name: Final marker
        run: echo MLB_STEP16C_LIVE_POSTGRESQL_CANARY_GREEN
