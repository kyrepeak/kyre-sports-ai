name: MONSTER V7 Step 6 Final-Mile Autopilot

on:
  push:
    branches:
      - "monster/monster-v7-step6-final-mile-autopilot-v1"
    paths:
      - "devsystem/final_mile_autopilot_v1.py"
      - "tests/test_devsystem_final_mile_autopilot_v1.py"
      - "devsystem/task_ledgers/monster-v7-step6-final-mile-autopilot-v1.json"
      - ".github/workflows/monster-v7-step6-final-mile-autopilot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/final_mile_autopilot_v1.py"
      - "tests/test_devsystem_final_mile_autopilot_v1.py"
      - "devsystem/task_ledgers/monster-v7-step6-final-mile-autopilot-v1.json"
      - ".github/workflows/monster-v7-step6-final-mile-autopilot.yml"

permissions:
  contents: read

concurrency:
  group: monster-v7-step6-final-mile-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: final-mile autopilot focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen Step 5 wait-queue dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/atomic_wait_queue_lease_handoff_v1.py)" = "6d5a75b2d66a0439563b92ee04a1b8c8024d1dad"

      - name: Verify frozen deployment convergence dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/deployment_convergence_controller_v1.py)" = "117b4953b5112be9ca8065e5a9cafb48d5f2112a"

      - name: Verify frozen terminal receipt dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/terminal_proof_receipt_v1.py)" = "e009da0790abbed2b24664b1031abf41d2f6c1fd"

      - name: Run final-mile autopilot contract
        run: python devsystem/final_mile_autopilot_v1.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_final_mile_autopilot_v1.py

      - name: Emit Step 6 GREEN marker
        run: echo "MONSTER_V7_STEP6_FINAL_MILE_AUTOPILOT_GREEN"
