name: NFL Live Game Repair Step 3 Rushing Live

on:
  push:
    branches:
      - main
      - nfl-live-game-repair-step3-rushing-live-r1
    paths:
      - "devsystem/nfl_live_game_repair_step3_rushing_live_v1.py"
      - "tests/test_nfl_live_game_repair_step3_rushing_live_v1.py"
      - "devsystem/task_ledgers/nfl-live-game-repair-step3-rushing-live-v1.json"
      - ".github/workflows/nfl-live-game-repair-step3-rushing-live-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "devsystem/nfl_live_game_repair_step3_rushing_live_v1.py"
      - "tests/test_nfl_live_game_repair_step3_rushing_live_v1.py"
      - "devsystem/task_ledgers/nfl-live-game-repair-step3-rushing-live-v1.json"
      - ".github/workflows/nfl-live-game-repair-step3-rushing-live-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-live-game-repair-step3-rushing-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest
      - name: Run permanent Step 3 tests
        run: python -m pytest -q tests/test_nfl_live_game_repair_step3_rushing_live_v1.py
      - name: Require one real live NFL Rushing path
        if: github.event_name != 'workflow_dispatch'
        run: python -m devsystem.nfl_live_game_repair_step3_rushing_live_v1 --require-live
