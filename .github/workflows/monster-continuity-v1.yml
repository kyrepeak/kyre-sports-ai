name: Monster Continuity V1

on:
  pull_request:
    branches: [main]
    paths:
      - "sports_api/monster_continuity_v1.py"
      - "tests/test_monster_continuity_v1.py"
      - ".github/workflows/monster-continuity-v1.yml"
  push:
    branches: [main]
    paths:
      - "sports_api/monster_continuity_v1.py"
      - "tests/test_monster_continuity_v1.py"
      - ".github/workflows/monster-continuity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-continuity-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install Continuity dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest playwright

      - name: Compile Continuity Layer
        run: |
          python -m py_compile sports_api/monster_continuity_v1.py

      - name: Run Continuity recovery contracts
        run: |
          python -m pytest -q tests/test_monster_continuity_v1.py

      - name: Prove create validate resume and drift CLI paths
        run: |
          python -m sports_api.monster_continuity_v1 create \
            --task-id ci-continuity \
            --title "CI Continuity Recovery" \
            --repo kyrepeak/kyre-sports-ai \
            --branch monster-continuity-layer-v1 \
            --commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --main-commit bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --step D \
            --step-title "Resume command" \
            --next-action "Resume from the saved checkpoint" \
            --created-at 2026-09-14T22:50:00Z \
            --output /tmp/monster-checkpoint.json > /tmp/create.json
          python -m sports_api.monster_continuity_v1 validate \
            --checkpoint /tmp/monster-checkpoint.json > /tmp/validate.json
          python -m sports_api.monster_continuity_v1 resume \
            --checkpoint /tmp/monster-checkpoint.json \
            --current-branch monster-continuity-layer-v1 \
            --current-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --current-main-commit bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb > /tmp/resume.json
          python -m sports_api.monster_continuity_v1 resume \
            --checkpoint /tmp/monster-checkpoint.json \
            --current-main-commit cccccccccccccccccccccccccccccccccccccccc > /tmp/drift.json
          python - <<'PY'
          import json
          from pathlib import Path

          create = json.loads(Path('/tmp/create.json').read_text())
          validate = json.loads(Path('/tmp/validate.json').read_text())
          resume = json.loads(Path('/tmp/resume.json').read_text())
          drift = json.loads(Path('/tmp/drift.json').read_text())
          assert create['status'] == 'CHECKPOINT_WRITTEN'
          assert validate['status'] == 'VALID'
          assert resume['status'] == 'READY_TO_RESUME'
          assert resume['drift']['status'] == 'ALIGNED'
          assert drift['status'] == 'REVALIDATE'
          assert drift['drift']['status'] == 'DRIFT'
          print('continuity CLI: create/validate/resume/drift GREEN')
          PY

      - name: Prove Continuity stays outside production entrypoints
        run: |
          python - <<'PY'
          from sports_api.monster_dependency_map_v1 import build_dependency_map

          graph = build_dependency_map('.')
          report = graph.impact_report('sports_api/monster_continuity_v1.py')
          assert report['status'] == 'OK'
          assert report['impacted_entrypoints'] == [], report['impacted_entrypoints']
          print('continuity blast_radius=', report['blast_radius'], 'entrypoints=[]')
          PY

      - name: Run existing Monster one-command certification
        run: |
          python -m sports_api.monster_certification_v1 --json > /tmp/monster-cert.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/monster-cert.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['failed_check_count'] == 0
          print('monster-certification:', receipt['passed_check_count'], '/', receipt['required_check_count'])
          PY

      - name: Prove Continuity safety constants
        run: |
          python - <<'PY'
          from sports_api.monster_continuity_v1 import (
              AUTO_FIX,
              MAY_MODIFY_PROJECTION,
              MAY_MODIFY_RUNTIME,
              MAY_MODIFY_SOURCE_DATA,
              NETWORK_CALLS,
              PROJECTION_WEIGHT,
          )
          assert PROJECTION_WEIGHT == 0.0
          assert MAY_MODIFY_PROJECTION is False
          assert MAY_MODIFY_SOURCE_DATA is False
          assert MAY_MODIFY_RUNTIME is False
          assert NETWORK_CALLS is False
          assert AUTO_FIX is False
          print('Continuity V1 is read-only and network-free by default')
          PY
