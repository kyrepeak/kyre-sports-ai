name: DIAGNOSTIC NFL Prop Step 4 Page 2 Truth Gate V1

on:
  push:
    branches:
      - "diagnostic/nfl-prop-step4-page2-truth-gate-v1"
    paths:
      - ".github/workflows/diagnostic-nfl-prop-step4-page2-truth-gate-v1.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded diagnostic stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose first broken Page 2 truth gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode

          from playwright.sync_api import sync_playwright

          from nfl_prop_analytics_schedule_v1 import load_schedule_truth
          from nfl_prop_analytics_game_select_v1 import (
              _eligible_games,
              build_matchup_handoff,
          )
          from nfl_prop_analytics_roster_truth_v1 import load_verified_roster_truth
          from nfl_prop_analytics_availability_depth_v1 import load_availability_depth_truth

          base = "https://kyre-sports-ai.streamlit.app"

          def find(page, selector, timeout=120):
              end = time.monotonic() + timeout
              while time.monotonic() < end:
                  for frame in page.frames:
                      try:
                          loc = frame.locator(selector)
                          if loc.count():
                              return frame, loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(250)
              raise RuntimeError("DIAGNOSTIC_SELECTOR_NOT_READY:" + selector)

          def text(value):
              return str(value if value is not None else "").strip()

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"],
              )
              context = browser.new_context(viewport={"width":1080, "height":1200})
              page = context.new_page()

              page.goto(
                  base + "/?" + urlencode({
                      "ks_jump_sport": "NFL",
                      "ks_jump_market": "Prop Analytics",
                  }),
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              _, selection = find(
                  page,
                  '[data-nfl-prop-analytics-step3-selection="v1"]'
                  '[data-prop-selection-state="selected"]'
                  '[data-prop-handoff-state="ready"]',
                  150,
              )
              selected_game = text(selection.get_attribute("data-prop-selected-game"))
              selected_date = text(selection.get_attribute("data-prop-selected-date"))
              if not selected_game or not selected_date:
                  raise RuntimeError("DIAGNOSTIC_PAGE1_SELECTION_INCOMPLETE")

              matchup_url = base + "/?" + urlencode({
                  "ks_jump_sport": "NFL",
                  "ks_jump_market": "Prop Analytics",
                  "ks_pa_page": "matchup",
                  "ks_pa_game": selected_game,
              })
              page.goto(
                  matchup_url,
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              _, page2 = find(
                  page,
                  '[data-nfl-prop-analytics-step4-page2="v1"]',
                  120,
              )

              page2_state = text(page2.get_attribute("data-prop-page2-state"))
              page2_handoff = text(page2.get_attribute("data-prop-page2-handoff"))
              page2_game = text(page2.get_attribute("data-prop-page2-selected-game"))
              page2_date = text(page2.get_attribute("data-prop-page2-date"))
              page2_sources = text(page2.get_attribute("data-prop-page2-source-count"))

              print("SELECTED_GAME", selected_game)
              print("SELECTED_DATE", selected_date)
              print("CURRENT_URL", page.url)
              print("PAGE2_STATE", page2_state)
              print("PAGE2_HANDOFF", page2_handoff)
              print("PAGE2_SELECTED_GAME", page2_game)
              print("PAGE2_DATE", page2_date)
              print("PAGE2_SOURCE_COUNT", page2_sources)

              truth = load_schedule_truth()
              games = _eligible_games(truth)
              keys = [f"{g.get('away')}-{g.get('home')}" for g in games]
              target_date = text(truth.get("target_date"))

              if page2_handoff != "ready":
                  print("ROOT_CAUSE_OWNER", "MATCHUP_HANDOFF_RESOLUTION")
                  print("REQUESTED_KS_PA_GAME", selected_game)
                  print("SCHEDULE_TARGET_DATE", target_date)
                  print("AVAILABLE_VERIFIED_GAME_KEYS", ",".join(keys))
                  browser.close()
                  raise SystemExit(0)

              match = next(
                  (
                      g for g in games
                      if f"{g.get('away')}-{g.get('home')}".upper()
                      == selected_game.upper()
                  ),
                  None,
              )
              if match is None:
                  print("ROOT_CAUSE_OWNER", "MATCHUP_HANDOFF_RESOLUTION")
                  print("REQUESTED_KS_PA_GAME", selected_game)
                  print("SCHEDULE_TARGET_DATE", target_date)
                  print("AVAILABLE_VERIFIED_GAME_KEYS", ",".join(keys))
                  browser.close()
                  raise SystemExit(0)

              handoff = build_matchup_handoff(match, selected_date)
              roster = load_verified_roster_truth(handoff)
              away = text(handoff.get("away")).upper()
              home = text(handoff.get("home")).upper()
              away_truth = (roster.get("teams") or {}).get(away) or {}
              home_truth = (roster.get("teams") or {}).get(home) or {}

              print("ROSTER_STATE", text(roster.get("state")))
              print("ROSTER_REASON", text(roster.get("reason")))
              print("ROSTER_VERIFIED_COUNT", int(roster.get("verified_count") or 0))
              print("ROSTER_SOURCE_COUNT", int(roster.get("source_count") or 0))
              print("AWAY_ROSTER_VERIFIED_COUNT", int(away_truth.get("verified_count") or 0))
              print("HOME_ROSTER_VERIFIED_COUNT", int(home_truth.get("verified_count") or 0))

              if roster.get("state") != "live":
                  nflverse = roster.get("nflverse_diag") or {}
                  espn = roster.get("espn_diag") or {}
                  root = None
                  detail = None
                  if not nflverse.get("ok"):
                      root = "NFLVERSE_ROSTER_SOURCE"
                      detail = {
                          "http": nflverse.get("http"),
                          "reason": nflverse.get("reason"),
                      }
                  elif not (espn.get(away) or {}).get("ok"):
                      root = "ESPN_ROSTER_SOURCE"
                      detail = {
                          "team": away,
                          "http": (espn.get(away) or {}).get("http"),
                          "reason": (espn.get(away) or {}).get("reason"),
                      }
                  elif not (espn.get(home) or {}).get("ok"):
                      root = "ESPN_ROSTER_SOURCE"
                      detail = {
                          "team": home,
                          "http": (espn.get(home) or {}).get("http"),
                          "reason": (espn.get(home) or {}).get("reason"),
                      }
                  else:
                      missing = []
                      for team, team_truth in ((away, away_truth), (home, home_truth)):
                          by_pos = team_truth.get("by_position") or {}
                          for pos in ("QB", "RB", "WR", "TE"):
                              if not (by_pos.get(pos) or []):
                                  missing.append(f"{team}:{pos}")
                      root = "ROSTER_RECONCILIATION"
                      detail = {
                          "missing_verified_positions": missing,
                          "away_disagreements": int(away_truth.get("disagreement_count") or 0),
                          "home_disagreements": int(home_truth.get("disagreement_count") or 0),
                      }
                  print("ROOT_CAUSE_OWNER", "STEP5_VERIFIED_ROSTER_TRUTH")
                  print("ROSTER_FAILURE_FIELD", root)
                  print("ROSTER_FAILURE_DETAIL", json.dumps(detail, sort_keys=True))
                  browser.close()
                  raise SystemExit(0)

              availability = load_availability_depth_truth(handoff, roster)
              print("AVAILABILITY_STATE", text(availability.get("state")))
              print("AVAILABILITY_REASON", text(availability.get("reason")))
              print("EVENT_ID", text(availability.get("event_id") or (availability.get("event") or {}).get("event_id")))
              print("GAME_AVAILABILITY_STATE", text(availability.get("availability_state")))
              print("DEPTH_VERIFIED_COUNT", int(availability.get("depth_verified_count") or 0))
              print("STARTER_COUNT", int(availability.get("starter_count") or 0))

              if availability.get("state") != "live":
                  reason = text(availability.get("reason"))
                  event = availability.get("event") or {}
                  snapshot = availability.get("snapshot") or {}
                  if not event.get("ok"):
                      field = "EXACT_EVENT_IDENTITY"
                  elif text(snapshot.get("state")).upper() == "UNVERIFIED":
                      field = "EVENT_AVAILABILITY_UNVERIFIED"
                  else:
                      field = "DEPTH_TRUTH_UNVERIFIED"
                  print("ROOT_CAUSE_OWNER", "STEP6_AVAILABILITY_DEPTH_TRUTH")
                  print("AVAILABILITY_FAILURE_FIELD", field)
              else:
                  print("ROOT_CAUSE_OWNER", "ALL_PAGE2_TRUTH_GATES_LIVE_IN_DIAGNOSTIC")

              context.close()
              browser.close()
          PY
