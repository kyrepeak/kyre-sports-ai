name: MLB Step9E app hook one-shot

on:
  push:
    branches:
      - mlb-step9e-live-market-consumer-integration

permissions:
  contents: write

jobs:
  patch-app-hook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mlb-step9e-live-market-consumer-integration
          fetch-depth: 0
      - name: Install exact Step9E outer app hook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text()
          needle = 'source = _load_frozen_pre_live_app()\n'
          hook = ('try:\n' '    from mlb_step9e_live_market_consumer_v1 import install_step9e_live_market_consumer\n\n' '    _STEP9E_MLB_LIVE_MARKET_CONSUMER = install_step9e_live_market_consumer()\n' 'except Exception as exc:\n' '    _STEP9E_MLB_LIVE_MARKET_CONSUMER = {\n' '        "installed": False,\n' '        "error_type": type(exc).__name__,\n' '        "legacy_odds_api_io_fallback_preserved": True,\n' '        "v1922_market_sync_function_preserved": True,\n' '    }\n')
          if hook in text:
              print('STEP9E_APP_HOOK_ALREADY_PRESENT')
          else:
              if text.count(needle) != 1:
                  raise SystemExit(f'STEP9E_APP_HOOK_MARKER_COUNT={text.count(needle)}')
              path.write_text(text.replace(needle, hook + needle, 1))
              print('STEP9E_APP_HOOK_INSTALLED')
          PY
          python -m py_compile app.py mlb_step9e_live_market_consumer_v1.py
          git diff --check
          git diff --numstat -- app.py
      - name: Commit app-only hook when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.py; then
            echo 'STEP9E_APP_NO_COMMIT_NEEDED'
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = 'app.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Install MLB Step 9E live market consumer'
          git push origin HEAD:mlb-step9e-live-market-consumer-integration
          echo 'MLB_STEP9E_APP_HOOK_COMMITTED'
