name: API2 Step 2E Universal Router V1

on:
  push:
    branches:
      - api2-step2e-universal-router-completion-v1
  pull_request:
    branches:
      - api2-main
    paths:
      - "api2_universal_sports_router_registry_v1.py"
      - "universal_sports_nav_registry_v1.py"
      - "universal_runtime_v5_loader.py"
      - "streamlit_memory_lazy_router_universal_runtime_v5_nfl_rushing_route_restore_v1.py"
      - "tests/test_api2_step2e_universal_router_completion_v1.py"
      - ".github/workflows/api2-step2e-universal-router-v1.yml"

jobs:
  router-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Step 2E route boundary
        run: >-
          python -m py_compile
          api2_universal_sports_router_registry_v1.py
          universal_sports_nav_registry_v1.py
          universal_runtime_v5_loader.py
          streamlit_memory_lazy_router_universal_runtime_v5_nfl_rushing_route_restore_v1.py
          tests/test_api2_step2e_universal_router_completion_v1.py
      - name: Run Step 2E router coverage contract
        run: python -m pytest -q --noconftest tests/test_api2_step2e_universal_router_completion_v1.py
