name: MLB Step20A end-to-end certification

on:
  push:
    branches:
      - mlb-step20a-end-to-end-certification
      - mlb-step20a-schedule-gap-cert-fix
    paths:
      - sports_api/mlb_step20a_end_to_end_certification_v1.py
      - tests/test_mlb_step20a_end_to_end_certification_v1.py
      - .github/workflows/mlb-step20a-end-to-end-certification-cert.yml
  pull_request:
    branches: [main]
    paths:
      - sports_api/mlb_step20a_end_to_end_certification_v1.py
      - tests/test_mlb_step20a_end_to_end_certification_v1.py
      - .github/workflows/mlb-step20a-end-to-end-certification-cert.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step20a-end-to-end-certification-${{ github.ref }}
  cancel-in-progress: false

env:
  STEP20A_BASE_SHA: 52e497ff9a3282918cbee8aca8926e9168443325
  STEP16A_FROZEN_SHA: c5ad6047224aaf014cec13f5efa6e5cd650da939
  STEP16B_FROZEN_SHA: eb0ea430caea02f90b6367b8bc0ea28f698246bf
  STEP17A_FROZEN_SHA: 1d30fc71e86ed4234d3c38e5d4ed813b0e967635
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_STEP19E_PERSISTENCE_ADAPTER_ENABLED: "true"
  MLB_STEP19E_DATABASE_READ_ENABLED: "true"
  MLB_STEP19E_DATABASE_WRITE_ENABLED: "true"
  KYRE_DATABASE_URL: postgresql://step20a:step20a@127.0.0.1:5432/kyre_step20a

jobs:
  certify-end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: step20a
          POSTGRES_PASSWORD: step20a
          POSTGRES_DB: kyre_step20a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step20a -d kyre_step20a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact three-file Step20A additive scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP20A_BASE_SHA" HEAD
          git diff --check "$STEP20A_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$STEP20A_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          expected='^(sports_api/mlb_step20a_end_to_end_certification_v1.py|tests/test_mlb_step20a_end_to_end_certification_v1.py|\.github/workflows/mlb-step20a-end-to-end-certification-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$expected" || true)"
          test -z "$bad"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 3
          test -z "$(git diff --name-status "$STEP20A_BASE_SHA"...HEAD | awk '$1 == "D" {print}')"
          echo MLB_STEP20A_EXACT_SCOPE_OK

      - name: Prove frozen production Step14 Step18 Step19 and consumer boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          git diff --exit-code "$STEP20A_BASE_SHA"...HEAD -- \
            sports_api/main.py \
            sports_api/api/mlb.py \
            app.py \
            mlb_live_odds_streamlit_v1.py \
            sports_api/mlb_step14a_persistence_contract_v1.py \
            sports_api/mlb_step14b_database_checkpoint_adapter_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/collectors/mlb_official_slate.py \
            sports_api/collectors/mlb_live_market_feed.py \
            sports_api/collectors/mlb_event_player_identity.py \
            sports_api/collectors/mlb_provider_reliability.py \
            sports_api/mlb_step19e_production_persistence_validation_v1.py \
            sports_api/sql/mlb_step19e_live_data_persistence.sql \
            sports_api/collectors/mlb_fanduel_direct.py \
            sports_api/collectors/mlb_fanduel_player_props.py \
            sports_api/collectors/mlb_draftkings_provider.py \
            sports_api/mlb_step11a_provider_contract_v1.py \
            sports_api/mlb_official_game_id_join_v1.py \
            sports_api/tools/mlb_step18a_production_baseline.py \
            sports_api/tools/mlb_step18b_production_observability.py \
            sports_api/tools/mlb_step18c_incident_response.py \
            sports_api/tools/mlb_step18d_final_production_freeze.py
          echo MLB_STEP20A_FROZEN_BOUNDARIES_OK

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests httpx
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Compile Step20A certification surface
        run: |
          python -m py_compile \
            sports_api/mlb_step20a_end_to_end_certification_v1.py \
            tests/test_mlb_step20a_end_to_end_certification_v1.py

      - name: Run Step20A fail-closed end-to-end tests
        run: PYTHONPATH=. python -m pytest -q tests/test_mlb_step20a_end_to_end_certification_v1.py

      - name: Revalidate historical snapshot guards at their exact frozen commits
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$STEP16A_FROZEN_SHA^{commit}"
          git cat-file -e "$STEP16B_FROZEN_SHA^{commit}"
          git cat-file -e "$STEP17A_FROZEN_SHA^{commit}"
          rm -rf /tmp/mlb-step16a-frozen /tmp/mlb-step16b-frozen /tmp/mlb-step17a-frozen

          git worktree add --detach /tmp/mlb-step16a-frozen "$STEP16A_FROZEN_SHA"
          (cd /tmp/mlb-step16a-frozen && PYTHONPATH=. python -m pytest -q tests/test_mlb_step16a_production_activation_contract_v1.py)
          git worktree remove /tmp/mlb-step16a-frozen --force

          git worktree add --detach /tmp/mlb-step16b-frozen "$STEP16B_FROZEN_SHA"
          (cd /tmp/mlb-step16b-frozen && PYTHONPATH=. python -m pytest -q tests/test_mlb_step16b_production_packaging_lifecycle_v1.py)
          git worktree remove /tmp/mlb-step16b-frozen --force

          git worktree add --detach /tmp/mlb-step17a-frozen "$STEP17A_FROZEN_SHA"
          (cd /tmp/mlb-step17a-frozen && PYTHONPATH=. python -m pytest -q tests/test_mlb_step17a_production_host_contract_v1.py)
          git worktree remove /tmp/mlb-step17a-frozen --force
          echo MLB_STEP20A_HISTORICAL_GUARDS_OK

      - name: Run current MLB regression excluding historical snapshot-only guards
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            case "$path" in
              tests/test_mlb_step16a_production_activation_contract_v1.py|\
              tests/test_mlb_step16b_production_packaging_lifecycle_v1.py|\
              tests/test_mlb_step17a_production_host_contract_v1.py)
                continue
                ;;
            esac
            files+=("$path")
          done
          test "${#files[@]}" -gt 0
          PYTHONPATH=. python -m pytest -q "${files[@]}"

      - name: Provision isolated Step19E PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$KYRE_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f sports_api/sql/mlb_step19e_live_data_persistence.sql
          psql "$KYRE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT to_regclass('kyre_runtime.mlb_step19_live_data_checkpoints'), to_regclass('kyre_runtime.mlb_step19_live_data_checkpoint_heads');"
          echo MLB_STEP20A_EPHEMERAL_POSTGRES_READY

      - name: Live Step19 collection persistence recovery through existing consumer seam
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .step20a
          PYTHONPATH=. python - <<'PY'
          from datetime import date, datetime, timezone
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import psycopg
          import requests

          from sports_api.collectors.mlb_event_player_identity import build_mlb_event_player_identity_registry
          from sports_api.collectors.mlb_official_slate import SCHEDULE_URL, collect_official_mlb_slate
          from sports_api.collectors.mlb_provider_reliability import collect_reliable_mlb_market_feed
          from sports_api.mlb_step19e_production_persistence_validation_v1 import (
              build_step19e_checkpoint_envelope,
              recover_step19e_live_data,
              save_step19e_checkpoint,
          )
          from sports_api.mlb_step20a_end_to_end_certification_v1 import (
              FINAL_CERTIFICATION_MARKER,
              certify_recovered_step19_to_existing_mlb_consumer,
          )

          now = datetime.now(timezone.utc)
          reliable = collect_reliable_mlb_market_feed(
              now_utc=now,
              max_events=1,
              include_fanduel_game_odds=True,
              include_fanduel_player_props=False,
              include_draftkings=False,
              max_attempts=2,
              base_backoff_seconds=0.1,
              max_backoff_seconds=0.25,
              cooldown_seconds=60,
              max_snapshot_age_seconds=120,
          )
          feed = reliable['market_feed']
          assert reliable['collection_status'] in {'ok', 'recovered'}, reliable
          assert feed['game_market_snapshot_count'] > 0, feed
          assert feed['error_surface_count'] == 0, feed
          assert feed['not_ready_surface_count'] == 0, feed
          assert feed['rejected_record_count'] == 0, feed

          market_rows = feed['game_market_snapshots']
          market_game_ids = sorted({int(row['official_game_id']) for row in market_rows})
          assert market_game_ids, feed

          schedule_lookup = requests.get(
              SCHEDULE_URL,
              params={
                  'sportId': 1,
                  'gamePks': ','.join(str(game_id) for game_id in market_game_ids),
                  'hydrate': 'team,probablePitcher',
              },
              timeout=10,
          )
          assert schedule_lookup.status_code == 200, schedule_lookup.status_code
          schedule_payload = schedule_lookup.json()
          assert isinstance(schedule_payload, dict), schedule_payload
          date_entries = schedule_payload.get('dates')
          assert isinstance(date_entries, list), schedule_payload

          resolved_game_dates = {}
          for date_entry in date_entries:
              assert isinstance(date_entry, dict), date_entry
              entry_games = date_entry.get('games')
              assert isinstance(entry_games, list), date_entry
              entry_date = date_entry.get('date')
              for game in entry_games:
                  assert isinstance(game, dict), game
                  game_pk = game.get('gamePk')
                  assert isinstance(game_pk, int) and not isinstance(game_pk, bool) and game_pk > 0, game
                  if game_pk not in market_game_ids:
                      continue
                  raw_date = game.get('officialDate') or entry_date
                  assert isinstance(raw_date, str) and raw_date, game
                  canonical_date = date.fromisoformat(raw_date).isoformat()
                  assert canonical_date == raw_date, game
                  previous = resolved_game_dates.get(game_pk)
                  assert previous in {None, canonical_date}, (game_pk, previous, canonical_date)
                  resolved_game_dates[game_pk] = canonical_date

          assert set(resolved_game_dates) == set(market_game_ids), {
              'expected_game_ids': market_game_ids,
              'resolved_game_dates': resolved_game_dates,
          }
          slate_dates = sorted(set(resolved_game_dates.values()))
          assert slate_dates, resolved_game_dates

          eastern_date = now.astimezone(ZoneInfo('America/New_York')).date()
          official_games = {}
          for slate_date in slate_dates:
              slate = collect_official_mlb_slate(slate_date=slate_date)
              for game in slate['games']:
                  official_games[game['game_pk']] = game
          missing_market_game_ids = sorted(set(market_game_ids) - set(official_games))
          assert not missing_market_game_ids, missing_market_game_ids

          combined_slate = {
              'sport': 'MLB',
              'slate_date': ','.join(slate_dates),
              'game_count': len(official_games),
              'games': list(official_games.values()),
              'source': 'MLB Stats API',
          }
          registry = build_mlb_event_player_identity_registry(
              official_slate=combined_slate,
              market_feed=feed,
          )
          assert registry['identity_complete_for_all_market_games'] is True, registry
          assert registry['rejected_event_identity_count'] == 0, registry
          assert registry['rejected_player_identity_count'] == 0, registry

          checkpoint_now = datetime.now(timezone.utc)
          envelope = build_step19e_checkpoint_envelope(
              checkpoint_date=eastern_date.isoformat(),
              official_slate=combined_slate,
              reliable_market_collection=reliable,
              identity_registry=registry,
              created_at_utc=checkpoint_now,
          )
          safe_env = {
              'MLB_STEP19E_PERSISTENCE_ADAPTER_ENABLED': 'true',
              'MLB_STEP19E_DATABASE_READ_ENABLED': 'true',
              'MLB_STEP19E_DATABASE_WRITE_ENABLED': 'true',
              'KYRE_DATABASE_URL': os.environ['KYRE_DATABASE_URL'],
          }
          saved = save_step19e_checkpoint(
              checkpoint_envelope=envelope,
              expected_head_version=0,
              env=safe_env,
              generated_at_utc=checkpoint_now,
          )
          assert saved['status'] == 'saved', saved
          recovered = recover_step19e_live_data(
              checkpoint_date=eastern_date.isoformat(),
              env=safe_env,
              now_utc=datetime.now(timezone.utc),
              max_checkpoint_age_seconds=300,
          )
          certification = certify_recovered_step19_to_existing_mlb_consumer(recovered)
          assert certification['final_certification_marker'] == FINAL_CERTIFICATION_MARKER
          assert certification['consumer_game_count'] > 0
          assert certification['consumer_card_count'] == certification['consumer_game_count']
          assert certification['consumer_official_game_ids']
          assert certification['provider_network_calls_added_by_step20a'] == 0
          assert certification['database_writes_added_by_step20a'] == 0
          assert certification['production_runtime_wiring'] is False
          assert certification['actionable_output'] is False
          assert certification['wagering'] is False

          with psycopg.connect(os.environ['KYRE_DATABASE_URL']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute('SELECT count(*) FROM kyre_runtime.mlb_step19_live_data_checkpoints')
                  history_rows = int(cursor.fetchone()[0])
                  cursor.execute('SELECT count(*) FROM kyre_runtime.mlb_step19_live_data_checkpoint_heads')
                  head_rows = int(cursor.fetchone()[0])
          assert history_rows == 1
          assert head_rows == 1

          provider = next(row for row in reliable['provider_reliability'] if row['provider_key'] == 'fanduel')
          evidence = {
              'marker': FINAL_CERTIFICATION_MARKER,
              'certified_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'step20a_base_main_sha': '52e497ff9a3282918cbee8aca8926e9168443325',
              'checkpoint_version': recovered['checkpoint_version'],
              'checkpoint_id': recovered['checkpoint_id'],
              'checkpoint_envelope_sha256': recovered['envelope_content_sha256'],
              'provider_key': provider['provider_key'],
              'provider_status': provider['status'],
              'network_attempt_count': provider['network_attempt_count'],
              'retry_count': reliable['retry_count'],
              'official_schedule_resolution_method': 'exact_gamePks',
              'official_schedule_lookup_count': 1,
              'official_slate_dates': slate_dates,
              'market_official_game_ids': market_game_ids,
              'official_game_count': certification['official_game_count'],
              'market_game_snapshot_count': certification['market_game_snapshot_count'],
              'verified_event_identity_count': certification['verified_event_identity_count'],
              'consumer_api_path': certification['consumer_api_path'],
              'consumer_api_data_type': certification['consumer_api_data_type'],
              'consumer_game_count': certification['consumer_game_count'],
              'consumer_card_count': certification['consumer_card_count'],
              'consumer_official_game_ids': certification['consumer_official_game_ids'],
              'ephemeral_postgresql_history_rows': history_rows,
              'ephemeral_postgresql_head_rows': head_rows,
              'restart_recovery_verified': True,
              'existing_streamlit_consumer_verified': True,
              'fuzzy_matching_used': False,
              'synthetic_game_id_used': False,
              'synthetic_player_id_used': False,
              'price_fabrication_used': False,
              'production_database_writes': 0,
              'production_mutations': 0,
              'model_probability_mutations': 0,
              'projection_mutations': 0,
              'actionable_output': False,
              'wagering': False,
          }
          Path('.step20a/mlb-step20a-end-to-end-certification-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          print(FINAL_CERTIFICATION_MARKER)
          PY

      - name: Upload Step20A evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step20a-end-to-end-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .step20a/mlb-step20a-end-to-end-certification-evidence.json
          if-no-files-found: error
          retention-days: 90
