name: TEMP Passing Visual Step2 App Wire

on:
  push:
    branches: [nfl-passing-yards-visual-parity-step2-qb-heroes]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-passing-yards-visual-parity-step2-qb-heroes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard and wire app to Router V122
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()

          old_title = '"""Kyre Sports AI Streamlit entrypoint — NFL Receiving Yards Step 10 final page.\n'
          new_title = '"""Kyre Sports AI Streamlit entrypoint — NFL Passing Yards visual parity Step 2.\n'
          if old_title not in text:
              raise SystemExit('APP_TITLE_ANCHOR_MISSING')
          text = text.replace(old_title, new_title, 1)

          frozen_v120 = '    from streamlit_memory_lazy_router_v120 import render_app as _frozen_v120_render_app\n'
          frozen_v121 = '    from streamlit_memory_lazy_router_v121 import render_app as _frozen_v121_render_app\n'
          if frozen_v121 not in text:
              if frozen_v120 not in text:
                  raise SystemExit('TYPE_CHECKING_V120_ANCHOR_MISSING')
              text = text.replace(frozen_v120, frozen_v120 + frozen_v121, 1)

          old_hb = 'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V121_NFL_RECEIVING_YARDS_STEP10_FINAL_POLISH_SPEED_CERT_2026-09-13"\n'
          new_hb = (
              'FROZEN_V121_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V121_NFL_RECEIVING_YARDS_STEP10_FINAL_POLISH_SPEED_CERT_2026-09-13"\n'
              'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V122_NFL_PASSING_YARDS_VISUAL_PARITY_STEP2_QB_HEROES_2026-09-13"\n'
          )
          if old_hb not in text:
              raise SystemExit('ACTIVE_V121_HEARTBEAT_ANCHOR_MISSING')
          text = text.replace(old_hb, new_hb, 1)

          old_runtime = '    from streamlit_memory_lazy_router_v121 import record_bootstrap_import_ms, render_app\n'
          new_runtime = '    from streamlit_memory_lazy_router_v122 import record_bootstrap_import_ms, render_app\n'
          if text.count(old_runtime) != 1:
              raise SystemExit(f'ACTIVE_V121_RUNTIME_COUNT={text.count(old_runtime)}')
          text = text.replace(old_runtime, new_runtime, 1)

          old_doc_hb = 'STREAMLIT_MAIN_V121_NFL_RECEIVING_YARDS_STEP10_FINAL_POLISH_SPEED_CERT_2026-09-13.\n'
          new_doc_hb = 'STREAMLIT_MAIN_V122_NFL_PASSING_YARDS_VISUAL_PARITY_STEP2_QB_HEROES_2026-09-13.\n'
          if old_doc_hb not in text:
              raise SystemExit('DOC_HEARTBEAT_ANCHOR_MISSING')
          text = text.replace(old_doc_hb, new_doc_hb, 1)

          path.write_text(text)
          PY

          git config user.name "kyrepeak"
          git config user.email "kyrewhite15@gmail.com"
          git add app.py
          git diff --cached --check
          git commit -m "Activate Passing visual parity Router V122"
          git push origin HEAD:nfl-passing-yards-visual-parity-step2-qb-heroes
