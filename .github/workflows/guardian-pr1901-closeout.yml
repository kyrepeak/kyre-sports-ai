name: Guardian PR1901 Closeout Handoff

on:
  push:
    branches:
      - guardian-pr1901-write-anchor
    paths:
      - .github/workflows/guardian-pr1901-closeout.yml

permissions:
  contents: write

jobs:
  apply-tested-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative PR branch
        uses: actions/checkout@v4
        with:
          ref: guardian-pytest-entrypoint-contract-v1
          fetch-depth: 0

      - name: Enforce authoritative-head lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bda119a1ab989d22cead0169af44a36a7ff85ef1"

      - name: Apply tested Guardian certification repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              source = p.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"expected repair target missing: {path}")
              p.write_text(source.replace(old, new), encoding="utf-8")

          rep(
              "devsystem/browser_qa_v1.py",
              '''        (
                      ("ks_sport", CFB_SPORT),
                      ("ks_cfb_market", CFB_GAME_TOTAL_MARKET),
                      ("ks_cfb_game_total_date", CFB_GAME_TOTAL_DATE),
                      ("ks_cfb_game_total_event_id", CFB_GAME_TOTAL_EVENT_ID),
                  )''',
              '''        (
                      ("sport", "cfb"),
                      ("market", "game-total"),
                      ("date", CFB_GAME_TOTAL_DATE),
                      ("game_id", CFB_GAME_TOTAL_EVENT_ID),
                  )''',
          )

          rep(
              "devsystem/cfb_game_total_browser_qa_v4.py",
              '''CFB_SPORT = "College Football"
          GAME_TOTAL_MARKET = "Game Total"
          UNIVERSAL_ROUTE_SPORT = "sport"
          UNIVERSAL_ROUTE_MARKET = "market"
          UNIVERSAL_SPORT_ID = "cfb"
          UNIVERSAL_MARKET_ID = "game-total"
          ROUTE_QUERY_SPORT = "ks_sport"
          ROUTE_QUERY_MARKET = "ks_cfb_market"
          DATE_QUERY_KEY = "ks_cfb_game_total_date"
          EVENT_QUERY_KEY = "ks_cfb_game_total_event_id"''',
              '''CFB_SPORT = "cfb"
          GAME_TOTAL_MARKET = "game-total"
          UNIVERSAL_ROUTE_SPORT = "sport"
          UNIVERSAL_ROUTE_MARKET = "market"
          UNIVERSAL_SPORT_ID = CFB_SPORT
          UNIVERSAL_MARKET_ID = GAME_TOTAL_MARKET
          # Backward-compatible symbol names now point at the terminal canonical route.
          ROUTE_QUERY_SPORT = UNIVERSAL_ROUTE_SPORT
          ROUTE_QUERY_MARKET = UNIVERSAL_ROUTE_MARKET
          DATE_QUERY_KEY = "date"
          EVENT_QUERY_KEY = "game_id"''',
          )
          rep(
              "devsystem/cfb_game_total_browser_qa_v4.py",
              '''            UNIVERSAL_ROUTE_SPORT: UNIVERSAL_SPORT_ID,
                      UNIVERSAL_ROUTE_MARKET: UNIVERSAL_MARKET_ID,
                      ROUTE_QUERY_SPORT: CFB_SPORT,
                      ROUTE_QUERY_MARKET: GAME_TOTAL_MARKET,
                      DATE_QUERY_KEY: CERT_DATE,''',
              '''            UNIVERSAL_ROUTE_SPORT: UNIVERSAL_SPORT_ID,
                      UNIVERSAL_ROUTE_MARKET: UNIVERSAL_MARKET_ID,
                      DATE_QUERY_KEY: CERT_DATE,''',
          )

          rep(
              "devsystem/cfb_game_total_step6_browser_qa_v184.py",
              '''ROUTE_QUERY_SPORT = selector_qa.ROUTE_QUERY_SPORT
          ROUTE_QUERY_MARKET = selector_qa.ROUTE_QUERY_MARKET
          ''',
              '''''',
          )
          rep(
              "devsystem/cfb_game_total_step6_browser_qa_v184.py",
              '''        {
                      ROUTE_QUERY_SPORT: CFB_SPORT,
                      ROUTE_QUERY_MARKET: GAME_TOTAL_MARKET,
                      DATE_QUERY_KEY: CERT_DATE,
                  }''',
              '''        {
                      selector_qa.UNIVERSAL_ROUTE_SPORT: selector_qa.UNIVERSAL_SPORT_ID,
                      selector_qa.UNIVERSAL_ROUTE_MARKET: selector_qa.UNIVERSAL_MARKET_ID,
                      DATE_QUERY_KEY: CERT_DATE,
                  }''',
          )

          neutral = '''    assert "from devsystem.shared_runtime_lifecycle_v1 import run_shared_runtime_lifecycle" in source
              assert "record_bootstrap_import_ms," in source
              assert "render_app," in source
              assert "run_shared_runtime_lifecycle(" in source
              assert "render=render_app" in source'''
          rep(
              "tests/test_cfb_game_total_v164_team_logos.py",
              '    assert "from streamlit_memory_lazy_router_v160 import record_bootstrap_import_ms, render_app" in source',
              neutral,
          )
          rep(
              "tests/test_cfb_game_total_v165_step4_matchup.py",
              '    assert "from streamlit_memory_lazy_router_v163 import record_bootstrap_import_ms, render_app" in source',
              neutral,
          )
          rep(
              "tests/test_cfb_game_total_v185_step6_visual_parity.py",
              '''    assert "from streamlit_memory_lazy_router_v164 import record_bootstrap_import_ms, render_app" in source
              assert "from streamlit_memory_lazy_router_v163 import record_bootstrap_import_ms, render_app" in source''',
              neutral,
          )

          contract = Path("tests/test_guardian_cfb_browser_qa_route_contract_v1.py")
          source = contract.read_text(encoding="utf-8")
          source = source.replace(
              'ROOT = Path(__file__).resolve().parents[1]\nBROWSER_QA = ROOT / "devsystem" / "cfb_game_total_browser_qa_v1.py"\n',
              'ROOT = Path(__file__).resolve().parents[1]\nBASE_QA = ROOT / "devsystem" / "browser_qa_v1.py"\nBROWSER_QA = ROOT / "devsystem" / "cfb_game_total_browser_qa_v1.py"\n',
          )
          source = source.replace(
              'BROWSER_V4 = ROOT / "devsystem" / "cfb_game_total_browser_qa_v4.py"\n',
              'BROWSER_V4 = ROOT / "devsystem" / "cfb_game_total_browser_qa_v4.py"\nSTEP6_V184 = ROOT / "devsystem" / "cfb_game_total_step6_browser_qa_v184.py"\n',
          )
          old = '''def test_v163_browser_qa_seeds_terminal_universal_route_and_page_route_together() -> None:
              source = BROWSER_V4.read_text(encoding="utf-8")

              assert 'UNIVERSAL_ROUTE_SPORT = "sport"' in source
              assert 'UNIVERSAL_ROUTE_MARKET = "market"' in source
              assert 'UNIVERSAL_SPORT_ID = "cfb"' in source
              assert 'UNIVERSAL_MARKET_ID = "game-total"' in source
              assert "UNIVERSAL_ROUTE_SPORT: UNIVERSAL_SPORT_ID" in source
              assert "UNIVERSAL_ROUTE_MARKET: UNIVERSAL_MARKET_ID" in source
              assert "ROUTE_QUERY_SPORT: CFB_SPORT" in source
              assert "ROUTE_QUERY_MARKET: GAME_TOTAL_MARKET" in source
              assert "DATE_QUERY_KEY: CERT_DATE" in source
          '''
          new = '''def test_shared_game_total_url_helper_uses_only_terminal_canonical_keys() -> None:
              source = BASE_QA.read_text(encoding="utf-8")
              helper = source.split("def _cfb_game_total_url", 1)[1].split("def _wait_for_game_total_step5", 1)[0]

              assert '("sport", "cfb")' in helper
              assert '("market", "game-total")' in helper
              assert '("date", CFB_GAME_TOTAL_DATE)' in helper
              assert '("game_id", CFB_GAME_TOTAL_EVENT_ID)' in helper
              assert "ks_sport" not in helper
              assert "ks_cfb_market" not in helper
              assert "ks_cfb_game_total_date" not in helper
              assert "ks_cfb_game_total_event_id" not in helper


          def test_v163_browser_qa_seeds_terminal_canonical_route_and_page_params_only() -> None:
              source = BROWSER_V4.read_text(encoding="utf-8")

              assert 'UNIVERSAL_ROUTE_SPORT = "sport"' in source
              assert 'UNIVERSAL_ROUTE_MARKET = "market"' in source
              assert 'CFB_SPORT = "cfb"' in source
              assert 'GAME_TOTAL_MARKET = "game-total"' in source
              assert 'UNIVERSAL_SPORT_ID = CFB_SPORT' in source
              assert 'UNIVERSAL_MARKET_ID = GAME_TOTAL_MARKET' in source
              assert 'ROUTE_QUERY_SPORT = UNIVERSAL_ROUTE_SPORT' in source
              assert 'ROUTE_QUERY_MARKET = UNIVERSAL_ROUTE_MARKET' in source
              assert 'DATE_QUERY_KEY = "date"' in source
              assert 'EVENT_QUERY_KEY = "game_id"' in source
              assert "UNIVERSAL_ROUTE_SPORT: UNIVERSAL_SPORT_ID" in source
              assert "UNIVERSAL_ROUTE_MARKET: UNIVERSAL_MARKET_ID" in source
              assert "DATE_QUERY_KEY: CERT_DATE" in source
              seeded = source.split("direct_query = urlencode", 1)[1].split("with sync_playwright", 1)[0]
              assert "ROUTE_QUERY_SPORT: CFB_SPORT" not in seeded
              assert "ROUTE_QUERY_MARKET: GAME_TOTAL_MARKET" not in seeded


          def test_v184_browser_qa_reuses_v163_terminal_canonical_route() -> None:
              source = STEP6_V184.read_text(encoding="utf-8")

              assert "selector_qa.UNIVERSAL_ROUTE_SPORT: selector_qa.UNIVERSAL_SPORT_ID" in source
              assert "selector_qa.UNIVERSAL_ROUTE_MARKET: selector_qa.UNIVERSAL_MARKET_ID" in source
              assert "DATE_QUERY_KEY: CERT_DATE" in source
              assert "ROUTE_QUERY_SPORT: CFB_SPORT" not in source
              assert "ROUTE_QUERY_MARKET: GAME_TOTAL_MARKET" not in source
          '''
          if old not in source:
              raise SystemExit("expected Guardian route-contract test block missing")
          contract.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest

      - name: Verify repaired certification contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_guardian_cfb_browser_qa_route_contract_v1.py \
            tests/test_cfb_game_total_v168_step5_pace.py \
            tests/test_devsystem_production_verify_v164_logos.py \
            tests/test_cfb_game_total_v165_step4_matchup.py \
            tests/test_cfb_game_total_v159_compact_dashboard.py \
            tests/test_cfb_game_total_v164_team_logos.py \
            tests/test_cfb_game_total_v185_step6_visual_parity.py \
            tests/test_cfb_game_total_v184_step6_scoring.py

      - name: Commit to the existing authoritative PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            devsystem/browser_qa_v1.py \
            devsystem/cfb_game_total_browser_qa_v4.py \
            devsystem/cfb_game_total_step6_browser_qa_v184.py \
            tests/test_cfb_game_total_v164_team_logos.py \
            tests/test_cfb_game_total_v165_step4_matchup.py \
            tests/test_cfb_game_total_v185_step6_visual_parity.py \
            tests/test_guardian_cfb_browser_qa_route_contract_v1.py
          git commit -m "guardian: align CFB browser certification with runtime v5"
          git push origin HEAD:guardian-pytest-entrypoint-contract-v1
