name: CFB Top Picks Nav Step 1 Dropdown

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-nav-step1-dropdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dropdown-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest requests playwright
          python -m playwright install --with-deps chromium
      - name: Static dropdown contract
        run: |
          python -m py_compile streamlit_memory_lazy_router_v245.py
          python -m py_compile devsystem/cfb_top_picks_nav_step1_dropdown_cert_v1.py
          python -m pytest -q tests/test_cfb_top_picks_nav_step1_dropdown_v1.py
      - name: Start branch Streamlit
        run: |
          mkdir -p artifacts/cfb-top-picks-nav-step1-dropdown
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/cfb-top-picks-nav-step1-dropdown/streamlit.log 2>&1 &
          echo $! > /tmp/cfb_top_picks_nav_step1_pid
      - name: Prove normal mobile CFB dropdown
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/cfb_top_picks_nav_step1_dropdown_cert_v1.py \
            --base-url http://127.0.0.1:8501 \
            --artifact-dir artifacts/cfb-top-picks-nav-step1-dropdown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-top-picks-nav-step1-dropdown-${{ github.run_id }}
          path: artifacts/cfb-top-picks-nav-step1-dropdown
          if-no-files-found: warn
          retention-days: 14
      - name: Stop branch Streamlit
        if: always()
        run: |
          if [ -f /tmp/cfb_top_picks_nav_step1_pid ]; then
            kill "$(cat /tmp/cfb_top_picks_nav_step1_pid)" 2>/dev/null || true
          fi
