name: WNBA Step 7G one-shot activation preflight

on:
  push:
    branches:
      - wnba-production-7g-one-shot-20260827
    paths:
      - 'sports_api/wnba_step7g_supabase_scheduler_storage.py'
      - 'sports_api/wnba_step7g_transactional_scheduler_commit.py'
      - 'sports_api/tools/wnba_step7g_one_shot_activation.py'
      - 'sports_api/tests/test_wnba_step7g_one_shot.py'
      - '.github/workflows/wnba-step-7g-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step7g-one-shot-preflight
  cancel-in-progress: false

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'

jobs:
  certify-step7g-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Step 7G branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 9a45b11704bb95ec5ace275b5dd941e27e32f745 HEAD
          test "$(git merge-base 9a45b11704bb95ec5ace275b5dd941e27e32f745 HEAD)" = "9a45b11704bb95ec5ace275b5dd941e27e32f745"
          echo 'Step 7G remains a direct additive descendant of the deployed Step 7E backend.'

      - name: Prove Step 7G diff scope
        shell: bash
        run: |
          CHANGED="$(git diff --name-only 9a45b11704bb95ec5ace275b5dd941e27e32f745..HEAD | sort)"
          EXPECTED=$'.github/workflows/wnba-step-7g-preflight.yml\nsports_api/tests/test_wnba_step7g_one_shot.py\nsports_api/tools/wnba_step7g_one_shot_activation.py\nsports_api/wnba_step7g_supabase_scheduler_storage.py\nsports_api/wnba_step7g_transactional_scheduler_commit.py'
          test "$CHANGED" = "$EXPECTED"
          printf '%s\n' "$CHANGED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 7G implementation
        run: |
          python -m py_compile sports_api/wnba_step7g_supabase_scheduler_storage.py
          python -m py_compile sports_api/wnba_step7g_transactional_scheduler_commit.py
          python -m py_compile sports_api/tools/wnba_step7g_one_shot_activation.py
          python -m py_compile sports_api/tests/test_wnba_step7g_one_shot.py

      - name: Run Step 7G fail-closed tests
        run: python -m unittest sports_api.tests.test_wnba_step7g_one_shot

      - name: Run frozen scheduler regression
        run: python -m unittest sports_api.tests.test_wnba_pregame_board_scheduler

      - name: Run frozen Step 6M regression
        run: python -m unittest sports_api.tests.test_wnba_step6m_scheduler_orchestration

      - name: Run frozen Step 6R regression
        run: python -m unittest sports_api.tests.test_wnba_step6r_supabase_storage

      - name: Run frozen Step 6S regression
        run: python -m unittest sports_api.tests.test_wnba_step6s_canary_storage

      - name: Run frozen Step 6V regression
        run: python -m unittest sports_api.tests.test_wnba_step6v_supabase_canary

      - name: Run frozen Step 6W regression
        run: python -m unittest sports_api.tests.test_wnba_step6w_final_certification

      - name: Prove preflight has no secret context
        shell: bash
        run: |
          python - <<'PY'
          import os
          forbidden = (
              'RENDER_API_KEY',
              'WNBA_KYRE_SUPABASE_URL',
              'WNBA_KYRE_SUPABASE_SECRET_KEY',
              'WNBA_KYRE_MARKET_INGEST_TOKEN',
              'SPORTSGAMEODDS_API_KEY',
          )
          present = [name for name in forbidden if os.environ.get(name)]
          assert not present, present
          assert os.environ.get('WNBA_PRODUCTION_RUNTIME_ENABLED') == 'false'
          assert os.environ.get('WNBA_BOARD_SCHEDULER_ENABLED') == 'false'
          assert os.environ.get('WNBA_KYRE_DIRECT_SYNC_ENABLED') == 'false'
          assert os.environ.get('WNBA_KYRE_RECONCILED_SYNC_ENABLED') == 'false'
          assert os.environ.get('WNBA_STEP6J_CANARY_ENABLED') == 'false'
          assert os.environ.get('WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED') == 'false'
          print('Step 7G preflight is secret-free and all production/write switches are OFF.')
          PY

      - name: Prove workflow cannot activate production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/wnba-step-7g-preflight.yml').read_text(encoding='utf-8').splitlines()
          secret_key = 'WNBA_KYRE_SUPABASE_' + 'SECRET_KEY:'
          live_command = 'wnba_step7g_one_shot_' + 'activation.py --date'
          recurring_key = 'sched' + 'ule:'
          assert not any(line.lstrip().startswith(secret_key) for line in lines)
          assert not any(live_command in line and not line.lstrip().startswith('live_command') for line in lines)
          assert not any(line.lstrip().startswith(recurring_key) for line in lines)
          print('Preflight has no Supabase secret assignment, live activation command, or recurring schedule trigger.')
          PY
