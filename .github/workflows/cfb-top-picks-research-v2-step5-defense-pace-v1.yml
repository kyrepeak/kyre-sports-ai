name: CFB Top Picks Research V2 Step 5 Defense Pace

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-research-v2-step5-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore shared hot Python environment
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-\${{ runner.os }}-py\${{ steps.browser-python.outputs.python-version }}-\${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Build environment on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
      - name: Activate environment
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Static and unit Step 5 proof
        run: |
          python -m py_compile cfb_top_picks_defense_pace_research_v1.py
          python -m py_compile cfb_top_picks_details_v1.py
          python -m py_compile cfb_top_picks_page_v4.py
          python devsystem/cfb_top_picks_research_v2_step5_defense_pace_v1.py
          python -m pytest -q \
            tests/test_cfb_top_picks_research_v2_step5_contract_v1.py \
            tests/test_cfb_top_picks_research_v2_step5_defense_pace_v1.py \
            tests/test_cfb_top_picks_research_v2_step5_integration_v1.py \
            tests/test_cfb_top_picks_step4_details_v1.py
      - name: Certify defense and pace research for all 10 ranked picks
        run: python -m devsystem.cfb_top_picks_research_v2_step5_defense_pace_cert_v1
      - name: Upload Step 5 defense pace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-top-picks-research-v2-step5-defense-pace-evidence
          path: artifacts/cfb-top-picks-research-v2-step5
          if-no-files-found: ignore
