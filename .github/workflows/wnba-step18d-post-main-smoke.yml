name: WNBA Step 18D post-main production smoke

on:
  push:
    branches:
      - wnba-step18d-post-main-smoke-20260829

permissions:
  contents: read

env:
  STEP18_FINAL_MAIN_SHA: a2e1dc6ec2b6c0c8c5e0bd15cd73b24fa9a56ab2
  STEP17D_FROZEN_SHA: 8448984adc779fb9af7c7a8187b0eaeb67d034c8

jobs:
  smoke-promoted-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact promoted main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STEP18_FINAL_MAIN_SHA }}
          fetch-depth: 500

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Prove exact promoted revision
        run: |
          test "$(git rev-parse HEAD)" = "$STEP18_FINAL_MAIN_SHA"
          python -m py_compile app.py wnba_api_client_v1.py wnba_streamlit_consumer_v2.py wnba_daily_picks_hub_v36.py wnba_step18c_consumer_bridge_v1.py
          PYTHONPATH=. pytest -q tests/test_wnba_step18c_streamlit_reliability.py

      - name: Boot promoted Streamlit app
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/step18d-post-main.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/step18d-post-main.log; exit 1; fi
            sleep 2
          done
          test "$ok" -eq 1
          grep -qi 'ok' /tmp/health.txt
          curl -fsS --max-time 10 http://127.0.0.1:8501/ >/tmp/root.html
          test -s /tmp/root.html
          echo STEP18D_PROMOTED_MAIN_STREAMLIT_OK

      - name: Live consumer smoke from promoted main code
        run: |
          PYTHONPATH=. python - <<'PY'
          import os, time
          from wnba_api_client_v1 import KyreWNBAAPIClient
          from wnba_streamlit_consumer_v2 import normalize_consumer_payload

          client=KyreWNBAAPIClient(timeout_seconds=20,attempts=3)
          last=None
          for _ in range(10):
              payload=client.consumer_latest()
              lineage=payload.get('lineage') or {}
              if lineage.get('step17d_frozen_runtime_sha') != os.environ['STEP17D_FROZEN_SHA']:
                  raise SystemExit('STEP18D_POST_MAIN_LINEAGE_DRIFT')
              view=normalize_consumer_payload(payload)
              snap=view.get('snapshot') or {}
              last=(view.get('state'),view.get('reason'),snap.get('age_seconds'),snap.get('effective_stale'))
              if view.get('state') in {'ready','unavailable'} and snap.get('effective_stale') is False and snap.get('snapshot_content_sha256'):
                  break
              time.sleep(12)
          else:
              raise SystemExit(f'STEP18D_POST_MAIN_LIVE_CONSUMER_NOT_CURRENT:{last}')
          if view.get('state')!='ready' and view.get('cards')!=[]:
              raise SystemExit('STEP18D_POST_MAIN_NONREADY_CARD_LEAK')
          print('STEP18D_POST_MAIN_LIVE_CONSUMER_OK',last)
          PY

      - name: Final smoke marker
        run: echo STEP18D_POST_MAIN_SMOKE_CERTIFIED
