name: MLB Moneyline Step 12 final-synthesis certification

on:
  workflow_dispatch:
  push:
    branches: ['feature/mlb-moneyline-step12-final-synthesis']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify frozen Moneyline Steps 1-11 boundary
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest=json.loads(pathlib.Path("mlb_moneyline_freeze_manifest_v12.json").read_text())
          failures=[]
          for path,expected in manifest["exact_blobs"].items():
              try:
                  actual=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen path: {path}")
                  continue
              if actual!=expected:
                  failures.append(
                      f"frozen Moneyline Steps 1-11 changed: {path} expected={expected} actual={actual}"
                  )
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("MLB_MONEYLINE_STEPS_1_11_BOUNDARY=PASS")
          PY

      - name: Compile Step 12 final route
        run: |
          python -m py_compile \
            app.py \
            mlb_moneyline_hub_v178.py \
            streamlit_memory_lazy_router_v16.py \
            tests/test_mlb_moneyline_step12_final_synthesis.py \
            tests/test_streamlit_memory_lazy_router_v16.py
          PYTHONPATH=. python -c "import mlb_moneyline_hub_v178; import streamlit_memory_lazy_router_v16"

      - name: Prove additive app bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path("app.py").read_text(encoding="utf-8")
          match=re.search(r"from streamlit_memory_lazy_router_v(\d+) import render_app", text)
          if not match or int(match.group(1)) < 16:
              raise SystemExit("Moneyline bootstrap regressed below Router V16")
          router=Path(f"streamlit_memory_lazy_router_v{match.group(1)}.py")
          if not router.exists():
              raise SystemExit(f"active router file missing: {router}")
          if "streamlit_memory_lazy_router_v1" not in text:
              raise SystemExit("lazy-router bootstrap lineage marker missing")
          print("MLB_MONEYLINE_STEP12_BOOTSTRAP=PASS")
          PY

      - name: Run Step 12 focused contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_moneyline_step12_final_synthesis.py \
            tests/test_streamlit_memory_lazy_router_v16.py \
            tests/test_mlb_moneyline_step11_market_intelligence.py \
            tests/test_streamlit_memory_lazy_router_v15.py \
            tests/test_mlb_moneyline_step10_game_script.py \
            tests/test_streamlit_memory_lazy_router_v14.py \
            tests/test_mlb_moneyline_step9_recent_form.py \
            tests/test_streamlit_memory_lazy_router_v13.py \
            tests/test_mlb_moneyline_step8_defense_baserunning.py \
            tests/test_mlb_moneyline_step5l_live_mode.py \
            tests/test_mlb_step7c_moneyline_api_integration_v1.py

      - name: Final Moneyline architecture assertions
        run: |
          PYTHONPATH=. python - <<'PY'
          import mlb_moneyline_hub_v178 as m

          assert m.SCRIPT_BLEND_MAX <= 0.20
          assert m.MAX_CALIBRATION_DELTA <= 0.035

          result = {
              "game_pk": 1,
              "selected_side": "home",
              "team": "Home",
              "opponent": "Away",
              "away_name": "Away",
              "home_name": "Home",
              "away_team_id": 10,
              "home_team_id": 20,
              "team_id": 20,
              "win_prob": 0.58,
              "final_home": 0.58,
              "final_away": 0.42,
              "fair_odds": "-138",
          }
          step10 = {
              "away": {"expected_runs": 4.0, "data_score": 100},
              "home": {"expected_runs": 4.8, "data_score": 100},
          }
          market_a = {
              "status": "VERIFIED",
              "selected_side": "home",
              "selected_odds": -300,
              "opponent_odds": 240,
              "no_vig_probability": 0.73,
          }
          market_b = {
              "status": "VERIFIED",
              "selected_side": "home",
              "selected_odds": 180,
              "opponent_odds": -210,
              "no_vig_probability": 0.34,
          }
          a = m._final_context(result, step10, market_a)
          b = m._final_context(result, step10, market_b)
          assert abs(a["final_probability"] - b["final_probability"]) < 1e-12
          assert a["market_probability_weight"] == 0.0
          assert b["market_probability_weight"] == 0.0
          print("MLB_MONEYLINE_STEP12_MARKET_INDEPENDENCE=PASS")
          PY

      - name: Certification marker
        run: echo "MLB_MONEYLINE_STEP12_FINAL_SYNTHESIS_GREEN"
