name: WNBA Step 7C Render service inspect

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wnba-step-7c-service-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - name: Inspect safe Render service fields
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          import httpx

          token = os.environ['RENDER_API_KEY']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
          with httpx.Client(base_url='https://api.render.com', headers=headers, timeout=30) as c:
              owners = c.get('/v1/owners', params={'limit': 100}); owners.raise_for_status()
              rows = owners.json(); ids=[]
              for row in rows if isinstance(rows, list) else []:
                  obj = row.get('owner') if isinstance(row, dict) and isinstance(row.get('owner'), dict) else row
                  if isinstance(obj, dict) and obj.get('id'): ids.append(obj['id'])
              owner_id = (os.environ.get('RENDER_OWNER_ID') or '').strip() or (ids[0] if len(ids)==1 else '')
              assert owner_id
              services = c.get('/v1/services', params={'ownerId': owner_id, 'name': 'kyre-sports-api', 'limit': 100}); services.raise_for_status()
              rows = services.json(); matches=[]
              for row in rows if isinstance(rows, list) else []:
                  obj = row.get('service') if isinstance(row, dict) and isinstance(row.get('service'), dict) else row
                  if isinstance(obj, dict) and obj.get('id'): matches.append(obj)
              assert len(matches)==1
              sid = matches[0]['id']
              r = c.get(f'/v1/services/{sid}'); r.raise_for_status(); s = r.json()

          safe = {k: s.get(k) for k in [
              'id','name','type','repo','branch','autoDeploy','runtime','env','plan','region',
              'healthCheckPath','dockerfilePath','dockerContext','rootDir','url'
          ]}
          details = s.get('serviceDetails') if isinstance(s.get('serviceDetails'), dict) else None
          print(json.dumps({'top_level': safe, 'serviceDetails': details}, indent=2, sort_keys=True))
          PY
