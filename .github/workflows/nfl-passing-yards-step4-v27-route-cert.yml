name: NFL Passing Yards Step 4 V27 nested route cert

on:
  pull_request:
    branches: [main]
    paths:
      - 'nfl_passing_yards_hub_v27.py'
      - 'nfl_hub_v35.py'
      - 'tests/test_nfl_passing_yards_step4_nested_route_v27.py'
      - '.github/workflows/nfl-passing-yards-step4-v27-route-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v27-nested-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
      - name: Compile V27 route
        run: |
          python -m py_compile nfl_passing_yards_hub_v27.py
          python -m py_compile nfl_hub_v35.py
      - name: Prove nested route resolves to Pressure V5
        run: python -m pytest -q tests/test_nfl_passing_yards_step4_nested_route_v27.py
      - name: Re-run Pressure V5 source recovery
        run: python -m pytest -q tests/test_nfl_passing_yards_step4_pressure_live_fallback_v5.py
      - name: Re-run frozen V4 gate
        run: python -m pytest -q tests/test_nfl_passing_yards_step4_pressure_fallback_v4.py
      - name: Permanent protection assertions
        run: |
          grep -q 'PASSING YARDS V27' nfl_hub_v35.py
          grep -q 'pressure_v5.build_pressure_matchup' nfl_passing_yards_hub_v27.py
          grep -q '0.0% sportsbook projection influence' nfl_hub_v35.py
