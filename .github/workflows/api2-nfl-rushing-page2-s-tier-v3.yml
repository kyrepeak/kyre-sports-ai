name: API2 NFL Rushing Page2 S-Tier V3

on:
  pull_request:
    branches:
      - main
    paths:
      - "nfl_rushing_yards_professional_v1.py"
      - "nfl_rushing_yards_professional_v2.py"
      - "nfl_rushing_yards_professional_v3.py"
      - "nfl_rushing_yards_detail_gateway_v2.py"
      - "tests/test_api2_nfl_rushing_page2_s_tier_v3.py"
      - "tests/test_api2_nfl_rushing_page2_command_center_v2.py"
      - "tests/test_api2_nfl_rushing_yards_simple_rb_grid_v1.py"
      - "tests/test_api2_nfl_rushing_yards_market_reliability_v2.py"
      - "devsystem/runless_proof_plans/api2-nfl-rushing-page2-s-tier-v3.json"
      - "devsystem/task_ledgers/api2-nfl-rushing-page2-s-tier-v3.json"
      - "docs/superpowers/specs/2026-10-25-nfl-rushing-page2-s-tier-v3-design.md"
      - "docs/superpowers/plans/2026-10-25-nfl-rushing-page2-s-tier-v3.md"
      - ".github/workflows/api2-nfl-rushing-page2-s-tier-v3.yml"

jobs:
  page2-s-tier-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests pandas fastapi streamlit
      - name: Compile Page 2 presentation stack
        run: python -m py_compile nfl_rushing_yards_professional_v1.py nfl_rushing_yards_professional_v2.py nfl_rushing_yards_professional_v3.py nfl_rushing_yards_detail_gateway_v2.py
      - name: Run exact Page 2 S-tier proof bundle
        run: >-
          python -m pytest --noconftest -q
          tests/test_api2_nfl_rushing_page2_s_tier_v3.py
          tests/test_api2_nfl_rushing_page2_command_center_v2.py
          tests/test_api2_nfl_rushing_yards_simple_rb_grid_v1.py
          tests/test_api2_nfl_rushing_yards_market_reliability_v2.py
