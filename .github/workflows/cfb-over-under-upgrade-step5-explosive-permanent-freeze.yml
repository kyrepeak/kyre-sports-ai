name: CFB O/U Upgrade Step 5 explosive permanent freeze

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-upgrade-step5-explosive-permanent-freeze']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact permanent-freeze scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-upgrade-step5-explosive-permanent-freeze'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-upgrade-step5-explosive-permanent-freeze.yml' \
            'cfb_over_under_upgrade_freeze_manifest_v5.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Step 5 permanent-freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_STEP5_PERMANENT_FREEZE_SCOPE=PASS"

      - name: Enforce previous Upgrade Step 4 freeze
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v4.json") != "0d80ddc8269a75c1c999fbea5f432299f49cd511":
              failures.append("Upgrade Step 4 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v4.json").read_text()
          )
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 1-4 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 1-4 frozen path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_4_PERMANENTLY_FROZEN=PASS")
          PY

      - name: Enforce Step 5 exact blobs and contract
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v5.json").read_text()
          )
          failures = []

          if manifest.get("version") != 5:
              failures.append("Step 5 freeze version changed")
          if manifest.get("completed_upgrade_steps") != [1, 2, 3, 4, 5]:
              failures.append("completed upgrade-step list changed")
          if manifest.get("baseline_commit") != "b2875dd7b455916d94eb043d019a42e4dae66b3b":
              failures.append("Step 5 baseline commit changed")

          c = manifest.get("step5_contract") or {}
          expected_equal = {
              "name": "explosive-play engine",
              "market": "Over/Under",
              "frozen_parent_upgrade": "cfb_over_under_matchup_ui_v4",
              "frozen_parent_slate": "cfb_over_under_slate_v3",
              "active_engine": "cfb_over_under_explosive_engine_v1",
              "active_slate": "cfb_over_under_slate_v4",
              "active_ui": "cfb_over_under_matchup_ui_v5",
              "active_router": "streamlit_memory_lazy_router_v45",
              "pass_proxy_weight": 0.60,
              "rush_proxy_weight": 0.40,
              "minimum_side_coverage": 0.60,
              "max_team_explosive_adjustment_points": 1.75,
              "analysis_line_explosive_weight": 0.0,
              "analysis_line_projection_weight": 0.0,
              "next_upgrade_step": 6,
              "next_upgrade_name": "red-zone engine",
              "live_florida_am_division": "FCS",
              "live_miami_division": "FBS",
          }
          for key, expected in expected_equal.items():
              if c.get(key) != expected:
                  failures.append(f"Step 5 contract changed: {key}")

          required_true = [
              "ncaa_pass_yards_per_attempt_proxy_active",
              "ncaa_pass_yards_per_completion_proxy_active",
              "ncaa_pass_yards_per_attempt_allowed_active",
              "ncaa_pass_yards_per_completion_allowed_active",
              "ncaa_rush_yards_per_carry_proxy_active",
              "ncaa_rush_yards_per_carry_allowed_active",
              "division_baseline_normalization_active",
              "mixed_fbs_fcs_absolute_efficiency_allowed",
              "early_sample_shrinkage_active",
              "live_florida_am_miami_certified",
          ]
          for key in required_true:
              if c.get(key) is not True:
                  failures.append(f"Step 5 contract lost required true invariant: {key}")

          required_false = [
              "cross_division_rank_comparison_allowed",
              "true_20_plus_pass_play_rate_available",
              "true_20_plus_pass_play_rate_fabricated",
              "true_10_plus_rush_play_rate_available",
              "true_10_plus_rush_play_rate_fabricated",
              "frozen_step9_thresholds_changed",
              "frozen_reliability_changed",
              "frozen_structural_sigma_changed",
              "sportsbook_input_added",
              "market_probability_input_added",
              "edge_or_ev_added",
              "monte_carlo_added",
          ]
          for key in required_false:
              if c.get(key) is not False:
                  failures.append(f"Step 5 contract violated false invariant: {key}")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing Step 5 frozen path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"Step 5 frozen blob changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEP5_EXACT_BLOBS_AND_CONTRACT=PASS")
          PY

      - name: Verify active Router V45 and compile frozen Step 5
        run: |
          grep -F 'from streamlit_memory_lazy_router_v45 import render_app' app.py
          python -m py_compile \
            app.py \
            cfb_over_under_explosive_engine_v1.py \
            cfb_over_under_slate_v4.py \
            cfb_over_under_matchup_ui_v5.py \
            streamlit_memory_lazy_router_v45.py

      - name: Run Step 5 and inherited regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_upgrade_step5_explosive_engine.py \
            tests/test_cfb_over_under_upgrade_step5_slate.py \
            tests/test_cfb_over_under_upgrade_step5_ui_router.py \
            tests/test_cfb_over_under_upgrade_step4_pace_engine.py \
            tests/test_cfb_over_under_upgrade_step4_slate.py \
            tests/test_cfb_over_under_upgrade_step4_ui_router.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_cfb_over_under_multisource_logo_resolver_v2.py \
            tests/test_cfb_over_under_multisource_logo_hotfix_v4.py \
            tests/test_cfb_over_under_logo_recursion_hotfix_v3.py

      - name: Step 5 permanent-freeze model firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          exp = Path("cfb_over_under_explosive_engine_v1.py").read_text(encoding="utf-8")
          slate = Path("cfb_over_under_slate_v4.py").read_text(encoding="utf-8")
          ui = Path("cfb_over_under_matchup_ui_v5.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v45.py").read_text(encoding="utf-8")
          combined = "\n".join((exp, slate, ui, router))

          required = [
              'FROZEN_STEP4_ENGINE = "cfb_over_under_pace_engine_v1"',
              'MAX_TEAM_EXPLOSIVE_ADJUSTMENT = 1.75',
              'MIN_SIDE_COVERAGE = 0.60',
              'ANALYSIS_LINE_EXPLOSIVE_WEIGHT = 0.0',
              '"true_explosive_pass_rate_available": False',
              '"true_explosive_run_rate_available": False',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v4"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v44"',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing frozen Step 5 marker: {token}")

          lower = combined.lower()
          for token in ("sportsbook_api", "np.random", "import random", "monte_carlo("):
              if token in lower:
                  raise SystemExit(f"Step 5 permanent freeze crossed firewall: {token}")

          print("CFB_OU_UPGRADE_STEP5_PERMANENT_FREEZE_FIREWALL=PASS")
          PY

      - name: Permanent freeze marker
        run: echo "CFB_OU_UPGRADE_STEP5_EXPLOSIVE_PERMANENTLY_FROZEN_GREEN"
