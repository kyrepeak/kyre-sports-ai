name: College Football Step 7 permanent freeze contract

on:
  workflow_dispatch:
  push:
    branches: ['cfb-step7-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert Step 7 freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-step7-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step7-over-under-foundation.yml' \
            '.github/workflows/cfb-step7-permanent-freeze-contract.yml' \
            'cfb_freeze_manifest_v7.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 7 freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP7_FREEZE_SCOPE=PASS"

      - name: Pin prior and current CFB freeze manifests
        run: |
          python - <<'PY'
          import subprocess
          import sys

          expected = {
              "cfb_freeze_manifest_v6.json": "505cbf2cc7269138d9bdaba2449717615558f9a5",
              "cfb_freeze_manifest_v7.json": "504a9f8f18a9b6b59497bc610bb77c1042286dc4",
          }

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for path, blob in expected.items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  actual = None
              if actual != blob:
                  failures.append(f"{path} changed expected={blob} actual={actual}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP7_MANIFEST_PINS=PASS")
          PY

      - name: Enforce College Football Steps 1 through 7 exact blobs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v7.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 7:
              failures.append("freeze manifest version mismatch")
          if m.get("completed_steps") != [1,2,3,4,5,6,7]:
              failures.append("completed_steps mismatch")
          if m.get("step7_merge_commit") != "62c39dc3682d7ad2b5269470e7c2bfe9b0094e6d":
              failures.append("Step 7 merge commit mismatch")
          sections = m.get("completed_sections") or {}
          if sections.get("moneyline") is not True:
              failures.append("Moneyline completion contract changed")
          if sections.get("over_under") is not False:
              failures.append("Over/Under incorrectly marked complete at foundation Step 7")
          contract = m.get("step7_contract") or {}
          if contract.get("market") != "Over/Under":
              failures.append("Step 7 market contract changed")
          if contract.get("foundation_only") is not True:
              failures.append("Step 7 foundation-only contract changed")
          if contract.get("schedule_provider") != "cfb_schedule_v3":
              failures.append("Step 7 schedule provider changed")
          if contract.get("team_data_provider") != "cfb_team_data_v2":
              failures.append("Step 7 team-data provider changed")

          must_be_false = (
              "projected_total_active",
              "over_under_probability_active",
              "sportsbook_total_or_price_input",
              "fair_total_active",
              "edge_or_ev_active",
              "slate_ranking_active",
              "monte_carlo_active",
          )
          for key in must_be_false:
              if contract.get(key) is not False:
                  failures.append(f"Step 7 locked-off contract changed: {key}")

          required_step7 = {
              "cfb_over_under_hub_v1.py",
              "streamlit_memory_lazy_router_v31.py",
          }
          if not required_step7.issubset(set(m.get("exact_blobs", {}))):
              failures.append("Step 7 exact frozen paths missing")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB blob changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP7_EXACT_FREEZE=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP7_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile frozen Step 7
        run: |
          python -m py_compile \
            cfb_over_under_hub_v1.py \
            streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py

      - name: Run frozen Step 7 contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step7_over_under_foundation.py \
            tests/test_streamlit_memory_lazy_router_v31.py \
            tests/test_cfb_step6_moneyline_final_v1.py \
            tests/test_cfb_step6_moneyline_slate_v1.py \
            tests/test_streamlit_memory_lazy_router_v30.py \
            tests/test_cfb_scoreboard_completeness_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v29.py \
            tests/test_cfb_mixed_division_hotfix.py \
            tests/test_streamlit_memory_lazy_router_v28.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Lock Step 7 Over-Under foundation contract
        run: |
          PYTHONPATH=. python - <<'PY'
          import inspect

          import cfb_over_under_hub_v1 as hub

          assert hub.MARKET == "Over/Under"
          assert hub.SCHEDULE_PROVIDER == "cfb_schedule_v3"
          assert hub.TEAM_DATA_PROVIDER == "cfb_team_data_v2"

          source = inspect.getsource(hub)
          forbidden = (
              "import numpy",
              "np.random",
              "def simulate",
              "over_probability =",
              "under_probability =",
              "projected_total =",
              "fair_total =",
              "sportsbook_total =",
              "sportsbook_price =",
              "expected_value =",
              "cfb_moneyline_final_v1",
              "cfb_moneyline_model_v1",
          )
          for token in forbidden:
              assert token not in source, token

          game = {
              "identity_verified": True,
              "date_matches_query": True,
          }
          away = {
              "record": {"games": 2},
              "ppg": 31.0,
              "points_allowed_pg": 17.0,
              "data_quality": {"grade": "READY"},
          }
          home = {
              "record": {"games": 2},
              "ppg": 28.0,
              "points_allowed_pg": 20.0,
              "data_quality": {"grade": "LIMITED"},
          }
          assert hub._foundation_ready(game, away, home) is True

          print("CFB_STEP7_OVER_UNDER_FOUNDATION_FROZEN=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP7_PERMANENT_FREEZE_GREEN"
