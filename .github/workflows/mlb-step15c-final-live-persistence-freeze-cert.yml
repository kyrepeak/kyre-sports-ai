name: MLB Step15C final live persistence freeze certification

on:
  push:
    branches:
      - mlb-step15c-final-live-persistence-freeze
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-step15c-final-live-persistence-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-step15c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STEP15C_BASE_SHA: 315d47be1089c95f45087d6537a8a7e9ac86d9ef
      MLB_STEP15C_FINAL_LIVE_PERSISTENCE_FREEZE_ENABLED: "true"
      MLB_STEP15B_LIVE_ADAPTER_SMOKE_ENABLED: "true"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest fastapi httpx numpy pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Verify five-file additive Step15C scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$STEP15C_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 5
          allowed='^(sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py|tests/test_mlb_step15_final_live_persistence_release_freeze_v1.py|sports_api/tools/mlb_step15c_final_live_persistence_freeze_cert.py|sports_api/certification/mlb_step15c_final_live_persistence_freeze_evidence.json|\.github/workflows/mlb-step15c-final-live-persistence-freeze-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad"
          git diff --check "$STEP15C_BASE_SHA"...HEAD
          test -z "$(git diff --numstat "$STEP15C_BASE_SHA"...HEAD | awk '$2 != 0 {print}')"
          echo MLB_STEP15C_FIVE_FILE_ADDITIVE_SCOPE_OK

      - name: Verify frozen Step15B and parents unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP15C_BASE_SHA"...HEAD -- \
            sports_api/mlb_step15b_live_adapter_transaction_smoke_v1.py \
            sports_api/certification/mlb_step15b_live_adapter_transaction_smoke_evidence.json \
            sports_api/mlb_step15a_live_postgresql_preflight_v1.py \
            sports_api/mlb_step14_final_persistence_freeze_v1.py \
            sports_api/mlb_step14b_database_checkpoint_adapter_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/main.py sports_api/api/mlb.py app.py
          test "$(git rev-parse "$STEP15C_BASE_SHA:sports_api/mlb_step15b_live_adapter_transaction_smoke_v1.py")" = 568227a4be41cdeb0f7ba8b33468eab738424dca
          test "$(git rev-parse "$STEP15C_BASE_SHA:sports_api/mlb_step15a_live_postgresql_preflight_v1.py")" = 9000c54df1a9d1bac4aeb143e354fc554129725c
          test "$(git rev-parse "$STEP15C_BASE_SHA:sports_api/mlb_step14_final_persistence_freeze_v1.py")" = 8d346c2fb3abf71742c048d5489ac88124b990b6
          echo MLB_STEP15C_FROZEN_PARENTS_EXACT

      - name: Compile Step15C
        run: |
          python -m py_compile \
            sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py \
            sports_api/tools/mlb_step15c_final_live_persistence_freeze_cert.py \
            tests/test_mlb_step15_final_live_persistence_release_freeze_v1.py

      - name: Run Step15C targeted tests
        run: python -m pytest -q tests/test_mlb_step15_final_live_persistence_release_freeze_v1.py

      - name: Run full MLB regression
        run: python -m pytest -q tests/test_mlb_*.py

      - name: Certify final Step15 live persistence freeze
        run: python -m sports_api.tools.mlb_step15c_final_live_persistence_freeze_cert

      - name: Final marker
        run: echo MLB_STEP15C_FINAL_LIVE_PERSISTENCE_FREEZE_GREEN
