name: Monster A9 TDD

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a9-tdd:
    if: github.head_ref == 'monster-a9-streamlit-secrets-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run A9 focused tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_a9_posthog_config_proof.py
