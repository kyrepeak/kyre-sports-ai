name: CFB Step 4 Frozen Registry CAS

on:
  push:
    branches:
      - cfb-top-picks-step4-freeze-cas-r1
    paths:
      - .github/workflows/cfb-top-picks-step4-freeze-cas-r1.yml

permissions:
  contents: write

concurrency:
  group: cfb-top-picks-step4-freeze-cas-r1
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CAS-freeze Step 4 on authoritative registry ref
        env:
          EXPECTED_REGISTRY_REF_SHA: 0b30db5894345fc0793a5fe1e0da88a20f4c2e1a
          EXPECTED_REVISION: "120"
          EXPECTED_STATE_HASH: 205644b62610f6af727326a14ca8e217ebc7e18e4cf1e991a1a14b8a9f8ac15d
          MAIN_SHA: 4845a4101ddcb76fa8b6819f6b3c6dc786d41dce
          REGISTRY_REF: refs/heads/monster-frozen-artifact-registry
          REGISTRY_PATH: devsystem/frozen_artifact_registry_state_v1.json
        run: |
          set -euo pipefail
          git fetch origin monster-frozen-artifact-registry
          ACTUAL_REF_SHA="$(git rev-parse origin/monster-frozen-artifact-registry)"
          test "$ACTUAL_REF_SHA" = "$EXPECTED_REGISTRY_REF_SHA"

          rm -rf /tmp/step4-registry
          git worktree add --detach /tmp/step4-registry origin/monster-frozen-artifact-registry

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from devsystem.frozen_artifact_registry_v1 import (
              _hash,
              _payload_without_hash,
              validate_registry,
          )

          checkpoint = "CFB_TOP_PICKS_REPAIR_STEP4_DETAIL_INTEGRITY"
          registry_file = Path("/tmp/step4-registry") / os.environ["REGISTRY_PATH"]
          payload = json.loads(registry_file.read_text(encoding="utf-8"))
          before = validate_registry(payload)

          assert int(payload["revision"]) == int(os.environ["EXPECTED_REVISION"]), payload["revision"]
          assert payload["state_hash"] == os.environ["EXPECTED_STATE_HASH"], payload["state_hash"]
          assert before["state_hash"] == os.environ["EXPECTED_STATE_HASH"]
          assert payload["active_thaws"] == [], payload["active_thaws"]
          assert checkpoint not in payload["entries"], "Step 4 already frozen"

          main_sha = os.environ["MAIN_SHA"]
          payload["entries"][checkpoint] = {
              "status": "FROZEN",
              "checkpoint_id": checkpoint,
              "source_main_sha": main_sha,
              "proven_merge_sha": main_sha,
              "proof_run_id": 37242800409,
              "focused_detail_integrity_proof_run_id": 37242800431,
              "terminal_receipt_digest": "sha256:6d4ab1cc97ffe55a00fef43acabf59afe4ddcb646994f99973f94467c3a74f3b",
              "regression_debt_state": "CLEARED",
              "live_top10_details_10_of_10": True,
              "public_detail_surface_green": True,
              "required_sections": [
                  "Why This Pick",
                  "Actual Matchup History",
                  "Benefits",
              ],
              "exact_event_identity": True,
              "exact_team_identity": True,
              "step3_reasoning_preserved": True,
              "history_fabricated": False,
              "history_projection_weight": 0.0,
              "history_selection_weight": 0.0,
              "history_ranking_weight": 0.0,
              "sportsbook_projection_weight": 0.0,
              "regression_guard": {
                  "test": "tests/test_cfb_top_picks_repair_step4_detail_integrity_v1.py",
                  "contract": "devsystem/cfb_top_picks_repair_step4_detail_integrity_v1.py",
              },
              "artifacts": {
                  "devsystem/cfb_top_picks_repair_step4_detail_integrity_v1.py": "983c8fcdaaf6afc9181dbdf98dc82b70bec4f3c6",
                  "tests/test_cfb_top_picks_repair_step4_detail_integrity_v1.py": "87f72a64323a508634ba46e8645a27eeb7c51358",
                  "devsystem/task_ledgers/cfb-top-picks-repair-step4-detail-integrity-v1.json": "ac9c84be70be73dc6874f9cd126fae92a73dc020",
                  ".github/workflows/cfb-top-picks-repair-step4-detail-integrity-v1.yml": "fbac19f9e9bb7ecea486964f901cbb4966ee060a",
              },
          }
          payload["revision"] = int(payload["revision"]) + 1
          payload["source_main_sha"] = main_sha
          payload["state_hash"] = _hash(_payload_without_hash(payload))

          after = validate_registry(payload)
          assert after["active_thaw_count"] == 0
          assert payload["revision"] == 121
          assert payload["entries"][checkpoint]["status"] == "FROZEN"
          registry_file.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("CFB_TOP_PICKS_REPAIR_STEP4_REGISTRY_PLAN_GREEN")
          print("STEP4_NEXT_REVISION=121")
          print("STEP4_NEXT_STATE_HASH=" + payload["state_hash"])
          PY

          cd /tmp/step4-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY_PATH"
          test "$(git diff --cached --name-only)" = "$REGISTRY_PATH"
          git commit -m "Freeze CFB Top Picks Repair Step 4 detail integrity"

          CURRENT_REMOTE="$(git ls-remote origin "$REGISTRY_REF" | awk '{print $1}')"
          test "$CURRENT_REMOTE" = "$EXPECTED_REGISTRY_REF_SHA"
          git push \
            --force-with-lease="$REGISTRY_REF:$EXPECTED_REGISTRY_REF_SHA" \
            origin HEAD:"$REGISTRY_REF"
          echo "CFB_TOP_PICKS_REPAIR_STEP4_REGISTRY_CAS_GREEN"
