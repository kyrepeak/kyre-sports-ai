name: CFB Top Picks Repair Step 4 Detail Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "devsystem/cfb_top_picks_repair_step4_detail_integrity_v1.py"
      - "tests/test_cfb_top_picks_repair_step4_detail_integrity_v1.py"
      - "devsystem/task_ledgers/cfb-top-picks-repair-step4-detail-integrity-v1.json"
      - ".github/workflows/cfb-top-picks-repair-step4-detail-integrity-v1.yml"
  push:
    branches: [main]
    paths:
      - "devsystem/cfb_top_picks_repair_step4_detail_integrity_v1.py"
      - "tests/test_cfb_top_picks_repair_step4_detail_integrity_v1.py"
      - "devsystem/task_ledgers/cfb-top-picks-repair-step4-detail-integrity-v1.json"
      - ".github/workflows/cfb-top-picks-repair-step4-detail-integrity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-repair-step4-detail-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore shared hot Python environment
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Build environment on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          .venv-browser-qa/bin/python -m playwright install chromium
      - name: Activate environment
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Static and permanent Step 4 detail-integrity proof
        run: |
          python -m py_compile devsystem/cfb_top_picks_repair_step4_detail_integrity_v1.py
          python -m pytest -q tests/test_cfb_top_picks_repair_step4_detail_integrity_v1.py
      - name: Certify live Top 10 Step 4 detail integrity
        run: python -m devsystem.cfb_top_picks_repair_step4_detail_integrity_v1
      - name: Certify merged-main public Step 4 detail surface
        if: github.event_name == 'push'
        run: python -m devsystem.cfb_top_picks_repair_step4_detail_integrity_v1 --public
      - name: Upload Step 4 detail integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-top-picks-repair-step4-detail-integrity-evidence-${{ github.run_id }}
          path: artifacts/cfb-top-picks-repair-step4-detail-integrity
          if-no-files-found: ignore
