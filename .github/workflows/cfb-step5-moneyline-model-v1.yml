name: College Football Step 5 Moneyline-model certification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/cfb-step5-moneyline-model-v1']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact Step 5 implementation scope
        if: github.event_name == 'push' || github.head_ref == 'feature/cfb-step5-moneyline-model-v1'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-step4-moneyline-page-ui.yml' \
            '.github/workflows/cfb-step5-moneyline-model-v1.yml' \
            'app.py' \
            'cfb_moneyline_hub_v2.py' \
            'cfb_moneyline_model_v1.py' \
            'streamlit_memory_lazy_router_v27.py' \
            'tests/test_cfb_step5_moneyline_model_v1.py' \
            'tests/test_streamlit_memory_lazy_router_v27.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected College Football Step 5 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_STEP5_SCOPE=PASS"

      - name: Enforce frozen College Football Steps 1 through 4
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          m = json.loads(pathlib.Path("cfb_freeze_manifest_v4.json").read_text())

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if m.get("version") != 4 or m.get("completed_steps") != [1, 2, 3, 4]:
              failures.append("CFB freeze V4 metadata changed")

          for path, expected in m.get("exact_blobs", {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(
                      f"frozen CFB Steps 1-4 changed: {path} expected={expected} actual={actual}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEPS_1_4_FROZEN=PASS")
          PY

      - name: Enforce protected MLB contracts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifests = [
              "mlb_hits_freeze_manifest_v7.json",
              "mlb_moneyline_freeze_manifest_v13.json",
              "mlb_matchup_explorer_freeze_manifest_v1.json",
          ]

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          for name in manifests:
              m = json.loads(pathlib.Path(name).read_text())
              base = m["baseline_commit"]

              for path in m.get("baseline_paths", []):
                  try:
                      expected = rev(f"{base}:{path}")
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing frozen path {path}")
                      continue
                  if expected != actual:
                      failures.append(f"{name}: frozen baseline changed {path}")

              for path, expected in m.get("exact_blobs", {}).items():
                  try:
                      actual = rev(f"HEAD:{path}")
                  except subprocess.CalledProcessError:
                      failures.append(f"{name}: missing exact-frozen path {path}")
                      continue
                  if actual != expected:
                      failures.append(f"{name}: exact frozen blob changed {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("CFB_STEP5_EXISTING_MLB_FREEZES=PASS")
          PY

      - name: Compile College Football Step 5
        run: |
          python -m py_compile \
            app.py \
            cfb_moneyline_model_v1.py \
            cfb_moneyline_hub_v2.py \
            streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py
          PYTHONPATH=. python -c "import cfb_moneyline_model_v1; import cfb_moneyline_hub_v2; import streamlit_memory_lazy_router_v27"

      - name: Run College Football Step 5 regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_step5_moneyline_model_v1.py \
            tests/test_streamlit_memory_lazy_router_v27.py \
            tests/test_cfb_step4_moneyline_page_ui.py \
            tests/test_streamlit_memory_lazy_router_v26.py \
            tests/test_cfb_step3_team_data_foundation.py \
            tests/test_streamlit_memory_lazy_router_v25.py \
            tests/test_cfb_step2_schedule_identity.py \
            tests/test_streamlit_memory_lazy_router_v24.py \
            tests/test_cfb_step1_hub_foundation.py \
            tests/test_streamlit_memory_lazy_router_v23.py \
            tests/test_streamlit_memory_lazy_router_v22.py \
            tests/test_mlb_hits_strict_no_tough.py

      - name: Prove raw model and market firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path("cfb_moneyline_model_v1.py").read_text(encoding="utf-8")
          hub = Path("cfb_moneyline_hub_v2.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v27.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          required = [
              'HOME_FIELD_POINTS = 2.5',
              'MARGIN_LOGISTIC_SCALE = 10.5',
              'sportsbook_input_used": False',
              'monte_carlo_used": False',
              'fair_moneyline_ready": False',
              'final_pick_ready": False',
              'UNVERIFIED • ZERO IMPACT',
              'FROZEN_CFB_MONEYLINE_HUB = "cfb_moneyline_hub_v1"',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v26"',
              'root._import("cfb_moneyline_hub_v2")',
          ]
          combined = model + "\n" + hub + "\n" + router
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing Step 5 model marker: {token}")

          forbidden_model = [
              "import numpy",
              "np.random",
              "import requests",
              "urllib.request",
              "def simulate",
              "market_probability =",
              "moneyline_price =",
              "expected_value =",
              "fair_moneyline =",
          ]
          for token in forbidden_model:
              if token in model:
                  raise SystemExit(f"Step 5 crossed raw-model firewall: {token}")

          if "streamlit_memory_lazy_router_v27" not in app:
              raise SystemExit("app.py is not booting Router V27")

          print("CFB_STEP5_RAW_MODEL_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_STEP5_MONEYLINE_MODEL_V1_GREEN"
