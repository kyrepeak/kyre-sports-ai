name: WNBA PRA Repair V1 Step 3 Data Completeness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml"
      - "devsystem/dependency_chain_auto_refresh_v1.py"
      - "devsystem/dependency_chain_registry_v1.json"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py"
      - "wnba_pra_repair_v1_step2_team_identity.py"
      - "devsystem/dependency_chain_auto_refresh_v1.py"
      - "devsystem/dependency_chain_registry_v1.json"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py"
      - "wnba_pra_repair_v1_step2_team_identity.py"
      - "app.py"
      - "devsystem/execution_plans/wnba-pra-repair-v1-step3-data-completeness.json"
      - "devsystem/task_ledgers/wnba-pra-repair-v1-step3-data-completeness.json"
      - "devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py"
      - "tests/test_wnba_pra_repair_v1_step3.py"
      - "wnba_pra_repair_v1_step3_data.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml"
      - "app.py"
      - "devsystem/execution_plans/wnba-pra-repair-v1-step3-data-completeness.json"
      - "devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py"
      - "tests/test_wnba_pra_repair_v1_step3.py"
      - "wnba_pra_repair_v1_step3_data.py"

permissions:
  contents: read

concurrency:
  group: wnba-pra-repair-v1-step3-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step-3 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/api2-proof-architecture-v1-step3-dependency-auto-refresh.yml
          .github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml
          app.py
          devsystem/dependency_chain_auto_refresh_v1.py
          devsystem/dependency_chain_registry_v1.json
          devsystem/execution_plans/api2-proof-architecture-v1-step3-dependency-auto-refresh.json
          devsystem/execution_plans/wnba-pra-repair-v1-step3-data-completeness.json
          devsystem/task_ledgers/api2-proof-architecture-v1-step3-dependency-auto-refresh.json
          devsystem/task_ledgers/wnba-pra-repair-v1-step3-data-completeness.json
          devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py
          streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py
          streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py
          tests/test_devsystem_dependency_chain_auto_refresh_v1.py
          tests/test_wnba_pra_repair_v1_step3.py
          wnba_pra_repair_v1_step2_team_identity.py
          wnba_pra_repair_v1_step3_data.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          comm -23 /tmp/changed.txt /tmp/allowed.txt > /tmp/unexpected.txt
          if [ -s /tmp/unexpected.txt ]; then
            echo "WNBA_PRA_REPAIR_V1_STEP3_SCOPE_BLOCKED"
            cat /tmp/unexpected.txt
            exit 1
          fi
          echo "WNBA_PRA_REPAIR_V1_STEP3_SCOPE_GREEN"

      - name: Auto-refresh Step-2 parent dependency identity
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m devsystem.dependency_chain_auto_refresh_v1 verify \
            --dependency-id wnba-pra-repair-v1-step3-step2 \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --json-out /tmp/wnba-step3-parent-snapshot.json
          cat /tmp/wnba-step3-parent-snapshot.json
          echo "WNBA_PRA_REPAIR_V1_STEP3_PARENT_AUTO_REFRESH_GREEN"

      - name: Verify independent frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object wnba_pra_game_center_v2_step3.py)" = "a181c8949991bb139521f7d379046f34147e5306"
          test "$(git hash-object wnba_pra_player_intelligence_v2_step4.py)" = "393c29711962bf1d42b8fc58322938c92e23000a"
          test "$(git hash-object streamlit_memory_lazy_router_wnba_pra_speed_v3_step9_duplicate_key_guard.py)" = "51eef1fe2526801a467f155d1c0b32d516ef8a35"
          echo "WNBA_PRA_REPAIR_V1_STEP3_INDEPENDENT_DEPENDENCIES_GREEN"

      - name: Compile Step-3 runtime
        run: |
          python -m py_compile app.py
          python -m py_compile wnba_pra_repair_v1_step3_data.py
          python -m py_compile streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py
          python -m py_compile devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run focused Step-3 regression contract
        run: |
          python -m pytest -q \
            tests/test_wnba_pra_repair_v1_step3.py \
            tests/test_wnba_pra_repair_v1_step2.py \
            tests/test_wnba_pra_speed_v3_step9.py

      - name: Run exact-head V8 source certification
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m devsystem.wnba_pra_repair_v1_step3_data_completeness_cert --source-only

      - name: Exact-head Step-3 contract GREEN
        run: |
          echo "WNBA_PRA_REPAIR_V1_STEP3_SOURCE_SCOPE_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP3_STEP2_PARENT_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP3_BRANCH_GREEN"

  public-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify merged-main base lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5bdbe8548a3cc20db2100d2d6b458b49c6956521 HEAD
          echo "WNBA_PRA_REPAIR_V1_STEP3_MERGED_MAIN_LINEAGE_GREEN"

      - name: Install frozen browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          python -m playwright install chromium

      - name: Run one authoritative merged-main Page-3 proof
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m devsystem.wnba_pra_repair_v1_step3_data_completeness_cert \
            --production-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/wnba-pra-repair-v1-step3-data-completeness

      - name: Upload Step-3 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-pra-repair-v1-step3-${{ github.run_id }}
          path: artifacts/wnba-pra-repair-v1-step3-data-completeness
          if-no-files-found: warn
          retention-days: 14
