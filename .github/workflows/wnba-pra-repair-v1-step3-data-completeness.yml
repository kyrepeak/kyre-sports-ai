name: WNBA PRA Repair V1 Step 3 Data Completeness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml"
      - "devsystem/task_ledgers/wnba-pra-repair-v1-step3-data-completeness.json"
      - "devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py"
      - "tests/test_wnba_pra_repair_v1_step3.py"
      - "wnba_pra_repair_v1_step3_data.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml"
      - "devsystem/task_ledgers/wnba-pra-repair-v1-step3-data-completeness.json"
      - "devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py"
      - "streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py"
      - "tests/test_wnba_pra_repair_v1_step3.py"
      - "wnba_pra_repair_v1_step3_data.py"

permissions:
  contents: read

concurrency:
  group: wnba-pra-repair-v1-step3-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Step-3 component scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/wnba-pra-repair-v1-step3-data-completeness.yml
          devsystem/task_ledgers/wnba-pra-repair-v1-step3-data-completeness.json
          devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py
          streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py
          tests/test_wnba_pra_repair_v1_step3.py
          wnba_pra_repair_v1_step3_data.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          echo "WNBA_PRA_REPAIR_V1_STEP3_EXACT_SCOPE_GREEN"

      - name: Verify frozen parent dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object streamlit_memory_lazy_router_wnba_pra_repair_v1_step2_team_identity.py)" = "4e51bd0e0c631b71cf9af7a443038edbe1b7061c"
          test "$(git hash-object wnba_pra_repair_v1_step2_team_identity.py)" = "9e571c95a8dc5229e39dfa60fbcffa18afb38bc1"
          test "$(git hash-object wnba_pra_game_center_v2_step3.py)" = "a181c8949991bb139521f7d379046f34147e5306"
          test "$(git hash-object wnba_pra_player_intelligence_v2_step4.py)" = "393c29711962bf1d42b8fc58322938c92e23000a"
          test "$(git hash-object streamlit_memory_lazy_router_wnba_pra_speed_v3_step9_duplicate_key_guard.py)" = "51eef1fe2526801a467f155d1c0b32d516ef8a35"
          echo "WNBA_PRA_REPAIR_V1_STEP3_PARENT_DEPENDENCIES_GREEN"

      - name: Compile Step-3 component
        run: |
          python -m py_compile wnba_pra_repair_v1_step3_data.py
          python -m py_compile streamlit_memory_lazy_router_wnba_pra_repair_v1_step3_data_completeness.py
          python -m py_compile devsystem/wnba_pra_repair_v1_step3_data_completeness_cert.py

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run focused Step-3 regression contract
        run: |
          python -m pytest -q             tests/test_wnba_pra_repair_v1_step3.py             tests/test_wnba_pra_repair_v1_step2.py             tests/test_wnba_pra_speed_v3_step9.py

      - name: Run V8 component certification
        run: python -m devsystem.wnba_pra_repair_v1_step3_data_completeness_cert

      - name: Exact-head Step-3 contract GREEN
        run: |
          echo "WNBA_PRA_REPAIR_V1_STEP3_COMPONENT_SCOPE_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP3_STEP2_PARENT_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP3_APP_FROZEN_UNTOUCHED_GREEN"
          echo "WNBA_PRA_REPAIR_V1_STEP3_BRANCH_GREEN"

  merged-main-component:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify merged main contains Step-3 base lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5bdbe8548a3cc20db2100d2d6b458b49c6956521 HEAD
          echo "WNBA_PRA_REPAIR_V1_STEP3_MERGED_MAIN_LINEAGE_GREEN"

      - name: Run merged-main V8 component certification
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -m devsystem.wnba_pra_repair_v1_step3_data_completeness_cert

      - name: Upload Step-3 merged-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-pra-repair-v1-step3-${{ github.run_id }}
          path: artifacts/wnba-pra-repair-v1-step3-data-completeness
          if-no-files-found: warn
          retention-days: 14
