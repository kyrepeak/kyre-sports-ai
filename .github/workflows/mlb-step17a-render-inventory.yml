name: MLB Step17A read-only Render inventory

on:
  push:
    branches:
      - mlb-step17a-production-host-contract
    paths:
      - .github/workflows/mlb-step17a-render-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reuse the existing shared Kyre Sports API Render environment only to read
    # the already-provisioned host inventory. This workflow performs no mutation.
    environment: wnba-render-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory Render services without mutation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          base='https://api.render.com/v1'
          headers={
              'Authorization':f"Bearer {os.environ['RENDER_API_KEY']}",
              'Accept':'application/json',
              'User-Agent':'kyre-mlb-step17a-inventory/2',
          }

          def get(path):
              req=urllib.request.Request(base+path,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return json.loads(resp.read().decode())

          services=[]
          path='/services?limit=100'
          seen=set()
          while path and path not in seen:
              seen.add(path)
              doc=get(path)
              rows=doc if isinstance(doc,list) else (doc.get('items') or doc.get('data') or [])
              cursor=None
              for row in rows:
                  if not isinstance(row,dict):
                      continue
                  svc=row.get('service') if isinstance(row.get('service'),dict) else row
                  sid=svc.get('id')
                  full=get(f'/services/{sid}') if sid else svc
                  if isinstance(full,dict) and isinstance(full.get('service'),dict):
                      full=full['service']
                  details=full.get('serviceDetails') if isinstance(full.get('serviceDetails'),dict) else {}
                  services.append({
                      'id':full.get('id'),
                      'name':full.get('name'),
                      'type':full.get('type'),
                      'runtime':details.get('runtime') or details.get('env'),
                      'url':details.get('url') or full.get('url'),
                      'region':details.get('region'),
                      'plan':details.get('plan'),
                      'repo':full.get('repo'),
                      'branch':full.get('branch'),
                      'auto_deploy':full.get('autoDeploy'),
                      'root_dir':full.get('rootDir'),
                      'health_check_path':details.get('healthCheckPath'),
                      'num_instances':details.get('numInstances'),
                  })
                  if row.get('cursor'):
                      cursor=row.get('cursor')
              path='/services?limit=100&cursor='+urllib.parse.quote(str(cursor),safe='') if cursor else None

          print('MLB_STEP17A_RENDER_SERVICE_COUNT',len(services))
          for i,svc in enumerate(services,1):
              print('MLB_STEP17A_RENDER_SERVICE',i,json.dumps(svc,sort_keys=True))
          with open('mlb-step17a-render-inventory.json','w',encoding='utf-8') as f:
              json.dump({'service_count':len(services),'services':services,'mutation_performed':False},f,indent=2,sort_keys=True)
          PY

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step17a-render-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: mlb-step17a-render-inventory.json
          if-no-files-found: error
          retention-days: 7
