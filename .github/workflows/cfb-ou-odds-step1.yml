name: CFB O-U odds integration Step 1

on:
  push:
    branches:
      - step1-cfb-odds-api
  pull_request:
    branches:
      - cfb-ou-odds-integration-v1

jobs:
  certify-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sports_api/requirements.txt pytest
      - name: Run CFB market contract tests
        run: python -m pytest -q sports_api/tests/test_cfb_markets_step1.py
      - name: Compile CFB market route
        run: python -m py_compile sports_api/api/cfb_markets.py sports_api/api/health.py
