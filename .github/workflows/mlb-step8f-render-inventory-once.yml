name: MLB Step8F Render inventory one-shot

on:
  push:
    branches:
      - mlb-step8f-player-prop-presentation-integration
    paths:
      - .github/workflows/mlb-step8f-render-inventory-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependency
        run: python -m pip install --disable-pip-version-check -q httpx
      - name: Read current Render service and deploy metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          python - <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          from sports_api.wnba_render_provisioning import RenderAPIClient, resolve_owner_id

          def clean(value):
              text = str(value or '').strip()
              return text or None

          with RenderAPIClient(api_key=os.environ['RENDER_API_KEY'], timeout_seconds=30.0) as client:
              owner_id = resolve_owner_id(client, clean(os.environ.get('RENDER_OWNER_ID')))
              matches = client.list_services(owner_id, 'kyre-sports-api')
              if len(matches) != 1:
                  raise RuntimeError(f'expected exactly one kyre-sports-api service, got {len(matches)}')
              service_id = clean(matches[0].get('id'))
              service = client.get_service(service_id)
              details = service.get('serviceDetails') if isinstance(service.get('serviceDetails'), dict) else {}
              deploy_doc = client.request('GET', f'/v1/services/{service_id}/deploys', params={'limit': 10})
              deploys = []
              if isinstance(deploy_doc, list):
                  for raw in deploy_doc:
                      row = raw.get('deploy') if isinstance(raw, dict) and isinstance(raw.get('deploy'), dict) else raw
                      if not isinstance(row, dict):
                          continue
                      commit = row.get('commit') if isinstance(row.get('commit'), dict) else {}
                      deploys.append({
                          'id': clean(row.get('id')),
                          'status': clean(row.get('status')),
                          'commit_id': clean(row.get('commitId')) or clean(commit.get('id')) or clean(commit.get('sha')),
                          'created_at': clean(row.get('createdAt')),
                          'updated_at': clean(row.get('updatedAt')),
                      })
              evidence = {
                  'service_name': clean(service.get('name')),
                  'service_id': service_id,
                  'repo': clean(service.get('repo')),
                  'branch': clean(service.get('branch')),
                  'auto_deploy': clean(service.get('autoDeploy')),
                  'url': clean(details.get('url')) or clean(service.get('url')),
                  'runtime': clean(details.get('runtime')) or clean(details.get('env')),
                  'plan': clean(details.get('plan')),
                  'deploys': deploys,
                  'render_api_key_returned': False,
                  'read_only': True,
              }
          raw = json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          assert os.environ['RENDER_API_KEY'] not in raw
          Path('step8f-render-inventory.json').write_text(raw, encoding='utf-8')
          print(raw)
          print('MLB_STEP8F_RENDER_INVENTORY_COMPLETE')
          PY
      - name: Upload sanitized Render inventory
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step8f-render-inventory-${{ github.run_id }}
          path: step8f-render-inventory.json
          if-no-files-found: error
          retention-days: 1
