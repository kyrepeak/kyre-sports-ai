name: Passing Yards Step 3 Environment Recursion Guard V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-step3-environment-recursion-guard-v1.yml"
      - "nfl_passing_yards_hub_v18.py"
      - "tests/test_passing_yards_step3_environment_recursion_guard_v1.py"
      - "devsystem/task_ledgers/passing-yards-step3-environment-recursion-guard-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-step3-environment-recursion-guard-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recursion-guard-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact hotfix scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-step3-environment-recursion-guard-v1.yml
          devsystem/task_ledgers/passing-yards-step3-environment-recursion-guard-v1.json
          nfl_passing_yards_hub_v18.py
          tests/test_passing_yards_step3_environment_recursion_guard_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "PASSING_YARDS_STEP3_ENV_RECURSION_SCOPE_GREEN"

      - name: Prove Step 3 product and frozen Steps 1-2 unchanged
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" --             nfl_passing_yards_hub_v72.py             streamlit_memory_lazy_router_v223.py             nfl_passing_yards_hub_v71.py             streamlit_memory_lazy_router_v222.py             app.py
          echo "PASSING_YARDS_STEP3_PRODUCT_FROZEN_GREEN"

      - name: Install proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest requests playwright
          python -m playwright install --with-deps chromium

      - name: Run focused recursion regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_passing_yards_hub_v18.py
          python -m pytest -q tests/test_passing_yards_step3_environment_recursion_guard_v1.py
          echo "PASSING_YARDS_STEP3_ENV_RECURSION_UNIT_GREEN"

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/passing-yards-step3-environment-recursion
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/passing-yards-step3-environment-recursion/streamlit.log 2>&1 &
          echo $! > /tmp/py_step3_env_pid

      - name: Prove selected-QB Step 3 survives a poisoned environment builder
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          import requests
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          route=base+"/?"+urlencode({
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
          })

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code < 500:
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise RuntimeError("STEP3_ENV_GUARD_LOCAL_STREAMLIT_NOT_READY")

          def body_text(page):
              out=[]
              for frame in page.frames:
                  try: out.append(frame.locator("body").inner_text(timeout=2200))
                  except Exception: pass
              return "\n".join(out)

          def find(page,selector,timeout=180):
              deadline=time.monotonic()+timeout
              while time.monotonic()<deadline:
                  body=body_text(page)
                  if "RecursionError" in body or "Traceback" in body or "TypeError" in body:
                      print(body[:50000])
                      raise RuntimeError("STEP3_ENV_GUARD_RUNTIME_ERROR")
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(400)
              raise RuntimeError("STEP3_ENV_GUARD_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto(route,wait_until="domcontentloaded",timeout=120000)
              frame,root=find(page,'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]')
              body=frame.locator("body").inner_text(timeout=5000)
              assert "Jordan Love" in body
              assert "RecursionError" not in body
              assert "Traceback" not in body
              assert root.get_attribute("data-passing-yards-matchup-intelligence-ready")=="v72"
              panel=root.locator('[data-passing-yards-matchup-intelligence="v72"]')
              assert panel.count()==1
              assert panel.get_attribute("data-passing-yards-v223-runtime")=="matchup-intelligence-step3"
              print("PASSING_YARDS_STEP3_ENV_RECURSION_BRANCH_GREEN")
              browser.close()
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 600 artifacts/passing-yards-step3-environment-recursion/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/py_step3_env_pid ]; then kill "$(cat /tmp/py_step3_env_pid)" 2>/dev/null || true; fi
