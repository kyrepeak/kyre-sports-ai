name: NFL Step 6 Market Player Eligibility

on:
  pull_request:
    paths:
      - "sports_api/nfl_prop_market_eligibility_v1.py"
      - "sports_api/collectors/nfl_passing_yards_render_espn_v2.py"
      - "sports_api/collectors/nfl_fanduel_rushing_yards_v2.py"
      - "sports_api/collectors/nfl_fanduel_receiving_yards_v1.py"
      - "tests/test_nfl_prop_market_eligibility_v1.py"
      - "devsystem/nfl_step6_market_player_eligibility_v1.py"
      - ".github/workflows/nfl-step6-market-player-eligibility.yml"

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run Step 6 market eligibility unit proof
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_prop_market_eligibility_v1.py
      - name: Run Step 6 runtime-owner integration proof
        run: python devsystem/nfl_step6_market_player_eligibility_v1.py
