name: NFL Prop Analytics Page 2 Polish Step 4

on:
  pull_request:
    paths:
      - "nfl_prop_analytics_page2_tap_player_v1.py"
      - "nfl_prop_analytics_hub_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step4_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step4-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step4-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_page2_tap_player_v1.py"
      - "nfl_prop_analytics_hub_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step4_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step4-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-polish-step4-v1.yml"

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: pytest -q tests/test_nfl_prop_analytics_page2_polish_step4_v1.py
      - run: |
          grep -q 'data-prop-page2-tap-player="v1"' nfl_prop_analytics_page2_tap_player_v1.py
          grep -q 'render_tap_player_handoff(handoff, availability_truth)' nfl_prop_analytics_hub_v1.py
          echo PROP_ANALYTICS_PAGE2_POLISH_STEP4_TAP_HANDOFF_GREEN
          echo PROP_ANALYTICS_PAGE2_POLISH_STEP4_GREEN
          if [ "${{ github.event_name }}" = "push" ]; then
            echo PROP_ANALYTICS_PAGE2_POLISH_STEP4_PUBLIC_GREEN
            echo PROP_ANALYTICS_PAGE2_POLISH_STEP4_FROZEN
          fi
