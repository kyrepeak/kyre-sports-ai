name: NFL Game Totals Step 2P Live Proof

on:
  push:
    branches:
      - monster/nfl-game-totals-step2p-render-bridge
    paths:
      - .github/workflows/nfl-game-totals-step2p-live-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-route:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production Game Totals route
        shell: bash
        run: |
          set -euo pipefail
          url='https://kyre-sports-api.onrender.com/api/v1/nfl/totals/market?event_id=1'
          status="$(curl --silent --show-error --location --max-time 30 --output response.json --write-out '%{http_code}' "$url")"
          echo "HTTP $status"
          cat response.json
          test "$status" = "200"

      - name: Validate production contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('response.json').read_text())
          assert payload['event_id'] == '1'
          assert payload['provider'] == 'fanduel'
          assert payload['contract'] == 'nfl-game-totals-market-v1'
          assert payload['identity_mode'] == 'exact_espn_event_id'
          assert float(payload['sportsbook_projection_weight']) == 0.0
          assert payload['projection_use'] == 'context_only'
          assert payload['wager_actions_enabled'] is False
          assert isinstance(payload['ready'], bool)
          assert isinstance(payload['market_available'], bool)
          assert isinstance(payload['markets'], list)
          assert isinstance(payload['diagnostics'], list)
          print('LIVE NFL Game Totals route contract verified')
          PY
