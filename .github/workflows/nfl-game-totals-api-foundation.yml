name: NFL Game Totals API Foundation

on:
  push:
    branches:
      - nfl-game-totals-api-foundation
    paths:
      - "sports_api/api/nfl_game_totals_*.py"
      - "sports_api/collectors/nfl_game_totals_*.py"
      - "sports_api/collectors/nfl_fanduel_totals_*.py"
      - "tests/test_nfl_game_totals_*.py"
      - "tests/test_nfl_fanduel_totals_*.py"
      - ".github/workflows/nfl-game-totals-api-foundation.yml"
  pull_request:
    branches: [main]
    paths:
      - "sports_api/api/nfl_game_totals_*.py"
      - "sports_api/collectors/nfl_game_totals_*.py"
      - "sports_api/collectors/nfl_fanduel_totals_*.py"
      - "tests/test_nfl_game_totals_*.py"
      - "tests/test_nfl_fanduel_totals_*.py"
      - ".github/workflows/nfl-game-totals-api-foundation.yml"

permissions:
  contents: read

concurrency:
  group: nfl-game-totals-api-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-api-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sports_api/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile Game Totals API foundation
        run: |
          python -m py_compile \
            sports_api/api/nfl_game_totals_market_v1.py \
            sports_api/api/nfl_game_totals_games_v1.py \
            sports_api/collectors/nfl_fanduel_totals_v1.py \
            sports_api/collectors/nfl_game_totals_schedule_v1.py \
            tests/test_nfl_game_totals_contract_v1.py \
            tests/test_nfl_game_totals_schedule_v1.py \
            tests/test_nfl_fanduel_totals_v1.py \
            tests/test_nfl_game_totals_market_transport_v1.py \
            tests/test_nfl_game_totals_games_v1.py \
            tests/test_nfl_game_totals_features_v1.py

      - name: Run Game Totals contract regressions
        run: python -m pytest -q tests/test_nfl_game_totals_contract_v1.py

      - name: Run Game Totals schedule regressions
        run: python -m pytest -q tests/test_nfl_game_totals_schedule_v1.py

      - name: Run FanDuel Game Totals collector regressions
        run: python -m pytest -q tests/test_nfl_fanduel_totals_v1.py

      - name: Run Game Totals market transport regressions
        run: python -m pytest -q tests/test_nfl_game_totals_market_transport_v1.py

      - name: Run Game Totals metadata API regressions
        run: python -m pytest -q tests/test_nfl_game_totals_games_v1.py

      - name: Run Game Totals football-only feature regressions
        run: python -m pytest -q tests/test_nfl_game_totals_features_v1.py
