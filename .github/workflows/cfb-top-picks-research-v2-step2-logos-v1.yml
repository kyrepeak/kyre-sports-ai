name: CFB Top Picks Research V2 Step 2 Logos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-top-picks-research-v2-step2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'devsystem/browser_requirements.lock') }}
      - name: Build Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_requirements.lock
          .venv-browser-qa/bin/python -m playwright install chromium
      - name: Activate Browser QA virtualenv
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"
      - name: Static Step 2 contract
        run: |
          python -m py_compile cfb_top_picks_team_identity_v1.py
          python -m py_compile cfb_top_picks_engine_v1.py
          python -m py_compile cfb_top_picks_page_v2.py
          python -m py_compile devsystem/cfb_top_picks_research_v2_step2_logos_v1.py
          python -m py_compile devsystem/cfb_top_picks_research_v2_step2_logo_cert_v1.py
          python devsystem/cfb_top_picks_research_v2_step2_logos_v1.py
          python -m pytest -q tests/test_cfb_top_picks_research_v2_step2_contract_v1.py tests/test_cfb_top_picks_research_v2_step2_logos_v1.py tests/test_cfb_top_picks_research_v2_step2_main_readiness_v1.py tests/test_cfb_top_picks_step2_cards_v1.py tests/test_cfb_top_picks_step3_ranking_v1.py
      - name: Start branch-local Streamlit
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/cfb-top-picks-step2.log 2>&1 &
          echo $! > /tmp/cfb-top-picks-step2.pid
      - name: Prove 10 cards and 20 loaded real logos
        run: python -m devsystem.cfb_top_picks_research_v2_step2_logo_cert_v1 --base-url http://127.0.0.1:8501
      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 250 /tmp/cfb-top-picks-step2.log || true
      - name: Upload Step 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-top-picks-research-v2-step2-evidence
          path: artifacts/cfb-top-picks-research-v2-step2
          if-no-files-found: ignore
      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/cfb-top-picks-step2.pid ]; then kill "$(cat /tmp/cfb-top-picks-step2.pid)" || true; fi
