name: Passing Yards Layered Phase 1 Step 2 Shell

on:
  push:
    branches:
      - "monster/passing-yards-layered-phase1-step2-shell-v1"
    paths:
      - "sports_universal_shell_v1.py"
      - "nfl_passing_yards_hub_v16.py"
      - "tests/test_passing_yards_layered_phase1_step2_shell_v1.py"
      - ".github/workflows/passing-yards-layered-phase1-step2-shell-v1.yml"

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted verifier
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Prove universal website shell
        run: python -m pytest -q tests/test_passing_yards_layered_phase1_step2_shell_v1.py
