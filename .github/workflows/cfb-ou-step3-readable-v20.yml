name: CFB O/U readable Step 3 V20

on:
  push:
    branches: [cfb-ou-step3-readable-matchup-v20]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Scope firewall
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-ou-step3-readable-v20.yml",
              "cfb_over_under_clean_page_v17.py",
              "cfb_over_under_step3_readable_v2.py",
              "data/cfb_step3_matchup_stats_v1.json",
              "tests/test_cfb_over_under_step3_readable_v2.py",
          }
          if changed != expected:
              raise SystemExit(f"scope mismatch: {sorted(changed)}")
          print("STEP3_V20_SCOPE=PASS")
          PY

      - name: Compile
        run: |
          python -m py_compile             cfb_over_under_clean_page_v17.py             cfb_over_under_step3_readable_v2.py             tests/test_cfb_over_under_step3_readable_v2.py

      - name: Full CFB O/U regression suite
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cfb_over_under_*.py

      - name: Protect certified model files
        run: |
          git diff --quiet origin/main...HEAD --             cfb_over_under_model_v1.py             cfb_over_under_matchup_engine_v1.py             cfb_over_under_pace_engine_v1.py             cfb_over_under_explosive_engine_v1.py             cfb_over_under_red_zone_engine_v1.py             cfb_over_under_third_down_engine_v1.py             cfb_over_under_turnover_engine_v1.py             cfb_over_under_environment_engine_v1.py             cfb_over_under_history_engine_v1.py             cfb_over_under_form_strength_engine_v1.py             cfb_over_under_final_v1.py             cfb_over_under_slate_v14_runtime.py
          echo STEP3_V20_CERTIFIED_MODEL_FILES_UNCHANGED

      - name: Certify readable football evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_clean_page_v17 as page
          import cfb_over_under_step3_readable_v2 as step3

          assert step3.NEW_PROJECTION_WEIGHT == 0.0
          payload=step3._snapshot_payload()
          famu=payload["teams"]["50"]
          miami=payload["teams"]["2390"]

          away={
              "team":"Florida A&M",
              "games":famu["games"],
              "offense":famu["offense"],
              "defense":famu["defense"],
          }
          home={
              "team":"Miami (FL)",
              "games":miami["games"],
              "offense":miami["offense"],
              "defense":miami["defense"],
          }
          readable={
              "display_ready":True,
              "sample_state":"VERY EARLY • 1 GAME",
              "sources":[
                  "ESPN Core current-season team statistics",
                  "ESPN exact-event completed-game summaries",
              ],
              "away_offense_vs_home_defense":step3._battle(away,home),
              "home_offense_vs_away_defense":step3._battle(home,away),
          }
          html=page._step3_readable(
              readable,
              {"ready":True,"model_ready":False,"coverage":0.0,"reason":"gated"},
          )
          required=[
              "Florida A&amp;M OFFENSE",
              "Miami (FL) DEFENSE",
              "Miami (FL) OFFENSE",
              "Florida A&amp;M DEFENSE",
              "Passing yards",
              "Rushing yards",
              "Passing TDs",
              "Rushing TDs",
              "First downs",
              "Total yards",
              "Points",
              "Yards / play",
              "428.0",
              "173.5",
              "+254.5",
              "0% NEW PROJECTION WEIGHT",
          ]
          for token in required:
              assert token in html, token
          for banned in (
              "analysis line matchup weight",
              "max team adjustment",
              "weighted signal",
          ):
              assert banned not in html.lower(), banned
          print("STEP3_V20_READABLE_EVIDENCE=PASS")
          PY

      - name: Data-source truth firewall
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_step3_readable_v2 as step3
          assert step3.SPORTSBOOK_INPUT_USED is False
          assert step3.MARKET_PROBABILITY_USED is False
          assert step3.EDGE_OR_EV_USED is False
          assert step3.MONTE_CARLO_USED is False
          print("STEP3_V20_SOURCE_TRUTH=PASS")
          PY

      - run: echo CFB_OU_STEP3_READABLE_V20_GREEN
