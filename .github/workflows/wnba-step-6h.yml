name: WNBA Step 6H official roster + slate reconciliation gate

on:
  push:
    branches:
      - api-foundation-v1
    paths:
      - 'sports_api/wnba_official_reconciliation.py'
      - 'sports_api/api/wnba_draftkings_direct.py'
      - 'sports_api/tools/wnba_official_reconciliation_probe.py'
      - 'sports_api/tests/test_wnba_official_reconciliation.py'
      - 'sports_api/tests/test_wnba_official_reconciliation_routes.py'
      - '.github/workflows/wnba-step-6h.yml'
  pull_request:
    paths:
      - 'sports_api/wnba_official_reconciliation.py'
      - 'sports_api/api/wnba_draftkings_direct.py'
      - 'sports_api/tools/wnba_official_reconciliation_probe.py'
      - 'sports_api/tests/test_wnba_official_reconciliation.py'
      - 'sports_api/tests/test_wnba_official_reconciliation_routes.py'
      - '.github/workflows/wnba-step-6h.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step6h-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Compile Step 6H modules
        run: |
          python -m py_compile \
            sports_api/wnba_official_reconciliation.py \
            sports_api/api/wnba_draftkings_direct.py \
            sports_api/tools/wnba_official_reconciliation_probe.py
      - name: Run Step 6H deterministic tests
        run: python -m unittest sports_api.tests.test_wnba_official_reconciliation sports_api.tests.test_wnba_official_reconciliation_routes
      - name: Run Step 6G regression
        run: python -m unittest sports_api.tests.test_wnba_draftkings_shadow_ingestion sports_api.tests.test_wnba_draftkings_shadow_ingestion_routes
      - name: Run Step 6F discovery regression
        run: python -m unittest sports_api.tests.test_wnba_draftkings_prop_market_discovery
      - name: Run Step 6D direct collector regression
        run: python -m unittest sports_api.tests.test_wnba_draftkings_direct sports_api.tests.test_wnba_step6d_direct_integration
      - name: Run Step 6C owned-feed regression
        run: python -m unittest sports_api.tests.test_wnba_kyre_market_feed sports_api.tests.test_wnba_kyre_market_feed_routes
      - name: Run frozen Step 5O regression
        run: python -m unittest sports_api.tests.test_wnba_prop_feed_failover
      - name: Run frozen Step 5P regression
        run: python -m unittest sports_api.tests.test_wnba_pregame_board_scheduler
      - name: Run frozen Step 5R regression
        run: python -m unittest sports_api.tests.test_wnba_production_runtime_readiness
      - name: Prove Step 6H stays evidence-only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('sports_api/wnba_official_reconciliation.py'),
              Path('sports_api/tools/wnba_official_reconciliation_probe.py'),
          ]
          joined = '\n'.join(p.read_text(encoding='utf-8') for p in files).lower()
          assert '.post(' not in joined
          assert 'sync_draftkings_to_kyre_feed(' not in joined
          assert 'write_kyre_market_feed(' not in joined
          assert 'sportsgameodds_api_key' not in joined
          assert 'wnba_production_runtime_enabled=true' not in joined
          assert 'wnba_kyre_direct_sync_enabled=true' not in joined
          print('Step 6H is GET-only, feed-write-free, scheduler-off, vendor-free, wager-free, and Monte-Carlo-free.')
          PY

  live-official-reconciliation-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: step6h-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt
      - name: Run live DraftKings + official WNBA reconciliation
        env:
          WNBA_OFFICIAL_RECONCILIATION_TIMEOUT_SECONDS: '15'
        run: |
          mkdir -p .wnba-step6h-reconciliation
          python -m sports_api.tools.wnba_official_reconciliation_probe --output .wnba-step6h-reconciliation/live-reconciliation.json
      - name: Print sanitized Step 6H evidence
        run: |
          python - <<'PY'
          import json
          report = json.load(open('.wnba-step6h-reconciliation/live-reconciliation.json', encoding='utf-8'))
          print('ready_for_auto_sync=', report.get('ready_for_auto_sync'))
          print('offer_side_count=', report.get('offer_side_count'))
          print('market_count=', report.get('market_count'))
          print('draftkings_event_count=', report.get('draftkings_event_count'))
          print('verified_player_count=', report.get('verified_player_count'))
          print('verified_roster_membership_count=', report.get('verified_roster_membership_count'))
          print('verified_event_count=', report.get('verified_event_count'))
          print('verified_market_count=', report.get('verified_market_count'))
          print('blockers=', report.get('blockers'))
          print('mismatch_count=', len(report.get('mismatch_details') or []))
          print('reconciliation_fingerprint_sha256=', report.get('reconciliation_fingerprint_sha256'))
          PY
      - name: Upload sanitized Step 6H evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step6h-official-reconciliation-${{ github.run_id }}
          path: .wnba-step6h-reconciliation/live-reconciliation.json
          if-no-files-found: error
          retention-days: 30
