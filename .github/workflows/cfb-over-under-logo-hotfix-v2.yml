name: CFB O/U ESPN logo hotfix V2

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-logo-hotfix-v2']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive hotfix scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-logo-hotfix-v2'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-logo-hotfix-v2.yml' \
            'app.py' \
            'cfb_over_under_matchup_ui_v3_logo_hotfix_v2.py' \
            'streamlit_memory_lazy_router_v41.py' \
            'tests/test_cfb_over_under_logo_hotfix_v2.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U logo hotfix V2 scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_LOGO_HOTFIX_V2_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen base path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"original frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("ORIGINAL_CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce O/U Upgrade Steps 1 through 3 permanent freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "7c3408833b931fbb9d2e41e6660ebdf4f975f723"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v3.json") != expected_manifest_blob:
              failures.append("O/U Upgrade Step 3 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text()
          )
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen O/U Upgrade Step 1-3 path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen O/U Upgrade Step 1-3 path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_3_FROZEN=PASS")
          PY

      - name: Enforce logo hotfix V1 permanent freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "d6fdea4e2e0a3c297233210d58492bee6a34996c"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_logo_hotfix_freeze_manifest_v1.json") != expected_manifest_blob:
              failures.append("logo hotfix V1 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_logo_hotfix_freeze_manifest_v1.json").read_text()
          )
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen logo hotfix V1 path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen logo hotfix V1 path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_LOGO_HOTFIX_V1_FROZEN=PASS")
          PY

      - name: Compile V2 hotfix
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_matchup_ui_v3_logo_hotfix_v2.py \
            streamlit_memory_lazy_router_v41.py \
            tests/test_cfb_over_under_logo_hotfix_v2.py
          PYTHONPATH=. python -c "import cfb_over_under_matchup_ui_v3_logo_hotfix_v2; import streamlit_memory_lazy_router_v41"

      - name: Run V2 and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_logo_hotfix_v2.py \
            tests/test_cfb_over_under_logo_hotfix_v1.py \
            tests/test_cfb_over_under_logo_hotfix_router_v40.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py

      - name: Live blank-ID Florida A&M at Miami resolver check
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_logo_resolver_v1 as logos

          game = {
              "game_date": "2026-09-10",
              "away_team": "Florida A&M",
              "away_team_slug": "florida-a-m",
              "home_team": "Miami (FL)",
              "home_team_slug": "miami-fl",
              "identity_key": "ncaa:6604311",
              "espn_event_id": "",
          }
          visuals = logos.resolve_visuals(game)
          away = visuals.get("away") or {}
          home = visuals.get("home") or {}

          if away.get("team_id") != "50":
              raise SystemExit(f"Florida A&M id mismatch: {away}")
          if home.get("team_id") != "2390":
              raise SystemExit(f"Miami id mismatch: {home}")
          if not str(away.get("logo") or "").endswith("/50.png"):
              raise SystemExit(f"Florida A&M logo missing: {away}")
          if not str(home.get("logo") or "").endswith("/2390.png"):
              raise SystemExit(f"Miami logo missing: {home}")

          print("LIVE_BLANK_ID_ESPN_LOGO_RESOLUTION=PASS")
          PY

      - name: Live composite hero renders both ESPN logos
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_matchup_ui_v3_logo_hotfix_v2 as ui

          game = {
              "game_date": "2026-09-10",
              "away_team": "Florida A&M",
              "away_team_slug": "florida-a-m",
              "away_conference": "SWAC",
              "home_team": "Miami (FL)",
              "home_team_slug": "miami-fl",
              "home_conference": "ACC",
              "kickoff_et": "8:00 PM ET",
              "venue": "Hard Rock Stadium",
              "broadcast": "ACCN",
              "status": "Scheduled",
              "neutral_site": False,
              "identity_verified": True,
              "date_matches_query": True,
              "identity_key": "ncaa:6604311",
              "espn_event_id": "",
          }
          away = {
              "team": "Florida A&M",
              "team_slug": "florida-a-m",
              "conference": "SWAC",
              "record_text": "1-1",
              "ap_rank": None,
              "rank_source": "NCAA AP rankings — unranked",
          }
          home = {
              "team": "Miami (FL)",
              "team_slug": "miami-fl",
              "conference": "ACC",
              "record_text": "1-0",
              "ap_rank": 7,
              "rank_source": "NCAA AP rankings",
          }

          old2 = ui.step2._rankings_panel
          old3 = ui.step3._engine_panel
          ui.step2._rankings_panel = lambda *a, **k: ""
          ui.step3._engine_panel = lambda *a, **k: ""
          try:
              html = ui._hero_with_forced_espn_logos(game, away, home)
          finally:
              ui.step2._rankings_panel = old2
              ui.step3._engine_panel = old3

          if "/50.png" not in html:
              raise SystemExit("Florida A&M ESPN logo URL absent from active hero HTML")
          if "/2390.png" not in html:
              raise SystemExit("Miami ESPN logo URL absent from active hero HTML")
          if "TEAM LOGOS VERIFIED" not in html:
              raise SystemExit("active hero did not certify both logos")

          print("LIVE_ACTIVE_HERO_ESPN_LOGOS=PASS")
          PY

      - name: Prove direct active-hero handoff and model firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("cfb_over_under_matchup_ui_v3_logo_hotfix_v2.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v41.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = wrapper + "\n" + router + "\n" + app

          required = [
              "step3._enhanced_hero_v3 = _hero_with_forced_espn_logos",
              "step1._visuals_for_game = logo_resolver.resolve_visuals",
              'root._import("cfb_over_under_matchup_ui_v3_logo_hotfix_v2")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v40"',
              'from streamlit_memory_lazy_router_v41 import render_app',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing V2 hotfix marker: {token}")

          forbidden = [
              "projected_total =",
              "over_probability =",
              "under_probability =",
              "selection_probability =",
              "rank_slate(",
              "expected_value",
              "np.random",
              "import random",
          ]
          lower = wrapper.lower()
          for token in forbidden:
              if token.lower() in lower:
                  raise SystemExit(f"V2 logo wrapper crossed model firewall: {token}")

          print("CFB_OU_LOGO_HOTFIX_V2_DIRECT_HERO_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_ESPN_LOGO_HOTFIX_V2_GREEN"
