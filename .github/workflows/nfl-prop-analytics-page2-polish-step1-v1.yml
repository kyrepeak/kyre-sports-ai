name: NFL Prop Analytics Page 2 Polish Step 1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json"
      - "nfl_prop_analytics_matchup_shell_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step1_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml"
      - ".github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json"
      - "nfl_prop_analytics_matchup_shell_v1.py"
      - "tests/test_nfl_prop_analytics_page2_polish_step1_v1.py"

permissions:
  contents: read

concurrency:
  group: nfl-prop-analytics-page2-polish-step1-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact Page 2 polish Step 1 scope and frozen data product
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-polish-step1-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step4-page2-shell-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step5-roster-truth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step6-availability-depth-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step7-player-handoff-v1.yml' \
            '.github/workflows/nfl-prop-analytics-step8-prop-page-shell-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-polish-step1-v1.json' \
            'nfl_prop_analytics_matchup_shell_v1.py' \
            'tests/test_nfl_prop_analytics_page2_polish_step1_v1.py' | sort)"
          test "$actual" = "$expected" || {
            echo "PROP_ANALYTICS_PAGE2_POLISH_STEP1_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          }

          check_blob () {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || {
              echo "PROP_ANALYTICS_PAGE2_POLISH_STEP1_FROZEN_BLOB_CHANGED:$1:$got:$2"
              exit 1
            }
          }

          check_blob nfl_prop_analytics_schedule_v1.py 3558f4581c0301c4fc57f8b5e761e1e0cc1eb63c
          check_blob nfl_prop_analytics_game_select_v1.py 1187c13fc5bee03a955d014e87f237ed055a27ef
          check_blob nfl_prop_analytics_hub_v1.py 0f0016e5e34ea026aed31b548b5c639444a8a75b
          check_blob nfl_prop_analytics_roster_truth_v1.py ad1a49ddd24d6f50da6c56280b34290b2c3312f3
          check_blob nfl_prop_analytics_availability_depth_v1.py cf7fdeee4c18d95c19d2a737f59bda7818e059ae
          check_blob nfl_prop_analytics_player_select_v1.py b9aa4ec194ffea970d6858dcd0e0ed7c31ae0426
          check_blob nfl_prop_analytics_prop_page_v1.py c1dc331b6bb63558229ae2dba2e36b4b8c1951fe
          check_blob streamlit_memory_lazy_router_v240.py 43a6ef5a541e945b0795f947e32f61fbbaeb5257
          check_blob streamlit_memory_lazy_router_v239.py 1b7b98567b90919f546d025b927beb0b2acf8468
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob app.py d584693ab55e365bc7e76f9cbacd58a15f6d62d1

          echo "PROP_ANALYTICS_PAGE2_POLISH_STEP1_FROZEN_DATA_GREEN"
          echo "PROP_ANALYTICS_PAGE2_POLISH_STEP1_SCOPE_GREEN"

      - name: Install static test stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and test full Prop Analytics regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile nfl_prop_analytics_matchup_shell_v1.py
          python -m pytest -q \
            tests/test_nfl_prop_analytics_step1_route_ownership_v1.py \
            tests/test_nfl_prop_analytics_step2_schedule_truth_v1.py \
            tests/test_nfl_prop_analytics_step3_game_handoff_v1.py \
            tests/test_nfl_prop_analytics_step4_page2_shell_v1.py \
            tests/test_nfl_prop_analytics_step5_roster_truth_v1.py \
            tests/test_nfl_prop_analytics_step6_availability_depth_v1.py \
            tests/test_nfl_prop_analytics_step7_player_handoff_v1.py \
            tests/test_nfl_prop_analytics_step8_prop_page_shell_v1.py \
            tests/test_nfl_prop_analytics_page2_polish_step1_v1.py
          echo "PROP_ANALYTICS_PAGE2_POLISH_STEP1_STATIC_GREEN"

      - name: Prove live Page 2 header contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from datetime import date
          import requests
          from nfl_prop_analytics_schedule_v1 import _load_schedule_truth_uncached
          from nfl_prop_analytics_game_select_v1 import build_matchup_handoff
          from nfl_prop_analytics_matchup_shell_v1 import _premium_matchup_header

          truth=_load_schedule_truth_uncached(date(2026,9,27))
          game=next(g for g in truth["games"] if g["verified"] and g["away"]=="CAR" and g["home"]=="CLE")
          handoff=build_matchup_handoff(game,truth["target_date"])
          html=_premium_matchup_header(handoff)
          assert 'data-prop-page2-header-kickoff="1:00 PM ET"' in html
          assert html.count("data-prop-page2-header-logo=")==2
          for team in ("CAR","CLE"):
              token=f'data-prop-page2-header-logo="{team}"'
              assert token in html,token
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_LIVE_HEADER_GREEN")
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_LIVE_TIME_GREEN 1:00 PM ET")
          PY

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Start branch-local Streamlit
        run: |
          mkdir -p artifacts/page2-polish-step1
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > artifacts/page2-polish-step1/streamlit.log 2>&1 &
          echo $! > /tmp/page2_polish_step1_pid

      - name: Prove premium header, logos, kickoff and responsive layout
        run: |
          python - <<'PY'
          import time, requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"

          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          else: raise RuntimeError("PAGE2_POLISH_STEP1_LOCAL_STREAMLIT_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE2_POLISH_STEP1_SELECTOR_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.goto(base+"/?"+urlencode({
                  "ks_jump_sport":"NFL",
                  "ks_jump_market":"Prop Analytics",
                  "ks_pa_game":"CAR-CLE",
                  "ks_pa_page":"matchup",
              }),wait_until="domcontentloaded",timeout=120000)

              frame,header=find(page,'[data-prop-page2-premium-header="v1"]',180)
              assert header.get_attribute("data-prop-page2-header-away")=="CAR"
              assert header.get_attribute("data-prop-page2-header-home")=="CLE"
              assert header.get_attribute("data-prop-page2-header-kickoff")=="1:00 PM ET"

              logos=frame.locator('[data-prop-page2-header-logo]')
              assert logos.count()==2,logos.count()
              end=time.monotonic()+30
              good=0
              while time.monotonic()<end:
                  good=logos.evaluate_all("els=>els.filter(e=>e.complete&&e.naturalWidth>0).length")
                  if good==2: break
                  page.wait_for_timeout(300)
              assert good==2,good

              page2=frame.locator('[data-nfl-prop-analytics-step4-page2="v1"]').first
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height}); page.wait_for_timeout(250)
                  dims=page2.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                  if dims["scroll"]>dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP1_OVERFLOW:{width}:{dims}")
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP1_BRANCH_{width}_GREEN")

              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_BRANCH_2_LOGOS_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_BRANCH_TIME_GREEN 1:00 PM ET")

              passing=browser.new_page(viewport={"width":390,"height":844})
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_PASSING_YARDS_BRANCH_FROZEN_GREEN")
              passing.close(); page.close(); browser.close()

          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_BRANCH_GREEN")
          PY

      - name: Print Streamlit log on failure
        if: failure()
        run: tail -n 1600 artifacts/page2-polish-step1/streamlit.log || true

      - name: Stop branch-local Streamlit
        if: always()
        run: |
          if [ -f /tmp/page2_polish_step1_pid ]; then kill "$(cat /tmp/page2_polish_step1_pid)" 2>/dev/null || true; fi

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public premium header and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("PAGE2_POLISH_STEP1_PUBLIC_SELECTOR_NOT_READY:"+selector)

          def open_header(browser):
              deadline=time.monotonic()+1200; last=""
              while time.monotonic()<deadline:
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  try:
                      page.goto(base+"/?"+urlencode({
                          "ks_jump_sport":"NFL",
                          "ks_jump_market":"Prop Analytics",
                          "ks_pa_game":"CAR-CLE",
                          "ks_pa_page":"matchup",
                      }),wait_until="domcontentloaded",timeout=120000)
                      frame,header=find(page,'[data-prop-page2-premium-header="v1"]',150)
                      if header.get_attribute("data-prop-page2-header-kickoff")!="1:00 PM ET":
                          last="KICKOFF"
                      else:
                          logos=frame.locator('[data-prop-page2-header-logo]')
                          if logos.count()!=2:last=f"LOGO_COUNT:{logos.count()}"
                          else:return context,page,frame,header,logos
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"
                      print("PAGE2_POLISH_STEP1_PUBLIC_DEPLOY_WAIT",last)
                  try:context.close()
                  except Exception:pass
                  time.sleep(8)
              raise RuntimeError("PAGE2_POLISH_STEP1_PUBLIC_DEPLOYMENT_NOT_ACTIVE:"+last)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              context,page,frame,header,logos=open_header(browser)
              end=time.monotonic()+30;good=0
              while time.monotonic()<end:
                  good=logos.evaluate_all("els=>els.filter(e=>e.complete&&e.naturalWidth>0).length")
                  if good==2:break
                  page.wait_for_timeout(300)
              assert good==2,good

              page2=frame.locator('[data-nfl-prop-analytics-step4-page2="v1"]').first
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height});page.wait_for_timeout(250)
                  dims=page2.evaluate("e=>({scroll:e.scrollWidth,client:e.clientWidth})")
                  if dims["scroll"]>dims["client"]+4:
                      raise RuntimeError(f"PAGE2_POLISH_STEP1_PUBLIC_OVERFLOW:{width}:{dims}")
                  print(f"PROP_ANALYTICS_PAGE2_POLISH_STEP1_PUBLIC_{width}_GREEN")

              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_PUBLIC_2_LOGOS_GREEN")
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_PUBLIC_TIME_GREEN 1:00 PM ET")

              passing=context.new_page()
              passing.goto(base+"/?ks_jump_sport=NFL&ks_jump_market=Passing+Yards",wait_until="domcontentloaded",timeout=120000)
              find(passing,'[data-passing-yards-router-owner="v239"]',150)
              print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_PASSING_YARDS_PUBLIC_FROZEN_GREEN")
              passing.close();page.close();context.close();browser.close()

          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_GREEN")
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_PUBLIC_GREEN")
          print("PROP_ANALYTICS_PAGE2_POLISH_STEP1_FROZEN")
          PY
