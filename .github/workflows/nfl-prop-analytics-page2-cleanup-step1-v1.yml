name: NFL Prop Analytics Page 2 Cleanup Step 1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_prop_analytics_page2_responsive_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page2_cleanup_step1_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step1-css-leak-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-cleanup-step1-v1.yml"
  push:
    branches: [main]
    paths:
      - "nfl_prop_analytics_page2_responsive_polish_v1.py"
      - "tests/test_nfl_prop_analytics_page2_cleanup_step1_v1.py"
      - "devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step1-css-leak-v1.json"
      - ".github/workflows/nfl-prop-analytics-page2-cleanup-step1-v1.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce cleanup Step 1 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/nfl-prop-analytics-page2-cleanup-step1-v1.yml' \
            'devsystem/task_ledgers/nfl-prop-analytics-page2-cleanup-step1-css-leak-v1.json' \
            'nfl_prop_analytics_page2_responsive_polish_v1.py' \
            'tests/test_nfl_prop_analytics_page2_cleanup_step1_v1.py' | sort)"
          test "$actual" = "$expected" || { echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_SCOPE_VIOLATION; printf '%s\n' "$actual"; exit 1; }
          echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_SCOPE_GREEN
      - name: Install static stack
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Prove CSS injection contract
        run: |
          python -m py_compile nfl_prop_analytics_page2_responsive_polish_v1.py
          python -m pytest -q tests/test_nfl_prop_analytics_page2_cleanup_step1_v1.py
          echo PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_STATIC_GREEN

  branch-ui-proof:
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Start branch Streamlit
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/cleanup-step1.log 2>&1 &
      - name: Prove CSS source is hidden
        run: |
          python - <<'PY'
          import time, requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="http://127.0.0.1:8501"
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              try:
                  if requests.get(base,timeout=3).status_code<500: break
              except Exception: pass
              time.sleep(.5)
          else: raise RuntimeError("CLEANUP_STEP1_LOCAL_NOT_READY")

          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1: return frame,loc.first
                      except Exception: pass
                  page.wait_for_timeout(250)
              raise RuntimeError("CLEANUP_STEP1_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox"])
              page=browser.new_page(viewport={"width":768,"height":1024})
              page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"}),wait_until="domcontentloaded",timeout=120000)
              frame,marker=find(page,'[data-prop-page2-responsive-polish="v1"]')
              assert marker.get_attribute("data-prop-page2-responsive-targets")=="390,768,1440"
              assert frame.locator('style[data-prop-page2-responsive-polish-css="v1"]').count()==1
              find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]')
              find(page,'[data-prop-page2-tap-player="v1"]')
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height}); page.wait_for_timeout(300)
                  body=frame.locator("body").inner_text()
                  for token in ("@media (max-width:900px)","/* iPad / compact desktop:",".ks-pa-u-list{grid-template-columns:1fr"):
                      assert token not in body, token
                  print(f"PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_BRANCH_{width}_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_BRANCH_CSS_HIDDEN_GREEN")
              browser.close()
          PY

  public-freeze:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
      - name: Prove public CSS leak gone and freeze
        run: |
          python - <<'PY'
          import time
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          def find(page,selector,timeout=180):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:return frame,loc.first
                      except Exception:pass
                  page.wait_for_timeout(250)
              raise RuntimeError("CLEANUP_STEP1_PUBLIC_NOT_READY:"+selector)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"])
              deadline=time.monotonic()+1200
              while True:
                  context=browser.new_context(viewport={"width":768,"height":1024})
                  page=context.new_page()
                  try:
                      page.goto(base+"/?"+urlencode({"ks_jump_sport":"NFL","ks_jump_market":"Prop Analytics","ks_pa_game":"CAR-CLE","ks_pa_page":"matchup"}),wait_until="domcontentloaded",timeout=120000)
                      frame,marker=find(page,'[data-prop-page2-responsive-polish="v1"]',150)
                      body=frame.locator("body").inner_text()
                      if marker.get_attribute("data-prop-page2-responsive-targets")=="390,768,1440" and "@media (max-width:900px)" not in body:
                          break
                  except Exception:
                      pass
                  try: context.close()
                  except Exception: pass
                  if time.monotonic()>deadline: raise RuntimeError("CLEANUP_STEP1_PUBLIC_DEPLOYMENT_NOT_ACTIVE")
                  time.sleep(8)
              assert frame.locator('style[data-prop-page2-responsive-polish-css="v1"]').count()==1
              find(page,'[data-nfl-prop-analytics-page2-unified-roster="v1"]',60)
              find(page,'[data-prop-page2-tap-player="v1"]',60)
              for width,height in ((390,844),(768,1024),(1440,1000)):
                  page.set_viewport_size({"width":width,"height":height});page.wait_for_timeout(300)
                  body=frame.locator("body").inner_text()
                  for token in ("@media (max-width:900px)","/* iPad / compact desktop:",".ks-pa-u-list{grid-template-columns:1fr"):
                      assert token not in body, token
                  print(f"PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_PUBLIC_{width}_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_PUBLIC_CSS_HIDDEN_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_PUBLIC_GREEN")
              print("PROP_ANALYTICS_PAGE2_CLEANUP_STEP1_FROZEN")
              page.close();context.close();browser.close()
          PY
