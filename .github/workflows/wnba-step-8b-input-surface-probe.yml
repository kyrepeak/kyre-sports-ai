name: WNBA Step 8B input surface probe

on:
  push:
    branches:
      - wnba-step8-projection-contract-20260828
    paths:
      - '.github/workflows/wnba-step-8b-input-surface-probe.yml'
      - 'sports_api/tools/wnba_step8b_input_surface_probe.py'
      - 'sports_api/wnba_step8_projection_handoff.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Step 8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert production OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'
          test "$WNBA_STEP8_PROJECTION_HANDOFF_ENABLED" = 'true'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile probe
        run: python -m py_compile sports_api/tools/wnba_step8b_input_surface_probe.py

      - name: Prove frozen Step 7G and certified Step 8A files unchanged
        shell: bash
        run: |
          set -euo pipefail
          STEP8A_CERTIFIED_SHA='82c75e57ec00d7daafa7d688e6f2658df8711176'
          git fetch origin wnba-step8-projection-contract-20260828 --depth=50
          git cat-file -e "$STEP8A_CERTIFIED_SHA^{commit}"
          git diff --exit-code "$STEP8A_CERTIFIED_SHA" -- \
            sports_api/wnba_step8_projection_handoff.py \
            tests/test_wnba_step8_projection_handoff.py \
            sports_api/tools/wnba_step8a_projection_handoff_cert.py \
            sports_api/wnba_step7g_release_freeze.py \
            sports_api/wnba_step7g_first_party_integration.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_model_input_readiness.py

      - name: Probe certified Step 8B model input surface
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step8b_input_surface_probe

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step8b-input-surface-${{ github.run_id }}-${{ github.run_attempt }}
          path: step8b-input-surface-probe.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
