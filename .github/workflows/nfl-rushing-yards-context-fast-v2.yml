name: NFL Rushing Yards Context Fast V2 cert

on:
  pull_request:
    branches: [mlb-step17b-shared-host-cert]
    paths:
      - 'sports_api/collectors/nfl_rushing_yards_context_v2.py'
      - 'sports_api/api/nfl_rushing_yards_context_v2.py'
      - 'sports_api/api/health.py'
      - 'sports_api/tests/test_nfl_rushing_yards_context_v2.py'
      - '.github/workflows/nfl-rushing-yards-context-fast-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-rushing-yards-context-fast-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-fast-context-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production API stack and pytest
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest

      - name: Compile additive V2 files
        run: |
          python -m py_compile sports_api/collectors/nfl_rushing_yards_context_v2.py
          python -m py_compile sports_api/api/nfl_rushing_yards_context_v2.py
          python -m py_compile sports_api/tests/test_nfl_rushing_yards_context_v2.py
          python -m py_compile sports_api/api/health.py

      - name: Prove frozen backend owners were not modified
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(sports_api/collectors/nfl_rushing_yards_context_v1\.py$|sports_api/api/nfl_rushing_yards_context_v1\.py$|sports_api/api/nfl_rushing_yards_market_v1\.py$|sports_api/collectors/nfl_fanduel_rushing_yards_v1\.py$|sports_api/api/nfl_passing_yards_market_v1\.py$|sports_api/collectors/nfl_passing_yards_|sports_api/api/cfb_|sports_api/collectors/cfb_)' || true)"
          if [ -n "$blocked" ]; then
            echo "NFL_RUSHING_CONTEXT_V2_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "NFL_RUSHING_CONTEXT_V2_FROZEN_OWNER_GUARD_GREEN"

      - name: Run frozen V1 plus additive V2 contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            sports_api/tests/test_nfl_rushing_yards_context_v1.py \
            sports_api/tests/test_nfl_rushing_yards_context_v2.py \
            sports_api/tests/test_nfl_rushing_yards_market_v1.py

      - name: Revalidate shared-host startup and observability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_production_observability_backport_v1.py

      - name: Prove V1 V2 and market routes coexist
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from sports_api.api.health import router

          paths = [getattr(route, "path", "") for route in router.routes]
          required = {
              "/api/v1/nfl/rushing-yards",
              "/api/v1/nfl/rushing-yards/status",
              "/api/v1/nfl/rushing-yards/fast",
              "/api/v1/nfl/rushing-yards/fast/status",
              "/api/v1/nfl/rushing-yards/market",
              "/api/v1/nfl/rushing-yards/market/status",
          }
          for path in sorted(required):
              count = paths.count(path)
              assert count == 1, (path, count)
          print("NFL_RUSHING_CONTEXT_V2_SHARED_HOST_GREEN")
          PY
