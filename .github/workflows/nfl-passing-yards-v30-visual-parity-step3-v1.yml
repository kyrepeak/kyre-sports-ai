name: NFL Passing Yards V30 Visual Parity Step 3 V1

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl_passing_yards_hub_v30.py"
      - "streamlit_memory_lazy_router_v123.py"
      - "app.py"
      - "tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py"
      - ".github/workflows/nfl-passing-yards-v30-visual-parity-step3-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-visual-step3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests streamlit

      - name: Enforce exact five-file Passing visual Step 3 diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/nfl-passing-yards-v30-visual-parity-step3-v1.yml
          app.py
          nfl_passing_yards_hub_v30.py
          streamlit_memory_lazy_router_v123.py
          tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Actual Passing visual Step 3 diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Compile Passing visual Step 3 surface
        run: |
          python -m py_compile \
            nfl_passing_yards_hub_v30.py \
            streamlit_memory_lazy_router_v123.py \
            app.py \
            tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py

      - name: Prove frozen Passing and certified sibling owners remain untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          blocked="$(printf '%s\n' "$changed" | grep -E '^(nfl_passing_yards_hub_v([1-9]|1[0-9]|2[0-9])\.py$|nfl_hub_v35\.py$|streamlit_memory_lazy_router_v122\.py$|nfl_receiving_yards_.*\.py$|nfl_rushing_yards_.*\.py$)' || true)"
          if [ -n "$blocked" ]; then
            echo "PASSING_VISUAL_STEP3_FROZEN_OWNER_MODIFICATION_BLOCKED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "PASSING_VISUAL_STEP3_FROZEN_OWNER_GUARD_GREEN"

      - name: Run Passing V30 visual parity Step 3 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v30_visual_parity_step3_v1.py

      - name: Re-run frozen visual Step 2 contracts
        run: python -m pytest -q tests/test_nfl_passing_yards_v29_visual_parity_step2_v1.py

      - name: Re-run frozen V28 exact-ID personnel regression
        run: python -m pytest -q tests/test_nfl_passing_yards_step5_personnel_v2.py

      - name: Prove V30 remains display-only and market blind
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import nfl_passing_yards_hub_v30 as page
          assert page.DISPLAY_ONLY is True
          assert page.FROZEN_PRIOR == 'nfl_passing_yards_hub_v29'
          assert page.FROZEN_PASSING_ENGINE == 'nfl_passing_yards_hub_v28'
          assert page.VISUAL_BUILD_STEP == 3
          assert page.VISUAL_BUILD_TOTAL == 6
          assert page.SPORTSBOOK_PROJECTION_INFLUENCE == 0.0
          source = inspect.getsource(page._profile_card_v30)
          for forbidden in ('projection_yards', 'fair_odds', 'no_vig', 'expected_value', 'stake_size', 'projection_adjustment'):
              assert forbidden not in source, forbidden
          print('NFL_PASSING_YARDS_V30_VISUAL_ONLY_GREEN')
          PY

  browser-visual-step3:
    needs: certify-visual-step3
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: browser-python
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-stack-cache
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build browser stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate browser stack
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Start clean branch-local Streamlit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/passing-visual-step3
          nohup python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8513 \
            > artifacts/passing-visual-step3/streamlit.log 2>&1 &
          echo $! > /tmp/passing_visual_step3_pid

      - name: Drive real Passing Yards visual Step 3 UI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import (
              _wait_for_health,
              _find_app_frame,
              _wait_for_text,
              _body_has_forbidden_error,
              _choose,
              BrowserQAFailure,
          )

          base='http://127.0.0.1:8513'
          artifacts=Path('artifacts/passing-visual-step3')
          _wait_for_health(base)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1800})
              try:
                  page.goto(base,wait_until='domcontentloaded',timeout=120000)
                  frame,_=_find_app_frame(page)
                  _choose(page,frame,0,'NFL')
                  nfl_market_combo=frame.get_by_role('combobox',name='🎯 NFL Market',exact=True)
                  nfl_market_combo.wait_for(state='visible',timeout=30000)
                  _choose(page,frame,1,'Passing Yards')
                  body=_wait_for_text(frame,'VISUAL STEP 3 / 6',180.0)
                  forbidden=_body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f'Passing visual Step 3 runtime error marker: {forbidden}')
                  for required in ('Passing Yards', 'Visual Parity Build', 'VISUAL STEP 3 / 6', 'V29 + V28 FROZEN', 'SPORTSBOOK 0%'):
                      if required not in body:
                          raise BrowserQAFailure(f'missing Passing visual Step 3 marker: {required}')

                  deadline=time.time()+60
                  while frame.locator('.kpass30-profile').count() < 1 and time.time() < deadline:
                      time.sleep(2)

                  profile_count=frame.locator('.kpass30-profile').count()
                  hero_stat_count=frame.locator('.kpass30-herostat').count()
                  summary_count=frame.locator('.kpy-stat').count()
                  if profile_count != 2:
                      raise BrowserQAFailure(f'expected 2 QB profile cards, got {profile_count}')
                  if hero_stat_count < 6:
                      raise BrowserQAFailure(f'expected at least 6 QB profile hero stats, got {hero_stat_count}')
                  if summary_count != 5:
                      raise BrowserQAFailure(f'expected 5 slate summary cells, got {summary_count}')
                  profile_text=' '.join(frame.locator('.kpass30-profile').all_inner_texts()).lower()
                  for required in ('pass yards / game', 'attempts / game', 'yards / attempt', 'recent form + location splits', 'profile math unchanged', 'sportsbook projection influence 0.0%'):
                      if required not in profile_text:
                          raise BrowserQAFailure(f'profile cards missing marker: {required}')

                  result={
                      'status':'GREEN',
                      'visual_step':'3/6',
                      'profile_cards':profile_count,
                      'profile_hero_stats':hero_stat_count,
                      'summary_cells':summary_count,
                      'sportsbook_projection_influence':0.0,
                      'profile_math_changed':False,
                  }
                  (artifacts/'passing_visual_step3_metrics.json').write_text(json.dumps(result,indent=2))
                  page.screenshot(path=str(artifacts/'passing_visual_step3.png'),full_page=True)
                  print('NFL_PASSING_YARDS_V30_BROWSER_VISUAL_STEP3_GREEN')
                  print(json.dumps(result,indent=2))
              finally:
                  browser.close()
          PY

      - name: Print Streamlit log
        if: always()
        run: tail -n 500 artifacts/passing-visual-step3/streamlit.log || true

      - name: Upload Passing visual Step 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-passing-visual-step3-${{ github.run_id }}
          path: artifacts/passing-visual-step3
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Streamlit
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/passing_visual_step3_pid ]; then
            kill "$(cat /tmp/passing_visual_step3_pid)" 2>/dev/null || true
          fi
