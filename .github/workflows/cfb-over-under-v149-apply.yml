name: Apply CFB O/U V149 visual patch once

on:
  push:
    branches: [v149-cfb-over-under-visual-correction]
    paths: [.github/workflows/cfb-over-under-v149-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v149-cfb-over-under-visual-correction
          fetch-depth: 0

      - name: Apply surgical V149 renderer patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cfb_over_under_clean_page_v17.py")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'MODEL_VERSION = "CFB O/U CLEAN PAGE V17.3 • STEP 3 FAVORABLE / TOUGH VERDICTS"\nMARKET = "Over/Under"\n_ET = ZoneInfo("America/New_York")',
              'MODEL_VERSION = "CFB O/U CLEAN PAGE V149 • COMPACT VISUAL CORRECTION"\nMARKET = "Over/Under"\n_ET = ZoneInfo("America/New_York")\n_PHX = ZoneInfo("America/Phoenix")',
              "version/timezone pin",
          )

          replace_once(
              '.c17-note{padding:8px 10px;color:#6f8793;font-size:.34rem;line-height:1.45;border-top:1px solid rgba(126,175,205,.08)}\n.c17-final',
              '''.c17-note{padding:8px 10px;color:#6f8793;font-size:.34rem;line-height:1.45;border-top:1px solid rgba(126,175,205,.08)}
.v149-quick{border:1px solid rgba(168,85,247,.28);border-radius:16px;background:linear-gradient(145deg,#100c19,#07151d 72%);padding:12px;margin:10px 0}
.v149-kicker{color:#c9a8ff;font-size:.42rem;font-weight:950;letter-spacing:.09em}.v149-pick{font-size:1.22rem;color:#f7f3ff;font-weight:950;margin:3px 0 8px}
.v149-quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.v149-q{border:1px solid rgba(180,200,215,.10);border-radius:10px;background:#09131b;padding:8px}
.v149-q small{display:block;color:#738b98;font-size:.27rem;font-weight:900;text-transform:uppercase}.v149-q strong{display:block;color:#e7f5fb;font-size:.58rem;margin-top:3px}
.v149-zero{margin-top:8px;color:#b892ff;font-size:.32rem;font-weight:950;letter-spacing:.04em}
.v149-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:8px 0 10px}.v149-chip{border:1px solid rgba(140,165,180,.15);border-radius:10px;background:#09141b;padding:7px 6px;min-width:0}
.v149-chip small{display:block;color:#778d98;font-size:.24rem;font-weight:950}.v149-chip strong{display:block;color:#dce9ef;font-size:.30rem;line-height:1.2;margin:2px 0 4px}.v149-chip span{font-size:.27rem;font-weight:950}
.v149-chip.ready{border-color:rgba(72,205,135,.30)}.v149-chip.ready span{color:#77dda8}.v149-chip.limited{border-color:rgba(241,199,111,.32)}.v149-chip.limited span{color:#f1c76f}.v149-chip.gated{border-color:rgba(255,110,110,.30)}.v149-chip.gated span{color:#ff8f8f}.v149-chip.check span{color:#9fb3bd}
.c17-final''',
              "V149 CSS",
          )

          pct_marker = '''def _pct(value: Any) -> str:
    try:
        return f"{100.0 * float(value):.1f}%"
    except Exception:
        return "—"

'''
          phoenix_helper = pct_marker + '''
def _phoenix_kickoff(game: Mapping[str, Any]) -> str:
    """Present the existing Eastern kickoff in Arizona time; model inputs stay untouched."""
    kickoff = _clean(game.get("kickoff_et"))
    day = _clean(game.get("game_date"))
    if not kickoff or not day:
        return kickoff or "TBD"
    clock = kickoff.upper().replace("EDT", "").replace("EST", "").replace("ET", "").strip()
    parsed = None
    for fmt in ("%Y-%m-%d %I:%M %p", "%Y-%m-%d %I %p"):
        try:
            parsed = datetime.strptime(f"{day} {clock}", fmt).replace(tzinfo=_ET)
            break
        except ValueError:
            continue
    if parsed is None:
        return kickoff
    local = parsed.astimezone(_PHX)
    hour = local.hour % 12 or 12
    ampm = "AM" if local.hour < 12 else "PM"
    return f"{hour}:{local.minute:02d} {ampm} {local.tzname() or 'MST'}"

'''
          replace_once(pct_marker, phoenix_helper, "Phoenix kickoff helper")

          replace_once(
              '<div><small>Kickoff</small><strong>{escape(_clean(game.get("kickoff_et")) or "TBD")}</strong></div>',
              '<div><small>Kickoff • Phoenix</small><strong>{escape(_phoenix_kickoff(game))}</strong></div>',
              "hero Phoenix kickoff",
          )

          helpers = '''
def _quick_read(result: Mapping[str, Any]) -> str:
    raw = result.get("raw") or {}
    final = result.get("final") or {}
    selection = _clean(final.get("selection") or final.get("pick") or raw.get("model_lean")) or "PASS"
    probability = final.get("selection_probability")
    if probability is None:
        probability = raw.get("under_probability") if selection.upper() == "UNDER" else raw.get("over_probability")
    projected = raw.get("projected_total")
    line = result.get("analysis_line")
    try:
        edge_text = f"{float(projected) - float(line):+.1f}"
    except Exception:
        edge_text = "—"
    return f'''\
<div class="v149-quick">
 <div class="v149-kicker">⚡ QUICK READ</div>
 <div class="v149-pick">{escape(selection)}</div>
 <div class="v149-quickgrid">
  <div class="v149-q"><small>Monster projection</small><strong>{_num(projected,1)}</strong></div>
  <div class="v149-q"><small>Analysis line</small><strong>{_num(line,1)}</strong></div>
  <div class="v149-q"><small>Model edge</small><strong>{escape(edge_text)}</strong></div>
  <div class="v149-q"><small>Confidence</small><strong>{_pct(probability)}</strong></div>
 </div>
 <div class="v149-zero">0.0% SPORTSBOOK PROJECTION INFLUENCE • MARKET LINE IS THRESHOLD/CONTEXT ONLY</div>
</div>'''


def _status_strip(result: Mapping[str, Any]) -> str:
    specs = (
        (5, "EXPLOSIVE", "explosive_engine"),
        (6, "RED ZONE", "red_zone_engine"),
        (7, "THIRD DOWN", "third_down_engine"),
        (8, "TURNOVERS", "turnover_engine"),
        (9, "ENVIRONMENT", "environment_engine"),
        (10, "HISTORY", "history_engine"),
    )
    chips = []
    for step, title, key in specs:
        status = _engine_ready(result.get(key) or {})
        chips.append(
            f'<div class="v149-chip {escape(status.lower())}">'
            f'<small>STEP {step}</small><strong>{escape(title)}</strong><span>{escape(status)}</span></div>'
        )
    return '<div class="v149-strip">' + ''.join(chips) + '</div>'

'''
          marker = '\ndef _line_board(games: list[Mapping[str, Any]], selected_identity: str, selected_line: float) -> list[dict[str, Any]]:\n'
          if marker not in text:
              raise SystemExit("line-board insertion marker missing")
          text = text.replace(marker, helpers + marker, 1)

          replace_once(
              '"Kickoff ET": game.get("kickoff_et"),',
              '"Phoenix kickoff": _phoenix_kickoff(game),',
              "full-slate Phoenix column",
          )
          replace_once(
              'f"• {games[int(i)].get(\'kickoff_et\') or \'TBD\'}"',
              'f"• {_phoenix_kickoff(games[int(i)])}"',
              "matchup selector Phoenix time",
          )

          replace_once(
              '    st.markdown(_step1(game, away, home), unsafe_allow_html=True)\n    st.markdown(_step2(away, home), unsafe_allow_html=True)\n',
              '    st.markdown(_step1(game, away, home), unsafe_allow_html=True)\n    st.markdown(_quick_read(result), unsafe_allow_html=True)\n    st.markdown(_status_strip(result), unsafe_allow_html=True)\n',
              "hero/quick-read render",
          )

          start_marker = '    st.markdown(\n        _step3_readable('
          end_marker = '    st.markdown(_cert_step(result), unsafe_allow_html=True)\n'
          start = text.find(start_marker)
          end_start = text.find(end_marker, start)
          if start < 0 or end_start < 0:
              raise SystemExit("deep-evidence render block markers missing")
          end = end_start + len(end_marker)
          deep_block = '''    with st.expander("Deep evidence • Steps 2–12", expanded=False):
        st.markdown(_step2(away, home), unsafe_allow_html=True)
        st.markdown(
            _step3_readable(
                readable_matchup,
                result.get("matchup_engine") or {},
            ),
            unsafe_allow_html=True,
        )
        st.markdown(_model_step(4, "PACE / EXPECTED POSSESSIONS", result.get("pace_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(5, "EXPLOSIVE PLAY PROFILE", result.get("explosive_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(6, "RED ZONE", result.get("red_zone_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(7, "THIRD DOWN", result.get("third_down_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(8, "TURNOVER VOLATILITY", result.get("turnover_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(9, "GAME-DAY ENVIRONMENT", result.get("environment_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(10, "HISTORICAL MATCHUP CONTEXT", result.get("history_engine") or {}), unsafe_allow_html=True)
        st.markdown(_model_step(11, "CURRENT FORM + SCHEDULE STRENGTH", result.get("form_strength_engine") or {}), unsafe_allow_html=True)
        st.markdown(_cert_step(result), unsafe_allow_html=True)
'''
          text = text[:start] + deep_block + text[end:]

          replace_once(
              ' .c17-grid2,.c17-s3-grid{grid-template-columns:1fr}.c17-metrics,.c17-ranks,.c17-step-grid{grid-template-columns:repeat(2,minmax(0,1fr))}',
              ' .c17-grid2,.c17-s3-grid{grid-template-columns:1fr}.c17-metrics,.c17-ranks,.c17-step-grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n .v149-quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.v149-strip{grid-template-columns:repeat(3,minmax(0,1fr))}',
              "mobile V149 layout",
          )

          path.write_text(text)
          print("CFB_OU_V149_PATCH_APPLIED")
          PY

      - name: Compile patched renderer
        run: python -m py_compile cfb_over_under_clean_page_v17.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb_over_under_clean_page_v17.py
          git diff --cached --check
          git commit -m "feat(cfb-ou): implement V149 compact visual correction"
          git push origin HEAD:v149-cfb-over-under-visual-correction
