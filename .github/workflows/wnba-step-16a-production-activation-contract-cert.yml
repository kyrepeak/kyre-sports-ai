name: WNBA Step 16A production activation readiness certification

on:
  push:
    branches:
      - wnba-step16a-production-activation-contract-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: "false"
  WNBA_BOARD_SCHEDULER_ENABLED: "false"
  WNBA_KYRE_DIRECT_SYNC_ENABLED: "false"
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: "false"
  WNBA_STEP6J_CANARY_ENABLED: "false"
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: "false"
  WNBA_PERSISTENCE_ENABLED: "false"
  WNBA_SUPABASE_WRITE_ENABLED: "false"
  WNBA_WAGERING_ENABLED: "false"
  WNBA_PUBLIC_STEP11E_FASTAPI_ENABLED: "false"
  WNBA_STEP12_SCHEDULER_ENABLED: "false"
  WNBA_STEP9_FASTAPI_ENABLED: "true"
  WNBA_STEP9_THRESHOLD_PRICING_ENABLED: "true"
  WNBA_STEP9B_MARKET_COMPARISON_ENABLED: "true"
  WNBA_STEP9C_MULTIBOOK_CONSENSUS_ENABLED: "true"
  WNBA_STEP9D_QUALIFICATION_RANKING_ENABLED: "true"

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Step 16A branch with frozen history
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: Assert production runtime remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certification dependencies
        run: |
          python -m pip install -r sports_api/requirements.txt
          python -m pip install -r sports_api/requirements-persistence.txt

      - name: Compile Step 16A readiness surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sports_api/wnba_step16a_production_activation_contract.py
          python -m py_compile tests/test_wnba_step16a_production_activation_contract.py
          python -m py_compile sports_api/tools/wnba_step16a_production_activation_contract_cert.py
          python -m json.tool sports_api/certification/wnba_step16a_production_activation_readiness_evidence.json >/dev/null

      - name: Run Step 16A production activation readiness guards
        run: PYTHONPATH=. python tests/test_wnba_step16a_production_activation_contract.py

      - name: Run frozen Step 15C through Step 15A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step15_live_persistence_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step15b_live_adapter_transaction_smoke.py
          PYTHONPATH=. python tests/test_wnba_step15a_live_postgres_preflight.py

      - name: Run frozen Step 14D through Step 14A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step14_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step14c_durable_restart_lease.py
          PYTHONPATH=. python tests/test_wnba_step14b_database_checkpoint_adapter.py
          PYTHONPATH=. python tests/test_wnba_step14a_persistence_contract.py

      - name: Run frozen Step 13D through Step 13A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step13_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step13c_reliability_recovery.py
          PYTHONPATH=. python tests/test_wnba_step13b_runtime_supervisor.py
          PYTHONPATH=. python tests/test_wnba_step13a_bounded_scheduler.py

      - name: Run frozen Step 12D through Step 12A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step12_release_freeze.py
          PYTHONPATH=. python tests/test_wnba_step12c_live_board_runtime.py
          PYTHONPATH=. python tests/test_wnba_step12b_live_runtime_assembly.py
          PYTHONPATH=. python tests/test_wnba_step12_shadow_runner.py

      - name: Run frozen Step 11E through Step 11A guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step11_controlled_automation.py
          PYTHONPATH=. python tests/test_wnba_step11_multibook_shadow_board.py
          PYTHONPATH=. python tests/test_wnba_step11_fanduel_provider.py
          PYTHONPATH=. python tests/test_wnba_step11_network_refresh_orchestrator.py
          PYTHONPATH=. python tests/test_wnba_step11_draftkings_provider.py

      - name: Run frozen Step 10 guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step10_live_market_board.py
          PYTHONPATH=. python tests/test_wnba_step10_refresh_controller.py
          PYTHONPATH=. python tests/test_wnba_step10_market_snapshot.py
          PYTHONPATH=. python tests/test_wnba_step10_market_adapters.py
          PYTHONPATH=. python tests/test_wnba_step10_live_market_input.py

      - name: Run frozen Step 9 through Step 8 regression guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_wnba_step9_fastapi_integration.py
          PYTHONPATH=. python tests/test_wnba_step9_qualification_ranking.py
          PYTHONPATH=. python tests/test_wnba_step9_multisportsbook_consensus.py
          PYTHONPATH=. python tests/test_wnba_step9_sportsbook_market_comparison.py
          PYTHONPATH=. python tests/test_wnba_step9_threshold_pricing.py
          PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py
          PYTHONPATH=. python tests/test_wnba_step8_fastapi_integration.py

      - name: Prove frozen Step 15C head is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          STEP15C_FROZEN_SHA='5e24210d7aef90143ba016e368cd49d3ee1a7f19'
          git merge-base --is-ancestor "$STEP15C_FROZEN_SHA" HEAD
          test "$(git rev-list --count "$STEP15C_FROZEN_SHA"..HEAD)" -ge 1

      - name: Prove only Step 16A files changed after frozen Step 15C
        shell: bash
        run: |
          set -euo pipefail
          STEP15C_FROZEN_SHA='5e24210d7aef90143ba016e368cd49d3ee1a7f19'
          git diff --name-only "$STEP15C_FROZEN_SHA" HEAD | while IFS= read -r path; do
            case "$path" in
              sports_api/wnba_step16a_production_activation_contract.py|\
              sports_api/certification/wnba_step16a_production_activation_readiness_evidence.json|\
              tests/test_wnba_step16a_production_activation_contract.py|\
              sports_api/tools/wnba_step16a_production_activation_contract_cert.py|\
              .github/workflows/wnba-step-16a-production-activation-contract-cert.yml)
                ;;
              *)
                echo "Unexpected post-Step15C file drift: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Prove inspected deployment files remain frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:sports_api/Dockerfile)" = 'e06eed5c3b9d65c238e47b3fd2fde1529a785fdf'
          test "$(git rev-parse HEAD:sports_api/README.md)" = '4f93bb2c1890a1c65ff7b6c7cc21bb857a39f5b5'
          test "$(git rev-parse HEAD:sports_api/main.py)" = '3735590ad639126ea768103ef234604691362be3'
          test "$(git rev-parse HEAD:sports_api/production.env.example)" = '6962aa11e75906691869d2ed04d2bf50822821c8'
          test "$(git rev-parse HEAD:sports_api/requirements.txt)" = '84e666d78549778a84f216e80d2bb979c1f6160a'
          test "$(git rev-parse HEAD:sports_api/requirements-persistence.txt)" = '46331822d0a55f5a4983d289c73a45ea9745ca89'

      - name: Verify Step 16A blocker contract and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          export WNBA_STEP16A_PRODUCTION_ACTIVATION_CONTRACT_ENABLED=true
          PYTHONPATH=. python - <<'PY'
          import os
          from sports_api import wnba_step16a_production_activation_contract as s16a
          manifest = s16a.build_step16a_production_activation_contract(
              env=dict(os.environ),
              generated_at_utc='2026-08-28T19:50:00+00:00',
          )
          assert s16a.STEP15C_CERTIFIED_SHA == '5e24210d7aef90143ba016e368cd49d3ee1a7f19'
          assert manifest['readiness']['production_activation_ready'] is False
          assert len(manifest['readiness']['blocking_requirements']) == 3
          assert manifest['activation_contract']['step16a_is_contract_only'] is True
          assert manifest['activation_contract']['production_canary_allowed'] is False
          assert manifest['activation_contract']['production_runtime_enabled'] is False
          assert manifest['activation_contract']['scheduler_started'] is False
          assert manifest['required_before_any_future_production_canary']['install_psycopg_in_production_image'] is True
          assert manifest['required_before_any_future_production_canary']['supply_kyre_database_url_via_deployment_secret_manager'] is True
          assert all(value is False for value in manifest['safety_contract'].values())
          assert manifest['phase_boundary']['step16a_complete'] is True
          print('STEP16A_PRODUCTION_ACTIVATION_READINESS_CONTRACT_OK')
          PY

      - name: Certify Step 16A production activation readiness contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m sports_api.tools.wnba_step16a_production_activation_contract_cert

      - name: Upload Step 16A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step16a-production-activation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: step16a-production-activation-contract-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert production runtime remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_PERSISTENCE_ENABLED" = 'false'
          test "$WNBA_SUPABASE_WRITE_ENABLED" = 'false'
          test "$WNBA_WAGERING_ENABLED" = 'false'
          test "$WNBA_STEP12_SCHEDULER_ENABLED" = 'false'
