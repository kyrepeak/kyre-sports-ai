name: WNBA PRA Speed V3 Step 7 Precompute

on:
  pull_request:
    paths:
      - "wnba_pra_speed_v3_step7_precompute.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step7.py"
      - "app.py"
      - "tests/test_wnba_pra_speed_v3_step7.py"
      - "devsystem/wnba_pra_speed_v3_step7_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step7-precompute.json"
      - ".github/workflows/wnba-pra-speed-v3-step7-precompute.yml"
      - ".github/workflows/devsystem-targeted-ci.yml"
  push:
    branches: [main]
    paths:
      - "wnba_pra_speed_v3_step7_precompute.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step7.py"
      - "app.py"
      - "tests/test_wnba_pra_speed_v3_step7.py"
      - "devsystem/wnba_pra_speed_v3_step7_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step7-precompute.json"
      - ".github/workflows/wnba-pra-speed-v3-step7-precompute.yml"
      - ".github/workflows/devsystem-targeted-ci.yml"

permissions:
  contents: read

concurrency:
  group: wnba-pra-speed-v3-step7-precompute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: pip install -q pytest requests fastapi streamlit httpx pandas pypdf
      - name: Enforce exact Step-7 scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected-initial.txt <<'EOF'
          .github/workflows/devsystem-targeted-ci.yml
          .github/workflows/wnba-pra-speed-v3-step7-precompute.yml
          app.py
          devsystem/task_ledgers/wnba-pra-speed-v3-step7-precompute.json
          devsystem/wnba_pra_speed_v3_step7_public_profile.py
          streamlit_memory_lazy_router_wnba_pra_speed_v3_step7.py
          tests/test_wnba_pra_speed_v3_step7.py
          wnba_pra_speed_v3_step7_precompute.py
          EOF
          cat > /tmp/expected-timing-repair.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step7-precompute.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step7-precompute.json
          devsystem/wnba_pra_speed_v3_step7_public_profile.py
          EOF
          cat > /tmp/expected-reliability-repair.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step7-precompute.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step7-precompute.json
          tests/test_wnba_pra_speed_v3_step7.py
          wnba_pra_speed_v3_step7_precompute.py
          EOF
          sort -o /tmp/expected-initial.txt /tmp/expected-initial.txt
          sort -o /tmp/expected-timing-repair.txt /tmp/expected-timing-repair.txt
          sort -o /tmp/expected-reliability-repair.txt /tmp/expected-reliability-repair.txt
          if diff -q /tmp/expected-initial.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP7_INITIAL_SCOPE_GREEN"
          elif diff -q /tmp/expected-timing-repair.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP7_TIMING_REPAIR_SCOPE_GREEN"
          elif diff -q /tmp/expected-reliability-repair.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP7_ACTIVE_PRA_SCOPE_REPAIR_GREEN"
          else
            echo "Unexpected Step-7 scope:"
            cat /tmp/actual.txt
            exit 1
          fi
      - name: Run Step-7 focused contract
        run: python -m pytest -q tests/test_wnba_pra_speed_v3_step7.py
      - name: Certify branch
        run: |
          echo "WNBA_PRA_SPEED_V3_STEP7_SCOPE_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP7_BACKGROUND_PRECOMPUTE_CONTRACT_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP7_FROZEN_STEPS1_6_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP7_BRANCH_GREEN"

  public-profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser proof dependencies
        run: |
          pip install playwright requests streamlit
          python -m playwright install --with-deps chromium
      - name: Prove Step 7 active-player precompute
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python devsystem/wnba_pra_speed_v3_step7_public_profile.py \
            --production-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/wnba-pra-speed-v3-step7-first \
            2>&1 | tee /tmp/step7-first.log
          first_rc=${PIPESTATUS[0]}
          set -e

          if [ "$first_rc" -eq 0 ]; then
            echo "WNBA_PRA_SPEED_V3_STEP7_FIRST_PROOF_GREEN"
            exit 0
          fi

          if grep -q "WNBA_PRA_SPEED_V3_STEP7_BUNDLE_CACHE_HIT_OBSERVED_GREEN" /tmp/step7-first.log \
            && grep -q "Step-7 precomputed Player open exceeded target:" /tmp/step7-first.log; then
            echo "WNBA_PRA_SPEED_V3_STEP7_TRANSIENT_PLAYER_TIMING_RETRY"
            sleep 1
            python devsystem/wnba_pra_speed_v3_step7_public_profile.py \
              --production-url https://pickvault.streamlit.app \
              --artifact-dir artifacts/wnba-pra-speed-v3-step7
            echo "WNBA_PRA_SPEED_V3_STEP7_TRANSIENT_PLAYER_TIMING_RECOVERED_GREEN"
          else
            echo "Step-7 first proof failed for a non-timing reason; retry forbidden."
            exit "$first_rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wnba-pra-speed-v3-step7-profile
          path: artifacts/wnba-pra-speed-v3-step7
          if-no-files-found: ignore
