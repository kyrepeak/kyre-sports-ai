name: WNBA PRA Speed V3 Step 2 Pooled HTTP

on:
  pull_request:
    paths:
      - "wnba_api_client_v1.py"
      - "wnba_pra_speed_v3_step2_transport.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py"
      - "devsystem/wnba_pra_speed_v3_step2_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step2-pooled-http.json"
      - "tests/test_wnba_pra_speed_v3_step2.py"
      - "tests/test_wnba_step7f_streamlit_api.py"
      - ".github/workflows/wnba-pra-speed-v3-step2-pooled-http.yml"
      - "requirements.txt"
      - "app.py"
  push:
    branches: [main]
    paths:
      - "wnba_api_client_v1.py"
      - "wnba_pra_speed_v3_step2_transport.py"
      - "streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py"
      - "devsystem/wnba_pra_speed_v3_step2_public_profile.py"
      - "devsystem/task_ledgers/wnba-pra-speed-v3-step2-pooled-http.json"
      - "tests/test_wnba_pra_speed_v3_step2.py"
      - ".github/workflows/wnba-pra-speed-v3-step2-pooled-http.yml"
      - "requirements.txt"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: pip install pytest requests pandas

      - name: Run Step 2 pooled-transport contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_wnba_pra_speed_v3_step2.py
          pytest -q tests/test_wnba_step7f_streamlit_api.py

      - name: Enforce Step 2 final scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step2-pooled-http.yml
          app.py
          devsystem/task_ledgers/wnba-pra-speed-v3-step2-pooled-http.json
          devsystem/wnba_pra_speed_v3_step2_public_profile.py
          streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py
          tests/test_wnba_pra_speed_v3_step2.py
          tests/test_wnba_step7f_streamlit_api.py
          wnba_api_client_v1.py
          wnba_pra_speed_v3_step2_transport.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt

          cat > /tmp/deploy_closeout.txt <<'EOF'
          .github/workflows/wnba-pra-speed-v3-step2-pooled-http.yml
          devsystem/task_ledgers/wnba-pra-speed-v3-step2-pooled-http.json
          devsystem/wnba_pra_speed_v3_step2_public_profile.py
          requirements.txt
          tests/test_wnba_pra_speed_v3_step2.py
          EOF
          sort -o /tmp/deploy_closeout.txt /tmp/deploy_closeout.txt

          if diff -q /tmp/expected.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP2_SCOPE_GREEN"
          elif diff -q /tmp/deploy_closeout.txt /tmp/actual.txt >/dev/null; then
            echo "WNBA_PRA_SPEED_V3_STEP2_FULL_REDEPLOY_SCOPE_GREEN"
          else
            echo "WNBA_PRA_SPEED_V3_STEP2_SCOPE_RED"
            diff -u /tmp/deploy_closeout.txt /tmp/actual.txt || true
            exit 1
          fi

      - name: Protect frozen WNBA Navigation V2 Steps 1-7 and Speed V3 Step 1
        shell: bash
        run: |
          set -euo pipefail
          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "STEP2_FROZEN_BLOB_CHANGED:$1:$actual:$2"; exit 1; }
          }
          check_blob wnba_pra_navigation_v2_step1.py 2ff0c0c7f4b5973755f4a53b9ef110a3eafd7cb9
          check_blob wnba_pra_slate_v2_step2.py 4636cb4314489e3458b70cb3c17c6a6af4c5ea3d
          check_blob wnba_pra_game_center_v2_step3.py a181c8949991bb139521f7d379046f34147e5306
          check_blob wnba_pra_player_intelligence_v2_step4.py 393c29711962bf1d42b8fc58322938c92e23000a
          check_blob wnba_pra_performance_v2_step5.py 48f0ee6352c56de4a7d224aa05a6c5f584456086
          check_blob wnba_pra_responsive_v2_step6.py fa42253c48c4df793b4ee0d307e3b843c410cf03
          check_blob wnba_pra_final_v2_step7.py f0e2e6135712cfe10c54b3a90070fd595607fd90
          check_blob streamlit_memory_lazy_router_wnba_nav_v2_step7.py 53bc4026f9e8bb5161762af6d9051bc3a105dfd6
          echo "WNBA_PRA_SPEED_V3_STEP2_NAV_STEPS1_7_FROZEN_GREEN"
          test -f wnba_pra_speed_v3_step1_profiler.py
          test -f streamlit_memory_lazy_router_wnba_pra_speed_v3_step1.py
          echo "WNBA_PRA_SPEED_V3_STEP2_STEP1_FROZEN_GREEN"

      - name: Compile Step 2 surfaces
        run: |
          python -m py_compile \
            wnba_api_client_v1.py \
            wnba_pra_speed_v3_step2_transport.py \
            streamlit_memory_lazy_router_wnba_pra_speed_v3_step2.py \
            devsystem/wnba_pra_speed_v3_step2_public_profile.py

      - name: Certify transport-only contract
        run: |
          grep -F 'HTTP_POOL_CONNECTIONS = 8' wnba_api_client_v1.py
          grep -F 'HTTP_POOL_MAXSIZE = 16' wnba_api_client_v1.py
          grep -F '_HTTP_SESSION.get(' wnba_api_client_v1.py
          grep -F '"network_reads_added": 0' wnba_pra_speed_v3_step2_transport.py
          grep -F '"projection_math_changed": False' wnba_pra_speed_v3_step2_transport.py
          echo "WNBA_PRA_SPEED_V3_STEP2_POOLED_TRANSPORT_GREEN"
          echo "WNBA_PRA_SPEED_V3_STEP2_BRANCH_GREEN"

  public-profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: focused-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser proof dependencies
        run: |
          pip install playwright requests streamlit
          python -m playwright install --with-deps chromium
      - name: Profile real PickVault pooled transport
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python devsystem/wnba_pra_speed_v3_step2_public_profile.py \
            --production-url https://pickvault.streamlit.app \
            --artifact-dir artifacts/wnba-pra-speed-v3-step2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wnba-pra-speed-v3-step2-profile
          path: artifacts/wnba-pra-speed-v3-step2
          if-no-files-found: ignore
