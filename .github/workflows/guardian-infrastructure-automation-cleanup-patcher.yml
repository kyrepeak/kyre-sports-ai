name: GUARDIAN infrastructure automation cleanup patcher

on:
  push:
    branches:
      - guardian-infrastructure-automation-cleanup-v1
    paths:
      - '.github/workflows/guardian-infrastructure-automation-cleanup-patcher.yml'

permissions:
  contents: write

concurrency:
  group: guardian-infrastructure-automation-cleanup-v1
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact authoritative branch head
        uses: actions/checkout@v4
        with:
          ref: guardian-infrastructure-automation-cleanup-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact Guardian cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          retired = {
              '.github/workflows/mlb-step18b-production-observability-cert.yml': "  workflow_dispatch:\n  schedule:\n    - cron: '17 * * * *'\n",
              '.github/workflows/mlb-step6b-production-canary-monitor.yml': "  workflow_dispatch:\n  schedule:\n    - cron: '17 * * * *'\n",
              '.github/workflows/mlb-step6d-controlled-25-production-cert.yml': "  workflow_dispatch:\n  schedule:\n    - cron: '37 * * * *'\n",
              '.github/workflows/mlb-step6e-25pct-stability-window.yml': "  workflow_dispatch:\n  schedule:\n    - cron: '53 * * * *'\n",
          }
          for name, block in retired.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if text.count(block) != 1:
                  raise SystemExit(f'GUARDIAN_PATCH_PATTERN_DRIFT:{name}:{text.count(block)}')
              p.write_text(text.replace(block, '', 1), encoding='utf-8')

          app = Path('vercel_finalizer/app.py')
          text = app.read_text(encoding='utf-8')
          old = '        "status": "ok",\n'
          new = '        "status": "ok" if configured else "degraded",\n'
          if text.count(old) != 1:
              raise SystemExit(f'GUARDIAN_FINALIZER_STATUS_PATTERN_DRIFT:{text.count(old)}')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_guardian_infrastructure_automation_cleanup_v1.py')
          text = test.read_text(encoding='utf-8')
          anchor = '        assert "\\n  schedule:" not in text\n'
          addition = anchor + '        assert "\\n  workflow_dispatch:" not in text\n'
          if '        assert "\\n  workflow_dispatch:" not in text\n' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'GUARDIAN_TEST_ANCHOR_DRIFT:{text.count(anchor)}')
              text = text.replace(anchor, addition, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Prove cleanup contracts green
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest -r vercel_finalizer/requirements.txt
          python -m pytest -q tests/test_guardian_infrastructure_automation_cleanup_v1.py
          PYTHONPATH=vercel_finalizer python -m pytest -q vercel_finalizer/test_health_truthfulness.py vercel_finalizer/test_app.py
          git diff --check

      - name: Prove exact scope and self-clean patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          retired = [
              '.github/workflows/mlb-step18b-production-observability-cert.yml',
              '.github/workflows/mlb-step6b-production-canary-monitor.yml',
              '.github/workflows/mlb-step6d-controlled-25-production-cert.yml',
              '.github/workflows/mlb-step6e-25pct-stability-window.yml',
          ]
          for name in retired:
              text = Path(name).read_text(encoding='utf-8')
              assert '\n  schedule:' not in text, name
              assert '\n  workflow_dispatch:' not in text, name
              assert 'kyre-sports-api.onrender.com' in text, name
          for name in [
              '.github/workflows/cfb-market-identity-snapshot-v1.yml',
              '.github/workflows/cfb-runtime-snapshot-refresh-v2.yml',
              '.github/workflows/cfb-runtime-snapshot-refresh.yml',
          ]:
              assert '\n  schedule:' in Path(name).read_text(encoding='utf-8'), name
          assert '"status": "ok" if configured else "degraded"' in Path('vercel_finalizer/app.py').read_text(encoding='utf-8')
          print('GUARDIAN_INFRASTRUCTURE_AUTOMATION_CLEANUP_GREEN')
          PY

      - name: Commit verified patch and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/guardian-infrastructure-automation-cleanup-patcher.yml
          git config user.name 'kyrepeak'
          git config user.email 'kyrewhite15@gmail.com'
          git config commit.gpgsign false
          git add \
            .github/workflows/mlb-step18b-production-observability-cert.yml \
            .github/workflows/mlb-step6b-production-canary-monitor.yml \
            .github/workflows/mlb-step6d-controlled-25-production-cert.yml \
            .github/workflows/mlb-step6e-25pct-stability-window.yml \
            vercel_finalizer/app.py \
            tests/test_guardian_infrastructure_automation_cleanup_v1.py \
            .github/workflows/guardian-infrastructure-automation-cleanup-patcher.yml
          git commit -m 'GUARDIAN: retire stale MLB schedulers and make finalizer health truthful'
          git push origin HEAD:guardian-infrastructure-automation-cleanup-v1
