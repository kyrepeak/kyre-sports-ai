name: Passing Yards QB Drill-Down Step 3

on:
  pull_request:
    paths:
      - ".github/workflows/passing-yards-qb-drilldown-step1-v1.yml"
      - ".github/workflows/passing-yards-qb-drilldown-step2-v1.yml"
      - ".github/workflows/passing-yards-qb-drilldown-step3-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-qb-drilldown-step3-v1.json"
      - "nfl_passing_yards_hub_v60.py"
      - "streamlit_memory_lazy_router_v211.py"
      - "tests/test_passing_yards_qb_drilldown_step3_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-qb-drilldown-step1-v1.yml"
      - ".github/workflows/passing-yards-qb-drilldown-step2-v1.yml"
      - ".github/workflows/passing-yards-qb-drilldown-step3-v1.yml"
      - "app.py"
      - "devsystem/task_ledgers/passing-yards-qb-drilldown-step3-v1.json"
      - "nfl_passing_yards_hub_v60.py"
      - "streamlit_memory_lazy_router_v211.py"
      - "tests/test_passing_yards_qb_drilldown_step3_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-step3-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce QB drill-down Step 3 scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step1-v1.yml
          .github/workflows/passing-yards-qb-drilldown-step2-v1.yml
          .github/workflows/passing-yards-qb-drilldown-step3-v1.yml
          app.py
          devsystem/task_ledgers/passing-yards-qb-drilldown-step3-v1.json
          nfl_passing_yards_hub_v60.py
          streamlit_memory_lazy_router_v211.py
          tests/test_passing_yards_qb_drilldown_step3_v1.py
          EOF
          cat > /tmp/expected-render-repair.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step3-v1.yml
          devsystem/task_ledgers/passing-yards-qb-drilldown-step3-v1.json
          nfl_passing_yards_hub_v60.py
          tests/test_passing_yards_qb_drilldown_step3_v1.py
          EOF
          cat > /tmp/expected-diagnostic.txt <<'EOF'
          .github/workflows/passing-yards-qb-drilldown-step3-v1.yml
          devsystem/task_ledgers/passing-yards-qb-drilldown-step3-v1.json
          tests/test_passing_yards_qb_drilldown_step3_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          sort -o /tmp/expected-render-repair.txt /tmp/expected-render-repair.txt
          sort -o /tmp/expected-diagnostic.txt /tmp/expected-diagnostic.txt
          if diff -q /tmp/expected.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP3_SCOPE_GREEN"
          elif diff -q /tmp/expected-render-repair.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP3_RENDER_REPAIR_SCOPE_GREEN"
          elif diff -q /tmp/expected-diagnostic.txt /tmp/actual.txt >/dev/null; then
            echo "PASSING_YARDS_QB_DRILLDOWN_STEP3_DIAGNOSTIC_SCOPE_GREEN"
          else
            echo "Unexpected Step 3 diff:"
            cat /tmp/actual.txt
            exit 1
          fi

      - name: Compile Step 3 chain
        run: |
          python -m py_compile nfl_passing_yards_hub_v60.py streamlit_memory_lazy_router_v211.py app.py tests/test_passing_yards_qb_drilldown_step3_v1.py

      - name: Run Step 3 contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_passing_yards_qb_drilldown_step3_v1.py

      - name: Report V60 emission order
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          import types
          from pathlib import Path

          calls = []
          st = types.ModuleType("streamlit")
          st.query_params = {}
          def markdown(body, *args, **kwargs):
              calls.append({
                  "kind": "markdown",
                  "body": str(body),
                  "unsafe_allow_html": bool(kwargs.get("unsafe_allow_html")),
              })
          st.markdown = markdown

          prior = types.ModuleType("nfl_passing_yards_hub_v59")
          def prior_render():
              calls.append({"kind": "prior"})
          prior.render_nfl_passing_yards_hub = prior_render

          sys.modules["streamlit"] = st
          sys.modules["nfl_passing_yards_hub_v59"] = prior
          spec = importlib.util.spec_from_file_location(
              "nfl_passing_yards_hub_v60_emission_probe",
              Path("nfl_passing_yards_hub_v60.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          header_html = module._header_html()
          header_body = header_html[len(module._HEADER_CSS):] if header_html.startswith(module._HEADER_CSS) else header_html
          module.render_nfl_passing_yards_hub()

          result = {
              "header_html_starts_with_header_css": header_html.startswith(module._HEADER_CSS),
              "header_html_length": len(header_html),
              "header_css_length": len(module._HEADER_CSS),
              "header_body_length": len(header_body),
              "header_body_start": header_body[:120],
              "header_body_has_v60_section": 'data-passing-yards-step3-header="v60"' in header_body,
              "header_body_has_v60_class": 'class="ks-py60-header"' in header_body,
              "css_markdown_call_seen": len(calls) >= 1 and 'data-passing-yards-step3-header-css="v60"' in calls[0].get("body",""),
              "body_markdown_call_seen": len(calls) >= 2 and calls[1].get("kind") == "markdown",
              "body_markdown_has_v60_section": len(calls) >= 2 and 'data-passing-yards-step3-header="v60"' in calls[1].get("body",""),
              "call_order": [call.get("kind") for call in calls],
          }
          print("PASSING_YARDS_QB_STEP3_V60_EMISSION_PROOF")
          print(json.dumps(result, indent=2, sort_keys=True))
          assert all([
              result["header_html_starts_with_header_css"],
              result["header_body_length"] > 0,
              result["header_body_has_v60_section"],
              result["header_body_has_v60_class"],
              result["css_markdown_call_seen"],
              result["body_markdown_call_seen"],
              result["body_markdown_has_v60_section"],
              result["call_order"] == ["markdown", "markdown", "prior"],
          ])
          PY

      - name: Verify frozen Step 1 and Step 2 boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          v60 = Path("nfl_passing_yards_hub_v60.py").read_text()
          v59 = Path("nfl_passing_yards_hub_v59.py").read_text()
          v58 = Path("nfl_passing_yards_hub_v58.py").read_text()
          r211 = Path("streamlit_memory_lazy_router_v211.py").read_text()
          r210 = Path("streamlit_memory_lazy_router_v210.py").read_text()
          app = Path("app.py").read_text()

          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v59"' in v60
          assert 'data-passing-yards-step3-header-css="v60"' in v60
          assert 'data-passing-yards-step3-header="v60"' in v60
          assert 'FROZEN_PRIOR = "nfl_passing_yards_hub_v58"' in v59
          assert 'data-passing-yards-qb-detail="v59"' in v59
          assert 'data-passing-yards-selection-screen="v58"' in v58
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v210"' in r211
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v60"' in r211
          assert 'FROZEN_ROUTER = "streamlit_memory_lazy_router_v209"' in r210
          assert 'PASSING_HUB = "nfl_passing_yards_hub_v59"' in r210
          assert 'from streamlit_memory_lazy_router_v211 import record_bootstrap_import_ms, render_app' in app
          assert 'Frozen QB Drill-Down Step 2 V210 compatibility' in app
          print("PASSING_YARDS_QB_DRILLDOWN_STEP3_STATIC_GREEN")
          PY

  public-production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Prove public Passing Yards Step 3 header
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health, _body_has_forbidden_error, BrowserQAFailure

          base = "https://kyre-sports-ai.streamlit.app"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          artifacts = Path("artifacts/passing-yards-qb-drilldown-step3")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          def find_picker(page, timeout=600):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  for candidate in page.frames:
                      try:
                          if (
                              candidate.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                              and candidate.locator('style[data-passing-yards-step3-header-css="v60"]').count() >= 1
                              and candidate.locator('[data-passing-yards-selection-screen="v58"]').count() == 1
                              and candidate.locator('[data-qb-selection-card]').count() == 2
                          ):
                              return candidate
                      except Exception:
                          pass
                  page.wait_for_timeout(500)
              raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_HEADER_PICKER_NOT_READY")

          def find_detail(page, slot, timeout=120):
              selector = f'[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="{slot}"]'
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  for candidate in page.frames:
                      try:
                          if (
                              candidate.locator('section[data-passing-yards-step3-header="v60"]').count() == 1
                              and candidate.locator(selector).count() == 1
                          ):
                              return candidate
                      except Exception:
                          pass
                  page.wait_for_timeout(500)
              raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP3_DETAIL_NOT_READY: slot={slot}")

          def click_anchor(page, frame, locator):
              target = locator.get_attribute("target")
              if target == "_blank":
                  with page.expect_popup(timeout=15000) as popup_info:
                      locator.click()
                  new_page = popup_info.value
                  new_page.wait_for_load_state("domcontentloaded", timeout=120000)
                  return new_page, target
              locator.click()
              return page, target

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                  picker = find_picker(page)

                  body = picker.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP3_RUNTIME: {forbidden}")

                  header = picker.locator('section[data-passing-yards-step3-header="v60"]').first
                  result = {
                      "status": "GREEN",
                      "route": "NFL -> Passing Yards",
                      "owner": "nfl_passing_yards_hub_v60",
                      "router": "streamlit_memory_lazy_router_v211",
                      "header": {
                          "count": picker.locator('section[data-passing-yards-step3-header="v60"]').count(),
                          "title": picker.locator(".ks-py60-title").first.inner_text(timeout=5000).strip(),
                          "subtitle": picker.locator(".ks-py60-subtitle").count(),
                          "slate": picker.locator('[data-passing-yards-step3-slate="true"]').count(),
                          "controls": picker.locator('[data-passing-yards-step3-controls="true"]').count(),
                          "filters": picker.locator("[data-step3-filter]").count(),
                          "status": picker.locator(".ks-py60-status").count(),
                      },
                      "picker": {
                          "selection_cards": picker.locator('[data-qb-selection-card]').count(),
                          "select_links": picker.locator('a[data-qb-select]').count(),
                      },
                  }

                  if result["header"] != {
                      "count": 1,
                      "title": "Passing Yards",
                      "subtitle": 1,
                      "slate": 1,
                      "controls": 1,
                      "filters": 4,
                      "status": 1,
                  }:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_HEADER_CONTRACT: " + json.dumps(result["header"], sort_keys=True))
                  if result["picker"]["selection_cards"] != 2 or result["picker"]["select_links"] != 2:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_FROZEN_PICKER_REGRESSION: " + json.dumps(result["picker"], sort_keys=True))

                  metrics = header.evaluate("el => ({clientWidth:el.clientWidth,scrollWidth:el.scrollWidth})")
                  result["mobile_header"] = metrics
                  if metrics["scrollWidth"] > metrics["clientWidth"] + 4:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_MOBILE_OVERFLOW: " + json.dumps(metrics))

                  qb1_name = picker.locator('a[data-qb-select="1"] .kpass29-name').first.inner_text(timeout=5000).strip()
                  link = picker.locator('a[data-qb-select="1"]').first
                  detail_page, target = click_anchor(page, picker, link)
                  detail = find_detail(detail_page, 1)
                  detail_body = detail.locator("body").inner_text(timeout=5000)
                  forbidden = _body_has_forbidden_error(detail_body)
                  if forbidden:
                      raise BrowserQAFailure(f"PASSING_YARDS_QB_STEP3_DETAIL_RUNTIME: {forbidden}")

                  detail_result = {
                      "name": qb1_name,
                      "navigation_target": target,
                      "header": detail.locator('section[data-passing-yards-step3-header="v60"]').count(),
                      "detail": detail.locator('[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="1"]').count(),
                      "player_cards": detail.locator(".ks-py59-player").count(),
                      "identity_visible": bool(qb1_name and qb1_name in detail_body),
                      "back": detail.locator('a[data-qb-back="true"]').count(),
                  }
                  result["qb1_regression"] = detail_result
                  if not (
                      detail_result["header"] == 1
                      and detail_result["detail"] == 1
                      and detail_result["player_cards"] == 1
                      and detail_result["identity_visible"]
                      and detail_result["back"] == 1
                  ):
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_FROZEN_DETAIL_REGRESSION: " + json.dumps(detail_result, sort_keys=True))

                  back = detail.locator('a[data-qb-back="true"]').first
                  return_page, _ = click_anchor(detail_page, detail, back)
                  returned = find_picker(return_page, timeout=120)
                  result["back_restored_picker"] = returned.locator('[data-qb-selection-card]').count() == 2
                  if not result["back_restored_picker"]:
                      raise BrowserQAFailure("PASSING_YARDS_QB_STEP3_BACK_REGRESSION")

                  (artifacts / "result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
                  return_page.screenshot(path=str(artifacts / "step3_header_mobile.png"), full_page=True)
                  print("PASSING_YARDS_QB_DRILLDOWN_STEP3_PUBLIC_GREEN")
                  print(json.dumps(result, indent=2))
              finally:
                  browser.close()
          PY

      - name: Upload QB drill-down Step 3 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-qb-drilldown-step3-${{ github.run_id }}
          path: artifacts/passing-yards-qb-drilldown-step3
          if-no-files-found: warn
          retention-days: 7


  public-dom-lifetime-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DOM lifetime proof dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Observe V60 and V58 independently through hydration
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from devsystem.browser_qa_v1 import _wait_for_health

          base = "https://kyre-sports-ai.streamlit.app"
          route_url = base + "/?ks_jump_sport=NFL&ks_jump_market=Passing%20Yards"
          artifacts = Path("artifacts/passing-yards-qb-step3-dom-lifetime")
          artifacts.mkdir(parents=True, exist_ok=True)
          _wait_for_health(base)

          def counts(page):
              total = {"css":0, "header":0, "picker":0, "cards":0}
              frames = []
              for frame in page.frames:
                  snap = {"url": frame.url}
                  try:
                      snap.update({
                          "css": frame.locator('style[data-passing-yards-step3-header-css="v60"]').count(),
                          "header": frame.locator('section[data-passing-yards-step3-header="v60"]').count(),
                          "picker": frame.locator('[data-passing-yards-selection-screen="v58"]').count(),
                          "cards": frame.locator('[data-qb-selection-card]').count(),
                      })
                  except Exception as exc:
                      snap["error"] = type(exc).__name__
                      snap.update({"css":0,"header":0,"picker":0,"cards":0})
                  for key in total:
                      total[key] += int(snap.get(key,0) or 0)
                  frames.append(snap)
              return {"total": total, "frames": frames}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage","--no-sandbox"])
              page = browser.new_page(viewport={"width":390,"height":844})
              started = time.monotonic()
              first_seen = {"css":None,"header":None,"picker":None}
              ever_header = False
              timeline = []

              def record(label):
                  nonlocal ever_header
                  snap = counts(page)
                  elapsed = round(time.monotonic() - started, 3)
                  row = {"label":label, "elapsed_seconds":elapsed, **snap}
                  timeline.append(row)
                  for key in ("css","header","picker"):
                      if first_seen[key] is None and snap["total"][key] > 0:
                          first_seen[key] = elapsed
                  if snap["total"]["header"] > 0:
                      ever_header = True
                  print("STEP3_DOM_LIFETIME " + json.dumps(row, sort_keys=True))
                  return snap

              try:
                  page.goto(route_url, wait_until="domcontentloaded", timeout=120000)
                  record("T0")

                  while time.monotonic() - started < 1.0:
                      page.wait_for_timeout(200)
                      record("probe_pre_T1")
                  t1 = record("T1_1s")

                  while time.monotonic() - started < 3.0:
                      page.wait_for_timeout(250)
                      record("probe_pre_T2")
                  t2 = record("T2_3s")

                  stable_hits = 0
                  deadline = time.monotonic() + 120
                  while time.monotonic() < deadline and stable_hits < 3:
                      page.wait_for_timeout(500)
                      snap = record("hydrate_probe")
                      if snap["total"]["picker"] == 1 and snap["total"]["cards"] == 2:
                          stable_hits += 1
                      else:
                          stable_hits = 0

                  t3 = record("T3_stable_hydration")
                  final = {
                      "css_first_appears_at_seconds": first_seen["css"],
                      "header_first_appears_at_seconds": first_seen["header"],
                      "picker_first_appears_at_seconds": first_seen["picker"],
                      "header_ever_appears": ever_header,
                      "header_appears_then_disappears": bool(
                          ever_header and t3["total"]["header"] == 0
                      ),
                      "final_header_count": t3["total"]["header"],
                      "final_css_count": t3["total"]["css"],
                      "final_picker_count": t3["total"]["picker"],
                      "final_qb_card_count": t3["total"]["cards"],
                      "stable_picker_observed": stable_hits >= 3,
                      "t1": t1["total"],
                      "t2": t2["total"],
                      "t3": t3["total"],
                  }
                  print("PASSING_YARDS_QB_STEP3_DOM_LIFETIME_RESULT")
                  print(json.dumps(final, indent=2, sort_keys=True))
                  (artifacts/"result.json").write_text(
                      json.dumps({"result":final,"timeline":timeline}, indent=2),
                      encoding="utf-8",
                  )
                  page.screenshot(path=str(artifacts/"final.png"), full_page=True)
                  assert final["stable_picker_observed"], "V58 picker did not reach stable hydrated state"
              finally:
                  browser.close()
          PY

      - name: Upload Step 3 DOM lifetime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passing-yards-qb-step3-dom-lifetime-${{ github.run_id }}
          path: artifacts/passing-yards-qb-step3-dom-lifetime
          if-no-files-found: warn
          retention-days: 7
