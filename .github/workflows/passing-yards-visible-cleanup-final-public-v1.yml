name: NFL Passing Yards Visible Cleanup Final Public Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passing-yards-visible-cleanup-final-public-v1.yml"
      - "devsystem/task_ledgers/passing-yards-visible-cleanup-final-public-v1.json"

permissions:
  contents: read

concurrency:
  group: passing-yards-visible-cleanup-final-public-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-public-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Protect merged cleanup and Monster owners
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/passing-yards-visible-cleanup-final-public-v1.yml' \
            'devsystem/task_ledgers/passing-yards-visible-cleanup-final-public-v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "PASSING_YARDS_VISIBLE_CLEANUP_FINAL_SCOPE_VIOLATION"
            printf '%s\n' "$actual"
            exit 1
          fi

          check_blob () {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || {
              echo "PASSING_YARDS_VISIBLE_CLEANUP_FINAL_PROTECTED_BLOB_CHANGED:$1:$actual:$2"
              exit 1
            }
          }

          check_blob app.py 98ea3f9c9df2ef409e17a23db4e524d531a16162
          check_blob nfl_passing_yards_hub_v85.py ec33cd092e249a701d510cac2b95a8ffd780b4db
          check_blob streamlit_memory_lazy_router_v237.py 3cc48636554c77dba4dead8325a3fc049185c255
          check_blob streamlit_memory_lazy_router_v236.py 0380da16cd91bcf3801b4d105218b508dbaf43f2
          check_blob streamlit_memory_lazy_router_v187.py 449a6a0712ab0f6be70cebe5a3822e59f279e3b6
          check_blob devsystem/sitewide_page_load_health_v1.py 6fb6750146a34b05f8ba2ff3b72da80e0153ec1e
          check_blob .github/workflows/sitewide-step45-targeted-close-v1.yml 8fdf57caa41828988adb1389fa34979a224385cc

          grep -F 'from streamlit_memory_lazy_router_v237 import record_bootstrap_import_ms, render_app' app.py
          grep -F 'PASSING_HUB = "nfl_passing_yards_hub_v85"' streamlit_memory_lazy_router_v237.py
          grep -F 'identity_router.PROP_HUBS[PASSING_MARKET] = PASSING_HUB' streamlit_memory_lazy_router_v237.py
          echo "PASSING_YARDS_VISIBLE_CLEANUP_FINAL_MONSTER_ISOLATION_GREEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public browser stack
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium

      - name: Certify cleanup through certified cold selected-QB route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from urllib.parse import urlencode

          from playwright.sync_api import sync_playwright

          base="https://kyre-sports-ai.streamlit.app"
          common={
              "ks_jump_sport":"NFL",
              "ks_jump_market":"Passing Yards",
              "ks_py_date":"2026-09-24",
              "ks_py_matchup":"Atlanta Falcons @ Green Bay Packers",
              "ks_qb_slot":"2",
              "ks_py_hint_name":"Jordan Love",
              "ks_py_hint_meta":"GB • QB",
              "ks_py_hint_projection":"276.4",
              "ks_py_hint_attempts":"34.8",
              "ks_py_hint_ypa":"7.94",
              "ks_py_hint_line":"274.5",
              "ks_py_hint_lean":"LEAN OVER",
          }
          lazy=base+"/?"+urlencode(common)

          def find(page,selector,timeout,interval=.2):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator(selector)
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(int(interval*1000))
              raise RuntimeError("PY_VISIBLE_FINAL_SELECTOR_NOT_READY:"+selector)

          def find_button(page,timeout):
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  for frame in page.frames:
                      try:
                          loc=frame.locator("button").filter(has_text="Load Full Analysis")
                          if loc.count()>=1:
                              return frame,loc.first
                      except Exception:
                          pass
                  page.wait_for_timeout(200)
              raise RuntimeError("PY_VISIBLE_FINAL_BUTTON_NOT_READY")

          def body_text(page):
              chunks=[]
              for frame in page.frames:
                  try:
                      chunks.append(frame.locator("body").inner_text(timeout=1500))
                  except Exception:
                      pass
              return "\n".join(chunks)

          forbidden=(
              "Market Decision Detail",
              "How to read this clean detail",
              "Projection Detail",
              "Context + Uncertainty Detail",
              "Distribution + Probability Detail",
              "Model Confidence",
              "Model Over / Under",
          )

          with sync_playwright() as p:
              # Deployment-aware activation loop copied from the frozen Step 7
              # public proof contract. A fresh browser/context on every attempt
              # prevents stale Streamlit session state from masquerading as the
              # deployed selected-QB route.
              deadline=time.monotonic()+600
              browser=None
              context=None
              page=None
              attempt=0

              while time.monotonic()<deadline:
                  attempt += 1
                  if browser is not None:
                      try:
                          browser.close()
                      except Exception:
                          pass

                  browser=p.chromium.launch(
                      headless=True,
                      args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
                  )
                  context=browser.new_context(viewport={"width":390,"height":844})
                  page=context.new_page()
                  active=False
                  try:
                      page.goto(lazy,wait_until="domcontentloaded",timeout=120000)
                      try:
                          find(page,'[data-passing-yards-visible-cleanup-owner="v85"]',30)
                          find(page,'[data-passing-yards-single-rerun-owner="v84"]',30)
                          find(page,'[data-passing-yards-lazy-detail="v79"]',30)
                          find_button(page,30)

                          body=body_text(page)
                          if "Router V187 direct handler is player-prop identity only." in body:
                              raise RuntimeError("PY_VISIBLE_FINAL_V187_CRASH_PRESENT")
                          if "RuntimeError: This app has encountered an error" in body:
                              raise RuntimeError("PY_VISIBLE_FINAL_RUNTIME_ERROR_PRESENT")

                          active=True
                      except Exception as exc:
                          print(
                              f"PASSING_YARDS_VISIBLE_CLEANUP_FINAL_DEPLOY_WAIT "
                              f"attempt={attempt} error={type(exc).__name__}:{exc}"
                          )
                          active=False
                  except Exception as exc:
                      print(
                          f"PASSING_YARDS_VISIBLE_CLEANUP_FINAL_NAV_RETRY "
                          f"attempt={attempt} error={type(exc).__name__}:{exc}"
                      )
                      active=False

                  if active:
                      break

                  try:
                      context.close()
                  except Exception:
                      pass
                  try:
                      browser.close()
                  except Exception:
                      pass
                  browser=None
                  context=None
                  page=None
                  time.sleep(10)

              if not active or browser is None or context is None or page is None:
                  raise RuntimeError("PASSING_YARDS_VISIBLE_CLEANUP_FINAL_DEPLOYMENT_NOT_ACTIVE")

              print(
                  f"PASSING_YARDS_VISIBLE_CLEANUP_FINAL_DEPLOYMENT_ACTIVE "
                  f"attempt={attempt}"
              )

              _,button=find_button(page,20)
              button.click(timeout=10000)

              frame,root=find(
                  page,
                  '[data-passing-yards-qb-detail="v59"][data-qb-analysis-slot="2"]',
                  45,
                  .15,
              )
              find(page,'[data-passing-yards-visible-cleanup-owner="v85"]',20)
              _,panel=find(
                  page,
                  '[data-passing-yards-availability-game-day="v74"]',
                  35,
                  .15,
              )

              name=root.locator(".kpass29-name").first.inner_text(timeout=5000).strip()
              if name!="Jordan Love":
                  raise RuntimeError("PY_VISIBLE_FINAL_IDENTITY:"+name)

              for width,height,label in (
                  (390,844,"390"),
                  (768,1024,"768"),
                  (1440,1000,"1440"),
              ):
                  page.set_viewport_size({"width":width,"height":height})
                  page.wait_for_timeout(350)

                  panel_text=panel.inner_text(timeout=5000)
                  cells=panel.locator(".ks-py74-cell b").all_inner_texts()
                  report=panel.locator(".ks-py74-report").first.inner_text(timeout=5000)
                  overflow=panel.evaluate("(el) => el.scrollWidth > el.clientWidth + 4")
                  longest=max((len(v.strip()) for v in cells),default=0)

                  if len(cells)!=8:
                      raise RuntimeError(f"PY_VISIBLE_FINAL_CELL_COUNT:{label}:{len(cells)}")
                  if longest>120:
                      raise RuntimeError(f"PY_VISIBLE_FINAL_CELL_TOO_LONG:{label}:{longest}")
                  for token in forbidden:
                      if token.casefold() in panel_text.casefold():
                          raise RuntimeError(f"PY_VISIBLE_FINAL_RAW_DUMP:{label}:{token}")
                  if len(report)>900:
                      raise RuntimeError(f"PY_VISIBLE_FINAL_REPORT_TOO_LONG:{label}:{len(report)}")
                  if report.count("Final inactive report:")!=1:
                      raise RuntimeError(f"PY_VISIBLE_FINAL_REPORT_COUNT:{label}")
                  if overflow:
                      raise RuntimeError(f"PY_VISIBLE_FINAL_HORIZONTAL_OVERFLOW:{label}")

                  print(f"PASSING_YARDS_VISIBLE_CLEANUP_PUBLIC_VIEWPORT_{label}_GREEN")
                  print(
                      f"PASSING_YARDS_VISIBLE_CLEANUP_PUBLIC_VIEWPORT_{label}_"
                      f"MAX_CELL_CHARS={longest}"
                  )
                  print(
                      f"PASSING_YARDS_VISIBLE_CLEANUP_PUBLIC_VIEWPORT_{label}_"
                      f"REPORT_CHARS={len(report)}"
                  )

              context.close()
              browser.close()

              # Independent Monster protection proof: Receptions still belongs
              # to V236 after the merged Passing Yards-only repair.
              browser=p.chromium.launch(
                  headless=True,
                  args=["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"],
              )
              rec_context=browser.new_context(viewport={"width":1440,"height":1000})
              rec=rec_context.new_page()
              rec.goto(
                  base+"/?"+urlencode({
                      "ks_jump_sport":"NFL",
                      "ks_jump_market":"Receptions",
                  }),
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              find(rec,'[data-nfl-receptions-route="v236"]',45)
              print("PASSING_YARDS_VISIBLE_CLEANUP_MONSTER_RECEPTIONS_V236_GREEN")
              rec_context.close()
              browser.close()

              print("PASSING_YARDS_VISIBLE_CLEANUP_STEP1_GREEN")
              print("PASSING_YARDS_VISIBLE_CLEANUP_STEP2_GREEN")
              print("PASSING_YARDS_VISIBLE_CLEANUP_STEP3_GREEN")
              print("PASSING_YARDS_VISIBLE_CLEANUP_STEP4_GREEN")
              print("PASSING_YARDS_VISIBLE_CLEANUP_GREEN")
              print("PASSING_YARDS_VISIBLE_CLEANUP_FROZEN")
          PY
