name: CFB O/U ESPN logo hotfix V1

on:
  workflow_dispatch:
  push:
    branches: ['cfb-ou-logo-hotfix-v1']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert exact additive hotfix scope
        if: github.event_name == 'push' || github.head_ref == 'cfb-ou-logo-hotfix-v1'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cfb-over-under-logo-hotfix-v1.yml' \
            'app.py' \
            'cfb_over_under_logo_resolver_v1.py' \
            'cfb_over_under_matchup_ui_v3_logo_hotfix_v1.py' \
            'streamlit_memory_lazy_router_v40.py' \
            'tests/test_cfb_over_under_logo_hotfix_router_v40.py' \
            'tests/test_cfb_over_under_logo_hotfix_v1.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected CFB O/U logo hotfix scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "CFB_OU_LOGO_HOTFIX_SCOPE=PASS"

      - name: Enforce original CFB Steps 1 through 12 freeze
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "3ff2a727967e80dddbe03f747d9f32090cc39539"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_freeze_manifest_v12.json") != expected_manifest_blob:
              failures.append("CFB Step-12 freeze manifest changed")

          manifest = json.loads(pathlib.Path("cfb_freeze_manifest_v12.json").read_text())
          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen CFB path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen CFB path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_STEPS_1_12_FROZEN=PASS")
          PY

      - name: Enforce permanently frozen O/U Upgrade Steps 1 through 3
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          expected_manifest_blob = "7c3408833b931fbb9d2e41e6660ebdf4f975f723"

          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()

          failures = []
          if rev("HEAD:cfb_over_under_upgrade_freeze_manifest_v3.json") != expected_manifest_blob:
              failures.append("O/U Upgrade Step 3 freeze manifest changed")

          manifest = json.loads(
              pathlib.Path("cfb_over_under_upgrade_freeze_manifest_v3.json").read_text()
          )
          if manifest.get("completed_upgrade_steps") != [1, 2, 3]:
              failures.append("O/U Upgrade Steps 1-3 completion contract changed")

          for path, expected in (manifest.get("exact_blobs") or {}).items():
              try:
                  actual = rev(f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  failures.append(f"missing frozen O/U upgrade path: {path}")
                  continue
              if actual != expected:
                  failures.append(f"frozen O/U Upgrade Step 1-3 path changed: {path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("CFB_OU_UPGRADE_STEPS_1_3_FROZEN=PASS")
          PY

      - name: Compile logo hotfix
        run: |
          python -m py_compile \
            app.py \
            cfb_over_under_logo_resolver_v1.py \
            cfb_over_under_matchup_ui_v3_logo_hotfix_v1.py \
            streamlit_memory_lazy_router_v40.py \
            tests/test_cfb_over_under_logo_hotfix_v1.py \
            tests/test_cfb_over_under_logo_hotfix_router_v40.py
          PYTHONPATH=. python -c "import cfb_over_under_logo_resolver_v1; import cfb_over_under_matchup_ui_v3_logo_hotfix_v1; import streamlit_memory_lazy_router_v40"

      - name: Run logo hotfix and frozen regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cfb_over_under_logo_hotfix_v1.py \
            tests/test_cfb_over_under_logo_hotfix_router_v40.py \
            tests/test_cfb_over_under_upgrade_step3_engine.py \
            tests/test_cfb_over_under_upgrade_step3_slate.py \
            tests/test_cfb_over_under_upgrade_step3_ui.py \
            tests/test_streamlit_memory_lazy_router_v39.py \
            tests/test_cfb_over_under_upgrade_step2_rankings.py \
            tests/test_cfb_over_under_upgrade_step2_ui.py \
            tests/test_streamlit_memory_lazy_router_v38.py \
            tests/test_cfb_over_under_upgrade_step1.py \
            tests/test_streamlit_memory_lazy_router_v37.py \
            tests/test_cfb_step9_over_under_final_v1.py \
            tests/test_streamlit_memory_lazy_router_v36.py

      - name: Live ESPN Florida A&M at Miami logo smoke check
        run: |
          PYTHONPATH=. python - <<'PY'
          import cfb_over_under_logo_resolver_v1 as logos
          import cfb_schedule_v3 as schedule

          game = {
              "game_date": "2026-09-10",
              "away_team": "Florida A&M",
              "away_team_slug": "florida-a-m",
              "home_team": "Miami (FL)",
              "home_team_slug": "miami-fl",
              "espn_event_id": "401858213",
              "identity_key": "ncaa:logo-smoke",
          }

          payload, attempts = schedule.frozen._fetch_espn_fbs_payload("2026-09-10")
          if not payload:
              raise SystemExit(f"ESPN scoreboard unavailable: {attempts}")

          visuals = logos._extract_from_scoreboard(payload, game)
          away = visuals.get("away") or {}
          home = visuals.get("home") or {}

          if away.get("team_id") != "50":
              raise SystemExit(f"Florida A&M ESPN id mismatch: {away}")
          if home.get("team_id") != "2390":
              raise SystemExit(f"Miami ESPN id mismatch: {home}")
          if not str(away.get("logo") or "").startswith("https://"):
              raise SystemExit(f"Florida A&M logo missing: {away}")
          if not str(home.get("logo") or "").startswith("https://"):
              raise SystemExit(f"Miami logo missing: {home}")

          print("LIVE_ESPN_FAMU_MIAMI_LOGOS=PASS")
          PY

      - name: Prove presentation-only firewall and Router V40 handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path("cfb_over_under_logo_resolver_v1.py").read_text(encoding="utf-8")
          wrapper = Path("cfb_over_under_matchup_ui_v3_logo_hotfix_v1.py").read_text(encoding="utf-8")
          router = Path("streamlit_memory_lazy_router_v40.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          combined = resolver + "\n" + wrapper + "\n" + router + "\n" + app

          required = [
              'FROZEN_STEP1_UI = "cfb_over_under_matchup_ui_v1"',
              'FROZEN_UPGRADE = "cfb_over_under_matchup_ui_v3"',
              'root._import("cfb_over_under_matchup_ui_v3_logo_hotfix_v1")',
              'FROZEN_ROUTER = "streamlit_memory_lazy_router_v39"',
              'from streamlit_memory_lazy_router_v40 import render_app',
              'Florida A&M',
              'Miami (FL)',
              'https://a.espncdn.com/i/teamlogos/ncaa/500/',
          ]
          for token in required:
              if token not in combined:
                  raise SystemExit(f"missing logo hotfix marker: {token}")

          forbidden = [
              "projected_total =",
              "over_probability =",
              "under_probability =",
              "selection_probability =",
              "rank_slate(",
              "expected_value",
              "np.random",
              "import random",
          ]
          lower = (resolver + "\n" + wrapper).lower()
          for token in forbidden:
              if token.lower() in lower:
                  raise SystemExit(f"logo hotfix crossed model firewall: {token}")

          print("CFB_OU_LOGO_HOTFIX_PRESENTATION_FIREWALL=PASS")
          PY

      - name: Certification marker
        run: echo "CFB_OU_ESPN_LOGO_HOTFIX_GREEN"
