name: MLB Moneyline Step 12 final permanent freeze contract

on:
  workflow_dispatch:
  push:
    branches: ['mlb-moneyline-step12-final-freeze-contract']

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Assert final freeze creation scope
        if: github.event_name == 'push' || github.head_ref == 'mlb-moneyline-step12-final-freeze-contract'
        run: |
          git fetch origin main --depth=1
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mlb-moneyline-step12-final-permanent-freeze-contract.yml' \
            'mlb_moneyline_freeze_manifest_v13.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final MLB Moneyline freeze scope"
            echo "--- expected ---"
            echo "$expected"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "MLB_MONEYLINE_FINAL_FREEZE_CREATION_SCOPE=PASS"

      - name: Enforce permanent Moneyline Steps 1-12 frozen-file manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest=json.loads(pathlib.Path('mlb_moneyline_freeze_manifest_v13.json').read_text())
          base=manifest['baseline_commit']

          def rev(spec):
              return subprocess.check_output(['git','rev-parse',spec],text=True).strip()

          failures=[]
          for path in manifest['baseline_paths']:
              try:
                  expected=rev(f'{base}:{path}')
                  actual=rev(f'HEAD:{path}')
              except subprocess.CalledProcessError:
                  failures.append(f'missing frozen Moneyline path: {path}')
                  continue
              if expected!=actual:
                  failures.append(
                      f'frozen Moneyline baseline changed: {path} expected={expected} actual={actual}'
                  )

          for path,expected in manifest['exact_blobs'].items():
              try:
                  actual=rev(f'HEAD:{path}')
              except subprocess.CalledProcessError:
                  failures.append(f'missing exact-frozen Moneyline path: {path}')
                  continue
              if expected!=actual:
                  failures.append(
                      f'exact frozen Moneyline blob changed: {path} expected={expected} actual={actual}'
                  )

          if failures:
              print('\n'.join(failures))
              sys.exit(1)

          assert manifest['completed_steps'] == [1,2,3,4,5,'5L',6,7,8,9,10,11,12]
          print('MLB_MONEYLINE_STEPS_1_12_FINAL_PERMANENT_FREEZE_MANIFEST=PASS')
          PY

      - name: Compile frozen Moneyline Steps 1-12
        run: |
          python -m py_compile \
            mlb_moneyline_hub_v166.py \
            mlb_moneyline_hub_v167.py \
            mlb_moneyline_hub_v168.py \
            mlb_moneyline_hub_v169.py \
            mlb_moneyline_hub_v170.py \
            mlb_moneyline_hub_v171.py \
            mlb_moneyline_hub_v172.py \
            mlb_moneyline_hub_v173.py \
            mlb_moneyline_hub_v174.py \
            mlb_moneyline_hub_v175.py \
            mlb_moneyline_hub_v176.py \
            mlb_moneyline_hub_v177.py \
            mlb_moneyline_hub_v178.py \
            streamlit_memory_lazy_router_v4.py \
            streamlit_memory_lazy_router_v5.py \
            streamlit_memory_lazy_router_v6.py \
            streamlit_memory_lazy_router_v7.py \
            streamlit_memory_lazy_router_v8.py \
            streamlit_memory_lazy_router_v9.py \
            streamlit_memory_lazy_router_v10.py \
            streamlit_memory_lazy_router_v11.py \
            streamlit_memory_lazy_router_v12.py \
            streamlit_memory_lazy_router_v13.py \
            streamlit_memory_lazy_router_v14.py \
            streamlit_memory_lazy_router_v15.py \
            streamlit_memory_lazy_router_v16.py \
            tests/test_mlb_moneyline_step1_game_identity.py \
            test_mlb_moneyline_v167.py \
            test_streamlit_memory_lazy_router_v5.py \
            tests/test_mlb_moneyline_step3_starter_lineup.py \
            tests/test_streamlit_memory_lazy_router_v6.py \
            tests/test_mlb_moneyline_step4_offense_quality.py \
            tests/test_streamlit_memory_lazy_router_v7.py \
            tests/test_mlb_moneyline_step5_bullpen.py \
            tests/test_streamlit_memory_lazy_router_v8.py \
            tests/test_mlb_moneyline_step5l_live_mode.py \
            tests/test_streamlit_memory_lazy_router_v9.py \
            tests/test_mlb_moneyline_step6_lineup_strength.py \
            tests/test_streamlit_memory_lazy_router_v10.py \
            tests/test_mlb_moneyline_step7_park_weather.py \
            tests/test_streamlit_memory_lazy_router_v11.py \
            tests/test_mlb_moneyline_step8_defense_baserunning.py \
            tests/test_streamlit_memory_lazy_router_v12.py \
            tests/test_mlb_moneyline_step9_recent_form.py \
            tests/test_streamlit_memory_lazy_router_v13.py \
            tests/test_mlb_moneyline_step10_game_script.py \
            tests/test_streamlit_memory_lazy_router_v14.py \
            tests/test_mlb_moneyline_step11_market_intelligence.py \
            tests/test_streamlit_memory_lazy_router_v15.py \
            tests/test_mlb_moneyline_step12_final_synthesis.py \
            tests/test_streamlit_memory_lazy_router_v16.py

      - name: Run frozen Moneyline Steps 1-12 contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_mlb_moneyline_step1_game_identity.py \
            test_mlb_moneyline_v167.py \
            test_streamlit_memory_lazy_router_v5.py \
            tests/test_mlb_moneyline_step3_starter_lineup.py \
            tests/test_streamlit_memory_lazy_router_v6.py \
            tests/test_mlb_moneyline_step4_offense_quality.py \
            tests/test_streamlit_memory_lazy_router_v7.py \
            tests/test_mlb_moneyline_step5_bullpen.py \
            tests/test_streamlit_memory_lazy_router_v8.py \
            tests/test_mlb_moneyline_step5l_live_mode.py \
            tests/test_streamlit_memory_lazy_router_v9.py \
            tests/test_mlb_moneyline_step6_lineup_strength.py \
            tests/test_streamlit_memory_lazy_router_v10.py \
            tests/test_mlb_moneyline_step7_park_weather.py \
            tests/test_streamlit_memory_lazy_router_v11.py \
            tests/test_mlb_moneyline_step8_defense_baserunning.py \
            tests/test_streamlit_memory_lazy_router_v12.py \
            tests/test_mlb_moneyline_step9_recent_form.py \
            tests/test_streamlit_memory_lazy_router_v13.py \
            tests/test_mlb_moneyline_step10_game_script.py \
            tests/test_streamlit_memory_lazy_router_v14.py \
            tests/test_mlb_moneyline_step11_market_intelligence.py \
            tests/test_streamlit_memory_lazy_router_v15.py \
            tests/test_mlb_moneyline_step12_final_synthesis.py \
            tests/test_streamlit_memory_lazy_router_v16.py

      - name: Final architecture assertion
        run: |
          PYTHONPATH=. python - <<'PY'
          import mlb_moneyline_hub_v178 as final
          import streamlit_memory_lazy_router_v16 as router
          assert final.MODEL_VERSION.startswith("V17.8")
          assert router.MODEL_VERSION.startswith("KYRE STREAMLIT ROUTER V16")
          assert final.SCRIPT_BLEND_MAX <= 0.20
          assert final.MAX_CALIBRATION_DELTA <= 0.035
          print("MLB_MONEYLINE_FINAL_ARCHITECTURE=PASS")
          PY

      - name: Certification marker
        run: |
          echo "MLB_MONEYLINE_STEP1_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP2_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP3_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP4_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP5_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP5L_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP6_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP7_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP8_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP9_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP10_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP11_PERMANENT_FREEZE_GREEN"
          echo "MLB_MONEYLINE_STEP12_FINAL_PERMANENT_FREEZE_GREEN"
