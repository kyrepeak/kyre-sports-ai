name: WNBA Step 8D 5M joint Monte Carlo certification

on:
  push:
    branches:
      - wnba-step8-projection-contract-20260828
    paths:
      - 'sports_api/wnba_step8_joint_monte_carlo.py'
      - 'tests/test_wnba_step8_joint_monte_carlo.py'
      - 'sports_api/tools/wnba_step8d_joint_monte_carlo_cert.py'
      - '.github/workflows/wnba-step-8d-joint-monte-carlo-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-step8d-5m-joint-monte-carlo-cert
  cancel-in-progress: true

env:
  WNBA_PRODUCTION_RUNTIME_ENABLED: 'false'
  WNBA_BOARD_SCHEDULER_ENABLED: 'false'
  WNBA_KYRE_DIRECT_SYNC_ENABLED: 'false'
  WNBA_KYRE_RECONCILED_SYNC_ENABLED: 'false'
  WNBA_STEP6J_CANARY_ENABLED: 'false'
  WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED: 'false'
  WNBA_STEP7G_FIRST_PARTY_ENABLED: 'true'
  WNBA_STEP8_PROJECTION_HANDOFF_ENABLED: 'true'
  WNBA_STEP8_CORE_PROJECTION_ENABLED: 'true'
  WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED: 'true'
  WNBA_STEP8_MONTE_CARLO_ENABLED: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Step 8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert production OFF and isolated Step 8 flags
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
          test "$WNBA_STEP7G_FIRST_PARTY_ENABLED" = 'true'
          test "$WNBA_STEP8_PROJECTION_HANDOFF_ENABLED" = 'true'
          test "$WNBA_STEP8_CORE_PROJECTION_ENABLED" = 'true'
          test "$WNBA_STEP8_CONTEXT_ADJUSTMENT_ENABLED" = 'true'
          test "$WNBA_STEP8_MONTE_CARLO_ENABLED" = 'true'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install -r sports_api/requirements.txt

      - name: Compile Step 8D joint Monte Carlo layer
        shell: bash
        run: |
          python -m py_compile sports_api/wnba_step8_joint_monte_carlo.py
          python -m py_compile sports_api/tools/wnba_step8d_joint_monte_carlo_cert.py
          python -m py_compile sports_api/wnba_step8_context_adjustment.py
          python -m py_compile sports_api/wnba_step8_core_projection.py
          python -m py_compile sports_api/wnba_step8_official_box_baseline.py

      - name: Run Step 8D unit guards
        run: PYTHONPATH=. python tests/test_wnba_step8_joint_monte_carlo.py

      - name: Run inherited Step 8 guards
        shell: bash
        run: |
          PYTHONPATH=. python tests/test_wnba_step8_context_adjustment.py
          PYTHONPATH=. python tests/test_wnba_step8_core_projection.py
          PYTHONPATH=. python tests/test_wnba_step8_official_box_baseline.py
          PYTHONPATH=. python tests/test_wnba_step8_projection_handoff.py

      - name: Prove certified Step 8C and inherited boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          STEP8C_CERTIFIED_SHA='58ee441a086dc810223986edd06ff52c7f117d3f'
          git fetch origin wnba-step8-projection-contract-20260828 --depth=400
          git cat-file -e "$STEP8C_CERTIFIED_SHA^{commit}"
          git diff --exit-code "$STEP8C_CERTIFIED_SHA" -- \
            sports_api/wnba_step8_context_adjustment.py \
            tests/test_wnba_step8_context_adjustment.py \
            sports_api/tools/wnba_step8c_context_adjustment_cert.py \
            .github/workflows/wnba-step-8c-context-adjustment-cert.yml \
            sports_api/wnba_step8_core_projection.py \
            tests/test_wnba_step8_core_projection.py \
            sports_api/tools/wnba_step8b_core_projection_cert.py \
            .github/workflows/wnba-step-8b-core-projection-cert.yml \
            sports_api/wnba_step8_official_box_baseline.py \
            tests/test_wnba_step8_official_box_baseline.py \
            sports_api/wnba_step8_projection_handoff.py \
            tests/test_wnba_step8_projection_handoff.py \
            sports_api/wnba_step7g_release_freeze.py \
            sports_api/wnba_step7g_first_party_integration.py \
            sports_api/wnba_projection_input_snapshot.py \
            sports_api/wnba_model_input_readiness.py

      - name: Live certify exact 5,000,000-draw Step 8D distribution
        run: PYTHONPATH=. python -m sports_api.tools.wnba_step8d_joint_monte_carlo_cert

      - name: Upload Step 8D certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-step8d-joint-monte-carlo-${{ github.run_id }}-${{ github.run_attempt }}
          path: step8d-joint-monte-carlo-cert.json
          if-no-files-found: warn
          retention-days: 45

      - name: Re-assert production OFF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$WNBA_PRODUCTION_RUNTIME_ENABLED" = 'false'
          test "$WNBA_BOARD_SCHEDULER_ENABLED" = 'false'
          test "$WNBA_KYRE_DIRECT_SYNC_ENABLED" = 'false'
          test "$WNBA_KYRE_RECONCILED_SYNC_ENABLED" = 'false'
          test "$WNBA_STEP6J_CANARY_ENABLED" = 'false'
          test "$WNBA_STEP6L_PRODUCTION_REFRESH_ENABLED" = 'false'
