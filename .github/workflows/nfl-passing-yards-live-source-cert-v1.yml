name: NFL Passing Yards live source cert

on:
  pull_request:
    branches: [main]
    paths:
      - 'nfl_passing_yards_*.py'
      - 'nfl_hub_v*.py'
      - 'streamlit_memory_lazy_router_v*.py'
      - 'app.py'
      - 'tests/test_nfl_passing_yards_profile_espn_shape_v1.py'
      - 'devsystem/nfl_passing_yards_live_cert_v1.py'
      - 'devsystem/nfl_passing_yards_live_stage_cert_v1.py'
      - 'devsystem/nfl_passing_yards_espn_payload_probe_v1.py'
      - '.github/workflows/nfl-passing-yards-live-source-cert-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-passing-yards-live-source-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-source-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production Python stack
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Test ESPN general gamesPlayed recovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_passing_yards_profile_espn_shape_v1.py::test_parse_season_passing_recovers_games_from_general_without_stat_collisions
      - name: Test ESPN teamGamesPlayed recovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_passing_yards_profile_espn_shape_v1.py::test_parse_season_passing_accepts_team_games_played_from_passing_category
      - name: Test verified prior-season profile bridge
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_nfl_passing_yards_profile_espn_shape_v1.py::test_build_qb_profile_uses_verified_prior_regular_season_when_current_sample_empty
      - name: Probe ESPN payload shape
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_espn_payload_probe_v1.py
      - name: Certify live Step 2 QB profile bridge
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_live_stage_cert_v1.py --stage profile
      - name: Certify live Step 3 defense and Step 6 pace inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_live_stage_cert_v1.py --stage matchup
      - name: Certify Buccaneers at Bengals live Passing Yards chain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_live_cert_v1.py
      - name: Certify live Step 9 recent-game variance inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python devsystem/nfl_passing_yards_live_stage_cert_v1.py --stage recent
