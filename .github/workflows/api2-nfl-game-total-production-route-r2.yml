name: API2 NFL Game Total Production Route R2

on:
  pull_request:
    branches: [main]
    paths:
      - "universal_runtime_v5_loader.py"
      - "streamlit_memory_lazy_router_universal_runtime_v5_nfl_rushing_route_restore_v1.py"
      - "tests/test_api2_nfl_game_total_production_route_r2.py"
      - "devsystem/runless_proof_plans/api2-nfl-game-total-production-route-r2.json"
      - "devsystem/task_ledgers/api2-nfl-game-total-production-route-r2.json"
      - ".github/workflows/api2-nfl-game-total-production-route-r2.yml"

permissions:
  contents: read

jobs:
  production-route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused production routing regression
        run: python -m pytest -q --noconftest tests/test_api2_nfl_game_total_production_route_r2.py
      - name: Compile production route boundary
        run: >-
          python -m py_compile
          universal_runtime_v5_loader.py
          streamlit_memory_lazy_router_universal_runtime_v5_nfl_rushing_route_restore_v1.py
          nfl_game_totals_page1_s_tier_v1.py
          nfl_game_totals_hub_v10.py
