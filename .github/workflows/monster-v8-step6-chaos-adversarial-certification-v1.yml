name: MONSTER V8 Step 6 Chaos Adversarial Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - "devsystem/chaos_adversarial_certification_harness_v1.py"
      - "tests/test_devsystem_chaos_adversarial_certification_harness_v1.py"
      - "devsystem/task_ledgers/monster-v8-step6-chaos-adversarial-certification-v1.json"
      - ".github/workflows/monster-v8-step6-chaos-adversarial-certification-v1.yml"
  push:
    branches:
      - main
    paths:
      - "devsystem/chaos_adversarial_certification_harness_v1.py"
      - "tests/test_devsystem_chaos_adversarial_certification_harness_v1.py"
      - "devsystem/task_ledgers/monster-v8-step6-chaos-adversarial-certification-v1.json"
      - ".github/workflows/monster-v8-step6-chaos-adversarial-certification-v1.yml"

permissions:
  contents: read

concurrency:
  group: monster-v8-step6-chaos-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focused-proof:
    name: chaos adversarial certification focused proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen MONSTER dependency identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devsystem/adaptive_stuck_thresholds_v1.py)" = "5a68516d45417a7175eb6e88f7e9d4749a2dbe1c"
          test "$(git hash-object devsystem/cross_workstream_intent_arbiter_v1.py)" = "e1db49a3f2d16fe2eb89b243658deba92fbde160"
          test "$(git hash-object devsystem/mandatory_2a_adversarial_certification_v1.py)" = "97cbde42f8b7b5222bc345879b4208b89dda4cee"
          test "$(git hash-object devsystem/transactional_rollback_engine_v1.py)" = "609e5b9b3f416cff47d5867b57a63782ea0e18b8"
          test "$(git hash-object devsystem/atomic_wait_queue_lease_handoff_v1.py)" = "6d5a75b2d66a0439563b92ee04a1b8c8024d1dad"
          test "$(git hash-object devsystem/monotonic_state_ownership_guard_v1.py)" = "52b167271b7ff14de4b948a8ccbacb03e377774a"
          test "$(git hash-object devsystem/frozen_artifact_registry_v1.py)" = "ede316bb19a900b544abe4d652d6cfbcde6a9f82"
          test "$(git hash-object devsystem/deployment_truth_control_plane_v1.py)" = "2c39e1fd1b6a7af219bf14f48f124d695a925d59"
          test "$(git hash-object devsystem/execution_heartbeat_deadman_recovery_v1.py)" = "a8be77d18e0ba7bcc8bbba4ef45451d18c2bf469"
          test "$(git hash-object devsystem/mandatory_2a_replay_lock_v1.py)" = "83a01f4ffe7a8dfe8403f681d8c5038004616ae2"

      - name: Compile Step 6 harness
        run: python -m py_compile devsystem/chaos_adversarial_certification_harness_v1.py

      - name: Run Step 6 chaos contract
        run: python devsystem/chaos_adversarial_certification_harness_v1.py

      - name: Run Step 6 focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_devsystem_chaos_adversarial_certification_harness_v1.py

      - name: Prove read-only safety
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import devsystem.chaos_adversarial_certification_harness_v1 as step6

          assert step6.NETWORK_CALLS is False
          assert step6.AUTO_MUTATE is False
          assert step6.MAY_MODIFY_PRODUCT_RUNTIME is False
          assert step6.MUTATION_AUTHORITY_GRANTED is False

          tree = ast.parse(
              Path("devsystem/chaos_adversarial_certification_harness_v1.py").read_text(
                  encoding="utf-8"
              )
          )
          forbidden = {"requests", "urllib", "http", "socket", "subprocess"}
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])
          assert not (imported & forbidden), sorted(imported & forbidden)
          print("MONSTER_V8_STEP6_READ_ONLY_SAFETY_GREEN")
          PY

      - name: Enforce exact Step 6 write surface
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi
          if [ -z "${BASE_SHA:-}" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/step6-scope.txt
          python - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/monster-v8-step6-chaos-adversarial-certification-v1.yml",
              "devsystem/chaos_adversarial_certification_harness_v1.py",
              "devsystem/task_ledgers/monster-v8-step6-chaos-adversarial-certification-v1.json",
              "tests/test_devsystem_chaos_adversarial_certification_harness_v1.py",
          }
          actual = {
              line.strip()
              for line in Path("/tmp/step6-scope.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          unexpected = sorted(actual - allowed)
          assert actual, "Step 6 proof surface unexpectedly empty"
          assert not unexpected, f"unexpected Step 6 files: {unexpected}"
          print("MONSTER_V8_STEP6_SCOPE_GREEN", sorted(actual))
          PY

      - name: Emit Step 6 proof marker
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          echo "MONSTER_V8_STEP6_CHAOS_ADVERSARIAL_CERTIFICATION_GREEN"
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "MONSTER_V8_STEP6_CHAOS_ADVERSARIAL_CERTIFICATION_MERGED_MAIN_GREEN"
            echo "MONSTER_V8_STEP6_CHAOS_ADVERSARIAL_CERTIFICATION_FROZEN"
          else
            echo "MONSTER_V8_STEP6_CHAOS_ADVERSARIAL_CERTIFICATION_EXACT_HEAD_GREEN"
          fi
