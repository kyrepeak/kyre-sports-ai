name: CFB Game Total V162 Router V158 permanent freeze

on:
  workflow_dispatch:
  push:
    branches: [freeze/cfb-game-total-v162-v158-production-214]

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze scope guard
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          expected={
              ".github/workflows/cfb-game-total-v162-permanent-freeze-v3.yml",
              "cfb_game_total_v162_freeze_manifest_v3.json",
              "devsystem/task_ledgers/cfb-game-total-v162-permanent-freeze-v3.json",
          }
          if changed != expected:
              raise SystemExit("V162/V158 freeze branch changed active code: " + str(sorted(changed)))
          print("CFB_GAME_TOTAL_V162_V158_FREEZE_SCOPE=PASS")
          PY

      - name: Verify permanent-freeze metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v162_freeze_manifest_v3.json").read_text())
          assert m["version"] == 3
          assert m["baseline_commit"] == "0d6bad657654be3a355ba4e1bba973355b356e90"
          assert m["repair_pr"] == 578
          assert m["devsystem_pr_run"] == 991
          assert m["production_verification_run"] == 214
          assert m["browser_certification_run"] == 31
          c=m["contract"]
          assert c["active_page"] == "cfb_game_total_clean_page_v13"
          assert c["active_router"] == "streamlit_memory_lazy_router_v158"
          assert c["production_heartbeat"] == "CFB_GAME_TOTAL_V162_PRODUCTION_ACTIVE"
          assert c["legacy_v161_heartbeat"] == "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"
          assert c["fresh_page_cache_boundary"] is True
          assert c["same_route_stale_module_regression_fixed"] is True
          assert c["projection_math_changed"] is False
          assert c["distribution_math_changed"] is False
          assert c["step12_qualification_changed"] is False
          assert c["top5_ranking_changed"] is False
          assert c["api_model_behavior_changed"] is False
          assert c["sportsbook_projection_influence"] == 0.0
          assert c["browser_visual_certified"] is True
          assert c["production_streamlit_freshness_certified"] is True
          assert c["render_api_certified"] is True
          assert c["future_changes_must_be_additive"] is True
          assert c["permanently_frozen"] is True
          print("CFB_GAME_TOTAL_V162_V158_FREEZE_METADATA=PASS")
          PY

      - name: Verify every frozen blob exactly
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path("cfb_game_total_v162_freeze_manifest_v3.json").read_text())
          failures=[]
          for path, expected in m["exact_blobs"].items():
              actual=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"], text=True).strip()
              if actual != expected:
                  failures.append(f"{path}: expected {expected}, got {actual}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("CFB_GAME_TOTAL_V162_V158_EXACT_BLOBS=PASS", len(m["exact_blobs"]))
          PY

      - name: Enforce frozen boundaries and route firewall
        run: |
          python - <<'PY'
          from pathlib import Path

          page12=Path("cfb_game_total_clean_page_v12.py").read_text(encoding="utf-8")
          page13=Path("cfb_game_total_clean_page_v13.py").read_text(encoding="utf-8")
          router=Path("streamlit_memory_lazy_router_v158.py").read_text(encoding="utf-8")
          test=Path("tests/test_cfb_game_total_v162_cache_boundary.py").read_text(encoding="utf-8")
          browser=Path("devsystem/cfb_game_total_browser_qa_v3.py").read_text(encoding="utf-8")
          production=Path("devsystem/production_verify_v3.py").read_text(encoding="utf-8")
          app=Path("app.py").read_text(encoding="utf-8")

          required={
              "page12": (page12, [
                  'FROZEN_PRESENTATION = "cfb_game_total_clean_page_v11"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
                  'MAY_MODIFY_PROJECTION = False',
              ]),
              "page13": (page13, [
                  'FROZEN_PRESENTATION = "cfb_game_total_clean_page_v12"',
                  'ACTIVE_MARKER = "CFB GAME TOTAL • CLEAN PAGE V162 ACTIVE"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
                  'MAY_MODIFY_PROJECTION = False',
              ]),
              "router": (router, [
                  'FROZEN_ROUTER = "streamlit_memory_lazy_router_v157"',
                  'PRODUCTION_HEARTBEAT = "CFB_GAME_TOTAL_V162_PRODUCTION_ACTIVE"',
                  'LEGACY_V161_HEARTBEAT = "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"',
                  'ACTIVE_PAGE = "cfb_game_total_clean_page_v13"',
                  'GAME_TOTAL_PAGE_PREFIX = "cfb_game_total_clean_page_"',
                  'SPORTSBOOK_PROJECTION_INFLUENCE = 0.0',
                  'MAY_MODIFY_PROJECTION = False',
                  'sys.modules.pop(name, None)',
                  'importlib.invalidate_caches()',
              ]),
              "test": (test, [
                  'test_v162_router_unconditionally_evicts_cached_game_total_page_modules',
                  'test_v162_router_uses_new_page_and_preserves_v161_browser_heartbeat',
                  'test_app_activates_router_v158',
              ]),
              "browser": (browser, [
                  'PRODUCTION_HEARTBEAT = "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"',
                  '"CFB OVER / UNDER • MONSTER DASHBOARD"',
              ]),
              "production": (production, [
                  'EXPECTED_ROUTER = "streamlit_memory_lazy_router_v157"',
                  'GAME_TOTAL_REQUIRED_HEARTBEAT = "CFB_GAME_TOTAL_V161_PRODUCTION_ACTIVE"',
              ]),
              "app": (app, [
                  'CFB Game Total V162 activation',
                  'from streamlit_memory_lazy_router_v158 import record_bootstrap_import_ms, render_app',
                  'from streamlit_memory_lazy_router_v157 import record_bootstrap_import_ms, render_app',
                  'Sportsbook projection influence stays 0.0%',
              ]),
          }
          for label, (source, tokens) in required.items():
              for token in tokens:
                  if token not in source:
                      raise SystemExit(f"missing frozen {label} marker: {token}")
          print("CFB_GAME_TOTAL_V162_V158_ROUTE_FIREWALL=PASS")
          PY

      - name: Compile frozen V162 V158 surface
        run: |
          python -m py_compile \
            app.py \
            cfb_game_total_clean_page_v12.py \
            cfb_game_total_clean_page_v13.py \
            streamlit_memory_lazy_router_v158.py \
            tests/test_cfb_game_total_v162_cache_boundary.py \
            devsystem/cfb_game_total_browser_qa_v3.py \
            devsystem/production_verify_v3.py

      - name: Certification marker
        run: echo "CFB_GAME_TOTAL_V162_V158_PERMANENT_FREEZE_GREEN"
