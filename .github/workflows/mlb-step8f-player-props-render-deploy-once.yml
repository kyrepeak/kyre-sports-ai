name: MLB Step8F player-props Render deploy one-shot

on:
  push:
    branches:
      - mlb-step8f-player-prop-presentation-integration
    paths:
      - .github/workflows/mlb-step8f-player-props-render-deploy-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: srv-da84q6ifngtc73bdbm6g
  RELEASE_SHA: 2812010d0ae41eb8f8b01338bfc017fb94e602de
  ROLLBACK_SHA: 5251c26b8f70fc2464173eb1f8ffedbe1d424449
  PRODUCTION_URL: https://kyre-sports-api.onrender.com

jobs:
  deploy-certified-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deploy dependency
        run: python -m pip install --disable-pip-version-check -q httpx

      - name: Deploy exact certified SHA with rollback-on-smoke-failure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          python - <<'PY'
          from __future__ import annotations
          import json, os, time
          from pathlib import Path
          import httpx

          API = 'https://api.render.com'
          service_id = os.environ['RENDER_SERVICE_ID']
          release_sha = os.environ['RELEASE_SHA']
          rollback_sha = os.environ['ROLLBACK_SHA']
          production = os.environ['PRODUCTION_URL'].rstrip('/')
          token = os.environ['RENDER_API_KEY']
          headers = {
              'Accept': 'application/json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'KyreSportsMLBStep8FDeploy/1.0',
          }
          evidence = {
              'release_sha': release_sha,
              'rollback_sha': rollback_sha,
              'service_id': service_id,
              'production_url': production,
              'auto_deploy_preserved': False,
              'free_plan_preserved': False,
              'rollback_triggered': False,
              'render_api_key_returned': False,
          }

          def req(client, method, path, *, params=None, body=None, allowed=(200,)):
              response = client.request(method, API + path, params=params, json=body, headers=headers)
              if response.status_code not in allowed:
                  raise RuntimeError(f'Render API {method} {path} HTTP {response.status_code}: {response.text[:800]}')
              return response.json() if response.content else None

          def unwrap_deploy(row):
              if isinstance(row, dict) and isinstance(row.get('deploy'), dict):
                  return row['deploy']
              return row if isinstance(row, dict) else {}

          def deploy_commit(client, sha):
              doc = req(
                  client,
                  'POST',
                  f'/v1/services/{service_id}/deploys',
                  body={'commitId': sha, 'clearCache': 'do_not_clear'},
                  allowed=(201, 202),
              )
              row = unwrap_deploy(doc)
              deploy_id = str(row.get('id') or '').strip()
              if not deploy_id:
                  raise RuntimeError('Render deploy response did not contain deploy id')
              return deploy_id

          def wait_for_deploy(client, deploy_id, sha, max_polls=150):
              terminal_fail = {'build_failed','update_failed','canceled','cancelled','pre_deploy_failed'}
              for _ in range(max_polls):
                  doc = req(client, 'GET', f'/v1/services/{service_id}/deploys', params={'limit': 20})
                  rows = doc if isinstance(doc, list) else []
                  found = None
                  for raw in rows:
                      row = unwrap_deploy(raw)
                      if str(row.get('id') or '') == deploy_id:
                          found = row
                          break
                  if found is None:
                      time.sleep(4)
                      continue
                  status = str(found.get('status') or '').strip().casefold()
                  commit = found.get('commit') if isinstance(found.get('commit'), dict) else {}
                  commit_id = str(found.get('commitId') or commit.get('id') or commit.get('sha') or '').strip()
                  if status == 'live':
                      if commit_id and commit_id != sha:
                          raise RuntimeError(f'Render live deploy commit mismatch: {commit_id} != {sha}')
                      return found
                  if status in terminal_fail:
                      raise RuntimeError(f'Render deploy {deploy_id} failed with status {status}')
                  time.sleep(4)
              raise RuntimeError(f'Render deploy {deploy_id} did not reach live state')

          def smoke():
              with httpx.Client(timeout=45.0, follow_redirects=False) as client:
                  health = client.get(production + '/health', headers={'Accept':'application/json','User-Agent':'KyreSportsMLBStep8FSmoke/1.0'})
                  if health.status_code != 200:
                      raise RuntimeError(f'health HTTP {health.status_code}: {health.text[:500]}')

                  odds_r = client.get(
                      production + '/api/v1/mlb/odds',
                      params={'max_events': 4, 'fully_priced_only': 'false'},
                      headers={'Accept':'application/json','User-Agent':'KyreSportsMLBStep8FSmoke/1.0','Cache-Control':'no-cache'},
                  )
                  if odds_r.status_code != 200:
                      raise RuntimeError(f'odds HTTP {odds_r.status_code}: {odds_r.text[:500]}')
                  odds = odds_r.json()
                  if odds.get('data_type') != 'mlb_live_odds_api_response_v1' or odds.get('source') != 'FanDuel':
                      raise RuntimeError('existing MLB odds contract drift after deploy')

                  props_r = client.get(
                      production + '/api/v1/mlb/player-props',
                      params={'max_events': 4},
                      headers={'Accept':'application/json','User-Agent':'KyreSportsMLBStep8FSmoke/1.0','Cache-Control':'no-cache'},
                  )
                  if props_r.status_code != 200:
                      raise RuntimeError(f'player-props HTTP {props_r.status_code}: {props_r.text[:500]}')
                  props = props_r.json()
                  if props.get('data_type') != 'mlb_player_prop_api_response_v1':
                      raise RuntimeError('player-props data_type drift')
                  if props.get('source') != 'FanDuel':
                      raise RuntimeError('player-props source drift')
                  if props.get('transport') != 'anonymous_public_get_only' or props.get('http_methods') != ['GET']:
                      raise RuntimeError('player-props read-only transport drift')
                  if props.get('player_name_matching_used') is not False or props.get('fuzzy_matching_used') is not False:
                      raise RuntimeError('player-props identity matching contract drift')
                  if int(props.get('matched_game_count') or 0) <= 0:
                      raise RuntimeError('player-props live smoke found no reconciled MLB games')
                  rows = props.get('props') or []
                  if not isinstance(rows, list):
                      raise RuntimeError('player-props props is not a list')
                  if not rows:
                      unavailable = props.get('contract_unavailable_market_counts') or {}
                      if sum(int(v or 0) for v in unavailable.values()) <= 0:
                          raise RuntimeError('empty player-props slate without explicit contract-unavailable evidence')
                  return {
                      'health_http': health.status_code,
                      'odds_http': odds_r.status_code,
                      'odds_game_count': odds.get('game_count'),
                      'player_props_http': props_r.status_code,
                      'matched_game_count': props.get('matched_game_count'),
                      'prop_count': props.get('prop_count'),
                      'contract_unavailable_market_counts': props.get('contract_unavailable_market_counts'),
                      'player_name_matching_used': props.get('player_name_matching_used'),
                      'fuzzy_matching_used': props.get('fuzzy_matching_used'),
                  }

          with httpx.Client(timeout=30.0, follow_redirects=False) as render:
              service = req(render, 'GET', f'/v1/services/{service_id}')
              details = service.get('serviceDetails') if isinstance(service.get('serviceDetails'), dict) else {}
              if service.get('name') != 'kyre-sports-api':
                  raise RuntimeError('unexpected Render service name')
              if service.get('repo') != 'https://github.com/kyrepeak/kyre-sports-ai':
                  raise RuntimeError('unexpected Render repository')
              if str(service.get('autoDeploy') or '').casefold() != 'no':
                  raise RuntimeError('Render autoDeploy must remain no before deploy')
              if str(details.get('plan') or '').casefold() != 'free':
                  raise RuntimeError('Render service is not on free plan')
              evidence['auto_deploy_preserved'] = True
              evidence['free_plan_preserved'] = True

              deploy_id = deploy_commit(render, release_sha)
              evidence['deploy_id'] = deploy_id
              try:
                  live = wait_for_deploy(render, deploy_id, release_sha)
                  evidence['deploy_status'] = live.get('status')
                  evidence['smoke'] = smoke()
                  service_after = req(render, 'GET', f'/v1/services/{service_id}')
                  details_after = service_after.get('serviceDetails') if isinstance(service_after.get('serviceDetails'), dict) else {}
                  if str(service_after.get('autoDeploy') or '').casefold() != 'no':
                      raise RuntimeError('Render autoDeploy changed after deploy')
                  if str(details_after.get('plan') or '').casefold() != 'free':
                      raise RuntimeError('Render plan changed after deploy')
                  evidence['result'] = 'GREEN'
              except Exception as primary:
                  evidence['primary_failure'] = f'{type(primary).__name__}:{primary}'
                  evidence['rollback_triggered'] = True
                  rollback_id = deploy_commit(render, rollback_sha)
                  evidence['rollback_deploy_id'] = rollback_id
                  rollback_live = wait_for_deploy(render, rollback_id, rollback_sha)
                  evidence['rollback_status'] = rollback_live.get('status')
                  raise
              finally:
                  safe = json.dumps(evidence, indent=2, sort_keys=True, default=str) + '\n'
                  if token in safe:
                      raise RuntimeError('secret leakage detected in deploy evidence')
                  Path('mlb-step8f-render-deploy.json').write_text(safe, encoding='utf-8')
                  print(safe)
          print('MLB_STEP8F_PLAYER_PROPS_RENDER_DEPLOY_GREEN')
          PY

      - name: Upload sanitized deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step8f-render-deploy-${{ github.run_id }}
          path: mlb-step8f-render-deploy.json
          if-no-files-found: ignore
          retention-days: 7
