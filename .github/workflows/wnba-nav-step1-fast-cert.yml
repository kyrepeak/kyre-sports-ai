name: WNBA Navigation V2 Step 1 Fast Cert

on:
  push:
    branches:
      - feature/wnba-navigation-v2-step1-foundation
    paths:
      - "wnba_pra_navigation_v2_step1.py"
      - "streamlit_memory_lazy_router_wnba_nav_v2_step1.py"
      - "tests/test_wnba_pra_navigation_v2_step1.py"
      - "devsystem/wnba_nav_step1_fast_cert.py"
      - ".github/workflows/wnba-nav-step1-fast-cert.yml"
      - "app.py"
  pull_request:
    paths:
      - "wnba_pra_navigation_v2_step1.py"
      - "streamlit_memory_lazy_router_wnba_nav_v2_step1.py"
      - "tests/test_wnba_pra_navigation_v2_step1.py"
      - "devsystem/wnba_nav_step1_fast_cert.py"
      - ".github/workflows/wnba-nav-step1-fast-cert.yml"
      - "app.py"

permissions:
  contents: read

jobs:
  fast-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Certify WNBA Navigation Step 1
        run: python3 devsystem/wnba_nav_step1_fast_cert.py
