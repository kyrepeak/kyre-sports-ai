name: Universal Theme Step 3 Components

on:
  push:
    branches:
      - "monster/universal-theme-step3-components-v1"
    paths:
      - "kyre_universal_components_v1.py"
      - "prototypes/universal_theme_components_step3_v1.py"
      - "tests/test_universal_theme_components_step3_v1.py"
      - ".github/workflows/universal-theme-step3-components-v1.yml"

permissions:
  contents: read

jobs:
  targeted-universal-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove universal shared components only
        run: python tests/test_universal_theme_components_step3_v1.py
