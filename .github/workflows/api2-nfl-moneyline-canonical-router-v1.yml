name: API2 NFL Moneyline Canonical Router V1

on:
  pull_request:
    branches:
      - api2-main
    paths:
      - 'api2_universal_sports_router_registry_v1.py'
      - 'universal_runtime_v5_loader.py'
      - 'universal_runtime_v5_loader_v21.py'
      - 'nfl_moneyline_hub_v19.py'
      - 'tests/test_api2_nfl_moneyline_canonical_router_v1.py'
      - 'tests/test_nfl_moneyline_consumer_cleanup_v19.py'
      - 'tests/test_api2_step2e_universal_router_completion_v1.py'
      - '.github/workflows/api2-nfl-moneyline-canonical-router-v1.yml'

permissions:
  contents: read

jobs:
  nfl-moneyline-router-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile canonical route boundary
        run: |
          python -m py_compile \
            api2_universal_sports_router_registry_v1.py \
            universal_runtime_v5_loader.py \
            universal_runtime_v5_loader_v21.py \
            nfl_moneyline_hub_v19.py
      - name: Moneyline canonical ownership + V19 + Step 2E proof
        run: |
          python -m pytest -q --noconftest \
            tests/test_api2_nfl_moneyline_canonical_router_v1.py \
            tests/test_nfl_moneyline_consumer_cleanup_v19.py \
            tests/test_api2_step2e_universal_router_completion_v1.py
