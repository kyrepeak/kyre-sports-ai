name: MLB Step16E final production freeze certification

on:
  push:
    branches:
      - mlb-step16e-final-production-freeze
    paths:
      - sports_api/certification/mlb_step16e_final_production_freeze_evidence.json
      - sports_api/mlb_step16e_final_production_freeze_v1.py
      - sports_api/tools/mlb_step16e_final_production_freeze.py
      - tests/test_mlb_step16e_final_production_freeze_v1.py
      - .github/workflows/mlb-step16e-final-production-freeze-cert.yml
  pull_request:
    branches: [main]
    paths:
      - sports_api/certification/mlb_step16e_final_production_freeze_evidence.json
      - sports_api/mlb_step16e_final_production_freeze_v1.py
      - sports_api/tools/mlb_step16e_final_production_freeze.py
      - tests/test_mlb_step16e_final_production_freeze_v1.py
      - .github/workflows/mlb-step16e-final-production-freeze-cert.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP16E_BASE_SHA: 4261c872cc94c55a466b7e1bb9d80e62abdc95c8
  STEP16A_FROZEN_SHA: c5ad6047224aaf014cec13f5efa6e5cd650da939
  MLB_PRODUCTION_RUNTIME_ENABLED: "false"
  MLB_PRODUCTION_SCHEDULER_ENABLED: "false"
  MLB_ACTIONABLE_OUTPUT_ENABLED: "false"
  MLB_WAGERING_ENABLED: "false"
  MLB_SUPABASE_REST_WRITE_ENABLED: "false"
  MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED: "false"
  MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED: "false"
  MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED: "false"
  MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED: "false"
  MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED: "false"
  MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED: "false"
  MLB_STEP14B_DATABASE_READ_ENABLED: "false"
  MLB_STEP14B_DATABASE_WRITE_ENABLED: "false"

jobs:
  certify-final-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact Step16E candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert final freeze is non-live and production remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false
          test "$MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED" = false
          test "$MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED" = false
          test "$MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED" = false
          test "$MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED" = false
          test "$MLB_STEP14C_DURABLE_RESTART_LEASE_ENABLED" = false
          test "$MLB_STEP14B_DATABASE_CHECKPOINT_ADAPTER_ENABLED" = false
          test "$MLB_STEP14B_DATABASE_READ_ENABLED" = false
          test "$MLB_STEP14B_DATABASE_WRITE_ENABLED" = false
          test -z "${KYRE_DATABASE_URL:-}"

      - name: Prove exact Step16D merge ancestry and five-file Step16E scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STEP16E_BASE_SHA" HEAD
          git diff --check "$STEP16E_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$STEP16E_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 5
          allowed='^(sports_api/certification/mlb_step16e_final_production_freeze_evidence.json|sports_api/mlb_step16e_final_production_freeze_v1.py|sports_api/tools/mlb_step16e_final_production_freeze.py|tests/test_mlb_step16e_final_production_freeze_v1.py|\.github/workflows/mlb-step16e-final-production-freeze-cert.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad"
          test -z "$(git diff --name-status "$STEP16E_BASE_SHA"...HEAD | awk '$1 == "D" {print}')"

      - name: Prove frozen runtime packaging persistence and model surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$STEP16E_BASE_SHA"...HEAD -- \
            sports_api/production.env.example \
            sports_api/Dockerfile \
            sports_api/main.py \
            sports_api/mlb_step16d_controlled_production_activation_v1.py \
            sports_api/mlb_step16c_live_postgresql_canary_v1.py \
            sports_api/mlb_step16b_production_lifecycle_v1.py \
            sports_api/mlb_step16b_packaging_lifecycle_contract_v1.py \
            sports_api/mlb_step16a_production_activation_contract_v1.py \
            sports_api/mlb_step15_final_live_persistence_release_freeze_v1.py \
            sports_api/mlb_step15b_live_adapter_transaction_smoke_v1.py \
            sports_api/mlb_step15a_live_postgresql_preflight_v1.py \
            sports_api/mlb_step14c_durable_restart_lease_v1.py \
            sports_api/mlb_step14b_database_checkpoint_adapter_v1.py \
            sports_api/mlb_step14a_persistence_contract_v1.py \
            sports_api/mlb_step13a_bounded_scheduler_v1.py \
            sports_api/mlb_step13b_runtime_supervisor_v1.py \
            sports_api/mlb_step13c_reliability_recovery_v1.py \
            sports_api/mlb_step12_final_runtime_freeze_v1.py \
            sports_api/mlb_step9_final_freeze_v1.py \
            sports_api/api/mlb.py app.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test and persistence dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements.txt
          python -m pip install --disable-pip-version-check -q pytest pandas streamlit requests
          python -m pip install --disable-pip-version-check -q -r sports_api/requirements-mlb-step14b-persistence.txt

      - name: Compile Step16E final freeze surface
        run: |
          python -m py_compile \
            sports_api/mlb_step16e_final_production_freeze_v1.py \
            sports_api/tools/mlb_step16e_final_production_freeze.py \
            tests/test_mlb_step16e_final_production_freeze_v1.py
          python -m json.tool sports_api/certification/mlb_step16e_final_production_freeze_evidence.json >/dev/null

      - name: Run Step16E targeted final-freeze guards
        run: python -m pytest -q tests/test_mlb_step16e_final_production_freeze_v1.py

      - name: Run frozen Step16D through Step16B guards
        run: |
          python -m pytest -q tests/test_mlb_step16d_controlled_production_activation_v1.py
          python -m pytest -q tests/test_mlb_step16c_live_postgresql_canary_v1.py
          python -m pytest -q tests/test_mlb_step16b_production_packaging_lifecycle_v1.py

      - name: Run frozen Step16A guards at exact certified parent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mlb-step16a-parent
          git worktree add --detach /tmp/mlb-step16a-parent "$STEP16A_FROZEN_SHA"
          (
            cd /tmp/mlb-step16a-parent
            PYTHONPATH=. python -m pytest -q tests/test_mlb_step16a_production_activation_contract_v1.py
          )
          git worktree remove /tmp/mlb-step16a-parent --force

      - name: Run current MLB regression excluding frozen Step16A snapshot guards
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for path in tests/test_mlb_*.py; do
            if [ "$path" != "tests/test_mlb_step16a_production_activation_contract_v1.py" ]; then
              files+=("$path")
            fi
          done
          test "${#files[@]}" -gt 0
          python -m pytest -q "${files[@]}"

      - name: Build static Step16E final-freeze certification
        env:
          KYRE_DATABASE_URL: ""
        run: PYTHONPATH=. python -m sports_api.tools.mlb_step16e_final_production_freeze

      - name: Upload Step16E final-freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-step16e-final-production-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: mlb-step16e-final-production-freeze-cert.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-assert final freeze performed zero live activation
        shell: bash
        run: |
          set -euo pipefail
          test "$MLB_PRODUCTION_RUNTIME_ENABLED" = false
          test "$MLB_PRODUCTION_SCHEDULER_ENABLED" = false
          test "$MLB_ACTIONABLE_OUTPUT_ENABLED" = false
          test "$MLB_WAGERING_ENABLED" = false
          test "$MLB_SUPABASE_REST_WRITE_ENABLED" = false
          test "$MLB_STEP16B_DURABLE_LIFECYCLE_ENABLED" = false
          test "$MLB_STEP16C_LIVE_POSTGRESQL_CANARY_ENABLED" = false
          test "$MLB_STEP16D_CONTROLLED_PRODUCTION_ACTIVATION_ENABLED" = false
          test "$MLB_STEP16E_FINAL_PRODUCTION_FREEZE_ENABLED" = false
          test -z "${KYRE_DATABASE_URL:-}"

      - name: Final marker
        run: echo MLB_STEP16E_FINAL_PRODUCTION_FREEZE_GREEN
