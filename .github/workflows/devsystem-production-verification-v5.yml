name: DevSystem production verification V5

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "streamlit_*.py"
      - "cfb_*.py"
      - "sports_api/**"
      - "data/**"
      - "requirements*.txt"
      - "devsystem/production_verify_v1.py"
      - "devsystem/production_verify_v2.py"
      - "devsystem/production_verify_v3.py"
      - "devsystem/production_verify_v4.py"
      - "devsystem/production_verify_v5.py"
      - "devsystem/production_identity_verify_v1.py"
      - "devsystem/production_targets_v1.json"
      - "tests/test_devsystem_production_verify_v1.py"
      - "tests/test_devsystem_production_verify_v2.py"
      - "tests/test_devsystem_production_verify_v3.py"
      - "tests/test_devsystem_production_verify_v4.py"
      - "tests/test_devsystem_production_verify_v5.py"
      - ".github/workflows/devsystem-production-verification-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsystem-production-main-v5
  cancel-in-progress: true

jobs:
  production-verification-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up production verifier Python
        id: browser-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency-free production preflight
        shell: bash
        run: |
          python -m py_compile \
            devsystem/production_verify_v1.py \
            devsystem/production_verify_v2.py \
            devsystem/production_verify_v3.py \
            devsystem/production_verify_v4.py \
            devsystem/production_verify_v5.py \
            devsystem/production_identity_verify_v1.py
          python - <<'PY'
          from pathlib import Path

          required_paths = [
              Path("devsystem/production_verify_v1.py"),
              Path("devsystem/production_verify_v2.py"),
              Path("devsystem/production_verify_v3.py"),
              Path("devsystem/production_verify_v4.py"),
              Path("devsystem/production_verify_v5.py"),
              Path("devsystem/production_identity_verify_v1.py"),
              Path("devsystem/production_targets_v1.json"),
              Path("tests/test_devsystem_production_verify_v5.py"),
          ]
          missing = [str(path) for path in required_paths if not path.is_file()]
          if missing:
              raise SystemExit("missing production verification files: " + ", ".join(missing))

          v5 = Path("devsystem/production_verify_v5.py").read_text(encoding="utf-8")
          required_contract = [
              'SUPERSEDES_VERIFIER = "devsystem.production_verify_v4"',
              'FROZEN_PRODUCTION_BASE = "devsystem.production_verify_v2"',
              'EVENT_QUERY_KEY = v4.EVENT_QUERY_KEY',
              'DATE_QUERY_KEY = v4.DATE_QUERY_KEY',
          ]
          absent = [token for token in required_contract if token not in v5]
          if absent:
              raise SystemExit("production V5 static contract missing: " + ", ".join(absent))

          workflow = Path(".github/workflows/devsystem-production-verification-v5.yml").read_text(encoding="utf-8")
          preflight_at = workflow.index("- name: Run dependency-free production preflight")
          browser_restore_at = workflow.index("- name: Restore shared Browser QA stack")
          if preflight_at >= browser_restore_at:
              raise SystemExit("cheap preflight must run before browser cache restore")

          print("DEVSYSTEM_PRODUCTION_V5_CHEAP_PREFLIGHT_GREEN")
          PY

      - name: Restore shared Browser QA stack
        id: browser-stack-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv-browser-qa
            ~/.cache/ms-playwright
          key: devsystem-browser-stack-${{ runner.os }}-py${{ steps.browser-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'devsystem/browser_tooling_v1.txt', 'devsystem/browser_cache_epoch_v1.txt') }}

      - name: Build shared Browser QA stack on cache miss
        if: steps.browser-stack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv-browser-qa
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
          .venv-browser-qa/bin/python -m pip install --disable-pip-version-check -q -r devsystem/browser_tooling_v1.txt
          .venv-browser-qa/bin/python -m playwright install chromium

      - name: Activate shared Browser QA virtualenv
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv-browser-qa/bin" >> "$GITHUB_PATH"

      - name: Self-test production verification V5 contract
        run: |
          python -m pytest -q \
            tests/test_devsystem_production_verify_v1.py \
            tests/test_devsystem_production_verify_v2.py \
            tests/test_devsystem_production_verify_v3.py \
            tests/test_devsystem_production_verify_v4.py \
            tests/test_devsystem_production_verify_v5.py \
            tests/test_devsystem_production_identity_verify_v1.py

      - name: Verify immutable Render production identity
        run: python devsystem/production_identity_verify_v1.py

      - name: Verify deployed Streamlit freshness and frame-aware V163 event persistence
        run: |
          python devsystem/production_verify_v5.py \
            --artifact-dir artifacts/production-verification-v5

      - name: Upload production V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsystem-production-verification-v5-${{ github.run_id }}
          path: artifacts/production-verification-v5
          if-no-files-found: warn
          retention-days: 7
