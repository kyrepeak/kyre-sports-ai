name: CFB Moneyline V148 branch bootstrap

on:
  push:
    branches:
      - monster-cfb-moneyline-refresh-v1
    paths:
      - .github/workflows/cfb-moneyline-v148-bootstrap.yml

permissions:
  contents: write

jobs:
  wire-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monster-cfb-moneyline-refresh-v1
          fetch-depth: 0

      - name: Advance only the app bootstrap from V147 to V148
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          source = path.read_text(encoding="utf-8")

          old_heartbeat = 'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V147_NFL_RECEIVING_YARDS_FUTURE_CARD_RENDER_FIX_2026-09-16"'
          new_heartbeat = (
              'FROZEN_V147_DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V147_NFL_RECEIVING_YARDS_FUTURE_CARD_RENDER_FIX_2026-09-16"\n'
              'DEPLOYMENT_HEARTBEAT = "STREAMLIT_MAIN_V148_CFB_MONEYLINE_MONSTER_DASHBOARD_2026-09-16"'
          )
          old_import = 'from streamlit_memory_lazy_router_v147 import record_bootstrap_import_ms, render_app'
          new_import = 'from streamlit_memory_lazy_router_v148 import record_bootstrap_import_ms, render_app'

          if "STREAMLIT_MAIN_V148_CFB_MONEYLINE_MONSTER_DASHBOARD_2026-09-16" in source:
              raise SystemExit(0)
          if source.count(old_heartbeat) != 1:
              raise SystemExit(f"expected exactly one V147 heartbeat, found {source.count(old_heartbeat)}")
          if source.count(old_import) != 1:
              raise SystemExit(f"expected exactly one V147 bootstrap import, found {source.count(old_import)}")

          source = source.replace(old_heartbeat, new_heartbeat, 1)
          source = source.replace(old_import, new_import, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit exact bootstrap change
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "feat: activate CFB Moneyline Router V148"
          git push origin HEAD:monster-cfb-moneyline-refresh-v1
