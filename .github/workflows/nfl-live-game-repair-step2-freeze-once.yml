name: NFL Live Game Repair Step 2 Registry Freeze Once

on:
  push:
    branches: [monster-frozen-artifact-registry]
    paths:
      - ".github/workflows/nfl-live-game-repair-step2-freeze-once.yml"

permissions:
  contents: write

concurrency:
  group: nfl-live-game-repair-step2-registry-freeze-once
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact registry transaction identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:devsystem/frozen_artifact_registry_state_v1.json)" = "09aa8c0dbdafb307612c96f67f677fce8735df9e"

      - name: CAS revision 123 to 124 and freeze Step 2
        shell: bash
        env:
          REGISTRY: devsystem/frozen_artifact_registry_state_v1.json
          WORKFLOW: .github/workflows/nfl-live-game-repair-step2-freeze-once.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("devsystem/frozen_artifact_registry_state_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          expected_hash = "54640387bbee39bcc984072346d10b09b66c90310c898f54393b626639dc0965"
          expected_source = "997539f1904676aa7db11c7bcd7b5f16e1638926"
          merge_sha = "d5392c2bc38b59dd28e1ca8d08c6a32c29289dd2"
          checkpoint = "NFL_LIVE_GAME_REPAIR_STEP2_IDENTITY_BRIDGE"

          def state_hash(value):
              body = dict(value)
              body.pop("state_hash", None)
              canonical = json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          assert payload["schema_version"] == 1
          assert payload["version"] == "MONSTER_V4_FROZEN_ARTIFACT_REGISTRY_V1"
          assert payload["registry_ref"] == "refs/heads/monster-frozen-artifact-registry"
          assert payload["registry_path"] == "devsystem/frozen_artifact_registry_state_v1.json"
          assert payload["revision"] == 123, payload["revision"]
          assert payload["source_main_sha"] == expected_source, payload["source_main_sha"]
          assert payload["state_hash"] == expected_hash, payload["state_hash"]
          assert state_hash(payload) == expected_hash
          assert payload.get("active_thaws") == [], payload.get("active_thaws")
          assert checkpoint not in payload["entries"]
          assert "NFL_LIVE_GAME_REPAIR_STEP1_ROOT_CAUSE" in payload["entries"]
          assert payload["entries"]["NFL_LIVE_GAME_REPAIR_STEP1_ROOT_CAUSE"]["status"] == "FROZEN"

          payload["entries"][checkpoint] = {
              "status": "FROZEN",
              "checkpoint_id": checkpoint,
              "source_main_sha": merge_sha,
              "proven_merge_sha": merge_sha,
              "pr_number": 1387,
              "pr_head_sha": "6fab6acaed71df37d4c031af3bd8af288df8b804",
              "pre_pr_focused_proof_run_id": 37248783729,
              "pr_focused_proof_run_id": 37248832622,
              "pr_devsystem_proof_run_id": 37248832619,
              "pr_identity_regression_run_id": 37248832582,
              "merged_main_focused_proof_run_id": 37249195955,
              "merged_main_quarantine_run_id": 37249196023,
              "proof_run_id": 37249196074,
              "regression_debt_state": "CLEARED",
              "proof_kind": "MERGED_MAIN_LIVE_IDENTITY_BRIDGE",
              "shared_gate": "nfl_prop_app_eligibility_v1.py",
              "rushing_owner": "nfl_rushing_yards_hub_v16",
              "receiving_owner": "nfl_receiving_yards_hub_v17",
              "live_market_state": "CLOSED",
              "live_prop_gate_open": False,
              "live_identity_state": "LIVE",
              "live_identity_gate_open": True,
              "exact_event_identity_required": True,
              "exact_team_identity_required": True,
              "current_roster_athlete_id_required": True,
              "final_post_fail_closed": True,
              "page_specific_patch_required": False,
              "rushing_page_mutated": False,
              "receiving_page_mutated": False,
              "passing_behavior_mutated": False,
              "projection_mutated": False,
              "probability_mutated": False,
              "ranking_mutated": False,
              "sportsbook_mutated": False,
              "product_mutation": True,
              "api2_used": False,
              "tdd": {
                  "discarded_bootstrap_run_id": 37248363504,
                  "valid_red_run_id": 37248495693,
                  "green_pre_pr_run_id": 37248783729,
                  "duplicate_manual_reruns": 0
              },
              "artifacts": {
                  "nfl_prop_app_eligibility_v1.py": "01d8b0039e270b03d5f96fa4ac17f542f360a610",
                  "devsystem/nfl_live_game_repair_step2_identity_bridge_v1.py": "71681a51075349f1c3c9cb877a50167c58407ab1",
                  "tests/test_nfl_live_game_repair_step2_identity_bridge_v1.py": "8f1c8d5b149766d93442bb54fd59c824c21526c3",
                  "devsystem/task_ledgers/nfl-live-game-repair-step2-identity-bridge-v1.json": "4ab9629b23764c2736fc0b0c23ed9358f574d882",
                  ".github/workflows/nfl-live-game-repair-step2-identity-bridge-v1.yml": "3228092112e9bfb6e8ac31c6c3eda8379c77a8ca"
              }
          }
          payload["revision"] = 124
          payload["source_main_sha"] = merge_sha
          payload["state_hash"] = state_hash(payload)

          assert payload["revision"] == 124
          assert payload["source_main_sha"] == merge_sha
          assert payload["active_thaws"] == []
          assert payload["entries"][checkpoint]["status"] == "FROZEN"
          assert payload["entries"][checkpoint]["live_prop_gate_open"] is False
          assert payload["entries"][checkpoint]["live_identity_gate_open"] is True
          assert state_hash(payload) == payload["state_hash"]

          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("NFL_LIVE_GAME_REPAIR_STEP2_REGISTRY_CAS_GREEN")
          print("revision=124")
          print("state_hash=" + payload["state_hash"])
          PY

          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY" "$WORKFLOW"
          git diff --cached --check
          git commit -m "Freeze NFL live-game repair Step 2 identity bridge"
          git push origin HEAD:monster-frozen-artifact-registry
