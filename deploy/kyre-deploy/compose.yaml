services:
  kyre-sports-api:
    build:
      context: ../..
      dockerfile: sports_api/Dockerfile
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: ${KYRE_API_WEB_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)); raise SystemExit(0 if d.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  kyre-streamlit:
    build:
      context: ../..
      dockerfile: deploy/kyre-deploy/streamlit.Dockerfile
    environment:
      PORT: "8501"
      KYRE_SPORTS_API_BASE_URL: ${KYRE_SPORTS_API_BASE_URL:-http://kyre-sports-api:8000}
    ports:
      - "8501:8501"
    depends_on:
      kyre-sports-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/deploy/kyre-deploy/streamlit-healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
